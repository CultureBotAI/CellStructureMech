  sections:
  - schema
  summary: Make record provenance required rather than recommended, and evidence trait links
  details: 'Schema hardening: definition, definition_source and structure_kind become required
    on CellStructureRecord; definition_source gains a pattern so it must be a CURIE or a URL
    rather than free text; TraitLink.evidence and CurationEvent.changes become required. scripts/new_record.py
    now requires the corresponding flags instead of silently scaffolding a record without
    provenance, and record_curation_event requires a changes string. Applying the stricter
    schema to the corpus exposed two records whose trait links carried no evidence (magnetosome,
    carboxysome); both now cite the review already backing the record. Workflows are pinned
    to commit SHAs and the failure artifact is named per matrix leg, so the 3.10 and 3.12
    jobs no longer collide on upload.'
