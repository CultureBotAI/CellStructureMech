  summary: Added Caulobacter stalk crossband record
  details: Created an evidence-backed stalk crossband record minted under cellstructuremech:stalk_crossband
    because GO lacks an exact stalk crossband cellular-component term. The record captures
    StpA/StpB/StpC/StpD as the protein cohort building the Caulobacter crossband, links the
