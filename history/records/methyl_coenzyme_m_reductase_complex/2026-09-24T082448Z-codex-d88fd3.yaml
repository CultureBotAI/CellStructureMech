  summary: Add methyl coenzyme M reductase complex
  details: Created GO:0044674 as an ENERGY_COMPLEX record for the archaeal alpha2 beta2 gamma2
    methyl coenzyme M reductase complex. Added the direct GO transferase-complex parent, exact
    InterPro family groundings for the McrA, McrB, and McrG subunits, PDB:1MRO evidence tying
    those components to Methanothermobacter marburgensis str. Marburg polymer entities, a
    Methanothermobacter canonical example, coenzyme-B sulfoethylthiotransferase activity evidence
    from GO and InterPro, and a compact nonmechanistic graph for the net methane-forming reaction.
    Verified with targeted LinkML and closed-schema validation before writing this history
    entry.
