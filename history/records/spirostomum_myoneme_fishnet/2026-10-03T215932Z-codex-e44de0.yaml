    infraciliary lattice or stalk spasmoneme. Whole-repository hidden/ignored-inclusive name,
    alias, DOI and PMID searches found no matching record. Exact QuickGO myoneme, spasmoneme,
    Spirostomum and fishnet searches returned no hits; verified GO:0005622 parent and GO:0030863
    parthood. ENA verifies S. minus NCBITaxon:402029 and S. ambiguum NCBITaxon:37688. InterPro
    spasmin/GSBP searches returned HTTP204; IPR050145 and IPR052270 are broader than the curated
    component classes. Read primary 2023 DOI:10.1126/sciadv.add6550 Introduction, all relevant
    Results/Discussion, culture/species, MS, IP-MS, IF, Western and RNAi Methods, and Figures5-9
    legends; separately read all main prose of 2024 preprint PMC11581044.2 plus Figures1/3
    legends, not supplement Methods. Verified final 2026 DOI:10.1073/pnas.2601408123 PMID42213749
    at publisher/PubMed/EuropePMC; only abstract/significance are accessible and PMC13229174
