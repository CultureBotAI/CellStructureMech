  summary: Add evidence-backed bacterial aggresome record
  details: Created a PROPOSED bacterial aggresome record from Jin et al. 2021 and Pei et al.
    2025. Read PMC BioC full text and the White Rose accepted manuscript, including Figures
    5-6. Verified the inclusion-body parent, cytoplasm parthood, mRNA stabilization, three
    InterPro families, SO mRNA and MG1655 taxonomy. Kept protein-marker essentiality UNKNOWN,
    omitted taxonomic prevalence and unverified strain-specific protein mappings, and bounded
    the graph to selective RNase exclusion and RNA reuse. Whole-repository duplicate searches
    included hidden and ignored files; component-name matches were certificate-encoding false
    positives. Scaffolded and expanded through the guarded writer; derived-artifact and full
    QC validation follow before commit. No images or third-party manuscript content are hosted.
