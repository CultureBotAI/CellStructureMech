  summary: Add gas vesicle shell record
  details: Created a PROPOSED GO:0033172 gas vesicle shell record for the proteinaceous wall
    of gas vesicles. The record uses the exact GO cellular-component identity, links the shell
    part_of GO:0031411, adds GvpA and GvpC shell constituents, cites GvpA solid-state NMR
    and Dolichospermum cryo-ET structure evidence, records bacterial and archaeal taxonomic
    scope from Walsby 1994, and keeps transient accessory Gvp assembly factors on the enclosing
    gas vesicle record rather than duplicating them into the persistent shell.
