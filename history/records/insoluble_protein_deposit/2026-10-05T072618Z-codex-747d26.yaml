  summary: Add evidence-backed insoluble protein deposit (IPOD)
  details: Added one PROPOSED yeast IPOD inclusion after hidden/ignored-inclusive de-duplication
    and native GO identity checks. Primary 2008 identity/localization evidence and 2016 recruitment/turnover
    interventions support two component classes, reference-scoped Hsp104 metadata, two functions
    and two causal graphs with eleven source-local edges. Explicit boundaries separate PAS
    adjacency, upstream transport factors, unknown assembly essentiality, reporter-specific
    turnover and 2024 genotype-specific prion formation. Ingested unmodified PMC5045159.1
    Figure 3 after native licence, caption, actual-image and checksum checks. Scaffold and
    guarded writer validated the record; complete corpus gates follow before publication.
