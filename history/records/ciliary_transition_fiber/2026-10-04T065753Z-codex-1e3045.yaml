  summary: Add evidence-backed ciliary transition fiber record
  details: Added GO:0097539 with exact synonym scopes and basal-body parthood; curated TFK1,
    CEP164, RP2 and FBF1 from primary trypanosome localization studies DOI:10.1242/jcs.259893
    and DOI:10.1242/jcs.261692. Verified XRP2 and FBF1 InterPro families; retained TFK1 and
    CEP164 as reviewed label-only. Included only experimentally bounded TFK1 CC1 targeting
    and Y2H self-interaction, not an inferred causal bridge or complete fiber assembly. Preserved
    the YL1/2 antigen caution from DOI:10.1016/j.protis.2017.07.002. Linked visually inspected
    HAL figure without redistributing it. Model draft remains PROPOSED; no universal prevalence,
    stoichiometry, strain-mismatched protein examples or mammalian gating pathway asserted.
