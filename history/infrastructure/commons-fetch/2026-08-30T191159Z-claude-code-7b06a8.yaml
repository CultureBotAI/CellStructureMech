  summary: 'Adopt Wikimedia Commons as a source: a repeatable fetch script replaces four one-off
    pulls'
  details: 'scripts/fetch_commons_image.py reads licence, attribution and depicted taxon from
    the Commons API (extmetadata, structured-data P180 resolved through Wikidata P685), verifies
    the downloaded bytes against imageinfo.sha1, strips utm_ tracking parameters from the
    file URL, refuses an unmapped licence string rather than guessing, and writes the StructureImage
    through the validation gate with a CurationEvent. Non-hostable licences produce a link-only
    entry with no file. All three Commons images already in the corpus were regenerated by
    it and are byte-reproducible; the queue row moves from EVALUATING to ADOPTED. Two defects
    were caught during the work: the write gate rejected an empty licence_url for the public-domain
    CDC image (Commons omits LicenseUrl there, so the optional field is now absent rather
    than empty), and the HTML stripper left a space before punctuation in attribution strings.
    Both are covered by offline tests.'
