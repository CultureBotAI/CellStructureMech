  details: 'Three follow-ups from the gates merged in PRs 83 and 88. Issue 85: check_curies
    now also resolves DOIs cited in research notes, curation TSVs and docs, which is where
    a later reader looks to decide whether a source is still usable; 11 further DOIs came
    into scope and all resolve. Extraction skips documented identifier shapes such as 10.6019/EMPIAR-XXXXX,
    since notes describe the form of an identifier as often as they cite one. Adding the prose
    walk immediately reopened the vacuous-pass hole from issue 87, because a citation in research
    would have masked an empty data/structures; the empty-corpus guard is now evaluated before
    prose is merged, and the test written for 87 caught the regression. Issue 90: the trait
    check refuses when TraitMech''s published index falls below a floor of 400 entries against
    its current 477, because that index is a rendering artifact rather than a contract and
    a narrowed graph view would otherwise make real links here report as missing. Issue 71:
    the Commons credit is bounded again before it goes into image notes.'
