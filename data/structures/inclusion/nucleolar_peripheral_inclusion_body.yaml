      notes: Results on thermotolerance report reduced NuR recruitment; supplemental
        panels were not independently inspected.
- graph_id: recovery_clearance
  title: NuR clearance after acute heat stress
  graph_kind: DISASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Fission yeast shifted back to 25 C after acute 42 C treatment. Hsf1
    promoter regulation and Hsp104 deletion are separate interventions. Neither demonstrates
    direct binding of Hsf1 to the inclusion or that every regrowth effect is mediated
    only by NuRs.
  nodes:
