evidence:
- reference: GO:0140602
  notes: Active cellular-component identity and exact synonyms verified through native
    QuickGO. The definition cites PMID 33176152 and PMID 37128864 and includes both
    heat stress and starvation.
- reference: GO:0042405
  notes: QuickGO directly lists GO:0140602 as an is_a child of nuclear inclusion body;
    nucleus lists nuclear inclusion body as part_of.
- reference: DOI:10.1016/j.celrep.2020.108377
  notes: Gallardo et al. (2020), PMID 33176152. Full publisher-version PDF read from
    the Universidad Pablo de Olavide repository, https://hdl.handle.net/10433/22772.
    Main Results, Discussion, Methods and captions inspected; Figures 1-2 visually
    inspected. Supplemental materials and raw data were not independently inspected.
    CC BY-NC-ND 4.0 figures are not hosted.
- reference: DOI:10.3390/ijms241311202
  notes: Boronat et al. (2023), PMID 37446379, PMC10342647.1. Native JATS Results
    2.5, Discussion, Methods and Figure 7 caption read; figure pixels inspected. Native
    metadata confirms non-retracted CC BY 4.0 article. Supplemental panels were not
    independently inspected.
- reference: DOI:10.1242/jcs.260727
  notes: 'Hiraoka et al. (2023), PMID 37128864. Publisher Results around Figure 3
    and Discussion read: Cdc2, Cdc13 and Clp1 accumulate peripherally during stationary
    phase or glucose depletion, distinct from central Gar1/Gar2. This supports GO''s
    broader scope, not identical heat-stress composition or mechanism.'
discussions:
- discussion_id: identity_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep NuRs distinct from neighboring deposits and similarly abbreviated assemblies.
  rationale: Spatial similarity and a shared stress response are not exact structure
    identity.
  notes: GO:0140602 is retained rather than a local heat-only identity. No exact equivalence
    to PAC, INQ, amyloid bodies or nucleolar caps is asserted. The MTREC/NURS term
    on nuclear_exosome_focus is an unrelated RNA-surveillance assembly. Searches covered
    hidden and ignored files, excluding only .git; parsed identifiers, labels, synonyms
    and slugs of all 894 baseline records had no exact match.
  evidence:
  - reference: DOI:10.1016/j.celrep.2020.108377
    notes: Discussion proposes functional analogies while leaving the NuR seed and
      morphology unresolved.
  - reference: GO:0140602
    notes: Exact identity and synonym authority.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: component_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate sequestered cargo from intact complexes, central nucleolar markers
    and upstream regulators.
  rationale: Protein redistribution and perturbation phenotypes do not establish whole-complex
    membership.
  notes: Nup85 and Nup132 leave NPCs, but many NPC components remain; no intact NPC
    or Y-complex is modeled. Hsf1 is mostly excluded from NuRs and acts through stress-response
    regulation, so is not a component. Gar2, Nuc1 and Acr1 mark the central domain.
    Poly(A) RNA is reported nearby rather than assigned a fixed NuR subunit. Rho1.C17R
    and Guk1-9 are engineered cargo reporters. Hsp104 is resident clearance machinery,
    dispensable for assembly.
  evidence:
  - reference: DOI:10.1016/j.celrep.2020.108377
    notes: Main Results and Figures 1-4 establish these boundaries.
  - reference: DOI:10.3390/ijms241311202
    notes: Figure 7 separates reporter and chaperone readouts.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: grounding_and_inventory
  kind: CURATION_TODO
  status: OPEN
  prompt: Extend the component inventory and resolve exact Hsp104 and heterogeneous-cargo
    groundings where possible.
  rationale: The six-class core is not an exhaustive native composition or a fixed
    stoichiometry.
  notes: Native InterPro sets were checked for six reference proteins, with pagination
    exhausted. Four component families are grounded; Hsp104 and variable cargo retain
    REVIEWED_LABEL_ONLY. Additional resolved residents could be split out of the heterogeneous
    cargo class after exact family verification. No broad ClpA/B family, DnaJ domain,
    entire spliceosome or exosome is substituted for a narrower resident.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/O94641/?page_size=200
    notes: Eleven integrated matches, including broader ClpA/B families.
  - reference: DOI:10.1016/j.celrep.2020.108377
    notes: Main Results name additional recruited nuclear factors; this is a bounded
      curation core.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: condition_scope
  kind: INTERPRETATION
  status: OPEN
  prompt: Determine which composition and clearance mechanisms are shared between
    heat-induced and starvation-associated inclusions.
  rationale: GO groups inducing conditions, but this does not make experimental mechanisms
    interchangeable.
  notes: The starvation study describes peripheral localization and compares it with
    heat stress; proposed transcriptional inhibition remains a hypothesis. No starvation-specific
    assembly or disassembly edge is inferred from heat experiments. In budding yeast,
    joint Btn2/Hsp42 loss does not block the severe-heat reporter NuRs in the tested
    backgrounds, unlike the Mas5 phenotype in fission yeast.
  evidence:
  - reference: DOI:10.1242/jcs.260727
    notes: Figure 3 and Discussion distinguish observation from proposed function.
  - reference: DOI:10.3390/ijms241311202
    notes: Results 2.5 and Figure 7a compare the two yeast models.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: distribution_and_data
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve broader distribution, native-client datasets and physical properties
    with structure-specific evidence.
  rationale: Two yeast models do not establish fungal prevalence or universal condensate
    physics.
  notes: 'Taxonomic_distribution, associated_traits, complex_compositions, datasets,
    stoichiometry and physical_properties remain unasserted. Reduced FRAP mobility
    is not proof of a liquid or amyloid state; no geometric quantity is extracted
    from micrograph scale bars. The 2020 paper says no additional datasets were generated
    and data are available on request. The live iModulonDB adapter returned 28 datasets
    with neither yeast represented: not applicable, not negative evidence.'
  evidence:
  - reference: DOI:10.1016/j.celrep.2020.108377
    notes: Methods, data availability and Figure 3c set the measurement and data limits.
  - reference: DOI:10.3390/ijms241311202
    notes: Figure 7 and Methods 4.3 define the tested organism and preparation scope.
  posed_by: codex
  posed_date: '2026-10-05'
