- component_id: nuclear_cargo
  label: heterogeneous nuclear protein cargo
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Stress-sequestered material rather than a fixed complex. Heat-stressed fission
    yeast recruits Alm1, Nup211, Nup132, Pab2, Nab2 and several cell-cycle regulators,
    among other factors. Nup85 and Mex67 are resolved separately below. These proteins
    are not asserted to share a family or to be present under every inducing condition.
  evidence:
  - reference: DOI:10.1016/j.celrep.2020.108377
    notes: Results and Figures 1-2 distinguish relocated proteins from unaffected
      NPC proteins and the central Gar2-positive domain.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: A variable collection of nuclear cargo is not one sequence family
    or stoichiometric complex.
