functions:
- function_id: reversible_sequestration
  label: reversible sequestration of nuclear proteins
  description: Collects selected nuclear factors during acute heat stress. Nup85 and
    Mex67 show reduced mobility; recovery releases factors to their usual locations.
    Coordinated shutdown of nuclear activities and protection from damage are interpretations,
    not a proven NuR-specific causal pathway.
  evidence:
  - reference: DOI:10.1016/j.celrep.2020.108377
    notes: Figures 1-3 and Discussion support sequestration and release while distinguishing
      the proposed physiological model.
causal_graphs:
- graph_id: heat_induced_assembly
  title: NuR formation under acute heat stress
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Fission-yeast assays only. Gallardo uses 25-to-42 C shifts and Nup/NPC
    or mRNA-factor markers; Boronat uses 42 C for 15 minutes and misfolding reporters.
    Mas5 deletion effects are not transferred to budding-yeast Btn2/Hsp42 perturbations
    or to starvation.
  nodes:
  - node_id: heat
    label: Acute 42 C heat stress
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: nur
    label: nucleolar peripheral inclusion body
    node_type: STRUCTURE
    grounding: GO:0140602
  - node_id: mas5_loss
    label: mas5 deletion
    node_type: EXPERIMENTAL_FACTOR
  - node_id: preconditioning
    label: 37 C preconditioning for 45 minutes before 42 C stress
    node_type: EXPERIMENTAL_FACTOR
  edges:
  - subject: heat
    predicate: induces
    object: nur
    description: Acute heat causes the measured nuclear factors to accumulate in NuRs.
    evidence:
    - reference: DOI:10.1016/j.celrep.2020.108377
      notes: Figures 1 and 3a-b.
  - subject: mas5_loss
    predicate: blocks
    object: nur
    description: Mas5 loss blocks reporter-marked NuR assembly in the tested fission-yeast
      cells.
    evidence:
    - reference: DOI:10.3390/ijms241311202
      notes: Results 2.5 and Figure 7a-b.
  - subject: preconditioning
    predicate: suppresses
    object: nur
    description: Preconditioning largely prevents subsequent heat-induced NuR recruitment;
      residual Ssa2 signal means this is not an absolute block.
    evidence:
