  label: lipid-droplet surface compartmentalization
  description: The lipid-storage-body outer monolayer separates the hydrophobic storage-lipid
    core from the cytosol while exposing a surface for lipid-droplet proteins.
  evidence:
  - reference: GO:0005811
    notes: The GO lipid-droplet definition describes coalesced lipids surrounded by
      a phospholipid monolayer that may include associated proteins.
  - reference: PMID:29397034
