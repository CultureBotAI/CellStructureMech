discussions:
- discussion_id: exclude_lipid_droplet_surface_proteins
  prompt: Should lipid-droplet surface proteins be curated as components of the outer
    lipid monolayer record?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#surface_phospholipids
  - causal_graphs#lipid_droplet_outer_monolayer_topology
  rationale: GO:0034430 denotes the lipid monolayer surrounding a lipid storage body.
    Proteins associated with that surface can be curated on the lipid-droplet record
    or as exact complexes after grounding, but this record's component list is limited
    to the phospholipids that form the monolayer itself.
  evidence:
  - reference: GO:0034430
    notes: The GO term definition scopes GO:0034430 to the single phospholipid layer.
  - reference: PMID:29397034
    notes: Graef 2018 reviews distinct lipid and protein homeostasis roles on the
      budding-yeast lipid droplet.
  posed_by: codex
  posed_date: '2026-09-16'
- discussion_id: resolve_non_yeast_lipid_storage_body_monolayers
  prompt: Resolve oil-body, oleosome, spherosome, and plastoglobule monolayer boundaries
    before broadening this record beyond budding-yeast lipid droplets.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#lipid_droplet_outer_monolayer_topology
  rationale: This first pass imports GO synonymy for the generic lipid-storage-body
    outer monolayer but only curates Saccharomyces cerevisiae evidence. Plant/algal
    oil bodies, oleosomes, spherosomes, and the plastoglobule half-unit membrane need
    a separate boundary review before adding broader taxonomic rows or plastoglobule-specific
    component claims.
  evidence:
  - reference: GO:0034430
    notes: GO:0034430 lists oil-body, oleosome, and spherosome outer lipid monolayer
      exact synonyms on the generic lipid-storage-body monolayer term.
  - reference: DOI:10.1105/tpc.105.039859
    notes: Austin et al. 2006 resolved plastoglobules as lipid bodies surrounded by
      a half-unit membrane continuous with the thylakoid outer leaflet.
  posed_by: codex
  posed_date: '2026-09-16'
