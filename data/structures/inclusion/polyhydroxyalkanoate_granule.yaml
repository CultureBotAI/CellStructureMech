functions:
- function_id: carbon_reducing_power_storage
  label: carbon and reducing-power storage
  description: PHA granules store excess carbon and reducing equivalents as intracellular
    polyester inclusions that can be mobilized when external nutrients become limiting.
  evidence:
  - reference: DOI:10.3390/molecules29102293
    notes: Fukala and Kucera 2024 review PHAs as intracellular biopolymers used by
      microorganisms for energy and carbon storage.
