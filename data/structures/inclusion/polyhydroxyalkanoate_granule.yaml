discussions:
- discussion_id: exclude_phospholipid_monolayer
  prompt: Should a phospholipid monolayer be curated as a PHA granule component?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#pha_polymer_core
  rationale: GO:0070088 still mentions a phospholipid monolayer from the older structural
    model, but Bresan et al. 2016 reported that purified PHA granules contain PHA
    and protein and no detectable phospholipids, so the monolayer is deliberately
    not curated as a component.
  resolution_note: Leave phospholipids out of components and document the literature
    conflict here.
  evidence:
  - reference: DOI:10.1038/srep26612
  posed_by: claude
  posed_date: '2026-09-10'
  resolved_date: '2026-09-10'
- discussion_id: ground_generic_pha_granule_components
  prompt: Resolve exact broad groundings for PHA polymer cores, PHA synthases and
    phasins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#pha_polymer_core
  - components#pha_synthases
  - components#phasins
  rationale: A curated ChEBI match was verified for poly(hydroxybutyrate), but the
    GO:0070088 record is broader than PHB; likewise, PHA synthase and phasin families
    are heterogeneous enough that exact family CURIEs need a separate InterPro/Pfam/NCBIfam
    pass.
  posed_by: claude
  posed_date: '2026-09-10'
