components:
- component_id: pha_polymer_core
  label: polyhydroxyalkanoate polymer core
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: CHEBI:53388 is exact for poly(hydroxybutyrate), a common PHB core
    polymer, but the GO:0070088 record covers PHA granules with multiple possible
    hydroxyalkanoate polymer chemistries.
  role: Hydrophobic polyester storage material that forms the granule core and stores
    carbon plus reducing power.
  evidence:
  - reference: DOI:10.1016/j.mcpro.2024.100765
    notes: Kelly et al. 2024 describe Pseudomonas putida PHA as a polymeric carbon-rich
      storage material sequestered in carbonosomes.
  - reference: DOI:10.1038/srep26612
    notes: Bresan et al. 2016 used fluorescent phospholipid-binding LactC2 probes
      in vivo, not a quantitative chemical-fraction analysis. Native producer granules
      lacked detectable probe labeling; rare labeling of isolated granules was interpreted
      as membrane contamination. Recombinant E. coli granules were a distinct context.
- component_id: pha_synthases
  label: PHA synthases
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  gene_symbols:
  - phaC
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PHA synthases are grouped by granule-associated polymerization
    role here; exact family groundings differ between short-chain and medium-chain-length
    PHA systems and were left for a dedicated family-level curation pass.
  role: Granule-associated polymerase enzymes that synthesize PHA polyester and remain
    attached to nascent granules.
  evidence:
  - reference: DOI:10.1128/JB.00779-12
    notes: Pfeiffer and Jendrossek 2012 localized PHB synthase PhaC1 to nascent and
      mature PHB granules in Cupriavidus necator H16.
  - reference: DOI:10.1016/j.mcpro.2024.100765
    notes: Kelly et al. 2024 describe PHA synthases among the broad classes of PHA
      granule-associated proteins.
