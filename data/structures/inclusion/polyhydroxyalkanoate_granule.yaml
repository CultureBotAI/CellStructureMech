identifier: GO:0070088
label: polyhydroxyalkanoate granule
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: A cytoplasmic prokaryotic inclusion body in which polyhydroxyalkanoate
  storage polymers condense with granule-associated proteins, including PHA synthases
  and phasins, to form hydrophobic carbon- and reducing-power storage granules.
definition_source: DOI:10.1016/j.mcpro.2024.100765
mapping_status: PROPOSED
