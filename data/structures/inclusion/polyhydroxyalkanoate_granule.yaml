    evidence:
    - reference: DOI:10.1128/JB.01723-08
      notes: Jendrossek 2009 summarizes PHA synthase-catalyzed PHA formation at granules.
  - subject: pha_polymer_core
    predicate: forms core of
    object: polyhydroxyalkanoate_granule
    description: The PHA polyester forms the hydrophobic storage core of the granule.
    evidence:
