- component_id: phasins
  label: phasins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Phasins are curated as a granule-surface protein class; no single
    InterPro, Pfam, or NCBIfam accession was chosen as exact for the heterogeneous
    phasins that decorate PHA granules across PHA-producing bacteria.
  role: Amphipathic granule-surface proteins that bind the PHA core and influence
    granule size, number and surface coverage. A formation requirement for the heterogeneous
    phasin class is not established here; changes in granule size or number are not
    failure to form granules.
  evidence:
  - reference: DOI:10.1128/JB.00779-12
    notes: Pfeiffer and Jendrossek 2012 localized multiple Cupriavidus necator H16
      phasins to PHB granules. Single phaP6 or phaP7 deletions did not visibly alter
      granule formation, but do not establish dispensability of all phasins.
  gene_symbols:
  - phaP1
  protein_examples:
