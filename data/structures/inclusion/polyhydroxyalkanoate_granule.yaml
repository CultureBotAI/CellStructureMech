discussions:
- discussion_id: exclude_phospholipid_monolayer
  prompt: Should a phospholipid monolayer be curated as a PHA granule component?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#pha_polymer_core
  rationale: 'GO:0070088 still mentions a phospholipid monolayer from the older structural
    model, but Bresan et al. 2016 reported that purified PHA granules contain PHA
    and protein and no detectable phospholipids, so the monolayer is deliberately
    not curated as a component. Correction (2026-10-16): the earlier experiment description
    above was inaccurate. Bresan et al. used phospholipid-binding fluorescent probes
    in vivo; rare labeling of isolated granules was attributed to contamination, not
    a bulk chemical composition measurement. The native-producer results and recombinant
    E. coli observations must be distinguished.'
  resolution_note: Do not add a universal phospholipid-monolayer component on this
    evidence. The decision is bounded to the tested native producer systems and probe
    sensitivity; it does not assert that phospholipids can never associate with any
    recombinant or isolated PHA granule.
  evidence:
  - reference: DOI:10.1038/srep26612
    notes: 'Bresan et al. 2016 Results: native producer in vivo LactC2 assays; isolated
      granules had less than 1% fluorescent particles, interpreted as contamination;
      recombinant E. coli granules sometimes labeled.'
  posed_by: claude
  posed_date: '2026-09-10'
  resolved_date: '2026-09-10'
