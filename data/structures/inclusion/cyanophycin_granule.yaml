identifier: cellstructuremech:cyanophycin_granule
label: cyanophycin granule
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: A bacterial storage inclusion in which insoluble cyanophycin polymer accumulates
  as cytoplasmic granules that store fixed nitrogen and carbon for later mobilization.
definition_source: DOI:10.5772/intechopen.77049
mapping_status: PROPOSED
