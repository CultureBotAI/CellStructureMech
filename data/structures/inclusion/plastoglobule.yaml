  - subject: plastoglobule_lipid_monolayer
    predicate: is continuous with
    object: thylakoid_membrane
    description: In the higher-plant chloroplasts examined by Austin et al. 2006,
      the plastoglobule half-unit membrane was continuous with the outer thylakoid
      leaflet.
    evidence:
    - reference: DOI:10.1105/tpc.105.039859
      notes: Austin et al. 2006 used electron tomography and freeze-fracture imaging
