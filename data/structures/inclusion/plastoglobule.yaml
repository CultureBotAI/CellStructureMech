components:
- component_id: plastoglobule_lipid_core
  label: plastoglobule lipid core
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0010287 lists non-polar lipids, prenylquinones, plastoquinone
    and tocopherols; no single source-neutral ChEBI identifier denotes that mixture.
    Carotenoids are discussed separately in the Rottet et al. 2015 review, not in
    this GO definition.
  role: Hydrophobic lipid-rich interior that stores neutral lipids and prenyl lipids
    inside the chloroplast plastoglobule.
  evidence:
  - reference: GO:0010287
    notes: GO:0010287 defines plastoglobules as lipoprotein particles rich in non-polar
      lipids and prenyl lipids.
  - reference: DOI:10.1016/j.bbabio.2015.02.002
    notes: Rottet, Besagni and Kessler 2015 review plastoglobules as thylakoid-associated
      lipid droplets involved in chloroplast lipid metabolism.
- component_id: plastoglobule_lipid_monolayer
  label: plastoglobule lipid monolayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Austin et al. 2006 resolved a half-unit lipid membrane continuous
    with the thylakoid outer leaflet in higher plants. Engel et al. 2015 observed
    apparently discontinuous Chlamydomonas plastoglobules with occasional punctate
    contacts, subject to tomogram resolution limits. GO:0034430 denotes a generic
    lipid-droplet monolayer, not a plastoglobule-specific boundary.
  role: Lipid boundary surrounding the plastoglobule core; permanent thylakoid continuity
    is a higher-plant observation, not established for the algal example.
  evidence:
  - reference: DOI:10.1105/tpc.105.039859
    notes: Austin et al. 2006 used electron tomography and freeze-fracture imaging
      of higher-plant chloroplasts to resolve a half-unit membrane continuous with
      the thylakoid outer leaflet.
  - reference: DOI:10.7554/eLife.04889
    notes: Engel et al. 2015 found Chlamydomonas plastoglobules apparently discontinuous
      from adjacent thylakoids, sometimes with punctate contacts; their tomograms
      did not resolve the two lipid-bilayer leaflets.
taxonomic_distribution:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  presence: COMMON
  note: Plastoglobules are present in the Chlamydomonas reinhardtii chloroplast and
    were resolved by in situ cryo-electron tomography.
  reference: DOI:10.7554/eLife.04889
canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Unicellular green alga whose native chloroplast architecture was imaged by
    cryo-focused ion beam milling and in situ cryo-electron tomography, revealing
    plastoglobules among thylakoid and pyrenoid subcompartments.
  reference: DOI:10.7554/eLife.04889
functions:
- function_id: thylakoid_lipid_remodeling
  label: thylakoid lipid remodeling
  description: Plastoglobules participate in chloroplast lipid metabolism and thylakoid
    remodeling. Exchange of lipid metabolites with thylakoids is a proposed model,
    not a directly established transport mechanism in the cited review or the Chlamydomonas
    example.
  evidence:
  - reference: DOI:10.1016/j.bbabio.2015.02.002
    notes: Rottet, Besagni and Kessler 2015 review evidence that plastoglobules participate
      in thylakoid lipid remodeling.
evidence:
- reference: GO:0010287
  notes: Gene Ontology cellular-component term for plastoglobule.
- reference: GO:0009570
  notes: Gene Ontology cellular-component term for chloroplast stroma, the immediate
    GO compartment that contains the plastoglobule.
- reference: GO:0009507
  notes: Gene Ontology cellular-component term for chloroplast.
- reference: uniprot.location:SL-0217
  notes: UniProt Subcellular Location entry SL-0217 maps plastoglobule to GO:0010287
    and places it under chloroplast.
- reference: DOI:10.7554/eLife.04889
  notes: Engel et al. 2015 resolved the native Chlamydomonas reinhardtii chloroplast
    by in situ cryo-electron tomography.
- reference: DOI:10.1105/tpc.105.039859
  notes: Austin et al. 2006 reported permanent plastoglobule-thylakoid coupling in
    the higher-plant chloroplasts studied; this topology is not established as universal
    in algae.
- reference: DOI:10.1016/j.bbabio.2015.02.002
  notes: Rottet, Besagni and Kessler 2015 reviewed plastoglobule roles in thylakoid
    lipid remodeling.
causal_graphs:
- graph_id: plastoglobule_thylakoid_lipid_exchange
  title: Higher-plant plastoglobule architecture and proposed lipid exchange
  description: The higher-plant model places a lipid core within a monolayer continuous
    with the thylakoid outer leaflet. This architecture motivates a lipid-exchange
    hypothesis; it is not evidence for universal continuity or direct transport in
    algae.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: Higher-plant architecture from Austin et al. 2006 and a proposed lipid-remodeling
    model from Rottet et al. 2015. Engel et al. 2015 instead observed apparently discontinuous
    Chlamydomonas plastoglobules, with resolution caveats. No specific transport mechanism
    is established here.
