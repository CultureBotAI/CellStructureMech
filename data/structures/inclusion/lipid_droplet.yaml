  title: Neutral lipids coalesce inside a monolayer droplet
  description: Triglycerides and sterol esters form the hydrophobic core of a lipid
    droplet, which is surrounded by a phospholipid monolayer and stores neutral lipids
    for later mobilization.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures neutral-lipid storage architecture without asserting
    the ER budding, growth, inheritance or lipolysis machinery.
