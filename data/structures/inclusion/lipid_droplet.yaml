components:
- component_id: triglyceride_core
  label: triglyceride
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  grounding: CHEBI:17855
  essentiality: CONDITIONAL
  role: Neutral storage-lipid class that accumulates in the hydrophobic droplet core.
  evidence:
  - reference: PMID:29397034
    notes: Graef 2018 reviews budding-yeast lipid droplets as organelles dynamically
      storing neutral triacylglycerols and steryl esters.
  - reference: DOI:10.1016/j.bbalip.2011.07.015
    notes: Grillitsch et al. 2011 analyzed the Saccharomyces cerevisiae lipid-droplet
      lipidome and proteome.
- component_id: sterol_ester_core
  label: sterol ester
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  grounding: CHEBI:35915
  essentiality: CONDITIONAL
  role: Neutral storage-lipid class that accumulates with triglycerides in the hydrophobic
    droplet core.
  evidence:
  - reference: PMID:29397034
    notes: Graef 2018 reviews steryl esters together with triacylglycerols as the
      main stored neutral lipids of budding-yeast lipid droplets.
  - reference: DOI:10.1016/j.bbalip.2011.07.015
    notes: Grillitsch et al. 2011 measured steryl-esters and triacylglycerols in Saccharomyces
      cerevisiae lipid particles/droplets.
taxonomic_distribution:
- taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  presence: VARIABLE
  note: Lipid droplets are characterized in Saccharomyces cerevisiae and Aspergillus
    oryzae, but this first record does not assert ubiquity across all fungi.
  reference: DOI:10.1111/mmi.15170
canonical_examples:
- taxon_id: NCBITaxon:559292
  taxon_label: Saccharomyces cerevisiae S288C
  note: Reference budding-yeast strain used to define lipid-droplet neutral-lipid
    storage and lipidome/proteome composition.
  reference: DOI:10.1016/j.bbalip.2011.07.015
functions:
- function_id: neutral_lipid_storage
  label: neutral lipid storage
  description: Lipid droplets sequester hydrophobic triglycerides and sterol esters
    as neutral-lipid reserves that can be mobilized by lipases and hydrolases.
  evidence:
  - reference: DOI:10.1007/s00018-015-1903-5
    notes: Wang 2015 reviews lipid-droplet biogenesis, growth, inheritance, degradation
      and lipolytic mobilization in budding yeast.
  - reference: PMID:29397034
    notes: Graef 2018 reviews budding-yeast lipid droplets as dedicated stores of
      triacylglycerols and steryl esters.
evidence:
- reference: GO:0005811
  notes: Gene Ontology cellular-component term for lipid droplet.
- reference: DOI:10.1007/s00018-015-1903-5
  notes: Wang 2015, Lipid droplet dynamics in budding yeast, Cellular and Molecular
    Life Sciences.
- reference: PMID:29397034
  notes: Graef 2018, Lipid droplet-mediated lipid and protein homeostasis in budding
    yeast, FEBS Letters.
- reference: DOI:10.1016/j.bbalip.2011.07.015
  notes: 'Grillitsch et al. 2011, Lipid particles/droplets of the yeast Saccharomyces
    cerevisiae revisited: lipidome meets proteome, Biochimica et Biophysica Acta.'
- reference: DOI:10.1111/mmi.15170
  notes: Mamun et al. 2024 identified lipid droplet-associated proteins regulating
    lipid-droplet biogenesis in Aspergillus oryzae.
causal_graphs:
