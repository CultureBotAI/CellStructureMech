identifier: GO:0005811
label: lipid droplet
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: An intracellular non-membrane-bounded organelle comprising a matrix of
  coalesced lipids surrounded by a phospholipid monolayer. May include associated
  proteins.
definition_source: GO:0005811
mapping_status: PROPOSED
