  - subject: mitostore
    predicate: sequesters
    object: cargo
    description: Aim17 is one tested precursor reporter, not an invariant structural
      subunit.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 5A establishes Aim17-RFP localization with Hsp104.
  - subject: cargo
    predicate: can remain competent for
    object: import
    description: The split-GFP chase supports retained import competence of presynthesized
      Aim17; not every molecule is directly tracked from a visible granule.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 6B measures Aim17-GFP11 complementation with mitochondrial Oxa1-GFP1-10
        after induction and chase.
  - subject: clogger_stop
    predicate: permits recovery of
    object: import
    description: Cells shifted to noninducing medium regain mitochondrial access for
      the previously induced reporter.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 6A-B and Results compare induction and the four-hour chase.
  - subject: rpn4_loss
    predicate: increases the measured recovery of
    object: import
    description: More reporter reaches the mitochondrial split-GFP compartment in
      the tested rpn4-deletion chase.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 6B compares wild-type and rpn4 deletion after clogger expression
        and recovery.
  - subject: rpn4_loss
    predicate: increases
    object: survival
    description: Rpn4 deletion improves survival in this import-stress assay when
      the chaperone system remains available; this is not general resistance to proteotoxic
