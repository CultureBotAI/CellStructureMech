label: MitoStore
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: A transient cytosolic protein granule characterized in budding yeast that
  sequesters non-imported mitochondrial precursor proteins, is enriched for presequence-containing
  cargo and associates with the mitochondrial surface.
definition_source: DOI:10.15252/embj.2022112309
mapping_status: PROPOSED
