  edges:
  - subject: clogger
    predicate: promotes cytosolic accumulation of
    object: cargo
    description: Competitive import inhibition increases non-imported precursor availability;
      the Rpn4 background affects the response.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Results in the Rpn4/proteome sections and Figures 2A, EV1A and 3C support
        precursor accumulation and Hsp104 association.
  - subject: cargo
    predicate: accumulates in
    object: mitostore
    description: Selected reporters localize to Hsp104-positive granules; their behavior
      is not generalized to all mitochondrial proteins.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figures 4A-B and 5A establish enrichment and Aim17/Pdb1/Mam33 reporter
        localization.
  - subject: hsp42_loss
    predicate: impairs formation of
    object: mitostore
    description: Aim17-positive granules are not observed in the tested hsp42-deletion
      condition; Hsp104-positive granules are also lost in the reported assay.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 5B separately tests hsp42 deletion and Figure 6D tests Hsp104-GFP
        foci.
  - subject: hsp104_loss
    predicate: impairs formation of
    object: mitostore
    description: Aim17-RFP-containing granules are not observed in the tested hsp104-deletion
      condition.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 5B contains separate hsp104 and hsp42 deletion panels, not only
        a double-deletion experiment.
  - subject: mam33_mts_loss
    predicate: impairs
    object: mam33_recruitment
    description: Removing the N-terminal targeting sequence prevents the tested Mam33
      reporter from entering the granules. This is not a universal targeting rule
      for every cargo.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 5C and its Results compare the truncated reporter with the intact-cargo
        observations.
  - subject: mam33_recruitment
    predicate: contributes reporter cargo to
    object: mitostore
    description: Intact Mam33-RFP colocalizes with Hsp104 under import-clogger conditions.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 5A demonstrates condition-specific localization; Figure 5C limits
        the targeting-sequence interpretation.
- graph_id: precursor_recovery_and_tolerance
  title: Reporter recovery and chaperone-dependent stress tolerance
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: 'Combines explicitly distinct yeast assays: 4.5-hour induction followed
    by a 4-hour import chase, and viability after 24-hour clogger exposure in lactate
    medium. Reporter recovery supports the storage interpretation without direct single-molecule
    transfer evidence. Chaperone epistasis does not prove that granules alone cause
    all survival effects.'
  nodes:
  - node_id: mitostore
    label: MitoStore
    node_type: STRUCTURE
  - node_id: cargo
    label: Stored precursor cargo represented by Aim17
    node_type: GENE_OR_PROTEIN
    component_ref: precursor_cargo
  - node_id: clogger_stop
