functions:
- function_id: precursor_sequestration
  label: temporary sequestration of non-imported precursor proteins
  description: Concentrates a condition-dependent, presequence-enriched protein cargo
    in cytosolic granules near mitochondria when precursor supply exceeds import capacity.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Figures 3-5 establish the granules, cargo enrichment and condition-dependent
      reporter incorporation; Figure 6C/E-F supports mitochondrial-surface association.
- function_id: import_competence
  label: retention of import-competent mitochondrial precursors
  description: A pulse/chase split-GFP assay supports later mitochondrial access of
    Aim17 synthesized during import stress. This does not establish that every stored
    cargo is import competent, that all imported protein passed through a granule,
    or that an individual molecule was tracked directly from a granule into mitochondria.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Figure 6A-B and Results follow reporter redistribution and post-induction
      Aim17-GFP11 access to mitochondrial Oxa1-GFP1-10 after clogger expression stops.
causal_graphs:
