  title: Condition-dependent precursor recruitment into MitoStores
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Yeast reporter and import-clogger experiments. Granule formation, individual
    cargo incorporation and mitochondrial import are different readouts. Chaperone-loss
    effects are limited to the tested conditions; co-purification alone is not treated
    as a complete inventory.
