discussions:
- discussion_id: identity_scope
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep the named precursor-rich cytosolic granule separate from other mitochondrial
    or protein deposits.
  rationale: Similarity, a shared chaperone marker and organelle proximity do not
    establish exact structure identity.
  notes: MitoStore is not an intramitochondrial IMiQ compartment, a mitochondrial-derived
    membrane compartment, IPOD or INQ. It resembles Q-bodies/CytoQ but these are not
    asserted as exact synonyms. Cytoplasmic parthood does not mean mitochondrial-matrix
    localization. Native MitoStore/MitoStores GO searches and exact label/synonym
    queries found no exact term; the full returned 794-hit precursor-granule fuzzy
    set was inspected during preparation.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Results naming paragraph, Figure 6 localization experiments and Discussion
      define the curated scope.
  - reference: GO:0016234
    notes: Active inclusion-body term is broader than MitoStore.
  - reference: GO:0005737
    notes: Active cytoplasm term supplies parthood vocabulary.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: small_hsp_scope
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Retain the evidence difference between Hsp42 and Hsp26 within the shared
    small-HSP component class.
  rationale: A family-level component must not imply identical member requirements
    or direct localization evidence for every member.
  notes: IPR031107 denotes the component's deliberately family-level label, not a
    narrow Hsp42-only identity. Hsp42 and Hsp26 both co-purify in clogger-dependent
    Hsp104 pull-downs, supporting candidate residence; only Hsp42 is directly tested
    for granule formation here. Conditional essentiality refers to that Hsp42 result,
    not to every family member. Neither fixed stoichiometry nor a universal coat is
    inferred.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Figures 4C-D, 5B and 6D support the distinct association and perturbation
      claims.
  - reference: InterPro:IPR031107
    notes: Native integrated family metadata and both complete protein-match sets
      verified.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: grounding_and_inventory
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact Hsp104-family grounding and native cargo/resident inventories.
  rationale: Reporter enrichment and Hsp104 interactors are not a complete source-neutral
    composition model.
  notes: Retain Hsp104 and heterogeneous cargo as REVIEWED_LABEL_ONLY. Broader ClpA/B
    families and domains are not exact Hsp104 identities. The small-HSP class is family-grounded,
    but direct residence and condition-specific Hsp26 requirements remain open. Mam33/Aim17/Pdb1
    reporters are not made invariant subunits.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Figures 3-5 support a selected, condition-dependent cargo and chaperone
      model.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P31539/?page_size=200
    notes: The complete 11-entry integrated match set has no exact narrower family.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: other_interactors
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Do not import every Hsp104 interactor, regulator or mitochondrial-surface
    factor as a MitoStore component.
  rationale: General chaperone interactions and related aggregate assays may denote
    different structures.
  notes: Rnq1 and Sis1 co-isolation is not MitoStore-specific; the reported Rnq1-loss
    test retains granules. Sse1 is a stress-enriched interactor whose stable MitoStore
    role needs separate confirmation. Rpn4 is an upstream regulator, not a listed
    constituent. Tom70 manipulations in the comparative heat-stress study do not establish
    an invariant MitoStore coat or requirement. No proteasome, RNA scaffold or membrane
    enclosure is inferred.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Figures 3-4 and reported Figure EV5A distinguish background Hsp104 clients
      from the precursor-granule model; the actual EV5 image was not inspected.
  - reference: DOI:10.1073/pnas.2300475120
    notes: Primary Results and Discussion compare mitochondria-associated heat-stress
      aggregates with MitoStores without proving exact equivalence; actual figures
      were not inspected.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: recovery_and_survival_scope
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep the import-chase and survival conclusions specific to their measured
    readouts.
  rationale: Chaperone perturbations are pleiotropic and a reporter chase does not
    track every stored molecule.
  notes: The Aim17 split-GFP assay supports retention of import competence after stress.
    It does not directly show transfer from each visible granule or universal recovery
    of cargo. Hsp42/Hsp104 loss affects the tested rpn4-background survival phenotype,
    but does not prove that granules alone account for resistance. Neither general
    stress protection nor constitutive degradation is assigned.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Figure 6A-B and 6G are different recovery and viability assays; Results
      limit broad proteotoxic-resistance interpretations.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: dataset_metadata_conflict
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile the paper-linked PRIDE deposit's bibliography and processing metadata
    before using its raw-data inventory.
  rationale: The accession resolves but inconsistent metadata must not silently define
    composition or sample scope.
  notes: PXD035762 is explicitly linked by the MitoStore paper and its PRIDE title,
    yet native references name the Ubc8 publication. Archive processing and paper
    IP-protein counts also differ. Preserve this conflict and the explicit provenance-only
    dataset entry. The supplementary spreadsheets and raw mass-spectrometry files
    have not been reanalyzed.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Inspected Data availability and Hsp104 IP panel identify the linkage and
      paper scope.
  - reference: https://www.ebi.ac.uk/pride/ws/archive/v2/projects/PXD035762
    notes: Native references and processing metadata inspected on 2026-10-05.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: remaining_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve finer granule identity boundaries, experimental strain mappings,
    prevalence and material properties.
  rationale: One species and optical reporter assays do not establish universal prevalence,
    fixed dimensions or a liquid phase.
  notes: Keep broad distribution, physical properties and stoichiometry unset. Hsp104-positive
    focus counts and two-dimensional fluorescent diameters are not invariant MitoStore
    measurements. YPH499-derived experimental provenance remains distinct from S288C
    reference sequences; supplemental strain tables were not read. Resemblance to
    Q-bodies/CytoQ remains a future lump/split question, not an exact synonym. No
    general liquid-liquid phase-separation mechanism is asserted.
  evidence:
  - reference: DOI:10.15252/embj.2022112309
    notes: Methods identify the default strain and optical measurements; Discussion
      leaves physical and functional surface interactions open.
  - reference: DOI:10.1073/pnas.2300475120
    notes: The related Tom70 study's heat-stress and engineered vacuolar relocation
      assays are not automatically transferred to this narrower precursor-storage
      record.
  posed_by: codex
  posed_date: '2026-10-05'
