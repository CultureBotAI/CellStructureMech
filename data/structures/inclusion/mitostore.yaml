    evidence:
    - reference: DOI:10.15252/embj.2022112309
      notes: Figure 6G tests the relevant mutant backgrounds.
  - subject: hsp104_loss
    predicate: reduces
    object: survival
    description: Removing Hsp104 suppresses the rpn4-background resistance under the
      tested clogger challenge.
    evidence:
    - reference: DOI:10.15252/embj.2022112309
