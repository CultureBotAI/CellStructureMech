  title: Stress- and cargo-dependent INQ deposition
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  description: Bounded interventions distinguish nuclear deposition from stress-specific
    recruitment of a resident marker.
  scope_notes: Separate reporter and genotoxic-stress assays are not one temporal
    pathway. HSP42 dependence of Cmr1 foci does not make native Hsp42 a universal
    INQ constituent. Rescue uses an engineered nuclear-targeted construct.
