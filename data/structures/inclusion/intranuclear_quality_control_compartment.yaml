      notes: Figure 3c reports residual percentages, not universal absence of all
        INQ-like material.
  - subject: hsp42_loss
    predicate: reduces
    object: cmr1_foci
    description: HSP42 deletion strongly reduces Cmr1-positive foci in the genotoxic-stress
      assay.
    evidence:
    - reference: DOI:10.1038/ncomms7533
      notes: Figure 3c; Discussion distinguishes this dependence from MG132-induced
        VHL targeting, which requires BTN2 but not HSP42.
- graph_id: nuclear_vacuolar_clearance
  title: Conditional INQ positioning and vacuolar disposal
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  description: Nuclear reporter deposition, spatial convergence and vacuolar clearance
    are separable readouts.
  scope_notes: Yeast NLS-LuciTs experiments at 37 C. Deletion effects do not identify
    invariant INQ subunits or direct physical tethers. Nuclear-vacuolar junctions
    are dispensable for INQ/JUNQ convergence but support correct clearance; molecular
    membrane-budding steps remain unresolved.
