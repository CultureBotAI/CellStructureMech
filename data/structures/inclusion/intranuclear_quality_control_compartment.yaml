  edges:
  - subject: inq
    predicate: undergoes
    object: homing
    description: Coexpressed nuclear and cytoplasmic reporter inclusions converge
      on opposite sides of the nuclear envelope without becoming the same structure.
    evidence:
    - reference: DOI:10.1038/s41556-023-01128-6
      notes: Figure 3 and Results describe distinct compartments homing across the
        envelope.
  - subject: inq
    predicate: can undergo
    object: delivery
    description: Nuclear reporter cargo can enter an acidic vacuolar compartment and
      be cleared in the tested conditions.
    evidence:
    - reference: DOI:10.1038/s41556-023-01128-6
      notes: 'Figures 7-8: Keima, protease perturbation, reporter fragments and live
        imaging provide complementary evidence.'
  - subject: nvj1_loss
    predicate: impairs
    object: delivery
    description: Disrupting the junction impairs INQ clearance and can redirect nuclear
      material into the cytoplasm.
    evidence:
    - reference: DOI:10.1038/s41556-023-01128-6
      notes: Figures 5f-h and 8a distinguish persistent inclusions and failed vacuolar
        interaction from initial formation.
  - subject: vac8_loss
    predicate: impairs
    object: delivery
    description: Loss of Vac8 increases persistent nuclear reporter inclusions and
      permits cytoplasmic egress, consistent with impaired junction-dependent clearance.
    evidence:
    - reference: DOI:10.1038/s41556-023-01128-6
      notes: Figure 5g-h and Extended Data Figure 5c-e are described in Results; this
        is not a block of initial convergence.
  - subject: chm7_loss
    predicate: disrupts
    object: homing
    description: A subset of chm7 deletion cells fails to converge INQ and JUNQ despite
      forming both inclusions.
    evidence:
    - reference: DOI:10.1038/s41556-023-01128-6
      notes: Figure 6b separates convergence from formation; activated Chm7OPEN is
        not an invariant native coat.
  - subject: vps4_loss
    predicate: impairs
    object: delivery
    description: Vps4-deficient cells retain nuclear reporter deposits and show defective
      vacuolar clearance.
    evidence:
    - reference: DOI:10.1038/s41556-023-01128-6
      notes: Figures 6e-f and 8a support persistent inclusions and defective clearance;
        the exact budding mechanism is proposed.
evidence:
- reference: DOI:10.15252/embj.201489524
  notes: Miller et al. (2015), PMID 25672362, PMC4369314. Read all main Results and
    Discussion and initial Methods via public PMC. Supplementary strain tables and
    actual figure pixels were not inspected. Heat-induced INQ also forms without MG132;
    the older JUNQ redefinition is not adopted as exact synonymy.
- reference: DOI:10.1038/ncomms7533
  notes: Gallina et al. (2015), PMID 25817432, PMC4389229.1. Verified native metadata/JATS;
    read INQ characterization, Mrc1 Results, full Discussion and strain Methods. Figure
    3 caption and actual image inspected. Supplements were not independently inspected.
- reference: DOI:10.1038/s41556-023-01128-6
  notes: Sontag et al. (2023), PMID 37081164, PMC12349969.1. Verified native metadata/JATS;
    read all main Results (S1-S8), Discussion, strain-table pointer and Data availability.
    Actual figures and supplemental strain tables were not inspected. TDM metadata
    does not establish a Creative Commons hosting licence.
- reference: GO:0016604
  notes: Native QuickGO verifies nuclear body as an active cellular-component class
    for a membraneless organelle in the nucleoplasm; broader parent only.
- reference: GO:0016234
  notes: Native QuickGO verifies inclusion body as a discrete intracellular aggregation;
    broader parent, not exact INQ identity.
- reference: GO:0005634
  notes: Native QuickGO verifies nucleus. Nuclear localization in the cited microscopy
    supports parthood for INQ, not for cytoplasmic JUNQ or post-extrusion cargo.
discussions:
- discussion_id: identity_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep INQ distinct from JUNQ, IPOD and nuclear stress granules.
  rationale: Early papers use different JUNQ/INQ interpretations; shared perinuclear
    proximity is not exact identity.
  notes: Mint after full-name/acronym QuickGO pagination and exact OLS GO label/synonym
    searches found no exact term. Broader nuclear body and inclusion body are is-a
    parents; nucleus is parthood. Hidden/ignored-inclusive whole-worktree searches,
    excluding only .git, and parsed identities of 888 records found no duplicate.
    Nuclear stress granule GO:0097165 already has a separate RNA/protein record and
    is not equated with INQ. Cytoplasmic JUNQ is not an exact synonym. Membrane enclosure
    during disposal is not a constitutive INQ boundary.
  evidence:
  - reference: DOI:10.15252/embj.201489524
    notes: 2015 interprets the prior JUNQ signal as nuclear INQ.
  - reference: DOI:10.1038/ncomms7533
    notes: Figure 3 distinguishes nuclear Cmr1-containing foci from cytoplasmic VHL
      foci.
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Figure 1 and Results distinguish nuclear INQ and cytoplasmic JUNQ, including
      formation without proteasome inhibition.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: component_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact source-neutral grounding for Btn2-type, Hsp104-type and heterogeneous
    cargo classes.
  rationale: Domain-only and broader family hits cannot serve as exact identities
    for narrower component classes.
  notes: Retain three REVIEWED_LABEL_ONLY classes. The Cmr1 component deliberately
    uses the verified integrated family label, while recruitment is scoped to the
    yeast example. No functional claim is imported from InterPro's unchecked LLM-generated
    family description.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P53286/?page_size=200
    notes: Complete native integrated match set inspected.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P31539/?page_size=200
    notes: ClpA/B families are broader than Hsp104.
  - reference: InterPro:IPR050853
    notes: Verified family identity and label, not authority for an INQ mechanism.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: component_exclusions
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate directly localized proteins from regulators, reporters and partially
    colocalizing complexes.
  rationale: Genetic dependence, fluorescence overlap and biochemical interaction
    do not establish fixed composition or universal assembly requirements.
  notes: 'Keep native Hsp42, Sis1, Sti1 and Nup42 outside the constituent list: stress-specific
    genetics or upstream sorting are not demonstrated invariant residence. Exclude
    NVJ/ESCRT proteins as canonical INQ constituents; their perturbations remain in
    the graph. CCT, proteasome and APC subunit recruitment does not establish whole-complex
    membership in every INQ. VHL and LuciTs are experimental cargo, not native subunits.
    Cmr1 is a conditional resident, while Hsp104 is associated machinery, with no
    fixed stoichiometry.'
  evidence:
  - reference: DOI:10.15252/embj.201489524
    notes: Figures 4-7 distinguish sorting, native localization and engineered Hsp42-NLS
      rescue.
  - reference: DOI:10.1038/ncomms7533
    notes: Results report Rpn11 at 13 percent of Cmr1 foci and Cct6 overlap at approximately
      12 percent; Discussion distinguishes native Hsp42 dependence from Btn2 residence.
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Figures 5-8 test contact and trafficking factors without defining them
      as INQ subunits.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: turnover_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Do not equate INQ deposition with obligatory degradation or a universal
    genome-protection mechanism.
  rationale: Different substrates and perturbations give different turnover effects;
    deposition, refolding, degradation and adaptation are distinct claims.
  notes: Miller Figure 6C reports similar tested reporter degradation despite impaired
    deposition, whereas Gallina Figure 5 links Btn2 loss to reduced Mrc1 turnover.
    Gallina Discussion explicitly leaves unresolved whether mutant genome-maintenance
    phenotypes are directly caused by failed INQ formation. Preserve this substrate-specific
    scope; no universal protection or required-degradation edge is asserted.
  evidence:
  - reference: DOI:10.15252/embj.201489524
    notes: Figure 6C and Discussion separate aggregation from degradation.
  - reference: DOI:10.1038/ncomms7533
    notes: Mrc1 Results and full Discussion distinguish correlation and unresolved
      causality.
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Figures 7-8 support parallel vacuolar and proteasomal routes for tested
      reporters.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: remaining_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve native client inventories, material state, precise experimental
    strain mappings and prevalence.
  rationale: Reporter induction and one microbial species do not establish lineage
    prevalence, universal dimensions or fixed molecular composition.
  notes: Leave taxonomic_distribution, physical_properties and stoichiometry empty.
    Do not infer liquid-like INQ behavior from cytoplasmic Q-body/JUNQ measurements,
    or equate human WDR76 foci with yeast INQ. Supplementary strain tables remain
    unread. No raw source data were reanalyzed or specific dataset accession inferred
    from a general source-data statement.
  evidence:
  - reference: DOI:10.1038/ncomms7533
    notes: Discussion notes that the nature of human WDR76 foci was not further investigated.
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Cryo-SXT interpretation of Q-body/JUNQ behavior is distinct from INQ; Methods
      defer strains to a supplemental table.
  posed_by: codex
  posed_date: '2026-10-05'
