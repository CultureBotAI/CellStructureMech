identifier: cellstructuremech:intranuclear_quality_control_compartment
label: intranuclear quality control compartment
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: A stress-induced membraneless nuclear inclusion characterized in budding
  yeast that concentrates misfolded and other conditionally recruited proteins near
  the nuclear envelope, distinct from the cytoplasmic juxtanuclear quality control
  compartment.
definition_source: DOI:10.1038/ncomms7533
mapping_status: PROPOSED
