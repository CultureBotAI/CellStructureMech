functions:
- function_id: sequestration
  label: spatial sequestration of nuclear protein cargo
  description: Concentrates selected misfolded and stress-recruited proteins in a
    nuclear deposit. INQ formation is not obligatory for degradation of every reporter
    and does not establish universal stress protection.
  evidence:
  - reference: DOI:10.15252/embj.201489524
    notes: Figures 1-3 establish nuclear deposition; Figure 6C finds similar reporter
      degradation during recovery when BTN2/HSP42-dependent deposition is impaired.
  - reference: DOI:10.1038/ncomms7533
    notes: Figure 3 and Discussion show stress-dependent recruitment beyond misfolded
      reporters.
- function_id: conditional_clearance
  label: conditional routing of nuclear quality-control cargo to the vacuole
  description: Nuclear reporter deposits can undergo nuclear-vacuolar-junction- and
    Vps4-dependent vacuolar delivery alongside proteasomal clearance. This is a demonstrated
    route in the tested reporter conditions, not the fate of all INQ clients.
  evidence:
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Figures 5-8 combine contact-site and ESCRT perturbations, Keima acidification,
      protease inhibition and live imaging. Exact membrane-budding steps remain a
      model.
