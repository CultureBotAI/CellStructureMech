- component_id: proteasome
  label: proteasome complex
  component_type: PROTEIN_COMPLEX
  component_role: ASSOCIATED_MACHINERY
  grounding: GO:0000502
  essentiality: UNKNOWN
  role: Historically reported proteolytic machinery recruited to JUNQ-designated reporter
    inclusions, not an invariant constituent or universal formation requirement. Early
    perinuclear assignments can include nuclear INQ and are not all reclassified as
    modern cytoplasmic JUNQ.
  evidence:
  - reference: DOI:10.1038/nature07195
    notes: Results S4 and Figure 5d describe 26S proteasome enrichment at JUNQ-designated
      inclusions, including mutant actin without proteasome inhibition; this is conditional
      historical association.
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Results S2 show that proteasome inhibition can cause additional nuclear
      reporter inclusions, limiting retrospective interpretation of earlier JUNQ assignments.
  - reference: GO:0000502
    notes: Native QuickGO verifies the generic cellular-component class proteasome
      complex; the label is deliberately not the narrower 26S proteasome identity.
