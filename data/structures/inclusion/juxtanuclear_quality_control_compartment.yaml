functions:
- function_id: sequestration
  label: spatial sequestration of cytoplasmic misfolded proteins
  description: Concentrates selected misfolded proteins in cytoplasmic deposits near
    the nucleus. This does not imply that every misfolded protein enters JUNQ or that
    deposition universally protects cells.
  evidence:
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: 'Results S1 and S5, Figures 1 and 4: reporter localization and correlated
      microscopy resolve cytoplasmic JUNQ.'
  - reference: DOI:10.3389/fmolb.2024.1427542
    notes: Results 3.1-3.4 distinguish perinuclear congregation from peripheral reporter
      deposition.
- function_id: conditional_clearance
  label: conditional clearance of sequestered protein cargo
  description: JUNQ-associated reporter cargo can be cleared through vacuolar and
    proteasome-associated routes under tested conditions. Their relative contributions
    depend on reporter and assay; the precise membrane route into the vacuole remains
    unresolved.
  evidence:
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Results S8 and Figure 7 combine cytoplasmic Keima acidification, reporter
      turnover and protease-sensitive fragments; direct time-resolved budding in Figure
      8 concerns INQ, not JUNQ.
  - reference: DOI:10.3389/fmolb.2024.1427542
    notes: Results 3.5 and Discussion show Atg1/Atg8-sensitive clearance but little
      bortezomib effect in these NES-LuciTs assays, and leave the route into the vacuole
      open.
- function_id: recoverable_pool
  label: conditional retention of recoverable reporter protein
  description: In the original JUNQ-designated Ubc9Ts assay, cooling restores diffuse
    fluorescence in an Hsp104-sensitive manner, consistent with a recoverable protein
    pool. This is not a universal client-refolding claim or a direct activity measurement,
    and early compartment assignments have nomenclature limitations.
  evidence:
  - reference: DOI:10.1038/nature07195
    notes: Results S6 and Figure 6e describe fluorescence recovery after temperature
      downshift and Hsp104/guanidinium perturbation.
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Results S2 delimit historical JUNQ assignments in proteasome-inhibited
      cells by resolving additional nuclear INQ.
