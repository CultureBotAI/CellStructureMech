discussions:
- discussion_id: identity_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep modern cytoplasmic JUNQ separate from INQ, IPOD and related deposits.
  rationale: Shared perinuclear proximity and changing nomenclature do not establish
    exact identity.
  notes: Minted after native QuickGO and exact OLS GO label/synonym checks found no
    exact term; broader inclusion body is a parent. Hidden/ignored-inclusive searches
    excluding only .git and parsed identities of 891 existing records found no JUNQ
    duplicate. Existing INQ explicitly excludes cytoplasmic JUNQ as an exact synonym.
    Q-bodies are deposits that can congregate into JUNQ, not automatically an exact
    synonym; IPOD, aggresome and MitoStore are not equated with it. Historical JUNQ
    experiments are not all reassigned to this modern cytoplasmic entity.
  evidence:
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Results S1-S5 distinguish compartment identity and explain nuclear inclusions
      induced by proteasome inhibition.
  - reference: DOI:10.1038/nature07195
    notes: Original JUNQ nomenclature predates the modern nuclear/cytoplasmic resolution.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: component_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact source-neutral grounding for variable cargo and Hsp104-type
    machinery.
  rationale: Variable client material and a narrow disaggregase class cannot be grounded
    by broader sequence families.
  notes: Retain two REVIEWED_LABEL_ONLY classes. All 11 integrated P31539 InterPro
    results were inspected; ClpA/B families are broader than the Hsp104-type label.
    Proteasome complex uses the exact generic GO label rather than pretending GO:0000502
    denotes only 26S proteasomes.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P31539/?page_size=200
    notes: Native complete integrated match set inspected.
  - reference: GO:0000502
    notes: Verified generic class identity.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: component_exclusions
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate cargo and directly localized machinery from genetic positioning
    and clearance factors.
  rationale: Deletion dependence alone is not direct residence, fixed composition
    or essentiality.
  notes: Btn2, Ssa1/Ssa2, Sis1 and Hsp90 perturbations are not automatically converted
    to constituent entries. NVJ proteins, NPCs, ESCRT and Atg1/Atg8 remain positioning
    or clearance factors, not invariant JUNQ subunits. Activated Chm7OPEN localization
    is not a native coat. Hsp104 has direct modern correlated localization; proteasome
    association is retained with explicit historical-assignment limits. Engineered
    reporters are variable cargo, not native defining subunits. A 2012 Sis1/Ssa1 localization
    lead requires primary and compartment-identity review before expansion.
  evidence:
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Results S4-S8 separate localization, convergence and turnover readouts.
  - reference: DOI:10.3389/fmolb.2024.1427542
    notes: Results 3.2-3.5 test genetic dependencies; single Hsp90 paralog loss does
      not settle redundancy.
  - reference: DOI:10.1038/nature07195
    notes: Results S4 supports conditional machinery recruitment in the original reporter
      assays.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: clearance_boundaries
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Preserve assay-dependent proteasome effects and the unresolved route of
    JUNQ entry into the vacuole.
  rationale: Reporter turnover, puncta counts and precise membrane trafficking are
    different claims.
  notes: The 2023 study reports partial stabilization with proteasome inhibition,
    whereas the 2024 NES-LuciTs assay finds little bortezomib effect. This is not
    resolved into a universal requirement or dispensability. The 2024 VPS15/VPS34
    experiments have expression limitations and do not overturn the separately assayed
    2023 positioning phenotypes. NVJ loss does not prevent initial convergence. Direct
    time-resolved nuclear extrusion in 2023 Figure 8 concerns INQ; no JUNQ budding
    route is copied from it. Autophagy-factor dependence does not prove obligatory
    piecemeal microautophagy.
  evidence:
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Results S6-S8 and Discussion.
  - reference: DOI:10.3389/fmolb.2024.1427542
    notes: Results 3.5 and Discussion explicitly consider several unresolved vacuolar
      routes.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: source_caption_limits
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Preserve caption and reporter-label discrepancies without silently resolving
    them.
  rationale: Source metadata, captions, methods and actual pixels do not always agree.
  notes: The hosted 2024 Figure 2 caption calls the blue nuclear stain Hoechst 33342
    while the image labels it DAPI; use generic blue nuclear signal. Its mitochondrial
    heat-treatment timing differs between Methods and caption. Panels D-E are double-mutant
    peripheral inclusions and an HTT/IPOD comparator, not positive wild-type JUNQ.
    In 2023 Figure 7d, the caption starts with NES-Keima but later says NLS; the cytoplasmic
    interpretation follows the experimental construct and Results, not the inconsistent
    phrase. No raw-image reanalysis resolves these source discrepancies.
  evidence:
  - reference: DOI:10.3389/fmolb.2024.1427542
    notes: Methods, Figure 2 caption and inspected figure pixels.
  - reference: DOI:10.1038/s41556-023-01128-6
    notes: Results S8 and Figure 7d caption.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: remaining_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve native client inventories, material state, prevalence and exact
    strain mapping for older assays.
  rationale: Induced reporter observations do not establish universal dimensions,
    composition or lineage distribution.
  notes: Leave taxonomic_distribution, stoichiometry, physical_properties and dataset
    accessions empty. Cryo-SXT attenuation suggests liquid-like behavior but does
    not by itself establish phase-separation physics. No constitutive membrane is
    inferred from disposal-associated contacts. The 2023 supplemental strain table
    and raw source data remain unread; 2024 Methods directly identifies BY4741, with
    native NCBI TaxId 1247190 verified. A general source-data statement is not a dataset
    accession; the 2024 study reports no large deposited dataset. Mammalian analogies
    are not imported as microbial prevalence.
