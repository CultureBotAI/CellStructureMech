label: juxtanuclear quality control compartment
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: A cytoplasmic, perinuclear protein-quality-control inclusion characterized
  in budding yeast, formed by congregation of misfolded-protein deposits near the
  nuclear envelope and distinct from the intranuclear quality control compartment.
definition_source: DOI:10.1038/s41556-023-01128-6
