identifier: cellstructuremech:sulfur_globule
label: sulfur globule
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: A bacterial sulfur storage inclusion that accumulates elemental sulfur
  from reduced sulfur compounds and packages it with sulfur-globule envelope proteins
  for temporary storage and later oxidation.
definition_source: DOI:10.1159/000351335
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-10T09:05:46Z'
  curator: claude
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-10T09:06:15Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added GO inclusion parentage, elemental sulfur and SgpA/SgpB/SgpC components,
    bacterial taxonomic scope, an Allochromatium vinosum canonical example, a temporary
    sulfur-storage function, record-level evidence, an Sgp envelope assembly graph
    and an envelope-protein grounding TODO.
  llm_assisted: true
- timestamp: '2026-09-10T09:08:27Z'
  curator: claude
  action: EDITED_RECORD
  changes: Changed CHEBI:33403 component and graph node labels from elemental sulfur
    core to the ChEBI canonical label elemental sulfur.
  llm_assisted: true
