  reference: DOI:10.1007/s00203-004-0683-3
functions:
- function_id: temporary_sulfur_storage
  label: temporary elemental sulfur storage
  description: Sulfur globules sequester elemental sulfur formed during reduced sulfur
    oxidation and retain it as an intracellular reserve for later oxidation.
  evidence:
  - reference: DOI:10.1159/000351335
    notes: Maki 2013 reviews intracellular sulfur globules as temporary sulfur reservoirs
      in sulfur-oxidizing bacteria.
evidence:
- reference: DOI:10.1159/000351335
  notes: 'Maki 2013, Bacterial intracellular sulfur globules: structure and function,
    Journal of Molecular Microbiology and Biotechnology.'
- reference: DOI:10.1007/s00203-004-0683-3
  notes: 'Prange et al. 2004, The role of the sulfur globule proteins of Allochromatium
    vinosum: mutagenesis of the sulfur globule protein genes and expression studies
    by real-time RT-PCR, Archives of Microbiology.'
causal_graphs:
- graph_id: sgp_envelope_elemental_sulfur_storage
  title: Sgp envelope proteins package stored sulfur
  description: Elemental sulfur accumulates as a globule core while SgpA, SgpB and
    SgpC envelope proteins support normal sulfur globule formation and expansion.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph links the Sgp envelope proteins to globule formation without
    asserting a complete sulfur deposition or oxidation mechanism. Sgp roles and mutant-background
    qualifications refer to Allochromatium vinosum; single sgpA or sgpB deletions
    retain globules and single sgpC deletion reduces size, not formation.
