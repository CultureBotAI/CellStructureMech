discussions:
- discussion_id: ground_sulfur_globule_envelope_proteins
  prompt: Resolve exact family groundings for bacterial SgpA/SgpB/SgpC sulfur-globule
    envelope proteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#sgpa_sgpb_envelope_proteins
  - components#sgpc_envelope_protein
  rationale: Allochromatium vinosum Sgp proteins define the best-studied envelope,
    but sulfur globule envelopes vary across intracellular and extracellular sulfur-storing
    bacteria. A first record should not guess exact InterPro, Pfam or NCBIfam accessions
    without a focused homology pass.
