- component_id: sgpc_envelope_protein
  label: SgpC sulfur globule envelope protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - sgpC
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SgpC is curated by its experimentally defined sulfur-globule envelope
    role in Allochromatium vinosum; exact homologous families outside this model system
    need additional review.
  role: Supports normal globule expansion in Allochromatium vinosum. Single sgpC disruption
    produced smaller globules, whereas the sgpBC double mutant did not form globules;
    conditional formation dependence is restricted to that mutant background.
  evidence:
  - reference: DOI:10.1007/s00203-004-0683-3
    notes: Prange et al. 2004 report normal globules after individual sgpA or sgpB
      inactivation, smaller globules after sgpC inactivation, and no sulfur globules
      in the sgpBC double mutant.
