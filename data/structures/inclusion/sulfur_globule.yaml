  llm_assisted: true
synonyms:
- synonym_text: intracellular sulfur globule
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1159/000351335
components:
- component_id: elemental_sulfur_core
  label: elemental sulfur
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  grounding: CHEBI:33403
  essentiality: ESSENTIAL
  role: Stored elemental sulfur that forms the globule core and is mobilized during
    subsequent sulfur oxidation.
  evidence:
  - reference: DOI:10.1159/000351335
    notes: Maki 2013 reviews intracellular sulfur globules as elemental-sulfur storage
      inclusions in sulfur-oxidizing bacteria.
- component_id: sgpa_sgpb_envelope_proteins
  label: SgpA/SgpB sulfur globule envelope proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - sgpA
  - sgpB
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SgpA and SgpB are treated as a sulfur-globule envelope protein
    pair in Allochromatium vinosum; no exact source-neutral family CURIE was chosen
    for these hydrophobic, partially redundant globule proteins.
  role: Hydrophobic envelope proteins that coat sulfur globules and are jointly required
    for normal globule formation.
  evidence:
  - reference: DOI:10.1007/s00203-004-0683-3
    notes: Prange et al. 2004 mutagenized Allochromatium vinosum sgpA, sgpB and sgpC
      and showed that SgpA/SgpB support normal sulfur-globule formation.
  - reference: DOI:10.1159/000351335
    notes: Maki 2013 reviews SgpA-family proteins as structural proteins associated
      with bacterial intracellular sulfur globules.
- component_id: sgpc_envelope_protein
  label: SgpC sulfur globule envelope protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - sgpC
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SgpC is curated by its experimentally defined sulfur-globule envelope
    role in Allochromatium vinosum; exact homologous families outside this model system
    need additional review.
  role: Small sulfur-globule envelope protein required for normal globule expansion
    in Allochromatium vinosum.
  evidence:
  - reference: DOI:10.1007/s00203-004-0683-3
    notes: Prange et al. 2004 found that sgpC disruption affected Allochromatium vinosum
      sulfur-globule expansion.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Intracellular sulfur globules occur in multiple sulfur-oxidizing bacterial
    groups but are absent from most bacteria.
  reference: DOI:10.1159/000351335
canonical_examples:
- taxon_id: NCBITaxon:572477
  taxon_label: Allochromatium vinosum DSM 180
  note: Purple sulfur bacterium used for SgpA, SgpB and SgpC sulfur globule protein
    mutagenesis.
  reference: DOI:10.1007/s00203-004-0683-3
functions:
- function_id: temporary_sulfur_storage
  label: temporary elemental sulfur storage
  description: Sulfur globules sequester elemental sulfur formed during reduced sulfur
    oxidation and retain it as an intracellular reserve for later oxidation.
  evidence:
  - reference: DOI:10.1159/000351335
    notes: Maki 2013 reviews intracellular sulfur globules as temporary sulfur reservoirs
      in sulfur-oxidizing bacteria.
evidence:
- reference: DOI:10.1159/000351335
  notes: 'Maki 2013, Bacterial intracellular sulfur globules: structure and function,
    Journal of Molecular Microbiology and Biotechnology.'
- reference: DOI:10.1007/s00203-004-0683-3
  notes: Prange et al. 2004, Characterization of the sulfur globule proteins of Allochromatium
    vinosum and mutational analysis of the sulfur globule protein genes, Archives
    of Microbiology.
causal_graphs:
