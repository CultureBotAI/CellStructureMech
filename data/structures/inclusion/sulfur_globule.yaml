identifier: cellstructuremech:sulfur_globule
label: sulfur globule
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: A bacterial sulfur storage inclusion that accumulates elemental sulfur
  from reduced sulfur compounds and packages it with sulfur-globule envelope proteins
  for temporary storage and later oxidation.
definition_source: DOI:10.1159/000351335
mapping_status: PROPOSED
