taxonomic_distribution:
- taxon_id: NCBITaxon:1428
  taxon_label: Bacillus thuringiensis
  presence: VARIABLE
  note: Parasporal crystalline inclusions are characteristic of many Bacillus thuringiensis
    isolates, but crystal protein complements are plasmid-associated and vary among
    strains.
  reference: DOI:10.3390/toxins6123296
canonical_examples:
- taxon_id: NCBITaxon:1430
  taxon_label: Bacillus thuringiensis serovar israelensis
  note: Serovar with a complex ovoid parasporal inclusion whose electron-microscopic
    lattice segments and toxin polypeptide classes were resolved biochemically.
  reference: DOI:10.1128/aem.50.1.56-62.1985
functions:
- function_id: pesticidal_protein_packaging
  label: pesticidal protein packaging
  description: Parasporal crystals package Cry, Cyt, and related pesticidal protoxins
    as insoluble crystalline deposits.
  evidence:
  - reference: DOI:10.3390/toxins6123296
    notes: Palma et al. 2014 review Cry/Cyt-containing parasporal inclusions and the
      downstream biocidal activities of Bt crystal proteins.
  - reference: DOI:10.1016/j.toxicon.2006.11.022
    notes: Bravo, Gill and Soberon 2007 review Cry and Cyt toxins as Bacillus thuringiensis
      protein families that form pores in target membranes after activation.
evidence:
- reference: DOI:10.1128/aem.50.1.56-62.1985
  notes: Insell and Fitz-James 1985, Composition and Toxicity of the Inclusion of
    Bacillus thuringiensis subsp. israelensis, Applied and Environmental Microbiology;
    Crossref abstract consulted because the ASM full text was blocked by Cloudflare.
- reference: DOI:10.3390/toxins6041222
  notes: Ben-Dov 2014, Bacillus thuringiensis subsp. israelensis and Its Dipteran-Specific
    Toxins, Toxins; PubMed Central full text and PubMed/Crossref metadata consulted;
    the MDPI landing page returned access denied in the curation environment.
- reference: DOI:10.3390/toxins6123296
  notes: 'Palma et al. 2014, Bacillus thuringiensis Toxins: An Overview of Their Biocidal
