    predicate: crystallize into
    object: parasporal_crystal
    description: Strain-specific Bt pesticidal proteins accumulate as parasporal crystalline
      inclusions.
    evidence:
    - reference: DOI:10.3390/toxins6123296
      notes: Palma et al. 2014 review Bt parasporal crystalline inclusions as Cry-
        and Cyt-containing structures.
    - reference: DOI:10.1128/aem.50.1.56-62.1985
      notes: Insell and Fitz-James 1985 used electron microscopy and polypeptide analysis
        to subdivide the Bacillus thuringiensis serovar israelensis inclusion into
        crystalline protein segments.
discussions:
- discussion_id: ground_crystal_toxin_families
  prompt: Resolve exact source-neutral groundings for the pesticidal proteins that
    build Bacillus thuringiensis parasporal crystals.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#cry_cyt_pesticidal_crystal_proteins
  rationale: This first pass intentionally models Cry, Cyt and related pesticidal
    crystal proteins as a broad label-only component because Bt isolates can encode
    multiple unrelated crystal-protein families. A follow-up should split exact family
    components only where the family term matches a source-neutral parasporal-crystal
    constituent.
  evidence:
  - reference: DOI:10.3390/toxins6123296
  - reference: DOI:10.3390/toxins6041222
  posed_by: codex
  posed_date: '2026-09-22'
- discussion_id: resolve_bti_inclusion_substructures
  prompt: Decide whether Bacillus thuringiensis serovar israelensis parasporal-crystal
    light and dark segments warrant components or child structures.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#cry_cyt_crystal_packaging
  rationale: Insell and Fitz-James resolved two lattice classes with distinct major
    polypeptide profiles in the Bti ovoidal inclusion. They are represented here only
    as evidence for protein crystallization because their exact mapping to modern
    Cry/Cyt toxin names and their suitability as source-neutral structures need a
    dedicated review.
  evidence:
  - reference: DOI:10.1128/aem.50.1.56-62.1985
  posed_by: codex
  posed_date: '2026-09-22'
