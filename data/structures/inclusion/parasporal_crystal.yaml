causal_graphs:
- graph_id: cry_cyt_crystal_packaging
  title: Cry and Cyt proteins crystallize into parasporal toxin inclusions
  description: A strain-specific set of Bacillus thuringiensis Cry, Cyt, or related
    pesticidal protoxins accumulates as an insoluble parasporal crystalline body.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures the observed protein-to-crystal packaging relationship
    without asserting the molecular nucleation mechanism or the full sporulation regulatory
    program.
  nodes:
  - node_id: cry_cyt_pesticidal_crystal_proteins
    label: Cry and Cyt pesticidal crystal proteins
    node_type: GENE_OR_PROTEIN
    component_ref: cry_cyt_pesticidal_crystal_proteins
