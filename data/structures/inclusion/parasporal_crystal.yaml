components:
- component_id: cry_cyt_pesticidal_crystal_proteins
  label: Cry and Cyt pesticidal crystal proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bacillus thuringiensis parasporal crystals can contain strain-specific
    combinations of Cry, Cyt, parasporin, and other pesticidal proteins; no single
    InterPro, Pfam, NCBIfam, or UniProt family CURIE exactly denotes the full source-neutral
    constituent class.
  role: Strain-specific toxin protoxins that crystallize into the parasporal inclusion
    and can become active against susceptible cells after solubilization and proteolytic
    activation.
  evidence:
  - reference: DOI:10.3390/toxins6123296
    notes: Palma et al. 2014 review Bacillus thuringiensis parasporal crystalline
      inclusions as containing Cry and Cyt proteins, plus additional crystal proteins
      of varied known or unknown activities.
  - reference: DOI:10.3390/toxins6041222
    notes: Ben-Dov 2014 reviews the Bacillus thuringiensis serovar israelensis toxin
      plasmid and summarizes Cry4Aa, Cry4Ba, Cry11Aa, Cyt1Aa, Cry10Aa, and Cyt2Ba
      as the polypeptides that form its complex parasporal crystalline body.
  - reference: DOI:10.1128/aem.50.1.56-62.1985
    notes: The Crossref-indexed abstract for Insell and Fitz-James 1985 reports that
      the Bacillus thuringiensis subsp. israelensis inclusion has two electron-microscopic
      lattice classes with distinct major polypeptides; the ASM article and PDF were
      blocked by Cloudflare during curation, so no verbatim snippets were copied.
