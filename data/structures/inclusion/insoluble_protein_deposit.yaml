identifier: cellstructuremech:insoluble_protein_deposit
label: insoluble protein deposit
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: A perivacuolar cytoplasmic protein inclusion characterized in budding
  yeast that accumulates poorly mobile, insoluble protein aggregates, including amyloid
  and prion cargo, at a site distinct from nuclear and juxtanuclear quality-control
  deposits.
definition_source: DOI:10.1038/nature07195
mapping_status: PROPOSED
