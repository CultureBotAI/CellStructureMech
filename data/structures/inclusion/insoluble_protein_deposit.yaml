    role: Reviewed reference-sequence example of yeast Hsp104; not a reassignment
      of 74D-694 experiments to S288C.
    evidence:
    - reference: UniProtKB:P31539
      notes: Native reviewed entry verifies protein name, HSP104/YLL026W and reference
        taxon 559292.
    - reference: DOI:10.1038/nature07195
      notes: Figure 5e and its Results describe functional GFP-Hsp104 associated with
        IPOD inclusions.
    - reference: DOI:10.1371/journal.pgen.1006324
      notes: Figure 6C-G tests Hsp104-sensitive persistence and turnover of previously
