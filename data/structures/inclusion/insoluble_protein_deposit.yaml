canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  reference: DOI:10.1371/journal.pgen.1006324
  note: IPOD cargo recruitment and turnover were studied in 74D-694 derivatives carrying
    PrD-GFP. Methods distinguish galactose-inducible reporter strains from constitutive
    reporter strains lacking the endogenous SUP35 prion domain. No exact strain taxon
    is inferred from reference-protein metadata.
- taxon_id: NCBITaxon:559292
  taxon_label: Saccharomyces cerevisiae S288C
  reference: UniProtKB:P31539
  note: Reference-sequence provenance for the reviewed Hsp104 example, not an assertion
    that the imaged 74D-694 derivatives are S288C.
functions:
- function_id: aggregate_sequestration
  label: spatial sequestration of insoluble protein cargo
  description: Concentrates selected aggregate substrates in a perivacuolar deposit.
    The entry does not assign universal protection, toxicity or obligatory prion nucleation
    to every IPOD.
  evidence:
  - reference: DOI:10.1038/nature07195
    notes: Figures 2 and 4 distinguish amyloid-cargo localization and poorly exchanging
      IPOD material from the juxtanuclear compartment.
  - reference: DOI:10.1371/journal.pgen.1006324
    notes: Figures 2, 3 and 5 show reversible defects in accumulation of PrD-GFP at
      one central IPOD after transport perturbations.
- function_id: conditional_cargo_processing
  label: conditional release of sequestered cargo for turnover
  description: In the PrD-GFP chase, deposits can slowly lose cargo through Hsp104-dependent
    processing, with subsequent turnover partly sensitive to proteasome inhibition.
    This is not evidence that all IPOD cargo is recoverable or that deposition is
    an obligatory degradation intermediate.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1006324
    notes: Figure 6C-G and Results separate slow Hsp104-sensitive deposit decay from
      downstream, partially MG132-sensitive turnover.
causal_graphs:
- graph_id: amyloid_cargo_recruitment
  title: Recruitment of PrD-GFP to a central IPOD
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Perturbation and rescue results in 74D-694-derived yeast with induced
    PrD-GFP. Reduced central deposition is distinct from disruption of a preformed
    IPOD. Transport-factor dependence does not establish stable residence or a direct
    vesicle-cargo tether.
