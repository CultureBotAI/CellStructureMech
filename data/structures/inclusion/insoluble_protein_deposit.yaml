  edges:
  - subject: cargo
    predicate: accumulates at
    object: ipod
    description: Induced PrD-GFP in the prion background concentrates at a central
      deposit in transport-competent controls.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1006324
      notes: Figures 2A and 2E compare control deposition with depletion conditions.
  - subject: myo2_depletion
    predicate: impairs cargo recruitment to
