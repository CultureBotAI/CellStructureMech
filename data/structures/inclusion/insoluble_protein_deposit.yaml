components:
- component_id: aggregate_cargo
  label: heterogeneous IPOD protein aggregate cargo
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: A variable aggregate class, not one sequence family or a fixed
    complex. Reporter identity does not define native composition.
  role: Deposited insoluble protein material, including prion and amyloid substrates;
    no single cargo protein is asserted as an invariant scaffold.
  evidence:
  - reference: DOI:10.1038/nature07195
    notes: Results and Figures 2 and 4 identify perivacuolar deposition of Rnq1, Ure2
      and HttQ103 reporters and low mobility of IPOD-localized Ubc9ts.
  - reference: DOI:10.1371/journal.pgen.1006324
    notes: Results use the Sup35 prion-domain reporter PrD-GFP to follow delivery
      to a central IPOD. This is engineered cargo, not full-length Sup35 membership
      in every deposit.
- component_id: hsp104
  label: Hsp104-type disaggregase
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  essentiality: UNKNOWN
  gene_symbols:
  - HSP104
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: All 11 native integrated InterPro matches for P31539 were inspected.
    IPR001270 and IPR050130 are broader ClpA/B families; domain and superfamily entries
    do not identify the narrower Hsp104-type class.
  role: Chaperone associated with assembled IPOD material. In the tested PrD-GFP chase,
    Hsp104 inhibition prevents slow deposit decay and cargo turnover. This post-assembly
    intervention does not establish a universal de novo assembly requirement.
