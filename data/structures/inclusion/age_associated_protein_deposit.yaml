- component_id: ydj1
  label: Ydj1-type Hsp40 cochaperone
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  essentiality: UNKNOWN
  gene_symbols:
  - YDJ1
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: All nine integrated InterPro matches for P25491 were checked. Chaperone
    DnaJ and DnaJ homolog subfamily A member 1/2-like families are broader than the
    Ydj1-type class; other entries are domains or superfamilies.
