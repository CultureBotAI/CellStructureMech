identifier: cellstructuremech:age_associated_protein_deposit
label: age-associated protein deposit
structure_category: INCLUSION
structure_kind: INCLUSION_BODY
definition: An aging-associated protein inclusion characterized in budding yeast that
  collects aggregation-prone proteins, usually persists as a single ER-associated
  deposit, and is preferentially retained in the mother-cell lineage.
definition_source: DOI:10.1016/j.cub.2017.01.069
mapping_status: PROPOSED
