functions:
- function_id: collection
  label: collection of aggregation-prone protein material
  description: Concentrates selected protein cargo into an aging-associated deposit,
    typically one persistent focus after initial formation. This is not an exhaustive
    cargo inventory or proof of a fixed material state.
  evidence:
  - reference: DOI:10.7554/eLife.06197
    notes: Figures 1-2 and 6-7 support persistent collection and chaperone-dependent
      organization.
- function_id: asymmetric_inheritance
  label: asymmetric retention of deposited protein material
  description: Preferentially retains assembled deposits in mother cells during division.
    Retention of the visible deposit and confinement of its proposed smaller precursors
    are distinct mechanisms.
  evidence:
  - reference: DOI:10.7554/eLife.06197
    notes: Figures 1F and 2G measure mother retention of Hsp104- and Sup35-marked
      deposits.
  - reference: DOI:10.1016/j.cub.2017.01.069
    notes: Figures 3-4 distinguish mature-deposit passage from new deposit formation
      in daughters.
