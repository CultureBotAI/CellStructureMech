discussions:
- discussion_id: identity_and_topology
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep the aging-defined deposit distinct without imposing a universal compartment
    topology.
  rationale: Shared markers and perinuclear proximity do not establish exact identity.
  notes: Exact OLS GO label/synonym checks and complete programmatic label checks
    of all 3177 fuzzy QuickGO results found no exact Agepod term. GO:0140453 protein
    aggregate center denotes a reversible thermosensitive-protein shielding aggregate,
    not this aging-defined entity. Hidden/ignored-inclusive searches excluding only
    .git and parsed identities of 892 records found no duplicate. The 2015 assays
    distinguish Q-bodies, IPOD and JUNQ/INQ reporters; the 2017 SIM assay reports
    intranuclear deposits in 38% of 26 cells and explicitly leaves the INQ/JUNQ relationship
    unresolved. Do not equate all Hsp104 foci, or add exclusive cytoplasm, nucleus
    or ER parthood. ER apposition is not a demonstrated enclosing membrane.
  evidence:
  - reference: DOI:10.7554/eLife.06197
    notes: Figure 3 comparisons are assay-bounded.
  - reference: DOI:10.1016/j.cub.2017.01.069
    notes: Results and inspected Figure 1I-J preserve intranuclear localization and
