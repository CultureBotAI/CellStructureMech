- discussion_id: ydj1_and_precursors
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate conditional Ydj1 residence from the proposed precursor-confinement
    mechanism.
  rationale: Fluorescent tag placement changes farnesylation and exchange; diffusion
    is not direct client identification.
  notes: The 2015 C-terminal Ydj1 localization is not promoted to universal native
    residence. In 2017, functional N-terminal GFP-Ydj1 enrichment occurs in only 9.4%
    of 53 deposits. YDJ1-C406S accelerates daughter deposition without disrupting
    the mature deposit's ER apposition or mother retention. FCS/FLIP and epistasis
    support the authors' precursor-confinement model, but direct bound precursors
    were not identified. The Sup35 readthrough assay is a prion-strength proxy, not
    direct imaging of precursor transport.
  evidence:
  - reference: DOI:10.7554/eLife.06197
    notes: Figure 1C and main Results.
  - reference: DOI:10.1016/j.cub.2017.01.069
    notes: Results, Figure 5, inspected Supplemental Figure S5 and Discussion.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: noncomponents_and_phenotypes
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Do not convert upstream factors, marker negatives or lifespan correlations
    into composition and universal function.
  rationale: Localization, genetic dependence and pleiotropic phenotypes answer different
    questions.
  notes: BUD1, SUR2, BUD6, PRM3, NPR3, TCO89 and mTOR-pathway factors remain upstream
    regulators or experimental perturbations, not fixed components. Sis1, Hsp82, Btn2
    and Dcp2 are not assigned resident roles from the tested 2015 comparisons; these
    results are not taxonomic absence. No proteasome coat is inferred from faster
    cytosolic AID-reporter turnover in deposit-bearing cells. HSP42/HSP104 lifespan
    changes do not isolate a causal effect of the deposit itself. Early/midlife stress
    handling is not universal protection throughout aging.
  evidence:
  - reference: DOI:10.7554/eLife.06197
    notes: Figures 1-5 and 8; reporter comparisons and pleiotropic deletions.
  - reference: DOI:10.1016/j.cub.2017.01.069
    notes: Figures 2-5 separate ER/precursor control from deposit composition.
  - reference: DOI:10.1016/j.jbc.2025.108172
    notes: Separate aging and heat-stress assays.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: assay_boundaries
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Preserve single-deletion, tag, dose and assay-context distinctions.
  rationale: A source inconsistency or readout boundary must not be flattened into
    a stronger claim.
  notes: Inspected 2015 Figure 6C contains separate ssa1 and ssa2 deletion groups,
    not a combined mutant. In 2025, Figure 5A specifies 0.25 micrograms/ml cycloheximide
    whereas general Methods specifies 250 micrograms/ml; no exact dose is assigned
    here. The original TCO89 heat-screen hit differs from manually reconstructed mutants.
    Acute-heat translation/Hsf1 measurements are not recast as direct mechanistic
    tests of aged deposits. Loss of fluorescent foci is not proof of total cargo degradation.
  evidence:
