components:
- component_id: core_particle
  label: proteasome core complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005839
  essentiality: UNKNOWN
  role: Proteolytic particle represented by the 20S core in the yeast studies. Listing
    core and regulatory particles separately does not assert that they are physically
    dissociated within every intact granule.
  evidence:
  - reference: DOI:10.1083/jcb.200711154
    notes: Figures 1-2 localize core subunits to PSGs by immunogold and fluorescence.
  - reference: DOI:10.1091/mbc.E17-03-0162
    notes: Figure 5 detects core subunits in enriched cross-linked PSG preparations.
- component_id: regulatory_particle
  label: proteasome regulatory particle
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005838
  essentiality: UNKNOWN
  role: The 19S particle is represented by both base and lid markers in yeast PSGs.
    Marker colocalization alone does not determine holoenzyme assembly state.
  evidence:
  - reference: DOI:10.1083/jcb.200711154
    notes: Figure 2 compares core, base and lid markers in the same foci.
  - reference: DOI:10.1091/mbc.E17-03-0162
    notes: Figure 5 detects regulatory-particle subunits in enriched PSG preparations.
