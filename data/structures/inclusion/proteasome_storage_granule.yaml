evidence:
- reference: GO:0034515
  notes: Native QuickGO verifies active cellular-component identity, related-scope
    PSG abbreviation, membraneless-organelle parent and cytoplasmic parthood.
- reference: DOI:10.1083/jcb.200711154
  notes: Laporte et al. (2008), PMID 18504300, PMC2396804.1. Native metadata reports
    no retraction. Main Results, figure captions and relevant strain/microscopy methods
    inspected; Figure 2 pixels inspected. Supplemental files were not inspected.
- reference: DOI:10.1091/mbc.E17-03-0162
  notes: Gu et al. (2017), PMID 28768827, PMC5597321.1. Native metadata reports no
    retraction. Main composition, localization, ubiquitin-overexpression and native-gel
    Results, figure captions and strain methods inspected. Supplemental files and
    raw proteomics were not independently inspected.
- reference: DOI:10.1016/j.cell.2025.12.035
  notes: Tang et al. (2026), PMID 41605212. Primary abstract reports inactive, doubly
    capped 26S proteasomes organized into trimer-based paracrystalline arrays by in
    situ cryo-ET. Only abstract and bibliographic metadata were read; publisher full
    text and the Max Planck repository PDF returned 403. No detailed assembly graph,
    quantitative property or accession is inferred from the abstract.
discussions:
- discussion_id: retracted_evidence
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Exclude the retracted 2018 study and derivative commentary from positive
    support.
  rationale: Ontology citation chains can retain secondary accounts of withdrawn work.
  notes: DOI 10.7554/eLife.34532 was retracted by DOI 10.7554/eLife.82988 following
    reported western-blot irregularities and misplaced confocal images. GO's definition
    also cites PMID 30204036, a commentary on that study, which is not independent
    support. No proteaphagy-protection or Arabidopsis PSG claim is imported from either.
    Independent 2008 and 2017 primary evidence supports this record's yeast scope.
  evidence:
  - reference: DOI:10.7554/eLife.82988
    notes: Official retraction notice read; used only for exclusion provenance.
  - reference: PMID:30204036
    notes: Native PubMed identifies this as a comment on the retracted study.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: architecture_context
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile in situ PSG architecture with older extract-based assembly assays.
  rationale: Colocalized subunits and dissociated particles in lysates do not uniquely
    establish assembly state inside living-cell granules.
  notes: The 2008 study leaves activity and particle association unresolved. Figure
    7 of the 2017 study uses lysates and native PAGE; its dissociation model is not
    imposed universally. The 2026 abstract reports intact 26S arrays in situ. Read
    its full methods, condition-specific results and deposits before extending architecture
    claims. No liquid-state, fixed stoichiometry or activity claim is inferred from
    fluorescence foci or the term membraneless.
  evidence:
  - reference: DOI:10.1083/jcb.200711154
    notes: Results following Figure 2 explicitly delimit assembly/activity inference.
  - reference: DOI:10.1091/mbc.E17-03-0162
    notes: Figure 7 describes native-PAGE analysis of lysates, not intact granules.
  - reference: DOI:10.1016/j.cell.2025.12.035
    notes: Primary abstract supplies a consequential newer architecture result.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: component_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate experimentally observed residents from indirect genetic modifiers.
  rationale: A deletion phenotype or a different reversible focus is not PSG membership.
  notes: The 2017 screen's kinases, transcription factors and karyopherins are not
    added solely from regulatory effects or focus formation. Blm10, Ubp6 and ubiquitin
    have separate localization or enrichment support. The ubiquitin precursor is distinguished
    from its processed product. No accession represents an entire proteasome particle,
    and no universal essentiality is asserted.
  evidence:
  - reference: DOI:10.1091/mbc.E17-03-0162
    notes: Main localization/composition Results distinguish these source observations.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: ubiquitin_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve an exact source-neutral identifier for unconjugated mature ubiquitin.
  rationale: Domains and a family including other ubiquitin-like proteins are broader
    than the curated component.
  notes: Native complete P0CG63 InterPro results were checked through next=null; reviewed
    precursor identity is retained only as a protein example.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P0CG63/?page_size=200
    notes: Five integrated matches; no exact mature-product family adopted.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: structure_boundary_and_scope
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep PSG distinct from individual proteasomes and other protein inclusions.
  rationale: Shared components or transient proximity do not establish identity.
  notes: GO assigns PSG its own identity, not an is-a subtype of the proteasome complex.
    No IPOD, JUNQ, actin-body or P-body synonym is asserted. Yeast examples do not
    establish fungal or eukaryotic prevalence. Taxonomic distribution, traits, complex
    compositions, physical properties and raw datasets remain unasserted. The live
    iModulonDB adapter lists 28 datasets, neither yeast represented; this provides
    no structure-absence evidence. Hidden/ignored-inclusive whole-worktree searches
    and all 895 parsed record identities found no duplicate before creation.
  evidence:
  - reference: GO:0034515
    notes: Exact ontology identity and hierarchy checked at QuickGO.
  - reference: DOI:10.1083/jcb.200711154
    notes: Figure 3 directly distinguishes PSGs from actin bodies and P-bodies.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
