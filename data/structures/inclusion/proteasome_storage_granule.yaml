functions:
- function_id: reversible_proteasome_reservoir
  label: reversible proteasome storage
  description: Concentrates proteasome material during quiescence for subsequent mobilization.
    This does not assert protection from autophagic degradation.
  evidence:
  - reference: DOI:10.1083/jcb.200711154
    notes: Figures 4-5 test refeeding with water and translation-inhibition controls.
causal_graphs:
- graph_id: nutrient_recovery
  title: Refeeding mobilizes PSG-associated proteasome material
  graph_kind: DISASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Pre6-GFP in four-day budding-yeast cultures transferred to fresh YPD.
    Water transfer is a negative control; cycloheximide does not prevent relocalization.
    These interventions support mobilization without requiring new protein synthesis,
    not a resolved molecular dissolution mechanism or proteaphagy-protection mechanism.
  nodes:
  - node_id: fresh_medium
    label: Transfer to fresh YPD
    node_type: EXPERIMENTAL_FACTOR
  - node_id: granule_clearance
