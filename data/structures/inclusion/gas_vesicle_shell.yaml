  - subject: gvpc
    predicate: strengthens
    object: shell
    description: The GvpC coat raises the pressure required to collapse the GvpA wall.
    evidence:
    - reference: PMID:8177173
      notes: Walsby 1994 reviews pressure-collapse assays showing that GvpC strengthens
        shells.
    - reference: PMID:1510555
      notes: Hayes et al. 1992 showed that recombinant GvpC binds urea-stripped Anabaena
        flos-aquae gas vesicles after dialysis and restores most of their critical
        collapse pressure.
  - subject: shell
    predicate: maintains
    object: gas_filled_lumen
    description: The hydrophobic protein shell excludes liquid water while remaining
      permeable to gases.
    evidence:
    - reference: PMID:8177173
      notes: Walsby 1994 reviews the wall properties that keep the vesicle lumen gas
        filled.
    - reference: DOI:10.1099/00221287-138-4-837
      notes: Walsby, Revsbech and Griffel 1992 directly measured oxygen movement to
