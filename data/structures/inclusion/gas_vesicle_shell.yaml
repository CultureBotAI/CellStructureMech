  - subject: gas_filled_lumen
    predicate: supports
    object: buoyancy_regulation
    description: Gas retention gives cells many low-density inclusions that can support
      buoyancy regulation.
    evidence:
    - reference: PMID:8177173
      notes: Walsby 1994 describes how gas vesicles lower cell density and support
        vertical migration.
discussions:
- discussion_id: exclude_transient_accessory_gvps
  prompt: Should GvpF/GvpL-family accessory assembly proteins be modeled as gas vesicle
    shell components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#gvpa
  - causal_graphs#gvpa_gvpc_shell_barrier
  rationale: The shell record is scoped to persistent shell material. Accessory Gvps
    contact GvpA during gas-vesicle biogenesis, but current interaction evidence supports
    an upstream assembly role that is represented on the whole gas_vesicle record
    rather than persistent membership in the mature shell.
  resolution_note: 'Declined: keep accessory-Gvp recruitment and nucleation on GO:0031411
    gas vesicle until a persistent shell subcomplex is resolved.'
