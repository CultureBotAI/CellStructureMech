      notes: Dutka et al. 2023 traced GvpA filaments through the intact Dolichospermum
        shell by cryo-ET.
  - subject: gvpc
    predicate: coats outside of
    object: shell
    description: GvpC binds to the outer shell surface in cyanobacterial gas vesicles.
    evidence:
