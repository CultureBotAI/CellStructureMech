components:
- component_id: gvpa
  label: major gas vesicle protein GvpA
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - gvpA
  essentiality: ESSENTIAL
  role: Polymerizes into the conserved, ribbed wall that forms the proteinaceous gas
    vesicle shell.
  evidence:
  - reference: PMID:22147705
    notes: Bayro et al. 2012 used solid-state NMR to support a cross-beta assembly
      model for GvpA in the gas vesicle shell.
  - reference: DOI:10.1016/j.str.2023.03.011
    notes: Dutka et al. 2023 resolved the Dolichospermum gas-vesicle shell as a wall
      built from a helical GvpA filament.
- component_id: gvpc
  label: gas vesicle strengthening protein GvpC
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - gvpC
  essentiality: CONDITIONAL
  role: Binds the outside of the GvpA shell in characterized cyanobacterial gas vesicles
    and increases resistance to pressure collapse.
  evidence:
  - reference: PMID:8177173
    notes: Walsby 1994 reviews biochemical and mechanical evidence that GvpC decorates
      the exterior of cyanobacterial gas vesicle shells and strengthens them against
      collapse.
  - reference: PMID:1510555
    notes: Hayes et al. 1992 showed that recombinant GvpC binds urea-stripped Anabaena
      flos-aquae gas vesicles after dialysis and restores most of their critical collapse
      pressure.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Gas vesicle shells occur in several bacterial phyla, especially aquatic phototrophs,
    but are restricted to lineages that carry gas-vesicle gene clusters.
  reference: PMID:8177173
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: VARIABLE
  note: Gas vesicle shells also occur in multiple archaeal groups, including haloarchaea.
  reference: PMID:8177173
canonical_examples:
- taxon_id: NCBITaxon:315271
  taxon_label: Dolichospermum flos-aquae CCAP 1403/13F
  note: Cyanobacterial strain used for the cryo-electron tomography study that resolved
    intact GvpA shells.
  reference: DOI:10.1016/j.str.2023.03.011
functions:
- function_id: gas_permeable_water_exclusion
  label: gas-permeable water exclusion
  description: The protein shell excludes liquid water from the gas vesicle lumen
    while allowing gases to diffuse across the wall.
  evidence:
  - reference: PMID:8177173
    notes: Walsby 1994 reviews the gas permeability and liquid water impermeability
      of the gas vesicle wall.
  - reference: DOI:10.1016/j.str.2023.03.011
    notes: Dutka et al. 2023 resolved the GvpA shell geometry that surrounds the hollow
      lumen.
  - reference: DOI:10.1099/00221287-138-4-837
    notes: Walsby, Revsbech and Griffel 1992 directly measured oxygen movement to
      quantify the gas permeability coefficient of cyanobacterial gas vesicle walls.
- function_id: pressure_collapse_resistance
  label: pressure collapse resistance
  description: GvpC-coated shells withstand higher turgor or hydrostatic pressure
    before collapsing.
  evidence:
  - reference: PMID:8177173
    notes: Walsby 1994 reviews evidence that GvpC is released by urea, binds back
      to stripped shells and raises the pressure needed to collapse them.
  - reference: PMID:1510555
    notes: Hayes et al. 1992 showed that recombinant GvpC binds urea-stripped Anabaena
      flos-aquae gas vesicles after dialysis and restores most of their critical collapse
      pressure.
evidence:
- reference: PMID:8177173
  notes: Walsby AE 1994, Gas vesicles, Microbiological Reviews.
- reference: PMID:22147705
  notes: Bayro MJ, Daviso E, Belenky M, Griffin RG and Herzfeld J 2012, An amyloid
    organelle, solid-state NMR evidence for cross-beta assembly of GvpA.
- reference: DOI:10.1016/j.str.2023.03.011
  notes: Dutka P et al. 2023, Structure of Anabaena flos-aquae gas vesicles revealed
    by cryo-ET, Structure.
- reference: PMID:1510555
  notes: Hayes PK, Buchholz B and Walsby AE 1992, Gas vesicles are strengthened by
    the outer-surface protein, GvpC.
- reference: DOI:10.1099/00221287-138-4-837
  notes: Walsby AE, Revsbech NP and Griffel DH 1992, The gas permeability coefficient
    of the cyanobacterial gas vesicle wall.
causal_graphs:
- graph_id: gvpa_gvpc_shell_barrier
  title: GvpA and GvpC build a water-excluding shell
  description: GvpA polymerizes into helical ribs that form the continuous gas vesicle
    wall. GvpC can coat the outside of that wall to increase collapse pressure, while
    the assembled shell excludes liquid water and allows gases to cross into the hollow
    lumen.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
