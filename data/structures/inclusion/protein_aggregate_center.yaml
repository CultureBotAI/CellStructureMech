- graph_id: reporter_turnover
  title: Perturbations of PAC deposition and reporter turnover
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: Immunoblot turnover assays at 37 C. The interventions have effects
    beyond PAC deposition; the graph records their measured effects without claiming
    a deposition-only molecular pathway or universal endogenous-client fate.
  nodes:
  - node_id: double_loss
    label: Joint BTN2 and HSP42 deletion
    node_type: EXPERIMENTAL_FACTOR
  - node_id: chx
    label: Cycloheximide at 37 C
    node_type: EXPERIMENTAL_FACTOR
  - node_id: degradation
    label: Misfolding-reporter degradation
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: double_loss
    predicate: accelerates
    object: degradation
    description: The double deletion increases turnover of the tested Rho1 and Guk1-9
      reporters during heat stress.
    evidence:
    - reference: DOI:10.3390/ijms241311202
      notes: Results 2.4 and Figure 6c; reduced PAC persistence accompanies faster
        turnover.
  - subject: chx
    predicate: accelerates
    object: degradation
    description: CHX accelerates Rho1.C17R-GFP loss at 37 C, but the same effect is
      not observed at 25 C.
    evidence:
    - reference: DOI:10.3390/ijms241311202
      notes: Results 2.4 and Figure 6b provide the temperature control.
- graph_id: pac_clearance
  title: Hsp104-dependent PAC clearance
  graph_kind: DISASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: W303 main Figure 4 assays. Recovery follows 30 minutes at 37 C and
    a shift to 25 C with CHX added to block new synthesis. Chronic-heat turnover is
    a separate assay, not a necessary consequence of recovery.
