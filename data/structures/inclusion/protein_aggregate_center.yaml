functions:
- function_id: temporary_sequestration
  label: temporary sequestration of heat-sensitive protein clients
  description: Collects misfolding-prone proteins in heat-induced foci. The same reporters
    persist differently in fission yeast, W303 and BY4741; a fixed lifetime is not
    part of the structure identity.
  evidence:
  - reference: DOI:10.3390/ijms241311202
    notes: Results 2.1 and Figure 1 compare reporter PAC formation and persistence.
- function_id: degradation_delay
  label: postponement of client degradation
  description: PAC deposition can delay degradation of the tested misfolding reporters.
    Recovery permits disassembly, whereas prolonged heat can be followed by turnover.
    The study's folding-versus-degradation model is not proof that every endogenous
    client follows one fate.
  evidence:
  - reference: DOI:10.3390/ijms241311202
    notes: Results 2.3-2.4 and Figures 4-6 combine deletion, translation inhibition
      and immunoblot measurements; Figure 6d summarizes the proposed routing model.
causal_graphs:
- graph_id: mild_heat_deposition
  title: Reporter PAC formation during mild heat stress
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Rho1.C17R-GFP and Guk1-9-GFP assays in budding-yeast W303/BY4741 derivatives.
    The double-deletion phenotype varies by strain and reporter. CHX at induction
    is distinct from CHX added only during recovery. No proteasome inhibitor is needed
    for the cited formation assays.
