discussions:
- discussion_id: identity_overlap
  kind: INTERPRETATION
  status: OPEN
  prompt: Resolve the operational overlap of PAC with INQ and CytoQ without forcing
    exact synonymy.
  rationale: The same protein-quality-control literature uses different names and
    experimental boundaries.
  notes: The 2023 Introduction suggests PACs may correspond to INQ plus CytoQ. This
    GO-grounded umbrella is not asserted distinct from every such focus, nor exactly
    equivalent to either narrower site. No exact Q-body, CytoQ, INQ, JUNQ, IPOD or
    Agepod synonym or hierarchy edge is added. Nuclear rings observed under severe
    heat are discussed separately in the source. Full-name/CURIE/DOI and acronym/old-name
    searches included hidden and ignored files, excluding only .git; parsed identities
    of 893 records had no exact PAC match.
  evidence:
  - reference: DOI:10.3390/ijms241311202
    notes: Introduction explicitly qualifies the proposed PAC/INQ/CytoQ correspondence;
      Results 2.5 separates NuRs.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: component_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact family grounding for Btn2-type, Hsp104-type and heterogeneous
    cargo classes.
  rationale: Domains, broad superfamilies and variable cargo cannot be made exact
    component identities.
  notes: Three classes retain REVIEWED_LABEL_ONLY. Complete native InterPro sets were
    inspected for all three protein examples; no domain is promoted to a family.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P53286/?page_size=200
    notes: Native integrated set contains only one domain.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P31539/?page_size=200
    notes: Native integrated set includes broader ClpA/B families, not an exact Hsp104
      family.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: component_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep reporters and upstream or turnover factors separate from demonstrated
    residents.
  rationale: Genetic effects do not alone demonstrate membership in the assembled
    structure.
  notes: Rho1.C17R-GFP and Guk1-9-GFP remain experimental cargo probes. C-terminal
    GFP prevents Rho1 geranylgeranylation. Ydj1 and the proposed Rsp5 route are not
    added as constituents solely from turnover phenotypes or model arrows. CHX, ribosomes
    and general proteasome machinery are not PAC subunits. Hsp104 is associated machinery
    and dispensable for formation; Figure 2's description of it as a small HSP is
    not adopted.
  evidence:
  - reference: DOI:10.3390/ijms241311202
    notes: Figure 1a, Results 2.3-2.4 and Discussion establish these distinctions.
  - reference: UniProtKB:P31539
    notes: Reviewed protein identity is Hsp104, not a small-HSP family assignment.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: experimental_scope
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Preserve temperature, strain, inhibitor and readout boundaries.
  rationale: Reporter foci, protein abundance, refolding and degradation are different
    measurements.
  notes: Do not infer identical kinetics across W303, BY4741 and fission yeast, or
    universal essentiality from a double deletion. The 37 C induction experiments
    differ from 42 C severe stress. Figure 4 recovery adds CHX after PAC assembly;
    Figure 6 adds it during induction. Loss of fluorescence need not coincide with
    degradation. No liquid-state claim, quantitative geometry or fixed client lifetime
    is inferred.
  evidence:
  - reference: DOI:10.3390/ijms241311202
    notes: Figures 1, 3, 4 and 6, plus Discussion, explicitly distinguish these assays.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
