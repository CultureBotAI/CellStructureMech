  - node_id: acid_trigger
    label: acidification trigger
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: extended_r_body_tube
    label: extended R-body tube
    node_type: STRUCTURE
    grounding: cellstructuremech:r_body
  edges:
  - subject: reb_proteins
    predicate: assemble into
    object: coiled_r_body
    description: R-body structural proteins assemble into coiled proteinaceous ribbons.
    evidence:
    - reference: DOI:10.1128/mbio.00715-17
      notes: Matsuoka et al. 2017 linked derepression of the Azorhizobium caulinodans
        reb operon to R-body production.
    - reference: DOI:10.1038/s41467-021-24796-0
      notes: Wang et al. 2021 connected the Pseudomonas PA14 R-body cassette with
        native R-body production.
  - subject: acid_trigger
    predicate: triggers extension of
    object: coiled_r_body
    description: Acidic pH triggers extension of the coiled R-body.
    evidence:
    - reference: DOI:10.1021/acssynbio.5b00237
      notes: Polka and Silver 2016 engineered R-bodies whose extension pH could be
        tuned.
  - subject: coiled_r_body
    predicate: extends into
    object: extended_r_body_tube
    description: The R-body coil unrolls into an elongated hollow tube.
    evidence:
    - reference: DOI:10.1021/acssynbio.5b00237
      notes: Polka and Silver 2016 imaged type 51 R-bodies extending from a coil into
        a tube.
discussions:
- discussion_id: resolve_r_body_reb_grounding
  prompt: Resolve exact source-neutral groundings and component boundaries for structural
    and assembly-associated R-body Reb proteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#reb_proteins
  rationale: The first R-body record keeps Reb proteins as a broad label-only cohort
    because Reb loci vary among Caedibacter, derepressed Azorhizobium and Pseudomonas
    PA14 systems, and this pass did not verify an exact protein-family CURIE for the
    structural ribbon constituents.
  evidence:
  - reference: DOI:10.1534/g3.112.005231
    notes: Raymann et al. 2013 surveyed divergent Reb homologs in proteobacterial
      genomes.
  - reference: DOI:10.1038/s41467-021-24796-0
    notes: Wang et al. 2021 compared polymorphic Reb proteins in the Pseudomonas PA14
      R-body cassette.
  posed_by: codex
  posed_date: '2026-09-11'
