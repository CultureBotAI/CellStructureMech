components:
- component_id: reb_proteins
  label: R-body Reb proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: R-body-producing loci encode divergent Reb proteins; no exact source-neutral
    CURIE for the structural protein cohort was verified in this pass.
  role: Protein constituents that assemble into coiled R-body ribbons.
  evidence:
  - reference: DOI:10.1128/jb.176.12.3559-3567.1994
    notes: Heruth et al. 1994 genetically characterized R-body synthesis and assembly
      determinants in Caedibacter taeniospiralis strains 47 and 116.
  - reference: DOI:10.1128/mbio.00715-17
    notes: Matsuoka et al. 2017 showed that deleting praR derepresses the Azorhizobium
      caulinodans reb operon and permits R-body production.
  - reference: DOI:10.1038/s41467-021-24796-0
    notes: Wang et al. 2021 showed that Pseudomonas aeruginosa PA14 produces extendable
      Reb-based R-bodies.
taxonomic_distribution:
- taxon_id: NCBITaxon:28907
  taxon_label: Caedibacter taeniospiralis
  presence: COMMON
  note: Caedibacter taeniospiralis strains 47 and 116 carry plasmid-borne R-body systems
    used to genetically characterize R-body synthesis and assembly.
  reference: DOI:10.1128/jb.176.12.3559-3567.1994
- taxon_id: NCBITaxon:208963
  taxon_label: Pseudomonas aeruginosa UCBPP-PA14
  presence: COMMON
  note: Pseudomonas aeruginosa PA14 carries an R-body cassette that produces extendable
    R-bodies.
  reference: DOI:10.1038/s41467-021-24796-0
canonical_examples:
- taxon_id: NCBITaxon:28907
  taxon_label: Caedibacter taeniospiralis
  note: Classical Paramecium endosymbiont species whose strains 47 and 116 were used
    to genetically characterize R-body synthesis and assembly determinants.
  reference: DOI:10.1128/jb.176.12.3559-3567.1994
- taxon_id: NCBITaxon:208963
  taxon_label: Pseudomonas aeruginosa UCBPP-PA14
  note: Opportunistic pathogen strain used to show that a native Pseudomonas Reb cassette
    produces extendable R-bodies.
  reference: DOI:10.1038/s41467-021-24796-0
functions:
- function_id: ph_triggered_r_body_extension
  label: pH-triggered R-body extension
  description: Coiled R-body ribbons can rapidly extend into hollow tubes when acidification
    triggers the conformational transition.
  evidence:
  - reference: DOI:10.1021/acssynbio.5b00237
    notes: Polka and Silver 2016 engineered and imaged type 51 R-bodies that extend
      from coiled ribbons into tubes after acidification.
evidence:
- reference: DOI:10.1128/jb.176.12.3559-3567.1994
  notes: Heruth et al. 1994, 'Characterization of genetic determinants for R body
    synthesis and assembly in Caedibacter taeniospiralis 47 and 116', Journal of Bacteriology.
- reference: DOI:10.1534/g3.112.005231
  notes: Raymann et al. 2013, 'A Genomic Survey of Reb Homologs Suggests Widespread
    Occurrence of R-Bodies in Proteobacteria', G3.
- reference: DOI:10.1021/acssynbio.5b00237
  notes: Polka and Silver 2016, 'A Tunable Protein Piston That Breaks Membranes to
    Release Encapsulated Cargo', ACS Synthetic Biology.
- reference: DOI:10.1128/mbio.00715-17
  notes: Matsuoka et al. 2017, 'Stringent Expression Control of Pathogenic R-body
    Production in Legume Symbiont Azorhizobium caulinodans', mBio.
- reference: DOI:10.1038/s41467-021-24796-0
  notes: Wang et al. 2021, 'Pseudomonas aeruginosa PA14 produces R-bodies, extendable
    sheaths formed from polymorphic proteins', Nature Communications.
causal_graphs:
- graph_id: reb_r_body_extension
  title: Reb proteins build extendable R-body ribbons
  description: Reb proteins assemble into a coiled R-body ribbon; low pH triggers
    extension of the coil into a hollow tube.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records Reb-dependent R-body assembly and pH-triggered extension
    without modeling all assembly chaperones, regulators, toxins or host-cell targets.
  nodes:
  - node_id: reb_proteins
    label: R-body Reb proteins
    node_type: GENE_OR_PROTEIN
    component_ref: reb_proteins
  - node_id: coiled_r_body
    label: coiled R-body
