taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Mitosome envelopes occur patchily in anaerobic or microaerophilic microbial
    eukaryotes that retain highly reduced double-membrane mitochondrion-related organelles.
  reference: DOI:10.1111/jeu.12922
- taxon_id: NCBITaxon:5759
  taxon_label: Entamoeba histolytica
  presence: COMMON
  note: The Entamoeba mitochondrion-related mitosome was identified as a double-membrane
    organelle.
  reference: DOI:10.1046/j.1365-2958.1999.01414.x
canonical_examples:
- taxon_id: NCBITaxon:5759
  taxon_label: Entamoeba histolytica
  note: Amoebozoan parasite in which mitosomes were initially described as mitochondrion-related
    double-membrane organelles.
  reference: DOI:10.1046/j.1365-2958.1999.01414.x
functions:
- function_id: mitosome_compartmentalization
  label: mitosome compartmentalization
  description: The mitosome envelope surrounds the reduced organelle and separates
    the matrix from the cytosol.
  evidence:
  - reference: uniprot.location:SL-0438
    notes: UniProt SL-0438 defines the mitosome envelope as the inner and outer mitosomal
      membranes plus intermembrane space.
  - reference: DOI:10.1046/j.1365-2958.1999.01414.x
    notes: Tovar et al. 1999 identified a double-membrane mitochondrion-related mitosome
      in Entamoeba histolytica.
- function_id: mitosomal_protein_import_boundary
  label: mitosomal protein import boundary
  description: The mitosome envelope is the double-membrane boundary crossed by nuclear-encoded,
    N-terminally targeted mitosomal proteins.
  evidence:
  - reference: DOI:10.1073/pnas.0500349102
    notes: Dolezal et al. 2005 tested Giardia mitosomal protein targeting and compared
      the import mode with hydrogenosomes.
  - reference: DOI:10.1038/nature01945
    notes: Tovar et al. 2003 localized nuclear-encoded ISC proteins to Giardia mitosomes.
evidence:
- reference: uniprot.location:SL-0438
  notes: UniProt Subcellular Location entry SL-0438 identifies the mitosome envelope,
    lists mitosomal envelope as an exact synonym, and places the envelope under the
    mitosome location.
- reference: uniprot.location:SL-0439
  notes: UniProt Subcellular Location entry SL-0439 identifies the mitosome inner
    membrane as a child of the mitosome membrane.
- reference: uniprot.location:SL-0440
  notes: UniProt Subcellular Location entry SL-0440 identifies the mitosome intermembrane
    space as the space between inner and outer mitosomal membranes.
- reference: uniprot.location:SL-0443
  notes: UniProt Subcellular Location entry SL-0443 identifies the mitosome outer
    membrane as a child of the mitosome membrane.
- reference: GO:0031967
  notes: Gene Ontology cellular-component parent term for organelle envelope.
- reference: GO:0032047
  notes: Gene Ontology cellular-component term for the containing mitosome.
- reference: DOI:10.1046/j.1365-2958.1999.01414.x
  notes: Tovar et al. 1999, The mitosome, a novel organelle related to mitochondria
    in the amitochondrial parasite Entamoeba histolytica, Molecular Microbiology.
- reference: DOI:10.1038/nature01945
  notes: Tovar et al. 2003, Mitochondrial remnant organelles of Giardia function in
    iron-sulphur protein maturation, Nature.
- reference: DOI:10.1073/pnas.0500349102
  notes: Dolezal et al. 2005, Giardia mitosomes and trichomonad hydrogenosomes share
    a common mode of protein targeting, Proceedings of the National Academy of Sciences.
- reference: DOI:10.1111/jeu.12922
  notes: 'Tachezy 2022, Hydrogenosomes and mitosomes: Mitochondria of anaerobic eukaryotes,
    Journal of Eukaryotic Microbiology.'
