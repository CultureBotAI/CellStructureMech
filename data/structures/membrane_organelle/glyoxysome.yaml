discussions:
- discussion_id: exclude_glyoxylate_cycle_matrix_enzymes
  prompt: Decide whether individual glyoxylate-cycle enzymes belong in the glyoxysome
    component table.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - functions#glyoxylate_cycle
  - causal_graphs#glyoxysome_glyoxylate_cycle_compartment
  rationale: Isocitrate lyase, malate synthase and related glyoxylate-cycle enzymes
    are matrix cargo rather than structural constituents of the glyoxysome membrane-bounded
    compartment.
  evidence:
  - reference: GO:0009514
    notes: GO defines glyoxysomes by the presence of glyoxylate-pathway enzymes.
  - reference: DOI:10.1007/BF00309930
    notes: de Zoysa and Connerton 1994 studied matrix targeting of proteins into Neurospora
      glyoxysomes.
  posed_by: codex
  posed_date: '2026-09-12'
  resolved_date: '2026-09-12'
  resolution_note: Matrix metabolic enzymes were left out of components because they
    are functional cargo, not the physical boundary of the organelle.
