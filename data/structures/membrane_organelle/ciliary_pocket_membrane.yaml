- discussion_id: ciliary_pocket_membrane_boundary
  prompt: Keep the ciliary pocket membrane distinct from the whole flagellar pocket
    and from the cytoskeletal pocket collar.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: GO:0020018 denotes the specialized plasma-membrane domain lining the
    ciliary or flagellar pocket, GO:0020016 denotes the complete ciliary pocket invagination,
    and GO:1990900 denotes the collar complex at the pocket neck.
  resolution_note: Curated GO:0020018 as the exact pocket-membrane domain and used
    GO:0020016 for whole-pocket parthood.
  evidence:
