causal_graphs:
- graph_id: thylakoid_lumen_mechanism
  title: Thylakoid lumen proton accumulation, plastocyanin shuttling, and photoprotective
    qE
  description: Photosystem II water splitting and cytochrome b6f Q-cycle turnover
    acidify the thylakoid lumen while plastocyanin shuttles electrons in the lumen
    to Photosystem I, powering CF0CF1 ATP synthesis and triggering ΔpH-dependent non-photochemical
    quenching.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the defining thylakoid-lumen boundary without asserting
    lumenal proteins or photosynthetic proton transport mechanisms.
