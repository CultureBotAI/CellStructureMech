identifier: GO:0031977
label: thylakoid lumen
structure_category: MEMBRANE_ORGANELLE
structure_kind: SUBCELLULAR_REGION
definition: The volume enclosed by a thylakoid membrane. The continuous aqueous compartment
  enclosed by the thylakoid membrane in cyanobacteria and plastid-bearing eukaryotic
  microalgae (such as Chlamydomonas reinhardtii and diatoms). During oxygenic photosynthesis,
  water oxidation by the lumenal oxygen-evolving complex of Photosystem II and plastoquinol
  oxidation by cytochrome b6f pump protons into the thylakoid lumen, generating the
  acidic ΔpH that drives ATP synthase and housing soluble electron carrier plastocyanin
  (or cytochrome c6).
