identifier: GO:0032009
label: early phagosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded intracellular vesicle as initially formed upon the
  ingestion of particulate material by phagocytosis. A newly formed phagocytic vacuole
  generated immediately after phagocytic cup closure in phagotrophic protists and
  amoebae such as Dictyostelium discoideum and Entamoeba histolytica. The early phagosome
  retains plasma membrane lipids and early endosomal Rab5/Rab7 GTPases while initiating
  V-ATPase recruitment prior to lysosome fusion.
