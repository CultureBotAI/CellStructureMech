causal_graphs:
- graph_id: early_phagosome_mechanism
  title: Early phagosome formation and initial V-ATPase recruitment
  description: Actin-driven phagocytic cup closure produces the early phagosome, which
    sheds its F-actin coat and recruits V-type proton ATPase complexes to initiate
    luminal acidification before maturing into a phagolysosome.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the whole-vesicle, membrane, lumen, and maturation
    relationships without asserting a specific cargo set or treating transient Rab,
    proton-pump, protease, or actin machinery as stable phagocytic-vesicle constituents.
