functions:
- function_id: phagocytosis
  label: phagocytosis
  grounding: GO:0006909
  description: Phagocytic vesicles enclose extracellular particles taken up by phagocytosis.
  evidence:
  - reference: GO:0006909
    notes: GO:0006909 defines phagocytosis as vesicle-mediated transport that engulfs
      external particulate material.
  - reference: GO:0045335
    notes: GO:0045335 defines phagocytic vesicles as membrane-bounded vesicles that
      arise from ingestion by phagocytosis.
- function_id: phagosome_maturation
  label: phagosome maturation
  grounding: GO:0090382
  description: Newly formed phagocytic vesicles mature through ordered membrane-traffic
    and luminal changes toward late digestive compartments.
  evidence:
  - reference: GO:0090382
    notes: GO:0090382 defines phagosome maturation as cellular rearrangement of phagosome
      constituent parts after early phagosome formation.
  - reference: PMID:12388753
    notes: Gotthardt et al. 2002 dissected the maturation of Dictyostelium phagosomes
      into stages with distinct membrane-trafficking and luminal-acidification behavior.
  - reference: PMID:16926386
    notes: Gotthardt et al. 2006 used two-dimensional gel electrophoresis and mass
      spectrometry to fingerprint Dictyostelium phagosome protein dynamics across
      maturation.
