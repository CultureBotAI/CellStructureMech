  label: phagocytic vesicle lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Lipid-bilayer material that forms the phagocytic vesicle membrane boundary
    around ingested particulate cargo. Functions during early phagosome formation
    and initial maturation in early phagosome.
  evidence:
  - reference: GO:0030670
    notes: GO:0030670 identifies the phagocytic vesicle membrane surrounding a phagocytic
      vesicle.
  - reference: uniprot.location:SL-0206
    notes: UniProt Subcellular Location SL-0206 identifies the phagosome as a phagocytic
      cell-specific membrane-bounded vesicle formed after uptake of extracellular
      material.
  grounding_status: REVIEWED_LABEL_ONLY
