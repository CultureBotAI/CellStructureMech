discussions:
- discussion_id: leave_micos_as_crista_machinery
  prompt: Should MICOS be duplicated as a component of the mitochondrial crista junction
    record?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#yeast_crista_junction_topology
  rationale: MICOS is curated as associated architecture machinery on the whole mitochondrial
    crista record. This crista-junction record keeps the junction as a membrane region
    and uses MICOS only as maintenance machinery in the nonmechanistic graph.
  evidence:
  - reference: GO:0061617
    notes: GO defines MICOS as a mitochondrial inner membrane complex involved in
      maintenance of crista junctions.
  - reference: DOI:10.7554/elife.07739
    notes: Friedman et al. 2015 localize budding-yeast MICOS subcomplex behavior to
      crista-junction positioning and abundance.
