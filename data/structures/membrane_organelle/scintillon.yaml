- component_id: luciferin_binding_protein
  label: dinoflagellate luciferin-binding protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The inspected UniProt LBP entries Q39909, Q39910, Q39911 and Q39913
    map to the shared N-terminal domain IPR007959/PF05295. That domain also occurs
    in luciferase and does not identify the complete LBP family. Q39912 resolves to
    luciferase O77206 and is not an LBP example.
  role: Binds luciferin at higher pH and releases it on acidification in the studied
    organism.
  evidence:
  - reference: DOI:10.1371/journal.pone.0171594
    notes: Figure 7 localizes LBP in isolated scintillons.
