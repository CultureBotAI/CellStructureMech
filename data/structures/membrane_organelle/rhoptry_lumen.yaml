discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the rhoptry membrane as the boundary of the rhoptry lumen rather than
    as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#rhoptry_lumen_topology
  rationale: GO:0034591 denotes the volume enclosed by the rhoptry membrane, whereas
    GO:0033016 denotes the lipid bilayer surrounding a rhoptry.
  resolution_note: Represented GO:0033016 as the boundary node in the topology graph
    and left the lumen record without constituent components.
  evidence:
  - reference: GO:0034591
    notes: GO:0034591 identifies the rhoptry lumen.
  - reference: GO:0033016
    notes: GO:0033016 identifies the membrane that bounds the rhoptry lumen.
