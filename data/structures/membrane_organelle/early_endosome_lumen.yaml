  label: early endosome lumen cargo compartment
  description: The early endosome lumen is the membrane-enclosed volume inside the
    early endosome through which newly internalized endocytic cargo is routed.
  evidence:
  - reference: GO:0031905
    notes: GO:0031905 defines the early endosome lumen as the volume enclosed by the
      membrane of an early endosome.
  - reference: GO:0005769
    notes: GO:0005769 defines early endosomes as receiving incoming material from
      primary endocytic vesicles for sorting toward recycling or degradation pathways.
  - reference: DOI:10.1078/0171-9335-00112
    notes: Porto-Carreiro et al. 2000 traced T. cruzi epimastigote cargo through an
      early endosomal network before reservosome storage.
