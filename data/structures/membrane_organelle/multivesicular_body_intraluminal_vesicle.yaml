      notes: GO:0005771 defines the multivesicular body by the presence of internal
        vesicles.
discussions:
- discussion_id: ground_intraluminal_vesicle_lipid_bilayer
  prompt: Resolve an exact source-neutral grounding for the lipid bilayer of multivesicular-body
    intraluminal vesicles.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#intraluminal_vesicle_lipid_bilayer
  rationale: The record is grounded as an intraluminal-vesicle substructure of the
    multivesicular body, but this pass did not curate a separate CURIE for the membrane
    lipid constituent of one vesicle.
  evidence:
  - reference: GO:0005771
    notes: GO:0005771 defines the internal vesicles of a multivesicular body.
  posed_by: codex
  posed_date: '2026-09-23'
- discussion_id: escrt_machinery_not_ilv_components
  prompt: Keep ESCRT complexes and cargo-recognition factors out of the multivesicular-body
    intraluminal vesicle component list.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#yeast_escrt_mvb_intraluminal_vesicle_formation
  rationale: ESCRT machinery sorts cargo and drives limiting-membrane remodeling during
    intraluminal-vesicle formation, but it is modeled as assembly machinery rather
    than as a stable molecular constituent of the resulting vesicle.
  resolution_note: Curated ESCRT-III as an assembly graph node and excluded ESCRT
    machinery from the component list.
  evidence:
  - reference: PMID:12194857
    notes: Babst et al. 2002 characterized ESCRT-III as a complex required for MVB
      sorting.
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed ESCRT proteins as machinery for
      the endosomal sorting pathway.
