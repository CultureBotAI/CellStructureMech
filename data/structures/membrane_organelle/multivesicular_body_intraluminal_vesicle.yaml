identifier: cellstructuremech:multivesicular_body_intraluminal_vesicle
label: multivesicular body intraluminal vesicle
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded vesicle inside a multivesicular body that forms when
  the limiting endosomal membrane buds inward and pinches into the lumen during multivesicular
  body sorting.
definition_source: DOI:10.1016/j.devcel.2011.05.015
mapping_status: PROPOSED
curation_history:
