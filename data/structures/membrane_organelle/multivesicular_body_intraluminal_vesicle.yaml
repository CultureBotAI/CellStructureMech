components:
- component_id: intraluminal_vesicle_lipid_bilayer
  label: intraluminal vesicle lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Lipid-bilayer constituent that buds from the multivesicular-body limiting
    membrane to enclose each intraluminal vesicle.
  evidence:
  - reference: GO:0005771
    notes: GO:0005771 defines multivesicular bodies as endosomes with internal vesicles
      formed by invagination of the limiting endosomal membrane.
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed intraluminal vesicle formation
      as inward budding of the endosomal limiting membrane in the ESCRT pathway.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0005771 defines the complete multivesicular body by internal
    vesicles, but no exact source-neutral CURIE was curated for the generic lipid
    bilayer of one intraluminal vesicle.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding yeast forms multivesicular-body intraluminal vesicles during ESCRT-dependent
    sorting of ubiquitinated membrane cargo.
  reference: PMID:11511343
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Genetic model for ESCRT-dependent sorting at endosomal membranes and formation
    of intraluminal vesicles in multivesicular bodies.
  reference: PMID:12194857
functions:
- function_id: multivesicular_body_sorting_pathway
  label: multivesicular body sorting pathway
  grounding: GO:0071985
  description: Multivesicular-body intraluminal vesicles receive ubiquitinated transmembrane
    cargo from the limiting endosomal membrane and sequester it inside the multivesicular-body
    lumen.
  evidence:
  - reference: GO:0071985
    notes: GO:0071985 denotes the multivesicular body sorting pathway that targets
      ubiquitylated transmembrane proteins into luminal vesicles.
  - reference: PMID:11511343
    notes: Katzmann, Babst and Emr 2001 identified ESCRT-I as a conserved yeast endosomal
      protein-sorting complex needed for ubiquitin-dependent MVB cargo sorting.
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed the ESCRT pathway as a route that
      sorts endosomal cargo into intraluminal vesicles for lysosomal or vacuolar degradation.
evidence:
- reference: GO:0031982
  notes: Gene Ontology cellular-component term for the broader vesicle class.
- reference: GO:0005771
  notes: Gene Ontology cellular-component term for multivesicular bodies, defined
    by internal vesicles formed by limiting-membrane invagination.
- reference: GO:0032585
  notes: Gene Ontology cellular-component term for the multivesicular body membrane
    that buds inward to generate intraluminal vesicles.
- reference: GO:0071985
  notes: Gene Ontology biological-process term for the multivesicular body sorting
    pathway.
- reference: PMID:11511343
  notes: Katzmann, Babst and Emr 2001, Ubiquitin-Dependent Sorting into the Multivesicular
    Body Pathway Requires the Function of a Conserved Endosomal Protein Sorting Complex,
    ESCRT-I, Cell.
- reference: PMID:12194857
  notes: Babst, Katzmann, Estepa-Sabal, Meerloo and Emr 2002, ESCRT-III, Developmental
    Cell.
- reference: DOI:10.1016/j.devcel.2011.05.015
  notes: Henne, Buchkovich and Emr 2011, The ESCRT Pathway, Developmental Cell.
causal_graphs:
- graph_id: yeast_escrt_mvb_intraluminal_vesicle_formation
  title: ESCRT machinery forms multivesicular-body intraluminal vesicles
  description: In Saccharomyces cerevisiae, ESCRT-III remodels the multivesicular-body
    limiting membrane so it buds inward and forms intraluminal vesicles in the multivesicular-body
    lumen.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph grounds the vesicle-formation boundary without asserting
    a full sequence of Vps27/Hse1 cargo recognition, ESCRT handoff, Doa4 deubiquitination,
    Vps4 recycling, or vacuolar fusion.
