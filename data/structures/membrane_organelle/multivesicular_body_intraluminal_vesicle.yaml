  curator: codex
  action: EXPANDED_RECORD
  changes: Added vesicle parentage, multivesicular-body parthood, a reviewed-label-only
    lipid-bilayer component, budding-yeast scope, GO/PMID/DOI evidence, a nonmechanistic
    ESCRT intraluminal-vesicle formation graph, and lipid and ESCRT component-boundary
    discussions.
  llm_assisted: true
parent_structures:
