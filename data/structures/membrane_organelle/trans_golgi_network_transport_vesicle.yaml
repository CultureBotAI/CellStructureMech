identifier: GO:0030140
label: trans-Golgi network transport vesicle
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A vesicle that mediates transport between the trans-Golgi network and
  other parts of the cell. A membrane-bounded transport vesicle that buds from the
  trans-Golgi network (TGN) to sort and deliver biosynthetic secretory and endolysosomal
  cargo to the plasma membrane, endosomes, or vacuole in yeasts, filamentous fungi,
  and protists. Vesicle biogenesis is driven by Arf1 GTPase activation, clathrin/adaptor
  or exomer coat assembly, and phosphatidylinositol-4-phosphate signaling.
