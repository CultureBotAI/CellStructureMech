- component_id: cvt_complex
  label: Cvt complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0034270
  essentiality: UNKNOWN
  role: Selective vacuolar-hydrolase cargo complex that is sequestered into forming
    Cvt vesicles for vacuolar delivery.
  evidence:
  - reference: GO:0034270
    notes: GO:0034270 defines the budding-yeast Cvt complex as a protein complex of
      preApe1p multimers involved in the Cvt pathway.
  - reference: DOI:10.1074/jbc.M404399200
    notes: Shintani and Klionsky 2004 analyzed Cvt complex cargo and its effect on
      Cvt vesicle formation.
