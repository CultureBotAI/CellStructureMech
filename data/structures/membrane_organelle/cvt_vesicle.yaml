functions:
- function_id: cytoplasm_to_vacuole_targeting
  label: cytoplasm to vacuole targeting by the Cvt pathway
  grounding: GO:0032258
  description: Cvt vesicles selectively enclose vacuolar hydrolase cargo and deliver
    it from the cytoplasm to the fungal vacuole.
  evidence:
  - reference: GO:0032258
    notes: GO:0032258 defines Cvt-pathway delivery by Atg19-dependent formation of
      a Cvt complex and membrane expansion around it.
  - reference: DOI:10.1016/s1097-2765(01)00263-5
    notes: Scott et al. 2001 identified Cvt19/Atg19 as the receptor that links precursor
      aminopeptidase I cargo to the Cvt pathway.
