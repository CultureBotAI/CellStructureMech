discussions:
- discussion_id: generic_plastid_boundary
  prompt: Keep lineage-specific thylakoid, envelope, membrane-count, and nucleomorph
    assertions on exact plastid child records.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#plastid_topology
  rationale: GO:0009536 spans primary plastids, secondary plastids, and non-photosynthetic
    plastids. The generic record therefore models the common membrane-bounded plastid/stroma
    topology and leaves specialized thylakoids, double envelopes, and retained nucleomorphs
    to exact child records.
  resolution_note: Curated only the generic GO:0042170 membrane boundary and GO:0009532
    stroma in this plastid record.
  evidence:
  - reference: GO:0009536
    notes: GO:0009536 denotes the broad plastid organelle family.
  - reference: uniprot.location:SL-0209
    notes: UniProt SL-0209 includes photosynthetic and non-photosynthetic plastids.
  posed_by: codex
  posed_date: '2026-09-13'
