identifier: GO:0005635
label: nuclear envelope
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: The double lipid bilayer that encloses the nucleus, separating its contents
  from the cytoplasm. It consists of an inner and outer nuclear membrane, with an
  intermembrane space (20-40 nm wide, also called the perinuclear space) between them.
  The envelope is supported by the nuclear lamina and contains nuclear pore complexes,
  which regulate molecular transport.
