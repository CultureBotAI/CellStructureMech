- component_id: mitochondrial_inner_membrane
  label: mitochondrial inner membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0005743
  essentiality: UNKNOWN
  role: Lumen-facing lipid bilayer of the mitochondrial envelope that folds into cristae
    and separates the matrix from the intermembrane space.
  evidence:
  - reference: GO:0005743
    notes: GO:0005743 defines the mitochondrial inner membrane as the lumen-facing
      folded bilayer of the envelope.
- component_id: tom_complex
  label: mitochondrial outer membrane translocase complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005742
  essentiality: UNKNOWN
  role: Outer-membrane protein translocase that imports most nuclear-encoded mitochondrial
    precursor proteins into or across the mitochondrial outer membrane.
  evidence:
  - reference: GO:0005742
    notes: GO:0005742 defines the TOM complex as a large outer membrane complex that
      mediates protein transport into mitochondrial compartments.
  - reference: DOI:10.1016/j.cell.2009.08.005
    notes: Chacinska et al. 2009 review mitochondrial protein import through TOM and
      downstream sorting machineries.
