causal_graphs:
- graph_id: yeast_mitochondrial_envelope_and_import
  title: Mitochondrial envelope gates protein import
  description: In budding yeast, inner and outer mitochondrial envelope membranes
    delimit the matrix, and the TOM complex provides the outer-membrane entry point
    for imported proteins.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures envelope topology and TOM-dependent import at a
    compartment level without asserting the full respiratory chain, TIM/PAM translocases,
    or matrix enzyme repertoire.
