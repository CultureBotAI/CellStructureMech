  component_role: CONSTITUENT
  grounding: GO:0005741
  essentiality: UNKNOWN
  role: Cytoplasm-facing lipid bilayer of the mitochondrial envelope and outer-membrane
    platform for the TOM import complex.
  evidence:
  - reference: GO:0005741
    notes: GO:0005741 defines the mitochondrial outer membrane as the cytoplasm-facing
