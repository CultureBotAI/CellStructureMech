functions:
- function_id: oxidative_phosphorylation
  label: oxidative phosphorylation
  grounding: GO:0006119
  description: Mitochondrial respiratory-chain activity across the inner membrane
    contributes to ATP synthesis by oxidative phosphorylation.
  evidence:
  - reference: GO:0006119
    notes: GO:0006119 defines oxidative phosphorylation as ATP formation coupled to
      respiratory-chain oxidation and membrane-gradient formation.
  - reference: DOI:10.1073/pnas.2135385100
    notes: Sickmann et al. 2003 recovered known oxidative phosphorylation machinery
      from purified budding-yeast mitochondria.
- function_id: protein_import_into_mitochondrial_matrix
  label: protein import into mitochondrial matrix
  grounding: GO:0030150
  description: TOM and downstream inner-membrane and matrix machinery import precursor
    proteins from the cytosol into the mitochondrial matrix.
  evidence:
  - reference: GO:0030150
    notes: GO:0030150 defines matrix protein import from the cytosol via TOM-TIM23-PAM.
  - reference: DOI:10.1016/j.cell.2009.08.005
    notes: Chacinska et al. 2009 review TOM entry and downstream TIM/PAM mitochondrial
      protein-import pathways.
