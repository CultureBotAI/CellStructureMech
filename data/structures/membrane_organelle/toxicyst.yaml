components:
- component_id: toxicyst_membrane
  label: toxicyst membrane
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact cellular-component term was found for a ciliate toxicyst
    or toxicyst membrane in GO or OLS during this curation pass.
  role: Membrane envelope that bounds the resting toxicyst and can fuse with the plasma
    membrane during toxicyst discharge.
  evidence:
  - reference: DOI:10.1186/s12915-024-01904-2
    notes: Chen et al. 2024 reviewed toxicyst ultrastructure and discharge models
      involving the toxicyst membrane.
- component_id: toxic_discharge_material
  label: toxicyst toxic discharge material
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Coleps toxicyst discharge contains a mixture of free fatty acids
    and a minor phytanic-acid component; the precise toxicyst cargo and its conserved
    source-neutral small-molecule boundaries remain unresolved.
  role: Toxic material released by the toxicyst discharge and implicated in chemical
    offense against prey ciliates.
  evidence:
  - reference: DOI:10.1111/jeu.12106
    notes: Buonanno et al. 2014 isolated toxicyst discharge from living Coleps hirtus
      and analyzed its free fatty acid-rich composition by liquid chromatography-electrospray
      mass spectrometry and gas chromatography-mass spectrometry.
taxonomic_distribution:
- taxon_id: NCBITaxon:197905
  taxon_label: Haptoria
  presence: COMMON
  note: Raptorial haptorian ciliates carry oral toxicysts, and long type I toxicysts
    are described as consistently present across Haptoria.
  reference: DOI:10.1186/s12915-024-01904-2
- taxon_id: NCBITaxon:60000
  taxon_label: Coleps hirtus
  presence: COMMON
  note: Coleps hirtus cells carry toxicysts that cluster mainly in and around the
    oral aperture and assist carnivorous feeding.
  reference: DOI:10.1111/jeu.12106
canonical_examples:
- taxon_id: NCBITaxon:60000
  taxon_label: Coleps hirtus
  note: Freshwater ciliate in which toxicyst discharge material was isolated from
    living cells and tested for cytotoxic effects against other ciliates.
  reference: DOI:10.1111/jeu.12106
functions:
- function_id: prey_immobilization
  label: prey immobilization
  description: Toxicysts rapidly discharge during ciliate predation and release toxic
    material that helps immobilize prey.
  evidence:
  - reference: DOI:10.1111/jeu.12106
    notes: Buonanno et al. 2014 tested the cytotoxic effects of Coleps hirtus toxicyst
      discharge and connected it to effective predatory behavior.
  - reference: DOI:10.1186/s12915-024-01904-2
    notes: Chen et al. 2024 observed raptorial haptorian ciliates using toxicysts
      near the oral apparatus during predation.
evidence:
- reference: DOI:10.1186/s12915-024-01904-2
  notes: Chen et al. 2024, Genomic insights into the cellular specialization of predation
    in raptorial protists, BMC Biology.
- reference: DOI:10.1111/jeu.12106
  notes: Buonanno et al. 2014, Chemical offense by means of toxicysts in the freshwater
    ciliate, Coleps hirtus, Journal of Eukaryotic Microbiology.
