identifier: cellstructuremech:toxicyst
label: toxicyst
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A ciliate offensive extrusome that stores toxic discharge material and
  ejects on prey contact to immobilize prey during raptorial feeding.
definition_source: DOI:10.1186/s12915-024-01904-2
mapping_status: PROPOSED
