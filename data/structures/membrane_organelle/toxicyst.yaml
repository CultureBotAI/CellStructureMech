discussions:
- discussion_id: resolve_toxicyst_toxin_groundings
  prompt: Resolve exact small-molecule and biosynthetic boundaries for toxicyst toxic
    discharge material.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#toxic_discharge_material
  - causal_graphs#toxicyst_predatory_discharge
  rationale: Coleps discharge contains several free fatty acids and a minor amount
    of phytanic acid, while haptorian genomes are enriched for candidate toxin-related
    PKS and L-amino acid oxidase genes; this first record therefore leaves the toxic
    material aggregated until exact secreted molecules are localized to toxicysts.
  evidence:
  - reference: DOI:10.1111/jeu.12106
  - reference: DOI:10.1186/s12915-024-01904-2
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: omit_candidate_toxin_genes_as_components
  prompt: Do not curate haptorian PKS or L-amino acid oxidase expansions as mature
    toxicyst components without direct toxicyst localization.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#toxic_discharge_material
  rationale: Chen et al. 2024 identified PKS and L-amino acid oxidase genes as duplicated
    candidate toxin genes in Haptoria, but those genes were not resolved as mature
    structural cargo or membrane constituents of the toxicyst organelle.
  evidence:
  - reference: DOI:10.1186/s12915-024-01904-2
    notes: Chen et al. 2024 proposed PKS and L-amino acid oxidase gene families as
      candidate toxin genes after comparative genomic and transcriptomic analyses.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
