discussions:
- discussion_id: generic_plastid_envelope_scope
  prompt: Keep lineage-specific protein translocases, peptidoglycan, and extra complex-plastid
    membranes on exact child records.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#plastid_envelope_topology
  rationale: GO:0009526 and UniProt SL-0210 model the primary double plastid envelope
    as inner membrane, intermembrane space, and outer membrane. Chloroplast, cyanelle,
    chromatophore, and complex plastid lineages can add specific translocases, peptidoglycan
    layers, retained outer membranes, or additional host-derived membranes in exact
    child records.
  resolution_note: Curated only generic GO inner-membrane, outer-membrane, and intermembrane-space
    topology in this record.
  evidence:
  - reference: GO:0009526
    notes: GO:0009526 defines the generic plastid envelope as a double lipid bilayer.
  - reference: uniprot.location:SL-0210
    notes: UniProt SL-0210 defines the plastid envelope as the inner and outer plastid
      membrane plus the intermembrane space.
