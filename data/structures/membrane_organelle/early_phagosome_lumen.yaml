identifier: GO:0062113
label: early phagosome lumen
structure_category: MEMBRANE_ORGANELLE
structure_kind: SUBCELLULAR_REGION
definition: The volume enclosed by the membrane of an early phagosome. In phagotrophic
  amoebae (Dictyostelium discoideum, Entamoeba histolytica) and ciliates, the early
  phagosome lumen encloses newly engulfed bacterial or particulate prey at near-neutral
  pH prior to V-ATPase-mediated acidification and lysosomal hydrolase delivery.
