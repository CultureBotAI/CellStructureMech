  label: chloroplast thylakoid lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Pigmented chloroplast thylakoid lipid bilayer that bounds the thylakoid lumen
    and houses photosynthetic light-reaction complexes.
  evidence:
  - reference: GO:0009535
    notes: GO:0009535 defines the chloroplast thylakoid membrane as the pigmented
      membrane of a chloroplast thylakoid.
  - reference: uniprot.location:SL-0058
    notes: UniProt SL-0058 maps directly to GO:0009535 and describes the membrane
      as an internal system carrying photosynthetic light reactions.
  - reference: GO:0009543
    notes: GO:0009543 defines the chloroplast thylakoid lumen as the volume enclosed
      by the chloroplast thylakoid membrane.
  - reference: uniprot.location:SL-0057
    notes: UniProt SL-0057 maps the chloroplast thylakoid lumen to the child compartment
      bounded by chloroplast thylakoid membranes.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0009535 and UniProt SL-0058 identify the whole chloroplast thylakoid
    membrane, but no separate source-neutral CURIE was curated for the lipid constituent
    of that membrane.
