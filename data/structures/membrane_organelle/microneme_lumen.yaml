discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the microneme membrane as the boundary of the microneme lumen rather
    than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#microneme_lumen_topology
  rationale: GO:0034494 denotes the volume enclosed by the microneme membrane, whereas
    GO:0033163 denotes the lipid bilayer surrounding a microneme.
  resolution_note: Represented GO:0033163 as the boundary node in the topology graph
    and left the lumen record without constituent components.
  evidence:
  - reference: GO:0034494
    notes: GO:0034494 identifies the microneme lumen.
  - reference: GO:0033163
    notes: GO:0033163 identifies the membrane that bounds the microneme lumen.
