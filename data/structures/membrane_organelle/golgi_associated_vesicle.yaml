    evidence:
    - reference: GO:0035964
      notes: GO:0035964 defines COPI-coated vesicle budding as evagination of a Golgi
        membrane to form a COPI-coated vesicle.
    - reference: DOI:10.1016/0092-8674(91)90176-y
      notes: Serafini et al. 1991 analyzed Arf and coat proteins on Golgi-derived
        COP-coated vesicles.
  - subject: copi_coated_vesicle
    predicate: is a
    object: golgi_associated_vesicle
    description: COPI-coated vesicles are Golgi-associated vesicles.
    evidence:
    - reference: GO:0030137
      notes: GO:0030137 identifies COPI-coated vesicles as a child class of GO:0005798
