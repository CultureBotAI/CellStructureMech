    - reference: GO:0005798
      notes: GO:0005798 denotes the parent Golgi-associated vesicle class.
  - subject: copi_coated_vesicle
    predicate: participates in
    object: golgi_to_er_retrograde_transport
    description: COPI-coated Golgi-associated vesicles are retrograde Golgi-to-ER
      transport carriers.
    evidence:
