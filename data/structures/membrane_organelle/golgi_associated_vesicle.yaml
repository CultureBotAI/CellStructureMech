    evidence:
    - reference: GO:0030660
      notes: GO:0030660 identifies the membrane surrounding a Golgi-associated vesicle.
    - reference: GO:0005798
      notes: GO:0005798 identifies the containing Golgi-associated vesicle.
  - subject: golgi_membrane
    predicate: evaginates into
    object: copi_coated_vesicle
    description: COPI-coated vesicle budding forms Golgi-associated COPI-coated vesicles
