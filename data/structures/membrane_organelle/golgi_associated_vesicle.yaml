causal_graphs:
- graph_id: golgi_associated_vesicle_topology
  title: Golgi-associated vesicle topology
  description: A Golgi-associated vesicle is bounded by a vesicle membrane and includes
    COPI-coated vesicle children that bud from Golgi membrane for retrograde traffic.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the broad Golgi-associated vesicle boundary and
    a curated COPI-coated child route without asserting that every Golgi-associated
    vesicle is COPI coated, and without duplicating individual coatomer subunits or
    Arf-family GTPases.
  nodes:
  - node_id: golgi_membrane
    label: Golgi membrane
    node_type: STRUCTURE
    grounding: GO:0000139
  - node_id: golgi_associated_vesicle_membrane
    label: Golgi-associated vesicle membrane
    node_type: STRUCTURE
    grounding: GO:0030660
    component_ref: golgi_associated_vesicle_membrane
  - node_id: golgi_associated_vesicle
    label: Golgi-associated vesicle
    node_type: ORGANELLE
    grounding: GO:0005798
  - node_id: copi_coated_vesicle
    label: COPI-coated vesicle
    node_type: ORGANELLE
    grounding: GO:0030137
  - node_id: golgi_to_er_retrograde_transport
    label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006890
  edges:
  - subject: golgi_associated_vesicle_membrane
    predicate: is part of
    object: golgi_associated_vesicle
    description: The Golgi-associated vesicle membrane is the membrane part of a Golgi-associated
