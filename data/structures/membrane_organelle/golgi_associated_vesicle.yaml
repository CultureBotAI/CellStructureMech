      notes: GO:0006890 denotes retrograde vesicle-mediated transport from the Golgi
        apparatus to the ER.
    - reference: DOI:10.1016/0092-8674(94)90011-6
      notes: Letourneur et al. 1994 linked yeast coatomer function to retrieval of
        dilysine-tagged proteins to the ER.
discussions:
- discussion_id: keep_copi_subunits_on_child_coat_records
  prompt: Keep coatomer, Arf-family GTPases, and other subtype-specific coat proteins
    off the broad Golgi-associated vesicle record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#golgi_associated_vesicle_topology
  rationale: GO:0005798 is a broad Golgi-associated vesicle parent term, whereas GO:0030137
    COPI-coated vesicles, GO:0030126 COPI vesicle coats, and other child or coat records
    carry exact coat architectures.
  resolution_note: Added the Golgi-associated vesicle membrane as the direct whole-vesicle
    part and used COPI only as a curated child example.
  evidence:
  - reference: GO:0005798
    notes: GO:0005798 denotes the broad Golgi-associated vesicle class.
  - reference: GO:0030137
    notes: GO:0030137 identifies the COPI-coated vesicle child class.
  - reference: GO:0030126
    notes: GO:0030126 identifies the COPI vesicle coat part.
