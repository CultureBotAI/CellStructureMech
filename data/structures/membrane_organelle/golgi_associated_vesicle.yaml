functions:
- function_id: golgi_associated_vesicle_transport
  label: Golgi-associated vesicle transport
  description: Golgi-associated vesicles mediate membrane traffic within the Golgi
    apparatus and between the Golgi apparatus and other cellular compartments.
  evidence:
  - reference: GO:0005798
    notes: GO:0005798 defines Golgi-associated vesicles as vesicles that mediate transport
      within the Golgi or between the Golgi and other parts of the cell.
  - reference: GO:0006890
    notes: GO:0006890 denotes retrograde vesicle-mediated transport from the Golgi
      apparatus to the endoplasmic reticulum.
  - reference: DOI:10.1016/0092-8674(94)90011-6
    notes: Letourneur et al. 1994 demonstrated that yeast coatomer mutants impair
      retrieval of dilysine-tagged proteins to the ER.
