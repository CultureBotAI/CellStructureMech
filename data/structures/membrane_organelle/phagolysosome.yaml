identifier: GO:0032010
label: phagolysosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded intracellular vesicle formed by maturation of an early
  phagosome following the ingestion of particulate material by phagocytosis; during
  maturation, phagosomes acquire markers of late endosomes and lysosomes. A mature
  digestive organelle formed by the fusion of a phagosome with lysosomes in phagotrophic
  microbial eukaryotes such as Dictyostelium discoideum, Entamoeba histolytica, and
  ciliates. The phagolysosome features a strongly acidified lumen maintained by V-type
  H+-ATPases and an arsenal of acid hydrolases, proteases, and lysozymes that degrade
  engulfed bacteria and particulate nutrients.
