functions:
- function_id: cargo_sequestration
  label: selective sequestration of outer mitochondrial membrane proteins
  description: Concentrates selected membrane-associated cargo while excluding or
    de-enriching other mitochondrial proteins. Protection of enclosed cargo is partial
    and condition dependent.
  evidence:
  - reference: DOI:10.1083/jcb.202307036
    notes: The 2024 cargo study distinguishes surplus outer-membrane proteins from
      correctly localized inner-membrane carriers.
  - reference: DOI:10.1083/jcb.202307035
    notes: Membrane-cargo degron experiments show partial protection, not permanent
      isolation.
- function_id: vacuolar_routing
  label: conditional routing of mitochondrial membrane cargo toward vacuolar degradation
  description: An intermediate in Tom70-GFP delivery to the vacuole after concanamycin
    A treatment; release and downstream autophagic delivery are distinct from formation.
  evidence:
  - reference: DOI:10.7554/eLife.13943
    notes: 'Figure 4: fission-deficient and atg5 deletion cells still form MDCs but
      differ in subsequent release and vacuolar delivery. This is not a universal
      fate of all MDCs.'
