      notes: 'Figure 4: initial formation persists but subsequent release is impaired.'
  - subject: psd1_loss
    predicate: promotes
    object: formation
    evidence:
    - reference: DOI:10.1083/jcb.202302069
      notes: PE-biosynthesis perturbation promotes constitutive MDC formation in a
        subset of cells; this is not a prevalence estimate.
  - subject: crd1_loss
    predicate: reduces
    object: formation
