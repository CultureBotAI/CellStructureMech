discussions:
- discussion_id: identity_and_topology
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Keep the named MDC distinct from other mitochondrial deposits and vesicles.
  rationale: Outer-membrane remodeling and multilamellar topology define this record;
    the compartment is not just a protein aggregate or a generic mitochondrion-derived
    vesicle.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1083/jcb.202307035
    notes: Discussion distinguishes MDC membrane architecture and unsettled enclosure/fusion
      mechanisms.
  - reference: GO:0099073
    notes: Native term mitochondrion-derived vesicle is not adopted as the exact named
      MDC identity.
  resolved_date: '2026-10-05'
  resolution_note: Mint a local identity after bounded QuickGO/OLS full-name and acronym
    searches found no exact term. Hidden/ignored-inclusive worktree searches and parsed
    identifiers, labels and synonyms of all 887 existing records found no duplicate.
    GO:0043231 is broader. No invariant part_of link, fixed membrane count, fixed
    copy number, or exact synonym equivalence to MDV, IMiQ, DUMP or SPOT is asserted.
    Open intermediates and incompletely protected cargo do not establish closure of
    every MDC.
- discussion_id: carrier_model_revision
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Use the revised outer-membrane cargo model.
  rationale: The 2016 carrier interpretation was revised after testing tag orientation,
    localization and function.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.7554/eLife.13943
    notes: Initial screen included tagged mitochondrial carriers among candidate cargo.
  - reference: DOI:10.1083/jcb.202307036
    notes: Functional N-terminally tagged Oac1 localizes to the inner membrane and
      is not enriched; the C-terminal fusion is nonfunctional and mislocalized.
  resolved_date: '2026-10-05'
  resolution_note: Do not claim routine removal of functional inner-membrane carriers
    or a demonstrated universal amino-acid restriction mechanism. Selected outer-membrane
    proteins are enriched; other outer-membrane proteins and core TOM subunits are
    not uniformly captured.
- discussion_id: component_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate observed cargo and release machinery from upstream regulators.
  rationale: Colocalization, genetic dependency, and membership in the compartment
    are different observations.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.7554/eLife.13943
    notes: Table 1 and Figure 4 distinguish cargo from fission machinery.
  - reference: DOI:10.1083/jcb.202002144
    notes: ERMES/Gem1 contacts and perturbations support biogenesis roles, not transfer
      of the whole ER contact complex into MDC.
  - reference: DOI:10.1083/jcb.202307035
    notes: Fzo1 reporter association and fission/fusion perturbations are condition
      dependent; some experiments use overexpressed fusion proteins.
  resolved_date: '2026-10-05'
  resolution_note: Include membrane material, sampled Tom70/Tom71 cargo and variably
    enclosed cytosol as constituents, with Dnm1 as associated release machinery. Mcp1,
    Scm4, Msp1 and Fzo1 are additional reported cargo or associated proteins, not
    excluded by absence evidence and not asserted to be invariant. ERMES, Gem1, Atg5,
    lipid enzymes, Yme1, Ups proteins, MICOS, Snf1 and Mig1 are not made canonical
    MDC constituents solely from perturbations. No fixed stoichiometry is assigned.
- discussion_id: component_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact source-neutral identities for the label-only component classes.
  rationale: Heterogeneous membrane/cytosolic material has no single molecular identity;
    the inspected Tom71 and Dnm1 matches do not support exact family groundings.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P38825/?page_size=200
    notes: Only repeat/superfamily matches in the integrated results.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P54861/?page_size=200
    notes: Dynamin family is broader than the curated mitochondrial Dnm1-type class.
  notes: Retain REVIEWED_LABEL_ONLY without fabricated accessions. The grounded Tom70
    component uses the authority family label; its demonstrated recruitment is yeast-scoped.
- discussion_id: lipid_discrepancy
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve differing lipid-perturbation phenotypes between studies.
  rationale: The 2020 study reports no formation defect for tested crd1/ups1/psd1
    perturbations, whereas the dedicated 2024 lipid study detects distinct CL- and
    PE-pathway effects.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1083/jcb.202002144
    notes: Lipid-transfer discussion and assays do not establish a general lipid requirement.
  - reference: DOI:10.1083/jcb.202302069
    notes: CL depletion suppresses formation, whereas PE depletion promotes formation
      and can bypass some contact-site requirements.
  notes: Retain the 2024 intervention edges with their study scope and preserve the
    discrepancy. Do not invent a reconciliation, infer isolated-MDC lipid composition,
    or turn conditional rescue into universal essentiality.
- discussion_id: emerging_regulatory_models
  kind: CURATION_TODO
  status: OPEN
  prompt: Reassess 2026 regulatory and adaptive-function models when full primary
    evidence and final versions are available.
  rationale: Two relevant 2026 bioRxiv studies have eLife reviewed-preprint versions;
    neither is treated here as a version of record or proof of MDC-specific fitness
    benefit.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.64898/2026.04.03.716366
    notes: PMID 42798366, PMC13605720.1 metadata and abstract read. The PMC body only
      reports full-text unavailability; publisher routes did not yield full Results.
      Abstract proposes Yme1-dependent Ups/MICOS remodeling.
  - reference: https://elifesciences.org/reviewed-preprints/111713v1
    notes: Indexed official version identifies reviewed preprint v1, DOI 10.7554/eLife.111713.1;
      full Results not read.
  - reference: DOI:10.64898/2026.06.09.731211
    notes: 'PMID 42327138, PMC13278180.1: abstract, full Discussion, selected strain/MDC-assay
      Methods and data availability read, not Results. Acute adaptation, Snf1/Mig1
      regulation and protein-load buffering are proposed; specific buffering benefit
      remains unisolated.'
  - reference: https://elifesciences.org/reviewed-preprints/112436v1
    notes: Official indexed reviewed-preprint version DOI 10.7554/eLife.112436.1;
      not treated as a final version of record.
  notes: Keep these as explicit follow-up evidence, not graph edges or canonical component
    additions. Acute and chronic adaptation differ; glucose restriction is not automatically
    glucose absence. No dataset accession is invented from data-available-on-request
    wording.
