identifier: cellstructuremech:mitochondrial_derived_compartment
label: mitochondrial-derived compartment
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: An inducible compartment characterized in budding yeast that remodels
  the outer mitochondrial membrane into multilamellar domains, selectively concentrates
  membrane-associated proteins, and can enclose cytosolic material.
definition_source: DOI:10.1083/jcb.202307035
mapping_status: PROPOSED
