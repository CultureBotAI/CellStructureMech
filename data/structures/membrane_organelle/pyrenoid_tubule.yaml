functions:
- function_id: pyrenoid_inorganic_carbon_delivery
  label: pyrenoid inorganic carbon delivery
  description: Pyrenoid tubules are thylakoid-membrane continuities that traverse
    the Rubisco-rich pyrenoid matrix and are thought to support delivery of concentrated
    inorganic carbon to the pyrenoid.
  evidence:
  - reference: DOI:10.1093/plcell/koad157
    notes: He, Crans and Jonikas 2023 review the pyrenoid as a eukaryotic CO2-concentrating
      organelle whose matrix is traversed by membranes in many lineages.
  - reference: DOI:10.1111/nph.70669
    notes: Franklin et al. 2026 describe pyrenoid-traversing membranes as membranes
      thought to supply concentrated CO2 to pyrenoids.
