  title: Yeast ER couples protein entry and quality control
  description: In budding yeast, the ER membrane surrounds the ER lumen, embeds Sec61
    protein-translocation machinery, and provides the compartment where protein biogenesis
    is coupled to unfolded-protein-response and ERAD quality-control pathways.
