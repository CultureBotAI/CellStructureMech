functions:
- function_id: protein_translocation_into_er
  label: protein translocation into the endoplasmic reticulum
  description: Sec61 translocon complexes in the ER membrane move nascent and posttranslational
    substrate proteins across or into the ER membrane.
  evidence:
  - reference: GO:0005784
    notes: GO:0005784 identifies the Sec61 translocon complex as functioning in cotranslational
      and posttranslational translocation events.
  - reference: DOI:10.1091/mbc.3.2.129
    notes: Stirling et al. 1992 analyzed Saccharomyces cerevisiae sec61 mutants with
      ER protein-insertion defects.
- function_id: endoplasmic_reticulum_unfolded_protein_response
  label: endoplasmic reticulum unfolded protein response
  grounding: GO:0030968
  description: The ER stress response coordinates ER-associated degradation with expression
    of endoplasmic-reticulum resident factors.
  evidence:
  - reference: DOI:10.1016/s0092-8674(00)80835-1
    notes: Travers et al. 2000 combined functional and genomic analyses to connect
      the yeast unfolded protein response with ER-associated degradation.
- function_id: erad_quality_control_pathway
  label: ERAD pathway
  grounding: GO:0036503
  description: Misfolded or unassembled proteins are recognized in the ER and routed
    to ER-associated degradation quality-control machinery.
  evidence:
  - reference: DOI:10.1016/s0092-8674(00)80835-1
    notes: Travers et al. 2000 found that ER-associated degradation and the unfolded
      protein response are functionally coordinated in yeast.
