definition: A membrane-bounded organelle that receives incoming material from primary
  endocytic vesicles that have been generated by clathrin-dependent and clathrin-independent
  endocytosis; vesicles fuse with the early endosome to deliver cargo for sorting
  into recycling or degradation pathways.
