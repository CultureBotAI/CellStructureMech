discussions:
- discussion_id: keep_reservosome_outside_early_endosome
  prompt: Model the Trypanosoma reservosome as a separate downstream organelle rather
    than as an early-endosome subtype.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#early_endosome_topology_and_cargo_sorting
  rationale: Porto-Carreiro et al. 2000 placed the early endosomal network upstream
    of posterior reservosome storage in T. cruzi epimastigotes, so this record keeps
    the generic GO:0005769 early-endosome identity distinct from the minted reservosome
    record.
  evidence:
  - reference: DOI:10.1078/0171-9335-00112
    notes: Porto-Carreiro et al. 2000 traced cargo through early endosomal compartments
      before storage in reservosomes.
  - reference: cellstructuremech:reservosome
    notes: The local reservosome record separately models the posterior T. cruzi storage
      compartment.
