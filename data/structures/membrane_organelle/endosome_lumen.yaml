discussions:
- discussion_id: endosome_lumen_boundary_not_membrane
  prompt: Represent the endosome membrane as the boundary of the endosome lumen rather
    than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#endosome_lumen_topology
  rationale: GO:0031904 denotes the volume enclosed by the endosome membrane, whereas
    GO:0010008 denotes the surrounding lipid bilayer.
  resolution_note: Curated the endosome membrane as a boundary node and left the generic
    lumen without asserted constituent molecular components.
  evidence:
  - reference: GO:0031904
    notes: GO:0031904 identifies the endosome lumen.
  - reference: GO:0010008
    notes: GO:0010008 identifies the membrane that bounds the lumen.
