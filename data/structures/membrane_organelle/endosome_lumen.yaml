      notes: GO:0005771 defines multivesicular bodies by internal vesicles formed
        from invagination of the limiting endosomal membrane.
    - reference: DOI:10.1016/j.devcel.2011.05.015
      notes: Henne, Buchkovich and Emr 2011 reviewed the ESCRT pathway as the route
