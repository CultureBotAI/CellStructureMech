causal_graphs:
- graph_id: endosome_lumen_topology
  title: Endosome lumen topology
  description: The endosome membrane bounds the endosome lumen whose multivesicular-body
    lumen specialization receives intraluminal vesicles during MVB sorting.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures defining endosome lumen topology and the multivesicular-body
    lumenal vesicle destination without making intraluminal vesicles a generic feature
    of all endosome lumens or asserting a full sequence of ESCRT cargo recognition,
    membrane budding, scission, or vacuolar fusion.
