identifier: GO:7770040
label: epiplastidial membrane
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: The outermost lipid bilayer surrounding complex plastids in organisms
  that acquired their plastids through secondary endosymbiosis. This membrane is derived
  from the host cell's endomembrane system and is continuous with the rough endoplasmic
  reticulum and the outer nuclear envelope. In some species, the cytoplasmic face
  may be studded with ribosomes.
