identifier: GO:0044227
label: methane-oxidizing organelle
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A cytoplasmic, membrane-bounded organelle in aerobic methanotrophic bacteria,
  built from intracytoplasmic membranes that house particulate methane monooxygenase
  and associated electron-transfer proteins for methane catabolism.
definition_source: GO:0044227
mapping_status: PROPOSED
