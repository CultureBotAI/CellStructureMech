components:
- component_id: intracytoplasmic_membrane_bilayer
  label: methanotroph intracytoplasmic membrane bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Inner-membrane-derived lipid bilayer that expands into the intracytoplasmic
    membrane network housing pMMO trimers.
  evidence:
  - reference: DOI:10.1038/s41467-022-32752-9
    notes: Zhu et al. 2022 used cryoFIB/SEM volume imaging and cellular cryoET in
      Methylococcus capsulatus Bath to show that copper-induced ICMs derive from the
      inner cell membrane and contain embedded pMMO arrays.
  - reference: DOI:10.1111/1751-7915.13458
    notes: Whiddon et al. 2019 developed live-cell fluorescence staining for type
      I methanotroph ICMs and treated the FM dye signal as labelling highly compressed
      membrane stacks.
- component_id: particulate_methane_monooxygenase
  label: particulate methane monooxygenase complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - pmoA
  - pmoB
  - pmoC
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO methane monooxygenase terms denote molecular functions rather
    than the membrane pMMO trimer, so no exact source-neutral complex CURIE was curated.
  role: Copper membrane monooxygenase trimer embedded in the ICM that oxidizes methane
    to methanol and packs into native hexagonal arrays.
  evidence:
  - reference: DOI:10.1038/s41467-022-32752-9
    notes: Zhu et al. 2022 resolved native ICM-embedded pMMO trimers and higher-order
      hexagonal pMMO arrays by cryoET and subtomogram averaging.
  - reference: DOI:10.1128/JB.183.5.1810-1812.2001
    notes: Stolyar et al. 2001 assayed expression of individual Methylococcus capsulatus
      Bath pmo gene copies encoding particulate methane monooxygenase subunits.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: RARE
  note: Methane-oxidizing organelles occur in the subset of methanotrophic bacteria
    that build pMMO-containing intracytoplasmic membranes.
  reference: DOI:10.1111/1751-7915.13458
canonical_examples:
- taxon_id: NCBITaxon:243233
  taxon_label: Methylococcus capsulatus str. Bath
  note: Zhu et al. imaged native ICMs and ICM-embedded pMMO arrays in copper-replete
    Methylococcus capsulatus Bath cells.
  reference: DOI:10.1038/s41467-022-32752-9
functions:
- function_id: methane_catabolism
  label: methane catabolic process
  grounding: GO:0046188
  description: ICM-localized pMMO oxidizes methane to methanol as the first step in
    aerobic bacterial methane catabolism.
  evidence:
  - reference: DOI:10.1038/s41467-022-32752-9
    notes: Zhu et al. 2022 studied pMMO in native ICMs and described methane C-H bond
      activation and oxidation to methanol as the pMMO reaction.
evidence:
- reference: DOI:10.1038/s41467-022-32752-9
  notes: Zhu et al. 2022, Structure and activity of particulate methane monooxygenase
    arrays in methanotrophs, Nature Communications.
- reference: DOI:10.1111/1751-7915.13458
  notes: Whiddon et al. 2019, Fluorescence-based analysis of the intracytoplasmic
    membranes of type I methanotrophs, Microbial Biotechnology.
- reference: DOI:10.1128/JB.183.5.1810-1812.2001
  notes: Stolyar et al. 2001, Expression of individual copies of Methylococcus capsulatus
    Bath particulate methane monooxygenase genes, Journal of Bacteriology.
causal_graphs:
- graph_id: pmmo_array_methane_oxidation
  title: ICM-embedded pMMO trimers oxidize methane in ordered arrays
  description: Methanotroph intracytoplasmic membranes derive from the inner cell
    membrane, house pMMO trimers, and organize them into native hexagonal arrays.
    pMMO carries out the membrane-bound oxidation of methane to methanol that starts
    methane catabolism.
