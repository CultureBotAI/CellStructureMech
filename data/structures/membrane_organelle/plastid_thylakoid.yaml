discussions:
- discussion_id: whole_plastid_thylakoid_not_membrane_or_lumen
  prompt: Keep the whole plastid thylakoid distinct from its membrane and lumen children.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0031976 denotes any whole thylakoid within a plastid, while GO:0055035
    denotes its lipid bilayer membrane and GO:0031978 denotes the plastid thylakoid
    lumen.
  resolution_note: Curated GO:0031976 as the record identity, with GO:0055035 and
    GO:0031978 represented as child parts rather than as synonyms.
  evidence:
  - reference: GO:0031976
    notes: GO:0031976 identifies the whole plastid thylakoid.
  - reference: GO:0055035
    notes: GO:0055035 separately identifies the membrane part.
  - reference: GO:0031978
    notes: GO:0031978 separately identifies the lumen part.
  posed_by: codex
  posed_date: '2026-09-13'
- discussion_id: generic_plastid_thylakoid_kind
  prompt: Represent plastid thylakoid as a membranous plastid structure without asserting
    a lineage-specific organelle class.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: The broader GO:0009579 thylakoid class is intentionally separated from
    organelles, and its exact plastid child still groups whole-thylakoid compartments
    that are modelled with different structure_kind values in narrower records.
  resolution_note: Kept the record in the MEMBRANE_ORGANELLE filesystem category but
    used structure_kind OTHER.
  evidence:
  - reference: GO:0031976
  - reference: GO:0009579
  posed_by: codex
  posed_date: '2026-09-13'
