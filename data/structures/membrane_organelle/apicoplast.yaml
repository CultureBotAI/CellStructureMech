  taxon_label: Apicomplexa
  presence: VARIABLE
  note: The apicoplast is present in many apicomplexan parasites, including Plasmodium
    and Toxoplasma, but has been lost in some lineages.
  reference: DOI:10.1016/j.ijpara.2016.08.005
canonical_examples:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  note: Human malaria parasite in which IPP rescue showed that apicoplast isoprenoid
    precursor biosynthesis is essential in blood-stage growth.
  reference: DOI:10.1371/journal.pbio.1001138
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan model used to show that Tic20 is required for protein import
    into the plastid.
  reference: DOI:10.1073/pnas.0803862105
functions:
- function_id: nuclear_encoded_protein_import
  label: nuclear-encoded protein import
  description: Most apicoplast proteins are encoded in the nucleus and imported across
    the surrounding membranes using bipartite targeting signals and membrane translocons.
  evidence:
  - reference: DOI:10.1073/pnas.95.21.12352
    notes: Waller et al. 1998 demonstrated targeting of nuclear-encoded proteins to
      the plastid in Toxoplasma gondii and Plasmodium falciparum.
  - reference: DOI:10.1073/pnas.0803862105
    notes: van Dooren et al. 2008 showed that Toxoplasma Tic20 is essential for apicoplast
      protein import.
- function_id: isoprenoid_precursor_biosynthesis
  label: isoprenoid precursor biosynthesis
  description: The Plasmodium falciparum apicoplast makes the isoprenoid precursor
    IPP during blood-stage parasite growth.
  evidence:
  - reference: DOI:10.1371/journal.pbio.1001138
    notes: Yeh and DeRisi 2011 showed that exogenous IPP rescues blood-stage P. falciparum
      lacking apicoplast function.
evidence:
- reference: DOI:10.1073/pnas.95.21.12352
  notes: Waller et al. 1998, Nuclear-encoded proteins target to the plastid in Toxoplasma
    gondii and Plasmodium falciparum, Proceedings of the National Academy of Sciences.
- reference: DOI:10.1098/rstb.2009.0273
  notes: Lim et al. 2010, The evolution, metabolism and functions of the apicoplast,
    Philosophical Transactions of the Royal Society B.
- reference: DOI:10.1073/pnas.0803862105
  notes: van Dooren et al. 2008, Toxoplasma gondii Tic20 is essential for apicoplast
    protein import, Proceedings of the National Academy of Sciences.
- reference: DOI:10.1371/journal.ppat.1003426
  notes: Agrawal et al. 2013, An apicoplast localized ubiquitylation system is required
    for the import of nuclear-encoded plastid proteins, PLOS Pathogens.
- reference: DOI:10.1186/1475-2875-12-25
  notes: Lemgruber et al. 2013, Cryo-electron tomography reveals four-membrane architecture
    of the Plasmodium apicoplast, Malaria Journal.
- reference: DOI:10.1146/annurev-micro-092412-155741
  notes: van Dooren and Striepen 2013, The algal past and parasite present of the
    apicoplast, Annual Review of Microbiology.
- reference: DOI:10.1371/journal.pbio.1001138
  notes: Yeh and DeRisi 2011, Chemical rescue of malaria parasites lacking an apicoplast
    defines organelle function in blood-stage Plasmodium falciparum, PLOS Biology.
- reference: DOI:10.1016/j.ijpara.2016.08.005
  notes: 'McFadden and Yeh 2017, The apicoplast: now you see it, now you don''t, International
    Journal for Parasitology.'
causal_graphs:
- graph_id: bipartite_leader_apicoplast_import
  title: Bipartite leaders route nuclear-encoded cargo into the apicoplast
  description: Nuclear-encoded apicoplast proteins carry a bipartite leader that directs
    them into the secretory pathway and then through apicoplast membrane translocons,
    including SELMA/ERAD-derived machinery and the Tic20 inner-membrane translocon.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
