    label: nuclear-encoded apicoplast precursor proteins
    node_type: GENE_OR_PROTEIN
    component_ref: nuclear_encoded_metabolic_enzymes
  - node_id: bipartite_leader
    label: bipartite apicoplast targeting leader
    node_type: STATE
  - node_id: endomembrane_pathway
    label: endomembrane trafficking pathway
    node_type: CELLULAR_LOCALIZATION
  - node_id: selma_import_system
    label: SELMA/ERAD-derived import machinery
    node_type: GENE_OR_PROTEIN
    component_ref: selma_erad_import_machinery
  - node_id: tic20_translocon
    label: Tic20 inner-membrane translocon
    node_type: GENE_OR_PROTEIN
    component_ref: tic20_inner_membrane_translocon
  - node_id: apicoplast_membranes
    label: apicoplast membrane
    node_type: STRUCTURE
    grounding: GO:0160211
    component_ref: apicoplast_membranes
  - node_id: apicoplast
    label: apicoplast
    node_type: ORGANELLE
    grounding: GO:0020011
  edges:
  - subject: precursor_proteins
    predicate: carry
    object: bipartite_leader
    description: Nuclear-encoded apicoplast cargo proteins use N-terminal bipartite
      leaders for apicoplast targeting.
    evidence:
    - reference: DOI:10.1073/pnas.95.21.12352
      notes: Waller et al. 1998 used plastid-targeted nuclear-encoded proteins from
        Toxoplasma and Plasmodium to demonstrate apicoplast targeting.
  - subject: bipartite_leader
    predicate: targets cargo to
    object: endomembrane_pathway
    description: The signal-peptide portion of the leader directs apicoplast precursor
      proteins into the secretory system.
    evidence:
    - reference: DOI:10.1098/rstb.2009.0273
      notes: Lim et al. 2010 review signal peptide and transit-peptide targeting requirements
        for luminal apicoplast proteins.
  - subject: selma_import_system
    predicate: translocates
    object: precursor_proteins
    description: An apicoplast ubiquitylation and ERAD-like system contributes to
      transfer of nuclear-encoded proteins through an outer apicoplast envelope membrane.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1003426
      notes: Agrawal et al. 2013 found that disrupting the apicoplast-localized ubiquitylation
        system blocked nuclear-encoded plastid protein import.
  - subject: tic20_translocon
    predicate: translocates
    object: precursor_proteins
    description: Tic20 acts at the innermost apicoplast membrane during protein import
      into the plastid.
    evidence:
    - reference: DOI:10.1073/pnas.0803862105
      notes: van Dooren et al. 2008 localized TgTic20 to the apicoplast and showed
        that TgTic20 disruption blocks protein import.
  - subject: selma_import_system
    predicate: resides in
    object: apicoplast_membranes
    description: The SELMA/ERAD-like machinery is an apicoplast-envelope protein-import
      system.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1003426
      notes: Agrawal et al. 2013 characterized the import machinery as apicoplast
        localized.
  - subject: tic20_translocon
    predicate: resides in
    object: apicoplast_membranes
    description: Tic20 is an apicoplast membrane component required for protein import.
    evidence:
    - reference: DOI:10.1073/pnas.0803862105
      notes: van Dooren et al. 2008 assigned TgTic20 to the apicoplast innermost membrane
        import step.
  - subject: apicoplast_membranes
    predicate: bounds
    object: apicoplast
    description: A four-membrane envelope surrounds the Plasmodium apicoplast.
    evidence:
    - reference: DOI:10.1186/1475-2875-12-25
      notes: Lemgruber et al. 2013 visualized four apicoplast membranes by cryo-electron
        tomography.
