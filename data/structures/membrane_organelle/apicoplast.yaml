  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0160211
  essentiality: ESSENTIAL
  role: The multiple lipid bilayers that form the apicoplast envelope and separate
    the plastid from the surrounding parasite cytoplasm.
  evidence:
  - reference: DOI:10.1186/1475-2875-12-25
    notes: Lemgruber et al. 2013 used cryo-electron tomography to resolve four membranes
      around the Plasmodium falciparum apicoplast.
  - reference: DOI:10.1098/rstb.2009.0273
    notes: Lim et al. 2010 review the four-membrane apicoplast envelope and protein
      targeting across it.
