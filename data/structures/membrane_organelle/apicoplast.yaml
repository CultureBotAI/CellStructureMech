- component_id: nuclear_encoded_metabolic_enzymes
  label: nuclear-encoded apicoplast metabolic enzymes
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This component groups several unrelated apicoplast-targeted enzyme
    families from plastid metabolic pathways; a single exact protein-family grounding
    would be too broad.
  role: Imported enzymes that execute apicoplast pathways including MEP/DOXP isoprenoid
    precursor biosynthesis, fatty-acid synthesis, heme metabolism, and iron-sulfur-cluster
    synthesis.
  evidence:
  - reference: DOI:10.1098/rstb.2009.0273
    notes: Lim et al. 2010 review imported nuclear-encoded apicoplast enzymes in fatty-acid,
      heme, iron-sulfur and isoprenoid precursor pathways.
  - reference: DOI:10.1146/annurev-micro-092412-155741
    notes: van Dooren and Striepen 2013 review the apicoplast as a plastid carrying
      multiple parasite metabolic pathways that depend on nuclear-encoded imported
      proteins.
