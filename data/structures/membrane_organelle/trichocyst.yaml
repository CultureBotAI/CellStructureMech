identifier: GO:0055039
label: trichocyst
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A crystalline exocytotic organelle composed of small, acidic proteins
  existing primarily as disulphide-linked dimers. The trichocyst releases long filamentous
  proteins that capture predators in net-like structures to slow them down when the
  cell is disturbed.
