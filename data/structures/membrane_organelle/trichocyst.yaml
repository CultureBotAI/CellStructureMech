causal_graphs:
- graph_id: matrix_filament_discharge
  title: Calcium-triggered matrix proteins discharge as a filament
  description: Paramecium trichocyst matrix proteins coassemble into a crystalline
    trichocyst matrix that is stored in the organelle. After stimulated exocytosis,
    extracellular Ca2+ triggers matrix recrystallization and extension into the discharged
    filament.
