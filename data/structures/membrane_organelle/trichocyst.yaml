functions:
- function_id: stimulus_triggered_filament_discharge
  label: stimulus-triggered filament discharge
  description: Trichocysts undergo regulated exocytosis, contact extracellular Ca2+,
    and recrystallize a condensed matrix as an elongated extracellular filament.
  evidence:
  - reference: DOI:10.1111/jeu.12332
    notes: Plattner 2017 reviewed Paramecium trichocysts as projectile-like secretory
      organelles that discharge in a stimulus-triggered reaction.
