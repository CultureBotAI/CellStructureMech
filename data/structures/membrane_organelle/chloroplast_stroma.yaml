causal_graphs:
- graph_id: chloroplast_stroma_topology_and_import
  title: Chloroplast stroma topology and import
  description: The chloroplast envelope encloses the stroma, stromal protein import
    routes precursors across the envelope, and chloroplast nucleoids and plastoglobules
    occupy the stromal compartment.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the stromal topology and the endpoint of TOC-TIC
    import without duplicating thylakoid biogenesis, carbon fixation, plastoglobule
    lipid remodeling, or nucleoid maintenance.
  nodes:
  - node_id: chloroplast_stroma
    label: chloroplast stroma
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0009570
  - node_id: chloroplast_envelope
    label: chloroplast envelope
    node_type: STRUCTURE
    grounding: GO:0009941
  - node_id: chloroplast_nucleoid
    label: chloroplast nucleoid
    node_type: STRUCTURE
    grounding: GO:0042644
  - node_id: plastoglobule
    label: plastoglobule
    node_type: STRUCTURE
    grounding: GO:0010287
  - node_id: protein_import
    label: protein import into chloroplast stroma
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0045037
  edges:
  - subject: chloroplast_envelope
    predicate: encloses
    object: chloroplast_stroma
    description: The chloroplast double membrane encloses the stroma and separates
      it from the cytosol.
    evidence:
    - reference: GO:0009570
      notes: GO:0009570 defines the stroma as the chloroplast internal space enclosed
        by the double membrane.
  - subject: chloroplast_nucleoid
    predicate: is part of
    object: chloroplast_stroma
    description: Chloroplast nucleoids are DNA-containing regions inside the stroma.
    evidence:
    - reference: DOI:10.1093/mp/ssp083
      notes: Karcher et al. 2009 assayed Chlamydomonas chloroplast DNA organization
        as HLP-containing nucleoids.
  - subject: plastoglobule
    predicate: is part of
    object: chloroplast_stroma
    description: Plastoglobules are chloroplast stromal lipoprotein subcompartments
      coupled to thylakoids.
    evidence:
    - reference: GO:0010287
      notes: GO:0010287 identifies plastoglobules, which are curated as chloroplast-stroma
        parts in this corpus.
  - subject: chloroplast_envelope
    predicate: routes precursors toward
    object: protein_import
    description: TOC-TIC import machinery in the envelope moves nuclear-encoded precursors
      toward the chloroplast stroma.
    evidence:
    - reference: DOI:10.1016/j.cell.2022.10.030
      notes: Jin et al. 2022 resolved a Chlamydomonas TOC-TIC supercomplex spanning
        both chloroplast envelope membranes.
discussions:
- discussion_id: stroma_thylakoid_boundary
  prompt: Keep the chloroplast stroma separate from thylakoid lumen compartments.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0009570 denotes the hydrophilic internal matrix enclosed by the chloroplast
    envelope, explicitly excluding the thylakoid space that has dedicated chloroplast
    and plastid lumen terms.
  resolution_note: Curated only the chloroplast matrix compartment and did not merge
    thylakoid lumens or membranes into this stroma record.
  evidence:
  - reference: GO:0009570
    notes: GO:0009570 defines chloroplast stroma as excluding the thylakoid space.
  - reference: GO:0009543
    notes: GO:0009543 separately identifies the chloroplast thylakoid lumen.
