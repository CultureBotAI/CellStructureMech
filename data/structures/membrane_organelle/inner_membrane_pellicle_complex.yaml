components:
- component_id: flattened_imc_alveolar_membranes
  label: flattened IMC alveolar membranes
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The flattened vesicles that make up the apicomplexan inner membrane
    complex are the membranes of GO:0070258 itself; no narrower source-neutral lipid
    or membrane CURIE was curated for this first record.
  role: Flattened double-membrane cisternae that lie beneath the parasite plasma membrane
    and form the membranous part of the apicomplexan pellicle.
  evidence:
  - reference: DOI:10.3389/fcimb.2020.611801
    notes: Ferreira et al. 2021 review the Plasmodium IMC as a double membrane organelle
      beneath the parasite plasma membrane.
  - reference: DOI:10.1242/jcs.099002
    notes: Dearnley et al. 2012 resolved flattened subpellicular membrane compartments
      beneath the Plasmodium falciparum gametocyte plasma membrane.
- component_id: alveolin_subpellicular_network
  label: alveolin subpellicular network
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Alveolins are an alveolate-specific, repeat-containing protein
    family on the cytoplasmic face of the inner membrane complex, but no exact family
    CURIE was curated for the first GO:0070258 record.
  role: Peripheral membrane proteins that form a cytoskeletal network on the cytoplasmic
    face of the IMC.
  evidence:
  - reference: DOI:10.3389/fcimb.2020.611801
    notes: Ferreira et al. 2021 review alveolins as Alveolata-specific IMC proteins
      that form a subpellicular network at the IMC cytoplasmic face.
  - reference: DOI:10.1093/molbev/mss081
    notes: Kono et al. 2012 analysed Plasmodium alveolin proteins in inner-membrane-complex
      architecture across asexual and sexual malaria-parasite stages.
taxonomic_distribution:
- taxon_id: NCBITaxon:5794
  taxon_label: Apicomplexa
  presence: COMMON
  note: The inner membrane complex is a pellicle organelle of apicomplexan parasites,
    with stage-specific architecture in Plasmodium and lineage-specific functional
    differences.
  reference: DOI:10.2741/4157
canonical_examples:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  note: Human malaria parasite in which the IMC has been studied through asexual and
    sexual stages, including gametocyte subpellicular-membrane assembly.
  reference: DOI:10.1093/molbev/mss081
functions:
- function_id: pellicle_shape_support
  label: pellicle shape support
  description: The IMC and associated subpellicular proteins stabilize parasite morphology
    as part of the apicomplexan pellicle.
  evidence:
  - reference: DOI:10.3389/fcimb.2020.611801
    notes: Ferreira et al. 2021 review the Plasmodium IMC as a compartment that confers
      cell stability and shape.
- function_id: daughter_cell_scaffolding
  label: daughter-cell scaffolding
  description: The IMC provides a scaffold for apicomplexan daughter-cell formation
    during parasite replication.
  evidence:
  - reference: DOI:10.1093/molbev/mss081
    notes: Kono et al. 2012 followed IMC architecture during asexual and sexual Plasmodium
      development.
  - reference: DOI:10.3389/fcimb.2020.611801
    notes: Ferreira et al. 2021 review the IMC as an important scaffold during daughter-cell
      formation in Plasmodium spp.
- function_id: glideosome_anchoring_for_motility
  label: glideosome anchoring for motility
  description: The apicomplexan IMC anchors gliding-motility machinery used for parasite
    movement and host-cell invasion.
  evidence:
  - reference: DOI:10.3389/fcimb.2020.611801
    notes: Ferreira et al. 2021 review the IMC as the anchor for the actin-myosin
      glideosome that powers gliding motility and invasion.
evidence:
