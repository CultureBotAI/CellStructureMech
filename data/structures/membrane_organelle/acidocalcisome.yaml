components:
- component_id: polyphosphate_matrix
  label: polyphosphate
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  grounding: CHEBI:16838
  essentiality: ESSENTIAL
  role: Polyanionic phosphate polymer that chelates calcium and other cations in the
    electron-dense acidocalcisome core.
  evidence:
  - reference: DOI:10.1038/nrmicro1097
    notes: Docampo et al. 2005 review polyphosphate and pyrophosphate as major anionic
      stores in acidocalcisomes.
  - reference: DOI:10.1074/jbc.M304548200
    notes: Seufferheld et al. 2003 detected phosphorus-rich volutin granules with
      acidocalcisome-like properties in Agrobacterium tumefaciens.
- component_id: bound_cations
  label: bound calcium and magnesium cations
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Divalent cations complexed with polyphosphate in the acidocalcisome matrix.
  evidence:
  - reference: DOI:10.1038/nrmicro1097
    notes: Docampo et al. 2005 review calcium and other cations as conserved matrix
      constituents of acidocalcisomes.
  - reference: DOI:10.1074/jbc.M304548200
    notes: Seufferheld et al. 2003 analysed acidocalcisome-like bacterial granules
      as calcium- and polyphosphate-rich compartments.
- component_id: acidocalcisome_membrane
  label: acidocalcisome membrane
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Membrane boundary that encloses the acidic polyphosphate and cation store.
  evidence:
  - reference: DOI:10.1074/jbc.M304548200
    notes: Seufferheld et al. 2003 reported membrane-bounded acidocalcisome-like volutin
      granules in bacteria.
  - reference: DOI:10.1128/MMBR.00042-23
    notes: Docampo and Huang 2024 review acidocalcisomes as membrane-bound polyphosphate
      organelles across bacteria and eukaryotes.
- component_id: proton_pumps
  label: acidocalcisome proton pumps
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Acidocalcisomes can carry V-H+-PPase, V-H+-ATPase and other lineage-specific
    pumps; no exact family denoting the acidocalcisome pump set was curated.
  role: Membrane pumps that acidify the organelle lumen and support ion uptake.
  evidence:
  - reference: DOI:10.1038/nrmicro1097
    notes: Docampo et al. 2005 review proton pumps as acidocalcisome membrane components.
  - reference: DOI:10.1074/jbc.M304548200
    notes: Seufferheld et al. 2003 localized vacuolar proton pyrophosphatase activity
      to bacterial acidocalcisome-like organelles.
- component_id: cation_transporters
  label: acidocalcisome cation transporters
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This grouped transporter set is defined by organelle localization
    and ion-storage role; exact protein families differ among bacteria, algae and
    protists.
  role: Calcium and cation transporters that move ions across the acidocalcisome membrane.
  evidence:
  - reference: DOI:10.1128/MMBR.00042-23
    notes: Docampo and Huang 2024 review cation transport systems of acidocalcisome
      membranes.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Acidocalcisome-like volutin granules have been characterized in bacteria including
    Agrobacterium tumefaciens and Rhodospirillum rubrum.
  reference: DOI:10.1038/nrmicro1097
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: VARIABLE
  note: Acidocalcisomes are widespread in diverse microbial eukaryotes and metazoan
    cell types but are not universal across all eukaryotes.
  reference: DOI:10.1128/MMBR.00042-23
canonical_examples:
- taxon_id: NCBITaxon:358
  taxon_label: Agrobacterium tumefaciens
  note: Bacterial model in which volutin granules were shown to have acidocalcisome-like
    membrane, cation and polyphosphate properties.
  reference: DOI:10.1074/jbc.M304548200
functions:
- function_id: polyphosphate_storage
  label: polyphosphate storage
  description: Acidocalcisomes store a dense polyphosphate and pyrophosphate matrix
    that buffers phosphate and bound cations.
  evidence:
  - reference: DOI:10.1038/nrmicro1097
    notes: Docampo et al. 2005 review acidocalcisomes as polyphosphate-rich organelles.
- function_id: calcium_storage
  label: calcium storage
  description: The organelle stores calcium and other cations complexed with polyphosphate
    in an acidic lumen.
  evidence:
  - reference: DOI:10.1128/MMBR.00042-23
    notes: Docampo and Huang 2024 review the ion storage roles of acidocalcisomes.
evidence:
- reference: DOI:10.1038/nrmicro1097
  notes: Docampo R, de Souza W, Miranda K, Rohloff P and Moreno SNJ 2005, Acidocalcisomes
    - conserved from bacteria to man, Nature Reviews Microbiology.
- reference: DOI:10.1074/jbc.M304548200
  notes: Seufferheld et al. 2003, Identification of organelles in bacteria similar
    to acidocalcisomes of unicellular eukaryotes, Journal of Biological Chemistry.
- reference: DOI:10.1128/MMBR.00042-23
  notes: Docampo and Huang 2024 review acidocalcisome cell biology, biochemistry and
    physiological roles.
causal_graphs:
- graph_id: acidic_polyphosphate_cation_store
  title: Proton pumps and polyphosphate build an acidic cation store
  description: The acidocalcisome membrane bounds a polyphosphate-rich matrix. Proton
    pumps acidify the lumen, and the anionic polyphosphate matrix chelates calcium
    and other cations to create an electron-dense storage compartment.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
