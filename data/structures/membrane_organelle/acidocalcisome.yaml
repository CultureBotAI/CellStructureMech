identifier: GO:0020022
label: acidocalcisome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: An acidic electron-dense membrane-bounded organelle found in diverse microbes
  that stores polyphosphate, pyrophosphate, calcium and other cations and uses proton
  pumps and cation transporters to maintain its ion-rich matrix.
definition_source: GO:0020022
mapping_status: PROPOSED
