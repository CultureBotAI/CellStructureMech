canonical_examples:
- taxon_id: NCBITaxon:127549
  taxon_label: Calcidiscus leptoporus
  reference: DOI:10.1021/jacs.6c02151
  note: Strain RCC1130. Supplementary Methods identify the culture; cryo-SEM, cryo-FIB-SEM
    and cryo-electron tomography show the vesicle and its relationship to developing
    coccolith crystals. External coccoliths were removed before plunge freezing for
    FIB imaging; Figure 2B instead uses high-pressure freezing and freeze fracture.
- taxon_id: NCBITaxon:2903
  taxon_label: Emiliania huxleyi
  reference: DOI:10.1038/ncomms11228
  note: Strain AWI1516. Cryo-FIB-SEM resolves intracellular coccoliths in the coccolith-vesicle/reticular-body
    system separately from a calcium-rich storage compartment. The label follows the
    verified NCBI taxon, which retains Gephyrocapsa huxleyi as a synonym.
functions:
- function_id: intracellular_coccolith_formation
  label: intracellular coccolith formation
  description: Provides the membrane-bounded environment in which coccolith calcite
    crystals develop. This site-of-formation claim does not specify the molecular
    mechanism that sets crystal shape.
  evidence:
  - reference: DOI:10.1021/jacs.6c02151
    notes: Results and Figures 2-3 image membrane-enclosed coccoliths at different
      developmental stages in Calcidiscus leptoporus.
  - reference: DOI:10.1038/ncomms11228
    notes: Figures 3-4 distinguish the calcite-forming compartment from the separate
      calcium-rich storage compartment in Emiliania huxleyi.
evidence:
- reference: DOI:10.1021/jacs.6c02151
  notes: Avrahami et al. (2026), Journal of the American Chemical Society. Primary
    Results, Discussion, Conclusions, figure captions and supplementary culture/imaging
    Methods read. Membrane-crystal proximity varies with position and stage; mechanistic
    compartmentalization remains an interpretation of structural and elemental observations.
- reference: DOI:10.1038/ncomms11228
  notes: Sviben et al. (2016), Nature Communications. Primary microscopy Results,
    Discussion and culture Methods read. The calcium/phosphorus-rich storage compartment
    is distinct from the coccolith-vesicle/reticular-body system; apposition does
    not establish continuity or an identified transfer mechanism.
- reference: GO:0043231
  notes: Verified broad intracellular membrane-bounded organelle parent, not an exact
    coccolith-vesicle identity.
discussions:
- discussion_id: identity_and_compartment_boundaries
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the coccolith-forming vesicle distinct from its mineral product and
    neighboring calcium store.
  rationale: Similarity in calcium content or close membrane apposition does not make
    these entities equivalent.
  notes: Hidden/ignored-inclusive repository searches found no duplicate label, alias
    or primary citation. QuickGO coccolith and coccolithogenesis searches returned
    zero hits; all 481 results of the broader coccolith-vesicle query were inspected
    without an exact label/definition match. GO:0043231 supplies a broad parent without
    imposing a spherical geometry. Neither a coccolith nor the extracellular coccosphere
    is a synonym for the vesicle. The reticular body is not asserted as an exact synonym.
    Golgi derivation does not by itself establish persistent Golgi parthood. The calcium/phosphorus
    storage compartment is not imported into this record.
  evidence:
  - reference: DOI:10.1021/jacs.6c02151
    notes: Introduction and Results distinguish mineral, surrounding membrane and
      extracellular coccoliths.
  - reference: DOI:10.1038/ncomms11228
    notes: Figures 3 and 6 distinguish storage and calcification compartments.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: molecular_component_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not assign unidentified luminal particles to a full ATPase complex or
    import cargo scaffolds as vesicle-building proteins.
  rationale: Ultrastructural resemblance is insufficient to choose a protein family
    or infer transport activity.
  notes: The 2026 Figure 4 average of 716 membrane-associated particles is approximately
    half the height of the comparison ATPase and challenges a full-ATPase assignment.
    The particles are observed, but their identities and functions remain unresolved.
    No ATPase, ion transporter, cytoskeletal protein or guessed accession is asserted
    as a constituent. The organic base plate and calcite are treated here as the developing
    coccolith cargo rather than verified molecular building blocks of the vesicle
    boundary. Lack of detected cytoskeletal contact is not evidence of biological
    absence.
  evidence:
  - reference: DOI:10.1021/jacs.6c02151
    notes: Results and Figure 4 explicitly discuss limited structural resolution and
      uncertain particle identity.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: morphogenesis_and_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve molecular transport, membrane shaping, developmental dynamics and
    occurrence across additional species and life-cycle phases.
  rationale: Near-native snapshots and elemental maps establish morphology but do
    not independently prove a general causal mechanism.
  notes: Membrane-crystal proximity bands in Calcidiscus are not asserted as sealed
    suborganelles or a universal continuous physical mold. Proposed chemical subcompartments
    and local growth inhibition remain hypotheses; no causal graph or universal distance,
    concentration, stoichiometry or prevalence is asserted. The later Calcidiscus
    study detects luminal calcium, so the earlier Emiliania nondetection is not generalized
    as absence. Exact protein composition and how these observations extend to other
    coccolith types require further evidence.
  evidence:
  - reference: DOI:10.1021/jacs.6c02151
    notes: Discussion and Conclusions retain open questions about solutes, transporters,
      membrane proximity and organic macromolecules.
  - reference: DOI:10.1038/ncomms11228
    notes: Discussion proposes calcium-transfer routes without identifying the relevant
      transport machinery.
  posed_by: codex
  posed_date: '2026-10-03'
