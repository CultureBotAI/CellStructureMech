identifier: cellstructuremech:coccolith_vesicle
label: coccolith vesicle
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded intracellular compartment of coccolithophores that
  encloses a developing calcite coccolith. Its bounding membrane surrounds the site
  of coccolith mineralization and can change shape as the crystals grow.
definition_source: DOI:10.1021/jacs.6c02151
mapping_status: PROPOSED
