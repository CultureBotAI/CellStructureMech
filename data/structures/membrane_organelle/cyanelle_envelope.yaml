discussions:
- discussion_id: generic_cyanelle_membrane_scope
  prompt: Keep the whole cyanelle envelope record separate from the generic GO:0033113
    cyanelle membrane fallback term.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  rationale: GO:0033112 identifies the whole double envelope including the intermembrane
    space, whereas GO:0033113 identifies either envelope lipid bilayer when the exact
    inner or outer cyanelle membrane is unspecified.
  resolution_note: Curated the envelope as GO:0033112 and used exact GO:0036012 and
    GO:0036013 component groundings for its two membrane bilayers.
  evidence:
  - reference: GO:0033112
    notes: GO:0033112 defines the cyanelle envelope as the double lipid bilayer that
      includes the intermembrane space.
  - reference: GO:0033113
    notes: GO:0033113 defines a generic cyanelle membrane as either of the lipid bilayers
      that form the cyanelle envelope.
  posed_by: codex
  posed_date: '2026-09-12'
- discussion_id: resolve_cyanelle_peptidoglycan_layer
  prompt: Resolve an exact source-neutral grounding for the peptidoglycan layer in
    the cyanelle envelope.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#cyanelle_peptidoglycan_layer
  - causal_graphs#cyanelle_envelope_topology
  rationale: GO and UniProt place a vestigial peptidoglycan layer in the cyanelle
    intermembrane space, but the resolved authority terms identify the whole intermembrane
    space rather than a standalone cyanelle peptidoglycan sheet.
  evidence:
  - reference: GO:0036014
    notes: GO:0036014 explicitly includes the peptidoglycan layer in the cyanelle
      intermembrane space.
  - reference: DOI:10.1128/jb.178.2.332-339.1996
    notes: Pfanzagl et al. 1996 established the primary structure of the Cyanophora
      paradoxa cyanelle peptidoglycan.
  posed_by: codex
  posed_date: '2026-09-12'
