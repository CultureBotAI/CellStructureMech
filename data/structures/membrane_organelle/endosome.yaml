functions:
- function_id: endosomal_transport
  label: endosomal transport
  description: Endosomes move internalized and biosynthetic membrane cargo through
    the yeast endomembrane system toward the vacuole.
  grounding: GO:0016197
  evidence:
  - reference: GO:0016197
    notes: GO:0016197 defines endosomal transport as directed movement of lumenal
      or membrane substances mediated by an endosome.
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed the ESCRT pathway as a conserved
      route for endosomal cargo sorting.
- function_id: multivesicular_body_sorting
  label: multivesicular body sorting
  description: Endosomal sorting machinery recognizes ubiquitinated membrane cargo
    and packages it into intraluminal vesicles of multivesicular bodies.
  evidence:
  - reference: DOI:10.1016/S0092-8674(01)00434-2
    notes: Katzmann, Babst and Emr 2001 identified ESCRT-I as a conserved endosomal
      protein-sorting complex needed for yeast MVB sorting.
  - reference: DOI:10.1016/S1534-5807(02)00219-8
    notes: Babst et al. 2002 identified ESCRT-II as an endosome-associated complex
      that recruits MVB protein-sorting machinery.
