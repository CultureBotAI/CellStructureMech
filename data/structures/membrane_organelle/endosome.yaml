causal_graphs:
- graph_id: yeast_escrt_mvb_sorting
  title: ESCRT machinery sorts endosomal cargo into multivesicular bodies
  description: In Saccharomyces cerevisiae, Vps27 and ESCRT complexes are recruited
    to endosomal membranes to sort ubiquitinated membrane cargo and package it into
    multivesicular-body intraluminal vesicles.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph summarizes the ordered endosomal ESCRT sorting pathway without
    asserting a complete cargo-recognition, deubiquitination, or Vps4 recycling mechanism.
  nodes:
  - node_id: endosome_membrane
    label: endosome membrane
    node_type: STRUCTURE
    grounding: GO:0010008
    component_ref: endosome_membrane
  - node_id: endosome_lumen
    label: endosome lumen
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0031904
  - node_id: vps27_hse1
    label: Vps27/Hse1 endosomal cargo-recognition complex
    node_type: GENE_OR_PROTEIN
  - node_id: escrt_i
    label: ESCRT I complex
    node_type: STRUCTURE
    grounding: GO:0000813
  - node_id: escrt_ii
    label: ESCRT II complex
    node_type: STRUCTURE
    grounding: GO:0000814
  - node_id: escrt_iii
    label: ESCRT III complex
    node_type: STRUCTURE
    grounding: GO:0000815
  - node_id: ubiquitinated_membrane_cargo
    label: ubiquitinated membrane cargo
    node_type: STATE
  - node_id: multivesicular_body
    label: multivesicular body
    node_type: ORGANELLE
    grounding: GO:0005771
  edges:
  - subject: endosome_membrane
    predicate: bounds
    object: endosome_lumen
    description: The endosome membrane encloses the endosome lumen.
    evidence:
    - reference: GO:0031904
      notes: GO:0031904 defines the endosome lumen as the volume enclosed by the membrane
        of an endosome.
  - subject: vps27_hse1
    predicate: recruits
    object: escrt_i
    description: Vps27 binds ESCRT-I on endosomal membranes during yeast MVB sorting.
    evidence:
    - reference: DOI:10.1083/jcb.200302136
      notes: Katzmann et al. 2003 found that yeast Vps27 recruits ESCRT-I to endosomal
        membranes.
  - subject: escrt_i
    predicate: sorts
    object: ubiquitinated_membrane_cargo
    description: ESCRT-I participates in sorting ubiquitinated membrane cargo into
      the yeast MVB pathway.
    evidence:
    - reference: DOI:10.1016/S0092-8674(01)00434-2
      notes: Katzmann, Babst and Emr 2001 showed ESCRT-I is needed for ubiquitin-dependent
        MVB cargo sorting.
  - subject: escrt_ii
    predicate: recruits
    object: escrt_iii
    description: ESCRT-II recruits downstream ESCRT machinery needed for MVB cargo
      sorting.
    evidence:
    - reference: DOI:10.1016/S1534-5807(02)00219-8
      notes: Babst et al. 2002 identified ESCRT-II as an endosome-associated complex
        upstream of ESCRT-III.
  - subject: escrt_iii
    predicate: remodels
    object: endosome_membrane
    description: ESCRT-III acts on endosomal membranes during intraluminal vesicle
      formation.
    evidence:
    - reference: DOI:10.1016/S1534-5807(02)00220-4
      notes: Babst et al. 2002 characterized yeast ESCRT-III as an endosome-associated
        hetero-oligomeric protein complex required for MVB sorting.
  - subject: endosome_membrane
    predicate: invaginates into
    object: multivesicular_body
    description: In a multivesicular body, endosomal limiting-membrane regions invaginate
      to form intraluminal vesicles.
    evidence:
    - reference: GO:0005771
      notes: GO:0005771 defines multivesicular bodies as endosomes with internal vesicles
        formed by invagination of the limiting endosomal membrane.
