parent_structures:
- GO:0110165
part_of:
- GO:0106123
components:
- component_id: internal_membrane_profiles
  label: reservosome internal membrane profiles
  component_type: LIPID
  component_role: CONSTITUENT
  role: Planar membrane profiles that traverse the reservosome matrix and have a membrane
    architecture similar to the surrounding reservosome boundary membrane.
  evidence:
  - reference: GO:0106125
    notes: GO:0106125 defines the reservosome matrix as containing planar membranes.
  - reference: DOI:10.1002/jemt.20592
    notes: Sant'Anna et al. 2008 resolved membrane profiles and longer uranyl-acetate-stained
      internal membranes inside T. cruzi reservosomes.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral identifier was curated for the internal
    planar membranes of the reservosome matrix.
- component_id: internal_vesicles
  label: reservosome internal vesicles
  component_type: OTHER
  component_role: CONSTITUENT
  role: Intralumenal vesicles observed as part of the complex internal reservosome
    architecture.
  evidence:
  - reference: GO:0106125
    notes: GO:0106125 defines vesicles as constituents of the reservosome matrix.
  - reference: DOI:10.1002/jemt.20592
    notes: Sant'Anna et al. 2008 detected internal vesicles in T. cruzi reservosomes
      by electron microscopy.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral identifier was curated for reservosome
    internal vesicles distinct from the whole reservosome matrix.
- component_id: lipid_inclusions
  label: reservosome lipid inclusions
  component_type: LIPID
  component_role: CONSTITUENT
  role: Electron-lucent lipid inclusions embedded in the reservosome matrix and used
    to store sterols in T. cruzi epimastigotes.
  evidence:
  - reference: GO:0106125
    notes: GO:0106125 includes lipid inclusions in the reservosome matrix definition.
  - reference: DOI:10.1002/jemt.20592
    notes: Sant'Anna et al. 2008 described electron-lucent lipid bodies inside T.
      cruzi reservosomes.
  - reference: DOI:10.1371/journal.pone.0022359
    notes: Pereira et al. 2011 studied cholesterol mobilization from reservosome lipid
      inclusions in T. cruzi epimastigotes.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral identifier was curated for lipid inclusions
    specifically embedded in the reservosome matrix.
taxonomic_distribution:
- taxon_id: NCBITaxon:5693
  taxon_label: Trypanosoma cruzi
  presence: VARIABLE
  note: The reservosome matrix is present in the reservosomes of T. cruzi epimastigotes;
    reservosomes are absent from amastigotes and trypomastigotes.
  reference: DOI:10.1017/S0031182004005797
canonical_examples:
- taxon_id: NCBITaxon:5693
  taxon_label: Trypanosoma cruzi
  note: Kinetoplastid parasite whose epimastigote reservosome matrix was analyzed
    with thin-section, uranyl-acetate, and freeze-fracture electron microscopy.
  reference: DOI:10.1002/jemt.20592
functions:
- function_id: sterol_storage_in_lipid_inclusions
  label: sterol storage in reservosome lipid inclusions
  description: Reservosome lipid inclusions store and mobilize sterols, including
    cholesterol endocytosed by T. cruzi epimastigotes.
  evidence:
  - reference: DOI:10.1111/j.1574-6968.2002.tb11317.x
    notes: Cunha-e-Silva et al. 2002 isolated T. cruzi reservosomes and found large
      amounts of ergosterol and esterified cholesterol in the purified organelles.
  - reference: DOI:10.1371/journal.pone.0022359
    notes: Pereira et al. 2011 showed that T. cruzi epimastigotes store and mobilize
      cholesterol in reservosome lipid inclusions.
evidence:
- reference: GO:0106125
  notes: Gene Ontology cellular-component term for the reservosome matrix, defined
    as the planar membrane-, vesicle-, and lipid inclusion-containing matrix inside
    a reservosome.
- reference: GO:0110165
  notes: Gene Ontology cellular-component parent term for cellular anatomical structures.
- reference: GO:0106123
  notes: Gene Ontology cellular-component term for the containing reservosome organelle.
- reference: PMID:18452191
  notes: PubMed record for the Sant'Anna et al. 2008 reservosome ultrastructure study.
- reference: DOI:10.1002/jemt.20592
  notes: Sant'Anna et al. 2008, New insights into the morphology of Trypanosoma cruzi
    reservosome, Microscopy Research and Technique.
- reference: DOI:10.1017/S0031182004005797
  notes: 'Figueiredo et al. 2004, Reservosome: an endocytic compartment in epimastigote
    forms of the protozoan Trypanosoma cruzi (Kinetoplastida: Trypanosomatidae), Parasitology.'
- reference: DOI:10.1111/j.1574-6968.2002.tb11317.x
  notes: Cunha-e-Silva et al. 2002, Isolation and characterization of a reservosome
    fraction from Trypanosoma cruzi, FEMS Microbiology Letters.
- reference: DOI:10.1371/journal.pone.0022359
  notes: Pereira et al. 2011, Trypanosoma cruzi epimastigotes are able to store and
    mobilize high amounts of cholesterol in reservosome lipid inclusions, PLoS ONE.
