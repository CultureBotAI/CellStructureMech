  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Coated vesicles span clathrin, COPI, and COPII protein coats; no
    exact source-neutral InterPro, Pfam, NCBIfam, or Complex Portal identifier was
    curated for a universal coated-vesicle coat-protein family in this pass.
  role: Protein constituents that assemble into the clathrin, COPI, or COPII coat
    on a transport-vesicle membrane.
