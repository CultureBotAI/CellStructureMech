identifier: GO:0061474
label: phagolysosome membrane
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: The lipid bilayer surrounding a phagolysosome. In phagotrophic protists
  and amoebae (Dictyostelium discoideum, Entamoeba histolytica), the phagolysosome
  membrane is formed by SNARE-mediated fusion of late phagosomes with lysosomes and
  contains dense V-type H+-ATPase complexes, Nramp divalent metal efflux pumps, and
  heavily glycosylated LAMP-like membrane proteins that protect the bilayer from luminal
  hydrolases.
