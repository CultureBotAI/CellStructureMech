causal_graphs:
- graph_id: chromatophore_photophosphorylation
  title: Purple-bacterial chromatophores couple light harvesting to ATP synthesis
  description: LH2 antenna complexes and RC-LH1-PufX cores organize inside the plasma
    membrane-derived chromatophore membrane. Cyclic electron transport through quinone
    and cytochrome bc1 is coupled to F0F1-ATP synthase use of a chromatophore transmembrane
    proton motive force.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures membrane residence and the main energy-transduction
    logic without asserting the complete Rhodobacter cyclic electron-transfer kinetics.
