functions:
- function_id: photosynthetic_electron_transport
  label: photosynthetic electron transport chain
  grounding: GO:0009767
  description: Chromatophore membranes organize reaction-center antenna cores, peripheral
    antenna complexes and quinone-linked cytochrome bc1 so light absorption drives
    cyclic electron transport and builds a proton motive force.
  evidence:
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 directly imaged native chromatophore membranes and
      resolved how LH2 complexes are arranged around RC-LH1-PufX core arrays.
  - reference: DOI:10.1074/jbc.M412088200
    notes: Comayras et al. 2005 studied excitation transfer and quinone domains in
      Rhodobacter sphaeroides chromatophore membranes.
- function_id: photophosphorylation
  label: photosynthetic phosphorylation
  description: The sealed chromatophore vesicle membrane can maintain a light-driven
    electrochemical gradient that F0F1-ATP synthase uses to produce ATP.
  evidence:
  - reference: DOI:10.1016/S0006-3495(02)75470-2
    notes: Feniouk et al. 2002 assayed ATP synthesis in Rhodobacter capsulatus chromatophore
      vesicles driven by a transmembrane proton motive force.
