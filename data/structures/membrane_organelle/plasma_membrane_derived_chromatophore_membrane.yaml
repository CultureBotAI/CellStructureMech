components:
- component_id: chromatophore_lipid_bilayer
  label: chromatophore lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Plasma-membrane-derived bilayer that forms an internal purple-bacterial photosynthetic
    membrane and houses the pigment-protein and electron-transfer complexes used for
    photophosphorylation.
  evidence:
  - reference: GO:0042717
    notes: GO:0042717 defines the plasma membrane-derived chromatophore membrane as
      the lipid bilayer associated with bacterial chromatophores.
  - reference: uniprot.location:SL-0042
    notes: UniProt Subcellular Location SL-0042 describes the cellular chromatophore
      membrane as an internal, plasma-membrane-derived photosynthetic membrane in
      purple photosynthetic bacteria.
- component_id: rc_lh1_pufx_core_complex
  label: RC-LH1-PufX core complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Dimeric reaction-center and LH1 antenna hub that performs charge separation
    and receives excitation energy from surrounding LH2 antennae.
  evidence:
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 used atomic force microscopy to resolve linear arrays
      of dimeric RC-LH1-PufX core complexes in native Rhodobacter sphaeroides photosynthetic
      membranes.
  - reference: DOI:10.1074/jbc.M412088200
    notes: Comayras et al. 2005 connected the organization of Rhodobacter sphaeroides
      reaction-center antenna complexes to quinone and excitation-transfer behavior
      in chromatophores.
  grounding: cellstructuremech:rc_lh1_pufx_core_complex
- component_id: lh2_antenna_complexes
  label: LH2 peripheral light-harvesting antenna complexes
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: LH2 denotes peripheral bacteriochlorophyll-containing antenna complexes
    in purple bacterial chromatophore membranes; no exact source-neutral whole-complex
    CURIE was curated.
  role: Peripheral antenna complexes that extend the bacteriochlorophyll light-harvesting
    network and feed excitation energy toward RC-LH1 cores.
  evidence:
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 imaged LH2 antenna complexes interconnecting and
      clustering around RC-LH1-PufX core arrays in native Rhodobacter sphaeroides
      photosynthetic membranes.
  - reference: uniprot.location:SL-0042
    notes: UniProt SL-0042 lists antenna complexes among the contents of cellular
      chromatophore membranes.
- component_id: cytochrome_bc1_complex
  label: chromatophore cytochrome bc1 complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Membrane oxidoreductase that oxidizes quinol and returns electrons toward
    the reaction center through cytochrome c2 during cyclic photosynthetic electron
    transport.
  evidence:
  - reference: uniprot.location:SL-0042
    notes: UniProt SL-0042 lists cytochrome bc1 among the complexes contained in cellular
      chromatophore membranes.
  - reference: DOI:10.1074/jbc.M412088200
    notes: Comayras et al. 2005 modeled the functional consequences of photosynthetic-apparatus
      organization in Rhodobacter sphaeroides chromatophores, including quinone traffic
      between reaction centers and cytochrome bc1.
  grounding: cellstructuremech:chromatophore_cytochrome_bc1_complex
- component_id: f0f1_atp_synthase
  label: F0F1-ATP synthase
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The purple-bacterial chromatophore F0F1-ATP synthase is a bacterial
    rotary ATP synthase; an exact chromatophore-localized complex CURIE was not curated.
  role: Proton-driven rotary enzyme that uses the light-generated proton motive force
    across chromatophore membranes to synthesize ATP.
  evidence:
  - reference: uniprot.location:SL-0042
    notes: UniProt SL-0042 lists F0F1-ATPase among the complexes contained in cellular
      chromatophore membranes.
  - reference: DOI:10.1016/S0006-3495(02)75470-2
    notes: Feniouk et al. 2002 quantified ATP synthase in Rhodobacter capsulatus chromatophore
      vesicles and analyzed proton-driven ATP synthesis across those vesicles.
