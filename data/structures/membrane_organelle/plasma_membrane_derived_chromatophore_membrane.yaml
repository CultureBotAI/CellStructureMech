discussions:
- discussion_id: chromatophore_organellar_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Should the bacterial chromatophore membrane be merged with the Paulinella
    organellar chromatophore membrane terms?
  attaches_to:
  - xrefs
  - parent_structures
  resolution_note: No. GO and UniProt distinguish plasma membrane-derived chromatophore
    membranes in purple photosynthetic bacteria from the organellar chromatophore
    envelope membranes of Paulinella plastids, so this record uses GO:0042717 and
    UniProt SL-0042 only.
  evidence:
  - reference: GO:0042717
    notes: GO:0042717 denotes a bacterial plasma membrane-derived chromatophore membrane.
  - reference: GO:0070112
    notes: GO:0070112 separately denotes an organellar chromatophore membrane.
- discussion_id: ground_chromatophore_complexes
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact source-neutral component groundings for LH2 and F0F1-ATP synthase
    complexes in purple-bacterial chromatophore membranes.
  attaches_to:
  - components#lh2_antenna_complexes
  - components#f0f1_atp_synthase
  - causal_graphs#chromatophore_photophosphorylation
  rationale: LH2 antennae and F0F1-ATP synthase are supported as chromatophore constituents,
    but remain label-only components until exact source-neutral complex accessions
    are curated or minted.
