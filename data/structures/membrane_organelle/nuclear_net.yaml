identifier: cellstructuremech:nuclear_net
label: nuclear net
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: A reticulating double-membrane network characterized inside the nucleus
  of the dinoflagellate Polykrikos kofoidii. Its strands interconnect dinomitotic
  tunnels and the peripheral nuclear envelope, with regularly spaced swellings along
  the inner strands; the network is continuous with and forms part of the nuclear
  envelope.
definition_source: DOI:10.1038/s41598-018-37065-w
mapping_status: PROPOSED
