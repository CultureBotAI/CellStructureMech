  note: Wild-collected pseudocolonies. One specimen was reconstructed by FIB-SEM after
    high-pressure freezing and freeze substitution, complemented by TEM and confocal
    observations of additional specimens.
evidence:
- reference: DOI:10.1038/s41598-018-37065-w
  notes: Gavelis et al. (2019), Scientific Reports. Primary Results, Discussion, Conclusion,
    Methods and Figure 3 read via publisher and PMC BioC/JATS. Three-dimensional continuity
    supports nuclear-envelope parthood; chemical fixation disrupts the finer network.
    Neither lumenal flow nor a division mechanism was demonstrated.
- reference: GO:0005622
  notes: Verified broad intracellular-anatomical-structure parent. This named membrane
    network is not asserted to be a separate sealed organelle or the entire nuclear
    envelope.
discussions:
- discussion_id: identity_and_ontology_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the nuclear net from broader nuclear-envelope invaginations
    and neighboring structures.
  rationale: An exact mapping must denote the same entity rather than import unverified
    features.
  notes: All 589 QuickGO nuclear-net search results were retrieved across three pages;
    no exact name or definition match was found. GO:0044195 nucleoplasmic reticulum
    describes lamina-associated channels and is not asserted as equivalent or a parent
    without evidence for that scope. GO:0005622 supplies a conservative broader class.
    The nuclear envelope is a whole of which the net is part, not an is-a parent.
    Pusules and nucleus-to-flagellum ribbons are distinct structures.
  evidence:
  - reference: DOI:10.1038/s41598-018-37065-w
    notes: Results and Figure 3 establish the named network and its continuity.
  - reference: GO:0044195
    notes: Current QuickGO definition checked; exact equivalence not established.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: centrin_and_spindle_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not promote immunofluorescence proximity into a molecular constituent
    assignment.
  rationale: Confocal correspondence alone does not resolve the molecular composition
    of individual membrane strands.
  notes: Centrin labeling occurs between spindle-associated signals, but the authors
    explicitly call for super-resolution confirmation of colocalization. Tubulin labeling
    identifies spindles traversing nuclear tunnels, not a demonstrated lattice within
    the net strands. Neither protein is asserted as a net constituent; this is an
    evidence boundary, not proof of absence.
  evidence:
  - reference: DOI:10.1038/s41598-018-37065-w
    notes: Figure 4 Results and Conclusion distinguish observations from proposed
      confirmation.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: function_dynamics_and_taxonomic_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Establish molecular machinery, function, cell-cycle dynamics and three-dimensional
    occurrence beyond Polykrikos kofoidii.
  rationale: A reconstructed static network does not establish transport, mitotic
    force generation or clade-wide prevalence.
  notes: Retrospective two-dimensional images in other dinoflagellates are leads,
    not proof of the complete reticulating architecture. No prevalence, absence, fixed
    tunnel-count, transport, causal assembly or division claim is asserted. A later
    Prorocentrum cordatum study identifies nuclear-net investigation as future work,
    not an independent reconstruction of this network.
  evidence:
  - reference: DOI:10.1038/s41598-018-37065-w
    notes: Discussion and Conclusion retain these mechanistic and taxonomic questions.
  - reference: DOI:10.1128/msphere.00038-23
    notes: 'Kalvelage et al. (2023): primary Conclusion read; nuclear-net work remains
      prospective.'
  posed_by: codex
  posed_date: '2026-10-03'
