components:
- component_id: late_endosome_limiting_membrane
  label: late endosome limiting-membrane lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0005770 identifies the whole late endosome and GO:0010008 identifies
    the generic endosome membrane. No exact source-neutral GO or lipid-ontology CURIE
    was curated for the lipid bilayer of the late-endosome-specific limiting membrane
    in this pass.
  role: Lipid-bilayer constituent of the late endosome limiting membrane on which
    ESCRT machinery sorts membrane cargo and generates multivesicular-body intraluminal
    vesicles.
  evidence:
  - reference: GO:0005770
    notes: GO defines the late endosome as an endocytic organelle with a protein composition
      distinct from early endosomes.
  - reference: GO:0010008
    notes: GO defines the endosome membrane as the lipid bilayer surrounding an endosome.
  - reference: DOI:10.1083/jcb.200302136
    notes: Katzmann et al. 2003 localized Vps27 and ESCRT-I to yeast endosomal membranes
      during MVB sorting.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding yeast uses late endosome/multivesicular-body compartments for ESCRT-dependent
    sorting of ubiquitinated membrane cargo into intraluminal vesicles before vacuolar
    delivery.
  reference: PMID:11511343
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Yeast endosomal model in which ESCRT complexes sort membrane cargo into multivesicular
    bodies, a late-endosome child class.
  reference: PMID:11511343
functions:
- function_id: late_endosome_mvb_sorting
  label: multivesicular body sorting pathway
  grounding: GO:0071985
  description: Late endosomes can receive ubiquitinated transmembrane cargo into luminal
    vesicles through the ESCRT-dependent MVB sorting pathway.
  evidence:
  - reference: GO:0071985
    notes: GO denotes the pathway that targets ubiquitylated transmembrane proteins
      into multivesicular-body luminal vesicles.
  - reference: PMID:11511343
    notes: Katzmann, Babst and Emr 2001 identified ESCRT-I as a conserved yeast endosomal
      protein-sorting complex required for MVB cargo sorting.
- function_id: late_endosome_vacuolar_delivery
  label: late endosome vacuolar cargo delivery
  description: Late endosomal multivesicular bodies deliver endosomal membrane cargo
    toward vacuolar degradation.
  evidence:
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed MVB formation as the ESCRT-dependent
      route that packages endosomal cargo for lysosomal or vacuolar degradation.
