identifier: GO:0005770
label: late endosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A prelysosomal endocytic organelle differentiated from early endosomes
  by lower lumenal pH and different protein composition. Late endosomes are more spherical
  than early endosomes and are mostly juxtanuclear, being concentrated near the microtubule
  organizing center.
definition_source: GO:0005770
mapping_status: PROPOSED
