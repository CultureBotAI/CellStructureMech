causal_graphs:
- graph_id: yeast_late_endosome_mvb_sorting
  title: Late endosomal ESCRT sorting forms intraluminal vesicles
  description: Yeast ESCRT machinery acts at a late endosomal limiting membrane to
    sort ubiquitinated membrane cargo into intraluminal vesicles of multivesicular
    bodies.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the late-endosome parent boundary using the ESCRT-dependent
    MVB sorting pathway without asserting that every late endosome is already a multivesicular
    body, without treating transient ESCRT complexes as stable late-endosome components,
    and without enumerating the full cargo-recognition, deubiquitination, or Vps4
    recycling cycle.
  nodes:
  - node_id: late_endosome_limiting_membrane
    label: late endosome limiting membrane
    node_type: STRUCTURE
    component_ref: late_endosome_limiting_membrane
  - node_id: late_endosome_lumen
    label: late endosome lumen
    node_type: CELLULAR_LOCALIZATION
  - node_id: ubiquitinated_membrane_cargo
    label: ubiquitinated membrane cargo
    node_type: STATE
  - node_id: escrt_i
    label: ESCRT I complex
    node_type: STRUCTURE
    grounding: GO:0000813
  - node_id: escrt_ii
    label: ESCRT II complex
    node_type: STRUCTURE
    grounding: GO:0000814
  - node_id: escrt_iii
    label: ESCRT III complex
    node_type: STRUCTURE
    grounding: GO:0000815
  - node_id: intraluminal_vesicle
    label: intraluminal vesicle
    node_type: STRUCTURE
  - node_id: multivesicular_body
    label: multivesicular body
    node_type: ORGANELLE
    grounding: GO:0005771
  edges:
  - subject: late_endosome_limiting_membrane
    predicate: bounds
    object: late_endosome_lumen
    description: The late endosome limiting membrane encloses the late endosome lumen.
    evidence:
    - reference: GO:0031904
      notes: GO defines the endosome lumen as the volume enclosed by an endosome membrane.
  - subject: escrt_i
    predicate: sorts
    object: ubiquitinated_membrane_cargo
    description: ESCRT-I participates in sorting ubiquitinated membrane cargo into
      the yeast MVB pathway.
    evidence:
    - reference: PMID:11511343
      notes: Katzmann, Babst and Emr 2001 showed ESCRT-I is needed for ubiquitin-dependent
        MVB cargo sorting.
  - subject: escrt_ii
    predicate: recruits
    object: escrt_iii
    description: ESCRT-II recruits downstream ESCRT machinery needed for MVB cargo
      sorting.
    evidence:
    - reference: DOI:10.1016/j.devcel.2004.09.003
      notes: Teo et al. 2004 described ESCRT-II as part of the sequentially recruited
        endosomal ESCRT machinery and mapped direct ESCRT-II binding to the Vps20
        subunit of ESCRT-III.
  - subject: escrt_iii
    predicate: remodels
    object: late_endosome_limiting_membrane
    description: ESCRT-III acts on late endosomal membranes during intraluminal-vesicle
      formation.
    evidence:
    - reference: PMID:12194857
      notes: Babst et al. 2002 characterized yeast ESCRT-III as an endosome-associated
        complex required for MVB sorting.
    - reference: DOI:10.1016/j.devcel.2011.05.015
      notes: Henne, Buchkovich and Emr 2011 reviewed ESCRT-III as the membrane-remodeling
        complex in the endosomal ESCRT pathway.
  - subject: late_endosome_limiting_membrane
    predicate: buds inward to form
    object: intraluminal_vesicle
    description: During multivesicular-body formation, regions of the late endosomal
      limiting membrane invaginate and pinch into the lumen as intraluminal vesicles.
    evidence:
    - reference: GO:0005771
      notes: GO defines multivesicular bodies as late-endosome specializations with
        internal vesicles formed from the limiting endosomal membrane.
  - subject: intraluminal_vesicle
    predicate: is contained in
    object: multivesicular_body
    description: A multivesicular body contains intraluminal vesicles formed from
      its limiting membrane.
    evidence:
    - reference: GO:0005771
      notes: GO defines the multivesicular body by the presence of internal vesicles.
