  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - causal_graphs#yeast_late_endosome_mvb_sorting
  rationale: GO:0005770 captures the broader late endosome class and GO:0005771 is
    the multivesicular-body child that specifically contains intraluminal vesicles.
    This parent record therefore uses MVB sorting as a supported late-endosome example
    without asserting that intraluminal vesicles define every late endosome.
  evidence:
