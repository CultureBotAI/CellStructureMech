    notes: GO:0000324 describes the fungal-type vacuole as an acidic compartment containing
      acid hydrolases and serving as the primary degradation compartment.
  - reference: DOI:10.1016/j.bbamcr.2008.08.003
    notes: Li and Kane 2009 review yeast vacuole functions at the endpoint of degradative
      membrane-trafficking routes.
