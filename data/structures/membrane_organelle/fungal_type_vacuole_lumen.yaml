discussions:
- discussion_id: fungal_vacuole_lumen_boundary_not_membrane
  prompt: Represent the fungal-type vacuole membrane as the boundary of the fungal-type
    vacuole lumen rather than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#yeast_fungal_vacuole_lumen_storage_and_degradation
  rationale: GO:0000328 denotes the volume enclosed by the fungal-type vacuole membrane,
    whereas GO:0000329 denotes that surrounding lipid bilayer.
  resolution_note: Curated the membrane as a boundary node and left the lumen without
    constituent molecular components; soluble lumenal enzymes are represented as graph
    participants for degradation.
  evidence:
  - reference: GO:0000328
    notes: GO:0000328 identifies the internal fungal-type vacuole lumen.
  - reference: GO:0000329
    notes: GO:0000329 identifies the fungal-type vacuole membrane rather than the
      lumen.
  posed_by: codex
  posed_date: '2026-09-15'
  resolved_date: '2026-09-15'
