identifier: GO:0160201
label: polaroplast
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded organelle found in a microsporidian spore that swells
  with water and exerts pressure to rupture the polar cap and evert the polar tube.
definition_source: GO:0160201
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-10T11:31:25Z'
  curator: claude
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-10T11:32:26Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added polaroplast membrane and lamellar/tubular subregion components, Microsporidia
    and Nosema bombycis taxonomic scope, polar tube firing and sporoplasm membrane
    functions, polaroplast evidence, a membrane-transport graph, and a protein/lipid
    grounding TODO.
  llm_assisted: true
components:
- component_id: polaroplast_membranes
  label: polaroplast membranes
  component_type: LIPID
  component_role: CONSTITUENT
  role: Membrane sheets and tubules that form the polaroplast system in the anterior
    region of microsporidian spores.
  evidence:
  - reference: DOI:10.1007/978-3-030-93306-7_8
    notes: Han et al. 2022 reviewed the polaroplast as packed lamellar and tubular
      membrane arrays associated with the microsporidian invasion apparatus.
  - reference: DOI:10.1128/mbio.02749-23
    notes: Lv et al. 2024 tracked Nosema bombycis polaroplast membranes during germination
      and sporoplasm membrane formation.
- component_id: anterior_lamellar_polaroplast
  label: anterior lamellar polaroplast
  component_type: LIPID
  component_role: CONSTITUENT
  role: Densely packed lamellar membranes in the anterior sector of the polaroplast.
  evidence:
  - reference: DOI:10.1007/978-3-030-93306-7_8
    notes: Han et al. 2022 reviewed the lamellar polaroplast as a tightly packed anterior
      membrane array in the spore.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No source-neutral ontology term specific to the lamellar polaroplast
    subregion was curated in this pass.
- component_id: posterior_tubular_polaroplast
  label: posterior tubular polaroplast
  component_type: LIPID
  component_role: CONSTITUENT
  role: More vesicular and tubular membranes in the posterior polaroplast sector,
    adjacent to the polar filament straight region.
  evidence:
  - reference: DOI:10.1007/978-3-030-93306-7_8
    notes: Han et al. 2022 reviewed flattened tubules and posterior polaroplast membranes
      as part of the microsporidian spore invasion apparatus.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No source-neutral ontology term specific to the tubular polaroplast
    subregion was curated in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:6029
  taxon_label: Microsporidia
  presence: COMMON
  note: The polaroplast is a microsporidian spore organelle and is reviewed as part
    of the conserved invasion apparatus.
  reference: DOI:10.1007/978-3-030-93306-7_8
canonical_examples:
- taxon_id: NCBITaxon:27978
  taxon_label: Nosema bombycis
  note: Silkworm-infecting microsporidian in which polaroplast membranes were tracked
    through the polar tube and into the nascent sporoplasm membrane.
  reference: DOI:10.1128/mbio.02749-23
functions:
- function_id: polar_tube_firing_support
  label: polar tube firing support
  description: During microsporidian spore germination, the polaroplast expands and
    participates in the membrane movements coupled to polar tube discharge.
  evidence:
  - reference: DOI:10.1007/978-3-030-93306-7_8
    notes: Han et al. 2022 reviewed the polaroplast as an anterior membrane organelle
      associated with polar tube discharge.
  - reference: DOI:10.1186/s13071-023-05908-9
    notes: Chen et al. 2023 reviewed the microsporidian polar tube invasion apparatus
      and its relationship to other spore structures.
- function_id: sporoplasm_membrane_formation
  label: sporoplasm membrane formation
  description: Polaroplast membrane material travels through the fired polar tube
    and becomes part of the sporoplasm plasma membrane.
  evidence:
  - reference: DOI:10.1128/mbio.02749-23
    notes: Lv et al. 2024 followed polaroplast membrane transport through the polar
      tube and transformation into the sporoplasm membrane in Nosema bombycis.
evidence:
