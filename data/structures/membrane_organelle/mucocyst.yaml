parent_structures:
- GO:0030141
components:
- component_id: mucocyst_membrane
  label: mucocyst membrane
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO has an exact mucocyst term and a broader secretory-granule membrane
    term, but no exact mucocyst-membrane cellular-component term was available in
    this curation pass.
  role: Membrane that bounds the Tetrahymena mucocyst and encloses its regulated secretory
    cargo.
  evidence:
  - reference: DOI:10.1534/g3.116.028878
    notes: Kontur et al. 2016 describe Tetrahymena mucocysts as secretory granules
      that undergo a maturation process.
  - reference: DOI:10.1371/journal.pgen.1010194
    notes: Kuppannan et al. 2022 analyze Tetrahymena mucocysts as lysosome-related
      organelles that dock at the cell periphery and undergo regulated exocytosis.
- component_id: granule_lattice_proteins
  label: granule lattice proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  gene_symbols:
  - GRL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Tetrahymena Grl proteins are a mucocyst cargo family, but no exact
    source-neutral InterPro, Pfam or NCBIfam accession for the whole granule-lattice
    protein family was curated.
  role: Major dense-core cargo proteins that coassemble into the crystalline lattice
    of the mucocyst lumen.
  evidence:
  - reference: DOI:10.1128/EC.00151-09
    notes: Rahaman et al. 2009 distinguish Grl proteins as Tetrahymena dense-core
      granule proteins that coassemble into the lumenal crystalline lattice.
  - reference: DOI:10.1534/g3.116.028878
    notes: Kontur et al. 2016 connect mucocyst maturation defects to altered processing
      of granule cargo proteins.
- component_id: granule_tip_proteins
  label: granule tip proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  gene_symbols:
  - GRT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Tetrahymena Grt proteins are mucocyst tip cargo proteins with a
    beta/gamma-crystallin domain, but no exact source-neutral CURIE for this protein
    cohort was curated.
  role: Dense-core granule cargo proteins that occupy a mucocyst tip domain and are
    transported independently from Grl lattice cargo.
  evidence:
  - reference: DOI:10.1128/EC.00151-09
    notes: Rahaman et al. 2009 analyze Tetrahymena Grt1p and Grt2p as dense-core granule
      proteins distinct from the Grl lattice-protein cargo class.
- component_id: mucocyst_docking_discharge_complex
  label: MDD mucocyst docking and discharge complex
  component_type: PROTEIN_COMPLEX
  component_role: ASSOCIATED_MACHINERY
  essentiality: UNKNOWN
  gene_symbols:
  - MDL1
  - MDD
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Tetrahymena MDD complex was resolved as a mucocyst-associated
    membrane complex, but no exact Complex Portal or protein-family CURIE for the
    whole complex was curated.
  role: Mucocyst-associated membrane complex that localizes to the organelle tip and
    is required for efficient docking and regulated exocytosis.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1010194
    notes: Kuppannan et al. 2022 identify Mdl1p and associated MDD proteins as a Tetrahymena
      mucocyst membrane complex needed for organelle docking and regulated exocytosis.
taxonomic_distribution:
- taxon_id: NCBITaxon:5911
  taxon_label: Tetrahymena thermophila
  presence: COMMON
  note: Mucocysts are dense-core regulated secretory organelles characterized in Tetrahymena
    thermophila.
  reference: DOI:10.1534/g3.116.028878
canonical_examples:
- taxon_id: NCBITaxon:5911
  taxon_label: Tetrahymena thermophila
  note: Ciliate model in which mucocyst dense-core cargo sorting, maturation and docking
    have been studied genetically and cell biologically.
  reference: DOI:10.1534/g3.116.028878
functions:
- function_id: regulated_mucocyst_exocytosis
  label: regulated mucocyst exocytosis
  description: Docked mucocysts release dense-core cargo from the Tetrahymena cell
    surface in response to extracellular stimulation.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1010194
    notes: Kuppannan et al. 2022 link the MDD complex to docking and regulated exocytosis
      of Tetrahymena mucocysts.
  - reference: DOI:10.1128/EC.00151-09
    notes: Rahaman et al. 2009 describe Grl lattice expansion as a propulsive mechanism
      during dense-core granule release.
evidence:
- reference: GO:0036000
  notes: Gene Ontology cellular-component term for mucocyst.
- reference: DOI:10.1534/g3.116.028878
  notes: Kontur et al. 2016, Whole Genome Sequencing Identifies a Novel Factor Required
    for Secretory Granule Maturation in Tetrahymena thermophila, G3 Genes|Genomes|Genetics.
- reference: DOI:10.1128/EC.00151-09
  notes: Rahaman et al. 2009, Independent Transport and Sorting of Functionally Distinct
    Protein Families in Tetrahymena thermophila Dense Core Secretory Granules, Eukaryotic
    Cell.
- reference: DOI:10.1371/journal.pgen.1010194
  notes: Kuppannan et al. 2022, A novel membrane complex is required for docking and
    regulated exocytosis of lysosome-related organelles in Tetrahymena thermophila,
    PLOS Genetics.
