- discussion_id: maturation_factors_not_mature_mucocyst_components
  prompt: Tetrahymena maturation factors such as Mma1p, AP-3 and endosomal syntaxin
    were not modeled as mature mucocyst components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#mucocyst_docking_discharge_complex
  rationale: Mma1p and membrane-trafficking factors can be required for mucocyst biogenesis,
    but the first record only models cargo or machinery associated with mature docked
    or discharge-competent mucocysts. Proteins that act upstream in sorting or maturation
    should be added only if evidence places them in the mature organelle or at the
    assembled organelle boundary.
  evidence:
  - reference: DOI:10.1534/g3.116.028878
  posed_by: codex
  posed_date: '2026-09-12'
