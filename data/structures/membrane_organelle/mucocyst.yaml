identifier: GO:0036000
label: mucocyst
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A small subcellular vesicle, surrounded by a membrane, in the pellicle
  of ciliate protozoans that discharges a mucus-like secretion.
definition_source: GO:0036000
mapping_status: PROPOSED
