identifier: GO:0005759
label: mitochondrial matrix
structure_category: MEMBRANE_ORGANELLE
structure_kind: SUBCELLULAR_REGION
definition: The gel-like material, with considerable fine structure, that lies in
  the matrix space, or lumen, of a mitochondrion. It contains the enzymes of the tricarboxylic
  acid cycle and, in some organisms, the enzymes concerned with fatty acid oxidation.
