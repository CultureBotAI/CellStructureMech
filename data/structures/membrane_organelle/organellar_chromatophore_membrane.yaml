discussions:
- discussion_id: generic_membrane_scope
  prompt: Keep the generic organellar chromatophore membrane record separate from
    the exact inner, outer, and thylakoid membrane records.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: UniProt SL-0352 is used when the exact organellar chromatophore membrane
    is unknown, whereas GO:0070113, GO:0070114, and GO:0070118 identify exact inner,
    outer, and thylakoid membranes.
  resolution_note: Curated GO:0070112 as a generic parent/fallback localization record
    and kept membrane-specific topology and functions on the exact child records.
  evidence:
  - reference: uniprot.location:SL-0352
    notes: UniProt SL-0352 states that the generic membrane term is used when the
      exact outer, inner, or thylakoid membrane association is unknown.
  - reference: GO:0070112
    notes: GO:0070112 parents the exact inner, outer, and thylakoid organellar chromatophore
      membrane terms.
