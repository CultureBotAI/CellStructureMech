identifier: GO:0005802
label: trans-Golgi network
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: The network of interconnected tubular and cisternal structures located
  within the Golgi apparatus on the side distal to the endoplasmic reticulum, from
  which secretory vesicles emerge. The trans-Golgi network is important in the later
  stages of protein secretion where it is thought to play a key role in the sorting
  and targeting of secreted proteins to the correct destination.
