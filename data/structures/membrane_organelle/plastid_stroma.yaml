discussions:
- discussion_id: generic_stroma_contents
  prompt: Keep soluble enzymes and lineage-specific stromal inclusions out of the
    curated plastid stroma component list.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  rationale: GO:0009532 and UniProt SL-0215 identify the generic matrix space inside
    plastids. Exact inclusions such as chloroplast nucleoids and plastoglobules, as
    well as soluble stromal protein sets, belong on exact child records or future
    component-specific records rather than defining the generic stroma.
  resolution_note: Curated only plastid containment and left child-specific stroma
    contents to chloroplast, cyanelle, and other exact plastid records.
  evidence:
  - reference: GO:0009532
    notes: GO:0009532 identifies the generic plastid stroma but does not enumerate
      lineage-specific inclusions.
  - reference: uniprot.location:SL-0215
    notes: UniProt SL-0215 identifies the whole plastid stroma.
  posed_by: codex
  posed_date: '2026-09-13'
