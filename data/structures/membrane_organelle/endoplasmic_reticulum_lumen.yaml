    grounding: GO:0005783
  - node_id: sec61_translocon_complex
    label: Sec61 translocon complex
    node_type: STRUCTURE
    grounding: GO:0005784
  - node_id: secretory_protein_entry
    label: secretory protein entry into the ER
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: er_lumen
    predicate: is part of
    object: endoplasmic_reticulum
    description: The ER lumen is the volume inside the endoplasmic reticulum.
    evidence:
    - reference: GO:0005788
      notes: GO:0005788 identifies the endoplasmic reticulum lumen cellular component.
    - reference: GO:0005783
      notes: GO:0005783 identifies the containing endoplasmic reticulum.
  - subject: er_membrane
    predicate: bounds
    object: er_lumen
    description: The ER membrane encloses the endoplasmic reticulum lumen.
    evidence:
    - reference: GO:0005788
      notes: GO:0005788 defines the ER lumen as the volume enclosed by ER membranes.
    - reference: GO:0005789
      notes: GO:0005789 identifies the ER-bounding lipid bilayer.
  - subject: sec61_translocon_complex
    predicate: is embedded in
    object: er_membrane
    description: The Sec61 translocon complex is an ER membrane protein-conducting
      channel.
    evidence:
    - reference: GO:0005784
      notes: GO:0005784 identifies Sec61 as an endoplasmic reticulum translocon complex.
  - subject: sec61_translocon_complex
    predicate: supports
    object: secretory_protein_entry
    description: Yeast Sec61 supports insertion or translocation of proteins into
      the endoplasmic reticulum.
    evidence:
    - reference: DOI:10.1091/mbc.3.2.129
      notes: Stirling et al. 1992 characterized yeast sec61 alleles defective in ER
        protein insertion.
discussions:
- discussion_id: er_membrane_not_lumen_component
  prompt: Keep the ER membrane and Sec61 translocon as bounding or membrane-embedded
    structures rather than as ER lumen components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#er_lumen_topology
  rationale: GO:0005788 denotes the volume enclosed by ER membranes, whereas GO:0005789
    denotes the ER-bounding lipid bilayer and GO:0005784 denotes a membrane-embedded
    translocon.
  resolution_note: Represented the ER membrane and Sec61 translocon as topology graph
    nodes and left the ER lumen record without constituent components.
  evidence:
  - reference: GO:0005788
    notes: GO:0005788 identifies the endoplasmic reticulum lumen.
  - reference: GO:0005789
    notes: GO:0005789 identifies the membrane that bounds the ER lumen.
  - reference: GO:0005784
    notes: GO:0005784 identifies the Sec61 translocon complex.
  posed_by: codex
  posed_date: '2026-09-15'
