functions:
- function_id: er_lumen_secretory_protein_entry
  label: secretory protein entry into the ER
  description: The endoplasmic reticulum lumen is the membrane-enclosed compartment
    into which Sec61 translocons move secretory and membrane-protein substrates.
  evidence:
  - reference: GO:0005784
    notes: GO:0005784 identifies the Sec61 translocon complex as the heterotrimeric
      ER membrane channel that mediates cotranslational and posttranslational protein
      translocation.
  - reference: DOI:10.1091/mbc.3.2.129
    notes: Stirling et al. 1992 analyzed Saccharomyces cerevisiae sec61 mutants with
      endoplasmic-reticulum protein-insertion defects.
- function_id: er_lumen_quality_control
  label: ER lumen protein quality control
  description: The ER lumen is the enclosed compartment whose protein-folding state
    is monitored by the unfolded-protein-response and ER-associated-degradation pathways.
  evidence:
  - reference: DOI:10.1016/s0092-8674(00)80835-1
    notes: Travers et al. 2000 linked yeast unfolded-protein response signaling with
      ER-associated degradation.
