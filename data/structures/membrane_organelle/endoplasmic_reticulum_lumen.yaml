causal_graphs:
- graph_id: er_lumen_topology
  title: ER lumen topology and protein entry
  description: The endoplasmic reticulum lumen is the ER-internal volume enclosed
    by the ER membrane and reached by Sec61-dependent protein translocation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures ER lumen topology plus Sec61-dependent entry without
    asserting the full translocation cycle or luminal chaperone and ERAD repertoires.
  nodes:
  - node_id: er_lumen
    label: endoplasmic reticulum lumen
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0005788
  - node_id: er_membrane
    label: endoplasmic reticulum membrane
