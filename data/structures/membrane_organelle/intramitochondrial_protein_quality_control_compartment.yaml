functions:
- function_id: sequestration
  label: sequestration of aggregated mitochondrial proteins
  description: 'Concentrates insoluble matrix protein cargo into a restricted deposit.
    Preserved growth and import in the tested conditions do not imply universal protection:
    prolonged reporter expression increased menadione sensitivity and reduced cytochrome
    b translation.'
  evidence:
  - reference: DOI:10.1091/mbc.E17-01-0027
    notes: Figures 2-4 and Results compare reporter-bearing and control yeast. Functional
      costs depend on expression duration and stress; aggregation is not equivalent
      to degradation.
- function_id: biased_inheritance
  label: biased retention of mitochondrial aggregate deposits in mother cells
  description: Perinuclear deposits are preferentially retained during budding; daughter-cell
    inheritance is reduced, not eliminated.
  evidence:
  - reference: DOI:10.1091/mbc.E17-01-0027
    notes: 'Figure 5: after reporter induction and shutoff, about 7 percent of daughter
      cells inherited aggregates, compared with about 98 percent inheriting the control
      mitochondrial GFP signal.'
