label: intramitochondrial protein quality control compartment
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A mitochondrial membrane-enclosed deposit compartment characterized in
  budding yeast that sequesters aggregated matrix proteins, often near the nucleus
  and separated from the remaining tubular mitochondrial network.
definition_source: DOI:10.1242/jcs.263680
mapping_status: PROPOSED
