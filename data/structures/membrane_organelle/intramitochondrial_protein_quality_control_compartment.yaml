discussions:
- discussion_id: identity_and_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Define the membrane-enclosed deposit compartment, rather than its protein
    cargo alone.
  rationale: A protein aggregate is not equivalent to the entire membrane-enclosed
    IMiQ compartment. A broader ontology term must not replace the named identity.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1091/mbc.E17-01-0027
    notes: The named deposit is distinct from the residual network.
  - reference: DOI:10.1242/jcs.263680
    notes: Figure 1E and Discussion describe amorphous deposits surrounded by mitochondrial
      membranes.
  - reference: GO:0016234
    notes: Native definition of inclusion body covers aggregated molecular material;
      not selected as identity for the enclosing compartment.
  resolved_date: '2026-10-05'
  resolution_note: Mint IMiQ after bounded QuickGO and OLS GO label/synonym searches
    for IMiQ, intramitochondrial, the full name and mitochondrial protein aggregate
    did not identify an exact cellular-component term. Category and kind represent
    membrane enclosure, not an autonomous self-replicating organelle. Hidden/ignored-inclusive
    whole-worktree searches and parsed identities of 886 existing records found no
    duplicate. No invariant part_of link to an intact mitochondrion is imposed on
    a separated mitochondrial compartment.
- discussion_id: dump_equivalence
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve whether DUMP and IMiQ represent different states or different structures
    before merging or splitting their identities.
  rationale: The 2020 DUMP paper explicitly argues distinction from IMiQ based on
    network localization. The 2025 IMiQ paper instead considers likely similarity
    or possible identity, while noting functional differences.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1126/sciadv.abc7288
    notes: Abstract and Discussion and Conclusion read in PMC7406381.1. DUMP means
      deposits of unfolded mitochondrial proteins; the discussion explicitly contrasts
      them with IMiQ.
  - reference: DOI:10.1242/jcs.263680
    notes: Introduction discusses unresolved equivalence; its alternative-name wording
      in Discussion does not settle the conflict.
  notes: Do not add DUMP as an exact synonym, transfer its lipid-regulatory mechanism,
    or generalize its human-cell observations to IMiQ. A separate DUMP addition needs
    an explicit overlap decision.
- discussion_id: exact_component_classes
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact source-neutral grounding for Hsp78-type chaperones and the
    heterogeneous aggregate cargo where an appropriate authority supports it.
  rationale: The inspected Hsp78 InterPro matches are broader than the component;
    the cargo is not one protein family. Exact matches should not be fabricated.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P33416/?page_size=200
    notes: Nine integrated matches, no exact Hsp78-type family in this bounded result.
  - reference: DOI:10.1091/mbc.E17-01-0027
    notes: Reporter and variable endogenous cargo do not define a single sequence
      family.
  notes: Retain REVIEWED_LABEL_ONLY and no grounding for these two classes. The grounded
    Hsp70 label is deliberately family-level; recruitment is demonstrated only for
    the named yeast example.
- discussion_id: component_exclusions
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Distinguish directly localized chaperones from formation factors and potential
    copurifying cargo.
  rationale: Genetic effects and affinity enrichment alone do not define stable compartment
    composition. Reading the remaining 2025 Discussion clarified that Hsp60 colocalization
    could reflect failed precursor folding or coaggregation, rather than action on
    the assembled deposit.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1091/mbc.E17-01-0027
    notes: Hsp78, Fis1 and Fzo1 perturbations affect deposit organization.
  - reference: DOI:10.1242/jcs.263680
    notes: Chaperone microscopy and proteomic enrichment are different evidence types.
  - reference: DOI:10.1242/jcs.263680
    notes: Discussion contrasts Hsp60 precursor folding with resolubilization or neutralization
      of already aggregated proteins and proposes alternative explanations for its
      partial recruitment. Figure 4 alone does not distinguish those alternatives.
  resolved_date: '2026-10-05'
  resolution_note: 'Include Hsp78 and Ssc1 as associated machinery, not a fixed coat
    or invariant constituent set. Exclude Fis1/Fzo1 as demonstrated constituents;
    their perturbations remain in the graph. Mdj1, Ecm10, proteases and respiratory
    enzymes remain candidate interactors/cargo rather than fixed members. Sod2 is
    a localization control, and GFP-DHFR is a reporter, not a native subunit. Leave
    Hsp60 outside the canonical machinery list: its localization is supported, but
    its maintenance role on IMiQ is unresolved. This is not a claim of absence from
    deposits; it remains possible variable cargo.'
- discussion_id: condition_and_measurement_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve native prevalence, membrane composition, deposition lifetime and
    protocol-dependent chaperone recruitment.
  rationale: Artificial reporter induction establishes a structure under specified
    conditions, not broad taxonomic prevalence or a universal copy number. The 2018
    sedimentation results show little stable chaperone association; the 2025 microscopy
    shows recruitment that can be lost during isolation.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1091/mbc.E17-01-0027
    notes: Aggregate counts vary with induction/shutoff; prolonged expression has
      functional costs.
  - reference: DOI:10.1242/jcs.263680
    notes: Microscopy and biochemical isolation give different recruitment readouts.
  notes: Leave broad distribution, fixed stoichiometry and physical-property fields
    empty. Do not convert two-dimensional aggregate area or section counts into compartment
    diameter or copy number. No permanent inertness, resolved molecular tether, universal
    protective shell, or demonstrated mitophagic disposal is asserted.
