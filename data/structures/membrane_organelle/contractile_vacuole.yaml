      notes: Nishihara et al. 2008 localized Amoeba ApAQP to the contractile vacuole
        membrane and perivacuolar vesicles.
  - subject: osmotic_gradient
    predicate: fills
    object: water_filled_contractile_vacuole
    description: Osmotically driven water entry fills the central vacuole before discharge.
    evidence:
    - reference: DOI:10.1016/S0074-7696(02)15015-7
      notes: Allen and Naitoh 2002 review fluid filling as a phase of the contractile-vacuole
        cycle.
  - subject: water_filled_contractile_vacuole
    predicate: discharges
