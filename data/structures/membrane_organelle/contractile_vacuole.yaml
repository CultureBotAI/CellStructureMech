identifier: GO:0000331
label: contractile vacuole
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A specialized vacuole of eukaryotic cells, especially Protozoa, that fills
  with water from the cytoplasm and then discharges this externally by the opening
  of contractile vacuole pores. One of its functions is osmoregulatory.
definition_source: GO:0000331
mapping_status: PROPOSED
