components:
- component_id: v_type_atpase
  label: contractile vacuole V-ATPase
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Vacuolar H+-ATPases localize to contractile-vacuole membranes and
    associated vesicles in several lineages, but this broad record does not curate
    one exact lineage-neutral complex CURIE.
  role: Proton-pumping membrane complex that helps generate ion gradients needed to
    osmotically draw water into the contractile vacuole system.
  evidence:
  - reference: DOI:10.1242/jcs.115.14.2893
    notes: Clarke et al. 2002 followed vacuolar H+-ATPase dynamics in the Dictyostelium
      contractile-vacuole complex.
  - reference: DOI:10.1042/BC20070091
    notes: Nishihara et al. 2008 detected V-ATPase on vesicles around the Amoeba proteus
      contractile vacuole.
- component_id: contractile_vacuole_aquaporins
  label: contractile vacuole aquaporins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Aquaporin channels associated with contractile vacuoles are curated
    as a functional membrane-protein group; no exact lineage-neutral family grounding
    was chosen for this first record.
  role: Water channels on the contractile vacuole and associated vesicles that increase
    membrane water permeability during filling.
  evidence:
  - reference: DOI:10.1042/BC20070091
    notes: Nishihara et al. 2008 cloned an Amoeba proteus aquaporin and localized
      it to the contractile vacuole membrane and perivacuolar vesicles.
  - reference: DOI:10.1016/j.ejop.2024.126078
    notes: More et al. 2024 review membrane channels and receptors implicated in contractile-vacuole
      filling.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Contractile vacuoles occur patchily in unicellular eukaryotes, especially
    freshwater and soil protists, rather than throughout Eukaryota.
  reference: DOI:10.1016/j.ejop.2024.126078
canonical_examples:
- taxon_id: NCBITaxon:44689
  taxon_label: Dictyostelium discoideum
  note: Amoebozoan model in which vacuolar H+-ATPase dynamics have been followed in
    the contractile-vacuole complex.
  reference: DOI:10.1242/jcs.115.14.2893
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Freshwater alga used to show that contractile vacuole size and pulse frequency
    respond to changing external osmolarity.
  reference: DOI:10.1128/EC.00163-14
- taxon_id: NCBITaxon:5693
  taxon_label: Trypanosoma cruzi
  note: Kinetoplastid parasite in which acidocalcisomes and the contractile-vacuole
    complex have been linked to hyposmotic-stress responses.
  reference: DOI:10.1074/jbc.M410372200
functions:
- function_id: water_expulsion_osmoregulation
  label: osmoregulatory water expulsion
  description: The contractile vacuole fills with excess cytosolic water and periodically
    discharges that water outside the cell to maintain volume and osmotic balance.
  evidence:
  - reference: DOI:10.1016/S0074-7696(02)15015-7
    notes: Allen and Naitoh 2002 review the contractile-vacuole cycle as the osmoregulatory
      route for expelling cytosolic water.
  - reference: DOI:10.1128/EC.00163-14
    notes: Komsic-Buchmann et al. 2014 quantified changes in Chlamydomonas contractile-vacuole
      pulse frequency and size under different osmotic conditions.
evidence:
- reference: DOI:10.1016/S0074-7696(02)15015-7
  notes: Allen and Naitoh 2002, Osmoregulation and contractile vacuoles of protozoa,
    International Review of Cytology.
- reference: DOI:10.1242/jcs.115.14.2893
  notes: Clarke et al. 2002, Dynamics of the vacuolar H+-ATPase in the contractile
    vacuole complex and the endosomal pathway of Dictyostelium cells, Journal of Cell
    Science.
- reference: DOI:10.1042/BC20070091
  notes: Nishihara et al. 2008, Presence of aquaporin and V-ATPase on the contractile
    vacuole of Amoeba proteus, Biology of the Cell.
- reference: DOI:10.1128/EC.00163-14
  notes: Komsic-Buchmann, Wostehoff and Becker 2014, The contractile vacuole as a
    key regulator of cellular water flow in Chlamydomonas reinhardtii, Eukaryotic
    Cell.
- reference: DOI:10.1074/jbc.M410372200
  notes: Rohloff, Montalvetti and Docampo 2004, Acidocalcisomes and the contractile
