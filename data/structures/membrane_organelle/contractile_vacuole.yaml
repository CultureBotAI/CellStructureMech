  - subject: v_type_atpase
    predicate: generates
    object: osmotic_gradient
    description: Proton pumping by V-ATPase is proposed to help build ion gradients
      that osmotically favor water entry.
    evidence:
    - reference: DOI:10.1042/BC20070091
      notes: Nishihara et al. 2008 interpreted V-ATPase-positive vesicles around the
