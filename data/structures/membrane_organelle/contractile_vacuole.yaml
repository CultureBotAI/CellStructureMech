    Biological Chemistry.
- reference: DOI:10.1016/j.ejop.2024.126078
  notes: 'More et al. 2024, Contractile vacuoles: a rapidly expanding (and occasionally
    diminishing?) understanding, European Journal of Protistology.'
causal_graphs:
- graph_id: proton_gradient_water_filling_and_discharge
  title: Membrane pumps and water channels fill a contractile vacuole
  description: Contractile-vacuole membrane proteins generate osmotic gradients and
    water permeability that fill the vacuole. The filled vacuole then rounds and discharges
    through a plasma-membrane pore.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph summarizes pump/channel-assisted filling and discharge; the
    full force-generating mechanism for systole is still unresolved and is intentionally
    not asserted.
