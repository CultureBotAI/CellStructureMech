      pore to the exterior.
    evidence:
    - reference: DOI:10.1128/EC.00163-14
      notes: Komsic-Buchmann et al. 2014 measured osmolarity-dependent pulse-frequency
        and size changes during contractile-vacuole function in Chlamydomonas.
