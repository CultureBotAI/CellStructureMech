components:
- component_id: bchl_cde_aggregates
  label: bacteriochlorophyll c/d/e aggregates
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Principal antenna pigments in the chlorosome interior; they self-assemble
    into lamellar aggregates without a protein scaffold.
  evidence:
  - reference: DOI:10.1007/s11120-013-9869-3
    notes: Orf and Blankenship 2013 review chlorosome pigment self-assembly and identify
      bacteriochlorophyll c, d, and e as the natural major chlorosome pigments.
  - reference: DOI:10.1128/JB.00690-09
    notes: Psencik et al. 2009 combined cryo-electron microscopy, X-ray scattering,
      and pigment analysis to show lamellar bacteriochlorophyll aggregates in Chloroflexus
      aurantiacus chlorosomes.
- component_id: csma_baseplate
  label: CsmA bacteriochlorophyll a baseplate
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - csmA
  essentiality: ESSENTIAL
  role: Forms the bacteriochlorophyll a-containing protein baseplate that couples
    the pigment aggregate to downstream membrane reaction-center complexes.
  evidence:
  - reference: DOI:10.1038/ncomms12454
    notes: Nielsen et al. 2016 resolved the CsmA-containing baseplate antenna of Chlorobaculum
      tepidum chlorosomes in situ.
  - reference: DOI:10.1128/JB.00690-09
    notes: Psencik et al. 2009 visualized the crystalline baseplate lattice on one
      face of Chloroflexus aurantiacus chlorosomes and linked its lattice dimensions
      to a CsmA dimer building block.
