  edges:
  - subject: bchl_cde
    predicate: self-assembles inside
    object: chlorosome
    description: The major bacteriochlorophyll pigments self-assemble into lamellar
      aggregates that fill the chlorosome interior.
    evidence:
    - reference: DOI:10.1007/s11120-013-9869-3
      notes: Orf and Blankenship 2013 review pigment-pigment assembly of the main
        chlorosome antenna bacteriochlorophylls.
    - reference: DOI:10.1128/JB.00690-09
      notes: Psencik et al. 2009 resolved lamellar bacteriochlorophyll aggregates
        in Chloroflexus aurantiacus chlorosomes.
  - subject: lipid_monolayer
    predicate: surrounds
    object: bchl_cde
    description: The lipid-rich chlorosome envelope surrounds the pigment aggregate
      rather than forming a bilayer-bounded vesicle.
    evidence:
    - reference: DOI:10.1007/s11120-013-9869-3
      notes: Orf and Blankenship 2013 describe a lipid monolayer around the chlorosome
        pigment aggregate.
  - subject: csma_baseplate
    predicate: forms
    object: chlorosome
    description: CsmA is the main protein in the bacteriochlorophyll a-containing
      crystalline baseplate on one face of the chlorosome.
    evidence:
    - reference: DOI:10.1038/ncomms12454
      notes: Nielsen et al. 2016 resolved the in situ baseplate antenna structure
        and modelled the CsmA array of Chlorobaculum tepidum.
  - subject: bchl_cde
    predicate: transfers excitation to
    object: csma_baseplate
    description: Excitation energy from the self-assembled bacteriochlorophyll aggregate
      passes to the bacteriochlorophyll a-CsmA baseplate.
    evidence:
    - reference: DOI:10.1007/s11120-010-9533-0
      notes: Oostergetel et al. 2010 review the chlorosome-to-baseplate energy-transfer
        step.
  - subject: csma_baseplate
    predicate: couples to
    object: reaction_center_acceptor
    description: The baseplate is the exit antenna that connects the chlorosome to
      membrane-associated acceptors and reaction centers.
    evidence:
    - reference: DOI:10.1038/ncomms12454
      notes: Nielsen et al. 2016 describe the baseplate as the high-efficiency antenna
        between chlorosome pigments and downstream reaction-center proteins.
  - subject: reaction_center_acceptor
    predicate: supports
    object: photosynthesis
    description: Energy delivered out of the chlorosome feeds bacterial photosynthetic
      reaction centers.
    evidence:
    - reference: DOI:10.1007/s11120-013-9869-3
      notes: Orf and Blankenship 2013 place chlorosomes in the photosynthetic apparatus
        of green bacteria as antennae feeding reaction centers.
