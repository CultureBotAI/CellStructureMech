identifier: GO:0046858
label: chlorosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: OTHER
definition: A large light-harvesting antenna organelle of green photosynthetic bacteria
  in which bacteriochlorophyll aggregates self-assemble inside a lipid envelope and
  attach to the cytoplasmic membrane through a bacteriochlorophyll a-containing CsmA
  baseplate.
definition_source: GO:0046858
