taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Chlorosomes are restricted to particular anoxygenic phototrophs, including
    green sulfur bacteria, filamentous anoxygenic Chloroflexota, and a phototrophic
    Acidobacteriota lineage.
  reference: DOI:10.1007/s11120-013-9869-3
canonical_examples:
- taxon_id: NCBITaxon:1097
  taxon_label: Chlorobaculum tepidum
  note: Green sulfur bacterium used for in situ NMR, EM, and AFM modelling of the
    CsmA baseplate.
  reference: DOI:10.1038/ncomms12454
- taxon_id: NCBITaxon:1108
  taxon_label: Chloroflexus aurantiacus
  note: Green filamentous Chloroflexota model whose thin chlorosomes revealed baseplate
    and lamellar pigment architecture by cryo-EM and X-ray scattering.
  reference: DOI:10.1128/JB.00690-09
functions:
- function_id: photosynthetic_light_harvesting
  label: photosynthetic light harvesting
  description: Chlorosomes harvest weak light with dense bacteriochlorophyll aggregates
    and transfer excitation energy through the baseplate to membrane photosynthetic
    reaction centers.
  evidence:
  - reference: DOI:10.1007/s11120-010-9533-0
    notes: Oostergetel et al. 2010 review the chlorosome as a highly efficient photosynthetic
      light-harvesting antenna.
  - reference: DOI:10.1007/s11120-013-9869-3
    notes: Orf and Blankenship 2013 describe chlorosomes as the distinguishing antenna
      complexes of green photosynthetic bacteria.
evidence:
- reference: DOI:10.1007/s11120-013-9869-3
  notes: Orf GS and Blankenship RE 2013, Chlorosome antenna complexes from green photosynthetic
    bacteria, Photosynthesis Research.
- reference: DOI:10.1007/s11120-010-9533-0
  notes: 'Oostergetel GT, van Amerongen H and Boekema EJ 2010, The chlorosome: a prototype
    for efficient light harvesting in photosynthesis, Photosynthesis Research.'
- reference: DOI:10.1128/JB.00690-09
  notes: Psencik J et al. 2009, Structure of chlorosomes from the green filamentous
    bacterium Chloroflexus aurantiacus, Journal of Bacteriology.
- reference: DOI:10.1038/ncomms12454
  notes: Nielsen JT et al. 2016, In situ high-resolution structure of the baseplate
    antenna complex in Chlorobaculum tepidum, Nature Communications.
causal_graphs:
- graph_id: pigment_baseplate_energy_transfer
  title: Self-assembled pigments feed excitation energy into the baseplate
  description: Bacteriochlorophyll c/d/e pigments self-assemble inside a lipid monolayer,
    while CsmA builds a bacteriochlorophyll a-containing baseplate on one side of
    the chlorosome. The baseplate couples the dense pigment aggregate to downstream
    membrane reaction-center proteins so dim light can be harvested for anoxygenic
    photosynthesis.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
