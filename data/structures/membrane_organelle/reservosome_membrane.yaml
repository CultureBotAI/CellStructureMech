  taxon_label: Trypanosoma cruzi
  presence: VARIABLE
  note: Exhibits reservosome membrane (GO:0106126) within or across the reservosome
    limiting membrane. Reservosome lumens occur in reservosomes of T. cruzi epimastigotes
    and are absent from amastigote and trypomastigote life-cycle forms that lack reservosomes.
  reference: DOI:10.1017/S0031182004005797
canonical_examples:
- taxon_id: NCBITaxon:5693
  taxon_label: Trypanosoma cruzi
  note: Characterized model system for reservosome membrane (GO:0106126) within or
    across the reservosome limiting membrane. Kinetoplastid parasite whose epimastigote
    reservosomes were analyzed by thin-section, uranyl-acetate, and freeze-fracture
    electron microscopy to resolve complex internal membrane, vesicle, and lipid-inclusion
    architecture.
  reference: DOI:10.1002/jemt.20592
