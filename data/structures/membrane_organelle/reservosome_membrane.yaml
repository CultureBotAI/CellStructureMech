identifier: GO:0106126
label: reservosome membrane
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: The lipid bilayer surrounding a reservosome. The limiting lipid bilayer
  membrane surrounding the reservosome in Trypanosoma cruzi epimastigotes. It is enriched
  in ergosterol, P-type H+-ATPases, ABC transporters, and membrane-tethered Rab11
  GTPases that mediate endocytic vesicle fusion, luminal acidification, and regulated
  lipid and protein mobilization during metacyclogenesis.
