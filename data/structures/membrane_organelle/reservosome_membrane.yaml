causal_graphs:
- graph_id: reservosome_membrane_mechanism
  title: Reservosome membrane acidification and metacyclic mobilization pathway
  description: Membrane-associated Rab11 and proton pumps on the reservosome membrane
    maintain organellar identity and acidic luminal pH, enabling cruzipain-dependent
    proteolysis and membrane remodeling during differentiation of Trypanosoma cruzi
    epimastigotes.
