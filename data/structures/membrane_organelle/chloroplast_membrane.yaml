discussions:
- discussion_id: exclude_chloroplast_thylakoid_membrane
  prompt: Exclude GO:0009535 chloroplast thylakoid membrane from the GO:0031969 chloroplast
    membrane envelope-bilayer scope.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#chloroplast_membrane_scope
  rationale: GO:0031969 is defined as either lipid bilayer that surrounds a chloroplast
    and forms the chloroplast envelope, whereas GO:0009535 identifies the separate
    internal membrane of a chloroplast thylakoid.
  resolution_note: Curated GO:0031969 as the generic parent of only the inner and
    outer chloroplast envelope membranes and kept GO:0009535 as a distinct thylakoid-membrane
    term.
  evidence:
  - reference: GO:0031969
    notes: GO:0031969 defines the generic chloroplast membrane as either lipid bilayer
      that forms the chloroplast envelope.
  - reference: GO:0009535
    notes: GO:0009535 defines the chloroplast thylakoid membrane as the pigmented
      membrane of a chloroplast thylakoid, not as one of the chloroplast envelope
      bilayers.
  posed_by: codex
  posed_date: '2026-09-14'
