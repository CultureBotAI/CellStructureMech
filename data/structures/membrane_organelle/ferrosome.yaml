  title: Fez proteins form lipid-bounded ferrosomes for iron storage
  description: Fez proteins drive formation of lipid-bounded ferrosomes whose iron-,
    phosphorus- and oxygen-rich material stores iron during anaerobic metabolism.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures Fez-dependent formation and iron accumulation without
    asserting the molecular mechanism of membrane biogenesis, iron transport or core
    chemistry.
