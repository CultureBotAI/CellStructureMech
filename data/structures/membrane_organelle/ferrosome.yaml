identifier: cellstructuremech:ferrosome
label: ferrosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A bacterial lipid-bounded iron-storage organelle that contains iron-,
  phosphorus- and oxygen-rich material and forms through Fez protein-dependent machinery.
definition_source: DOI:10.1038/s41586-022-04741-x
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-11T14:03:57Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-11T14:04:31Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added membrane-bounded-organelle parentage, Fez protein, lipid boundary
    and iron-rich core components, Solidesulfovibrio magneticus RS-1 taxonomic scope,
    iron-storage function, DOI evidence, a nonmechanistic Fez formation graph, and
    grounding TODOs for Fez proteins and core chemistry.
  llm_assisted: true
- timestamp: '2026-09-11T14:05:08Z'
  curator: codex
  action: REFINED_GRAPH
  changes: Changed the terminal ferrosome graph edge from a stores-process relationship
    to a supports-process relationship and clarified the definition wording.
  llm_assisted: true
parent_structures:
- GO:0043231
components:
- component_id: fez_proteins
  label: ferrosome-associated Fez proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - fezA
  - fezB
  - fezC
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: FezA, FezB and FezC were curated as a ferrosome-associated protein
    cohort, but this pass did not verify exact source-neutral family CURIEs for the
    three unrelated Fez proteins or a complex CURIE for the cohort.
  role: Ferrosome-associated proteins that drive lipid-bounded ferrosome formation.
  evidence:
  - reference: DOI:10.1038/s41586-022-04741-x
    notes: Grant et al. 2022 used proteomics and genetics to identify Fez proteins
      required for ferrosome formation in Solidesulfovibrio magneticus RS-1.
- component_id: ferrosome_membrane_lipids
  label: ferrosome membrane lipids
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Ferrosomes are lipid bounded, but no exact ferrosome-specific lipid
    species or defined membrane mixture was curated.
  role: Form the lipid boundary that separates the ferrosome from the cytoplasm.
  evidence:
  - reference: DOI:10.1038/s41586-022-04741-x
    notes: Grant et al. 2022 characterized ferrosomes as a distinct class of lipid-bounded
      iron-storage organelles.
- component_id: iron_phosphorus_oxygen_core
  label: ferrosome iron-phosphorus-oxygen core
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Desulfovibrio magneticus RS-1 ferrosome content is iron-, phosphorus-
    and oxygen-rich, but its exact chemical species is not represented here by a verified
    CHEBI CURIE.
  role: Electron-dense storage material enriched in iron, phosphorus and oxygen within
    the lipid-bounded ferrosome.
  evidence:
  - reference: DOI:10.1073/pnas.1001290107
    notes: Byrne et al. 2010 observed membrane-surrounded amorphous iron-phosphorus
      granules in Desulfovibrio magneticus RS-1.
  - reference: DOI:10.1038/s41586-022-04741-x
    notes: Grant et al. 2022 connected the D. magneticus ferrosome compartment with
      intracellular iron storage.
taxonomic_distribution:
- taxon_id: NCBITaxon:573370
  taxon_label: Solidesulfovibrio magneticus RS-1
  presence: COMMON
  note: The RS-1 strain forms Fez-dependent ferrosomes and was the source used to
    identify membrane-bounded iron-phosphorus granules distinct from its magnetosomes.
  reference: DOI:10.1038/s41586-022-04741-x
canonical_examples:
- taxon_id: NCBITaxon:573370
  taxon_label: Solidesulfovibrio magneticus RS-1
  note: Magnetotactic bacterial model in which iron-phosphorus granules were resolved
    ultrastructurally and later tied to the Fez ferrosome-formation cluster.
  reference: DOI:10.1038/s41586-022-04741-x
functions:
- function_id: anaerobic_iron_storage
  label: anaerobic iron storage
  description: Ferrosomes store intracellular iron for use during anaerobic metabolism.
  evidence:
  - reference: DOI:10.1038/s41586-022-04741-x
    notes: Grant et al. 2022 tested ferrosome formation and function as an iron-storage
      organelle during anaerobic growth.
evidence:
- reference: DOI:10.1073/pnas.1001290107
  notes: Byrne et al. 2010, Desulfovibrio magneticus RS-1 contains an iron- and phosphorus-rich
    organelle distinct from its bullet-shaped magnetosomes, Proceedings of the National
    Academy of Sciences.
- reference: DOI:10.1038/s41586-022-04741-x
  notes: Grant et al. 2022, Distinct gene clusters drive formation of ferrosome organelles
    in bacteria, Nature.
causal_graphs:
