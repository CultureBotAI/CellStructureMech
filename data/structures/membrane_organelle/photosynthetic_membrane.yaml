identifier: GO:0034357
label: photosynthetic membrane
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: A membrane enriched in complexes formed of reaction centers, accessory
  pigments and electron carriers, in which photosynthetic reactions take place.
definition_source: GO:0034357
