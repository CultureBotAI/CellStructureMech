  grounding: GO:0009767
  description: Photosynthetic membranes organize light-harvesting antennae, reaction-center
    complexes, quinone carriers and quinol-oxidizing cytochrome complexes so illumination
    drives membrane electron transport and proton-motive-force generation.
  evidence:
  - reference: GO:0034357
    notes: GO defines photosynthetic membranes as the membrane site where photosynthetic
      reactions take place.
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review the thylakoid membrane electron-transport
      chain.
  - reference: DOI:10.1074/jbc.M412088200
    notes: Comayras et al. 2005 analyzed quinone-linked cyclic electron transport
      in Rhodobacter chromatophore membranes.
- function_id: photosynthesis_light_reaction
  label: photosynthesis, light reaction
  grounding: GO:0019684
  description: The membrane-localized pigment and carrier network supports light capture,
    charge separation and energy conversion during the light reactions of photosynthesis.
  evidence:
