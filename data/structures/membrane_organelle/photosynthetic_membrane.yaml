discussions:
- discussion_id: defer_reaction_center_subclasses
  prompt: Resolve exact source-neutral CURIEs for oxygenic PSI/PSII and anoxygenic
    reaction-center subclasses before splitting the broad reaction-center component.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#photosynthetic_reaction_center_complexes
  rationale: GO:0034357 spans multiple membrane systems whose photochemical cores
    are not all instances of the same lower-level complex term.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 cover oxygenic thylakoid PSI and PSII reaction
      centers.
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 resolve purple-bacterial RC-LH1-PufX cores rather
      than oxygenic photosystems.
  posed_by: codex
  posed_date: '2026-09-16'
- discussion_id: defer_antenna_subtype_boundaries
  prompt: Resolve how far to project membrane parthood for LH2 rings, phycobilisomes
    and chlorosome baseplates before adding lineage-specific antenna rows under photosynthetic
    membranes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#photosynthetic_light_harvesting_complexes
  rationale: Purple-bacterial LH2 complexes are integral chromatophore membrane complexes,
    whereas cyanobacterial phycobilisomes and green-bacterial chlorosome antennae
    can be peripherally attached to a photosynthetic membrane or baseplate rather
    than embedded in the bilayer itself.
  evidence:
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 imaged integral LH2 complexes in purple-bacterial
      chromatophore membranes.
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviewed phycobilisomes as large antennae associated with cyanobacterial
      thylakoid membranes.
  - reference: DOI:10.1038/ncomms12454
    notes: Nielsen et al. 2016 resolved the CsmA chlorosome baseplate that couples
      chlorosomes to membrane reaction centers.
  posed_by: codex
  posed_date: '2026-09-16'
- discussion_id: exclude_downstream_atp_synthases
  prompt: Keep ATP synthases out of this broad photosynthetic-membrane definition
    unless a child membrane record explicitly includes them as part of the same curated
    membrane system.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#membrane_light_reaction_energy_conversion
  rationale: Thylakoid and chromatophore membranes both maintain proton motive force
    for ATP synthesis, but GO:0034357 is defined by reaction centers, accessory pigments
    and electron carriers rather than by the downstream ATP synthase.
  evidence:
  - reference: GO:0034357
    notes: GO defines a photosynthetic membrane without naming ATP synthase as a defining
      component.
  - reference: DOI:10.1016/S0006-3495(02)75470-2
    notes: Feniouk et al. 2002 show that chromatophore vesicle membranes can drive
      ATP synthase without establishing ATP synthase as part of the GO:0034357 parent
      class.
  posed_by: codex
  posed_date: '2026-09-16'
