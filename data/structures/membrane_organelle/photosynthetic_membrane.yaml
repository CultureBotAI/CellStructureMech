    graph, and component-boundary TODOs.
  llm_assisted: true
parent_structures:
- GO:0016020
components:
- component_id: photosynthetic_lipid_bilayer
  label: photosynthetic lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for the lipid matrix shared by cyanobacterial
    thylakoids and purple-bacterial chromatophores was verified in this pass.
  role: Membrane lipid matrix that embeds photosynthetic pigment-protein complexes
    and separates aqueous phases so light-driven electron flow can build an electrochemical
    proton gradient.
  evidence:
  - reference: GO:0034357
    notes: GO defines photosynthetic membranes as membranes in which photosynthetic
      reactions take place.
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review the lipid-containing thylakoid membranes
      of cyanobacteria, algae and plants.
  - reference: DOI:10.1016/S0006-3495(02)75470-2
    notes: Feniouk et al. 2002 assayed light-driven ATP synthesis across sealed Rhodobacter
      capsulatus chromatophore vesicle membranes.
- component_id: photosynthetic_reaction_center_complexes
  label: photosynthetic reaction center complexes
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Reaction-center complexes span oxygenic photosystem I/II and anoxygenic
    bacterial reaction-center antenna cores; no single exact GO cellular-component
    term was curated for the whole set.
  role: Pigment-protein complexes that carry the primary photochemistry of photosynthesis
    by converting excitation energy into charge separation within the membrane.
  evidence:
  - reference: GO:0034357
    notes: GO includes reaction centers in the definition of a photosynthetic membrane.
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review photosystem I and photosystem II reaction
      centers as major thylakoid membrane complexes.
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 imaged dimeric reaction-center LH1-PufX core complexes
      in native purple-bacterial photosynthetic membranes.
- component_id: accessory_antenna_pigments
  label: accessory antenna pigments
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No single ChEBI term exactly covers the chlorophyll, bacteriochlorophyll,
    carotenoid and biliprotein-bound chromophores that act as accessory pigments across
    photosynthetic membranes.
  role: Light-absorbing cofactors that broaden spectral capture and route excitation
    energy toward reaction-center complexes.
  evidence:
  - reference: GO:0034357
    notes: GO includes accessory pigments in the definition of a photosynthetic membrane.
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review pigment-bearing photosystems and antennae
      in thylakoid membranes.
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 resolved bacteriochlorophyll-rich LH2 antenna complexes
      interconnecting purple-bacterial reaction-center arrays.
- component_id: photosynthetic_electron_carriers
  label: photosynthetic membrane electron carriers
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This broad component covers lineage-specific membrane quinone pools
    and carrier cofactors; no exact source-neutral CURIE for the whole electron-carrier
    set was curated.
  role: Membrane-associated electron carriers that shuttle redox equivalents between
    photosynthetic reaction centers, cytochrome complexes and other downstream acceptors.
  evidence:
  - reference: GO:0034357
    notes: GO includes electron carriers in the definition of a photosynthetic membrane.
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review plastoquinone-mediated electron transfer
      between PSII and cytochrome b6f in thylakoid membranes.
  - reference: DOI:10.1074/jbc.M412088200
    notes: Comayras et al. 2005 modeled quinone traffic between reaction centers and
      cytochrome bc1 in Rhodobacter sphaeroides chromatophore membranes.
taxonomic_distribution:
- taxon_id: NCBITaxon:1117
  taxon_label: Cyanobacteriota
  presence: COMMON
  note: Most cyanobacteria use thylakoid photosynthetic membranes for oxygenic light
    reactions; Gloeobacter-like lineages are the major exception because they photosynthesize
    at the plasma membrane.
  reference: DOI:10.1146/annurev-cellbio-120823-022747
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Photosynthetic membranes occur in phototrophic bacterial clades, including
    cyanobacterial thylakoids and the chromatophore membranes of purple photosynthetic
    bacteria.
  reference: DOI:10.1038/nature02823
canonical_examples:
- taxon_id: NCBITaxon:1148
  taxon_label: Synechocystis sp. PCC 6803
  note: Cyanobacterial model whose thylakoid photosynthetic membranes have been used
    to map native photosystem organization.
  reference: DOI:10.1016/j.molp.2017.09.019
- taxon_id: NCBITaxon:1063
  taxon_label: Cereibacter sphaeroides
  note: Purple photosynthetic bacterium whose native chromatophore photosynthetic
    membrane architecture was resolved by atomic force microscopy.
  reference: DOI:10.1038/nature02823
functions:
- function_id: photosynthetic_electron_transport
  label: photosynthetic electron transport chain
  grounding: GO:0009767
  description: Photosynthetic membranes organize light-absorbing reaction centers
    and electron carriers so illumination drives membrane electron transport and proton-motive-force
    generation.
  evidence:
  - reference: GO:0034357
    notes: GO defines photosynthetic membranes as the membrane site where photosynthetic
      reactions take place.
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review the thylakoid membrane electron-transport
      chain.
  - reference: DOI:10.1074/jbc.M412088200
    notes: Comayras et al. 2005 analyzed quinone-linked cyclic electron transport
      in Rhodobacter chromatophore membranes.
- function_id: photosynthesis_light_reaction
  label: photosynthesis, light reaction
  grounding: GO:0019684
  description: The membrane-localized pigment and carrier network supports light capture,
    charge separation and energy conversion during the light reactions of photosynthesis.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review thylakoid membranes as the site of oxygenic
      photosynthetic light reactions.
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 resolved the purple-bacterial chromatophore membrane
      that contains reaction-center and light-harvesting complexes.
