    notes: Perez-Boerema et al. 2024 review thylakoid membranes as the site of oxygenic
      photosynthetic light reactions.
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 resolved the purple-bacterial chromatophore membrane
      that contains reaction-center and light-harvesting complexes.
