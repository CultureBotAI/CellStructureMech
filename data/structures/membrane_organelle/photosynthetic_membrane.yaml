causal_graphs:
- graph_id: membrane_light_reaction_energy_conversion
  title: Photosynthetic membranes couple light absorption to membrane electron flow
  description: Accessory antenna pigments and reaction-center complexes are embedded
    in a photosynthetic lipid bilayer with membrane electron carriers, enabling light
    reactions that drive photosynthetic electron transport and proton-gradient formation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the shared membrane-level light-reaction architecture
    without modeling oxygenic PSII-to-PSI linear transport, purple-bacterial cyclic
    RC-LH1/bc1 transport, soluble carriers or ATP synthase coupling in detail.
