  - subject: mitosome_inner_membrane
    predicate: delimits
    object: mitosome_intermembrane_space
    description: The mitosome inner membrane forms the matrix-facing boundary of the
      intermembrane space.
    evidence:
    - reference: uniprot.location:SL-0440
      notes: UniProt SL-0440 defines the mitosome intermembrane space as the space
        between the inner and outer mitosomal membranes.
    - reference: uniprot.location:SL-0439
      notes: UniProt SL-0439 defines the mitosome inner membrane by its position between
