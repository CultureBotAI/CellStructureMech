  - subject: plasmepsin_x_exoneme_protease
    predicate: localizes to
    object: exoneme
    description: PMX localizes to small ovoid exoneme secretory vesicles in segmented
      P. falciparum schizonts.
    evidence:
    - reference: DOI:10.1126/science.aan1478
      notes: Nasamu et al. 2017 localized PMX to exonemes by immuno-electron microscopy.
  - subject: plasmepsin_x_exoneme_protease
    predicate: supports maturation of
    object: pfsub1_exoneme_protease
    description: PMX supports the final processing step that converts semi-pro SUB1
      to mature SUB1.
    evidence:
    - reference: DOI:10.1126/science.aan1478
      notes: Nasamu et al. 2017 found that PMX knockdown blocked the second SUB1 maturation
        step.
  - subject: pfsub1_exoneme_protease
    predicate: resides in
    object: exoneme
    description: PfSUB1 is stored in dense granule-like exonemes before egress.
    evidence:
    - reference: DOI:10.1016/j.cell.2007.10.049
      notes: Yeoh et al. 2007 identified PfSUB1 in previously unrecognized organelles
        termed exonemes.
  - subject: exoneme
    predicate: discharges
    object: pfsub1_exoneme_protease
    description: Exonemes release soluble PfSUB1 into the PV shortly before erythrocyte
      egress.
    evidence:
    - reference: DOI:10.1111/j.1462-5822.2008.01176.x
      notes: Blackman 2008 reviews PfSUB1 release from exonemes into the PV space
        just prior to egress.
  - subject: pfsub1_exoneme_protease
    predicate: is discharged into
    object: parasitophorous_vacuole
    description: On exoneme discharge, PfSUB1 enters the parasitophorous vacuole.
    evidence:
    - reference: DOI:10.1038/ncomms4726
      notes: Withers-Martinez et al. 2014 describe SUB1 release into the PV lumen
        minutes before egress.
  - subject: pfsub1_exoneme_protease
    predicate: processes
    object: sera_msp_substrates
    description: PV-released PfSUB1 proteolytically processes SERA and MSP substrates.
    evidence:
    - reference: DOI:10.1126/science.aan1478
      notes: Nasamu et al. 2017 connected PMX-dependent SUB1 maturation to SERA5 and
        MSP1 processing.
  - subject: sera_msp_substrates
    predicate: support
    object: erythrocyte_egress
    description: Processing of SERA and merozoite surface proteins is part of the
      protease cascade used for merozoite egress from erythrocytes.
    evidence:
    - reference: DOI:10.1038/ncomms4726
      notes: Withers-Martinez et al. 2014 review SUB1 cleavage of egress and invasion
        substrates.
  - subject: pfsub1_exoneme_protease
    predicate: supports
    object: merozoite_invasion_capacity
    description: PfSUB1 activity contributes to the invasive capacity of merozoites
      released after egress.
    evidence:
    - reference: DOI:10.1016/j.cell.2007.10.049
      notes: Yeoh et al. 2007 found that PfSUB1 blockade inhibited egress and ablated
        the invasive capacity of released merozoites.
