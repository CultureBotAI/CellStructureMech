identifier: GO:0044311
label: exoneme
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A dense granule-like organelle of the apical complex of merozoites, released
  into the parasitophorous vacuole, mediating protease-dependent rupture and parasite
  exit from the infected erythrocyte.
definition_source: GO:0044311
mapping_status: PROPOSED
