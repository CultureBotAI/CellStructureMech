components:
- component_id: pfsub1_exoneme_protease
  label: PfSUB1 exoneme protease
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SUB1 is curated as a Plasmodium exoneme cargo protease; no exact
    source-neutral protein-family CURIE was resolved for this first exoneme record.
  gene_symbols:
  - sub1
  role: Secretory subtilisin-like serine protease stored in exonemes and released
    into the parasitophorous vacuole shortly before egress to process SERA and merozoite-surface
    protein substrates.
  evidence:
  - reference: DOI:10.1016/j.cell.2007.10.049
    notes: Yeoh et al. 2007 identified PfSUB1 in dense granule-like exonemes and connected
      its regulated release to SERA processing, egress, and merozoite invasion competence.
  - reference: DOI:10.1111/j.1462-5822.2008.01176.x
    notes: Blackman 2008 reviews PfSUB1 discharge from exonemes into the PV space
      just before P. falciparum blood-stage egress.
- component_id: plasmepsin_x_exoneme_protease
  label: plasmepsin X exoneme protease
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PMX is curated as a Plasmodium exoneme-associated aspartic protease;
    no exact source-neutral protein-family CURIE was resolved for this first exoneme
    record.
  gene_symbols:
  - pmx
  role: Exoneme-localized aspartic protease that supports the final maturation step
    of the PfSUB1 egress protease.
  evidence:
  - reference: DOI:10.1126/science.aan1478
    notes: Nasamu et al. 2017 localized Plasmepsin X to exonemes and linked PMX knockdown
      to impaired SUB1 maturation and egress.
taxonomic_distribution:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  presence: COMMON
  note: Exonemes are directly evidenced in Plasmodium falciparum segmented schizonts
    and blood-stage merozoites; no broader apicomplexan distribution is asserted in
    this first record.
  reference: DOI:10.1016/j.cell.2007.10.049
canonical_examples:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  note: Human malaria parasite in which PfSUB1 discharge from exonemes into the parasitophorous
    vacuole was tied to SERA processing and erythrocyte egress.
  reference: DOI:10.1016/j.cell.2007.10.049
functions:
- function_id: regulated_sub1_discharge
  label: regulated PfSUB1 discharge
  description: Exonemes release PfSUB1 into the parasitophorous vacuole shortly before
    P. falciparum erythrocyte egress.
  evidence:
  - reference: DOI:10.1111/j.1462-5822.2008.01176.x
    notes: Blackman 2008 reviews the regulated release of PfSUB1 from exonemes into
      the PV space just before egress.
  - reference: DOI:10.1038/ncomms4726
    notes: Withers-Martinez et al. 2014 describe SUB1 discharge from exonemes into
      the PV lumen minutes before egress.
- function_id: erythrocyte_egress_protease_delivery
  label: erythrocyte egress protease delivery
  description: Exoneme discharge delivers mature PfSUB1 to process SERA and MSP substrates
    that support rupture of the parasitophorous vacuole and erythrocyte membranes.
  evidence:
  - reference: DOI:10.1016/j.cell.2007.10.049
    notes: Yeoh et al. 2007 connected PfSUB1 exoneme discharge to SERA maturation,
      host-cell egress, and the invasive capacity of released merozoites.
  - reference: DOI:10.1126/science.aan1478
    notes: Nasamu et al. 2017 placed PMX upstream of SUB1 maturation and SERA5/MSP1
      processing in the P. falciparum egress cascade.
evidence:
- reference: DOI:10.1016/j.cell.2007.10.049
  notes: Yeoh et al. 2007, Subcellular discharge of a serine protease mediates release
    of invasive malaria parasites from host erythrocytes, Cell.
- reference: DOI:10.1111/j.1462-5822.2008.01176.x
  notes: 'Blackman 2008, Malarial proteases and host cell egress: an ''emerging''
    cascade, Cellular Microbiology.'
- reference: DOI:10.1038/ncomms4726
  notes: Withers-Martinez et al. 2014, The malaria parasite egress protease SUB1 is
    a calcium-dependent redox switch subtilisin, Nature Communications.
- reference: DOI:10.1126/science.aan1478
  notes: Nasamu et al. 2017, Plasmepsins IX and X are essential and druggable mediators
    of malaria parasite egress and invasion, Science.
