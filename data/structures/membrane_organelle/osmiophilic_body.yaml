functions:
- function_id: female_gametocyte_emergence
  label: female gametocyte emergence support
  description: Osmiophilic bodies in mature P. falciparum female gametocytes support
    efficient emergence from erythrocytes after gametogenesis is induced.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2007.06039.x
    notes: De Koning-Ward et al. 2008 found that Pfg377-negative female gametocytes
      lack the full osmiophilic-body complement and are less efficient at emergence
      from erythrocytes.
- function_id: malaria_transmission_to_mosquito
  label: mosquito infection support
  description: Normal osmiophilic-body formation contributes to P. falciparum transmission
    to mosquitoes after a gametocyte-containing blood meal.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2007.06039.x
    notes: De Koning-Ward et al. 2008 linked the Pfg377-negative osmiophilic-body
      defect to a strong reduction in mosquito oocyst formation.
