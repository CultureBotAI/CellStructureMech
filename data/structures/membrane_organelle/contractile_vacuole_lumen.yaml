- reference: DOI:10.1128/EC.00163-14
  notes: Komsic-Buchmann, Wostehoff and Becker 2014, The contractile vacuole as a
    key regulator of cellular water flow in Chlamydomonas reinhardtii, Eukaryotic
    Cell.
- reference: DOI:10.1242/jeb.205.20.3261
  notes: Gronlien et al. 2002, Relationship between the membrane potential of the
    contractile vacuole complex and its osmoregulatory activity in Paramecium multimicronucleatum,
    Journal of Experimental Biology.
- reference: DOI:10.1016/j.ejop.2024.126078
  notes: 'More et al. 2024, Contractile vacuoles: a rapidly expanding and occasionally
    diminishing understanding, European Journal of Protistology.'
causal_graphs:
