  edges:
  - subject: contractile_vacuole_lumen
    predicate: is part of
    object: contractile_vacuole
    description: The contractile vacuole lumen is the internal compartment inside
      a contractile vacuole.
    evidence:
    - reference: uniprot.location:SL-0320
      notes: UniProt SL-0320 places the contractile vacuole lumen under the contractile
        vacuole subcellular location.
    - reference: GO:0000331
      notes: GO:0000331 identifies the containing contractile vacuole.
  - subject: contractile_vacuolar_membrane
    predicate: bounds
    object: contractile_vacuole_lumen
    description: The contractile vacuolar membrane is the lipid bilayer boundary of
      the contractile vacuole lumen.
    evidence:
    - reference: uniprot.location:SL-0320
      notes: UniProt SL-0320 defines the contractile vacuole lumen as bounded by the
        contractile vacuole membrane.
    - reference: GO:0031164
      notes: GO:0031164 identifies the membrane surrounding the contractile vacuole.
discussions:
- discussion_id: lumen_boundary_not_membrane_component
  prompt: Represent the contractile vacuolar membrane as the boundary of the lumen
    rather than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#contractile_vacuole_lumen_topology
  rationale: UniProt SL-0320 denotes the contractile vacuole compartment bounded by
    the contractile vacuole membrane, whereas GO:0031164 denotes the surrounding lipid
    bilayer.
  resolution_note: Curated the membrane as a boundary node and left the lumen record
    without constituent molecular components.
  evidence:
  - reference: uniprot.location:SL-0320
    notes: SL-0320 identifies the internal contractile vacuole lumen.
  - reference: GO:0031164
    notes: GO:0031164 identifies the contractile vacuolar membrane rather than the
      lumen it encloses.
  posed_by: codex
  posed_date: '2026-09-13'
