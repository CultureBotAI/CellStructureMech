  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures defining lumen topology without duplicating whole-organelle
    osmoregulation or membrane-channel mechanisms curated on the containing vacuole
    and its bounding membrane.
  nodes:
  - node_id: contractile_vacuole_lumen
    label: contractile vacuole lumen
