functions:
- function_id: contractile_vacuole_lumen_water_accumulation
  label: contractile-vacuole water accumulation
  description: The contractile vacuole lumen expands as excess water enters the vacuole
    before periodic systolic discharge.
  evidence:
  - reference: DOI:10.1016/S0074-7696(02)15015-7
    notes: Allen and Naitoh 2002 review fluid filling and discharge as phases of the
      contractile-vacuole cycle.
  - reference: DOI:10.1128/EC.00163-14
    notes: Komsic-Buchmann et al. 2014 measured contractile vacuole volume and contraction
      interval changes in Chlamydomonas under altered osmolarity.
evidence:
- reference: uniprot.location:SL-0320
  notes: UniProt Subcellular Location entry SL-0320 identifies the contractile vacuole
    lumen, lists contractile vacuolar lumen as an exact synonym, and places the lumen
    under the contractile vacuole.
- reference: GO:0005775
  notes: Gene Ontology cellular-component term for the broader vacuolar lumen class.
- reference: GO:0000331
  notes: Gene Ontology cellular-component term for the containing contractile vacuole.
- reference: GO:0031164
  notes: Gene Ontology cellular-component term for the contractile vacuolar membrane
    that bounds this lumen.
- reference: DOI:10.1016/S0074-7696(02)15015-7
  notes: Allen and Naitoh 2002, Osmoregulation and contractile vacuoles of protozoa,
