  reference: DOI:10.1105/tpc.106.041749
canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Green-algal model in which eyespot-assembly mutants defined loci required
    for pigmented eyespot formation and placement.
  reference: DOI:10.1093/genetics/153.2.721
functions:
- function_id: directional_phototaxis_light_detection
  label: directional light detection for phototaxis
  description: The eyespot apparatus uses carotenoid layers to shade photoreceptors
    so a motile cell can infer the direction of incident light.
  evidence:
  - reference: DOI:10.1073/pnas.1525538113
    notes: Ueki et al. 2016 showed that Chlamydomonas eyespot pigment layers determine
      the phototactic sign by shielding photoreceptors from light condensed through
      the cell body.
evidence:
