components:
- component_id: eyespot_carotenoid_pigments
  label: eyespot carotenoid pigments
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Chlamydomonas eyespot pigment-granule layers are carotenoid-rich,
    but this pass did not resolve the exact stored carotenoid species or a precise
    CHEBI grounding for the eyespot pigment cohort.
  role: Carotenoid pigments concentrated in reflective granule layers that shade eyespot
    photoreceptors from light condensed through the cell body.
  evidence:
  - reference: DOI:10.1093/genetics/153.2.721
    notes: Lamb et al. 1999 described reflective carotenoid pigment layers beneath
      the Chlamydomonas plasma-membrane photoreceptor region.
  - reference: DOI:10.1073/pnas.1525538113
    notes: Ueki et al. 2016 tested how eyespot carotenoid layers shield Chlamydomonas
      photoreceptors.
- component_id: channelrhodopsin_photoreceptors
  label: eyespot channelrhodopsin photoreceptors
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Channelrhodopsins are curated as a Chlamydomonas eyespot photoreceptor
    cohort; this pass did not verify exact source-neutral family groundings or split
    ChR1 and ChR2 into separate protein families.
  role: Light-gated rhodopsin photoreceptors positioned at the eyespot to initiate
    phototaxis signaling.
  evidence:
  - reference: DOI:10.1083/jcb.201009131
    notes: Mittelmeier et al. 2011 followed Chlamydomonas ChR1 localization at the
      eyespot photoreceptor patch.
  - reference: DOI:10.1038/srep34646
    notes: Awasthi et al. 2016 followed bacterial-type rhodopsin trafficking into
      the Chlamydomonas eyespot and flagella.
taxonomic_distribution:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  presence: COMMON
