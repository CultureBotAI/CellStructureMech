causal_graphs:
- graph_id: yeast_escrt_mvb_vesicle_formation
  title: ESCRT machinery forms intraluminal vesicles in yeast MVBs
  description: In Saccharomyces cerevisiae, ESCRT complexes sort ubiquitinated endosomal
    membrane cargo and remodel the multivesicular-body membrane to generate intraluminal
    vesicles.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures ESCRT-dependent intraluminal vesicle formation
    without asserting a full model of Vps27/Hse1 cargo recognition, deubiquitination,
    Vps4 recycling or vacuolar fusion.
  nodes:
  - node_id: multivesicular_body_membrane
    label: multivesicular body membrane
    node_type: STRUCTURE
    grounding: GO:0032585
  - node_id: ubiquitinated_membrane_cargo
    label: ubiquitinated membrane cargo
    node_type: STATE
  - node_id: escrt_i
    label: ESCRT I complex
    node_type: STRUCTURE
    grounding: GO:0000813
  - node_id: escrt_ii
    label: ESCRT II complex
    node_type: STRUCTURE
    grounding: GO:0000814
  - node_id: escrt_iii
    label: ESCRT III complex
    node_type: STRUCTURE
    grounding: GO:0000815
  - node_id: intraluminal_vesicle
    label: intraluminal vesicle
    node_type: STRUCTURE
  - node_id: multivesicular_body
    label: multivesicular body
    node_type: ORGANELLE
    grounding: GO:0005771
  edges:
  - subject: escrt_i
    predicate: sorts
    object: ubiquitinated_membrane_cargo
    description: ESCRT-I participates in sorting ubiquitinated membrane cargo into
      the yeast MVB pathway.
    evidence:
    - reference: PMID:11511343
      notes: Katzmann, Babst and Emr 2001 showed ESCRT-I is needed for ubiquitin-dependent
        MVB cargo sorting.
  - subject: escrt_ii
    predicate: recruits
    object: escrt_iii
    description: ESCRT-II recruits downstream ESCRT machinery needed for MVB cargo
      sorting.
    evidence:
    - reference: DOI:10.1016/j.devcel.2004.09.003
      notes: Teo et al. 2004 described ESCRT-II as part of the sequentially recruited
        endosomal ESCRT machinery and mapped direct ESCRT-II binding to the Vps20
        subunit of ESCRT-III.
  - subject: escrt_iii
    predicate: remodels
    object: multivesicular_body_membrane
    description: ESCRT-III acts on endosomal membranes during MVB intraluminal-vesicle
      formation.
    evidence:
    - reference: PMID:12194857
      notes: Babst et al. 2002 characterized yeast ESCRT-III as an endosome-associated
        complex required for MVB sorting.
    - reference: DOI:10.1016/j.devcel.2011.05.015
      notes: Henne, Buchkovich and Emr 2011 reviewed ESCRT-III as the membrane-remodeling
        complex in the endosomal ESCRT pathway.
  - subject: multivesicular_body_membrane
    predicate: buds inward to form
    object: intraluminal_vesicle
    description: Regions of the multivesicular-body limiting membrane invaginate and
      pinch into the lumen as intraluminal vesicles.
    evidence:
    - reference: GO:0005771
      notes: GO:0005771 defines multivesicular bodies as endosomes with internal vesicles
        formed by invagination of the limiting endosomal membrane.
  - subject: intraluminal_vesicle
    predicate: is contained in
    object: multivesicular_body
    description: A multivesicular body contains intraluminal vesicles formed from
      its limiting endosomal membrane.
    evidence:
    - reference: GO:0005771
      notes: GO:0005771 defines the multivesicular body by the presence of internal
        vesicles.
