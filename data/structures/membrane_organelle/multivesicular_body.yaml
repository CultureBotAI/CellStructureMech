functions:
- function_id: multivesicular_body_sorting_pathway
  label: multivesicular body sorting pathway
  grounding: GO:0071985
  description: Multivesicular bodies receive ubiquitinated transmembrane cargo into
    luminal vesicles through ESCRT-dependent endosomal sorting.
  evidence:
  - reference: GO:0071985
    notes: GO:0071985 denotes the multivesicular body sorting pathway that targets
      ubiquitylated transmembrane proteins into luminal vesicles.
  - reference: PMID:11511343
    notes: Katzmann, Babst and Emr 2001 identified ESCRT-I as a conserved yeast endosomal
      protein-sorting complex needed for MVB cargo sorting.
- function_id: vacuolar_cargo_delivery
  label: vacuolar cargo delivery
  description: Yeast multivesicular bodies deliver endosomal membrane cargo into the
    vacuole lumen for degradation.
  evidence:
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed MVB formation as the ESCRT-dependent
      route that packages endosomal cargo for lysosomal or vacuolar degradation.
