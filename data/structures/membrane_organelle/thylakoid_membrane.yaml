identifier: GO:0042651
label: thylakoid membrane
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: The pigmented photosynthetic membrane of cyanobacteria and chloroplasts,
  enriched in photosystems, cytochrome b6f, ATP synthase, plastoquinone and glycolipids,
  where light-driven electron transport builds the proton motive force for photosynthetic
  ATP synthesis.
