components:
- component_id: thylakoid_lipids
  label: thylakoid glycerolipid matrix
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Specialized galactolipid-, sulfolipid- and phosphatidylglycerol-rich bilayer
    into which photosynthetic electron-transport complexes are embedded.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review thylakoids as photosynthetic membranes
      built from proteins, lipids and pigments across cyanobacteria, algae and plants.
- component_id: photosystem_ii
  label: photosystem II
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0009523
  essentiality: ESSENTIAL
  role: Membrane complex that oxidizes water, releases oxygen, and reduces plastoquinone
    at the start of the linear electron-transport chain.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review PSII as one of the major thylakoid electron-transport
      complexes.
  - reference: DOI:10.1016/j.molp.2017.09.019
    notes: Casella et al. 2017 mapped PSII within native Synechocystis thylakoid membranes.
- component_id: plastoquinone_pool
  label: plastoquinone pool
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Lipid-soluble electron carrier that diffuses within the thylakoid membrane
    between PSII and cytochrome b6f.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review plastoquinone-mediated electron transport
      in thylakoid membranes.
- component_id: cytochrome_b6f
  label: cytochrome b6f complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0009512
  essentiality: ESSENTIAL
  role: Oxidizes plastoquinol and links electron flow to proton translocation across
    the thylakoid membrane.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 place cytochrome b6f in the thylakoid membrane
      electron-transport chain.
- component_id: photosystem_i
  label: photosystem I
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0009522
  essentiality: ESSENTIAL
  role: Light-driven complex that accepts electrons downstream of cytochrome b6f and
    feeds ferredoxin reduction.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review PSI as a major thylakoid photosynthetic
      complex.
  - reference: DOI:10.1016/j.molp.2017.09.019
    notes: Casella et al. 2017 mapped PSI distribution and mobility in native Synechocystis
      thylakoid membranes.
- component_id: atp_synthase
  label: proton-transporting ATP synthase complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0045259
  essentiality: ESSENTIAL
  role: Uses the trans-thylakoid proton motive force to synthesize ATP.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 include ATP synthase among the thylakoid complexes
      that convert light energy into ATP and reducing power.
taxonomic_distribution:
- taxon_id: NCBITaxon:1117
  taxon_label: Cyanobacteriota
  presence: COMMON
  note: Most cyanobacteria carry thylakoid membranes, while Gloeobacter-like lineages
    perform photosynthesis at the plasma membrane and lack thylakoids.
  reference: DOI:10.1146/annurev-cellbio-120823-022747
- taxon_id: NCBITaxon:2763
  taxon_label: Rhodophyta
  presence: COMMON
  note: Red algal chloroplasts retain thylakoid membranes descended from the cyanobacterial
    endosymbiont.
  reference: DOI:10.1146/annurev-cellbio-120823-022747
canonical_examples:
- taxon_id: NCBITaxon:1148
  taxon_label: Synechocystis sp. PCC 6803
  note: Cyanobacterial model for native photosynthetic-complex organization and thylakoid
    membrane dynamics.
  reference: DOI:10.1016/j.molp.2017.09.019
functions:
- function_id: photosynthetic_electron_transport
  label: photosynthetic electron transport chain
  grounding: GO:0009767
  description: Thylakoid membrane complexes move electrons from water through plastoquinone,
    cytochrome b6f and photosystem I, coupling light absorption to proton translocation
    and ATP synthesis.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review thylakoid electron transport as the membrane
      process that converts light into chemical energy.
- function_id: photosynthetic_atp_synthesis
  label: photosynthetic ATP synthesis
  description: The membrane separates the thylakoid lumen from the cytoplasm or stroma
    so proton accumulation can drive ATP synthase.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 describe proton motive force generation across
      thylakoid membranes and ATP synthase use of that gradient.
evidence:
- reference: DOI:10.1146/annurev-cellbio-120823-022747
  notes: Perez-Boerema et al. 2024, Evolution of Thylakoid Structural Diversity, Annual
    Review of Cell and Developmental Biology.
- reference: DOI:10.1016/j.molp.2017.09.019
  notes: Casella et al. 2017, Dissecting the Native Architecture and Dynamics of Cyanobacterial
    Photosynthetic Machinery, Molecular Plant.
- reference: DOI:10.1038/s41467-021-23680-1
  notes: Huokko et al. 2021, Probing the biogenesis pathway and dynamics of thylakoid
    membranes, Nature Communications.
causal_graphs:
- graph_id: linear_electron_transport_proton_gradient
  title: Linear electron transport builds a trans-thylakoid proton gradient
  description: Photosystem II, plastoquinone, cytochrome b6f and photosystem I form
    an electron-transport chain in the thylakoid membrane. Electron flow is coupled
    to proton accumulation in the thylakoid lumen, and ATP synthase converts that
    proton motive force into ATP.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
