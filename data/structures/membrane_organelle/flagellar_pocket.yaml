components:
- component_id: ciliary_pocket_membrane
  label: ciliary pocket membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0020018
  role: Specialized plasma-membrane domain lining the flagellar pocket invagination.
  evidence:
  - reference: DOI:10.1038/nrmicro2221
    notes: Field and Carrington 2009 reviewed the trypanosome flagellar pocket as
      a plasma-membrane invagination with a distinct membrane domain.
  - reference: DOI:10.1073/pnas.0909289106
    notes: Gadelha et al. 2009 showed that T. brucei flagellar pocket membrane boundaries
      are influenced by cytoskeletal features.
- component_id: ciliary_pocket_collar
  label: ciliary pocket collar
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:1990900
  role: Cytoskeletal collar at the neck of the flagellar pocket where the flagellum
    exits the cell body.
  evidence:
  - reference: DOI:10.1371/journal.pbio.0060105
    notes: Bonhivers et al. 2008 showed that the BILBO1 collar is required for new
      flagellar-pocket biogenesis in T. brucei.
taxonomic_distribution:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  presence: COMMON
  note: T. brucei cells have a single flagellar pocket that has been reconstructed
    by electron tomography and used as a model for trypanosomatid endocytosis and
    exocytosis.
  reference: DOI:10.1242/jcs.045740
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: African trypanosome in which flagellar-pocket membrane domains, electron-tomographic
    architecture and BILBO1-dependent biogenesis have been studied.
  reference: DOI:10.1242/jcs.045740
functions:
- function_id: endo_exocytic_gateway
  label: endocytic and exocytic gateway
  description: The flagellar pocket concentrates endocytosis and exocytosis at the
    site where the flagellum exits the trypanosome cell body.
  evidence:
  - reference: DOI:10.1038/nrmicro2221
    notes: Field and Carrington 2009 reviewed the trypanosome flagellar pocket as
      the dominant site of endo- and exocytosis.
  - reference: DOI:10.1016/j.pt.2020.11.005
    notes: Halliday and Sunter 2021 review how the trypanosomatid flagellar pocket
      couples pocket structure to trafficking functions.
- function_id: flagellum_exit_site
  label: flagellum exit-site organization
  description: The pocket organizes the membrane invagination and neck through which
    the eukaryotic flagellum emerges from the cell body.
  evidence:
  - reference: DOI:10.1242/jcs.045740
    notes: Lacomble et al. 2009 reconstructed the T. brucei flagellar pocket and associated
      cytoskeleton by electron microscope tomography.
