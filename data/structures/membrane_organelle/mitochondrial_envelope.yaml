causal_graphs:
- graph_id: yeast_mitochondrial_envelope_import
  title: Mitochondrial envelope routes matrix import
  description: In budding yeast, the mitochondrial outer and inner membranes enclose
    the intermembrane space, while TOM at the outer membrane initiates precursor import
    into the matrix.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures envelope topology and TOM-dependent matrix import
    without asserting the full respiratory chain, TIM/PAM translocases, or intermembrane-space
    oxidoreductases.
