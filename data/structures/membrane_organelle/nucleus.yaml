causal_graphs:
- graph_id: yeast_nucleus_envelope_and_pores
  title: Nuclear envelope bounds a pore-gated lumen
  description: In budding yeast, the nuclear envelope surrounds the nuclear lumen
    and is perforated by nuclear pores that mediate nucleocytoplasmic exchange.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
