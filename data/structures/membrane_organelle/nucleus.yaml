identifier: GO:0005634
label: nucleus
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded organelle of eukaryotic cells in which chromosomes
  are housed and replicated. In most cells, the nucleus contains all of the cell's
  chromosomes except the organellar chromosomes, and is the site of RNA synthesis
  and processing.
