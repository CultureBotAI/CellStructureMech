- component_id: nucleolus
  label: nucleolus
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0005730
  role: Dense nuclear body that concentrates ribosomal DNA transcription, pre-rRNA
    processing, and early ribosomal subunit assembly in the nuclear lumen.
  evidence:
  - reference: GO:0005730
    notes: GO:0005730 defines the nucleolus as part of the nuclear lumen.
  - reference: DOI:10.1038/nrm2184
    notes: Boisvert et al. 2007 review the nucleolus as a nuclear body organized around
      ribosome biogenesis.
functions:
- function_id: nuclear_lumen_compartmentalization
  label: nuclear lumen compartmentalization
  description: The nuclear lumen is the nucleus-internal volume that contains nuclear
    chromosomes and nuclear bodies such as the nucleolus.
  evidence:
  - reference: GO:0031981
    notes: GO:0031981 defines the nuclear lumen as the volume enclosed by the nuclear
      inner membrane.
  - reference: GO:0000228
    notes: GO places nuclear chromosomes in the nuclear lumen during cell-cycle phases
      when the nucleus is intact.
  - reference: GO:0005730
    notes: GO places the nucleolus in the nuclear lumen.
