  title: Vacuoles pair a membrane with a lumen
  description: The vacuole is a membrane-bounded organelle whose broad topology consists
    of a vacuolar membrane surrounding a vacuolar lumen; the fungal-type vacuole specializes
    that same membrane/lumen organization in yeast.
  graph_kind: FUNCTION
