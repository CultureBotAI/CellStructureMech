    protein, lipid, or polysaccharide family.
  resolution_note: Represented the membrane and lumen in has_part and as topology
    graph nodes, leaving this broad vacuole record without molecular components.
  evidence:
  - reference: GO:0005774
    notes: GO:0005774 identifies the vacuolar membrane.
  - reference: GO:0005775
