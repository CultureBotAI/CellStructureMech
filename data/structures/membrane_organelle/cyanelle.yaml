identifier: GO:0009842
label: cyanelle
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A plastid that contains unstacked, phycobilisome-bearing thylakoid membranes
  and is surrounded by a double membrane with a peptidoglycan layer in the intermembrane
  space between the two envelope membranes. Cyanelles are characteristic of algae
  in the class Glaucophyta, and may represent an ancestral form of plastid.
