components:
- component_id: nucleomorph_chromosomes
  label: nucleomorph chromosomes
  component_type: DNA
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Highly reduced linear chromosomes that carry the residual eukaryotic endosymbiont
    nuclear genome inside the nucleomorph.
  evidence:
  - reference: DOI:10.1038/nature11681
    notes: Curtis et al. 2012 compared cryptophyte and chlorarachniophyte algae whose
      remnant endosymbiont nuclei retain small essential-gene residues.
  - reference: DOI:10.1186/1471-2164-15-374
    notes: Tanifuji et al. 2014 sequenced the three linear chromosomes of the Lotharella
      oceanica nucleomorph genome.
taxonomic_distribution:
- taxon_id: NCBITaxon:3027
  taxon_label: Cryptophyceae
  presence: COMMON
  note: Cryptophyte nucleomorphs are residual red-algal nuclei inside secondary plastids.
  reference: DOI:10.1038/nature11681
- taxon_id: NCBITaxon:29197
  taxon_label: Chlorarachniophyceae
  presence: COMMON
  note: Chlorarachniophytes retain green-algal-derived nucleomorphs within their complex
    plastids.
  reference: DOI:10.1186/1471-2164-15-374
canonical_examples:
- taxon_id: NCBITaxon:55529
  taxon_label: Guillardia theta
  note: Cryptophyte model whose nucleomorph and chloroplast replication were followed
    through the cell cycle.
  reference: DOI:10.1038/s41598-017-02668-2
- taxon_id: NCBITaxon:227086
  taxon_label: Bigelowiella natans
  note: Chlorarachniophyte model compared with Guillardia theta to explain why a small
    residue of essential genes remains locked in each nucleomorph.
  reference: DOI:10.1038/nature11681
functions:
- function_id: reduced_endosymbiont_genome_maintenance
  label: reduced endosymbiont genome maintenance
  description: The nucleomorph houses the compact remnant genome of an engulfed eukaryotic
    algal endosymbiont inside a secondary plastid.
  evidence:
  - reference: DOI:10.1038/nature11681
    notes: Curtis et al. 2012 found that the Guillardia theta and Bigelowiella natans
      nucleomorphs retain small sets of essential genes.
- function_id: nucleomorph_genome_replication
  label: nucleomorph genome replication
  description: The nucleomorph genome is replicated once per Guillardia theta cell
    cycle in coordination with plastid replication.
  evidence:
  - reference: DOI:10.1038/s41598-017-02668-2
    notes: Onuma et al. 2017 measured host nuclear and nucleomorph DNA synthesis timing
      in the cryptophyte Guillardia theta.
evidence:
- reference: GO:0033009
