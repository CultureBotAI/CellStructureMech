identifier: GO:0033009
label: nucleomorph
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A small, vestigial nucleus found in some plastids that derive from a eukaryotic
  endosymbiont. Observed in chlorarachniophytes and cryptomonads, which acquired their
  plastids from a green and red alga respectively.
definition_source: GO:0033009
