functions:
- function_id: photosynthesis
  label: photosynthesis
  grounding: GO:0015979
  description: The organellar chromatophore carries internal thylakoid membranes and
    photosynthetic machinery that support light-driven carbon fixation.
  evidence:
  - reference: GO:0070111
    notes: GO:0070111 defines the bacterial component of the organellar chromatophore
      as photosynthetically active.
  - reference: uniprot.location:SL-0351
    notes: UniProt SL-0351 describes the organellar chromatophore as housing machinery
      for photosynthesis and CO2 fixation.
- function_id: chromatophore_protein_import
  label: chromatophore protein import
  description: Nuclear-encoded Paulinella proteins are trafficked back into the chromatophore,
    compensating for genes lost from the reduced cyanobacterium-derived genome.
  evidence:
  - reference: DOI:10.1073/pnas.1118800109
    notes: Nowack and Grossman 2012 demonstrated trafficking of nucleus-encoded proteins
      into Paulinella chromatophora chromatophores.
  - reference: DOI:10.1016/j.cub.2017.08.010
    notes: Singer et al. 2017 characterized large-scale protein import into the early-stage
      Paulinella photosynthetic organelle.
