causal_graphs:
- graph_id: paulinella_chromatophore_topology_and_import
  title: Organellar chromatophore topology and import
  description: The Paulinella organellar chromatophore is bounded by inner and outer
    membranes with residual peptidoglycan between them, contains photosynthetic thylakoid
    membranes, and imports nuclear-encoded proteins.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures compartment topology and two whole-organelle functions
    without asserting the complete photosynthetic, carbon-fixation or protein-import
    machinery.
