functions:
- function_id: late_endosome_mvb_lumen_cargo_sorting
  label: multivesicular body sorting pathway
  grounding: GO:0071985
  description: In multivesicular bodies, a late-endosome child class, the lumen receives
    ubiquitinated membrane cargo on intraluminal vesicles generated from the limiting
    membrane during ESCRT-dependent MVB sorting.
  evidence:
  - reference: GO:0031906
    notes: GO:0031906 defines the late endosome lumen as the volume enclosed by the
      membrane of a late endosome.
  - reference: GO:0005771
    notes: GO:0005771 defines multivesicular bodies as late-endosome-class endosomes
      with internal vesicles formed by invagination of the limiting endosomal membrane.
  - reference: GO:0071985
    notes: GO:0071985 denotes the multivesicular body sorting pathway that targets
      ubiquitylated transmembrane proteins into luminal vesicles.
  - reference: PMID:11511343
    notes: Katzmann, Babst and Emr 2001 identified ESCRT-I as a conserved yeast endosomal
      protein-sorting complex needed for ubiquitin-dependent MVB cargo sorting.
  - reference: PMID:12194857
    notes: Babst et al. 2002 characterized yeast ESCRT-III as an endosome-associated
      complex required for MVB sorting.
