functions:
- function_id: phagosome_acidification
  label: phagosome acidification
  grounding: GO:0090383
  description: The phagocytic vesicle lumen acidifies as newly formed phagosomes mature
    toward late digestive compartments. Mediated by phagolysosome vesicle lumen (GO:0106174)
    within the acidic hydrolytic interior of the phagolysosome vesicle lumen.
  evidence:
  - reference: GO:0090383
    notes: GO:0090383 defines phagosome acidification as the reduction of phagosome
      pH.
  - reference: PMID:12388753
    notes: Gotthardt et al. 2002 dissected Dictyostelium phagosome maturation into
      stages with distinct luminal-acidification behavior.
