identifier: GO:0106174
label: phagolysosome vesicle lumen
structure_category: MEMBRANE_ORGANELLE
structure_kind: SUBCELLULAR_REGION
definition: The volume enclosed by the membrane of a phagolysosome. In phagotrophic
  amoebae (Dictyostelium discoideum, Entamoeba histolytica) and ciliates, the acidic
  phagolysosome vesicle lumen concentrates cathepsin-like cysteine and aspartic proteases,
  lysozymes, phospholipases, and reactive oxygen species that kill and digest engulfed
  microbial cells.
