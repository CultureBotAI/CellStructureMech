components:
- component_id: glycolipid_monolayer
  label: chlorosome glycolipid monolayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0033105 denotes the whole chlorosome envelope, while this component
    denotes its asymmetric glycolipid monolayer; no exact source-neutral ChEBI class
    was asserted for the full chlorosome envelope lipid mixture.
  role: Asymmetric glycolipid monolayer that encloses the pigment aggregate and contributes
    the protein-bearing surface of green bacterial chlorosomes.
  evidence:
  - reference: GO:0033105
    notes: GO:0033105 defines the chlorosome envelope as a glycolipid monolayer with
      embedded proteins.
  - reference: uniprot.location:SL-0060
    notes: UniProt SL-0060 describes the green-sulfur-bacterial chlorosome envelope
      as an asymmetric membrane containing galactolipids.
  - reference: DOI:10.1007/s11120-013-9869-3
    notes: Orf and Blankenship 2013 review chlorosomes as bacteriochlorophyll aggregates
      enclosed by a lipid monolayer whose surface carries chlorosome proteins.
- component_id: csma_baseplate
  label: CsmA bacteriochlorophyll a baseplate
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - csmA
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: CsmA is the baseplate protein on one face of the chlorosome envelope,
    but no exact InterPro or Pfam family for the chlorosome CsmA baseplate was asserted.
  role: Bacteriochlorophyll a-binding baseplate antenna that sits on one face of the
    chlorosome envelope and couples interior bacteriochlorophyll aggregates to downstream
    membrane complexes.
  evidence:
  - reference: GO:0046858
    notes: GO:0046858 defines chlorosomes as attached to the cytoplasmic membrane
      through a BChl a-containing protein baseplate.
  - reference: DOI:10.1038/ncomms12454
    notes: Nielsen et al. 2016 resolved the in situ CsmA-containing baseplate antenna
      complex of Chlorobaculum tepidum.
- component_id: csm_envelope_proteins
  label: accessory chlorosome envelope proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - csmB
  - csmC
  - csmD
  - csmE
  - csmF
  - csmH
  - csmI
  - csmJ
  - csmK
  - csmX
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This component groups the Chlorobi chlorosome-surface Csm proteins
    by envelope membership; no single exact InterPro or Pfam family was asserted for
    the complete envelope-protein set.
  role: Additional proteins embedded in or attached to the chlorosome envelope surface,
    with lineage-specific and protein-specific roles in envelope organization.
  evidence:
  - reference: DOI:10.1128/JB.186.3.646-653.2004
    notes: Frigaard et al. 2004 disrupted nine Chlorobium tepidum chlorosome protein
      genes and analyzed the corresponding chlorosome envelope-protein mutants.
  - reference: DOI:10.1021/bi060776y
    notes: Li et al. 2006 used cross-linking to map molecular contacts among chlorosome
      envelope proteins from Chlorobium tepidum.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Chlorosome envelopes occur in the chlorosomes of particular anoxygenic green-bacterial
    phototrophs, including Chlorobi and filamentous Chloroflexota lineages.
  reference: DOI:10.1007/s11120-013-9869-3
canonical_examples:
- taxon_id: NCBITaxon:1097
  taxon_label: Chlorobaculum tepidum
  note: Green sulfur bacterium used to test individual chlorosome envelope protein
    contributions and to resolve the CsmA baseplate architecture.
  reference: DOI:10.1128/JB.186.3.646-653.2004
- taxon_id: NCBITaxon:1108
  taxon_label: Chloroflexus aurantiacus
  note: Green filamentous bacterium whose thin chlorosomes were used to visualize
    the relationship between the CsmA baseplate and the surrounding pigment aggregate.
  reference: DOI:10.1128/JB.00690-09
functions:
- function_id: photosynthetic_light_harvesting_envelope
  label: photosynthetic light harvesting
  description: The chlorosome envelope organizes the self-assembled bacteriochlorophyll
    aggregate and a CsmA baseplate so excitation energy can exit the chlorosome toward
    membrane reaction centers.
  evidence:
  - reference: DOI:10.1007/s11120-013-9869-3
    notes: Orf and Blankenship 2013 review chlorosome envelopes, baseplates, and bacteriochlorophyll
      aggregates in the light-harvesting antennae of green photosynthetic bacteria.
  - reference: DOI:10.1038/ncomms12454
    notes: Nielsen et al. 2016 modeled how the CsmA baseplate transfers excitation
      energy out of Chlorobaculum tepidum chlorosomes.
evidence:
