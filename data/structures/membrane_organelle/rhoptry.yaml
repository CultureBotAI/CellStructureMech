components:
- component_id: rhoptry_membrane
  label: rhoptry membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0033016
  essentiality: ESSENTIAL
  role: Lipid bilayer that bounds the rhoptry and encloses the secretory lumen.
  evidence:
  - reference: DOI:10.1038/nrmicro1800
    notes: Boothroyd and Dubremetz 2008 review Toxoplasma rhoptries as club-shaped
      secretory organelles with neck and bulb compartments.
- component_id: rhoptry_neck_proteins
  label: rhoptry neck proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The rhoptry-neck cohort contains several unrelated secreted RON
    proteins; no exact source-neutral family CURIE for the whole neck-protein set
    was curated.
  role: Neck-localized rhoptry proteins secreted during host-cell invasion to form
    the moving junction.
  evidence:
  - reference: DOI:10.1074/jbc.m504158200
    notes: Bradley et al. 2005 identified multiple RON proteins in the Toxoplasma
      gondii rhoptry proteome.
  - reference: DOI:10.1371/journal.ppat.0010017
    notes: Alexander et al. 2005 showed that rhoptry-neck protein RON4 relocates to
      the moving junction during Toxoplasma invasion.
- component_id: rhoptry_bulb_proteins
  label: rhoptry bulb proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: ROP proteins are defined by rhoptry-bulb localization and include
    many unrelated secreted effector families; no exact single source-neutral family
    CURIE represents the group.
  role: Bulb-localized rhoptry effectors that are secreted into the host cell and
    parasitophorous vacuole interface.
  evidence:
  - reference: DOI:10.1074/jbc.m504158200
    notes: Bradley et al. 2005 resolved the Toxoplasma rhoptry proteome and distinguished
      ROP and RON cohorts.
  - reference: DOI:10.1038/nrmicro1800
    notes: Boothroyd and Dubremetz 2008 review secretion of rhoptry bulb proteins
      during host invasion and parasitophorous vacuole establishment.
