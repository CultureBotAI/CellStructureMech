functions:
- function_id: rhoptry_mediated_host_cell_invasion
  label: rhoptry-mediated host cell invasion
  description: Rhoptry discharge contributes secreted proteins that help build the
    moving junction and enable invasion of host cells.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0010017
    notes: Alexander et al. 2005 connected rhoptry-neck protein RON4 to the moving
      junction during Toxoplasma host-cell invasion.
  - reference: DOI:10.1371/journal.pbio.3002745
    notes: Ben Chaabene et al. 2024 found that Toxoplasma Rhoptry Discharge Factor
      3 is essential for invasion and rhoptry-associated vesicle biogenesis.
- function_id: parasitophorous_vacuole_modulation
  label: parasitophorous vacuole modulation
  description: Rhoptry bulb proteins are injected during invasion and contribute to
    formation or host-facing modification of the parasitophorous vacuole.
  evidence:
  - reference: DOI:10.1038/nrmicro1800
    notes: Boothroyd and Dubremetz 2008 review the roles of Toxoplasma rhoptry effectors
      in parasitophorous vacuole biogenesis and host-cell manipulation.
evidence:
