discussions:
- discussion_id: keep_transient_maturation_factors_out
  prompt: Keep transient phagosome-maturation proteins out of the generic phagocytic
    vesicle components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - components#phagocytic_vesicle_lipid_bilayer
  rationale: The generic phagocytic vesicle is defined by a membrane-bounded vesicle
    made by phagocytosis. Rab GTPases, V-ATPases, proteases, and actin-associated
    factors associate with phagosomes in maturation-stage-specific ways, so the first
    record models only the stable membrane boundary as a constituent and leaves exact
    trafficking machinery to narrower timing- or organism-specific curation.
  evidence:
  - reference: PMID:16926386
    notes: Gotthardt et al. 2006 profiled proteins whose abundance on Dictyostelium
      phagosomes changes during maturation.
  posed_by: codex
  posed_date: '2026-09-22'
  resolved_date: '2026-09-22'
