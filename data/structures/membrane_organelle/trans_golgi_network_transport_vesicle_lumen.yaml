causal_graphs:
- graph_id: trans_golgi_network_transport_vesicle_lumen_mechanism
  title: Luminal cargo packaging into trans-Golgi network transport vesicles
  description: Arf1- and adaptor-driven coat assembly at phosphatidylinositol 4-phosphate-enriched
    TGN domains concentrates soluble and transmembrane cargo into the nascent trans-Golgi
    network transport vesicle lumen for post-Golgi trafficking.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the vesicle-membrane boundary, the GO-grounded TGN
    clathrin coat parthood, and TGN/endosome traffic without asserting the full clathrin-adaptor
    assembly mechanism.
