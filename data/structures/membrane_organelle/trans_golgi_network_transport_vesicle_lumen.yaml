  role: Lipid-bilayer constituent of the trans-Golgi network transport vesicle membrane
    that surrounds a TGN transport vesicle. Functions supporting cargo packaging into
    the TGN transport vesicle lumen in trans-Golgi network transport vesicle lumen.
