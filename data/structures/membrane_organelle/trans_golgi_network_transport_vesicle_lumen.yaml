identifier: GO:0098564
label: trans-Golgi network transport vesicle lumen
structure_category: MEMBRANE_ORGANELLE
structure_kind: SUBCELLULAR_REGION
definition: The volume enclosed within the membrane of a trans-Golgi network transport
  vesicle. The enclosed aqueous compartment within a trans-Golgi network (TGN) transport
  vesicle bounded by the vesicle membrane. In yeasts and other microbial eukaryotes,
  the TGN vesicle lumen houses soluble secretory glycoproteins, cell-wall remodeling
  enzymes, and vacuolar hydrolase precursors sorted from the late Golgi.
