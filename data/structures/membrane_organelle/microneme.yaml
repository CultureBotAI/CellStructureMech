identifier: GO:0020009
label: microneme
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A small, elongated secretory organelle that forms part of the apical complex,
  located along the main axis of an apicomplexan parasite cell within the extreme
  apical region and at the periphery under the inner membrane complex. Of the specialized
  secretory compartments identified in apicomplexans, micronemes discharge their contents
  first, during initial contact of the parasite's apical pole with the host cell surface.
  Micronemal proteins function during parasite attachment and penetration into the
  target cell.
