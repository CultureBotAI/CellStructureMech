functions:
- function_id: regulated_microneme_exocytosis
  label: regulated microneme exocytosis
  description: Micronemes discharge adhesins in a regulated secretion step that precedes
    host-cell invasion.
  evidence:
  - reference: PMID:9208224
    notes: Carruthers and Sibley 1997 showed microneme secretion occurs early during
      Toxoplasma host-cell invasion.
  - reference: DOI:10.1074/jbc.m115.700518
    notes: Brown et al. 2016 connected serum albumin to PKG-dependent microneme secretion
      in Toxoplasma gondii.
- function_id: microneme_mediated_host_cell_invasion
  label: microneme-mediated host cell invasion
  description: Secreted microneme adhesins support parasite attachment, motility,
    and invasion of host cells.
  evidence:
  - reference: DOI:10.1093/emboj/cdg217
    notes: Huynh et al. 2003 showed that the MIC2-M2AP adhesive protein complex is
      required for rapid host-cell invasion.
  - reference: DOI:10.1371/journal.ppat.0020084
    notes: Huynh and Carruthers 2006 showed that MIC2 contributes to Toxoplasma invasion
      and virulence.
