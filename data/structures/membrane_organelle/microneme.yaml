- component_id: mic2_m2ap_complex
  label: MIC2-M2AP adhesive protein complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Toxoplasma MIC2-M2AP microneme adhesin complex is experimentally
    resolved, but no cross-source complex identifier was curated for the first microneme
    record.
  role: Toxoplasma microneme adhesin complex required for efficient attachment and
    rapid host-cell invasion.
  evidence:
  - reference: DOI:10.1093/emboj/cdg217
    notes: Huynh et al. 2003 connected secretion of the MIC2-M2AP adhesive complex
      to rapid host-cell invasion.
  - reference: DOI:10.1371/journal.ppat.0020084
    notes: Huynh and Carruthers 2006 established Toxoplasma MIC2 as a major determinant
      of invasion and virulence.
