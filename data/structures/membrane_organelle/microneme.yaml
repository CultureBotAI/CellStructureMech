  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Microneme adhesins include multiple secreted MIC/TRAP-family and
    complexed proteins; no exact source-neutral CURIE for the whole microneme-adhesin
    cohort was curated.
  role: Secreted adhesive proteins that are released from micronemes during host-cell
