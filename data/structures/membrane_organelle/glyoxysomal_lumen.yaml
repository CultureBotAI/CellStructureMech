causal_graphs:
- graph_id: glyoxysome_lumen_topology
  title: Glyoxysomal lumen topology
  description: The glyoxysomal lumen is the internal glyoxysome compartment enclosed
    by the glyoxysomal membrane.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the defining lumenal boundary without duplicating
    the whole-glyoxysome enzyme-import or glyoxylate-cycle model.
  nodes:
  - node_id: glyoxysomal_lumen
    label: glyoxysomal lumen
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0031908
  - node_id: glyoxysomal_membrane
    label: glyoxysomal membrane
    node_type: STRUCTURE
    grounding: GO:0046861
  - node_id: glyoxysome
    label: glyoxysome
    node_type: ORGANELLE
    grounding: GO:0009514
  - node_id: glyoxylate_cycle
    label: glyoxylate cycle
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006097
  edges:
  - subject: glyoxysomal_lumen
    predicate: is part of
    object: glyoxysome
    description: The glyoxysomal lumen is the matrix volume inside a glyoxysome.
    evidence:
    - reference: GO:0031908
      notes: GO:0031908 identifies the glyoxysomal lumen cellular component.
    - reference: uniprot.location:SL-0333
      notes: UniProt SL-0333 places the glyoxysome matrix under the glyoxysome subcellular
        location.
    - reference: GO:0009514
      notes: GO:0009514 identifies the containing glyoxysome.
  - subject: glyoxysomal_membrane
    predicate: encloses
    object: glyoxysomal_lumen
    description: The glyoxysomal membrane encloses the glyoxysomal lumen.
    evidence:
    - reference: GO:0031908
      notes: GO:0031908 defines the glyoxysomal lumen as the volume enclosed by the
        glyoxysome membrane.
    - reference: GO:0046861
      notes: GO:0046861 identifies the membrane surrounding a glyoxysome.
    - reference: uniprot.location:SL-0130
      notes: UniProt SL-0130 maps the glyoxysome membrane to GO:0046861.
  - subject: glyoxylate_cycle
    predicate: occurs in
    object: glyoxysomal_lumen
    description: Glyoxylate-cycle enzymes localize to the glyoxysomal matrix.
    evidence:
    - reference: GO:0009514
      notes: GO:0009514 defines glyoxysomes by their glyoxylate-pathway enzyme content.
    - reference: DOI:10.1007/BF00309930
      notes: de Zoysa and Connerton 1994 studied targeting of glyoxylate-cycle enzymes
        into the Neurospora crassa glyoxysomal matrix.
discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the glyoxysomal membrane as the boundary of the glyoxysomal lumen rather
    than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#glyoxysome_lumen_topology
  rationale: GO:0031908 denotes the volume enclosed by the glyoxysome membrane, whereas
    GO:0046861 denotes the membrane surrounding a glyoxysome.
  resolution_note: Represented GO:0046861 as the boundary node in the topology graph
    and left the lumen record without constituent components.
  evidence:
  - reference: GO:0031908
    notes: GO:0031908 identifies the glyoxysomal lumen.
  - reference: GO:0046861
    notes: GO:0046861 identifies the membrane that bounds the glyoxysomal lumen.
  posed_by: codex
  posed_date: '2026-09-13'
