    Journal of Experimental Biology.
causal_graphs:
- graph_id: vatpase_supported_fluid_segregation
  title: Spongiome V-ATPase supports contractile-vacuole fluid segregation
  description: A V-ATPase-rich spongiome is the tubular or vesicular membrane subnetwork
    of the contractile-vacuole complex; in Paramecium, decorated-spongiome V-ATPase
    contributes to the electrogenic membrane potential needed for fluid segregation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph summarizes localization, inhibitor and electrophysiology
    evidence. It does not assert a complete molecular route for water entry into the
    contractile-vacuole complex.
