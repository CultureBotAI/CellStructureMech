    resolved into bladder and spongiome membranes.
  reference: PMID:8294479
- taxon_id: NCBITaxon:44030
  taxon_label: Paramecium multimicronucleatum
  note: Ciliate model in which microelectrode measurements and V-ATPase labeling tied
