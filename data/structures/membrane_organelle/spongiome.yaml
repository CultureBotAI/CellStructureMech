components:
- component_id: v_type_atpase
  label: spongiome V-ATPase
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: V-ATPase is a multisubunit proton pump present on spongiome membranes
    in multiple contractile-vacuole systems, but no exact source-neutral CURIE for
    the spongiome-localized complex was curated.
  role: Proton-pumping complex on spongiome membranes that contributes to contractile-vacuole
    fluid segregation.
  evidence:
  - reference: PMID:8294479
    notes: Nolta and Steck 1994 purified the Dictyostelium contractile-vacuole complex
      and distinguished V-H+-ATPase-rich spongiome membranes from the pump-poor bladder
      fraction.
  - reference: DOI:10.1242/jcs.108.10.3163
    notes: Fok et al. 1995 localized V-ATPase antigenicity to the pegs on Paramecium
      decorated spongiome tubules.
  - reference: DOI:10.1242/jeb.205.20.3261
    notes: Gronlien et al. 2002 linked V-ATPase on the Paramecium decorated spongiome
      to electrogenic fluid segregation in the contractile-vacuole complex.
