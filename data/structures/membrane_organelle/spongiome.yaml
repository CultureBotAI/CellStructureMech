  reference: DOI:10.1242/jeb.205.20.3261
functions:
- function_id: contractile_vacuole_fluid_segregation
  label: contractile-vacuole fluid segregation
  description: V-ATPase-bearing spongiome membranes participate in ion-driven water
    handling by the contractile-vacuole complex.
  evidence:
  - reference: PMID:8294479
    notes: Nolta and Steck 1994 interpreted the V-H+-ATPase-rich Dictyostelium spongiome
      as a candidate primary energy transducer for pumping water out of the cytoplasm.
  - reference: DOI:10.1242/jeb.205.20.3261
    notes: Gronlien et al. 2002 measured contractile-vacuole membrane potential in
      Paramecium and connected decorated-spongiome V-ATPase to fluid segregation.
  - reference: DOI:10.1016/B978-0-12-407695-2.00002-0
    notes: Docampo et al. 2013 review the contractile vacuole complex as an osmoregulatory
      organelle in protists.
evidence:
- reference: GO:0062160
  notes: Gene Ontology cellular-component term for spongiome.
- reference: PMID:8294479
