components:
- component_id: rhoptry_neck_proteins
  label: rhoptry neck proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Rhoptry neck-localized secretory proteins that are released during host-cell
    invasion and contribute to the moving-junction interface.
  evidence:
  - reference: PMID:16002398
    notes: Bradley et al. 2005 identified multiple RON proteins in the Toxoplasma
      gondii rhoptry proteome.
  - reference: DOI:10.1371/journal.ppat.0010017
    notes: Alexander et al. 2005 showed that RON4 is a Toxoplasma rhoptry-neck protein
      that relocates to the moving junction during invasion.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: RON proteins share rhoptry-neck localization but include several
    unrelated secreted effector families; no exact source-neutral family term was
    curated for the whole rhoptry-neck protein cohort.
taxonomic_distribution:
- taxon_id: NCBITaxon:5794
  taxon_label: Apicomplexa
  presence: COMMON
  note: Rhoptry necks are the narrow apical regions of apicomplexan rhoptries; their
    number and morphology vary among lineages and invasive life-cycle stages.
  reference: DOI:10.1128/mmbr.00197-22
canonical_examples:
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan model in which RON proteins were identified in the rhoptry proteome
    and shown to relocate toward the moving junction during invasion.
  reference: PMID:16002398
functions:
- function_id: rhoptry_neck_secretion
  label: rhoptry neck secretion
  description: The rhoptry neck forms the narrow electron-dense apical domain used
    as rhoptry contents are secreted during host-cell invasion.
  evidence:
  - reference: GO:1990225
    notes: GO:1990225 defines the rhoptry neck as the narrow part of the rhoptry that
      extends through the apical conoid.
  - reference: DOI:10.1038/nrmicro1800
    notes: Boothroyd and Dubremetz 2008 review neck and bulb compartmentation of Toxoplasma
      rhoptries during invasion.
- function_id: moving_junction_assembly
  label: moving junction assembly
  description: Rhoptry neck proteins are secreted from the rhoptry neck and help form
    the moving junction that coordinates apicomplexan host-cell invasion.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0010017
    notes: Alexander et al. 2005 showed that RON4 leaves the rhoptry neck and contributes
      to the moving-junction complex in Toxoplasma tachyzoites.
