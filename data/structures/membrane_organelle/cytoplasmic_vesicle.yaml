discussions:
- discussion_id: exclude_subtype_coats_and_cargo_from_generic_vesicle
  prompt: Keep subtype-specific coat complexes and cargo out of the generic cytoplasmic
    vesicle components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#cytoplasmic_vesicle_membrane_transport_scope
  rationale: UniProt SL-0088 describes coated, synaptic, secretory, and phagosome
    examples of the cytoplasmic vesicle class, so individual coats and cargoes identify
    specific subclasses rather than constituents of every cytoplasmic vesicle.
  resolution_note: Modeled only the bounding cytoplasmic vesicle membrane as a direct
    component here and left coat complexes plus cargoes on narrower vesicle records.
  evidence:
  - reference: uniprot.location:SL-0088
    notes: UniProt SL-0088 lists clathrin-, COPI-, and COPII-coated vesicles, synaptic
      vesicles, secretory vesicles, and phagosomes as examples within the cytoplasmic
      vesicle class.
  posed_by: codex
  posed_date: '2026-09-14'
  resolved_date: '2026-09-14'
