functions:
- function_id: glycan_processing_and_secretory_sorting
  label: glycan processing and secretory sorting
  description: The Golgi apparatus processes glycoprotein oligosaccharides and sorts
    membrane-bound cargo within the secretory, endocytic and lysosomal trafficking
    network.
  evidence:
  - reference: GO:0005794
    notes: GO:0005794 defines the Golgi apparatus as the endomembrane organelle that
      processes ER-derived core oligosaccharides and packages cargo into membrane-bound
      vesicles.
  - reference: DOI:10.1016/j.ceb.2014.04.010
    notes: Papanikou and Glick 2014 review Golgi compartment identities and resident
      enzyme organization.
- function_id: cisternal_maturation
  label: cisternal maturation
  description: In budding yeast, individual Golgi cisternae mature from early to late
    cisternae while resident markers arrive and depart over time.
  evidence:
  - reference: DOI:10.1038/nature04717
    notes: Losev et al. 2006 visualized Golgi maturation dynamics in living Saccharomyces
      cerevisiae.
  - reference: DOI:10.1038/nature04737
    notes: Matsuura-Tokita et al. 2006 used live imaging to follow yeast Golgi cisternal
      maturation.
evidence:
- reference: GO:0005794
  notes: Gene Ontology cellular-component term for Golgi apparatus.
