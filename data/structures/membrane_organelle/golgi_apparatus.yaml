  notes: Losev et al. 2006, 'Golgi maturation visualized in living yeast', Nature.
- reference: DOI:10.1038/nature04737
  notes: Matsuura-Tokita et al. 2006, 'Live imaging of yeast Golgi cisternal maturation',
    Nature.
- reference: DOI:10.1016/j.ceb.2014.04.010
  notes: Papanikou and Glick 2014, 'Golgi compartmentation and identity', Current
    Opinion in Cell Biology.
causal_graphs:
- graph_id: yeast_golgi_cisternal_maturation
  title: Yeast Golgi cisternae mature over time
  description: Live imaging of Saccharomyces cerevisiae showed that Golgi cisternae
    change resident marker composition as they mature from early to late compartments.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures marker exchange during cisternal maturation without
    asserting the complete set of cisternal identity determinants or vesicle-tethering
    proteins.
