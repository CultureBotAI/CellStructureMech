  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SNARE domains and SNARE superfamilies are broader than the Golgi
    trafficking machinery curated here, so no single InterPro or Pfam CURIE was used
    for this cohort.
  essentiality: UNKNOWN
  role: Membrane-fusion machinery that helps organize vesicular traffic to and from
    Golgi cisternae.
  evidence:
