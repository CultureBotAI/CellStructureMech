identifier: GO:0005794
label: Golgi apparatus
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bound cytoplasmic organelle of the endomembrane system that
  further processes the core oligosaccharides (e.g. N-glycans) added to proteins in
  the endoplasmic reticulum and packages them into membrane-bound vesicles. The Golgi
  apparatus operates at the intersection of the secretory, lysosomal, and endocytic
  pathways.
