functions:
- function_id: osmoregulatory_water_expulsion
  label: osmoregulatory water expulsion
  description: The contractile vacuole complex collects excess cytosolic water and
    periodically discharges it outside the cell to maintain osmotic balance.
  evidence:
  - reference: GO:0062159
    notes: GO:0062159 defines the contractile vacuole complex as an organelle that
      fills with cytoplasmic water, discharges it externally, and functions in osmoregulation.
  - reference: DOI:10.1016/B978-0-12-407695-2.00002-0
    notes: Docampo et al. 2013 review acidocalcisome and contractile-vacuole osmoregulation
      in protists.
