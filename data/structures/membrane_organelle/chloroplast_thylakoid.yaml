  title: Chloroplast thylakoid topology
  description: The chloroplast thylakoid is an internal chloroplast compartment embedded
    in the stroma and bounded by a pigmented membrane that encloses the thylakoid
    lumen.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures whole-thylakoid topology without asserting every
    granal subregion, photosystem, soluble carrier, or lumenal photosynthetic proton-transport
    step.
