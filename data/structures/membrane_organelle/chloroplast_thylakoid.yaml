discussions:
- discussion_id: whole_thylakoid_not_membrane_or_lumen
  prompt: Keep the chloroplast thylakoid distinct from its bounding membrane and its
    lumen.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0009534 denotes the whole chloroplast thylakoid, while GO:0009535
    denotes the pigmented bounding membrane and GO:0009543 denotes the chloroplast
    thylakoid lumen.
  resolution_note: Curated the whole thylakoid as the structure record and represented
    the membrane and lumen as parts in topology.
  evidence:
  - reference: GO:0009534
    notes: GO:0009534 identifies the whole chloroplast thylakoid.
  - reference: GO:0009535
    notes: GO:0009535 separately identifies the chloroplast thylakoid membrane.
  - reference: GO:0009543
    notes: GO:0009543 separately identifies the chloroplast thylakoid lumen.
- discussion_id: thylakoid_not_organelle_kind
  prompt: Represent chloroplast thylakoid as a membranous chloroplast substructure
    without asserting that it is an organelle.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0009579 describes thylakoids as membranous cellular structures and
    explicitly comments that they are not considered organelles; StructureKindEnum
    has no non-organelle membrane-bounded-compartment value.
  resolution_note: Kept the filesystem category under MEMBRANE_ORGANELLE with other
    lipid-bounded internal compartments, but set structure_kind to OTHER.
  evidence:
  - reference: GO:0009579
    notes: GO:0009579 defines thylakoid and scopes thylakoids away from the organelle
      class.
