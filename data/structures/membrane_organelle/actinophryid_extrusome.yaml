identifier: cellstructuremech:actinophryid_extrusome
label: actinophryid extrusome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A secretory granule beneath the cell or axopodial surface of actinophryid
  protists, containing amorphous electron-dense material released during prey capture.
definition_source: DOI:10.1016/j.ejop.2007.11.001
mapping_status: PROPOSED
