  action: EXPANDED_RECORD
  changes: Added sourced GP40 cargo and membrane, species-scoped examples, adhesion
    and membrane-supply functions, a physical fusion mechanism, and explicit grounding
    and pharmacology limits.
  llm_assisted: true
parent_structures:
