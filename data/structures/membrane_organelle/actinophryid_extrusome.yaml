discussions:
- discussion_id: resolve_gp40_family_and_localization
  prompt: Resolve an exact GP40 protein-family grounding and isoform-specific extrusome
    localization.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#gp40_adhesive_glycoprotein
  rationale: B2NIF0 and B2NIF1 correspond to gp40-1 and gp40-2 direct submissions,
    not isoform-specific localization experiments in the 2001 study. Do not infer
    enzymatic activity from broad glucanase-related domains or add both sequences
    as experimentally localized protein examples.
  evidence:
  - reference: DOI:10.1078/1434-4610-00041
  - reference: UniProtKB:B2NIF0
  - reference: UniProtKB:B2NIF1
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: resolve_extrusome_lipids
  prompt: Identify the lipid constituents of the extrusome membrane.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#extrusome_membrane
  rationale: Membrane continuity is evidenced, but lipid chemistry remains uncharacterized
    in the cited study.
  evidence:
  - reference: DOI:10.1002/cm.970020103
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: exclude_pharmacological_candidates
  prompt: Do not treat pharmacological targets as localized granule components.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: Channel-blocker and calmodulin-antagonist effects do not identify granule-resident
    proteins. Ionophore-mediated granule depletion was proposed but unverified, and
    Con A could target other surface glycoconjugates.
  evidence:
  - reference: DOI:10.1016/j.ejop.2007.11.001
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: retain_narrow_identity_and_context
  prompt: Keep actinophryid extrusomes distinct from ciliate extrusomes and context-specific
    vacuole terms.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: The source distinguishes amorphous actinophryid contents from organized
    ciliate extrusomes; toxicyst is not adopted as an exact synonym. GO:0043231 is
    the broader parent; GO:0030141 additionally assumes Golgi origin, not established
    here. The prey-vacuole membrane node remains ungrounded because GO:0020020 denotes
    a parasite vacuole digesting host cytoplasm.
  evidence:
  - reference: DOI:10.1016/j.ejop.2007.11.001
  - reference: GO:0043231
  - reference: GO:0030141
  - reference: GO:0020020
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
