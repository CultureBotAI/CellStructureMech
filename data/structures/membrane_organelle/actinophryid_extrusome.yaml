components:
- component_id: gp40_adhesive_glycoprotein
  label: GP40-type adhesive glycoprotein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The inspected GP40 sequence entries B2NIF0 and B2NIF1 are unreviewed.
    Their active InterPro matches IPR000757 and IPR013320 describe a domain and a
    superfamily, not an exact adhesive-GP40 family. The additional IPR050546 cross-reference
    returned HTTP 410 and was not adopted.
  role: Adhesive glycoprotein cargo implicated in prey attachment and ingestion.
  evidence:
  - reference: DOI:10.1078/1434-4610-00041
    notes: The abstract identifies extrusome-stored GP40 and reports prey adhesion
      to GP40-coated beads.
- component_id: extrusome_membrane
  label: extrusome membrane
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Composite bounding membrane; the cited ultrastructural study does
    not identify particular lipid species.
  role: Bounds the granule and contributes membrane during prey enclosure.
  evidence:
  - reference: DOI:10.1002/cm.970020103
    notes: Electron microscopy links extrusome fusion to provision of food-vacuole
      membrane.
