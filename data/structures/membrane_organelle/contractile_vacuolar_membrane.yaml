components:
- component_id: contractile_vacuole_lipid_bilayer
  label: contractile-vacuole lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Bounding bilayer that separates the contractile-vacuole lumen from the cytosol
    and carries water channels involved in vacuole filling.
  evidence:
  - reference: GO:0031164
    notes: GO:0031164 identifies the contractile vacuolar membrane as the lipid bilayer
      surrounding the contractile vacuole.
  - reference: uniprot.location:SL-0074
    notes: UniProt Subcellular Location SL-0074 maps Contractile vacuole membrane
      to GO:0031164.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0031164 and UniProt SL-0074 identify the whole contractile vacuolar
    membrane, but no exact contractile-vacuole-specific lipid or lipid-bilayer CURIE
    was curated for the generic membrane constituent.
- component_id: aquaporins
  label: contractile-vacuole membrane aquaporins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Aquaporins associated with contractile-vacuole membranes are curated
    as a membrane-channel group; no exact lineage-neutral family grounding was chosen
    for the CV-localized subset.
  role: Water channels that increase contractile-vacuole-system membrane permeability
    during water filling.
  evidence:
  - reference: DOI:10.1042/BC20070091
    notes: Nishihara et al. 2008 cloned an Amoeba proteus aquaporin and localized
      it to the contractile vacuole membrane and perivacuolar vesicles.
  - reference: DOI:10.1016/j.ejop.2024.126078
    notes: More et al. 2024 review channels implicated in contractile-vacuole filling.
