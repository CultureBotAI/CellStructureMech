components:
- component_id: acidocalcisome_lipid_bilayer
  label: acidocalcisome lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Bounding bilayer that separates the acidic, polyphosphate-rich acidocalcisome
    lumen from the cytosol and carries ion pumps and transporters.
  evidence:
  - reference: GO:0033102
    notes: GO:0033102 defines the acidocalcisome membrane as the lipid bilayer surrounding
      an acidocalcisome.
  - reference: uniprot.location:SL-0003
    notes: UniProt Subcellular Location SL-0003 maps directly to GO:0033102 and denotes
      the membrane of an acidocalcisome.
- component_id: proton_pumps
  label: acidocalcisome proton pumps
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The acidocalcisome membrane can carry lineage-specific V-H+-PPase,
    V-H+-ATPase and other pumps; no exact source-neutral term for the whole acidocalcisome
    proton-pump set was curated.
  role: Membrane proton pumps that acidify the acidocalcisome lumen and energize uptake
    of ions into the organelle.
  evidence:
  - reference: DOI:10.1038/nrmicro1097
    notes: Docampo et al. 2005 review V-H+-PPase and V-H+-ATPase activities in acidocalcisome
      membranes.
  - reference: DOI:10.1074/jbc.M304548200
    notes: Seufferheld et al. 2003 localized vacuolar proton pyrophosphatase activity
      to bacterial acidocalcisome-like organelles.
- component_id: cation_transporters
  label: acidocalcisome cation transporters
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Calcium and other cation transport systems differ across bacterial
    and eukaryotic acidocalcisome membranes, so no exact family-level CURIE was asserted
    for the grouped transporter set.
  role: Transport proteins that exchange calcium and other cations across the acidocalcisome
    membrane.
  evidence:
  - reference: DOI:10.1128/MMBR.00042-23
    notes: Docampo and Huang 2024 review cation transport systems of acidocalcisome
      membranes.
taxonomic_distribution:
