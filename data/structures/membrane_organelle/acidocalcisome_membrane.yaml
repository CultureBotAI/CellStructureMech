functions:
- function_id: acidocalcisome_lumen_acidification
  label: acidocalcisome lumen acidification
  description: Proton pumps in the acidocalcisome membrane generate an acidic lumen
    that supports polyphosphate and cation storage.
  evidence:
  - reference: DOI:10.1038/nrmicro1097
    notes: Docampo et al. 2005 review proton pumps in the acidocalcisome membrane
      and the acidic lumen they maintain.
- function_id: acidocalcisome_cation_transport
  label: acidocalcisome cation transport
  description: Transport systems in the acidocalcisome membrane move calcium and other
    cations into and out of the organelle.
  evidence:
  - reference: DOI:10.1128/MMBR.00042-23
    notes: Docampo and Huang 2024 review calcium and cation transport across acidocalcisome
      membranes.
