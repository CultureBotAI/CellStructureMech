- component_id: magnetite
  label: magnetite
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  grounding: CHEBI:46726
  essentiality: ESSENTIAL
  role: The magnetic mineral core (Fe3O4), biomineralised to a species-specific size
    and habit within the vesicle. Some lineages make greigite (Fe3S4, CHEBI:86238)
    instead.
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.99
    notes: Uebe & Schüler 2016 describe magnetite (and greigite) biomineralisation
      inside the magnetosome vesicle.
- component_id: mamk_filament
  label: MamK filament
  component_type: PROTEIN_COMPLEX
  component_role: ASSOCIATED_MACHINERY
  grounding: cellstructuremech:mamk_filament
  gene_symbols:
  - mamK
  essentiality: DISPENSABLE
  role: 'Cytoskeletal filament that aligns assembled magnetosomes into a chain. Machinery
    acting on the assembled organelle rather than a constituent of it: vesicles still
    form and mineralise without the filament, but they scatter.'
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.99
    notes: Uebe and Schuler 2016 describe MamK filaments arranging magnetosomes in
      a chain.
  - reference: DOI:10.1002/pro.2827
    notes: Barber-Zucker and Zarivach 2015 describe MamK as the actin-like filament
      associated with magnetosome chains.
