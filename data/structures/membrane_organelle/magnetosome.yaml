    notes: Uebe and Schuler 2016 review MamJ as a connector between magnetosome vesicles
      and MamK filaments.
  - reference: DOI:10.1002/pro.2827
    notes: Barber-Zucker and Zarivach 2015 describe MamJ connecting magnetosome membranes
      to the MamK filament.
