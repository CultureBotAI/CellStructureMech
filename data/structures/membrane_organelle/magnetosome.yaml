discussions:
- discussion_id: no_image_yet
  prompt: Add a micrograph whose imaged organism is identified to species.
  kind: CURATION_TODO
  status: OPEN
  rationale: Commons carries CC BY 3.0 TEM images of magnetosome chains from Pósfai
    et al. (PMC3840360), but their captions identify the cells only as 'magnetotactic
    Alphaproteobacteria' or an unnamed strain, and the schema requires an image taxon
    the record already claims.
  posed_by: claude
  posed_date: '2026-08-30'
- discussion_id: localisation_evidence_is_thin
  prompt: Most magnetosome proteins carry no experimental evidence for their magnetosome
    localisation in UniProt.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - components#mam_proteins
  rationale: Seeding UniProt SL-0510 for Magnetospirillum gryphiswaldense MSR-1 returned
    27 reviewed proteins; only MamJ carries an ECO:0000269 PubMed citation for the
    localisation itself, so only it produced a protein example. The rest are annotated
    by rule or similarity. That is a statement about the annotation, not about the
    biology — but it means per-protein localisation evidence has to come from the
    primary literature rather than from UniProt.
  posed_by: claude
  posed_date: '2026-08-30'
