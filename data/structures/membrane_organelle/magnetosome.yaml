identifier: GO:0110143
label: magnetosome
definition: A membrane-bounded organelle of magnetotactic bacteria enclosing a nanocrystal
  of a magnetic iron mineral — magnetite (Fe3O4) or greigite (Fe3S4). Magnetosomes
  are invaginations of the cytoplasmic membrane that are filled with iron, and are
  arranged into a chain along a cytoskeletal filament so that the cell behaves as
  a swimming compass needle.
definition_source: GO:0110143
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
components:
- component_id: magnetosome_membrane
  label: magnetosome membrane
  component_type: LIPID
  essentiality: ESSENTIAL
  role: Invagination of the cytoplasmic membrane that encloses the mineral crystal
    and carries the Mam proteins.
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.99
    notes: Uebe & Schüler 2016 review magnetosome membrane invagination as the first
      step of biogenesis.
- component_id: mam_proteins
  label: magnetosome membrane proteins (Mam/Mms)
  component_type: PROTEIN
  gene_symbols:
  - mamA
  - mamB
  - mamE
  - mamM
  - mamO
  - mms6
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: A operon-encoded protein set spanning several unrelated families;
    no single family term denotes it.
  role: Encoded by the magnetosome gene island; control membrane invagination, iron
    transport, and crystal nucleation and size.
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.99
    notes: Uebe & Schüler 2016 describe the mam and mms genes of the magnetosome island
      and their roles in biogenesis.
- component_id: magnetite
  label: magnetite
  component_type: SMALL_MOLECULE
  grounding: CHEBI:46726
  essentiality: ESSENTIAL
  role: The magnetic mineral core (Fe3O4), biomineralised to a species-specific size
    and habit within the vesicle. Some lineages make greigite (Fe3S4, CHEBI:86238)
    instead.
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.99
    notes: Uebe & Schüler 2016 describe magnetite (and greigite) biomineralisation
      inside the magnetosome vesicle.
- component_id: mamk_filament
  label: MamK actin-like filament
  component_type: PROTEIN
  gene_symbols:
  - mamK
  - mamJ
  essentiality: CONDITIONAL
  role: Cytoskeletal filament that aligns magnetosomes into a chain; without it the
    vesicles form but scatter.
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.99
    notes: Uebe & Schüler 2016 describe MamK filaments and the MamJ connector arranging
      magnetosomes in a chain.
  protein_examples:
  - uniprot_id: UniProtKB:V6F519
    protein_label: Magnetosome-associated protein MamJ
    gene_symbol: mamJ
    taxon_id: NCBITaxon:431944
    taxon_label: Magnetospirillum gryphiswaldense MSR-1
    entry_status: REVIEWED
    retrieved_on: '2026-08-30'
    role: 'UniProt annotates this protein to SL-0510 (magnetosome); component role:
      Cytoskeletal filament that aligns magnetosomes into a chain; without it the
      vesicles form but scatter.'
    evidence:
    - reference: PMID:14766587
      notes: ECO:0000269 experimental evidence for the magnetosome localisation of
        V6F519, as cited by UniProt.
