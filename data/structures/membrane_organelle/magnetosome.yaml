functions:
- function_id: magnetoreception
  label: magnetoreception
  description: The magnetosome chain gives the cell a permanent magnetic dipole, so
    it aligns passively with the geomagnetic field while swimming.
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.99
    notes: Uebe & Schüler 2016 describe the chain as a compass needle aligning the
      cell with the geomagnetic field.
