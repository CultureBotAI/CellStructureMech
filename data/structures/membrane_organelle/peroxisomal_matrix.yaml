discussions:
- discussion_id: boundary_membrane_not_matrix_component
  prompt: Keep the peroxisomal membrane as the boundary of the peroxisomal matrix
    rather than as a matrix component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#peroxisomal_matrix_topology
  rationale: GO:0005782 denotes the volume contained within peroxisome membranes,
    whereas GO:0005778 denotes the lipid bilayer surrounding a peroxisome.
  resolution_note: Represented GO:0005778 as the boundary node in the topology graph
    and left the matrix record without constituent components.
  evidence:
  - reference: GO:0005782
    notes: GO:0005782 identifies the peroxisomal matrix.
  - reference: GO:0005778
    notes: GO:0005778 identifies the membrane that bounds the peroxisomal matrix.
  posed_by: codex
  posed_date: '2026-09-15'
