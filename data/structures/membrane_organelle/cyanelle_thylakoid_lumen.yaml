discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the cyanelle thylakoid membrane as the boundary of the cyanelle thylakoid
    lumen rather than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#cyanelle_thylakoid_lumen_topology
  rationale: GO:0033114 denotes the lumenal compartment bounded by thylakoid membranes,
    whereas GO:0033115 denotes the cyanelle thylakoid lipid bilayer membrane that
    bounds that compartment.
  resolution_note: Represented GO:0033115 as the boundary node in the topology graph
    without a component_ref and left the lumen record without constituent components.
  evidence:
  - reference: GO:0033114
    notes: GO:0033114 defines the cyanelle thylakoid lumen as the cyanelle compartment
      bounded by thylakoid membranes.
  - reference: GO:0033115
    notes: GO:0033115 defines the cyanelle thylakoid membrane as the lipid bilayer
      of a cyanelle thylakoid.
  posed_by: codex
  posed_date: '2026-09-12'
