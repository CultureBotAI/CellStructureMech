functions:
- function_id: vacuolar_membrane_acidification
  label: vacuolar acidification
  grounding: GO:0007035
  description: Vacuolar membranes host proton-pumping V-ATPase complexes that raise
    the hydrogen-ion concentration in the vacuolar lumen.
  evidence:
  - reference: GO:0007035
    notes: GO:0007035 denotes processes that lower vacuolar pH by raising the vacuolar
      hydrogen-ion concentration.
  - reference: DOI:10.1128/MMBR.70.1.177-191.2006
    notes: Kane 2006 reviews yeast V-ATPase proton pumping at organelle membranes.
- function_id: nucleus_vacuole_junction_formation
  label: nucleus-vacuole junction formation
  description: Yeast vacuolar membranes supply Vac8p for direct binding to Nvj1p on
    the nuclear outer membrane.
  evidence:
  - reference: DOI:10.1091/mbc.11.7.2445
    notes: Pan et al. 2000 showed that Saccharomyces cerevisiae Nvj1p and Vac8p directly
      interact to form nucleus-vacuole junctions.
