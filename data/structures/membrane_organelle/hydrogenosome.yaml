identifier: GO:0042566
label: hydrogenosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A spherical, membrane-bounded organelle found in some anaerobic protozoa,
  which participates in ATP and molecular hydrogen formation.
definition_source: GO:0042566
mapping_status: PROPOSED
