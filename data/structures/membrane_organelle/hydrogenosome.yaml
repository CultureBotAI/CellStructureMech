  title: Hydrogenosomal enzymes convert pyruvate into ATP and molecular hydrogen
  description: Hydrogenosomal import and ISC assembly load the organelle matrix with
    enzymes that oxidize pyruvate and support substrate-level phosphorylation with
    proton reduction to molecular hydrogen.
