components:
- component_id: hydrogenosomal_membrane
  label: hydrogenosomal membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0046859
  essentiality: ESSENTIAL
  role: Double bounding membrane that encloses the hydrogenosome matrix and separates
    ATP- and hydrogen-producing enzymes from the cytosol.
  evidence:
  - reference: PMID:4750424
    notes: Lindmark and Muller 1973 described a particulate hydrogen-producing organelle
      in Tritrichomonas foetus.
  - reference: DOI:10.1111/jeu.12922
    notes: Tachezy 2022 reviews hydrogenosomes as mitochondrion-related organelles
      of anaerobic eukaryotes.
- component_id: pyruvate_metabolism_enzymes
  label: hydrogenosomal pyruvate metabolism and hydrogen-production enzymes
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The energy-metabolism component groups multiple unrelated Trichomonas
    hydrogenosomal enzyme families; no single exact family CURIE denotes the full
    ATP- and hydrogen-producing enzyme set.
  role: Matrix enzymes that convert pyruvate into acetate, ATP and molecular hydrogen
    under anaerobic conditions.
  evidence:
  - reference: PMID:4750424
    notes: Lindmark and Muller 1973 linked the organelle to hydrogen production in
      trichomonads.
  - reference: DOI:10.1016/j.ijpara.2011.10.001
    notes: Schneider et al. 2011 identified hydrogenosomal proteins involved in pyruvate
      metabolism, substrate-level phosphorylation and hydrogen production.
- component_id: hydrogenosomal_fe_s_machinery
  label: hydrogenosomal iron-sulfur cluster assembly machinery
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The hydrogenosomal iron-sulfur cluster assembly module contains
    several ISC proteins; exact source-neutral family CURIEs for the grouped machinery
    were not curated.
  role: Mitochondrial-type ISC factors that assemble iron-sulfur centers in the hydrogenosome.
  evidence:
  - reference: DOI:10.1073/pnas.0401319101
    notes: Sutak et al. 2004 localized mitochondrial-type iron-sulfur center assembly
      to Trichomonas vaginalis hydrogenosomes.
- component_id: hydrogenosomal_import_machinery
  label: hydrogenosomal protein-import machinery
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Hydrogenosomal targeting and translocation machinery is mitochondrion-related
    but divergent, so exact complex- or family-level groundings were deferred.
  role: Mitochondrion-related machinery that recognizes N-terminal presequences and
    imports nuclear-encoded proteins into the hydrogenosome.
  evidence:
  - reference: DOI:10.1073/pnas.0500349102
    notes: Dolezal et al. 2005 found that Giardia mitosomes and trichomonad hydrogenosomes
      share a protein targeting mode.
  - reference: DOI:10.1073/pnas.93.18.9651
    notes: Bui et al. 1996 found N-terminal processing of hydrogenosomal Hsp60, consistent
      with import of nuclear-encoded matrix proteins.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Hydrogenosomes occur patchily in anaerobic microbial eukaryotes and represent
    independently modified mitochondria rather than a conserved eukaryotic state.
  reference: DOI:10.1111/jeu.12922
- taxon_id: NCBITaxon:5722
  taxon_label: Trichomonas vaginalis
  presence: COMMON
  note: The parasite contains abundant hydrogenosomes that have been biochemically
    and proteomically characterized.
  reference: DOI:10.1016/j.ijpara.2011.10.001
canonical_examples:
- taxon_id: NCBITaxon:5722
  taxon_label: Trichomonas vaginalis
  note: Parabasalid parasite in which hydrogenosomal metabolism, iron-sulfur cluster
    assembly, protein targeting and the organelle proteome have been experimentally
    studied.
  reference: DOI:10.1016/j.ijpara.2011.10.001
functions:
- function_id: anaerobic_atp_and_hydrogen_production
  label: anaerobic ATP and molecular hydrogen production
  description: Hydrogenosomal pyruvate metabolism supports anaerobic ATP production
    by substrate-level phosphorylation while releasing molecular hydrogen.
  evidence:
  - reference: PMID:4750424
    notes: Lindmark and Muller 1973 isolated the hydrogen-producing organelle that
      gave hydrogenosomes their name.
  - reference: DOI:10.1016/j.ijpara.2011.10.001
    notes: Schneider et al. 2011 cataloged hydrogenosomal enzymes for pyruvate metabolism
      and substrate-level phosphorylation.
- function_id: hydrogenosomal_fe_s_cluster_assembly
  label: hydrogenosomal iron-sulfur cluster assembly
  description: Hydrogenosomes retain mitochondrial-type ISC machinery that assembles
    iron-sulfur centers.
  evidence:
  - reference: DOI:10.1073/pnas.0401319101
    notes: Sutak et al. 2004 showed that iron-sulfur center assembly occurs in Trichomonas
      vaginalis hydrogenosomes.
- function_id: hydrogenosomal_protein_import
  label: hydrogenosomal matrix protein import
  description: Nuclear-encoded hydrogenosomal matrix proteins are targeted to the
    organelle through N-terminal presequences.
  evidence:
  - reference: DOI:10.1073/pnas.0500349102
    notes: Dolezal et al. 2005 compared targeting signals in trichomonad hydrogenosomes
      and Giardia mitosomes.
evidence:
- reference: PMID:4750424
  notes: Lindmark and Muller 1973, Hydrogenosome, a cytoplasmic organelle of the anaerobic
    flagellate Tritrichomonas foetus, and its role in pyruvate metabolism, Journal
    of Biological Chemistry.
- reference: DOI:10.1073/pnas.93.18.9651
  notes: Bui et al. 1996, A common evolutionary origin for mitochondria and hydrogenosomes,
    Proceedings of the National Academy of Sciences.
- reference: DOI:10.1073/pnas.0401319101
  notes: Sutak et al. 2004, Mitochondrial-type assembly of iron-sulfur centers in
    the hydrogenosomes of the amitochondriate eukaryote Trichomonas vaginalis, Proceedings
    of the National Academy of Sciences.
- reference: DOI:10.1073/pnas.0500349102
  notes: Dolezal et al. 2005, Giardia mitosomes and trichomonad hydrogenosomes share
    a common mode of protein targeting, Proceedings of the National Academy of Sciences.
- reference: DOI:10.1016/j.ijpara.2011.10.001
  notes: Schneider et al. 2011, The Trichomonas vaginalis hydrogenosome proteome is
    highly reduced relative to mitochondria, yet complex compared with mitosomes,
    International Journal for Parasitology.
- reference: DOI:10.1111/jeu.12922
  notes: 'Tachezy 2022, Hydrogenosomes and mitosomes: Mitochondria of anaerobic eukaryotes,
    Journal of Eukaryotic Microbiology.'
