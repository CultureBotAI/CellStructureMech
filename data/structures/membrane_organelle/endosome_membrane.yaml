functions:
- function_id: endosomal_membrane_cargo_sorting
  label: endosomal membrane cargo sorting
  description: The endosome membrane provides the sorting surface where ubiquitinated
    transmembrane cargo and ESCRT machinery are brought together for delivery into
    intraluminal vesicles.
  evidence:
  - reference: PMID:11511343
    notes: Katzmann, Babst and Emr 2001 identified ESCRT-I as a conserved yeast endosomal
      protein-sorting complex needed for ubiquitin-dependent MVB cargo sorting.
  - reference: DOI:10.1083/jcb.200302136
    notes: Katzmann et al. 2003 found that Vps27 recruits ESCRT-I to endosomal membranes
      during MVB sorting.
- function_id: multivesicular_body_sorting_pathway
  label: multivesicular body sorting pathway
  grounding: GO:0071985
  description: The endosome membrane buds inward during ESCRT-dependent sorting to
    package endosomal membrane cargo into intraluminal vesicles.
  evidence:
  - reference: GO:0005771
    notes: GO:0005771 defines multivesicular bodies as endosomes containing internal
      vesicles formed by invagination of the limiting endosomal membrane.
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed ESCRT-driven intraluminal vesicle
      formation at endosomes.
