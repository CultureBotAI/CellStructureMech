components:
- component_id: endosome_membrane_lipid_bilayer
  label: endosome membrane lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Lipid-bilayer constituent that forms the endosomal boundary for cargo sorting
    and multivesicular-body intraluminal-vesicle formation.
  evidence:
  - reference: GO:0010008
    notes: GO:0010008 defines the endosome membrane as the lipid bilayer surrounding
      an endosome.
  - reference: DOI:10.1083/jcb.200302136
    notes: Katzmann et al. 2003 localized yeast Vps27 and ESCRT-I recruitment to endosomal
      membranes during multivesicular-body cargo sorting.
  grounding_status: REVIEWED_LABEL_ONLY
