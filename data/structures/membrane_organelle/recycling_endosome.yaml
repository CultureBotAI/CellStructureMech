taxonomic_distribution:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  presence: VARIABLE
  note: Trypanosoma brucei bloodstream and procyclic cells contain TbRAB11-positive
    endosomal structures carrying recycling cargo, with stronger TbRAB11 expression
    and a more elaborate TbRAB11 compartment in bloodstream-stage cells.
  reference: PMID:11683389
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: African trypanosome whose Rab11-positive endosomal compartment colocalizes
    with transferrin receptor and internalized anti-variant surface glycoprotein cargo.
  reference: PMID:11683389
functions:
- function_id: rab11_dependent_cargo_recycling
  label: Rab11-dependent endocytic recycling
  description: Recycling endosomes target internalized cargo back toward the cell
    surface; in Trypanosoma brucei, TbRAB11 contributes to recycling of transferrin
    and anti-VSG antibody cargo through the endosomal system.
  evidence:
  - reference: GO:0055037
    notes: GO:0055037 defines the recycling endosome by its role in targeting molecules
      to the plasma membrane.
  - reference: PMID:12744719
    notes: Pal et al. 2003 used live-cell recycling assays and Rab mutants to implicate
      TbRAB11 in Trypanosoma brucei transferrin and anti-VSG antibody recycling.
  - reference: PMID:29582527
    notes: Umaer, Bush and Bangs 2018 showed that TbRab11 mediates selective recycling
      and endocytic trafficking in Trypanosoma brucei.
