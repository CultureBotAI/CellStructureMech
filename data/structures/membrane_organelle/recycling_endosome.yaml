causal_graphs:
- graph_id: trypanosome_recycling_endosome_topology
  title: Recycling endosome topology and Rab11 cargo recycling
  description: The recycling endosome is an endosome subtype bounded by a membrane
    around a lumenal compartment and marked in Trypanosoma brucei by Rab11-positive
    endosomal structures that carry recycling cargo.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures GO-backed recycling-endosome topology and Rab11-associated
    T. brucei cargo recycling without asserting a complete Rab5/Rab11 cascade or treating
    transient Rab regulators as membrane constituents.
