discussions:
- discussion_id: tbrab11_marker_not_structural_component
  prompt: Treat TbRAB11 as marker and regulatory evidence rather than as a recycling-endosome
    structural component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#trypanosome_recycling_endosome_topology
  rationale: The Trypanosoma brucei evidence uses TbRAB11 localization and perturbation
    to identify recycling endosomal traffic, but Rab11 is a small GTPase marker/regulator
    and not a constituent of the lipid-bounded compartment itself.
  resolution_note: Curated the GO-grounded recycling endosome membrane as the sole
    component in this pass and kept TbRAB11 as a non-component graph node.
  evidence:
  - reference: PMID:11683389
    notes: Jeffries, Morgan and Field 2001 used TbRAB11 to mark T. brucei endosomal
      structures carrying recycling cargo.
  - reference: PMID:12744719
    notes: Pal et al. 2003 used Rab mutants to test TbRAB5A- and TbRAB11-dependent
      endocytic recycling.
  posed_by: codex
  posed_date: '2026-09-22'
  resolved_date: '2026-09-22'
