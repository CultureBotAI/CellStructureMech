functions:
- function_id: glycosomal_matrix_import_boundary
  label: glycosomal matrix import boundary
  description: The glycosome membrane separates the matrix from the cytosol and hosts
    peroxin machinery that imports nuclear-encoded PTS-containing matrix proteins.
  evidence:
  - reference: DOI:10.1046/j.1432-1033.2003.03582.x
    notes: Choe et al. 2003 characterized Trypanosoma brucei PEX14 as a glycosomal
      membrane protein that interacts with TbPEX5 during matrix-protein import.
  - reference: DOI:10.1016/j.bbamcr.2015.09.015
    notes: Haanstra et al. 2016 review conserved peroxin machinery in trypanosomatid
      glycosome biogenesis and maintenance.
