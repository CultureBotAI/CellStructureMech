discussions:
- discussion_id: golgi_lumen_boundary_not_membrane
  prompt: Represent Golgi membranes and their nucleotide-sugar transporters as lumen
    boundaries rather than Golgi lumen components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#golgi_lumen_topology
  rationale: GO:0005796 denotes the bounded volume enclosed by Golgi membranes, whereas
    GO:0000139 denotes the enclosing lipid bilayers and Vrg4 is a membrane GDP-mannose
    transporter.
  evidence:
  - reference: GO:0005796
    notes: GO:0005796 identifies the Golgi lumen.
  - reference: GO:0000139
    notes: GO:0000139 identifies the Golgi membrane that bounds Golgi compartments.
  - reference: PMID:9395539
    notes: Dean, Zhang and Poster 1997 studied VRG4-dependent GDP-mannose transport
      across the Golgi boundary into the Golgi lumen.
  resolution_note: Curated the Golgi membrane as a topology boundary and left the
    Golgi lumen without asserted stable molecular components.
  posed_by: codex
  posed_date: '2026-09-22'
  resolved_date: '2026-09-22'
