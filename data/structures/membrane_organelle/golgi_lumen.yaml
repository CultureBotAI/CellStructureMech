functions:
- function_id: golgi_lumen_glycosylation_compartment
  label: Golgi lumen glycosylation compartment
  description: The Golgi lumen is the bounded volume inside Golgi cisternae and subcompartments
    where lumen-facing glycosylation reactions access nucleotide-sugar substrates
    imported across Golgi membranes.
  evidence:
