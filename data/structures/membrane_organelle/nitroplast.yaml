discussions:
- discussion_id: identity_and_host_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the nitroplast distinct from a whole host, a microbial taxon and the
    diazoplast.
  rationale: A compartment record must not turn a lineage name into an unrestricted
    structural synonym.
  notes: Minted after hidden/ignored-inclusive deduplication and exact GO search.
    FR-12 and FR-21 are separate cultures. Distribution is deliberately limited to
    the verified host; protein-import evidence is not generalized to every UCYN-A
    lineage.
  evidence:
  - reference: DOI:10.1080/00318884.2026.2660260
    notes: Scope and evidence boundary reviewed.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: import_evidence_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate organelle-level import evidence from individual candidate validation.
  rationale: Protein enrichment and sequence prediction have different evidential
    strength.
  notes: Host-protein enrichment supports import. Predicted-only uTP candidates are
    not constituents here. uTP cleavage, translocon identity, mitochondrial ATP transfer
    and candidate-specific roles remain unproven; no causal edges assert them.
  evidence:
  - reference: DOI:10.1126/science.adk1075
    notes: Scope and evidence boundary reviewed.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: transport_and_diel_remodeling
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve import machinery, exchanged substrates and vesicle cargo experimentally.
  rationale: Static architecture cannot establish transport direction or regulatory
    causality.
  notes: Li et al. 2026 version 1 remains a preprint in PMC. Its Discussion explicitly
    leaves cargo and directionality unresolved. Membrane discontinuities and vesicle
    proximity are not proof of gating, cargo transfer or a causal nitrogen-fixation
    mechanism; unidentified densities are not named components.
  evidence:
  - reference: DOI:10.64898/2026.04.11.717942
    notes: Scope and evidence boundary reviewed.
  posed_by: codex
  posed_date: '2026-10-03'
