  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0000228 denotes complete eukaryotic nuclear chromosome structures;
    no source-neutral GO or SO identifier was verified for the processed, amplified
    DNA molecules on ciliate macronuclear chromosomes.
  role: Processed, amplified DNA molecules carried on ciliate macronuclear chromosomes
    and vegetatively expressed from the somatic genome.
  evidence:
  - reference: GO:0031039
    notes: GO:0031039 defines the macronucleus as containing polyploid copies of part
      of the cell genome.
  - reference: DOI:10.1371/journal.pbio.0040286
    notes: Eisen et al. 2006 sequenced the Tetrahymena thermophila macronuclear genome
      and described its MIC-derived, amplified chromosomes.
