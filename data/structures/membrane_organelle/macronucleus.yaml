  title: Macronuclear chromosomal DNA supports somatic expression
  description: In Tetrahymena thermophila, processed, amplified macronuclear chromosomal
    DNA is carried on chromosomes in the somatic macronucleus and supports vegetative
    gene expression.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the mature Tetrahymena macronucleus as a processed-genome
    compartment without modeling micronucleus-to-macronucleus development or macronuclear
    nuclear-pore composition.
