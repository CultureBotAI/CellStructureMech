identifier: GO:0031039
label: macronucleus
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded organelle of ciliated protozoan cells that contains
  polyploid copies of a portion of the cell's complete genome. Transcription of genes
  occurs in macronuclei. Some ciliate species may contain multiple macronuclei per
  cell.
