  llm_assisted: true
- timestamp: '2026-09-13T18:07:43Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added the UniProt SL xref, symbiont-containing-vacuole parentage, a PVM
    constituent, eukaryotic and Apicomplexa distribution, Toxoplasma and Plasmodium
    examples, PV niche function, DOI/GO/UniProt evidence, a nonmechanistic topology
    graph, and scope discussions for GO:0020003 and GO:0020005.
  llm_assisted: true
synonyms:
- synonym_text: PV
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/j.pt.2017.02.007
