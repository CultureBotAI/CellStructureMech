- reference: DOI:10.1016/j.pt.2017.02.007
  notes: 'Clough and Frickel 2017, The Toxoplasma Parasitophorous Vacuole: An Evolving
    Host-Parasite Frontier, Trends in Parasitology.'
- reference: DOI:10.1128/mSphere.00522-17
  notes: Schnider et al. 2018, BioID Reveals Novel Proteins of the Plasmodium Parasitophorous
