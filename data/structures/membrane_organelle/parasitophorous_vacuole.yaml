identifier: cellstructuremech:parasitophorous_vacuole
label: parasitophorous vacuole
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded host-cell vacuole in which an invading apicomplexan
  parasite resides and develops; its bounding parasitophorous vacuolar membrane is
  initiated during host-cell invasion and surrounds the intracellular parasite.
definition_source: uniprot.location:SL-0194
mapping_status: PROPOSED
