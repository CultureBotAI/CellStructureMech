components:
- component_id: parasitophorous_vacuolar_membrane
  label: parasitophorous vacuolar membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: UniProt SL-0193 and GO:0020005 identify the broader symbiont-containing
    vacuole membrane class; no exact Apicomplexa-scoped CURIE for the parasitophorous
    vacuolar membrane was asserted as a component grounding.
  essentiality: ESSENTIAL
  role: Lipid bilayer boundary that surrounds the intracellular parasite and separates
    the parasitophorous vacuole from the host cytosol.
  evidence:
  - reference: uniprot.location:SL-0193
    notes: UniProt Subcellular Location SL-0193 identifies the parasitophorous vacuolar
      membrane as the membrane surrounding the parasitophorous vacuole.
  - reference: DOI:10.1242/jcs.111.11.1467
    notes: Lingelbach and Joiner 1998 review the parasitophorous vacuolar membrane
      surrounding intracellular Plasmodium and Toxoplasma parasites.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Parasitophorous vacuoles are specialized host-cell compartments formed by
    a minority of intracellular microbial eukaryotes rather than conserved eukaryotic
    organelles.
  reference: uniprot.location:SL-0194
- taxon_id: NCBITaxon:5794
  taxon_label: Apicomplexa
  presence: COMMON
  note: UniProt describes the parasitophorous vacuole as the host-cell vacuole in
    which most apicomplexan parasites reside and develop.
  reference: uniprot.location:SL-0194
canonical_examples:
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan parasite whose parasitophorous vacuole and parasite-modified
    PVM are reviewed as a model host-parasite interface.
  reference: DOI:10.1016/j.pt.2017.02.007
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  note: Human malaria parasite whose intraerythrocytic PV/PVM was used in a BioID
    survey of PVM-associated proteins.
  reference: DOI:10.1128/mSphere.00522-17
functions:
- function_id: intracellular_parasite_replication_niche
  label: intracellular parasite replication niche
  description: The parasitophorous vacuole surrounds the intracellular parasite and
    supplies the host-cell compartment in which apicomplexan parasites reside and
    develop.
  evidence:
  - reference: uniprot.location:SL-0194
    notes: UniProt SL-0194 defines the parasitophorous vacuole as the host-cell vacuole
      where most apicomplexan parasites reside and develop.
  - reference: DOI:10.1016/j.pt.2017.02.007
    notes: Clough and Frickel 2017 review the Toxoplasma PV as the interface between
      the parasite and its host.
evidence:
- reference: uniprot.location:SL-0194
  notes: UniProt Subcellular Location entry SL-0194 identifies the parasitophorous
    vacuole and maps it to the broader GO:0020003 symbiont-containing vacuole class.
- reference: GO:0020003
  notes: Gene Ontology cellular-component term for symbiont-containing vacuoles, the
    broader class that contains apicomplexan parasitophorous vacuoles.
- reference: GO:0020005
  notes: Gene Ontology cellular-component term for the broader symbiont-containing
    vacuole membrane class.
- reference: uniprot.location:SL-0193
  notes: UniProt Subcellular Location entry SL-0193 identifies the parasitophorous
    vacuolar membrane and maps it to GO:0020005.
- reference: DOI:10.1242/jcs.111.11.1467
  notes: 'Lingelbach and Joiner 1998, The parasitophorous vacuole membrane surrounding
    Plasmodium and Toxoplasma: an unusual compartment in infected cells, Journal of
