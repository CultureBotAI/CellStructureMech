causal_graphs:
- graph_id: chlamydomonas_chloroplast_envelope_and_import
  title: Chloroplast envelope and thylakoids organize import
  description: In Chlamydomonas, two envelope membranes bound the chloroplast stroma,
    thylakoid membranes provide internal photosynthetic compartments, and a TOC-TIC
    supercomplex spans both envelope membranes during protein import.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures chloroplast topology and the envelope-spanning TOC-TIC
    import route at a compartment level without asserting every photosynthetic complex,
    stromal enzyme, ribosome, genome, or thylakoid-biogenesis factor.
