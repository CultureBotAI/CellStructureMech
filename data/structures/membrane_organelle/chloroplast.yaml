functions:
- function_id: photosynthesis
  label: photosynthesis
  grounding: GO:0015979
  description: Chloroplast thylakoid membranes and stromal enzymes convert light energy
    and carbon dioxide into organic carbon through photosynthetic electron transport
    and carbon fixation.
  evidence:
  - reference: GO:0015979
    notes: GO:0015979 defines photosynthesis as synthesis of organic compounds from
      CO2 using light energy.
  - reference: DOI:10.1007/s00294-011-0339-1
    notes: Terashima, Specht and Hippler 2011 review the Chlamydomonas chloroplast
      proteome, including thylakoid photosynthetic complexes and stromal metabolism.
- function_id: protein_import_into_chloroplast_stroma
  label: protein import into chloroplast stroma
  grounding: GO:0045037
  description: Envelope translocases import nucleus-encoded precursor proteins across
    the chloroplast outer and inner membranes to reach the stroma.
  evidence:
  - reference: GO:0045037
    notes: GO:0045037 defines protein import into the chloroplast stroma.
  - reference: DOI:10.1016/j.cell.2022.10.030
    notes: Jin et al. 2022 determined a Chlamydomonas TOC-TIC structure that spans
      the chloroplast envelope and forms a pathway for preprotein translocation.
