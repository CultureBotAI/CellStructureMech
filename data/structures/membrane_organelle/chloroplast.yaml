- component_id: chloroplast_inner_membrane
  label: chloroplast inner membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0009706
  essentiality: UNKNOWN
  role: Stroma-facing lipid bilayer of the chloroplast envelope that participates
    with the outer envelope in delimiting the chloroplast compartment.
  evidence:
  - reference: GO:0009706
    notes: GO:0009706 defines the chloroplast inner membrane as the inner lipid bilayer
      of the chloroplast envelope facing the stroma.
- component_id: chloroplast_thylakoid_membrane
  label: chloroplast thylakoid membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0009535
  essentiality: UNKNOWN
  role: Pigmented membrane of chloroplast thylakoids that houses the photosynthetic
    electron-transport complexes.
  evidence:
  - reference: GO:0009535
    notes: GO:0009535 defines the chloroplast thylakoid membrane as the pigmented
      membrane of a chloroplast thylakoid.
- component_id: toc_tic_supercomplex
  label: TOC-TIC import supercomplex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO has exact terms for the Toc and Tic subcomplexes, and GO:0061927
    denotes a TOC-TIC supercomplex I with a classic Tic110-containing composition.
    The Chlamydomonas TOC-TIC supercomplex resolved by Jin et al. 2022 contains a
    divergent Toc120/Toc75 and Tic20/YlmG architecture, so no exact source-neutral
    CURIE was asserted.
  role: Envelope-spanning translocase that conducts nuclear-encoded preproteins across
    the outer and inner chloroplast envelope membranes toward the stroma.
  evidence:
  - reference: DOI:10.1016/j.cell.2022.10.030
    notes: Jin et al. 2022 resolved a Chlamydomonas TOC-TIC supercomplex spanning
      the two chloroplast envelope membranes.
