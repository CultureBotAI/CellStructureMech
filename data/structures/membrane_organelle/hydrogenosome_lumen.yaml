causal_graphs:
- graph_id: hydrogenosome_lumen_topology
  title: Hydrogenosome lumen topology
  description: The hydrogenosome lumen is the internal hydrogenosome compartment enclosed
    by the hydrogenosomal membrane.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the defining lumenal boundary without duplicating
    whole-hydrogenosome enzyme, protein-import, or iron-sulfur cluster assembly mechanisms.
  nodes:
  - node_id: hydrogenosome_lumen
    label: hydrogenosome lumen
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0034492
  - node_id: hydrogenosomal_membrane
    label: hydrogenosomal membrane
    node_type: STRUCTURE
    grounding: GO:0046859
  - node_id: hydrogenosome
    label: hydrogenosome
    node_type: ORGANELLE
    grounding: GO:0042566
  edges:
  - subject: hydrogenosome_lumen
    predicate: is part of
    object: hydrogenosome
    description: The hydrogenosome lumen is the internal matrix volume of a hydrogenosome.
    evidence:
    - reference: GO:0034492
      notes: GO:0034492 identifies the hydrogenosome lumen cellular component.
    - reference: uniprot.location:SL-0335
      notes: UniProt SL-0335 places the hydrogenosome lumen under the hydrogenosome
        subcellular location.
    - reference: GO:0042566
      notes: GO:0042566 identifies the containing hydrogenosome organelle.
  - subject: hydrogenosomal_membrane
    predicate: encloses
    object: hydrogenosome_lumen
    description: The hydrogenosomal membrane encloses the hydrogenosome lumen.
    evidence:
    - reference: GO:0034492
      notes: GO:0034492 defines the hydrogenosome lumen as the volume enclosed by
        the hydrogenosome membrane.
    - reference: GO:0046859
      notes: GO:0046859 identifies the hydrogenosomal membrane as the lipid bilayer
        surrounding a hydrogenosome.
    - reference: uniprot.location:SL-0144
      notes: UniProt SL-0144 maps the hydrogenosome membrane to GO:0046859.
discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the hydrogenosomal membrane as the boundary of the hydrogenosome lumen
    rather than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#hydrogenosome_lumen_topology
  rationale: GO:0034492 denotes the volume enclosed by the hydrogenosome membrane,
    whereas GO:0046859 denotes the lipid bilayer surrounding a hydrogenosome.
  resolution_note: Represented GO:0046859 as the boundary node in the topology graph
    and left the lumen record without constituent components.
  evidence:
  - reference: GO:0034492
    notes: GO:0034492 identifies the hydrogenosome lumen.
  - reference: GO:0046859
    notes: GO:0046859 identifies the membrane that bounds the hydrogenosome lumen.
  posed_by: codex
  posed_date: '2026-09-13'
