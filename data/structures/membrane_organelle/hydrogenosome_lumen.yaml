functions:
- function_id: hydrogenosome_lumen_metabolism
  label: hydrogenosome lumen metabolism
  description: The hydrogenosome lumen is the matrix compartment that contains enzymes
    for anaerobic ATP and molecular hydrogen production and mitochondrial-type iron-sulfur
    cluster assembly.
  evidence:
  - reference: DOI:10.1016/j.ijpara.2011.10.001
    notes: Schneider et al. 2011 identified the Trichomonas hydrogenosome proteome,
      including energy-metabolism proteins.
  - reference: DOI:10.1073/pnas.0401319101
    notes: Sutak et al. 2004 localized mitochondrial-type iron-sulfur center assembly
      to Trichomonas vaginalis hydrogenosomes.
evidence:
