  reference: DOI:10.1038/nsb910
functions:
- function_id: septal_pore_sealing
  label: septal pore sealing
  description: Woronin bodies plug septal pores after hyphal damage, restricting cytoplasmic
    bleeding from neighboring filamentous-fungal compartments.
  evidence:
  - reference: DOI:10.1006/fgbi.2000.1230
    notes: Tenney et al. 2000 connected Neurospora crassa hex-1 to Woronin bodies
      and septal-pore plugging.
