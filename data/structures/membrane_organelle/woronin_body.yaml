components:
- component_id: woronin_body_membrane
  label: Woronin body membrane
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Single membrane that surrounds the dense Woronin body core and separates this
    peroxisome-derived vesicle from the cytosol.
  evidence:
  - reference: DOI:10.1083/jcb.200705049
    notes: Liu et al. 2008 characterized Woronin bodies as peroxisome-derived membrane-bounded
      organelles.
- component_id: hex1_crystalline_core
  label: Hex1 crystalline core
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - hex-1
  - HEX1
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Hex1/HEX-1 is curated by its experimentally defined Woronin-body
    core role in filamentous fungi; no exact source-neutral InterPro, Pfam or NCBIfam
    family CURIE was chosen for this first record.
  role: Major dense-core protein that self-assembles into a crystalline lattice required
    for normal Woronin body septal-pore plugging.
  evidence:
  - reference: DOI:10.1006/fgbi.2000.1230
    notes: Tenney et al. 2000 identified hex-1 as a filamentous-fungus gene encoding
      the major Woronin body protein.
  - reference: DOI:10.1038/nsb910
    notes: Yuan et al. 2003 solved the Neurospora crassa HEX-1 crystal lattice and
      showed lattice assembly is required for Woronin body function.
taxonomic_distribution:
