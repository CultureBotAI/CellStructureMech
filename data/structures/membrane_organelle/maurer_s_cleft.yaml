functions:
- function_id: erythrocyte_surface_virulence_protein_trafficking
  label: erythrocyte surface virulence-protein trafficking
  description: Maurer's clefts act as intermediate compartments that help traffic
    parasite virulence proteins, including PfEMP1, toward the infected erythrocyte
    surface.
  evidence:
  - reference: DOI:10.1016/j.ijpara.2005.10.001
    notes: Lanzer et al. 2006 reviewed Maurer's cleft morphology and protein-trafficking
      roles in P. falciparum-infected erythrocytes.
  - reference: DOI:10.1111/j.1365-2958.2008.06235.x
    notes: Spycher et al. 2008 found that MAHRP1 loss depletes PfEMP1 from Maurer's
      clefts and prevents PfEMP1 surface presentation.
