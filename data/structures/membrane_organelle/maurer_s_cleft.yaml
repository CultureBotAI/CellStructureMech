  curator: codex
  action: EXPANDED_RECORD
  changes: Added membrane and resident-protein components, P. falciparum taxonomic
    scope, a PfEMP1 trafficking function, DOI evidence, a nonmechanistic Maurer's-cleft
    trafficking graph, and discussions for host-cell boundary and protein-family grounding.
  llm_assisted: true
parent_structures:
- GO:0043231
components:
- component_id: maurers_cleft_membrane
  label: Maurer's cleft membrane
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Parasite-derived membrane boundary of the flattened cleft in the infected
    red-blood-cell cytoplasm.
  evidence:
  - reference: DOI:10.1016/j.ijpara.2005.10.001
    notes: Lanzer et al. 2006 reviewed Maurer's clefts as flattened membranous organelles
      induced by Plasmodium falciparum in infected erythrocytes.
  - reference: DOI:10.1016/S0166-6851(00)00301-7
    notes: Blisnick et al. 2000 localized the integral membrane protein PfSBP1 to
      Maurer's clefts in P. falciparum-infected erythrocytes.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0020036 denotes the whole Maurer's cleft; no exact source-neutral
    GO or membrane-lipid CURIE for only the Maurer's cleft membrane was curated.
- component_id: maurers_cleft_resident_proteins
  label: Maurer's cleft resident proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Plasmodium-exported proteins that reside at Maurer's clefts and participate
    in trafficking or organizing virulence cargo in infected erythrocytes.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2008.06235.x
    notes: Spycher et al. 2008 studied the Maurer's cleft protein MAHRP1 and found
      that MAHRP1 loss prevents PfEMP1 presentation on the infected red-blood-cell
      surface.
  - reference: DOI:10.1083/jcb.200509122
    notes: Cooke et al. 2006 disrupted skeleton-binding protein 1 and showed that
      PfEMP1 still reached Maurer's clefts but was not presented on the infected red-blood-cell
      surface.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Maurer's cleft resident proteins include unrelated Plasmodium proteins
    such as SBP1 and MAHRP1; no exact source-neutral CURIE for the whole resident
    cohort was curated.
- component_id: skeleton_binding_protein_1
  label: skeleton-binding protein 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Integral Maurer's cleft membrane protein implicated in anchoring clefts to
    the erythrocyte skeleton and required for efficient PfEMP1 surface display in
    P. falciparum-infected erythrocytes.
  evidence:
  - reference: DOI:10.1016/S0166-6851(00)00301-7
    notes: Blisnick et al. 2000 characterized PfSBP1 as an integral Maurer's cleft
      membrane protein associated with the erythrocyte skeleton.
  - reference: DOI:10.1083/jcb.200509122
    notes: Cooke et al. 2006 found that deleting SBP1 blocked PfEMP1 expression on
      the infected red-blood-cell surface.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Curated from Plasmodium SBP1 evidence; no exact InterPro, Pfam,
    or NCBIfam family identifier for the Maurer's cleft SBP1 constituent class was
    curated.
