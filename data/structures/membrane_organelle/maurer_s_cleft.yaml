discussions:
- discussion_id: parasite_derived_host_cytoplasm_boundary
  prompt: Model Maurer's clefts as parasite-derived structures inside infected erythrocytes
    rather than as a conserved host red-blood-cell organelle.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - taxonomic_distribution
  - causal_graphs#maurers_cleft_pfemp1_trafficking
  rationale: Maurer's clefts are induced by malaria parasites in the host erythrocyte
    cytoplasm and are populated by parasite-exported proteins; this record therefore
    uses Plasmodium falciparum as the canonical taxon and avoids treating the clefts
    as normal erythrocyte organelles.
  evidence:
  - reference: DOI:10.1016/j.ijpara.2005.10.001
    notes: Lanzer et al. 2006 reviewed Maurer's clefts as organelles in the cytoplasm
      of P. falciparum-infected erythrocytes.
  posed_by: codex
  posed_date: '2026-09-22'
  resolved_date: '2026-09-22'
