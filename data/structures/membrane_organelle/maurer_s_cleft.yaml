identifier: GO:0020036
label: Maurer's cleft
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A disk-like structure that appears at the periphery of a red blood cell
  infected by an apicomplexan parasite, characterized by a translucent lumen and an
  electron-dense coat of variable thickness; often appears to be tethered to the host
  cell membrane by fibrous connections with the erythrocyte cytoskeleton.
definition_source: GO:0020036
mapping_status: PROPOSED
curation_history:
