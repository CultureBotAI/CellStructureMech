identifier: GO:0030137
label: COPI-coated vesicle
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A vesicle with a coat formed of the COPI coat complex proteins. COPI-coated
  vesicles are found associated with Golgi membranes at steady state, are involved
  in Golgi to endoplasmic reticulum (retrograde) vesicle transport, and possibly also
  in intra-Golgi transport.
