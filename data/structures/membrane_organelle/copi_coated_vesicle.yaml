discussions:
- discussion_id: keep_coat_subunits_on_copi_coat
  prompt: Keep coatomer and Arf-family GTPases on the COPI vesicle coat record rather
    than duplicating them as direct COPI-coated vesicle components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#copi_coated_vesicle_topology
  rationale: The whole-vesicle record uses GO:0030126 for its COPI coat part, and
    the coat record already models coatomer and Arf as COPI coat constituents. Repeating
    those subunits here would flatten the coat-versus-vesicle partonomy.
  resolution_note: Added the COPI coat and COPI-coated vesicle membrane as vesicle
    parts and left lower-level coat subunits to the GO:0030126 COPI vesicle coat record.
  evidence:
  - reference: GO:0030137
    notes: GO:0030137 defines the whole coated vesicle in terms of a COPI coat.
  - reference: GO:0030126
    notes: GO:0030126 identifies the COPI vesicle coat.
  - reference: DOI:10.1038/349248a0
    notes: Waters et al. 1991 defined coatomer as a non-clathrin Golgi-vesicle coat
      protein complex.
  - reference: DOI:10.1016/0092-8674(91)90176-y
    notes: Serafini et al. 1991 identified Arf in the coat of Golgi-derived COP-coated
      vesicles.
  posed_by: codex
  posed_date: '2026-09-14'
  resolved_date: '2026-09-14'
- discussion_id: exclude_coatomer_as_vesicle_synonym
  prompt: Leave GO:0030137's related synonym 'coatomer' off this whole-vesicle record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  rationale: In GO, coatomer is an exact synonym for GO:0030126 COPI vesicle coat
    and only a related synonym of GO:0030137 COPI-coated vesicle, so adding it here
    would make searches conflate the coat complex with the whole vesicle.
  resolution_note: Did not add a coatomer synonym to the GO:0030137 record.
  evidence:
  - reference: GO:0030137
    notes: GO:0030137 lists coatomer only as a related synonym of COPI-coated vesicle.
  - reference: GO:0030126
    notes: GO:0030126 lists coatomer as an exact synonym of COPI vesicle coat.
  posed_by: codex
  posed_date: '2026-09-14'
  resolved_date: '2026-09-14'
