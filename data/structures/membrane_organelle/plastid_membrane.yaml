discussions:
- discussion_id: generic_plastid_membrane_scope
  prompt: Keep the GO:0042170 generic membrane parent distinct from exact plastid
    envelope, thylakoid, apicoplast, and cyanelle child membrane records.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#plastid_membrane_scope
  rationale: GO:0042170 denotes a broad plastid membrane class whose children include
    envelope bilayers and plastid thylakoid membranes. Exact topology, membrane count,
    retained peptidoglycan, and protein-import machinery belong on the child records
    for plastid envelope, apicoplast membrane, cyanelle membrane, and plastid thylakoid
    membrane.
  resolution_note: Curated only generic plastid-membrane class scope and kept lineage-specific
    child-membrane composition out of this record.
  evidence:
  - reference: GO:0042170
    notes: GO:0042170 identifies the broad plastid membrane cellular-component term.
  - reference: GO:0009527
    notes: GO:0009527 identifies the plastid outer membrane child.
  - reference: GO:0009528
    notes: GO:0009528 identifies the plastid inner membrane child.
  - reference: GO:0055035
    notes: GO:0055035 identifies the plastid thylakoid membrane child.
  - reference: GO:0033113
    notes: GO:0033113 identifies cyanelle membrane as a GO:0042170 child.
  - reference: GO:0160211
    notes: GO:0160211 identifies apicoplast membrane as a GO:0042170 child.
  posed_by: codex
  posed_date: '2026-09-14'
