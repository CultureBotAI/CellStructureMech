discussions:
- discussion_id: lumen_boundary_not_matrix_components
  prompt: Represent the reservosome matrix as a separate internal substructure rather
    than duplicating its membranes, vesicles, or lipid inclusions as direct lumen
    components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#reservosome_lumen_topology
  rationale: GO:0106124 denotes the volume enclosed by reservosome membranes, whereas
    GO:0106125 denotes the internal reservosome matrix composed of planar membranes,
    vesicles, and lipid inclusions.
  resolution_note: Curated only the lumen-to-reservosome topology on this record and
    left matrix constituents on the distinct reservosome matrix record.
  evidence:
  - reference: GO:0106124
    notes: GO:0106124 identifies the internal reservosome lumen.
  - reference: GO:0106125
    notes: GO:0106125 identifies the reservosome matrix and lists planar membranes,
      vesicles, and lipid inclusions in its definition.
  - reference: DOI:10.1002/jemt.20592
    notes: Sant'Anna et al. 2008 directly observed the complex internal architecture
      of T. cruzi reservosomes by electron microscopy.
  posed_by: codex
  posed_date: '2026-10-03'
