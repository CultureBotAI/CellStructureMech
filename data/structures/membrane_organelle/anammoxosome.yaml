functions:
- function_id: anaerobic_ammonium_oxidation
  label: anaerobic ammonium oxidation
  description: The anammoxosome compartmentalizes the conversion of ammonium and nitrite
    through nitric oxide and hydrazine intermediates to dinitrogen gas.
  evidence:
  - reference: DOI:10.1111/1574-6976.12014
    notes: Kartal et al. 2013 review anaerobic ammonium oxidation as the energy metabolism
      that occurs in the anammoxosome.
- function_id: energy_conservation
  label: energy conservation
  description: Anammoxosome membrane reactions couple hydrazine oxidation and electron
    transfer to proton motive force generation across the organelle membrane.
  evidence:
  - reference: DOI:10.1111/1574-6976.12014
    notes: Kartal et al. 2013 review the proposed anammoxosome proton motive force
      generated by pathway electron transport.
evidence:
- reference: DOI:10.1111/1574-6976.12014
  notes: Kartal B, de Almeida NM, Maalcke WJ, Op den Camp HJM, Jetten MSM and Keltjens
    JT 2013, How to make a living from anaerobic ammonium oxidation, FEMS Microbiology
    Reviews.
- reference: DOI:10.1128/JB.00186-15
  notes: Kartal et al. 2015, Immunogold localization of key metabolic enzymes in the
    anammoxosome and on the tubule-like structures of Kuenenia stuttgartiensis, Journal
    of Bacteriology.
- reference: PMID:15098544
  notes: Sinninghe Damste et al. 2002 identified ladderane lipid membrane components
    in anammox bacteria.
causal_graphs:
- graph_id: hydrazine_loop_energy_conservation
  title: Hydrazine metabolism is localized inside a ladderane-bounded organelle
  description: The ladderane membrane bounds an anammoxosome lumen enriched for hydrazine
    synthase and HAO-family cytochromes. Nitrite-derived nitric oxide and ammonium
    are converted to hydrazine, hydrazine is oxidized to dinitrogen, and electrons
    recycle through membrane-associated carriers that support energy conservation.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
