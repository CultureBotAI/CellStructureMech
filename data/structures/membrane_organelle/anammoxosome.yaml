- component_id: anammox_electron_transporters
  label: anammoxosome electron-transfer proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Membrane-associated cytochromes and quinone-linked proteins that recycle electrons
    among nitrite reduction, hydrazine synthesis and hydrazine oxidation.
  evidence:
  - reference: DOI:10.1111/1574-6976.12014
    notes: Kartal et al. 2013 review the proposed anammoxosome electron-transport
      loop linking hydrazine oxidation back to nitrite and nitric oxide reduction.
