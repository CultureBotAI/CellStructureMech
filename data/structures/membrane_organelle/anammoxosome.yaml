identifier: GO:0044222
label: anammoxosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A ladderane-lipid-bounded intracytoplasmic organelle of anaerobic ammonium-oxidizing
  Planctomycetota that localizes the hydrazine-producing anammox catabolic pathway
  and its energy-conserving membrane reactions.
