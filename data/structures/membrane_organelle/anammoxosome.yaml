  edges:
  - subject: ladderane_membrane
    predicate: bounds
    object: anammoxosome
    description: Ladderane-rich lipids form the membrane boundary of the anammoxosome.
    evidence:
    - reference: DOI:10.1111/1574-6976.12014
      notes: Kartal et al. 2013 review ladderane lipids as the signature anammoxosome
        membrane lipids.
  - subject: hzs
    predicate: condenses
    object: ammonium
    description: Hydrazine synthase uses ammonium-derived reducing equivalents and
      nitric oxide to produce hydrazine in the anammoxosome.
    evidence:
    - reference: DOI:10.1111/1574-6976.12014
      notes: Kartal et al. 2013 review hydrazine synthase as the enzyme that makes
        hydrazine from nitric oxide and ammonium-derived electrons.
  - subject: hzs
    predicate: reduces
    object: nitric_oxide
    description: Nitric oxide is the nitrite-derived substrate reduced during hydrazine
      synthesis.
    evidence:
    - reference: DOI:10.1111/1574-6976.12014
      notes: Kartal et al. 2013 place nitric oxide between nitrite reduction and hydrazine
        synthesis in the anammox pathway.
  - subject: hzs
    predicate: produces
    object: hydrazine
    description: Hydrazine synthase forms hydrazine as the characteristic toxic intermediate
      of anammox catabolism.
    evidence:
    - reference: DOI:10.1128/JB.00186-15
      notes: Kartal et al. 2015 localized HZS to the anammoxosome where hydrazine
        metabolism is proposed to occur.
  - subject: hdh
    predicate: oxidizes
    object: hydrazine
    description: Hydrazine dehydrogenase-family cytochromes oxidize hydrazine to dinitrogen
      and release electrons.
    evidence:
    - reference: DOI:10.1111/1574-6976.12014
      notes: Kartal et al. 2013 review hydrazine oxidation to dinitrogen by hydrazine
        dehydrogenase in the anammoxosome.
  - subject: hdh
    predicate: feeds electrons to
    object: electron_carriers
    description: Electrons from hydrazine oxidation are proposed to recycle through
      anammoxosome membrane-associated carriers.
    evidence:
    - reference: DOI:10.1111/1574-6976.12014
      notes: Kartal et al. 2013 describe an electron-transport loop that recycles
        electrons from hydrazine oxidation toward nitrite reduction and hydrazine
        synthesis.
  - subject: electron_carriers
    predicate: localize to
    object: anammoxosome
    description: Anammox catabolic enzymes are concentrated in or near the anammoxosome
      rather than distributed throughout the cytoplasm.
    evidence:
    - reference: DOI:10.1128/JB.00186-15
      notes: Kartal et al. 2015 immunolocalized key anammox enzymes in the anammoxosome
        and on tubule-like structures.
