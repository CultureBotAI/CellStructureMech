discussions:
- discussion_id: matrix_contents_not_lumen_components
  prompt: Keep acidocalcisome polyphosphate, bound cations, proton pumps, and cation
    transporters on the whole-organelle or membrane records rather than duplicating
    them as lumen components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#acidocalcisome_lumen_topology
  rationale: GO:0033985 denotes the acidocalcisome compartment bounded by the acidocalcisomal
    membrane; the existing acidocalcisome record models the organelle's polyphosphate
    and cation matrix, and the acidocalcisome membrane record models its proton-pump
    and cation-transporter proteins.
  resolution_note: Curated the lumen boundary and parthood topology without asserting
    separate source-neutral molecular components for the lumen itself.
  evidence:
  - reference: GO:0033985
    notes: GO:0033985 defines the acidocalcisome lumen as the compartment bounded
      by the acidocalcisomal membrane.
  - reference: GO:0020022
    notes: GO:0020022 identifies the containing acidocalcisome organelle.
  - reference: GO:0033102
    notes: GO:0033102 identifies the membrane that bounds the acidocalcisome.
  posed_by: codex
  posed_date: '2026-09-12'
