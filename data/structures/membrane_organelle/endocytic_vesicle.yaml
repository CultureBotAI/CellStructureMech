discussions:
- discussion_id: keep_coats_and_cargo_on_subtype_records
  prompt: Keep clathrin coats, subtype-specific adaptors, and internalized cargo out
    of the generic endocytic vesicle record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#endocytic_vesicle_topology
  rationale: GO:0030139 spans membrane-bounded endocytic carriers independent of a
    specific coat or cargo set, while clathrin coats and clathrin-adaptor machinery
    belong on narrower clathrin-coated endocytic-vesicle records.
  resolution_note: Modeled only the broad membrane/lumen topology of the endocytic
    vesicle and left clathrin coats, adaptors, and cargo to subtype records.
  evidence:
  - reference: GO:0030139
    notes: GO:0030139 identifies the broad endocytic vesicle class.
  - reference: GO:0045334
    notes: GO:0045334 identifies the narrower clathrin-coated endocytic vesicle.
  - reference: GO:0030128
    notes: GO:0030128 identifies the endocytic-vesicle clathrin coat.
