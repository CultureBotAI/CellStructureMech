identifier: GO:7770041
label: periplastidial membrane
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: The lipid bilayer that forms the second outermost membrane of complex
  plastids in organisms that acquired their plastids through secondary endosymbiosis.
  The periplastidial membrane is evolutionarily derived from the plasma membrane of
  the engulfed algal endosymbiont and together with the outer envelope membrane of
  the plastid defines the periplastidial compartment.
