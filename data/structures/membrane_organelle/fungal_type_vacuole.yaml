functions:
- function_id: vacuolar_storage_and_homeostasis
  label: small-molecule storage and ion homeostasis
  description: The fungal-type vacuole stores amino acids, ions, and other small molecules
    while helping maintain cellular homeostasis.
  evidence:
  - reference: GO:0000324
    notes: GO:0000324 defines the fungal vacuole as a storage reservoir for amino
      acids, divalent cations, ions, polyphosphate, and other small molecules.
  - reference: DOI:10.1016/j.bbamcr.2008.08.003
    notes: Li and Kane 2009 review the yeast vacuole as a lysosome-like organelle
      at the intersection of storage and homeostasis.
- function_id: vacuolar_macromolecule_degradation
  label: vacuolar macromolecule degradation
  description: The acidic vacuolar lumen houses hydrolases that degrade cargo delivered
    through endocytic, biosynthetic, and autophagic trafficking routes.
  evidence:
  - reference: GO:0000324
    notes: GO:0000324 defines the fungal-type vacuole as an acidic compartment containing
      acid hydrolases and serving as the primary degradation compartment.
  - reference: DOI:10.1016/j.bbamcr.2008.08.003
    notes: Li and Kane 2009 review yeast vacuole functions at the endpoint of degradative
      membrane-trafficking routes.
