discussions:
- discussion_id: non_organelle_lumen_parentage
  prompt: Avoid organelle-lumen parentage for the plasma membrane-derived thylakoid
    lumen.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0031979 denotes the internal compartment of a plasma membrane-derived
    bacterial thylakoid, while GO:0009579 explicitly scopes thylakoids as membranous
    structures that are not considered organelles.
  resolution_note: Linked the lumen directly to GO:0030075 with part_of rather than
    asserting a GO:0043233 organelle-lumen parent.
  evidence:
  - reference: GO:0031979
    notes: GO:0031979 is the plasma membrane-derived thylakoid lumen term.
  - reference: GO:0009579
    notes: GO:0009579 defines thylakoids as membranous structures and states that
      they are not considered organelles.
  - reference: GO:0030075
    notes: GO:0030075 identifies the plasma membrane-derived bacterial thylakoid that
      contains this lumen.
