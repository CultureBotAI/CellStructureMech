- discussion_id: generic_plastid_not_child_membrane
  prompt: Keep the plastid thylakoid membrane distinct from chloroplast, cyanelle,
    and organellar chromatophore thylakoid membrane children.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0055035 denotes the generic lipid bilayer membrane of any thylakoid
    within a plastid, while GO:0009535, GO:0033115, and GO:0070118 denote lineage-specific
    child membranes.
  resolution_note: Curated GO:0055035 as the plastid-specific parent of the chloroplast,
    cyanelle, and organellar chromatophore thylakoid membrane records.
  evidence:
  - reference: GO:0055035
    notes: GO:0055035 identifies the plastid thylakoid membrane parent.
  - reference: GO:0009535
    notes: GO:0009535 identifies the chloroplast-specific child.
  - reference: GO:0033115
    notes: GO:0033115 identifies the cyanelle-specific child.
  - reference: GO:0070118
    notes: GO:0070118 identifies the organellar chromatophore-specific child.
  posed_by: codex
  posed_date: '2026-09-13'
