  title: PEX import machinery loads glycolytic enzymes into the glycosome
  description: Glycosomal peroxin import machinery docks PTS receptors at the glycosome
    membrane and imports glycolytic enzymes into the matrix, where compartmentation
    keeps glycolytic flux from triggering toxic metabolite accumulation.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
