components:
- component_id: glycosome_membrane
  label: glycosome membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0046860
  essentiality: ESSENTIAL
  role: Peroxisome-related bounding membrane that encloses the glycosomal matrix.
  evidence:
  - reference: DOI:10.1016/0014-5793(77)80476-6
    notes: Opperdoes and Borst 1977 localized Trypanosoma brucei glycolytic enzymes
      to a microbody-like glycosome.
  - reference: DOI:10.1016/j.bbamcr.2015.09.015
    notes: Haanstra et al. 2016 review glycosomes as specialized peroxisomes of trypanosomatid
      parasites.
- component_id: glycolytic_enzymes
  label: glycosomal glycolytic enzymes
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The glycosomal glycolysis component groups several unrelated enzyme
    families by localization and pathway role; no single exact family CURIE denotes
    this full enzyme set.
  role: Matrix enzymes that compartmentalize the major glycolytic steps inside the
    kinetoplastid glycosome.
  evidence:
  - reference: DOI:10.1016/0014-5793(77)80476-6
    notes: Opperdoes and Borst 1977 localized nine glycolytic enzymes to the Trypanosoma
      brucei glycosome.
  - reference: DOI:10.1073/pnas.0806664105
    notes: Haanstra et al. 2008 used PEX14-deficient trypanosomes to test the importance
      of sequestering glycolytic enzymes in glycosomes.
- component_id: peroxin_import_machinery
  label: glycosomal peroxin import machinery
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  gene_symbols:
  - PEX5
  - PEX7
  - PEX14
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Glycosome biogenesis uses several peroxins with distinct families
    and roles; no single exact CURIE was curated for the glycosomal import-machinery
    set.
  role: PTS receptors and membrane-docking factors that import nuclear-encoded matrix
    proteins into the glycosome.
  evidence:
  - reference: DOI:10.1046/j.1432-1033.2003.03582.x
    notes: Choe et al. 2003 characterized Trypanosoma brucei PEX14 and its interaction
      with TbPEX5 during glycosomal matrix-protein import.
  - reference: DOI:10.1016/j.bbamcr.2015.09.015
    notes: Haanstra et al. 2016 review conserved peroxin machinery in trypanosomatid
      glycosome biogenesis and maintenance.
taxonomic_distribution:
- taxon_id: NCBITaxon:5653
  taxon_label: Kinetoplastea
  presence: COMMON
  note: Parent-level proxy for the GO Kinetoplastida order scope; glycosomes are specialized
    peroxisomes of kinetoplastid protists, with biogenesis best reviewed in trypanosomatid
    parasites.
  reference: DOI:10.1016/j.bbamcr.2015.09.015
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: Kinetoplastid parasite in which glycosome glycolytic enzymes, PEX14-mediated
    protein import and the metabolic need for compartmentation have been experimentally
    studied.
  reference: DOI:10.1073/pnas.0806664105
functions:
- function_id: glycolytic_compartmentation
  label: glycolytic enzyme compartmentalization
  description: The glycosome sequesters glycolytic enzymes in a membrane-bounded matrix,
    protecting trypanosomes from toxic accumulation of glycolytic intermediates.
  evidence:
  - reference: DOI:10.1073/pnas.0806664105
    notes: Haanstra et al. 2008 showed that compartmentation of glycolysis prevents
      toxic glucose-6-phosphate accumulation in Trypanosoma brucei.
- function_id: glycosomal_matrix_protein_import
  label: glycosomal matrix protein import
  description: Glycosomal peroxins import nuclear-encoded PTS-containing matrix proteins
    into the glycosome.
  evidence:
  - reference: DOI:10.1046/j.1432-1033.2003.03582.x
    notes: Choe et al. 2003 showed that PEX14 participates in glycosomal matrix-protein
      import in Trypanosoma brucei.
evidence:
- reference: DOI:10.1016/0014-5793(77)80476-6
  notes: 'Opperdoes and Borst 1977, Localization of nine glycolytic enzymes in a microbody-like
    organelle in Trypanosoma brucei: the glycosome, FEBS Letters.'
- reference: DOI:10.1046/j.1432-1033.2003.03582.x
  notes: Choe et al. 2003, Characterization of Trypanosoma brucei PEX14 and its role
    in the import of glycosomal matrix proteins, European Journal of Biochemistry.
- reference: DOI:10.1073/pnas.0806664105
  notes: Haanstra et al. 2008, Compartmentation prevents a lethal turbo-explosion
    of glycolysis in trypanosomes, Proceedings of the National Academy of Sciences.
- reference: DOI:10.1016/j.bbamcr.2015.09.015
  notes: Haanstra et al. 2016, Biogenesis, maintenance and dynamics of glycosomes
    in trypanosomatid parasites, Biochimica et Biophysica Acta - Molecular Cell Research.
- reference: DOI:10.1371/journal.pntd.0005333
  notes: Bauer and Morris 2017, Glycosome biogenesis in trypanosomes and the de novo
    dilemma, PLOS Neglected Tropical Diseases.
