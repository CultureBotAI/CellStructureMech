identifier: GO:0020015
label: glycosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded organelle found in organisms from the order Kinetoplastida
  that houses the enzymes of glycolysis.
