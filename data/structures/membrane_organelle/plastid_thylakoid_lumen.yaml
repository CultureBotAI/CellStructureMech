discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the plastid thylakoid membrane as the boundary of the plastid thylakoid
    lumen rather than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#plastid_thylakoid_lumen_topology
  rationale: GO:0031978 denotes the volume enclosed by a plastid thylakoid membrane,
    whereas GO:0055035 denotes the lipid bilayer membrane that encloses that volume.
  resolution_note: Represented GO:0055035 as the boundary node in the topology graph
    and left the lumen record without constituent components.
  evidence:
  - reference: GO:0031978
    notes: GO:0031978 defines the plastid thylakoid lumen as the volume enclosed by
      a plastid thylakoid membrane.
  - reference: GO:0055035
    notes: GO:0055035 defines the plastid thylakoid membrane as the lipid bilayer
      of a plastid thylakoid.
