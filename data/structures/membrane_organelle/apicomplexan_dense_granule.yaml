components:
- component_id: dense_granule_membrane
  label: apicomplexan dense granule membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0030668
  essentiality: ESSENTIAL
  role: Lipid bilayer that bounds the dense granule and encloses its secretory cargo.
  evidence:
  - reference: DOI:10.1111/jeu.12904
    notes: Griffith et al. 2022 review dense-granule biogenesis, secretion, and function
      in Toxoplasma gondii.
- component_id: dense_granule_proteins
  label: dense granule proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Dense granule proteins include multiple unrelated GRA and exported-effector
    families; no exact source-neutral CURIE for the whole apicomplexan dense-granule
    cargo cohort was curated.
  role: Secretory cargo proteins stored in dense granules and released into the parasitophorous
    vacuole or host cell.
  evidence:
  - reference: DOI:10.1111/jeu.12904
    notes: Griffith et al. 2022 review Toxoplasma dense granule proteins as secretory
      cargo.
  - reference: DOI:10.1016/j.pt.2014.12.002
    notes: Mercier and Cesbron-Delauw 2015 review dense granules within the Toxoplasma
      secretory system.
- component_id: gra17_gra23_permeability_factors
  label: GRA17/GRA23 PVM permeability factors
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GRA17 and GRA23 were kept as a Toxoplasma dense-granule protein
    pair because no cross-source family or complex CURIE was curated for the permeability
    factors.
  role: Toxoplasma dense-granule proteins that localize to the parasitophorous vacuole
    membrane and mediate small-molecule permeability.
  evidence:
  - reference: DOI:10.1016/j.chom.2015.04.003
    notes: Gold et al. 2015 identified GRA17 and GRA23 as dense-granule proteins that
      mediate PVM permeability.
- component_id: exported_dense_granule_effectors
  label: exported dense granule effectors
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The exported GRA effector cohort includes divergent proteins such
    as GRA16; no exact source-neutral CURIE was curated for the class.
  role: Dense-granule proteins exported beyond the parasitophorous vacuole membrane
    to alter host-cell pathways.
  evidence:
  - reference: DOI:10.1016/j.chom.2013.03.002
    notes: Bougdour et al. 2013 identified GRA16 as an exported dense-granule protein
      that reaches the host nucleus.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Apicomplexan dense granules are specialized secretory organelles of microbial
    eukaryotes rather than conserved eukaryotic compartments.
  reference: DOI:10.1016/j.ijpara.2005.03.011
- taxon_id: NCBITaxon:5794
  taxon_label: Apicomplexa
  presence: COMMON
  note: Dense granules are secretory organelles found in apicomplexan parasites and
    defined by granular, electron-dense cargo.
  reference: DOI:10.1016/j.ijpara.2005.03.011
canonical_examples:
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan model in which dense-granule GRA proteins, GRA16 export, and
    GRA17/GRA23-mediated PVM permeability have been experimentally studied.
  reference: DOI:10.1016/j.chom.2015.04.003
functions:
- function_id: dense_granule_protein_secretion
  label: dense granule protein secretion
  description: Dense granules secrete GRA cargo proteins into the parasitophorous
    vacuole after host-cell invasion.
  evidence:
  - reference: PMID:9208224
    notes: Carruthers and Sibley 1997 showed that Toxoplasma dense-granule secretion
      follows microneme and rhoptry secretion during host-cell invasion.
  - reference: DOI:10.1111/jeu.12904
    notes: Griffith et al. 2022 review dense-granule secretion in Toxoplasma gondii.
- function_id: parasitophorous_vacuole_permeability
  label: parasitophorous vacuole membrane permeability
  description: Dense-granule cargo proteins can localize to the PVM and mediate passive
    small-molecule movement between the host cell and parasitophorous vacuole.
  evidence:
  - reference: DOI:10.1016/j.chom.2015.04.003
    notes: Gold et al. 2015 linked the dense-granule proteins GRA17 and GRA23 to PVM
      permeability and nutrient access.
- function_id: host_cell_effector_delivery
  label: host cell effector delivery
  description: Some dense-granule proteins cross the PVM and reach host-cell compartments
    where they modulate host gene expression and signaling.
  evidence:
  - reference: DOI:10.1016/j.chom.2013.03.002
    notes: Bougdour et al. 2013 showed that the exported dense-granule protein GRA16
      reaches the host nucleus and alters host gene expression.
evidence:
- reference: DOI:10.1111/jeu.12904
  notes: Griffith et al. 2022, Dense granule biogenesis, secretion, and function in
    Toxoplasma gondii, Journal of Eukaryotic Microbiology.
- reference: DOI:10.1016/j.pt.2014.12.002
  notes: 'Mercier and Cesbron-Delauw 2015, Toxoplasma secretory granules: one population
    or more?, Trends in Parasitology.'
- reference: DOI:10.1016/j.ijpara.2005.03.011
  notes: 'Mercier et al. 2005, Dense granules: are they key organelles to help understand
    the parasitophorous vacuole of all apicomplexa parasites?, International Journal
    for Parasitology.'
- reference: PMID:9208224
  notes: Carruthers and Sibley 1997, Sequential protein secretion from three distinct
    organelles of Toxoplasma gondii accompanies invasion of human fibroblasts, European
    Journal of Cell Biology.
- reference: DOI:10.1016/j.chom.2015.04.003
  notes: Gold et al. 2015, The Toxoplasma Dense Granule Proteins GRA17 and GRA23 Mediate
    the Movement of Small Molecules between the Host and the Parasitophorous Vacuole,
    Cell Host & Microbe.
- reference: DOI:10.1016/j.chom.2013.03.002
  notes: Bougdour et al. 2013, Host Cell Subversion by Toxoplasma GRA16, an Exported
    Dense Granule Protein that Targets the Host Cell Nucleus and Alters Gene Expression,
    Cell Host & Microbe.
