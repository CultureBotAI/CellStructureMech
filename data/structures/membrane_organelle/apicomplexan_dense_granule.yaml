identifier: GO:0020026
label: apicomplexan dense granule
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: Electron-dense organelle with a granular internal matrix found in a apicomplexan
  parasite; contains proteins destined to be secreted into the parasitophorous vacuole
  following parasite invasion of a host cell.
definition_source: GO:0020026
mapping_status: PROPOSED
