      machinery.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding yeast forms autophagosomes during starvation-induced macroautophagy
    and has been used to define core Atg machinery.
  reference: DOI:10.1083/jcb.119.2.301
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Genetic and fluorescence-microscopy model for the pre-autophagosomal structure
    and autophagosome formation.
  reference: DOI:10.1093/emboj/20.21.5971
functions:
- function_id: macroautophagy
  label: macroautophagy
  description: Autophagosomes engulf cytoplasmic material in a double-membrane vesicle
    and deliver that cargo to a lytic vacuole for degradation.
  evidence:
  - reference: GO:0016236
    notes: GO:0016236 defines macroautophagy as the autophagic process that proceeds
      via autophagosome formation.
  - reference: DOI:10.1083/jcb.119.2.301
    notes: Takeshige et al. 1992 demonstrated starvation-induced autophagy in Saccharomyces
      cerevisiae.
- function_id: autophagosome_vacuole_fusion
  label: autophagosome-vacuole fusion
  description: In yeast, completed autophagosomes fuse with the fungal-type vacuole
    to release autophagic bodies into the degradative lumen.
  evidence:
  - reference: GO:0061909
    notes: GO:0061909 defines autophagosome-lysosome fusion and describes yeast autophagosome
      fusion with the vacuole.
  - reference: DOI:10.1083/jcb.119.2.301
    notes: Takeshige et al. 1992 used proteinase-deficient yeast mutants to accumulate
      autophagic bodies in the vacuole.
