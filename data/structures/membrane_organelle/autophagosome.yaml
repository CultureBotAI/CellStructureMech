causal_graphs:
- graph_id: yeast_autophagosome_vacuole_delivery
  title: Yeast autophagosomes deliver cytosol to the vacuole
  description: The autophagosome membrane encloses a lumen, the vesicle forms as part
    of macroautophagy, and yeast autophagosomes fuse with the fungal-type vacuole
    to deliver cargo for degradation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the organelle boundary and vacuole-delivery endpoint
    without asserting the complete Atg initiation, elongation, closure or fusion machinery.
