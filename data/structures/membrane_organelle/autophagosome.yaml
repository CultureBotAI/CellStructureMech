identifier: GO:0005776
label: autophagosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A double-membrane-bounded compartment that engulfs endogenous cellular
  material as well as invading microorganisms to target them to the lytic vacuole/lysosome
  for degradation as part of macroautophagy.
