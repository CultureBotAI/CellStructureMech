  role: Double lipid-bilayer boundary that encloses the autophagosome lumen and separates
    engulfed cytoplasmic cargo from the cytosol.
  evidence:
  - reference: GO:0000421
    notes: GO:0000421 defines the autophagosome membrane as the lipid bilayer surrounding
      an autophagosome.
