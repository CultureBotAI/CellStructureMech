  label: endoplasmic reticulum to Golgi vesicle-mediated transport
  grounding: GO:0006888
  description: COPII-coated ER-to-Golgi transport vesicles act as anterograde carriers
    that move cargo from the endoplasmic reticulum to the Golgi apparatus.
  evidence:
  - reference: GO:0006888
    notes: GO:0006888 defines ER-to-Golgi vesicle-mediated transport as movement from
      the ER to the Golgi mediated by COPII vesicles.
  - reference: GO:0030134
    notes: GO:0030134 defines COPII-coated ER-to-Golgi transport vesicles as anterograde
      protein carriers from rough ER to Golgi apparatus.
