identifier: GO:0030134
label: COPII-coated ER to Golgi transport vesicle
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A vesicle with a coat formed of the COPII coat complex proteins. The COPII
  coat complex is formed by the Sec23p/Sec24p and the Sec13p/Sec31p heterodimers.
  COPII-associated vesicles transport proteins from the rough endoplasmic reticulum
  to the Golgi apparatus (anterograde transport).
