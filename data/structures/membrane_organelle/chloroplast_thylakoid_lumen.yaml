discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the chloroplast thylakoid membrane as the boundary of the chloroplast
    thylakoid lumen rather than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#chloroplast_thylakoid_lumen_topology
  rationale: GO:0009543 denotes the volume enclosed by a chloroplast thylakoid membrane,
    whereas GO:0009535 denotes the pigmented membrane that encloses that volume.
  resolution_note: Represented GO:0009535 as the boundary node in the topology graph
    and left the lumen record without constituent components.
  evidence:
  - reference: GO:0009543
    notes: GO:0009543 identifies the chloroplast thylakoid lumen.
  - reference: GO:0009535
    notes: GO:0009535 identifies the chloroplast thylakoid membrane.
  - reference: uniprot.location:SL-0058
    notes: UniProt SL-0058 directly identifies the chloroplast thylakoid membrane
      as the boundary term paired with SL-0057.
