functions:
- function_id: magnetosome_lumen_biomineralization
  label: magnetosome lumen biomineralization
  description: The magnetosome lumen is the membrane-enclosed compartment in which
    imported iron is mineralized into a magnetic iron-mineral crystal.
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.99
    notes: Uebe and Schuler 2016 review magnetosome vesicles as the compartments in
      which iron is accumulated and biomineralized as magnetite or greigite.
  - reference: PMID:22007638
    notes: Uebe et al. 2011 linked MamB and MamM to magnetite biomineralization and
      magnetosome membrane assembly in Magnetospirillum gryphiswaldense.
evidence:
- reference: GO:0110145
  notes: Gene Ontology cellular-component term for the magnetosome lumen.
- reference: GO:0043233
  notes: Gene Ontology cellular-component term for organelle lumen, the broader organelle-enclosed
    compartment parent.
- reference: GO:0110143
  notes: Gene Ontology cellular-component term for the containing magnetosome.
- reference: GO:0110146
  notes: Gene Ontology cellular-component term for the magnetosome membrane that encloses
    the lumen.
- reference: uniprot.location:SL-0511
  notes: UniProt Subcellular Location entry SL-0511 maps directly to GO:0110145 and
    places the magnetosome lumen under the magnetosome subcellular location.
- reference: uniprot.location:SL-0512
  notes: UniProt Subcellular Location entry SL-0512 maps the magnetosome membrane
    to GO:0110146.
- reference: DOI:10.1038/nrmicro.2016.99
  notes: Uebe R and Schuler D 2016, Magnetosome biogenesis in magnetotactic bacteria,
    Nature Reviews Microbiology.
- reference: PMID:14766587
  notes: Grunberg et al. 2004, Biochemical and proteomic analysis of the magnetosome
    membrane in Magnetospirillum gryphiswaldense, Applied and Environmental Microbiology.
- reference: PMID:22007638
  notes: Uebe et al. 2011, The cation diffusion facilitator proteins MamB and MamM
    of Magnetospirillum gryphiswaldense have distinct and complex functions, and are
    involved in magnetite biomineralization and magnetosome membrane assembly, Molecular
    Microbiology.
causal_graphs:
