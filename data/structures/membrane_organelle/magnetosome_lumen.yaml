      notes: GO:0110145 identifies the magnetosome lumen cellular component.
    - reference: uniprot.location:SL-0511
      notes: UniProt SL-0511 places the magnetosome lumen under the magnetosome subcellular
        location.
    - reference: GO:0110143
      notes: GO:0110143 identifies the containing magnetosome.
  - subject: magnetosome_membrane
    predicate: encloses
