  description: The magnetosome lumen is the internal magnetosome compartment enclosed
    by the magnetosome membrane.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the defining lumenal boundary without duplicating
    the whole-magnetosome membrane invagination, iron-transport, biomineralization,
    or chain-assembly mechanisms.
