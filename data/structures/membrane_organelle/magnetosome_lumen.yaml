discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the magnetosome membrane as the boundary of the magnetosome lumen rather
    than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#magnetosome_lumen_topology
  rationale: GO:0110145 denotes the magnetosome lumen, whereas GO:0110146 denotes
    the lipid bilayer surrounding a magnetosome.
  resolution_note: Represented GO:0110146 as the boundary node in the topology graph
    and left the lumen record without constituent components.
  evidence:
  - reference: GO:0110145
    notes: GO:0110145 identifies the magnetosome lumen.
  - reference: GO:0110146
    notes: GO:0110146 identifies the membrane that bounds the magnetosome lumen.
  posed_by: codex
  posed_date: '2026-09-13'
