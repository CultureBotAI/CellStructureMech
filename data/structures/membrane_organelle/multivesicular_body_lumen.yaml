discussions:
- discussion_id: lumen_boundary_not_membrane_component
  prompt: Represent the multivesicular body membrane as the boundary of the lumen
    rather than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#multivesicular_body_lumen_topology
  rationale: UniProt SL-0340 denotes the MVB compartment bounded by the multivesicular
    body membrane, whereas GO:0032585 denotes the surrounding lipid bilayer.
  resolution_note: Curated the membrane as a boundary node and left the lumen record
    without constituent molecular components.
  evidence:
  - reference: uniprot.location:SL-0340
    notes: SL-0340 identifies the internal multivesicular body lumen.
  - reference: GO:0032585
    notes: GO:0032585 identifies the multivesicular body membrane rather than the
      lumen it encloses.
  posed_by: codex
  posed_date: '2026-09-15'
