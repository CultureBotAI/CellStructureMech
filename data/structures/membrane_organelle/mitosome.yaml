functions:
- function_id: mitosomal_fe_s_cluster_assembly
  label: mitosomal iron-sulfur cluster assembly
  description: Mitosomes retain imported mitochondrial-type ISC machinery that supports
    iron-sulfur protein maturation.
  evidence:
  - reference: DOI:10.1038/nature01945
    notes: Tovar et al. 2003 showed that Giardia mitosomes function in iron-sulfur
      protein maturation.
  - reference: DOI:10.1038/nature06606
    notes: Goldberg et al. 2008 showed that microsporidian mitosomal ISC proteins
      are functional.
- function_id: mitosomal_protein_import
  label: mitosomal protein import
  description: Nuclear-encoded proteins are imported into the mitosome, which lacks
    its own organellar genome.
  evidence:
  - reference: DOI:10.1073/pnas.0500349102
    notes: Dolezal et al. 2005 compared targeting signals in Giardia mitosomes.
  - reference: DOI:10.1038/nature01945
    notes: Tovar et al. 2003 localized nuclear-encoded ISC machinery to Giardia mitosomes.
