identifier: GO:0032047
label: mitosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A double-membrane-bounded organelle that functions in iron-sulfur protein
  maturation; evolutionarily derived from mitochondria. The mitosome has been detected
  only in anaerobic or microaerophilic organisms that do not have mitochondria, such
  as Entamoeba histolytica, Giardia intestinalis and several species of Microsporidia.
  These organisms are not capable of gaining energy from oxidative phosphorylation,
  which is normally performed by mitochondria.
