components:
- component_id: mitosomal_envelope
  label: mitosomal double-membrane envelope
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO has an exact whole-mitosome term but no exact mitosomal envelope,
    inner membrane, or outer membrane cellular-component terms in the current ontology.
  role: Mitochondrion-derived double membrane that encloses the reduced mitosome matrix.
  evidence:
  - reference: DOI:10.1046/j.1365-2958.1999.01414.x
    notes: Tovar et al. 1999 identified the Entamoeba histolytica mitosome as a mitochondrion-related
      organelle.
  - reference: DOI:10.1038/nature00949
    notes: Williams et al. 2002 identified a mitochondrion remnant in the microsporidian
      Trachipleistophora hominis.
- component_id: mitosomal_isc_machinery
  label: mitosomal iron-sulfur cluster assembly machinery
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The mitosomal ISC module groups multiple imported assembly factors;
    exact source-neutral family CURIEs for the full module were not curated.
  role: Mitochondrial-type factors that assemble iron-sulfur clusters in Giardia and
    microsporidian mitosomes.
  evidence:
  - reference: DOI:10.1038/nature01945
    notes: Tovar et al. 2003 showed that Giardia mitochondrial remnant organelles
      function in iron-sulfur protein maturation.
  - reference: DOI:10.1038/nature06606
    notes: Goldberg et al. 2008 localized functional iron-sulfur cluster assembly
      proteins to microsporidian mitosomes.
- component_id: mitosomal_import_machinery
  label: mitosomal protein-import machinery
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Mitosomal protein import is mitochondrion-related and divergent;
    exact complex- or family-level groundings were deferred.
  role: Machinery that imports nuclear-encoded mitosomal proteins into the reduced
    mitochondrion-related organelle.
  evidence:
  - reference: DOI:10.1073/pnas.0500349102
    notes: Dolezal et al. 2005 found that Giardia mitosomes and trichomonad hydrogenosomes
      share a protein-targeting mode.
  - reference: DOI:10.1038/nature01945
    notes: Tovar et al. 2003 detected Giardia ISC proteins inside mitosomes, implying
      organelle import of nuclear-encoded machinery.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Mitosomes occur patchily in anaerobic or microaerophilic microbial eukaryotes
    that have reduced mitochondria.
  reference: DOI:10.1111/jeu.12922
- taxon_id: NCBITaxon:5741
  taxon_label: Giardia duodenalis
  presence: COMMON
  note: Giardia mitosomes have been used to define Fe-S maturation and protein-targeting
    functions in a reduced mitochondrion-related organelle.
  reference: DOI:10.1038/nature01945
- taxon_id: NCBITaxon:5759
  taxon_label: Entamoeba histolytica
  presence: COMMON
  note: The early mitosome record was defined from Entamoeba histolytica trophozoites.
  reference: DOI:10.1046/j.1365-2958.1999.01414.x
- taxon_id: NCBITaxon:6029
  taxon_label: Microsporidia
  presence: VARIABLE
  note: Microsporidian mitochondrion remnants have been described in Trachipleistophora
    and functionally tested in Encephalitozoon.
  reference: DOI:10.1038/nature06606
canonical_examples:
