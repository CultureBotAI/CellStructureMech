discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Represent the phagocytic vesicle membrane as the boundary of the lumen rather
    than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#phagocytic_vesicle_lumen_topology
  rationale: GO:0097013 denotes the lumenal volume enclosed by the phagocytic vesicle
    membrane, not a stable molecular constituent table. The membrane is therefore
    modeled as a boundary node in the topology graph.
  resolution_note: Curated the membrane as a boundary node and left the lumen record
    without constituent components.
  evidence:
  - reference: GO:0097013
    notes: GO:0097013 identifies the phagocytic vesicle lumen.
  - reference: GO:0030670
    notes: GO:0030670 identifies the membrane that bounds the lumen.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
- discussion_id: keep_variable_cargo_out
  prompt: Keep variable phagocytosed cargo and maturation enzymes out of the generic
    phagocytic vesicle lumen components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#phagocytic_vesicle_lumen_topology
  rationale: The phagocytic vesicle lumen is the bounded volume inside the vesicle.
    The ingested particle and soluble hydrolases depend on phagosome cargo and maturation
    stage, so this generic lumen record does not assert a stable cargo or enzyme component.
  resolution_note: Modeled only the lumenal volume and its acidification during maturation.
  evidence:
  - reference: GO:0045335
    notes: GO:0045335 identifies phagocytic vesicles as formed by ingestion of particulate
      material.
  - reference: PMID:12388753
    notes: Gotthardt et al. 2002 separated Dictyostelium phagosome maturation into
      temporally distinct stages.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
