  gene_symbols:
  - ASI3
  stoichiometry: Constituent RING-domain E3 ubiquitin ligase subunit
  essentiality: DISPENSABLE
  role: Multipass inner nuclear membrane C-terminal RING-domain E3 ubiquitin ligase
    subunit that hetero-oligomerizes with Asi1p to catalyze Ubc6p/Ubc7p-dependent
    substrate polyubiquitination at the inner nuclear membrane.
  evidence:
  - reference: GO:0097658
    notes: GO:0097658 specifies Asi3p together with Asi1p as the ubiquitin ligase
      subunits of the S. cerevisiae Asi complex.
  - reference: PMID:25236469
    notes: Foresti et al. 2014 showed that both Asi1 and Asi3 RING domains are required
      for Asi complex E3 ligase activity.
