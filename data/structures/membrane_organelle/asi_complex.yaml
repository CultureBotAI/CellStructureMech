    - reference: PMID:25236469
      notes: Foresti et al. 2014 established Asi3 as an essential catalytic partner
        of Asi1 in the Asi complex.
- component_id: asi2_recognition_subunit
  label: Protein ASI2
  component_type: PROTEIN
