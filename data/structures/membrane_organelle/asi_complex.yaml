identifier: GO:0097658
label: Asi complex
structure_category: MEMBRANE_ORGANELLE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A nuclear ubiquitin ligase multiprotein complex located in the inner nuclear
  membrane (INM) that recognizes and ubiquitinates misfolded INM proteins and also
  some proteins involved in sterol biosynthesis, during ER-associated protein degradation
  (ERAD). In S. cerevisiae, this complex contains the ubiquitin ligases Asi1p and
  Asi3p.
definition_source: GO:0097658
mapping_status: PROPOSED
parent_structures:
