functions:
- function_id: ubiquitin_dependent_protein_catabolic_process
  label: ubiquitin-dependent protein catabolic process
  grounding: GO:0006511
  description: Recognizes and polyubiquitinates misfolded or mislocalized integral
    membrane proteins and sterol-biosynthesis enzymes at the inner nuclear membrane,
    targeting them for Cdc48p extraction and proteasomal degradation.
  evidence:
  - reference: GO:0097658
    notes: GO:0097658 defines the Asi complex as recognizing and ubiquitinating misfolded
      inner nuclear membrane proteins and sterol-biosynthesis proteins during ER-associated
      protein degradation.
  - reference: PMID:25236469
    notes: Foresti et al. 2014 established that the Asi complex defines an inner nuclear
      membrane quality-control and ubiquitin-dependent degradation pathway.
