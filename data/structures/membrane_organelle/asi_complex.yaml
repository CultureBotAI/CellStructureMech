  grounding: InterPro:IPR063277
  gene_symbols:
  - ASI2
  stoichiometry: Accessory transmembrane substrate-recognition factor
  essentiality: DISPENSABLE
  role: Two-transmembrane inner nuclear membrane recognition factor that associates
    with Asi1p-Asi3p to select subset transmembrane substrates for Asi-mediated ubiquitination.
  evidence:
  - reference: PMID:25236469
    notes: Foresti et al. 2014 showed that Asi2 associates with Asi1-Asi3 and is required
      for recognition of specific transmembrane substrates such as Erg11.
  - reference: PMID:25519137
    notes: Khmelinskii et al. 2014 demonstrated that Asi2 acts as a substrate-specific
      recognition factor within the Asi1-Asi2-Asi3 complex.
