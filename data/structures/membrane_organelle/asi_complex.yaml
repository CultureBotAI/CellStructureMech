components:
- component_id: asi1_e3_ligase_subunit
  label: ERAD-associated E3 ubiquitin-protein ligase ASI1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR013083
  gene_symbols:
  - ASI1
  stoichiometry: Constituent RING-domain E3 ubiquitin ligase subunit
  essentiality: DISPENSABLE
  role: Multipass inner nuclear membrane C-terminal RING-finger E3 ubiquitin ligase
    subunit that partners with Asi3p and Asi2p to polyubiquitinate misfolded or mislocalized
    inner nuclear membrane proteins for proteasomal degradation.
  evidence:
  - reference: GO:0097658
    notes: GO:0097658 defines the S. cerevisiae Asi complex as containing the inner
      nuclear membrane ubiquitin ligases Asi1p and Asi3p.
  - reference: PMID:25236469
    notes: Foresti et al. 2014 (DOI:10.1126/science.1255638) demonstrated that Asi1,
      Asi2, and Asi3 form an inner nuclear membrane E3 ubiquitin ligase complex mediating
      ERAD of inner nuclear membrane and sterol-biosynthesis substrates.
  - reference: PMID:25519137
    notes: Khmelinskii et al. 2014 (DOI:10.1038/nature14096) showed that the Asi1-Asi2-Asi3
      complex ubiquitinates mislocalized proteins at the inner nuclear membrane to
      preserve nuclear envelope identity.
