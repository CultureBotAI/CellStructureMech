components:
- component_id: pfrom1_rhomboid_protease
  label: PfROM1 rhomboid-1 protease
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PfROM1 is curated as the Plasmodium falciparum rhomboid-1 protease
    observed in the mononeme; no exact source-neutral PfROM1 or apicomplexan ROM1-family
    CURIE was verified in this pass.
  gene_symbols:
  - PfROM1
  role: Plasmodium falciparum rhomboid-1 protease that resides in the mononeme before
    merozoite release and redistributes to the merozoite surface with apical and posterior
    enrichment after release.
  evidence:
  - reference: DOI:10.1073/pnas.0709999104
    notes: Singh et al. 2007 identified PfROM1 as a rhomboid protease in the newly
      named mononeme and followed its redistribution after merozoite release.
taxonomic_distribution:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  presence: COMMON
  note: Mononemes are directly evidenced in mature Plasmodium falciparum segmenter-stage
    merozoites; released merozoites are cited only as evidence for PfROM1 redistribution
    after leaving the mononeme.
  reference: DOI:10.1073/pnas.0709999104
canonical_examples:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  note: Human malaria parasite in which HA-tagged PfROM1 revealed a single thread-like
    mononeme running along one side of mature segmenter-stage merozoites close to
    the subpellicular microtubules.
  reference: DOI:10.1073/pnas.0709999104
functions:
- function_id: rom1_compartmentalization
  label: rhomboid-1 compartmentalization
  description: The mononeme stores PfROM1 in a compartment distinct from micronemes,
    rhoptries and dense granules in mature Plasmodium falciparum merozoites, before
    PfROM1 redistributes to the merozoite surface after erythrocyte rupture.
  evidence:
  - reference: DOI:10.1073/pnas.0709999104
    notes: Singh et al. 2007 separated PfROM1 from microneme, rhoptry and dense-granule
      markers and proposed that mononeme sequestration keeps PfROM1 apart from micronemal
      substrates before merozoite release.
evidence:
- reference: GO:0070074
  notes: Gene Ontology cellular-component term for the mononeme.
- reference: GO:0043231
  notes: Gene Ontology places mononemes under intracellular membrane-bounded organelles.
- reference: GO:0020007
  notes: Gene Ontology models mononemes as part of the apical complex.
- reference: DOI:10.1073/pnas.0709999104
  notes: 'Singh et al. 2007, Mononeme: A new secretory organelle in Plasmodium falciparum
    merozoites identified by localization of rhomboid-1 protease, Proceedings of the
    National Academy of Sciences of the United States of America.'
