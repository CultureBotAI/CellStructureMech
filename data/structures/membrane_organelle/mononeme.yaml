discussions:
- discussion_id: resolve_mononeme_components_and_membrane
  prompt: Resolve the mononeme membrane boundary and any conserved cargo or accessory
    proteins beyond PfROM1.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#pfrom1_rhomboid_protease
  - causal_graphs#pfrom1_mononeme_relocalization
  rationale: The first mononeme paper establishes PfROM1 localization in a distinct
    thread-like apical organelle, but this record does not yet curate an exact mononeme
    membrane, lumen, motor, or pan-apicomplexan cargo cohort.
  evidence:
  - reference: DOI:10.1073/pnas.0709999104
    notes: Singh et al. 2007 used PfROM1 to identify the mononeme and excluded colocalization
      with known microneme, rhoptry and dense-granule markers.
  posed_by: codex
  posed_date: '2026-09-22'
- discussion_id: omit_unresolved_microtubule_transport_model
  prompt: Avoid asserting a microtubule-based mononeme transport mechanism until direct
    motor or route evidence is curated.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#pfrom1_mononeme_relocalization
  rationale: Singh et al. noted that the mononeme might move along microtubules and
    that testing this would require exact localization of the mononeme and candidate
    motors. The causal graph therefore records only observed topology and PfROM1 relocalization.
  evidence:
  - reference: DOI:10.1073/pnas.0709999104
    notes: Singh et al. 2007 observed proximity to subpellicular microtubules while
      leaving the transport mechanism unresolved.
  posed_by: codex
  posed_date: '2026-09-22'
  resolved_date: '2026-09-22'
