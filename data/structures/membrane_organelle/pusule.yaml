identifier: cellstructuremech:pusule
label: pusule
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A dinoflagellate membrane organelle connected to a flagellar canal, comprising
  sacs, tubules or collecting chambers with associated diverticula. Its wall includes
  an invaginated plasma membrane apposed to vacuolar membrane; the canal-connected
  lumen is not a sealed intracellular compartment.
definition_source: DOI:10.1007/BF01279820
mapping_status: PROPOSED
