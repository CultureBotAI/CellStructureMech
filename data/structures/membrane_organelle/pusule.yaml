canonical_examples:
- taxon_id: NCBITaxon:271679
  taxon_label: Polykrikos kofoidii
  reference: DOI:10.1038/s41598-018-37065-w
  note: Wild-collected pseudocolonies examined by TEM and FIB-SEM. Figure 2D-E shows
    the collecting duct and associated diverticula; G-H locates the pusule beside
    the nucleus.
- taxon_id: NCBITaxon:2945
  taxon_label: Prorocentrum micans
  reference: DOI:10.1139/b87-098
  note: Armored species in the tracer study; publisher-deposited abstract read via
    Crossref, not the full paper.
- taxon_id: NCBITaxon:2961
  taxon_label: Amphidinium carterae
  reference: DOI:10.1139/b87-098
  note: Unarmored species in the tracer and serial-section TEM study; abstract-only
    access.
evidence:
- reference: DOI:10.1007/BF01279820
  notes: Dodge (1972), Protoplasma. Primary publisher summary read; morphology varies
    between tubular, sac and vesicle-associated forms. Publisher offers only a subscription
    preview; PDF and discovery routes did not yield readable full text. No numerical
    dimensions imported.
- reference: DOI:10.1139/b87-098
  notes: Klut, Bisalputra and Antia (1987), Canadian Journal of Botany. Crossref publisher
    abstract reports horseradish peroxidase, cationized ferritin and lectins entering
    pusules via the flagellar canal in both species. Publisher HTML/PDF routes returned
    403 and title searches yielded citations, not full text. No cytoplasmic delivery
    or nutrient assimilation inferred.
- reference: DOI:10.1038/s41598-018-37065-w
  notes: Gavelis et al. (2019), Scientific Reports. Primary Results, collection Methods
    and Figure 2 read through PMC BioC/JATS; figure visually inspected. Elaborate
    plasma-membrane infoldings are identified as pusules. Collecting-duct and diverticular
    topology is visible without implying a transport mechanism.
- reference: GO:0043227
  notes: Broad membrane-bounded-organelle parent verified in QuickGO; membrane-bounded
    does not assert that the lumen is closed. The record denotes the entire pusular
    apparatus, not the plasma membrane alone.
discussions:
- discussion_id: identity_and_topology_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the pusule distinct from the contractile vacuole and the nuclear net.
  rationale: Similar names or spatial proximity do not establish equivalent structures.
  notes: Minted after a hidden/ignored-inclusive repository search and a zero-hit
    QuickGO pusule search. Canal continuity is explicit. Nuclear membranes, nucleus-to-flagellum
    ribbons and flagellar rootlets in the figure are contextual anatomy, not assigned
    pusule constituents. Species examples do not imply clade-wide prevalence.
  evidence:
  - reference: DOI:10.1038/s41598-018-37065-w
    notes: Figure 2 distinguishes these adjacent structures.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: physiology_and_molecular_machinery
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve physiological transport functions and molecular constituents with
    direct evidence.
  rationale: Tracer entry into a surface-connected lumen is not evidence of transmembrane
    transport.
  notes: Osmoregulation, secretion and collar/flagellum-driven flow remain proposals
    in the accessible sources. No GO transport function, contractile cycle, protein-family
    assignment, assembly essentiality or causal graph is asserted. Full-text experimental
    controls remain to be reviewed.
  evidence:
  - reference: DOI:10.1139/b87-098
    notes: Abstract distinguishes observations from suggested functions.
  posed_by: codex
  posed_date: '2026-10-03'
