discussions:
- discussion_id: boundary_membranes_not_lumen_components
  prompt: Keep the nuclear inner and outer membranes as lumen boundaries rather than
    as nuclear envelope lumen components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#nuclear_envelope_lumen_topology
  rationale: GO:0005641 denotes the region between the inner and outer lipid bilayers
    of the nuclear envelope, whereas GO:0005637 and GO:0005640 denote those bordering
    bilayers.
  resolution_note: Represented the inner and outer nuclear membranes as topology graph
    nodes that delimit the lumen and left the lumen record without constituent components.
  evidence:
  - reference: GO:0005641
    notes: GO:0005641 identifies the nuclear envelope lumen.
  - reference: GO:0005637
    notes: GO:0005637 identifies the nuclear inner membrane.
  - reference: GO:0005640
    notes: GO:0005640 identifies the nuclear outer membrane.
