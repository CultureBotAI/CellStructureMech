- component_id: fungal_chitin_synthases
  label: fungal chitin synthases
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Fungal chitosomes can contain different chitin synthase isoenzymes;
    no single exact source-neutral protein-family CURIE was verified for the whole
    cargo class.
  role: Latent membrane-enzyme cargo that is stored in chitosomes and delivered to
    the fungal cell surface for localized chitin microfibril synthesis.
  evidence:
  - reference: GO:0045009
    notes: GO:0045009 defines chitosomes as fungal membrane-bounded particles containing
