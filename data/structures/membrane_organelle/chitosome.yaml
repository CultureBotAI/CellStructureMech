identifier: GO:0045009
label: chitosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: An intracellular membrane-bounded particle found in fungi and containing
  chitin synthase; it synthesizes chitin microfibrils. Chitin synthase activity exists
  in chitosomes and they are proposed to act as a reservoir for regulated transport
  of chitin synthase enzymes to the division septum.
