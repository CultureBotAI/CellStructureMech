  posed_date: '2026-09-23'
- discussion_id: chitin_product_boundary
  prompt: Keep chitin microfibrils as the synthesis product, not as resident chitosome
    components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#fungal_chitin_synthases
  - causal_graphs#chitosome_chitin_synthase_delivery
  rationale: Chitosomes are vesicular carriers for chitin synthase activity; chitin
    microfibrils are synthesized after that activity is deployed for fungal wall construction.
  resolution_note: Modeled chitin synthases and the chitosome membrane as components,
    and modeled chitin microfibrils only as the chemical output of chitosome-supported
    synthase activity.
  evidence:
  - reference: GO:0045009
    notes: GO:0045009 defines the chitosome by its chitin-synthase cargo and microfibril
      synthesis activity, not by resident chitin polymers.
  - reference: DOI:10.1091/mbc.9.6.1565
    notes: Ziman et al. 1998 focused on chitin synthase traffic from the chitosome
      to the plasma membrane.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
