causal_graphs:
- graph_id: chitosome_chitin_synthase_delivery
  title: Chitosomes store and deliver chitin synthase
  description: A chitosome is a fungal cytoplasmic vesicle that carries latent chitin
    synthase. In Saccharomyces, Chs3p traffics from the chitosome to the plasma membrane,
    where localized synthase activity contributes to chitin microfibril synthesis
    for the fungal cell wall.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the chitosome storage and delivery role without asserting
    complete biogenesis machinery, Chs6p/Chs5p/exomer requirements, or the activation
    state of every fungal chitin synthase isoenzyme.
