functions:
- function_id: chitin_synthase_storage_and_delivery
  label: chitin synthase storage and delivery
  description: Chitosomes act as intracellular membrane-bounded carriers that store
    latent fungal chitin synthase and deliver it to cell-surface sites for localized
    chitin microfibril synthesis.
  evidence:
  - reference: GO:0045009
    notes: GO:0045009 describes chitosomes as proposed reservoirs for regulated chitin-synthase
      transport to the division septum.
  - reference: DOI:10.1091/mbc.9.6.1565
    notes: Ziman et al. 1998 tested Chs6p-dependent anterograde transport of Saccharomyces
      Chs3p from the chitosome to the plasma membrane.
- function_id: fungal_wall_chitin_microfibril_synthesis
  label: fungal wall chitin microfibril synthesis
  description: The chitosome-associated synthase pool supports synthesis of chitin
    microfibrils used in the fungal cell-wall matrix after enzyme delivery to the
    cell surface.
  evidence:
  - reference: DOI:10.1111/j.1567-1364.2006.00158.x
    notes: Bartnicki-Garcia 2006 reviews chitosomes as microvesicular carriers of
      chitin-synthetase activity for fungal wall chitin microfibril construction.
  - reference: DOI:10.1083/jcb.136.1.95
    notes: Santos and Snyder 1997 linked Chs3p localization to polarized chitin synthesis
      sites in Saccharomyces vegetative and mating cells.
