components:
- component_id: ladderane_lipid_bilayer
  label: ladderane lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Dense ladderane-rich lipid bilayer that bounds the anammoxosome and separates
    its hydrazine-producing matrix from the cytoplasm.
  evidence:
  - reference: DOI:10.1111/1574-6976.12014
    notes: Kartal et al. 2013 review the anammoxosome as an intracytoplasmic organelle
      bounded by ladderane lipids.
  - reference: PMID:15098544
    notes: Sinninghe Damste et al. 2002 identified ladderane lipids as membrane lipids
      specific to anammox bacteria.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The anammoxosome record identifies the complete organelle, and
    the source literature identifies ladderane lipids as signature constituents, but
    no exact source-neutral CURIE was curated for the generic ladderane-lipid bilayer
    constituent.
taxonomic_distribution:
- taxon_id: NCBITaxon:203682
  taxon_label: Planctomycetota
  presence: RARE
  note: Anammoxosome membranes are restricted to anaerobic ammonium-oxidizing members
    of the Brocadiales rather than all Planctomycetota.
  reference: DOI:10.1111/1574-6976.12014
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: RARE
  note: The membrane is known from anammox bacteria that build ladderane-bounded anammoxosomes.
  reference: DOI:10.1111/1574-6976.12014
canonical_examples:
- taxon_id: NCBITaxon:174633
  taxon_label: Candidatus Kuenenia stuttgartiensis
  note: Model anammox bacterium used for immunogold localization of anammoxosome enzymes
    and for proteomic analyses of the anammoxosome compartment.
  reference: DOI:10.1128/JB.00186-15
functions:
- function_id: anammoxosome_permeability_barrier
  label: anammoxosome permeability barrier
  description: The anammoxosome membrane forms a ladderane-rich boundary around an
    organelle that confines hydrazine metabolism and supports energy conservation
    across the membrane.
  evidence:
  - reference: DOI:10.1111/1574-6976.12014
    notes: Kartal et al. 2013 review the anammoxosome membrane as the ladderane-rich
      boundary for the anammox energy-conserving compartment.
  - reference: PMID:15098544
    notes: Sinninghe Damste et al. 2002 identified ladderane lipids as unusually dense
      membrane lipids of anammox bacteria.
