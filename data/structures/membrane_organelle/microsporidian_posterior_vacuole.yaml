  edges:
  - subject: posterior_vacuole
    predicate: resides at
    object: posterior_spore_pole
    description: The posterior vacuole lies at the back end of the mature microsporidian
      spore.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1008738
      notes: Jaroenlak et al. 2020 reconstructed the posterior vacuole in Anncaliia
        algerae spores.
  - subject: posterior_vacuole
    predicate: expands during
    object: polar_tube
    description: Posterior vacuole expansion occurs during polar-tube firing and germination.
    evidence:
    - reference: DOI:10.1016/j.fgb.2015.08.007
      notes: Troemel and Becnel 2015 observed an expanding posterior vacuole in the
        final frames of Edhazardia aedis polar-tube firing.
    - reference: DOI:10.14411/fp.2005.014
      notes: Findley et al. 2005 connected the Spraguea lophii posterior vacuole to
        spore hatching.
  - subject: posterior_vacuole
    predicate: pushes
    object: sporoplasm
    description: Expansion of the posterior vacuole is implicated in moving the sporoplasm
      and other spore contents toward the everted polar tube.
    evidence:
    - reference: DOI:10.1016/j.fgb.2015.08.007
      notes: Troemel and Becnel 2015 interpreted late posterior-vacuole expansion
        as pushing spore contents into the everted polar tube.
    - reference: DOI:10.1371/journal.pbio.3002533
      notes: Sharma et al. 2024 imaged the sequence of microsporidian polar-tube firing
        and sporoplasm expulsion in Vairimorpha necatrix.
