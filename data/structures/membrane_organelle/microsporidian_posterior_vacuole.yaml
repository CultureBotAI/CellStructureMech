identifier: cellstructuremech:microsporidian_posterior_vacuole
label: microsporidian posterior vacuole
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A membrane-bounded posterior vesicle in a microsporidian spore that expands
  during germination and is implicated in polar-tube extrusion and sporoplasm expulsion.
definition_source: DOI:10.14411/fp.2005.014
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-13T11:42:29Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-13T11:43:08Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added the label-only posterior vacuole membrane component, Microsporidia
    and Vairimorpha necatrix scope, a polar-tube firing support function, posterior-vacuole
    DOI evidence, a nonmechanistic expansion graph, and a composition-grounding TODO.
  llm_assisted: true
components:
- component_id: posterior_vacuole_membrane
  label: posterior vacuole membrane
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Membrane boundary that encloses the posterior vacuole in mature microsporidian
    spores.
  evidence:
  - reference: DOI:10.14411/fp.2005.014
    notes: Findley et al. 2005 directly studied the Spraguea lophii posterior vacuole
      during spore hatching.
  - reference: DOI:10.1371/journal.ppat.1008738
    notes: Jaroenlak et al. 2020 visualized the Anncaliia algerae posterior vacuole
      by serial block-face scanning electron microscopy and electron tomography.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The posterior vacuole is a microsporidian spore vesicle, but no
    exact source-neutral term for its membrane, lipids or resident proteins was curated
    in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:6029
  taxon_label: Microsporidia
  presence: COMMON
  note: The posterior vacuole is modeled as a microsporidian infectious-spore organelle,
    not as a structure present in every intracellular vegetative stage.
  reference: DOI:10.1007/978-3-030-93306-7_9
canonical_examples:
- taxon_id: NCBITaxon:6039
  taxon_label: Vairimorpha necatrix
  note: Moth-infecting microsporidian whose germinating spores were imaged by cryo-electron
    tomography during polar-tube extension and sporoplasm expulsion.
  reference: DOI:10.1371/journal.pbio.3002533
functions:
- function_id: polar_tube_firing_support
  label: polar tube firing support
  description: During spore germination, posterior vacuole expansion is coupled to
    pressure changes and movement of spore contents toward the everting polar tube.
  evidence:
  - reference: DOI:10.14411/fp.2005.014
    notes: Findley et al. 2005 tested the posterior vacuole's role in Spraguea lophii
      spore hatching.
  - reference: DOI:10.1016/j.fgb.2015.08.007
    notes: Troemel and Becnel 2015 observed posterior vacuole expansion late in Edhazardia
      aedis polar-tube firing.
evidence:
- reference: DOI:10.14411/fp.2005.014
  notes: Findley et al. 2005, Role of the posterior vacuole in Spraguea lophii (Microsporidia)
    spore hatching, Folia Parasitologica.
- reference: DOI:10.1016/j.fgb.2015.08.007
  notes: Troemel and Becnel 2015, Genome analysis and polar tube firing dynamics of
    mosquito-infecting microsporidia, Fungal Genetics and Biology.
- reference: DOI:10.1371/journal.ppat.1008738
  notes: Jaroenlak et al. 2020, 3-Dimensional organization and dynamics of the microsporidian
    polar tube invasion machinery, PLOS Pathogens.
- reference: DOI:10.1007/978-3-030-93306-7_9
  notes: Jaroenlak, Usmani, Ekiert and Bhabha 2022, Mechanics of Microsporidian Polar
    Tube Firing, Experientia Supplementum.
- reference: DOI:10.1371/journal.pbio.3002533
  notes: Sharma et al. 2024, Ultrastructural insights into the microsporidian infection
    apparatus reveal the kinetics and morphological transitions of polar tube and
    cargo during host cell invasion, PLOS Biology.
causal_graphs:
- graph_id: posterior_vacuole_expansion_supports_firing
  title: Posterior vacuole expansion accompanies polar-tube firing
  description: The posterior vacuole sits behind the sporoplasm in mature microsporidian
    spores. During germination it expands as the polar tube fires, a nonmechanistic
    relationship consistent with a role in moving spore contents into the everting
    polar tube.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
