  evidence:
  - reference: GO:0061617
    notes: GO:0061617 defines the MICOS complex as a mitochondrial inner-membrane
      complex involved in maintenance of crista junctions, inner membrane architecture,
      and contact sites to the outer membrane.
  - reference: DOI:10.7554/elife.07739
    notes: Friedman et al. 2015 analyze two budding-yeast MICOS subcomplexes and their
