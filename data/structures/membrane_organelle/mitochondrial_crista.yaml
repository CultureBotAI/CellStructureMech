identifier: GO:0030061
label: mitochondrial crista
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: Any of the inward folds of the mitochondrial inner membrane. Their number,
  extent, and shape differ in mitochondria from different tissues and organisms. They
  appear to be devices for increasing the surface area of the mitochondrial inner
  membrane, where the enzymes of electron transport and oxidative phosphorylation
  are found. Their shape can vary with the respiratory state of the mitochondria.
