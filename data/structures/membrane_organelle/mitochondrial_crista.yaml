      inner-membrane architecture.
- component_id: atp_synthase
  label: proton-transporting ATP synthase complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0045259
  essentiality: UNKNOWN
  role: Resident oxidative-phosphorylation complex whose dimer rows shape highly curved
    crista ridges.
  evidence:
  - reference: GO:0045259
    notes: GO:0045259 defines proton-transporting ATP synthase complexes independently
      of a specific mitochondrial, chloroplast, or bacterial membrane.
  - reference: DOI:10.1073/pnas.1204593109
