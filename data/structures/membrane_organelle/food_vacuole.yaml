components:
- component_id: food_vacuole_membrane
  label: food vacuole membrane
  component_type: LIPID
  component_role: CONSTITUENT
  role: The acidic organelle-bounding membrane that separates the digestive lumen
    from the parasite cytosol and carries digestive-vacuole transporters.
  evidence:
  - reference: DOI:10.1083/jcb.113.5.1033
    notes: Cowman et al. 1991 localized a Plasmodium falciparum P-glycoprotein homologue
      to the digestive vacuole.
  - reference: DOI:10.3390/pathogens13030182
    notes: Wiser 2024 reviewed the digestive vacuole as an acidic lysosome-like organelle
      of malaria parasites.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral lipid or membrane-protein-family identifier
    was assigned for the aggregate food vacuole membrane in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  presence: COMMON
  note: The food vacuole is directly evidenced in Plasmodium falciparum blood-stage
    parasites; no broader Plasmodium or Apicomplexa scope is asserted in this first
    record.
  reference: DOI:10.1002/prca.200700112
canonical_examples:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  note: Human malaria parasite whose food-vacuole fraction has been profiled by proteomics
    and whose digestive-vacuole membrane has long been experimentally localized.
  reference: DOI:10.1002/prca.200700112
functions:
- function_id: hemoglobin_catabolism
  label: hemoglobin catabolism
  description: The acidic food vacuole receives host hemoglobin and houses proteolytic
    digestion of that cargo during Plasmodium intraerythrocytic growth.
  evidence:
  - reference: DOI:10.3390/pathogens13030182
    notes: Wiser 2024 reviewed the malaria digestive vacuole as the acidic lysosome-like
      site of host hemoglobin digestion.
  - reference: DOI:10.1002/prca.200700112
    notes: Lamarque et al. 2008 isolated Plasmodium falciparum food vacuoles for proteomic
      analysis.
- function_id: heme_detoxification
  label: heme detoxification
  description: Heme released by hemoglobin proteolysis is converted into hemozoin
    crystals inside the digestive vacuole.
  evidence:
  - reference: DOI:10.3390/pathogens13030182
    notes: Wiser 2024 reviewed hemozoin formation as the food-vacuole route for detoxifying
      heme released from digested hemoglobin.
evidence:
