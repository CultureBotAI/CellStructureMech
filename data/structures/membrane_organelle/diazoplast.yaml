- component_id: hupl
  label: Uptake hydrogenase large subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - hupL
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Reviewed UniProt HupL entries map to InterPro IPR001501 and IPR050867,
    which cover broader nickel-hydrogenase large-subunit families. No exact uptake-specific
    family asserted.
  role: Hydrogen-recycling enzyme subunit; functional assignment, not a diazoplast-specific
    perturbation result.
  evidence:
