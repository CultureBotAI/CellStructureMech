identifier: cellstructuremech:diazoplast
label: diazoplast
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: An obligate, membrane-bounded nitrogen-fixing compartment of Epithemia
  diatoms containing a reduced, nonphotosynthetic cyanobacterial endosymbiont; a metabolically
  integrated proto-organelle whose genetic integration remains unresolved.
definition_source: DOI:10.1073/pnas.2507237122
mapping_status: PROPOSED
