  - subject: diazoplast
    predicate: performs
    object: fixation
    evidence:
    - reference: DOI:10.1093/ismeco/ycae055
      notes: Figures 2-3; compartment isotope enrichment and culture activity.
    description: The Epithemia clementina diazoplast compartment performs intracellular
      nitrogen fixation.
  - subject: fixation
    predicate: supplies
    object: host_nitrogen
    evidence:
    - reference: DOI:10.1093/ismeco/ycae055
      notes: Figure 2B supports nitrogen transfer; no export species assigned.
    description: Diazoplast nitrogen fixation supplies fixed nitrogen that is incorporated
      into host diatom biomass.
  - subject: photosynthesis
    predicate: produces
    object: host_carbon
    evidence:
    - reference: DOI:10.1093/ismeco/ycae055
      notes: Bicarbonate labeling and bulk IRMS distinguish daytime carbon fixation.
    description: Daytime host photosynthesis fixes inorganic carbon into host organic
      carbon.
  - subject: host_carbon
    predicate: is transferred into
    object: diazoplast
    evidence:
    - reference: DOI:10.1093/ismeco/ycae055
      notes: Figure 2C supports carbon transfer; wash losses limit temporal interpretation.
    description: Host-fixed carbon is transferred into the diazoplast compartment.
  - subject: photosynthesis
    predicate: supports
    object: fixation
    evidence:
    - reference: DOI:10.1093/ismeco/ycae055
      notes: Figure 3D daytime perturbations support physiological coupling.
    description: Daytime host photosynthetic activity physiologically supports diazoplast
      nitrogen fixation.
  - subject: inhibition
    predicate: reduces
    object: fixation
    evidence:
    - reference: DOI:10.1093/ismeco/ycae055
      notes: Results report about 60% reduction, not complete abolition.
    description: Daytime darkness or DCMU inhibition of photosystem II reduces diazoplast
      nitrogen fixation by approximately 60%.
discussions:
- discussion_id: identity_and_organelle_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the diazoplast compartment from nitroplast and a genetically
    integrated organelle.
  rationale: Dedicated intracellular compartments qualify structurally without assuming
    demonstrated genetic integration.
  notes: Minted after ignored-inclusive repository and exact GO searches. Kind denotes
    physical compartment architecture. Diazoplast and UCYN-A nitroplast have independent
    origins; no identity or parthood equivalence. No exact GO diazoplast term found.
  evidence:
  - reference: DOI:10.1073/pnas.2507237122
    notes: Scope and evidence boundary reviewed.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: decline_unvalidated_import_candidates
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not promote enriched host proteins to confirmed diazoplast constituents.
  rationale: Enrichment can reflect contamination.
  notes: Six candidates lack localization validation. TusA was not detected; host
    PFK import was unsupported. Neither candidate proteins nor hypothetical dynamin
    machinery are components here.
  evidence:
  - reference: DOI:10.1073/pnas.2507237122
    notes: Scope and evidence boundary reviewed.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: physiology_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep perturbation, diel and metabolic claims within demonstrated scope.
  rationale: Abstract wording and metabolic models exceed some direct measurements.
  notes: Use partial inhibition from Results. Day/night activity is not genus-wide.
    No universal glycogen absence, identified sugar transporter, or demonstrated respiratory
    oxygen-protection mechanism.
  evidence:
  - reference: DOI:10.1093/ismeco/ycae055
    notes: Scope and evidence boundary reviewed.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: hupl_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve an exact source-neutral uptake-hydrogenase large-subunit family.
  rationale: Broad nickel-hydrogenase families do not isolate the uptake-specific
    component.
  notes: IPR001501 and IPR050867 were read at InterPro; reviewed UniProt HupL cross-references
    confirm their broad coverage, not an exact functional equivalog.
  evidence:
  - reference: DOI:10.1093/ismeco/ycae055
    notes: Scope and evidence boundary reviewed.
  posed_by: codex
  posed_date: '2026-10-03'
  attaches_to:
