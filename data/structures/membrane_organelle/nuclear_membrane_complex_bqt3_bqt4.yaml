  label: Bouquet formation protein 3
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - bqt3
  stoichiometry: Constituent multipass inner-nuclear-membrane receptor subunit
  essentiality: DISPENSABLE
  role: Seven-transmembrane inner nuclear membrane protein that binds the C-terminal
    transmembrane segment of Bqt4 and protects Bqt4 from proteolytic degradation at
    the inner nuclear membrane.
  evidence:
  - reference: GO:1990862
    notes: GO:1990862 defines the fission yeast nuclear membrane complex Bqt3-Bqt4
      as composed of Bqt3 and Bqt4.
  - reference: PMID:19948484
    notes: Chikashige et al. 2009 (DOI:10.1083/jcb.200902122) demonstrated that Bqt3
      is an inner nuclear membrane protein that directly binds and stabilizes Bqt4
      against degradation.
