identifier: GO:1990862
label: nuclear membrane complex Bqt3-Bqt4
structure_category: MEMBRANE_ORGANELLE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that resides in the inner nuclear membrane and anchors
  telomeres to the nuclear envelope. In fission yeast, it is composed of Bqt3 and
  Bqt4.
definition_source: GO:1990862
mapping_status: PROPOSED
parent_structures:
