functions:
- function_id: meiotic_telomere_nuclear_envelope_attachment
  label: meiotic attachment of telomere to nuclear envelope
  grounding: GO:0070197
  description: Resides in the inner nuclear membrane where Bqt3 stabilizes Bqt4 and
    Bqt4 binds the telomeric protein Rap1 to anchor telomeres to the nuclear envelope,
    enabling Bqt1-Bqt2-mediated telomere clustering and chromosomal bouquet formation
    during meiotic prophase.
  evidence:
  - reference: GO:1990862
    notes: GO:1990862 carries a capable_of_part_of (RO:0002216) axiom to GO:0070197
      (meiotic attachment of telomere to nuclear envelope).
  - reference: PMID:19948484
    notes: Chikashige et al. 2009 demonstrated that Bqt3 and Bqt4 anchor telomeres
      to the inner nuclear envelope to ensure meiotic chromosomal bouquet formation.
