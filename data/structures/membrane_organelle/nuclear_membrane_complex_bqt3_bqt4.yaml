- component_id: bqt4_subunit
  label: Bouquet formation protein 4
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR037548
  gene_symbols:
  - bqt4
  stoichiometry: Constituent inner-nuclear-membrane telomere-tethering subunit
  essentiality: DISPENSABLE
  role: Inner nuclear membrane protein anchored by a C-terminal transmembrane segment
    and stabilized by Bqt3; binds the telomeric shelterin component Rap1 during vegetative
    growth and recruits the meiotic Bqt1-Bqt2 bridge to cluster telomeres at the spindle
    pole body during meiotic prophase.
  evidence:
  - reference: GO:1990862
    notes: GO:1990862 defines Bqt4 as one of the two subunits of the inner nuclear
      membrane complex Bqt3-Bqt4.
  - reference: PMID:19948484
    notes: Chikashige et al. 2009 showed that Bqt4 directly binds Rap1 to tether telomeres
      to the nuclear envelope in vegetative cells, a prerequisite for meiotic bouquet
      formation.
