discussions:
- discussion_id: exclude_thylakoid_membrane_from_generic_envelope_membrane
  prompt: Exclude GO:0033115 cyanelle thylakoid membrane from the GO:0033113 cyanelle
    membrane scope even though UniProt SL-0083 can be used as a fallback thylakoid
    localization.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#cyanelle_membrane_scope
  rationale: GO:0033113 is defined as either envelope lipid bilayer that surrounds
    a cyanelle, whereas GO:0033115 identifies the separate internal thylakoid membrane.
  resolution_note: Curated GO:0033113 as the generic parent of only the inner and
    outer cyanelle envelope membranes and kept GO:0033115 as a distinct thylakoid-membrane
    term.
  evidence:
  - reference: GO:0033113
    notes: GO:0033113 defines the generic cyanelle membrane as either lipid bilayer
      that forms the cyanelle envelope.
  - reference: GO:0033115
    notes: GO:0033115 defines the cyanelle thylakoid membrane as the lipid bilayer
      of a cyanelle thylakoid, not as one of the envelope bilayers.
  - reference: uniprot.location:SL-0083
    notes: UniProt SL-0083 says the generic cyanelle membrane localization can also
      be used when thylakoid placement is not resolved.
  posed_by: codex
  posed_date: '2026-09-12'
