components:
- component_id: apicoplast_lipid_bilayers
  label: apicoplast lipid bilayers
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Generic lipid bilayers that form the multi-membrane apicoplast envelope and
    separate the plastid from the surrounding parasite cytoplasm.
  evidence:
  - reference: GO:0160211
    notes: GO:0160211 defines the apicoplast membrane as any of the lipid bilayers
      that surround an apicoplast and form the apicoplast envelope.
  - reference: DOI:10.1186/1475-2875-12-25
    notes: Lemgruber et al. 2013 used cryo-electron tomography to resolve four membranes
      around the Plasmodium falciparum apicoplast.
  - reference: DOI:10.1098/rstb.2009.0273
    notes: Lim et al. 2010 review the four-membrane apicoplast envelope and protein
      targeting across it.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0160211 identifies the whole apicoplast membrane set, but no
    exact source-neutral CURIE was curated for the generic lipid matrix of those bilayers.
taxonomic_distribution:
- taxon_id: NCBITaxon:5794
  taxon_label: Apicomplexa
  presence: VARIABLE
  note: Apicoplast membranes form the multi-bilayer envelope of apicoplasts, which
    are present in many apicomplexan parasites and absent from some lineages.
  reference: DOI:10.1016/j.ijpara.2016.08.005
canonical_examples:
- taxon_id: NCBITaxon:5833
  taxon_label: Plasmodium falciparum
  note: Human malaria parasite in which cryo-electron tomography resolved the apicoplast
    as an organelle bounded by four membranes.
  reference: DOI:10.1186/1475-2875-12-25
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan model used to show that Tic20 acts at the apicoplast inner membrane
    and is required for protein import into the plastid.
  reference: DOI:10.1073/pnas.0803862105
functions:
- function_id: apicoplast_protein_import_boundary
  label: apicoplast protein import boundary
  description: Apicoplast membranes host translocons that support import of nuclear-encoded
    proteins across the surrounding envelope.
  evidence:
  - reference: DOI:10.1098/rstb.2009.0273
    notes: Lim et al. 2010 review bipartite targeting signals and import across the
      four apicoplast membranes.
  - reference: DOI:10.1371/journal.ppat.1003426
    notes: Agrawal et al. 2013 identified an apicoplast-localized ubiquitylation system
      required for import of nuclear-encoded plastid proteins.
  - reference: DOI:10.1073/pnas.0803862105
    notes: van Dooren et al. 2008 localized TgTic20 to the apicoplast and showed that
      TgTic20 disruption blocks apicoplast protein import.
