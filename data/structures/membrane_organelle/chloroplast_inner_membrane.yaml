  role: Stroma-facing lipid bilayer that separates the chloroplast stroma from the
    intermembrane space.
  evidence:
  - reference: GO:0009706
    notes: GO:0009706 defines the chloroplast inner membrane as the inner lipid bilayer
      of the chloroplast envelope that also faces the chloroplast stroma.
