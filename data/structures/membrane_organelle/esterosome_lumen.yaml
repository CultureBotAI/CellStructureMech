discussions:
- discussion_id: boundary_membrane_not_lumen_component
  prompt: Keep the esterosome membrane as the boundary of the esterosome lumen rather
    than as a lumen component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#esterosome_lumen_topology
  rationale: GO:0034467 denotes the volume enclosed by the esterosome membrane, whereas
    GO:0033118 denotes the membrane surrounding an esterosome.
  resolution_note: Represented GO:0033118 as the boundary node in the topology graph
    and left the lumen record without constituent components.
  evidence:
  - reference: GO:0034467
    notes: GO:0034467 identifies the esterosome lumen.
  - reference: GO:0033118
