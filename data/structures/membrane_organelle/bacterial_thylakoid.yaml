discussions:
- discussion_id: whole_thylakoid_not_thylakoid_membrane
  prompt: Keep bacterial thylakoids separate from the generic thylakoid membrane record.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0030075 denotes the whole plasma membrane-derived bacterial thylakoid,
    with GO:0031676 and GO:0031979 as membrane and lumen parts. The existing GO:0042651
    record denotes only the generic pigmented membrane of cyanobacterial and plastid
    thylakoids.
  resolution_note: Curated the bacterial thylakoid as a whole-compartment record and
    left plastid and cross-domain membrane chemistry on chloroplast and thylakoid-membrane
    records.
  evidence:
  - reference: GO:0030075
    notes: GO:0030075 denotes the whole bacterial thylakoid.
  - reference: GO:0042651
    notes: GO:0042651 denotes the pigmented membrane of any thylakoid.
- discussion_id: thylakoid_not_organelle_kind
  prompt: Represent bacterial thylakoid as a membrane-bounded cellular structure without
    calling it an organelle.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0009579 describes thylakoids as membranous cellular structures and
    explicitly comments that they are not considered organelles. StructureKindEnum
    does not currently include a non-organelle membrane-bounded-compartment value,
    so OTHER is narrower than asserting MEMBRANE_BOUNDED_ORGANELLE.
  resolution_note: Kept the filesystem category under MEMBRANE_ORGANELLE with other
    lipid-bounded internal compartments, but set structure_kind to OTHER.
  evidence:
  - reference: GO:0009579
    notes: GO:0009579 defines thylakoid and scopes thylakoids away from the organelle
      class.
