identifier: GO:0030075
label: bacterial thylakoid
structure_category: MEMBRANE_ORGANELLE
structure_kind: OTHER
definition: A thylakoid that is derived from and attached to, but not necessarily
  continuous with, the plasma membrane, and is not enclosed in a plastid. It bears
  the photosynthetic pigments in photosynthetic cyanobacteria.
