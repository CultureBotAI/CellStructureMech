components:
- component_id: plasma_membrane_derived_thylakoid_membrane
  label: plasma membrane-derived thylakoid membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0031676
  essentiality: ESSENTIAL
  role: Pigmented cyanobacterial thylakoid membrane derived from the plasma membrane
    and embedded with the photosystems and other photosynthetic electron-transport
    complexes.
  evidence:
  - reference: GO:0031676
    notes: GO:0031676 defines the plasma membrane-derived thylakoid membrane as the
      pigmented membrane of a bacterial thylakoid.
  - reference: DOI:10.1016/j.molp.2017.09.019
    notes: Casella et al. 2017 mapped photosystem I and photosystem II organization
      within native Synechocystis thylakoid membranes.
- component_id: plasma_membrane_derived_photosystem_ii
  label: plasma membrane-derived thylakoid photosystem II
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0030096
  essentiality: UNKNOWN
  role: P680 reaction-center complex in the bacterial thylakoid that oxidizes water
    and reduces plastoquinone during oxygenic photosynthesis.
  evidence:
  - reference: GO:0030096
    notes: GO:0030096 defines the plasma membrane-derived thylakoid photosystem II
      complex.
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review PSII as a major cyanobacterial thylakoid
      electron-transport complex.
- component_id: cytochrome_b6f
  label: cytochrome b6f complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0009512
  essentiality: UNKNOWN
  role: Thylakoid membrane complex that links plastoquinol oxidation to proton translocation
    across the bacterial thylakoid membrane.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 place cytochrome b6f between PSII and PSI in
      the thylakoid electron-transport chain.
- component_id: plasma_membrane_derived_photosystem_i
  label: plasma membrane-derived photosystem I
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0030094
  essentiality: UNKNOWN
  role: Light-dependent oxidoreductase in the bacterial thylakoid that receives electrons
    downstream of cytochrome b6f and transfers them toward ferredoxin.
  evidence:
  - reference: GO:0030094
    notes: GO:0030094 defines plasma membrane-derived photosystem I as a complex located
      in the bacterial thylakoid.
  - reference: DOI:10.1016/j.molp.2017.09.019
    notes: Casella et al. 2017 mapped PSI distribution and mobility in native Synechocystis
      thylakoid membranes.
- component_id: atp_synthase
  label: proton-transporting ATP synthase complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0045259
  essentiality: UNKNOWN
  role: Membrane enzyme that uses the trans-thylakoid proton motive force to synthesize
    ATP on the cytoplasmic side of the bacterial thylakoid membrane.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 include ATP synthase among thylakoid complexes
      that convert light energy into ATP and reducing power.
taxonomic_distribution:
- taxon_id: NCBITaxon:1117
  taxon_label: Cyanobacteriota
  presence: COMMON
  note: Bacterial thylakoids occur in most cyanobacteria, while Gloeobacter-like lineages
    perform oxygenic photosynthesis at the plasma membrane and lack internal thylakoids.
  reference: DOI:10.1146/annurev-cellbio-120823-022747
canonical_examples:
- taxon_id: NCBITaxon:1148
  taxon_label: Synechocystis sp. PCC 6803
  note: Cyanobacterial model used to probe de novo thylakoid membrane biogenesis and
    dynamics.
  reference: DOI:10.1038/s41467-021-23680-1
functions:
- function_id: photosynthetic_electron_transport
  label: photosynthetic electron transport chain
  grounding: GO:0009767
  description: Bacterial thylakoids organize PSII, cytochrome b6f and PSI so light-driven
    electron transport can move electrons from water toward ferredoxin while contributing
    to a trans-thylakoid proton gradient.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 review thylakoid electron transport as the membrane
      process that converts light into chemical energy.
- function_id: photosynthetic_atp_synthesis
  label: photosynthetic ATP synthesis
  description: The plasma membrane-derived thylakoid membrane separates the bacterial
    thylakoid lumen from the cytoplasm so proton accumulation can drive ATP synthase.
  evidence:
  - reference: DOI:10.1146/annurev-cellbio-120823-022747
    notes: Perez-Boerema et al. 2024 describe proton motive force generation across
      thylakoid membranes and ATP synthase use of that gradient.
