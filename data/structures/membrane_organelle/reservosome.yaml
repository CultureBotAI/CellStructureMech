identifier: cellstructuremech:reservosome
label: reservosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: A posterior, membrane-bounded endocytic organelle in Trypanosoma cruzi
  epimastigotes that receives internalized macromolecular cargo.
definition_source: DOI:10.1017/S0031182004005797
mapping_status: PROPOSED
