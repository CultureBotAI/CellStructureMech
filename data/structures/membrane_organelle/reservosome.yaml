    evidence:
    - reference: DOI:10.1078/0171-9335-00112
      notes: Porto-Carreiro et al. 2000 placed reservosomes at the storage end of
        the T. cruzi epimastigote endocytic pathway.
  - subject: cruzipain
    predicate: localizes to
