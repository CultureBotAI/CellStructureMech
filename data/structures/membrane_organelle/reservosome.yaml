identifier: cellstructuremech:reservosome
label: reservosome
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: An acidic, membrane-bounded endocytic organelle in Trypanosoma cruzi epimastigotes
  that stores endocytosed macromolecules and lipids and concentrates lysosomal hydrolases
  including cruzipain.
definition_source: DOI:10.1590/S0074-02761999000700015
mapping_status: PROPOSED
