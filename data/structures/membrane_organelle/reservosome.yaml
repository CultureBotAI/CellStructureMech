components:
- component_id: reservosome_membrane
  label: reservosome membrane
  component_type: LIPID
  component_role: CONSTITUENT
  role: Membrane boundary of the posterior acidic compartment that separates reservosome
    contents from the T. cruzi cytosol.
  evidence:
  - reference: DOI:10.1017/S0031182004005797
    notes: Figueiredo et al. 2004 described reservosomes as large membrane-bound organelles
      in T. cruzi epimastigotes.
- component_id: endocytosed_cargo
  label: endocytosed protein and lipid cargo
  component_type: OTHER
  component_role: CONSTITUENT
  role: Proteins and lipids internalized through the endocytic pathway and stored
    inside reservosomes.
  evidence:
  - reference: DOI:10.1078/0171-9335-00112
    notes: Porto-Carreiro et al. 2000 traced endocytic cargo entering the cytostome
      and reaching reservosomes.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The cargo pool is operationally defined by endocytic accumulation
    in reservosomes rather than by one exact molecular family.
- component_id: cruzipain
  label: cruzipain
  component_type: PROTEIN
  component_role: CONSTITUENT
  role: Major lysosomal cysteine proteinase concentrated in the reservosome lumen.
  evidence:
  - reference: DOI:10.1002/pmic.200800730
    notes: Sant'Anna et al. 2009 identified hydrolases, including cruzipain, in the
      reservosome proteome.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: T. cruzi carries multiple related cysteine-proteinase isoforms;
    this first record does not pin a single exact UniProt or MEROPS accession for
    the reservosome-localized cruzipain pool.
taxonomic_distribution:
- taxon_id: NCBITaxon:5693
  taxon_label: Trypanosoma cruzi
  presence: VARIABLE
  note: Reservosomes are posterior membrane-bounded organelles detected in T. cruzi
    epimastigotes and absent from amastigotes and trypomastigotes.
  reference: DOI:10.1017/S0031182004005797
canonical_examples:
- taxon_id: NCBITaxon:5693
  taxon_label: Trypanosoma cruzi
  note: Kinetoplastid parasite whose free-swimming epimastigotes carry posterior,
    transferrin-labelled reservosomes.
  reference: DOI:10.1017/S0031182004005797
functions:
- function_id: endocytic_cargo_storage
  label: endocytic cargo storage
  description: Reservosomes store proteins and lipids delivered by the T. cruzi epimastigote
    endocytic pathway.
  evidence:
  - reference: DOI:10.1078/0171-9335-00112
    notes: Porto-Carreiro et al. 2000 showed that endocytic cargo passes from the
      cytostome through an early endosomal network before storage in reservosomes.
  - reference: DOI:10.1017/S0031182004005797
    notes: Figueiredo et al. 2004 reviewed reservosomes as endocytic compartments
      in T. cruzi epimastigotes.
- function_id: hydrolase_associated_proteolysis
  label: reservosome hydrolase-associated proteolysis
  description: Reservosomes concentrate lysosomal hydrolases, including cruzipain,
    in a proteome associated with protein degradation and regulation.
  evidence:
  - reference: DOI:10.1002/pmic.200800730
    notes: Sant'Anna et al. 2009 identified cruzipain and other lysosomal hydrolases
      in purified reservosomes and discussed reservosomes as a major protein degradation
      and regulation site.
evidence:
- reference: DOI:10.1078/0171-9335-00112
  notes: 'Porto-Carreiro et al. 2000, Trypanosoma cruzi epimastigote endocytic pathway:
    cargo enters the cytostome and passes through an early endosomal network before
    storage in reservosomes, European Journal of Cell Biology.'
- reference: DOI:10.1017/S0031182004005797
  notes: 'Figueiredo et al. 2004, Reservosome: an endocytic compartment in epimastigote
    forms of the protozoan Trypanosoma cruzi, Parasitology.'
- reference: DOI:10.1002/pmic.200800730
  notes: Sant'Anna et al. 2009, Subcellular proteomics of Trypanosoma cruzi reservosomes,
    Proteomics.
