identifier: GO:0036186
label: early phagosome membrane
structure_category: MEMBRANE_ORGANELLE
structure_kind: MEMBRANE
definition: The lipid bilayer surrounding an early phagosome. In phagotrophic protists,
  amoebae (Dictyostelium discoideum, Entamoeba histolytica), and ciliates, the early
  phagosome membrane derives from the invaginated plasma membrane and is transiently
  enriched in phosphatidylinositol 3-phosphate (PI3P) and active Rab5 GTPase, recruiting
  early endosomal tethering complexes before maturing into a late phagosome membrane.
