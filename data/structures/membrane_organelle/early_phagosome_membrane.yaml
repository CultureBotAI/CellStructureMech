functions:
- function_id: phagosome_maturation
  label: phagosome maturation
  grounding: GO:0090382
  description: The phagocytic vesicle membrane is progressively remodeled as newly
    formed phagosomes mature toward late digestive compartments. Mediated by early
    phagosome membrane (GO:0036186) across the Rab5-positive lipid bilayer of the
    early phagosome membrane.
  evidence:
  - reference: GO:0090382
    notes: GO:0090382 defines phagosome maturation as cellular rearrangement of phagosome
      constituent parts after early phagosome formation.
  - reference: PMID:12388753
    notes: Gotthardt et al. 2002 dissected Dictyostelium phagosome maturation into
      temporally distinct membrane-trafficking phases.
