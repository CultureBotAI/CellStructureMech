discussions:
- discussion_id: stromal_contents_not_components
  prompt: Keep DNA, ribosomes, and temporary photosynthetic products out of the curated
    cyanelle stroma component list.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  rationale: UniProt SL-0350 describes DNA, ribosomes, and temporary photosynthesis
    products as contents of the matrix-filled stroma, not as generic source-neutral
    constituents that define the stroma compartment itself.
  resolution_note: Curated the stroma topology and left stromal contents for future
    exact DNA, ribosome, or soluble-complex records.
  evidence:
  - reference: uniprot.location:SL-0350
    notes: UniProt SL-0350 describes the cyanelle stroma as the matrix-filled internal
      cyanelle space that contains DNA, ribosomes, and some temporary photosynthesis
      products.
