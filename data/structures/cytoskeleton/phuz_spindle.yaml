identifier: cellstructuremech:phuz_spindle
label: PhuZ spindle
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A phage-encoded tubulin-like cytoskeletal spindle assembled from PhuZ
  polymers that positions the jumbo-phage nucleus in infected bacterial cells.
definition_source: DOI:10.1016/j.celrep.2017.07.064
mapping_status: PROPOSED
