discussions:
- discussion_id: resolve_phuz_family_grounding
  prompt: Resolve exact source-neutral grounding for phage PhuZ tubulins that build
    nucleus-associated cytoskeletal systems.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#phuz
  rationale: This first record curates PhuZ proteins as phage-encoded tubulins that
    form nucleus-positioning spindles or nucleus-rotating vortex arrays without asserting
    that a broad FtsZ/tubulin-family domain or a virus-specific accession exactly
    denotes the full functional PhuZ family.
  evidence:
  - reference: DOI:10.7554/eLife.03197
    notes: Erb et al. 2014 characterized 201phi2-1 PhuZ as a filament-forming phage
      tubulin.
  posed_by: codex
  posed_date: '2026-09-11'
- discussion_id: exclude_chimallin_from_phuz_spindle
  prompt: Chimallin and the phage nucleus are graph-scoped cargo rather than PhuZ
    spindle constituents.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#phuz
  - causal_graphs#phuz_spindle_positioning
  rationale: PhuZ forms the cytoskeletal spindle that positions the chimallin-lined
    phage nucleus; chimallin builds the separate shell and is not asserted as a constituent
    of the PhuZ polymer.
  evidence:
  - reference: DOI:10.1126/science.aal2130
    notes: Chaikeeratisak et al. 2017 identified 201phi2-1 gp105 as the phage nucleus
      shell protein.
  - reference: DOI:10.1016/j.celrep.2017.07.064
    notes: Chaikeeratisak et al. 2017 modeled the PhuZ spindle as a cytoskeletal system
      that acts on phage nucleus-like compartments.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
- discussion_id: phuz_spindle_excludes_goslar_vortex
  prompt: Keep the bipolar spindle distinct from the Goslar PhuZ cytoskeletal vortex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - definition
  - components#phuz
  - functions#phage_nucleus_rotation
  - causal_graphs#phuz_spindle_positioning
  rationale: 'Earlier review issues #481 and #482 added Goslar occurrence and broadened
    PhuZ component wording to match the then-curated vortex rotation function. Birkholz
    et al. 2022 explicitly distinguish the Goslar vortex from a bipolar spindle and
    report that it does not center the nucleus at midcell. The existing record identifier,
    definition and positioning graph denote the spindle, not every PhuZ array.'
  resolution_note: Retain the spindle identity and supported Pseudomonas positioning
    graph. Remove Goslar as a spindle example and keep its evidence here as a contrast.
    Rotation remains a spindle function with direct 201phi2-1 evidence from Chaikeeratisak
    et al. 2017, rather than borrowing the Goslar vortex mechanism. Original discussions
    and history remain unchanged as provenance; this clarification narrows their earlier
    broad family rationale. A separate vortex record is outside this correction.
  evidence:
  - reference: DOI:10.1016/j.celrep.2022.111179
    notes: Results and Figures 2-5 distinguish the vortex from a bipolar spindle and
      separate rotation from midcell positioning.
  - reference: DOI:10.1126/science.aal2130
    notes: Figure 1 and time-lapse experiments connect the bipolar spindle with both
      nucleus positioning and rotation.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
