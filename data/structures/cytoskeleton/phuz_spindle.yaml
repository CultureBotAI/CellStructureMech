components:
- component_id: phuz
  label: PhuZ
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - phuZ
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for spindle-forming phage PhuZ tubulins
    was verified in this pass; a broad tubulin/FtsZ domain or a phage-specific accession
    is not an exact family grounding.
  role: Phage-encoded tubulin-like protein that polymerizes into dynamic filaments
    of bipolar spindles that position and can rotate jumbo-phage nuclei in infected
    Pseudomonas cells.
  evidence:
  - reference: DOI:10.7554/eLife.03197
    notes: Erb et al. 2014 characterized Pseudomonas phage 201phi2-1 PhuZ as a dynamically
      unstable bacteriophage tubulin that forms filaments to position phage DNA during
      infection.
  - reference: DOI:10.1016/j.celrep.2017.07.064
    notes: Chaikeeratisak et al. 2017 showed that dynamic PhuZ polymers form bipolar
      spindles associated with nucleus-like compartments in large Pseudomonas phages.
taxonomic_distribution:
- taxon_id: NCBITaxon:198110
  taxon_label: Pseudomonas phage 201phi2-1
  presence: COMMON
  note: Pseudomonas phage 201phi2-1 uses PhuZ polymers to center replicating phage
    DNA during infection of Pseudomonas chlororaphis.
  reference: DOI:10.7554/eLife.03197
canonical_examples:
- taxon_id: NCBITaxon:198110
  taxon_label: Pseudomonas phage 201phi2-1
  note: Jumbo phage whose dynamically unstable PhuZ filaments established the phage-encoded
    tubulin spindle as a nucleus-positioning system.
  reference: DOI:10.7554/eLife.03197
functions:
- function_id: phage_nucleus_positioning
  label: phage nucleus positioning
  description: The PhuZ spindle pushes nucleus-like jumbo-phage replication compartments
    away from bacterial cell poles and toward midcell.
  evidence:
  - reference: DOI:10.7554/eLife.03197
    notes: Erb et al. 2014 linked PhuZ dynamic instability to centering phage DNA
      in Pseudomonas chlororaphis cells infected by 201phi2-1.
  - reference: DOI:10.1016/j.celrep.2017.07.064
    notes: Chaikeeratisak et al. 2017 connected dynamic PhuZ spindles with nucleus-like
      compartment positioning in PhiKZ and PhiPA3 infections.
- function_id: phage_nucleus_rotation
  label: phage nucleus rotation
  description: The bipolar PhuZ spindle can rotate the phage nucleus during Pseudomonas
    phage 201phi2-1 infection, as opposing filaments act on opposite sides of the
    nucleus.
  evidence:
  - reference: DOI:10.1126/science.aal2130
    notes: Chaikeeratisak et al. 2017 Figure 1 and time-lapse experiments show nucleus
      movement and rotation with dynamic PhuZ; the static D190A mutant strongly disrupts
      both.
evidence:
- reference: DOI:10.7554/eLife.03197
  notes: Erb, Kraemer, Coker, Chaikeeratisak, Nonejuie, Agard and Pogliano 2014, 'A
    bacteriophage tubulin harnesses dynamic instability to center DNA in infected
    cells', eLife.
- reference: DOI:10.1016/j.celrep.2017.07.064
  notes: Chaikeeratisak et al. 2017, 'The Phage Nucleus and Tubulin Spindle Are Conserved
    among Large Pseudomonas Phages', Cell Reports.
- reference: DOI:10.1016/j.celrep.2022.111179
  notes: 'Birkholz et al. 2022, A cytoskeletal vortex drives phage nucleus rotation
    during jumbo phage replication in E. coli, Cell Reports. Contrasting boundary
    evidence: Goslar forms a vortex rather than the bipolar spindle curated here.'
- reference: GO:0005856
  notes: The containing cytoskeletal framework; this filament system is part of it,
    not a type of the whole framework.
- reference: DOI:10.1126/science.aal2130
  notes: Chaikeeratisak et al. 2017, Assembly of a nucleus-like structure during viral
    replication in bacteria, Science. Figure 1 supports spindle-mediated positioning
    and rotation in 201phi2-1 infection.
