  essentiality: UNKNOWN
  role: Tubulin constituents that polymerize into the short funis microtubule arrays
    of Giardia trophozoites.
  evidence:
  - reference: GO:0005874
    notes: Gene Ontology defines microtubules as tubes of polymeric tubulin.
  - reference: DOI:10.1016/j.jsb.2004.01.017
