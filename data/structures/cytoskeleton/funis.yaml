      microscopy to show that the Giardia funis is made of short microtubule arrays.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for the alpha- and beta-tubulins
    that polymerize into Giardia funis microtubules was verified in this pass.
