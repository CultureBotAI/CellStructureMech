causal_graphs:
- graph_id: giardia_funis_microtubule_topology
  title: Funis microtubules link Giardia flagellar axonemes to the tail cortex
  description: In Giardia trophozoites, short funis microtubule arrays emanate from
    the caudal flagellar axonemes, anchor to dense rods running parallel to the posterior-lateral
    flagella, and anchor to the epiplasm beneath the contractile tail membrane after
    posterior-lateral flagellar emergence.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records ultrastructural topology supporting the published
    tail-flexion model while leaving dense-rod composition, epiplasm molecular identity,
    assembly order and the tail-flexion mechanism unresolved.
