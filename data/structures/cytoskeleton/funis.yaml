identifier: cellstructuremech:funis
label: funis
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A Giardia trophozoite cytoskeletal structure composed of short microtubule
  arrays that emanate from the caudal flagellar axonemes, anchor to dense rods running
  parallel to the posterior-lateral flagella, and after posterior-lateral flagellar
  emergence anchor to the epiplasm beneath the contractile tail membrane.
definition_source: DOI:10.1016/j.jsb.2004.01.017
mapping_status: PROPOSED
