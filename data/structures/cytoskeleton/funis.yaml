  action: EXPANDED_RECORD
  changes: Added cytoskeleton parentage, microtubule parthood, a label-only alpha/beta
    tubulin component, Giardia intestinalis scope, DOI evidence, a nonmechanistic
    funis topology graph, and open TODOs for dense-rod grounding and tail-flexion
    mechanism.
  llm_assisted: true
