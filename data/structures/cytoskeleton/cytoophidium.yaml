functions:
- function_id: caulobacter_cell_curvature_regulation
  label: Caulobacter cell-curvature regulation
  description: Caulobacter CtpS filaments localize along the inner cell curvature
    and regulate curved morphology independently of CtpS catalytic activity.
  evidence:
  - reference: DOI:10.1038/ncb2087
    notes: Ingerson-Mahar et al. 2010 showed that CtpS filaments regulate Caulobacter
      cell curvature through a functional interaction with crescentin, separately
      from the enzyme's CTP biosynthetic activity.
evidence:
- reference: GO:0097268
  notes: Gene Ontology defines cytoophidium as a filamentous membrane-less cellular
    component composed primarily of polymerized metabolic enzymes including CTPS.
- reference: DOI:10.1038/ncb2087
  notes: Ingerson-Mahar, Briegel, Werner, Jensen and Gitai 2010, 'The metabolic enzyme
    CTP synthase forms cytoskeletal filaments', Nature Cell Biology.
- reference: DOI:10.1042/BST20221410
  notes: Guo and Liu 2023 reviewed cytoophidia and CTPS-containing enzyme filaments
    across domains of life.
