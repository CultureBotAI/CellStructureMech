discussions:
- discussion_id: resolve_ctps_family_grounding
  prompt: Resolve exact source-neutral grounding for full-length cytoophidium-forming
    CTP synthase proteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#ctp_synthase
  rationale: This first cytoophidium record curates the experimentally studied Caulobacter
    CtpS constituent without asserting that a catalytic CTPS domain, an ATP-grasp
    fold term or a generic enzyme family accession exactly denotes the filament-forming
    CTPS component class.
  evidence:
  - reference: DOI:10.1038/ncb2087
    notes: Ingerson-Mahar et al. 2010 identified CtpS as the Caulobacter filament
      protein and showed that the orthologous Escherichia coli enzyme forms filaments.
  posed_by: codex
  posed_date: '2026-09-11'
- discussion_id: exclude_crescentin_from_ctps_components
  prompt: Crescentin is a functional interactor, not a curated cytoophidium constituent.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#ctp_synthase
  rationale: The Caulobacter CtpS filament genetically and functionally interacts
    with the crescentin filament to regulate cell shape, but the discovery paper identifies
    CtpS as the protein constituent of the inner-curvature cytoophidium rather than
    crescentin as a cytoophidium subunit.
  evidence:
  - reference: DOI:10.1038/ncb2087
    notes: Ingerson-Mahar et al. 2010 treated CtpS filaments and crescentin filaments
      as interacting cytoskeletal systems.
  posed_by: codex
  posed_date: '2026-09-11'
