discussions:
- discussion_id: meiotic_spindle_pole_body_boundary
  prompt: Keep the meiotic spindle pole body narrower than the general fungal spindle
    pole body and distinct from the meiotic outer plaque substructure.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - causal_graphs#meiotic_spindle_pole_body_remodeling
  rationale: GO:0035974 denotes the SPB formed as part of the meiotic cell cycle,
    while GO:0005816 covers the general fungal SPB. The locally minted meiotic outer
    plaque is a meiosis-II SPB substructure and prospore-membrane assembly site, not
    an equivalent name for the whole meiotic SPB.
  resolution_note: Curated GO:0035974 as the exact meiotic SPB subtype, parented it
    to GO:0005816, and represented the existing MOP record as a budding-yeast assembly-site
    substructure.
  evidence:
  - reference: GO:0035974
    notes: GO:0035974 identifies the meiotic spindle pole body.
  - reference: GO:0005816
    notes: GO:0005816 identifies the general spindle pole body.
  - reference: DOI:10.1093/emboj/19.14.3657
    notes: Knop and Strasser 2000 studied budding-yeast SPB remodeling and MOP-associated
      prospore membrane assembly during meiosis.
