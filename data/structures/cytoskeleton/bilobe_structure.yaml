taxonomic_distribution:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  presence: COMMON
  note: The bilobe has been resolved cytologically in T. brucei as a hooked and hairpin-shaped
    cytoskeletal structure near the flagellar pocket collar, microtubule quartet and
    flagellum attachment zone filament.
  reference: DOI:10.1128/EC.05287-11
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: Trypanosome model in which TbMORN1, TbCentrin2, TbCentrin4 and TbLRRP1 localized
    to the bilobe, with TbMORN1 and TbCentrin4 delineating the hooked and hairpin
    regions around the pocket-collar and FAZ-associated cytoskeleton.
  reference: DOI:10.1128/EC.05287-11
functions:
- function_id: flagellar_pocket_faz_linkage
  label: flagellar-pocket and FAZ cytoskeletal linkage
  description: The bilobe is positioned between the flagellar pocket collar and the
    flagellum attachment zone and is arranged around the microtubule quartet plus
    FAZ filament.
  evidence:
  - reference: GO:0120120
    notes: GO defines the bilobe as a cytoskeletal structure in some kinetoplastids
      linking the ciliary pocket collar and flagellum attachment zone.
  - reference: DOI:10.1128/EC.05287-11
    notes: Esson et al. 2012 resolved the TbMORN1/TbCentrin4 bilobe hairpin around
      the microtubule quartet and FAZ filament, and placed the hooked TbMORN1 arm
      above the BILBO1-marked flagellar pocket collar.
  - reference: DOI:10.3390/cells4040726
    notes: Morriswood 2015 reviewed the bilobe as a flagellum-associated cytoskeletal
      structure of kinetoplastids.
evidence:
- reference: DOI:10.1016/j.molbiopara.2009.05.001
  notes: Morriswood et al. 2009, The bilobe structure of Trypanosoma brucei contains
    a MORN-repeat protein, Molecular and Biochemical Parasitology.
- reference: DOI:10.1128/EC.05287-11
  notes: Esson et al. 2012, Morphology of the trypanosome bilobe, a novel cytoskeletal
    structure, Eukaryotic Cell.
- reference: DOI:10.3390/cells4040726
  notes: Morriswood 2015, Form, Fabric, and Function of a Flagellum-Associated Cytoskeletal
    Structure, Cells.
