discussions:
- discussion_id: radial_spoke_head_boundary
  prompt: Keep the radial spoke head distinct from the whole radial spoke and adjacent
    neck and stalk subcomplexes.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: GO:0001535 denotes the terminal protein-complex portion of the radial
    spoke that projects toward the central pair, GO:0001534 denotes the complete radial
    spoke, GO:0120343 denotes the radial spoke neck, and GO:0001536 denotes the radial
    spoke stalk.
  resolution_note: Curated GO:0001535 as the exact head subcomplex and used GO:0001534
    for whole-radial-spoke parthood.
  evidence:
  - reference: GO:0001535
    notes: GO:0001535 identifies the radial spoke head subcomplex.
  - reference: GO:0001534
    notes: GO:0001534 identifies the complete radial spoke.
  - reference: GO:0120343
    notes: GO:0120343 identifies the radial spoke neck.
  - reference: GO:0001536
    notes: GO:0001536 identifies the radial spoke stalk.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
