- component_id: disc_associated_proteins
  label: ventral disc-associated proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Giardia ventral disc contains many DAP and giardin proteins
    that occupy distinct substructures; no exact source-neutral CURIE for this mixed
    constituent cohort was curated.
  role: Protein cohort associated with ventral-disc substructures including dorsal
    microribbons, crossbridges and the lateral crest.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0001442
    notes: Hagen et al. 2011 identified ventral-disc and lateral-crest proteins in
      Giardia intestinalis.
  - reference: DOI:10.1242/jcs.227355
    notes: Nosala et al. 2020 identified additional Giardia disc-associated proteins
      and linked DAP depletion with ventral-disc stability defects.
