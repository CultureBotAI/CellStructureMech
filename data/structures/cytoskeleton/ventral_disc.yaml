functions:
- function_id: giardia_trophozoite_attachment
  label: Giardia trophozoite attachment
  description: The ventral disc is a microtubule-based organelle that supports Giardia
    trophozoite attachment to host intestinal epithelium.
  evidence:
  - reference: DOI:10.1091/mbc.E23-12-0515
    notes: Hagen et al. 2025 connected the domed architecture of the Giardia ventral
      disc with trophozoite attachment.
- function_id: ventral_disc_architecture_maintenance
  label: ventral disc architecture maintenance
  description: Microtubules and ventral disc-associated proteins build a stable spiral
    organelle with dorsal microribbons, crossbridges and a lateral crest.
  evidence:
  - reference: DOI:10.1371/journal.pone.0043783
    notes: Schwartz et al. 2012 mapped microtubules, microribbons and crossbridges
      in the Giardia ventral disc by electron tomography.
  - reference: DOI:10.1242/jcs.227355
    notes: Nosala et al. 2020 perturbed disc-associated proteins and detected changes
      in ventral-disc stability.
