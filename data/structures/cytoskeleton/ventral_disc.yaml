  essentiality: UNKNOWN
  role: Tubulin constituents that polymerize into the spiral microtubule array of
    the Giardia ventral disc.
  evidence:
  - reference: GO:0097597
    notes: Gene Ontology models the ventral disc as a Giardia organelle characterized
      by a spiral array of microtubules and microtubule-associated structures.
  - reference: DOI:10.1371/journal.pone.0043783
    notes: Schwartz et al. 2012 used electron tomography to resolve the Giardia ventral
      disc microtubule spiral and its associated microribbons and crossbridges.
  grounding_status: REVIEWED_LABEL_ONLY
