identifier: GO:0097597
label: ventral disc
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: Specialized organelle found in Giardia species (trophozoite stage) and
  characterized by a spiral array of microtubules and microtubule-associated structures
  including dorsal microribbons and crossbridges. The edge of the ventral disc narrows
  into a lateral crest. The ventral disk mediates mechanical attachment of the trophozoite
  to the host's intestinal wall, and contains the contractile proteins actinin, alpha-actinin,
  myosin, and tropomyosin working towards contraction of the disk involved in adherence.
definition_source: GO:0097597
