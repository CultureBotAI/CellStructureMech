  - reference: DOI:10.7554/eLife.89958
- discussion_id: stability_and_function_limits
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Resolve stabilization without upgrading models into measured mechanisms.
  notes: Nocodazole resistance, low tubulin turnover and stability after laser severing
    bound stability to these assays. A GTP cap inferred from Bim1 binding is not directly
    measured, and microtubule crosslinking mechanisms remain models. Survival/regrowth
    effects are supported but perturbations also act beyond this array. Proposed tubulin
    storage, a molecular SPB-separation checkpoint and homology with primary cilia
    are not asserted as demonstrated functions.
