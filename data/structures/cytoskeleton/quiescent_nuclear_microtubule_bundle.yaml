- discussion_id: regulators_not_residents
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not turn genetic requirements or expression into residence.
  notes: Dynein and dynactin are detected on the cytoplasmic SPB face in 2013, not
    inside the nuclear array. Cik1 requirement, monopolin Mam1/Lrs4/Hrr25/Csm1 expression
    and deletion phenotypes, Spo13 effects, and tubulin-folding factors do not alone
    establish Q-nMT residence. Ipl1 activity is required early, but Ipl1 and Nbl1
    were not detected in quiescence; the whole CPC is not imported from Bir1/Sli15
    localization. Kip3 and She1 exit phenotypes are modeled as regulatory evidence,
    not stable-component evidence. She1 P38200 is distinct from the MYO4/SHE1 homonym
    P32492.
