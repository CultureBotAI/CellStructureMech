identifier: cellstructuremech:quiescent_nuclear_microtubule_bundle
label: quiescent nuclear microtubule bundle
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A stable monopolar bundle of parallel nuclear microtubules formed during
  glucose-exhaustion-induced quiescence, characterized in Saccharomyces cerevisiae.
  The bundle extends from the nuclear face of the spindle pole body and reorganizes
  kinetochore and centromere distribution; it is distinct from the antiparallel cytoplasmic
  quiescent-cell bundle of fission yeast.
definition_source: DOI:10.1083/jcb.201306075
mapping_status: PROPOSED
