- discussion_id: localization_and_essentiality
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep assay sensitivity and individual deletion effects explicit.
  notes: Kar3 was not detected in 2013 but later detected with 3GFP in 2024. Cin8
    localization is faint and channel controls are shown in Figure 4 supplement 1B.
    Single BIM1 deletion permits stable bundles, whereas combinations expose redundancy.
    Tub3-specific requirements do not make Tub3 irreplaceable because Tub1 substitution
    restores stable bundles. Cin8 and Kip1 share a family but have distinct phenotypes;
    family-wide necessity is not tested. Short residual bundles after several deletions
    preclude an unqualified assembly-essential claim.
