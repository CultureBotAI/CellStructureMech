canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  reference: DOI:10.7554/eLife.89958
  note: Budding yeast studied by fluorescence, expansion microscopy, laser ablation
    and perturbations; the 2013 defining study additionally supplies TEM. Strain backgrounds
    differ among assays; no all-fungi prevalence is asserted.
functions:
- function_id: nuclear_reorganization
  label: Quiescent nuclear reorganization
  description: The nuclear array supports relocation of kinetochore-centromere clusters
    away from the SPB and displacement of the nucleolus.
  evidence:
  - reference: DOI:10.1083/jcb.201306075
    notes: Kinetochore and centromere localization, plus no-array mutants, associate
      array formation with nuclear reorganization; chromosomes and nucleolus are not
      treated as bundle constituents.
- function_id: quiescence_survival
  label: Support of quiescent survival and recovery
  description: Bundle formation contributes to survival and subsequent colony formation
    in the tested glucose-exhaustion conditions.
  evidence:
  - reference: DOI:10.1083/jcb.201306075
    notes: Array-defective mutants lose viability and regrowth capacity; pleiotropic
      effects limit a uniquely bundle-specific causal claim.
  - reference: DOI:10.7554/eLife.89958
    notes: Early nocodazole prevents formation and impairs survival/regrowth, whereas
      late treatment of stabilized bundles does not have the same effect. This narrows
      but does not eliminate off-target explanations.
causal_graphs:
- graph_id: quiescent_bundle_assembly
  title: Glucose exhaustion and early bundle assembly
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Physiological and perturbation-defined mechanism in S. cerevisiae;
    the upstream glucose-exhaustion signal and exact crosslinking reactions are unresolved.
  nodes:
  - node_id: glucose_exhaustion
    label: Glucose exhaustion
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: assembly
    label: Q-nMT bundle assembly
    node_type: BIOLOGICAL_PROCESS
  - node_id: kinetochore_attachment
    label: Functional kinetochore-microtubule attachment
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: glucose_exhaustion
    predicate: stimulates
    object: assembly
    description: Carbon exhaustion triggers the transition from dynamic nuclear microtubules
      to a persistent bundle.
    evidence:
    - reference: DOI:10.7554/eLife.89958
      notes: Figure 1 and Results identify sequential establishment, growth and stabilization
        phases; exact timing depends on culture conditions.
  - subject: kinetochore_attachment
    predicate: supports
    object: assembly
    description: Functional attachment is required early for normal bundle formation,
      but late Ndc80 inactivation does not dismantle an established bundle.
    evidence:
    - reference: DOI:10.7554/eLife.89958
      notes: Figure 3 and supplement 1 compare early and late ndc80-1 restrictive-temperature
        treatments.
- graph_id: quiescence_exit_disassembly
  title: Regulated disassembly on quiescence exit
  graph_kind: DISASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Exit from glucose-exhaustion-induced quiescence; timing and deletion
    evidence do not identify a molecular checkpoint. Kip3 and She1 are external regulators,
    not inferred stable residents.
  nodes:
  - node_id: refeeding
    label: Glucose refeeding
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: disassembly
    label: Q-nMT bundle disassembly
    node_type: BIOLOGICAL_PROCESS
  - node_id: kip3
    label: Kinesin-like protein KIP3
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:P53086
  - node_id: she1
    label: Mitotic spindle-associated protein SHE1
    node_type: GENE_OR_PROTEIN
    grounding: UniProtKB:P38200
  - node_id: spb_separation
    label: Spindle pole body separation
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: refeeding
    predicate: stimulates
    object: disassembly
    description: Refeeding triggers progressive shortening of the nuclear array; translation
      inhibition delays efficient disassembly.
    evidence:
    - reference: DOI:10.1083/jcb.201306075
      notes: Quiescence-exit experiments compare glucose alone and cycloheximide treatment.
  - subject: kip3
    predicate: supports
    object: disassembly
    description: Kip3 supports timely onset of disassembly, without a detected change
      in the subsequent shortening rate in its deletion.
    evidence:
    - reference: DOI:10.7554/eLife.89958
      notes: Figure 5 distinguishes delayed onset from post-onset depolymerization
        kinetics; Kip3 is resynthesized on exit.
  - subject: she1
    predicate: supports
    object: disassembly
    description: She1 contributes to efficient disassembly in the tested KIP3-deficient
      background.
    evidence:
    - reference: DOI:10.7554/eLife.89958
      notes: Figure 5 compares kip3 and kip3 she1 deletions. The native spindle-associated
        She1 accession is P38200, not MYO4's historical SHE1 alias P32492.
  - subject: disassembly
    predicate: supports
    object: spb_separation
    description: Completion of bundle loss precedes SPB separation; delayed disassembly
      is associated with delayed separation.
    evidence:
    - reference: DOI:10.7554/eLife.89958
      notes: Figure 5 tracks bundle disappearance and SPB separation in wild type
        and mutants. The combined deletion also delays separation without delaying
        overall proliferation; this is not proof of a specific molecular checkpoint.
evidence:
- reference: DOI:10.1083/jcb.201306075
  notes: 'Laporte et al. (2013), PMID 24247429, native PMC3840927.1 Results, Discussion
    and relevant Methods: defining nuclear-array morphology, localization, perturbation
    and exit evidence.'
- reference: DOI:10.7554/eLife.89958
  notes: Laporte et al. (2024), PMID 38527106, native PMC10963028.1 Results, Discussion
    and relevant Methods; Figure 3 supplement 1 and Figure 4 supplement 1 visually
    inspected.
- reference: GO:0099070
  notes: Non-obsolete static microtubule bundle term is broader than Q-nMT. Its Q-MT
    narrow synonyms concern the distinct fission-yeast cytoplasmic bundle.
- reference: GO:0005634
  notes: Native nucleus term supports nuclear compartment parthood.
- reference: GO:0015630
  notes: Native microtubule cytoskeleton term supports the encompassing framework.
- reference: GO:0005880
  notes: Native nuclear microtubule term describes the constituent polymers, not the
    whole multi-filament array.
discussions:
- discussion_id: identity_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the nuclear Q-nMT identity separate from generic nuclear microtubules
    and cytoplasmic Q-MT.
  notes: Hidden- and ignored-inclusive identity, synonym and citation searches, plus
    a parsed identity scan, found no existing record. OAK GO alias searches and native
    GO definitions do not supply an exact Q-nMT term. GO:0099070 is broader; GO:0005880
    is a constituent filament. The parallel monopolar nuclear array is not the antiparallel
    cytoplasmic S. pombe bundle or a bipolar mitotic spindle. OTHER denotes the whole
    array. Bare nuclear microtubule array is not adopted as an exact synonym.
  evidence:
  - reference: DOI:10.1083/jcb.201306075
  - reference: DOI:10.7554/eLife.89958
  - reference: GO:0099070
  - reference: GO:0005880
- discussion_id: family_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Find exact whole-protein families for five label-only resident classes.
  notes: Complete native InterPro matches were read for Bik1 P11709, Kar3 P17119,
    Bir1 P47134, Sli15 P38283 and Slk19 Q08581. Broad kinesin/BIR families and CAP-Gly,
    ARK-binding or TACC domains do not exactly identify these narrower classes. Label-only
    grounding is retained pending an exact authority entry.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P11709/
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P17119/
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P47134/
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P38283/
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/Q08581/
- discussion_id: attached_chromosomes_and_spb
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate bundle composition from its nucleation site and attached chromosomal
    assemblies.
  notes: The SPB nucleates the array but is not its containing structure. Tub4/Spc97/Spc72
    mark the nucleation site. All six kinetochore subcomplexes have array-associated
    localization in 2013; Dad2 and Nuf2 mark attachments in 2024. These are retained
    as interacting chromosome-bound machinery rather than asserted stoichiometric
    building blocks of the microtubule bundle. Centromeric Cse4/chromosomes and the
    displaced nucleolus are likewise not bundle components. Slk19 is included because
    its own direct bundle-end localization and perturbation are documented.
