discussions:
- discussion_id: cytoplasmic_microtubule_boundary
  prompt: Keep cytoplasmic microtubules distinct from nuclear spindle microtubules
    while preserving GO axonemal microtubules as child structures.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - causal_graphs#spb_outer_plaque_organizes_cytoplasmic_microtubules
  rationale: GO:0005881 denotes microtubules in the cytoplasm and therefore differs
    from the nuclear or spindle-anchored GO:0005876 spindle microtubule class. GO
    also places the axonemal microtubule class under cytoplasmic microtubule, so this
    record should stay broader than budding-yeast astral microtubules alone.
  resolution_note: Curated GO:0005881 as a GO-backed cytoplasmic microtubule subtype,
    parented it to GO:0005874, and used a budding-yeast SPB graph only as one concrete
    example of cytoplasmic microtubule organization.
  evidence:
  - reference: GO:0005881
    notes: GO:0005881 identifies the cytoplasmic microtubule class.
  - reference: GO:0005876
    notes: GO:0005876 identifies spindle microtubules as part of mitotic or meiotic
      spindles.
  - reference: GO:0005879
    notes: GO:0005879 identifies the axonemal microtubule child class.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
