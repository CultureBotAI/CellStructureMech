functions:
- function_id: cytoplasmic_microtubule_array_organization
  label: cytoplasmic microtubule array organization
  description: Cytoplasmic microtubules form non-nuclear tubulin-polymer arrays that
    can be organized from cytoplasmic microtubule-organizing centers such as the budding-yeast
    SPB outer plaque.
  evidence:
  - reference: GO:0005881
    notes: GO:0005881 defines cytoplasmic microtubules as microtubules in the cell
      cytoplasm.
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the budding-yeast SPB outer plaque as
      the cytoplasmic site for microtubule nucleation.
