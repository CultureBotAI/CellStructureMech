- discussion_id: inner_plaque_boundary
  prompt: Keep the spindle-pole-body inner plaque distinct from the central and outer
    plaques.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: GO:0005822 denotes a nuclear laminate structure of the spindle pole body,
    while GO:0005823 denotes the nuclear-envelope-embedded central plaque and GO:0005824
    denotes the cytoplasmic outer plaque.
  resolution_note: Curated GO:0005822 as the general SPB inner plaque and linked it
    by parthood to GO:0005816.
  evidence:
  - reference: GO:0005822
    notes: GO:0005822 identifies the nuclear inner plaque of the spindle pole body.
  - reference: GO:0005823
    notes: GO:0005823 identifies the central plaque of the spindle pole body as distinct
      from the inner plaque.
  - reference: GO:0005824
    notes: GO:0005824 identifies the cytoplasmic outer plaque of the spindle pole
      body as distinct from the inner plaque.
