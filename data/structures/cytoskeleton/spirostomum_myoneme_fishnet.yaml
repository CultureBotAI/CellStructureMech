identifier: cellstructuremech:spirostomum_myoneme_fishnet
label: Spirostomum myoneme fishnet
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A mesh-like cortical myoneme characterized in Spirostomum, containing
  intersecting centrin/spasmin-rich fibrillar bundles and giant Sfi1-like scaffold
  proteins. The extended network shortens during calcium-triggered cell contraction
  and is distinct from adjacent microtubule bundles and from an isolated scaffold-centrin
  protein complex.
definition_source: DOI:10.1126/sciadv.add6550
mapping_status: PROPOSED
