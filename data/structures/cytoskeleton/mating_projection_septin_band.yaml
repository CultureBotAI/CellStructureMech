discussions:
- discussion_id: septin_band_not_septin_ring
  prompt: Keep the diffuse mating-projection septin band distinct from the ring-shaped
    GO:0032175 mating projection septin ring.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - causal_graphs#shmoo_neck_septin_band_topology
  rationale: GO:0032162 denotes a diffuse ring composed of parallel septin bars at
    the shmoo neck, whereas GO:0032175 denotes a ring-shaped septin structure. Longtine
    et al. 1998 describe Saccharomyces pheromone-response septins as a fuzzy band
    or bars, so this record captures the band morphology and leaves the GO:0032175
    record separate.
  resolution_note: Curated the diffuse band as GO:0032162 and linked it to the mating
    projection with part_of rather than merging it into the GO:0032175 ring record.
  evidence:
  - reference: GO:0032162
    notes: GO:0032162 defines the diffuse mating-projection septin band.
  - reference: GO:0032175
    notes: GO:0032175 defines a ring-shaped mating-projection septin structure.
  - reference: DOI:10.1083/jcb.143.3.719
    notes: Longtine et al. 1998 observed a fuzzy band or parallel septin bars in pheromone-treated
      Saccharomyces cells.
  posed_by: codex
  posed_date: '2026-09-28'
  resolved_date: '2026-09-28'
