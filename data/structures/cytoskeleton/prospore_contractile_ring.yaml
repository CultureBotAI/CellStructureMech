discussions:
- discussion_id: prospore_contractile_ring_boundary
  prompt: Keep the prospore contractile ring distinct from generic actomyosin contractile
    rings and from prospore septin rings.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032157 denotes an actin- and myosin-containing contractile ring that
    forms beneath the prospore-envelope plasma membrane during meiotic cytokinesis.
    GO:0005826 denotes the broader actomyosin contractile ring class, GO:0110086 denotes
    the broader meiotic actomyosin contractile ring class, and GO:0032169 denotes
    a separate prospore septin ring assembled from septins and septin-associated proteins.
  resolution_note: Curated GO:0032157 as the exact prospore-localized actomyosin ring
    and used GO:0005826 only as the is-a parent.
  evidence:
  - reference: GO:0032157
    notes: GO:0032157 identifies the prospore-localized actomyosin contractile ring.
  - reference: GO:0005826
    notes: GO:0005826 identifies the broader actomyosin contractile ring class.
  - reference: GO:0110086
    notes: GO:0110086 identifies the broader meiotic actomyosin contractile ring class.
  - reference: GO:0032169
    notes: GO:0032169 identifies the separate septin-containing prospore ring.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
