functions:
- function_id: a_tubule_doublet_scaffold
  label: A-tubule doublet scaffold
  description: The complete A axonemal microtubule forms the 13-protofilament microtubule
    wall that supports B-tubule attachment, inner- and outer-junction contact, radial-spoke
    anchoring, and dynein-arm attachment.
  evidence:
  - reference: GO:0097649
    notes: GO defines the A axonemal microtubule as the complete 13-protofilament
      tubule of the axonemal outer doublet.
  - reference: DOI:10.1016/j.cell.2019.09.030
    notes: Ma et al. 2019 resolved the native Chlamydomonas doublet microtubule lattice
      with A-tubule-associated inner-sheath, inner-junction, outer-junction, ribbon
      and external densities.
evidence:
- reference: GO:0097649
