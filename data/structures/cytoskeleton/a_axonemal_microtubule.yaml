      notes: GO defines the A axonemal microtubule as the doublet microtubule that
        carries attached inner dynein arms.
    - reference: GO:0036156
      notes: GO identifies the inner dynein arm as an axonemal structure on ciliary
        and flagellar outer doublets.
    - reference: DOI:10.1126/science.1128618
      notes: Nicastro et al. 2006 resolved inner dynein arms on Chlamydomonas outer
        doublets.
  - subject: outer_dynein_arm
    predicate: attaches to
    object: a_axonemal_microtubule
    description: Outer dynein arms attach to the A tubule of axonemal outer doublets.
    evidence:
