      notes: GO defines the A tubule as a complete microtubule that fuses with the
        incomplete B tubule.
  - subject: axonemal_microtubule_doublet_inner_junction
    predicate: contacts
    object: a_axonemal_microtubule
    description: The inner junction contacts the A-tubule A1 protofilament.
    evidence:
    - reference: GO:0160113
      notes: GO defines the inner junction as joining the B10 protofilament to the
        A1 protofilament.
  - subject: axonemal_microtubule_doublet_outer_junction
    predicate: contacts
    object: a_axonemal_microtubule
    description: The outer junction contacts A-tubule protofilaments A10 and A11.
    evidence:
    - reference: GO:0160114
      notes: GO defines the outer junction as joining B1 to A10 and A11 within an
        axonemal doublet.
  - subject: radial_spoke
    predicate: attaches to
    object: a_axonemal_microtubule
    description: Radial spokes attach to the A tubule of axonemal outer doublets.
    evidence:
    - reference: GO:0097649
      notes: GO defines the A axonemal microtubule as the doublet microtubule that
        carries attached radial spokes.
    - reference: DOI:10.1126/science.1128618
      notes: Nicastro et al. 2006 identified radial spokes on Chlamydomonas outer
        doublets.
  - subject: inner_dynein_arm
    predicate: attaches to
