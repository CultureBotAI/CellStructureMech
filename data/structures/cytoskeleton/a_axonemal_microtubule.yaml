- reference: GO:0005879
  notes: Gene Ontology places the A axonemal microtubule under the axonemal microtubule
    class.
- reference: GO:0097545
  notes: Gene Ontology places the A axonemal microtubule within the axonemal doublet
    microtubule.
- reference: DOI:10.1016/j.cell.2019.09.030
  notes: Ma et al. 2019, 'Structure of the Decorated Ciliary Doublet Microtubule',
    Cell.
- reference: DOI:10.1126/science.1128618
  notes: Nicastro et al. 2006 resolved Chlamydomonas radial spokes and dynein arms
    on the axonemal outer doublets.
causal_graphs:
- graph_id: chlamydomonas_a_tubule_doublet_scaffold
  title: A axonemal microtubule supports the outer doublet
  description: In Chlamydomonas, the complete A tubule is the 13-protofilament microtubule
    of the axonemal outer doublet, connects to the incomplete B tubule through inner
    and outer junction structures, and carries radial-spoke and dynein-arm attachments.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph records coarse A-tubule parthood and leaves exact A1-A13
    protofilament boundaries, non-inner-sheath A-tubule MIP positions, radial-spoke
    and dynein-arm attachment geometry, tubulin-family groundings and copy numbers
    for later curation.
