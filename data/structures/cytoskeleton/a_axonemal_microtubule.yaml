      notes: GO places the A axonemal microtubule within the axonemal doublet microtubule.
  - subject: b_axonemal_microtubule
    predicate: fuses with
    object: a_axonemal_microtubule
    description: The incomplete B tubule fuses with the complete A tubule to form
      an axonemal outer doublet.
    evidence:
