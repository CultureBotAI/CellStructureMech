functions:
- function_id: outer_junction_b_tubule_stabilization
  label: outer-junction B-tubule stabilization
  description: Outer-junction proteins span the A10, A11, B1 and B2 protofilaments
    of the axonemal doublet and help keep the incomplete B-tubule stably attached
    to the A-tubule.
  evidence:
  - reference: GO:0160114
    notes: GO defines the outer junction as the structure joining B1 to A10 and A11
      in the axonemal doublet.
  - reference: DOI:10.1038/s41467-023-37868-0
    notes: Kubo et al. 2023 modeled TtCFAP77 and OJ2 across A10-A12/B1-B2 protofilaments
      and found B1-B2 dissociation without both proteins in molecular dynamics simulations.
evidence:
- reference: GO:0160114
  notes: Gene Ontology cellular-component term for the axonemal microtubule doublet
    outer junction.
- reference: GO:0097545
  notes: GO places the axonemal microtubule doublet outer junction within the axonemal
    doublet microtubule.
- reference: DOI:10.1016/j.cell.2019.09.030
  notes: Ma et al. 2019, 'Structure of the Decorated Ciliary Doublet Microtubule',
    Cell.
- reference: DOI:10.1038/s41467-023-37868-0
  notes: Kubo et al. 2023, 'Native doublet microtubules from Tetrahymena thermophila
    reveal the importance of outer junction proteins', Nature Communications.
