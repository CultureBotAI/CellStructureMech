  role: Microtubule inner proteins and wedge-associated proteins that span the B1-A10/A11
    outer junction and reinforce B-tubule attachment to the A-tubule.
  evidence:
  - reference: DOI:10.1016/j.cell.2019.09.030
    notes: Ma et al. 2019 localized Chlamydomonas FAP127, FAP53 and FAP141 helices
      across the B1-to-A10/A11 outer-junction cleft.
  - reference: DOI:10.1038/s41467-023-37868-0
    notes: Kubo et al. 2023 modeled Tetrahymena CFAP77, OJ2 and OJ3 proteins at the
      axonemal doublet outer junction.
