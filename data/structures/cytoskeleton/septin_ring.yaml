  reference: DOI:10.1534/genetics.107.073007
functions:
- function_id: cytokinesis_site_scaffold
  label: cytokinesis-site scaffolding
  description: The fungal septin ring marks the future division site and scaffolds
    cytokinesis factors at the mother-bud neck or fungal septation site.
  evidence:
  - reference: DOI:10.3389/fcell.2016.00123
    notes: Glomb and Gronemeyer 2016 review septin organization and cytokinesis functions
      at the budding-yeast bud neck.
  - reference: DOI:10.1128/EC.4.9.1503-1512.2005
    notes: Douglas et al. 2005 review septin functions in yeast model systems and
      pathogenic fungi.
