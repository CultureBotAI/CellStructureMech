identifier: GO:0005940
label: septin ring
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A tight ring-shaped septin-based cytoskeletal structure that forms at
  the cell cortex in the division plane, including the bud-neck septin ring of budding
  yeast and related fungal septin rings at septation sites.
definition_source: GO:0005940
mapping_status: PROPOSED
