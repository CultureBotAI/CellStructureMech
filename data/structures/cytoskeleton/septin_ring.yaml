causal_graphs:
- graph_id: septin_oligomer_filament_ring_assembly
  title: Budding-yeast septin hetero-octamers polymerize into a cortical ring
  description: In Saccharomyces cerevisiae, septin proteins assemble into hetero-octameric
    rods, the rods polymerize into septin filaments, and septin filaments organize
    at the bud-neck cortex to form the septin ring.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the Saccharomyces cerevisiae hierarchy from paralogous
    septin subunits to hetero-octamers, filaments, and a bud-neck ring without asserting
    a single paralog order or oligomer size for all fungal septin rings.
  nodes:
  - node_id: septin_proteins
    label: septin proteins
    node_type: GENE_OR_PROTEIN
    component_ref: septin_proteins
  - node_id: septin_hetero_octamer
    label: budding-yeast septin hetero-octamer
    node_type: STRUCTURE
  - node_id: septin_filaments
    label: septin filaments
    node_type: STRUCTURE
  - node_id: cell_cortex
    label: cell cortex
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0005938
  - node_id: septin_ring
    label: septin ring
    node_type: STRUCTURE
    grounding: GO:0005940
  - node_id: cytokinesis_site
    label: cytokinesis site
    node_type: CELLULAR_LOCALIZATION
  edges:
  - subject: septin_proteins
    predicate: oligomerize into
    object: septin_hetero_octamer
    description: Budding-yeast septin subunits assemble into ordered hetero-octameric
      rods.
    evidence:
    - reference: DOI:10.1073/pnas.0803330105
      notes: Bertin et al. 2008 reconstituted Saccharomyces cerevisiae septin hetero-octamers
        and studied their supramolecular assembly.
  - subject: septin_hetero_octamer
    predicate: polymerizes into
    object: septin_filaments
    description: Budding-yeast septin hetero-octameric rods associate end to end to
      form filaments.
    evidence:
    - reference: DOI:10.1073/pnas.0803330105
      notes: Bertin et al. 2008 visualized purified budding-yeast septin hetero-octamers
        polymerizing into filaments.
    - reference: DOI:10.1016/j.devcel.2011.02.004
      notes: McMurray et al. 2011 tested septin-filament formation in budding yeast.
  - subject: septin_filaments
    predicate: assemble at
    object: cell_cortex
    description: Budding-yeast septin filaments are organized at the bud-neck cortex
      to form a ring at the future division plane.
    evidence:
    - reference: GO:0005940
      notes: GO:0005940 defines the septin ring as a ring-shaped structure at the
        division plane.
    - reference: DOI:10.3389/fcell.2016.00123
      notes: Glomb and Gronemeyer 2016 review septin-ring organization at the budding-yeast
        cortex.
  - subject: septin_ring
    predicate: marks
    object: cytokinesis_site
    description: The budding-yeast septin ring marks the mother-bud cytokinesis site.
    evidence:
    - reference: DOI:10.3389/fcell.2016.00123
      notes: Glomb and Gronemeyer 2016 review septin-ring organization and cytokinesis
        functions at the budding-yeast bud neck.
