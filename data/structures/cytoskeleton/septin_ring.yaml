- discussion_id: septin_ring_not_septin_complex
  prompt: Keep the septin ring distinct from the smaller septin hetero-oligomer complexes
    that polymerize into filaments.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - components#septin_proteins
  - causal_graphs#septin_oligomer_filament_ring_assembly
  rationale: GO:0005940 denotes the higher-order cortical ring at the division plane.
    GO:0031105 denotes oligomeric septin protein complexes, so the complex belongs
    inside the assembly graph rather than as this record's identity.
  evidence:
  - reference: GO:0005940
    notes: GO:0005940 is the cellular-component term for the septin ring.
  - reference: GO:0031105
    notes: GO:0031105 is the cellular-component term for septin complexes.
