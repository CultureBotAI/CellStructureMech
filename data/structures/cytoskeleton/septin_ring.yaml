components:
- component_id: septin_proteins
  label: septin proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Fungal septin rings are assembled from multiple paralogous septin
    GTPases whose orthology and paralog usage differ among yeasts and filamentous
    fungi; no exact source-neutral protein-family CURIE was curated for the whole
    constituent cohort.
  role: GTP-binding filament-forming proteins that oligomerize, polymerize, and organize
    into a cortical ring at fungal cytokinesis sites.
  evidence:
  - reference: DOI:10.3389/fcell.2016.00123
    notes: Glomb and Gronemeyer 2016 review Saccharomyces cerevisiae Cdc3, Cdc10,
      Cdc11, Cdc12, and Shs1 as mitotic septins that assemble at the bud neck.
  - reference: DOI:10.1534/genetics.107.073007
    notes: Iwase et al. 2007 studied Shs1/Sep7 with the Cdc3, Cdc10, Cdc11, and Cdc12
      septins of the budding-yeast septin ring.
taxonomic_distribution:
- taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  presence: COMMON
  note: Fungal septins assemble into rings, collars, bands, and caps at division or
    polarized-growth sites, with exact architectures varying between budding yeast
    and filamentous fungi.
  reference: DOI:10.1128/EC.4.9.1503-1512.2005
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Budding-yeast model in which Cdc3/Cdc10/Cdc11/Cdc12/Shs1 septins form a ring
