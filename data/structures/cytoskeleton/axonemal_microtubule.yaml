discussions:
- discussion_id: axonemal_microtubule_child_boundary
  prompt: Should tubulin protofilaments, MIPs or central-pair projections be duplicated
    as direct axonemal microtubule components?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#chlamydomonas_axonemal_microtubule_topology
  rationale: GO:0005879 denotes the shared axonemal microtubule class. Tubulin constituents
    are curated on the generic microtubule and axonemal-doublet records, while A/B-tubule,
    C1/C2, MIP and projection details remain on child records so this parent record
    does not collapse subtype-specific geometry.
  evidence:
  - reference: GO:0005879
    notes: GO:0005879 identifies the shared axonemal microtubule class.
  - reference: GO:0097545
    notes: GO:0097545 identifies the axonemal outer-doublet subtype.
  - reference: GO:0097540
    notes: GO:0097540 identifies the C1/C2 axonemal central-pair subtype.
