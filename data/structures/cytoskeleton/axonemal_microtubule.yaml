functions:
- function_id: axonemal_microtubule_scaffold
  label: axonemal microtubule scaffold
  description: In Chlamydomonas, specialized axonemal microtubules form the A/B outer
    doublets and C1/C2 central-pair singlets of the 9+2 flagellar axoneme.
  evidence:
  - reference: GO:0005879
    notes: GO:0005879 defines axonemal microtubules as microtubules in the axoneme
      of a eukaryotic cilium or flagellum.
  - reference: DOI:10.1016/j.cell.2019.09.030
    notes: Ma et al. 2019 resolved native Chlamydomonas axonemal doublet microtubules
      with A- and B-tubule protofilament walls.
  - reference: DOI:10.1002/cm.21094
    notes: Carbajal-Gonzalez et al. 2013 resolved the Chlamydomonas axonemal central
      pair with asymmetric C1 and C2 singlet microtubules.
