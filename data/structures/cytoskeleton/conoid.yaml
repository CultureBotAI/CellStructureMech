- discussion_id: conoid_body_versus_complex_scope
  prompt: Distinguish the spiral conoid body from the larger conoid-complex proteome.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#conoid_tubulin_fibers
  - taxonomic_distribution
  - causal_graphs#conoid_tubulin_myoH_host_cell_entry
  - discussions#ground_conoid_protein_cohorts
  rationale: Hu 2006 enriched apical cytoskeletal preparations contain candidate proteins,
    not a pure inventory of conoid-body constituents. Koreny 2021 directly resolves
    distinct body, base, canopy and APR locations and documents reduced conoid-derived
    ring structures in Plasmodium. Homology or broad complex membership does not put
    every protein inside the ribbon-tubulin body or establish majority prevalence
    of that morphology.
  resolution_note: Remove the heterogeneous cohort as a body constituent and its reside-in
    edge, while retaining both papers as research context. Keep the Hu 2002 Toxoplasma
    spiral-body evidence, polymer-level fiber identity, and independently supported
    MyoH machinery and entry/exit claims. Replace the broad Apicomplexa COMMON inference
    with the bounded Toxoplasma occurrence. This is not an absence claim for Plasmodium
    conoid-derived structures. Original grounding rationale and dates remain, with
    the removed-cohort anchor redirected to this scope discussion.
  evidence:
  - reference: DOI:10.1083/jcb.200112086
    notes: Direct unusual conoid-body tubulin polymer evidence.
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Partial apical-complex enrichment and candidate localization; not every
      detected protein is a body constituent.
  - reference: DOI:10.1371/journal.pbio.3001081
    notes: Results and Figures 1, 3-5 and 8 distinguish substructures and reduced
      Plasmodium conoid-complex morphology.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
