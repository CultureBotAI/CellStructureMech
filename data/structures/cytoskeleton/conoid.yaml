identifier: GO:0020010
label: conoid
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A spiral cytoskeletal structure located at the apical end of the apical
  complex in some apicomplexan parasites. Fibers form a left-handed spiral, and are
  comprised of tubulin protofilaments organized in a ribbon-like structure that differs
  from the conventional tubular structure characteristic of microtubules.
definition_source: GO:0020010
mapping_status: PROPOSED
