    Apicomplexa taxonomic scope, Toxoplasma gondii as a canonical example, apical-scaffold
    and entry/exit functions, a conoid tubulin/MyoH function graph, and a grounding
    TODO for conoid protein cohorts.
  llm_assisted: true
