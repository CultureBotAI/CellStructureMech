- reference: DOI:10.1371/journal.pbio.3001081
  notes: Koreny et al. 2021, Molecular characterization of the conoid complex in Toxoplasma
    reveals its conservation in all apicomplexans, including Plasmodium species, PLOS
    Biology.
- reference: DOI:10.1371/journal.ppat.1005388
  notes: Graindorge et al. 2016, The Conoid Associated Motor MyoH Is Indispensable
    for Toxoplasma gondii Entry and Exit from Host Cells, PLOS Pathogens.
