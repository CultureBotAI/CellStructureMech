components:
- component_id: conoid_tubulin_fibers
  label: conoid tubulin fibers
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Conoid fibers are tubulin-containing ribbon polymers built from
    protofilaments; no exact source-neutral CURIE for this unusual apicomplexan tubulin
    polymer was curated.
  role: Tubulin-containing ribbon fibers that spiral to form the Toxoplasma conoid.
  evidence:
  - reference: DOI:10.1083/jcb.200112086
    notes: Hu et al. 2002 identified Toxoplasma conoid fibers as an unusual tubulin
      polymer.
- component_id: myoh_motor
  label: conoid-associated MyoH motor
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - MyoH
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: MyoH is a Toxoplasma conoid-associated myosin; no exact source-neutral
    apicomplexan MyoH protein-family CURIE was curated.
  role: A conoid-associated motor that is required for Toxoplasma entry into and exit
    from host cells.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1005388
    notes: Graindorge et al. 2016 localized MyoH at the conoid and showed that MyoH
      is required for Toxoplasma entry and exit.
