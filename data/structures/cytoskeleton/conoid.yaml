components:
- component_id: conoid_tubulin_fibers
  label: conoid tubulin fibers
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Conoid fibers are tubulin-containing ribbon polymers built from
    protofilaments; no exact source-neutral CURIE for this unusual apicomplexan tubulin
    polymer was curated.
  role: Tubulin-containing ribbon fibers that spiral to form the Toxoplasma conoid.
  evidence:
  - reference: DOI:10.1083/jcb.200112086
    notes: Hu et al. 2002 identified Toxoplasma conoid fibers as an unusual tubulin
      polymer.
- component_id: conserved_conoid_complex_proteins
  label: conserved conoid complex proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The conserved conoid proteome contains multiple unrelated proteins;
    no exact CURIE for the whole conoid-complex protein cohort was curated.
  role: Protein cohort detected in Toxoplasma conoid preparations and conserved across
    apicomplexan lineages.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 partially purified the Toxoplasma conoid/apical complex
      and identified approximately 200 candidate cytoskeletal proteins.
  - reference: DOI:10.1371/journal.pbio.3001081
    notes: Koreny et al. 2021 molecularly characterized conserved conoid-complex proteins
      across apicomplexans.
- component_id: myoh_motor
  label: conoid-associated MyoH motor
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - MyoH
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: MyoH is a Toxoplasma conoid-associated myosin; no exact source-neutral
    apicomplexan MyoH protein-family CURIE was curated.
  role: A conoid-associated motor that is required for Toxoplasma entry into and exit
    from host cells.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1005388
    notes: Graindorge et al. 2016 localized MyoH at the conoid and showed that MyoH
      is required for Toxoplasma entry and exit.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Conoids are apicomplexan cytoskeletal structures rather than conserved eukaryotic
    cytoskeleton features.
  reference: DOI:10.1371/journal.pbio.3001081
- taxon_id: NCBITaxon:5794
  taxon_label: Apicomplexa
  presence: COMMON
  note: Conoid-complex proteins are conserved across apicomplexans, including lineages
    such as Plasmodium that lack a canonical protrusible conoid.
  reference: DOI:10.1371/journal.pbio.3001081
canonical_examples:
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan model in which conoid tubulin polymers, conoid/apical-complex
    proteins, and MyoH-dependent entry and exit have been experimentally studied.
  reference: DOI:10.1083/jcb.200112086
functions:
- function_id: conoid_apical_cytoskeletal_scaffold
  label: apical cytoskeletal scaffolding
  description: The conoid forms a spiral tubulin-based scaffold at the apex of the
    apical complex.
  evidence:
  - reference: DOI:10.1083/jcb.200112086
    notes: Hu et al. 2002 resolved Toxoplasma conoid fibers as tubulin protofilament
      ribbons organized into a spiral.
- function_id: conoid_associated_host_cell_entry_exit
  label: conoid-associated host cell entry and exit
  description: The conoid-associated MyoH motor supports Toxoplasma gliding motility,
    host-cell entry, and host-cell exit.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1005388
    notes: Graindorge et al. 2016 found that MyoH is indispensable for Toxoplasma
      entry and exit from host cells.
evidence:
- reference: DOI:10.1083/jcb.200112086
