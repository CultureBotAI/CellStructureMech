identifier: GO:0110131
label: Aim21-Tda2 complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex that localizes to actin cortical patches at sites of endocytosis
  and negatively regulates barbed end F-actin assembly, resulting in the generation
  of free actin pools. The Aim21-Tda2 complex is necessary for efficient endocytosis
  and balancing the distribution of actin between patches and cables.
definition_source: GO:0110131
