  gene_symbols:
  - TDA2
  stoichiometry: 2 copies (homodimer) per heterotetrameric Aim21(2)-Tda2(2) complex
  essentiality: DISPENSABLE
  role: Dynein light chain Tctex-1-like homodimer that binds the C-terminal region
    of Aim21p, dimerizing Aim21p and promoting its recruitment and barbed-end inhibitory
    activity at endocytic actin cortical patches.
  evidence:
  - reference: GO:0110131
    notes: GO:0110131 defines Tda2 as a constituent subunit of the Aim21-Tda2 complex.
  - reference: PMID:29467252
    notes: Shin et al. 2018 showed that Tda2 is a homodimer that binds Aim21 to form
      the functional Aim21/Tda2 complex and is required for Aim21-mediated regulation
      of cortical patch actin assembly.
