- function_id: negative_regulation_actin_polymerization
  label: negative regulation of actin filament polymerization
  grounding: GO:0030837
  description: Localizes to endocytic actin cortical patches and inhibits barbed-end
    F-actin elongation in collaboration with Cap1p/Cap2p, maintaining the cytoplasmic
    pool of free actin monomers needed to balance actin distribution between cortical
    patches and formin-nucleated cables.
  evidence:
  - reference: GO:0110131
    notes: GO:0110131 carries a capable_of_part_of (RO:0002216) axiom to GO:0030837
      (negative regulation of actin filament polymerization).
  - reference: PMID:29467252
    notes: Shin et al. 2018 demonstrated that the Aim21/Tda2 complex reduces barbed-end
      actin assembly and interacts with Cap1/Cap2 to balance actin assembly between
      patches and cables.
