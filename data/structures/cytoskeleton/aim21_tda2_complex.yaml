  label: Altered inheritance of mitochondria protein 21
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR021582
  gene_symbols:
  - AIM21
  stoichiometry: 2 copies per heterotetrameric Aim21(2)-Tda2(2) complex
  essentiality: DISPENSABLE
  role: Proline-rich actin-patch regulatory subunit that binds Tda2p dimers and interacts
    with Bbc1p and F-actin capping protein (Cap1p/Cap2p) to attenuate barbed-end actin
    polymerization at endocytic cortical patches.
  evidence:
  - reference: GO:0110131
    notes: GO:0110131 defines the Aim21-Tda2 complex at endocytic actin cortical patches.
  - reference: PMID:29467252
    notes: Shin et al. 2018 (DOI:10.1091/mbc.E17-10-0592) demonstrated that Aim21
      and Tda2 form a stable complex that localizes to actin cortical patches, binds
      Cap1/Cap2, and reduces barbed-end actin assembly.
