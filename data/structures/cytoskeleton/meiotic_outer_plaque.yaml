identifier: cellstructuremech:meiotic_outer_plaque
label: meiotic outer plaque
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A sporulation-specific cytoplasmic plaque that forms on meiosis II spindle
  pole bodies in budding yeast after outer-plaque remodeling and nucleates prospore
  membrane assembly.
definition_source: DOI:10.1093/emboj/19.14.3657
mapping_status: PROPOSED
