discussions:
- discussion_id: identity_and_granularity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the perialgal meshwork from generic microtubules, Km fibers
    and unrelated baskets.
  rationale: Basket terminology alone does not identify a regular cage or a shared
    structure across taxa.
  notes: Hidden- and ignored-inclusive repository searches found only unrelated peduncle-basket
    comparisons before scaffolding. QuickGO Stentor and perialgal searches returned
    no matches; microtubule-basket results included neuronal and nuclear-pore baskets,
    not this system. A single microtubule and the longitudinal Km bundle are different
    granularities or architectures. The record covers the irregular meshwork, not
    a separate cage per alga or a claim of uniqueness to this genus.
  evidence:
  - reference: DOI:10.1091/mbc.E24-12-0571
    notes: Cell-anatomy Results identify Km bundles separately; the microtubule-basket
      Results describe irregular gaps rather than regular baskets.
  - reference: https://www.ebi.ac.uk/QuickGO/services/ontology/go/search?query=perialgal
    notes: Authority identity search before minting.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: partial_composition_and_anchoring
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve mesh-associated linkers and test a selective requirement for cortical
    symbiont positioning.
  rationale: Tubulin staining and spatial association do not identify attachment molecules
    or establish causation.
  notes: 'The component list is intentionally partial and limited to the directly
    stained tubulin family. No native paralogue inventory, linker identity, stoichiometry
    or assembly essentiality is asserted. No causal graph is added: centrifugation
    and symbiont-removal or photosynthesis-inhibition assays do not isolate meshwork
    function. Test selective mesh disruption and rescue before asserting anchoring,
    photoprotection, enhanced photosynthesis, gas exchange or phototaxis mechanisms.'
  evidence:
  - reference: DOI:10.1091/mbc.E24-12-0571
    notes: Figure 3 supports anatomy; the surface-association Discussion frames positioning
      and physiological benefits as possibilities.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: host_structure_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep symbionts and neighboring structures outside the molecular constituent
    list.
  rationale: Association with a host cytoskeleton is not membership of that cytoskeleton
    or evidence of organelle fixation.
  notes: Exclude Chlorella cells, perialgal vacuole membranes, mitochondria, membranelle
    roots and Km-fiber bundles as constituents. The paper cultured the algae outside
    the host; this record does not classify the symbionts as organelles.
  evidence:
  - reference: DOI:10.1091/mbc.E24-12-0571
    notes: Cell anatomy, host/symbiont phylogeny and culture Methods distinguish these
      entities.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
