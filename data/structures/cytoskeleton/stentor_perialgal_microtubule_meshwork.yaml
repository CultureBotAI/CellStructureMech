identifier: cellstructuremech:stentor_perialgal_microtubule_meshwork
label: Stentor perialgal microtubule meshwork
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: An irregular cortical microtubule meshwork characterized in Stentor pyriformis,
  with gaps occupied by algal endosymbionts in perialgal vacuoles. The named basket
  system denotes host cytoskeletal architecture, not regular cages, the symbionts
  themselves, their vacuole membranes, or the longitudinal Km-fiber bundles.
