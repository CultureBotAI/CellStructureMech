functions:
- function_id: proposed_symbiont_positioning
  label: Proposed cortical positioning of endosymbionts
  description: The authors propose that the meshwork helps retain algal endosymbionts
    near the host cortex; a meshwork-specific causal requirement has not been established.
  evidence:
  - reference: DOI:10.1091/mbc.E24-12-0571
    notes: The surface-association Discussion proposes anchoring from cortical organization.
      Centrifugation displaces algae but is not a selective microtubule perturbation.
