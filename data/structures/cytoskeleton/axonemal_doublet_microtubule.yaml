  description: In Chlamydomonas flagella, A- and B-tubules form axonemal doublet microtubules
    whose tubulin walls and inner sheath stabilize the 9+2 axonemal scaffold.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
