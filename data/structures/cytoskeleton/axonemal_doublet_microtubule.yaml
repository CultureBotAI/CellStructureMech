  edges:
  - subject: a_axonemal_microtubule
    predicate: is part of
    object: axonemal_doublet_microtubule
    description: The complete 13-protofilament A tubule is a microtubule part of the
      axonemal doublet.
    evidence:
    - reference: GO:0097649
      notes: GO places the A axonemal microtubule within the axonemal doublet microtubule.
  - subject: b_axonemal_microtubule
    predicate: is part of
    object: axonemal_doublet_microtubule
    description: The incomplete 10-protofilament B tubule fuses with the A tubule
      to form the axonemal doublet.
    evidence:
    - reference: GO:0097650
      notes: GO places the B axonemal microtubule within the axonemal doublet microtubule.
  - subject: axonemal_tubulins
    predicate: polymerize into
    object: axonemal_doublet_microtubule
    description: Alpha- and beta-tubulin protofilaments form the A- and B-tubule walls
      of the axonemal doublet microtubule.
    evidence:
    - reference: GO:0097649
      notes: GO identifies the A tubule as a complete 13-protofilament microtubule.
    - reference: GO:0097650
      notes: GO identifies the B tubule as an incomplete 10-protofilament microtubule.
  - subject: axonemal_microtubule_doublet_inner_sheath
    predicate: stabilizes
    object: axonemal_doublet_microtubule
    description: The inner-sheath MIP network reinforces the A- and B-tubule lattice
      of axonemal doublet microtubules.
    evidence:
    - reference: GO:0160110
      notes: GO defines the axonemal microtubule doublet inner sheath as a MIP network
        that helps stabilize the doublet microtubule.
    - reference: DOI:10.1038/s41467-019-09051-x
      notes: Owa et al. 2019 found that Chlamydomonas FAP45 and FAP52 bind the inside
        of B tubules and stabilize ciliary axonemes.
  - subject: axonemal_doublet_microtubule
    predicate: is part of
    object: axoneme
    description: Nine axonemal doublet microtubules form the cylindrical outer scaffold
      of the Chlamydomonas 9+2 axoneme.
    evidence:
    - reference: GO:0097545
      notes: GO defines the axonemal doublet microtubule as part of an axoneme.
    - reference: DOI:10.1126/science.1128618
      notes: Nicastro et al. 2006 visualized the nine outer doublet microtubules of
        the Chlamydomonas 9+2 axoneme by cryoelectron tomography.
