components:
- component_id: axonemal_tubulins
  label: axonemal alpha- and beta-tubulins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Tubulin subunits that form the A and B microtubule protofilament walls of
    the axonemal doublet.
  evidence:
  - reference: GO:0097649
    notes: GO defines the A axonemal microtubule as a complete 13-protofilament microtubule
      in the axonemal outer doublet.
  - reference: GO:0097650
    notes: GO defines the B axonemal microtubule as the incomplete 10-protofilament
      microtubule that fuses with the A tubule.
  - reference: DOI:10.1016/j.cell.2019.09.030
    notes: Ma et al. 2019 resolved alpha/beta-tubulin protofilaments and associated
      proteins in native Chlamydomonas axonemal doublet microtubules.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for the axonemal alpha/beta-tubulin
    constituent set of GO:0097545 was verified in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  presence: COMMON
  note: Chlamydomonas flagellar axonemes contain nine doublet microtubules whose tubulin
    lattice and luminal MIP architecture have been resolved by cryo-ET and cryo-EM.
  reference: DOI:10.1016/j.cell.2019.09.030
canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Green-algal model whose native axonemal doublet microtubules have been structurally
    resolved with associated MIPs and axonemal complexes.
  reference: DOI:10.1016/j.cell.2019.09.030
functions:
- function_id: axonemal_doublet_scaffold
  label: axonemal doublet scaffold
  description: The nine Chlamydomonas axonemal doublet microtubules provide the circumferential
    scaffold for axonemal dyneins, radial spokes, nexin links and flagellar bending.
  evidence:
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 resolved the 9+2 Chlamydomonas axoneme and its doublet-associated
      dynein, radial-spoke and linker densities by cryoelectron tomography.
  - reference: DOI:10.1016/j.cell.2019.09.030
    notes: Ma et al. 2019 resolved the native Chlamydomonas axonemal doublet with
      associated radial-spoke and nexin-dynein regulatory-complex densities.
evidence:
- reference: GO:0097545
  notes: Gene Ontology cellular-component term for the axonemal doublet microtubule.
- reference: GO:0097649
  notes: Gene Ontology cellular-component term for the A axonemal microtubule part.
- reference: GO:0097650
  notes: Gene Ontology cellular-component term for the B axonemal microtubule part.
- reference: GO:0160110
  notes: Gene Ontology cellular-component term for the MIP network of the axonemal
    microtubule doublet inner sheath.
- reference: GO:0160113
  notes: Gene Ontology cellular-component term for the inner junction that links the
    B10 and A1 protofilaments of an axonemal doublet.
- reference: GO:0160114
  notes: Gene Ontology cellular-component term for the outer junction that links the
    B1 protofilament to A10/A11 in an axonemal doublet.
- reference: GO:0160115
  notes: Gene Ontology cellular-component term for the axonemal doublet ribbon made
    from protofilaments A11, A12 and A13 plus associated MIPs.
- reference: GO:0005930
  notes: Gene Ontology places the axonemal doublet microtubule within the axoneme.
- reference: DOI:10.1126/science.1128618
  notes: Nicastro et al. 2006, 'The molecular architecture of axonemes revealed by
    cryoelectron tomography', Science.
- reference: DOI:10.1038/s41467-019-09051-x
  notes: Owa et al. 2019, 'Inner lumen proteins stabilize doublet microtubules in
    cilia and flagella', Nature Communications.
- reference: DOI:10.1016/j.cell.2019.09.030
  notes: Ma et al. 2019, 'Structure of the Decorated Ciliary Doublet Microtubule',
    Cell.
