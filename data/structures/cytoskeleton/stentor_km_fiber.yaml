discussions:
- discussion_id: identity_and_granularity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the Km bundle from a single microtubule, myoneme or striated
    rootlet.
  rationale: Basal-body association and similar fiber names do not make different
    cortical assemblies equivalent.
  notes: Hidden- and ignored-inclusive repository searches found only neighboring
    myoneme references, not an existing target record. QuickGO Stentor, kinetodesmal
    and postciliary searches returned no hits; Km fiber returned generic fiber matches.
    GO microtubule bundle is broader. GO:0035253 describes a typically striated ciliary
    rootlet, not this overlapping ribbon bundle. The genus-qualified label does not
    assert uniqueness to Stentor or prevalence across the genus.
  evidence:
  - reference: DOI:10.1083/jcb.57.3.704
    notes: The microtubular Km fibers and deeper myonemes are separate systems.
  - reference: GO:0035253
    notes: Rootlet definition checked at QuickGO.
  - reference: https://www.ebi.ac.uk/QuickGO/services/ontology/go/search?query=Stentor
    notes: Authority identity search before minting.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: unidentified_bridges_and_motor
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify the molecular bridges and test how Km fibers generate extension
    force.
  rationale: Morphological bridges do not identify a motor protein or prove an ATPase
    cycle.
  notes: Do not add dynein, a specific ATPase, or unidentified bridge proteins as
    grounded constituents. Essentiality, native paralogue inventory and stoichiometry
    remain unset or UNKNOWN. No mechanistic graph is asserted.
  evidence:
  - reference: DOI:10.1083/jcb.57.3.704
    notes: Discussion explicitly states that direct evidence for ATP-utilizing enzymes
      in the interribbon bridges was lacking; the dynein comparison is an analogy.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: neighboring_and_regulatory_proteins
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep neighboring organelles and broadly localized regulators outside the
    constituent list.
  rationale: Cortical localization alone does not establish membership of the Km bundle.
  notes: Exclude the deeper myoneme system, basal bodies, transverse microtubules
    and adjacent membranes as constituents. Mob1 localization to posterior cortical
    rows does not resolve direct Km association; do not add it as a constituent or
    bundle-maintenance factor on that basis.
  evidence:
  - reference: DOI:10.1083/jcb.57.3.704
    notes: The cortical architecture distinguishes neighboring systems.
  - reference: DOI:10.1371/journal.pbio.1001861
    notes: Mob1 localization Results and Figure 3 describe diffuse cortical-row signal,
      not purified Km membership.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
