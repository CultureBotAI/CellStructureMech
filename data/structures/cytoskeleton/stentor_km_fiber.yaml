identifier: cellstructuremech:stentor_km_fiber
label: Stentor Km fiber
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A longitudinal cortical bundle of overlapping microtubule ribbons in Stentor,
  characterized ultrastructurally in S. coeruleus. Ribbons originate beside successive
  basal-body pairs and overlap alongside a ciliary row; the bundle is distinct from
  the deeper contractile myonemes.
definition_source: DOI:10.1083/jcb.57.3.704
mapping_status: PROPOSED
