functions:
- function_id: cell_reextension
  label: Cell re-extension
  description: Implicated in cell re-extension through relative displacement of overlapping
    ribbons; a bridge-driven motor cycle remains a model.
  evidence:
  - reference: DOI:10.1083/jcb.57.3.704
    notes: Results and Discussion compare contracted and relaxed cells. Reduced ribbon
      overlap accompanies extension; selective disruption of the two fiber systems
      was unsuccessful.
