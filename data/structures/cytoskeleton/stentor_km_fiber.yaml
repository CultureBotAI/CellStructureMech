components:
- component_id: alpha_tubulin
  label: Alpha tubulin
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR002452
  essentiality: UNKNOWN
  role: Tubulin subunit of the microtubules forming the ribbons.
  evidence:
  - reference: DOI:10.1371/journal.pbio.1001861
    notes: Tubulin RNAi Results and Figure 2D-E identify cortical microtubule bundles
      by anti-alpha-tubulin staining.
  - reference: InterPro:IPR002452
    notes: Authority entry verifies the Alpha tubulin family and alpha/beta microtubule
      composition.
- component_id: beta_tubulin
  label: Beta tubulin
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR002453
  essentiality: UNKNOWN
  role: Partner tubulin subunit; depletion disrupts the normal cortical microtubule
    rows, without defining a minimal Km-fiber assembly requirement.
  evidence:
  - reference: DOI:10.1371/journal.pbio.1001861
    notes: RNAi Results and Figure 2 show beta-tubulin transcript depletion and disorganized
      tubulin-positive cortical rows; this is not a Km-specific knockout.
  - reference: InterPro:IPR002453
    notes: Authority entry verifies the Beta tubulin family and its role in microtubules.
