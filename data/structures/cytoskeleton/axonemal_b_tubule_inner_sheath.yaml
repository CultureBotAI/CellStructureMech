evidence:
- reference: GO:0160112
  notes: Gene Ontology cellular-component term for the axonemal B tubule inner sheath.
- reference: GO:0160110
  notes: Gene Ontology places the axonemal B tubule inner sheath within the axonemal
    microtubule doublet inner sheath.
- reference: GO:0097650
  notes: GO identifies the B axonemal microtubule. B-lumen containment is supported
    by the GO:0160112 textual definition and Ma et al. 2019, not by its current typed
    GO parthood edge, which names the A tubule.
- reference: DOI:10.1016/j.cell.2019.09.030
  notes: Ma et al. 2019, 'Structure of the Decorated Ciliary Doublet Microtubule',
    Cell. The luminal-coating and MIP-network Results support the B-lumen network
    and its B-tubule containment; this evidence is retained separately from the conflicting
    GO relationship.
