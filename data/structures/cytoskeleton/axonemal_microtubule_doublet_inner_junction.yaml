identifier: GO:0160113
label: axonemal microtubule doublet inner junction
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A structure that joins the B10 protofilament of the B tubule to the A1
  protofilament of the A tubule within an axonemal microtubule doublet.
definition_source: GO:0160113
mapping_status: PROPOSED
