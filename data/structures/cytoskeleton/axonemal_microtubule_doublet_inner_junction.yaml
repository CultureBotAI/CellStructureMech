    doublet microtubule.
- reference: DOI:10.1091/mbc.E13-08-0464
  notes: Yanagisawa et al. 2014, 'FAP20 is an inner junction protein of doublet microtubules
    essential for both the planar asymmetrical waveform and stability of flagella
