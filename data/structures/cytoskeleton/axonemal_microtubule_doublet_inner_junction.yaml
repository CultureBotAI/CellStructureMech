functions:
- function_id: a_b_tubule_junction_stability
  label: A/B-tubule junction stability
  description: The inner-junction protein bridge connects the B-tubule B10 protofilament
    to the A-tubule A1 protofilament and helps stabilize the axonemal doublet for
    ciliary and flagellar motility.
  evidence:
  - reference: GO:0160113
    notes: GO defines the inner junction as the structure that joins the B10 protofilament
      to A1 within an axonemal doublet.
  - reference: DOI:10.1091/mbc.E13-08-0464
    notes: Yanagisawa et al. 2014 reported that Chlamydomonas fap20 axonemes lack
      the inner junction and are liable to disintegrate during beating.
  - reference: DOI:10.1091/mbc.E19-01-0063
    notes: Dymek et al. 2019 found that loss of PACRG and FAP20 removes the inner-junction
      bridge and reduces dynein-driven microtubule sliding.
evidence:
- reference: GO:0160113
