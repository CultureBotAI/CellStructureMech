components:
- component_id: inner_junction_proteins
  label: inner-junction proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Protein families that build the inner-junction bridge between the A- and B-tubules
    of an axonemal doublet.
  evidence:
  - reference: GO:0160113
    notes: GO defines the axonemal microtubule doublet inner junction by its position
      between the B-tubule B10 protofilament and the A-tubule A1 protofilament.
  - reference: DOI:10.1091/mbc.E13-08-0464
    notes: Yanagisawa et al. 2014 identified Chlamydomonas FAP20 as an inner-junction
      component by mutant electron microscopy and cryo-ET localization.
  - reference: DOI:10.1091/mbc.E19-01-0063
    notes: Dymek et al. 2019 used Chlamydomonas pacrg and fap20 mutants to show that
      PACRG and FAP20 form the inner-junction bridge along all nine ciliary doublets.
  - reference: DOI:10.7554/eLife.52760
    notes: Khalifa et al. 2020 combined Chlamydomonas and Tetrahymena structural and
      proteomic evidence to assign FAP276, FAP106 and FAP126 to inner-junction or
      inner-junction-associated positions.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for the complete inner-junction protein-family
    set was verified in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  presence: COMMON
  note: Chlamydomonas flagellar doublets contain an inner-junction bridge whose FAP20
    and PACRG constituents were localized by mutant and cryo-electron tomography studies.
  reference: DOI:10.1091/mbc.E19-01-0063
canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Green-algal model in which FAP20, PACRG and additional inner-junction-associated
    proteins have been localized within axonemal doublet microtubules.
  reference: DOI:10.7554/eLife.52760
functions:
- function_id: a_b_tubule_junction_stability
  label: A/B-tubule junction stability
  description: The inner-junction protein bridge connects the B-tubule B10 protofilament
    to the A-tubule A1 protofilament and helps stabilize the axonemal doublet for
    ciliary and flagellar motility.
  evidence:
  - reference: GO:0160113
    notes: GO defines the inner junction as the structure that joins the B10 protofilament
      to A1 within an axonemal doublet.
  - reference: DOI:10.1091/mbc.E13-08-0464
    notes: Yanagisawa et al. 2014 reported that Chlamydomonas fap20 axonemes lack
      the inner junction and are liable to disintegrate during beating.
  - reference: DOI:10.1091/mbc.E19-01-0063
    notes: Dymek et al. 2019 found that loss of PACRG and FAP20 removes the inner-junction
      bridge and reduces dynein-driven microtubule sliding.
evidence:
- reference: GO:0160113
  notes: Gene Ontology cellular-component term for the axonemal microtubule doublet
    inner junction.
- reference: GO:0097545
  notes: GO places the axonemal microtubule doublet inner junction within the axonemal
    doublet microtubule.
- reference: DOI:10.1091/mbc.E13-08-0464
  notes: Yanagisawa et al. 2014, 'FAP20 is an inner junction protein of doublet microtubules
    essential for both the planar asymmetrical waveform and stability of flagella
    in Chlamydomonas', Molecular Biology of the Cell.
- reference: DOI:10.1091/mbc.E19-01-0063
  notes: Dymek et al. 2019, 'PACRG and FAP20 form the inner junction of axonemal doublet
    microtubules and regulate ciliary motility', Molecular Biology of the Cell.
- reference: DOI:10.7554/eLife.52760
  notes: Khalifa et al. 2020, 'The inner junction complex of the cilia is an interaction
    hub that involves tubulin post-translational modifications', eLife.
