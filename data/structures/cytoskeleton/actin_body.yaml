identifier: GO:0099079
label: actin body
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: An amorphous cytoplasmic assembly of actin filaments and selected actin-binding
  proteins in growth-arrested yeast cells, distinct from cortical actin patches and
  actin cables.
