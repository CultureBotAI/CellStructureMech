  taxon_label: Saccharomyces cerevisiae
  note: Single-cell tracking used BY4741/BY4742-related cultures grown seven days
    in YPD. The hosted Figure 5 supplement instead shows phalloidin-stained prototrophic
    rho-zero cells after 24 hours; these contexts are not conflated.
  reference: DOI:10.7554/eLife.35685
- taxon_id: NCBITaxon:4896
  taxon_label: Schizosaccharomyces pombe
  note: Figure 6C shows Fim1 and Acp2 localization and phalloidin-stained bodies after
    glucose exhaustion. The distinct quiescent microtubule bundle is not part of the
    actin body.
  reference: DOI:10.1083/jcb.201502025
evidence:
- reference: GO:0099079
  notes: Exact nonobsolete cellular-component identity; native GO and cached OAK agree
    on actin-cytoskeleton parthood, not an is-a relation to the whole cytoskeleton.
- reference: GO:0110165
  notes: 'Native GO is-a parent: cellular anatomical structure.'
- reference: GO:0015629
  notes: Actin cytoskeleton is a containing structure, not the record identity.
- reference: GO:0005737
  notes: Cytoplasm denotes the cellular compartment containing the observed bodies.
- reference: DOI:10.1091/mbc.E06-04-0282
  notes: Sagot et al. 2006 defining study. Indexed primary Results and figure captions
    were readable; complete Methods were not recovered through the attempted XML/BioC/PDF
    routes. No verbatim snippets or figure bytes are taken from this source.
- reference: DOI:10.1083/jcb.201009028
  notes: Laporte et al. 2011, Metabolic status rather than cell cycle signals control
    quiescence entry and exit. Native primary Results and Methods support metabolic
    requirements for body mobilization, not complete proliferation on glucose alone.
- reference: DOI:10.1083/jcb.201502025
  notes: Laporte et al. 2015, A stable microtubule array drives fission yeast polarity
    reestablishment upon quiescence exit. Only the actin-body localization results
    are used here; microtubule-bundle functions remain outside this record.
- reference: DOI:10.7554/eLife.35685
  notes: Laporte et al. 2018, Mitochondria reorganization upon proliferation arrest
    predicts individual yeast cell fate. Direct cell tracking shows bodies in both
    quiescent and senescent subpopulations.
causal_graphs:
- graph_id: glucose_metabolism_body_disassembly
  title: Glucose metabolism enables actin-body mobilization
  graph_kind: DISASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Perturbation-supported pathway-level mechanism in seven-day Saccharomyces
    cerevisiae cultures. The downstream metabolic signal is unknown. Body mobilization
    is not equivalent to completion of quiescence exit or new budding.
  nodes:
  - node_id: glucose_uptake
    label: glucose uptake
    node_type: BIOLOGICAL_PROCESS
  - node_id: glucose_catabolism
    label: glucose catabolism
    node_type: BIOLOGICAL_PROCESS
  - node_id: body_disassembly
    label: actin-body disassembly
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: glucose_uptake
    predicate: provides substrate for
    object: glucose_catabolism
    description: Glucose import precedes metabolism in the glucose-only refeeding
      assay.
    evidence:
    - reference: DOI:10.1083/jcb.201009028
      notes: 'Figure 4B and the glucose-catabolism Results: uptake-defective and hexokinase-deficient
        mutants fail glucose-triggered mobilization.'
  - subject: glucose_catabolism
    predicate: enables
    object: body_disassembly
    description: Metabolism through glycolysis is needed for glucose-triggered mobilization;
      the experiments do not identify the causal metabolite or require an increase
      in ATP.
    evidence:
    - reference: DOI:10.1083/jcb.201009028
      notes: Blocked glycolytic steps, glucose analogs and iodoacetate prevent mobilization.
        In pgi1 mutants fructose permits mobilization without ATP replenishment; water
        can raise ATP without mobilizing bodies.
discussions:
- discussion_id: reserve_function_not_proven
  prompt: Does the actin body directly supply reusable actin to rebuilt patches and
    cables?
  kind: OPEN_QUESTION
  status: OPEN
  rationale: Rapid refeeding-dependent disappearance and rebuilding without new protein
    synthesis support a reserve hypothesis, not traced transfer of body subunits.
    No established storage function or direct body-to-patch conversion is asserted.
  evidence:
  - reference: DOI:10.1091/mbc.E06-04-0282
    notes: Refeeding and translation-inhibition experiments motivate the proposed
      reserve role.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: resolve_abp_family_groundings
  prompt: Resolve exact source-neutral families for Abp1-like adaptors and Abp140-like
    actin-binding methyltransferases.
  kind: CURATION_TODO
  status: OPEN
  rationale: Native InterPro matches were inspected completely; generic domains and
    the broader METTL2/6/8-like family do not precisely identify these components.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/protein/UniProt/P15891/
    notes: Abp1 domain matches, not a whole-protein family.
  - reference: https://www.ebi.ac.uk/interpro/protein/UniProt/Q08641/
    notes: Abp140 methyltransferase-family and domain matches.
  posed_by: codex
  posed_date: '2026-10-05'
  attaches_to:
  - components#abp1
  - components#abp140
- discussion_id: resolve_fission_yeast_drebrin_symbol
  prompt: Resolve the gene and reporter called drebrin (Aap1) in the fission-yeast
    actin-body study.
  kind: CURATION_TODO
  status: OPEN
  rationale: The paper reports a positive localizer, but native UniProt searches for
    aap1 return an amino-acid permease and an aspartyl aminopeptidase alias, not a
    verified drebrin. An app1 hit is not sufficient to correct the paper by inference.
    Supplementary strain and reporter provenance must establish the intended identity
    before an accession or a new family is assigned.
  evidence:
  - reference: DOI:10.1083/jcb.201502025
    notes: Actin-body Results attribute drebrin (Aap1) localization to Figure S5A.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: membership_is_contextual
  prompt: Do partial localizers establish a fixed actin-body composition?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: Membership strength differs between proteins and organisms; co-occurrence
    is not a stoichiometric reconstruction. Sac6 loss is pleiotropic. Scp1 perturbation
    does not establish Scp1 residence, and fission-yeast polarity proteins lost from
    cell tips are not thereby body constituents.
  evidence:
  - reference: DOI:10.1091/mbc.E06-04-0282
    notes: The localization screen distinguishes strict and partial overlap; Scp1-GFP
      is undetectable in stationary cells.
  - reference: DOI:10.1083/jcb.201502025
    notes: Figure 6 and Figure S5A distinguish body-localized proteins from displaced
      polarity markers.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
  resolution_note: Retain the directly observed partial localizers with explicit scope;
    omit whole Arp2/3-complex stoichiometry and essentiality claims. Do not add Scp1,
    Tea1, Exo70 or Sec8 as body components from the cited perturbation/polarity results.
- discussion_id: not_an_absolute_quiescence_marker
  prompt: Does an actin body uniquely identify a viable quiescent cell?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: The 2018 study followed individual cells rather than inferring fate from
    a stationary population. Bodies occurred in cells with different subsequent proliferation
    outcomes.
  evidence:
  - reference: DOI:10.7554/eLife.35685
    notes: Figure 5 and the cellular-reorganization Discussion explicitly reject an
      absolute quiescence fingerprint and report bodies in senescent and rho-zero
      cells.
  - reference: DOI:10.1128/MCB.00811-15
    notes: 'Only the readable primary abstract was used for context: dynamic patches/cables
      and static bodies occur in different stationary-phase subpopulations. Full text
      was not recovered through the attempted routes.'
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
  resolution_note: Keep the definition at growth-arrested yeast cells, restrict distribution
    to tested species and conditions, and assert neither universal quiescence diagnosis
    nor universal loss of viability.
- discussion_id: downstream_metabolic_signal
  prompt: Which metabolic signal connects glycolysis to actin-body disassembly?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Glucose-dependent mobilization requires metabolism, but ATP replenishment
    is neither necessary nor sufficient in the tested assays. This does not establish
    that basal ATP is dispensable or that pyruvate itself is the signal.
  evidence:
  - reference: DOI:10.1083/jcb.201009028
    notes: Glucose-catabolism Results and Figure 4 distinguish metabolic flux from
      ATP replenishment.
  posed_by: codex
  posed_date: '2026-10-05'
  attaches_to:
  - causal_graphs#glucose_metabolism_body_disassembly
