identifier: GO:1990612
label: Sad1-Kms1 LINC complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A LINC complex implicated in the connection of DNA double strand breaks
  to the cytoskeleton during DNA double-strand break repair. The canonical fission
  yeast (Schizosaccharomyces pombe) Linker of Nucleoskeleton and Cytoskeleton (LINC)
  complex spanning the inner and outer nuclear membranes, composed of the inner nuclear
  membrane SUN-domain protein Sad1 and the outer nuclear membrane KASH-domain protein
  Kms1 (and Kms2). During meiotic prophase, the Sad1–Kms1 LINC complex interacts with
  Bqt1–Bqt2 on the nucleoplasmic side and cytoplasmic dynein motors on the cytoplasmic
  side to gather telomeres to the spindle pole body and transmit microtubule forces
  across the nuclear envelope.
