    Results and Methods read. Live-cell and conditional-degradation evidence.
- reference: DOI:10.1016/j.cub.2020.01.054
  notes: 2020 study, PMID 32059771; native PMC7181386.1 Results, Discussion and imaging/spread
    Methods read. Alternative Csm4 interpretation and motor-association evidence retained
    with limits.
- reference: DOI:10.1038/s41467-025-56049-9
  notes: 2025 study, PMID 39833200; native PMC11747273.1 telocentrosome-recruitment
    and natural meiotic-entry Results read. Partial mitotic recruitment is distinct
    from complete bouquet formation.
- reference: DOI:10.1016/j.cell.2006.01.048
  notes: Chikashige et al. 2006, PMID 16615890; DOI/PMID and complete abstract read
