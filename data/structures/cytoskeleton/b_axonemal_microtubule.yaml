functions:
- function_id: b_tubule_doublet_scaffold
  label: B-tubule doublet scaffold
  description: The incomplete B axonemal microtubule contributes ten protofilaments
    to the axonemal outer-doublet wall and fuses with the A tubule at the inner and
    outer junctions.
  evidence:
  - reference: GO:0097650
    notes: GO defines the B axonemal microtubule as the incomplete 10-protofilament
      tubule of the axonemal outer doublet.
  - reference: DOI:10.1016/j.cell.2019.09.030
    notes: Ma et al. 2019 resolved the native Chlamydomonas doublet microtubule lattice,
      including B-tubule protofilaments and the inner- and outer-junction regions.
evidence:
