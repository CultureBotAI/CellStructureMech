  presence: VARIABLE
  note: Exhibits septin cytoskeleton (GO:0032156) in the cortical septin cytoskeleton
    network. Saccharomyces cerevisiae septin filament arrays occur at the prospore
    membrane during sporulation rather than throughout all vegetative and meiotic
    cell-cycle states.
  reference: GO:0032160
