identifier: GO:0032156
label: septin cytoskeleton
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: The part of the cytoskeleton (the internal framework of a cell) composed
  of septins and associated proteins. Includes septin cytoskeleton-associated complexes.
  The network of GTP-binding septin hetero-oligomeric rods (Cdc3–Cdc10–Cdc11–Cdc12–Shs1
  in Saccharomyces cerevisiae) and higher-order filaments, rings, collars, and gauzes
  associated with the inner face of the plasma membrane in yeasts, filamentous fungi,
  and green algae. The septin cytoskeleton acts as a cortical diffusion barrier and
  spatial scaffold that recruits cytokinetic, cell-wall-synthetic, and morphogenesis
  checkpoint proteins to the bud neck, hyphal branch sites, and prospore membranes.
