causal_graphs:
- graph_id: septin_cytoskeleton_mechanism
  title: Septin cytoskeleton cortical ring assembly and cytokinesis scaffolding
  description: Cdc42-guided recruitment and Elm1/Gin4 kinase phosphorylation remodel
    palindromic septin octamers into the higher-order rings and hourglass collars
    of the septin cytoskeleton, scaffolding the actomyosin ring and establishing a
    plasma-membrane diffusion barrier.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph records GO-backed septin-filament-array composition and
    example membrane contexts without asserting a species-specific filament-array
    recruitment mechanism.
