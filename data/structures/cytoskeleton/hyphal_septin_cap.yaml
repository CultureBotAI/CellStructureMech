discussions:
- discussion_id: hyphal_septin_cap_boundary
  prompt: Keep the hyphal septin cap distinct from the generic septin cap, the germ-tube
    cap, and septation-site septin rings.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032164 denotes the apical septin cap at the leading edge of filamentous
    fungal hyphae. GO:0032159 denotes the broader hyphal-or-germ-tube septin-cap class,
    GO:0032171 denotes the germ-tube cap sibling, and GO:0032168 denotes a ring-shaped
    septin structure at future hyphal septation sites.
  resolution_note: Curated GO:0032164 as the exact hyphal septin-cap structure, used
    GO:0032159 as its is-a parent, and kept germ-tube caps and hyphal septation-site
    rings outside this record.
  evidence:
  - reference: GO:0032164
    notes: GO:0032164 identifies the hypha-localized septin cap.
  - reference: GO:0032159
    notes: GO:0032159 identifies the broader septin cap.
  - reference: GO:0032171
    notes: GO:0032171 identifies the germ-tube septin cap.
  - reference: GO:0032168
    notes: GO:0032168 identifies the hyphal septation-site ring.
