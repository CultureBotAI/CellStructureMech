        Mto1 and enrich Mto1 toward SPB/NE sites without eliminating all nucleation.
  - subject: rsp1
    predicate: supports_lattice_localization_of
    object: mto2
    description: Rsp1 supports the normal distribution of Mto2-containing particles.
    evidence:
    - reference: DOI:10.1091/mbc.E18-05-0279
      notes: Mto2 particles become fewer and accumulate toward SPB/NE sites in rsp1-deleted
        cells.
  - subject: rsp1
    predicate: supports_lattice_localization_of
    object: gamma_tuc
    description: Rsp1 supports the normal distribution of Alp4-reported nucleation
      machinery.
    evidence:
    - reference: DOI:10.1091/mbc.E18-05-0279
      notes: Alp4 particles redistribute in rsp1-deleted cells; the reporter does
        not resolve every gamma-tubulin-complex subunit.
  - subject: mto1
    predicate: supports_lattice_localization_of
    object: rsp1
    description: Mto1 supports Rsp1 localization to microtubules, not its independent
      SPB pool.
    evidence:
    - reference: DOI:10.1091/mbc.E18-05-0279
      notes: mto1 deletion compromises lattice Rsp1 while SPB Rsp1 remains.
  - subject: high_rsp1
    predicate: reduces
    object: association
    description: Rsp1 overexpression reduces Mto1-Alp4 association in cell lysates.
    evidence:
    - reference: DOI:10.1091/mbc.E18-05-0279
      notes: Reciprocal co-IP under overexpression shows less associated Alp4/Mto1;
        this is not a purified dissociation-rate measurement.
  - subject: mto1
    predicate: supports
    object: association
    description: Intact Mto1 CM1 supports association with gamma-tubulin machinery.
    evidence:
    - reference: DOI:10.1016/j.cub.2014.03.006
      notes: The 9A1 mutation disrupts gamma-TuC association/nucleation in engineered
        constructs while punctum formation and targeting are separately tested.
  - subject: mto2
    predicate: supports
    object: association
    description: Mto2 supports Mto1-gamma-TuC association in the tested engineered
      context.
    evidence:
    - reference: DOI:10.1016/j.cub.2014.03.006
      notes: Mto1[bonsai] co-immunoprecipitation with gamma-TuC depends on Mto2.
  - subject: association
    predicate: supports
    object: nucleation
    description: Mto1/2-associated gamma-tubulin machinery supports microtubule initiation.
    evidence:
    - reference: DOI:10.1016/j.cub.2014.03.006
      notes: Nucleation from free Mto1[bonsai], Mto2, Alp4 and Alp6 puncta separates
        activation from normal-site targeting; native site geometry remains unresolved.
