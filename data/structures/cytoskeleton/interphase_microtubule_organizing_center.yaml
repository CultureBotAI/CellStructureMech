    notes: Alp7 localizes at NE regrowth foci, supports Mto1/Alp14 recruitment and
      itself depends on Mto1. Loss reduces, not universally abolishes, NE regrowth;
      lysate association is not purified direct binding.
  - reference: DOI:10.7554/eLife.33465
    notes: Alp7 is not required for NE targeting of the engineered Mto1[9A1-NE] reporter,
