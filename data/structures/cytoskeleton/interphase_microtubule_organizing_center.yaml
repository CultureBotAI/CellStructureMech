canonical_examples:
- taxon_id: NCBITaxon:4896
  taxon_label: Schizosaccharomyces pombe
  reference: DOI:10.7554/eLife.33465
  note: Non-SPB interphase nucleation sites studied by live imaging and perturbation.
    NE recovery, engineered docking reporters and steady-state lattice-associated
    sites are distinguished; no fungal-wide frequency or invariant stock is inferred.
functions:
- function_id: nucleation
  label: microtubule nucleation by interphase microtubule organizing center
  grounding: GO:0051415
  description: Organizes non-SPB interphase microtubule initiation; the contributions
    of NE and microtubule-associated sites vary with experimental conditions.
  evidence:
  - reference: DOI:10.7554/eLife.33465
    notes: Nup146 FG-repeat perturbation changes NE-region nucleation and full-length-Mto1
      cold regrowth without abolishing cytoplasmic nucleation.
  - reference: DOI:10.1091/mbc.E18-05-0279
    notes: Time-lapse imaging measures new non-SPB microtubules on pre-existing microtubules,
      with residual events after rsp1 deletion.
- function_id: organization
  label: microtubule cytoskeleton organization
  grounding: GO:0000226
  description: Spatially organizes the interphase microtubule system by positioning
    nucleation machinery and maintaining dynamic nucleation-site distributions.
  evidence:
  - reference: DOI:10.1091/mbc.E18-05-0279
    notes: Rsp1 perturbations redistribute Mto1/Mto2/Alp4 and alter the organization
      of interphase arrays.
  - reference: DOI:10.1093/jmcb/mjz038
    notes: NE enrichment and partial forced-targeting rescue link local Mto1 accumulation
      to regrowth organization.
causal_graphs:
- graph_id: ne_docking
  title: Nuclear-pore docking supports a nuclear-envelope iMTOC
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  description: Site-specific S. pombe dependencies, not universal iMTOC composition.
    The 9A1-NE reporter resolves docking but cannot nucleate. Separate active Mto1[NE]
    and full-length cold-regrowth assays connect docking to output. RanGTP dependence
    does not prove physical Ran membership, and crosslink-MS does not resolve direct
    interfaces.
  scope_notes: Site-specific S. pombe dependencies, not universal iMTOC composition.
    The 9A1-NE reporter resolves docking but cannot nucleate. Separate active Mto1[NE]
    and full-length cold-regrowth assays connect docking to output. RanGTP dependence
    does not prove physical Ran membership, and crosslink-MS does not resolve direct
    interfaces.
  nodes:
  - node_id: mto1
    label: Mto1-like microtubule nucleation adaptor
    node_type: GENE_OR_PROTEIN
    component_ref: mto1
  - node_id: crm1
    label: Crm1 exportin
    node_type: GENE_OR_PROTEIN
  - node_id: ran_gtp
    label: RanGTP-dependent state
    node_type: STATE
  - node_id: nup146
    label: Nup146 with intact FG5-12 region
    node_type: GENE_OR_PROTEIN
  - node_id: docked_mto1
    label: Mto1 docked at the cytoplasmic NPC face
    node_type: STATE
  - node_id: imtoc
    label: interphase microtubule organizing center
    node_type: STRUCTURE
    grounding: GO:0031021
    description: Nuclear-envelope-associated interphase MTOC; the graph concerns NPC
      docking rather than every interphase site.
  - node_id: nucleation
    label: microtubule nucleation by interphase microtubule organizing center
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0051415
    description: Interphase microtubule nucleation from the NE-region organizing site
      in the specified docking/nucleation assays.
  edges:
  - subject: mto1
    predicate: supports
    object: docked_mto1
    description: The Mto1 N-terminal NES mimic supports NPC targeting; the short reporter
      requires its dimerizing fusion context.
    evidence:
    - reference: DOI:10.7554/eLife.33465
      notes: NES deletion disrupts localization and Crm1 association; GFP-Mto1[1-29]-GST
        targets NPCs whereas the monomeric comparison does not.
  - subject: crm1
    predicate: supports
    object: docked_mto1
    description: Crm1 cargo-binding competence supports Mto1 reporter docking.
    evidence:
    - reference: DOI:10.7554/eLife.33465
      notes: LMB displaces Mto1[9A1-NE]; the resistant crm1-C529A allele retains docking
        under LMB.
  - subject: ran_gtp
    predicate: supports
    object: docked_mto1
    description: A RanGTP-dependent state supports reporter docking without demonstrating
      a resident Ran subunit.
    evidence:
    - reference: DOI:10.7554/eLife.33465
      notes: Dominant-negative Spi1[T23N], but not the tested active Spi1[Q68L], disrupts
        targeting; Ran was not enriched in the comparative interactome.
  - subject: nup146
    predicate: supports
    object: docked_mto1
    description: Nup146 FG repeats 5-12 support Mto1 docking at NPCs.
    evidence:
    - reference: DOI:10.7554/eLife.33465
      notes: Deleting the repeat segment abolishes 9A1-NE reporter docking while the
        mutant nucleoporin remains at NPCs.
  - subject: docked_mto1
    predicate: positions
    object: imtoc
    description: NPC docking positions the NE-associated organizing site when nucleation-competent
      machinery is present.
    evidence:
    - reference: DOI:10.7554/eLife.33465
      notes: The model is supported by distinct docking and nucleation assays; an
        inactive 9A1-NE punctum alone is not a complete functional iMTOC.
  - subject: imtoc
    predicate: supports
    object: nucleation
    description: The NE-associated site supports interphase microtubule initiation.
    evidence:
    - reference: DOI:10.7554/eLife.33465
      notes: Nup146 FG5-12 deletion reduces steady-state NE-region nucleation with
        Mto1[NE] and redirects full-length-Mto1 cold regrowth into the cytoplasm.
- graph_id: ne_recovery
  title: Alp7-Mto1 recruitment and Alp14-supported recovery
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  description: Full-length proteins in S. pombe recovering from MBC, not a purified
    three-protein reaction or normal-state rate measurement. Residual stubs and SPB
    regrowth remain possible. Recruitment is reciprocal; partial Nup45-GBP rescue
    is not autonomous sufficiency, and Alp14 deletion does not abolish initial short
    regrowth.
  scope_notes: Full-length proteins in S. pombe recovering from MBC, not a purified
    three-protein reaction or normal-state rate measurement. Residual stubs and SPB
    regrowth remain possible. Recruitment is reciprocal; partial Nup45-GBP rescue
    is not autonomous sufficiency, and Alp14 deletion does not abolish initial short
    regrowth.
