identifier: GO:0031021
label: interphase microtubule organizing center
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A microtubule organizing center found in interphase cells, which organize
  a longitudinal array of three to five MT bundles from the nuclear envelope during
  interphase. Each MT bundle is composed of two to seven MTs arranged in an antiparallel
  configuration, with the dynamic MT plus ends extending toward the cell tips and
  stable minus ends near the nucleus.
