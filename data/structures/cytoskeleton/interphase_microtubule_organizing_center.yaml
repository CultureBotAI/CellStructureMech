- component_id: rsp1
  label: Rsp1-like DnaJ-related cochaperone
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  essentiality: DISPENSABLE
  role: Dynamically associated machinery regulating Mto1 distribution among interphase
    sites; effects depend on site and dosage.
  grounding_notes: DnaJ domain/site/superfamily matches and broad family IPR051964
    do not exactly denote this Rsp1-like class; a broad family description is not
    functional or localization evidence.
  gene_symbols:
  - rsp1
  evidence:
  - reference: DOI:10.1091/mbc.E18-05-0279
    notes: Endogenous Rsp1 partly colocalizes with Mto1 on microtubules. rsp1 deletion
      leaves residual newly formed non-SPB microtubules and NE-associated Mto1/Mto2/Alp4,
      despite major redistribution defects.
  - reference: DOI:10.1126/sciadv.adq0670
    notes: Klp2-dependent lattice delivery and Rsp1-Ssa1 regulation of Mto1-Mto2/gamma-TuSC
      association are site-specific; Klp2 loss does not eliminate every cellular Rsp1
      pool.
