    interphase sites; nuclear-envelope docking is one site-specific mechanism.
  grounding_notes: O94488 has CM1 and Mto2-binding domains, not an exact integrated
    whole-protein family. The mitochondrial MTO1 homonym is a different protein.
  gene_symbols:
  - mto1
  evidence:
  - reference: DOI:10.7554/eLife.33465
    notes: Nuclear-pore docking was dissected with engineered Mto1 reporters and tested
      functionally with separate full-length cold-regrowth assays.
  - reference: DOI:10.1093/jmcb/mjz038
    notes: Mto1 and Alp7 show reciprocal NE localization dependencies during MBC recovery;
      mto1 deletion eliminates most non-SPB NE regrowth.
  - reference: DOI:10.1016/j.cub.2014.03.006
