- component_id: alp7
  label: Alp7-like microtubule-associated protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: TACC-like resident supporting NE enrichment of full-length Mto1 and Alp14
    during microtubule recovery.
  grounding_notes: Q9URY2 matches the fungal TACC C-terminal domain IPR024312, not
    an exact whole-protein family for this Alp7-like class.
