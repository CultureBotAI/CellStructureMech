discussions:
- discussion_id: identity_and_sites
  prompt: Distinguish the organizing center from its arrays and site-specific mechanisms.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  rationale: GO retains a historical NE-oriented definition with bundle counts. Modern
    S. pombe papers also call microtubule-associated sites iMTOCs. This record follows
    that named non-SPB interphase organizing entity, not every interphase centrosome,
    the whole output bundle, eMTOC or nuclear pore. No universal NPC/NE parthood or
    count is asserted.
  evidence:
  - reference: GO:0031021
    notes: Exact identity and definition.
  - reference: DOI:10.1091/mbc.E18-05-0279
    notes: Explicitly distinguishes SPB, NE and pre-existing-microtubule sites.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Preserve these distinctions in the curated record.
  resolved_date: '2026-10-06'
- discussion_id: native_assembly
  prompt: Resolve native site architecture and assembly essentiality.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - record
  rationale: Co-localization and engineered nucleation puncta do not establish invariant
    stoichiometry or a universal gamma-tubulin-ring geometry. Core assembly essentialities
    remain UNKNOWN rather than being inferred from cell viability or activity. Rsp1
    is DISPENSABLE associated machinery because deletion retains newly formed non-SPB
    microtubules and NE-associated organizing components, despite major defects.
  evidence:
  - reference: DOI:10.1016/j.cub.2014.03.006
    notes: Copy estimates and targeting separation concern engineered constructs.
  - reference: DOI:10.1091/mbc.E18-05-0279
    notes: Residual new non-SPB events and NE-associated components remain in rsp1
      deletion.
  posed_by: codex
  posed_date: '2026-10-06'
- discussion_id: grounding_scope
  prompt: Find exact source-neutral families for the label-only classes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#mto1
  - components#mto2
  - components#alp7
  - components#rsp1
  rationale: Mto1 and Alp7 matches are domains; Mto2's native InterPro endpoint returns
    no content. Rsp1's broad family IPR051964 is not exactly the narrow Rsp1-like
    class. XMAP215 family membership alone cannot establish residence of every member,
    including Dis1.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/O94488/
    notes: Complete native match set inspected.
  - reference: https://www.uniprot.org/uniprotkb/Q9USP7/entry
    notes: Reviewed identity verified.
  - reference: https://www.uniprot.org/uniprotkb/Q9URY2/entry
    notes: Reviewed identity verified.
  - reference: https://www.uniprot.org/uniprotkb/O13601/entry
    notes: Reviewed identity verified.
  posed_by: codex
  posed_date: '2026-10-06'
- discussion_id: docking_boundary
  prompt: Keep site-specific docking factors separate from invariant core composition.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#ne_docking
  rationale: Crm1 and Nup146 are demonstrated NE docking machinery, not evidence for
    the same composition at all iMTOCs; they remain explicit graph context rather
    than universal components. RanGTP is functionally required in the docking assay
    but was not enriched with NE-targeted Mto1, so physical membership is unresolved.
    Nup82/Nsp1 mass-spectrometry enrichment does not establish universal residence.
    No direct purified interface, high-affinity NES constant or cargo-handover reaction
    is asserted.
  evidence:
  - reference: DOI:10.7554/eLife.33465
    notes: The Discussion explicitly distinguishes demonstrated docking dependencies
      from high-affinity, handover and Ran-membership models.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Preserve these distinctions in the curated record.
  resolved_date: '2026-10-06'
- discussion_id: recovery_vs_steady_state
  prompt: Do not convert recovery assays into normal-state rates or strict de novo
    counts.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#ne_recovery
  rationale: High-dose MBC can leave residual stubs; NE-only time-course selection
    and drug-induced redistribution limit rate comparisons. Alp14 loss retains short
    regrowth, and Alp7 loss shifts rather than universally abolishes output. Nup45-GBP
    tethering is engineered and only partially restores numbers. An Alp7-Mto1-Alp14
    assembly is a proposed working model, not a purified stoichiometric complex.
  evidence:
  - reference: DOI:10.1093/jmcb/mjz038
    notes: Main Results, Discussion and Methods preserve these assay limits.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Preserve these distinctions in the curated record.
  resolved_date: '2026-10-06'
- discussion_id: alp7_construct_difference
  prompt: Retain the difference between full-length and 9A1-NE Mto1 targeting.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#alp7
  - causal_graphs#ne_docking
  - causal_graphs#ne_recovery
  rationale: Alp7 supports NE localization of full-length Mto1 during MBC recovery,
    but is not required for localization of Mto1[9A1-NE] in the docking study. Different-region
    binding is a proposed reconciliation, not an experimentally resolved combined
    pathway.
  evidence:
  - reference: DOI:10.1093/jmcb/mjz038
    notes: The Discussion explicitly compares the two constructs.
  - reference: DOI:10.7554/eLife.33465
    notes: Figure1 supplement3 tests Alp7 independence of the engineered reporter.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Preserve these distinctions in the curated record.
  resolved_date: '2026-10-06'
- discussion_id: rsp1_site_and_dose
  prompt: Separate whole-cell Rsp1 loss from lattice-specific delivery and biochemical
    models.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#rsp1
  - causal_graphs#site_regulation
  rationale: Rsp1 deletion redistributes Mto1 and leaves residual nucleation. Klp2
    deletion instead removes much lattice Rsp1 while retaining SPB Rsp1 and does not
    detectably change NE/cytoplasmic nucleation in the later study. Purified Klp2-Rsp1
    transport and Rsp1-Ssa1 effects on Mto1-Mto2/gamma-TuSC association support site-specific
    regulation, not invariant Klp2/Ssa1 membership. The 2018 turnover/affinity/size-control
    alternatives are not all resolved by those later assays. Whole-cell concentrations
    are not MTOC stoichiometry.
  evidence:
  - reference: DOI:10.1091/mbc.E18-05-0279
    notes: Partial colocalization, deletion, truncation and dosage experiments.
  - reference: DOI:10.1126/sciadv.adq0670
    notes: Later transport and purified-complex evidence; detailed supplementary purification
      protocols were not read.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Preserve these distinctions in the curated record.
  resolved_date: '2026-10-06'
- discussion_id: taxon_and_access
  prompt: Extend taxonomic and native structural evidence without importing inaccessible
    details.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - record
  rationale: The direct mechanistic exemplar is S. pombe, not a fungal-wide presence
    frequency. Reference-sequence taxa do not identify every experimental strain.
    Detailed supplementary files and raw PRIDE datasets were not analyzed. The 2004
    definition-linked source was read only as an abstract; it does not support uninspected
    quantitative or direct-binding claims.
  evidence:
  - reference: DOI:10.7554/eLife.33465
    notes: S. pombe experiments and primary source.
  - reference: DOI:10.1016/s1534-5807(04)00096-6
    notes: Accessible primary abstract only.
  posed_by: codex
  posed_date: '2026-10-06'
