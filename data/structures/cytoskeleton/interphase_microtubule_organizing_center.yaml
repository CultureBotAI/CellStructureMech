  - node_id: regrowth
    label: Microtubule regrowth after MBC washout
    node_type: BIOLOGICAL_PROCESS
  - node_id: elongation
    label: Efficient elongation of recovering microtubules
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: alp7
    predicate: promotes_recruitment_of
    object: mto1
    description: Alp7 supports enrichment of full-length Mto1 at non-SPB NE sites
      after depolymerization.
    evidence:
    - reference: DOI:10.1093/jmcb/mjz038
      notes: alp7 deletion strongly reduces NE Mto1 and shifts it toward cytoplasmic
        structures; the remaining large NE focus overlaps the SPB marker.
  - subject: mto1
    predicate: promotes_recruitment_of
    object: alp7
    description: Mto1 supports Alp7 accumulation at the NE.
    evidence:
    - reference: DOI:10.1093/jmcb/mjz038
      notes: mto1 deletion removes the NE localization of Alp7 in the examined treated
        and untreated cells.
  - subject: alp7
    predicate: promotes_recruitment_of
    object: xmap215
    description: Alp7 recruits the demonstrated XMAP215-family member Alp14 to the
      NE during recovery.
    evidence:
    - reference: DOI:10.1093/jmcb/mjz038
      notes: Alp14 NE localization is lost in alp7-deleted cells, while Alp7 can remain
        NE-associated without Alp14.
  - subject: mto1
    predicate: supports
    object: imtoc
    description: NE-localized Mto1 supports the recovering non-SPB organizing site.
    evidence:
    - reference: DOI:10.1093/jmcb/mjz038
      notes: Deleting mto1 removes most NE regrowth; Nup45-GBP tethering of Mto1 in
        alp7-deleted cells gives only partial rescue.
  - subject: alp7
    predicate: supports
    object: imtoc
    description: Alp7 supports NE-site recruitment and efficient recovery, not every
      possible initial event.
    evidence:
    - reference: DOI:10.1093/jmcb/mjz038
      notes: alp7 deletion reduces NE output and delays regrowth; residual events
        remain.
  - subject: imtoc
    predicate: supports
    object: regrowth
    description: NE organizing sites support rapid recovery-associated microtubule
      growth.
    evidence:
    - reference: DOI:10.1093/jmcb/mjz038
      notes: Live imaging follows growth from NE Mto1/Alp7 foci after MBC washout;
        not every event can be asserted to be de novo because stubs can remain.
  - subject: xmap215
    predicate: promotes
    object: elongation
    description: Alp14 supports efficient elongation of the recovering microtubules.
    evidence:
    - reference: DOI:10.1093/jmcb/mjz038
      notes: alp14-deleted cells retain initial short NE microtubules with elongation
        defects and delayed first-visible growth.
