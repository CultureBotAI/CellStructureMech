- component_id: ase1
  label: Microtubule-associated protein, MAP65/Ase1/PRC1
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: DISPENSABLE
  role: Resident microtubule crosslinker; Ase1 contributes to bundle thickness but
    is not required for a bundle to form in the tested deletion. Functions within
