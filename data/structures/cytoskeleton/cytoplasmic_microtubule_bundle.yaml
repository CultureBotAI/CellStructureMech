- component_id: mto1
  label: Mto1-like microtubule nucleation adaptor
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Retained bundle-associated nucleation adaptor; required for the bona fide
    stable bundle in the tested S. pombe conditions. Functions within the crosslinked
    cytoplasmic microtubule bundle.
  evidence:
  - reference: DOI:10.1083/jcb.201502025
