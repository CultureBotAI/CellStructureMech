identifier: GO:1905720
label: cytoplasmic microtubule bundle
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A microtubule bundle located in the cytoplasm. In fission yeast (Schizosaccharomyces
  pombe) and other microbial eukaryotes, cytoplasmic microtubule bundles consist of
  parallel or antiparallel alpha/beta-tubulin polymers nucleated by gamma-tubulin
  adaptor complexes (Mto1-Mto2) and crosslinked by Ase1/MAP65 family proteins and
  CLASP (Cls1/Peg1) to maintain cytoplasmic organization and cell-tip polarity.
definition_source: GO:1905720
mapping_status: PROPOSED
