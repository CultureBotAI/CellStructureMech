identifier: GO:0000144
label: cellular bud neck septin ring
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A ring-shaped structure that forms at the site of cytokinesis in the bud
  neck of a budding cell; composed of members of the conserved family of filament
  forming proteins called septins as well as septin-associated proteins. In S. cerevisiae,
  this structure forms at the time of bud emergence and the septins show a high rate
  of exchange.
