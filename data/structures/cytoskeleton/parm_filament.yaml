discussions:
- discussion_id: resolve_parm_family_grounding
  prompt: Resolve exact source-neutral grounding for plasmid-encoded filament-forming
    ParM proteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#parm
  rationale: This first record curates ParM from the R1 plasmid partition system without
    asserting that a broad actin-like ATPase family accession exactly denotes ParM
    filament-forming proteins.
  evidence:
  - reference: DOI:10.1038/nrmicro2425
    notes: Salje et al. 2010 reviewed ParMRC plasmid segregation by actin-like ParM
      filaments.
  posed_by: codex
  posed_date: '2026-09-11'
- discussion_id: exclude_parr_parc_from_filament_components
  prompt: ParR and parC stabilize ParM filament ends but are outside the ParM filament
    constituent boundary.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#parm
  rationale: ParR bound to the parC plasmid centromere captures and stabilizes ParM
    filament ends in the partition spindle, but ParR and parC are not subunits of
    the ParM polymer itself.
  evidence:
  - reference: DOI:10.1126/science.1229091
    notes: Gayathri et al. 2012 reconstituted segregation using ParM filaments attached
      to ParR/parC-coated beads.
  posed_by: codex
  posed_date: '2026-09-11'
