components:
- component_id: parm
  label: ParM
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - parM
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for plasmid-encoded ParM actin-like
    proteins was verified in this pass.
  role: Plasmid-encoded actin-like ATPase subunit that polymerizes into the dynamically
    unstable filaments of the ParMRC partition system.
  evidence:
  - reference: DOI:10.1093/emboj/cdf320
    notes: Moller-Jensen et al. 2002 identified R1 plasmid ParM as the actin-like
      protein forming filaments for active plasmid segregation.
  - reference: DOI:10.1126/science.1101313
    notes: Garner et al. 2004 showed that purified ParM filaments undergo dynamic
      instability in vitro.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Actin-like ParM partition filaments are plasmid-encoded bacterial systems
    and are not asserted to be universal across Bacteria.
  reference: DOI:10.1038/nrmicro2425
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Host species for the low-copy-number R1 plasmid whose ParMRC partition system
    defined ParM filament-driven plasmid segregation.
  reference: DOI:10.1093/emboj/cdf320
functions:
- function_id: r1_plasmid_segregation
  label: R1 plasmid segregation
  description: ParM filaments elongate between ParR-parC complexes on paired R1 plasmids
    to move sister plasmids apart before host-cell division.
  evidence:
  - reference: DOI:10.1093/emboj/cdf320
    notes: Moller-Jensen et al. 2002 connected ParM filament assembly to active segregation
      of the R1 plasmid.
  - reference: DOI:10.1126/science.1229091
    notes: Gayathri et al. 2012 reconstituted the antiparallel ParM filament spindle
      that drives plasmid segregation.
evidence:
- reference: DOI:10.1093/emboj/cdf320
  notes: Moller-Jensen, Jensen, Lowe and Gerdes 2002, 'Prokaryotic DNA segregation
    by an actin-like filament', EMBO Journal.
- reference: DOI:10.1126/science.1101313
  notes: Garner, Campbell and Mullins 2004, 'Dynamic instability in a DNA-segregating
    prokaryotic actin homolog', Science.
- reference: DOI:10.1126/science.1229091
  notes: Gayathri, Fujii, Moller-Jensen, van den Ent, Namba and Lowe 2012, 'A bipolar
    spindle of antiparallel ParM filaments drives bacterial plasmid segregation',
    Science.
- reference: DOI:10.1038/nature14356
  notes: Bharat, Murshudov, Sachse and Lowe 2015, 'Structures of actin-like ParM filaments
    show architecture of plasmid-segregating spindles', Nature.
- reference: DOI:10.1038/nrmicro2425
  notes: 'Salje, Gayathri and Lowe 2010, ''The ParMRC system: molecular mechanisms
    of plasmid segregation by actin-like filaments'', Nature Reviews Microbiology.'
causal_graphs:
- graph_id: parmrc_plasmid_segregation
  title: ParM filaments separate R1 plasmids
  description: ParM polymerizes into an actin-like filament that is captured by ParR-parC
    complexes on R1 plasmids; stabilized filament elongation pushes paired plasmids
    apart.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the minimal ParM filament polymerization and plasmid-segregation
    path without modeling ParR-parC nucleation, filament dynamic instability, or antiparallel
    spindle geometry.
