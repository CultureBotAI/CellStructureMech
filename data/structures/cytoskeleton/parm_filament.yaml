identifier: cellstructuremech:parm_filament
label: ParM filament
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A plasmid-encoded bacterial actin-like cytoskeletal filament assembled
  from ParM that elongates between ParR-parC plasmid-centromere complexes and drives
  active segregation of low-copy-number plasmids such as Escherichia coli R1.
definition_source: DOI:10.1093/emboj/cdf320
mapping_status: PROPOSED
