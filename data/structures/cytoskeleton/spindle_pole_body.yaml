functions:
- function_id: microtubule_organization
  label: microtubule organization
  description: The SPB nucleates and organizes nuclear and cytoplasmic microtubules
    in budding yeast.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the SPB as the budding-yeast microtubule
      organizing center.
- function_id: bipolar_spindle_assembly
  label: bipolar spindle assembly
  description: SPB duplication and separation generate the two organizing centers
    that build a bipolar mitotic spindle.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed SPB duplication and mitotic-spindle assembly.
evidence:
- reference: GO:0005816
  notes: Gene Ontology cellular-component term for spindle pole body, with SPB as
    an exact synonym.
- reference: DOI:10.1146/annurev.cellbio.20.022003.114106
  notes: 'Jaspersen and Winey 2004, The budding yeast spindle pole body: structure,
    duplication, and function, Annual Review of Cell and Developmental Biology.'
- reference: DOI:10.1091/mbc.E17-06-0397
  notes: Viswanath et al. 2017, The molecular architecture of the yeast spindle pole
    body core determined by Bayesian integrative modeling, Molecular Biology of the
    Cell.
causal_graphs:
- graph_id: spb_duplication_to_spindle_assembly
  title: SPB duplication creates two spindle organizers
  description: A new SPB assembles next to the old SPB, matures as it is inserted
    into the nuclear envelope, and the duplicated pair separates to organize a bipolar
    spindle.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  nodes:
  - node_id: old_spb
    label: old spindle pole body
    node_type: ORGANELLE
  - node_id: new_spb
    label: new spindle pole body
    node_type: ORGANELLE
  - node_id: bipolar_spindle
    label: bipolar mitotic spindle
    node_type: STRUCTURE
  edges:
  - subject: old_spb
    predicate: templates assembly of
    object: new_spb
    description: Budding-yeast SPB duplication begins at the half-bridge adjacent
      to the existing SPB.
    evidence:
    - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
      notes: Jaspersen and Winey 2004 reviewed the half-bridge-associated pathway
        for SPB duplication.
  - subject: new_spb
    predicate: helps organize
    object: bipolar_spindle
    description: The duplicated SPB separates from the old SPB to provide the second
      pole of the mitotic spindle.
    evidence:
    - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
      notes: Jaspersen and Winey 2004 reviewed SPB duplication and separation before
        budding-yeast spindle assembly.
