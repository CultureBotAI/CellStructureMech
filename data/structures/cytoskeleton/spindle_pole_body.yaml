components:
- component_id: spindle_pole_body_core_proteins
  label: spindle pole body core proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  role: Multilayered scaffold proteins that build the central yeast spindle pole body
    core and organize cytoplasmic and nuclear microtubule nucleation sites.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the layered Saccharomyces cerevisiae
      SPB and its core plaque components.
  - reference: DOI:10.1091/mbc.E17-06-0397
    notes: Viswanath et al. 2017 determined an integrative molecular architecture
      for the budding-yeast SPB core.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The SPB core is a native fungal assembly containing several unrelated
    scaffold families; no single source-neutral family or complex identifier denotes
    the aggregate.
- component_id: gamma_tubulin_complexes
  label: gamma-tubulin complexes
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  role: Microtubule-nucleating complexes associated with SPB inner and outer plaques.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed gamma-tubulin complex placement at budding-yeast
      SPB plaques.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact fungal gamma-tubulin small-complex or plaque-bound gamma-tubulin
    ring-complex identifier was assigned in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
