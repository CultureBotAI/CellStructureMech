identifier: cellstructuremech:cryptophyte_cortical_centrin_network
label: cryptophyte cortical centrin network
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A peripheral centrin-positive cytoskeletal network observed in cryptophyte
  cells by ultrastructure expansion microscopy. It forms a regular hexagonal mesh
  in Rhinomonas nottbeckii and shows variable network patterns among Rhodomonas isolates.
  The assembly is distinct from basal-body-associated centrin structures and from
  the periplast itself.
definition_source: DOI:10.1016/j.cell.2025.09.027
mapping_status: PROPOSED
