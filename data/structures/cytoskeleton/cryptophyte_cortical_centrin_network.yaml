components:
- component_id: centrin
  label: Centrin
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro centrin search and the IPR050145 entry were reviewed.
    Centrin/CML-like includes caltractin, obelin and plant CML proteins, so it is
    broader than the centrin component identified here. EF-hand domains, pericentrin
    and centrin-binding SFI1 families are not exact centrin groundings. No exact source-neutral
    family accession is asserted.
  essentiality: UNKNOWN
  role: Centrin-family material detected along the peripheral network using the broad-specificity
    20H5 antibody after expansion. Immunolocalization supports membership, not an
    exact paralogue inventory or an assembly requirement.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Centrin Results and Figure 3D-F identify centrin-positive cortical networks
      in Rhinomonas and Rhodomonas; the study uses antibody 20H5.
canonical_examples:
- taxon_id: NCBITaxon:1326783
  taxon_label: Rhinomonas nottbeckii
  reference: DOI:10.1016/j.cell.2025.09.027
  note: RCC6444, also listed as K-1855 in Table S1, was examined by fixed-cell U-ExM.
    Figure 3D-F and S2 show the cortical network and hexagonal pattern. The source
    uses Rhinomonas nottbecki, an explicit synonym of the verified NCBI/ENA canonical
    name Rhinomonas nottbeckii. Table S1 List of Species row 76 identifies RCC6444;
    Dataset Annotation row 382 marks cortical centrin in one-species interphase material.
- taxon_id: NCBITaxon:37096
  taxon_label: Rhodomonas
  reference: DOI:10.1016/j.cell.2025.09.027
  note: Genus-level identification of cultured BMCC67 and RCC10777 (other code Q1-11),
    not an assertion for every species in the genus. Table S1 List of Species rows
    69 and 73 identifies the cultures; Dataset Annotation rows 402 and 412 mark cortical
    centrin in one-species interphase material. Figure 3D-E and S2 illustrate Rhodomonas
    networks, but an exact figure-panel-to-isolate mapping was not established.
evidence:
- reference: DOI:10.1016/j.cell.2025.09.027
  notes: Mikus et al. (2025), Charting the landscape of cytoskeletal diversity in
    microbial eukaryotes, Cell. Read centrin Results, Figure 3 and S2 legends, fixation,
    U-ExM, microscopy and image-analysis Methods. The authors distinguish the cryptophyte
    cortical network from ciliate basal-body-associated networks and describe variable
    mesh morphology, not a demonstrated physiological function.
- reference: https://www.dudinlab.com/s/Table-S1.xlsx
  notes: Author-linked Table S1 read as structured workbook data. List of Species
    rows 69, 73 and 76 identify BMCC67, RCC10777 and RCC6444. Dataset Annotation rows
    402, 412 and 382 respectively mark cortical centrin in column AK. Image annotations
    are not independent-cell counts or clade prevalence estimates.
- reference: GO:0005622
  notes: Verified non-obsolete intracellular anatomical structure; broad is-a parent
    for the intracellular network without claiming a membrane or single resolved polymer
    lattice.
- reference: GO:0005856
  notes: Verified non-obsolete cytoskeleton. This cortical centrin assembly is part
    of the cellular cytoskeleton, not equivalent to its entire framework.
