discussions:
- discussion_id: identity_and_ontology_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish this cortical network from centrin proteins and other centrin
    assemblies.
  rationale: Shared antibody reactivity and superficial mesh geometry do not establish
    identity or homology between different subcellular assemblies.
  notes: Hidden- and ignored-inclusive repository searches for the label, source,
    cultures and obvious aliases found no matching record. QuickGO searches for cryptophyte
    centrin, centrin network and cortical centrin returned no exact term. The ciliary
    centrin arm GO:0120269 is a different rod-shaped assembly. GO:0020038 subpellicular
    network requires a mechanically stable pellicle-associated structure surrounding
    microtubules, not established here. The cryptophyte network is not equated to
    ciliate infraciliary lattices, periplast plates, nuclear baskets or flagellar
    rootlets. OTHER kind avoids asserting a single filament or a resolved multiprotein-complex
    composition.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Centrin Results, Figure 3D-F, Figure S2 and associated Methods were read
      directly.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: centrin_family_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve an exact source-neutral centrin family and the network paralogues.
  rationale: Broad antibody specificity cannot identify every gene product, and a
    broader calcium-binding family must not be promoted to exact centrin identity.
  notes: IPR050145 Centrin/CML-like also contains obelin and plant CML proteins. The
    centrin component therefore remains reviewed-label-only; no species-specific UniProt
    accession, centrin subtype, stoichiometry or assembly essentiality is inferred.
  evidence:
  - reference: InterPro:IPR050145
    notes: InterPro API verified family identity and its broader membership.
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: 20H5 immunolabeling establishes the centrin-positive network.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: neighboring_signals_and_periplast_boundary
  kind: CURATION_TODO
  status: OPEN
  prompt: Keep neighboring labeled structures separate and resolve the network-periplast
    relationship.
  rationale: Colocalization within a whole-cell figure does not make every signal
    a network constituent.
  notes: Tubulin, DNA, centrin at the basal bodies, and centrin along the gullet or
    furrow are shown separately and are not added as cortical-network components.
    The authors propose that the hexagonal mesh lies beneath the periplast; direct
    attachment or periplast parthood was not demonstrated. No SFI1 scaffold is inferred
    from other centrin systems. These omissions are evidence boundaries, not biological
    absence claims.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Centrin Results, Figure 3D-F, Figure S2 and associated Methods were read
      directly.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: morphology_and_taxonomic_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Determine network diversity and prevalence using comparable labeling across
    cultures.
  rationale: Sampling and antigen detection constrain distribution claims, while geometry
    observed in one culture need not define every cryptophyte network.
  notes: The regular hexagonal mesh is documented in Rhinomonas nottbeckii. The source
    also describes open-ringed or diffuse Rhodomonas patterns and rings in Urgorri.
    No detectable peripheral signal in Cryptomonas curvata is not encoded as biological
    absence. No universal cryptophyte presence, universal hexagonal topology or taxonomic_distribution
    prevalence row is asserted.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Centrin Results, Figure 3D-F, Figure S2 and associated Methods were read
      directly.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: physiological_function
  kind: CURATION_TODO
  status: OPEN
  prompt: Test contraction, calcium responses, mechanical roles and assembly dynamics.
  rationale: Fixed-cell morphology and generic centrin biology do not demonstrate
    a network-level physiological mechanism.
  notes: No function, trait or causal graph is asserted. In particular, proposed ejectosome-release
    involvement concerns centrin along the gullet/furrow and does not establish that
    the cortical network drives release. Roles inferred for striated rootlets or ciliate
    lattices are not transferred to this network.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Centrin Results, Figure 3D-F, Figure S2 and associated Methods were read
      directly.
  posed_by: codex
  posed_date: '2026-10-03'
