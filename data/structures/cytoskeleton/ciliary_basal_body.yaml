identifier: GO:0036064
label: ciliary basal body
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A membrane-tethered, short cylindrical array of microtubules and associated
  proteins found at the base of a eukaryotic cilium or flagellum that derives from
  a centriole, anchors the cilium and nucleates axonemal microtubule growth.
definition_source: GO:0036064
