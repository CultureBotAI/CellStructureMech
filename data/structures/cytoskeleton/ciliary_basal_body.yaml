  title: The cartwheel organizes the triplet microtubule cylinder
  description: A proximal cartwheel organizes ninefold basal-body symmetry, nine triplet
    microtubule blades form the basal-body cylinder, and the assembled basal body
    anchors the cilium and nucleates axonemal microtubules.
