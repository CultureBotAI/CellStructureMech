components:
- component_id: tubz
  label: TubZ
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tubZ
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for plasmid-encoded filament-forming
    TubZ GTPases was verified in this pass.
  role: Plasmid-encoded tubulin/FtsZ-family GTPase that polymerizes into dynamic filaments
    for pBtoxis plasmid partitioning.
  evidence:
  - reference: DOI:10.1101/gad.1546107
    notes: Larsen et al. 2007 characterized Bacillus thuringiensis pBtoxis TubZ as
      a prokaryotic tubulin-like protein that treadmills and is required for plasmid
      stability.
  - reference: DOI:10.1073/pnas.1010176107
    notes: Aylett et al. 2010 determined the filament structure of the bacterial tubulin
      homologue TubZ.
taxonomic_distribution:
- taxon_id: NCBITaxon:1428
  taxon_label: Bacillus thuringiensis
  presence: VARIABLE
  note: The TubZ filament is a plasmid-encoded partition filament experimentally characterized
    from the Bacillus thuringiensis virulence plasmid pBtoxis; it is not asserted
    to occur in all Bacillus thuringiensis strains.
  reference: DOI:10.1101/gad.1546107
canonical_examples:
- taxon_id: NCBITaxon:1428
  taxon_label: Bacillus thuringiensis
  note: Species hosting the pBtoxis virulence plasmid whose TubZ filaments defined
    this type III plasmid-partition system.
  reference: DOI:10.1101/gad.1546107
functions:
- function_id: pbtoxis_plasmid_partitioning
  label: pBtoxis plasmid partitioning
  description: TubZ filaments interact with TubR-tubC partition complexes to support
    pBtoxis DNA partitioning and stable plasmid inheritance in Bacillus thuringiensis.
  evidence:
  - reference: DOI:10.1101/gad.1546107
    notes: Larsen et al. 2007 connected TubZ treadmilling to stable inheritance of
      the Bacillus thuringiensis pBtoxis plasmid.
  - reference: DOI:10.1073/pnas.1003817107
    notes: Ni et al. 2010 analyzed TubR DNA binding and TubZ recruitment in the pBtoxis
      partition system.
evidence:
- reference: DOI:10.1101/gad.1546107
  notes: Larsen, Cusumano, Fujioka, Lim-Fong, Patterson and Pogliano 2007, 'Treadmilling
    of a prokaryotic tubulin-like protein, TubZ, required for plasmid stability in
    Bacillus thuringiensis', Genes & Development.
- reference: DOI:10.1073/pnas.1010176107
  notes: Aylett, Wang, Michie, Amos and Lowe 2010, 'Filament structure of bacterial
    tubulin homologue TubZ', PNAS.
- reference: DOI:10.1073/pnas.1003817107
  notes: Ni, Xu, Kumaraswami and Schumacher 2010, 'Plasmid protein TubR uses a distinct
    mode of HTH-DNA binding and recruits the prokaryotic tubulin homolog TubZ to effect
    DNA partition', PNAS.
- reference: DOI:10.1073/pnas.1210899109
  notes: Aylett and Lowe 2012, 'Superstructure of the centromeric complex of TubZRC
    plasmid partitioning systems', PNAS.
causal_graphs:
- graph_id: tubzrc_pbtoxis_partitioning
  title: TubZ filaments support pBtoxis plasmid partitioning
  description: TubZ polymerizes into tubulin-like filaments and TubR bound to pBtoxis
    tubC centromere DNA engages TubZ filaments to support plasmid partitioning.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records TubZ polymerization, TubR-tubC engagement of TubZ
    filaments and pBtoxis plasmid partitioning without asserting the full TubZRC transport
    geometry or all type III partition-system variants.
