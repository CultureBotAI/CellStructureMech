  posed_date: '2026-09-11'
- discussion_id: exclude_tubr_tubc_from_filament_components
  prompt: TubR and tubC centromere DNA are graph-scoped partition adapters rather
    than TubZ filament constituents.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#tubzrc_pbtoxis_partitioning
  rationale: TubR bound to the pBtoxis tubC centromere site engages TubZ filaments
    in the TubZRC partition system, but this centromeric complex is cargo-coupling
    machinery rather than a TubZ polymer subunit.
  evidence:
  - reference: DOI:10.1073/pnas.1003817107
    notes: Ni et al. 2010 analyzed centromere DNA binding by TubR and recruitment
      of the TubZ partition filament.
  posed_by: codex
  posed_date: '2026-09-11'
