components:
- component_id: apr2_to_apr7_ring_proteins
  label: APR2-to-APR7 apical polar ring proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: APR2 to APR7 are Toxoplasma apical-polar-ring proteins; no exact
    source-neutral protein-family CURIE for the APR2-to-APR7 cohort was curated.
  role: APR proteins that localize to upper, middle, and bottom layers of the Toxoplasma
    apical polar ring.
  evidence:
  - reference: DOI:10.1073/pnas.2416602121
    notes: Ren et al. 2024 localized APR2 through APR7 to fixed layers of the Toxoplasma
      apical polar ring.
- component_id: apr2_upper_layer_protein
  label: APR2 upper-layer protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: APR2 is a Toxoplasma apical-polar-ring protein; no exact source-neutral
    protein-family CURIE was curated.
  role: Upper-layer apical polar ring protein required for normal APR integrity, conoid
    extrusion, motility, and invasion in Toxoplasma.
  evidence:
  - reference: DOI:10.1073/pnas.2416602121
    notes: Ren et al. 2024 identified APR2 as a key structural component of the upper
      APR layer.
- component_id: rng1_apr_marker
  label: RNG1 apical polar ring marker
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: DISPENSABLE
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: RNG1 is a Toxoplasma apical-polar-ring marker; no exact source-neutral
    protein-family CURIE was curated.
  role: A late marker that localizes to the mature Toxoplasma apical polar ring.
  evidence:
  - reference: DOI:10.1002/cm.20469
    notes: Tran et al. 2010 identified RNG1 as a late Toxoplasma apical polar ring
      marker.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Polar rings of the apical complex are apicomplexan cytoskeletal structures
    rather than broadly conserved eukaryotic structures.
  reference: GO:0020031
- taxon_id: NCBITaxon:5794
  taxon_label: Apicomplexa
  presence: VARIABLE
  note: The anterior polar ring is formed during invasive apicomplexan life-cycle
    stages; the Toxoplasma tachyzoite APR is the canonical experimentally resolved
    example in this record.
  reference: GO:0020031
canonical_examples:
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan model in which APR layers, APR2-to-APR7 localization, APR2-dependent
    APR integrity, and RNG1 localization have been experimentally studied.
  reference: DOI:10.1073/pnas.2416602121
functions:
- function_id: apr_f_actin_flux_control
  label: apical F-actin flux control
  description: The fixed multilayered apical polar ring helps route F-actin into the
    pellicular space during conoid extrusion.
  evidence:
  - reference: DOI:10.1073/pnas.2416602121
    notes: Ren et al. 2024 showed that APR2 depletion disrupts APR integrity and leaks
      F-actin into the cytosol.
- function_id: apr_motility_invasion
  label: gliding motility and host cell invasion
  description: The APR2-containing apical polar ring supports normal Toxoplasma gliding
    motility and host-cell invasion.
  evidence:
  - reference: DOI:10.1073/pnas.2416602121
    notes: Ren et al. 2024 found that conditional APR2 depletion impaired Toxoplasma
      motility and invasion.
evidence:
- reference: DOI:10.1002/cm.20469
  notes: Tran et al. 2010, RNG1 is a late marker of the apical polar ring in Toxoplasma
    gondii, Cytoskeleton.
- reference: DOI:10.1073/pnas.2416602121
  notes: Ren et al. 2024, Architecture of the Toxoplasma gondii apical polar ring
    and its role in gliding motility and invasion, Proceedings of the National Academy
    of Sciences.
causal_graphs:
- graph_id: apr2_apr_f_actin_motility_invasion
  title: APR2 maintains the APR gate for F-actin flux, motility, and invasion
  description: APR proteins occupy layered positions in the Toxoplasma apical polar
    ring; APR2 in the upper layer maintains APR integrity, supports conoid extrusion,
    and helps route F-actin through the pellicular space to sustain gliding motility
    and host-cell invasion.
