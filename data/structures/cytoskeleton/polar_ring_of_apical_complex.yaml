  changes: Added GO apical-complex parthood, GO and APR synonyms, APR2-to-APR7 and
    RNG1 protein components, rare eukaryotic and variable Apicomplexa taxonomic scope,
    Toxoplasma gondii as a canonical example, F-actin flux and motility/invasion functions,
    an APR2/F-actin function graph, and an APR protein grounding TODO.
  llm_assisted: true
