identifier: GO:0020031
label: polar ring of apical complex
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: An electron dense ring at the most anterior position of the apical complex,
  from which the conoid fibers originate; formed during an invasive life cycle stage
  of an apicomplexan parasite.
definition_source: GO:0020031
mapping_status: PROPOSED
