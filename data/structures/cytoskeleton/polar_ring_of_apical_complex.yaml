- discussion_id: separate_modern_multilayer_apr
  prompt: Keep modern APR composition and gatekeeper evidence separate from GO:0020031.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - definition
  - causal_graphs#anterior_ring_topology
  - discussions#ground_apical_polar_ring_proteins
  rationale: The former component list and graph assigned the fixed multilayer APR
    to the historical anterior conoid-fiber-origin ring. Tran 2010 places RNG1 below
    the extruded conoid at the SPMT-origin APR; Ren 2024 places APR2-to-APR7 across
    fixed APR layers. Koreny 2021 also distinguishes canopy rings from APR1/2. These
    names and layer numbers cannot be equated directly with the two GO ring identifiers.
  resolution_note: 'Retain the anterior GO identity and narrow the active example,
    function and graph to its conoid-fiber topology. Preserve the broader research
    here: Ren resolves APR2 in the middle layer of a three-layer APR, despite broader
    upper-APR wording in the Significance section; APR2 depletion destabilizes that
    layer, alters conoid positioning, redirects F-actin toward the cytosol and impairs
    gliding/invasion. APR2-to-APR7 localize across APR layers, while RNG1 is a late
    bottom-layer marker. Tran infers dispensability of RNG1 for early microtubule
    nucleation, not parasite survival. No whole-APR assembly-essentiality claim follows.
    An exact whole-APR identity remains to be curated; these proteins and functions
    are not blindly transferred to GO:0020032. The original grounding TODO retains
    its wording and dates, with its anchors redirected here because its former component
    entries were removed.'
  evidence:
  - reference: DOI:10.1002/cm.20469
    notes: Results localize RNG1 below the extended conoid; Discussion separates late
      incorporation from early SPMT nucleation.
  - reference: DOI:10.1073/pnas.2416602121
    notes: Figures 1 and 4 and Discussion resolve APR2 middle-layer localization and
      depletion phenotypes; Figure 2 distinguishes fixed APR proteins from the moving
      conoid.
  - reference: DOI:10.1371/journal.pbio.3001081
    notes: Figure 1 and Results distinguish canopy rings, conoid body and the two
      APR positions.
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Historical distal preconoidal and SPMT-origin polar-ring positions are
      distinct.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
