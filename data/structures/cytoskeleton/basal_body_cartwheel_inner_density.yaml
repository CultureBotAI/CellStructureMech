identifier: cellstructuremech:basal_body_cartwheel_inner_density
label: basal body cartwheel inner density
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A morphologically distinct subassembly within the lumen of a microbial
  basal-body cartwheel hub, observed as a central electron-dense unit separate from
  the surrounding hub rings and radial spokes. Such units can repeat along the cartwheel
  axis, with nonuniform occupancy.
definition_source: DOI:10.15252/embj.2020106246
mapping_status: PROPOSED
