discussions:
- discussion_id: identity_and_granularity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the named inner-density subassembly distinct from the cartwheel hub
    and its proteins.
  rationale: A density-defined cellular subassembly is not a protein assignment, and
    the CID abbreviation has been used at two levels of granularity.
  notes: Hidden/ignored-inclusive searches and parsed identities, labels and synonyms
    across 872 prior records found no standalone CID record. Complete QuickGO searches
    for cartwheel inner density (229 hits), cartwheel inner ring (273), CID (0), and
    filamentous cartwheel (46) returned no exact term. This record follows Klena's
    convention of one whole central CID, rather than each of the nine connected densities
    in the older usage. It is part of the cartwheel, not an is-a cartwheel or SAS-6
    ring. Kind OTHER and broad GO:0005575 retain unresolved molecular classification;
    cartwheel, central hub, spokes and microtubule lumen are not exact synonyms.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  - reference: DOI:10.15252/embj.2020106249
  - reference: GO:0005575
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: native_composition_and_function
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify native microbial CID constituents and test CID-specific biological
    roles.
  rationale: Morphological contacts and structural models do not demonstrate a protein
    identity, necessity, or causal mechanism.
  notes: The inspected 2020 studies propose roles in hub-ring organization, symmetry,
    stability or polarity but do not establish CID-specific perturbation mechanisms.
    No protein components, stoichiometry, essentiality, GO function, trait link or
    causal graph is inferred from proximity to the hub. Direct molecular localization
    and structure-specific functional evidence are needed.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: declined_component_transfer
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not transfer SAS-6 hub assignments or speculative fly Poc1B assignments
    into microbial CID composition.
  rationale: A surrounding hub protein and a proposed analogous host structure do
    not identify this microbial subassembly.
  notes: SAS-6 ring fitting describes the surrounding hub, not a CID sequence assignment.
    The inspected 2019 Poc1B study explicitly speculates that the atypical Drosophila
    sperm PCL tubule represents CID and that Poc1B might contribute to human CID.
    Its Discussion 4.2 does not directly localize Poc1B to the microbial CIDs represented
    here. No Poc1B, SAS-6 or Bld10 family is imported merely from neighboring architecture
    or analogy.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  - reference: DOI:10.15252/embj.2020106249
  - reference: DOI:10.3390/cells8080841
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: filamentous_form_boundary
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve whether discrete CID and filamentous CID share molecular identity
    or homology.
  rationale: A similar location does not establish equivalence of discontinuous central
    units and a continuous axial filament.
  notes: Nazarov describes discrete CIDs in Trichonympha and a continuous filamentous
    cartwheel inner density, fCID, in Teranympha mirabilis. The source calls their
    relationship potential and leaves molecular nature unresolved. fCID is not an
    exact synonym, component assignment or additional canonical example of this record.
    Its reported diameter is not transferred to discrete CID.
  evidence:
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: polarity_and_occupancy
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile class- and reference-frame-specific CID polarity without imposing
    universal occupancy.
  rationale: Different sample preparations, resolution limits and geometric reference
    axes can produce distinct observations.
  notes: Klena did not resolve the asymmetric CID localization reported by Nazarov
    and notes possible resolution or species differences. Nazarov describes distal
    placement relative to the hub; its Figure EV1D instead describes proximal placement
    relative to the spoke-density axis in the 45% class, while the main text also
    discusses distal spoke-relative placement. The directional wording is retained
    as unresolved, not collapsed into a universal displacement. Both studies show
    regions or hub levels without CID, so a mean axial spacing is not obligatory occupancy
    at every ring pair.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: newer_model_followup
  kind: CURATION_TODO
  status: OPEN
  prompt: Inspect the full 2026 Trichonympha study before extending molecular or mechanistic
    claims.
  rationale: An abstract and deposited hub model cannot substitute for Results and
    Methods or identify an unmodeled density.
  notes: PMID:42709820 metadata and abstract were inspected, including the abstract's
    description of asymmetric CID densities and possible polarity/stability roles.
    Publisher and author-preprint full-text routes were unsuccessful on 2026-10-04;
    full Results and Methods remain uninspected. Native RCSB entry and polymer-entity
    metadata for PDB:9ZMK identify only SAS-6, not a CID protein. The deposited eight-chain
    hub model is not CID stoichiometry. No 2026 numerical, compositional or causal
    assertion is imported here; the measured properties remain tied to the inspected
    2020 experiments.
  evidence:
  - reference: DOI:10.1073/pnas.2612170123
  - reference: PDB:9ZMK
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: measurement_and_image_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep CID spacing, hub architecture, reconstruction processing and taxonomic
    scope separate.
  rationale: Image labels, symmetry processing and measurement counts are not interchangeable
    with molecular or population evidence.
  notes: Klena Figure 1 distinguishes approximately 4-nm hub spacing from approximately
    8.7-nm CID spacing; neither is a CID diameter or protein copy number. Nazarov's
    N denotes 2D measurements from averaged maps. Subvolume fractions, imposed rotations
    and reconstruction resolution are not biological replicates, population prevalence
    or native dimensions. Examples are specific observed microbial preparations, not
    universal clade distributions. Only the single-species Chlamydomonas Figure 1
    is hosted unchanged; its panel lettering follows the graphic because the JATS
    caption letters are inconsistent. Symmetrized panels are processed observations,
    not unprocessed tomograms or independent evidence of ninefold symmetry.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
