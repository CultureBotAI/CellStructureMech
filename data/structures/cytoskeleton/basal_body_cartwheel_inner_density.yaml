canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: In-situ cryo-FIB/cryo-ET of mat3-4 cells resolves CIDs within the hubs of
    mature basal bodies and pro-basal bodies. Figure 1 distinguishes the inner densities
    from the surrounding hub. The Results paragraph discussing the Figure 3 reconstruction
    also reports raw regions without CID, citing Appendix Figure S4D.
  reference: DOI:10.15252/embj.2020106246
- taxon_id: NCBITaxon:5888
  taxon_label: Paramecium tetraurelia
  note: Cryo-ET of isolated cortical units and cartwheel averaging resolve CIDs in
    Figures 2 and 3. Preparation used d4-2 and Delta-CenBP1 strains; the cited figure
    is not assigned to one strain. These are native specimens, not recombinant SAS-6
    rings.
  reference: DOI:10.15252/embj.2020106246
- taxon_id: NCBITaxon:5762
  taxon_label: Naegleria gruberi
  note: Basal bodies isolated from NEG cells differentiated into flagellates show
    CIDs in Figure 2 and Figure EV2. Periodicities were assessed in undamaged regions
    because preparation often compressed the basal bodies. This does not assert CID
    presence in the amoeboid stage.
  reference: DOI:10.15252/embj.2020106246
- taxon_id: NCBITaxon:63628
  taxon_label: Trichonympha agilis
  note: Purified basal bodies from flagellates extracted from Reticulitermes speratus
    hindguts were examined by cryo-ET and subtomogram averaging. Figure 2F-J and Figure
    EV1 describe 55% and 45% subvolume classes that can occur within one basal body,
    not separate taxa or population prevalence estimates.
  reference: DOI:10.15252/embj.2020106249
physical_properties:
- property: OTHER
  value: 8.7 +/- 1.6
  unit: UO:0000018
  context: Axial spacing between CIDs in mature Chlamydomonas reinhardtii basal bodies
    imaged in situ in mat3-4 cells; Klena Figure 1, plotted in panel H of the original
    graphic. Mean and SD, n=18 measured distances, not 18 cells or protein copies.
    This is not CID diameter, hub-ring spacing, or a universal repeat.
  reference: DOI:10.15252/embj.2020106246
- property: OTHER
  value: 8.6 +/- 1.2
  unit: UO:0000018
  context: Axial CID spacing in Chlamydomonas reinhardtii pro-basal bodies in the
    same in-situ mat3-4 study; Klena Figure 1. Mean and SD, n=5 measured distances.
    Mature and pro-basal-body measurements are separate observations, not a time course
    or a demonstrated developmental change.
  reference: DOI:10.15252/embj.2020106246
- property: OTHER
  value: 8.3 +/- 0.5
  unit: UO:0000018
  context: Axial spacing between CID elements in the Trichonympha agilis 55% central-cartwheel
    subvolume class, Nazarov Figure 2H. Reported mean and error; the caption does
    not name the error statistic. N=9 denotes 2D measurements from the subtomogram
    average, not independent cells. The 55% is a reconstruction-class fraction, not
    biological occupancy.
  reference: DOI:10.15252/embj.2020106249
- property: OTHER
  value: '15.2'
  unit: UO:0000018
  context: Distance between two CID elements in the Trichonympha agilis 45% central-cartwheel
    class, Nazarov Figure EV1C; N=1 2D measurement from the subtomogram average, with
    no error estimate. An intervening single hub unit lacks a neighboring CID. This
    is not a species-wide mean or a second universal repeat.
  reference: DOI:10.15252/embj.2020106249
