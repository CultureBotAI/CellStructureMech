        subpellicular microtubules and in the pellicular intramembranous-particle
        rows thought to overlie them.
discussions:
- discussion_id: resolve_subpellicular_accessory_components
  prompt: Resolve exact component boundaries and source-neutral groundings for subpellicular
    microtubule end proteins, plus-end factors, and IMC particle-lattice linkers.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#toxoplasma_subpellicular_microtubule_cortex
  rationale: Morrissette, Murray and Roos resolved an intramembranous-particle lattice
    aligned with Toxoplasma subpellicular microtubules, and Hu et al. localized proteins
    such as TgDLC, TgMORN1 and TgCentrin2 near subpellicular microtubule ends or daughter
    scaffolds. This record leaves those factors out until exact conserved constituent,
    linker, marker or assembly-factor boundaries are curated.
  evidence:
  - reference: DOI:10.1242/jcs.110.1.35
    notes: Morrissette, Murray and Roos 1997 resolved the subpellicular microtubule-associated
      intramembranous-particle lattice.
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 localized candidate apical cytoskeletal proteins to several
      Toxoplasma subcompartments.
  posed_by: codex
  posed_date: '2026-09-22'
- discussion_id: exclude_kinetoplastid_subpellicular_arrays
  prompt: Keep GO:0020025 scoped to apicomplexan subpellicular microtubules rather
    than kinetoplastid cortical microtubule arrays that share the same plain-English
    name.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#toxoplasma_subpellicular_microtubule_cortex
  rationale: The phrase subpellicular microtubule is also used in Trypanosoma literature,
    but GO:0020025 is taxon-constrained to Apicomplexa and defined by apicomplexan
    IMC and conoid topology. This record therefore curates only the apicomplexan structure.
  evidence:
  - reference: GO:0020025
    notes: QuickGO reports an Apicomplexa-only taxon constraint for GO:0020025.
  - reference: DOI:10.1242/jcs.110.1.35
    notes: Morrissette, Murray and Roos 1997 provide Toxoplasma-specific subpellicular
      microtubule evidence for this first record.
  posed_by: codex
  posed_date: '2026-09-22'
  resolved_date: '2026-09-22'
