taxonomic_distribution:
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  presence: COMMON
  note: Toxoplasma tachyzoites have 22 singlet subpellicular microtubules attached
    at the polar ring of the apical complex and running beneath the inner membrane
    complex.
  reference: DOI:10.1371/journal.ppat.0020013
canonical_examples:
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan model in which subpellicular microtubule periodicity, apical
    attachment and IMC-adjacent placement have been studied structurally.
  reference: DOI:10.1242/jcs.110.1.35
functions:
- function_id: pellicle_microtubule_scaffold
  label: pellicle microtubule scaffold
  description: Subpellicular microtubules form a longitudinal cortical microtubule
    scaffold beneath the inner membrane pellicle complex and alongside the pellicular
    intramembranous-particle lattice in Toxoplasma.
  evidence:
  - reference: DOI:10.1242/jcs.110.1.35
    notes: Morrissette, Murray and Roos 1997 resolved a 32 nm periodicity in isolated
      Toxoplasma subpellicular microtubules and the overlying pellicle particle lattice.
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 described the Toxoplasma subpellicular microtubules as cytoskeletal
      elements closely associated with the cytoplasmic face of the IMC.
evidence:
- reference: GO:0020025
  notes: Gene Ontology cellular-component term for the apicomplexan subpellicular
    microtubule.
- reference: GO:0005874
  notes: Gene Ontology places subpellicular microtubules under the microtubule class.
- reference: GO:0020007
  notes: Gene Ontology models subpellicular microtubules as part of the apicomplexan
    apical complex.
- reference: DOI:10.1242/jcs.110.1.35
  notes: Morrissette, Murray and Roos 1997, Subpellicular microtubules associate with
    an intramembranous particle lattice in the protozoan parasite Toxoplasma gondii,
    Journal of Cell Science.
- reference: DOI:10.1371/journal.ppat.0020013
  notes: Hu et al. 2006, Cytoskeletal Components of an Invasion Machine--the Apical
    Complex of Toxoplasma gondii, PLOS Pathogens.
causal_graphs:
- graph_id: toxoplasma_subpellicular_microtubule_cortex
  title: Tubulin singlets extend from the polar ring under the Toxoplasma IMC
  description: Alpha- and beta-tubulins polymerize into the 22 conventional subpellicular
    microtubules that attach at the polar ring of the Toxoplasma apical complex, run
    beneath the inner membrane pellicle complex, and align with a periodic intramembranous-particle
    lattice.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the mature apical attachment and cortical position
    of Toxoplasma subpellicular microtubules. It leaves basal-ring organizer identity,
    plus-end factors, IMC particle-lattice linkers and daughter-cell assembly order
    unresolved.
