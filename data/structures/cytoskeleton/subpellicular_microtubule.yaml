components:
- component_id: alpha_beta_tubulins
  label: alpha- and beta-tubulins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Tubulin subunits that polymerize into the conventional singlet subpellicular
    microtubules of Toxoplasma.
  evidence:
  - reference: GO:0005874
    notes: Gene Ontology defines microtubules as polymeric tubulin tubes.
  - reference: DOI:10.1371/journal.ppat.0020013
