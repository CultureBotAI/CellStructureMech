- discussion_id: cleavage_apparatus_septin_structure_boundary
  prompt: Keep the generic cleavage apparatus septin structure distinct from localized
    bud-neck, prospore, and medial-cortex septin structures.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032161 denotes the generic class of septin- and septin-associated-protein
    structures at cytokinetic cleavage planes. OLS lists GO:0000144, GO:0032174, GO:0032177,
    GO:0032169, and GO:0036391 as direct child terms for localized cleavage-plane
    septin structures.
  resolution_note: Curated GO:0032161 as the generic cleavage-plane septin structure
    and used localized cytokinetic septin structures only as child-term boundary evidence.
  evidence:
  - reference: GO:0032161
    notes: GO:0032161 identifies the generic cleavage apparatus septin structure.
