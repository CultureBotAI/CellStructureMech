- graph_id: chlamydomonas_outer_dynein_arm_motility
  title: Outer dynein arms drive Chlamydomonas axonemal sliding
  description: Outer-arm heavy, intermediate and light chains are constituents of
    an outer dynein arm that projects from Chlamydomonas axonemal outer doublet microtubules
    and contributes to sliding force generation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph records the coarse outer-arm dynein complex boundary and
    leaves chain-specific Chlamydomonas subunit identities, docking complexes and
    beat-cycle regulation unresolved.
