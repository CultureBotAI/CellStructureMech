functions:
- function_id: microtubule_sliding
  label: microtubule sliding
  grounding: GO:0051012
  description: Outer dynein arms on Chlamydomonas axonemal doublets generate sliding
    forces that are converted into flagellar bends.
  evidence:
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 modeled how axonemal dynein arrangement on outer doublets
      can generate microtubule sliding forces.
evidence:
- reference: GO:0036157
  notes: Gene Ontology cellular-component term for the outer dynein arm.
- reference: GO:0005858
  notes: Gene Ontology places the outer dynein arm under the axonemal dynein complex.
- reference: GO:0005930
  notes: Gene Ontology cellular-component term for the axoneme.
- reference: DOI:10.1126/science.1128618
  notes: Nicastro et al. 2006, 'The molecular architecture of axonemes revealed by
    cryoelectron tomography', Science.
