functions:
- function_id: sin_men_mitotic_exit_signaling
  label: SIN/MEN mitotic-exit signaling
  description: The SPB-associated SIN/MEN signaling complex organizes septation-initiation
    and mitotic-exit signaling proteins in fission and budding yeast.
  evidence:
  - reference: GO:0160065
    notes: GO:0160065 defines a mitotic-SPB-associated complex composed of septation
      initiation network or mitotic exit network proteins.
  - reference: DOI:10.1016/j.semcdb.2012.04.001
    notes: Hergovich and Hemmings 2012 reviewed yeast SIN and MEN pathways as Hippo-related
      signaling pathways that control mitotic exit and cytokinesis.
evidence:
- reference: GO:0160065
  notes: Gene Ontology cellular-component term for the SIN/MEN signaling complex,
    with the British spelling as an exact synonym and SIN and MEN signaling complex
    names as narrow synonyms.
- reference: GO:0032991
  notes: Gene Ontology parent term for protein-containing complex.
- reference: GO:0061499
  notes: Gene Ontology cellular-component term for the outer plaque of the mitotic
    spindle pole body, which contains the SIN/MEN signaling complex by parthood.
- reference: DOI:10.1038/emboj.2010.317
  notes: Johnson and Gould 2011 studied regulation of fission-yeast SIN scaffold Sid4
    and Plo1 kinase localization at spindle pole bodies.
- reference: DOI:10.1016/j.semcdb.2012.04.001
  notes: Hergovich and Hemmings 2012 reviewed Hippo signaling in the G2/M cell-cycle
    phase, including lessons from the yeast MEN and SIN pathways.
- reference: DOI:10.1038/ncb2514
  notes: Grallert et al. 2012 studied fission-yeast Sid2 and Fin1 signaling that links
    the SIN pathway to mitotic commitment.
discussions:
- discussion_id: sin_men_signaling_complex_boundary
  prompt: Keep GO:0160065 broad enough for both yeast SIN and MEN branches and distinct
    from narrower SIN or GAP subcomplexes.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - synonyms
  - part_of
  rationale: GO:0160065 denotes the SPB-associated SIN/MEN signaling complex. GO:0160066
    and GO:0160067 are narrower SIN-only subclasses for the old-SPB interphase complex
    and the new-SPB anaphase complex, respectively, while GO:1990334 denotes the two-component
    GAP complex that regulates Tem1/Spg1 rather than the whole SIN/MEN complex.
  resolution_note: Curated the exact GO:0160065 structure, retained GO narrow synonyms
    for lineage-specific SIN and MEN names, and kept narrower SIN and GAP assemblies
    out of this record.
  evidence:
  - reference: GO:0160065
    notes: GO:0160065 identifies the broad SIN/MEN signaling complex.
  - reference: GO:0160066
    notes: GO:0160066 identifies the narrower interphase SIN signaling complex.
  - reference: GO:0160067
    notes: GO:0160067 identifies the narrower new spindle pole body SIN signaling
      complex.
  - reference: GO:1990334
    notes: GO:1990334 identifies the SIN/MEN two-component GAP complex.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
