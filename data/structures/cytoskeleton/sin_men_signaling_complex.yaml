identifier: GO:0160065
label: SIN/MEN signaling complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex associated with the mitotic spindle pole body during
  interphase and mitosis and comprises of the proteins of the septation initiation
  signaling network (SIN) of fission yeast or mitotic exit network (MEN) of budding
  yeast, organized by two scaffold/adaptor proteins.
