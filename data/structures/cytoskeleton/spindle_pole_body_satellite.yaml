identifier: cellstructuremech:spindle_pole_body_satellite
label: spindle pole body satellite
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A transient cytoplasmic precursor of the daughter spindle pole body that
  forms at the distal tip of the half bridge during spindle pole body duplication
  in budding yeast.
definition_source: DOI:10.1146/annurev.cellbio.20.022003.114106
mapping_status: PROPOSED
