canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Budding-yeast reference system for the half-bridge-associated SPB satellite
    precursor that seeds daughter spindle pole body assembly.
  reference: DOI:10.1083/jcb.145.4.809
functions:
- function_id: daughter_spindle_pole_body_precursor
  label: daughter spindle pole body precursor
  description: The SPB satellite is an early cytoplasmic intermediate that nucleates
    assembly of the daughter spindle pole body next to the existing SPB.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed budding-yeast SPB duplication as a pathway
      that starts with satellite formation on the half bridge.
evidence:
- reference: GO:0032991
  notes: Gene Ontology cellular-component term for protein-containing complex, used
    as the broader parent because GO does not provide an exact SPB satellite term.
- reference: GO:0005825
  notes: Gene Ontology cellular-component term for the half bridge of the spindle
    pole body, the SPB substructure where satellite assembly initiates.
- reference: GO:0005816
  notes: Gene Ontology cellular-component term for the spindle pole body, the mature
    structure produced by the budding-yeast satellite precursor.
- reference: DOI:10.1083/jcb.145.4.809
  notes: Adams and Kilmartin 1999, Localization of core spindle pole body components
    during spindle pole body duplication in Saccharomyces cerevisiae, Journal of Cell
    Biology.
- reference: DOI:10.1534/genetics.111.128710
  notes: Winey and Bloom 2012, Mitotic spindle form and function, Genetics.
- reference: DOI:10.1146/annurev.cellbio.20.022003.114106
  notes: 'Jaspersen and Winey 2004, The budding yeast spindle pole body: structure,
    duplication, and function, Annual Review of Cell and Developmental Biology.'
causal_graphs:
- graph_id: spb_satellite_precursor_assembly
  title: SPB satellite precursor in daughter spindle pole body assembly
  description: During budding-yeast SPB duplication, a satellite forms at the half
    bridge and seeds assembly of the daughter spindle pole body.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph records the satellite as an early SPB duplication intermediate
    without asserting the ordered recruitment of individual satellite constituents.
  nodes:
  - node_id: half_bridge
    label: half bridge of spindle pole body
    node_type: STRUCTURE
    grounding: GO:0005825
  - node_id: spb_satellite
    label: spindle pole body satellite
    node_type: STRUCTURE
    grounding: cellstructuremech:spindle_pole_body_satellite
  - node_id: daughter_spindle_pole_body
    label: daughter spindle pole body
    node_type: ORGANELLE
  edges:
  - subject: half_bridge
    predicate: templates assembly of
    object: spb_satellite
    description: The SPB satellite assembles at the distal end of the half bridge
      next to the existing spindle pole body.
    evidence:
    - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
      notes: Jaspersen and Winey 2004 reviewed the satellite as a half-bridge-associated
        intermediate in budding-yeast SPB duplication.
  - subject: spb_satellite
    predicate: is precursor of
    object: daughter_spindle_pole_body
    description: The satellite is an early precursor that seeds daughter SPB assembly
      during the budding-yeast duplication pathway.
    evidence:
    - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
      notes: Jaspersen and Winey 2004 reviewed the budding-yeast SPB satellite as
        the initial visible intermediate that forms at the half bridge during daughter
        SPB assembly.
    - reference: DOI:10.1083/jcb.145.4.809
      notes: Adams and Kilmartin 1999 localized core budding-yeast SPB components
        during the satellite and daughter-plaque stages of SPB duplication.
discussions:
- discussion_id: spb_satellite_boundary
  prompt: Keep the spindle pole body satellite distinct from the mature spindle pole
    body and from the half bridge.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - causal_graphs#spb_satellite_precursor_assembly
  rationale: The satellite is modeled as a transient protein-containing complex that
    seeds daughter SPB assembly at the half bridge, not as an exact synonym of the
    mature GO:0005816 spindle pole body or the GO:0005825 half bridge.
  resolution_note: Minted a CellStructureMech identifier for the satellite, parented
    it to GO:0032991, and connected it mechanistically to the half bridge and daughter
    SPB in a nonmechanistic assembly graph.
  evidence:
  - reference: GO:0005816
    notes: GO:0005816 identifies the mature spindle pole body.
  - reference: GO:0005825
    notes: GO:0005825 identifies the half bridge of the spindle pole body.
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the satellite as a half-bridge-associated
      SPB duplication intermediate.
