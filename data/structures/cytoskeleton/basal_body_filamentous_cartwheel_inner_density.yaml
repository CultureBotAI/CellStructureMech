- discussion_id: measurement_and_image_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep filament dimensions separate from surrounding hub and spoke measurements.
  rationale: The same multipanel figure contains several structures with different
    measured quantities.
  notes: Only the approximate 7-nm filament diameter is curated as a physical property.
    Hub diameters, hub/spoke periodicities, whole cartwheel-bearing-region lengths
    and map resolution are not filament dimensions. Neither a sample count nor an
    error statistic for the diameter is supplied in Figure 4. The original single-species
    CC BY 4.0 Figure 4 is hosted unchanged; panel labels and 10-nm scale bars were
    visually checked. Segmentation colors are illustrative, not molecular boundaries,
    and the H-K peripheral maps are context rather than evidence of filament composition.
  evidence:
