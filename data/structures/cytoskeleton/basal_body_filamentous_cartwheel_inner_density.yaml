canonical_examples:
- taxon_id: NCBITaxon:285686
  taxon_label: Teranympha mirabilis
  note: Native basal bodies from hindgut flagellates of Reticulitermes speratus were
    examined by cryo-ET and subtomogram averaging. Preparation began with mixed Trichonympha
    agilis and Teranympha mirabilis cells, with a sedimentation step enriching the
    latter. Whole-cell morphology distinguished resin-embedded species; purified cryo-ET
    basal bodies were assigned using fCID presence or absence. This retains the source's
    morphology-based attribution, not an independent molecular identification. Figure
    4 resolves fCID in both 64% and 36% cartwheel subvolume classes, which can coexist
    within one basal body.
  reference: DOI:10.15252/embj.2020106249
physical_properties:
- property: DIAMETER
  value: approximately 7
  unit: UO:0000018
  context: Approximate diameter of the filamentous cartwheel inner density in purified
    Teranympha mirabilis basal bodies, Figure 4F-G and the corresponding Results.
    The value is reported for both 64% and 36% central-cartwheel reconstruction classes.
    No sample count or error statistic is supplied for this diameter. It is not the
    approximately 23-nm hub diameter, an axial hub/spoke spacing, or a measurement
    of discrete CID.
  reference: DOI:10.15252/embj.2020106249
