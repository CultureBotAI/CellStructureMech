- discussion_id: composition_and_specific_function
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify native fCID constituents and test filament-specific biological
    roles.
  rationale: Morphology and proximity do not identify molecules or demonstrate necessity.
  notes: The inspected primary study leaves molecular nature unresolved. Its modeled
    SAS-6 rings concern the surrounding hub, not a sequence assignment to fCID. No
    component family, protein accession, stoichiometry, essentiality, GO function,
    trait link or causal graph is inferred. Direct localization and filament-specific
    perturbations would be needed before importing these claims.
  evidence:
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: declined_hub_protein_assignment
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not transfer SAS-6 hub-ring fitting to the luminal filament.
  rationale: The filament and the protein-containing hub are separate structures in
    the source maps.
  notes: The paper fits CrSAS-6 ring models to hub densities and studies recombinant
    cartwheel-like arrays. Neither identifies fCID composition. SAS-6 is therefore
    not added as a filament constituent merely because its rings surround fCID; no
    surrounding pinhead, linker or microtubule protein is borrowed from Figure 4H-K.
  evidence:
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: cid_relationship_and_geometry
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve the molecular relationship to discrete CID and the filament's connections
    and helicity.
  rationale: Similar position and appearance do not establish homology, molecular
    equivalence or dynamics.
  notes: The Discussion contrasts continuous Teranympha fCID with discontinuous Trichonympha
    CID and leaves shared molecular identity or evolutionary history unresolved. It
    describes small possible links in the 36% class and leaves other contacts and
    helical organization open. Figure 4 notes off-center positions as suggestive of
    flexibility, not a measured mechanical property. No fixed helical pitch, handedness,
    elasticity or conserved CID-like polarity is asserted. Related densities in other
    taxa are leads, not canonical examples here.
  evidence:
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: specimen_and_reconstruction_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Preserve morphology-based specimen attribution and reconstruction processing
    boundaries.
  rationale: Classified subvolumes and imposed symmetry are not independent organisms
    or molecular evidence.
  notes: The source distinguishes intact resin-embedded species by whole-cell morphology
    and isolated cryo-ET basal bodies by fCID presence. This is not a molecular taxon
    assay or an unbiased prevalence survey. Central-cartwheel maps used C9 symmetry;
    later re-centered sector analysis relaxed symmetry to C1. The Results also report
    fCID in raw tomograms (Appendix Figure S1E) and non-symmetrized spoke-centered
    averages (Figure EV2I-P); those source statements were read, but these supplemental
    graphics were not visually inspected for this record. The 64% and 36% classes
    are not independent taxa and can coexist within one basal body. No native ninefold
    filament symmetry is inferred from processed maps.
  evidence:
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: deposition_name_discrepancy
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile the free-text sample names in EMD-10922 and EMD-10923 with their
    structured taxonomy.
  rationale: A mismatched sample name must not silently create a different organism
    assertion.
  notes: Both native entries have Teranympha mirabilis in their titles and natural_source
    organism fields, with NCBI taxon 285686 and the verified Nazarov DOI/PMID. Their
    sample and supramolecule names instead say Teranympha agilis. The paper and native
    taxonomy support Teranympha mirabilis. The datasets retain the discrepancy and
