identifier: cellstructuremech:basal_body_filamentous_cartwheel_inner_density
label: basal body filamentous cartwheel inner density
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: An apparently continuous filamentous subassembly extending longitudinally
  within the lumen of a microbial basal-body cartwheel hub. It is morphologically
  distinguishable from the surrounding hub rings and spokes and from discontinuous
  cartwheel inner-density units.
