discussions:
- discussion_id: identity_and_granularity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the continuous inner filament distinct from the cartwheel hub and discrete
    CID.
  rationale: A named morphological subassembly is not a single protein or an entire
    cartwheel.
  notes: Hidden/ignored-inclusive alias, slug, DOI and PMID searches and parsed identities
    across 873 prior records found no standalone fCID record; the existing CID record
    explicitly excludes it. Searches also included FLS as a possible older name lead
    without adopting it as an asserted synonym. Complete native GO queries for filamentous
    cartwheel inner density (275 hits), fCID (0), and Teranympha cartwheel (0) found
    no exact term. FILAMENT describes the observed form without asserting a protein
    family. GO:0110165 requires granularity above a protein complex, which is not
    established for this molecularly unassigned entity; broad GO:0005575 is retained.
    The cartwheel is part_of, not is-a. Hub rings, spokes, microtubule wall and discrete
    CID are not synonyms.
  evidence:
  - reference: DOI:10.15252/embj.2020106249
  - reference: GO:0005575
  - reference: GO:0110165
