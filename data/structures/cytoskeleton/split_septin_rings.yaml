discussions:
- discussion_id: split_septin_rings_boundary
  prompt: Keep the generic split septin rings distinct from localized bud-neck split
    septin rings and from the precursor septin ring or collar.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032176 denotes the broader pair of rings that forms when a septin
    ring or septin collar splits before cytokinesis. GO:0032177 narrows that state
    to the cellular bud neck, GO:0005940 denotes an unsplit septin ring, and GO:0032173
    denotes an unsplit septin collar.
  resolution_note: Curated GO:0032176 as the generic split-ring class, kept GO:0032177
    as the narrower bud-neck child, and did not merge the split pair with its precursor
    septin-ring or septin-collar states.
  evidence:
  - reference: GO:0032176
    notes: GO:0032176 identifies the generic split septin rings.
  - reference: GO:0032177
    notes: GO:0032177 identifies the localized cellular bud neck split septin rings.
  - reference: GO:0005940
    notes: GO:0005940 identifies the septin ring.
  - reference: GO:0032173
    notes: GO:0032173 identifies the septin collar.
  posed_by: codex
