identifier: cellstructuremech:basal_body_c_tubule_luminal_filament
label: basal body C-tubule luminal filament
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A crescent-shaped proteinaceous filament inside the lumen of a basal-body
  C-tubule, spanning from protofilament C3 to the C6-C7 junction and occurring in
  a longitudinally repeated array in the distal half of isolated Chlamydomonas reinhardtii
  basal bodies.
definition_source: DOI:10.1038/emboj.2011.460
mapping_status: PROPOSED
