functions:
- function_id: intraluminal_c_tubule_linkage
  label: intraluminal C-tubule linkage
  description: In the characterized Chlamydomonas distal region, the filament spans
    the C-tubule lumen from protofilament C3 to the C6-C7 junction. This is an observed
    structural connection, not a demonstrated requirement for stiffness, assembly
    or motility.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
    notes: Longitudinal-variation Results and Figure 4C show crescent-shaped luminal
      densities. Mechanical reinforcement and contact with the separate exterior hook
      are proposed interpretations, not tested filament-specific functions.
