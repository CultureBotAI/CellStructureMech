discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate the luminal filament from neighboring assemblies.
  rationale: A resolved filament is a structural entity even without a molecular assignment.
  notes: The curated name denotes the crescent-shaped filament and its axial repetition
    in Li et al., not the C-tubule wall, external hook, B-C inner junction or Y-shaped
    scaffold. Hidden/ignored-inclusive identity and citation searches found no existing
    record. Complete GO searches for C-tubule luminal filament, microtubule inner
    filament and C-tubule brace found no exact cellular-component term. GO:0160110
    and its A/B inner-sheath children concern axonemal doublets, not this basal-body
    C-tubule filament. GO:0005856 supplies the broader cytoskeletal class and GO:0036064
    supplies parthood. FILAMENT describes observed morphology, not a claimed protein
    family or complex stoichiometry.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
  - reference: GO:0005856
  - reference: GO:0036064
  - reference: GO:0160110
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: molecular_identity
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify constituents of the C3-to-C6/C7 luminal filament.
  rationale: A density-derived mass does not identify proteins or stoichiometry.
  notes: The approximately 46-kDa estimate uses segmented density volume and an assumed
    protein density of 1.41 g/cm3. It is not a sequence-resolved or biochemical composition
    measurement. Components and stoichiometry remain unset until an assignment is
    demonstrated for this exact distal structure.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: declined_mechanism_inferences
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep proposed mechanics and assembly separate from imaging.
  rationale: Regional co-occurrence is neither a direct interaction assay nor a time
    course.
  notes: The authors propose reinforcement of C-tubule rigidity and possible contact
    with the exterior hook. These are not asserted as established functions. The polarity
    interpretation compares the filament pitch with an assumed B-surface tubulin lattice;
    it is not a measured force or molecular mechanism. Delta-tubulin and POC5 assembly
    discussions do not assign either protein to this filament. No causal graph, trait
    link, filament-specific essentiality or chronological assembly sequence is added.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: regional_mip_comparison
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Avoid transferring proximal MIP names to the distal filament.
  rationale: C-lumen localization alone does not establish structural identity.
  notes: Li et al. 2019 analyze the proximal region and list MIP8 at B6/B7 inside
    the C lumen, MIP9 at B8/B9/C10, MIP10 at B7/C10 and MIP11 at C9/C10. Those described
    positions do not assign any of these names to the C3-to-C6/C7 crescent. They are
    not exact synonyms or component identities here. The comparison is region-specific
    and does not assert that an unobserved structure is biologically absent.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
  - reference: DOI:10.7554/eLife.43434
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: measurement_and_provenance_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish filament dimensions from map metadata.
  rationale: Reconstruction windows and resolution are not biological structure lengths.
