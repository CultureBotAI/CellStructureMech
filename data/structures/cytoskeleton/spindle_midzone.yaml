functions:
- function_id: chromosome_segregation
  label: chromosome segregation
  grounding: GO:0007059
  description: Mitotic spindles move duplicated chromosomes apart by coupling kinetochores
    to spindle microtubules that extend from opposing spindle poles.
  evidence:
  - reference: GO:0005819
    notes: Gene Ontology defines the spindle as an array of microtubules and associated
      molecules that serves to move duplicated chromosomes apart.
  - reference: DOI:10.1126/science.277.5325.574
    notes: Straight et al. 1997 visualized chromosome movements and spindle dynamics
      in living budding-yeast cells.
