identifier: GO:0051233
label: spindle midzone
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: The area in the center of the spindle where the spindle microtubules from
  opposite poles overlap. In yeasts, fungi, and microbial eukaryotes, the spindle
  midzone is organized by antiparallel microtubule crosslinkers (Ase1/PRC1), kinesin-5
  motors (Cin8, Kip1), and the chromosomal passenger complex (Ipl1/Aurora B, Sli15/INCENP,
  Bir1), driving anaphase B spindle elongation and stabilizing the central spindle.
