  grounding_notes: IPR004000 is the generic actin family and IPR056546 covers MreB/MamK-like
    proteins, so no exact family denotes filament-forming magnetosome MamK proteins.
  role: Bacterial actin homolog that polymerizes into the cytoskeletal filament associated
    with magnetosome chains.
  evidence:
  - reference: DOI:10.1126/science.1123231
    notes: Komeili et al. 2006 identified MamK as the actin-like protein organizing
      magnetosomes in Paramagnetospirillum magneticum AMB-1.
  - reference: DOI:10.1002/pro.2979
    notes: Bergeron et al. 2017 reported a cryo-EM structure of a polymerized MamK
      filament.
