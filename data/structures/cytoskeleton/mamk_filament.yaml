functions:
- function_id: magnetosome_chain_organization
  label: magnetosome chain organization
  description: Organizes magnetosome organelles into an intracellular chain aligned
    with the cell axis.
  evidence:
  - reference: DOI:10.1126/science.1123231
    notes: Komeili et al. 2006 showed that MamK is required for proper subcellular
      organization of magnetosome chains in AMB-1.
  - reference: PMID:20487281
    notes: Katzmann et al. 2010 connected loss of MamK with magnetosome formation
      and chain-assembly defects in MSR-1.
evidence:
- reference: DOI:10.1126/science.1123231
  notes: Komeili, Li, Newman and Jensen 2006, Magnetosomes Are Cell Membrane Invaginations
    Organized by the Actin-Like Protein MamK, Science.
- reference: DOI:10.1002/pro.2979
  notes: Bergeron, Hutto, Ozyamak et al. 2017, Structure of the magnetosome-associated
    actin-like MamK filament at subnanometer resolution, Protein Science.
- reference: PDB:5JYG
  notes: RCSB PDB entry 5JYG is the atomic model for the 6.5 A MamK filament cryo-EM
    reconstruction from Paramagnetospirillum magneticum AMB-1.
- reference: EMDB:EMD-8180
  notes: EMDB entry EMD-8180 is the helical-reconstruction map paired with PDB:5JYG
    for the MamK filament.
- reference: DOI:10.1038/nrmicro.2016.99
  notes: Uebe and Schuler 2016 reviewed MamK/MamJ-dependent magnetosome chain organization
    in magnetotactic bacteria.
causal_graphs:
- graph_id: mamk_filament_aligns_magnetosomes
  title: MamK filaments organize magnetosome chains
  description: MamK proteins polymerize into cytoskeletal filaments that run along
    magnetosome chains and help maintain the organelles in a linear arrangement.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records MamK polymerization and magnetosome-chain organization
    without modeling filament turnover, MamJ/LimJ exchange, or segregation of chains
    into daughter cells.
