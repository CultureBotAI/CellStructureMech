  note: Ninefold-symmetrized cryo-ET cross sections and a focused subtomogram average
    resolve the pinhead-to-A-C-linker connection. Methods describe cortical units
    isolated from d4-2 and Delta-CenBP1; Figure 5 is not assigned to one strain. The
    proximal-region analysis used 11 uncompressed tomograms containing 16 centrioles
    with intact proximal regions.
  reference: DOI:10.15252/embj.2020106246
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: In situ cryo-ET of FIB-milled mat3-4 cells and ninefold-symmetrized cross
    sections show the link in Figure 4. The Paramecium focused-map measurement is
    not transferred to this species.
  reference: DOI:10.15252/embj.2020106246
