discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the triplet base distinct from adjacent basal-body modules.
  rationale: A named linker is not the entire cartwheel, pinhead or A-C linker.
  notes: Hidden/ignored-inclusive repository searches and parsed record identity/synonym
    checks found mentions but no standalone record. Complete QuickGO searches for
    triplet base (119 results) and centriole triplet base (141 results) found no exact
    cellular-component term. The ontology root GO:0005575 is retained only as a deliberately
    broad class pending molecular classification; OTHER avoids asserting a proven
    multiprotein composition or filament architecture. GO:0110165 would assert granularity
    above a protein complex, which is also unresolved. Basal body is parthood, not
    is-a. No obligatory cartwheel or pro-basal-body parthood is inferred. D2-rod,
    A-tusk, pinhead, ArmB, cartwheel spokes and the A-C linker are not exact synonyms
    or separately identified triplet-base components.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  - reference: GO:0005575
  - reference: GO:0110165
  - reference: GO:0036064
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: molecular_identity
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve triplet-base molecular composition and a narrower structure class.
  rationale: A proposed coiled-coil assignment is not a demonstrated molecular identity.
  notes: Klena 2020 explicitly leaves molecular nature unknown and hypothesizes Bld10/Cep135
    membership from length, appearance and prior localization. The inspected Cai 2025
    Tetrahymena Discussion still describes the C-terminal CEP135 triplet-base assignment
    as proposed; its direct N-terminal CEP135 assignment is to the A-link, not this
    density. Consequently no Bld10/Cep135, SAS-6, tubulin or A-C-linker protein is
    asserted as composition here. Seek direct localization or sequence-resolved triplet-base
    evidence before assigning components, stoichiometry or protein-family grounding.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: measurement_and_mechanism_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate observed connectivity from periodicity and mechanical hypotheses.
  rationale: Low density and static axial differences do not uniquely specify occupancy,
    flexibility or chronology.
  notes: The focused Paramecium map required a low contour threshold to show the triplet
    base. The source offers flexibility or incomplete occupancy as alternatives and
    could not reliably recover triplet-base or pinhead longitudinal periodicities.
    The 8.5-nm initial picking interval and 8.4-nm A-C-linker repeat are not triplet-base
    repeats. The predicted 133-nm CEP135 coiled-coil length is not a measured linker
    length. A-C linker density persists farther distally when the pinhead/triplet-base
    connection is weak or absent, so the structures are not interchangeable. The proposed
    cohesion/stability function and replacement by other densities are not direct
    force measurements or time-resolved assembly evidence. No causal graph, motility
    trait or broad taxonomic-distribution claim is asserted.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
