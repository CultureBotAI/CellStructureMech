discussions:
- discussion_id: identity_and_sites
  prompt: Keep the binary partnership distinct from the sites where it acts.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  rationale: GO:0070850 names a protein complex. MTOCs, microtubule ends, kinetochores
    and the nucleus are dynamic localization contexts, not universally asserted parent
    organelles.
  evidence:
  - reference: GO:0070850
    notes: Exact cellular-component identity and direct parent verified by native
      OAK.
  - reference: DOI:10.1016/j.cub.2018.04.008
    notes: Alp14 occupies multiple organizing centers and growing ends.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Use only the verified intracellular protein-containing-complex
    parent; do not infer universal parthood.
  resolved_date: '2026-10-06'
- discussion_id: tacc_family_grounding
  prompt: Resolve an exact whole-protein grounding for the TACC component class.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#tacc
  rationale: Q9URY2's complete native InterPro match result provides a fungal C-terminal
    domain and a coiled-coil entry, not an exact whole-protein family. This bounded
    search does not imply homolog absence.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/entry/InterPro/IPR024312/
    notes: Native entry type is domain; the corresponding PF12709 match is coiled_coil.
  posed_by: codex
  posed_date: '2026-10-06'
- discussion_id: native_assembly
  prompt: Determine native stoichiometry and assembly dependence separately from activity.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - components#tacc
  - components#xmap215
  - causal_graphs#tacc_tog_association
  rationale: Purified sedimentation supports association but not a universal native
    2:2 copy count or interface geometry. Cellular growth, nucleation and transport
    defects do not independently measure whether the defined complex assembles without
    a constituent; essentiality remains UNKNOWN.
  evidence:
  - reference: DOI:10.1038/srep20653
    notes: Purified full-length S. pombe Alp7 and Alp14 associate in sedimentation
      experiments; Alp14 binds soluble tubulin whereas Alp7 alone shows no detectable
      binding under the tested conditions.
  posed_by: codex
  posed_date: '2026-10-06'
- discussion_id: elongation_conflict
  prompt: Reconcile the different effects of Alp7 loss on microtubule elongation.
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - functions#polymerase
  rationale: The 2016 study reports reduced elongation after Alp7 deletion and potentiation
    in reconstitution. The 2018 study finds normal elongation with persistent Alp14
    tip tracking despite impaired nucleation, explicitly noting the discrepancy. Strain
    or assay conditions are possible explanations, not established resolutions.
  evidence:
  - reference: DOI:10.1038/srep20653
    notes: Cellular deletion and purified reconstitution experiments support an elongation
      contribution in the tested contexts.
  - reference: DOI:10.1016/j.cub.2018.04.008
    notes: The Discussion explicitly contrasts the normal elongation result with the
      earlier study.
  posed_by: codex
  posed_date: '2026-10-06'
- discussion_id: external_machinery
  prompt: Do not turn interaction partners and regulators into core subunits.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  rationale: Ndc80 supplies a kinetochore docking context; Mto1/gamma-tubulin machinery
    supplies nucleation sites; CDK and transport factors regulate localization. These
    experiments do not establish them as invariant constituents of the TACC/TOG binary
    partnership.
  evidence:
  - reference: DOI:10.1091/mbc.E12-11-0817
    notes: Recruitment and peptide-contact evidence concern the kinetochore.
  - reference: DOI:10.1016/j.cub.2018.04.008
    notes: MTOC recruitment and engineered tethering are functional context.
  - reference: DOI:10.1091/mbc.E13-11-0679
    notes: Transport regulation is distinct from binary association.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Keep these entities in graph context rather than the component
    list.
  resolved_date: '2026-10-06'
- discussion_id: dis1_not_inferred
  prompt: Do not infer a Dis1-containing TACC complex from shared family membership.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#xmap215
  rationale: Alp14 and Dis1 share XMAP215-family membership, but forced targeting
    at tested endogenous expression did not substitute their functions. Earlier overexpression
    cross-rescue prevents an absolute claim of nonexchangeability at every dose or
    in every lineage.
  evidence:
  - reference: DOI:10.3390/ijms20205108
    notes: Reciprocal targeting and double-mutant experiments distinguish the tested
      Alp14 and Dis1 roles.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Use Alp14 as the demonstrated member; family grounding alone does
    not add Dis1 to this complex.
  resolved_date: '2026-10-06'
- discussion_id: transport_model_boundary
  prompt: Separate the revised export assignment from unresolved transport mechanisms.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  rationale: Alp14 L615A retains Alp7 association whereas the older Alp7 L461A perturbation
    also breaks binding. Alp7 five-site phosphorylation mutants retain import. Truncated-fragment
    two-hybrid and reporter export data do not resolve native importin affinity or
    a NES-exportin interface.
  evidence:
  - reference: DOI:10.1091/mbc.E13-11-0679
    notes: Main Results, Discussion and Methods separate association, import competence
      and mitotic accumulation.
  posed_by: codex
  posed_date: '2026-10-06'
  resolution_note: Assign export to the demonstrated Alp14 NES and keep enhanced native
    importin affinity as a model, not a graph reaction.
  resolved_date: '2026-10-06'
- discussion_id: taxon_scope
  prompt: Extend direct microbial evidence beyond the fission-yeast exemplar.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - record
  rationale: The GO definition describes eukaryotic conservation, but the curated
    mechanistic experiments here concern S. pombe. No clade-wide presence frequency,
    identical native stock, or universal transport mechanism is asserted.
  evidence:
  - reference: GO:0070850
    notes: The ontology provides generic scope.
  - reference: DOI:10.1038/srep20653
    notes: Purified S. pombe proteins were expressed in Sf9 cells; the expression
      host is not evidence for native complex distribution.
  posed_by: codex
  posed_date: '2026-10-06'
