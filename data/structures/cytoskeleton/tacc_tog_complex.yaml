functions:
- function_id: polymerase
  grounding: GO:0061863
  label: microtubule plus end polymerase activity
  description: Alp14 mediates polymerase activity; Alp7 enhances tip occupancy in
    purified-protein assays. Alp7 dependence of cellular elongation differs between
    the 2016 and 2018 studies, so it is not treated as universally required.
  evidence:
  - reference: DOI:10.1038/srep20653
    notes: Purified S. pombe proteins and tubulin demonstrate plus-end growth regulation;
      Figure 7 uses a mixed-tubulin TIRF assay.
  - reference: DOI:10.1016/j.cub.2018.04.008
    notes: Alp7 deletion impairs nucleation while Alp14 still tracks tips and elongation
      rates remain normal in this study, unlike the earlier report.
- function_id: nucleation
  grounding: GO:0007020
  label: microtubule nucleation
  description: The S. pombe complex supports efficient nucleation by recruiting Alp14
    to organizing centers; loss-of-function and partial tethering rescue do not show
    that it is sufficient alone or required for every nucleation event.
  evidence:
  - reference: DOI:10.1016/j.cub.2018.04.008
    notes: Alp7 loss impairs Alp14 MTOC recruitment and nucleation. Forced Alp14 targeting
      to Mto1 partially rescues nucleation in the engineered assay.
- function_id: spindle
  grounding: GO:0090307
  label: mitotic spindle assembly
  description: Mitotic nuclear accumulation of Alp7/Alp14 supports spindle assembly
    in S. pombe closed mitosis.
  evidence:
  - reference: DOI:10.1091/mbc.E13-11-0679
    notes: Alp7 CDK-site mutations impair nuclear accumulation and spindle behavior;
      an added nuclear localization signal suppresses the growth defect, not proof
      of full spindle-phenotype rescue.
- function_id: attachment
  grounding: GO:0051315
  label: attachment of mitotic spindle microtubules to kinetochore
  description: Kinetochore-associated Alp7/Alp14 contributes to productive mitotic
    microtubule attachment in S. pombe.
  evidence:
  - reference: DOI:10.1091/mbc.E12-11-0817
    notes: Ndc80 loop mutation reduces kinetochore recruitment and compromises attachment.
      Forced Nuf2-Alp7 C-terminal targeting supports a recruitment contribution, without
      resolving the complete native interface.
evidence:
- reference: GO:0070850
  notes: Native OAK GO identity, definition and cellular-component namespace verified
    on 2026-10-06; direct is-a parent is GO:0140535 intracellular protein-containing
    complex. No universal organelle parthood is inferred from dynamic localization.
- reference: DOI:10.1038/srep20653
  notes: Purified full-length S. pombe Alp7 and Alp14 associate in sedimentation experiments;
    Alp14 binds soluble tubulin whereas Alp7 alone shows no detectable binding under
    the tested conditions.
- reference: DOI:10.1091/mbc.E13-11-0679
  notes: Full main Results, Discussion and Methods support the Alp7 import/Alp14 export
    division and CDK-linked mitotic localization; supplementary material was not read.
- reference: DOI:10.1016/j.cub.2018.04.008
  notes: Full main Results, Discussion and STAR Methods distinguish Alp7-dependent
    recruitment/nucleation from elongation and explicitly discuss the conflicting
    earlier elongation result; supplementary material was not read.
- reference: DOI:10.1091/mbc.E12-11-0817
  notes: Full main Results, Discussion and Methods support Ndc80-loop-dependent kinetochore
    association and attachment. Purified peptide binding is narrower than a resolved
    full-complex interface; supplementary material was not read.
- reference: DOI:10.3390/ijms20205108
  notes: Full main text, figure captions and strain table distinguish Alp14 and Dis1
    under tested endogenous-expression and forced-targeting conditions, without claiming
    universal nonexchangeability at all doses.
