identifier: GO:0070850
label: TACC/TOG complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that contains the transforming acidic coiled coil (TACC)
  protein and the TOG protein (Mia1p/Alp7p and Alp14, respectively, in fission yeast),
  and is involved in microtubule array remodeling as cells progress through the cell
  cycle. The TACC/TOG complex is conserved in eukaryotes, associates with microtubules,
  and shuttles between the nucleus and the cytoplasm during interphase.
