discussions:
- discussion_id: septin_collar_boundary
  prompt: Keep the generic septin collar distinct from localized bud-neck and hyphal
    septin-collar subtypes.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032173 denotes the broader hourglass-shaped septin filament collar
    class, while GO:0032174 narrows the same architecture to the cellular bud neck
    and GO:0062140 narrows it to the pathogenic-fungal hyphae collar at plant plasmodesmata.
  resolution_note: Curated GO:0032173 as the generic collar and kept GO:0032174 and
    GO:0062140 as narrower collar classes.
  evidence:
  - reference: GO:0032173
    notes: GO:0032173 identifies the broader septin collar.
  - reference: GO:0032174
    notes: GO:0032174 identifies the cellular bud neck septin collar.
  - reference: GO:0062140
    notes: GO:0062140 identifies the hyphae septin collar.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
- discussion_id: resolve_septin_collar_grounding
  prompt: Resolve exact source-neutral family groundings for septin-collar septin
    proteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#septin_proteins
  rationale: The first generic septin-collar record reuses a reviewed-label-only septin
    protein cohort rather than guessing InterPro, Pfam, or NCBIfam accessions that
    may not exactly delimit all fungal septins that form collar architectures.
  evidence:
  - reference: GO:0032173
    notes: GO:0032173 defines the collar as composed of ordered septin filaments.
  posed_by: codex
  posed_date: '2026-09-30'
