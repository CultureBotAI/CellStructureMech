identifier: GO:0032175
label: mating projection septin ring
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A septin ring, i.e. a ring-shaped structure composed of septins and septin-associated
  proteins, located at the neck of a shmoo (mating projection). The septin ring in
  the neck of a shmoo may act as a barrier to localize mating factors in the shmoo
  tip.
