identifier: GO:0001536
label: radial spoke stalk
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: Protein complex forming the elongated portion of the radial spoke between
  the base which binds to the A-tubule of each microtubule outer doublet and the neck
  which connects to the spoke head within the ciliary or flagellum axoneme.
