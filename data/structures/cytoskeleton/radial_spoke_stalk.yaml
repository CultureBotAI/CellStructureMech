    the radial spoke neck, and GO:0001535 denotes the radial spoke head.
  resolution_note: Curated GO:0001536 as the exact stalk subcomplex and used GO:0001534
    for whole-radial-spoke parthood.
  evidence:
  - reference: GO:0001536
    notes: GO:0001536 identifies the radial spoke stalk subcomplex.
  - reference: GO:0001534
