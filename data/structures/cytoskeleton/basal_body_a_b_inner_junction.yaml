discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the basal-body A-B junction from neighboring structures.
  rationale: This is a named multiprotein junction network, not one protein or a whole
    triplet.
  notes: Hidden- and ignored-inclusive repository searches found no existing identity
    record. Complete GO searches for inner junction, basal body and triplet found
    no exact basal-body A-B cellular component. GO:0160113 specifically denotes the
    axonemal doublet inner junction and remains a separate record. The A-C intertriplet
    linker, B-C junction, inner scaffold and proximal inner ladder are not synonyms.
    GO:0140535 is broader is-a; GO:0036064 is parthood.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  - reference: GO:0160113
  - reference: GO:0140535
  - reference: GO:0036064
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: exact_family_groundings
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact POC1, FAP52, FAP106, IJ34 and alpha-helical inner-junction
    ladder protein family groundings.
  rationale: Broader families, individual domains and organism-specific sequences
    do not define exact taxon-agnostic component classes.
  notes: These five components remain REVIEWED_LABEL_ONLY for the documented reasons.
    FAP45 and FAP210 have exact InterPro family annotations. RCSB 8G2Z is a CU428
    axonemal doublet, not a basal-body deposition; its sequence mappings are used
    only to crosscheck model identities. The inspected unreviewed UniProt entries
    are SB210 references, not strain-paired B2086 or SB715 experimental examples.
    I7LY02 has no integrated InterPro match in the inspected endpoint; the paper's
    limited detectable homology is not evidence for taxonomic absence of the structure.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: unassigned_densities
  kind: CURATION_TODO
  status: OPEN
  prompt: Confirm the core LRR protein and resolve the remaining unassigned densities.
  rationale: A plausible predicted-model fit does not establish a unique molecular
    identity.
  notes: Q22N53 is a candidate for the core arch-shaped LRR density; Li et al. explicitly
    defer confirmation of identity and function. Its proposed N-terminal hairpin dimer
    and contacts remain models, not established components or stoichiometry. Its computational
    UniProt name is not evidence of kinase activity. The proximal FAP52-like paralog
    and core scaffold-attachment stem also remain unassigned. Cai et al.'s later I7LY02
    assignment to the proximal inner-junction ladders is represented separately and
    does not identify these other densities.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: wild_type_and_mutant_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep mutant replacements and neighboring proteins out of wild-type composition.
  rationale: poc1 deletion affects multiple basal-body modules and yields heterogeneous
    junctions.
  notes: PACRG, FAP20 and the CCDC81b/BMIP1-associated axonemal-like configurations
    occur in mutant core subclasses; they are not added as normal wild-type basal-body
    junction constituents. IJ34 is not equated to CCDC81b through shared domain annotations.
    Tubulins are junction substrates here, and the inner scaffold is a separate connected
    structure, not an extra component family. Subtomogram class percentages are not
    organismal prevalence.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: mechanism_and_spatial_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Avoid inferring assembly timing, direct binding or universal geometry.
  rationale: The analyzed basal bodies are mature; spatial comparisons are not time
    courses.
  notes: Proximal-to-core composition and lattice-angle differences do not establish
    temporal recruitment order. FAP106 recruitment hierarchies from another species'
    axoneme are not transferred here. Potential FAP52-FAP106 and FAP52-FAP210 contacts
    in EV4 remain model-based. No assembly essentiality, force threshold, general
    stoichiometry or broad taxonomic distribution is asserted.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: dataset_label_conflict
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Use native deposition metadata to bound dataset links.
  rationale: The article's B-C entry label conflicts with the native archive title.
  notes: Table 2 labels EMD-46438 as core B-C, whereas its native EMDB title says
    proximal B-C. It is outside this A-B record and is not linked or silently relabeled.
    Only the three native-verified wild-type A-B datasets are included.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: later_ladder_assignment
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Reconcile the earlier unassigned proximal ladder with newer molecular evidence.
  rationale: A later source assigns a protein to a density that the earlier study
    left unidentified; uncertainty must track the current evidence rather than stay
    blanket.
  notes: Li et al. 2025 left the proximal A-B and B-C ladder identities open. Cai
    et al. 2025 subsequently assigned I7LY02 to ladders at both junctions by MS-guided
    model fitting, with the A-B array depicted in Figure 4D-F. This record now includes
    the supported alpha-helical ladder class, without claiming perturbation-proven
    identity, necessity, universal composition or whole-junction stoichiometry. The
    separate unassigned WD40 ladder at the B-C junction is not an A-B component. Prior
    timestamped review reports remain immutable snapshots.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
