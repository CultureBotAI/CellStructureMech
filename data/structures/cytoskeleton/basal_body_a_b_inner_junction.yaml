identifier: cellstructuremech:basal_body_a_b_inner_junction
label: basal body A-B inner junction
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein network at the lumen-facing interface between the A- and B-tubules
  of a basal-body triplet microtubule, forming connections between the two tubules
  with region-specific composition.
definition_source: DOI:10.1038/s44318-025-00392-6
mapping_status: PROPOSED
