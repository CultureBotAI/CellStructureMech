components:
- component_id: poc1
  label: POC1 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Bridges the A1/B10 inner junction in proximal and central-core basal-body
    regions. At the core it also provides an attachment toward the separate inner
    scaffold.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
    notes: Results, Figures 2 and 4, and Figure EV4 place Poc1 at the junction. Poc1
      deletion produces heterogeneous defects and replacement compositions, not uniform
      absence of every A-B junction; assembly essentiality is not assigned.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro IPR050505 combines WDR55 and POC1; IPR020472 is a WD40
    repeat. Neither is an exact POC1 family identity. The inspected Q229Z6 sequence
    belongs to the SB210 reference strain and is not paired to the B2086 experiment.
- component_id: fap52
  label: FAP52 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Core-region microtubule inner protein contacting B9 and B10. A FAP52-like
    protein occupies a different, predominantly B9 position proximally; its precise
    paralog identity is unresolved.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
    notes: Figures 2B, 4 and EV4 support the core assignment by model fitting. The
      proximal assignment is explicitly FAP52-like, not proven to be the same gene
      product as core FAP52.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Core axonemal model CFAP52A in PDB 8G2Z maps to Q22ZH2. Its InterPro
    IPR050630 is the broader WD repeat Echinoderm Microtubule-associated Protein-like
    family; WD40 annotations are domains or repeats. Potential proximal paralogs I7MJ23,
    Q24C92 and I7MLQ3 do not establish one exact FAP52 grounding.
- component_id: fap106
  label: FAP106 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Microtubule inner protein fitted at the proximal and core A-B inner junctions.
    Core models place it adjacent to FAP52; that proposed contact is not a binding
    assay.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
    notes: Figures 2, 4 and EV4 identify FAP106 by structural fitting. Recruitment
      hierarchies from other species' axonemes are not direct basal-body assembly
      evidence.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro IPR052102 combines enkurin and enkurin domain-containing
    protein 1, whereas IPR027012 is an enkurin domain. Neither establishes an exact
    whole-protein FAP106 family. No Tetrahymena accession is guessed from a name search.
- component_id: ij34
  label: IJ34 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Core-region inner-junction protein whose main domain anchors to the A-tubule
    and whose C-terminal helix tethers FAP52 in the fitted structural model.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
    notes: 'Figure 4F compares the core and axonemal models: different C-terminal-helix
      positions retain the FAP52 connection. This is a structural comparison, not
      a time-resolved conformational trajectory.'
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The IJ34 model entity in PDB 8G2Z maps to I7M9T0. Its InterPro
    IPR028034 and IPR040673 annotations are CCDC81 HU domains 1 and 2, not an exact
    IJ34 family. These domain names do not equate IJ34 with the separately named CCDC81b.
- component_id: fap45
  label: Cilia- and flagella-associated protein 45
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Core-region junction-associated microtubule inner protein assigned within
    the 48-nm reconstruction by fitting an axonemal protein model.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
    notes: Figures 4A and EV4A support the core assignment. Model source PDB 8G2Z
      maps CFAP45 to W7XCX2, whose exact InterPro family is IPR033253; this model
      crosscheck is not a strain-matched basal-body protein example.
  grounding: InterPro:IPR033253
- component_id: fap210
  label: Cilia- and flagella- associated protein 210
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Core-region junction-associated microtubule inner protein assigned within
    the 48-nm reconstruction; its possible FAP52 contact remains model-derived.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
    notes: Figures 4A and EV4A support the core assignment. Model source PDB 8G2Z
      maps CFAP210 to Q23EX8, annotated with the exact InterPro family IPR039986 despite
      a domain-based UniProt protein name. No direct binding assay is inferred.
  grounding: InterPro:IPR039986
- component_id: inner_junction_ladder_protein
  label: alpha-helical inner-junction ladder protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The source assigns the ladder to I7LY02, an unreviewed SB210 reference
    protein at TTHERM_00682980. UniProt lists no InterPro or Pfam cross-reference,
    and the native InterPro protein-to-integrated-entry endpoint returned no match.
    No exact source-neutral family is asserted. The PDB entity name SWIM-type domain-containing
    protein is not a verified family or activity. The structural experiment uses SB715,
    so no strain-paired protein example is added.
  essentiality: UNKNOWN
  role: Forms the alpha-helical ladder assigned to the proximal A-B inner junction,
    bridging protofilaments A13 and B10 in the structural model. This assignment is
    not transferred to the distinct core-region LRR density or the FAP52-like protein.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
    notes: Cai et al. 2025, Figure 4D-F and Results identify an I7LY02-containing
      array in the A-B junction, following the MS-guided predicted-model assignment
      of the corresponding B-C ladder. This supports source-assigned membership, not
      a knockout dependency, biochemical binding assay or assembly essentiality. RCSB
      9QZC entity 8 independently maps the study's ladder model to I7LY02, but its
      A-C/B-C composite scope is not treated as an A-B-specific deposition.
canonical_examples:
- taxon_id: NCBITaxon:5911
  taxon_label: Tetrahymena thermophila
  note: Cryo-ET and focused subtomogram averages of isolated basal bodies resolve
    proximal and central-core A-B junction networks. Methods identify wild-type B2086;
    the canonical example is species-level. SB210 reference sequences and CU428 axonemal
    models are not asserted to be strain-matched experimental examples.
  reference: DOI:10.1038/s44318-025-00392-6
functions:
- function_id: luminal_a_b_connection
  label: luminal A-B tubule connection
  description: Forms luminal connections between the A- and B-tubules of basal-body
    triplets. Core junctions also provide an attachment site toward the distinct inner
    scaffold.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
    notes: Results and Figures 2 and 4 support the junction's structural role. Stability
      is a structural interpretation, not a measured force threshold or a phenotype
      attributable only to this junction in pleiotropic poc1 mutants.
