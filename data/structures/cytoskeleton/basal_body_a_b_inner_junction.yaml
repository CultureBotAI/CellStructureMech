  curator: codex
  action: EXPANDED_RECORD
  changes: Added bounded basal-body A-B inner-junction composition, core structural-contact
    graph, verified EMDB datasets and density preview; preserved uncertain identities,
    region-specific composition, mutant-only replacements and model-fitting limitations.
  llm_assisted: true
- timestamp: '2026-10-04T10:08:19Z'
  curator: codex
  action: CURATED_COMPONENTS
  changes: 'Addressed issue #2022: added the later Cai et al. I7LY02 ladder assignment
    as a label-only proximal component and replaced stale blanket uncertainty. Preserved
    model-fitting and strain limits, core graph, image and unresolved core densities.'
  llm_assisted: true
