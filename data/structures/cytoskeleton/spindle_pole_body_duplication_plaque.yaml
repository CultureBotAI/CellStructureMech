functions:
- function_id: daughter_spindle_pole_body_plaque_intermediate
  label: daughter spindle pole body plaque intermediate
  description: The duplication plaque is an intermediate plaque in the transition
    from the SPB satellite to an inserted daughter spindle pole body.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed budding-yeast SPB duplication as a pathway
      in which the satellite expands to a duplication plaque before the daughter SPB
      forms.
evidence:
- reference: GO:0032991
  notes: Gene Ontology cellular-component term for protein-containing complex, used
    as the broader parent because GO does not provide an exact SPB duplication plaque
    term.
- reference: GO:0005816
  notes: Gene Ontology cellular-component term for the mature spindle pole body produced
    after the budding-yeast duplication plaque stage.
- reference: cellstructuremech:spindle_pole_body_satellite
  notes: CellStructureMech record for the satellite precursor that expands into the
    duplication plaque.
- reference: DOI:10.1083/jcb.145.4.809
  notes: Adams and Kilmartin 1999, Localization of core spindle pole body components
    during spindle pole body duplication in Saccharomyces cerevisiae, Journal of Cell
    Biology.
- reference: DOI:10.1534/genetics.111.128710
  notes: Winey and Bloom 2012, Mitotic spindle form and function, Genetics.
- reference: DOI:10.1146/annurev.cellbio.20.022003.114106
  notes: 'Jaspersen and Winey 2004, The budding yeast spindle pole body: structure,
    duplication, and function, Annual Review of Cell and Developmental Biology.'
causal_graphs:
- graph_id: spb_duplication_plaque_transition
  title: Duplication plaque transition during daughter SPB assembly
  description: During budding-yeast SPB duplication, the satellite expands into a
    duplication plaque before an inserted daughter SPB forms.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph records the duplication plaque as an SPB duplication intermediate
    without asserting the ordered recruitment of individual plaque constituents.
  nodes:
  - node_id: spb_satellite
    label: spindle pole body satellite
    node_type: STRUCTURE
    grounding: cellstructuremech:spindle_pole_body_satellite
  - node_id: duplication_plaque
    label: spindle pole body duplication plaque
    node_type: STRUCTURE
    grounding: cellstructuremech:spindle_pole_body_duplication_plaque
  - node_id: daughter_spindle_pole_body
    label: daughter spindle pole body
    node_type: ORGANELLE
  edges:
  - subject: spb_satellite
    predicate: matures into
    object: duplication_plaque
    description: The SPB satellite expands into a duplication plaque during daughter
      spindle pole body assembly.
    evidence:
    - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
      notes: Jaspersen and Winey 2004 reviewed expansion of the budding-yeast satellite
        into the duplication plaque.
  - subject: duplication_plaque
    predicate: is precursor of
    object: daughter_spindle_pole_body
    description: The duplication plaque is a transient plaque intermediate before
      completion of the daughter SPB.
    evidence:
    - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
      notes: Jaspersen and Winey 2004 reviewed the budding-yeast duplication plaque
        as the cytoplasmic plaque intermediate formed after satellite expansion and
        before completion of the daughter SPB.
    - reference: DOI:10.1083/jcb.145.4.809
      notes: Adams and Kilmartin 1999 localized core budding-yeast SPB components
        through the daughter plaque intermediate stages of SPB duplication.
discussions:
- discussion_id: spb_duplication_plaque_boundary
  prompt: Keep the SPB duplication plaque distinct from the preceding satellite and
    the mature daughter spindle pole body.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - causal_graphs#spb_duplication_plaque_transition
  rationale: The duplication plaque is modeled as the transient plaque produced after
    satellite expansion, not as an exact synonym of the earlier SPB satellite or the
    final GO:0005816 spindle pole body.
  resolution_note: Minted a CellStructureMech identifier for the duplication plaque
    and connected it between the local satellite record and the daughter SPB in a
    nonmechanistic assembly graph.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the budding-yeast satellite, duplication
      plaque, and mature daughter SPB as consecutive duplication states.
  - reference: DOI:10.1083/jcb.145.4.809
    notes: Adams and Kilmartin 1999 localized SPB components during budding-yeast
      daughter plaque assembly.
