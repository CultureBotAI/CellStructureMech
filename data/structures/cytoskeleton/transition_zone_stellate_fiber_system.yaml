components:
- component_id: stellate_fiber_centrins
  label: Stellate fiber centrins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Calcium-binding constituents of the stellate fibers; centrin sequence mutations
    affect ordered transition-region assembly in Chlamydomonas.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: IPR050145 includes CML and obelin proteins as well as centrins;
    IPR050230 is broader still. Neither exactly denotes this constituent class, and
    an EF-hand domain is not a protein-family identity.
  protein_examples:
  - uniprot_id: UniProtKB:P05434
    protein_label: Caltractin
    taxon_id: NCBITaxon:3055
    taxon_label: Chlamydomonas reinhardtii
    entry_status: REVIEWED
    retrieved_on: '2026-10-04'
    role: Species-level centrin example shared with other centrin assemblies, not
      a stellate-specific paralogue.
    evidence:
    - reference: UniProtKB:P05434
      notes: Authority verifies the reviewed entry, recommended name and organism;
        no primary gene symbol is supplied.
    - reference: DOI:10.1083/jcb.119.6.1613
      notes: The centrin/caltractin sequence, pCaBP4 clone and sequence-source citations
        identify the studied protein. vfl2 and intragenic revertants alter centrin
        assemblies.
  evidence:
  - reference: DOI:10.1083/jcb.124.5.795
    notes: Results describe the centrin-based stellate fibers and antibody perturbations.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: Transition-region structures are disrupted by E101K centrin and restored
      in intragenic revertants; the mutation is not specific to this fiber system.
