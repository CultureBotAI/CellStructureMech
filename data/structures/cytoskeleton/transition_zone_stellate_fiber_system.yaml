functions:
- function_id: calcium_induced_doublet_repositioning
  label: calcium-induced doublet repositioning
  description: Stellate-fiber contraction draws transition-zone doublets inward in
    detergent-extracted Chlamydomonas cell models. This bounded mechanical response
    does not establish universal necessity for flagellar excision.
  evidence:
  - reference: DOI:10.1083/jcb.124.5.795
    notes: Figure 2 compares extended and contracted arrays before and after calcium
      challenge.
