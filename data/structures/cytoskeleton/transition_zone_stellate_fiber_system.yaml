evidence:
- reference: DOI:10.1083/jcb.124.5.795
  notes: Full primary PDF text read; Figure 2 and Table I visually inspected. Physical
    response is distinguished from disputed excision necessity.
- reference: DOI:10.1083/jcb.119.6.1613
  notes: Primary Methods, mutant/revertant Results and Table II inspected; centrin
    assembly evidence is pleiotropic.
- reference: DOI:10.1242/jcs.99.4.731
  notes: Complete publisher abstract read; full text is access-restricted and figures
    remain unread. Reports autotomy without organized stellate fibers or detectable
    narrowing.
- reference: DOI:10.1091/mbc.9.5.1195
  notes: Primary Introduction, Methods, Results and Discussion read at PMC25341; figures
    uninspected. Katanin experiments do not identify stellate-fiber constituents.
- reference: DOI:10.1016/j.cub.2014.11.066
  notes: 'Primary ultrastructure Results read: isolated central cylinders persist
    after stellate fibers are no longer identifiable.'
- reference: DOI:10.1126/science.abm6704
  notes: Published primary architecture Results and Figure 1 caption read from the
    institutional PDF. Native cryo-ET distinguishes luminal stellates, Y-links and
    the distal microtubule sleeve; figures not visually inspected.
- reference: GO:0043232
  notes: Verified intracellular membraneless organelle as a broad is-a parent.
- reference: GO:0035869
  notes: Verified ciliary transition zone as the enclosing region, not exact identity.
discussions:
- discussion_id: identity_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate luminal stellate fibers from neighboring transition-zone structures.
  rationale: Shared location or centrin does not imply identical structures.
  notes: 'Whole-repository ignored- and hidden-inclusive searches found only an unaccepted
    lead, not an existing exact record. GO searches found no exact term: GO:0035869
    is the entire transition zone, GO:0097539 denotes external transition fibers,
    and GO:0120269 denotes the trypanosome centrin arm. OTHER describes an organized
    fiber system rather than a single filament. The central cylinder/H-piece, Y-links
    and distal microtubule sleeve are not synonyms or constituents of this record.'
  evidence:
  - reference: DOI:10.1016/j.cub.2014.11.066
    notes: Central-cylinder integrity persists without identifiable stellate fibers.
  - reference: DOI:10.1126/science.abm6704
    notes: The native architecture separates luminal stellates from Y-links and the
      distal sleeve.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: excision_necessity_conflict
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve preparation-dependent contributions of stellate contraction to flagellar
    excision.
  rationale: Published results disagree, and the perturbations affect multiple assemblies.
  notes: Jarvik and Suhan report effective vfl2 autotomy without organized fibers.
    Sanders and Salisbury attribute the discrepancy to external shear and assay conditions,
    but this is their interpretation, not an independently resolved conflict. Their
    Table I retains residual excision after perturbation. EDTA, antibodies and vfl2
    are not selective fiber ablations. The graph stops at doublet displacement and
    does not assert necessary or sufficient severing by centrin alone.
  evidence:
  - reference: DOI:10.1242/jcs.99.4.731
    notes: Abstract-bounded counter-evidence.
  - reference: DOI:10.1083/jcb.124.5.795
    notes: Table I and Discussion compare shear conditions.
  - reference: DOI:10.1091/mbc.9.5.1195
    notes: Introduction challenges centrin necessity; some supporting vfl2 observations
      are explicitly unpublished.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: molecular_inventory
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact centrin-family grounding and the remaining molecular inventory.
  rationale: One identified constituent does not establish molecular sufficiency,
    stoichiometry or universal assembly essentiality.
  notes: InterPro family boundaries are broader than this class. Native helical morphology
    does not identify its complete protein composition. Centrin essentiality remains
    UNKNOWN rather than transferring the pleiotropic vfl2 phenotype to every stellate
    array.
  evidence:
  - reference: InterPro:IPR050145
    notes: Authority includes centrins, CML and obelin proteins.
  - reference: InterPro:IPR050230
    notes: Authority describes several calcium-binding protein classes.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: Mutant and revertant comparisons distinguish several centrin assemblies.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: severing_and_gate_proteins_excluded
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not import whole-transition-zone or severing proteins as stellate constituents.
  rationale: Region-level enrichment and enzymatic activity are not fiber-specific
    localization.
  notes: 'Katanin, FA1 and FA2 are not added: the 1998 work tests whole flagellar-basal-body
    complexes and foreign purified katanin, not isolated stellate fibers. ESCRT proteins
    from the 2015 transition-zone proteome are likewise not assigned to this array.
    No IFT-gating or central-pair-exclusion function is inferred for fibers alone.'
  evidence:
  - reference: DOI:10.1091/mbc.9.5.1195
    notes: Katanin-mediated severing and inhibitor experiments have a broader structural
      boundary.
  - reference: DOI:10.1016/j.cub.2014.11.066
    notes: Proteomics samples whole isolated transition zones.
  - reference: DOI:10.1242/jcs.99.4.731
    notes: The proposed central-pair exclusion role concerns multiple defective transition-region
      structures.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: taxonomic_and_function_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Extend directly demonstrated taxonomic scope and resolve an exact function
    term.
  rationale: A canonical species does not establish a prevalence statement for an
    entire clade.
  notes: No clade-wide distribution row, collection accession, exact GO function mapping
    or whole-system dimensions are inferred. Filament thickness, cylinder dimensions
    and helical pitch are different measurements, not interchangeable dimensions of
    this system.
  evidence:
  - reference: DOI:10.1083/jcb.124.5.795
    notes: Chlamydomonas model and ultrastructural measurements.
  - reference: DOI:10.1126/science.abm6704
    notes: Native Chlamydomonas architecture resolves a six-start stellate helix.
  posed_by: codex
  posed_date: '2026-10-04'
