identifier: cellstructuremech:transition_zone_stellate_fiber_system
label: transition zone stellate fiber system
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A centrin-containing system of luminal fibers forming a nine-pointed stellate
  array attached to the outer microtubule doublets of the Chlamydomonas ciliary transition
  zone. It is distinct from the peripheral Y-links and from the central cylinder around
  which the fibers extend.
definition_source: DOI:10.1083/jcb.124.5.795
mapping_status: PROPOSED
