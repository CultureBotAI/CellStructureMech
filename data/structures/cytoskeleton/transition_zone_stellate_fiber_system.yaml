  description: Composition and attachment context accompany the observed contraction-to-doublet-displacement
    mechanism.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: Restricted to the 1994 detergent-model experiment. No severing, universal
    excision requirement, centrin-only motor cycle or reverse edge is asserted.
