identifier: GO:0120280
label: ciliary pro-basal body
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: The cilary pro-basal body is an immature, partially assembled form of
  a ciliary basal body found next to the basal body of a cilium. Pro-basal bodies
  are not capable of nucleating a cilium. As the cell progresses through the cell
  cycle, continuing assembly will convert the pro-basal body into a mature basal body
  that is capable of nucleating a cilium. An immature precursor of the ciliary basal
  body assembled orthogonally adjacent to a mother basal body during the cell cycle
  in flagellated and ciliated microbial eukaryotes such as Chlamydomonas reinhardtii,
  Trypanosoma brucei, and Tetrahymena thermophila. It comprises a SAS-6/Bld10p cartwheel
  hub and nascent microtubule blades that elongate and mature into a docking-competent
  basal body.
