causal_graphs:
- graph_id: ciliary_pro_basal_body_mechanism
  title: Ciliary pro-basal body cartwheel assembly and elongation
  description: SAS-6 oligomers and Bld10p spokes nucleate the ninefold-symmetric cartwheel
    of the ciliary pro-basal body, which recruits delta- and epsilon-tubulin to template
    triplet microtubule blades prior to maturation into a ciliary basal body.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph summarizes major Chlamydomonas basal-body substructures
    and leaves cartwheel protein stoichiometry, centriole maturation, transition fibers
    and rootlet attachments for later component-level curation. The graph describes
    normal wild-type architecture, not an absolute substructure-essentiality claim
    or the morphology of every mutant basal body.
