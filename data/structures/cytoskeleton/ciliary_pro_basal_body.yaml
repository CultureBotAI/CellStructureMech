components:
- component_id: microtubule_triplets
  label: basal-body triplet microtubules
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0005874 denotes generic microtubules rather than the A-, B-
    and C-tubule triplet blades of the ciliary basal-body cylinder. No exact source-neutral
    CURIE for basal-body triplet microtubules was curated.
  role: Nine triplet microtubule blades build the cylindrical basal-body wall in Chlamydomonas.
    Functions in ciliary pro-basal body cartwheel assembly and maturation in ciliary
    pro-basal body.
  evidence:
  - reference: DOI:10.1186/s13630-016-0039-z
    notes: Dutcher and O'Toole 2016 review the Chlamydomonas basal body as a cylinder
      made from nine triplet microtubules.
  - reference: DOI:10.3390/cells7070079
    notes: Wingfield and Lechtreck 2018 describe wild-type Chlamydomonas basal bodies
      as nine triplet microtubules around a central cartwheel.
  - reference: DOI:10.1091/mbc.9.6.1293
    notes: Dutcher and Trabuco 1998 observed proximal doublets rather than triplets
      in uni3-1 basal bodies, with zero-, one- and two-flagellum cells in the mutant
      population. Their Discussion leaves a requirement for triplets in flagellar
      nucleation open. These observations distinguish normal triplet architecture
      from malformed basal-body formation but do not establish complete loss of all
      triplet material in every functional ciliary basal body. Assembly essentiality
      remains UNKNOWN, not a claim of universal dispensability.
- component_id: cartwheel
  label: basal-body cartwheel
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The basal-body cartwheel is a conserved ninefold-symmetric substructure,
    but this first record did not resolve exact source-neutral terms for its SAS-6
    hub, Bld10/CEP135 spoke-tip or associated cartwheel proteins.
  role: Proximal ninefold-symmetric scaffold that organizes basal-body assembly and
    helps template the arrangement of triplet microtubules. Functions in ciliary pro-basal
    body cartwheel assembly and maturation in ciliary pro-basal body.
  evidence:
  - reference: DOI:10.1083/jcb.200402022
    notes: Matsuura et al. 2004 localized Chlamydomonas Bld10p to the cartwheel and
      connected the cartwheel to the first ninefold-symmetric stage of basal-body
      assembly.
  - reference: DOI:10.1186/s13630-016-0039-z
    notes: Dutcher and O'Toole 2016 review the cartwheel among the conserved Chlamydomonas
      basal-body substructures.
  - reference: DOI:10.1016/j.cub.2007.11.046
    notes: The inspected Nakazawa et al. 2007 primary abstract reports that SAS-6-null
      bld12 lacks the central cartwheel part yet retains centrioles with variable
      triplet counts. Loss of the central part is not demonstrated removal of every
      cartwheel or spoke-tip component. These results support a role in normal organization
      without establishing an absolute whole-substructure formation requirement; assembly
      essentiality remains UNKNOWN. Full experimental text of the 2007 source was
      not inspected.
