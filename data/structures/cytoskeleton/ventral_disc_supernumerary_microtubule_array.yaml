evidence:
- reference: GO:0097596
  notes: Gene Ontology cellular-component term for the Giardia ventral-disc supernumerary
    microtubule array.
- reference: DOI:10.1371/journal.pone.0043783
  notes: Schwartz et al. 2012 reconstructed Giardia ventral-disc architecture. Figure
    1F places the supernumerary array ventral to the main array, and Results describe
    a short right-handed fragment.
- reference: DOI:10.1371/journal.pntd.0001442
  notes: Hagen et al. 2011 describe a partial left-handed supernumerary array; Figure
    5 reports tagged supernumerary proteins slightly dorsal or ventral to the main
    array. These descriptions are retained as a conflict with Schwartz et al. 2012,
    not combined into a universal geometry.
