  title: Supernumerary-array topology in the Schwartz 2012 reconstruction
  description: In the Giardia reconstruction reported by Schwartz et al. 2012, the
    supernumerary microtubules form a short right-handed spiral fragment ventral to
    the main ventral-disc array.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This NONMECHANISTIC topology graph is bounded to the Schwartz et al.
    2012 reconstruction, not a universal orientation claim. Current GO describes a
    generally dorsal, left-handed array, whereas Hagen et al. 2011 describe a left-handed
    partial array with slightly dorsal or ventral localization. The disagreement is
    retained explicitly; exact accessory proteins, assembly order and function remain
    unresolved.
