- discussion_id: supernumerary_array_orientation_conflict
  prompt: Preserve conflicting source descriptions of supernumerary-array position
    and handedness.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - definition
  - causal_graphs#giardia_supernumerary_microtubule_array_topology
  rationale: GO:0097596 describes a partial left-handed array generally dorsal to
    the main array. The cited Schwartz et al. 2012 reconstruction instead shows a
    ventral array in Figure 1F and describes a short right-handed fragment in Results.
    Hagen et al. 2011 describe a left-handed partial array with slightly dorsal or
    ventral localization in Figure 5.
  resolution_note: Keep exact GO identity and neutral partial-array identity; bound
    the right-handed/ventral description and graph edge to the Schwartz 2012 reconstruction.
    The sources are not reconciled into a universal handedness or dorsal/ventral rule.
    Prior removal of unsupported generic assembly and function remains in force; this
    resolution concerns local evidence representation, not a settled biological explanation
    of the disagreement.
  evidence:
  - reference: DOI:10.1371/journal.pone.0043783
    notes: Whole-cell architecture Results and Figure 1F specify the reconstructed
      right-handed, ventral supernumerary array.
  - reference: DOI:10.1371/journal.pntd.0001442
    notes: Introduction and Figure 5 describe the left-handed partial array and dorsal-or-ventral
      localization.
  - reference: GO:0097596
    notes: The current source definition gives generally dorsal, left-handed topology;
      that wording is not silently treated as agreement with the primary reconstruction.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
