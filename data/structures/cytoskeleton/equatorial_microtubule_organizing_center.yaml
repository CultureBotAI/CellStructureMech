  - reference: DOI:10.1242/jcs.038414
  - reference: DOI:10.1091/mbc.E05-08-0811
  - reference: DOI:10.1016/s1534-5807(04)00096-6
  rationale: Mto2 deletion can leave faint Alp4 recruitment, very limited nucleation
    or an early array that fails to persist. A failure to detect equatorial gamma-tubulin
    in another assay is not proof of zero molecules. Alp7/Mia1 mutants retain initial
    equatorial markers despite maintenance defects. Rsp1 loss permits assembly but
    impairs turnover. Unknown assembly essentiality remains UNKNOWN for the other
    classes; no cell-viability phenotype is substituted for assembly necessity.
- discussion_id: mechanistic_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not transfer interphase or engineered-system mechanisms to the equator.
  evidence:
  - reference: DOI:10.1016/j.cub.2018.04.008
  - reference: DOI:10.1126/sciadv.adq0670
  - reference: DOI:10.1038/ncomms8929
  - reference: DOI:10.1016/j.cub.2014.03.006
  rationale: Alp7 and Alp14 equatorial localization is direct evidence, but bonsai
    construct nucleation frequencies, interphase satellite dwell times and forced
    GBP recruitment are not native eMTOC measurements. The 2025 Klp2/Rsp1/Ssa1 study
    resolves a microtubule-lattice pathway; it does not directly establish the same
    reaction at an equatorial center. Klp2 and Ssa1 are therefore not imported as
    universal eMTOC members. Mto2 phosphorylation quantification in the 2015 paper
    excluded eMTOC-bearing cells. No equator-specific phosphoregulation graph or native
    copy number is inferred.
- discussion_id: turnover_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Resolve the molecular disassembly reaction at equatorial centers.
  evidence:
  - reference: DOI:10.1016/s1534-5807(04)00096-6
  - reference: DOI:10.1126/sciadv.adq0670
  rationale: The Rsp1 loss phenotype supports turnover dependence. Satellite redistribution
    and chaperone-based breakup remain models in the accessible 2004 account; the
    2025 lattice experiments do not by themselves close this site-specific gap.
- discussion_id: ring_mechanics
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep inferred ring mechanics distinct from universal cytokinesis requirements.
  evidence:
  - reference: DOI:10.3390/cells12060917
  - reference: DOI:10.1091/mbc.E04-12-1043
  rationale: The 2023 selective mto1-427 perturbation changes inferred contractile-ring
    stiffness without a measurable cytokinesis or anchoring defect under its tested
    conditions. Stiffness estimation assumes unchanged initial tension; mutant recoil
    did not plateau, limiting fitted parameters. Earlier anchoring experiments used
    cytokinesis delay or actin perturbation. Those contexts are retained rather than
    declaring a universal requirement or an unexplained contradiction. Array counts
    and offsets are not universal eMTOC dimensions.
