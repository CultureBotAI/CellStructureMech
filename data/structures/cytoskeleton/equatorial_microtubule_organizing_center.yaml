  - reference: https://www.ebi.ac.uk/ena/taxonomy/rest/tax-id/284812
  rationale: Only S. pombe is a canonical example. Protein accessions identify the
    reference strain, not every experimental stock. The 2004 Rsp1 paper and 2006 Mia1
    paper were not read in full; two 2005 papers were accessible as indexed primary
    Results, not complete Methods. No unverified trait, exact Complex Portal equivalent,
    direct structural dataset, exhaustive composition or fixed copy number is supplied.
    The native GO definition is an identity definition, not an independent new quantitative
    experiment.
