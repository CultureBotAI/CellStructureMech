discussions:
- discussion_id: identity_and_mereology
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the equatorial assembly from other MTOCs and its microtubule
    output.
  evidence:
  - reference: GO:0000923
  - reference: GO:1990295
  - reference: DOI:10.1016/j.cub.2010.10.006
  rationale: Parsed identifiers, labels and synonyms from all 903 pre-existing records
    and hidden/ignored-inclusive name, accession and citation searches found no duplicate
    identity. GO:0000923 exactly names this center. GO:0005815 is its parent and GO:0032153
    its division-site whole. GO:1990295 has-part this center but names the larger
    post-anaphase array; that class-level existential is not inverted into universal
    eMTOC part-of PAA. MULTIPROTEIN_COMPLEX describes the resident nucleation assembly,
    not a single purified stoichiometric complex.
- discussion_id: external_boundaries
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep ring context, spindle-pole scaffolds and output microtubules separate
    from the core.
  evidence:
  - reference: DOI:10.1016/j.cub.2010.10.006
  - reference: DOI:10.3390/cells12060917
  rationale: F-actin and Myp2 supply upstream contractile-ring docking context. Their
    recruitment dependencies do not make the entire contractile ring an eMTOC component.
    Sid4/Cdc11 targeting evidence in the 2010 paper concerns spindle poles, not this
    equatorial assembly. Alpha/beta tubulin and Ase1 occur in the nucleated array
    rather than establishing core eMTOC membership. Mto1/Myp2 offset and dosage results
    limit a simple direct-coassembly model without excluding indirect association.
- discussion_id: family_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Find exact source-neutral whole-protein mappings for four label-only classes.
  evidence:
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/O94488/
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/Q9USP7/
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/Q9URY2/
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/O13601/
  - reference: InterPro:IPR045110
  - reference: DOI:10.1038/ncomms8929
  rationale: Complete InterPro matches were inspected for Mto1 O94488, Mto2 Q9USP7,
    Alp7 Q9URY2 and Rsp1 O13601. Domains and superfamilies are not whole-protein family
    equivalents. Rsp1 has a broad family annotation, but no exact mapping to the narrower
    class is adopted. Mto2's empty API response is not absence of homologs; divergent
    fungal homologs are discussed in the 2015 primary study. Alp14 uses the verified
    XMAP215 family, not a TOG domain.
