identifier: GO:0005818
label: aster
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: An array of microtubules emanating from a spindle pole MTOC that do not
  connect to kinetochores. A radial, star-shaped array of cytoplasmic astral microtubules
  nucleated from a microtubule organizing center—such as the outer plaque of a yeast
  spindle pole body or a protist basal body/centrosome—with microtubule plus ends
  radiating toward the cell cortex. In budding and fission yeasts, filamentous fungi,
  and protists, the aster interacts with cortical dynein and Kar9/Bim1 capture machinery
  to position the mitotic spindle and drive nuclear migration.
