discussions:
- discussion_id: prospore_septin_filament_array_boundary
  prompt: Keep the prospore septin filament array distinct from the generic septin
    filament array and other prospore septin structures.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032165 denotes the prospore-membrane-localized child of the generic
    GO:0032160 septin filament array. GO:0032166 covers the parallel chlamydospore-membrane
    array, and GO:0032169 covers a tight ring-shaped septin structure at the site
    of cytokinesis in a prospore rather than a filamentous array in the prospore membrane.
  resolution_note: Curated GO:0032165 as the exact localized septin-filament-array
    record, kept GO:0032160 as its is-a parent, and did not merge it with GO:0032166
    or prospore septin-ring records.
  evidence:
  - reference: GO:0032165
    notes: GO:0032165 identifies the prospore septin filament array.
  - reference: GO:0032160
    notes: GO:0032160 identifies the broader septin filament array.
  - reference: GO:0032166
    notes: GO:0032166 identifies the chlamydospore septin filament array.
  - reference: GO:0032169
    notes: GO:0032169 identifies the prospore septin ring.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
