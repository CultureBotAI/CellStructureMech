discussions:
- discussion_id: chlamydospore_septin_filament_array_boundary
  prompt: Keep the chlamydospore septin filament array distinct from the generic septin
    filament array and other localized septin structures.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032166 denotes the chlamydospore-membrane-localized child of the
    generic GO:0032160 septin filament array. GO:0032165 covers the parallel prospore-membrane
    array, whereas GO:0005940, GO:0032173, and GO:0032159 model ring-shaped, collar-shaped,
    and cap-shaped higher-order septin structures.
  resolution_note: Curated GO:0032166 as the exact localized septin-filament-array
    record, kept GO:0032160 as its is-a parent, and did not merge it with GO:0032165
    or localized septin ring, collar, or cap records.
  evidence:
  - reference: GO:0032166
    notes: GO:0032166 identifies the chlamydospore septin filament array.
  - reference: GO:0032160
    notes: GO:0032160 identifies the broader septin filament array.
  - reference: GO:0032165
    notes: GO:0032165 identifies the prospore septin filament array.
  - reference: GO:0005940
    notes: GO:0005940 identifies the broader septin ring.
  - reference: GO:0032173
    notes: GO:0032173 identifies the septin collar.
  - reference: GO:0032159
    notes: GO:0032159 identifies the septin cap.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
