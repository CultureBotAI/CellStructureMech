      notes: Laporte et al. 2013 demonstrated that Tub2 beta-tubulin is essential
        for static microtubule bundle assembly.
  - subject: static_microtubule_bundle
    predicate: mediates
    object: quiescent_microtubule_cytoskeleton_organization
    description: Assembly of the static microtubule bundle reorganizes and stabilizes
      the microtubule cytoskeleton during quiescence.
    evidence:
    - reference: GO:0099070
      notes: GO:0099070 defines the static microtubule bundle as assembling at the
        transition to quiescence and disassembling upon cell cycle re-entry.
    - reference: DOI:10.1083/jcb.201306075
      notes: Laporte et al. 2013 demonstrated that the static microtubule bundle reorganizes
        the cytoskeleton for quiescent survival.
