functions:
- function_id: quiescent_microtubule_cytoskeleton_organization
  label: microtubule cytoskeleton organization
  grounding: GO:0000226
  description: Reorganizes the microtubule cytoskeleton into a hyperstable, spindle-pole-body-associated
    bundle at the transition from proliferation to quiescence and disassembles rapidly
    upon cell-cycle re-entry to support survival in quiescence.
  evidence:
  - reference: GO:0099070
    notes: GO:0099070 defines the static microtubule bundle as assembling at the transition
      from proliferation to quiescence and disassembling rapidly upon cell cycle re-entry.
  - reference: DOI:10.1083/jcb.201306075
    notes: Laporte et al. 2013 showed that assembly of the static microtubule bundle
      is required for cell survival during quiescence and rapid spindle reformation
      upon exit.
  - reference: DOI:10.1083/jcb.201502025
    notes: Laporte et al. 2015 demonstrated conserved assembly and rapid depolymerization
      of the Q-MT bundle in quiescent S. pombe.
