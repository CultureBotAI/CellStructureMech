    predicate: heterodimerizes with
    object: beta_tubulin
    description: Alpha-tubulin and beta-tubulin form obligate alpha/beta-tubulin heterodimers
      that polymerize into the antiparallel microtubules of the quiescent static bundle.
    evidence:
    - reference: DOI:10.1083/jcb.201502025
      snippet: Upon entry into quiescence, fission yeast cells assemble a single bundle
        of microtubules (Q-MT bundle) that is extremely stable.
      notes: Supports alpha/beta-tubulin heterodimers forming the microtubules of
        the quiescent static bundle.
    - reference: DOI:10.7554/eLife.89958
      snippet: Upon starvation, budding yeast cells assemble a hyper-stable microtubule
        bundle in the nucleus.
      notes: Supports alpha/beta-tubulin heterodimers assembling the hyper-stable
        quiescent nuclear microtubule bundle.
