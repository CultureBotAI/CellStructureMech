identifier: GO:0099070
label: static microtubule bundle
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A stable bundle of closely packed microtubules formed in quiescent cells,
  usually associated with the spindle pole body. In yeast cells entering quiescence,
  it assembles at the transition from proliferation to quiescence and disassembles
  rapidly upon cell cycle re-entry.
