discussions:
- discussion_id: new_mitotic_spb_boundary
  prompt: Keep the GO age/asymmetry term for the new mitotic SPB narrower than the
    general mitotic SPB and distinct from local old/new SPB duplication placeholders.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0071958 denotes the newly formed mitotic spindle pole body that localizes
    mitotic-exit signaling proteins, whereas GO:0044732 denotes the broader mitotic
    SPB. The older ungrounded old_spb and new_spb causal-graph nodes on the general
    SPB record are generic duplication roles and are not exact records for the fission-yeast
    GO:0071957 and GO:0071958 age/asymmetry terms.
  resolution_note: Curated GO:0071958 as the exact record for the new mitotic SPB,
    parented it to GO:0044732, and cited GO:0071957 only as the old mitotic SPB sibling.
  evidence:
  - reference: GO:0071958
    notes: GO:0071958 identifies the new mitotic spindle pole body.
  - reference: GO:0071957
    notes: GO:0071957 identifies the old mitotic spindle pole body.
  - reference: GO:0044732
    notes: GO:0044732 identifies the broader mitotic spindle pole body.
