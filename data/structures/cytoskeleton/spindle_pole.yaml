components:
- component_id: spindle_pole_body_core
  label: spindle pole body core
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  role: Native multilayered scaffold subcomplex at the center of the budding-yeast
    SPB that organizes cytoplasmic and nuclear microtubule nucleation sites. Functions
    at the microtubule-anchoring spindle pole of the mitotic or meiotic spindle.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the layered Saccharomyces cerevisiae
      SPB and its core plaque components.
  - reference: DOI:10.1091/mbc.E17-06-0397
    notes: Viswanath et al. 2017 determined an integrative molecular architecture
      for the budding-yeast SPB core.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The SPB core is a native fungal scaffold subassembly containing
    several unrelated protein families; no single source-neutral complex identifier
    denotes the aggregate.
- component_id: gamma_tubulin_complexes
  label: gamma-tubulin complexes
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  role: Microtubule-nucleating complexes associated with SPB inner and outer plaques.
    Functions at the microtubule-anchoring spindle pole of the mitotic or meiotic
    spindle.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed gamma-tubulin complex placement at budding-yeast
      SPB plaques.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact fungal gamma-tubulin small-complex or plaque-bound gamma-tubulin
    ring-complex identifier was assigned in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Exhibits spindle pole (GO:0000922) at the microtubule-anchoring spindle pole
    of the mitotic or meiotic spindle. The spindle pole body is directly evidenced
    in budding yeast; no broader fungal distribution is asserted in this first record.
  reference: DOI:10.1146/annurev.cellbio.20.022003.114106
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Characterized model system for spindle pole (GO:0000922) at the microtubule-anchoring
    spindle pole of the mitotic or meiotic spindle. Budding-yeast reference system
    in which SPB structure, duplication and core molecular architecture have been
    mapped.
  reference: DOI:10.1146/annurev.cellbio.20.022003.114106
functions:
- function_id: microtubule_organization
  label: microtubule organization
  description: The SPB nucleates and organizes nuclear and cytoplasmic microtubules
    in budding yeast. Mediated by spindle pole (GO:0000922) at the microtubule-anchoring
    spindle pole of the mitotic or meiotic spindle.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the SPB as the budding-yeast microtubule
      organizing center.
- function_id: bipolar_spindle_assembly
  label: bipolar spindle assembly
  description: SPB duplication and separation generate the two organizing centers
    that build a bipolar mitotic spindle. Mediated by spindle pole (GO:0000922) at
    the microtubule-anchoring spindle pole of the mitotic or meiotic spindle.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed SPB duplication and mitotic-spindle assembly.
