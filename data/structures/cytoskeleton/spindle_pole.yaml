components:
- component_id: spindle_pole_mtoc_core
  label: microtubule organizing center
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0005815
  essentiality: ESSENTIAL
  role: Polar microtubule-organizing structure (such as a fungal spindle pole body
    or metazoan/protist centrosome) that anchors minus ends of nuclear and astral
    spindle microtubules at each spindle pole.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Reviews the structural organization of eukaryotic spindle pole microtubule-organizing
      centers including fungal spindle pole bodies and centrosomes.
- component_id: spindle_pole_gamma_tubulin_complex
  label: gamma-tubulin complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0000930
  essentiality: ESSENTIAL
  role: Polar gamma-tubulin nucleation complexes (gamma-TuSC/gamma-TuRC) tethered
    at the spindle pole that cap microtubule minus ends and template bipolar spindle
    assembly.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Establishes gamma-tubulin complexes as the conserved microtubule-nucleating
      machinery at eukaryotic spindle poles.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: COMMON
  note: Conserved across eukaryotes as the polar terminal region of the mitotic or
    meiotic spindle where spindle microtubules converge at a centrosome, fungal spindle
    pole body (SPB), or acentrosomal pole.
  reference: DOI:10.1146/annurev.cellbio.20.022003.114106
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Budding-yeast reference system in which SPB structure, duplication and core
    molecular architecture have been mapped.
  reference: DOI:10.1146/annurev.cellbio.20.022003.114106
functions:
- function_id: microtubule_organization
  label: microtubule cytoskeleton organization
  grounding: GO:0000226
  description: Serves as the polar convergence and minus-end anchoring site for interpolar,
    kinetochore, and astral spindle microtubules via polar MTOCs and gamma-tubulin
    complexes.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Reviews how eukaryotic spindle poles nucleate and anchor spindle and astral
      microtubules.
- function_id: bipolar_spindle_assembly
  label: spindle assembly
  grounding: GO:0051225
  description: Duplication and separation of the two spindle poles establish the bipolar
    axis of the mitotic or meiotic spindle required for faithful chromosome segregation.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Describes how spindle pole duplication and separation drive bipolar spindle
      assembly across eukaryotes.
