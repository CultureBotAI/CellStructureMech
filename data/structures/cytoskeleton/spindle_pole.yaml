identifier: GO:0000922
label: spindle pole
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: Either of the ends of a spindle, where spindle microtubules are organized;
  usually contains a microtubule organizing center and accessory molecules, spindle
  microtubules and astral microtubules. In yeasts, fungi, microalgae, and protists,
  the two opposite spindle poles contain the spindle pole body or centrosomal MTOC
  together with minus-end focusing kinesin-14 motors, NuMA/Pkl1/Mto1 factors, and
  gamma-tubulin ring complexes that anchor kinetochore, interpolar, and astral microtubule
  minus ends.
