components:
- component_id: cord_centrins
  label: Cytostomal-cord centrins
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Centrin immunoreactivity supports this class, not a resolved paralogue
    inventory. InterPro IPR050145 Centrin/CML-like also includes obelin and plant
    CML proteins and is broader than cord centrins; no exact source-neutral family
    grounding was established.
  essentiality: UNKNOWN
  role: Centrin-family constituents detected by centrin-specific antibody labeling;
    selective requirements for cord assembly are not established here.
  evidence:
  - reference: DOI:10.1111/j.1550-7408.1998.tb04526.x
    notes: Primary abstract identifies the cord as centrin-specific, like the infraciliary
      lattice, and immunologically distinct from striated bands. No cord-specific
      depletion or complete composition is described in the abstract.
canonical_examples:
- taxon_id: NCBITaxon:5885
  taxon_label: Paramecium caudatum
  reference: DOI:10.1083/jcb.63.3.904
  note: Species used for serial-section electron microscopy in the 1974 Methods. The
    cord is named and described in the Observations; CIL:36779 also documents it.
    Exact species identifier verified at ENA.
- taxon_id: NCBITaxon:44030
  taxon_label: Paramecium multimicronucleatum
  reference: DOI:10.7295/W9CIL36704
  note: Organism named by the inspected CIL:36704 TEM record. Source supplies the
    species name, not a taxid; exact identifier independently verified at ENA. No
    strain or genus-wide prevalence inferred.
functions:
- function_id: cytopharyngeal_space_roof
  label: Roof of cytopharyngeal vesicle-accumulation spaces
  description: In P. caudatum the cord forms the fibrillar roof of boxlike spaces
    between cytopharyngeal microtubular ribbons, above the membrane where discoidal
    vesicles accumulate. This is an observed architectural role, not a demonstrated
    requirement for vesicle retention, transport, fusion or vacuole release.
  evidence:
  - reference: DOI:10.1083/jcb.63.3.904
    notes: Observations on journal pages 913 and 915 place the cord above the ribbon
      ends and the accumulating vesicles. Discussion on page 918 treats the cord's
      active function as unresolved.
