identifier: cellstructuremech:cytostomal_cord
label: cytostomal cord
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A largely unbranched, centrin-containing extension of the infraciliary
  lattice associated with the cytostome-cytopharynx region, characterized in Paramecium.
  It is a named fibrillar substructure, not the entire lattice or the adjacent cytopharyngeal
  microtubular ribbons.
definition_source: DOI:10.1111/j.1550-7408.1998.tb04526.x
mapping_status: PROPOSED
curation_history:
