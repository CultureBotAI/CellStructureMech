discussions:
- discussion_id: identity_and_part_whole
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the named oral cord from the extended infraciliary lattice and
    other oral or centrin structures.
  rationale: A named localized substructure can have its own record without duplicating
    its encompassing network.
  notes: Use part_of for the lattice and oral apparatus, not is-a lattice. Hidden-
    and ignored-inclusive searches found only a prior review-report lead, not an existing
    cord record or history. QuickGO cytostomal and cytosomal queries returned zero
    hits; cord returned no cellular-component term. The ciliary centrin arm denotes
    a different FAZ-associated complex, and the deep fiber is not adopted as exact
    identity merely because it is oral cytoskeleton.
  evidence:
  - reference: DOI:10.1111/j.1550-7408.1998.tb04526.x
    notes: Primary abstract identifies an essentially unbranched extension of the
      netlike lattice.
  - reference: DOI:10.1083/jcb.63.3.904
    notes: Observations name the cord and distinguish its location from the neighboring
      microtubular ribbons.
  - reference: GO:0120269
    notes: Authority definition specifies a Centrin4 complex flanking the FAZ and
      quartet microtubules, not this cord.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: cord_composition_and_assembly
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve cord-specific centrin paralogues, scaffold constituents and selective
    assembly requirements.
  rationale: Shared immunoreactivity does not establish complete molecular identity
    or requirements inherited from the whole lattice.
  notes: Retain label-only grounding and UNKNOWN essentiality. Do not transfer Sfi1-like
    scaffolds, ICL1e depletion phenotypes or a complete ICL paralogue inventory to
    the cord without cord-specific evidence. InterPro's broader family does not resolve
    that boundary.
  evidence:
  - reference: DOI:10.1111/j.1550-7408.1998.tb04526.x
    notes: Abstract supports centrin-specific labeling, not a cord inventory or selective
      assembly test.
  - reference: InterPro:IPR050145
    notes: Authority describes the broader Centrin/CML-like family, including obelin
      and plant CML proteins.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: functional_hypotheses
  kind: CURATION_TODO
  status: OPEN
  prompt: Test whether cord contraction promotes vesicle fusion or release of nascent
    food vacuoles, and identify the relevant calcium pathway.
  rationale: Static ultrastructure and centrin localization do not demonstrate an
    active mechanism or necessity.
  notes: The 1974 Discussion explicitly leaves cord function uncertain and considers
    both contractile and purely structural alternatives. The 1998 abstract suggests
    a calcium-supply role for neighboring alveolar sacs; CIL:36704 proposes possible
    fusion or vacuole-release effects. Only the observed architectural roof is recorded
    as a role. No mechanistic causal graph, ATP dependence, calcium-channel identity
    or selective requirement is asserted.
  evidence:
  - reference: DOI:10.1083/jcb.63.3.904
    notes: Journal page 918, cord-function discussion; read and visually checked.
  - reference: DOI:10.1111/j.1550-7408.1998.tb04526.x
    notes: Alveolar association motivates a suggestion, not a demonstrated calcium-release
      pathway.
  - reference: DOI:10.7295/W9CIL36704
    notes: Source caption explicitly qualifies contraction and downstream outcomes
      as proposed.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: adjacent_structures_not_components
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep microtubular ribbons, alveolar sacs, striated bands and vesicles outside
    the cord's molecular composition.
  rationale: Adjacency and shared placement in the oral apparatus do not make other
    structures constituent proteins or membranes of the cord.
  notes: Do not add tubulin or alveolar lipids merely because these structures border
    the cord. The 110 kDa antigen belongs to the immunologically distinct striated
    bands, not to the centrin-specific cord. Vesicle movement along ribbons is not
    assigned to the cord as a motor function.
  evidence:
  - reference: DOI:10.1083/jcb.63.3.904
    notes: Observations distinguish fibrillar cord, microtubular ribbons, alveolar
      evaginations and discoidal vesicles.
  - reference: DOI:10.1111/j.1550-7408.1998.tb04526.x
    notes: Abstract distinguishes the 110 kDa striated-band antigen from centrin-specific
      structures.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: taxonomic_scope_and_source_access
  kind: CURATION_TODO
  status: OPEN
  prompt: Inspect full 1998 experimental text and compare named cytostomal cords outside
