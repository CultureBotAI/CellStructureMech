discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the D2-rod from the cartwheel and its neighboring densities.
  rationale: A named peripheral subassembly is not the entire cartwheel or a single
    asserted protein.
  notes: Hidden/ignored-inclusive repository searches and parsed identifier, label
    and synonym checks found no standalone D2-rod record before creation. Complete
    QuickGO queries D2 rod (49 results), cartwheel D2 (15) and centriole D2 (37) found
    no exact cellular-component identity. Bacterial flagellar rods and cyclin-D2 complexes
    are different entities. The cartwheel is parthood, not is-a. D1, the hub, cartwheel
    inner density, pinhead and triplet base are not exact synonyms. D2 density is
    related terminology for the peripheral cross-sectional feature, not an asserted
    exact synonym for a complete longitudinal rod. OTHER and the broad GO:0005575
    parent retain unresolved molecular classification without asserting a proven multiprotein
    composition or filament architecture.
  evidence:
  - reference: DOI:10.1038/ncomms14813
  - reference: DOI:10.15252/embj.2020106246
  - reference: GO:0005575
  - reference: GO:0036064
  - reference: GO:0120280
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: native_molecular_identity
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify the native microbial D2-rod constituents and a narrower molecular
    class.
  rationale: Morphology and coassembly do not assign a complete native proteome to
    a resolved density.
  notes: Direct molecular localization or a sequence-resolved D2-rod model is needed
    before adding components, stoichiometry, family groundings or D2-specific essentiality.
    Neither the native 2017 cross sections nor the 2020 longitudinal reconstructions
    provide those assignments.
  evidence:
  - reference: DOI:10.1038/ncomms14813
  - reference: DOI:10.15252/embj.2020106246
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: declined_component_transfers
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep core-cartwheel reconstitution and human localization models separate
    from microbial D2 composition.
  rationale: Membership in a broader assembly or a proposed counterpart is not a native
    D2-specific assignment.
  notes: Full-length CrSAS-6 plus Bld10 residues 1061-1641 forms core-cartwheel-like
    arrays with D1- and D2-like peripheral densities in the 2017 assay. CrSAS-6_NL
    arrays retain D1 but lack D2. These results do not identify which protein forms
    the native D2-rod; the explicit SAS-6 assignment to D1 is not transferred to D2.
    The inspected 2024 human U-ExM study proposes CPAP as a D2 constituent from localization
    and prior fibril formation. That human model does not establish microbial D2 membership.
    No SAS-6, Bld10/Cep135, CPAP, pinhead protein or tubulin component is asserted
    here solely from these neighboring or model-system observations.
  evidence:
  - reference: DOI:10.1038/ncomms14813
  - reference: DOI:10.15252/embj.2020106246
  - reference: DOI:10.1016/j.cell.2024.03.025
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: measurement_and_reconstruction_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep radial position, axial organization and assembly models distinct.
  rationale: Processing symmetry and adjacent structural repeats do not supply a molecular
    count or D2 growth rate.
  notes: The 45.6-nm Figure 1f measurement is a hub-margin-to-D2 distance. The roughly
    25-nm spacing in the 2020 cartwheel analysis concerns D1 merged-spoke units, not
    a demonstrated D2-rod repeat. Ninefold symmetrization improves contrast and is
    not a count of D2 protein molecules. The 2020 Paramecium Results and Methods give
    different cartwheel averaging counts (8 tomograms/235 boxes versus 7 tomograms/232
    retained subvolumes); neither is promoted to biological stoichiometry or used
    for the 2017 measurement. Spatial extension without visible pinhead is not a time-resolved
    assembly sequence. No mechanical modulus, causal graph, broad clade distribution
    or motility trait is asserted.
  evidence:
  - reference: DOI:10.1038/ncomms14813
  - reference: DOI:10.15252/embj.2020106246
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: deposited_data_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not substitute neighboring maps for a D2-rod-specific deposit.
  rationale: Sharing an article does not establish structural equivalence or sufficient
    map coverage.
  notes: The 2017 Data availability statement points to the paper and its supplementary
    material. The 2020 paper lists EMD-10726 through EMD-10729; native released-entry
    titles describe A-C-linker or microtubule-triplet reconstructions, not an isolated
    D2-rod map. They are not added as exact xrefs or D2-specific datasets. This is
    a bounded decision about those deposits, not a claim that no relevant dataset
    exists elsewhere. The single-species 2017 Figure 1 supplies the hosted native
    D2 visual evidence; 2020 EV3 supplies the inspected longitudinal context but contains
    two taxa.
