identifier: cellstructuremech:basal_body_d2_rod
label: basal body D2-rod
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A longitudinal subassembly at the periphery of a microbial ciliary basal-body
  or pro-basal-body cartwheel, linking the outer radial-spoke ends along the cartwheel
  axis. In characterized Chlamydomonas and Paramecium regions it is distinguishable
  from the pinhead and extends into the proximal cartwheel segment beyond the microtubule
  wall.
