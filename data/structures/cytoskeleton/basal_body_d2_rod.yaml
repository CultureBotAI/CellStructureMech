- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Ninefold-symmetrized cryo-ET of isolated CW-15 pro-basal bodies resolves peripheral
    D2 densities in the core cartwheel. Figure 1 includes a proximal segment lacking
    pinhead and microtubules. This is native isolated material, distinct from the
    paper's recombinant arrays.
  reference: DOI:10.1038/ncomms14813
- taxon_id: NCBITaxon:5888
  taxon_label: Paramecium tetraurelia
  note: Cryo-ET and symmetrized cartwheel views resolve longitudinal D2 connections
    in Figure EV3 and Figure 3. Methods describe cortical units isolated from d4-2
    and Delta-CenBP1; these figures are not assigned to one strain. No Chlamydomonas
    numerical measurement is transferred here.
  reference: DOI:10.15252/embj.2020106246
functions:
- function_id: longitudinal_spoke_end_connection
  label: ciliary basal body organization
  grounding: GO:0032053
  description: Connects peripheral radial-spoke ends along the cartwheel axis in the
    characterized Chlamydomonas and Paramecium proximal regions. This observed arrangement
    does not establish a stiffness, a growth mechanism, or D2-specific essentiality.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
    notes: The proximal-extension Results name the vertical D2 connections as D2-rod.
      Figure EV3 distinguishes the D2-rod from the pinhead, including in the protruding
      cartwheel segment; Figure 3 resolves D1-to-D2 radial connections.
physical_properties:
- property: OTHER
  value: 45.6 +/- 0.8
  unit: UO:0000018
  context: Radial distance from the hub margin to the D2 density in isolated Chlamydomonas
    reinhardtii CW-15 pro-basal bodies, Guichard et al. 2017 Figure 1f; reported value
    and error, n=13 measurements from five tomograms. The caption does not specify
    the error statistic. Methods selected spokes ending in visible D1 and/or D2 densities
    for these distance measurements. This is a position relative to the hub edge,
    not the hub center, rod length, diameter, axial repeat or molecule count.
  reference: DOI:10.1038/ncomms14813
