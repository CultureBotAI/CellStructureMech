identifier: cellstructuremech:stalk_spasmoneme
label: Stalk spasmoneme
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: An intracellular contractile fibrillar organelle within the stalk of contractile-stalk
  peritrich ciliates. A spasmin-rich fibrillar mass is interspersed with membrane-bounded
  tubules. Shortening deforms the surrounding stalk; the organelle is distinct from
  the extracellular sheath and from the continuous body myoneme network.
definition_source: DOI:10.1083/jcb.77.2.358
mapping_status: PROPOSED
