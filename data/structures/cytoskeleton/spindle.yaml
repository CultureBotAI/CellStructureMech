causal_graphs:
- graph_id: spindle_mechanism
  title: Bipolar spindle assembly, chromosome biorientation, and anaphase elongation
  description: Spindle pole body duplication and kinesin-5 (Cin8/Cut7) antiparallel
    sliding assemble a bipolar spindle that captures kinetochores and elongates during
    anaphase B via Ase1-stabilized midzone sliding.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph places spindle microtubules, spindle pole bodies, and kinetochores
    in a structural budding-yeast chromosome-segregation architecture without modeling
    every motor, microtubule-associated protein, or cell-cycle input.
