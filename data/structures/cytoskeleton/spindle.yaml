identifier: GO:0005819
label: spindle
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: The array of microtubules and associated molecules that forms between
  opposite poles of a eukaryotic cell during mitosis or meiosis and serves to move
  the duplicated chromosomes apart. The bipolar array of microtubules, microtubule-associated
  proteins, and motor proteins (kinesins and dynein) organized between two spindle
  pole bodies or centrosomal poles that aligns and segregates chromosomes during mitosis
  or meiosis in yeasts, fungi, microalgae, and protists. The spindle comprises kinetochore
  microtubules that capture sister chromatids, antiparallel interpolar microtubules
  crosslinked by Ase1/PRC1 and Cin8/Kip1 motors, and astral microtubules.
