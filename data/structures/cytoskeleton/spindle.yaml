  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The mitotic spindle uses alpha- and beta-tubulin subunits that
    are shared with other eukaryotic microtubule arrays; no exact source-neutral CURIE
    was assigned for only the mitotic-spindle tubulin constituents.
