  label: chromosome segregation
  grounding: GO:0007059
  description: Mediated by spindle (GO:0005819) within the bipolar chromosome-segregating
    spindle. Mitotic spindles move duplicated chromosomes apart by coupling kinetochores
    to spindle microtubules that extend from opposing spindle poles.
  evidence:
