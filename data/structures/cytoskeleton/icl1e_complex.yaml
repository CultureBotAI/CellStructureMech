discussions:
- discussion_id: identity_and_granularity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the named ICL1e assembly from a single centrin protein and neighboring
    structures.
  rationale: A discrete complex must not be merged with the whole lattice solely because
    they share a protein subfamily.
  notes: Hidden- and ignored-inclusive searches for ICL1e complex/dot, organizing-centre
    aliases and DOI/PMID found only the lattice record, its derived artifacts and
    citation caches. QuickGO ICL1e returned zero hits; broad complex searches yielded
    unrelated results, not an exact identity. GO:0120269 ciliary centrin arm denotes
    a rod flanking the trypanosome FAZ and is not equivalent. The authors name the
    persistent dot a functional complex on localization and depletion evidence. GO:0140535
    is used as parent, while direct contacts, purification and copy numbers remain
    unresolved. No strict basal-body-cylinder or whole-lattice parthood is asserted.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Localization Results and Figure 2 delimit the named dot and the bipartite
      BP remnant.
  - reference: https://www.ebi.ac.uk/QuickGO/services/ontology/go/search?query=ICL1e
    notes: Exact-name authority search used before minting.
  - reference: GO:0120269
    notes: Authoritative definition checked and rejected as identity.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: composition_and_family_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact ICL1e-family groundings and the molecular composition of the
    discrete complex.
  rationale: Colocalization and nonredundancy do not determine copy number, direct
    interaction or an exhaustive molecular inventory.
  notes: The study lists seven genes in three ohnolog pairs (ICL1e/ICL1g, Cen8/Cen10,
    Cen12/Cen15) plus Cen18, with representative GFP fusions. This is not a seven-copy
    stoichiometry. InterPro IPR050145 is broader than this paralogue group. Component
    essentiality remains UNKNOWN because whole-complex assembly was not independently
    resolved for every paralogue, despite clear functional effects of depletion. No
    UniProt accession is guessed.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Localization and depletion Results; RNAi Methods describe off-target screening
      and specificity controls.
  - reference: InterPro:IPR050145
    notes: Centrin/CML-like name, family type and broader description verified at
      the InterPro API.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: external_factors_not_constituents
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep localization dependencies and candidate connectors separate from established
    constituents.
  rationale: An upstream recruitment factor, downstream signal or neighboring marker
    is not automatically part of a complex.
  notes: Centrin2 is upstream in the localization experiments; Centrin3 is a downstream
    localization readout. Neither is added as a constituent or asserted direct binder.
    Sfi1-type connectors are proposed in the interaction Results, not established
    members. SAS-6, tubulin and 1A9-reactive centrin material label neighboring structures
    and are omitted. The family signal along the extended lattice is not equated with
    the discrete basal-body-associated dot.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Figures 2, 3, 6 and 7 and interaction Results distinguish markers, dependencies
      and hypothetical connections.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: cell_cycle_and_function_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Reconcile anchoring phenotypes with delayed complex recruitment at paired
    basal bodies.
  rationale: Whole-cell depletion phenotypes cannot establish a universal requirement
    for a detectable complex at every basal body.
  notes: Figure 5 and topological Results show that some newly formed anterior members
    of basal-body pairs lack a detected new ICL1e/Centrin3 spot until a later duplication.
    Developed basal bodies also persist after depletion. The record therefore describes
    normal cortical patterning and site-specific localization dependencies, not obligatory
    basal-body duplication, direct universal anchorage or a ternary Cen2-ICL1e-Cen3
    complex. Whole-lattice calcium buffering and contraction are not transferred to
    this subassembly.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Topological and depletion Results, Figure 5 and Discussion were reconciled
      rather than treating the broad Discussion wording as an unconditional rule.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: taxonomic_and_molecular_limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Test complex conservation and molecular architecture beyond the characterized
    Paramecium system.
  rationale: Conserved paralogues are not evidence that another organism builds the
    same assembly with the same function.
  notes: Only P. tetraurelia is asserted as an exemplar. The source discusses ICL1e
    homologues in P. caudatum, Tetrahymena, Oxytricha and other alveolates, but functional
    equivalence is not established here. No clade prevalence, absence, exact native
    size, purified-complex structure or direct-binding model is encoded.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Essential-function Discussion explicitly distinguishes characterized functions
      from inferred homologue roles.
  - reference: https://www.ebi.ac.uk/ena/taxonomy/rest/tax-id/5888
    notes: Verified canonical species name and rank; culture codes are not taxon CURIEs.
  posed_by: codex
  posed_date: '2026-10-03'
