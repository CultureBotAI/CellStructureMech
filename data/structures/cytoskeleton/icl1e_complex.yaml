    BP cells. Strain names remain metadata, not invented taxon identifiers.
functions:
- function_id: basal_body_patterning
  label: Cortical basal-body positioning support
  description: Contributes to normal basal-body positioning and anchoring. Depletion
    produces developed but unanchored basal bodies, not a failure of duplication per
    se; this is not a universal requirement for direct association with every basal
    body.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Depletion and topological Results, Figures 4 and 5, distinguish cortical
      insertion defects from basal-body formation and describe delayed complex recruitment
      at some paired basal bodies.
- function_id: centrin3_localization
  label: Right-proximal Centrin3 localization support
  description: Supports the normal right-proximal Centrin3 signal. Its early loss
    after ICL1e depletion differs from the initial persistence of the left-proximal
    and tip signals; direct binding is not established.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Interaction Results and Figure 7 use GFP-Centrin3 localization after ICL1e
      RNAi, including STED observations.
- function_id: icl_organizing_centre_assembly
  label: Infraciliary-lattice organizing-centre assembly support
  description: ICL1e-family activity supports organizing-centre assembly. In BP cells,
    depletion leaves newly formed basal bodies without these remnants; complex duplication
    precedes later 1A9-reactive material during cortical reorganization.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Timing and depletion Results, Figures 3 and 4. This is a functional assembly
      dependence, not a resolved nucleation reaction or equivalence of the ICL1e complex
      with the whole organizing centre.
