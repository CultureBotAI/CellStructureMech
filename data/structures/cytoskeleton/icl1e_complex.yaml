identifier: cellstructuremech:icl1e_complex
label: ICL1e complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A basal-body-associated centrin assembly described in Paramecium tetraurelia
  as a functional complex of ICL1e-subfamily proteins. It appears as a discrete ICL1e-positive
  dot and persists in cells lacking the extended infraciliary lattice; it is distinct
  from the whole lattice and from the complete infraciliary-lattice organizing-centre
  remnant.
