associated_traits:
- trait_id: METPO:1000681
  trait_label: rod shaped
  relation: REQUIRED_FOR
  evidence:
  - reference: DOI:10.1016/j.cell.2018.02.050
    snippet: MreB depletion results in loss of rod-like shape and rounding (Kruse
      et al., 2005), and there are no E. coli mutants or growth conditions known to
      restore rod-like shape in the absence of MreB.
    notes: 'Verbatim from the open-access full text (PMC5846203). Supports REQUIRED_FOR
      rather than CONFERS: the shape is lost without MreB, and nothing restores it,
      but MreB alone does not produce a rod.'
  - reference: DOI:10.1016/j.cell.2018.02.050
    snippet: Many rod-like and curved bacterial species require MreB to elongate,
      although there are exceptions such as the Actinobacteria and Rhizobiales that
      lack MreB altogether.
    notes: 'The same source bounds the claim: rod shape can be achieved without MreB
      in some lineages, so the requirement is not universal across bacteria.'
- trait_id: METPO:1000666
  trait_label: cell shape
  relation: MODULATES
  evidence:
  - reference: DOI:10.1016/j.cell.2018.02.050
    snippet: MreB both senses and changes cell shape, thereby generating a self-organizing
      feedback system for shape maintenance.
    notes: 'Verbatim from the open-access full text (PMC5846203). MODULATES rather
      than CONFERS: the filament is described as sensing and adjusting shape, not
      dictating it.'
