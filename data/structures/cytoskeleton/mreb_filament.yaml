  rationale: GO has no cellular-component term for MreB or for a bacterial actin cytoskeleton,
    so docs/CURATION.md requires minting with the nearest broader term as a parent.
    The local part is a lowercase slug of the label rather than a counter, because
    a slug needs no allocator and reads in a URL; the cost is that it looks stale
    if the preferred label ever changes, which is acceptable since identifiers are
    never renamed.
