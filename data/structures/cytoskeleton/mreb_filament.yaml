    notes: Shi et al. 2018 review MreB's role in organising sidewall synthesis and
      rod shape.
  - reference: DOI:10.1146/annurev-genet-102108-134845
    notes: The Bacterial Cytoskeleton (2010) links mreB loss to loss of rod shape.
