identifier: cellstructuremech:mreb_filament
label: MreB filament
definition: The actin-like cytoskeletal filament of rod-shaped bacteria. MreB polymerises
  into short membrane-associated filaments that circle the cell at an angle to its
  long axis and move processively around it, carrying the elongasome — the peptidoglycan
  synthases that widen the sidewall — so that new wall material is inserted where
  the filaments travel. It is a homologue of eukaryotic actin by fold, not by sequence
  identity.
definition_source: DOI:10.1146/annurev-genet-102108-134845
synonyms:
- synonym_text: bacterial actin
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1146/annurev-genet-102108-134845
structure_category: CYTOSKELETON
structure_kind: FILAMENT
parent_structures:
- GO:0005856
components:
- component_id: mreb
  label: MreB
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - mreB
  essentiality: ESSENTIAL
  role: The filament subunit; an actin-fold ATPase that polymerises into short antiparallel
    double filaments on the membrane.
  evidence:
  - reference: DOI:10.1146/annurev-genet-102108-134845
    notes: The Bacterial Cytoskeleton (2010) describes MreB as the actin homologue
      of rod-shaped bacteria.
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 review MreB filament architecture and its membrane association.
- component_id: elongasome_link
  label: RodZ
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - rodZ
  essentiality: CONDITIONAL
  role: 'Bridges the filament to the elongasome, the sidewall-synthesis machine the
    filament guides. MreC and MreD were listed here until #102: they are constituents
    of that machine, not of this filament, and now live on the elongasome record.'
  evidence:
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 describe RodZ coupling MreB to the synthetic complex.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: 'Present in many rod-shaped and curved lineages and absent from most cocci,
    but the correlation is not tight: Actinobacteria and Rhizobiales are rod-like
    or curved and lack MreB altogether.'
  reference: DOI:10.1016/j.cell.2018.02.050
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: RARE
  note: Actin-fold proteins occur in archaea, but the MreB-elongasome system is a
    bacterial arrangement.
  reference: DOI:10.1146/annurev-genet-102108-134845
canonical_examples:
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  note: The system in which filament motion was shown to be driven by wall synthesis.
  reference: DOI:10.1016/j.cell.2018.02.050
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: Reference Gram-positive elongasome.
  reference: DOI:10.1146/annurev-genet-102108-134845
