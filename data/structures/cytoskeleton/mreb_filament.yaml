discussions:
- discussion_id: first_minted_identifier
  prompt: This is the corpus's first minted identifier — is the scheme right?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#mreb
  rationale: GO has no cellular-component term for MreB or for a bacterial actin cytoskeleton,
    so docs/CURATION.md requires minting with the nearest broader term as a parent.
    The local part is a lowercase slug of the label rather than a counter, because
    a slug needs no allocator and reads in a URL; the cost is that it looks stale
    if the preferred label ever changes, which is acceptable since identifiers are
    never renamed.
  posed_by: claude
  posed_date: '2026-09-01'
- discussion_id: guides_the_elongasome
  prompt: The filament guides the elongasome, and the schema has no relation that
    says so.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - components#elongasome_link
  rationale: 'MreB filaments carry the RodA-PBP2 synthases around the cell; that is
    the point of the structure. It was briefly recorded as xrefs: [cellstructuremech:elongasome],
    but the schema defines xrefs as true equivalence and the two are not equivalent,
    so the claim was false as written and removed (#119). Until a relation exists,
    the link lives in the RodZ component role and in this discussion.'
  posed_by: claude
  posed_date: '2026-09-02'
