    notes: Polka et al. 2009 modeled AlfA as a plasmid-encoded actin without resolving
      a source-neutral protein-family identifier.
  posed_by: codex
  posed_date: '2026-09-22'
- discussion_id: exclude_alfb_parn_from_filament_components
  prompt: AlfB and parN are graph-scoped centromere adaptors rather than AlfA filament
    constituents.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#alfa_pls32_family_partitioning
  rationale: AlfB bound to parN centromere DNA regulates AlfA filament organization
    in the partition system, but the component list keeps only the AlfA polymer subunit
    as a constituent of the filament itself.
  evidence:
  - reference: DOI:10.1073/pnas.1304127111
    notes: Polka et al. 2014 characterized AlfB/parN regulation of the AlfA plasmid-partition
