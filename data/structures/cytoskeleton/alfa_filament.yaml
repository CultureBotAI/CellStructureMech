    notes: Polka et al. 2009 analyzed purified AlfA polymerization and filament ultrastructure.
taxonomic_distribution:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  presence: VARIABLE
  note: AlfA is encoded by pLS32-family plasmid partition systems characterized in
    Bacillus subtilis; this record does not assert the filament across all Bacillus
    subtilis strains.
  reference: DOI:10.1038/sj.emboj.7601443
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: Host species used to characterize AlfA filament formation and segregation
    of the pLS32-family miniplasmid pBET131.
  reference: DOI:10.1038/sj.emboj.7601443
functions:
- function_id: pls32_family_plasmid_segregation
  label: pLS32-family plasmid segregation
  description: AlfA filaments work with the AlfB adaptor and the parN centromere to
    support active segregation of pLS32-family plasmid DNA in Bacillus subtilis.
  evidence:
  - reference: DOI:10.1038/sj.emboj.7601443
    notes: Becker et al. 2006 showed that AlfA is needed for active segregation of
      pBET131, a pLS32 derivative.
  - reference: DOI:10.1073/pnas.1304127111
    notes: Polka et al. 2014 connected AlfA dynamics to AlfB and parN-dependent plasmid
      positioning.
evidence:
- reference: DOI:10.1038/sj.emboj.7601443
  notes: Becker, Moller-Jensen, Jensen and Gerdes 2006, DNA segregation by the bacterial
    actin AlfA during Bacillus subtilis growth and development, EMBO Journal.
- reference: DOI:10.1016/j.str.2009.07.008
  notes: Polka, Kollman, Agard and Mullins 2009, The Structure and Assembly Dynamics
    of Plasmid Actin AlfA Imply a Novel Mechanism of DNA Segregation, Structure.
- reference: DOI:10.1073/pnas.1304127111
  notes: Polka et al. 2014, Accessory factors promote AlfA-dependent plasmid segregation
    by regulating filament nucleation, disassembly, and bundling, PNAS.
- reference: DOI:10.1073/pnas.1716424115
  notes: Szewczak-Harris and Lowe 2018, Cryo-EM reconstruction of AlfA from Bacillus
    subtilis reveals the structure of a simplified actin-like filament at 3.4-A resolution,
    PNAS.
- reference: DOI:10.1128/JB.01312-09
  notes: Tanaka and Ogura 2010, Bacillus subtilis plasmid pBET131 is closely related
    to pLS32 and carries a replication and partitioning region.
