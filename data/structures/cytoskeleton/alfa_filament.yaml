  role: Plasmid-encoded actin-like ATPase subunit that polymerizes into filaments
    for pLS32-family plasmid segregation.
  evidence:
  - reference: DOI:10.1038/sj.emboj.7601443
    notes: Becker et al. 2006 tied the Bacillus subtilis AlfA protein to actin-like
      filaments and active plasmid segregation.
