discussions:
- discussion_id: resolve_alfa_family_grounding
  prompt: Resolve exact source-neutral grounding for pLS32-family AlfA actin-like
    ATPases.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#alfa
  rationale: This first record curates AlfA from the Bacillus subtilis pLS32-family
    partition system without asserting that a broad actin ATPase or bacterial actin-like
    family accession exactly denotes filament-forming AlfA proteins.
  evidence:
