discussions:
- discussion_id: resolve_intraconoid_microtubule_end_factors
  prompt: Resolve the filament-end organizers and accessory proteins that place the
    two intraconoid microtubules within the conoid.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#toxoplasma_intraconoid_microtubule_topology
  rationale: This first record captures the mature topology of the two Toxoplasma
    intraconoid microtubules but leaves filament-end organizers, polar-ring linkers
    and assembly timing out until candidate proteins are localized directly to the
    intraconoid microtubule boundary.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 localized candidate proteins to several Toxoplasma apical-cytoskeleton
      subcompartments.
  posed_by: codex
  posed_date: '2026-09-22'
- discussion_id: distinguish_conoid_tubulin_fibers
  prompt: Keep the conventional intraconoid microtubules distinct from the unusual
    ribbon-like tubulin fibers that form the conoid.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#alpha_beta_tubulins
  rationale: Hu et al. distinguished the two intraconoid microtubules from the conoid
    fibers, whose tubulin protofilaments form a ribbon polymer rather than a closed
    microtubule tube. This record therefore curates only the two conventional intraconoid
    microtubules.
  evidence:
  - reference: DOI:10.1083/jcb.200112086
    notes: Hu, Roos and Murray 2002 resolved the Toxoplasma conoid fibers as an unusual
      tubulin polymer distinct from conventional microtubules.
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 separately described the conoid fibers, the two intraconoid
      microtubules and the subpellicular microtubules of Toxoplasma.
  posed_by: codex
  posed_date: '2026-09-22'
  resolved_date: '2026-09-22'
- discussion_id: intraconoid_ring_projection_scope
  prompt: Do not infer a specific anterior-ring endpoint from the generic GO polar-ring
    wording.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - definition
  - functions#conoid_center_microtubule_scaffold
  - causal_graphs#toxoplasma_intraconoid_microtubule_topology
  rationale: GO:0033289 describes projection through a polar ring without selecting
    a ring identifier or filament endpoint. The earlier graph added distal ends and
    GO:0020031, the anterior conoid-fiber-origin ring. Historical schematic terminology
    is not enough to establish that precise edge; modern studies distinguish preconoidal
    rings from the fixed APR.
  resolution_note: Retain the attributed GO definition but remove the unsupported
    anterior-ring projection edge and matching prose. Hu 2006 supports the pair of
    conventional microtubules inside the conoid; Li 2023 Figure 2 and polarity analysis
    of 13 ICMTs support basal-directed extension in Toxoplasma tachyzoites. No alternative
    ring attachment, organizer identity or general assembly mechanism is inferred.
    Original end-factor TODO and prior evidence-placement fixes remain unchanged.
  evidence:
  - reference: GO:0033289
    notes: Authority wording does not specify the distal endpoint or GO ring identifier.
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: The pair of conventional intraconoid microtubules is distinguished from
      conoid fibers and SPMTs.
  - reference: DOI:10.1002/advs.202206595
    notes: Results and Figure 2C/D show ICMTs extending from the inner conoid toward
      the basal end.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
