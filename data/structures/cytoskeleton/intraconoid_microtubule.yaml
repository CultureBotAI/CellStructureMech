discussions:
- discussion_id: resolve_intraconoid_microtubule_end_factors
  prompt: Resolve the filament-end organizers and accessory proteins that place the
    two intraconoid microtubules within the conoid.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#toxoplasma_intraconoid_microtubule_topology
  rationale: This first record captures the mature topology of the two Toxoplasma
    intraconoid microtubules but leaves candidate end-binding proteins, polar-ring
    linkers and assembly timing out until their boundaries and direct evidence are
    curated.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 localized multiple candidate apical cytoskeletal proteins
      near the Toxoplasma conoid and intraconoid microtubules.
  posed_by: codex
  posed_date: '2026-09-22'
- discussion_id: distinguish_conoid_tubulin_fibers
  prompt: Keep the conventional intraconoid microtubules distinct from the unusual
    ribbon-like tubulin fibers that form the conoid.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#alpha_beta_tubulins
  rationale: Hu et al. distinguished the two intraconoid microtubules from the conoid
    fibers, whose tubulin protofilaments form a ribbon polymer rather than a closed
    microtubule tube. This record therefore curates only the two conventional intraconoid
    microtubules.
  evidence:
  - reference: DOI:10.1083/jcb.200112086
    notes: Hu, Roos and Murray 2002 resolved the Toxoplasma conoid fibers as an unusual
      tubulin polymer distinct from conventional microtubules.
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 separately described the conoid fibers, the two intraconoid
      microtubules and the subpellicular microtubules of Toxoplasma.
  posed_by: codex
  posed_date: '2026-09-22'
  resolved_date: '2026-09-22'
