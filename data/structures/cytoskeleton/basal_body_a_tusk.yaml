discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the A-tusk distinct from the A-C linker and other basal-body densities.
  rationale: A named morphological subassembly is not the entire basal body or an
    asserted protein.
  notes: Hidden/ignored-inclusive repository searches and parsed identifiers, labels
    and synonyms across 871 prior records found no standalone A-tusk identity. Complete
    QuickGO queries tusk (0), A-tusk (730), centriole tusk (22) and basal body tusk
    (399) returned no exact term. Kind OTHER and parent GO:0005575 deliberately retain
    unresolved molecular classification. Basal body is parthood, not is-a. A-tusk,
    A-link trunk, ArmA, ArmB, triplet base, pinhead, D2-rod and tubulin protofilaments
    are not exact synonyms. Proximity to the A-C linker is not used to assert obligatory
    A-C-linker, cartwheel or pro-basal-body parthood.
  evidence:
