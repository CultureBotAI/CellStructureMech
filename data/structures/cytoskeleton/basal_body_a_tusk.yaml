- discussion_id: native_composition_and_role
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify native A-tusk constituents and determine its specific biological
    role.
  rationale: A segmented protrusion and a static spatial offset do not establish molecular
    membership or function.
  notes: Direct molecular localization or a sequence-resolved model is needed before
    assigning components, stoichiometry or protein-family groundings. The inspected
    morphological evidence does not establish A-tusk-specific essentiality, assembly
    order, force transmission or mechanical stiffness. No function, trait or causal
    graph is asserted solely from the surrounding basal-body architecture.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: declined_linker_component_transfer
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not transfer neighboring A-C-linker protein assignments into A-tusk composition.
  rationale: An assignment to a connected assembly in another species does not identify
    this density.
  notes: The inspected Cai et al. 2025 Tetrahymena study assigns WRAP73, CEP135, TBC1D31
    and POC1 to A-C-linker regions and leaves additional helical elements unassigned.
    Its JATS contains no A-tusk identification. These observations do not explicitly
    establish the identity or composition of the named Paramecium A-tusk. No linker
    protein or tubulin family is imported here as a constituent merely because it
    lies in the same broader reconstruction.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: measurement_and_processing_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish neighboring-triplet offsets from a biological repeat or mechanical
    measurement.
  rationale: Reconstruction sampling and adjacent-module annotations are not A-tusk
    dimensions.
  notes: Figure EV5E labels two axial offsets, 5.2 and 3.3 nm, around one neighboring
    A-tusk position. Do not sum these into an independently measured A-tusk repeat.
    The Methods pick subvolumes every 8.5 nm; Figure 5 warns that this imposed a pinhead
    periodicity. The 8.4 +/- 0.2 nm value concerns the A-C linker, and 31.5 angstroms
    is reconstruction resolution. The approximately 35-nm label belongs to the triplet
    base; 6- and 9-degree changes concern triplet/linker orientation. None is an A-tusk
    length, stoichiometry or force measurement. The 1941 extracted subvolumes, split
    into 1042 proximal and 899 distal classes, are processing counts, not biological
    copy numbers.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: taxonomic_and_image_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the directly supported example separate from cross-species linker comparisons.
  rationale: A multipanel comparison does not establish the same named density in
    every illustrated taxon.
  notes: Figure 5 and Figure EV5C-E directly label the Paramecium A-tusk. Figure EV5F-H
    compares A-C linkers from Paramecium, Chlamydomonas and Trichonympha; it is not
    used to assert broad A-tusk distribution, homologous protein composition or absence
    in other taxa. Only the single-species Figure 5 is hosted. The d4-2 and Delta-CenBP1
    preparation strains are retained without assigning the image to one strain or
    interpreting it as a perturbation phenotype.
