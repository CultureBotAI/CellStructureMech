discussions:
- discussion_id: child_records_hold_arm_specific_chain_details
  prompt: Should arm-specific heavy-chain isoforms and outer-arm intermediate and
    light-chain groups be curated on the generic axonemal dynein complex record?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0005858 is the generic axonemal dynein complex parent for inner-arm
    and outer-arm dynein complexes. The child GO terms carry the specific inner-arm
    and outer-arm boundaries needed to curate chain-set composition without conflating
    the two axonemal motor classes.
  resolution_note: Kept this record focused on the shared GO:0005858 parent and left
    inner-arm isoforms plus outer-arm heavy, intermediate and light chain groups on
    the GO:0036156 and GO:0036157 child records.
  evidence:
  - reference: GO:0005858
    notes: QuickGO lists inner and outer dynein arm terms as is_a children of the
      axonemal dynein complex.
  - reference: GO:0036156
    notes: The inner dynein arm child term carries the inner-arm complex definition.
  - reference: GO:0036157
    notes: The outer dynein arm child term carries the outer-arm heavy-, intermediate-
      and light-chain definition.
  posed_by: codex
  posed_date: '2026-09-24'
  resolved_date: '2026-09-24'
