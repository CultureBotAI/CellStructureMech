      notes: Figure 9 and immunoblot results; no complete molecular inventory or stoichiometry
        is implied.
  - subject: distal_fiber
    predicate: undergoes calcium-induced
    object: contraction
    description: The connecting fiber is more condensed in calcium-treated preparations.
    evidence:
    - reference: DOI:10.1083/jcb.105.2.903
      notes: Figure 9 contrasts expanded and condensed fibers in the extracted apparatus.
  - subject: calcium
    predicate: triggers
    object: contraction
    description: Raising free calcium elicits contraction in the tested preparations,
      including those without ATP added to the reactivation solution.
    evidence:
    - reference: DOI:10.1083/jcb.105.2.903
      notes: Results, Figures 3-5 and 9; lack of added ATP is not proof of an ATP-independent
        complete contraction-extension cycle.
  - subject: contraction
    predicate: reorients
    object: basal_body_reorientation
    description: The physical bridge reorients the paired basal bodies even when axonemal
      beating is inhibited or axonemes have been amputated.
    evidence:
    - reference: DOI:10.1083/jcb.105.2.903
      notes: Orthovanadate, DTT/ATP-omission and mechanical-amputation experiments
        support separation from axonemal motility.
  - subject: basal_body_reorientation
    predicate: repositions attached axonemes into
    object: axoneme_orientation
    description: When axonemes remain attached, their relative projection follows
      basal-body reorientation; waveform conversion is a separate calcium response.
    evidence:
    - reference: DOI:10.1083/jcb.105.2.903
      notes: Figures 3-5 and Results distinguish axonemal geometry from beating. No
        requirement for the fiber to initiate flagellar beating is asserted.
evidence:
- reference: DOI:10.1083/jcb.105.2.903
  notes: Full ten-page primary PDF text read; Figure 9 visually inspected. Identity,
    fiber-localized antigen and calcium-triggered mechanical response.
- reference: DOI:10.1083/jcb.119.6.1613
  notes: Primary Methods, mutant/revertant Results and Table II inspected; normal
    distal-fiber assembly is separable from other centrin assemblies.
- reference: DOI:10.1083/jcb.98.3.818
  notes: Full seven-page primary PDF text read. Pleiotropic vfl3 comparisons preserve
    the study-specific negative results on waveform, synchrony and shock response.
- reference: DOI:10.1002/(SICI)1097-0169(1998)41:1<49::AID-CM4>3.0.CO;2-A
  notes: Complete primary abstract read through Europe PMC; full paper and figures
    unread. Chlamydomonas angle reversibility is not transferred to Spermatozopsis.
- reference: DOI:10.1073/pnas.1518527113
  notes: Primary abstract and significance statement read through NCBI EFetch. Full
    text unavailable through attempted PMC web, Europe PMC and current PMC OA routes;
    later coupling evidence remains abstract-bounded.
- reference: GO:0043232
  notes: Verified intracellular membraneless organelle as a broad is-a parent, not
    exact identity.
- reference: GO:0005856
  notes: Verified cytoskeleton term for parthood, not equivalence to the whole framework.
- reference: https://sagdb.uni-goettingen.de/detailedList.php?str_number=1.85
  notes: Authority confirms SAG 1.85 as Spermatozopsis similis; strain label agrees
    with the 1987 Methods.
discussions:
- discussion_id: distal_fiber_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the interbasal distal fiber separate from proximal fibers and nucleus-directed
    rootlets.
  rationale: Shared centrin and adjacent attachment sites do not establish equivalent
    structures.
  notes: Ignored- and hidden-inclusive searches found only prior mentions, not an
    exact record. GO:0035253 is nucleus-directed; GO:0120118 is an interflagellar
    membrane junction; neither is exact identity. The Spermatozopsis fiber is unstriated,
    so distal striated fiber and DSF are narrow synonyms. OTHER denotes the organized
    fiber bundle, not one protein or filament.
  evidence:
  - reference: DOI:10.1083/jcb.105.2.903
    notes: Results distinguish one distal, two proximal connecting fibers and separate
      rootlets; Figure 9F is the nucleus connector, not the distal fiber.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: NBBC, DSF and transition-region structures are distinguished in Table II.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: molecular_inventory
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact centrin-family grounding and additional distal-fiber constituents.
  rationale: Immunoreactivity and one verified species sequence do not establish a
    complete cross-taxon inventory.
  notes: IPR050145 and IPR050230 are broader than this component class. Do not import
    SF-assemblin from system-I root fibers, or proposed whole-centrin-scaffold proteins
    into this bridge without direct evidence. The approximately 3% protein estimate
    in the 1987 gel analysis is for the isolated apparatus, not distal-fiber stoichiometry.
    Essentiality remains unknown across the record's scope.
  evidence:
  - reference: InterPro:IPR050145
    notes: Authority includes CML and obelin proteins.
  - reference: InterPro:IPR050230
    notes: Authority describes multiple calcium-binding regulatory-protein classes.
  - reference: DOI:10.1083/jcb.105.2.903
    notes: Distinct antigen localization and whole-apparatus biochemical sampling.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: Centrin sequence substitutions affect normal distal-fiber assembly.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: contractile_cycle_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve native force generation and species-specific reextension mechanisms.
  rationale: Preparations differ in reversibility and do not identify every biochemical
    intermediate.
  notes: Spermatozopsis basal bodies do not recover antiparallel geometry on calcium
    reduction in the isolated preparation, despite waveform reversal; intact-cell
    recovery is slower. Chlamydomonas angle reversal in the 1998 abstract is a different
    preparation and species. No phosphorylation step, complete ATP-free cycle, or
    mandatory phobic-response function is inferred. Basal-body angles and constituent-filament
    diameters are not dimensions of the whole fiber.
  evidence:
  - reference: DOI:10.1083/jcb.105.2.903
    notes: Results and Discussion separate reorientation, waveform switching and unknown
      reextension.
  - reference: DOI:10.1002/(SICI)1097-0169(1998)41:1<49::AID-CM4>3.0.CO;2-A
    notes: Primary abstract reports reversible angle changes and suggests, rather
      than proves, a role in phobic responses.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: synchronization_evidence
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile experimental conditions and isolate the distal fiber's contribution
    to flagellar coordination.
  rationale: Multistructure mutants cannot by themselves establish a distal-fiber-specific
    necessity or absence of function.
  notes: The 1984 vfl3 study found similar waveform, frequency and synchrony under
    its filming conditions, but both striated fibers and microtubular roots were abnormal.
    The 2016 primary abstract reports altered synchronization in basal-connection-defective
    mutants and supports internal coupling. Its full experimental text was not reached
    in this pass. Neither observation is promoted into a universal positive or negative
    distal-fiber mechanism.
  evidence:
  - reference: DOI:10.1083/jcb.98.3.818
    notes: Discussion explicitly cannot separate fiber and microtubular-rootlet contributions.
  - reference: DOI:10.1073/pnas.1518527113
    notes: Abstract and significance statement support internal coupling, not a molecularly
      isolated distal-fiber mechanism.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: segregation_not_assigned
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not transfer the entire vfl2 segregation phenotype to the distal fiber.
  rationale: The centrin mutation affects several distinct assemblies.
  notes: Class-2 revertants with abnormal distal fibers retain normal NBBCs and transition
    regions and run the basal-body cycle normally. The authors argue against a necessary
    distal-fiber role in accurate segregation. No required mitotic or segregation
    function is added.
  evidence:
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: Table II and Discussion distinguish structural phenotypes and their functional
      interpretation.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: taxonomic_and_function_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Extend directly demonstrated taxonomic scope and resolve an exact reorientation
    function term.
  rationale: Two studied species do not establish clade-wide prevalence or identical
    geometry.
  notes: Both species identifiers were authority-verified. No distribution row or
    unverified strain identifier is added. GO:0032053 ciliary basal body organization
    describes assembly and arrangement of constituent parts, not exactly the interbasal
    angular response; function labels remain ungrounded rather than asserting equivalence.
  evidence:
  - reference: DOI:10.1083/jcb.105.2.903
    notes: Spermatozopsis experiments and explicit comparison with Chlamydomonas.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: Chlamydomonas distal-fiber comparisons.
  - reference: GO:0032053
    notes: Authority definition checked; no exact function mapping asserted.
  posed_by: codex
  posed_date: '2026-10-04'
