identifier: cellstructuremech:distal_connecting_fiber
label: distal connecting fiber
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A centrin-containing fibrous bridge connecting the distal regions of paired
  flagellar basal bodies in green algae. It is distinct from proximal connecting fibers
  and nucleus-directed rootlets; cross-striation differs between the documented examples.
definition_source: DOI:10.1083/jcb.105.2.903
mapping_status: PROPOSED
