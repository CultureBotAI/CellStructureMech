components:
- component_id: distal_fiber_centrins
  label: Distal connecting fiber centrins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Calcium-binding constituents of the distal fiber. Centrin sequence substitutions
    affect normal distal-fiber assembly in the tested Chlamydomonas strains; this
    is not a universal essentiality assertion.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Reviewed IPR050145 includes non-centrin CML and obelin proteins;
    IPR050230 is an even broader calcium-binding protein family. Neither denotes the
    distal-fiber centrin class exactly. EF-hand domains are not family identities.
  protein_examples:
  - uniprot_id: UniProtKB:P05434
    protein_label: Caltractin
    taxon_id: NCBITaxon:3055
    taxon_label: Chlamydomonas reinhardtii
    entry_status: REVIEWED
    retrieved_on: '2026-10-04'
    role: Species-level centrin example, not a distal-fiber-specific paralogue or
      an entire fiber inventory.
    evidence:
    - reference: UniProtKB:P05434
      notes: Verified reviewed entry, recommended name, organism and sequence-source
        references; no primary gene symbol is supplied.
    - reference: DOI:10.1083/jcb.119.6.1613
      notes: The centrin/caltractin sequence and vfl2 linkage identify the studied
        protein; Methods use pCaBP4 and the sequence publications also cited by UniProt.
        Mutants and intragenic revertants distinguish distal-fiber assembly phenotypes.
  evidence:
  - reference: DOI:10.1083/jcb.105.2.903
    notes: Anti-20-kDa-protein immunogold labels the distal connecting fiber of Spermatozopsis
      similis; apparatus immunoblots detect the antigen. No exact Spermatozopsis sequence
      is assigned.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: E101K centrin and position-101 revertants alter normal distal striated
      fiber formation. Class-2 revertants retain abnormal half fibers despite normal
      nucleus-basal body connectors and transition-region structures.
canonical_examples:
- taxon_id: NCBITaxon:3192
  taxon_label: Spermatozopsis similis
  reference: DOI:10.1083/jcb.105.2.903
  note: SAG 1.85 is explicitly used in Methods and was verified against the culture
    collection. The distal fiber is unstriated in this example; extracted-apparatus
    reorientation and immunogold localization were studied.
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  reference: DOI:10.1083/jcb.119.6.1613
  note: Wild-type, vfl2 and intragenic-revertant comparisons resolve the cross-striated
    distal fiber from other centrin assemblies. No collection accession is inferred
    from the mutant names.
functions:
- function_id: interbasal_body_linkage
  label: interbasal-body linkage
  description: The distal fiber forms a physical bridge between paired flagellar basal
    bodies, separately from the proximal fibers and nucleus-directed connectors.
  evidence:
  - reference: DOI:10.1083/jcb.105.2.903
    notes: Ultrastructure and Figure 9 distinguish the interbasal bridge from adjacent
      root structures.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: Distal half-fiber assembly and continuity between the basal bodies are
      assessed separately from other centrin structures.
- function_id: calcium_dependent_reorientation
  label: calcium-dependent basal-body reorientation
  description: Distal-fiber contraction reorients paired basal bodies in Spermatozopsis
    similis. Chlamydomonas preparations show smaller, reversible calcium-dependent
    angle changes; the two experimental responses are not treated as identical.
  evidence:
  - reference: DOI:10.1083/jcb.105.2.903
    notes: Reorientation persists when beating is blocked or axonemes are mechanically
      removed, supporting a separate contractile apparatus.
  - reference: DOI:10.1002/(SICI)1097-0169(1998)41:1<49::AID-CM4>3.0.CO;2-A
    notes: Primary abstract reports calcium-dependent interaxonemal-angle changes
      in pf18 and pf18fa1 preparations and lack of that response in pf18vfl2. Full
      paper unread; vfl2 is not a selective distal-fiber perturbation.
causal_graphs:
- graph_id: spermatozopsis_distal_fiber_reorientation
  title: Calcium-driven distal-fiber contraction in extracted Spermatozopsis apparatuses
  description: A physical contractile mechanism, with constituent and geometry context.
    Elevated calcium condenses the fiber and reorients basal bodies; attached axonemes
    change their relative orientation. This does not require ongoing beating and does
    not establish the molecular force-generating cycle.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: Restricted to Spermatozopsis similis extracted preparations. No direct
    centrin conformational reaction, kinase, light-to-calcium pathway, universal ATP-free
    cycle, or reverse edge is asserted. Low calcium failed to restore antiparallel
    basal bodies in this preparation.
