  role: Eukaryotic tubulin subunits that co-polymerize into microtubule protofilaments.
  evidence:
  - reference: GO:0005874
    notes: Gene Ontology defines microtubules as hollow tubes made from polymeric
      tubulin protofilaments.
  - reference: DOI:10.1126/science.1128618
