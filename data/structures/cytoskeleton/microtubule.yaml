- discussion_id: exclude_prokaryotic_phage_tubulin_like_filaments
  prompt: Keep bacterial, archaeal and phage tubulin-like filaments separate from
    the GO:0005874 eukaryotic microtubule record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#eukaryotic_microtubule_polymer
  rationale: GO:0005874 denotes eukaryotic microtubules built from alpha/beta tubulin
    into canonical hollow tubes, while this corpus separately models bacterial BtubAB
    mini-microtubules, bacterial TubZ partition filaments, phage PhuZ spindles, archaeal
    CetZ filaments and FtsZ-family division rings as non-eukaryotic tubulin/FtsZ-superfamily
    or tubulin-like cytoskeletal systems with different subunits, architectures or
    cargo relationships.
  evidence:
  - reference: GO:0005874
    notes: GO defines GO:0005874 around microtubules found in eukaryotic cells.
  - reference: DOI:10.1371/journal.pbio.1001213
    notes: Pilhofer et al. 2011 characterized Prosthecobacter BtubA/B tubes as bacterial
      homologs of the eukaryotic microtubule cytoskeleton.
  - reference: DOI:10.1073/pnas.1705062114
    notes: Deng et al. 2017 resolved a BtubAB mini-microtubule architecture distinct
      from canonical eukaryotic microtubules.
  - reference: DOI:10.1101/gad.1546107
    notes: Larsen et al. 2007 characterized TubZ as a treadmilling prokaryotic tubulin-like
      polymer for pBtoxis plasmid stability.
  - reference: DOI:10.7554/eLife.03197
    notes: Erb et al. 2014 characterized PhuZ as a bacteriophage tubulin that forms
      dynamic filaments.
  - reference: DOI:10.1038/nature13983
    notes: Duggin et al. 2015 characterized archaeal CetZ1 tubulin-like proteins as
      cell-shape cytoskeletal factors.
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    notes: McQuillen and Xiao 2020 reviewed FtsZ rings as tubulin-homolog organizers
      of bacterial cytokinesis.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
