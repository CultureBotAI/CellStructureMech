functions:
- function_id: microtubule_cytoskeletal_scaffold
  label: microtubule cytoskeletal scaffold
  description: Eukaryotic microtubules act as tubulin-polymer scaffolds for microbial
    structures including Chlamydomonas axonemes and Giardia ventral-disc arrays.
  evidence:
