identifier: GO:0005874
label: microtubule
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: Any of the long, generally straight, hollow tubes of internal diameter
  12-15 nm and external diameter 24 nm found in a wide variety of eukaryotic cells;
  each consists (usually) of 13 protofilaments of polymeric tubulin, staggered in
  such a manner that the tubulin monomers are arranged in a helical pattern on the
  microtubular surface, and with the alpha/beta axes of the tubulin subunits parallel
  to the long axis of the tubule; exist in equilibrium with pool of tubulin monomers
  and can be rapidly assembled or disassembled in response to physiological stimuli;
  concerned with force generation, e.g. in the spindle.
definition_source: GO:0005874
mapping_status: PROPOSED
