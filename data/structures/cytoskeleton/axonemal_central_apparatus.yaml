  role: The second asymmetric central singlet microtubule in the axonemal central
    pair.
  evidence:
  - reference: GO:1990720
    notes: GO identifies the C2 axonemal microtubule as the central-pair partner of
      the C1 axonemal microtubule.
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 resolved Chlamydomonas central-pair microtubules and
      their associated densities.
