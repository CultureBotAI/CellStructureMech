  grounding_notes: GO exactly identifies the whole axonemal central apparatus and
    the C1 and C2 axonemal microtubules, but no exact source-neutral term for the
    central-pair projection class was verified in this pass.
  role: Protein-dense projections attached to the central-pair microtubules.
  evidence:
  - reference: GO:1990716
    notes: GO includes central pair projections among the associated structures of
      the axonemal central apparatus.
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 resolved asymmetric densities in the Chlamydomonas
      central-pair region.
