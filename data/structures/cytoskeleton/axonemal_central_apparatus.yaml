    link C1 and C2 was verified in this pass.
  role: Bridge structures that link the two central-pair microtubules.
  evidence:
  - reference: GO:1990716
    notes: GO includes bridges linking the two central-pair tubules among the axonemal
      central apparatus associated structures.
