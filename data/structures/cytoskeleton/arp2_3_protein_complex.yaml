- function_id: endocytic_internalization
  label: endocytic internalization
  description: Yeast actin cortical patches assemble at cortical endocytic sites and
    move inward as internalization proceeds.
  evidence:
  - reference: DOI:10.1016/S0092-8674(03)00883-3
    notes: Kaksonen, Sun and Drubin 2003 followed receptors, adaptors and actin during
      yeast endocytic internalization.
evidence:
- reference: GO:0005885
  notes: 'Gene Ontology cellular-component term for Arp2/3 protein complex: A stable
    protein complex that contains two actin-related proteins, Arp2 and Arp3, and five
    novel proteins (ARPC1-5), and functions in the nucleation of branched actin filaments.'
- reference: GO:0030479
  notes: Gene Ontology cellular-component term for the actin cortical patch.
- reference: GO:0015629
  notes: Actin cytoskeleton is a containing structure, not an is-a parent of the patch;
    the direct GO parthood relation uses cortical actin cytoskeleton.
- reference: GO:0000147
  notes: Gene Ontology biological-process term for actin cortical patch assembly.
- reference: DOI:10.1016/S0092-8674(03)00883-3
  notes: Kaksonen, Sun and Drubin 2003, A Pathway for Association of Receptors, Adaptors,
    and Actin during Endocytic Internalization, Cell.
- reference: DOI:10.1083/jcb.200404159
  notes: Young, Cooper and Bridgman 2004, Yeast actin patches are networks of branched
    actin filaments, Journal of Cell Biology.
- reference: DOI:10.1371/journal.pbio.0060001
  notes: Galletta, Chuang and Cooper 2008, Distinct Roles for Arp2/3 Regulators in
    Actin Assembly and Endocytosis, PLoS Biology.
- reference: GO:0061645
  notes: Endocytic patch is the native GO is-a parent of GO:0030479 actin cortical
    patch.
- reference: GO:0030864
  notes: Cortical actin cytoskeleton contains the actin cortical patch through the
    native GO part_of relation.
