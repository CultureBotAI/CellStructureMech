identifier: GO:0005885
label: Arp2/3 protein complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A stable protein complex that contains two actin-related proteins, Arp2
  and Arp3, and five novel proteins (ARPC1-5), and functions in the nucleation of
  branched actin filaments. A conserved seven-subunit protein complex (comprising
  actin-related proteins Arp2 and Arp3 together with Arc40/ARPC1, Arc35/ARPC2, Arc19/ARPC3,
  Arc18/ARPC4, and Arc15/ARPC5) that binds to the side of a pre-existing mother actin
  filament and nucleates a daughter filament at a characteristic 70-degree angle.
  In yeasts, amoebae, and filamentous fungi, the Arp2/3 protein complex generates
  branched actin networks that drive clathrin-mediated endocytosis, phagocytosis,
  and pseudopod extension.
