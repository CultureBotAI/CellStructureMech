causal_graphs:
- graph_id: arp2_3_protein_complex_mechanism
  title: Arp2/3 protein complex activation and dendritic actin network assembly
  description: Nucleation-promoting factors (Las17/WASP and Myo3/Myo5) bind and activate
    the seven-subunit Arp2/3 protein complex on mother actin filaments, nucleating
    branched F-actin networks that power cortical patch invagination.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures actin and Arp2/3 at the level of this first record
    without modeling the full timed sequence of endocytic adaptors, nucleation-promoting
    factors, capping proteins, and actin-filament disassembly factors.
