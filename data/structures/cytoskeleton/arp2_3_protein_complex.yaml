  note: Exhibits Arp2/3 protein complex (GO:0005885) in Arp2/3 protein complex activation
    and branched actin nucleation. Budding yeast forms dynamic actin cortical patches
    at the cell cortex during endocytic internalization.
  reference: DOI:10.1016/S0092-8674(03)00883-3
