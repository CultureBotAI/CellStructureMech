    protein complex activation and branched actin nucleation. Budding-yeast model
    in which cortical actin patches were imaged as short, branched Arp2/3-like actin-filament
    networks.
  reference: DOI:10.1083/jcb.200404159
functions:
- function_id: actin_cortical_patch_assembly
  label: actin cortical patch assembly
  grounding: GO:0000147
  description: Mediated by Arp2/3 protein complex (GO:0005885) in Arp2/3 protein complex
    activation and branched actin nucleation. The actin cortical patch is produced
    by assembly of a branched actin network at cortical endocytic sites.
  evidence:
  - reference: GO:0000147
    notes: GO:0000147 denotes assembly of an actin cortical patch.
  - reference: DOI:10.1371/journal.pbio.0060001
    notes: Galletta, Chuang and Cooper 2008 tracked actin patch assembly and movement
      in Arp2/3-regulator mutants.
- function_id: endocytic_internalization
  label: endocytic internalization
  description: Mediated by Arp2/3 protein complex (GO:0005885) in Arp2/3 protein complex
    activation and branched actin nucleation. Yeast actin cortical patches assemble
    at cortical endocytic sites and move inward as internalization proceeds.
  evidence:
  - reference: DOI:10.1016/S0092-8674(03)00883-3
    notes: Kaksonen, Sun and Drubin 2003 followed receptors, adaptors and actin during
      yeast endocytic internalization.
