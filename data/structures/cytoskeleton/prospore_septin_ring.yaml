discussions:
- discussion_id: prospore_septin_ring_boundary
  prompt: Keep the prospore septin ring distinct from other localized fungal septin-ring
    states.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032169 denotes the septin ring at the site of cytokinesis in a prospore.
    GO:0032172 covers germ-tube future septation sites, GO:0032168 covers hyphal future
    septation sites, GO:0032170 covers mother-cell/pseudohyphal-projection junctions,
    GO:0032177 covers the two split septin rings formed from the bud-neck septin collar
    at budding-cell cytokinesis, and GO:0005940 denotes the broader septin ring class.
    This record models only the prospore subtype.
  resolution_note: Curated GO:0032169 as the exact structure identifier, used GO:0005940
    only as the is-a parent, and documented GO:0032177 as a cytokinetic sibling rather
    than a prospore ring.
  evidence:
  - reference: GO:0032169
    notes: GO:0032169 identifies the prospore-localized septin ring.
  - reference: GO:0032172
    notes: GO:0032172 identifies the germ-tube-localized septin ring.
  - reference: GO:0032168
    notes: GO:0032168 identifies the hypha-localized septin ring.
  - reference: GO:0032170
    notes: GO:0032170 identifies the septin ring at a mother-cell/pseudohyphal-projection
      junction.
  - reference: GO:0032177
    notes: GO:0032177 identifies the two split septin rings formed from the bud-neck
      septin collar at budding-cell cytokinesis.
  - reference: GO:0005940
    notes: GO:0005940 identifies the broader septin ring class.
  posed_by: codex
  posed_date: '2026-09-28'
  resolved_date: '2026-09-28'
