discussions:
- discussion_id: identity_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the whole meiotic array distinct from its organizer, constituent filaments
    and neighboring structures.
  rationale: Parsed checks over 907 records and whole-repository searches including
    ignored and hidden files found only prior read-ahead notes, not an existing HAA
    record. GO:0032117 is exact; GO:0005818 is its native is-a parent and GO:0030981
    its native part-of target. No extra HAA part-of meiotic-spindle claim is inferred
    from ancestor relations. OTHER denotes a multi-filament system, not one microtubule,
    the nuclear-movement process, the telomere bouquet, the SPB or the rMTOC. Native
    GO wording that microtubules emanate from the SPB is retained, while the 2012
    ultrastructure resolves their organization near but distinct from the SPB core.
  evidence:
  - reference: GO:0032117
  - reference: DOI:10.1016/j.cub.2012.02.042
- discussion_id: organizing_center_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate the array polymer inventory from the organizing-center composition.
  rationale: The initial constituent inventory covers alpha/beta-tubulin polymer classes.
    The 2012 study localizes Hrs1 and gamma tubulin to the rMTOC and tests Hrs1-dependent
    organization. These proteins are not automatically asserted to be array-lattice
    constituents; the center remains external assembly context in the graph. Whole-SPB,
    nuclear-envelope and bouquet membership is not inferred from spatial proximity
    or recruitment dependence. This boundary does not deny a physical connection to
    the array minus ends. A separate source-defined rMTOC record and more detailed
    membership evidence can refine the representation later.
  evidence:
  - reference: DOI:10.1016/j.cub.2012.02.042
  - reference: GO:0032117
  - reference: GO:0005874
- discussion_id: composition_limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Extend array-associated machinery and isoform coverage only with direct
    membership and role evidence.
  rationale: This is a bounded polymer inventory, not a complete HAA proteome. The
    Atb2 reference sequence is not the experimental strain. Beta-tubulin class composition
    does not justify an Nda3 example without an inspected isoform-specific experiment.
    Dynein-dynactin participates in movement, but its detailed array-resident composition
    and assembly essentiality need separate primary-source review before adding machinery
    rows. Unpublished observations about dynein-assisted radial rearrangement and
    suggested Hrs1/NudE similarity in the 2012 Discussion are not treated as verified
    family or component assignments.
  evidence:
  - reference: DOI:10.1016/j.cub.2012.02.042
  - reference: DOI:10.1016/j.cub.2005.07.058
  - reference: InterPro:IPR002452
  - reference: InterPro:IPR002453
- discussion_id: assembly_mechanism_limits
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Resolve the physical minus-end attachment and nucleation mechanisms within
    the organizing region.
  rationale: Ultrastructure, immunolocalization and Hrs1 perturbations establish radial
    organization but not a purified molecular bridge or sufficiency of an isolated
    nucleation complex. Yeast-two-hybrid interactions with Kms1 and Alp4 do not establish
    complete native binding geometry. Gamma-tubulin enrichment is not a census of
    a fixed ring stoichiometry. Distances and microtubule counts in selected tomograms
    are assay-specific and are not imported as universal HAA dimensions.
  evidence:
  - reference: DOI:10.1016/j.cub.2012.02.042
- discussion_id: transition_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep Hrs1 downregulation and meiotic transition phenotypes source-bounded.
  rationale: Hrs1 degradation and phosphorylation jointly downregulate the radial
    organizing system near meiosis I. Stabilized nonphosphorylatable Hrs1 can delay
    bipolar spindle formation; this is not a universal complete block, and outcomes
    depend on temperature and the spindle checkpoint. Phosphomimetic effects do not
    prove that every identified phosphorylation has the same native role. Ectopic
    Hrs1 produces HAA-like arrays in vegetative cells but does not turn every such
    cell into a native meiotic HAA exemplar. The later spindle is not the HAA, and
    disappearance of array signal is not direct proof that every tubulin subunit is
    degraded.
  evidence:
  - reference: DOI:10.1016/j.cub.2012.02.042
  - reference: DOI:10.1016/j.cub.2005.07.058
- discussion_id: taxon_access_and_imaging
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Preserve experimental, access and imaging limits.
  rationale: Only S. pombe is an organism exemplar; no clade prevalence, fixed whole-array
    copy number, trait or pathway relation is inferred. Homothallic live-cell imaging
    and synchronized engineered pat1 mat-Pc diploid EM experiments are distinct. Main
    Figure 2 text/captions specify 80 minutes for immuno-EM, whereas supplemental
    methods and the deletion-control caption specify 120 minutes; no single universal
    sampling time is assigned. Tomography used high-pressure freezing followed by
    freeze substitution and resin sections, not vitreous cryo-ET. The 2005 source
    is abstract-only; the 2012 main text, strain table and supplemental methods were
    read, but movies, raw data and most supplemental image panels remain uninspected.
    Figure 4 is unchanged CC BY 3.0 material and mixes live-cell images with biochemical
    and schematic panels; no dimension is inferred from its unquantified scale bars.
  evidence:
  - reference: DOI:10.1016/j.cub.2012.02.042
  - reference: DOI:10.1016/j.cub.2005.07.058
  - reference: https://www.ebi.ac.uk/ena/taxonomy/rest/tax-id/4896
  - reference: https://www.ebi.ac.uk/ena/taxonomy/rest/tax-id/284812
