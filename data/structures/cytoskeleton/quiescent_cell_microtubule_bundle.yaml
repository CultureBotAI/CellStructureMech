identifier: cellstructuremech:quiescent_cell_microtubule_bundle
label: quiescent cell microtubule bundle
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A stable antiparallel cytoplasmic microtubule bundle assembled during
  nutrient-exhaustion-induced quiescence in fission yeast, characterized in Schizosaccharomyces
  pombe. It contains closely packed microtubules, is usually associated with the spindle
  pole body, and is distinct from the nuclear microtubule array of quiescent budding
  yeast.
definition_source: DOI:10.1083/jcb.201502025
mapping_status: PROPOSED
