functions:
- function_id: polarity_reestablishment
  label: Polarity reestablishment after quiescence
  description: Elongation of the pre-existing bundle and restoration of microtubule
    dynamics support timely return of polarity factors and actin organization to cell
    tips in refed S. pombe.
  evidence:
  - reference: DOI:10.1083/jcb.201502025
    notes: 'Figures 5 and 7: refeeding, MBC treatment, alp14 deletion and cold-treated
      mto1 deletion distinguish regrowth and polarity defects. The interventions also
      affect new microtubules, so they do not isolate an exclusive bundle-only pathway.'
causal_graphs:
- graph_id: quiescence_exit_repolarization
  title: Microtubule recovery supports polarity reestablishment
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: S. pombe quiescence exit; a physiological mechanism, not a resolved
    glucose-sensing pathway. Recovery includes elongation of the old bundle and new
    interphase microtubules, which the perturbations do not selectively separate.
  nodes:
  - node_id: glucose_refeeding
    label: Glucose refeeding
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: microtubule_recovery
    label: Q-MT elongation and recovery of microtubule dynamics
    node_type: BIOLOGICAL_PROCESS
  - node_id: repolarization
    label: Cell-tip polarity reestablishment
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: glucose_refeeding
    predicate: stimulates
    object: microtubule_recovery
    description: Glucose addition triggers bundle elongation and new interphase microtubule
      formation, even with translation inhibited.
    evidence:
    - reference: DOI:10.1083/jcb.201502025
      notes: 'Figure 5A and quiescence-exit Results: glucose-only refeeding and cycloheximide
        experiments. Translation-independent microtubule remodeling does not mean
        cell growth is translation independent.'
  - subject: microtubule_recovery
    predicate: supports
    object: repolarization
    description: Restored microtubule growth supports timely return of polarity markers
      and actin organization to cell tips.
    evidence:
    - reference: DOI:10.1083/jcb.201502025
      notes: 'Figure 7A-F: MBC, alp14 deletion and cold-treated mto1 deletion impair
        or delay repolarization and alter subsequent cell shape. These perturbations
        affect microtubules beyond the pre-existing bundle; no unique sufficiency
        or exclusive pathway is asserted.'
