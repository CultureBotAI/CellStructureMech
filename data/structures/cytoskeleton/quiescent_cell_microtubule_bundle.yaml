discussions:
- discussion_id: identity_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the cytoplasmic fission-yeast bundle distinct from generic static bundles
    and budding-yeast nuclear arrays.
  notes: GO:0099070 is broader and explicitly marks Q-MT names as narrow synonyms.
    GO:1905720 is also broader. Hidden- and ignored-inclusive searches and parsed
    corpus identities found no existing Q-MT record. The 2015 Discussion distinguishes
    antiparallel cytoplasmic Q-MT from the parallel nuclear S. cerevisiae array; the
    2024 eLife study concerns the latter. OTHER denotes the whole multi-filament array,
    not a single FILAMENT.
  evidence:
  - reference: DOI:10.1083/jcb.201502025
  - reference: GO:0099070
    notes: Native narrow synonym scope inspected.
  - reference: DOI:10.7554/eLife.89958
    notes: Native PMC10963028.1 abstract identifies the budding-yeast nuclear bundle,
      not the fission-yeast cytoplasmic record.
- discussion_id: spb_association_not_parthood
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not turn frequent spindle-pole-body attachment into universal parthood.
  notes: Figure 1C and Discussion include unattached bundles. The array is part of
    the cytoplasm and microtubule cytoskeleton, not modeled as a constitutive subpart
    of the spindle pole body.
  evidence:
  - reference: DOI:10.1083/jcb.201502025
