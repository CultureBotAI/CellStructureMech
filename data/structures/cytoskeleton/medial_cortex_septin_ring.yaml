discussions:
- discussion_id: medial_cortex_septin_ring_boundary
  prompt: Keep the medial cortex septin ring distinct from other localized septin-ring
    states.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0036391 denotes the ring that forms at the medial cortex of a symmetrically
    dividing cell at the onset of cytokinesis. GO:0000144 and GO:0032177 cover bud-neck
    septin states in budding cells, GO:0032169 covers the prospore ring, GO:0032175
    covers the mating projection ring, GO:0032168 and GO:0032172 cover filamentous-fungal
    hyphal and germ-tube rings, GO:0032170 covers pseudohyphal-projection junctions,
    and GO:0005940 denotes the broader septin ring class. This record models only
    the medial-cortex subtype.
  resolution_note: Curated GO:0036391 as the exact structure identifier and used GO:0005940
    only as the is-a parent.
  evidence:
  - reference: GO:0036391
    notes: GO:0036391 identifies the medial cortex septin ring.
  - reference: GO:0000144
    notes: GO:0000144 identifies the cellular bud neck septin ring.
  - reference: GO:0032177
    notes: GO:0032177 identifies the two split septin rings formed from the bud-neck
      septin collar at budding-cell cytokinesis.
  - reference: GO:0032169
    notes: GO:0032169 identifies the prospore-localized septin ring.
  - reference: GO:0032175
    notes: GO:0032175 identifies the mating projection septin ring.
  - reference: GO:0032168
    notes: GO:0032168 identifies the hypha-localized septin ring.
  - reference: GO:0032172
    notes: GO:0032172 identifies the germ-tube-localized septin ring.
  - reference: GO:0032170
    notes: GO:0032170 identifies the septin ring at a mother-cell/pseudohyphal-projection
      junction.
  - reference: GO:0005940
    notes: GO:0005940 identifies the broader septin ring class.
  posed_by: codex
  posed_date: '2026-09-28'
  resolved_date: '2026-09-28'
