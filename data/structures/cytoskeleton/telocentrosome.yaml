identifier: cellstructuremech:telocentrosome
label: telocentrosome
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A telomere-associated microtubule organizing assembly formed at the nuclear
  envelope during meiotic entry in Schizosaccharomyces pombe. It recruits a gamma-tubulin
  nucleation complex to SUN/KASH-linked telomeres and generates cytoplasmic microtubules
  that support their clustering at the spindle pole body; it is distinct from the
  spindle pole body and the completed telomere bouquet.
definition_source: DOI:10.1083/jcb.201207168
mapping_status: PROPOSED
