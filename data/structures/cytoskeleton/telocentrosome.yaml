discussions:
- discussion_id: identity_and_mereology
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the telomeric nucleation assembly distinct from its tether, products
    and clustering endpoint.
  notes: 'Hidden- and ignored-inclusive names, synonyms, core-accession and citation
    searches plus parsed record identities found no existing record. GO alias searches
    found no exact telocentrosome term. GO:0005815 is a broader MTOC parent; GO:0034993
    describes the membrane tether rather than the full nucleation assembly. MULTIPROTEIN_COMPLEX
    denotes the resident protein assembly. The SPB lacks equivalence: Sid4 does not
    colocalize at telocentrosomes in Figure 3. Attachment to chromosomes or the envelope
    is not automatically parthood; no part_of the SPB, a chromosome or completed bouquet
    is asserted. Nucleated microtubules are products, not the whole nucleation center.'
  evidence:
  - reference: DOI:10.1083/jcb.201207168
  - reference: GO:0005815
  - reference: GO:0034993
