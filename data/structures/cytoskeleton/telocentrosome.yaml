- discussion_id: homonymous_proteins
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Disambiguate native gene-name collisions.
  notes: The nucleation adaptor is O94488/SPCC417.07c, not mitochondrial O13670. Dynactin-associated
    Ssm4 is O42667, not the doa10/ssm4 ERAD ligase O60103. Both collisions were returned
    by native reviewed gene-exact queries; protein identity and locus, not the symbol
    alone, determine the examples.
  evidence:
  - reference: https://www.uniprot.org/uniprotkb/O94488/entry
  - reference: https://www.uniprot.org/uniprotkb/O42667/entry
- discussion_id: complex_and_essentiality
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not infer architecture or absolute necessity from reporter localization.
  notes: Alp4 is one gamma-TuC reporter, not a whole-complex accession. No ring geometry,
    small-complex copy number, exhaustive subunit list or fixed telocentrosome stoichiometry
    is established here. Kms1 and Mto1 support normal recruitment, but reduced or
    residual signals are not encoded as complete absence. Dlc1 has a stage-dependent
    contribution independent of Dhc1; Dhc1 is dispensable for Alp4 recruitment but
    important for clustering. Resident motors remain constituents without being assigned
    universal assembly necessity.
  evidence:
  - reference: DOI:10.1083/jcb.201207168
- discussion_id: boundary_declines
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate the nucleation-center core from upstream chromosome tethers and
    external motor systems.
  notes: Bqt1/Bqt2, Rap1 and Taz1 supply the chromosome-to-envelope context or markers
    and are not separately imported into this core nucleation-center composition;
    this does not assert their absence from the telomere environment. Kinesins Cut7,
    Tea2, Klp5/Klp6 and Pkl1/Klp2 affect clustering but lack obvious telocentrosomal
    localization in the defining study, so genetic effects alone do not make them
    resident components. Sid4 is explicitly absent from telocentrosomal foci. Mto2,
    all dynactin subunits, all gamma-TuC subunits and alpha/beta tubulin are not imported
    merely from related-complex membership or from nucleated microtubules.
  evidence:
  - reference: DOI:10.1083/jcb.201207168
  - reference: DOI:10.1038/s41467-025-56049-9
- discussion_id: motor_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Resolve the physical motor arrangement without promoting a proposed model
    to fact.
  notes: Minus-end-directed telomere movement and contributions from multiple motors
    are observed. Oligomerized dynein/kinesin-14 cross-linking of telocentrosomal
    and SPB microtubules, direct motor-specific telomere transport, and the exact
    maintenance action of Dlc1 remain proposed mechanisms in Figure 5C. The graphs
    encode recruitment dependencies and supported outputs only.
  evidence:
  - reference: DOI:10.1083/jcb.201207168
- discussion_id: mitotic_reconstitution
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep partial ectopic assembly separate from physiological meiotic telocentrosomes.
  notes: The 2025 study ectopically expresses Bqt1/Bqt2 in Rabl-deficient haploid
    mitotic cells. Sad1, Kms1, Mto1 and Alp4 recruit to telomeres, but Dhc1 is not
    detected and the complete bouquet does not form. Kms1 loss suppresses telomere
    migration and some growth defects in that engineered context. These observations
    do not demonstrate a normal mitotic organelle, prove dynein is the only missing
    factor, or contradict the 2013 physiological meiotic scope.
  evidence:
  - reference: DOI:10.1038/s41467-025-56049-9
