  edges:
  - subject: alpha_beta_tubulins
    predicate: polymerize into
    object: microtubule
    description: Alpha- and beta-tubulin subunits polymerize into the microtubules
      that make up the Giardia median body.
    evidence:
    - reference: GO:0005874
      notes: Gene Ontology defines microtubules as polymeric tubulin tubes.
  - subject: microtubule
    predicate: assemble into
    object: median_body
    description: Curved microtubules form the median-body array in Giardia trophozoites.
    evidence:
    - reference: GO:0097568
      notes: Gene Ontology defines the median body as a semi-organized Giardia microtubule
        array.
    - reference: DOI:10.1083/jcb.29.2.317
      notes: Friend 1966 observed the Giardia median body as an aggregate of curved
        microtubules by electron microscopy.
  - subject: kinesin_13
    predicate: localizes to
    object: median_body
    description: Giardia Kinesin-13 localizes to the median body and other microtubule
      plus-end regions.
    evidence:
    - reference: DOI:10.1128/EC.00128-07
      notes: Dawson et al. 2007 detected GFP-tagged Kinesin-13 and EB1 at the Giardia
        median body.
  - subject: kinesin_13
    predicate: modulates volume of
    object: median_body
    description: Perturbing Giardia Kinesin-13 changes median-body volume, linking
      the motor to regulation of the array's microtubule dynamics.
    evidence:
    - reference: DOI:10.1128/EC.00128-07
      notes: Dawson et al. 2007 found decreased median-body volume after expression
        of a Kinesin-13 S280N rigor mutant.
