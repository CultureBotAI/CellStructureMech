identifier: GO:0097568
label: median body
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A non-membrane bound, semi-organized microtubule array of unknown function
  found in Giardia species (trophozoite stage). It is located on the dorsal side of
  the trophozoite, slightly posterior to the ventral disc.
