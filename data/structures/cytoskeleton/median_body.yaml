causal_graphs:
- graph_id: giardia_median_body_microtubule_dynamics
  title: Tubulin microtubules and Kinesin-13 shape the Giardia median body
  description: In Giardia trophozoites, alpha- and beta-tubulins polymerize into a
    semi-organized median-body microtubule array. Kinesin-13 and EB1 localize to the
    median body, and dominant-negative Kinesin-13 changes median-body volume.
  graph_kind: REGULATION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the tubulin and Kinesin-13 relationships that are
    directly supported by median-body structural and localization evidence while leaving
    full component composition, assembly order, and the median body's cellular function
    unresolved.
  nodes:
  - node_id: alpha_beta_tubulins
    label: alpha- and beta-tubulins
    node_type: GENE_OR_PROTEIN
    component_ref: alpha_beta_tubulins
  - node_id: microtubule
