components:
- component_id: alpha_beta_tubulins
  label: alpha- and beta-tubulins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Tubulin constituents that polymerize into the Giardia median-body microtubule
    array.
  evidence:
  - reference: GO:0005874
    notes: Gene Ontology defines microtubules as tubes of polymeric tubulin.
  - reference: DOI:10.1016/j.biolcel.2004.05.006
    notes: Piva and Benchimol 2004 showed that Giardia median-body microtubules react
      with anti-tubulin antibodies.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for the alpha- and beta-tubulins
    that build Giardia median-body microtubules was verified in this pass.
- component_id: kinesin_13
  label: Giardia Kinesin-13
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  essentiality: UNKNOWN
  role: Microtubule-dynamics regulator that localizes to the Giardia median body and
    whose dominant-negative perturbation changes median-body volume.
  evidence:
  - reference: DOI:10.1128/EC.00128-07
    notes: Dawson et al. 2007 localized Giardia Kinesin-13 and EB1 to the median body
      and observed altered median-body volume after expression of a Kinesin-13 rigor
      mutant.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Giardia has a single kinesin-13 homolog in the Dawson et al. study,
    but no exact cross-source family CURIE specific to the Giardia Kinesin-13 regulator
    was curated here.
