discussions:
- discussion_id: nuclear_microtubule_boundary
  prompt: Keep nuclear microtubules distinct from cytoplasmic microtubules and from
    array-specific spindle microtubules.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - causal_graphs#spb_inner_plaque_organizes_nuclear_microtubules
  rationale: GO:0005880 denotes microtubules in the nucleus and therefore differs
    from the cytoplasmic GO:0005881 class. It also differs from the GO:0005876 spindle
    microtubule class, which is defined by membership in a mitotic or meiotic spindle
    rather than by nuclear localization alone.
  resolution_note: Curated GO:0005880 as a GO-backed nuclear microtubule subtype,
    parented it to GO:0005874, and used a budding-yeast SPB graph only as one concrete
    example of nuclear microtubule organization.
  evidence:
  - reference: GO:0005880
    notes: GO:0005880 identifies the nuclear microtubule class.
  - reference: GO:0005881
    notes: GO:0005881 identifies the cytoplasmic microtubule class.
  - reference: GO:0005876
    notes: GO:0005876 identifies spindle microtubules as part of mitotic or meiotic
      spindles.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
