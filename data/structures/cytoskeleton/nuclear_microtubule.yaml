functions:
- function_id: nuclear_microtubule_array_organization
  label: nuclear microtubule array organization
  description: Nuclear microtubules form non-cytoplasmic tubulin-polymer arrays that
    can be organized from nuclear microtubule-organizing centers such as the budding-yeast
    SPB inner plaque.
  evidence:
  - reference: GO:0005880
    notes: GO:0005880 defines nuclear microtubules as microtubules in the nucleus.
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the budding-yeast SPB inner plaque as
      the nuclear site for microtubule nucleation.
