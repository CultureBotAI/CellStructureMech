- component_id: gcp2_gcp3_spoke_subunits
  label: gamma-tubulin complex spoke scaffold heterodimer (GCP2/Spc97/Alp4 and GCP3/Spc98/Alp6)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - alp4
  - alp6
  - SPC97
  - SPC98
  essentiality: ESSENTIAL
  role: V-shaped GRIP1/GRIP2-domain spoke subunits (GCP2/Alp4/Spc97 and GCP3/Alp6/Spc98)
    that bind one gamma-tubulin molecule each via their C-terminal GRIP2 domains and
    dock onto MTOC receptors via their N-terminal GRIP1 domains.
  evidence:
  - reference: DOI:10.1091/mbc.E17-06-0397
    notes: Characterizes the fission yeast gamma-tubulin complex containing Alp4 (GCP2)
      and Alp6 (GCP3).
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 review the budding-yeast Tub4 complex containing
      the spoke scaffold subunits Spc97 (SPC97, GCP2) and Spc98 (SPC98, GCP3).
  protein_examples:
  - uniprot_id: UniProtKB:Q9Y705
    protein_label: Spindle pole body component alp4
    gene_symbol: alp4
    taxon_id: NCBITaxon:284812
    taxon_label: Schizosaccharomyces pombe 972h-
    entry_status: REVIEWED
    retrieved_on: '2026-10-06'
    role: Alp4 is one imaged subunit and reporter, not an accession for the entire
      complex. Reference-sequence exemplar for species-level experiments; no assertion
      that this exact reference stock was imaged.
    evidence:
    - reference: DOI:10.1016/j.cub.2010.10.006
      notes: Alp4 reports equatorial gamma-tubulin-complex recruitment. Equatorial
        Alp4 is undetected after Myp2 deletion or truncation to Mto1(1-1051), while
        Mto1(1-1065) supports equatorial Alp4 localization.
    - reference: DOI:10.1242/jcs.038414
      notes: Mto1 CM1 mutations separate gamma-tubulin-complex association from Mto1
        localization; Mto2 loss can leave weak equatorial recruitment.
    - reference: UniProtKB:Q9Y705
      notes: Native accession, reviewed status, primary gene, protein label and source
        taxon verified on 2026-10-06. Residence and function come from the cited experiments.
