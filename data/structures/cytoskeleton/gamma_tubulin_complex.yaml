identifier: GO:0000930
label: gamma-tubulin complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multiprotein complex composed of gamma-tubulin and other non-tubulin
  proteins. Gamma-tubulin complexes are localized to microtubule organizing centers,
  and play an important role in the nucleation of microtubules. The number and complexity
  of non-tubulin proteins associated with these complexes varies between species.
  A conserved multi-subunit protein complex containing gamma-tubulin (Tub4p in Saccharomyces
  cerevisiae) and gamma-tubulin complex proteins (GCPs such as Spc97p and Spc98p)
  that templates and nucleates microtubule polymerization at microtubule organizing
  centers, including fungal spindle pole bodies and protist basal bodies. By capping
  the minus end of nascent microtubules, the gamma-tubulin complex sets microtubule
  polarity and protofilament number.
