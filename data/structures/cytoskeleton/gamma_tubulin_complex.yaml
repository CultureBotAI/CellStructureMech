  label: gamma-tubulin catalytic nucleation subunit (Tub4 / Gtb1)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - gtb1
  - TUB4
  essentiality: ESSENTIAL
  role: Two copies of gamma-tubulin per heterotetrameric gamma-TuSC unit that expose
    a minus-end longitudinal interface directly templating alpha/beta-tubulin protofilament
    nucleation.
  evidence:
