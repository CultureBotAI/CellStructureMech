  component_role: CONSTITUENT
  role: Native multilayered scaffold subcomplex at the center of the budding-yeast
    SPB that organizes cytoplasmic and nuclear microtubule nucleation sites. Functions
    in gamma-tubulin complex tethering and microtubule nucleation in gamma-tubulin
    complex.
  evidence:
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the layered Saccharomyces cerevisiae
