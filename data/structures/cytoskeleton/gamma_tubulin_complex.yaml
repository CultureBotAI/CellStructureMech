causal_graphs:
- graph_id: gamma_tubulin_complex_mechanism
  title: Gamma-tubulin complex anchoring and microtubule minus-end nucleation
  description: Spc110p and Spc72p receptors at the yeast spindle pole body recruit
    the gamma-tubulin complex (Tub4p-Spc97p-Spc98p), which oligomerizes into a minus-end
    template that nucleates nuclear spindle and cytoplasmic astral microtubules.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
