identifier: cellstructuremech:cetz_filament
label: CetZ filament
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: An archaeal tubulin-like cytoskeletal filament assembled from CetZ proteins
  that forms dynamic envelope-associated structures and supports cell-shape remodeling
  such as rod development in Haloferax volcanii.
definition_source: DOI:10.1038/nature13983
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-11T11:45:00Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-11T11:45:33Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added cytoskeleton parentage, CetZ component curation, archaeal and Haloferax
    volcanii scope, rod-cell-development function, DOI evidence, a nonmechanistic
    CetZ-to-envelope graph, and CetZ grounding and FtsZ boundary discussions.
  llm_assisted: true
parent_structures:
- GO:0005856
components:
- component_id: cetz_proteins
  label: CetZ proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - cetZ1
  - cetZ2
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for archaeal CetZ filament-forming
    proteins was verified in this pass.
  role: Archaeal tubulin/FtsZ-superfamily GTPases that assemble into dynamic envelope-associated
    cytoskeletal filaments for cell-shape control.
  evidence:
  - reference: DOI:10.1038/nature13983
    notes: Duggin et al. 2015 showed that Haloferax volcanii CetZ1 forms dynamic cytoskeletal
      structures in vivo and that CetZ crystal structures adopt the FtsZ/tubulin superfamily
      fold.
  - reference: DOI:10.3390/biom13010134
    notes: Brown and Duggin 2023 reviewed the diversity and potential multifunctionality
      of archaeal CetZ tubulin-like cytoskeletal proteins.
taxonomic_distribution:
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: VARIABLE
  note: CetZ tubulin-like cytoskeletal proteins are archaeal FtsZ/tubulin-superfamily
    proteins and are not asserted to occur in every archaeal lineage.
  reference: DOI:10.3390/biom13010134
- taxon_id: NCBITaxon:2246
  taxon_label: Haloferax volcanii
  presence: COMMON
  note: Haloferax volcanii is the model haloarchaeon in which CetZ1 dynamic filaments
    and CetZ-dependent rod-cell development were experimentally characterized.
  reference: DOI:10.1038/nature13983
canonical_examples:
- taxon_id: NCBITaxon:2246
  taxon_label: Haloferax volcanii
  note: Pleomorphic haloarchaeon used to connect CetZ1 dynamic cytoskeletal structures
    to envelope remodeling, rod-shape development and efficient swimming motility.
  reference: DOI:10.1038/nature13983
functions:
- function_id: haloferax_rod_cell_development
  label: Haloferax rod cell development
  description: CetZ1-containing filaments remodel the Haloferax volcanii cell envelope
    to promote the transition from irregular plate-shaped cells into motile rod-shaped
    cells.
  evidence:
  - reference: DOI:10.1038/nature13983
    notes: Duggin et al. 2015 showed that CetZ1 is required for rod-shaped cell development
      and efficient swimming motility in Haloferax volcanii.
evidence:
- reference: DOI:10.1038/nature13983
  notes: Duggin et al. 2015, 'CetZ tubulin-like proteins control archaeal cell shape',
    Nature.
- reference: DOI:10.3390/biom13010134
  notes: Brown and Duggin 2023, 'Diversity and Potential Multifunctionality of Archaeal
    CetZ Tubulin-like Cytoskeletal Proteins', Biomolecules.
causal_graphs:
- graph_id: cetz1_rod_cell_development
  title: CetZ filaments support Haloferax rod-cell development
  description: CetZ proteins polymerize into envelope-associated dynamic filaments
    that remodel the Haloferax volcanii envelope and promote rod-shape development.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records CetZ polymerization, envelope association and rod-cell
    development without asserting the full pathway that positions CetZ structures
    or couples them to archaellum assembly and swimming.
