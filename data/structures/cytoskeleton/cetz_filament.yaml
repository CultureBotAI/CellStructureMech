discussions:
- discussion_id: resolve_cetz_family_grounding
  prompt: Resolve exact source-neutral grounding for archaeal filament-forming CetZ
    proteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#cetz_proteins
  rationale: This first record curates CetZ1/CetZ2-supported cell-shape cytoskeletal
    filaments without asserting that a broad FtsZ/tubulin domain or a Haloferax-specific
    accession exactly denotes archaeal CetZ filament-forming proteins.
  evidence:
  - reference: DOI:10.3390/biom13010134
    notes: Brown and Duggin 2023 reviewed CetZ proteins as an archaeal branch of tubulin-like
      cytoskeletal proteins.
  posed_by: codex
  posed_date: '2026-09-11'
- discussion_id: exclude_ftsz_from_cetz_filament_components
  prompt: FtsZ division proteins are paralogous tubulin-family proteins rather than
    CetZ filament constituents.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#cetz_proteins
  rationale: CetZ proteins coexist with FtsZ in many archaea and the Haloferax FtsZ1
    division ring is distinct from the dynamic CetZ1 structures that control rod development.
  evidence:
  - reference: DOI:10.1038/nature13983
    notes: Duggin et al. 2015 contrasted H. volcanii FtsZ1-GFP division rings with
      CetZ1-GFP envelope-associated structures.
  posed_by: codex
  posed_date: '2026-09-11'
