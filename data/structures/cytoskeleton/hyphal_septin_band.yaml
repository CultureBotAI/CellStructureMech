discussions:
- discussion_id: hyphal_septin_band_boundary
  prompt: Keep the hyphal septin band distinct from the generic septin band and from
    localized septin-ring structures.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032163 denotes only the diffuse septin-bar band at the junction between
    a filamentous fungal mother cell and germ tube. GO:0032158 is the broader noncytokinetic
    septin-band class, while GO:0032172 and GO:0032168 denote ring-shaped septin structures
    within germ tubes or hyphae.
  resolution_note: Curated GO:0032163 as the localized hyphal septin band, kept GO:0032158
    as its is-a parent, and did not merge it with septin-ring terms.
  evidence:
  - reference: GO:0032163
    notes: GO:0032163 identifies the hyphal septin band.
  - reference: GO:0032158
    notes: GO:0032158 identifies the broader septin band.
  - reference: GO:0032172
    notes: GO:0032172 identifies the germ tube septin ring.
  - reference: GO:0032168
    notes: GO:0032168 identifies the hyphal septin ring.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
