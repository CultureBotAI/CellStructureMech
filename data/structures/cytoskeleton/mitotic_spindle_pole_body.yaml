discussions:
- discussion_id: mitotic_spindle_pole_body_boundary
  prompt: Keep the mitotic spindle pole body narrower than the general fungal spindle
    pole body while preserving mitotic SPB substructures as child or part records.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - causal_graphs#mitotic_spindle_pole_body_substructure_topology
  rationale: GO:0044732 denotes the mitotic SPB formed as part of the mitotic cell
    cycle. The broader GO:0005816 term covers the general fungal SPB, while GO:0061496
    and GO:0061498 denote mitotic substructures that remain narrower than this parent.
  resolution_note: Curated GO:0044732 as a GO-backed mitotic SPB subtype, parented
    it to GO:0005816, and kept existing GO:0061496 and GO:0061498 records as mitotic-SPB
    substructures.
  evidence:
  - reference: GO:0044732
    notes: GO:0044732 identifies the mitotic spindle pole body.
