  rationale: GO:1990317 denotes a Saccharomyces protein complex involved in septin
    ring formation. GO:0000144 denotes the higher-order cellular bud neck septin ring
    that contains it, and GO:0000921 denotes the biological process of septin ring
    assembly rather than a cellular structure.
  resolution_note: Curated GO:1990317 as the kinase-complex child of GO:1902554, kept
