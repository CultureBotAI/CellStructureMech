definition: A protein complex involved in septin ring formation during mitosis. In
  Saccharomyces cerevisiae it consists of BNI5, CDC3, CDC10, CDC11, CDC12, GIN4, NAP1
  and SHS1. At least 2 GIN4 molecules are involved.
