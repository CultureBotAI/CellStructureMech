    Caulobacter crescentin filament.
  evidence:
  - reference: DOI:10.1016/S0092-8674(03)00935-8
    notes: Ausmees et al. 2003 identified crescentin/CreS as a Caulobacter cytoskeletal
      protein required for crescent cell shape.
  - reference: DOI:10.1073/pnas.2309984121
    notes: Liu et al. 2024 determined the cryo-EM structure of Caulobacter crescentin
      filaments.
taxonomic_distribution:
- taxon_id: NCBITaxon:155892
  taxon_label: Caulobacter vibrioides
  presence: COMMON
  note: Crescentin filaments have been directly characterized in Caulobacter crescentus,
    now classified as Caulobacter vibrioides.
  reference: DOI:10.1016/S0092-8674(03)00935-8
canonical_examples:
- taxon_id: NCBITaxon:565050
  taxon_label: Caulobacter vibrioides NA1000
  note: Wild-type laboratory strain, also named CB15N in Ausmees et al. 2003, used
    to define CreS-dependent curved morphology.
  reference: DOI:10.1016/S0092-8674(03)00935-8
functions:
- function_id: caulobacter_cell_curvature
  label: Caulobacter cell-curvature maintenance
  description: The crescentin filament tracks along the inner curvature of Caulobacter
    cells and maintains the vibrioid or crescent cell shape.
  evidence:
  - reference: DOI:10.1016/S0092-8674(03)00935-8
    notes: Ausmees et al. 2003 showed that cells lacking crescentin become straight
      rods and that crescentin localizes to the inner cell curvature.
  - reference: DOI:10.1101/gad.1795509
    notes: Charbon et al. 2009 followed crescentin assembly, organization and dynamics
      in vivo.
evidence:
- reference: DOI:10.1016/S0092-8674(03)00935-8
  notes: 'Ausmees, Kuhn and Jacobs-Wagner 2003, ''The bacterial cytoskeleton: an intermediate
    filament-like function in cell shape'', Cell.'
- reference: DOI:10.1101/gad.1795509
  notes: 'Charbon, Cabeen and Jacobs-Wagner 2009, ''Bacterial intermediate filaments:
    in vivo assembly, organization, and dynamics of crescentin'', Genes & Development.'
- reference: DOI:10.1073/pnas.2309984121
  notes: Liu, van den Ent and Lowe 2024, 'Filament structure and subcellular organization
    of the bacterial intermediate filament-like protein crescentin', PNAS.
causal_graphs:
