identifier: cellstructuremech:crescentin_filament
label: crescentin filament
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A bacterial intermediate filament-like cytoskeletal filament assembled
  from crescentin that localizes along the inner curvature of Caulobacter vibrioides
  cells and helps maintain their curved cell shape.
definition_source: DOI:10.1016/S0092-8674(03)00935-8
