      septin-associated-protein structures localized to the cleavage plane.
functions:
- function_id: cytokinetic_compartment_boundary
  label: cytokinetic compartment boundary
  description: The cellular bud neck split septin rings flank the budding-cell cytokinesis
    site and delineate a compartment in which cytokinesis factors are concentrated.
  evidence:
  - reference: GO:0032177
    notes: GO:0032177 defines the bud-neck split rings as two separate septin rings
      formed at cytokinesis and thought to delineate a cytokinesis-factor compartment.
  - reference: GO:0032176
    notes: GO:0032176 defines split septin rings as a pair of rings flanking the division
      site after a septin ring or collar splits before cytokinesis.
