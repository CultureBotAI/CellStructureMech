identifier: GO:0032177
label: cellular bud neck split septin rings
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: Two separate septin rings that are formed from the septin collar at the
  time of cytokinesis in cells that divide by budding. These two rings are thought
  to delineate a special compartment in which factors involved in cytokinesis are
  concentrated.
