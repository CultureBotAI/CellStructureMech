discussions:
- discussion_id: bud_neck_split_septin_rings_boundary
  prompt: Keep the cellular bud neck split septin rings distinct from the initial
    bud-neck septin ring and the bud-neck septin collar.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - causal_graphs#bud_neck_split_septin_rings_topology
  rationale: GO:0000144 denotes the dynamic initial bud-neck ring that forms at bud
    emergence, GO:0032174 denotes the fixed hourglass-shaped collar that persists
    for most of the cell cycle, and GO:0032177 denotes the two split rings formed
    from the collar at cytokinesis. This record models only the cytokinetic split-ring
    state.
  resolution_note: Curated GO:0032177 as the bud-neck split-ring pair and used GO:0032174
    only as the topology node for the precursor collar.
  evidence:
  - reference: GO:0000144
    notes: GO:0000144 identifies the dynamic cellular bud neck septin ring that forms
      at the time of bud emergence.
  - reference: GO:0032174
    notes: GO:0032174 identifies the fixed hourglass-shaped cellular bud neck septin
      collar.
  - reference: GO:0032177
    notes: GO:0032177 identifies the pair of split septin rings that form from the
      bud-neck collar at cytokinesis.
  posed_by: codex
  posed_date: '2026-09-28'
  resolved_date: '2026-09-28'
