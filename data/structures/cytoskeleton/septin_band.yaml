discussions:
- discussion_id: septin_band_boundary
  prompt: Keep the generic septin band distinct from localized mating-projection and
    hyphal septin-band subtypes and from cytokinetic septin rings.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032158 denotes the broader diffuse, noncytokinetic septin band, whereas
    GO:0032162 and GO:0032163 narrow that morphology to the mating-projection neck
    and the mother cell-germ tube junction. GO:0005940 separately denotes cytokinetic
    septin rings.
  resolution_note: Curated GO:0032158 as the generic septin-band record and kept the
    existing GO:0032162 mating-projection septin band and future GO:0032163 hyphal
    septin band as localized subtypes.
  evidence:
  - reference: GO:0032158
    notes: GO:0032158 identifies septin bands as diffuse noncytokinetic structures
      found at polarized-growth or new-membrane-deposition sites.
  - reference: GO:0032162
    notes: GO:0032162 identifies the mating projection septin band child structure.
  - reference: GO:0032163
    notes: GO:0032163 identifies the hyphal septin band child structure.
  - reference: GO:0005940
    notes: GO:0005940 identifies the ring-shaped septin structure at the cell-cortex
      division plane.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
