identifier: GO:0032158
label: septin band
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A diffuse ring composed of a series of septin bars that run parallel to
  the long axis of the cell. This type of septin structure has been observed in a
  number of locations associated with polarized grown and/or deposition of new membrane,
  but not with cytokinesis, such as at the shmoo (mating projection) neck, at the
  junction between the mother cell and the germ tube (hypha) of a fungal cell growing
  filamentously.
