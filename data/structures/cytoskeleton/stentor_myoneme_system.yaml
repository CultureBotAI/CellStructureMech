functions:
- function_id: cell_body_contraction
  label: Rapid cell-body contraction
  description: The myoneme system contributes to shortening of the cell body in response
    to stimulation.
  evidence:
  - reference: DOI:10.1126/science.177.4047.447
    notes: Primary high-speed cinematography follows M bands straightening before
      regional body shortening. Mechanical and electrical stimulation differ in the
      spatial progression of contraction; the signal is not directly identified.
  - reference: DOI:10.1016/j.cub.2026.06.062
    notes: 'Final-paper author manuscript PMC13637444.1, contractile-machinery Results
      and STAR Methods: Sfi1-1 and Sfi1-2 RNAi conditions impair stimulus-evoked contraction;
      responses depend on the stimulus and isoform-targeting condition. Sfi1-2/Sfi1-3
      cross-depletion prevents an isoform-exclusive interpretation. No exact kinetics
      or native force-generation mechanism is asserted here.'
causal_graphs:
- graph_id: sfi1_knockdown_phenotypes
  title: Nonmechanistic summary of Sfi1 knockdown phenotypes
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: Experimental perturbation summary in S. coeruleus, checked against
    the final-paper author manuscript Results and STAR Methods. The cable-reducing
    conditions target Sfi1-1 or Sfi1-2; Sfi1-2/Sfi1-3 cross-depletion limits isoform-specific
    attribution. The two outcomes are not connected by a claimed causal mediation
    step. This is not a resolved molecular contraction mechanism or a claim about
    every Sfi1 isoform.
  nodes:
  - node_id: sfi1_rnai
    label: RNAi against the implicated Sfi1 isoforms
    node_type: EXPERIMENTAL_FACTOR
  - node_id: reduced_cables
    label: Reduced myoneme cables
    node_type: STATE
  - node_id: impaired_contraction
    label: Impaired stimulus-evoked contraction
    node_type: STATE
  edges:
  - subject: sfi1_rnai
    predicate: produces
    object: reduced_cables
    description: The reported Sfi1 knockdown conditions reduce myoneme cables.
    evidence:
    - reference: DOI:10.1016/j.cub.2026.06.062
      notes: 'PMC13637444.1 cortical-patterning Results report reduced centrin incorporation
        in posterior myonemes in Sfi1-1 and Sfi1-2 RNAi conditions, with altered anterior/posterior
        patterning rather than reduced total centrin fluorescence. Sfi1-2/Sfi1-3 cross-depletion
        limits isoform attribution. This remains a nonmechanistic intervention summary:
        cable-pattern changes and contraction impairment are parallel outcomes, not
        proof that cable loss mediates the defect.'
  - subject: sfi1_rnai
    predicate: produces
    object: impaired_contraction
    description: Affected cells fail to respond normally to stimulation or contract
      incompletely.
    evidence:
    - reference: DOI:10.1016/j.cub.2026.06.062
      notes: PMC13637444.1 contractile-machinery Results and STAR Methods report reduced
        or incomplete contraction in the implicated knockdown conditions. Sfi1-2/Sfi1-3
        cross-depletion and stimulus-dependent responses preclude a universal or isoform-exclusive
        requirement. No exact kinetics, native force-generation mechanism or mediation
        by cable loss is inferred.
evidence:
- reference: DOI:10.1083/jcb.57.3.704
  notes: Huang and Pitelka (1973). Full primary PDF and Figures 16/17 inspected; versioned
    PMC metadata verifies DOI, PMID 4633444 and non-retracted status. Molecular coiling
    is an interpretation of fixed-state morphology, not a directly resolved transition.
- reference: DOI:10.1126/science.177.4047.447
  notes: Newman (1972). Primary PMC author manuscript read, including methods and
    figure legends; PMID 5043148. Cinematic evidence is not calcium imaging.
- reference: DOI:10.1111/j.1550-7408.2005.00048x
  notes: Maloney et al. (2005), PMID 16014010. Publisher abstract read; full-text/PDF
    access was not obtained. Localization at membranelle bases is additional centrin
    distribution, not evidence that those bases are the myoneme system.
- reference: DOI:10.1016/j.cub.2026.06.062
  notes: Yan et al. (2026), PMID 42476139. At initial curation on 2026-10-04, only
    the published abstract and metadata were readable through the checked Cell/ScienceDirect
    routes. The final-paper author manuscript PMC13637444.1 became available on 2026-10-05.
    Relevant centrin/Sfi1 localization, cortical-patterning and contraction Results,
    Discussion and STAR Methods were read on 2026-10-12 in official checksum-verified
    JATS. This is not the dissertation or the publisher typeset PDF; supplementary
    movies were not inspected and no new numeric values are curated.
- reference: https://escholarship.org/content/qt48v7x2m3/qt48v7x2m3_noSplash_81e16ae35ca9c5219383afd7085febfb.pdf
  notes: 'Connie Yan, Oral Regeneration in Stentor coeruleus: Cytoskeletal Patterning
    and Cell Cycle Control. Chapter 2 localization and RNAi results and relevant methods
    read. This dissertation is a separate source version, not the final journal article.'
- reference: GO:0005622
  notes: 'Verified intracellular anatomical structure: broad is-a parent.'
- reference: GO:0030863
