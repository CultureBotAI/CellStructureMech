discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the Stentor myoneme system from homonymous and neighboring assemblies.
  rationale: A shared protein or historical name does not establish structural equivalence.
  notes: Hidden- and ignored-inclusive repository searches found no existing target
    record. QuickGO myoneme and Stentor searches returned no hits. GO:0031430 M band
    denotes a sarcomeric structure and is not this identity. OTHER denotes a filament
    system, not one filament. The genus-qualified label is supported by the single
    verified species example; it does not assert occurrence throughout Stentor. Spirostomum
    fishnets, peritrich body myonemes and stalk spasmonemes remain separate records.
  evidence:
  - reference: DOI:10.1083/jcb.57.3.704
    notes: Describes the named myonemes separately from Km fibers.
  - reference: GO:0031430
    notes: Authority definition specifies the thick-filament midline of a sarcomere.
  - reference: https://www.ebi.ac.uk/QuickGO/services/ontology/go/search?query=myoneme
    notes: Authority identity search before minting.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: component_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact myonemal family mappings and native molecular composition.
  rationale: Broad family matches and localization do not establish exact class equivalence,
    paralogue completeness or copy number.
  notes: Both components remain REVIEWED_LABEL_ONLY and assembly essentiality UNKNOWN.
    Verify sequence-level mappings before adding UniProt examples; do not infer native
    stoichiometry from predicted repeat counts.
  evidence:
  - reference: InterPro:IPR050145
    notes: Authority family description includes non-centrin calcium-binding proteins.
  - reference: InterPro:IPR052270
    notes: Authority family description includes SFI1 and related proteins.
  - reference: https://escholarship.org/content/qt48v7x2m3/qt48v7x2m3_noSplash_81e16ae35ca9c5219383afd7085febfb.pdf
    notes: Chapter 2 distinguishes sequence predictions from localization and RNAi
      experiments.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: neighboring_assemblies
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep other cortical assemblies out of the myoneme constituent list.
  rationale: Adjacency or shared centrin labeling does not establish molecular membership.
  notes: 'Km microtubules, nearby ER, basal bodies and membranelles are excluded as
    constituents. The anterior centrin mesh is not equated with posterior myoneme
    cables; Sfi1-positive lateral connections are included as associated architecture.
    No unidentified linker or calcium pump is invented. This structural boundary does
    not imply that Sfi1 is absent from every anterior centrin layer: the final-paper
    manuscript distinguishes outer lateral bands from deeper anterior mesh colocalization.'
  evidence:
  - reference: DOI:10.1083/jcb.57.3.704
    notes: Separate cortical fiber systems and adjacent membranes are described.
  - reference: DOI:10.1111/j.1550-7408.2005.00048x
    notes: Centrin-related labeling also occurs at membranelle bases.
  - reference: https://escholarship.org/content/qt48v7x2m3/qt48v7x2m3_noSplash_81e16ae35ca9c5219383afd7085febfb.pdf
    notes: Chapter 2, pp. 30-32 separates posterior Sfi1/centrin structures from the
      anterior centrin mesh.
  - reference: DOI:10.1016/j.cub.2026.06.062
    notes: PMC13637444.1 Sfi1 Results and Figure 3 legend distinguish longitudinal
      position from cortical depth.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: mechanism_and_source_versions
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve native force generation beyond the observed Sfi1 perturbation outcomes.
  rationale: Fixed-state morphology, localization and knockdown do not uniquely determine
