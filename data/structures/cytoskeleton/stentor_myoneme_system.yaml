components:
- component_id: myonemal_centrins
  label: Myonemal centrin-family proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro IPR050145 Centrin/CML-like includes other calcium-binding
    proteins; it does not exactly delimit the myonemal centrin class. No species-specific
    accession is substituted for a family.
  essentiality: UNKNOWN
  role: Centrin-related calcium-binding constituents of the myonemes; the antibody
    evidence does not resolve the complete native paralogue inventory.
  evidence:
  - reference: DOI:10.1111/j.1550-7408.2005.00048x
    notes: 'Publisher abstract: three antibody preparations label myonemes, not the
      adjacent Km fibers in alpha-tubulin double-labeling experiments. Immunoblots
      identify a calcium-binding, caltractin-related protein. Full article methods
      were inaccessible.'
- component_id: sfi1_family_scaffolds
  label: Myonemal Sfi1-family scaffold proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro IPR052270 represents broader SFI1-related proteins, including
    CCDC191. Exact coverage of the myonemal scaffold class and its experimentally
    localized Stentor proteins was not established.
  essentiality: UNKNOWN
  role: Repeat-rich scaffold proteins localized to posterior myonemes and lateral
    connections; knockdown supports a role in regional centrin organization, not a
    defined minimal assembly stoichiometry.
  evidence:
  - reference: https://escholarship.org/content/qt48v7x2m3/qt48v7x2m3_noSplash_81e16ae35ca9c5219383afd7085febfb.pdf
    notes: 'Yan dissertation, Chapter 2, pp. 26-32: Sfi1-1 (SteCoe_17904), Sfi1-2
      (SteCoe_25973) and Sfi1-3 (SteCoe_10021) localize to myonemes and posterior
      lateral bands, but not the anterior centrin mesh. Antibody blots contain nonspecific
      bands; peptide-block and RNAi immunofluorescence controls are reported. This
      is the dissertation conclusion; the later final-paper manuscript resolves additional
      cortical layers as described below.'
  - reference: DOI:10.1016/j.cub.2026.06.062
    notes: 'Final-paper author manuscript PMC13637444.1, Sfi1 Results and Figure 3
      legend: outer lateral Sfi1 bands are distinct from the anterior centrin mesh,
      but deeper anterior layers show Sfi1/centrin mesh colocalization. In the posterior
      outer cortex, centrin surrounds rather than colocalizes with the lateral bands.
      This depth-resolved account qualifies the dissertation conclusion; it does not
      equate every centrin-positive structure with posterior myonemes. Peptide-block
      and immunofluorescence controls are reported, with nonspecific Western bands
      and Sfi1-2/Sfi1-3 RNAi cross-depletion as specificity limits.'
