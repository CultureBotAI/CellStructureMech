- discussion_id: sfi1_localization_source_versions
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Reconcile the dissertation and final-paper Sfi1 localization accounts.
  rationale: Cortical depth and source version affect how colocalization can be interpreted.
  notes: The dissertation reports no overlap with the anterior centrin mesh for the
    three tested Sfi1 proteins. The later author manuscript distinguishes outer lateral
    bands from deeper anterior layers with mesh overlap, and reports posterior outer-layer
    centrin surrounding the lateral bands. Both accounts are retained with their versions;
    neither defines every centrin assembly as a posterior myoneme or proves direct
    binding. This is same-agent curation, not human sign-off.
