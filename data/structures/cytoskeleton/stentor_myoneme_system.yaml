identifier: cellstructuremech:stentor_myoneme_system
label: Stentor myoneme system
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: The cortical system of longitudinal contractile filament bundles, historically
  termed M bands, characterized in Stentor coeruleus. Its prominent posterior myonemes
  are distinct from the adjacent microtubular Km fibers; this record does not denote
  every centrin-containing cortical assembly.
definition_source: DOI:10.1083/jcb.57.3.704
mapping_status: PROPOSED
