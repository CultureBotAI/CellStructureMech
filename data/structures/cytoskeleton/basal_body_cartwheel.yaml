discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish a cartwheel record from its basal-body parent and neighbors.
  rationale: A named hub-and-spoke subassembly is not a single protein or an entire
    basal body.
  notes: Hidden/ignored-inclusive searches found cartwheel as a component of the existing
    ciliary basal body record, not as a standalone record. Complete QuickGO cartwheel
    and centriole-cartwheel searches found no exact cellular component identity. GO:0032991
    supplies the broader protein-containing complex class; basal body and pro-basal
    body are parthood, not is-a. The record centers on the hub and spokes, including
    their native peripheral specializations. Pinhead, triplet base, A-C linker, inner
    scaffold and microtubule wall are not synonyms. The 2017 core-cartwheel term excludes
    pinhead and microtubules and is narrower than the broader cartwheel usage.
  evidence:
  - reference: DOI:10.1038/ncomms14813
  - reference: DOI:10.15252/embj.2020106246
  - reference: GO:0032991
  - reference: GO:0036064
  - reference: GO:0120280
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: exact_component_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Find exact taxon-agnostic groundings for SAS-6 and Bld10/Cep135.
  rationale: Domain matches and a broader paralog family are not whole-family equivalents.
  notes: Native InterPro searches and the two UniProt entries were inspected on 2026-10-04.
    SAS-6 matches are domains or domain superfamilies. IPR051877 includes both reviewed
    human CEP135 and TSGA10 entries. Components remain REVIEWED_LABEL_ONLY; organism-specific
    examples retain native names and distinct reviewed/unreviewed statuses. No cross-species
    essentiality or whole-cartwheel stoichiometry is asserted.
  evidence:
