- component_id: bld10_cep135
  label: Bld10/Cep135
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro IPR051877 includes both CEP135 and TSGA10, as independently
    confirmed by reviewed human UniProt entries. Its scope is broader than Bld10/Cep135.
    The matched Pfam entries describe domains, not an exact whole-protein family.
  gene_symbols:
  - BLD10
  - CEP135
  essentiality: UNKNOWN
  role: Cartwheel-associated structural protein localized to radial fibers in Chlamydomonas.
    Its C-terminal fragment supports organized core-cartwheel reconstitution with
    full-length SAS-6; this does not assign the complete protein to a single density
    or establish universal cartwheel essentiality.
  evidence:
  - reference: DOI:10.1083/jcb.200402022
    notes: Immunogold localization places Bld10 on cartwheel radial fibers in basal
      bodies and pro-basal bodies. The null mutant lacks recognizable basal bodies,
      so its phenotype is not a cartwheel-specific loss assay.
  - reference: DOI:10.1038/ncomms14813
    notes: Full-length SAS-6 together with Bld10 residues 1061-1641 produces organized
      hub-and-spoke arrays in vitro. Fragment sufficiency does not establish the full
      native cartwheel proteome.
