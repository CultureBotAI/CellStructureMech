  - reference: UniProtKB:A8ID55
  - reference: InterPro:IPR051877
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: architecture_is_not_assembly_chronology
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep reconstruction periodicities and reconstitution models scoped.
  rationale: Native ring organization, artificial arrays and model fits are different
    kinds of evidence.
  notes: Klena et al. resolve closely spaced hub rings and taxon-specific spoke merging;
    low-pass filtering can obscure paired rings. The 2017 truncated SAS-6 arrays include
    eightfold assemblies, and inferred preferential ring-pair addition comes from
    height distributions rather than a direct time course. Neither experiment supplies
    a universal copy number or kinetic assembly graph. SAS-5 and Bld10 assignments
    to particular additional densities remain hypotheses; no SAS-5 component or sequence
    identity for the cartwheel inner density is asserted here.
  evidence:
  - reference: DOI:10.1038/ncomms14813
  - reference: DOI:10.15252/embj.2020106246
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: newer_trichonympha_source
  kind: CURATION_TODO
  status: OPEN
  prompt: Assess the full 2026 Trichonympha cartwheel study before adding its molecular
    model or deposits.
  rationale: Metadata and an abstract do not support an audited native model.
  notes: The published DOI and PMID:42709820 were verified, and the bioRxiv API links
    the author preprint to this publication. Publisher/full-text routes were unsuccessful
    and the preprint XML returned HTTP 429 after backoff on 2026-10-04. Full Results
    and Methods have not been inspected. Its molecular assignments, repeat interpretation,
    model stoichiometry and specimen taxon are not curated here. Existing numerical
    fields remain explicitly tied to the 2017 or 2020 Chlamydomonas experiments, not
    a universal architecture.
  evidence:
  - reference: DOI:10.1073/pnas.2612170123
    notes: Metadata and abstract inspected only; follow-up source, not evidence for
      an asserted molecular claim in this record.
  posed_by: codex
  posed_date: '2026-10-04'
