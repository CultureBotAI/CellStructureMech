identifier: cellstructuremech:basal_body_cartwheel
label: basal body cartwheel
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A proteinaceous hub-and-spoke assembly at the proximal region of a microbial
  ciliary basal body or pro-basal body. Its central hub bears nine radially arranged
  spokes that connect toward the surrounding microtubules; the hub and spokes extend
  longitudinally as a stacked scaffold.
