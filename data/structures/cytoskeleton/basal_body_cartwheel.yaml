canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: In-situ cryo-FIB/cryo-ET of mat3-4 cells resolves cartwheels in mature basal
    bodies and pro-basal bodies. This is a native cellular sample, not a recombinant
    cartwheel reconstitution.
  reference: DOI:10.15252/embj.2020106246
- taxon_id: NCBITaxon:5888
  taxon_label: Paramecium tetraurelia
  note: Cartwheels characterized by cryo-ET and subtomogram averaging of isolated
    cortical units from d4-2 and delta-CenBP1 strains. The example does not assert
    identical cartwheel length or spoke-fusion geometry across species.
  reference: DOI:10.15252/embj.2020106246
- taxon_id: NCBITaxon:5762
  taxon_label: Naegleria gruberi
  note: Isolated basal bodies from NEG cells differentiated into flagellates. Cartwheel
    periodicities were measured in undamaged regions because specimen preparation
    often compressed the basal bodies; this is not an assertion that amoeboid cells
    retain a cartwheel.
  reference: DOI:10.15252/embj.2020106246
functions:
- function_id: radial_scaffold
  label: ciliary basal body organization
  grounding: GO:0032053
  description: Provides a central radial scaffold linking the hub toward the surrounding
    microtubules in the proximal basal-body region. This structural role does not
    imply that the cartwheel alone determines microtubule number or that its absence
    abolishes every form of basal-body assembly.
  evidence:
  - reference: DOI:10.15252/embj.2020106246
    notes: Native reconstructions resolve the hub, spokes and peripheral connections.
      Static architecture does not establish a growth time course.
  - reference: DOI:10.1038/ncomms14813
physical_properties:
- property: DIAMETER
  value: 22.4 +/- 1.3
  unit: UO:0000018
  context: Central-hub diameter in isolated Chlamydomonas reinhardtii pro-basal bodies,
    Figure 1 of Guichard et al. 2017; reported value and error, n=10 measurements
    from five tomograms. The caption does not specify the error statistic. This is
    not the full spoke-to-spoke cartwheel diameter.
  reference: DOI:10.1038/ncomms14813
- property: OTHER
  value: 4.1 +/- 0.67
  unit: UO:0000018
  context: Axial central-hub density spacing in mature Chlamydomonas reinhardtii basal
    bodies imaged in situ in Klena et al. 2020, Figure 1; mean and SD, n=30 distances.
    Not a universal ring-pair repeat or whole cartwheel length.
  reference: DOI:10.15252/embj.2020106246
- property: OTHER
  value: 8.7 +/- 1.6
  unit: UO:0000018
  context: Axial spacing of cartwheel inner densities in the mature Chlamydomonas
    reinhardtii in-situ sample, Figure 1; mean and SD, n=18 distances. Inner-density
    occupancy is not uniform throughout every cartwheel.
  reference: DOI:10.15252/embj.2020106246
evidence:
