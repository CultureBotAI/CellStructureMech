components:
- component_id: sas6
  label: SAS-6
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro search returned SAS-6 domains and a domain superfamily,
    not an exact whole-protein family. These are not asserted as equivalent to SAS-6;
    the source-specific accession is retained below.
  gene_symbols:
  - SAS6
  - BLD12
  - CrSAS-6
  essentiality: UNKNOWN
  role: Structural constituent of the central hub and radial spokes. Recombinant Chlamydomonas
    SAS-6 forms ring-based assemblies, but this does not establish complete native
    composition or a fixed copy number per cartwheel.
  evidence:
  - reference: DOI:10.1038/ncomms14813
    notes: Native localization and in-vitro reconstitution with full-length CrSAS-6
      and a Bld10 C-terminal fragment support cartwheel membership. The truncated
      SAS-6 assembly assay is not a census of native subunits.
