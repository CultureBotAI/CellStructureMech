    label: gamma-tubulin complex
    node_type: GENE_OR_PROTEIN
    grounding: GO:0000930
    component_ref: gamma_tuc
  - node_id: emtoc
    label: gamma-tubulin ring complex
    node_type: STRUCTURE
    grounding: GO:0000931
    description: Assembled and functional gamma-tubulin ring complex (GO:0000931)
      operating in gamma-tubulin ring complex (gamma-TuRC) recruitment and nucleation.
  edges:
  - subject: f_actin
    predicate: supports
    object: mto1
    description: Intact F-actin supports equatorial Mto1 localization.
    evidence:
    - reference: DOI:10.1016/j.cub.2010.10.006
      notes: Latrunculin B treatment abolishes equatorial Mto1 localization; no direct
        actin-Mto1 binding is inferred.
  - subject: myp2
    predicate: supports
    object: mto1
    description: Contractile-ring Myp2 supports Mto1 recruitment to the equator.
    evidence:
    - reference: DOI:10.1016/j.cub.2010.10.006
      notes: Myp2 deletion removes equatorial Mto1 and Alp4 while retaining spindle-pole
        Mto1. Co-immunoprecipitation and two-hybrid association do not exclude intermediates.
    - reference: DOI:10.3390/cells12060917
      notes: Mto1 occupies an inner layer offset from Myp2; increased Myp2 does not
        proportionally recruit Mto1. Simple direct coassembly is not established.
  - subject: mto1
    predicate: supports
    object: gamma_tuc
    description: Equatorial Mto1 targeting supports recruitment of the gamma-tubulin
      complex.
    evidence:
    - reference: DOI:10.1016/j.cub.2010.10.006
      notes: The paper reports equatorial Alp4 with Mto1(1-1065), but not Mto1(1-1051).
        Separately, full-length mto1-427 loses equatorial Mto1 and PAA nucleation
        while retaining spindle-pole targeting; these are distinct readouts and constructs.
  - subject: mto2
    predicate: supports
    object: gamma_tuc
    description: Mto2 supports efficient equatorial gamma-tubulin-complex recruitment.
    evidence:
    - reference: DOI:10.1242/jcs.038414
      notes: Occasional faint Alp4 and very limited nucleation persist after mto2
        deletion; this is not an absolute-requirement edge.
  - subject: gamma_tuc
    predicate: supports
    object: emtoc
    description: Recruitment of nucleating machinery establishes an active equatorial
      center.
    evidence:
    - reference: DOI:10.1016/j.cub.2010.10.006
      notes: Localization and nucleation assays support this assembly interpretation,
        not sufficiency of isolated gamma-tubulin complex.
  description: Mto1-Mto2 activator complexes recruit the gamma-tubulin ring complex
    (gamma-TuRC) to fission yeast microtubule organizing centers, triggering conformational
    closure of the gamma-tubulin ring to nucleate polarized microtubule bundles.
