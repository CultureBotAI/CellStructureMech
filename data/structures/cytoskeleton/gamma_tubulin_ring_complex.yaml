      that this exact reference stock was imaged.
    evidence:
    - reference: DOI:10.1016/j.cub.2010.10.006
      notes: Mto1 localizes to the equator; the mto1-427 targeting mutant loses equatorial
        Mto1 and post-anaphase microtubules while retaining spindle-pole targeting.
    - reference: UniProtKB:O94488
      notes: Native accession, reviewed status, primary gene, protein label and source
        taxon verified on 2026-10-06. Residence and function come from the cited experiments.
  - uniprot_id: UniProtKB:Q9USP7
    protein_label: Gamma tubulin complex adapter mto2
    gene_symbol: mto2
    taxon_id: NCBITaxon:284812
    taxon_label: Schizosaccharomyces pombe 972h-
    entry_status: REVIEWED
    retrieved_on: '2026-10-06'
    role: Reference-sequence exemplar for species-level experiments; no assertion
      that this exact reference stock was imaged.
    evidence:
    - reference: DOI:10.1091/mbc.E04-11-1003
      notes: Accessible primary Results and Figure 4 place endogenous Mto2 at the
        equator with Mto1; deletion permits an early post-anaphase array that is not
        maintained.
    - reference: DOI:10.1242/jcs.038414
      notes: Very limited equatorial nucleation and occasional faint Alp4 localization
        remain in mto2-deleted cells. DISPENSABLE means initial assembly is possible,
        not normal maintenance or activity.
    - reference: UniProtKB:Q9USP7
      notes: Native accession, reviewed status, primary gene, protein label and source
        taxon verified on 2026-10-06. Residence and function come from the cited experiments.
