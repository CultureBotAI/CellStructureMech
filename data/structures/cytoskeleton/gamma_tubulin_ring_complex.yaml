functions:
- function_id: nucleation
  label: microtubule nucleation by microtubule organizing center
  grounding: GO:0051418
  description: Nucleates microtubules of the post-anaphase array from the cell division
    site.
  evidence:
  - reference: DOI:10.1016/j.cub.2010.10.006
    notes: Equator-selective Mto1 targeting defects eliminate post-anaphase microtubules
      without eliminating spindle-pole nucleation.
  - reference: DOI:10.3390/cells12060917
    notes: Time-resolved imaging links equatorial Mto1 recruitment to post-anaphase
      microtubule production.
