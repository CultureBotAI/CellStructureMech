  notes: PMID 15659644, PMC1142446; accessible indexed primary Results and captions
    read, not complete Methods or supplements.
- reference: DOI:10.1091/mbc.E04-12-1043
  notes: PMID 15800064, PMC1142447; accessible indexed primary Results read. Detection
    and cytokinesis-delay contexts differ from later selective-targeting experiments.
- reference: DOI:10.1016/j.cub.2018.04.008
  notes: PMID 29779879; native PMC7263743.1 Results, Discussion, STAR Methods and
    Figures 3/6 captions read. Direct equatorial localization is distinct from interphase
    bonsai nucleation quantification.
- reference: DOI:10.1016/s1534-5807(04)00096-6
  notes: PMID 15068790; primary abstract accessible, full Results and Methods not
    read. Used for the genetic turnover dependency, not a fully resolved biochemical
    mechanism.
- reference: DOI:10.3390/cells12060917
  notes: PMID 36980258; native PMC10047812.1 Results, Discussion, Methods and Figure
    1 caption read; original Figure 1 inspected after native checksum verification.
