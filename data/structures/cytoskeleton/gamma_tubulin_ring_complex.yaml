- component_id: mto1_mto2_activating_tether
  label: CM1-motif gamma-TuRC activator complex (Mto1-Mto2)
  component_type: PROTEIN_COMPLEX
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - mto1
  - mto2
  essentiality: DISPENSABLE
  role: Centrosomin-motif (CM1) tether complex that recruits and allosterically activates
    gamma-TuRC ring complexes at cytoplasmic and spindle pole body MTOCs.
  evidence:
  - reference: DOI:10.1016/j.cub.2010.10.006
    notes: Demonstrates that the Mto1-Mto2 complex binds and activates the gamma-tubulin
      ring complex at microtubule organizing centers.
  protein_examples:
