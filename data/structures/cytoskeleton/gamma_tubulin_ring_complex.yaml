causal_graphs:
- graph_id: gamma_tubulin_ring_complex_mechanism
  title: Gamma-tubulin ring complex recruitment and microtubule array nucleation
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Perturbation-defined recruitment dependencies in S. pombe, not a purified
    binding pathway. The F-actin/Myp2 ring context is external to the nucleation-center
    core; Mto2 loss permits weak residual assembly.
  nodes:
