identifier: GO:0000931
label: gamma-tubulin ring complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex of gamma tubulin and associated proteins thought to be formed
  by multimerization of gamma-tubulin small complexes. An example of this structure
  is found in Schizosaccharomyces pombe. A large lock-washer-shaped multiprotein complex
  (gamma-TuRC) assembled from multiple gamma-tubulin small complexes (gamma-TuSCs)
  together with additional gamma-tubulin ring proteins (GCP4/Gfh1, GCP5/Mod21, GCP6/Alp16)
  and Mzt1. In fission yeast (Schizosaccharomyces pombe), filamentous fungi, and ciliated
  protists, gamma-TuRC localizes to spindle pole bodies, interphase and equatorial
  MTOCs, and basal bodies to nucleate and cap microtubule minus ends.
