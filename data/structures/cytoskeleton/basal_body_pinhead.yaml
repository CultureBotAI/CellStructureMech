identifier: cellstructuremech:basal_body_pinhead
label: basal body pinhead
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A proteinaceous subassembly on the luminal face of the A-tubule in the
  proximal region of a microbial ciliary basal body or pro-basal body, forming the
  peripheral connection toward the cartwheel spokes. In Chlamydomonas reinhardtii
  it has a bent pinbody and two pinfeet attached to protofilament A3.
definition_source: DOI:10.7554/eLife.43434
