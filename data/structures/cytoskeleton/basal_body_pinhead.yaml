discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the pinhead from its cartwheel and microtubule neighbors.
  rationale: A named peripheral assembly is neither an entire basal body nor a single
    protein.
  notes: Hidden/ignored-inclusive repository searches and parsed identity/synonym
    checks found mentions but no standalone record. Complete QuickGO searches for
    pinhead, pinfoot, pinbody, centriole pinhead and cartwheel spoke tip found no
    exact cellular-component identity. Axonemal radial-spoke terms denote a different
    assembly. GO:0032991 is a broader class; basal body and pro-basal body are parthood.
    PinB and PinF1/PinF2 are morphological regions, not identified protein families.
    The hub, spokes, D2-rod, triplet base, A-C linker, inner scaffold and tubulin
    wall are not exact synonyms. The record does not impose an obligate cartwheel
    parthood relation on every pinhead-containing region.
  evidence:
  - reference: DOI:10.7554/eLife.43434
  - reference: DOI:10.15252/embj.2020106246
  - reference: GO:0032991
  - reference: GO:0036064
  - reference: GO:0120280
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: molecular_identity_and_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve the pinhead proteome and exact Bld10/Cep135 family grounding.
  rationale: Localization and domain matches do not assign all resolved densities
    or a complete proteome.
  notes: Bld10 membership is retained at the explicitly stated primary-abstract level.
    Obtain lawful full text of Hiraki 2007 and Noga 2022 before curating domain-specific
    locations or mutant dimensions. PMC/publisher/Europe PMC full-text routes for
    Noga were unsuccessful; the PSI DORA item psi:45372 marks its deposited PDF restricted
    to the intranet, and no restricted file was requested. Its public abstract concerns
    inter-triplet crosslinks and does not make those links exact pinhead synonyms.
    Bld10 remains REVIEWED_LABEL_ONLY because IPR051877 also includes TSGA10. Other
    constituents, stoichiometry and pinhead-specific essentiality remain unresolved.
  evidence:
  - reference: DOI:10.1016/j.cub.2007.09.021
  - reference: DOI:10.15252/embj.2020104582
  - reference: UniProtKB:A8ID55
  - reference: InterPro:IPR051877
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: declined_neighbor_assignments
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Avoid transferring cartwheel and triplet identities into the pinhead.
  rationale: Being part of the same basal body does not establish membership in every
    subassembly.
  notes: SAS-6 is discussed as a spoke constituent, but the inspected 2019 map does
    not identify SAS-6 in PinB or either foot; no SAS-6 pinhead component is asserted.
    Alpha/beta tubulin supplies the adjoining A3 lattice and is not listed as pinhead
    composition. The 2020 Bld10 assignment to the triplet base is expressly hypothetical
    and is not transferred here as a density-resolved model.
  evidence:
  - reference: DOI:10.7554/eLife.43434
  - reference: DOI:10.15252/embj.2020106246
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: measurement_and_mechanism_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep repeat measurements separate from map dimensions and assembly hypotheses.
  rationale: Static reconstruction, image processing and proposed mechanics answer
    different questions.
  notes: Li et al. tested segment length, overlap, masking, initial reference and
    mother/pro-basal-body sampling when assessing the 8-nm pinhead repeat. The 19-nm
    final reconstruction window and 23.1-angstrom resolution are not biological lengths.
    Pinhead-tip low resolution is consistent with flexibility, not a measured spring
    constant. Iris-like twist classes, spoke strain, length control and the five-step
    triplet assembly scheme are interpretations of static data, not a direct time
    course. No kinetic causal graph or motility trait is asserted. The 2020 Paramecium
    analysis warns that initial 8.5-nm picking biased its pinhead reconstruction;
    no repeat from that map is substituted for the explicitly Chlamydomonas-scoped
    2019 measurement.
  evidence:
  - reference: DOI:10.7554/eLife.43434
  - reference: DOI:10.15252/embj.2020106246
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
