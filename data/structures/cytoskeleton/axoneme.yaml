  description: In Chlamydomonas, dynein arms connect outer doublet microtubules to
    generate sliding forces; radial spokes, central-pair structures, and nexin-dynein
    regulatory links organize and coordinate the 9+2 flagellar axoneme.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
