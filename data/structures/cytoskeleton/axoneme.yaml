discussions:
- discussion_id: resolve_chlamydomonas_axoneme_subcomplex_boundaries
  prompt: Resolve exact source-neutral groundings and boundaries for inner-dynein-arm
    isoforms, nexin-dynein regulatory complex, microtubule inner proteins, and additional
    Chlamydomonas axoneme subcomplexes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#inner_dynein_arm
  - components#nexin_dynein_regulatory_complex
  rationale: The radial spoke, axonemal central apparatus, and outer and inner dynein
    arm classes now have GO-backed boundaries in this axoneme record. The Chlamydomonas
    axoneme has additional named regulatory, inner-arm isoform, and microtubule-associated
    complexes whose exact source-neutral groundings and record boundaries still need
    review.
  evidence:
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 resolved repeated and asymmetric axonemal densities
      beyond the coarse substructure classes modeled here.
  - reference: DOI:10.1083/jcb.200908067
    notes: Heuser et al. 2009 refined the DRC/nexin-link substructure in Chlamydomonas
      flagella.
