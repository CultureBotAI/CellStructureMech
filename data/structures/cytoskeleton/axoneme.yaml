functions:
- function_id: chlamydomonas_flagellar_beating
  label: Chlamydomonas flagellar beating
  description: In the Chlamydomonas 9+2 flagellar axoneme, outer-doublet microtubules,
    axonemal dyneins, radial spokes, central-pair structures, and nexin links form
    a scaffold for flagellar bending.
  evidence:
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 modeled force generation by dynein within the 9+2
      axonemal microtubule scaffold.
  - reference: DOI:10.1083/jcb.200908067
    notes: Heuser et al. 2009 connected the nexin link with axonemal dynein regulation
      in Chlamydomonas.
