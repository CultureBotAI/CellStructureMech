    - reference: DOI:10.1126/science.1128618
      notes: Nicastro et al. 2006 visualized dynein-arm organization in 9+2 axonemes.
  - subject: outer_dynein_arm
    predicate: bridges
    object: outer_doublet_microtubules
    description: Outer dynein arms project from outer doublets in Chlamydomonas axonemes.
    evidence:
    - reference: GO:0036157
      notes: GO identifies the outer dynein arm as an axonemal outer-arm structure
        on ciliary and flagellar outer doublet microtubules.
    - reference: DOI:10.1126/science.1128618
      notes: Nicastro et al. 2006 visualized dynein-microtubule organization in Chlamydomonas
        9+2 axonemes.
  - subject: radial_spoke
