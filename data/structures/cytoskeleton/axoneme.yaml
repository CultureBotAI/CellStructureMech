components:
- component_id: outer_doublet_microtubules
  label: outer doublet microtubules
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This first Chlamydomonas axoneme record keeps broad axonemal substructure
    labels until exact source-neutral groundings for the corresponding ciliary complexes
    are reviewed.
  role: Nine doublet microtubules that form the cylindrical backbone of the Chlamydomonas
    axoneme.
  evidence:
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 resolved the 9+2 microtubule arrangement in rapidly
      frozen Chlamydomonas axonemes by cryoelectron tomography.
- component_id: inner_dynein_arm
  label: inner dynein arm
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Axonemal inner-arm motor complexes attached to outer doublets that contribute
    to microtubule sliding forces.
  evidence:
  - reference: GO:0036156
    notes: GO identifies inner dynein arms as axonemal inner-arm structures on outer
      doublet microtubules.
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 focused on dynein-arm organization within Chlamydomonas
      and sea-urchin axonemes.
  grounding: GO:0036156
- component_id: nexin_dynein_regulatory_complex
  label: nexin-dynein regulatory complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This first Chlamydomonas axoneme record keeps broad axonemal substructure
    labels until exact source-neutral groundings for the corresponding ciliary complexes
    are reviewed.
  role: Interdoublet linker and dynein-regulatory complex that connects neighboring
    doublets in the motile axoneme.
  evidence:
  - reference: DOI:10.1083/jcb.200908067
    notes: Heuser et al. 2009 identified the Chlamydomonas dynein regulatory complex
      as the nexin link.
