identifier: cellstructuremech:basal_body_c_tubule_hook
label: basal body C-tubule hook
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A hook-shaped proteinaceous linker at the external B-C interface of a
  basal-body microtubule triplet. In the distal half of isolated Chlamydomonas reinhardtii
  basal bodies, hook densities occupy the C1 position, extend across the outer surfaces
  of C2-C4, and recur along the triplet axis.
definition_source: DOI:10.1038/emboj.2011.460
