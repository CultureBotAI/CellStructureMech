functions:
- function_id: external_b_c_linkage
  label: external B-C tubule linkage
  description: In the characterized Chlamydomonas distal region, the hook bridges
    the B4/C1 interface and extends across the outer C2-C4 surfaces. This is a structural
    connection, not a demonstrated hook-specific requirement for assembly, force resistance
    or motility.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
    notes: Regional cryo-electron tomography averages and Figure 4B resolve the exterior
      linker. B4 contact is described in the longitudinal-variation Discussion; molecular
      identity and assembly chronology remain interpretive.
