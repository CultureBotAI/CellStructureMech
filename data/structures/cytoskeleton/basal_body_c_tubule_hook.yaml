discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate the external C-tubule hook from other triplet linkers.
  rationale: This is an imaged named subassembly, not a gene product.
  notes: The curated label denotes the hook-shaped arm and its axial repetition described
    by Li et al., not the whole C-tubule or every outer B-C contact. Hidden/ignored-inclusive
    label, synonym, slug and citation searches found no existing record. Complete
    C-tubule-hook, C-stretch and outer-junction GO searches found no exact cellular-component
    term. GO:0160114 denotes an axonemal A-B outer junction, not this B-C structure.
    GO:0005856 is the broader cytoskeletal class and GO:0036064 is parthood. OTHER
    avoids asserting an identified multiprotein composition. The B-C inner junction,
    intertriplet A-C linker, Y-shaped inner scaffold and luminal C-tubule filaments
    are outside this boundary.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
  - reference: GO:0005856
  - reference: GO:0036064
  - reference: GO:0160114
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: molecular_identity
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify the protein constituents of the distal C-tubule hook.
  rationale: Density shape and estimated mass do not identify gene products.
  notes: The primary paper leaves the hook as an unknown protein or complex. Components,
    stoichiometry and molecular groundings remain unset. The approximately 270-kDa
    estimate uses density volume and an assumed protein density, not biochemical composition.
    A sequence-resolved assignment to this exact region is needed before adding component
    families.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: declined_component_and_mechanism_inferences
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep assembly hypotheses separate from direct hook composition.
  rationale: Regional correlation is not molecular or causal identification.
  notes: Delta-tubulin is proposed for proximal C1, not experimentally assigned to
    the distal hook. POC5 maturation phenotypes likewise do not identify a hook constituent.
    These proteins are not added. Interaction with the separate C3-to-C6/C7 luminal
    filament is conjectural; co-occurrence is not a demonstrated contact. No causal
    graph, trait link, hook-specific essentiality or chronological replacement mechanism
    is asserted.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: c_stretch_relationship
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve the relationship between the hook and the C-stretch.
  rationale: A similar position alone cannot establish homology or synonymy.
  notes: Nazarov et al. show a C1 extension called the C-stretch in Teranympha mirabilis.
    The inspected description and Figure 4I do not equate it to the Chlamydomonas
    external hook spanning C2-C4. C-stretch is not added as an exact synonym, and
    Teranympha is not added as a canonical example or clade-level distribution assertion.
    A direct structural comparison is needed before either lumping or declaring distinct
    identities.
  evidence:
  - reference: DOI:10.1038/emboj.2011.460
  - reference: DOI:10.15252/embj.2020106249
  posed_by: codex
  posed_date: '2026-10-04'
