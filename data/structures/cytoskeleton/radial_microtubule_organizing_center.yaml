discussions:
- discussion_id: identity_boundary
  prompt: Keep the radial center distinct from the SPB and output array.
  rationale: Whole-repository searches included hidden/ignored files and parsed identities
    across 908 records. Earlier HAA/PAA context is not a separate rMTOC record. Native
    GO label/alias searches with positive HAA/MTOC controls found no exact rMTOC identity,
    so a local identifier is minted with GO:0005815 as an is-a parent. The source
    resolves an amorphous assembly near but distinct from the SPB core. GO:0035974
    denotes the whole meiotic SPB and GO:0032117 the output array, neither an equivalent.
    MULTIPROTEIN_COMPLEX denotes an assembly, not a claim of fixed stoichiometry or
    membrane enclosure. No SPB, nuclear-envelope or HAA parthood is asserted solely
    from proximity.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  evidence:
