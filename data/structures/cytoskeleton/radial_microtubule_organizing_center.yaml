    notes: Primary source and its stated limitations.
  posed_by: codex
  posed_date: '2026-10-08'
- discussion_id: regulated_transition
  prompt: Retain the experimental limits of rMTOC downregulation.
  rationale: Hrs1 degradation and phosphorylation jointly downregulate the organizing
    system near meiosis I. Stabilized nonphosphorylatable Hrs1 delays bipolar spindle
    formation under specified temperature/checkpoint conditions; it does not universally
    block separation. Individual phosphosite functions and the responsible kinases/E3
    enzymes remain unresolved. Proposed holding of duplicated SPBs is not a purified
    mechanical measurement. Vegetative overexpression aggregates and HAA-like output
    are not automatically normal meiotic rMTOCs, and phosphorylation is not proof
    of destruction of every constituent.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  evidence:
  - reference: DOI:10.1016/j.cub.2012.02.042
    notes: Primary source and its stated limitations.
  posed_by: codex
  posed_date: '2026-10-08'
  resolved_date: '2026-10-08'
  resolution_note: Preserve these source boundaries in the record.
- discussion_id: taxon_and_imaging
  prompt: Keep specimen, imaging and source-access scope explicit.
  rationale: Only S. pombe is a canonical organism exemplar, with no inferred clade
    frequency. Reference proteins from taxon284812 are not asserted to be the engineered
    KT2486/KT2919 experimental stocks. EM used high-pressure freezing, freeze substitution
    and resin sections, not vitreous cryo-ET. Main immuno-EM text/captions specify
    80 minutes whereas supplemental immunolabeling methods specify 120 minutes; no
    single universal sampling time is assigned. Figure 3 includes TEM sections and
    interpretive 3D models, and contrasts wild-type hrs1 with deletion. The original
    image is unchanged CC BY 3.0 material; 100 nm bars are image provenance, not a
    curated whole-center dimension. Main text, captions and supplemental pages13-22
    were read, but movies, raw data and most supplemental panels were not inspected.
