functions:
- function_id: radial_array_organization
  label: horsetail-astral microtubule organization
  grounding: GO:0032118
  description: Organizes the radial microtubule array during S. pombe meiotic prophase
    by concentrating organizing material near the SPB and spatially arranging predominantly
    capped microtubule ends.
  evidence:
  - reference: DOI:10.1016/j.cub.2012.02.042
    notes: Tomography, immunolocalization and hrs1 deletion connect the rMTOC to radial
      geometry. They do not establish purified nucleation sufficiency or a fixed number
      of microtubules per center.
  - reference: GO:0032118
    notes: Native GO label and definition verified on 2026-10-08; the term denotes
      the biological process, not the center identity.
