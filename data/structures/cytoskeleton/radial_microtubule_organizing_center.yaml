identifier: cellstructuremech:radial_microtubule_organizing_center
label: radial microtubule organizing center
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A transient, Hrs1/Mcp6-dependent, gamma-tubulin-enriched amorphous microtubule-organizing
  assembly at the cytoplasmic side of the spindle pole body during Schizosaccharomyces
  pombe meiotic prophase, distinct from the spindle pole body core, that organizes
  the radial microtubule array used in horsetail nuclear movement.
definition_source: DOI:10.1016/j.cub.2012.02.042
