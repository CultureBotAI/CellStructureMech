  posed_by: codex
  posed_date: '2026-10-08'
- discussion_id: component_boundary
  prompt: Do not turn neighboring proteins and interaction leads into a complete inventory.
  rationale: The initial inventory covers directly localized Hrs1 and gamma-tubulin
    classes. Kms1/Kms2 are membrane/SPB interaction context; Alp4 and Mto1 interactions
    are leads for broader nucleation machinery. Neither yeast-two-hybrid interaction
    nor an older whole-SPB annotation establishes every partner as a localized constituent
    of the 2012-defined amorphous region. These proteins are not imported here as
    a complete ring, and their omission is a bounded curation decision, not a claim
    of absence. Alpha/beta polymers are the associated output array, not automatically
    the center matrix.
  kind: INTERPRETATION
  status: RESOLVED
