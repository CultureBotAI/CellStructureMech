    notes: Primary source and its stated limitations.
  posed_by: codex
  posed_date: '2026-10-08'
  resolved_date: '2026-10-08'
  resolution_note: Preserve these source boundaries in the record.
- discussion_id: native_architecture
  prompt: Resolve the native molecular bridge, complete composition and nucleation
    mechanism.
  rationale: Hrs1 localization and deletion establish membership and assembly dependence,
    but the detailed scaffold/bridge geometry is proposed. Gamma-tubulin enrichment
    does not establish a purified nucleation reaction, fixed ring stoichiometry or
    the necessity of gamma tubulin for forming the amorphous matrix. Dynein-assisted
    rearrangement includes unpublished observations, and the paper explicitly leaves
    conversion from interphase arrays unresolved. No distances or counts from selected
    tomograms are promoted to universal center dimensions.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
