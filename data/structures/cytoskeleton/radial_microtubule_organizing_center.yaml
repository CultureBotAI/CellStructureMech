    notes: Primary source and its stated limitations.
  posed_by: codex
  posed_date: '2026-10-08'
  resolved_date: '2026-10-08'
  resolution_note: Preserve these source boundaries in the record.
- discussion_id: hrs1_family_grounding
  prompt: Resolve an exact source-neutral Hrs1/Mcp6 family grounding.
  rationale: The native InterPro combined endpoint for Q10336 returned HTTP204, and
    UniProt did not provide an integrated InterPro family. The SUPFAM Tropomyosin
    match and the paper's tentative NudE similarity do not define the narrow Hrs1/Mcp6-like
    organizing class. No unverified family accession or universal cross-species equivalence
    is asserted.
