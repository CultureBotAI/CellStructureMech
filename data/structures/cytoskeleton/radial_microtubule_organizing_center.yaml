        pat1 mat-Pc diploids, not an asserted 972h- experimental stock.
    - reference: https://www.uniprot.org/uniprotkb/Q10336/entry
      notes: Native reviewed accession, recommended protein name, gene and reference
        taxon verified on 2026-10-08. Experimental membership is established by the
        primary study, not by sequence annotation alone.
  evidence:
  - reference: DOI:10.1016/j.cub.2012.02.042
    notes: Immunogold labeling places Hrs1 in the faintly electron-dense, ribosome-excluding
      region outside the SPB core. hrs1 deletion removes this recognizable region
      and normal radial geometry while retaining some nonradial SPB-associated microtubules.
      Essentiality concerns rMTOC formation, not cell viability or all microtubule
      polymerization.
