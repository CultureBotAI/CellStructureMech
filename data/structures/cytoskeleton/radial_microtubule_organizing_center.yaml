components:
- component_id: hrs1
  label: Hrs1/Mcp6-like meiotic organizing protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro combined matches for reviewed Hrs1/Mcp6 Q10336
    returned HTTP204 on 2026-10-08. UniProt supplies no exact integrated InterPro
    family; its SUPFAM Tropomyosin match is not an exact Hrs1 grounding. The primary
    paper treats NudE similarity as a hypothesis. This narrow source-neutral class
    does not assert membership of all coiled-coil, NudE or tropomyosin proteins.
  gene_symbols:
  - mcp6
  - hrs1
  - mug3
  essentiality: ESSENTIAL
  role: Localized constituent required for the recognizable meiotic rMTOC in S. pombe.
    A structural-scaffold role is supported as a model; a purified molecular bridge
    and its stoichiometry are not resolved.
