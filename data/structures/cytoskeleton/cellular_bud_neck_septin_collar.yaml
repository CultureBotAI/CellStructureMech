identifier: GO:0032174
label: cellular bud neck septin collar
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A tubular structure with flared ends, shaped like an hourglass and composed
  of highly ordered arrays of septin filaments, that forms at the bud neck of a dividing
  cell. In S. cerevisiae, this structure is located at the bud neck throughout most
  of the cell cycle and the septins are fixed within the structure, not exchanging
  with soluble septins. This septin structure acts as a scaffold for other proteins
  that function at the bud neck.
