discussions:
- discussion_id: bud_neck_septin_collar_boundary
  prompt: Keep the cellular bud neck septin collar distinct from the initial bud-neck
    septin ring and the cytokinetic split septin rings.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - causal_graphs#bud_neck_septin_collar_topology
  rationale: GO:0000144 denotes the initial ring at the future bud site, GO:0032174
    denotes the hourglass-shaped collar that forms at the bud neck for most of the
    cell cycle, and GO:0032177 denotes the two split rings formed from the collar
    at cytokinesis. This record models only the intervening collar state.
  resolution_note: Curated GO:0032174 as a bud-neck septin-collar record and used
    GO:0000144 only as a topology node for the preceding ring.
  evidence:
  - reference: GO:0000144
    notes: GO:0000144 identifies the dynamic cellular bud neck septin ring that forms
      at the time of bud emergence.
  - reference: GO:0032174
    notes: GO:0032174 identifies the fixed hourglass-shaped cellular bud neck septin
      collar.
  - reference: GO:0032177
    notes: GO:0032177 identifies the pair of split septin rings that form from the
      collar at cytokinesis.
