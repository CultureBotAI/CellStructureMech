identifier: GO:0030864
label: cortical actin cytoskeleton
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: The part of the actin cytoskeleton that lies just beneath the plasma membrane.
  In budding yeast (Saccharomyces cerevisiae), fission yeast, and other fungi and
  protists, the cortical actin cytoskeleton comprises Arp2/3-nucleated branched actin
  cortical patches and cortical actin filaments that drive endocytic vesicle internalization
  and cell-cortex remodeling.
