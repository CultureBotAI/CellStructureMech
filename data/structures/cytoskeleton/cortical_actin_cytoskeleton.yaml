functions:
- function_id: endocytic_internalization
  label: endocytic internalization
  description: Arp2/3-nucleated branched actin filament networks of the cortical actin
    cytoskeleton assemble beneath the plasma membrane at endocytic sites and generate
    force for vesicle internalization.
  evidence:
  - reference: DOI:10.1016/S0092-8674(03)00883-3
    notes: Kaksonen, Sun and Drubin 2003 tracked cortical actin assembly and inward
      movement during yeast endocytic internalization.
  - reference: DOI:10.1371/journal.pbio.0060001
    notes: Galletta, Chuang and Cooper 2008 dissected Arp2/3-regulated cortical actin
      network assembly and motility during endocytosis.
evidence:
- reference: GO:0030864
  notes: 'Gene Ontology cellular-component term for cortical actin cytoskeleton: The
    part of the actin cytoskeleton that lies just beneath the plasma membrane.'
- reference: GO:0030479
  notes: Gene Ontology term for actin cortical patch, a major Arp2/3-nucleated substructure
    (has_part) of the cortical actin cytoskeleton in fungi.
- reference: GO:0005885
  notes: Gene Ontology term for the Arp2/3 protein complex, a constituent branch-nucleating
    complex of the cortical actin cytoskeleton.
- reference: DOI:10.1016/S0092-8674(03)00883-3
  notes: Kaksonen, Sun and Drubin 2003 (Cell) dissect how the budding-yeast cortical
    actin cytoskeleton assembles at plasma-membrane endocytic sites to drive internalization.
- reference: DOI:10.1083/jcb.200404159
  notes: Young, Cooper and Bridgman 2004 (J Cell Biol) resolve the branched actin
    filament architecture of the yeast cortical actin cytoskeleton.
- reference: DOI:10.1371/journal.pbio.0060001
  notes: Galletta, Chuang and Cooper 2008 (PLoS Biol) analyze Arp2/3 regulators in
    cortical actin assembly and endocytosis.
causal_graphs:
