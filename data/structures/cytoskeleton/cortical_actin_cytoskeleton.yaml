  title: Arp2/3-mediated branched actin assembly and endocytic function of the cortical
    actin cytoskeleton
  description: The Arp2/3 complex (GO:0005885) nucleates branched Act1 filaments beneath
    the plasma membrane to assemble the cortical actin cytoskeleton (GO:0030864),
    which mediates endocytic internalization.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Captures core Act1 and Arp2/3 assembly into the Saccharomyces cerevisiae
    cortical actin cytoskeleton and its role in endocytic internalization.
