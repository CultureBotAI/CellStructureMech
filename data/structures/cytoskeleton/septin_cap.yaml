discussions:
- discussion_id: septin_cap_boundary
  prompt: Keep the septin cap distinct from narrower germ-tube and hyphal septin caps
    and from septin rings or collars.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032159 denotes the parent septin-cap structure at the leading edge
    of filamentous fungal growth. GO:0032171 and GO:0032164 are exact child terms
    for germ-tube and hyphal septin caps, whereas GO:0005940 and GO:0032173 model
    ring-shaped and collar-shaped septin structures.
  resolution_note: Curated GO:0032159 as the generic septin cap, used GO:0032156 as
    its is-a parent, and documented germ-tube and hyphal cap terms as narrower future
    records.
  evidence:
  - reference: GO:0032159
    notes: GO:0032159 identifies the septin cap.
  - reference: GO:0032171
    notes: GO:0032171 identifies the narrower germ tube septin cap.
  - reference: GO:0032164
    notes: GO:0032164 identifies the narrower hyphal septin cap.
  - reference: GO:0005940
    notes: GO:0005940 identifies the broader septin ring class.
  - reference: GO:0032173
    notes: GO:0032173 identifies the broader septin collar class.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
