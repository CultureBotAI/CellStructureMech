identifier: GO:0032159
label: septin cap
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A faint structure formed of septins found at the leading edge of growth
  in germ tubes and hyphae in fungal cells growing filamentously. This cap of septins
  colocalizes with a region of the plasma membrane that is rich in ergosterol.
