components:
- component_id: calmyonemin
  label: Calmyonemin proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Named centrin-like, calcium-binding protein class; no exact source-neutral
    family mapping established. InterPro calmyonemin search returned no entry. IPR050145
    Centrin/CML-like also includes obelin and Arabidopsis CML proteins, so it is not
    an exact mapping of this class.
  essentiality: UNKNOWN
  role: Antibody-localized myonemal constituents; molecular identity and native inventory
    are not resolved to specific paralogues.
  evidence:
  - reference: DOI:10.1002/cm.970270208
    notes: Primary abstract reports A69 immunoelectron localization to E. maggii myonemes
      plus biochemical calcium-binding and centrin-similarity evidence. An essential
      role in retraction is postulated, not experimentally established.
  - reference: DOI:10.1016/S0248-4900(94)80014-6
    notes: Publisher-deposited abstract reports anti-calmyonemin immunofluorescence
      at E. bursa ciliature bases and describes subkinetal myoneme assembly. Other
      antibody-positive arrays are not merged into this structure.
