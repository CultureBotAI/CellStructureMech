discussions:
- discussion_id: identity_and_granularity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Delimit one subkinetal bundle system rather than a generic myoneme or a
    record per species.
  rationale: Shared calcium-binding proteins do not make all ciliate contractile architectures
    the same structure.
  notes: Hidden- and ignored-inclusive whole-repository searches for target names,
    species, component and source identifiers found no matches before scaffolding.
    QuickGO subkinetal, myoneme and calmyonemin searches returned zero hits. The apical
    ciliature-associated bundles differ from the extended Paramecium lattice, Spirostomum
    fishnet, Stentor longitudinal M bands and peritrich body/stalk systems. The clade-qualified
    label does not assert universal distribution or uniqueness to that clade.
  evidence:
  - reference: DOI:10.1002/cm.970270208
    notes: Abstract identifies convergent bundles at retractile apical ciliary zones.
  - reference: DOI:10.1016/S0248-4900(94)80014-6
    notes: Abstract explicitly names subkinetal myonemes in the related ciliate study.
  - reference: https://www.ebi.ac.uk/QuickGO/services/ontology/go/search?query=subkinetal
    notes: Authority identity search before minting.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: calmyonemin_identity_and_inventory
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve the native calmyonemin sequences, exact family grounding and other
    bundle constituents.
  rationale: Antibody cross-reactivity and EF-hand similarity do not establish an
    exact taxon-neutral family mapping or complete composition.
  notes: Keep the named component label-only. Do not substitute a generic EF-hand
    domain, the broader Centrin/CML-like family or an organism-specific accession
    as exact identity. No Sfi1 scaffold, actin, myosin, copy number or native paralogue
    inventory is transferred from other ciliate systems.
  evidence:
  - reference: DOI:10.1002/cm.970270208
    notes: Abstract characterizes a centrin-like calcium-binding protein, not a complete
      native assembly.
  - reference: InterPro:IPR050145
    notes: Issuing-authority description includes caltractin, obelin and Arabidopsis
      CML37/38; broader than the curated component.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: other_calmyonemin_arrays
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep other calmyonemin-positive arrays and their cell-cycle behavior outside
    this record.
  rationale: A shared immunoreactive protein does not establish anatomical identity
    or a shared assembly pathway.
  notes: Do not include the E. bursa circumciliary-lip, cytoproct or postoral endoplasmic
    arrays as subkinetal bundles merely from antibody signal. The reported transient
    resorption belongs to the endoplasmic array, not the parental subkinetal myonemes.
    Cilia and basal bodies are associated structures, not molecular constituents of
    the bundles.
  evidence:
  - reference: DOI:10.1016/S0248-4900(94)80014-6
    notes: Abstract distinguishes multiple localization sites and specifies the endoplasmic
      array as the exception among parental arrays during division.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
