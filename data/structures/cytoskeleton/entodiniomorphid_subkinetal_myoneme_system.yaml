functions:
- function_id: apical_ciliature_retraction
  label: Apical ciliature retraction
  description: The subkinetal contractile bundles support withdrawal of apical ciliature
    during stress-associated retraction; the molecular force-generating mechanism
    remains unresolved here.
  evidence:
  - reference: DOI:10.1002/cm.970270208
    notes: Abstract places converging myonemes beneath retractile apical ciliary zones.
  - reference: DOI:10.1016/S0248-4900(94)80014-6
    notes: Abstract explicitly describes subkinetal myonemes as contractile bundles
      powering ciliature retraction.
