identifier: cellstructuremech:entodiniomorphid_subkinetal_myoneme_system
label: Entodiniomorphid subkinetal myoneme system
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A system of calmyonemin-containing contractile filament bundles associated
  with the bases of retractile apical ciliature in entodiniomorphid ciliates, characterized
  in Eudiplodinium maggii and Entodinium bursa. This record denotes the subkinetal
  bundles, not all other calmyonemin-positive arrays or the cilia themselves.
definition_source: DOI:10.1016/S0248-4900(94)80014-6
mapping_status: PROPOSED
