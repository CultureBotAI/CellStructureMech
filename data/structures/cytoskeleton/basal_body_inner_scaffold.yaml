identifier: cellstructuremech:basal_body_inner_scaffold
label: basal body inner scaffold
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A proteinaceous meshwork lining the lumen-facing surface of the central
  basal-body wall and interconnecting neighboring triplet microtubules through multiple
  attachment sites.
definition_source: DOI:10.1083/jcb.202311104
mapping_status: PROPOSED
