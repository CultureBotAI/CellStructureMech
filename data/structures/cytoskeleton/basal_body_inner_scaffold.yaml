components:
- component_id: poc1
  label: POC1 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro IPR050505 combines WDR55 and POC1 and is broader than
    this class. IPR020472 is a WD40 repeat, not an exact POC1 family. The inspected
    POC1 accession Q229Z6 and family searches do not justify either as exact identity.
  gene_symbols:
  - POC1
  essentiality: UNKNOWN
  role: Anchors the scaffold at the central-core A-B inner junction. Its WD40 domain
    contacts an unidentified stem protein connecting toward the scaffold. This role
    does not assign Poc1 to the central-core B-C junction.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
    notes: Figures 5D-E and 6C combine model fitting and loss of the corresponding
      density in poc1 deletion material. Scaffold density is nearly absent in the
      mutant; initial assembly versus subsequent maintenance is not separated.
- component_id: fam161a
  label: FAM161A family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The paper identifies a Tetrahymena Fam161A homolog at TTHERM_00052590.
    Its unreviewed SB210 UniProt entry Q23CT1 matches IPR019579, Protein FAM161A/B,
    and IPR051655, FAM161. These combined or broader families do not establish an
    exact FAM161A-only grounding. No strain-paired protein example is inferred.
  gene_symbols:
  - FAM161A
  essentiality: UNKNOWN
  role: Inner-scaffold-associated constituent supported by endogenous-tag localization
    at the basal-body core and reduced basal-body signal after Poc1 loss. Its exact
    position within the scaffold and direct binding partners in Tetrahymena remain
    unassigned; additional distal localization is present.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
    notes: Results and Figures 5A, 6A and S5 support the homolog assignment and localization.
      Unlike Poc1, Fam161A has no assigned molecular cryo-ET density here. Human-protein
      interaction results cited by the article are not direct evidence of a Tetrahymena
      Poc1-Fam161A contact.
canonical_examples:
- taxon_id: NCBITaxon:5911
  taxon_label: Tetrahymena thermophila
  note: Cryotomography of isolated wild-type and poc1-deletion basal bodies resolves
    the central-core scaffold and its attachments. Endogenous Fam161A tagging and
    fluorescence imaging provide complementary localization evidence. Methods list
    B2086 and SB1969 backgrounds; this example is species-level, not an asserted strain-specific
    pairing with SB210 reference sequences.
  reference: DOI:10.1083/jcb.202311104
functions:
- function_id: intertriplet_cohesion
  label: intertriplet cohesion
  description: Provides luminal connections between neighboring basal-body triplet
    microtubules in the central core. In the studied Tetrahymena material, backfitted
    reconstructions support stacked rings rather than a universal helical geometry.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
    notes: Figure 5B-C and Figure S4E support the intertriplet meshwork and ring arrangement.
      This structural function does not assert a measured force threshold or selective
      scaffold-dependent rescue of basal-body shape.
causal_graphs:
- graph_id: poc1_scaffold_attachment
  title: Poc1 anchors a luminal intertriplet scaffold
  description: Structural contacts and a separately bounded localization dependency
    in the Tetrahymena basal-body central core.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: Contact edges describe fitted cryo-ET density, not temporal assembly
    order. The fluorescence edge describes basal-body Fam161A signal, not a direct
    Poc1-Fam161A interaction or an exclusively scaffold-specific measurement. Poc1
    deletion affects multiple basal-body modules, so this graph does not attribute
    the entire mechanical phenotype to scaffold loss.
  nodes:
  - node_id: poc1
    label: POC1 family protein
    node_type: GENE_OR_PROTEIN
    component_ref: poc1
  - node_id: triplets
    label: central-core basal-body triplet microtubules
    node_type: STRUCTURE
    description: Scaffold attachment substrate, not an axonemal microtubule identity.
  - node_id: stem
    label: unassigned A-B junction stem density
    node_type: STATE
    description: Observed barrel-shaped protein density adjacent to Poc1. Its molecular
      identity is unknown; it is not an invented component family.
  - node_id: scaffold
    label: basal body inner scaffold
    node_type: STRUCTURE
  - node_id: fam161a_signal
    label: basal-body Fam161A localization signal
    node_type: STATE
    description: Normalized fluorescence at basal bodies includes more than one Fam161A
      localization pool; it is not a scaffold-only occupancy measurement.
  edges:
  - subject: poc1
    predicate: binds at the A-B inner junction of
    object: triplets
    description: Poc1 WD40 density bridges the A01/B10 junction in the basal-body
      core.
    evidence:
    - reference: DOI:10.1083/jcb.202311104
      notes: Figure 5D-E and Video 4 support placement and mutant density loss.
  - subject: poc1
    predicate: contacts
    object: stem
    description: The lumen-exposed Poc1 WD40 domain contacts the unidentified stem.
    evidence:
    - reference: DOI:10.1083/jcb.202311104
      notes: Figure 6C resolves contiguous densities; both disappear in poc1 deletion
        material.
  - subject: stem
    predicate: connects toward
    object: scaffold
    description: The unassigned stem joins the elongated luminal scaffold density.
    evidence:
    - reference: DOI:10.1083/jcb.202311104
      notes: Figures 5D and 6C and Results support the structural attachment model.
  - subject: scaffold
    predicate: interconnects
    object: triplets
    description: The luminal meshwork contacts triplets at A03 and A-B and B-C attachment
      sites and connects laterally to neighboring repeats.
    evidence:
    - reference: DOI:10.1083/jcb.202311104
      notes: Figure 5B-C and Results show multiple attachments and lateral connections.
  - subject: poc1
    predicate: supports normal levels of
    object: fam161a_signal
    description: Basal-body Fam161A fluorescence is reduced but not eliminated in
      poc1 deletion cells at 30 degrees C relative to wild type.
    evidence:
    - reference: DOI:10.1083/jcb.202311104
      notes: Figure 6A compares total-cell-normalized basal-body signal at 30 degrees
        C (p = 0.0079). This is a perturbation dependency, not evidence of direct
        binding or complete recruitment dependence.
