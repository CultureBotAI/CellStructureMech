discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the inner scaffold from adjacent basal-body structures.
  rationale: The imaged intertriplet meshwork is a physical entity, not a single protein
    or the whole basal body.
  notes: Hidden- and ignored-inclusive repository searches found no existing identity
    record. Complete GO searches for scaffold, centriole and intertriplet found no
    exact cellular-component term. GO:0140180 is a molecular function, not this structure.
    GO:0140535 is a broader is-a parent; GO:0036064 is parthood. The proximal A-C
    linker, cartwheel, pinhead and transition-zone Y-links are distinct. Inner junctions
    form attachment interfaces, not scaffold synonyms.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  - reference: GO:0140535
  - reference: GO:0036064
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: exact_family_groundings
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact POC1 and FAM161A family groundings without substituting broader
    families.
  rationale: A combined family or domain is not an exact identity for a narrower component
    class.
  notes: Both components remain REVIEWED_LABEL_ONLY. The inspected Fam161A homolog
    accession describes SB210, whereas endogenous tagging uses other backgrounds.
    No strain-paired protein example or unverified A/B orthology is asserted.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: unresolved_scaffold_composition
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify the stem and other attachment proteins and locate Fam161A within
    the scaffold.
  rationale: The two named classes are not a complete composition or a molecular model
    of every scaffold density.
  notes: Fam161A localization supports scaffold association but does not identify
    a particular density or direct Tetrahymena Poc1 contact. A03 and B-C attachment
    identities remain unresolved. Poc1-knockout material loses most scaffold density,
    including in complete-triplet subclasses, but a reduced A03 density remains. Assembly
    requirements, stoichiometry and attachment redundancy need further experiments;
    essentialities are UNKNOWN.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: exclude_neighboring_or_cross_species_assignments
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not import nearby proteins or human scaffold composition as demonstrated
    Tetrahymena constituents.
  rationale: Colocalization and evidence from another organism do not by themselves
    establish the same molecular placement.
  notes: Poc16/WDR90 colocalizes in the core but its predicted shape does not fit
    the Poc1-containing A-B junction density; the paper does not assign it to this
    scaffold. Human POC5 and Centrin2 assignments and human Poc1B-Fam161A binding
    are not copied as Tetrahymena evidence. Microtubules are attachment substrates,
    not additional scaffold protein families. Unidentified densities remain open questions
    rather than invented components.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: mechanical_and_geometric_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep mechanical interpretations and geometric measurements within their
    assay scope.
  rationale: Poc1 loss affects multiple modules, and preparation-induced deformation
    is not a direct in-cell force measurement.
  notes: Stacked rings are supported in the studied Tetrahymena material, not a universal
    scaffold geometry. Isolated mutant flattening can reflect grid preparation. High-temperature
    phenotypes do not isolate a scaffold-only mechanism. The wild-type Fam161A temperature
    comparison in Figure 6A has p = 0.0560 and is not treated as a significant decrease.
    U-ExM scale bars refer to acquired expanded images, not expansion-corrected biological
    size.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
