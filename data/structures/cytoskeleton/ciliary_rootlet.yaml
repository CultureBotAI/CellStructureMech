components:
- component_id: sf_assemblin_homologs
  label: SF-assemblin homologs
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Segmented coiled-coil proteins that polymerize into the 2-nm filaments of
    striated ciliary and flagellar rootlets in microbial eukaryotes.
  evidence:
  - reference: DOI:10.1083/jcb.121.4.837
    notes: Weber et al. 1993 identified SF-assemblin as the structural protein of
      2-nm filaments from striated microtubule-associated fibers of algal flagellar
      roots.
  - reference: DOI:10.1186/s13630-019-0062-y
    notes: Nabi et al. 2019 found SF-Assemblin homologs in Paramecium ciliary striated
      rootlets.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for the SF-assemblin homologs that
    build microbial eukaryotic striated ciliary rootlets was verified in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  presence: COMMON
  note: Chlamydomonas reinhardtii carries SF-assemblin-positive noncontractile striated
    roots in its flagellar basal apparatus.
  reference: DOI:10.1242/jcs.115.7.1511
- taxon_id: NCBITaxon:5888
  taxon_label: Paramecium tetraurelia
  presence: COMMON
  note: Paramecium tetraurelia basal bodies carry striated ciliary rootlets containing
    SF-Assemblin homologs.
  reference: DOI:10.1186/s13630-019-0062-y
canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Green-algal model in which SF-assemblin was tagged, depleted and localized
    to noncontractile striated roots in the flagellar basal apparatus.
  reference: DOI:10.1242/jcs.115.7.1511
- taxon_id: NCBITaxon:5888
  taxon_label: Paramecium tetraurelia
  note: Ciliate model in which SF-Assemblin paralogs and structural groups were linked
    to ciliary striated rootlet organization by RNAi.
  reference: DOI:10.1186/s13630-019-0062-y
evidence:
- reference: GO:0035253
  notes: Gene Ontology cellular-component term for the ciliary rootlet.
- reference: DOI:10.1083/jcb.115.3.705
  notes: Lechtreck and Melkonian 1991 identified assemblin as a 34-kDa structural
    protein that forms paracrystalline 2-nm filaments in striated microtubule-associated
    fibers.
- reference: DOI:10.1083/jcb.121.4.837
  notes: Weber et al. 1993, SF-assemblin, the structural protein of the 2-nm filaments
    from striated microtubule associated fibers of algal flagellar roots, forms a
    segmented coiled coil.
- reference: DOI:10.1242/jcs.115.7.1511
  notes: Lechtreck, Rostmann and Grunow 2002 analyzed Chlamydomonas SF-assemblin by
    GFP tagging and antisense constructs.
- reference: DOI:10.1186/s13630-019-0062-y
  notes: Nabi et al. 2019 linked Paramecium SF-Assemblin genes to ciliary striated
    rootlets and surface organization.
causal_graphs:
- graph_id: sf_assemblin_ciliary_rootlet_topology
  title: SF-assemblin homologs build striated ciliary rootlets
  description: In microbial eukaryotes, segmented coiled-coil SF-assemblin homologs
    assemble into striated ciliary or flagellar rootlets that originate at ciliary
    basal bodies.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the established SF-assemblin polymer-to-rootlet and
    rootlet-to-basal-body topology while leaving the full assembly pathway and lineage-specific
    rootlet paralog boundaries unresolved.
