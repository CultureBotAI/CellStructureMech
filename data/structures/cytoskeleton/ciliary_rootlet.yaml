discussions:
- discussion_id: resolve_sf_assemblin_grounding
  prompt: Resolve exact InterPro, Pfam or NCBIfam grounding for microbial eukaryotic
    SF-assemblin homologs that build striated ciliary rootlets.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#sf_assemblin_homologs
  rationale: SF-assemblin homologs are established constituents of green-algal and
    ciliate striated rootlets, but this pass did not verify one family accession that
    exactly covers those rootlet proteins without pulling in unrelated coiled-coil
    proteins.
  evidence:
  - reference: DOI:10.1083/jcb.121.4.837
    notes: Weber et al. 1993 showed that algal SF-assemblin is a segmented coiled-coil
      protein.
  - reference: DOI:10.1186/s13630-019-0062-y
    notes: Nabi et al. 2019 analyzed the expanded Paramecium SF-Assemblin homolog
      set.
  posed_by: codex
  posed_date: '2026-09-22'
- discussion_id: split_rootlet_subtypes
  prompt: Decide whether algal rhizoplasts, Paramecium transverse, post-ciliary and
    striated rootlets, and metazoan rootletin-based rootlets need subtype records.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#sf_assemblin_ciliary_rootlet_topology
  rationale: The GO term names the broad ciliary rootlet class, while microbial eukaryotes
    carry lineage-specific rootlet arrays whose geometry and molecular paralogs differ.
  evidence:
  - reference: DOI:10.1186/s13630-019-0062-y
    notes: Nabi et al. 2019 distinguish the major Paramecium striated rootlet from
      other basal-body rootlet systems.
  - reference: DOI:10.1007/s00709-003-0016-4
    notes: Brugerolle and Mignot 2003 describe a basal-body-to-nucleus rhizoplast
      in chrysomonads.
  posed_by: codex
  posed_date: '2026-09-22'
