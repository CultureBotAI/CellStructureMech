    object: ciliary_rootlet
    description: SF-assemblin homologs form segmented coiled-coil 2-nm filaments that
      polymerize into striated microtubule-associated rootlet fibers.
    evidence:
    - reference: DOI:10.1083/jcb.121.4.837
      notes: Weber et al. 1993 identified SF-assemblin as the structural protein of
        2-nm filaments from algal flagellar-root fibers.
    - reference: DOI:10.1242/jcs.115.7.1511
      notes: Lechtreck et al. 2002 observed SFA-GFP assembling into striated fibers
