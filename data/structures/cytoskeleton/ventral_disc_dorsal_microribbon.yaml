identifier: GO:0097594
label: ventral disc dorsal microribbon
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: Trilaminar structure extending perpendicularly into the cytoplasm along
  the length of ventral disc microtubules in Giardia species (trophozoite stage).
  Constituents of dorsal microribbons (also called dorsal ribbons or microribbons)
  include alpha-coiled-helix proteins approximately 29 to 38 kDa in size. These proteins
  line the edges of the microribbons but are not found in microtubules. Tubulins are
  not found in microribbons.
