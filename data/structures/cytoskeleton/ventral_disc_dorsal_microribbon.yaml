  role: Alpha-helical microribbon proteins, including beta-giardin, delta-giardin
    and SALP-1-like constituents, that build the proteinaceous Giardia ventral-disc
    dorsal microribbon.
  evidence:
  - reference: GO:0097594
    notes: Gene Ontology describes dorsal microribbons as trilaminar structures containing
      alpha-coiled-helix proteins of approximately 29 to 38 kDa.
  - reference: DOI:10.1371/journal.pone.0043783
    notes: Schwartz et al. 2012 describe microribbons as ventral-disc structures containing
      striated fiber-assemblin homologs such as beta-giardin, delta-giardin and SALP-1.
