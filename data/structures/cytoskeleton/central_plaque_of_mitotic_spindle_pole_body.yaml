discussions:
- discussion_id: mitotic_central_plaque_boundary
  prompt: Keep the mitotic SPB central plaque narrower than the general SPB central
    plaque and avoid the malformed GO:0061493 definition text.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - definition
  - definition_source
  - parent_structures
  - part_of
  rationale: GO:0061493 denotes the central plaque of the mitotic spindle pole body,
    is narrower than GO:0005823, and is part of the GO:0044732 mitotic spindle pole
    body. Its current definition text describes the inner plaque instead of the central
    plaque, so the local definition follows the existing GO:0005823 central-plaque
    boundary and SPB literature.
  resolution_note: Curated GO:0061493 as the mitosis-specific SPB central plaque,
    with is-a and part-of links to the corresponding GO terms and a literature-backed
    local definition.
  evidence:
  - reference: GO:0061493
    notes: GO:0061493 identifies the central plaque of the mitotic spindle pole body.
  - reference: GO:0005823
    notes: GO:0005823 identifies the nuclear-envelope-embedded central plaque of the
      spindle pole body.
  - reference: GO:0044732
    notes: GO:0044732 identifies the mitotic spindle pole body.
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the layered budding-yeast mitotic SPB.
