identifier: GO:0106094
label: nuclear membrane microtubule tethering complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A nuclear membrane protein complex that connects the nuclear inner and
  outer membranes and links nuclear structures across the nuclear envelope to cytoplasmic
  microtubules. In Schizosaccharomyces pombe and other fungi, nuclear membrane microtubule
  tethering complexes composed of the inner nuclear membrane SUN-domain protein Sad1
  and outer nuclear membrane KASH-domain linker Kms1 (bridged during meiosis to telomeres
  by Bqt1-Bqt2) couple chromosomes and spindle pole body attachment sites across the
  nuclear envelope to cytoplasmic microtubule motors.
