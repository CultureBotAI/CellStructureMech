canonical_examples:
- taxon_id: NCBITaxon:284812
  taxon_label: Schizosaccharomyces pombe 972h-
  note: Characterized model system for nuclear membrane microtubule tethering complex
    (GO:0106094) within the nuclear-envelope-spanning nuclear membrane microtubule
    tethering complex. Reference fission yeast model in which the Sad1-Kms1 LINC bridge
    and Bqt1-Bqt2 meiotic telomere bouquet tether were genetically and biochemically
    defined.
  reference: DOI:10.1016/j.cell.2006.01.048
functions:
- function_id: telomere_organization
  label: telomere organization
  grounding: GO:0032200
  description: Tethers telomere-bound Bqt1-Bqt2 connectors to the inner nuclear membrane
    SUN protein Sad1 and outer membrane KASH protein Kms1, clustering chromosome ends
    at the nuclear envelope during meiotic prophase in Schizosaccharomyces pombe.
  evidence:
  - reference: DOI:10.1016/j.cell.2006.01.048
    notes: Chikashige et al. 2006 show that Bqt1-Bqt2 connect telomeric Rap1 to Sad1
      to tether telomeres to the nuclear envelope.
  - reference: DOI:10.1038/celldisc.2017.41
    notes: Live-cell imaging and conditional Bqt1 degradation show that the Bqt1-Bqt2-Sad1
      tether maintains telomere attachment at the nuclear envelope.
- function_id: meiotic_spindle_support
  label: Support of meiotic spindle formation
  description: Maintained fission-yeast telomere-nuclear envelope tethering via Bqt1-Bqt2
    and Sad1-Kms1 supports normal spindle pole body behavior and meiotic spindle formation.
  evidence:
  - reference: DOI:10.1038/celldisc.2017.41
    notes: Premature Bqt1 degradation disrupts telomere-envelope tethering and increases
      meiotic spindle defects in S. pombe.
evidence:
- reference: GO:0106094
  notes: 'Gene Ontology cellular-component term for nuclear membrane microtubule tethering
    complex: A nuclear membrane protein complex that connects the nuclear inner and
    outer membranes and links nuclear structures across the nuclear envelope to cytoplasmic
    microtubules.'
- reference: GO:1990612
  notes: Gene Ontology cellular-component term for the Sad1-Kms1 LINC complex, the
    canonical fission-yeast nuclear membrane microtubule tethering complex.
- reference: DOI:10.1016/j.cell.2006.01.048
  notes: Chikashige et al. 2006 (Cell, PMID 16615890) identify the Bqt1-Bqt2 meiotic
    connector bridging telomeric Rap1 to the inner nuclear membrane SUN protein Sad1
    in S. pombe.
- reference: DOI:10.1016/j.cub.2012.02.042
  notes: Yoshida et al. 2013 (Curr Biol, PMID 22425159) characterize the fission-yeast
    Sad1-Kms1 nuclear-envelope tethering system and cytoplasmic microtubule organization.
- reference: DOI:10.1038/celldisc.2017.41
  notes: Moiseeva et al. 2017 (Cell Discov, PMID 29123917) demonstrate by live-cell
    imaging and conditional Bqt1 degradation that the Sad1-associated tether maintains
    telomere attachment and meiotic spindle integrity.
- reference: DOI:10.1038/s41467-025-56049-9
  notes: 2025 study (Nat Commun, PMID 39833200) tracking Sad1-Kms1 recruitment in
    the fission-yeast nuclear membrane microtubule tethering complex.
