identifier: GO:0106094
label: nuclear membrane microtubule tethering complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A nuclear membrane protein complex that connects the nuclear inner and
  outer membranes and links nuclear structures across the nuclear envelope to cytoplasmic
  microtubules. In yeasts and other fungi (such as Schizosaccharomyces pombe and Saccharomyces
  cerevisiae), nuclear membrane microtubule tethering complexes composed of inner-membrane
  SUN-domain proteins (Sad1, Mps3) and outer-membrane KASH-like linkers (Kms1, Kms2,
  Mps2) couple chromosomes and spindle pole body attachment sites to cytoplasmic microtubule
  motors.
