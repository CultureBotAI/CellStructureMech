  title: SUN-KASH nuclear membrane microtubule tethering complex assembly and force
    transmission
  description: Inner nuclear membrane SUN proteins (Sad1) and outer nuclear membrane
    KASH proteins (Kms1) form the nuclear membrane microtubule tethering complex spanning
    the nuclear envelope to couple telomeric connectors (Bqt1-Bqt2) to cytoplasmic
    microtubule-based movement.
