discussions:
- discussion_id: identity_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the whole array distinct from its organizing center and other microtubule
    networks.
  rationale: Parsed checks over 906 existing records and hidden/ignored-inclusive
    name, accession and citation searches found no whole-array duplicate. GO:1990295
    exactly denotes the array, with parent GO:0110165, part-of GO:0015630 and has-part
    GO:0000923. The has-part existential is not inverted into universal center part-of
    array. OTHER describes the multi-filament system, not a single filament or fixed
    stoichiometric complex. ePAA and lPAA are equatorial and longitudinal portions,
    not early/late arrays or exact whole-array synonyms. Spindle, interphase arrays,
    individual microtubules and microtubule ends remain distinct.
  evidence:
  - reference: GO:1990295
  - reference: DOI:10.3390/cells12060917
  - reference: DOI:10.1091/mbc.E23-01-0034
- discussion_id: component_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish array constituents, the nucleating subassembly and external
    ring context.
  rationale: Alpha/beta tubulin and resident Ase1 belong to the array. Its organizing
    center is included at subassembly level, without duplicating every center protein.
    Myp2 and F-actin are upstream ring context; recruitment dependence alone does
    not make the whole ring a PAA constituent. Mto1/Myp2 spatial offsets and dosage
    responses constrain simple direct coassembly without excluding indirect association.
    Unknown tubulin or center assembly essentiality is not replaced by a cell-viability
    phenotype. Ase1 deletion leaves an altered array, so this constituent is DISPENSABLE
    for assembly.
  evidence:
  - reference: DOI:10.3390/cells12060917
  - reference: DOI:10.1016/j.cub.2010.10.006
  - reference: GO:1990295
  - reference: GO:0005874
- discussion_id: composition_limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Extend PAA-specific composition only after checking localization and assembly
    evidence.
  rationale: This is not an exhaustive protein inventory. Mal3 is used as a plus-tip
    reporter in supplementary Figure S2, which has not been directly inspected; no
    Mal3 class is added from that lead alone. A beta-tubulin family assignment is
    not an isoform-specific localization assay, so no Nda3 protein example is supplied.
    InterPro families define classes, not universal PAA residence of every family
    member. Direct PAA-specific evidence is needed before adding other motors or microtubule-associated
    proteins.
  evidence:
  - reference: DOI:10.3390/cells12060917
  - reference: InterPro:IPR002452
  - reference: InterPro:IPR002453
  - reference: InterPro:IPR007145
- discussion_id: nuclear_mechanism_limits
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Resolve the physical PAA-nuclear-envelope interface and transmitted forces.
  rationale: Contact imaging, envelope deformation and selective perturbations support
    a mechanical basket interpretation, but do not identify a purified interface or
    calibrated forces. Protection from septal cutting, DNA-damage avoidance and precise
    inheritance benefits remain hypotheses; no nuclei were cut by the ring after PAA
    loss under the reported conditions. Later newborn-cell simulations model interphase
    microtubules and growth, not PAA. MBC affects multiple networks and can leave
    residual PAA signal.
  evidence:
  - reference: DOI:10.1091/mbc.E23-01-0034
- discussion_id: ring_mechanics_limits
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep inferred effective stiffness separate from direct measurements and
    universal cytokinesis requirements.
  rationale: Ablations used rings approximately 20-50 percent constricted, single-plane
    imaging and recoil fits. Interpreting increased recoil as reduced effective stiffness
    assumes unchanged initial tension. Mutant recoil often failed to plateau or moved
    out of plane; fitted amplitudes and timescales are lower bounds. Selective mto1-427
    PAA impairment did not measurably alter anchoring, constriction or cytokinetic
    timing under the tested conditions. Complete mto1 deletion affects additional
    networks and cannot establish a PAA-only healing or timing defect. These experiments
    do not exclude stress-specific roles.
  evidence:
  - reference: DOI:10.3390/cells12060917
- discussion_id: taxon_and_access
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Preserve taxon, source-access and quantitative limits.
  rationale: Only S. pombe is a canonical example; reference-sequence taxon 284812
    does not identify every experimental stock. Main Results, Discussion and Methods
    of the two 2023 papers and Results/Discussion of the 2010 targeting paper were
    read. Separate strain supplements, actual movies, raw data and inline equation
    graphics remain uninspected. No clade-wide prevalence, fixed whole-array copy
    number, universal dimension, exact Complex Portal composition, trait link or pathway
    relation is inferred. The hosted figure is the unchanged CC BY 4.0 original; restricted-license
    imagery from the nuclear-position study is not hosted.
  evidence:
