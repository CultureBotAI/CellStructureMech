functions:
- function_id: nuclear_position
  label: nucleus localization
  grounding: GO:0051647
  description: Limits nuclear migration toward the division plane after anaphase,
    opposing the displacement produced by mitotic spindle-pole microtubules before
    septation in S. pombe.
  evidence:
  - reference: DOI:10.1091/mbc.E23-01-0034
    notes: PAA-deficient cells position nuclei closer to the division plane; longitudinal
      PAA microtubules dynamically contact and deform the nuclear envelope. Later
      newborn-cell centering is a distinct interphase-network mechanism.
- function_id: ring_mechanics
  label: Contribution to effective contractile-ring stiffness
  description: The PAA is implicated in the effective stiffness inferred from ring-ablation
    recoil in S. pombe, conditional on unchanged initial ring tension.
  evidence:
  - reference: DOI:10.3390/cells12060917
    notes: Selective mto1-427 PAA impairment increases fitted recoil amplitude. Stiffness
      interpretation assumes unchanged initial tension; incomplete mutant plateaus
      and single-plane imaging limit the fitted parameters. This is not a direct stiffness
      measurement or a universal anchoring requirement.
