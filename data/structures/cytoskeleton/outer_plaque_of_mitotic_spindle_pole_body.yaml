discussions:
- discussion_id: mitotic_outer_plaque_boundary
  prompt: Keep the mitotic SPB outer plaque narrower than the general SPB outer plaque
    and distinct from the meiotic outer plaque.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - part_of
  rationale: GO:0061499 denotes the outer plaque of the mitotic spindle pole body,
    is narrower than GO:0005824, and is part of the GO:0044732 mitotic spindle pole
    body. The existing local meiotic outer plaque record denotes a sporulation-specific
    outer-plaque remodeling product and stays outside this mitotic subtype.
  resolution_note: Curated GO:0061499 as the mitosis-specific SPB outer plaque, with
    is-a and part-of links to the corresponding GO terms.
  evidence:
  - reference: GO:0061499
    notes: GO:0061499 identifies the outer plaque of the mitotic spindle pole body.
  - reference: GO:0005824
    notes: GO:0005824 identifies the general outer plaque of the spindle pole body.
  - reference: GO:0044732
    notes: GO:0044732 identifies the mitotic spindle pole body.
