discussions:
- discussion_id: outer_plaque_boundary
  prompt: Keep the spindle-pole-body outer plaque distinct from the prospore membrane
    attachment site and from the sporulation-specific meiotic outer plaque.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: GO:0005824 denotes a cytoplasmic laminate structure of the spindle pole
    body. The meiotic outer plaque nucleates prospore membrane formation in Saccharomyces,
    and GO:0070057 denotes the separate region of the prospore membrane to which the
    SPB is anchored.
  resolution_note: Curated GO:0005824 as the general SPB outer plaque, linked it by
    parthood to GO:0005816, and left the sporulation-specific meiotic outer-plaque
    boundary for a focused component-level curation pass.
  evidence:
  - reference: GO:0005824
    notes: GO:0005824 identifies the cytoplasmic outer plaque of the spindle pole
      body.
  - reference: GO:0070057
    notes: GO:0070057 identifies the separate prospore membrane spindle pole body
      attachment site.
  - reference: DOI:10.1093/emboj/19.14.3657
    notes: Knop and Strasser 2000 analyzed spindle-pole-body outer-plaque remodeling
      during prospore membrane formation.
