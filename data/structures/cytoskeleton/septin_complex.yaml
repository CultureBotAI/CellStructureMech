- taxon_id: NCBITaxon:4896
  taxon_label: Schizosaccharomyces pombe
  presence: COMMON
  note: Fission yeast Spn1, Spn2, Spn3 and Spn4 form an oligomeric septin complex.
    An et al. 2004 detected at least two copies of each septin and proposed a two-copy-per-subunit
    model, while noting that the exact stoichiometry remained to be proven rigorously.
  reference: DOI:10.1091/mbc.E04-07-0640
