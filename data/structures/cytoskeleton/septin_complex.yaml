- discussion_id: septin_complex_boundary
  prompt: Keep oligomeric septin complexes distinct from higher-order septin filaments,
    rings, and collars.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - causal_graphs#septin_complex_oligomerization
  rationale: GO:0031105 denotes oligomeric septin protein complexes. GO:0005940 denotes
    higher-order cortical septin rings at division planes, and GO:0032173 denotes
    tubular septin collars assembled from ordered filament arrays.
  resolution_note: Curated GO:0031105 as the oligomeric complex and left filament,
    ring, and collar polymerization to higher-order septin-structure records.
