- discussion_id: interphase_sin_inhibitory_scope_clarification
  prompt: Distinguish the Spg1 GTPase from its GAP and bound interphase/checkpoint
    inhibition by cell-cycle context.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - definition
  - functions#interphase_sin_inactivation
  - canonical_examples
  - discussions#interphase_sin_complex_boundary
  rationale: The inherited GO:0160066 definition calls Spg1 a GTPase activator, although
    the cited primary paper identifies Spg1 as the GTPase inhibited by Byr4-Cdc16.
    Earlier curation corrected part of the function wording but left the definition
    and an unrestricted inactive-before-anaphase claim. The paper separates normal
    cell-cycle progression from G2 and mitotic checkpoint arrests.
  resolution_note: Use a literature-backed local definition and inhibitory function.
    Spg1 can activate in metaphase; Dma1-dependent Sid4 ubiquitination limits Plo1
    recruitment in G2 and checkpoint arrest, rather than proving global SIN inactivity
    before anaphase. This clarification supersedes the erroneous role and unrestricted
    inhibition interpretation while preserving prior discussions, the old-SPB interphase
    association, GO identity and open component-grounding task.
  evidence:
  - reference: DOI:10.1038/emboj.2010.317
    notes: Introduction separates Spg1 from Byr4-Cdc16 and describes metaphase activation.
      Figure 5 examines G2 and cell-cycle context; Figure 7 examines checkpoint-dependent
      Byr4 retention and Plo1 recruitment.
  - reference: GO:0160066
    notes: Exact identity and synonym retained; current source definition contains
      the molecular-role conflict corrected locally.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
