identifier: GO:0160066
label: interphase SIN signaling complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A SIN signaling complex associated with the old spindle pole body during
  interphase in an inhibitory configuration. In Schizosaccharomyces pombe, the Byr4-Cdc16
  GAP inhibits the Spg1 GTPase. Dma1-dependent ubiquitination of the Sid4 scaffold
  antagonizes Plo1 recruitment in G2 and during a mitotic checkpoint arrest.
definition_source: DOI:10.1038/emboj.2010.317
