identifier: GO:0160066
label: interphase SIN signaling complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A SIN signaling complex associated with the old mitotic spindle pole body
  during interphase and early M-phase and characterised by the presence active ubiquitin
  ligase (Dma1 in fission yeast) and GTPase activator (Spg1 in fission yeast) to inactivate
  SIN signaling.
