functions:
- function_id: interphase_sin_inactivation
  label: interphase SIN inactivation
  description: The old-SPB interphase SIN signaling complex contains inhibitory Dma1
    ubiquitin-ligase and Spg1 GTPase-regulatory activities that keep septation-initiation
    signaling inactive before anaphase.
  evidence:
  - reference: GO:0160066
    notes: GO:0160066 defines this complex by its association with the old mitotic
      spindle pole body and inactivation of SIN signaling.
  - reference: DOI:10.1038/emboj.2010.317
    notes: Johnson and Gould 2011 studied Dma1-dependent regulation of the fission-yeast
      SIN scaffold Sid4 and Plo1 kinase localization at spindle pole bodies.
evidence:
