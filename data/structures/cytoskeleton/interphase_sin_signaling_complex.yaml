functions:
- function_id: interphase_sin_inactivation
  label: interphase SIN inactivation
  description: In S. pombe, Byr4-Cdc16 restrains Spg1 during interphase. Dma1-dependent
    Sid4 ubiquitination limits Plo1 recruitment in G2 and during a mitotic checkpoint
    arrest, helping prevent premature septation. This inhibitory configuration does
    not imply that SIN remains inactive throughout normal pre-anaphase mitosis.
  evidence:
  - reference: GO:0160066
    notes: GO:0160066 identifies the interphase inhibitory SIN configuration; the
      local molecular-role and cell-cycle wording follows the primary paper instead
      of its erroneous Spg1-as-GAP source wording.
  - reference: DOI:10.1038/emboj.2010.317
    notes: Johnson and Gould 2011 distinguish the Spg1 GTPase from its Byr4-Cdc16
      GAP. Figures 5 and 7 support Dma1-dependent Sid4 ubiquitination antagonizing
      Plo1 recruitment in G2 and during checkpoint arrest. The Introduction describes
      Spg1 activation in metaphase, so inhibition is not uniform throughout pre-anaphase
      mitosis.
evidence:
- reference: GO:0160066
  notes: Gene Ontology cellular-component term for the interphase SIN signaling complex,
    with the British spelling as an exact synonym.
- reference: GO:0160065
  notes: Gene Ontology parent term for the broader SIN/MEN signaling complex.
- reference: GO:0071957
  notes: Gene Ontology cellular-component term for the old mitotic spindle pole body
    named in the GO:0160066 definition.
- reference: DOI:10.1038/emboj.2010.317
  notes: Johnson and Gould 2011 studied Dma1-dependent Sid4 ubiquitination and Plo1
    recruitment at fission-yeast SPBs. G2 and nda3-KM311 checkpoint experiments are
    distinct from normal metaphase activation; Spg1 is the GTPase and Byr4-Cdc16 its
    inhibitory GAP.
discussions:
- discussion_id: interphase_sin_complex_boundary
  prompt: Keep the interphase SIN signaling complex as the narrower fission-yeast
    GO child rather than the broad SIN/MEN complex or later anaphase SIN states.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0160066 is an is-a child of the broader GO:0160065 SIN/MEN signaling
    complex and is defined by the old-SPB interphase or early-M-phase SIN state. It
    is distinct from GO:0160067, the new-SPB SIN signaling complex active in anaphase,
    and from GO:1990334, the narrower two-component GAP complex. No part_of link to
    the old mitotic SPB is asserted here because GO:0160066 says the complex is associated
    with that SPB rather than declaring a proper-parthood relation.
  resolution_note: Curated GO:0160066 as an exact record with GO:0160065 parentage
    and left old-SPB localization as evidence-backed scope rather than as a parthood
    edge.
  evidence:
  - reference: GO:0160066
    notes: GO:0160066 identifies the interphase SIN signaling complex.
  - reference: GO:0160067
    notes: GO:0160067 identifies the narrower new spindle pole body SIN signaling
      complex.
  - reference: GO:1990334
    notes: GO:1990334 identifies the SIN/MEN two-component GAP complex.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
