discussions:
- discussion_id: interphase_sin_complex_boundary
  prompt: Keep the interphase SIN signaling complex as the narrower fission-yeast
    GO child rather than the broad SIN/MEN complex or later anaphase SIN states.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0160066 is an is-a child of the broader GO:0160065 SIN/MEN signaling
    complex and is defined by the old-SPB interphase or early-M-phase SIN state. It
    is distinct from GO:0160067, the new-SPB SIN signaling complex active in anaphase,
    and from GO:1990334, the narrower two-component GAP complex. No part_of link to
    the old mitotic SPB is asserted here because GO:0160066 says the complex is associated
    with that SPB rather than declaring a proper-parthood relation.
  resolution_note: Curated GO:0160066 as an exact record with GO:0160065 parentage
    and left old-SPB localization as evidence-backed scope rather than as a parthood
    edge.
  evidence:
  - reference: GO:0160066
    notes: GO:0160066 identifies the interphase SIN signaling complex.
  - reference: GO:0160067
    notes: GO:0160067 identifies the narrower new spindle pole body SIN signaling
      complex.
  - reference: GO:1990334
    notes: GO:1990334 identifies the SIN/MEN two-component GAP complex.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
