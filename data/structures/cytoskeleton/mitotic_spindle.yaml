components:
- component_id: alpha_beta_tubulins
  label: alpha- and beta-tubulins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Eukaryotic tubulin subunits that polymerize into the spindle microtubules
    of the mitotic spindle.
  evidence:
  - reference: GO:0005876
    notes: Gene Ontology defines spindle microtubules as microtubules that are part
      of a mitotic or meiotic spindle.
  - reference: DOI:10.1126/science.277.5325.574
    notes: Straight et al. 1997 imaged GFP-Tub1-labeled spindle microtubules in living
      Saccharomyces cerevisiae cells.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The mitotic spindle uses alpha- and beta-tubulin subunits that
    are shared with other eukaryotic microtubule arrays; no exact source-neutral CURIE
    was assigned for only the mitotic-spindle tubulin constituents.
