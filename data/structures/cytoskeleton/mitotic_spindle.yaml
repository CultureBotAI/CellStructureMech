    notes: GO:0072686 defines the mitotic spindle around spindle-associated microtubules
      and proteins.
  - reference: DOI:10.1083/jcb.129.6.1601
    notes: Winey et al. 1995 distinguished budding-yeast kinetochore and interpolar
      spindle microtubules structurally.
  posed_by: codex
  posed_date: '2026-09-18'
