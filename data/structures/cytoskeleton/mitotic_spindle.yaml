causal_graphs:
- graph_id: budding_yeast_spindle_microtubule_architecture
  title: Spindle microtubules bridge budding-yeast spindle poles and kinetochores
  description: In Saccharomyces cerevisiae, spindle pole bodies organize a bipolar
    array of spindle microtubules, and a subset of those microtubules attach to kinetochores
    during mitosis.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph places spindle microtubules, spindle pole bodies, and kinetochores
    in a structural budding-yeast architecture without modeling every motor, microtubule-associated
    protein, or cell-cycle input.
  nodes:
  - node_id: spindle_pole_body
    label: spindle pole body
    node_type: STRUCTURE
    grounding: GO:0005816
  - node_id: spindle_microtubule
    label: spindle microtubule
    node_type: STRUCTURE
    grounding: GO:0005876
  - node_id: kinetochore
    label: kinetochore
    node_type: STRUCTURE
    grounding: GO:0000776
  - node_id: mitotic_spindle
    label: mitotic spindle
    node_type: STRUCTURE
    grounding: GO:0072686
  edges:
  - subject: spindle_pole_body
    predicate: anchor
    object: spindle_microtubule
    description: Budding-yeast spindle pole bodies anchor the spindle microtubules
      that form the mitotic spindle.
    evidence:
    - reference: GO:0005876
      notes: GO:0005876 defines spindle microtubules as part of a spindle and anchored
        at one spindle pole.
    - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
      notes: Jaspersen and Winey 2004 reviewed the budding-yeast SPB as the nuclear
        microtubule-organizing center.
  - subject: spindle_microtubule
    predicate: assemble into
    object: mitotic_spindle
    description: Spindle microtubules form the bipolar microtubule array of the mitotic
      spindle.
    evidence:
    - reference: GO:0005819
      notes: GO:0005819 defines the spindle as an array of microtubules and associated
        molecules between opposite poles.
    - reference: DOI:10.1083/jcb.129.6.1601
      notes: Winey et al. 1995 reconstructed budding-yeast mitotic spindles from serial
        electron micrographs and classified their microtubule bundles.
  - subject: spindle_microtubule
    predicate: attach to
    object: kinetochore
    description: A subset of budding-yeast spindle microtubules forms kinetochore
      fibers.
    evidence:
    - reference: GO:0000776
      notes: GO:0000776 defines the kinetochore as a centromeric complex that provides
        an attachment point for spindle microtubules.
    - reference: DOI:10.1083/jcb.129.6.1601
      notes: Winey et al. 1995 reconstructed budding-yeast spindles containing presumptive
        kinetochore microtubules and interpolar microtubules.
discussions:
- discussion_id: spindle_poles_and_kinetochores_are_boundaries
  prompt: Keep spindle pole bodies and kinetochores as adjacent structures instead
    of molecular components of the generic mitotic-spindle record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#alpha_beta_tubulins
  - causal_graphs#budding_yeast_spindle_microtubule_architecture
  rationale: In budding yeast, spindle pole bodies organize spindle microtubules and
    kinetochores provide chromosome attachment sites for them, but both are separate
    GO-denoted structures with their own composition and curation boundaries rather
    than taxon-agnostic molecular constituents of GO:0072686.
  evidence:
  - reference: GO:0005816
    notes: GO:0005816 denotes the fungal spindle pole body.
  - reference: GO:0000776
    notes: GO:0000776 denotes the kinetochore.
  - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
    notes: Jaspersen and Winey 2004 reviewed the SPB as the budding-yeast microtubule-organizing
      center.
  posed_by: codex
  posed_date: '2026-09-18'
  resolved_date: '2026-09-18'
- discussion_id: resolve_spindle_microtubule_associated_proteins
  prompt: Resolve exact source-neutral groundings for mitotic spindle motors and microtubule-associated
    proteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
