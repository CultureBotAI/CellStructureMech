identifier: GO:0097593
label: ventral disc microtubule array
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A part of the ventral disc of Giardia species (trophozoite stage) consisting
  of a spiral array of microtubules linked to the ventral membrane. These microtubules
  form the base of the ventral disc dorsal microribbons that extend nearly perpendicular
  from the membrane.
