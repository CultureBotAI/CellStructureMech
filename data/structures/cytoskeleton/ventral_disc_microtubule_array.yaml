  title: Tubulin microtubules form the Giardia ventral-disc spiral scaffold
  description: In Giardia, alpha- and beta-tubulins polymerize into microtubules that
    form a left-handed spiral array within the ventral disc and serve as the base
    of dorsal microribbons.
