synonyms:
- synonym_text: FAZ
  synonym_type: RELATED_SYNONYM
  source: GO:0120119
components:
- component_id: faz_filament
  label: FAZ filament
  component_type: OTHER
  component_role: CONSTITUENT
  role: Cytoskeletal filament-domain core of the trypanosome FAZ that runs along the
    attached flagellum and contains FAZ1, FAZ2, CC2D and additional FAZ proteins.
  evidence:
  - reference: DOI:10.1016/j.pt.2015.12.010
    notes: Sunter and Gull 2016 reviewed the FAZ filament as one of the FAZ domains
      and tabulated FAZ1, FAZ2 and CC2D as filament-domain proteins.
  - reference: DOI:10.1242/jcs.168377
    notes: Zhou et al. 2015 localized newly identified FAZ proteins to the FAZ filament
      and assayed FAZ filament assembly and maintenance after RNAi.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0120119 denotes the entire flagellum attachment zone. No exact
    source-neutral CURIE for the FAZ filament subdomain was curated.
- component_id: faz1
  label: FAZ1 repetitive filament protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - FAZ1
  - Tb927.4.3740
  essentiality: ESSENTIAL
  role: Large repetitive protein that marks the FAZ filament and is required for normal
    FAZ filament structure and function.
  evidence:
  - reference: DOI:10.1016/j.protis.2007.08.005
    notes: Vaughan et al. 2008 identified FAZ1 as a repetitive T. brucei FAZ filament
      protein and tested its requirement for FAZ filament structure and function.
  - reference: DOI:10.1016/j.pt.2015.12.010
    notes: Sunter and Gull 2016 list Tb927.4.3740/FAZ1 in the FAZ filament domain
      in their FAZ protein summary.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam or NCBIfam accession for
    the complete FAZ1 protein family was curated.
- component_id: faz2
  label: FAZ2 filament protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - FAZ2
  - Tb927.1.4310
  essentiality: UNKNOWN
  role: FAZ filament protein needed to maintain the FAZ filament and the stability
    of multiple FAZ filament components.
  evidence:
  - reference: DOI:10.1242/jcs.168377
    notes: Zhou et al. 2015 identified FAZ2 by localization screening and found that
      FAZ2 knockdown disrupted the FAZ filament and destabilized other FAZ filament
      proteins.
  - reference: DOI:10.1016/j.pt.2015.12.010
    notes: Sunter and Gull 2016 list Tb927.1.4310/FAZ2 in the FAZ filament domain.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam or NCBIfam accession for
    the complete FAZ2 protein family was curated.
- component_id: cc2d
  label: CC2D FAZ filament protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - CC2D
  - Tb927.4.2080
  essentiality: UNKNOWN
  role: Coiled-coil and C2-domain FAZ filament protein that contributes to FAZ assembly
    and complexes with FAZ2.
  evidence:
  - reference: DOI:10.1242/jcs.087676
    notes: Zhou et al. 2011 characterized a coiled-coil and C2-domain protein required
      for FAZ assembly and T. brucei cell morphology.
  - reference: DOI:10.1242/jcs.168377
    notes: Zhou et al. 2015 identified CC2D as a FAZ2 partner through affinity purification.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The CC2D component is curated as a T. brucei FAZ protein by gene
    name because no exact source-neutral complete-family CURIE was curated.
taxonomic_distribution:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  presence: COMMON
  note: The FAZ runs alongside the attached flagellum in procyclic and bloodstream
    T. brucei forms and has been dissected by RNAi, tagging and microscopy.
  reference: DOI:10.1016/j.pt.2015.12.010
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: Trypanosome model in which a localization-based screen identified FAZ2 on
    the FAZ filament, and FAZ2 knockdown connected a FAZ filament constituent to filament
    maintenance and cytokinesis.
  reference: DOI:10.1242/jcs.168377
functions:
- function_id: lateral_flagellum_attachment
  label: lateral flagellum-cell-body attachment
  description: The FAZ links the motile cilium to the trypanosome cell body along
    the lateral flagellum attachment path.
  evidence:
  - reference: DOI:10.1111/j.1550-7408.1999.tb04592.x
    notes: Kohl et al. 1999 followed assembly of the flagellum attachment zone complex
      during the T. brucei cell cycle.
  - reference: DOI:10.1016/j.pt.2015.12.010
    notes: Sunter and Gull 2016 reviewed the FAZ as the structure that mediates lateral
      attachment of the T. brucei flagellum to the cell body.
- function_id: trypanosome_cell_morphogenesis
  label: trypanosome cell morphogenesis
  description: FAZ assembly and length help regulate trypanosome cell shape, cell
    length and positions of single-copy organelles.
  evidence:
  - reference: DOI:10.1016/j.pt.2015.12.010
    notes: Sunter and Gull 2016 reviewed FAZ length and composition as regulators
      of trypanosome morphology and organelle positioning.
- function_id: flagellum_attachment_zone_organization
  label: flagellum attachment zone organization
  description: New FAZ proteins are incorporated near the proximal base of the FAZ
    filament as the trypanosome builds a daughter FAZ.
  evidence:
  - reference: DOI:10.1242/jcs.168377
    notes: Zhou et al. 2015 found proximal incorporation of FAZ filament proteins
      during FAZ filament assembly.
evidence:
- reference: DOI:10.1111/j.1550-7408.1999.tb04592.x
  notes: Kohl, Sherwin and Gull 1999, Assembly of the paraflagellar rod and the flagellum
    attachment zone complex during the Trypanosoma brucei cell cycle, Journal of Eukaryotic
    Microbiology.
- reference: DOI:10.1016/j.protis.2007.08.005
  notes: Vaughan et al. 2008, A Repetitive Protein Essential for the Flagellum Attachment
    Zone Filament Structure and Function in Trypanosoma brucei, Protist.
- reference: DOI:10.1242/jcs.087676
  notes: Zhou et al. 2011, A coiled-coil- and C2-domain-containing protein is required
    for FAZ assembly and cell morphology in Trypanosoma brucei, Journal of Cell Science.
- reference: DOI:10.1242/jcs.168377
  notes: Zhou et al. 2015, Assembly and maintenance of the flagellum attachment zone
    filament in Trypanosoma brucei, Journal of Cell Science.
- reference: DOI:10.1016/j.pt.2015.12.010
  notes: 'Sunter and Gull 2016, The Flagellum Attachment Zone: The Cellular Ruler
    of Trypanosome Morphology, Trends in Parasitology.'
