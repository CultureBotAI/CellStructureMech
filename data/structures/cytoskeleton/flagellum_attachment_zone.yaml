identifier: GO:0120119
label: flagellum attachment zone
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A network of cytoskeletal and membranous connections responsible for the
  lateral attachment of the cilium to the cell body in some trypanosomatid species.
definition_source: GO:0120119
mapping_status: PROPOSED
