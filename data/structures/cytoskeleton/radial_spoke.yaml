functions:
- function_id: regulation_of_cilium_movement
  label: regulation of cilium movement
  grounding: GO:0003352
  description: Radial spokes form part of the axonemal transducer system that links
    outer doublets to the central pair and helps regulate dynein-driven ciliary and
    flagellar beating.
