- component_id: radial_spoke_neck
  label: radial spoke neck
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding: GO:0120343
  role: Connector subcomplex between the radial-spoke stalk and head.
  evidence:
  - reference: GO:0120343
    notes: GO identifies the radial spoke neck as the complex that connects the spoke
      stalk to the spoke head.
  - reference: DOI:10.1242/jcs.245233
    notes: Poghosyan et al. 2020 model the radial-spoke neck as a distinct Chlamydomonas
      radial-spoke region.
- component_id: radial_spoke_stalk
  label: radial spoke stalk
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding: GO:0001536
  role: Elongated subcomplex that attaches the radial spoke to the A-tubule of an
    axonemal outer doublet.
  evidence:
  - reference: GO:0001536
    notes: GO identifies the radial spoke stalk as the elongated radial-spoke portion
      between the A-tubule-binding base and the neck.
  - reference: DOI:10.1242/jcs.245233
    notes: Poghosyan et al. 2020 assigned Chlamydomonas radial-spoke proteins to the
      stalk region.
