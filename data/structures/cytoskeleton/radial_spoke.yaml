  - node_id: radial_spoke_base
    label: radial spoke base
    node_type: STRUCTURE
  - node_id: outer_doublet_microtubule
    label: outer doublet microtubule
    node_type: STRUCTURE
  - node_id: axonemal_central_pair
    label: axonemal central pair
    node_type: STRUCTURE
