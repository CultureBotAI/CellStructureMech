causal_graphs:
- graph_id: chlamydomonas_radial_spoke_transduction
  title: Head, neck and stalk organize the radial spoke
  description: In Chlamydomonas flagella, the radial-spoke base binds an outer-doublet
    A-tubule, the stalk connects the base to the neck, and the neck connects to the
    head, which projects toward the central pair to help regulate axonemal beating.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph records the coarse radial-spoke head, neck and stalk architecture
    and leaves the exact positions, copy numbers and family groundings of individual
    RSP proteins for later component-level curation.
  nodes:
  - node_id: radial_spoke_head
    label: radial spoke head
    node_type: STRUCTURE
    grounding: GO:0001535
    component_ref: radial_spoke_head
  - node_id: radial_spoke_neck
    label: radial spoke neck
    node_type: STRUCTURE
    grounding: GO:0120343
    component_ref: radial_spoke_neck
  - node_id: radial_spoke_stalk
