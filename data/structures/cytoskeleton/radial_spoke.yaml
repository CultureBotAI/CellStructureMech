identifier: GO:0001534
label: radial spoke
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A ciliary and flagellar axonemal protein complex with a stalk attached
  to each outer-doublet A-tubule and a head that projects toward the central-pair
  microtubule sheath.
