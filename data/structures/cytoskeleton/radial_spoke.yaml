  edges:
  - subject: radial_spoke_head
    predicate: is part of
    object: radial_spoke
    description: The radial spoke head is a named terminal subcomplex of the radial
      spoke.
    evidence:
    - reference: GO:0001535
      notes: GO places the radial spoke head as part of the radial spoke.
  - subject: radial_spoke_neck
    predicate: connects to
    object: radial_spoke_head
    description: The radial spoke neck connects to the radial-spoke head.
    evidence:
    - reference: GO:0120343
      notes: GO defines the radial spoke neck by its connection between the stalk
        and head.
  - subject: radial_spoke_neck
    predicate: connects to
    object: radial_spoke_stalk
    description: The radial spoke neck connects the spoke head to the radial-spoke
      stalk.
    evidence:
    - reference: GO:0120343
      notes: GO defines the radial spoke neck by its connection between the stalk
        and head.
  - subject: radial_spoke_stalk
    predicate: connects to
    object: radial_spoke_base
    description: The radial spoke stalk connects to the separate A-tubule-binding
      base at its microtubule-proximal end.
    evidence:
    - reference: GO:0001536
      notes: GO defines the stalk as the elongated portion between the A-tubule-binding
        base and the neck; the base is not included in this exact stalk grounding.
  - subject: radial_spoke_base
    predicate: binds to
    object: outer_doublet_microtubule
    description: The radial-spoke base binds the A-tubule of an axonemal outer doublet.
    evidence:
    - reference: GO:0001536
      notes: The stalk definition identifies the base as the portion that binds the
        outer-doublet A-tubule.
  - subject: radial_spoke_head
    predicate: projects toward
    object: axonemal_central_pair
    description: The radial spoke head projects toward the central pair of the 9+2
      axoneme.
    evidence:
    - reference: GO:0001535
      notes: GO defines the radial spoke head as the radial-spoke portion that projects
        toward the central pair.
    - reference: DOI:10.1126/science.1128618
      notes: Nicastro et al. 2006 visualized radial spokes in Chlamydomonas 9+2 axonemes.
  - subject: radial_spoke
    predicate: participates in
    object: regulation_of_cilium_movement
    description: The radial spoke is part of the ciliary motility transducer apparatus
      that regulates axonemal beating.
    evidence:
    - reference: DOI:10.1242/jcs.245233
      notes: Poghosyan et al. 2020 frame the radial spoke as a complex in the ciliary
        motility transducer apparatus.
