  note: Reference fission-yeast system in which Pcp1-RFP inheritance distinguishes
    the pre-existing pole. Cdc7 is present at both poles in early anaphase B but becomes
    restricted to the new pole in late anaphase B; old-pole signaling is not constitutively
    absent.
  reference: DOI:10.1101/gad.296204
evidence:
- reference: GO:0071957
  notes: Gene Ontology cellular-component term for the old mitotic spindle pole body,
    with old SPB as an exact synonym.
- reference: GO:0044732
  notes: Gene Ontology cellular-component parent term for mitotic spindle pole body.
- reference: GO:0071958
  notes: Gene Ontology cellular-component sibling term for the newly formed new mitotic
    spindle pole body.
- reference: DOI:10.1101/gad.296204
  notes: Grallert et al. 2004 distinguished old and new fission-yeast SPBs using Pcp1-RFP.
    Figure 5 shows Cdc7 at both poles in early anaphase B and its later restriction
    to the new pole. Figure 6 shows that compromised Fin1 function can restore Cdc7
    to both poles. These experiments support stage-dependent SIN regulation, not permanent
    absence of signaling proteins from the old pole.
discussions:
- discussion_id: old_mitotic_spb_boundary
  prompt: Keep the GO age/asymmetry term for the old mitotic SPB narrower than the
    general mitotic SPB and distinct from local old/new SPB duplication placeholders.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0071957 denotes the pre-existing mitotic spindle pole body that lacks
    active mitotic-exit signaling proteins, whereas GO:0044732 denotes the broader
    mitotic SPB. The older ungrounded old_spb and new_spb causal-graph nodes on the
    general SPB record are generic duplication roles and are not exact records for
    the fission-yeast GO:0071957 and GO:0071958 age/asymmetry terms.
  resolution_note: Curated GO:0071957 as the exact record for the old mitotic SPB,
    parented it to GO:0044732, and cited GO:0071958 only as the new mitotic SPB sibling.
  evidence:
  - reference: GO:0071957
    notes: GO:0071957 identifies the old mitotic spindle pole body.
  - reference: GO:0071958
    notes: GO:0071958 identifies the new mitotic spindle pole body.
  - reference: GO:0044732
    notes: GO:0044732 identifies the broader mitotic spindle pole body.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
- discussion_id: resolve_old_mitotic_spb_signaling_exclusions
  prompt: Resolve exact source-neutral family groundings and exclusion evidence for
    fission-yeast SIN and NIMA-related proteins that distinguish the old mitotic SPB.
  kind: CURATION_TODO
