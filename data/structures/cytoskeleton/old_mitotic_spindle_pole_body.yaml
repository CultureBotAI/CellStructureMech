  posed_by: codex
  posed_date: '2026-09-29'
- discussion_id: old_mitotic_spb_signaling_scope_clarification
  prompt: Separate old-pole identity from stage-dependent fission-yeast SIN activity
    and budding-yeast inheritance.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - definition
  - canonical_examples
  - discussions#old_mitotic_spb_boundary
  - discussions#resolve_old_mitotic_spb_signaling_exclusions
  rationale: The inherited GO definition and earlier boundary discussion used unqualified
    signaling-inactivity wording. Grallert et al. 2004 Figure 5 shows Cdc7 on both
    poles early in anaphase B and only on the new pole later; Fin1 remains associated
    with the old pole, and Fin1 perturbation can reactivate old-pole signaling. The
    paper discusses old-pole inheritance by the bud/daughter separately in Saccharomyces
    cerevisiae, not as the defining segregation pattern of symmetrically dividing
    S. pombe.
  resolution_note: Use a literature-backed local definition and stage-bounded S. pombe
    example. This clarification supersedes the unrestricted inactivity interpretation
    in the earlier discussion while preserving that historical text, GO:0071957 identity,
    parentage and the open exact-family grounding task. Neither lack of activity nor
    regulator localization is evidence for wholesale protein absence.
  evidence:
  - reference: DOI:10.1101/gad.296204
    notes: Results and Figure 5 distinguish early versus late anaphase B; Figure 6
      tests Fin1-dependent SIN inhibition. The Discussion contrasts budding-yeast
      inheritance with fission-yeast pole-age-dependent signaling.
  - reference: GO:0071957
    notes: Retained exact identity and synonym; its unqualified source definition
      motivates this local scope clarification.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
