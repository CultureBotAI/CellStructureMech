identifier: GO:0071957
label: old mitotic spindle pole body
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: The spindle pole body that existed before the most recent spindle pole
  body duplication. In unperturbed Schizosaccharomyces pombe mitosis, septation initiation
  network activity becomes restricted to the new pole in late anaphase B, after activity
  at both poles earlier in mitosis.
definition_source: DOI:10.1101/gad.296204
mapping_status: PROPOSED
