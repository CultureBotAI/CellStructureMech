      notes: Ogbadoyi, Robinson and Gull 2003, Results and Figures 2, 3 and 6 identify
        unilateral filaments as the intramitochondrial, kDNA-proximal arm of the TAC.
  - subject: unilateral_filaments
    predicate: form
    object: tripartite_attachment_complex
    description: The unilateral filaments are one of the three structural domains
      of the TAC.
    evidence:
    - reference: DOI:10.1091/mbc.E02-08-0525
      notes: Ogbadoyi, Robinson and Gull 2003 defined the tripartite architecture
        of the basal-body-to-kDNA linkage.
  - subject: tripartite_attachment_complex
    predicate: mediates
    object: kinetoplast_segregation
    description: The complete TAC couples basal-body movements to positioning and
      inheritance of the kinetoplast DNA.
    evidence:
    - reference: DOI:10.1091/mbc.E02-08-0525
      notes: Ogbadoyi, Robinson and Gull 2003 connected the trans-membrane linkage
        to basal-body-driven mitochondrial genome segregation.
    - reference: DOI:10.1371/journal.ppat.1005586
      notes: Trikin et al. 2016 characterized TAC102 as a TAC component in the mitochondrial
        genome segregation machinery.
  - subject: exclusion_zone_filaments
    predicate: form
    object: tripartite_attachment_complex
    description: The cytoplasmic exclusion zone filaments constitute one of the three
      serially connected structural zones of the tripartite attachment complex.
    evidence:
    - reference: DOI:10.1091/mbc.E02-08-0525
      notes: Ogbadoyi et al. 2003 defined the tripartite attachment complex as comprising
        the exclusion zone filaments, differentiated mitochondrial membranes, and
        unilateral filaments.
    - reference: GO:0120121
      notes: GO:0120121 defines the tripartite attachment complex connecting the flagellar
        basal body across the mitochondrial membranes to the kDNA disc.
  - subject: mitochondrial_tac_membranes
    predicate: form
    object: tripartite_attachment_complex
    description: The differentiated outer and inner mitochondrial TAC membranes constitute
      one of the three serially connected structural zones of the tripartite attachment
      complex.
    evidence:
    - reference: DOI:10.1091/mbc.E02-08-0525
      notes: Ogbadoyi et al. 2003 defined the tripartite attachment complex as comprising
        the exclusion zone filaments, differentiated mitochondrial membranes, and
        unilateral filaments.
    - reference: GO:0120121
      notes: GO:0120121 defines the tripartite attachment complex connecting the flagellar
        basal body across the mitochondrial membranes to the kDNA disc.
  - subject: p166
    predicate: contributes to
    object: mitochondrial_tac_membranes
    description: The transmembrane TAC protein p166 anchors in the inner mitochondrial
      membrane within the differentiated TAC membrane zone.
    evidence:
    - reference: DOI:10.1038/sj.emboj.7601956
      notes: Zhao et al. 2008 identified p166 as the first inner-membrane component
        of the Trypanosoma brucei tripartite attachment complex.
  - subject: tac40
    predicate: contributes to
    object: mitochondrial_tac_membranes
    description: The beta-barrel protein TAC40 resides in the outer mitochondrial
      membrane of the differentiated TAC membrane zone.
    evidence:
    - reference: DOI:10.1073/pnas.1404854111
      notes: Schnarwiler et al. 2014 identified TAC40 as an outer mitochondrial membrane
        beta-barrel subunit of the tripartite attachment complex.
  - subject: tac102
    predicate: contributes to
    object: unilateral_filaments
    description: TAC102 forms a core structural component of the intramitochondrial
      unilateral filaments linking the inner membrane to the kDNA disc.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1005586
      notes: Trikin et al. 2016 identified TAC102 as a core structural component of
        the unilateral filaments of the tripartite attachment complex.
