identifier: GO:0120121
label: tripartite attachment complex
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A three-part cytoskeletal structure in kinetoplastid species linking mitochondrial
  DNA organised in a kinetoplast through the mitochondrial membranes to the basal
  body.
definition_source: GO:0120121
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-13T09:41:13Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-13T09:41:59Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added TAC synonymy, cytoskeleton parentage, structural TAC-domain and TAC-protein
    components, Trypanosoma brucei scope, a kinetoplast-segregation function, core
    literature evidence, a nonmechanistic basal-body-to-kDNA bridge graph, and a grounding
    TODO.
  llm_assisted: true
synonyms:
- synonym_text: TAC
  synonym_type: RELATED_SYNONYM
  source: GO:0120121
parent_structures:
- GO:0005856
components:
- component_id: unilateral_filaments
  label: unilateral filaments
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Basal-body-proximal filaments that form the cytoplasmic side of the TAC and
    extend toward the mitochondrial outer membrane.
  evidence:
  - reference: DOI:10.1091/mbc.E02-08-0525
    notes: Ogbadoyi, Robinson and Gull 2003 resolved unilateral filaments as the cytoplasmic
      arm of the structural link between flagellar basal bodies and the kDNA disk.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral ontology term for the unilateral filament
    domain of the kinetoplastid TAC was curated.
- component_id: differentiated_mitochondrial_membrane_regions
  label: differentiated mitochondrial TAC membrane regions
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Specialized mitochondrial outer- and inner-membrane regions crossed by the
    TAC as it links cytoplasmic unilateral filaments to the matrix-facing exclusion-zone
    filaments.
  evidence:
  - reference: DOI:10.1091/mbc.E02-08-0525
    notes: Ogbadoyi, Robinson and Gull 2003 included differentiated mitochondrial
      membranes in the tripartite ultrastructure that spans the organellar envelope.
  - reference: DOI:10.1073/pnas.1404854111
    notes: Schnarwiler et al. 2014 localized TAC40 to the outer mitochondrial membrane
      part of the TAC.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The TAC-specific differentiated membrane zones are curated as structural
    domains because no exact cellular-component CURIE was curated for either membrane
    specialization.
- component_id: exclusion_zone_filaments
  label: exclusion-zone filaments
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Mitochondrial-matrix-side filaments that occupy the exclusion zone between
    the differentiated inner membrane and the kDNA disk.
  evidence:
  - reference: DOI:10.1091/mbc.E02-08-0525
    notes: Ogbadoyi, Robinson and Gull 2003 resolved exclusion-zone filaments as the
      kDNA-proximal arm of the TAC.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for the TAC exclusion-zone filaments
    was curated.
- component_id: p166
  label: p166 TAC protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - p166
  essentiality: UNKNOWN
  role: T. brucei TAC protein that localizes between mitochondrial DNA and the flagellum
    and contributes to kDNA segregation.
  evidence:
  - reference: DOI:10.1038/sj.emboj.7601956
    notes: Zhao et al. 2008 identified p166 as a link between the trypanosome mitochondrial
      DNA network and flagellum.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam, NCBIfam or UniProt family
    accession for kinetoplastid p166 was curated.
- component_id: tac40
  label: TAC40 mitochondrial outer-membrane beta-barrel protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - TAC40
  essentiality: UNKNOWN
  role: Mitochondrial outer-membrane beta-barrel protein positioned in the TAC membrane
    domain and required for mitochondrial genome inheritance in T. brucei.
  evidence:
  - reference: DOI:10.1073/pnas.1404854111
    notes: Schnarwiler et al. 2014 characterized TAC40 as a TAC outer-mitochondrial-membrane
      beta-barrel protein.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam, NCBIfam or UniProt family
    accession for kinetoplastid TAC40 was curated.
- component_id: tac102
  label: TAC102 mitochondrial genome segregation protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - TAC102
  essentiality: UNKNOWN
  role: TAC-localized protein in the mitochondrial matrix that is needed for normal
    TAC biogenesis and kDNA segregation.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1005586
    notes: Trikin et al. 2016 identified TAC102 as a TAC component of the T. brucei
      mitochondrial genome segregation machinery.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam, NCBIfam or UniProt family
    accession for kinetoplastid TAC102 was curated.
taxonomic_distribution:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  presence: COMMON
  note: The TAC has been imaged between the basal bodies and the kinetoplast in the
    single mitochondrion of T. brucei.
  reference: DOI:10.1091/mbc.E02-08-0525
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: Kinetoplastid model in which the TAC was defined ultrastructurally and later
    dissected by p166, TAC40 and TAC102 localization and knockdown studies.
  reference: DOI:10.1371/journal.ppat.1005586
functions:
- function_id: kinetoplast_segregation
  label: basal-body-linked kinetoplast segregation
  description: The TAC physically links the kinetoplast DNA disk to the flagellar
    basal bodies so that basal-body segregation helps position duplicated mitochondrial
    genomes.
  evidence:
  - reference: DOI:10.1091/mbc.E02-08-0525
    notes: Ogbadoyi, Robinson and Gull 2003 described a trans-membrane structural
      linkage responsible for mitochondrial genome positioning and segregation by
      flagellar basal bodies.
  - reference: DOI:10.1038/sj.emboj.7601956
    notes: Zhao et al. 2008 linked p166 depletion to kinetoplast missegregation.
evidence:
- reference: GO:0120121
  notes: Gene Ontology cellular-component term for the tripartite attachment complex.
- reference: DOI:10.1091/mbc.E02-08-0525
  notes: Ogbadoyi, Robinson and Gull 2003, A high-order trans-membrane structural
    linkage is responsible for mitochondrial genome positioning and segregation by
    flagellar basal bodies in trypanosomes, Molecular Biology of the Cell.
- reference: DOI:10.1038/sj.emboj.7601956
  notes: Zhao et al. 2008, p166, a link between the trypanosome mitochondrial DNA
    and flagellum, mediates genome segregation, EMBO Journal.
- reference: DOI:10.1073/pnas.1404854111
  notes: Schnarwiler et al. 2014, Trypanosomal TAC40 constitutes a novel subclass
    of mitochondrial beta-barrel proteins specialized in mitochondrial genome inheritance,
    PNAS.
- reference: DOI:10.1371/journal.ppat.1005586
  notes: Trikin et al. 2016, TAC102 Is a Novel Component of the Mitochondrial Genome
    Segregation Machinery in Trypanosomes, PLOS Pathogens.
