components:
- component_id: unilateral_filaments
  label: unilateral filaments
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Intramitochondrial filaments that connect the differentiated inner mitochondrial
    membrane to the flagellar face of the kDNA disk.
  evidence:
  - reference: DOI:10.1091/mbc.E02-08-0525
    notes: 'Ogbadoyi, Robinson and Gull 2003, Results and Figures 2, 3 and 6: unilateral
      filaments occupy the intramitochondrial gap between the inner membrane and the
      kDNA disk, not the cytoplasmic basal-body side.'
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral ontology term for the unilateral filament
    domain of the kinetoplastid TAC was curated.
- component_id: differentiated_mitochondrial_membrane_regions
  label: differentiated mitochondrial TAC membrane regions
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Specialized mitochondrial outer- and inner-membrane regions crossed by the
    TAC as it links cytoplasmic exclusion-zone filaments to intramitochondrial unilateral
    filaments.
  evidence:
  - reference: DOI:10.1091/mbc.E02-08-0525
    notes: Ogbadoyi, Robinson and Gull 2003 included differentiated mitochondrial
      membranes in the tripartite ultrastructure that spans the organellar envelope.
  - reference: DOI:10.1073/pnas.1404854111
    notes: Schnarwiler et al. 2014 localized TAC40 to the outer mitochondrial membrane
      part of the TAC.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The TAC-specific differentiated membrane zones are curated as structural
    domains because no exact cellular-component CURIE was curated for either membrane
    specialization.
- component_id: exclusion_zone_filaments
  label: exclusion-zone filaments
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Cytoplasmic filaments that link the proximal basal-body region to the differentiated
    outer mitochondrial membrane, occupying a zone depleted of cytoplasmic ribosomes.
  evidence:
  - reference: DOI:10.1091/mbc.E02-08-0525
    notes: 'Ogbadoyi, Robinson and Gull 2003, Results and Figures 2, 3 and 6: exclusion-zone
      filaments connect basal bodies to the outer mitochondrial membrane, not the
      inner membrane to kDNA.'
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for the TAC exclusion-zone filaments
    was curated.
