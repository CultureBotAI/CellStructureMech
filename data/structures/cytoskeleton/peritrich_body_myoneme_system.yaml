discussions:
- discussion_id: identity_and_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate the body network from stalk and other ciliate contractile structures.
  rationale: Continuity and shared proteins do not establish identical subcellular
    boundaries.
  notes: Hidden- and ignored-inclusive whole-repository searches found comparative
    mentions, not an existing body-system record. QuickGO myoneme, myonemal, spasmoneme
    and peritrich queries returned zero hits. OTHER denotes a network, not one filament.
    The label does not assert universal peritrich prevalence or identical fiber arrangements.
    Generic synonyms are broad; no equivalence to Spirostomum fishnet is asserted.
  evidence:
  - reference: https://ilacadofsci.com/wp-content/uploads/2013/03/102-15MS2905-print.pdf
    notes: Body fibers converge into a spatially distinct stalk organelle.
  - reference: DOI:10.1002/jmor.10225
    notes: Names an interconnected system in a second peritrich genus.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: composition_and_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve molecular inventory, exact family groundings and assembly requirements.
  rationale: Antibody localization is not a complete native assembly reconstruction.
  notes: No exact paralogue stoichiometry, single-protein sufficiency or essentiality
    is inferred. Vorticella Sfi1-like partners remain proposed, not entered as constituents.
    Centrin/spasmin membership is not transferred to Campanella without molecular
    evidence.
  evidence:
  - reference: https://ilacadofsci.com/wp-content/uploads/2013/03/102-15MS2905-print.pdf
    notes: The scaffold model was proposed for testing.
  - reference: InterPro:IPR050145
    notes: Broader Centrin/CML-like family; no exact grounding assigned.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: assay_boundaries
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep body localization distinct from stalk immunogold measurements.
  rationale: Different compartments and antibodies cannot supply interchangeable measurements.
  notes: 1F5 recognizes two Western bands, N-termVcCentrin4 one. Body-network labeling
    is light microscopy; the published compartment percentages concern stalk spasmonemes,
    not this body network. No antibody-derived native copy number is asserted.
  evidence:
  - reference: https://ilacadofsci.com/wp-content/uploads/2013/03/102-15MS2905-print.pdf
    notes: Figures 2-3 versus 4-8.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: native_mechanism
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve the native calcium-handling and contraction mechanism.
  rationale: Response to an intervention does not identify the molecular machinery
    that mediates it.
  notes: Calcium-induced calcium release is an interpretation, not a directly identified
    channel. No receptor, pump, ATP-independent recovery or universal kinetics is
    curated. Campanella's proposed skeletal and relaxation roles are not treated as
    tested causal edges.
  evidence:
  - reference: DOI:10.1242/jeb.189.1.163
    notes: Abstract distinguishes observations from the proposed regenerative-release
      mechanism.
  - reference: DOI:10.1002/jmor.10225
    notes: Abstract proposes functions from morphology.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: linkage_complex_lead
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify molecular constituents before separately curating the ER-myoneme
    linkage complex.
  rationale: A recognizable substructure need not have an identified protein inventory.
  notes: Allen describes midpiece, rails and cradle at the ER-myoneme interface. These
    are morphological parts, not named molecular families. Calcium transport and excitation
    transmission were proposed functions. The complex remains a research lead; no
    guessed tether, ATPase or membrane-channel component is added here.
  evidence:
  - reference: DOI:10.1083/jcb.56.2.559
    notes: Conventional TEM; preparation and section geometry limit interpretation.
  posed_by: codex
  posed_date: '2026-10-03'
