identifier: cellstructuremech:peritrich_body_myoneme_system
label: Peritrich body myoneme system
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: An interconnected contractile fiber system in the cell body of peritrich
  ciliates, comprising longitudinal and peristomial fibers. In Vorticella, body myonemes
  converge aborally into the distinct stalk spasmoneme. This record denotes the body
  network, not the stalk organelle, ciliary apparatus or an individual protein.
definition_source: https://ilacadofsci.com/wp-content/uploads/2013/03/102-15MS2905-print.pdf
mapping_status: PROPOSED
