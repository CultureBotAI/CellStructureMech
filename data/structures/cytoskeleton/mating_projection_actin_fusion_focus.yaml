  title: Fus1-nucleated actin asters concentrate hydrolase delivery for wall dissolution
  description: During Schizosaccharomyces pombe mating, Fus1 nucleates actin filaments
    at the projection tip and the resulting actin fusion focus works with type V myosins
    to concentrate hydrolases at the cell-fusion site.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph summarizes the Fus1, actin-focus, type V myosin, and hydrolase
    relationships without asserting a complete timed transport pathway or a full inventory
    of fusion-focus proteins.
