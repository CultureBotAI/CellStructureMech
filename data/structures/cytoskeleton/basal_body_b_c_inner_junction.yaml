- timestamp: '2026-10-04T10:49:33Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-10-04T10:52:29Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added region-bounded B-C junction components, two species examples, proximal
    structural contacts, verified EMDB datasets and density preview. Preserved unassigned
    core/WD40 identities, model-fitting limits, strain provenance, cross-species uncertainty
    and conflicting reported repeat/dataset labels.
  llm_assisted: true
