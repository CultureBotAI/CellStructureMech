components:
- component_id: poc1
  label: POC1 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The live POC1 family search returns IPR050505, combining WDR55
    and POC1; IPR020472 is a WD40 repeat. Neither denotes this exact class. Native
    UniProt Q229Z6 is a reviewed POC1 reference from SB210, not a strain-paired example
    for the structural experiments. Its domain and repeat annotations are not promoted
    to a whole-protein family.
  gene_symbols:
  - POC1
  essentiality: UNKNOWN
  role: Its N-terminal WD40 domain bridges B08 and C10 in the proximal Tetrahymena
    junction. The C-terminal region continues into the neighboring A-C linker. This
    membership is not assigned to the compositionally distinct core B-C junction.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
    notes: Figure 2D-F combines predicted-model fitting with loss of the corresponding
      WD40 density in complete-triplet subclasses of poc1 deletion material. Figure
      S4B-D distinguishes the core junction, whose bridging density remains without
      Poc1.
  - reference: DOI:10.1126/sciadv.ady3689
    notes: Figure 4A-B and Results trace the POC1 C-link helix to its N-terminal B08/C10
      bridge. This establishes shared participation in connected modules, not identity
      of the B-C junction and A-C linker.
- component_id: inner_junction_ladder_protein
  label: alpha-helical inner-junction ladder protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The source assigns I7LY02, an unreviewed SB210 reference at TTHERM_00682980.
    UniProt lists no InterPro or Pfam cross-reference and the native integrated InterPro
    endpoint returned HTTP 204. No exact source-neutral family is asserted. The PDB
    entity's SWIM-type name is not a verified family or activity. Cai's structural
    isolation uses SB715, so no strain-paired protein example is added.
  essentiality: UNKNOWN
  role: Forms an alpha-helical ladder connecting B07 and C10 in the proximal Tetrahymena
    B-C junction. It is distinct from the additional unassigned WD40 density between
    successive POC1 molecules.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
    notes: Figure 4A-C and Results assign the ladder using an MS-derived library of
      predicted models and density fitting. RCSB 9QZC entity 8 maps the study's ladder
      model to I7LY02. This is not an I7LY02 knockout, biochemical binding assay or
      essentiality test.
canonical_examples:
- taxon_id: NCBITaxon:5911
  taxon_label: Tetrahymena thermophila
  note: Cryo-ET of isolated basal bodies resolves different proximal and core B-C
    networks, with wild-type and poc1-deletion comparisons. Methods list B2086 and
    SB1969 backgrounds; this is a species-level example, not a pairing with SB210
    reference sequences.
  reference: DOI:10.1083/jcb.202311104
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Cryo-ET of nucleo-flagellar apparatus from cc849, cw10 mt-, resolves a B-C
    junction network. The main average combines proximal mother-basal-body segments
    and attached procentrioles; separate averages reveal maturity-related differences.
    MIP9-11 are density labels, not verified equivalents of the Tetrahymena molecular
    assignments.
  reference: DOI:10.7554/eLife.43434
functions:
- function_id: luminal_b_c_connection
  label: luminal B-C tubule connection
  description: Connects the B- and C-tubules along the lumen-facing triplet interface.
    The Tetrahymena core junction also provides an interface for attachment of the
    separate inner scaffold.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
    notes: Figure 2D and Figure S4B-D show proximal and core bridging networks and
      distinguish the core junction from its scaffold attachment. This structural
      function is not a measured force threshold or a junction-specific explanation
      of all poc1 mutant defects.
  - reference: DOI:10.7554/eLife.43434
    notes: Results and Figure 2C describe a network of MIP densities at the Chlamydomonas
      B-C inner junction without assigning their gene products.
