identifier: cellstructuremech:basal_body_b_c_inner_junction
label: basal body B-C inner junction
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A proteinaceous junction network at the lumen-facing interface between
  the B- and C-tubules of a basal-body triplet microtubule, connecting the two tubules
  with region-dependent composition.
definition_source: DOI:10.1083/jcb.202311104
mapping_status: PROPOSED
