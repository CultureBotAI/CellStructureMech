evidence:
- reference: DOI:10.1083/jcb.202311104
  notes: Ruehle et al. 2024. Official PMC11094743.1 JATS checksum verified; proximal/core
    and mutant Results, relevant Discussion, Methods and captions inspected. Figures
    2 and S4 visually checked. Molecular fitting and perturbation evidence are distinguished;
    no verbatim snippets are asserted.
- reference: DOI:10.1126/sciadv.ady3689
  notes: Cai et al. 2025. Official PMC12506977.1 JATS checksum verified; junction
    Results, relevant isolation/model-building Methods and data availability read,
    and Figure 4 visually inspected. Structural isolation uses SB715; model assignments
    are MS-guided predicted-model fits.
- reference: DOI:10.7554/eLife.43434
  notes: Li et al. 2019. Official PMC6384029.1 JATS checksum verified; relevant architecture,
    MIP and assembly Results, Methods and MIP9 author response read. Figure 2 and
    its supplement 12 visually checked. Main averages combine mother-basal-body proximal
    segments with attached procentrioles.
- reference: DOI:10.1038/s44318-025-00392-6
  notes: Li et al. 2025 provides the earlier unassigned inner-ladder observation and
    an explicitly retained B-C dataset-label conflict. It is not the source for the
    later I7LY02 molecular assignment.
discussions:
- discussion_id: identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the B-C inner junction from connected basal-body modules.
  rationale: This is a named proteinaceous junction network within a triplet, not
    one protein.
  notes: Hidden- and ignored-inclusive label, synonym, slug and citation searches
    found only adjacent records and provenance, not this identity. Complete inner-junction
    and triplet GO searches, and all cellular-component candidates from the basal-body
    search, found no exact B-C term. GO:0160113 denotes an axonemal doublet A-B junction,
    not this structure. The outer B-C junction, A-B inner junction, intertriplet A-C
    linker, inner scaffold and whole triplet are distinct. GO:0140535 is broader is-a;
    GO:0036064 is parthood.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  - reference: DOI:10.7554/eLife.43434
  - reference: GO:0160113
  - reference: GO:0140535
  - reference: GO:0036064
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: exact_family_groundings
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact POC1 and alpha-helical inner-junction ladder family groundings.
  rationale: A repeat, domain or combined family does not denote an exact component
    class.
  notes: Both components remain REVIEWED_LABEL_ONLY for the documented reasons. POC1
    Q229Z6 is a reviewed SB210 reference; I7LY02 is unreviewed. Neither is paired
    to B2086, SB1969 or SB715 as an experimental protein example. The paper's limited
    detectable I7LY02 homology outside Ciliophora is not evidence that the structure
    is absent in other taxa.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: regional_and_unassigned_composition
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify the additional proximal WD40 protein and the core B-C bridging
    proteins.
  rationale: The named proximal classes are not a complete or universal junction composition.
  notes: Cai et al. leave the WD40 density between POC1 copies unassigned; TBC1D31A
    is only a hypothesis based on proximity and is not added as a component. Ruehle
    et al. find a distinct bulky core junction without POC1-like density; its bridge
    persists in complete poc1-deletion triplets even when the separate scaffold attachment
    is lost. Proximal I7LY02 placement is not transferred to these core densities.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: later_ladder_assignment
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Reconcile the earlier unassigned ladder with newer molecular evidence.
  rationale: Molecular uncertainty must follow the source chronology.
  notes: Li et al. 2025 left the proximal B-C ladder identity open. Cai et al. later
    assigned I7LY02 by MS-guided model fitting, represented here with that qualification.
    The same paper assigns a separate I7LY02 array at the A-B junction; sharing a
    protein does not merge the two junction records.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: chlamydomonas_density_identities
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve Chlamydomonas MIP9-11 identities and reconcile the reported MIP9
    repeat.
  rationale: Density labels and geometric similarity are not cross-species protein
    identities.
  notes: Li et al. 2019 assign MIP9 as likely non-tubulin because a canonical protofilament
    model deviates from its density; the author response and Figure 2 supplement 12
    do not identify a gene product. MIP9-11 are not equated to Tetrahymena POC1 or
    I7LY02. Results describe a 4-nm MIP9 periodicity, while Table 1 lists 8 nm; no
    repeat measurement is asserted here pending reconciliation. Proximal mother-basal-body
    and procentriole averages differ, so the pooled map is not immature-only or a
    universal architecture.
  evidence:
  - reference: DOI:10.7554/eLife.43434
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: exclude_neighboring_components
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep neighboring linkers, scaffolds and axonemal proteins outside junction
    composition.
  rationale: A composite map includes material beyond the curated structural boundary.
  notes: Tubulins are bridged substrates here, not extra junction families. Fam161A/Poc16
    core localization is not a molecular assignment to the B-C bridge. TBC1D31-like
    A-C-linker proteins and axonemal FAP/PACRG assemblies are not imported merely
    because they are adjacent or occupy similar sites. POC1 is included specifically
    for its directly supported proximal B-C membership.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: mechanical_and_assembly_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Avoid converting heterogeneous static reconstructions into a temporal assembly
    mechanism.
  rationale: Poc1 loss affects multiple structures and specimen isolation can destabilize
    triplets.
  notes: Complete-triplet mutant subclasses support local density comparisons, not
    uniform absence of the entire junction. Percentages of subtomogram classes are
    not organism prevalence. The 2019 assembly model and 2024 disassembly interpretation
    derive from static classes, with preparation-induced lability acknowledged. No
    junction-specific force threshold, whole-junction stoichiometry, broad taxonomic
    distribution or assembly essentiality is asserted. Reconstruction window lengths
    and map resolutions are not biological dimensions.
  evidence:
  - reference: DOI:10.1083/jcb.202311104
  - reference: DOI:10.7554/eLife.43434
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: dataset_label_conflict
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Handle the conflicting regional label for EMD-46438 without silently choosing
    one.
  rationale: Native archive titles and article tables do not always agree.
  notes: Li et al. 2025 Table 2 calls EMD-46438 core B-C, whereas native EMDB metadata
    says proximal B-C; the Methods also state that B-C junctions were excluded from
    the detailed study. This record instead links independently verified, region-consistent
    2024 and Cai 2025 reconstructions. The conflict is retained rather than asserted
    to be resolved biologically.
  evidence:
  - reference: DOI:10.1038/s44318-025-00392-6
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
