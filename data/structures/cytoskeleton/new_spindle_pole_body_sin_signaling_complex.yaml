discussions:
- discussion_id: new_spb_sin_complex_boundary
  prompt: Keep the new spindle pole body SIN signaling complex as the narrower fission-yeast
    anaphase GO child rather than the broad SIN/MEN complex or old-SPB interphase
    SIN state.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0160067 is an is-a child of the broader GO:0160065 SIN/MEN signaling
    complex and is defined by the new-SPB anaphase SIN state with activated GTP-bound
    Spg1. It is distinct from GO:0160066, the old-SPB interphase SIN signaling complex,
    and from GO:1990334, the narrower two-component GAP complex. No part_of link to
    the new mitotic SPB is asserted here because GO:0160067 says the complex is associated
    with that SPB rather than declaring a proper-parthood relation.
  resolution_note: Curated GO:0160067 as an exact record with GO:0160065 parentage
    and left new-SPB localization as evidence-backed scope rather than as a parthood
    edge.
  evidence:
  - reference: GO:0160067
    notes: GO:0160067 identifies the new spindle pole body SIN signaling complex.
  - reference: GO:0160066
    notes: GO:0160066 identifies the sibling interphase SIN signaling complex.
  - reference: GO:1990334
    notes: GO:1990334 identifies the SIN/MEN two-component GAP complex.
