identifier: GO:0160110
label: axonemal microtubule doublet inner sheath
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A structural network of microtubule inner proteins located inside the
  lumens of the A and B tubules of the axonemal microtubule doublet that helps stabilize
  the doublet microtubule.
