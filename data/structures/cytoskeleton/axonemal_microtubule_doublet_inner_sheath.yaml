components:
- component_id: inner_sheath_mips
  label: inner-sheath microtubule inner proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Globular and filamentous luminal MIPs that build the axonemal doublet inner
    sheath along A- and B-tubule protofilaments.
  evidence:
  - reference: GO:0160110
    notes: GO defines the axonemal microtubule doublet inner sheath as a structural
      network of MIPs in the A- and B-tubule lumens.
  - reference: DOI:10.1038/ncomms15035
    notes: Ichikawa et al. 2017 resolved globular and filamentous MIP densities inside
      Tetrahymena axonemal doublet microtubules.
  - reference: DOI:10.1016/j.cell.2019.09.030
    notes: Ma et al. 2019 resolved interconnected MIP networks in native Chlamydomonas
      axonemal doublets.
