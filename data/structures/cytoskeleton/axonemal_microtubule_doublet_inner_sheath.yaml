functions:
- function_id: doublet_microtubule_stabilization
  label: doublet microtubule stabilization
  description: Inner-sheath MIPs bind the luminal surfaces of axonemal doublets and
    help stabilize A- and B-tubule protofilament lattices against bending stress.
  evidence:
  - reference: GO:0160110
    notes: GO defines the inner sheath as an A/B-tubule MIP network that helps stabilize
      the doublet microtubule.
  - reference: DOI:10.1038/s41467-019-09051-x
    notes: Owa et al. 2019 found that Chlamydomonas FAP45 and FAP52 are B-tubule luminal
      MIPs whose loss destabilizes axonemal doublet B tubules.
evidence:
