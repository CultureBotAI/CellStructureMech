  reference: DOI:10.1074/jbc.RA120.014237
functions:
- function_id: hook_faz_flanking
  label: hook-complex and FAZ filament flanking
  description: The ciliary centrin arm flanks the flagellum attachment zone filament
    and the microtubule quartet in the T. brucei flagellar pocket-associated cytoskeleton.
  evidence:
  - reference: GO:0120269
    notes: The GO definition places the ciliary centrin arm beside the FAZ filament
      and quartet microtubules.
  - reference: DOI:10.3390/cells4040726
    notes: Morriswood 2015 reviewed the hook complex as a Centrin4-positive arm of
      the trypanosome bilobe.
- function_id: flagellum_inheritance_support
  label: flagellum inheritance support
  description: Hook-complex integrity and ciliary centrin arm assembly support flagellum
    inheritance in T. brucei.
  evidence:
  - reference: DOI:10.1074/jbc.RA120.014237
    notes: Pham et al. 2020 connected maintenance of hook-complex integrity and centrin
      arm assembly to flagellum inheritance in T. brucei.
evidence:
- reference: DOI:10.3390/cells4040726
  notes: Morriswood 2015, Form, Fabric, and Function of a Flagellum-Associated Cytoskeletal
