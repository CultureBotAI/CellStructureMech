  presence: COMMON
  note: The ciliary centrin arm has been studied as a Centrin4-positive arm of the
    trypanosome hook complex that neighbors the microtubule quartet and FAZ filament.
  reference: DOI:10.1242/jcs.230581
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
