discussions:
- discussion_id: septin_filament_array_boundary
  prompt: Keep the generic septin filament array distinct from prospore and chlamydospore
    septin filament array subtypes.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0032160 denotes the generic array of septin filaments or bars. GO:0032165
    and GO:0032166 are exact child terms for prospore- and chlamydospore-localized
    arrays, whereas GO:0005940, GO:0032173, and GO:0032159 model ring-shaped, collar-shaped,
    and cap-shaped higher-order septin structures.
  resolution_note: Curated GO:0032160 as the broader septin-filament-array class and
    left its child prospore and chlamydospore array terms for separate localized records.
  evidence:
  - reference: GO:0032160
    notes: GO:0032160 identifies the generic septin filament array.
  - reference: GO:0032165
    notes: GO:0032165 identifies the prospore septin filament array child structure.
  - reference: GO:0032166
    notes: GO:0032166 identifies the chlamydospore septin filament array child structure.
  - reference: GO:0005940
    notes: GO:0005940 identifies the septin ring.
  - reference: GO:0032173
    notes: GO:0032173 identifies the septin collar.
  - reference: GO:0032159
    notes: GO:0032159 identifies the septin cap.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
