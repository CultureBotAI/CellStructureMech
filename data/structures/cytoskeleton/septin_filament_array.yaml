identifier: GO:0032160
label: septin filament array
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: Arrays of septin filaments, or bars, found in a series of filamentous
  structures. Such structures have been observed in the prospore membrane during spore
  formation in S. cerevisiae and in the chlamydospore membrane during chlamydospore
  formation in C. albicans.
