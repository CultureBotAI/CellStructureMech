  reference: DOI:10.1371/journal.pbio.1001213
evidence:
- reference: DOI:10.1073/pnas.012516899
  notes: Jenkins, Samudrala, Anderson, Hedlund and Petroni 2002, 'Genes for the cytoskeletal
    protein tubulin in the bacterial genus Prosthecobacter', PNAS.
- reference: DOI:10.1371/journal.pbio.1001213
  notes: 'Pilhofer, Ladinsky, McDowall, Petroni and Jensen 2011, ''Microtubules in
