- reference: DOI:10.1038/srep45668
  notes: Akendengue et al. 2017, 'Bacterial Kinesin Light Chain (Bklc) Links the Btub
    Cytoskeleton to Membranes', Scientific Reports.
causal_graphs:
- graph_id: btubabc_microtubule_assembly
  title: BtubA/B subunits form a bacterial microtubule
  description: BtubA and BtubB co-assemble into tubulin-like microtubules, and BtubC
    binds the BtubAB polymer exterior as stabilizing associated machinery.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph records BtubA/B tube co-assembly and BtubC polymer binding
    without asserting a complete Prosthecobacter assembly pathway, a native BtubC
    requirement for tube formation, an in vivo membrane-tethering edge or a physiological
    output for the Btub cytoskeleton.
