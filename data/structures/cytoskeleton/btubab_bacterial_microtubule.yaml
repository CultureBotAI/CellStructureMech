discussions:
- discussion_id: resolve_btub_family_grounding
  prompt: Resolve exact source-neutral grounding for Prosthecobacter BtubA and BtubB
    bacterial tubulins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#btuba
  - components#btubb
  rationale: This first record curates bacterial tubulins from BtubAB-forming Prosthecobacter
    without asserting that a broad FtsZ/tubulin-family GTPase domain or eukaryotic
    tubulin-family accession exactly denotes full-length BtubA/B microtubule subunits.
  evidence:
  - reference: DOI:10.1371/journal.pbio.1001213
    notes: Pilhofer et al. 2011 placed BtubA and BtubB in the FtsZ/tubulin superfamily
      while distinguishing them from FtsZ, FtsZ-like proteins and TubZ.
  posed_by: codex
  posed_date: '2026-09-11'
- discussion_id: resolve_btubc_family_grounding
  prompt: Resolve exact source-neutral grounding for BtubC/Bklc proteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#btubc
  rationale: This first record curates BtubC as membrane-linking associated machinery
    for BtubAB bacterial microtubules without asserting that a tetratricopeptide-repeat
    or kinesin-light-chain-like domain accession exactly denotes this Prosthecobacter
    protein class.
  evidence:
  - reference: DOI:10.1038/srep45668
    notes: Akendengue et al. 2017 characterized Bklc/BtubC as a TPR-domain protein
      associated with the Btub cytoskeleton.
  posed_by: codex
  posed_date: '2026-09-11'
- discussion_id: btubc_not_a_tubulin_subunit
  prompt: BtubC is associated Btub cytoskeleton machinery rather than an alternating
    bacterial tubulin subunit.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#btubc
  rationale: BtubC decorates the outside of the BtubAB mini-microtubule and links
    Btub cytoskeletal filaments to membranes; BtubA and BtubB are the tubulin homologs
    that make the alternating protofilament polymer.
  evidence:
  - reference: DOI:10.1073/pnas.1705062114
    notes: Deng et al. 2017 resolved BtubC binding along the outside of a BtubAB polymer.
  - reference: DOI:10.1038/srep45668
    notes: Akendengue et al. 2017 tested Bklc/BtubC as a BtubAB microtubule-associated
      and membrane-linking factor.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
- discussion_id: keep_btubc_essentiality_unknown
  prompt: BtubC essentiality is left unknown instead of dispensable for native Prosthecobacter
    BtubAB microtubules.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#btubc
  rationale: Purified BtubA/B can form tubes without BtubC, supporting BtubC as an
    associated factor rather than an alternating tubulin constituent, but the first
    record does not cite a native Prosthecobacter loss-of-BtubC assembly assay.
  evidence:
  - reference: DOI:10.1371/journal.pbio.1001213
    notes: Pilhofer et al. 2011 reconstituted BtubA/B tubes with bacterial tubulin
      subunits.
  - reference: https://github.com/CultureBotAI/CellStructureMech/issues/476
    notes: PR review flagged that in vitro BtubA/B assembly does not establish native
      BtubC dispensability.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
- discussion_id: exclude_btubc_membrane_edge_from_assembly_graph
  prompt: BtubC in vitro membrane-linking activity is not modeled as a native bacterial-membrane
    assembly edge.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#btubabc_microtubule_assembly
  rationale: Bklc/BtubC links BtubAB filaments with membranes in vitro, but the assembly
    graph only keeps directly structure-scoped BtubA/B polymerization and BtubC binding
    to the BtubAB polymer.
  evidence:
  - reference: DOI:10.1038/srep45668
    notes: Akendengue et al. 2017 characterized Bklc/BtubC as a Btub-associated and
      membrane-linking factor.
  - reference: https://github.com/CultureBotAI/CellStructureMech/issues/477
    notes: PR review flagged that the graph should not turn the in vitro membrane-linking
      assay into a native bacterial-membrane event.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
