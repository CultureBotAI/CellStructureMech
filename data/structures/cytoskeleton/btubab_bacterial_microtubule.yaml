- timestamp: '2026-09-11T12:04:54Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added cytoskeleton parentage, bacterial microtubule synonymy, BtubA/B and
    BtubC component curation, Prosthecobacter vanneervenii scope, DOI evidence, a
    nonmechanistic BtubABC assembly graph, Btub family and BtubC grounding TODOs,
    and a BtubC boundary discussion.
  llm_assisted: true
- timestamp: '2026-09-11T12:13:20Z'
  curator: codex
  action: REVIEW_FIX
  changes: 'Addressed PR review issues #476 and #477 by changing BtubC essentiality
    to UNKNOWN, removing the in vitro membrane-linking edge from the assembly graph,
    and adding resolved boundary discussions.'
  llm_assisted: true
