identifier: cellstructuremech:btubab_bacterial_microtubule
label: BtubAB bacterial microtubule
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A bacterial cytoskeletal microtubule assembled from BtubA and BtubB tubulin
  homologs that form tube-like filaments in Prosthecobacter cells and in purified
  BtubA/B reactions.
definition_source: DOI:10.1371/journal.pbio.1001213
mapping_status: PROPOSED
