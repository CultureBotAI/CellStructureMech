components:
- component_id: btuba
  label: BtubA
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - btubA
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for full-length bacterial tubulin
    A proteins from BtubAB-forming Prosthecobacter lineages was verified in this pass.
  role: Bacterial tubulin subunit that co-assembles with BtubB into the BtubAB microtubule
    protofilaments.
  evidence:
  - reference: DOI:10.1073/pnas.012516899
    notes: Jenkins et al. 2002 identified bacterial tubulin A among the tubulin-like
      proteins encoded by Prosthecobacter.
  - reference: DOI:10.1371/journal.pbio.1001213
    notes: Pilhofer et al. 2011 imaged BtubA/B tubes in Prosthecobacter and in recombinant
      or purified BtubA/B assembly reactions.
  - reference: DOI:10.1073/pnas.1705062114
    notes: Deng et al. 2017 resolved purified BtubABC mini-microtubules and modeled
      BtubA as one alternating tubulin subunit in the polymer.
- component_id: btubb
  label: BtubB
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - btubB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for full-length bacterial tubulin
    B proteins from BtubAB-forming Prosthecobacter lineages was verified in this pass.
  role: Bacterial tubulin subunit that co-assembles with BtubA into the BtubAB microtubule
    protofilaments.
  evidence:
  - reference: DOI:10.1073/pnas.012516899
    notes: Jenkins et al. 2002 identified bacterial tubulin B among the tubulin-like
      proteins encoded by Prosthecobacter.
  - reference: DOI:10.1371/journal.pbio.1001213
    notes: Pilhofer et al. 2011 localized BtubA and BtubB proteins to Prosthecobacter
      tube-like structures and reconstituted BtubA/B tube assembly.
  - reference: DOI:10.1073/pnas.1705062114
    notes: Deng et al. 2017 resolved purified BtubABC mini-microtubules and modeled
      BtubB as one alternating tubulin subunit in the polymer.
- component_id: btubc
  label: BtubC
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - btubC
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for full-length BtubC or bacterial
    kinesin light chain proteins was verified in this pass.
  role: Bacterial kinesin-light-chain-like protein that binds along BtubAB microtubules;
    purified BtubABC and membrane-linking assays support polymer decoration and in
    vitro membrane association.
  evidence:
  - reference: DOI:10.1073/pnas.1705062114
    notes: Deng et al. 2017 resolved BtubC decorating the exterior of purified BtubABC
      mini-microtubules.
  - reference: DOI:10.1038/srep45668
    notes: Akendengue et al. 2017 reported that Bklc/BtubC co-localizes with the bacterial
      tubulin cytoskeleton and links Btub filaments to membranes in vitro.
