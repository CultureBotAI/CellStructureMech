causal_graphs:
- graph_id: meiotic_nuclear_membrane_microtubule_tethering_complex_mechanism
  title: Meiotic nuclear membrane microtubule tethering and horsetail nuclear oscillation
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: S. pombe meiotic-prophase radial-array organization. Hrs1-dependent
    rMTOC assembly is upstream organizing context, not an assertion that the whole
    center or SPB is an array constituent. Tomography, immunolocalization and deletion
    phenotypes support minus-end organization; a purified Hrs1 bridge, nucleation
    sufficiency and universal microtubule counts are not established.
  description: Bqt1–Bqt2 and the Sad1–Kms1 nuclear envelope bridge form the meiotic
    nuclear membrane microtubule tethering complex, coupling telomeres and the spindle
    pole body to Hrs1-stabilized astral microtubules and cortically anchored dynein.
