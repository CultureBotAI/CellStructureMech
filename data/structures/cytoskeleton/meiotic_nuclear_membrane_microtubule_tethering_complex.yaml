identifier: GO:0034993
label: meiotic nuclear membrane microtubule tethering complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A nuclear membrane protein complex which connects the nuclear outer and
  inner membranes together, and links links the nuclear lumen to cytoplasmic microtubules
  during meiosis. A specialized nuclear-envelope-spanning multiprotein tethering complex
  assembled during meiotic prophase in fission yeast (Schizosaccharomyces pombe) and
  related fungi that links clustered meiotic telomeres (via Bqt1–Bqt2) through the
  inner nuclear membrane SUN protein Sad1 and outer nuclear membrane KASH protein
  Kms1 to cytoplasmic dynein (Dhc1) and the hrs1/mcp6-organized horsetail microtubule
  array.
