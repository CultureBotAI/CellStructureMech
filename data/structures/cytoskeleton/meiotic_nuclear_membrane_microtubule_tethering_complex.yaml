  note: Characterized model system for meiotic nuclear membrane microtubule tethering
    complex (GO:0034993) in the meiotic nuclear membrane microtubule tethering complex.
    Meiotic-prophase arrays studied in homothallic cells, including endogenously tagged
    Hrs1 and mCherry-Atb2 strain KT2901 for Figure 4A, and separately in synchronized
    pat1 mat-Pc diploids for ultrastructure. No fungal-wide prevalence or identity
