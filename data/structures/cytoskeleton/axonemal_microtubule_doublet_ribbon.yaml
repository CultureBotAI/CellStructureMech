functions:
- function_id: a_tubule_ribbon_stabilization
  label: A-tubule ribbon stabilization
  description: The A11-A13 protofilament ribbon and its associated MIPs form a stable
    axonemal doublet substructure that separates the A- and B-tubule lumens.
  evidence:
  - reference: GO:0160115
    notes: GO defines the ribbon by A11-A13 protofilaments and associated MIPs that
      stabilize those protofilaments within the axonemal doublet.
  - reference: DOI:10.1242/jcs.20.2.405
    notes: Linck 1976 found that flagellar doublet extraction leaves stable ribbons
      of three protofilaments with 16-nm axial repeats.
evidence:
- reference: GO:0160115
  notes: Gene Ontology cellular-component term for the axonemal doublet ribbon.
- reference: GO:0097545
  notes: GO places the axonemal microtubule doublet ribbon within the axonemal doublet
    microtubule.
- reference: DOI:10.1242/jcs.20.2.405
  notes: 'Linck 1976, ''Flagellar doublet microtubules: fractionation of minor components
    and alpha-tubulin from specific regions of the A-tubule'', Journal of Cell Science.'
- reference: DOI:10.1074/jbc.M210751200
  notes: Ikeda et al. 2003, 'Rib72, a conserved protein associated with the ribbon
    compartment of flagellar A-microtubules and potentially involved in the linkage
    between outer doublet microtubules', Journal of Biological Chemistry.
- reference: DOI:10.1002/bies.201700209
  notes: 'Ichikawa and Bui 2018, ''Microtubule Inner Proteins: A Meshwork of Luminal
    Proteins Stabilizing the Doublet Microtubule'', BioEssays.'
