discussions:
- discussion_id: identity_and_ontology_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the named spool assembly from tubulin proteins and broader cytoskeletal
    structures.
  rationale: A shape-bearing subcellular structure requires its own identity without
    promoting a broader ontology class or a hypothetical homology to equivalence.
  notes: Hidden- and ignored-inclusive repository searches for labels, aliases, DOI,
    PMID and preprint DOI found no existing spool record. QuickGO spool search returned
    zero terms. Generic tubulin and microtubule hits do not denote this assembly.
    GO:0005622 is the broad parent; microtubule cytoskeleton is a part_of relation.
    OTHER kind avoids claiming a resolved single-filament lattice or bundle topology.
    Tubulin ring is not an exact synonym for all ring-shaped tubulin structures. The
    membrane nuclear net, cortical array, flagellar apparatus and apical centrin ring
    are not asserted to be this entity. No desmose equivalence or parthood is asserted.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Figure 2D-E names the tubulin or microtubule spools; desmose association
      is speculative.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: molecular_and_topological_resolution
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve the spool's filament topology, tubulin subtype composition and assembly
    mechanism.
  rationale: Immunolocalization and an apparent connection cannot establish the complete
    lattice, gene inventory or assembly dependencies.
  notes: The authors describe an apparent extension from a single microtubule. This
    is not treated as a counted one-microtubule stoichiometry, closed ring topology,
    standard protofilament number or direct reconstruction of a complete molecular
    lattice. Tubulin-family grounding is not a claim that every family member is present.
    No gene-specific accession, subunit count or causal assembly graph is asserted.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Microtubule-array Results and Figure 2D-E establish morphology and tubulin
      labeling.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: neighboring_signals_not_spool_components
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep neighboring cortical centrin, DNA and flagellar modification signals
    separate from spool composition.
  rationale: A multi-channel or multi-panel view does not make every labeled material
    a constituent of the highlighted structure.
  notes: DNA supplies nuclear context, not a demonstrated spool constituent. Cortical
    centrin is described separately and is not assigned to the spool merely because
    it appears in the same cells or video. Figure 2F-G examines flagellar and cortical
    tubulin modifications; it does not establish a spool-specific modification inventory.
    The structure is not assigned centrin, DNA, flagellar proteins or modifying enzymes
    on that basis. This is an evidence boundary, not a claim of biological absence.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: The microtubule and centrin Results and Figure 2 separate these structures
      and signals.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: functional_and_taxonomic_limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Establish physiological function, cell-cycle dynamics and taxonomic prevalence
    with targeted tests.
  rationale: A fixed-cell survey and a hypothesis about neighboring structures do
    not demonstrate force transmission, swimming performance or division requirements.
  notes: The survey reports spools among sampled Kareniaceae, including Karenia, Karlodinium
    and Takayama. This is not universal family prevalence or an absence claim for
    unsampled or insufficiently labeled taxa. Mechanical reinforcement, high-shear
    swimming, nuclear-envelope dynamics and desmose-mediated basal-body linkage remain
    hypotheses. No asserted function, associated trait, essentiality, universal two-spool
    count or causal graph is inferred from them.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Dinoflagellate survey and Discussion explicitly propose future time-course
      experiments to clarify spool formation and function.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: expansion_scale_and_image_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile expansion-factor handling before asserting native-cell dimensions
    from the figure.
  rationale: Conflicting scale statements must not be silently converted into a precise
    biological measurement.
  notes: Figure 2's legend describes 5 micrometre scale bars adjusted for expansion,
    whereas Image analysis Methods says scale bars are not adjusted. Figure 2E reports
    perinuclear and posterior diameter summaries for measured spools, not universal
    dimensions. No physical_properties or scale-derived measurements are asserted.
    The hosted publisher Figure 2 is unmodified; D-E are the spool panels, while other
    panels contain other structures or taxa. It is fixed-cell expansion fluorescence,
    not live imaging, electron microscopy or a direct native-size image.
  evidence:
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Figure 2 legend and STAR Methods, Image analysis, were read together; the
      scale-bar discrepancy remains unresolved.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: sample_identity_and_metadata_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Interpret combined culture identifiers using specimen annotations rather
    than filenames alone.
  rationale: Co-embedded cultures are not synonyms or proof that both organisms possess
    the structure.
  notes: Table S1 identifies rcc3511rcc10719 volumes as Takayama helix RCC10719 with
    two species in the gel, while row 1384 identifies a one-species RCC10719 volume
    with spool presence. RCC3511 is separately listed as Biecheleriopsis adriatica
    in the key resources. The combined filename therefore does not establish strain
    equivalence or spool occurrence in Biecheleriopsis. The caption identifies Figure
    2D-E as Takayama helix; an exact raw-volume-to-panel mapping was not established.
  evidence:
  - reference: https://www.dudinlab.com/s/Table-S1.xlsx
    notes: Dataset Annotation rows 1375-1376 and 1384 distinguish culture, species
      count per gel and spool annotation.
  - reference: DOI:10.1016/j.cell.2025.09.027
    notes: Key resources and Figure 2D-E provide the separate strain and panel identities.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
