identifier: cellstructuremech:tubulin_spool
label: tubulin spool
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A compact spool-like tubulin-positive cytoskeletal structure observed
  in kareniacean dinoflagellates. In Takayama helix, ultrastructure expansion microscopy
  resolves perinuclear and posterior spools that appear continuous with microtubules.
  The name denotes the assembled structure, not a tubulin protein or the entire cortical
  microtubule array.
definition_source: DOI:10.1016/j.cell.2025.09.027
