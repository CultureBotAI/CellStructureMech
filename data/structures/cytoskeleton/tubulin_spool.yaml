evidence:
- reference: DOI:10.1016/j.cell.2025.09.027
  notes: Mikus et al. (2025), Charting the landscape of cytoskeletal diversity in
    microbial eukaryotes, Cell. Read the primary microtubule-array Results, dinoflagellate
    survey, Discussion, Figure 2 and 6 legends, key resources, fixation, U-ExM, microscopy
    and image-analysis Methods in the public article PDF. Spool identity and location
    are observations; desmose association and physiological roles remain proposals.
- reference: https://www.dudinlab.com/s/Table-S1.xlsx
  notes: Author-linked Table S1 read directly. List of Species A46:K46 identifies
    RCC10719 as Takayama helix with successful expansion and staining. Dataset Annotation
    D1384:V1384 identifies the spool-positive interphase volume rcc10719_pfa_dna-tub-nhs_20230802_od_s00,
    culture code P22-120, E7Ab and one species in the gel. These are image annotations,
    not independent-cell counts or a population-prevalence estimate.
- reference: GO:0005622
  notes: Verified non-obsolete intracellular anatomical structure, used as a broad
    is-a parent without asserting a particular microtubule lattice or membrane boundary.
- reference: GO:0015630
  notes: Verified non-obsolete microtubule cytoskeleton. The spool is a part of this
    cytoskeletal system, not equivalent to the whole system.
