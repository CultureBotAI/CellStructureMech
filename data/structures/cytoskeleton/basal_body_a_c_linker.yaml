discussions:
- discussion_id: linker_identity_and_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish the intertriplet A-C linker from the enclosing basal body and
    other basal-body modules.
  rationale: A named, imaged multi-protein linkage is a distinct structure, not a
    single protein or synonym of the whole basal body.
  notes: Ignored- and hidden-inclusive repository searches found no existing identity
    record. Complete GO searches for linker, triplet, intertriplet and centriole found
    no exact term. GO:0140535 is a broader is-a parent and GO:0036064 is parthood.
    Cartwheel, inner scaffold, transition fibers and Y-links remain distinct. The
    primary paper uses centriole as shorthand for the Tetrahymena ciliary basal body.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
  - reference: GO:0140535
  - reference: GO:0036064
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: exact_component_families
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact source-neutral groundings for WRAP73, CEP135, TBC1D31 and
    POC1 without using broader families or domains.
  rationale: All four named classes have structural evidence but their inspected integrated
    annotations do not establish exact family equivalence.
  notes: The live searches and accession annotations are recorded in each grounding
    note. Broad InterPro family summaries, including LLM-labeled descriptions, are
    not used as mechanistic evidence. All four remain REVIEWED_LABEL_ONLY.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: polymorphism_and_missing_components
  kind: CURATION_TODO
  status: OPEN
  prompt: Identify the unassigned helical elements and transitional C-link proteins,
    and determine form-specific assembly requirements.
  rationale: The four-family list is incomplete and must not be interpreted as the
    universal composition of every A-C linker.
  notes: The proximal form contains the POC1/TBC1D31 C-link and five unassigned AHEs.
    The transitional form retains WRAP73/CEP135, adds an unassigned AHE and replaces
    the C-side densities with unassigned beta-propellers and a microtubule-contacting
    domain. Figure 6C/D caption labels conflict with the panel titles, so form identity
    takes precedence over an ambiguous panel letter. A proposed distal form remains
    hypothetical. Essentialities and full copy numbers are unset; hierarchical layering
    is not temporal assembly evidence.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: reconcile_variant_and_strain_assignments
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile TBC1D31 A/B aliases and CEP135 variant assignments before adding
    strain-paired protein examples.
  rationale: Article text and deposition mappings disagree at finer granularity than
    the supported family-level components.
  notes: Results assign Q23AD1 to A and Q23K58 to B, while Methods reverse them. Methods
    acknowledge indistinguishable CEP135 N termini and choose Q22AS4; current PDB
    SIFTS maps that entity to Q24GZ2. UniProt accessions describe SB210, whereas structural
    isolation uses SB715 and localization uses other strains. No exact paralogue/accession
    pairing or strain-specific protein example is asserted. Separately, verified POC1
    is Q229Z6; the article's Q22Z96 is a different uncharacterized protein, not an
    alternative POC1.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
  - reference: PDB:9QZC
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: exclude_neighboring_junction_proteins
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not import all adjacent microtubule and junction material as A-C linker
    constituents.
  rationale: A deposited structural model can include connected modules outside the
    structure's curated composition boundary.
  notes: Microtubules are the bridged substrates here, not linker protein families.
    I7LY02 is assigned to inner-junction ladders and is not added to linker composition
    merely because it appears in PDB:9QZC. POC1 is included specifically because its
    C-terminal region participates in the proximal C-link. Unidentified chains and
    AHEs are retained as uncertainty, not fabricated components.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
  - reference: PDB:9QZC
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
