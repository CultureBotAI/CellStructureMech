identifier: cellstructuremech:basal_body_a_c_linker
label: basal body A-C linker
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A proteinaceous intertriplet linkage connecting the A-microtubule of one
  triplet to the C-microtubule of the neighboring triplet in the wall of a ciliary
  basal body.
definition_source: DOI:10.1126/sciadv.ady3689
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-10-04T07:47:48Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-10-04T07:51:28Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added four evidence-backed component classes, Tetrahymena example, proximal
    structural-contact graph, PDB dataset and licensed cryotomography. Preserved compositional
    polymorphism, uncertain groundings and conflicting protein assignments without
    inferring temporal assembly or stoichiometry.
  llm_assisted: true
synonyms:
- synonym_text: A-C linker
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1126/sciadv.ady3689
parent_structures:
