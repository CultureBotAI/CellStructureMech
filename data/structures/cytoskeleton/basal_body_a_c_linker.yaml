components:
- component_id: wrap73
  label: WRAP73 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The verified WRAP73-like accession I7MIG5 has InterPro IPR052778,
    Centrosome-associated WD domain-containing protein. Exact equivalence of that
    broadly named family to WRAP73 was not established. WRAP73 and WDR8 text searches
    yielded no exact integrated family; WD40 superfamilies are not substituted.
  gene_symbols:
  - WRAP73
  - WDR8
  essentiality: UNKNOWN
  role: A-link constituent modeled as a nine-bladed beta-propeller that contacts CEP135
    and unassigned helical elements. It is retained in the proximal and transitional
    linker reconstructions in Tetrahymena.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
    notes: Results and Figure 5 identify the unusual beta-propeller by fitting an
      MS-derived AlphaFold model library into the map. Figure 6 retains WRAP73 in
      both forms; functional necessity is not established by this assignment.
- component_id: cep135
  label: CEP135 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The CEP135 text search returned a microtubule-binding domain, not
    an exact whole-protein family. Both verified Tetrahymena variants carry IPR051877,
    Centriole and Basal Body Structural Protein, but its exact equivalence to CEP135
    was not established. No domain or broad family is promoted to exact identity.
  gene_symbols:
  - CEP135
  - BLD10
  essentiality: UNKNOWN
  role: A-link constituent whose modeled N-terminal dimer contacts WRAP73 and the
    central filament. A segment bridges A-microtubule protofilaments in the proximal
    form. The transitional form has an altered orientation and a less well resolved
    microtubule-contacting segment.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
    notes: Figure 5 and structural modeling support CEP135 placement and the approximately
      325-360 contact segment. Methods explicitly cannot discriminate the two N-terminally
      similar variants in the density. GFP localization used induced constructs, not
      endogenous abundance.
- component_id: tbc1d31
  label: TBC1D31 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Verified accessions Q23AD1 and Q23K58 carry IPR051570, TBC1 domain
    family involved in cilium biogenesis. The live family metadata and TBC1D31 search
    did not establish exact subfamily equivalence. A generic Rab-GAP domain does not
    identify TBC1D31 or establish catalytic activity.
  gene_symbols:
  - TBC1D31
  - TBC1D31A
  - TBC1D31B
  - WDR67
  essentiality: UNKNOWN
  role: Two TBC1D31-like proteins contribute to the proximal C-link and its staggered
    central helical filament. They connect the C-side interface to the A-link. These
    densities are not assigned in the transitional C-link, which has a different,
    unresolved composition.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
    notes: Figure 3 and Results assign the proximal C-link and central filament using
      density fitting, supported by GFP localization. The Results and Methods reverse
      the A/B accession aliases, so no exact paralogue accession pairing or whole-linker
      copy number is asserted.
- component_id: poc1
  label: POC1 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro IPR050505 combines WDR55 and POC1 and is broader than
    this component. IPR020472 is a WD40 repeat rather than a POC1 family. The live
    POC1 search therefore did not provide an exact integrated grounding for this narrower
    class.
  gene_symbols:
  - POC1
  essentiality: UNKNOWN
  role: The C-terminal helix contributes to the proximal C-link alongside TBC1D31-like
    proteins; the N-terminal region associates with the neighboring B-C inner junction.
    The corresponding C-link density is not assigned in the transitional form.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
    notes: Figures 3-4 and the structural model connect POC1 to the proximal C-link
      and B-C junction. The verified POC1 accession is Q229Z6; the transposed accession
      in the article Methods is not copied into a protein example.
canonical_examples:
- taxon_id: NCBITaxon:5911
  taxon_label: Tetrahymena thermophila
  note: The study isolates basal bodies from strain SB715 and compares their architecture
    with in-situ cryotomograms. It calls these ciliary basal bodies centrioles for
    simplicity. GFP localization uses separately specified strains and constructs.
  reference: DOI:10.1126/sciadv.ady3689
functions:
- function_id: intertriplet_linkage
  label: intertriplet microtubule linkage
  description: Connects the A-microtubule of one basal-body triplet to the C-microtubule
    of its neighbor through a proteinaceous A-link/C-link assembly. Proximal and transitional
    forms achieve this connection with different C-side compositions.
  evidence:
  - reference: DOI:10.1126/sciadv.ady3689
    notes: Cryotomography and reconstructions in Figures 1-2 and 6 show the intertriplet
      bridge. This is a structural linkage function, not a measured force threshold
      or a demonstrated temporal assembly sequence.
causal_graphs:
- graph_id: proximal_linker_structural_contacts
  title: Structural contacts bridging adjacent basal-body triplets
  description: A density-supported model of the proximal Tetrahymena A-C linker's
    physical connections to neighboring microtubules.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: Edges describe modeled structural contacts, not perturbation-proven
    dependencies, binding kinetics or temporal assembly order. The model applies to
    the proximal form only. TBC1D31A/B accession aliases and the CEP135 variant assignment
    remain unresolved; unassigned helical elements are not invented as protein families.
    No Rab-GAP reaction or native force-resistance threshold is inferred.
  nodes:
  - node_id: wrap73
    label: WRAP73 family protein
    node_type: GENE_OR_PROTEIN
    component_ref: wrap73
  - node_id: cep135
