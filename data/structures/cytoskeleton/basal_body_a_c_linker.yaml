  - node_id: poc1
    label: POC1 family protein
    node_type: GENE_OR_PROTEIN
    component_ref: poc1
  - node_id: c_side_interface
    label: proximal C-link contact interface
    node_type: STATE
    description: Modeled arrangement of POC1 and TBC1D31-like proteins, not an additional
      component family.
  - node_id: a_tubule
    label: A-microtubule of one basal-body triplet
    node_type: STRUCTURE
    description: The linker-contacted A06/A07 region; not an axonemal A-microtubule
      ontology identity.
  - node_id: c_tubule
    label: C-microtubule of the neighboring basal-body triplet
    node_type: STRUCTURE
    description: The C09-contacted microtubule belongs to the adjacent triplet.
  - node_id: linker
    label: basal body A-C linker
    node_type: STRUCTURE
    description: Proximal form of this record's structure, not a model of the transitional
      C-link composition.
  edges:
  - subject: wrap73
    predicate: coordinates
    object: cep135
    description: WRAP73 contacts the modeled N-terminal CEP135 dimer in the A-link.
    evidence:
    - reference: DOI:10.1126/sciadv.ady3689
      notes: Figure 5A-B and fitting of the predicted WRAP73-CEP135 complex into observed
        density support the contact arrangement.
  - subject: cep135
    predicate: cross-bridges protofilaments of
    object: a_tubule
    description: The approximately 325-360 coiled-coil segment bridges protofilaments
      A06 and A07 in the proximal reconstruction.
    evidence:
    - reference: DOI:10.1126/sciadv.ady3689
      notes: Figure 5C; no claim that this contact alone induces the observed microtubule
        lattice compaction.
  - subject: tbc1d31
    predicate: contacts
    object: cep135
    description: The proximal central-filament and WD40-containing region contacts
      the modeled N terminus of CEP135.
    evidence:
    - reference: DOI:10.1126/sciadv.ady3689
      notes: Figure 3B and Figure 5A; a collective family-level relationship avoids
        assigning a contradictory A/B accession alias.
  - subject: poc1
    predicate: contributes a C-terminal helix to
    object: c_side_interface
    description: The POC1 C-terminal helix participates in the modeled proximal C-link
      interface with TBC1D31-like proteins.
    evidence:
    - reference: DOI:10.1126/sciadv.ady3689
      notes: Figure 3A and density fitting of the predicted subcomplex.
  - subject: tbc1d31
    predicate: contributes modeled binding domains to
    object: c_side_interface
    description: TBC1D31-like domains form the proximal C-link arrangement with POC1.
    evidence:
    - reference: DOI:10.1126/sciadv.ady3689
      notes: Figure 3A; domain names do not establish a Rab GTPase reaction.
  - subject: c_side_interface
    predicate: contacts
    object: c_tubule
    description: The modeled POC1/TBC1D31 interface connects to alpha-tubulins in
      protofilament C09 of the neighboring triplet.
    evidence:
    - reference: DOI:10.1126/sciadv.ady3689
      notes: Results and Figure 3A support the subcomplex-level contact; it is not
        assigned exclusively to one protein.
  - subject: cep135
    predicate: contributes the A-side attachment of
    object: linker
    description: CEP135 contacts the A-microtubule and joins the WRAP73/helical network
      to the central filament in the proximal linker.
    evidence:
    - reference: DOI:10.1126/sciadv.ady3689
      notes: Figures 3B and 5; the unidentified AHE network also contributes to attachment
        and is not omitted as if CEP135 acted alone.
  - subject: c_side_interface
    predicate: contributes the C-side attachment of
    object: linker
    description: The proximal C-link contacts the neighboring C-microtubule and is
      connected to the A-link by the central filament.
    evidence:
    - reference: DOI:10.1126/sciadv.ady3689
      notes: Figure 3 and Results; transitional C-link protein identities are unresolved
        and are outside this graph.
