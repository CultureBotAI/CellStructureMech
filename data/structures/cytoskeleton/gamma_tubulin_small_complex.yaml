identifier: GO:0008275
label: gamma-tubulin small complex
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex usually comprising two gamma-tubulin molecules and two conserved
  non-tubulin proteins. Some gamma-tubulin small complexes are thought to be the repeating
  unit making up the core of the gamma-tubulin ring complex. A heterotetrameric core
  nucleation subcomplex (gamma-TuSC) composed of two molecules of gamma-tubulin (Tub4p
  in Saccharomyces cerevisiae) bound to one molecule each of GCP2 (Spc97p) and GCP3
  (Spc98p). In budding yeast and other fungi lacking GCP4–6, gamma-TuSC is the fundamental
  building block that oligomerizes into a 13-protofilament helical ring upon binding
  Spc110p or Spc72p at the spindle pole body.
