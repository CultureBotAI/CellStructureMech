      did not define a complete source-neutral protein-family boundary for all bud-neck
      contractile-ring constituents.
  - reference: DOI:10.1016/j.tcb.2005.06.007
    notes: Versele and Thorner 2005 reviewed additional bud-neck cytokinesis factors
      that should be resolved before broadening the component list.
  posed_by: codex
