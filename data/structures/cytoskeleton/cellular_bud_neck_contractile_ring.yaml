discussions:
- discussion_id: bud_neck_actomyosin_ring_boundary
  prompt: Keep the cellular bud neck contractile ring distinct from the broader actomyosin
    ring and from bud-neck septin structures.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - part_of
  rationale: GO:0000142 denotes the budding-cell mitotic actomyosin ring at the mother-bud
    neck. GO:0110085 denotes the broader mitotic actomyosin contractile ring class,
    GO:0005935 denotes the bud-neck region, and GO:0000144/GO:0032174 denote separate
    septin-rich bud-neck structures.
  resolution_note: Curated GO:0000142 as the exact bud-neck actomyosin ring, used
    GO:0110085 only as its parent, and represented the bud neck as the containing
    region.
  evidence:
  - reference: GO:0000142
    notes: GO:0000142 identifies the Saccharomyces-type bud-neck actomyosin contractile
      ring.
  - reference: GO:0110085
    notes: GO:0110085 identifies the broader mitotic actomyosin contractile ring.
  - reference: GO:0005935
    notes: GO:0005935 identifies the cellular bud neck.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
- discussion_id: resolve_bud_neck_actomyosin_components
