identifier: GO:0000142
label: cellular bud neck contractile ring
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A contractile ring, i.e. a cytoskeletal structure composed of actin filaments
  and myosin, that forms beneath the plasma membrane at the mother-bud neck in mitotic
  cells that divide by budding in preparation for completing cytokinesis. An example
  of this structure is found in Saccharomyces cerevisiae.
