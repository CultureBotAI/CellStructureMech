identifier: GO:0061645
label: endocytic patch
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: The part of the cell cortex consisting of an aggregation of proteins that
  will give rise to an endocytic vesicle. A discrete, transient cortical assembly
  of clathrin coat proteins, endocytic adaptors (Ede1, Sla1, Sla2, Ent1/2), WASP/myosin-I
  nucleation-promoting factors (Las17, Myo3/5), Arp2/3-nucleated branched actin filaments,
  and BAR-domain scission proteins (Rvs161–Rvs167) at the plasma membrane of yeasts
  and filamentous fungi. The endocytic patch couples localized Arp2/3 actin polymerization
  to membrane invagination against high intracellular turgor pressure.
