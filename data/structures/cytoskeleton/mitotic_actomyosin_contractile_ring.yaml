discussions:
- discussion_id: mitotic_actomyosin_ring_boundary
  prompt: Keep the mitotic actomyosin contractile ring distinct from the generic actomyosin
    ring and from localized meiotic or bud-neck contractile rings.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0110085 denotes the mitotic subtype of the broader actomyosin contractile
    ring class. GO:0000142 denotes the cellular bud neck child structure and GO:0110086
    denotes the meiotic sibling class.
  resolution_note: Curated GO:0110085 as the exact mitotic actomyosin ring, used GO:0005826
    as the parent, left GO:0000142 modeled as a separate narrower record, and referenced
    GO:0110086 only as the meiotic sibling class.
  evidence:
  - reference: GO:0110085
    notes: GO:0110085 identifies the mitotic actomyosin contractile ring.
  - reference: GO:0005826
    notes: GO:0005826 identifies the broader actomyosin contractile ring.
  - reference: GO:0000142
    notes: GO:0000142 identifies the cellular bud neck contractile ring as a narrower
      mitotic ring.
  - reference: GO:0110086
    notes: GO:0110086 identifies the parallel meiotic actomyosin contractile ring
      class.
  posed_by: codex
  posed_date: '2026-09-29'
  resolved_date: '2026-09-29'
