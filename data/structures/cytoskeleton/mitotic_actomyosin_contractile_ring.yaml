- discussion_id: budding_yeast_mitotic_ring_timing
  prompt: Distinguish the early budding-yeast Myo1 precursor ring from the later actin-containing
    contractile ring.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - definition
  rationale: The GO:0110085 definition inspected on 2026-10-11 says the budding-yeast
    mitotic contractile ring forms before mitosis. Bi et al. 1998 instead distinguish
    an early Myo1 ring from actin recruitment near the end of anaphase. Applying the
    early myosin-only timing to the actomyosin structure conflates assembly states.
  resolution_note: Retained the GO class identity and general definition but qualified
    the Saccharomyces cerevisiae sentence using the primary experiments. Myo1 localization
    before budding is distinguished from late-anaphase actin recruitment; no budding-yeast
    chronology is transferred to the fission-yeast example or graph, and no upstream
    GO correction is claimed.
  evidence:
  - reference: GO:0110085
    notes: Current source of the general definition and the conflicting premitotic
      budding-yeast timing.
  - reference: DOI:10.1083/jcb.142.5.1301
    notes: Bi et al. 1998 distinguish Myo1 localization before bud emergence from
      actin recruitment near the end of anaphase in Saccharomyces cerevisiae. This
      primary evidence qualifies the budding-yeast timing clause of the GO-derived
      definition, not the separate fission-yeast model.
  - reference: https://github.com/CultureBotAI/CellStructureMech/issues/2213
    notes: Saved whole-record review F1 and bounded timing correction.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
