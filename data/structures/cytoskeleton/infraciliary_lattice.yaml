components:
- component_id: icl_centrins
  label: Infraciliary-lattice centrins
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro IPR050145 Centrin/CML-like also includes obelin and plant
    CML proteins. It is not an exact grounding for the ICL centrin class. Neither
    an EF-hand domain nor a species-specific centrin accession defines this component.
  essentiality: ESSENTIAL
  role: Calcium-binding centrin-family constituents of the lattice. ICL1e-family depletion
    strips the extended network; essentiality here concerns lattice assembly, not
    cell viability or a requirement for every centrin homologue.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Localization Results, depletion Results and Figures 2 and 4 distinguish
      lattice centrins from basal-body-associated signals.
  - reference: DOI:10.1242/jcs.019414
    notes: 'Abstract read: proteomics identifies ten centrin subfamilies required
      for ICL biogenesis. Full experimental text was not reached.'
- component_id: icl_centrin_binding_proteins
  label: Infraciliary-lattice Sfi1-like centrin-binding proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro IPR052270 covers SFI1 and related proteins, including
    CCDC191. An exact family mapping for the ICL scaffold class and its constituent
    subfamilies was not established; similarity to Sfi1 is not an accession mapping.
  essentiality: ESSENTIAL
  role: Scaffold class required for extended lattice assembly, exemplified by PtCenBP1.
    Not a claim that PtCenBP1 is the complete scaffold inventory.
  evidence:
  - reference: DOI:10.1128/EC.00197-07
    notes: RNAi and GFP-fragment experiments support PtCenBP1 membership and assembly
      dependence.
  - reference: DOI:10.1242/jcs.019414
    notes: 'Abstract read: two Sfi1-like protein subfamilies are required for ICL
      biogenesis. Full experimental text was not reached.'
canonical_examples:
- taxon_id: NCBITaxon:5888
  taxon_label: Paramecium tetraurelia
  reference: DOI:10.1242/bio.024273
  note: Wild-type reference strain d4-2 and mutant backgrounds were studied. Figure
    2 compares an intact wild-type lattice with the BP ICL-less state; Methods identifies
    Delta-CenBP1/nd7-1 among the strains. The species taxon is verified at ENA; no
    strain identifier or clade-wide prevalence is inferred.
functions:
- function_id: calcium_dependent_contractility
  label: Calcium-dependent lattice contractility
  description: Supports cell contraction during secretagogue-induced calcium influx
    in the experimental Paramecium system; not assigned as a locomotory motor.
  evidence:
  - reference: DOI:10.1128/EC.00197-07
    notes: AED assay and PtCenBP1 RNAi connect lattice integrity with contractility.
- function_id: calcium_signal_downregulation
  label: Post-exocytotic calcium-signal downregulation
  description: Supports rapid recovery of intracellular calcium after exocytosis stimulation.
    ICL-less Delta-PtCenBP1 cells show slower signal decay without a change in initial
    signal generation; the authors interpret this as endogenous buffering.
  evidence:
  - reference: DOI:10.1016/j.ceca.2008.06.004
    notes: 'Primary abstract read: Fura Red ratio imaging compares d4-2 with Delta-PtCenBP1.
      Full methods were not reached; quantitative decay values are not curated.'
