evidence:
- reference: DOI:10.1242/bio.024273
  notes: Aubusson-Fleury et al. (2017). Read Introduction, ICL1e localization and
    depletion Results, strain, RNAi, immunostaining and microscopy Methods, and Figure
    2 legend in Europe PMC JATS. These delimit the extended lattice and surviving
    basal-body-associated structures.
- reference: DOI:10.1128/EC.00197-07
  notes: Gogendeau et al. (2007). Publisher abstract, Methods, RNAi/localization Results
    and opening Discussion read. Earlier PMC and Europe PMC routes failed; the ASM
    publisher body subsequently succeeded.
- reference: DOI:10.1242/jcs.019414
  notes: Gogendeau et al. (2008). Europe PMC primary abstract read. DOI and publisher-search
    routes did not yield full text; no detailed methods, exact paralogue inventory
    or copy numbers are claimed.
- reference: DOI:10.1016/j.ceca.2008.06.004
  notes: Sehring et al. (2009). Europe PMC primary abstract read. DOI retrieval failed
    and a public PDF lead did not establish full-body access. The function is retained
    only at the explicitly reported qualitative comparison.
- reference: GO:0005622
  notes: Verified non-obsolete intracellular anatomical structure, used as a broad
    is-a parent.
- reference: GO:0030863
  notes: Verified non-obsolete cortical cytoskeleton. The subcortical lattice is treated
    as a proper part, not the entire cortical framework.
discussions:
- discussion_id: identity_and_ontology_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate the infraciliary lattice from other centrin assemblies and ontology
    lattices.
  rationale: Similar names, shared centrin and neighboring localization do not establish
    structural identity.
  notes: Hidden- and ignored-inclusive repository searches found only discussion mentions
    in the cryptophyte cortical centrin network and its derived embedding, not an
    ICL record. QuickGO infraciliary returned no term; infraciliary lattice returned
    galectin and mammalian cytoplasmic-lattice terms, whose definitions do not match.
    A broader centrin/contractile/network query was not an exact identity match. GO:0030863
    is the encompassing cortical cytoskeleton. The local mint denotes the extended
    mesh, not an individual filament, protein, organizing centre, ICL1e complex, ciliary
    centrin arm or cryptophyte network.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Introduction and localization Results distinguish the whole mesh from retained
      basal-body-associated structures.
  - reference: https://www.ebi.ac.uk/QuickGO/services/ontology/go/search?query=infraciliary%20lattice
    notes: Authority search; GO:0140095, GO:0140419 and GO:0140366 definitions were
      read and rejected as identities.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: component_family_groundings
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact source-neutral families for the ICL centrin and scaffold classes.
  rationale: A broad family or domain must not silently substitute for the experimentally
    delimited component class.
  notes: InterPro IPR050145 includes non-centrin calcium-binding proteins, and IPR052270
    does not by itself verify an exact ICL scaffold mapping. Components remain reviewed-label-only.
    The two scaffold subfamilies reported in the 2008 abstract prevent treating PtCenBP1
    as a complete inventory. No species-specific accession or stoichiometry is guessed.
  evidence:
  - reference: InterPro:IPR050145
    notes: Family name and description read at the InterPro API.
  - reference: InterPro:IPR052270
    notes: Family name and description read at the InterPro API.
  - reference: DOI:10.1242/jcs.019414
    notes: Abstract documents molecular diversity of both component classes.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: basal_body_function_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not transfer ICL1e-complex anchoring functions to the whole extended
    lattice.
  rationale: ICL-less cells retain basal-body-associated material, while centrin depletion
    affects more than one assembly.
  notes: The 2017 study distinguishes the ICL-organizing centre from the ICL1e dot/complex.
    Both lattice-bearing and BP cells retain the basal-body-associated ICL1e complex.
    Depletion causes anchoring defects, not failure of basal-body duplication per
    se. Those phenotypes are not assigned as whole-lattice functions. Basal-body tubulin,
    Centrin2 and Centrin3 are not included simply because they are imaged or discussed
    near the lattice; 1A9 does not recognize ICL1e centrins.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Localization and depletion Results; Figures 2 and 4.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: taxonomic_and_mechanistic_limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve taxonomic extent and finer molecular mechanisms with direct evidence.
  rationale: Centrin conservation and network morphology do not establish universal
    lattice occurrence or a resolved contraction mechanism.
  notes: Only the verified P. tetraurelia exemplar is asserted. No prevalence row,
    cross-ciliate homology claim, native dimension inferred from a scale bar, contraction
    stoichiometry or detailed torsion/sliding mechanism is encoded. Family gene counts
    are not copies per lattice. Abstract-only 2008 composition and 2009 calcium evidence
    should be checked against full experimental text before quantitative expansion.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Species, imaging and depletion evidence delimit current assertions.
  - reference: DOI:10.1016/j.ceca.2008.06.004
    notes: Abstract supports a qualitative decay comparison, not a curated kinetic
      model.
  - reference: https://www.ebi.ac.uk/ena/taxonomy/rest/tax-id/5888
    notes: Verified Paramecium tetraurelia, species rank; d4-2 is recorded as culture
      metadata only.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: figure_and_antibody_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Identify intact and ICL-less panels and preserve the figure's exact licence.
  rationale: Residual dots in a knockout are not an intact lattice, and different
    antibody targets are not interchangeable.
  notes: Unmodified Figure 2 is confocal, not STED. A/A1/A2 show the wild-type network;
    B/B1/B2 show BP cells and residual structures. Actual panels label GFP-Cen15,
    an ICL1e-subfamily member; the legend uses GFP-ICL1e generically. 1A9 marks other
    ICL centrins and PolyE marks basal bodies. Scale bars are 20 micrometres in A/B
    and 1 micrometre in insets. CC BY 3.0 was read in JATS and checked against PMC
    OA metadata; the source media checksum was verified.
  evidence:
  - reference: DOI:10.1242/bio.024273
    notes: Figure 2, its legend, fluorescence Methods and article permissions inspected.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
