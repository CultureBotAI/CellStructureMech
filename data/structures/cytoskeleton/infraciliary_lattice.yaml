identifier: cellstructuremech:infraciliary_lattice
label: infraciliary lattice
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A subcortical, calcium-responsive contractile network of centrin-containing
  filaments in Paramecium, assembled with Sfi1-like centrin-binding proteins. The
  mesh extends beneath the cell surface and is distinct from the basal-body-associated
  organizing centres and ICL1e complex that can persist when the extended lattice
  is lost.
definition_source: DOI:10.1242/bio.024273
mapping_status: PROPOSED
