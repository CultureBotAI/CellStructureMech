discussions:
- discussion_id: resolve_basal_ring_constituents
  prompt: Resolve exact basal-ring resident proteins and their source-neutral family
    groundings.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#toxoplasma_basal_ring_topology
  rationale: This first basal-ring record captures the GO-delimited lower polar ring
    and its subpellicular-microtubule origin topology. It leaves protein components
    out until direct evidence places candidate proteins in the mature basal ring and
    an exact taxon-neutral family scope can be reviewed.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 localized candidate proteins to several Toxoplasma apical-cytoskeleton
      subcompartments.
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: distinguish_anterior_polar_ring
  prompt: Keep the basal or posterior polar ring distinct from the anterior polar
    ring of the apical complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#toxoplasma_basal_ring_topology
  rationale: GO:0020032 denotes the lower/posterior/preconoidal ring from which subpellicular
    microtubules originate, whereas GO:0020031 denotes the anterior polar ring from
    which conoid fibers originate. The two terms therefore represent adjacent but
    separate apical-complex rings.
  evidence:
  - reference: GO:0020032
    notes: Gene Ontology lists lower, posterior and preconoidal ring exact synonyms
      for GO:0020032.
  - reference: GO:0020031
    notes: Gene Ontology identifies the anterior polar ring of the apical complex
      as a distinct term.
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
- discussion_id: basal_preconoidal_source_conflict
  prompt: Separate the GO synonym conflict from the demonstrated basal-ring anatomy.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - synonyms
  - causal_graphs#toxoplasma_basal_ring_topology
  - discussions#distinguish_anterior_polar_ring
  rationale: The original discussion faithfully recorded a GO:0020032 exact synonym,
    preconoidal ring of apical complex. Hu 2006 instead places preconoidal rings at
    the distal conoid tip and the SPMT-origin polar ring at the base. Hu 2002 distinguishes
    the moving anterior ring/conoid from the lower ring. Thus the GO synonym conflicts
    with the primary anatomy and cannot establish biological equivalence.
  resolution_note: Remove the active preconoidal synonym and equivalent anatomical
    wording while preserving the original discussion, source attribution and dates
    as historical rationale. Retain GO:0020032 for the SPMT-origin ring and qualify
    its conoid-relative position by extrusion. Do not equate this one GO ring with
    all layers of the modern multilayer APR.
  evidence:
  - reference: GO:0020032
    notes: Current authority still lists the conflicting preconoidal exact synonym;
      this local interpretation does not silently alter the source.
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Introduction and Figure 1 explicitly separate distal preconoidal rings
      from the SPMT-origin polar ring.
  - reference: DOI:10.1083/jcb.200112086
    notes: Figure 1 distinguishes extended and retracted conoid states.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
