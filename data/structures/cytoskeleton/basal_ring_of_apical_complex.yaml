discussions:
- discussion_id: resolve_basal_ring_constituents
  prompt: Resolve exact basal-ring resident proteins and their source-neutral family
    groundings.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#toxoplasma_basal_ring_topology
  rationale: This first basal-ring record captures the GO-delimited lower polar ring
    and its subpellicular-microtubule origin topology. It leaves protein components
    out until direct evidence places candidate proteins in the mature basal ring and
    an exact taxon-neutral family scope can be reviewed.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 localized candidate proteins to several Toxoplasma apical-cytoskeleton
      subcompartments.
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: distinguish_anterior_polar_ring
  prompt: Keep the basal or posterior polar ring distinct from the anterior polar
    ring of the apical complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#toxoplasma_basal_ring_topology
  rationale: GO:0020032 denotes the lower/posterior/preconoidal ring from which subpellicular
    microtubules originate, whereas GO:0020031 denotes the anterior polar ring from
    which conoid fibers originate. The two terms therefore represent adjacent but
    separate apical-complex rings.
  evidence:
  - reference: GO:0020032
    notes: Gene Ontology lists lower, posterior and preconoidal ring exact synonyms
      for GO:0020032.
  - reference: GO:0020031
    notes: Gene Ontology identifies the anterior polar ring of the apical complex
      as a distinct term.
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
