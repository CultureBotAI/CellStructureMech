identifier: GO:0020032
label: basal ring of apical complex
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: An electron dense ring at the most posterior position of the apical complex,
  from which the subpellicular microtubules originate; formed during an invasive life
  cycle stage of an apicomplexan parasite.
