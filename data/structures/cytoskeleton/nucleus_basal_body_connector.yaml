identifier: cellstructuremech:nucleus_basal_body_connector
label: nucleus-basal body connector
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A centrin-containing fibrous root system that links flagellar basal bodies
  to the nuclear surface. It is a specialized nucleus-associated rootlet system, not
  the entire basal apparatus or the fibers connecting basal bodies to one another.
definition_source: DOI:10.1083/jcb.101.5.1903
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-10-04T03:40:50Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-10-04T03:43:01Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added source-bounded connector identity, centrin component and verified
    protein example, three canonical taxa, nuclear-localization function, conditional
    contraction graph, link-only figure and explicit evidence limitations.
  llm_assisted: true
parent_structures:
