components:
- component_id: connector_centrins
  label: Nucleus-basal body connector centrins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Centrin-family calcium-binding constituents of the connector fibers; normal
    assembly depends on centrin function in the tested Chlamydomonas mutants.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Reviewed InterPro entries IPR050145 and IPR050230 include non-centrin
    proteins; EF-hand domains are also too broad. No exact family term for the connector-associated
    class was verified. Essentiality is not generalized from Chlamydomonas mutants
    to every example.
  protein_examples:
  - uniprot_id: UniProtKB:P05434
    protein_label: Caltractin
    taxon_id: NCBITaxon:3055
    taxon_label: Chlamydomonas reinhardtii
    entry_status: REVIEWED
    retrieved_on: '2026-10-04'
    role: Species-level centrin example, not a connector-specific paralogue or a complete
      connector inventory.
    evidence:
    - reference: UniProtKB:P05434
      notes: Verified reviewed entry, recommended name, organism and sequence-source
        citations; no primary gene symbol is supplied by the entry.
    - reference: DOI:10.1083/jcb.119.6.1613
      notes: Centrin/caltractin sequence and vfl2 linkage establish the tested protein;
        mutant and revertant analysis includes connector assembly. Methods use the
        cloned centrin sequence cited by the UniProt entry.
  evidence:
  - reference: DOI:10.1083/jcb.101.5.1903
    notes: Connector immunoreactivity and biochemical identification of an acidic
      approximately 20-kDa protein.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: E101K centrin and intragenic revertants distinguish normal connector formation
      from other centrin-containing assemblies.
  - reference: DOI:10.1007/s00709-003-0016-4
    notes: Primary abstract reports centrin immunoreactivity and Synura cytoskeleton
      immunoblots; no sequence-level identity for these examples is assigned.
canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  reference: DOI:10.1083/jcb.105.4.1799
  note: The contraction experiments used gametes of a 137c derivative; no culture-collection
    strain accession is inferred.
- taxon_id: NCBITaxon:52555
  taxon_label: Synura petersenii
  reference: DOI:10.1007/s00709-003-0016-4
  note: Primary abstract describes a centrin-containing rootlet claw between basal
    bodies and nucleus, including mitotic observations.
- taxon_id: NCBITaxon:420600
  taxon_label: Mallomonas insignis
  reference: DOI:10.1007/s00709-003-0016-4
  note: Included in the primary abstract's ultrastructural comparison of nucleus-associated
    rhizoplasts; contraction is not demonstrated here.
functions:
- function_id: nucleus_localization
  label: nucleus localization
  grounding: GO:0051647
  description: Connector shortening and reextension reposition the nucleus relative
    to the basal apparatus in Chlamydomonas.
  evidence:
  - reference: DOI:10.1083/jcb.101.5.1903
    notes: Calcium shortens connectors in isolated nucleo-flagellar preparations.
  - reference: DOI:10.1083/jcb.105.4.1799
    notes: Living gametes and extracted models show coupled changes in root configuration
      and nuclear position.
causal_graphs:
- graph_id: extracted_model_nuclear_movement
  title: Calcium-driven connector movement and ATP potentiation in extracted Chlamydomonas
    models
  description: Assay-level contractile mechanism, not an atomic motor model. The calcium
    step requires a responsive preparation; prior ATP treatment restores responsiveness
    after a refractory cycle.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: Restricted to the extracted-cell model. No specific phosphorylation
    reaction, kinase, or universal ATP-free cycle is established.
  nodes:
  - node_id: calcium_treatment
    label: Elevated free calcium in assay buffer
    node_type: EXPERIMENTAL_FACTOR
  - node_id: connector_contraction
    label: Connector contraction
    node_type: BIOLOGICAL_PROCESS
  - node_id: anterior_nucleus
    label: Anterior nuclear displacement
    node_type: CELLULAR_LOCALIZATION
  - node_id: egta_treatment
    label: Calcium chelation by EGTA
    node_type: EXPERIMENTAL_FACTOR
  - node_id: connector_extension
    label: Connector reextension
    node_type: BIOLOGICAL_PROCESS
  - node_id: central_nucleus
    label: Return toward central nuclear position
    node_type: CELLULAR_LOCALIZATION
  - node_id: atp_treatment
    label: ATP treatment of refractory models
    node_type: EXPERIMENTAL_FACTOR
  - node_id: calcium_responsiveness
    label: Restored calcium responsiveness
    node_type: CAPACITY
  edges:
  - subject: calcium_treatment
    predicate: triggers
    object: connector_contraction
    description: Calcium contracts initially responsive or ATP-potentiated models.
    evidence:
    - reference: DOI:10.1083/jcb.105.4.1799
      notes: Results and Table I; a refractory preparation does not respond without
        potentiation.
  - subject: connector_contraction
    predicate: draws the nucleus toward the basal apparatus
    object: anterior_nucleus
    description: Shortening couples the basal apparatus to anterior nuclear displacement.
    evidence:
    - reference: DOI:10.1083/jcb.105.4.1799
      notes: Figure 2 and extracted-model experiments.
  - subject: egta_treatment
    predicate: permits
    object: connector_extension
    description: Chelation reverses the contracted configuration.
    evidence:
    - reference: DOI:10.1083/jcb.105.4.1799
      notes: Results and Table I.
  - subject: connector_extension
    predicate: accompanies return of
    object: central_nucleus
    description: The nucleus returns toward its central position during reextension.
    evidence:
    - reference: DOI:10.1083/jcb.105.4.1799
      notes: Extracted-model reactivation results; no separate nuclear motor is assigned.
  - subject: atp_treatment
    predicate: restores
    object: calcium_responsiveness
    description: ATP potentiates a subsequent calcium response after refractoriness.
    evidence:
    - reference: DOI:10.1083/jcb.105.4.1799
      notes: Table I tests ATP before or during renewed calcium exposure.
  - subject: calcium_responsiveness
    predicate: permits renewed calcium-triggered
    object: connector_contraction
    description: 'Potentiation alone is not equated with contraction: calcium exposure
      is also required.'
    evidence:
    - reference: DOI:10.1083/jcb.105.4.1799
      notes: Sequential treatment conditions in Table I.
evidence:
- reference: DOI:10.1083/jcb.101.5.1903
  notes: Primary identity, isolation and localization study; inspected PDF text on
    pages 1, 2, 8 and 9.
- reference: DOI:10.1083/jcb.105.4.1799
  notes: Full seven-page primary PDF read; Figure 2 and Table I visually inspected.
- reference: DOI:10.1002/cm.970140409
  notes: Primary abstract read through Europe PMC; full experimental text not read.
    Includes negative gene-induction evidence.
- reference: DOI:10.1083/jcb.119.6.1613
  notes: Primary sequence, mutant/revertant and ultrastructural evidence; Methods,
    Results and Table II inspected.
- reference: DOI:10.1007/s00709-003-0016-4
  notes: Primary abstract read. Full experimental text and figures not read; species
    comparisons remain abstract-bounded.
- reference: DOI:10.1128/EC.4.7.1253-1263.2005
  notes: Verified primary abstract and partial indexed text describe a larger centrin
    scaffold. Not treated as a fully inspected paper or proof of specific connector-binding
    proteins.
- reference: GO:0035253
  notes: Verified ciliary rootlet term; broad is-a parent, not exact connector identity.
- reference: GO:0051647
  notes: Verified nucleus localization term for the observed positional changes.
discussions:
- discussion_id: rootlet_identity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate the named connector from other basal-apparatus fibers.
  rationale: Shared centrin or historical rootlet terminology does not establish equivalent
    structure identities.
  notes: Hidden- and ignored-inclusive searches found the existing ciliary-rootlet
    subtype TODO, not an exact record. This is a specialized child of GO:0035253,
    not its replacement. Rhizoplast and system II fiber remain related synonyms. OTHER
    denotes a root system rather than one molecular filament. GO:0120118 flagella
    connector and GO:0120269 ciliary centrin arm are different structures.
  evidence:
  - reference: DOI:10.1083/jcb.101.5.1903
    notes: Discussion distinguishes system II fibers and microtubular roots.
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: NBBC, distal striated fibers and transition-region structures are separate.
  - reference: GO:0035253
    notes: Current authority definition and exact synonyms checked.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: molecular_inventory
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact connector-centrin family grounding and the remaining scaffold
    composition.
  rationale: A verified protein example does not define a cross-taxon family or a
    full molecular inventory.
  notes: P05434 is a species example only. IPR050145 and IPR050230 are broader than
    connector centrins. Sfi1/CBP1.1 in the Chlamydomonas scaffold is a proposal in
    the accessed 2005 text, not an established NBBC constituent. Do not import it
    from yeast, another algal structure, or a whole-scaffold hypothesis.
  evidence:
  - reference: InterPro:IPR050145
    notes: Authority description includes obelin and plant CML proteins.
  - reference: InterPro:IPR050230
    notes: Broad calcium-binding regulatory-protein family.
  - reference: DOI:10.1128/EC.4.7.1253-1263.2005
    notes: Accessed Discussion presents Sfi1/CBP1.1 scaffold membership as likely,
      not directly identified in the connector.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: mutant_inference_limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve connector-specific contributions to basal-body segregation independently
    of other centrin structures.
  rationale: The vfl2 mutation affects several assemblies, so its entire phenotype
    cannot be assigned to the connector alone.
  notes: 1992 class-2 revertants restore NBBCs despite abnormal distal striated fibers;
    the authors infer a connector requirement by eliminating alternatives. This is
    not selective connector ablation. No essential mitotic role or universal assembly
    requirement is asserted.
  evidence:
  - reference: DOI:10.1083/jcb.119.6.1613
    notes: Table II and Discussion give the differential revertant evidence and the
      authors' inference.
  - reference: DOI:10.1002/cm.970140409
    notes: Abstract reports stable connectors in bald-2 despite rudimentary basal
      bodies.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: contractile_cycle_limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Determine the molecular basis of ATP potentiation and native force generation.
  rationale: Reactivation experiments establish conditional responses, not every biochemical
    intermediate.
  notes: Phosphorylation is a hypothesis; no kinase or direct centrin conformational
    pathway is added. Nuclear-position measurements are not connector dimensions.
    The tentative 1985 filament assignment is not used as a definitive diameter.
  evidence:
  - reference: DOI:10.1083/jcb.105.4.1799
    notes: Discussion distinguishes ATP potentiation from the proposed phosphorylation
      step.
  - reference: DOI:10.1083/jcb.101.5.1903
    notes: Negative-stain filaments were tentatively assigned to the connector.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: gene_induction_hypothesis
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not assert that connector contraction is required for flagellar gene
    induction.
  rationale: An early signaling hypothesis has later negative evidence.
  notes: The 1989 primary abstract reports preserved induction in the connector-defective
    mutant. Gene induction is therefore not included as a required connector function
    or graph output.
  evidence:
  - reference: DOI:10.1002/cm.970140409
    notes: Direct abstract statement that the connector is not necessary for the tested
      induction process.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: taxonomic_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Compare connector variants and verify source details beyond the demonstrated
    examples.
  rationale: Similar topology does not prove universal distribution, identical dynamics
    or molecular homology across every rhizoplast.
  notes: The three examples have exact authority-verified species IDs. Mallomonas
    fastigiata is mentioned by the 2003 abstract but has no resolved exact-name taxon
    ID in this pass. No clade prevalence is inferred; Chlamydomonas contraction results
    are not transferred to chrysomonads. The 1989 and 2003 sources remain abstract-bounded.
  evidence:
  - reference: DOI:10.1007/s00709-003-0016-4
    notes: Abstract explicitly compares the chrysomonad connector with the chlorophyte
      structure.
  - reference: DOI:10.1002/cm.970140409
    notes: Full text remains unread.
  posed_by: codex
  posed_date: '2026-10-04'
