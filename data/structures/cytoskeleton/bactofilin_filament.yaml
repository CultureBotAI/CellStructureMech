identifier: cellstructuremech:bactofilin_filament
label: bactofilin filament
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: A bacterial cytoskeletal filament assembled from bactofilin proteins that
  forms beta-helical scaffolds for species-specific cellular organization processes,
  including polar stalk biogenesis in Caulobacter vibrioides.
definition_source: DOI:10.1038/emboj.2009.358
