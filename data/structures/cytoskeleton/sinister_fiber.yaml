  notes: Current culture-collection record identifies Spermatozopsis similis and links
    AJ001438; sequence metadata preserves the historical SAG B 1.85 label.
discussions:
- discussion_id: sf_fiber_identity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep sinister fibers distinct from adjacent basal-apparatus assemblies.
  rationale: Shared location or striation does not establish identical structures.
  notes: Whole-repository searches including hidden and ignored files found prior
    discovery notes but no exact record. The 1sf and 2sf names denote age-associated
    instances, not two separate protein-family records. SF-assemblin SMAFs, centrin
    fibers, proximal plates and d-fibers remain distinct. OTHER denotes the organized
    wedge-shaped linker, not a single protein or one molecular filament.
  evidence:
  - reference: DOI:10.1083/jcb.140.5.1149
    notes: Primary Methods, Results and Discussion.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: ontology_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Use a local identifier rather than equating sf-fibers with a mother-centriolar
    appendage.
  rationale: The paper compares basal feet and satellites by resemblance, without
    establishing exact homology or identity.
  notes: QuickGO searches for sinister, basal foot, subdistal appendage and proximal
    plate and their returned definitions did not yield an exact sf-fiber term. GO:0120103
    specifies an appendage assembled on the mother centriole; it is not assigned to
    both the older-basal-body 1sf and proximal younger-basal-body 2sf. Broad organelle
    parent and cytoskeletal parthood are kept separate.
  evidence:
  - reference: DOI:10.1083/jcb.140.5.1149
    notes: Native positions and comparisons to basal feet in Results and Discussion.
  - reference: GO:0120103
    notes: Current definition and synonyms checked at QuickGO; not used as record
      identity.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: family_and_inventory
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve a source-neutral BAp95 family grounding and the remaining native
    molecular inventory.
  rationale: A cloned antigen and in-vitro self-assembly do not establish all native
    constituents or their stoichiometry.
  notes: InterPro returned no integrated entries for O49944 and no results in the
    bounded BAp95/sinister-fiber/basal-apparatus-protein searches. The unreviewed
    sequence example remains explicitly unreviewed. Apparatus-level gel percentages
    are not sf-fiber stoichiometry. BAp90, SF-assemblin, centrin and predicted coiled-coil
    homologues are not imported as sf-fiber constituents without direct evidence.
  evidence:
  - reference: DOI:10.1083/jcb.140.5.1149
    notes: Primary Methods, Results and Discussion.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: native_assembly_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Establish native sf-fiber biogenesis, recruitment and BAp95 essentiality.
  rationale: The recombinant assay establishes intrinsic assembly capacity, not native
    localization or sufficiency.
  notes: No causal chain through rodlike or ladderlike proposed intermediates is asserted.
    Recombinant fiber dimensions and repeat spacing are not native whole-fiber physical
    properties. Putative cdc2 phosphorylation motifs are sequence predictions, not
    a demonstrated regulatory reaction.
  evidence:
  - reference: DOI:10.1083/jcb.140.5.1149
    notes: Primary Methods, Results and Discussion.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: functional_and_taxonomic_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve direct functional perturbations, exact function grounding and additional
    demonstrated organisms.
  rationale: Native linkage is observed, while broader physiological roles and cross-species
    equivalence require separate evidence.
  notes: Root orientation, phototaxis and mitotic-positioning roles remain hypotheses.
    Chlamydomonas antibody dots reported without displayed data do not establish the
    exact sf-fiber there; negative cross-reactivity elsewhere does not prove structure
    absence. No distribution row, trait link or broad function term is inferred from
    the single species.
  evidence:
  - reference: DOI:10.1083/jcb.140.5.1149
    notes: Primary Methods, Results and Discussion.
  posed_by: codex
  posed_date: '2026-10-04'
