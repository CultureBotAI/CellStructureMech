identifier: cellstructuremech:sinister_fiber
label: sinister fiber
structure_category: CYTOSKELETON
structure_kind: OTHER
definition: A striated, wedge-shaped fibrous linker connecting a flagellar basal body
  to a five-microtubule s-type root in Spermatozopsis similis. Its BAp95-containing
  assembly is distinct from the root microtubules, SF-assemblin fibers, centrin fibers
  and proximal interbasal plates.
definition_source: DOI:10.1083/jcb.140.5.1149
mapping_status: PROPOSED
