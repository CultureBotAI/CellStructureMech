components:
- component_id: bap95_sf_fiber_proteins
  label: BAp95 sf-fiber structural proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Fiber-localized structural constituent. Recombinant BAp95 forms striated fibers
    in vitro, supporting a major structural role without establishing the complete
    native inventory or native assembly sufficiency.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact family was verified in InterPro integrated entries for
    O49944 or bounded entry searches for BAp95, sinister fiber and basal apparatus
    protein (all HTTP 204). Predicted coiled-coil segments do not establish an exact
    protein-family identity.
  protein_examples:
  - uniprot_id: UniProtKB:O49944
    protein_label: 95 kD basal apparatus-protein
    taxon_id: NCBITaxon:3192
    taxon_label: Spermatozopsis similis
    entry_status: UNREVIEWED
    retrieved_on: '2026-10-04'
    role: Sequence-backed BAp95 example corresponding to the cloned antigen; not a
      complete sf-fiber composition or a curated family accession.
    evidence:
    - reference: UniProtKB:O49944
      notes: Live entry verifies the submitted name, unreviewed status, species, 834-residue
        sequence and EMBL AJ001438/CAA04763.1 bridge. No primary gene symbol is supplied.
    - reference: DOI:10.1083/jcb.140.5.1149
      notes: Clone 7/1 and the Figure 2 sequence accession AJ001438 identify the recombinant
        antigen used for anti-rec95 localization and reassembly.
  evidence:
  - reference: DOI:10.1083/jcb.140.5.1149
    notes: Anti-rec95 raised against the recombinant antigen specifically labels sf-fibers
      by immunogold, with preimmune controls. The broader anti-p95 serum recognizes
      two bands and is not used to assign both antigens to BAp95. Results and Figure
      7.
canonical_examples:
- taxon_id: NCBITaxon:3192
  taxon_label: Spermatozopsis similis
  reference: DOI:10.1083/jcb.140.5.1149
  note: Methods use SAG B1.85. The current SAG 1.85 authority record links this paper's
    AJ001438 sequence and the historical SAG B 1.85 designation in its sequence metadata.
    Both 1sf on the older basal body and 2sf on the younger basal body were examined;
    no clade-wide prevalence is asserted.
functions:
- function_id: basal_body_s_root_linkage
  label: basal-body to s-root linkage
  description: The native fiber physically links a basal body with its five-microtubule
    s-type root. This structural linkage does not by itself demonstrate control of
    phototaxis, spindle placement or cleavage-furrow positioning.
  evidence:
  - reference: DOI:10.1083/jcb.140.5.1149
    notes: Results and Figures 7-8 resolve the attachments. The larger 1sf is subdistal
      on the older basal body; 2sf is proximal on the younger one. Retention of 1sf
      after mechanical disintegration supports firm basal-body attachment.
causal_graphs:
- graph_id: bap95_in_vitro_fiber_assembly
  title: Recombinant BAp95 self-assembly in vitro
  description: Purified recombinant BAp95 forms striated fibers during stepwise denaturant
    removal. This is an experimental constituent-assembly mechanism, not a reconstitution
    of the complete native basal-body to s-root linker.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Restricted to the Figure 5 floating-microdialysis assay. The product
    is deliberately not grounded to the native sinister-fiber identifier. Rodlike
    particles and ladderlike profiles are proposed intermediates, so no precursor
    sequence or native attachment step is asserted. Two supported edges are retained
    without padding the graph.
  nodes:
  - node_id: recombinant_bap95
    label: Purified recombinant BAp95
    node_type: GENE_OR_PROTEIN
    component_ref: bap95_sf_fiber_proteins
    description: The Spermatozopsis sequence expressed in bacteria and purified in
      urea.
  - node_id: stepwise_dialysis
    label: Stepwise urea removal in the floating-membrane assay
    node_type: EXPERIMENTAL_FACTOR
    description: Dialysis through 4, 2, 0.8 and 0 M urea, with approximately 0.1 microgram
      per microliter protein, in the reported salt buffer.
  - node_id: reconstituted_fibers
    label: In-vitro striated BAp95 fibers
    node_type: STRUCTURE
    description: Reconstituted fibers with an approximately 98 nm repeat; not the
      complete native linker and not the spindle-shaped aggregates obtained under
      different conditions.
  edges:
  - subject: recombinant_bap95
    predicate: self-assembles in vitro into
    object: reconstituted_fibers
    description: The purified recombinant protein produces cross-striated fibers in
      the defined reassembly assay.
    evidence:
    - reference: DOI:10.1083/jcb.140.5.1149
      notes: Reassembly Results and Figure 5a-e; sedimented material is predominantly
        the 95-kD protein. Full native composition and anchoring are not reconstituted.
  - subject: stepwise_dialysis
    predicate: permits formation of
    object: reconstituted_fibers
    description: Gradual urea removal under the specified assay conditions yields
      striated fibers in the final dialysate; no claim that this protocol is the native
      biogenesis pathway or the only possible assembly condition is made.
    evidence:
    - reference: DOI:10.1083/jcb.140.5.1149
      notes: Reassembly Methods and Results. Higher protein concentration or dialysis
        tubing instead yields spindle-shaped aggregates, sometimes with a different
        repeat.
evidence:
