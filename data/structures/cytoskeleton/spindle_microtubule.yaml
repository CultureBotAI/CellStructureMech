  - subject: spindle_pole_body
    predicate: anchors
    object: spindle_microtubule
    description: Budding-yeast spindle pole bodies anchor the spindle microtubules
      that form the mitotic spindle.
    evidence:
    - reference: GO:0005876
      notes: GO:0005876 defines spindle microtubules as anchored at one spindle pole.
    - reference: DOI:10.1146/annurev.cellbio.20.022003.114106
      notes: Jaspersen and Winey 2004 reviewed the budding-yeast spindle pole body
        as the nuclear microtubule-organizing center.
  - subject: spindle_microtubule
    predicate: is part of
    object: mitotic_spindle
    description: Spindle microtubules form the bipolar microtubule array of the budding-yeast
      mitotic spindle.
    evidence:
    - reference: GO:0072686
      notes: GO:0072686 identifies the mitotic spindle as a spindle that forms during
        mitosis.
    - reference: DOI:10.1083/jcb.129.6.1601
      notes: Winey et al. 1995 reconstructed budding-yeast mitotic spindles from serial
        electron micrographs and classified their microtubule bundles.
  - subject: spindle_microtubule
    predicate: attaches to
    object: kinetochore
    description: A subset of budding-yeast spindle microtubules forms kinetochore
      fibers.
    evidence:
    - reference: GO:0000776
      notes: GO:0000776 defines the kinetochore as a centromeric complex that provides
        a spindle-microtubule attachment point.
    - reference: DOI:10.1083/jcb.129.6.1601
      notes: Winey et al. 1995 reconstructed budding-yeast spindles containing presumptive
        kinetochore microtubules and interpolar microtubules.
discussions:
- discussion_id: spindle_poles_and_kinetochores_are_boundaries
  prompt: Keep spindle pole bodies and kinetochores as adjacent organizing or attachment
    structures rather than molecular components of the spindle microtubule.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#budding_yeast_spindle_microtubule_architecture
  rationale: GO:0005876 denotes the anchored tubulin polymer that is part of a spindle.
    Spindle pole bodies and kinetochores physically interact with spindle microtubules
    in budding yeast, but each is a separately GO-denoted structure rather than a
    molecular constituent of the microtubule filament.
  resolution_note: Modeled spindle pole bodies and kinetochores as adjacent graph
    nodes rather than as spindle-microtubule components.
  evidence:
  - reference: GO:0005876
    notes: GO:0005876 defines the spindle microtubule as an anchored microtubule that
      is part of a spindle.
  - reference: GO:0005816
    notes: GO:0005816 denotes the fungal spindle pole body.
  - reference: GO:0000776
    notes: GO:0000776 denotes the kinetochore.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
