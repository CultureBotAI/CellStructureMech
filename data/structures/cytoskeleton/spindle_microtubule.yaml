causal_graphs:
- graph_id: budding_yeast_spindle_microtubule_architecture
  title: Spindle microtubules bridge budding-yeast spindle poles and kinetochores
  description: Alpha- and beta-tubulins polymerize into budding-yeast spindle microtubules
    that are organized by spindle pole bodies and attach to kinetochores during mitosis.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the tubulin-polymer, spindle-pole, kinetochore and
    mitotic-spindle relationships without asserting every motor, plus-end factor,
    or microtubule-associated protein in the spindle.
