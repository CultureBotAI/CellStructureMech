  edges:
  - subject: bilbo1
    predicate: dimerizes into
    object: bilbo1_dimer
    description: The central BILBO1 coiled-coil domain forms an antiparallel dimer.
    evidence:
    - reference: DOI:10.1074/jbc.M114.554659
      notes: Vidilaseris et al. 2014 dissected BILBO1 domains and linked the coiled
        coil and leucine zipper to dimerization and filament formation.
  - subject: bilbo1_dimer
    predicate: polymerizes into
    object: bilbo1_polymer
    description: Adjacent BILBO1 leucine zippers mediate interdimer contacts that
      assemble extended filaments.
    evidence:
    - reference: DOI:10.1074/jbc.M114.554659
      notes: Vidilaseris et al. 2014 connected BILBO1 leucine-zipper interdimer interactions
        with extended in-vitro filament assembly.
  - subject: bilbo1_polymer
    predicate: scaffolds
    object: ciliary_pocket_collar
    description: BILBO1 polymers form a molecular skeleton for the flagellar pocket
      collar.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1004654
      notes: Florimond et al. 2015 showed that BILBO1 has intrinsic polymer-forming
        properties and that its coiled-coil domain targets BILBO1 to the FPC.
  - subject: fpc4
    predicate: binds
    object: bilbo1
    description: The FPC4 C-terminal BILBO1-binding domain binds the BILBO1 N-terminal
      domain.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1006710
      notes: Albisetti et al. 2017 identified FPC4 as a BILBO1 partner and mapped
        the interaction to the FPC4 C-terminal domain and BILBO1 N-terminal domain.
  - subject: fpc4
    predicate: binds
    object: microtubules
    description: The FPC4 N-terminal domain binds microtubules in vitro, while full-length
      FPC4 localizes across the FPC, hook complex and proximal microtubule-quartet
      region.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1006710
      notes: Albisetti et al. 2017 localized FPC4 to the FPC and hook complex, noted
        possible proximal microtubule-quartet localization, and found that the FPC4
        N-terminal domain binds microtubules.
  - subject: bilbo2
    predicate: binds
    object: fpc4
    description: BILBO2 shares an N-terminal fold with BILBO1 and uses that domain
      to bind the FPC4 BILBO1-binding domain in the FPC complex.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1009329
      notes: Isch et al. 2021 demonstrated BILBO1, BILBO2 and FPC4 interactions and
        solved the BILBO2 NTD-FPC4 complex.
  - subject: ciliary_pocket_collar
    predicate: is required for
    object: flagellar_pocket_biogenesis
    description: Loss of the core FPC scaffold BILBO1 prevents assembly of new flagellar
      pocket structures.
    evidence:
    - reference: DOI:10.1371/journal.pbio.0060105
      notes: Bonhivers et al. 2008 showed that BILBO1 RNAi prevents new FPC and flagellar
        pocket biogenesis in procyclic trypanosomes.
discussions:
- discussion_id: fpc_family_grounding
  prompt: Can BILBO1, BILBO2 or FPC4 be grounded to exact whole-protein families?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#bilbo1
  - components#bilbo2
  - components#fpc4
  rationale: InterPro currently resolves only the BILBO N-terminal domain term InterPro:IPR040747
    / Pfam:PF18281 from the BILBO-family search used for this record. The domain is
    shared by BILBO1 and BILBO2 and should not be asserted as a whole-protein family
    for either component; no exact FPC4 family accession was curated.
  posed_by: claude
