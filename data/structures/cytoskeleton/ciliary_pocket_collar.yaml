components:
- component_id: bilbo1
  label: BILBO1 flagellar pocket collar scaffold
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - BILBO1
  essentiality: ESSENTIAL
  role: A calcium-binding, polymer-forming scaffold protein that forms the first characterized
    framework for the trypanosome FPC.
  evidence:
  - reference: DOI:10.1371/journal.pbio.0060105
    notes: Bonhivers et al. 2008 identified BILBO1 as a Trypanosoma brucei flagellar
      pocket cytoskeletal protein and showed that BILBO1 RNAi blocks new FPC and flagellar-pocket
      biogenesis.
  - reference: DOI:10.1371/journal.ppat.1004654
    notes: Florimond et al. 2015 showed that the BILBO1 coiled-coil domain can target
      BILBO1 to the FPC and is sufficient to drive BILBO1 polymer formation.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro:IPR040747 / Pfam:PF18281 covers the BILBO1 N-terminal
    domain rather than a full-length BILBO1 protein family, and it also occurs in
    BILBO2. No exact source-neutral BILBO1 whole-protein CURIE was curated.
- component_id: fpc4
  label: FPC4 microtubule-binding FPC protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - FPC4
  role: A BILBO1-interacting protein that localizes to the FPC and hook complex and
    links the collar to microtubule-associated cytoskeletal elements.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006710
    notes: Albisetti et al. 2017 identified FPC4 as a BILBO1 partner whose C-terminal
      domain interacts with the BILBO1 N-terminal domain and whose N-terminal domain
      binds microtubules.
  - reference: DOI:10.1074/jbc.RA119.010768
    notes: Vidilaseris et al. 2020 mapped the BILBO1 N-terminal-domain surface used
      by the FPC4 BILBO1-binding domain.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam or NCBIfam accession for
    the complete FPC4 protein family was curated.
- component_id: bilbo2
  label: BILBO2 flagellar pocket collar partner
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - BILBO2
  - Tb927.6.3240
  role: A second BILBO-family FPC component that partners with BILBO1 and FPC4 in
    a tripartite FPC protein complex.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1009329
    notes: Isch et al. 2021 characterized BILBO2/Tb927.6.3240 as a BILBO1 partner
      and FPC component whose N-terminal domain also binds the FPC4 BILBO1-binding
      domain.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro:IPR040747 / Pfam:PF18281 denotes the shared BILBO N-terminal
    domain, not the complete BILBO2 family. No exact source-neutral BILBO2 whole-protein
    CURIE was curated.
taxonomic_distribution:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  presence: COMMON
  note: The BILBO1/FPC4/BILBO2 collar has been characterized at the flagellar pocket
    neck in Trypanosoma brucei.
  reference: DOI:10.3390/cells5010009
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: Trypanosome model in which BILBO1 RNAi established that FPC assembly is required
    for flagellar-pocket biogenesis.
  reference: DOI:10.1371/journal.pbio.0060105
functions:
- function_id: flagellar_pocket_neck_scaffold
  label: flagellar pocket neck scaffolding
  description: The FPC forms a cytoskeletal collar at the flagellar pocket neck where
    the flagellum exits the cell body.
  evidence:
  - reference: DOI:10.3390/cells5010009
    notes: Perdomo et al. 2016 reviewed the T. brucei FPC as an essential cytoskeletal
      component at the neck of the flagellar pocket.
- function_id: flagellar_pocket_biogenesis
  label: flagellar pocket biogenesis
  description: BILBO1-dependent FPC assembly supplies a cytoskeletal framework required
    to build the trypanosome flagellar pocket.
  evidence:
  - reference: DOI:10.1371/journal.pbio.0060105
    notes: Bonhivers et al. 2008 showed that BILBO1 RNAi prevents formation of new
      FPC and FP structures in procyclic T. brucei and is lethal in procyclic and
      bloodstream forms.
- function_id: pocket_hook_microtubule_coupling
  label: pocket-hook microtubule association
  description: FPC4 binds microtubules in vitro and localizes at the interface of
    the FPC, hook complex and proximal microtubule quartet.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006710
    notes: Albisetti et al. 2017 localized FPC4 to the FPC, hook complex and possible
      proximal microtubule quartet and separately found that its N-terminal domain
      binds microtubules.
evidence:
- reference: DOI:10.1371/journal.pbio.0060105
  notes: Bonhivers et al. 2008, Biogenesis of the trypanosome endo-exocytotic organelle
    is cytoskeleton mediated, PLoS Biology.
- reference: DOI:10.1371/journal.ppat.1004654
  notes: Florimond et al. 2015, BILBO1 is a scaffold protein of the flagellar pocket
    collar in the pathogen Trypanosoma brucei, PLOS Pathogens.
- reference: DOI:10.3390/cells5010009
  notes: Perdomo, Bonhivers and Robinson 2016, The Trypanosome Flagellar Pocket Collar
    and Its Ring Forming Protein-TbBILBO1, Cells.
- reference: DOI:10.1371/journal.ppat.1006710
  notes: Albisetti et al. 2017, Interaction between the flagellar pocket collar and
    the hook complex via a novel microtubule-binding protein in Trypanosoma brucei,
    PLOS Pathogens.
- reference: DOI:10.1371/journal.ppat.1009329
  notes: Isch et al. 2021, Structural and functional studies of the first tripartite
    protein complex at the Trypanosoma brucei flagellar pocket collar, PLOS Pathogens.
- reference: DOI:10.1074/jbc.M114.554659
  notes: Vidilaseris et al. 2014, Assembly mechanism of Trypanosoma brucei BILBO1,
    a multidomain cytoskeletal protein, Journal of Biological Chemistry.
- reference: DOI:10.1074/jbc.RA119.010768
  notes: Vidilaseris et al. 2020, Crystal structure of the N-terminal domain of the
    trypanosome flagellar protein BILBO1 reveals a ubiquitin fold with a long structured
    loop for protein binding, Journal of Biological Chemistry.
causal_graphs:
- graph_id: bilbo1_fpc4_bilbo2_collar_assembly
  title: BILBO1 polymers recruit partner proteins at the FPC
  description: BILBO1 dimerizes and polymerizes into a scaffold at the flagellar pocket
    collar. FPC4 binds the BILBO1 N-terminal domain and microtubules, while BILBO2
    adds a second BILBO-family FPC component that shares the FPC4 binding interface.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
