identifier: GO:1990900
label: ciliary pocket collar
structure_category: CYTOSKELETON
structure_kind: MULTIPROTEIN_COMPLEX
definition: A constriction site at the junction of the plasma, flagellar and flagellar
  pocket membranes where the flagellum emerges from the cell body. Observed in some
  unicellular eukaryotic species such as Chlamydomonas, Giardia and Trypanosoma.
definition_source: GO:1990900
mapping_status: PROPOSED
