causal_graphs:
- graph_id: astral_microtubule_mechanism
  title: Astral microtubule nucleation and cortical dynein-driven spindle orientation
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: S. pombe meiotic-prophase radial-array organization. Hrs1-dependent
    rMTOC assembly is upstream organizing context, not an assertion that the whole
    center or SPB is an array constituent. Tomography, immunolocalization and deletion
    phenotypes support minus-end organization; a purified Hrs1 bridge, nucleation
    sufficiency and universal microtubule counts are not established.
  description: Gamma-tubulin complexes at the cytoplasmic face of the spindle pole
    nucleate astral microtubules whose dynamic plus ends engage cortical capture factors
    and dynein motors to pull and align the mitotic spindle toward the bud neck or
    division site.
  nodes:
  - node_id: center_assembly
    label: Hrs1-dependent rMTOC assembly
    node_type: BIOLOGICAL_PROCESS
  - node_id: rmtoc
    label: Radial microtubule organizing center near the SPB
    node_type: STRUCTURE
  - node_id: minus_ends
    label: Radial organization of microtubule minus ends
    node_type: STATE
