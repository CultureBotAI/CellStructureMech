  edges:
  - subject: center_assembly
    predicate: generates
    object: rmtoc
    description: Hrs1-dependent assembly establishes the transient radial organizing
      center.
    evidence:
    - reference: DOI:10.1016/j.cub.2012.02.042
      notes: 'Results sections 2.1-2.2: Hrs1 immunolabels the amorphous region, whereas
        hrs1 deletion removes that region and the radial arrangement despite residual
        SPB-associated microtubules.'
  - subject: rmtoc
    predicate: supports
    object: minus_ends
    description: The organizing region arranges array microtubule minus ends near,
      but outside, the SPB core.
    evidence:
    - reference: DOI:10.1016/j.cub.2012.02.042
      notes: Tomography places predominantly capped ends in the cytoplasmic rMTOC
        region; gamma-tubulin enrichment and its altered localization after hrs1 deletion
        support the organizing-center interpretation, not purified nucleation or attachment
        sufficiency.
  - subject: minus_ends
    predicate: organizes
    object: haa
    description: Spatial organization of microtubule minus ends establishes the radial
      array geometry.
    evidence:
    - reference: DOI:10.1016/j.cub.2012.02.042
      notes: Wild-type-Hrs1 tomograms show varied microtubule orientations around
        the center; hrs1 deletion loses radial organization. Residual nonradial microtubules
        are not a retained normal HAA.
  - subject: alpha
    predicate: contributes_to
    object: microtubule
    description: Alpha tubulin supplies one subunit class of the microtubule polymer.
    evidence:
    - reference: GO:0005874
      notes: Generic microtubule composition supports this class-level edge; Figure
        4A of the primary study separately establishes Atb2 localization in this array.
  - subject: beta
    predicate: contributes_to
    object: microtubule
    description: Beta tubulin supplies the other subunit class of the microtubule
      polymer.
    evidence:
    - reference: GO:0005874
      notes: This is class-level polymer composition, not an isoform-specific HAA
        experiment or a claim about beta-tubulin essentiality.
  - subject: microtubule
    predicate: contributes_to
    object: haa
    description: Astral microtubules form the array framework.
    evidence:
    - reference: DOI:10.1016/j.cub.2012.02.042
      notes: Tomography in Figure 1 and live-cell Atb2 imaging in Figure 4 establish
        a multi-microtubule array. The whole array is not one filament, a spindle
        or its organizing center.
