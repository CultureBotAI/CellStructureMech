canonical_examples:
- taxon_id: NCBITaxon:4896
  taxon_label: Schizosaccharomyces pombe
  reference: DOI:10.1016/j.cub.2012.02.042
  note: Characterized model system for astral microtubule (GO:0000235) within the
    cytoplasmic astral microtubule array radiating from the spindle pole. Characterized
    model system for aster (GO:0005818) in the radial astral microtubule aster. Meiotic-prophase
    arrays studied in homothallic cells, including endogenously tagged Hrs1 and mCherry-Atb2
    strain KT2901 for Figure 4A, and separately in synchronized pat1 mat-Pc diploids
    for ultrastructure. No fungal-wide prevalence or identity with the UniProt reference
    stock is asserted.
functions:
- function_id: horsetail_movement
  label: dynein-driven meiotic oscillatory nuclear movement
  grounding: GO:0030989
  description: Mediated by aster (GO:0005818) in the radial astral microtubule aster.
    Provides the radial microtubule array that leads spindle-pole and nuclear oscillations
    during S. pombe meiotic prophase, acting with dynein-dynactin machinery. Mediated
    by astral microtubule (GO:0000235) within the cytoplasmic astral microtubule array
    radiating from the spindle pole.
  evidence:
  - reference: GO:0032117
    notes: The exact structure definition specifies facilitation of horsetail nuclear
      movement.
  - reference: DOI:10.1016/j.cub.2005.07.058
    notes: 'Readable primary abstract: Hrs1 loss impairs HAA formation and compromises
      horsetail movement; ectopic Hrs1 produces HAA-like arrays and nuclear oscillation
      in interphase. Full text was not accessible, so no detailed motor-interface
      or quantitative claim is extracted.'
  - reference: DOI:10.1016/j.cub.2012.02.042
    notes: The main-text study follows the Hrs1-dependent radial array during meiotic
      prophase and its replacement at meiosis I. Chromosome pairing and recombination
      are not asserted as directly quantified array-only outcomes here.
