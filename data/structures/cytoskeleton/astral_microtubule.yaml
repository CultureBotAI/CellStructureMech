identifier: GO:0000235
label: astral microtubule
structure_category: CYTOSKELETON
structure_kind: FILAMENT
definition: Any of the spindle microtubules that radiate in all directions from the
  spindle poles and are thought to contribute to the forces that separate the poles
  and position them in relation to the rest of the cell. In yeasts, fungi, and microbial
  eukaryotes, cytoplasmic astral microtubules nucleated from the outer plaque of the
  spindle pole body or centrosome probe the cell cortex via plus-end tracking proteins
  (Kar9, Bim1/EB1, Bik1) and cortical dynein-dynactin to orient the mitotic spindle
  along the division axis.
