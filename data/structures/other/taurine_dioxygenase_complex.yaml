identifier: GO:1990205
label: taurine dioxygenase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex capable of catalyzing the conversion of taurine and
  alpha-ketoglutarate to sulfite, aminoacetaldehyde and succinate under sulfur or
  cysteine starvation conditions. Its expression is repressed by the presence of sulfate
  or cysteine. In E. coli it is a homodimer or homotetramer of the protein TauD.
