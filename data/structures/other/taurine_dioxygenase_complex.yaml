- discussion_id: do_not_assert_fixed_taud_oligomer_count
  prompt: Should the taurine dioxygenase complex assert one fixed dimer or tetramer
    stoichiometry?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: No. GO:1990205 defines E. coli TauD as a homodimer or homotetramer, while
    PDB:1OS7 contains separate homodimeric biological assemblies. This record cites
    the PDB-specific dimer measurement but leaves the class-level TauD homo-oligomer
    boundary flexible.
  evidence:
  - reference: GO:1990205
    notes: GO:1990205 defines the E. coli taurine dioxygenase complex as homodimeric
      or homotetrameric.
  - reference: PDB:1OS7
    notes: RCSB describes the PDB:1OS7 TauD biological assemblies as dimeric E. coli
      assemblies.
  posed_by: codex
  posed_date: '2026-10-01'
