definition: A protein complex that forms a subcomplex of the 90S preribosome and is
  required for the subsequent assembly of the rest of the preribosome. In S. cerevisiae,
  it is composed of Utp5p, Utp4p, Nan1p, Utp8p, Utp9p, Utp10 and Utp15p.
