- discussion_id: resolve_t_utp_family_groundings
  prompt: Resolve exact source-neutral family groundings for the Utp5, Utp4, Nan1,
    Utp8, Utp9, Utp10 and Utp15 constituents of the t-UTP complex.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#utp5_t_utp_subunit
  - components#utp4_t_utp_subunit
  - components#nan1_t_utp_subunit
  - components#utp8_t_utp_subunit
  - components#utp9_t_utp_subunit
  - components#utp10_t_utp_subunit
  - components#utp15_t_utp_subunit
  rationale: GO:0034455 uses Saccharomyces gene-product names while noting that analogous
    complexes in other eukaryotes can use the term. Exact cross-eukaryotic InterPro,
    Pfam, NCBIfam or UniProt family boundaries for the seven t-UTP proteins need narrower
    follow-up curation before these component labels can be grounded.
  evidence:
  - reference: GO:0034455
    notes: The GO:0034455 comment explains that the term name uses Saccharomyces gene-product
      names because no other names had arisen for the complex.
