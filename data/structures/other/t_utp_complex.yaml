functions:
- function_id: 90s_preribosome_assembly
  label: 90S preribosome assembly
  grounding: GO:0034463
  description: The t-UTP complex forms a subcomplex of the 90S preribosome and acts
    as an essential early assembly subunit for later recruitment of other 90S-preribosome
    modules.
  evidence:
  - reference: GO:0034455
    notes: GO:0034455 defines t-UTP as a subcomplex required for subsequent assembly
      of the rest of the 90S preribosome.
  - reference: GO:0034463
    notes: GO:0034463 is the Gene Ontology biological-process term for 90S preribosome
      assembly.
  - reference: DOI:10.1128/MCB.00380-07
    notes: Perez-Fernandez et al. 2007 reported that t-UTP assembly is an essential
      step for engagement of additional 90S subunits on the 35S pre-rRNA.
