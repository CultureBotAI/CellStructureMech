- discussion_id: defer_subtype_specific_coat_components
  prompt: Resolve exact source-neutral boundaries for clathrin triskelions, COPI coatomer
    and Arf-family GTPases, COPII Sar1 and Sec coat subcomplexes, and AP/GGA or other
    cargo-adaptor modules without promoting a subtype-specific protein into the broad
    vesicle-coat parent.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
