components:
- component_id: coat_scaffold_subunits
  label: vesicle coat scaffold subunits
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Vesicle coats are a source-neutral parent over clathrin, COPI coatomer,
    and COPII Sec-family coat systems; no exact InterPro, Pfam, NCBIfam, or Complex
    Portal identifier was curated for a shared vesicle-coat scaffold family in this
    pass.
  role: Protein subunits or coat subcomplexes that build the protein scaffold on a
    coated-vesicle membrane.
  evidence:
  - reference: GO:0030120
    notes: GO:0030120 defines a vesicle coat as a membrane coat found on a coated
      vesicle.
  - reference: GO:0030125
    notes: GO:0030125 places clathrin vesicle coats under the vesicle coat parent.
  - reference: GO:0030126
    notes: GO:0030126 places COPI vesicle coats under the vesicle coat parent.
  - reference: GO:0030127
    notes: GO:0030127 places COPII vesicle coats under the vesicle coat parent and
      names the budding-yeast COPII coat subunits.
- component_id: coat_recruitment_and_cargo_selection_factors
  label: vesicle coat recruitment and cargo-selection factors
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Clathrin adaptors, COPI Arf-family GTPases, and COPII Sar1/Sec
    proteins are subtype-specific coat constituents or cargo-selection factors. No
    exact InterPro, Pfam, NCBIfam, Complex Portal, or GO identifier was curated for
    a shared source-neutral vesicle-coat recruitment module in this pass.
  role: Subtype-specific adaptor proteins, adaptor complexes, and small GTPases that
    recruit or connect vesicle-coat scaffolds to donor membranes and cargo during
    coat assembly.
  evidence:
  - reference: GO:0030119
    notes: GO:0030119 places AP-type membrane coat adaptor complexes as part of the
      broader membrane coat.
  - reference: DOI:10.1016/j.devcel.2005.04.014
    notes: Newpher et al. 2005 measured adaptor-dependent clathrin recruitment in
      yeast endocytosis.
  - reference: DOI:10.1016/0092-8674(91)90176-y
    notes: Serafini et al. 1991 identified ADP-ribosylation factor as a subunit of
      Golgi-derived COP-coated vesicle coats.
  - reference: DOI:10.1016/0092-8674(94)90138-4
    notes: Barlowe et al. 1994 identified Sar1p, Sec23p, Sec24p, Sec13p, and Sec31p
      as COPII Sec proteins that drive ER vesicle budding.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding yeast has experimentally characterized COPII coats that assemble from
    Sar1p, Sec23p, Sec24p, Sec13p, and Sec31p during ER transport-vesicle budding.
  reference: DOI:10.1016/0092-8674(94)90138-4
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Budding yeast is an archetypal COPII vesicle-coat model in which Sar1p, Sec13p,
    Sec31p, Sec23p, and Sec24p were identified as Sec proteins that drive ER transport-vesicle
    budding.
  reference: DOI:10.1016/0092-8674(94)90138-4
functions:
- function_id: vesicle_coat_assembly
  label: vesicle coating
  grounding: GO:0006901
  description: Vesicle coats form when coat proteins assemble on donor membranes during
    coated-transport-vesicle formation.
  evidence:
  - reference: GO:0006901
    notes: GO:0006901 denotes the addition of coat proteins to a membrane during transport-vesicle
      formation.
  - reference: GO:0035964
    notes: GO:0035964 defines COPI-coated vesicle budding as evagination of a Golgi
      membrane to form a COPI-coated vesicle.
  - reference: GO:0090114
    notes: GO:0090114 defines COPII-coated vesicle budding as evagination of an ER
      membrane to form a COPII-coated vesicle.
  - reference: GO:0072583
    notes: GO:0072583 denotes clathrin-dependent endocytic uptake through clathrin-coated
      pits that form clathrin-coated endocytic vesicles.
  - reference: DOI:10.1016/j.cell.2005.09.024
    notes: Kaksonen, Toret and Drubin 2005 analyzed the modular clathrin- and actin-mediated
      endocytic machinery in yeast.
