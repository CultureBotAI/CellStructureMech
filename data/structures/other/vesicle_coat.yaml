  - subject: coat_recruitment_and_cargo_selection_factors
    predicate: helps recruit
    object: coat_scaffold_subunits
    description: Subtype-specific adaptors, cargo selectors, and small GTPases connect
      clathrin, COPI, or COPII coat scaffolds to donor membranes or cargo during vesicle
