  - components#coat_recruitment_and_cargo_selection_factors
  rationale: The broad vesicle coat parent spans clathrin, COPI, and COPII coats.
    Those coats use different scaffold proteins, small GTPases, and cargo adaptors,
    so this record keeps the parent coarse and leaves exact subtype composition to
    child records.
