  title: Coat scaffold proteins assemble on nascent vesicles
  description: Vesicle-coat scaffold proteins and subtype-specific recruitment or
    cargo-selection factors assemble on donor membranes into protein coats that cover
    coated vesicle membranes during transport-vesicle formation.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the shared coated-vesicle-coat boundary without
    asserting clathrin triskelion geometry, a single universal adaptor or small-GTPase
    module, COPI coatomer subunits, COPII Sec subcomplex topology, or subtype-specific
    cargo adaptors.
