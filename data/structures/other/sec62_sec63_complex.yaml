- discussion_id: sec62_sec63_complex_boundary
  prompt: Should Sec61-channel subunits or Kar2/BiP be included as Sec62/Sec63 complex
    components?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#sec62_translocon_subunit
  - components#sec63_translocon_subunit
  - components#sec71_translocon_subunit
  - components#sec72_translocon_subunit
  - causal_graphs#sec62_sec63_posttranslational_er_import
  rationale: GO:0031207 denotes the Sec62p/Sec63p/Sec71p/Sec72p subcomplex. The Sec61
    heterotrimer combines with it in the broader ER Sec complex, and Kar2/BiP powers
    posttranslational import from the lumen, but neither is part of the Sec62/Sec63
    tetramer.
  evidence:
  - reference: GO:0031207
    notes: GO:0031207 defines the Sec62/Sec63 complex as a four-subunit yeast subcomplex.
  - reference: GO:0031205
    notes: GO:0031205 places Sec62/Sec63 with Sec61 in the broader endoplasmic reticulum
      Sec complex.
  - reference: DOI:10.1016/0092-8674(95)90077-2
    notes: Panzner et al. 1995 used the purified Sec complex together with Kar2p to
      reconstitute posttranslational protein transport.
  resolution_note: Modeled Sec62p, Sec63p, Sec71p, and Sec72p as constituents and
    left Sec61-channel subunits and Kar2/BiP outside this subcomplex record.
  posed_by: codex
  posed_date: '2026-09-18'
