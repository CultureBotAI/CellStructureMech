  component_role: CONSTITUENT
  gene_symbols:
  - SEC62
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Sec62 is a multi-pass eukaryotic ER membrane component of the Sec62/Sec63
    tetramer; no exact source-neutral family CURIE was curated.
  role: Membrane subunit of the Sec62/Sec63 tetramer that participates in signal-sequence
    recognition during posttranslational ER import.
  evidence:
  - reference: GO:0031207
    notes: GO:0031207 defines the yeast Sec62/Sec63 complex as a tetramer containing
      Sec62p.
  - reference: DOI:10.1002/yea.954
    notes: Willer et al. 2003 studied Sec62p and Sec63p as the two essential proteins
      of the yeast tetrameric Sec62/Sec63 complex.
- component_id: sec63_translocon_subunit
  label: Sec63 translocon subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SEC63
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Sec63 is a conserved ER membrane component of the Sec62/Sec63 tetramer
    that carries a lumenal J-domain; no exact source-neutral family CURIE was curated.
  role: Core Sec62/Sec63 subunit that engages Sec62p at the cytosolic face and links
    posttranslational substrates to lumenal Kar2/BiP cycling.
  evidence:
  - reference: GO:0031207
    notes: GO:0031207 defines the yeast Sec62/Sec63 complex as a tetramer containing
      Sec63p.
  - reference: DOI:10.1002/yea.954
    notes: Willer et al. 2003 demonstrated a specific Sec62p-Sec63p interaction in
      the yeast ER Sec63 complex.
- component_id: sec71_translocon_subunit
  label: Sec71 translocon subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SEC71
  - SEC66
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Sec71 is a yeast accessory constituent of the Sec62/Sec63 tetramer,
    also called Sec66; no exact source-neutral family CURIE was curated.
  role: Accessory subunit of the yeast Sec62/Sec63 tetramer within the ER posttranslational
    translocation machinery.
  evidence:
  - reference: GO:0031207
    notes: GO:0031207 defines the yeast Sec62/Sec63 complex as a tetramer containing
      Sec71p.
  - reference: DOI:10.1038/s41586-018-0856-x
    notes: Wu et al. 2019 structurally resolved Sec71/Sec66 with Sec62p, Sec63p, and
      Sec72p in the yeast post-translational ER translocation machinery.
