functions:
- function_id: sec62_sec63_posttranslational_er_targeting
  label: Sec62/Sec63-dependent posttranslational ER protein targeting
  description: The Sec62/Sec63 complex cooperates with the Sec61 channel and Kar2/BiP
    machinery during SRP-independent posttranslational protein import into the endoplasmic
    reticulum.
  evidence:
  - reference: GO:0031207
    notes: GO:0031207 defines the Sec62/Sec63 complex by its involvement in posttranslational
      targeting of proteins to the ER.
  - reference: DOI:10.1091/mbc.e03-06-0390
    notes: Plath et al. 2004 photo-crosslinked prepro-alpha-factor to Sec62p and Sec61p
      in the yeast Sec complex during posttranslational ER import.
  - reference: DOI:10.1038/s41586-018-0856-x
    notes: Wu et al. 2019 determined a structure of the yeast ER post-translational
      protein translocation machinery.
