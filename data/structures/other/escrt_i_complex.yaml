functions:
- function_id: multivesicular_body_sorting_pathway
  label: multivesicular body sorting pathway
  grounding: GO:0071985
  description: ESCRT-I acts early in the endosomal MVB pathway to help sort ubiquitinated
    membrane cargo into multivesicular-body vesicles.
  evidence:
  - reference: GO:0071985
    notes: GO:0071985 denotes the vesicle-mediated transport pathway that moves ubiquitylated
      transmembrane proteins into multivesicular-body luminal vesicles.
  - reference: DOI:10.1016/S0092-8674(01)00434-2
    notes: Katzmann, Babst and Emr 2001 identified ESCRT-I as a conserved yeast complex
      that recognizes ubiquitinated MVB cargo and is required for MVB-vesicle sorting.
