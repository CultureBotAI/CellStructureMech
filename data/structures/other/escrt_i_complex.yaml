causal_graphs:
- graph_id: yeast_escrt_i_mvb_cargo_sorting
  title: ESCRT-I sorts ubiquitinated cargo in yeast MVBs
  description: In Saccharomyces cerevisiae, Vps23, Vps28 and Vps37 form ESCRT-I, which
    is recruited by Vps27 and acts in sorting ubiquitinated cargo into the multivesicular-body
    pathway.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph represents the Vps23/Vps28/Vps37 yeast ESCRT-I core and its
    Vps27-dependent endosomal recruitment without modeling ESCRT-II/III handoff, deubiquitination,
    or Vps4 recycling.
