identifier: GO:0005658
label: alpha DNA polymerase:primase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex of four polypeptides, comprising large and small DNA polymerase
  alpha subunits and two primase subunits, which are capable of catalyzing the synthesis
  of an RNA primer on the lagging strand of replicating DNA and the subsequent synthesis
  of a small stretch of DNA.
