identifier: GO:0033565
label: ESCRT-0 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex required for the recycling of Golgi proteins, formation
  of lumenal membranes and sorting of ubiquitinated proteins into those membranes.
  This complex includes Vps1p and Hse1p in yeast and the Hrs and STAM proteins in
  mammals.
