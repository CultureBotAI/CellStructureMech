components:
- component_id: spitzenkorper_secretory_vesicles
  label: Spitzenkorper secretory vesicles
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Secretory microvesicles and macrovesicles are grouped by their
    Spitzenkorper-localized pool; no exact GO or protein-family CURIE was curated
    for the two vesicle classes in this pass.
  role: Post-Golgi secretory vesicles concentrated in distinct Spitzenkorper layers
    before delivery to the apical plasma membrane.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2009.06917.x
    notes: Verdin et al. 2009 localized Neurospora crassa microvesicle and macrovesicle
      markers to distinct Spitzenkorper layers.
  - reference: DOI:10.1038/s41467-020-16712-9
    notes: Zheng et al. 2020 followed Neurospora post-Golgi microvesicle and macrovesicle
      markers at the Spitzenkorper.
- component_id: spitzenkorper_actin_filaments
  label: Spitzenkorper actin filaments
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: F-actin is modeled as a Spitzenkorper-localized filament pool rather
    than as a single actin protein family.
  role: Actin filaments in the Spitzenkorper core that participate in polarized vesicle
    organization at the hyphal apex.
  evidence:
  - reference: DOI:10.1016/j.mib.2014.04.003
    notes: Riquelme and Sanchez-Leon 2014 reviewed the Spitzenkorper as a multicomponent
      structure that includes cytoskeletal elements.
  - reference: DOI:10.1038/s41467-020-16712-9
    notes: Zheng et al. 2020 assayed Spitzenkorper F-actin and its scaffold-dependent
      organization in Neurospora crassa.
- component_id: spitzenkorper_scaffold_proteins
  label: Spitzenkorper scaffold proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SPA-2
  - JNS-1
  - LAH-2
  - SPZ-1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SPA-2/JNS-1 and LAH-2/SPZ-1 are Neurospora Spitzenkorper-localized
    scaffold or adaptor proteins; no source-neutral accession for the whole scaffold
    cohort was curated.
  role: Protein scaffolds and adaptors that reside at the Spitzenkorper and recruit
    polarity effectors in Neurospora crassa.
  evidence:
  - reference: DOI:10.1038/s41467-020-16712-9
    notes: Zheng et al. 2020 identified SPA-2/JNS-1 and LAH-2 scaffold modules transported
      to the Spitzenkorper by MYO-5 via SPZ-1.
taxonomic_distribution:
- taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  presence: VARIABLE
  note: Recognizable Spitzenkorper occur in diverse hyphal fungi and organize tip
    growth, but they are not asserted here to be universal across all fungal lineages
    or growth states.
  reference: DOI:10.1128/MMBR.00068-17
canonical_examples:
- taxon_id: NCBITaxon:5141
  taxon_label: Neurospora crassa
  note: Filamentous-fungal model in which SPA-2/JNS-1 and LAH-2 scaffold modules of
    the Spitzenkorper have been experimentally dissected.
  reference: DOI:10.1038/s41467-020-16712-9
functions:
- function_id: hyphal_tip_growth_organization
  label: hyphal tip-growth organization
  description: The Spitzenkorper acts as a vesicle supply center that organizes polarized
    secretion for fungal hyphal extension.
  evidence:
  - reference: DOI:10.1016/j.mib.2014.04.003
    notes: Riquelme and Sanchez-Leon 2014 reviewed the Spitzenkorper as a fungal hyphal
      growth and morphogenesis organizer.
  - reference: DOI:10.1128/MMBR.00068-17
    notes: Riquelme et al. 2018 review polarized hyphal growth and Spitzenkorper-associated
      vesicle traffic in fungal morphogenesis.
