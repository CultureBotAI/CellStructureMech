canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  reference: DOI:10.1186/s13059-015-0766-2
  note: Characterized model system for chromosome, subtelomeric region (GO:0099115)
    within the heterochromatic chromosome, subtelomeric region adjacent to the telomere.
    Budding yeast studied in W303 and BY backgrounds. Central hyperclusters in density-enriched
    quiescent populations and peripheral clusters under other published conditions
    are retained as distinct observations, not forced into one nuclear position.
- taxon_id: NCBITaxon:4896
  taxon_label: Schizosaccharomyces pombe
  reference: DOI:10.1093/nar/gkaa043
  note: Characterized model system for chromosome, subtelomeric region (GO:0099115)
    within the heterochromatic chromosome, subtelomeric region adjacent to the telomere.
    Nitrogen-starved fission yeast forms a predominantly single bright telomeric focus
    near the nuclear envelope; clustering and envelope attachment are experimentally
    separable.
functions:
- function_id: telomere_organization
  label: telomere organization
  grounding: GO:0032200
  description: Spatial grouping of chromosome ends and associated chromatin during
    quiescence. Mediated by chromosome, subtelomeric region (GO:0099115) within the
    heterochromatic chromosome, subtelomeric region adjacent to the telomere.
  evidence:
  - reference: DOI:10.1186/s13059-015-0766-2
    notes: Microscopy and chromosome-contact maps support chromosome-end reorganization.
  - reference: DOI:10.1093/nar/gkaa043
    notes: Fission-yeast microscopy supports a quiescent redistribution of telomere
      foci; envelope-dependent TERRA regulation is not assigned to clustering alone.
causal_graphs:
- graph_id: chromosome_subtelomeric_region_mechanism
  title: Subtelomeric heterochromatin assembly and Sir3-dependent spatial coalescence
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Physiological and perturbation evidence in S. cerevisiae, not a universal
    fungal pathway. Sir3 requirement is distinct from a claim that increased Sir3-mediated
    attraction drives the transition; the 2026 anchoring model is recorded separately
    with its access limitation.
  nodes:
  - node_id: starvation
    label: Starvation after respiratory growth
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: assembly
    label: Telomere hypercluster formation
    node_type: BIOLOGICAL_PROCESS
  - node_id: sir3
    label: Sir3-like silencing protein
    node_type: GENE_OR_PROTEIN
    component_ref: sir3
  - node_id: h4_state
    label: Assembly-compatible histone H4 K16 state
    node_type: BIOLOGICAL_PROCESS
  - node_id: chromosome_subtelomeric_region
    label: chromosome, subtelomeric region
    node_type: STRUCTURE
    grounding: GO:0099115
    description: Assembled and functional chromosome, subtelomeric region (GO:0099115)
      operating within the heterochromatic chromosome, subtelomeric region adjacent
      to the telomere.
  edges:
  - subject: starvation
    predicate: stimulates
    object: assembly
    description: Prior respiratory growth favors efficient formation after starvation;
      arrest alone is insufficient and maturation depends on protocol.
    evidence:
    - reference: DOI:10.1186/s13059-015-0766-2
      notes: Carbon-exhaustion, abrupt-starvation and respiration perturbations distinguish
        metabolic history from slow growth alone.
    - reference: DOI:10.1101/gr.279874.124
      notes: Density-enriched post-diauxic cells transferred to water also form hyperclusters.
  - subject: sir3
    predicate: supports
    object: assembly
    description: Sir3 supports normal hypercluster formation in the tested budding-yeast
      backgrounds.
    evidence:
    - reference: DOI:10.1186/s13059-015-0766-2
      notes: Deletion and chromosome-contact experiments support the assembly requirement,
        without proving increased protein abundance.
  - subject: h4_state
    predicate: supports
    object: assembly
    description: An intact H4 tail and compatible K16 state support formation; K16A
      and K16Q impair it whereas K16R permits it.
    evidence:
    - reference: DOI:10.1091/mbc.E16-01-0069
      notes: Histone substitutions support a chromatin-state contribution, not direct
        observation of an exact Sir3 bridging reaction.
  - subject: assembly
    predicate: organizes
    object: chromosome_subtelomeric_region
    description: Sir3- and histone H4 K16-dependent silent chromatin assembly organizes
      the chromosome subtelomeric region.
    evidence:
    - reference: DOI:10.1186/s13059-015-0766-2
      notes: Subtelomeric Y-prime FISH and chromosome-conformation capture demonstrate
        Sir3-dependent organization of subtelomeric regions.
  description: Histone H4 K16 state and Sir2/Sir3/Sir4 silent-chromatin proteins assemble
    on subtelomeric nucleosomes to organize the chromosome subtelomeric region and
    drive quiescent chromosome-end coalescence.
evidence:
- reference: GO:0099115
  notes: 'Gene Ontology cellular-component term for chromosome, subtelomeric region:
    The chromosomal region immediately adjacent to a telomere, including subtelomeric
    DNA elements (such as X and Y'' repeats in budding yeast) and associated nucleosomal
    heterochromatin.'
- reference: DOI:10.1186/s13059-015-0766-2
  notes: Supports the context, composition, and mechanism of chromosome, subtelomeric
    region (GO:0099115) within the heterochromatic chromosome, subtelomeric region
    adjacent to the telomere. Guidi et al. 2015, PMID 26399229; native PMC4581094.1
    Results, Discussion and relevant Methods read. Density purification, microscopy,
    3C/Hi-C and chronological-survival assays.
- reference: DOI:10.1091/mbc.E16-01-0069
  notes: Supports the context, composition, and mechanism of chromosome, subtelomeric
    region (GO:0099115) within the heterochromatic chromosome, subtelomeric region
    adjacent to the telomere. Laporte et al. 2016, PMID 27122604; native PMC4907721.1
    Results, Discussion and relevant Methods read. FISH, tagged proteins, positioning,
    chromatin perturbations and refeeding assays.
- reference: DOI:10.1093/nar/gkaa043
  notes: Supports the context, composition, and mechanism of chromosome, subtelomeric
    region (GO:0099115) within the heterochromatic chromosome, subtelomeric region
    adjacent to the telomere. Maestroni et al. 2020, PMID 31980821; native PMC7102995.1
    Results, Discussion and relevant Methods read. Nitrogen-starved fission yeast;
    clustering, attachment, telomere erosion and TERRA accumulation are distinguished.
- reference: DOI:10.1101/gr.279874.124
  notes: Supports the context, composition, and mechanism of chromosome, subtelomeric
