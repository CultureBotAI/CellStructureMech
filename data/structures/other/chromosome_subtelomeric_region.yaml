evidence:
- reference: GO:0099115
  notes: 'Gene Ontology cellular-component term for chromosome, subtelomeric region:
    The chromosomal region immediately adjacent to a telomere, including subtelomeric
    DNA elements and associated nucleosomal heterochromatin.'
- reference: DOI:10.1186/s13059-015-0766-2
  notes: Guidi et al. 2015 (Genome Biol, PMID 26399229) characterize subtelomeric
    Y-prime DNA, Rap1, Sir3, and Sir4 organization in Saccharomyces cerevisiae.
- reference: DOI:10.1091/mbc.E16-01-0069
  notes: Laporte et al. 2016 (Mol Biol Cell, PMID 27122604) establish the roles of
    Sir2, Sir3, and nucleosomal histone H4 K16 state in budding-yeast subtelomeric
    silent chromatin.
- reference: DOI:10.1093/nar/gkaa043
  notes: Maestroni et al. 2020 (Nucleic Acids Res, PMID 31980821) follow Swi6-GFP
    at the Schizosaccharomyces pombe chromosome, subtelomeric region and distinguish
    subtelomeric Swi6 heterochromatin from terminal Taz1 telomeric repeats.
