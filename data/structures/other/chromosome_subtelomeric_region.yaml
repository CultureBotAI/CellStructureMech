causal_graphs:
- graph_id: chromosome_subtelomeric_region_mechanism
  title: Subtelomeric nucleosomal heterochromatin assembly via SIR and Swi6 complexes
  description: Subtelomeric DNA (SO:0001997) packaged into nucleosomes (GO:0000786)
    recruits Rap1, Sir4, Sir2 (deacetylating histone H4 K16), and Sir3 in Saccharomyces
    cerevisiae—or Swi6 heterochromatin protein in Schizosaccharomyces pombe—to assemble
    the chromosome, subtelomeric region (GO:0099115) and mediate telomere organization
    (GO:0032200).
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Covers subtelomeric silent chromatin assembly in S. cerevisiae (Rap1-Sir2-Sir3-Sir4
    on H4K16-deacetylated nucleosomes) and S. pombe (Swi6 subtelomeric heterochromatin),
    distinct from starvation-induced multi-chromosome telomere hyperclustering.
