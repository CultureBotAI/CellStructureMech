identifier: GO:0099115
label: chromosome, subtelomeric region
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: The chromosomal region immediately adjacent to a telomere, including subtelomeric
  DNA elements (such as X and Y' repeats in budding yeast) and associated nucleosomal
  heterochromatin. In Saccharomyces cerevisiae and Schizosaccharomyces pombe, the
  chromosome, subtelomeric region is packaged into silent chromatin by histone H4
  K16 deacetylation and Sir2-Sir3-Sir4 or Swi6/HP1 complexes.
