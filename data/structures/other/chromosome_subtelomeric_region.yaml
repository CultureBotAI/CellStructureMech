- component_id: nucleosome
  label: nucleosome
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: DNA-histone packing unit of the associated subtelomeric chromatin. Functions
    within the heterochromatic chromosome, subtelomeric region adjacent to the telomere.
  grounding: GO:0000786
  evidence:
  - reference: DOI:10.1091/mbc.E16-01-0069
    notes: Histone H4 tail and K16 substitutions implicate nucleosomal chromatin in
      hypercluster formation. This is a chromatin-class assertion, not an isoform-specific
      localization or copy-number measurement.
  grounding_notes: Native GO definition specifies DNA wound around a multisubunit
    histone core. Terminal telomeric repeats are not asserted to be uniformly nucleosomal.
