        and gene identity only; the component's membership in this structure rests
        on the record's own sources.
- component_id: beta_subunits
  label: proteasome beta-type subunits
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - prcB
  stoichiometry: two inner heptameric rings
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Proteasome beta-type subunits are represented in multiple families
    across archaea, actinobacteria and eukaryotes; no single exact taxon-neutral family
    CURIE was curated.
  role: Forms the two inner rings of the 20S core and provides the N-terminal threonine
    protease active sites in the chamber.
  evidence:
  - reference: DOI:10.1042/ETLS20180025
    notes: Maupin-Furlow 2018 reviews archaeal proteasome beta subunits as the catalytic
      subunits of the 20S core.
  - reference: DOI:10.1111/j.1365-2958.2005.05036.x
    notes: Hu et al. 2006 solved the Mycobacterium tuberculosis 20S proteasome structure
      and localized active-site chemistry to the beta subunits.
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 review the eukaryotic 20S core as a barrel-shaped
      protease with beta-subunit inner rings.
