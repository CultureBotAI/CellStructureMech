synonyms:
- synonym_text: 20S proteasome
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1042/ETLS20180025
- synonym_text: 20S proteasome core particle
  synonym_type: EXACT_SYNONYM
  source: DOI:10.3389/fmolb.2019.00023
part_of:
