components:
- component_id: alpha_subunits
  label: proteasome alpha-type subunits
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - prcA
  stoichiometry: two outer heptameric rings
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Proteasome alpha-type subunits are represented in multiple families
    across archaea, actinobacteria and eukaryotes; no single exact taxon-neutral family
    CURIE was curated.
  role: Forms the two outer rings of the 20S barrel and gates substrate entry into
    the internal proteolytic chamber.
  evidence:
  - reference: DOI:10.1042/ETLS20180025
    notes: Maupin-Furlow 2018 reviews archaeal 20S proteasome core particles as alpha-
      and beta-subunit barrels.
  - reference: DOI:10.1038/emboj.2010.95
    notes: Li et al. 2010 structurally analyzed assembly and gate closure of the Mycobacterium
      tuberculosis 20S proteasome alpha ring.
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 review the eukaryotic 20S core as a barrel-shaped
      protease with alpha-subunit outer rings.
