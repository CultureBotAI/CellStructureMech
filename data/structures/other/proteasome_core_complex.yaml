identifier: GO:0005839
label: proteasome core complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A barrel-shaped self-compartmentalized protease core of proteasomes, built
  from stacked alpha- and beta-subunit rings that sequester threonine protease active
  sites in an internal chamber for protein degradation.
definition_source: GO:0005839
mapping_status: PROPOSED
