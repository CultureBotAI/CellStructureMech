    evidence:
    - reference: https://www.uniprot.org/uniprotkb/P9WHT9
      notes: UniProtKB reviewed (Swiss-Prot) entry P9WHT9, the single reviewed entry
        for gene prcB in Mycobacterium tuberculosis H37Rv. Establishes the accession
        and gene identity only; the component's membership in this structure rests
        on the record's own sources.
taxonomic_distribution:
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: COMMON
  note: 20S proteasomes are broadly conserved archaeal self-compartmentalized proteases.
  reference: DOI:10.1042/ETLS20180025
- taxon_id: NCBITaxon:201174
  taxon_label: Actinomycetota
  presence: VARIABLE
  note: Bacterial 20S proteasomes are best characterized in actinobacteria, including
    mycobacteria, but are not universal across bacteria.
  reference: DOI:10.3389/fmolb.2019.00023
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: COMMON
  note: The 20S core is the proteolytic barrel of eukaryotic proteasomes and is conserved
    in microbial eukaryotes as part of the ubiquitin-proteasome system.
  reference: DOI:10.1146/annurev-biochem-060410-150257
canonical_examples:
- taxon_id: NCBITaxon:83332
  taxon_label: Mycobacterium tuberculosis H37Rv
  note: Mycobacterial strain whose 20S core structure and gate-closure mechanism were
    solved crystallographically.
  reference: DOI:10.1038/emboj.2010.95
functions:
- function_id: proteasomal_protein_catabolism
  label: proteasomal protein catabolic process
  grounding: GO:0010498
  description: The core complex degrades unfolded proteins or peptides inside its
    enclosed proteolytic chamber.
  evidence:
  - reference: DOI:10.1042/ETLS20180025
    notes: Maupin-Furlow 2018 reviews archaeal protein degradation by proteasomes
      associated with AAA-ATPases.
  - reference: DOI:10.3389/fmolb.2019.00023
    notes: Muller et al. 2019 review bacterial proteasome core particles and activators
      in Mycobacterium tuberculosis.
- function_id: threonine_endopeptidase_activity
  label: threonine-type endopeptidase activity
  grounding: GO:0004298
  description: Beta subunit N-terminal threonines catalyze peptide-bond hydrolysis
    inside the 20S core.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2005.05036.x
    notes: Hu et al. 2006 captured the Mycobacterium tuberculosis proteasome active
      site and inhibitor interactions.
evidence:
- reference: DOI:10.1042/ETLS20180025
  notes: 'Maupin-Furlow 2018, Proteolytic systems of archaea: slicing, dicing, and
    mincing in the extreme, Emerging Topics in Life Sciences.'
- reference: DOI:10.3389/fmolb.2019.00023
  notes: Muller et al. 2019, The bacterial proteasome at the core of diverse degradation
    pathways, Frontiers in Molecular Biosciences.
- reference: DOI:10.1038/emboj.2010.95
  notes: Li et al. 2010, Structural basis for the assembly and gate closure mechanisms
    of the Mycobacterium tuberculosis 20S proteasome, The EMBO Journal.
- reference: DOI:10.1111/j.1365-2958.2005.05036.x
  notes: Hu et al. 2006, Structure of the Mycobacterium tuberculosis proteasome and
    mechanism of inhibition by a peptidyl boronate, Molecular Microbiology.
- reference: DOI:10.1146/annurev-biochem-060410-150257
  notes: Tomko and Hochstrasser 2013, Molecular Architecture and Assembly of the Eukaryotic
    Proteasome, Annual Review of Biochemistry.
causal_graphs:
- graph_id: gated_barrel_proteolysis
  title: Stacked alpha and beta rings form a gated proteolytic barrel
  description: Proteasome alpha subunits form the two outer rings of a gated barrel,
    beta subunits form the two inner proteolytic rings, and unfolded substrate entering
    the internal chamber is cleaved by beta-subunit threonine protease sites.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
