functions:
- function_id: nuclear_pore_scaffold_assembly
  label: nuclear-pore scaffold assembly
  description: The nuclear pore outer ring contributes a coat-nucleoporin scaffold
    to the assembled NPC.
  evidence:
  - reference: DOI:10.1073/pnas.0907453106
    notes: Seo et al. 2009 studied Nup120 structure and proposed how the Nup84 complex
      forms rings.
  - reference: DOI:10.1016/j.cell.2021.12.015
    notes: Akey et al. 2022 resolved the yeast nuclear pore outer-ring architecture.
