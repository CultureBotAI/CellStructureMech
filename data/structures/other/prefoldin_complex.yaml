causal_graphs:
- graph_id: prefoldin_chaperonin_substrate_delivery
  title: Prefoldin Hexamer Assembly and Chaperonin-Mediated Cytoskeletal Protein Folding
  description: Two alpha-class subunits (Pac10p, Gim5p) and four beta-class subunits
    (Pfd1p, Gim4p, Gim3p, Yke2p) assemble into the heterohexameric prefoldin complex,
    which captures nonnative actin and tubulin polypeptides and transfers them to
    cytosolic chaperonin to drive protein folding and tubulin complex assembly.
