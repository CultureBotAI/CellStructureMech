identifier: GO:0016272
label: prefoldin complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multisubunit chaperone that is capable of delivering unfolded proteins
  to cytosolic chaperonin, which it acts as a cofactor for. In humans, the complex
  is a heterohexamer of two PFD-alpha and four PFD-beta type subunits. In Saccharomyces
  cerevisiae, it also acts in the nucleus to regulate the rate of elongation by RNA
  polymerase II via a direct effect on histone dynamics.
