functions:
- function_id: protein_folding_chaperone
  label: protein folding chaperone
  grounding: GO:0044183
  description: Captures nascent or unfolded cytoskeletal polypeptides such as actin
    and tubulin and transfers them to cytosolic chaperonin (CCT/TRiC).
  evidence:
  - reference: GO:0044183
    notes: GO molecular-function term for protein folding chaperone.
  - reference: PMID:9630229
    snippet: We describe the discovery of a heterohexameric chaperone protein, prefoldin,
      based on its ability to capture unfolded actin. Prefoldin binds specifically
      to cytosolic chaperonin (c-cpn) and transfers target proteins to it.
    notes: Establishes the co-chaperone activity of prefoldin.
- function_id: protein_folding
  label: protein folding
  grounding: GO:0006457
  description: Promotes productive chaperonin-mediated folding of nonnative polypeptides
    in the crowded cytosol.
  evidence:
  - reference: GO:0006457
    notes: GO biological-process term for protein folding.
  - reference: PMID:9630229
    snippet: We show that by directing target proteins to chaperonin, prefoldin promotes
      folding in an environment in which there are many competing pathways for nonnative
      proteins.
    notes: Demonstrates prefoldin's role in promoting productive protein folding.
- function_id: tubulin_complex_assembly
  label: tubulin complex assembly
  grounding: GO:0007021
  description: Maintains functional alpha/beta-tubulin levels and supports tubulin
    complex and mitotic/meiotic spindle assembly.
  evidence:
  - reference: GO:0007021
    notes: GO biological-process term for tubulin complex assembly.
  - reference: PMID:42647631
    snippet: Loss of Gim3 causes profound defects in chromosome segregation and gamete
      viability through reduced tubulin protein levels, which are also associated
      with reduced spindle length.
    notes: Demonstrates requirement of prefoldin subunit Gim3 for tubulin abundance
      and spindle assembly.
