identifier: cellstructuremech:acrab_tolc_multidrug_efflux_transport_complex
label: AcrAB-TolC multidrug efflux transport complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An Escherichia coli tripartite multidrug efflux pump complex composed
  of AcrB inner-membrane RND transporters, AcrA periplasmic adaptor proteins, and
  the TolC outer-membrane channel that exports xenobiotics across the cell envelope.
