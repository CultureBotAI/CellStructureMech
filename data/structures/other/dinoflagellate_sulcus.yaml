discussions:
- discussion_id: resolve_sulcus_molecular_constituents
  prompt: Add sulcus molecular components only after directly localized constituents
    and exact source-neutral family groundings have been identified.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO defines the dinoflagellate sulcus as a cell-surface furrow and places
    it in Dinophyceae, but this pass did not find exact family-level evidence for
    sulcus-specific molecular constituents.
  evidence:
  - reference: GO:0097612
  - reference: PMID:7002229
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: sulcal_notch_is_narrower
  prompt: Keep dinoflagellate sulcal notch separate from the general dinoflagellate
    sulcus unless curating the narrower GO:0097618 class.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0097618 is a child of GO:0097612 for a sulcus that extends to the
    posterior antapex and makes the hypocone appear bilobed, so it should not be folded
    into this general sulcus record as an exact synonym or duplicate identifier.
  evidence:
  - reference: GO:0097612
  - reference: GO:0097618
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:0097612 as the general dinoflagellate sulcus and leave
    the sulcal notch for separate GO:0097618 curation.
