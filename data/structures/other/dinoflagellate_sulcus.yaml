identifier: GO:0097612
label: dinoflagellate sulcus
structure_category: OTHER
structure_kind: SUBCELLULAR_REGION
definition: A cell surface furrow that occurs on the ventral side of a dinoflagellate
  cell. It partially houses the longitudinal flagellum. The sulcus intersects with
  the cingulum on the ventral side of a dinoflagellate cell.
