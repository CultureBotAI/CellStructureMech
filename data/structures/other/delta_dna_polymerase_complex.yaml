discussions:
- discussion_id: resolve_pol_delta_subunit_groundings
  prompt: Resolve exact source-neutral family groundings for the Pol3, Pol31, and
    Pol32 subunit classes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#pol3_catalytic_subunit
  - components#pol31_subunit
  - components#pol32_subunit
  rationale: GO:0043625 exactly identifies the delta DNA polymerase complex and primary
    Saccharomyces evidence directly supports the Pol3, Pol31 and Pol32 subunits, but
    exact source-neutral InterPro, Pfam, NCBIfam or UniProtKB family CURIEs were not
    curated in this pass.
  evidence:
  - reference: GO:0043625
    notes: GO:0043625 defines the Saccharomyces form of the complex as having three
      different subunits.
  - reference: PMID:9677406
    notes: Burgers and Gerik reconstituted Pol delta from POL3, POL31 and POL32.
  posed_by: codex
  posed_date: '2026-09-27'
- discussion_id: use_monomeric_pol_delta_assembly
  prompt: Represent Saccharomyces cerevisiae DNA polymerase delta as a monomeric Pol3/Pol31/Pol32
    heterotrimer rather than a dimer of heterotrimers.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - GO:0043625
  rationale: The GO definition for GO:0043625 still says that the active Saccharomyces
    enzyme is a dimer of heterotrimers. Johansson et al. revisited that earlier gel-filtration
    model with gel filtration, glycerol-gradient sedimentation, analytical equilibrium
    centrifugation, and two-hybrid analyses and concluded that the Pol3/Pol31/Pol32
    assembly is monomeric.
  evidence:
  - reference: PMID:9677406
    notes: Burgers and Gerik proposed a dimer of heterotrimers for Saccharomyces cerevisiae
      Pol delta.
  - reference: PMID:11568188
    notes: Johansson et al. reassessed the quaternary structure and concluded Pol
      delta is monomeric.
  resolution_note: The record lists Pol3, Pol31 and Pol32 once and does not curate
    a dimeric stoichiometry row.
  posed_by: codex
  posed_date: '2026-09-27'
