identifier: GO:0043625
label: delta DNA polymerase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multimeric DNA polymerase enzyme complex whose subunit composition differs
  among species and that functions in DNA replication, mismatch repair, and excision
  repair; in Saccharomyces cerevisiae, DNA polymerase delta contains Pol3, Pol31,
  and Pol32 subunits.
