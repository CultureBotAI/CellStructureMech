  edges:
  - subject: bam_a
    predicate: organizes with
    object: bam_b_to_e_lipoproteins
    description: BamA directly binds BamB and the BamCDE subcomplex to form the bacterial
      Bam protein complex.
    evidence:
    - reference: GO:1990063
      notes: The GO Bam protein complex definition states that E. coli BamA interacts
        directly with BamB and with the BamCDE subcomplex.
  - subject: bam_a
    predicate: forms core of
    object: bam_complex
    description: BamA contributes the membrane-embedded beta barrel and the periplasmic
      POTRA domains at the center of the BAM machine.
    evidence:
    - reference: DOI:10.1038/nature17199
      notes: Gu et al. 2016 resolved the BamA barrel and POTRA domains within E. coli
        BAM structures.
  - subject: bam_b_to_e_lipoproteins
    predicate: bind
    object: bam_complex
    description: BamB, BamC, BamD and BamE are periplasmic lipoprotein partners in
      the E. coli BamABCDE complex.
    evidence:
    - reference: DOI:10.1038/ncomms12865
      notes: Iadanza et al. 2016 captured the intact BamABCDE complex by cryo-EM.
  - subject: unfolded_omp_substrate
    predicate: is folded and inserted by
    object: bam_complex
    description: Purified E. coli BamABCDE catalyzes assembly of an outer-membrane
      beta-barrel substrate after chaperone delivery in a proteoliposome system.
    evidence:
    - reference: DOI:10.1126/science.1188919
      notes: Hagan, Kim and Kahne 2010 reconstituted OmpT folding and insertion with
        purified E. coli BAM components.
  - subject: bam_complex
    predicate: samples
    object: laterally_open_bama
    description: Intact BAM can adopt a state in which the BamA barrel is laterally
      open.
    evidence:
    - reference: DOI:10.1038/ncomms12865
      notes: Iadanza et al. 2016 observed a laterally open BamA barrel in an intact
        BamABCDE cryo-EM structure.
    - reference: DOI:10.1038/nature17199
      notes: Gu et al. 2016 reported E. coli BAM crystal structures in inward-open
        and lateral-open states.
  - subject: bam_complex
    predicate: inserts
    object: outer_membrane_beta_barrel
    description: The functional output of the Bam complex is folded beta-barrel protein
      inserted in the cell outer membrane.
    evidence:
    - reference: DOI:10.1146/annurev-biochem-061408-144611
      notes: Hagan, Silhavy and Kahne 2011 review Bam-mediated beta-barrel assembly
        in the Gram-negative outer membrane.
  - subject: outer_membrane_beta_barrel
    predicate: embeds in
    object: cell_outer_membrane
    description: BAM substrates are beta-barrel proteins inserted into the bacterial
      cell outer membrane.
    evidence:
    - reference: DOI:10.1126/science.1188919
      notes: Hagan, Kim and Kahne 2010 used proteoliposomes to reconstitute E. coli
        outer-membrane protein assembly.
