functions:
- function_id: outer_membrane_beta_barrel_assembly
  label: outer-membrane beta-barrel protein folding and insertion
  description: Folds and inserts beta-barrel outer-membrane protein substrates into
    the bacterial cell outer membrane.
  evidence:
  - reference: DOI:10.1126/science.1188919
    notes: Hagan, Kim and Kahne 2010 reconstituted E. coli outer-membrane beta-barrel
      protein assembly from purified BAM components.
  - reference: DOI:10.1146/annurev-biochem-061408-144611
    notes: Hagan, Silhavy and Kahne 2011 review beta-barrel membrane-protein assembly
      by the Bam complex.
