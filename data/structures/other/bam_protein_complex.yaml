- discussion_id: sura_not_a_bam_component
  prompt: Keep SurA and other soluble periplasmic chaperones out of the Bam protein
    complex component list.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#bam_a
  - components#bam_b
  - components#bam_c
  - components#bam_d
  - components#bam_e
  - causal_graphs#bam_omp_folding_and_insertion
  rationale: Hagan, Kim and Kahne 2010 required a soluble chaperone in the reconstituted
    OMP assembly assay, but that chaperone acts on the substrate before BAM-mediated
    membrane insertion and is not a constituent of the BamABCDE complex.
  evidence:
  - reference: DOI:10.1126/science.1188919
    supports: SUPPORT
    notes: The purified reconstitution assay used a soluble chaperone in addition
      to the purified E. coli Bam complex.
  posed_by: codex
  posed_date: '2026-09-12'
  resolved_date: '2026-09-12'
