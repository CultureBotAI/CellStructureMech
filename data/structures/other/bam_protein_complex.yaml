causal_graphs:
- graph_id: bam_omp_folding_and_insertion
  title: BAM folds and inserts beta-barrel OMP substrates
  description: The outer-membrane BamA beta barrel and associated BamB-E lipoproteins
    form a machine that receives unfolded beta-barrel substrates and catalyzes their
    folding and insertion into the outer membrane.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph states the reconstituted substrate-to-outer-membrane handoff
    and the observed lateral BamA opening without choosing among detailed catalytic
    models for OMP insertion.
