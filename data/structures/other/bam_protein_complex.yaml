identifier: GO:1990063
label: Bam protein complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial outer-membrane beta-barrel protein assembly machine in which
  the BamA beta-barrel core and associated outer-membrane lipoproteins fold and insert
  beta-barrel proteins into the outer membrane.
