identifier: GO:1990220
label: GroEL-GroES complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: Bacterial chaperonin complex consisting of a heptameric 10kDa chaperonin
  subunit GroES and a tetradecameric (2x7) 60kDa chaperonin subunit GroEL. The 60kDa
  subunit possesses ATPase activity while the holo-enzyme is responsible for the correct
  folding of proteins.
