identifier: GO:0140595
label: MIM complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex located in the mitochondrial outer membrane that functions
  as an insertase, mediating the insertion of alpha-helical proteins from the cytosol
  into the outer membrane. Client proteins are usually single- and multi-span proteins
  that include components of the TOM complex.
