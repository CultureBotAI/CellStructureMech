discussions:
- discussion_id: interacting_complex_and_substrate_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Distinguish MIM constituents from interacting import systems, substrates
    and functional substitutes.
  rationale: TOM and SAM association, precursor binding and heterologous rescue do
    not establish additional constitutive MIM components.
  resolution_note: Keep Mim1 and Mim2 as the two curated constituent families. Do
    not add TOM, SAM, Tom70, Tom5, Tom6, imported substrates or pATOM36 as MIM components.
    TOM13 is a historical Mim1 name, not proof of constitutive TOM membership. Do
    not equate MIM with the mitochondrial inner membrane, MIMAS, or a stable TOM-MIM-SAM
    supercomplex.
  evidence:
  - reference: DOI:10.1016/j.celrep.2020.107567
    notes: Separate MIM populations and substrate-dependent Tom70 cooperation.
  - reference: DOI:10.7554/eLife.34488
    notes: pATOM36 substitutes for selected yeast MIM functions but poorly rescues
      Ugo1 import; yeast MIM does not replace the pATOM36 DNA-inheritance function.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: substrate_and_assay_dependence
  kind: CONTROVERSY
  status: OPEN
  prompt: Resolve the assay-dependent differences in Fis1 and Mcr1 dependence on MIM.
  attaches_to:
  - functions#alpha_helical_outer_membrane_insertion
  - causal_graphs#yeast_mim_import_and_partner_populations
  rationale: The iScience study finds largely preserved mitochondrial levels of Fis1
    and Mcr1 and only minor Fis1 mistargeting, whereas the later Cell Reports import
    assays detect MIM-dependent effects. Steady-state abundance, targeting fidelity
    and import kinetics are different readouts; these sources do not establish which
    experimental differences explain the contrast.
  evidence:
  - reference: DOI:10.1016/j.isci.2019.100779
    notes: Signal-anchored and tail-anchored Results and Discussion explicitly distinguish
      strong Msp1 dependence, moderate Gem1 dependence and largely independent Fis1/Mcr1
      behavior.
  - reference: DOI:10.1016/j.celrep.2020.107567
    notes: Figures 1-2 report impaired precursor import in mim1-deletion and mim1-23
      mitochondria.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: native_architecture_and_exchange
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve native MIM stoichiometry and the proposed exchange between free,
    TOM-associated and SAM-associated populations.
  rationale: Native-gel migration and complementation do not resolve an intact atomic
    structure or fixed copy number. Competition and altered association support a
    dynamic-exchange model without directly observing exchange. The hosted microscopy
    shows organelle morphology, not molecular MIM localization or structure.
  evidence:
  - reference: DOI:10.1016/j.celrep.2020.107567
    notes: Discussion proposes redistribution among populations from association and
      competition experiments.
  - reference: DOI:10.7554/eLife.34488
    notes: Figure 5 visualizes mito-GFP morphology in W303-derived deletion/rescue
      cells. Heterologous coexpression experiments support a two-protein machinery
      but not fixed native stoichiometry.
  posed_by: codex
  posed_date: '2026-10-04'
