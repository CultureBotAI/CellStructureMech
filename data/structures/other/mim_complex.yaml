functions:
- function_id: alpha_helical_outer_membrane_insertion
  label: alpha helical protein insertion into mitochondrial outer membrane
  grounding: GO:7770059
  description: Promotes biogenesis of selected signal-anchored, tail-anchored and
    multispanning alpha-helical mitochondrial outer-membrane proteins; dependence
    varies with substrate and assay.
  evidence:
  - reference: DOI:10.1016/j.celrep.2020.107567
    notes: Radiolabeled precursor import, mim1-23 controls and precursor co-purification
      support an import role. Fis1 and Gem1 import are impaired under these isolated-mitochondrial
      assay conditions; these results do not prove an exclusive route.
  - reference: DOI:10.1016/j.isci.2019.100779
    notes: Msp1 import is strongly MIM dependent, Gem1 is only moderately dependent,
      and Fis1 and Mcr1 mitochondrial levels are largely MIM independent. This preserves
      the contrast with the later import assays.
  - reference: DOI:10.7554/eLife.34488
    notes: Loss of Mim1/Mim2 impairs Tom20 and Ugo1 import. Heterologous pATOM36 rescues
      Tom20 much more effectively than Ugo1, so functional interchangeability is substrate
      limited.
evidence:
- reference: DOI:10.1016/j.celrep.2020.107567
  notes: 'Doan et al. (2020), The Mitochondrial Import Complex MIM Functions as Main
    Translocase for alpha-Helical Outer Membrane Proteins. Main text, Figures 1-4
    and experimental methods inspected in the institutional publisher PDF. CC BY-NC-ND:
    figures not hosted.'
- reference: DOI:10.7554/eLife.34488
  notes: Independent evolution of functionally exchangeable mitochondrial outer membrane
    import complexes. Relevant yeast and heterologous Results, Discussion, strain/microscopy
    methods and Figure 5 inspected in checksum-verified PMC6010339 version 1.
- reference: DOI:10.1016/j.isci.2019.100779
  notes: The Biogenesis of Mitochondrial Outer Membrane Proteins Show Variable Dependence
    on Import Factors. Signal-anchored and tail-anchored Results, Discussion and limitations
    inspected in checksum-verified PMC6965732 version 1.
- reference: GO:0098799
  notes: 'Broader is-a parent: outer mitochondrial membrane protein complex.'
- reference: GO:0005741
  notes: Containing mitochondrial outer membrane, not an is-a parent.
causal_graphs:
- graph_id: yeast_mim_import_and_partner_populations
  title: MIM-dependent import and distinct TOM/SAM-associated populations
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  description: MIM promotes selected precursor-import and assembly reactions and associates
    separately with TOM and SAM.
  scope_notes: Edges describe YPH499-derived isolated-mitochondrial experiments in
    the 2020 Cell Reports study, not one temporal sequence or one TOM-MIM-SAM supercomplex.
    Association is not direct-contact or pore-transit proof. Fis1/Mcr1 dependence
    differs from earlier steady-state measurements; no exclusive import route, fixed
    stoichiometry or directly observed exchange between MIM populations is asserted.
