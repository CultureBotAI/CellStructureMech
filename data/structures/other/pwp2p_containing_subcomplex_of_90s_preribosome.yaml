discussions:
- discussion_id: resolve_utp_b_family_groundings
  prompt: Resolve exact source-neutral family groundings for the Pwp2, Dip2, Utp21,
    Utp13, Utp18 and Utp6 constituents of the Pwp2p-containing UTP-B complex.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#pwp2_utp_b_subunit
  - components#dip2_utp_b_subunit
  - components#utp21_utp_b_subunit
  - components#utp13_utp_b_subunit
  - components#utp18_utp_b_subunit
  - components#utp6_utp_b_subunit
  rationale: GO:0034388 uses Saccharomyces gene-product names while noting that analogous
    complexes in other eukaryotes can use the term. Exact cross-eukaryotic InterPro,
    Pfam, NCBIfam or UniProt family boundaries for the six UTP-B proteins need narrower
    follow-up curation before these component labels can be grounded.
  evidence:
  - reference: GO:0034388
    notes: The GO:0034388 comment explains that the term name uses Saccharomyces gene-product
      names because no other names had arisen for the complex.
  - reference: DOI:10.1074/jbc.M404909200
    notes: Dosil and Bustelo 2004 identified the six S. cerevisiae proteins in the
      Pwp2 small subcomplex.
