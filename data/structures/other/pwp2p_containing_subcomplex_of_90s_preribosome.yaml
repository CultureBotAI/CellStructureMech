canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Dosil and Bustelo 2004 characterized budding-yeast Pwp2 as part of a stable
    small subcomplex with Dip2, Utp6, Utp13, Utp18 and Utp21.
  reference: DOI:10.1074/jbc.M404909200
functions:
- function_id: 90s_preribosome_assembly
  label: 90S preribosome assembly
  grounding: GO:0034463
  description: The Pwp2p-containing UTP-B subcomplex supports early assembly of 90S
    preribosomes and can interact directly with the 5' External Transcribed Spacer
    of 35S pre-rRNA.
  evidence:
  - reference: GO:0034388
    notes: GO:0034388 defines the Pwp2p-containing complex as a subcomplex of the
      90S preribosome.
  - reference: GO:0034463
    notes: GO:0034463 is the Gene Ontology biological-process term for 90S preribosome
      assembly.
  - reference: DOI:10.1074/jbc.M404909200
    notes: Dosil and Bustelo 2004 found that Pwp2 depletion blocks formation of 90S
      preribosomes and prevents U3 snoRNP and other 90S particle components from associating
      with 35S pre-rRNA.
evidence:
- reference: GO:0034388
  notes: Gene Ontology cellular-component term for the Pwp2p-containing subcomplex
