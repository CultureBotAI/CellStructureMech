- discussion_id: atg_receptor_scaffold_boundary
  prompt: Do not model Atg19 or Atg11 as constituent Cvt complex components.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - causal_graphs#cvt_complex_vacuolar_delivery
  rationale: Atg19/Cvt19 recognizes precursor aminopeptidase I cargo and Atg11 moves
    the resulting Cvt complex to the phagophore assembly site, but the GO:0034270
    record boundary is the preApe1p-containing Cvt cargo complex rather than those
    pathway adaptors.
  resolution_note: 'Declined: kept Atg19 and Atg11 outside the Cvt complex constituent
    list as recognition and trafficking machinery.'
  evidence:
  - reference: GO:0032258
    notes: GO:0032258 places Atg19 and Atg11 in the Cvt pathway that targets the Cvt
      complex for vesicle formation.
  - reference: DOI:10.1016/s1097-2765(01)00263-5
    notes: Scott et al. 2001 identified Cvt19/Atg19 as the Cvt pathway receptor for
      precursor aminopeptidase I cargo.
