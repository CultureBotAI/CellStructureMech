functions:
- function_id: dolichyl_phosphate_glcnac_phosphotransferase
  label: UDP-N-acetylglucosamine-dolichyl-phosphate N-acetylglucosaminephosphotransferase
    activity
  grounding: GO:0003975
  description: Catalyzes the transfer of N-acetylglucosamine-1-phosphate from UDP-GlcNAc
    onto dolichyl phosphate via Alg7p to form GlcNAc-PP-dolichol, initiating lipid-linked
    oligosaccharide assembly.
  evidence:
  - reference: GO:0043541
    notes: GO:0043541 defines Alg7p in the complex as catalyzing GlcNAc1-PP-Dol synthesis
      from dolichol-phosphate and UDP-GlcNAc.
  - reference: PMID:6096695
    notes: Barnes et al. 1984 established that S. cerevisiae Alg7p catalyzes the first
      step of dolichol-linked oligosaccharide synthesis.
- function_id: chitobiosyl_diphosphodolichol_biosynthesis_for_n_glycosylation
  label: protein N-linked glycosylation
  grounding: GO:0006487
  description: Synthesizes the GlcNAc2-PP-dolichol core on the cytoplasmic face of
    the endoplasmic reticulum membrane via sequential Alg7p and Alg13p-Alg14p reactions
    required for protein N-linked glycosylation.
  evidence:
  - reference: GO:0043541
    notes: GO:0043541 defines the complex as catalyzing the first two steps of dolichyl-linked
      oligosaccharide synthesis.
  - reference: PMID:15615718
    notes: Chantret et al. 2005 demonstrated that the Alg13p-Alg14p heterodimer catalyzes
      the second step of dolichol-linked core oligosaccharide assembly.
