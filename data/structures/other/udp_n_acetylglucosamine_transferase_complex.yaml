  grounding: InterPro:IPR033895
  gene_symbols:
  - ALG7
  essentiality: ESSENTIAL
  role: Polytopic endoplasmic-reticulum membrane phosphotransferase subunit (Alg7p)
    that catalyzes the first committed step of dolichol-linked oligosaccharide biosynthesis
    (transfer of GlcNAc-1-P from UDP-GlcNAc to dolichyl phosphate) and associates
    with the Alg13p-Alg14p heterodimer.
  evidence:
  - reference: GO:0043541
    notes: GO:0043541 defines the yeast complex as composed of Alg7p together with
      Alg13p and Alg14p.
  - reference: PMID:6096695
    notes: Barnes et al. 1984 (DOI:10.1128/mcb.4.11.2381-2388.1984) characterized
      Saccharomyces cerevisiae ALG7 as the essential gene encoding UDP-N-acetylglucosamine-1-P
      transferase.
