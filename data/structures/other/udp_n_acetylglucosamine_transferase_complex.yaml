  - reference: PMID:15615718
    notes: Chantret et al. 2005 (DOI:10.1074/jbc.m413941200) demonstrated that S.
      cerevisiae Alg13p and Alg14p form a heterooligomeric UDP-GlcNAc glycosyltransferase
      on the ER membrane.
