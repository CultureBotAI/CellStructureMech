causal_graphs:
- graph_id: udp_glcnac_transferase_complex_assembly_and_dolichol_glycosylation
  title: Alg7p, Alg13p, and Alg14p assemble on the ER membrane to synthesize GlcNAc2-PP-dolichol
  description: In Saccharomyces cerevisiae, integral ER membrane protein Alg14p recruits
    catalytic Alg13p and associates with Alg7p to form the UDP-N-acetylglucosamine
    transferase complex, catalyzing the first two steps of dolichol-linked oligosaccharide
    synthesis for protein N-linked glycosylation.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Captures Alg7p-Alg13p-Alg14p assembly in the ER membrane and sequential
    catalysis of GlcNAc1-PP-Dol and GlcNAc2-PP-Dol synthesis.
