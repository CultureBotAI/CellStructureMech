identifier: GO:0043541
label: UDP-N-acetylglucosamine transferase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multienzyme, heterooligomeric complex involved in dolichyl-linked oligosaccharide
  synthesis. In yeast the complex is composed of Alg7p, which catalyzes the first
  step (GlcNAc1-PP-Dol from dolichol-phosphate and UDP-GlcNAc), and Alg13p plus Alg14p,
  the catalytic and anchoring subunits respectively, which together catalyze the second
  step (GlcNAc2-PP-dolichol from GlcNAc1-PP-Dol and UDP-GlcNAc) of dolichyl-linked
  oligosaccharide synthesis.
definition_source: GO:0043541
