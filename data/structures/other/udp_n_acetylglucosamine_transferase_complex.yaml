  essentiality: ESSENTIAL
  role: Soluble cytosolic glycosyltransferase catalytic subunit (Alg13p) recruited
    to the cytosolic face of the ER membrane by Alg14p to catalyze transfer of the
    second N-acetylglucosamine residue from UDP-GlcNAc to GlcNAc-PP-dolichol.
  evidence:
