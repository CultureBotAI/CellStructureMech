identifier: GO:0031261
label: DNA replication preinitiation complex
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A protein-DNA complex assembled at eukaryotic DNA replication origins
  immediately prior to the initiation of DNA replication. The preinitiation complex
  is formed by the assembly of additional proteins onto an existing prereplicative
  complex. In budding yeast, the additional proteins might include Cdc45p, Sld2p,
  Sld3p, Dpb11p, DNA polymerases, and others; in fission yeast the GINS complex is
  present. The transient multiprotein-DNA complex assembled at licensed eukaryotic
  replication origins at the G1-to-S phase transition when Dbf4-dependent kinase (DDK/Cdc7)
  and S-phase cyclin-dependent kinase (S-CDK) phosphorylate the loaded Mcm2–7 double
  hexamer and firing factors Sld2 and Sld3. In Saccharomyces cerevisiae and related
  fungi, the DNA replication preinitiation complex recruits Dpb11, Cdc45, DNA polymerase
  epsilon, and the GINS tetramer to convert inactive Mcm2–7 rings into active CMG
  replicative helicases.
