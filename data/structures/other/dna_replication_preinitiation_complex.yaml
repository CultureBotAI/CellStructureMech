causal_graphs:
- graph_id: dna_replication_preinitiation_complex_mechanism
  title: DNA replication preinitiation complex assembly and CMG helicase activation
  description: DDK and S-CDK phosphorylation of Mcm2–7, Sld3, and Sld2 nucleates the
    DNA replication preinitiation complex (recruiting Dpb11, Pol epsilon, Cdc45, and
    GINS) to assemble the active CMG helicase and initiate bidirectional origin unwinding.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records GINS composition and DNA-replication function without
    resolving CMG helicase assembly, Cdc45/MCM contacts, origin activation order,
    or fork progression.
