causal_graphs:
- graph_id: yeast_swi_snf_chromatin_remodeling
  title: SWI/SNF supports ATP-dependent chromatin remodeling
  description: In Saccharomyces cerevisiae, the Snf2 ATPase and accessory Swi/Snf
    subunits assemble into an ATP-dependent chromatin remodeler that changes nucleosome
    positioning and histone-DNA contacts.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the curated Snf2 ATPase subunit and broad chromatin-remodeling
    activity without resolving the nucleosome engagement cycle or DNA-translocation
    steps.
