identifier: GO:0016514
label: SWI/SNF complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A SWI/SNF-type complex that contains 8 to 14 proteins, including both
  conserved (core) and nonconserved components; contains the ATPase product of the
  yeast SNF2 or mammalian SMARCA4/BAF190A/BRG1 gene, or an ortholog thereof.
