functions:
- function_id: chromatin_remodeling
  label: chromatin remodeling
  grounding: GO:0006338
  description: ATP-dependent remodeling of histone-DNA contacts that changes chromatin
    architecture.
  evidence:
  - reference: GO:0006338
    notes: GO:0006338 is the Gene Ontology biological-process term for chromatin remodeling.
  - reference: GO:0016514
    notes: Gene Ontology models the SWI/SNF complex as capable of chromatin remodeling.
  - reference: DOI:10.1016/j.celrep.2017.01.058
    notes: Dutta et al. 2017 assayed how deletion of budding-yeast Swi/Snf subunits
      changes Snf2 occupancy, nucleosome occupancy and gene expression.
