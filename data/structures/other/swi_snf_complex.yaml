  role: ATPase-containing catalytic constituent of the budding-yeast SWI/SNF remodeler.
  evidence:
  - reference: DOI:10.1038/s41467-020-17229-x
    notes: Wang et al. 2020 purified endogenous Saccharomyces cerevisiae Swi/Snf,
      described the intact 12-subunit complex, and resolved the Snf2-containing base
      and Arp-module architecture.
  - reference: DOI:10.1016/j.celrep.2017.01.058
    notes: Dutta et al. 2017 systematically purified wild-type and mutant Saccharomyces
      cerevisiae Swi/Snf complexes and organized the 12 subunits into Arp, Snf11-Snf12,
      Snf12-Snf6-Swi3, Taf14-Snf5-Swp82 and Swi1 modules.
