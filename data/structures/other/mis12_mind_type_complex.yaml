- timestamp: '2026-09-15T11:09:38Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added GO synonymy, outer-kinetochore subclassing and kinetochore parthood,
    four reviewed label-only MIS12/MIND subunits, a Saccharomyces cerevisiae taxonomic
    example, outer-subunit recruitment function, DOI/GO evidence, a nonmechanistic
    MIS12/MIND-to-Ndc80 assembly graph, a subunit-grounding TODO, and an Ndc80 boundary
    decision.
  llm_assisted: true
- timestamp: '2026-09-15T11:30:11Z'
