identifier: GO:0000444
label: MIS12/MIND type complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multiprotein kinetochore subcomplex that binds to centromeric chromatin
  and forms part of the outer kinetochore. It helps to recruit outer kinetochore subunits
  that will bind to microtubules. In humans, it consists of MIS12, DSN1, NSL1 and
  PMF1.
definition_source: GO:0000444
mapping_status: PROPOSED
