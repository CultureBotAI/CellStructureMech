functions:
- function_id: outer_kinetochore_subunit_recruitment
  label: outer kinetochore subunit recruitment
  description: MIS12/MIND type complexes bridge centromeric chromatin-proximal kinetochore
    material to outer microtubule-binding assemblies.
  evidence:
  - reference: GO:0000444
    notes: GO:0000444 defines the MIS12/MIND type complex by binding centromeric chromatin
      and helping recruit microtubule-binding outer kinetochore subunits.
  - reference: DOI:10.1101/gad.1144403
    notes: De Wulf, McAinsh and Sorger 2003 classified yeast MIND as a bridge between
      DNA-proximal and microtubule-bound kinetochore subunits.
