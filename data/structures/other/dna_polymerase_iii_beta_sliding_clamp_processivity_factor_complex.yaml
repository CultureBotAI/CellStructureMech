identifier: GO:0044775
label: DNA polymerase III, beta sliding clamp processivity factor complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A subcomplex of the DNA polymerase III holoenzyme which is responsible
  for tethering the catalytic subunit of DNA polymerase to DNA during high-speed replication.
  The complex is homodimeric in prokaryotes, and homotrimeric in other species.
