  - reference: PMID:1349852
    notes: Kong et al. 1992 solved the E. coli DNA polymerase III beta subunit crystal
      structure and described a beta-subunit dimer forming a ring-shaped structure
      that can encircle duplex DNA.
  - reference: UniProtKB:P0A988
    notes: UniProtKB P0A988 is the reviewed Escherichia coli K-12 dnaN entry for the
      beta sliding clamp.
