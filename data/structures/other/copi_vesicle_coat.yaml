- function_id: golgi_to_er_retrieval
  label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
  description: In budding yeast, coatomer-dependent COPI traffic returns dilysine-tagged
    cargo from the Golgi to the endoplasmic reticulum.
  evidence:
  - reference: GO:0006890
    notes: GO:0006890 denotes retrograde vesicle-mediated transport from the Golgi
      apparatus to the endoplasmic reticulum.
  - reference: DOI:10.1016/0092-8674(94)90011-6
    notes: Letourneur et al. 1994 demonstrated that yeast coatomer mutants impair
      retrieval of dilysine-tagged proteins to the ER.
  grounding: GO:0006890
