functions:
- function_id: copi_coated_vesicle_budding
  label: COPI-coated vesicle budding
  grounding: GO:0035964
  description: The COPI vesicle coat forms during evagination of Golgi membranes into
    COPI-coated vesicles.
  evidence:
  - reference: GO:0035964
    notes: GO:0035964 denotes evagination of a Golgi membrane to form a COPI-coated
      vesicle.
  - reference: DOI:10.1016/0092-8674(91)90176-y
