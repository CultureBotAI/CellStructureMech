identifier: GO:0030126
label: COPI vesicle coat
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A COPI membrane vesicle coat complex found associated with Golgi membranes;
  it forms on COPI-coated vesicles that mediate Golgi-to-endoplasmic-reticulum retrograde
  transport.
