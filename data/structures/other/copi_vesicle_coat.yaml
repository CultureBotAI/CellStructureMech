  title: Arf and coatomer assemble COPI coats at Golgi membranes
  description: Arf-family GTPases and the coatomer complex assemble on Golgi membranes
    into the COPI vesicle coat that forms COPI-coated vesicles for retrograde Golgi-to-ER
    traffic.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures Arf and coatomer as core COPI coat constituents
    without asserting the individual coatomer subunits, Arf nucleotide-cycle factors,
    or cargo adaptors.
