components:
- component_id: coatomer_complex
  label: coatomer complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0030126 uses coatomer as an exact synonym for the whole COPI
    vesicle coat, so it was not reused as a narrower complex grounding. No exact source-neutral
    Complex Portal, InterPro, or Pfam CURIE was curated for the coatomer complex or
    its individual subunits in this pass.
  role: Core coatomer complex that assembles with Arf on Golgi membranes to form the
    COPI coat.
  evidence:
  - reference: DOI:10.1038/349248a0
    notes: Waters, Serafini and Rothman 1991 named coatomer as a cytosolic protein
      complex containing non-clathrin Golgi vesicle coat subunits.
  - reference: DOI:10.1016/0092-8674(94)90011-6
    notes: Letourneur et al. 1994 used Saccharomyces cerevisiae coatomer mutants to
      show that coatomer is required for retrieval of dilysine-tagged cargo to the
      ER.
- component_id: arf_gtpase
  label: Arf-family COPI GTPase
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: ADP-ribosylation factors are small GTPases with multiple paralogues
    in eukaryotes; no exact source-neutral InterPro or Pfam family identifier was
    curated for the COPI-associated Arf set in this pass.
  role: Small GTPase coat constituent that associates with Golgi-derived COP-coated
    vesicles and promotes coat assembly on membranes.
  evidence:
  - reference: DOI:10.1016/0092-8674(91)90176-y
    notes: Serafini et al. 1991 identified ADP-ribosylation factor as a subunit of
      Golgi-derived COP-coated vesicles.
