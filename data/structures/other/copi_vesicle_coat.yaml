functions:
- function_id: copi_coated_vesicle_budding
  label: COPI-coated vesicle budding
  grounding: GO:0035964
  description: The COPI vesicle coat forms during evagination of Golgi membranes into
    COPI-coated vesicles.
  evidence:
  - reference: GO:0035964
    notes: GO:0035964 denotes evagination of a Golgi membrane to form a COPI-coated
      vesicle.
  - reference: DOI:10.1016/j.cell.2012.01.015
    notes: Yu et al. 2012 analyzed Arf1-GTP binding to coatomer subcomplexes during
      COPI coat recruitment to membranes.
- function_id: golgi_to_er_retrieval
  label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
  description: In budding yeast, coatomer-dependent COPI traffic returns dilysine-tagged
    cargo from the Golgi to the endoplasmic reticulum.
  evidence:
  - reference: GO:0006890
    notes: GO:0006890 denotes retrograde vesicle-mediated transport from the Golgi
      apparatus to the endoplasmic reticulum.
  - reference: DOI:10.1091/mbc.e02-11-0736
    notes: Sandmann et al. 2003 described COPI retrograde vesicles and direct binding
      of a KKXX ER-retrieval motif by coatomer in Saccharomyces cerevisiae.
  grounding: GO:0006890
