components:
- component_id: base_subcomplex
  label: proteasome regulatory particle, base subcomplex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0008540
  essentiality: ESSENTIAL
  role: Proximal 19S subcomplex comprising the heterohexameric AAA+ ATPase ring (Rpt1-Rpt6)
    and non-ATPase scaffold/ubiquitin-receptor subunits (Rpn1, Rpn2, Rpn10, Rpn13)
    that docks onto the 20S alpha ring, opens the axial gate, and unfolds polypeptide
    substrates.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 review the composition and mechanical role
      of the 19S base subcomplex within the proteasome regulatory particle.
- component_id: lid_subcomplex
  label: proteasome regulatory particle, lid subcomplex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0008541
  essentiality: ESSENTIAL
  role: Distal 19S subcomplex comprising the Rpn11-Rpn8 MPN-domain heterodimer and
    six PCI-domain scaffold subunits (Rpn3, Rpn5, Rpn6, Rpn7, Rpn9, Rpn12) plus Sem1
    that catalyzes en bloc deubiquitination of captured substrates.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 review the 9-subunit 19S lid subcomplex and
      its Rpn11 metalloprotease deubiquitination activity.
