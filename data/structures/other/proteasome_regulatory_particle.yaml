identifier: GO:0005838
label: proteasome regulatory particle
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multisubunit complex, which caps one or both ends of the proteasome
  core complex. This complex recognizes and unfolds ubiquitinated proteins, and translocates
  them to the proteasome core complex. Composed of the proximal 19S base subcomplex
  (Rpt1-Rpt6 AAA+ ATPase ring and Rpn1/Rpn2/Rpn10/Rpn13 ubiquitin-binding scaffolds)
  and the distal 19S lid subcomplex (Rpn11-Rpn8 deubiquitinase module and PCI-domain
  scaffold subunits).
