identifier: GO:0005838
label: proteasome regulatory particle
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multisubunit complex, which caps one or both ends of the proteasome
  core complex. This complex recognizes and unfolds ubiquitinated proteins, and translocates
  them to the proteasome core complex. A multisubunit regulatory cap complex (such
  as the eukaryotic 19S regulatory particle in yeasts and protists or the archaeal
  PAN ATPase ring) that binds to one or both ends of the 20S proteasome core particle.
  Composed of base AAA+ ATPase subunits (Rpt1–Rpt6) and lid ubiquitin-receptor/deubiquitinase
  subunits (Rpn11), it recognizes polyubiquitinated proteins, removes ubiquitin chains,
  unfolds substrates, and gates their translocation into the proteolytic chamber.
