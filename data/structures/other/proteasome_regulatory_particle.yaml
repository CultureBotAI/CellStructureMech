  title: Proteasome regulatory particle substrate deubiquitination and unfolding
  description: Polyubiquitinated proteins captured by proteasome regulatory particle
    receptors are deubiquitinated by Rpn11 and mechanically unfolded by the heterohexameric
    Rpt1–6 AAA+ ATPase ring for translocation into the 20S core particle.
