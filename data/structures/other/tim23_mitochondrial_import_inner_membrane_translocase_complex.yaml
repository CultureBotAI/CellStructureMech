identifier: GO:0005744
label: TIM23 mitochondrial import inner membrane translocase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'The protein transport machinery of the mitochondrial inner membrane that
  typically transports proteins that possess a matrix-targeting N-terminal presequence.
  The TIM23 complex contains three essential Tim proteins: Tim17 and Tim23 are thought
  to build a preprotein translocation channel while Tim44 interacts transiently with
  the matrix heat-shock protein Hsp70 to form an ATP-driven import motor.'
