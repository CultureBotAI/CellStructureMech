identifier: GO:1990101
label: DnaA-oriC complex
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A protein-DNA complex containing the initiator protein DnaA bound to high-affinity
  recognition sites in the unique origin of replication, oriC. DnaA-oriC binding is
  the first step in assembly of a bacterial pre-replicative complex (pre-RC) and is
  responsible for the timely initiation of replication once per cell cycle.
definition_source: GO:1990101
mapping_status: PROPOSED
