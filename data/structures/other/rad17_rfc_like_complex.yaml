identifier: GO:0031389
label: Rad17 RFC-like complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A pentameric protein complex related to replication factor C that loads
  the checkpoint clamp onto DNA at damage sites and functions in DNA damage cell-cycle
  checkpoints; the large subunit is Rad17 in Schizosaccharomyces pombe and Rad24p
  in Saccharomyces cerevisiae.
