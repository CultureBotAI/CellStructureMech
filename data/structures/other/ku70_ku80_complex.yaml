identifier: GO:0043564
label: Ku70:Ku80 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: Heterodimeric protein complex composed of a 70 kDa and a 80 kDa subunit,
  binds DNA through a channel formed by the heterodimer. Functions in DNA double stranded
  break repair, chromosome maintenance, transcription regulation, V(D)J recombination,
  and activation of DNA-PK.
