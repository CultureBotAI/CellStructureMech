identifier: GO:1990191
label: cobalamin transport complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: Protein complex facilitating ATP-dependent cobalamin (vitamin B12) transport
  through inner cell membrane (periplasm to cytoplasm) in Gram-negative bacteria.
  In E. coli the system is composed of a periplasmic cobalamin-binding protein (BtuF),
  an integral membrane homodimer, BtuC, and a cytoplasmic ATP-binding homodimer BtuD.
definition_source: GO:1990191
mapping_status: PROPOSED
