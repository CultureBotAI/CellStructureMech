components:
- component_id: btuf_periplasmic_binding_protein
  label: Vitamin B12-binding protein BtuF
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR002491
  gene_symbols:
  - btuF
  - yadT
  stoichiometry: '1'
  essentiality: ESSENTIAL
  role: Periplasmic substrate-binding protein that binds cyanocobalamin and cobinamide
    with high affinity (~15 nM) and docks onto the BtuC2 periplasmic face to deliver
    substrate.
  protein_examples:
  - uniprot_id: UniProtKB:P37028
    protein_label: Vitamin B12-binding protein
    gene_symbol: btuF
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-30'
    role: Reviewed Escherichia coli K-12 BtuF periplasmic vitamin B12-binding protein
      (also declared as synonym yadT).
    evidence:
    - reference: UniProtKB:P37028
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 BtuF.
    - reference: PMID:11790740
      snippet: CN-Cbl-binding assays using radiolabeled substrate or isothermal titration
        calorimetry showed that purified BtuF binds CN-Cbl with a binding constant
        of around 15 nM.
      notes: Identifies and characterizes E. coli BtuF as the periplasmic cobalamin-binding
        protein.
  evidence:
  - reference: GO:1990191
    notes: GO:1990191 defines BtuF as the periplasmic substrate-binding subunit of
      the cobalamin transport complex.
  - reference: InterPro:IPR002491
    notes: InterPro entry for periplasmic binding protein domain in BtuF.
  - reference: PMID:28128319
    snippet: We synthesized radiolabeled cyano-cobinamide and demonstrated BtuCD-catalyzed
      in vitro transport, which was ATP- and BtuF-dependent.
    notes: Demonstrates essential requirement for BtuF in BtuCD-catalyzed transport.
- component_id: btuc_permease_subunit
  label: Vitamin B12 import system permease protein BtuC
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR023691
  gene_symbols:
  - btuC
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: Homodimeric transmembrane permease subunit (2 x 10 transmembrane helices)
    forming the inner-membrane translocation channel for cobalamin.
  protein_examples:
  - uniprot_id: UniProtKB:P06609
    protein_label: Vitamin B12 import system permease protein BtuC
    gene_symbol: btuC
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-30'
    role: Reviewed Escherichia coli K-12 BtuC transmembrane permease subunit.
    evidence:
    - reference: UniProtKB:P06609
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 BtuC.
    - reference: PMID:11790740
      snippet: Transport across the cytoplasmic membrane (CM) requires the BtuC and
        BtuD proteins, which are most related in sequence to the transmembrane and
        ATP-binding cassette proteins of periplasmic permeases for iron-siderophore
        transport.
      notes: Establishes BtuC as the cytoplasmic-membrane permease component in E.
        coli.
  evidence:
  - reference: GO:1990191
    notes: GO:1990191 defines two BtuC subunits as the transmembrane permease core
      of BtuCDF.
  - reference: InterPro:IPR023691
    notes: InterPro entry for vitamin B12 import system permease protein BtuC.
  - reference: PMID:11790740
    snippet: Hence, null mutations in btuC and btuD were constructed and revealed
      that the btuC mutant had a strong impairment similar to that of the btuF mutant,
      whereas the btuD defect was less pronounced.
    notes: Genetic confirmation of btuC requirement for cytoplasmic membrane cobalamin
      transport.
