functions:
- function_id: abc_vitamin_b12_transporter_activity
  label: ABC-type vitamin B12 transporter activity
  grounding: GO:0015420
  description: Catalyzes ATP-dependent active transmembrane transport of vitamin B12
    (cobalamin) and cobinamide across the inner membrane.
  evidence:
  - reference: GO:0015420
    notes: GO molecular-function term for ABC-type vitamin B12 transporter activity.
  - reference: PMID:28128319
    snippet: BtuCD-F is an ABC transporter that mediates cobalamin uptake into Escherichia
      coli.
    notes: Demonstrates ABC-type vitamin B12 and cobinamide transporter activity of
      BtuCD-F.
- function_id: cobalamin_transport
  label: cobalamin transport
  grounding: GO:0015889
  description: Transports periplasmic cobalamin (delivered via outer-membrane BtuB)
    across the cytoplasmic membrane into the bacterial cytosol.
  evidence:
  - reference: GO:0015889
    notes: GO biological-process term for cobalamin transport.
  - reference: PMID:11790740
    snippet: A null mutation in btuF, but not in the flanking genes pfs and yadS,
      strongly decreased CN-Cbl utilization and transport into the cytoplasm.
    notes: Demonstrates cytoplasmic cobalamin transport mediated by the BtuCDF system.
evidence:
- reference: GO:1990191
  notes: GO cellular-component term for the cobalamin transport complex (BtuCDF).
- reference: ComplexPortal:CPX-2105
  notes: Complex Portal entry for the Escherichia coli K-12 BtuCDF vitamin B12 transport
    complex.
- reference: PMID:11790740
  snippet: Cells of Escherichia coli take up vitamin B(12) (cyano-cobalamin [CN-Cbl])
    and iron chelates by use of sequential active transport processes.
  notes: Identifies BtuF and establishes its collaboration with BtuC and BtuD in E.
    coli cobalamin uptake.
- reference: DOI:10.1128/jb.184.3.706-717.2002
  notes: DOI for PMID:11790740.
- reference: PMID:28128319
  snippet: BtuCD-F is an ABC transporter that mediates cobalamin uptake into Escherichia
    coli.
  notes: Crystal structure and in vitro transport analysis of E. coli BtuCD-F.
- reference: DOI:10.1038/srep41575
  notes: DOI for PMID:28128319.
- reference: PMID:27457716
  snippet: The Escherichia coli vitamin B12 ABC transporter BtuCD-F imports cobalamin
    across the inner membrane into the cytoplasm.
  notes: Supports inner-membrane cobalamin import by the E. coli BtuCD-F ABC transporter
    complex.
- reference: PMID:29084999
  snippet: ATP binding and hydrolysis by the BtuD dimer drive conformational transitions
    in the BtuC transmembrane subunits that translocate vitamin B12 into the cytoplasm.
  notes: Establishes ATP-driven conformational coupling between BtuD and BtuC during
    cobalamin translocation.
causal_graphs:
- graph_id: btucdf_cobalamin_import_mechanism
  title: BtuCD-F Periplasmic Capture and ATP-Driven Cobalamin Import
  description: Following TonB-dependent outer-membrane passage via BtuB, periplasmic
    BtuF captures cyanocobalamin and docks onto the BtuC2-BtuD2 inner-membrane ABC
    complex to drive ATP-dependent cytoplasmic import.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
