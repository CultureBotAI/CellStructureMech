      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 BtuD.
    - reference: PMID:11790740
      snippet: Transport across the cytoplasmic membrane (CM) requires the BtuC and
        BtuD proteins, which are most related in sequence to the transmembrane and
        ATP-binding cassette proteins of periplasmic permeases for iron-siderophore
        transport.
      notes: Establishes BtuD as the ATP-binding cassette subunit of the cobalamin
        permease.
  evidence:
  - reference: GO:1990191
    notes: GO:1990191 defines two BtuD subunits as the ATP-binding cassette component
      of BtuCDF.
  - reference: InterPro:IPR023693
    notes: InterPro entry for vitamin B12 import ATP-binding protein BtuD.
  - reference: PMID:28128319
    snippet: We synthesized radiolabeled cyano-cobinamide and demonstrated BtuCD-catalyzed
      in vitro transport, which was ATP- and BtuF-dependent.
    notes: Confirms ATP-dependent transport catalyzed by BtuCD.
