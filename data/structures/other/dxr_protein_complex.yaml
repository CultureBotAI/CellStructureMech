identifier: GO:1990065
label: Dxr protein complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that is involved in the MEP pathway of IPP biosynthesis.
  It catalyzes the NADP-dependent rearrangement and reduction of 1-deoxy-D-xylulose-5-phosphate
  (DXP) to 2-C-methyl-D-erythritol 4-phosphate (MEP).
