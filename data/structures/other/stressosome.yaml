- component_id: rsbt
  label: RsbT
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  gene_symbols:
  - rsbT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The reviewed Bacillus RsbT entry maps to IPR003594 and IPR036890
    domain/superfamily entries. These are not exact source-neutral RsbT-family groundings.
  role: Associated signaling kinase in RsbR-RsbS-RsbT particles. Its necessity for
    downstream signaling is distinct from its necessity for formation of an RsbR-RsbS
    core.
  evidence:
  - reference: DOI:10.1038/s41467-019-10782-0
    notes: RsbT is biochemically present in the purified Listeria particles, but no
      atomic RsbT model was resolved.
  - reference: DOI:10.1038/nmicrobiol.2017.5
    notes: Adding RsbT to purified Listeria RsbR-RsbS produces a larger complex analyzed
      by negative-stain EM.
  - reference: DOI:10.1107/S205225251900945X
    notes: Bacillus RsbRA-RsbS cores were reconstituted without RsbT.
- component_id: prli42
  label: Stressosome-associated protein Prli42
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  grounding: InterPro:IPR049722
  essentiality: DISPENSABLE
  gene_symbols:
  - prli42
  role: Listeria membrane-associated miniprotein implicated in RsbR-dependent stressosome
    tethering, not a generic core subunit. Dispensability refers to reconstituted
    RsbR-RsbS-RsbT assembly without Prli42, not normal localization or stress signaling
    in vivo.
  evidence:
  - reference: DOI:10.1038/nmicrobiol.2017.5
    notes: EGD-e co-immunoprecipitation identifies RsbR and RsbS among Prli42 partners;
      deletion and partial complementation support Prli42-dependent membrane association
      of a subset of RsbR. Fractionation measures RsbR, not counts of intact stressosomes.
      Purified RsbR-RsbS-RsbT particles assemble without Prli42.
  - reference: InterPro:IPR049722
    notes: The issuing authority identifies an exact Prli42 protein family; the family
      label does not establish occurrence of assembled stressosomes in every organism
      with a homolog.
