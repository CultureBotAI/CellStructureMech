functions:
- function_id: stress_response_timing
  label: environmental stress response regulation
  description: The stressosome organizes stress-signaling proteins. In tested Bacillus
    subtilis PY79 derivatives, an intact RsbR/RsbS core promotes rapid onset and shutoff
    of the ethanol-induced sigma-B response; core loss does not abolish all environmental
    stress signaling.
  evidence:
  - reference: DOI:10.1038/s41467-019-10782-0
    notes: Structural and biochemical characterization establishes the RsbR-RsbS-RsbT
      regulatory assembly.
  - reference: DOI:10.1038/s41467-025-56871-1
    notes: Core-deficient, rsbP-deleted PY79 derivatives retain a delayed, longer-lived
      ethanol response that remains RsbT dependent. Salt responses were also observed;
      the weak acid-stress response was inconclusive.
causal_graphs:
- graph_id: bacillus_core_independent_response
  title: Bacillus core-independent stress response
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  description: Experimental dependencies of sigma-B reporter output, not a molecular
    model of stress recognition or kinase release.
  scope_notes: Khadka et al. 2025, PY79-derived strains with the RsbP energy-stress
    branch removed. Core-deficient conditions eliminate the relevant RsbR paralogs
    and RsbS while preserving RsbT production. Do not extrapolate to every stressor
    or species.
  nodes:
  - node_id: ethanol
    label: ethanol stress
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: rsbt
    label: RsbT
    node_type: GENE_OR_PROTEIN
    component_ref: rsbt
  - node_id: output
    label: ethanol-induced sigma-B reporter response
    node_type: BIOLOGICAL_PROCESS
  - node_id: core_loss
    label: experimental RsbR/RsbS core loss
    node_type: EXPERIMENTAL_FACTOR
  - node_id: altered_timing
    label: delayed and longer-lived sigma-B response
    node_type: STATE
  edges:
  - subject: ethanol
    predicate: induces
    object: output
    description: Ethanol retains an inducible response in the tested core-deficient
      backgrounds that preserve RsbT.
    evidence:
    - reference: DOI:10.1038/s41467-025-56871-1
      notes: Population and single-cell reporters detect stress-induced activity despite
        loss of core proteins.
  - subject: rsbt
    predicate: is_required_for
    object: output
    description: RsbT removal abolishes the core-independent ethanol response; this
      does not identify RsbT as a direct sensor.
    evidence:
    - reference: DOI:10.1038/s41467-025-56871-1
      notes: RsbT deletion or translation block prevents core-independent signaling;
        the kinase-defective D78N allele also compromises the response.
  - subject: core_loss
    predicate: produces
    object: altered_timing
    description: Comparison with core-intact controls supports altered response kinetics,
      not direct observation of kinase recapture.
    evidence:
    - reference: DOI:10.1038/s41467-025-56871-1
      notes: Core-deficient cells respond later and sustain elevated reporter output
        longer after ethanol exposure.
