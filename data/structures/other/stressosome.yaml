discussions:
- discussion_id: component_family_groundings
  prompt: Resolve exact RsbR, RsbS and RsbT family groundings.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#rsbr
  - components#rsbs
  - components#rsbt
  rationale: The checked UniProt-to-InterPro mappings are broader than each component
    or describe domains. Label-only components preserve identity without substituting
    a shared STAS domain for a family.
  evidence:
  - reference: DOI:10.1107/S205225251900945X
    notes: RsbRA and RsbS are distinct core subunits.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: assembly_is_not_signaling_essentiality
  prompt: Does loss of stress signaling establish failure of stressosome assembly?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to: []
  rationale: No. Formation essentiality is left unknown for the generic core constituents.
    Bacillus RsbRA/RsbS cores assemble without RsbT; Listeria preparation-dependent
    assembly results do not justify a universal RsbT requirement. The 2025 RsbT signaling
    requirement does not establish a structural formation requirement.
  evidence:
  - reference: DOI:10.1107/S205225251900945X
    notes: Purified RsbRA/RsbS core reconstitution.
  - reference: DOI:10.1038/s41467-025-56871-1
    notes: RsbT-dependent signaling without core proteins.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: response_without_core
  prompt: Is the stressosome indispensable for environmental stress sensing?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to: []
  rationale: Not in every tested context. The 2025 PY79 experiments retain ethanol
    and salt responses after core loss. A clean rsbRA-rsbS deletion also depresses
    RsbT production, so its failure to signal cannot by itself establish core necessity.
    Translation-stop constructs address this confound. The study does not rule out
    sensory functions for individual RsbR paralogs.
  evidence:
  - reference: DOI:10.1038/s41467-025-56871-1
    notes: Genetic dissection with RsbT-production controls.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: prli42_boundary
  prompt: Is Prli42 a universal core constituent or a demonstrated channel?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#prli42
  rationale: Neither claim is made. Native co-isolation of RsbR and RsbS, fractionation
    and perturbation justify Listeria-associated membrane machinery. The direct-versus-indirect
    tether mechanism and localization of every intact assembled particle are not resolved
    by RsbR fractionation. Prli42 is absent from the reconstituted core and its proposed
    channel role is speculative.
  evidence:
  - reference: DOI:10.1038/nmicrobiol.2017.5
    notes: Prli42 co-IP, fractionation and reconstitution experiments.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: downstream_proteins_not_core
  prompt: Should RsbU, RsbV, RsbW, sigma-B or RsbX be generic core constituents?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to: []
  rationale: The curated structural core is RsbR/RsbS with associated RsbT. Downstream
    signaling proteins are not made constituents merely because their activity depends
    on the pathway. RsbX-mediated resetting is also not evidence of a stable structural
    constituent; no RsbX occupancy or exact binding-state claim is imported here.
  evidence:
  - reference: DOI:10.1038/s41467-019-10782-0
    notes: Resolved core and biochemically associated RsbT are distinguished from
      the pathway model.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: stoichiometry_and_crystal_boundary
  prompt: Should a single 60-subunit composition or an RsbS-only crystal shell define
    all stressosomes?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to: []
  rationale: No. Listeria reconstruction supports a 40-RsbR/20-RsbS core, whereas
    Bacillus reconstructions vary with the reconstruction and symmetry treatment.
    Exact generic copy numbers are omitted. The RsbS-only icosahedron is crystal packing;
    solution measurements support a dimer, not a native RsbS-only stressosome.
  evidence:
  - reference: DOI:10.1038/s41467-019-10782-0
    notes: Listeria core reconstruction.
  - reference: DOI:10.1107/S205225251900945X
    notes: Bacillus reconstructions and RsbS SEC-MALS.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: molecular_trigger_open
  prompt: Resolve the molecular trigger and dynamic signaling mechanism.
  kind: CURATION_TODO
  status: OPEN
  attaches_to: []
  rationale: Static loop accessibility, approximate turret placement and kinetic phenotypes
    do not directly measure gating, RsbT release or recapture, or direct stress recognition.
    Exact interface residue claims also require reconciliation of inconsistent numbering
    in the 2019 Listeria Results and Methods. The graph therefore records experimental
    dependencies only.
  evidence:
  - reference: DOI:10.1038/s41467-019-10782-0
    notes: Static structural models and perturbations.
  - reference: DOI:10.1038/s41467-025-56871-1
    notes: Reporter dynamics with genetic perturbations.
  posed_by: codex
  posed_date: '2026-10-03'
