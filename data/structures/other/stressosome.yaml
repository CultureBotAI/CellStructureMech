components:
- component_id: rsbr
  label: RsbR-family stressosome proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  gene_symbols:
  - rsbR
  - rsbRA
  - ytvA
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The verified InterPro family IPR051932 spans both RsbR-family proteins
    and RsbS. STAS and globin entries are domains or broader structural groupings,
    not exact identities for this component class. YtvA is an RsbR paralog with a
    LOV sensory domain, so a nonheme-globin domain is not a universal class definition.
  role: Oligomeric core subunits with C-terminal STAS domains and outward-facing N-terminal
    sensory domains. The RsbR paralog repertoire and sensory-domain type vary between
    organisms.
  protein_examples:
  - uniprot_id: UniProtKB:P42409
    protein_label: RsbT co-antagonist protein RsbRA
    gene_symbol: rsbRA
    taxon_id: NCBITaxon:224308
    taxon_label: Bacillus subtilis subsp. subtilis str. 168
    entry_status: REVIEWED
    retrieved_on: '2026-10-03'
    role: RsbRA constituent of the reconstituted strain-168 core.
    evidence:
    - reference: DOI:10.1107/S205225251900945X
      notes: Kwon et al. cloned the proteins from strain 168 (ATCC 23857) and reconstituted
        RsbRA-RsbS cores. The accession, reviewed status and strain taxon were independently
        checked at UniProt; the canonical taxon label was checked through ENA taxonomy.
  evidence:
  - reference: DOI:10.1038/s41467-019-10782-0
    notes: Listeria cryo-EM resolves RsbR STAS domains in the core; the N-terminal
      turrets are less well resolved.
  - reference: DOI:10.1107/S205225251900945X
    notes: Bacillus RsbRA and RsbS form reconstituted cores; the paper distinguishes
      the LOV-domain paralog YtvA from globin-like RsbR proteins.
