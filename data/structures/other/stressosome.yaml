identifier: cellstructuremech:stressosome
label: stressosome
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial multiprotein regulatory assembly with an oligomeric core formed
  by RsbR-family and RsbS STAS domains and an associated RsbT kinase. Characterized
  stressosomes organize environmental-stress signaling; their subunit composition
  and requirement for downstream responses depend on the organism and experimental
  context.
definition_source: DOI:10.1038/s41467-019-10782-0
mapping_status: PROPOSED
