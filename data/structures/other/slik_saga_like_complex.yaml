  changes: Added SLIK exact synonymy, SAGA-type parentage, 18 budding-yeast SLIK constituent
    rows, yeast scope, histone acetyltransferase and cysteine-type deubiquitinase
    activities, GO/PubMed/DOI evidence, a nonmechanistic function graph, a SLIK subunit-grounding
    TODO, and an explanation for excluding Rtg2 as an unresolved historical association.
