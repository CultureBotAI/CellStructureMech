  rationale: Pray-Grant et al. 2002 identified Rtg2 as a unique SLIK-associated protein
    and linked SLIK to the retrograde response pathway, but Adamus et al. 2021 did
    not detect Rtg2 by mass spectrometry in purified SLIK and reported that SLIK retained
    the expected architecture and chromatin-modifying activities without detectable
    Rtg2.
  evidence:
  - reference: DOI:10.1128/MCB.22.24.8774-8786.2002
    notes: Pray-Grant et al. 2002 identified Rtg2 as uniquely associated with SLIK
      in the original budding-yeast purification.
  - reference: DOI:10.1016/j.jbc.2021.100671
    notes: Adamus et al. 2021 did not identify Rtg2 in purified SLIK or SAGA by mass
      spectrometry.
