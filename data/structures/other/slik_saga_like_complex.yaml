identifier: GO:0046695
label: SLIK (SAGA-like) complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A SAGA-type histone acetyltransferase complex that contains a smaller
  form of Spt7 (lacking the SPT8 binding region) than the fungal SAGA complex, and
  consequently lacks Spt8. The complex is involved in the yeast retrograde response
  pathway, which is important for gene expression changes during mitochondrial dysfunction.
definition_source: GO:0046695
mapping_status: PROPOSED
