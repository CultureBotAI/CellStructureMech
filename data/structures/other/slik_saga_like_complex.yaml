taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding yeast is the organism in which SLIK was discovered and then purified
    for biochemical, cross-linking, and cryo-EM comparison with SAGA.
  reference: DOI:10.1016/j.jbc.2021.100671
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Adamus et al. 2021 purified Saccharomyces cerevisiae SLIK from Ubp8-TAP cells
    and resolved a low-resolution cryo-EM architecture consistent with the SAGA core.
  reference: DOI:10.1016/j.jbc.2021.100671
functions:
- function_id: histone_acetyltransferase_activity
  label: histone acetyltransferase activity
  grounding: GO:0004402
  description: The SLIK HAT module contains the Gcn5 catalytic subunit and supports
    histone acetylation by the complex.
  evidence:
  - reference: GO:0004402
    notes: GO:0004402 is the Gene Ontology molecular-function term for histone acetyltransferase
      activity.
  - reference: GO:0046695
    notes: GO:0046695 defines SLIK as a SAGA-type histone acetyltransferase complex.
  - reference: DOI:10.1016/j.jbc.2021.100671
    notes: Adamus et al. 2021 detected the Ada2/Ada3/Gcn5/Sgf29 HAT module in purified
      SLIK and showed SAGA and SLIK had indistinguishable HAT activity on an H3 peptide
      minimal substrate.
