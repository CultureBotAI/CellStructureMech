- discussion_id: ego_ragulator_boundary
  prompt: Keep Ego1, Ego2 and Ego3 Ragulator/EGO anchor subunits outside this Gtr1-Gtr2
    heterodimer record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#gtr1_gtpase
  - components#gtr2_gtpase
  - causal_graphs#yeast_gtr1_gtr2_torc1_regulation
  rationale: GO:1990131 denotes the Gtr1-Gtr2 heterodimer itself, while GO:0071986
    denotes the vacuolar EGO/Ragulator anchor for Rag GTPases; Tafur et al. 2026 separated
    Gtr1 and Gtr2 from the Ego1, Ego2 and Ego3 anchor subunits within the pentameric
    EGOC.
  resolution_note: 'Declined: Ego1, Ego2 and Ego3 were treated as associated anchor
    subunits rather than constituents of GO:1990131.'
  evidence:
  - reference: GO:1990131
    notes: Gene Ontology cellular-component term for the Gtr1-Gtr2 GTPase complex.
  - reference: GO:0071986
    notes: Gene Ontology cellular-component term for the Ragulator complex, covering
      the yeast EGO/EGO-GSE complex that acts as a vacuolar Rag GTPase GEF.
  - reference: DOI:10.1038/s41594-026-01746-2
    notes: Tafur et al. 2026 determined the yeast SEAC-EGOC supercomplex and separated
      the Gtr1/Gtr2 heterodimer from the Ego1/Ego2/Ego3 anchor within EGOC.
  posed_by: codex
  posed_date: '2026-09-18'
  resolved_date: '2026-09-18'
- discussion_id: gator_seac_boundary
  prompt: Keep GATOR/SEAC regulator subcomplexes outside this Gtr1-Gtr2 heterodimer
    record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#gtr1_gtpase
  - components#gtr2_gtpase
  - causal_graphs#yeast_gtr1_gtr2_torc1_regulation
  rationale: GATOR1/SEACIT and GATOR2/SEACAT are distinct SEA/GATOR regulator branches
    upstream of the Gtr1-Gtr2 Rag-family target and are represented by GO as complexes
    separate from GO:1990131.
  resolution_note: 'Declined: SEA/GATOR subunits were kept as upstream Rag-family
    regulators instead of as Gtr1-Gtr2 constituents.'
  evidence:
  - reference: GO:1990130
    notes: Gene Ontology cellular-component term for the GATOR1 complex.
  - reference: GO:0061700
    notes: Gene Ontology cellular-component term for the GATOR2 complex.
  - reference: DOI:10.4161/cc.26000
    notes: Panchaud, Peli-Gulli and De Virgilio 2013 described Gtr1-Gtr2 as the yeast
      Rag GTPase heterodimer that associates with Ego1 and Ego3 in EGOC for amino
      acid activation of TORC1.
  posed_by: codex
  posed_date: '2026-09-18'
  resolved_date: '2026-09-18'
- discussion_id: lst4_lst7_gap_boundary
