discussions:
- discussion_id: ap5_clathrin_scope
  prompt: Avoid modeling AP-5 as a constitutive clathrin-coat adaptor.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - causal_graphs#ap5_adaptor_complex_topology
  rationale: GO:0044599 makes AP-5 a child of AP-type membrane coat adaptor complex
    but explicitly notes that it is unclear whether AP-5 forms clathrin coats in vivo.
    This record therefore keeps AP-5 under the AP-type parent while avoiding a universal
    AP-5-to-clathrin-coat edge or a clathrin-coat part_of assertion.
  evidence:
  - reference: GO:0044599
    notes: GO definition and parentage source for AP-5.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
