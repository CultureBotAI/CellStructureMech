functions:
- function_id: ap5_endosomal_sorting
  label: AP-5-associated endosomal sorting
  description: AP-5 is an endosome-associated adaptor complex implicated in sorting
    cargo through late endosomal compartments.
  evidence:
  - reference: DOI:10.1371/journal.pbio.1001170
    notes: Hirst et al. 2011 showed that tagged AP-5 localizes to a late endosomal
      compartment in HeLa cells and that AP-5 subunit knockdown perturbs cation-independent
      mannose 6-phosphate receptor trafficking and produces swollen endosomal structures
      with tubules.
