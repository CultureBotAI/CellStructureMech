identifier: GO:0044599
label: AP-5 adaptor complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An AP-type membrane coat adaptor complex that in humans consists of beta5,
  zeta, mu5 and sigma5 subunits and is found associated with membranes in the endosomes;
  it is not clear whether AP-5 forms clathrin coats in vivo.
