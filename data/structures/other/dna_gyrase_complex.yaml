identifier: GO:0120217
label: DNA gyrase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: DNA gyrase complex is a bacterial GyrA2-GyrB2 type IIA topoisomerase complex
  that uses ATP hydrolysis to introduce negative supercoils into DNA and can also
  relax positive supercoils.
