functions:
- function_id: dna_negative_supercoiling_activity
  label: DNA negative supercoiling activity
  grounding: GO:0034335
  description: DNA gyrase introduces negative supercoils into DNA and couples DNA
    topological transformation to ATP hydrolysis.
  evidence:
  - reference: GO:0034335
    notes: GO:0034335 defines DNA negative supercoiling activity as the catalytic
      introduction of negative supercoils into DNA.
  - reference: GO:0120217
    notes: GO:0120217 defines the DNA gyrase complex as a bacterial type IIA topoisomerase
      that introduces negative supercoils at the expense of ATP hydrolysis.
  - reference: PDB:6RKU
    notes: PDB:6RKU contains two GyrA chains, two GyrB chains, and DNA polymer entities
      in the Escherichia coli gyrase-DNA nucleoprotein complex.
