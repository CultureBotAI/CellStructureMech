identifier: GO:0032126
label: eisosome
structure_category: OTHER
structure_kind: SUBCELLULAR_REGION
definition: A cell part that is composed of the eisosome membrane or MCC domain, a
  furrow-like plasma membrane sub-domain and associated integral transmembrane proteins,
  and the proteins (eisosome filaments) that form a scaffolding lattice on the cytoplasmic
  face. Eisosomes broadly affect overall plasma membrane organization.
