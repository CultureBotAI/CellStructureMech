- component_id: sur7_membrane_protein
  label: Sur7 MCC integral membrane protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SUR7
  role: An integral plasma-membrane protein that localizes to the membrane-compartment-of-Can1
    domain within eisosomes.
  evidence:
  - reference: DOI:10.1038/nature04472
    notes: Walther et al. 2006 identified the plasma-membrane protein Sur7 as an eisosome-localized
      protein.
  - reference: DOI:10.1146/annurev-micro-091313-103507
    notes: Douglas and Konopka 2014 reviewed Sur7-family proteins as integral proteins
      of fungal MCC/eisosome domains.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam or NCBIfam accession for
    the Sur7-family eisosome membrane proteins was curated in this pass.
