components:
- component_id: apical_complex_cytoskeletal_proteins
  label: apical-complex cytoskeletal proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The apical complex contains multiple unrelated conoid, polar-ring
    and other cytoskeletal proteins; no exact source-neutral CURIE was curated for
    the whole apical-cytoskeleton cohort.
  role: Cytoskeletal proteins that build and position apical structures such as the
    conoid and apical polar ring.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 partially purified the Toxoplasma conoid/apical complex
      and identified candidate cytoskeletal proteins.
  - reference: DOI:10.1073/pnas.2416602121
    notes: Ren et al. 2024 resolved protein layers of the Toxoplasma apical polar
      ring within the apical complex.
- component_id: apical_secretory_organelle_proteins
  label: apical secretory-organelle proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Microneme and rhoptry cargo proteins span many unrelated families.
    They are grouped here only as apical-complex secretory-organelle constituents.
  role: Secretory proteins stored in micronemes and rhoptries before their ordered
    discharge during host-cell invasion.
  evidence:
  - reference: PMID:9208224
    notes: Carruthers and Sibley 1997 observed sequential microneme, rhoptry and dense-granule
      secretion during Toxoplasma invasion.
  - reference: DOI:10.1038/nrmicro1800
    notes: Boothroyd and Dubremetz 2008 review Toxoplasma rhoptries and their apical
      secretory roles during host-cell invasion.
taxonomic_distribution:
- taxon_id: NCBITaxon:5794
  taxon_label: Apicomplexa
  presence: COMMON
  note: The apical complex is the eponymous anterior cytoskeletal and secretory apparatus
    of apicomplexan invasive stages, with lineage- and stage-specific variation in
    individual substructures.
  reference: DOI:10.1128/mmbr.00197-22
canonical_examples:
- taxon_id: NCBITaxon:5811
  taxon_label: Toxoplasma gondii
  note: Apicomplexan model in which the conoid/apical-complex cytoskeleton was partially
    purified for proteomic analysis.
  reference: DOI:10.1371/journal.ppat.0020013
functions:
- function_id: host_cell_invasion
  label: host-cell invasion
  description: The apical complex positions cytoskeletal and secretory parts that
    support attachment to and invasion of host cells by apicomplexan zoites.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0020013
    notes: Hu et al. 2006 studied the Toxoplasma apical complex as a cytoskeletal
      invasion machine.
  - reference: DOI:10.1128/mmbr.00197-22
    notes: Waller and Carruthers 2024 review apical-complex and secretory-organelle
      diversity in Myzozoa and Apicomplexa.
- function_id: ordered_apical_organelle_secretion
  label: ordered apical-organelle secretion
  description: Micronemes and rhoptries at the apical complex discharge in an ordered
    sequence during invasion, coordinating attachment, moving-junction formation and
    vacuole establishment.
  evidence:
  - reference: PMID:9208224
    notes: Carruthers and Sibley 1997 showed that Toxoplasma micronemes, rhoptries
      and dense granules secrete sequentially during invasion.
  - reference: DOI:10.1038/nrmicro1800
    notes: Boothroyd and Dubremetz 2008 review rhoptry secretion after host-cell attachment
      and at the start of invasion.
evidence:
- reference: DOI:10.1371/journal.ppat.0020013
  notes: Hu et al. 2006, Cytoskeletal Components of an Invasion Machine--the Apical
    Complex of Toxoplasma gondii, PLOS Pathogens.
- reference: PMID:9208224
  notes: Carruthers and Sibley 1997, Sequential protein secretion from three distinct
    organelles of Toxoplasma gondii accompanies invasion of human fibroblasts, European
    Journal of Cell Biology.
- reference: DOI:10.1073/pnas.2416602121
  notes: Ren et al. 2024, Architecture of the Toxoplasma gondii apical polar ring
    and its role in gliding motility and invasion, Proceedings of the National Academy
    of Sciences.
- reference: DOI:10.1038/nrmicro1800
  notes: 'Boothroyd and Dubremetz 2008, Kiss and spit: the dual roles of Toxoplasma
    rhoptries, Nature Reviews Microbiology.'
- reference: DOI:10.1128/mmbr.00197-22
  notes: Waller and Carruthers 2024, Adaptations and metabolic evolution of myzozoan
    protists across diverse lifestyles and environments, Microbiology and Molecular
    Biology Reviews.
