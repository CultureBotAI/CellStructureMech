identifier: GO:0020007
label: apical complex
structure_category: OTHER
structure_kind: OTHER
definition: A group of cytoskeletal structures and associated membrane-bounded organelles
  at the anterior end of apicomplexan parasites that supports host-cell attachment,
  penetration, and parasite proliferation.
definition_source: GO:0020007
mapping_status: PROPOSED
