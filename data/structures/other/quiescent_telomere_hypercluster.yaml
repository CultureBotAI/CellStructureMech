components:
- component_id: telomeric_dna
  label: telomere
  component_type: DNA
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Chromosome-end DNA brought together within the nuclear assembly.
  grounding: SO:0000624
  evidence:
  - reference: DOI:10.1093/nar/gkaa043
    notes: Taz1-marked chromosome ends form fewer, brighter foci on nitrogen starvation;
      this is not a claim that every chromosome end is individually resolved.
  grounding_notes: Native SO telomere sequence-feature identity verified; the component
    denotes chromosome-end DNA, not the entire multi-chromosome hypercluster.
- component_id: subtelomeric_dna
  label: subtelomere
  component_type: DNA
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Subtelomeric DNA associated with the coalescing chromosome ends.
  grounding: SO:0001997
  evidence:
  - reference: DOI:10.1186/s13059-015-0766-2
    notes: Y-prime FISH and chromosome-contact mapping establish subtelomeric association;
      a Y-prime probe does not label every chromosome end equally.
  grounding_notes: Native SO subtelomere definition verified; the sequence feature
    is adjacent to the telomere, not equivalent to the whole hypercluster.
- component_id: nucleosome
  label: nucleosome
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: DNA-histone packing unit of the associated subtelomeric chromatin.
  grounding: GO:0000786
  evidence:
  - reference: DOI:10.1091/mbc.E16-01-0069
    notes: Histone H4 tail and K16 substitutions implicate nucleosomal chromatin in
      hypercluster formation. This is a chromatin-class assertion, not an isoform-specific
      localization or copy-number measurement.
  grounding_notes: Native GO definition specifies DNA wound around a multisubunit
    histone core. Terminal telomeric repeats are not asserted to be uniformly nucleosomal.
- component_id: sirtuin
  label: Sirtuin family
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Sir2-class chromatin factor detected in budding-yeast telomere hyperclusters.
  grounding: InterPro:IPR003000
  evidence:
  - reference: DOI:10.1091/mbc.E16-01-0069
    notes: Sir2-GFP overlaps telomeric FISH and Sir3/Rap1 foci; sir2 deletion impairs
      formation in the tested background. Separate nucleolar Sir2 signal must not
      be called a telomere cluster.
  grounding_notes: Exact integrated family and P06700 membership verified at InterPro.
    This class does not assert that every sirtuin is a hypercluster constituent.
