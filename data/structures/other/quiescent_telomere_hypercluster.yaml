  llm_assisted: true
- timestamp: '2026-10-05T17:49:23Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added twelve component classes, nine verified protein examples, species-scoped
    mechanisms, three dataset links, one hosted and two link-only inspected figures,
    and explicit evidence conflicts and access limits.
  llm_assisted: true
