  - reference: DOI:10.1091/mbc.E16-01-0069
  - reference: DOI:10.1093/nar/gkaa043
- discussion_id: newer_anchoring_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Review the full published 2026 Esc1 study when accessible.
  notes: 'The published abstract of Ruault et al. (PMID 42584369; electronic publication
    2026-08-12) proposes redundant PKA-dependent and Esc1-dependent anchoring, progressive
    loss of anchoring during entry, and central hyperclustering; it argues against
    altered Sir3-mediated attraction as the main driver. The publisher redirected
    to an abstract/subscription page and Europe PMC lists no full text. Only the abstract
    was read: no residue identity, quantitative model parameter or new causal edge
    is inferred. The 2025 preprint and conference abstract are not treated as independently
    inspected full-text evidence.'
  evidence:
