evidence:
- reference: DOI:10.1186/s13059-015-0766-2
  notes: Guidi et al. 2015, PMID 26399229; native PMC4581094.1 Results, Discussion
    and relevant Methods read. Density purification, microscopy, 3C/Hi-C and chronological-survival
    assays.
- reference: DOI:10.1091/mbc.E16-01-0069
  notes: Laporte et al. 2016, PMID 27122604; native PMC4907721.1 Results, Discussion
    and relevant Methods read. FISH, tagged proteins, positioning, chromatin perturbations
    and refeeding assays.
- reference: DOI:10.1093/nar/gkaa043
  notes: Maestroni et al. 2020, PMID 31980821; native PMC7102995.1 Results, Discussion
    and relevant Methods read. Nitrogen-starved fission yeast; clustering, attachment,
    telomere erosion and TERRA accumulation are distinguished.
- reference: DOI:10.1101/gr.279874.124
  notes: Baquero Perez et al. 2025, PMID 40796281; native PMC12487827.1 clustering-related
