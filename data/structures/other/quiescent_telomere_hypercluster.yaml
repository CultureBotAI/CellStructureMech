- discussion_id: assembly_scope_and_essentiality
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate required factors in specific assays from universal component necessity.
  notes: Sir2/Sir3/Sir4 deletion impairs budding-yeast assembly, but this does not
    establish identical requirements across both yeasts or all mutant contexts; their
    record-wide essentiality is UNKNOWN. Ku80 is directly localized yet individually
    dispensable. Esc1 and Bqt4 are dispensable positioning machinery, not stoichiometric
    core residents. Sir3 abundance/spreading is not increased in 2015; 2016 reports
    a slight abundance change and suggests background differences. No universally
    increased Sir3 level is asserted.
  evidence:
  - reference: DOI:10.1186/s13059-015-0766-2
  - reference: DOI:10.1091/mbc.E16-01-0069
  - reference: DOI:10.1093/nar/gkaa043
- discussion_id: component_declines
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not import whole regulatory complexes, markers or tethering diagrams
    as focus composition.
  notes: Hho1/condensin and H4-state perturbations support chromatin assembly roles,
    but do not supply hypercluster-specific residence for all regulator subunits.
    Nucleosomes are retained as the packing class of subtelomeric chromatin, without
    assigning an H4 isoform or all terminal repeats to nucleosomes. Yku80 localization
    does not establish Yku70 residence; the 2016 Yku70 nondetection is reported as
    unpublished. Fission-yeast Rap1 belongs to the same TE2IP/Rap1 family, but the
    2020 schematic/established tether is not a direct G0 localization experiment,
    so no second Rap1 sequence example is added. Bqt3, Man1/Fft3, the whole shelterin
    complex, telomerase, TERRA, nuclear-pore markers, nucleolus and spindle pole body
    are not automatically constituents.
  evidence:
  - reference: DOI:10.1186/s13059-015-0766-2
  - reference: DOI:10.1091/mbc.E16-01-0069
  - reference: DOI:10.1093/nar/gkaa043
  - reference: GO:0000786
- discussion_id: function_boundaries
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Resolve survival effects without equating grouping, silencing and envelope
    attachment.
  notes: The 2015 study reports a modest late chronological-survival benefit associated
    with Sir3-dependent clustering, including a silencing-defective rescue. The 2016
    2/7/14-day assays find no significant requirement for survival or early regrowth
    in their conditions. These differ in strain, population and assay; no universal
    longevity function is asserted. In 2020, TERRA accumulation and rearrangements
    primarily track envelope attachment and become especially pronounced with telomere
    erosion. Those outcomes are not assigned to grouping alone, and steady-state RNA
    abundance is not a direct transcription-rate measurement.
  evidence:
  - reference: DOI:10.1186/s13059-015-0766-2
  - reference: DOI:10.1091/mbc.E16-01-0069
  - reference: DOI:10.1093/nar/gkaa043
- discussion_id: transcription_and_disassembly
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep transcriptional transitions separate from hypercluster dynamics.
  notes: The 2025 W303 study finds transcriptional shutdown before hyperclustering
    and largely unchanged shutdown in sir3 deletion. On refeeding, transcription starts
    before declustering; rpb1-1 and phenanthroline support largely independent dispersal,
    whereas thiolutin gives a distinct, pleiotropic result. RNA polymerase II is therefore
    not inferred a hypercluster constituent or mandatory disassembly trigger. The
    2016 reverse-acetylation and chromosome-decondensation explanations remain hypotheses.
  evidence:
  - reference: DOI:10.1101/gr.279874.124
  - reference: DOI:10.1091/mbc.E16-01-0069
