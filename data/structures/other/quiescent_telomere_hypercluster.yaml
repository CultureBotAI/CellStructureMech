identifier: cellstructuremech:quiescent_telomere_hypercluster
label: quiescent telomere hypercluster
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A nuclear assembly in which multiple chromosome ends and associated subtelomeric
  chromatin coalesce into fewer enlarged foci during quiescence, characterized in
  Saccharomyces cerevisiae and Schizosaccharomyces pombe. Nuclear position and assembly
  requirements depend on species, strain and starvation conditions.
definition_source: DOI:10.1186/s13059-015-0766-2
mapping_status: PROPOSED
curation_history:
