discussions:
- discussion_id: identity_and_mereology
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the multi-chromosome assembly separate from individual telomeres and
    other nuclear structures.
  notes: Ignored- and hidden-inclusive identity, synonym and citation searches plus
    parsed YAML identities found no duplicate. OAK GO aliases and native definitions
    supplied no exact hypercluster term. It is a protein-DNA assembly within the nucleus,
    not part of one chromosome or necessarily the nuclear envelope. It differs from
    ordinary cycling-cell telomere clusters, the meiotic bouquet, telomerase and the
    quiescent nuclear microtubule bundle. Bare hypercluster names are broader synonyms
    because Sir3 overexpression can induce them outside quiescence.
