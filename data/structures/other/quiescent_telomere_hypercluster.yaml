- discussion_id: nuclear_position_conflict
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Resolve condition-dependent central versus peripheral hyperclusters without
    assigning one universal position.
  notes: The 2015 W303 study places the brightest hyperclusters centrally; the 2016
    predominantly BY study places them near the envelope and shows Esc1-dependent
    position. The 2020 fission-yeast study finds peripheral attachment dependent on
    Bqt4. Population sorting, strain, age and starvation protocol differ, but no single
    tested explanation is imposed on the discrepancy. A diffraction-limited proximity
    measurement is not a molecular tether-distance measurement.
  evidence:
