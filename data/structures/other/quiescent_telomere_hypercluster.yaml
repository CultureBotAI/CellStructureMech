canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  reference: DOI:10.1186/s13059-015-0766-2
  note: Budding yeast studied in W303 and BY backgrounds. Central hyperclusters in
    density-enriched quiescent populations and peripheral clusters under other published
    conditions are retained as distinct observations, not forced into one nuclear
    position.
- taxon_id: NCBITaxon:4896
  taxon_label: Schizosaccharomyces pombe
  reference: DOI:10.1093/nar/gkaa043
  note: Nitrogen-starved fission yeast forms a predominantly single bright telomeric
    focus near the nuclear envelope; clustering and envelope attachment are experimentally
    separable.
functions:
- function_id: telomere_organization
  label: telomere organization
  grounding: GO:0032200
  description: Spatial grouping of chromosome ends and associated chromatin during
    quiescence.
  evidence:
  - reference: DOI:10.1186/s13059-015-0766-2
    notes: Microscopy and chromosome-contact maps support chromosome-end reorganization.
  - reference: DOI:10.1093/nar/gkaa043
    notes: Fission-yeast microscopy supports a quiescent redistribution of telomere
      foci; envelope-dependent TERRA regulation is not assigned to clustering alone.
causal_graphs:
- graph_id: budding_yeast_assembly
  title: Condition-dependent budding-yeast hypercluster assembly
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Physiological and perturbation evidence in S. cerevisiae, not a universal
    fungal pathway. Sir3 requirement is distinct from a claim that increased Sir3-mediated
    attraction drives the transition; the 2026 anchoring model is recorded separately
    with its access limitation.
  nodes:
  - node_id: starvation
    label: Starvation after respiratory growth
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: assembly
    label: Telomere hypercluster formation
    node_type: BIOLOGICAL_PROCESS
  - node_id: sir3
    label: Sir3-like silencing protein
    node_type: GENE_OR_PROTEIN
    component_ref: sir3
  - node_id: h4_state
    label: Assembly-compatible histone H4 K16 state
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: starvation
    predicate: stimulates
    object: assembly
    description: Prior respiratory growth favors efficient formation after starvation;
      arrest alone is insufficient and maturation depends on protocol.
    evidence:
    - reference: DOI:10.1186/s13059-015-0766-2
      notes: Carbon-exhaustion, abrupt-starvation and respiration perturbations distinguish
        metabolic history from slow growth alone.
    - reference: DOI:10.1101/gr.279874.124
      notes: Density-enriched post-diauxic cells transferred to water also form hyperclusters.
  - subject: sir3
    predicate: supports
    object: assembly
    description: Sir3 supports normal hypercluster formation in the tested budding-yeast
      backgrounds.
    evidence:
    - reference: DOI:10.1186/s13059-015-0766-2
      notes: Deletion and chromosome-contact experiments support the assembly requirement,
        without proving increased protein abundance.
  - subject: h4_state
    predicate: supports
    object: assembly
    description: An intact H4 tail and compatible K16 state support formation; K16A
      and K16Q impair it whereas K16R permits it.
    evidence:
    - reference: DOI:10.1091/mbc.E16-01-0069
      notes: Histone substitutions support a chromatin-state contribution, not direct
        observation of an exact Sir3 bridging reaction.
- graph_id: peripheral_positioning
  title: Anchoring is separable from cluster formation
  graph_kind: REGULATION
  scope_status: MECHANISTIC
  scope_notes: Species- and condition-scoped deletion evidence. These edges concern
    nuclear position, not a universal requirement to assemble a hypercluster. Central
    budding-yeast clusters and the newer loss-of-anchoring model are not excluded.
  nodes:
  - node_id: esc1
    label: Esc1-like anchoring machinery
    node_type: GENE_OR_PROTEIN
    component_ref: esc1
  - node_id: bqt4
    label: Bouquet formation protein 4
    node_type: GENE_OR_PROTEIN
    component_ref: bqt4
  - node_id: budding_position
    label: Peripheral cluster position in tested budding yeast
    node_type: BIOLOGICAL_PROCESS
  - node_id: fission_position
    label: Peripheral cluster position in nitrogen-starved fission yeast
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: esc1
    predicate: supports
    object: budding_position
    description: Esc1 contributes to peripheral positioning in the 2016 conditions;
      esc1 deletion does not abolish clustering.
    evidence:
    - reference: DOI:10.1091/mbc.E16-01-0069
      notes: Esc1 deletion separates positioning from cluster formation.
  - subject: bqt4
    predicate: supports
    object: fission_position
    description: Bqt4 maintains peripheral attachment while G0 cluster counts remain
      similar without it.
    evidence:
    - reference: DOI:10.1093/nar/gkaa043
      notes: Figure 3 and Results distinguish envelope position from the number of
        clusters.
- graph_id: refeeding_disassembly
  title: Budding-yeast declustering during quiescence exit
  graph_kind: DISASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Refeeding experiments in S. cerevisiae. Timing varies by assay; transcriptional
    reactivation and protein synthesis are not inferred obligatory triggers.
  nodes:
  - node_id: refeeding
    label: Nutrient refeeding
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: declustering
    label: Telomere hypercluster dispersal
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: refeeding
    predicate: stimulates
    object: declustering
    description: Nutrient readdition induces dispersion into multiple smaller foci;
      transcriptional reactivation is largely dispensable under the tested perturbations.
    evidence:
    - reference: DOI:10.1091/mbc.E16-01-0069
      notes: Cycloheximide, latrunculin A and nocodazole do not prevent dispersal
        in the reported assay.
    - reference: DOI:10.1101/gr.279874.124
      notes: rpb1-1 inactivation and phenanthroline largely preserve declustering
        despite impaired transcription. Thiolutin differs and has broader effects.
