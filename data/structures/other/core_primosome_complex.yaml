identifier: GO:1990098
label: core primosome complex
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A protein-DNA complex containing at least one DNA helicase and one primase.
  Can also contain associated proteins. The helicase component continues to unwind
  the double-stranded DNA (dsDNA) and the primase component synthesizes a RNA primer
  during initiation or restart of replication.
