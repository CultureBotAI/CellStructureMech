discussions:
- discussion_id: resolve_core_primosome_component_groundings
  prompt: Resolve exact source-neutral helicase, primase and template-DNA groundings
    for the core primosome complex.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#replicative_dna_helicase
  - components#dna_primase
  - components#template_dna
  rationale: GO:1990098 defines a protein-DNA complex containing a DNA helicase, primase
    and associated DNA template. Exact source-neutral InterPro, Pfam, NCBIfam, UniProt
    family or SO sequence-feature CURIEs for these components need narrower curation
    before the labels can be grounded.
  evidence:
  - reference: GO:1990098
    notes: GO:1990098 defines the helicase, primase and DNA scope of the core primosome.
  posed_by: codex
  posed_date: '2026-10-01'
- discussion_id: distinguish_core_primosome_boundary
  prompt: Model the core primosome separately from the broader primosome, primase-lacking
    pre-primosomes and the protein-only DnaB-DnaG complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - components#replicative_dna_helicase
  - components#dna_primase
  - components#template_dna
  rationale: GO:1990098 denotes a DNA-bound helicase-primase core, GO:1990077 denotes
    the broader primosome class, GO:1990099 denotes primase-lacking pre-primosomes,
    and species-specific helicase-primase protein subcomplexes such as GO:1990156
    are narrower parts of particular core primosomes rather than generic GO:1990098
    has_part structures.
  resolution_note: Curated GO:1990077 as the is-a parent and kept DnaB-DnaG, DnaC
    and pre-primosome accessory proteins out of this generic core-primosome record.
  evidence:
  - reference: GO:1990098
    notes: GO:1990098 defines the DNA-bound core primosome.
  - reference: GO:1990077
    notes: QuickGO reports GO:1990098 as an is-a descendant of GO:1990077.
  - reference: GO:1990099
    notes: GO:1990099 defines pre-primosome complexes as lacking a primase component.
  - reference: GO:1990156
    notes: GO:1990156 denotes the DnaB-DnaG protein complex, which is narrower than
      the generic DNA-bound core primosome.
  posed_by: codex
  posed_date: '2026-10-01'
  resolved_date: '2026-10-01'
