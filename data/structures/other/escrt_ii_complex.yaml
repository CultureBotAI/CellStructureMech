functions:
- function_id: multivesicular_body_sorting_pathway
  label: multivesicular body sorting pathway
  grounding: GO:0071985
  description: ESCRT-II acts after ESCRT-I in the endosomal MVB pathway and promotes
    downstream ESCRT-III recruitment during cargo sorting.
  evidence:
  - reference: GO:0071985
    notes: GO:0071985 denotes the vesicle-mediated transport pathway that moves ubiquitylated
      transmembrane proteins into multivesicular-body luminal vesicles.
  - reference: DOI:10.1016/j.devcel.2009.07.008
    notes: Im et al. 2009 mapped the ESCRT-II/VPS20 interface and showed that ESCRT-II
      directly activates ESCRT-III-driven vesicle budding and scission in vitro.
