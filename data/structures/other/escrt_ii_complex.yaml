    activation of ESCRT-III-driven membrane scission.
- reference: DOI:10.1126/science.1161070
  notes: Lata et al. 2008 analyzed ESCRT-III assembly and Vps4-mediated ESCRT-III
    disassembly.
causal_graphs:
- graph_id: yeast_escrt_ii_mvb_escrt_iii_recruitment
  title: ESCRT-II recruits ESCRT-III during yeast MVB sorting
  description: In Saccharomyces cerevisiae, Vps22, Vps25 and Vps36 form ESCRT-II,
    which transiently associates with endosomal membranes and initiates ESCRT-III
    formation during MVB sorting.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph represents the Vps22/Vps25/Vps36 yeast ESCRT-II core and
    its downstream ESCRT-III recruitment role without modeling ESCRT-I cargo handoff,
    Vps4 recycling, or ESCRT-III polymerization.
