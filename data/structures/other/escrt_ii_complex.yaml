identifier: GO:0000814
label: ESCRT II complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An endosomal sorting complex required for transport and functions downstream
  of ESCRT I complex. It consists of the class E vacuolar protein sorting (Vps) proteins
  and is required for the membrane recruitment of ESCRT III complex and binds to ubiquitinated
  cargoes.
