functions:
- function_id: histone_deacetylase_activity
  label: histone deacetylase activity
  grounding: GO:0004407
  description: The Rpd3L complex is an Rpd3-containing histone deacetylase complex
    that preferentially deacetylates histones in promoter regions.
  evidence:
  - reference: GO:0033698
    notes: GO:0033698 defines Rpd3L as a histone deacetylase complex that preferentially
      deacetylates histones in promoter regions.
  - reference: GO:0004407
    notes: GO:0004407 is the Gene Ontology molecular-function term for histone deacetylase
      activity.
  - reference: DOI:10.1016/j.cell.2005.10.023
    notes: Carrozza et al. 2005 characterized Rpd3L as one of two budding-yeast Rpd3
      histone deacetylase complexes.
  - reference: DOI:10.1016/j.cell.2005.10.025
    notes: Keogh et al. 2005 characterized Rpd3C(L) as the larger Rpd3 complex.
