identifier: GO:0033698
label: Rpd3L complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A histone deacetylase complex which deacetylates histones preferentially
  in promoter regions. Composed of a two copies of catalytic histone deacetylase subunit
  (S. pombe Clr6/ S. cerevisiae Rpd3p), an Sds-3 family protein (S. pombe /S. cerevisiae
  Sds3(p) ), two copies of SIN3 family co-repressor (S. pombe Pst1/ S. cerevisiae
  Sin3p, a WD repeat protein/ histone chaperone (S. pombe Prw1/ S. cerevisiae Ume1p),
  and a zf- PHD finger ( S. pombe Png2/ S. cerevisiae Pho23p), plus 4 additional subunits,
  and associated factors.
definition_source: GO:0033698
