functions:
- function_id: macroautophagy
  label: macroautophagy
  grounding: GO:0016236
  description: TRAPPIII contributes to macroautophagy by targeting Ypt1 GEF activity
    to the phagophore assembly site during autophagosome formation.
  evidence:
  - reference: GO:0016236
    notes: GO:0016236 defines macroautophagy as the autophagic process that proceeds
      through autophagosome formation.
  - reference: DOI:10.1073/pnas.1000063107
    notes: Lynch-Day et al. 2010 described TRAPPIII as an autophagy-specific Ypt1
      GEF and showed that Trs85 directs it to the phagophore assembly site.
