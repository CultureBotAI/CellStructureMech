identifier: GO:1990072
label: TRAPPIII protein complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'A complex that functions in anterograde transport at the Golgi and also
  regulates autophagy. In yeast it includes at least the following subunits: Bet3
  (as homodimer), Bet5, Trs20, Trs23, Trs31, Trs33, Trs85. TRAPPIII may include further,
  as yet undescribed, proteins.'
