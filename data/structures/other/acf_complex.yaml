identifier: GO:0016590
label: ACF complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An ISWI complex that contains an ATPase subunit of the ISWI family (SNF2H
  in mammals, Isw2 in S. cerevisiae), an ACF1 homolog, and generally no other subunits,
  though Xenopus is an exception with a third non-conserved subunit. ACF plays roles
  in regulation of RNA polymerase II transcription and in DNA replication and repair.
