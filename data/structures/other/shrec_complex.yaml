identifier: GO:0070824
label: SHREC complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A histone deacetylase complex that contains a core of four proteins --
  Clr1, Clr2, Clr3, and Mit1 in fission yeast -- and localizes to all heterochromatic
  regions in the genome as well as some euchromatic sites. The complex is involved
  in regulating nucleosome positioning to assemble higher-order chromatin structures.
