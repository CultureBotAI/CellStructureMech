  posed_date: '2026-09-18'
- discussion_id: gtr1_gtr2_not_gator1_components
  prompt: Do not model the Gtr1/Gtr2 Rag-family GTPases as constituent GATOR1/SEACIT
    subunits.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#iml1_gator1_subunit
  - components#npr2_gator1_subunit
  - components#npr3_gator1_subunit
  - causal_graphs#yeast_gator1_torc1_regulation
  rationale: Panchaud et al. 2013 identified Iml1/Npr2/Npr3 as the yeast GATOR1/SEACIT
    counterpart that acts as a GAP for the Rag-family GTPase Gtr1, while GO:1990130
    defines the Saccharomyces cerevisiae GATOR1/SEACIT complex itself as Iml1p, Npr2p
    and Npr3p.
  resolution_note: 'Declined: Gtr1 was included as the non-component Rag-family GAP
    target for graph context instead of as a constituent.'
  evidence:
  - reference: GO:1990130
    notes: Gene Ontology cellular-component term for the GATOR1 complex, including
      the Saccharomyces cerevisiae SEACIT counterpart.
  - reference: DOI:10.1126/scisignal.2004112
    notes: Panchaud, Peli-Gulli and De Virgilio 2013 identified Iml1 in complex with
      Npr2 and Npr3 as a yeast GAP for the Rag-family GTPase Gtr1 during amino acid
      deprivation.
  posed_by: codex
  posed_date: '2026-09-18'
  resolved_date: '2026-09-18'
- discussion_id: gator2_seacat_boundary
  prompt: Keep the GATOR2/SEACAT subcomplex outside this GATOR1 record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#iml1_gator1_subunit
  - components#npr2_gator1_subunit
  - components#npr3_gator1_subunit
  - causal_graphs#yeast_gator1_torc1_regulation
  rationale: GO separates GATOR1/SEACIT from GATOR2/SEACAT, and Bar-Peled et al. 2013
    separated human GATOR into two subcomplexes; GATOR2/SEACAT therefore belongs in
    a separate record rather than this Iml1/Npr2/Npr3 GAP complex.
  evidence:
  - reference: GO:1990130
    notes: Gene Ontology cellular-component term for the GATOR1 complex.
  - reference: GO:0061700
    notes: Gene Ontology cellular-component term for the GATOR2 complex.
  - reference: DOI:10.1126/science.1232044
    notes: Bar-Peled et al. 2013 separated GATOR into GATOR1 and GATOR2 subcomplexes.
  posed_by: codex
  posed_date: '2026-09-18'
  resolved_date: '2026-09-18'
