functions:
- function_id: bright_dependent_igh_enhancer_regulation
  label: Bright-dependent immunoglobulin heavy-chain enhancer regulation
  description: LYSp100B/Sp140 can interact with the Bright/ARID3A matrix-attachment
    region-binding transcription factor and is redistributed from LANDs while stimulating
    Bright transactivation through the immunoglobulin heavy-chain intronic enhancer.
  evidence:
  - reference: DOI:10.1093/emboj/19.15.4123
    notes: Zong, Das and Tucker 2000 connected LYSp100B, Bright and LAND redistribution
      with matrix-attachment-region-dependent IgH enhancer transcription in lymphoid
      cells.
