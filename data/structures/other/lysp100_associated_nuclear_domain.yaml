    was assigned in this first record.
  role: Lymphoid-cell SP100 homolog that concentrates in LANDs and can be redistributed
    by the Bright/ARID3A transcription factor.
  evidence:
  - reference: PMID:8695863
    notes: Dent et al. 1996 cloned human LYSP100 and localized LYSP100 protein to
      LAND nuclear dots that were mostly nonoverlapping with PML nuclear bodies.
  - reference: DOI:10.1093/emboj/19.15.4123
    notes: Zong, Das and Tucker 2000 analyzed the LYSp100B/Sp140 homolog of Sp100
      and its redistribution from LANDs after interaction with Bright.
