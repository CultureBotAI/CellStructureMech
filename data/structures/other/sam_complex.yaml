functions:
- function_id: protein_insertion_into_mitochondrial_outer_membrane
  label: protein insertion into mitochondrial outer membrane
  grounding: GO:0045040
  description: The SAM complex acts after TOM to sort and assemble a subset of imported
    proteins into the mitochondrial outer membrane.
  evidence:
  - reference: GO:0001401
    notes: GO:0001401 defines SAM as the mitochondrial outer-membrane machinery that
      sorts some imported proteins and assembles them into the membrane after TOM
      import.
  - reference: GO:0045040
    notes: GO:0045040 defines insertion of proteins into the mitochondrial outer membrane
      by large outer-membrane translocase complexes.
  - reference: DOI:10.1038/nature01753
    notes: Wiedemann et al. 2003 separated the SAM outer-membrane sorting and assembly
      step from the upstream TOM translocase step.
evidence:
