identifier: GO:0030870
label: Mre11 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: Trimeric protein complex that possesses endonuclease activity; involved
  in meiotic recombination, DNA repair and checkpoint signaling. In Saccharomyces
  cerevisiae, the complex comprises Mre11p, Rad50p, and Xrs2p; complexes identified
  in other species generally contain proteins orthologous to the Saccharomyces cerevisiae
  proteins.
