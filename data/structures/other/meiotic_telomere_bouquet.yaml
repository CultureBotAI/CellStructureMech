  - subject: maintenance
    predicate: supports
    object: spindle
    description: Premature bouquet disruption increases SPB and spindle defects.
    evidence:
    - reference: DOI:10.1038/celldisc.2017.41
      notes: Auxin-dependent Bqt1 destruction yields defective SPBs and spindles;
        not all cells fail, and controls lacking the degron retain meiosis.
