- discussion_id: tether_boundary_conflict
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Resolve the core-versus-accessory placement of Csm4 within the smaller t-LINC
    complex.
  notes: 'The two 2020 studies agree that Csm4 associates with telomeres and Mps2
    and is required for normal dynamics, but differ in their structural model: Fan
    et al. call Mps2-Mps3-Csm4 a heterotrimeric t-LINC, while Lee et al. favor Csm4
    as an accessory regulator. Both place it at the assembled telomere-tether system,
    so it is retained as a bouquet constituent without deciding the smaller complex
    boundary. The proposed nonamer in Fan Figure 7 is not measured copy number and
    is not imported as stoichiometry.'
  evidence:
  - reference: DOI:10.26508/lsa.202000824
  - reference: DOI:10.1016/j.cub.2020.01.054
- discussion_id: species_and_essentiality
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep species-specific components and assembly requirements separate.
  notes: These are component classes with explicitly paired sequence examples, not
    a claim that every bouquet contains every listed factor. Mps3 and Sad1 share the
    verified SUN family; Mps2 and Kms1 are not forced into one family. Depletion/deletion
    requirements in one organism do not establish record-wide universal essentiality,
    which remains UNKNOWN. The Kms1 recruitment experiment in 2025 is partial ectopic
    mitotic reconstitution; it is not presented as a normal meiotic localization assay.
  evidence:
  - reference: DOI:10.26508/lsa.202000824
  - reference: DOI:10.1038/celldisc.2017.41
  - reference: DOI:10.1038/s41467-025-56049-9
- discussion_id: component_declines
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish telomere tethers from drivers, general envelope anchors and
    downstream machinery.
  notes: The composition list focuses on chromosome ends and their bouquet connector
    system. Bqt3/Bqt4 are general pre-existing envelope anchors discussed by the sources;
    their importance for encounter/attachment is not by itself bouquet-core occupancy.
    Myo2 binds the assembled budding-yeast tether and Myo1/Myo4 can label dispersed
    meiotic ends, but those movement assays do not establish specific residence in
    the clustered bouquet; external motors and entire actin/microtubule systems are
    therefore not listed as bouquet constituents. Cdc2/Cdc13 transiently accumulate
    at the telomere-SPB interface as signaling effectors; no fixed bouquet subunit
    status is inferred. Rec8 chromosome-axis, histone chromatin, Tub4/Sid4/Ppc89 SPB
    and envelope markers do not automatically import their entire complexes. The nucleus,
    SPB, telocentrosome and synaptonemal complex are not collapsed into the bouquet.
  evidence:
  - reference: DOI:10.26508/lsa.202000824
  - reference: DOI:10.1038/celldisc.2017.41
  - reference: DOI:10.1016/j.cub.2020.01.054
  - reference: DOI:10.1038/s41467-025-56049-9
- discussion_id: disassembly_phosphorylation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Identify the physiological release mechanism without equating correlation
    with causation.
  notes: Rap1 phosphorylation increases through meiotic prophase, but the tested multi-site
    phosphomimetic and nonphosphorylatable mutants retain normal bouquet formation
    and dissociation. Rap1-DD337AA instead specifically disrupts Bqt1/2 binding and
    clustering. Induced Bqt1-AID destruction demonstrates maintenance dependence,
    not that auxin or the engineered degron is a natural disassembly pathway. The
    complete physiological trigger remains unresolved.
  evidence:
  - reference: DOI:10.1186/s12915-015-0149-x
  - reference: DOI:10.1038/celldisc.2017.41
- discussion_id: function_and_reconstitution_limits
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Avoid making clustering the unique cause of every mutant phenotype.
  notes: Budding-yeast pairing/gene-conversion experiments perturb tethering and movement
    together; Mps2 also has independent SPB roles. Fission-yeast bqt1 mutants can
    still divide successfully in a subset of cells. The 2025 experiments show that
    retained Ndc80-SPB attachment inhibits meiotic entry/bouquet completion, while
    ectopic Bqt1/Bqt2 recruitment in mitosis is incomplete. Neither the mitotic reconstituted
    t-LINC nor a partial telocentrosome is itself the normal meiotic bouquet.
  evidence:
  - reference: DOI:10.26508/lsa.202000824
  - reference: DOI:10.1038/celldisc.2017.41
  - reference: DOI:10.1038/s41467-025-56049-9
- discussion_id: taxon_and_measurement_limits
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Preserve experimental taxon and measurement scope.
  notes: Only the two directly characterized yeast species are canonical examples;
    no fungal prevalence or absence row is inferred. UniProt strain identities are
    sequence references, not exact SK1 or mating-stock assignments. Fission-yeast
    persistence through prophase and transient budding-yeast clustering are not assigned
    one universal duration. Fluorescent focus counts, spatial resolution, schematic
    models and culture-hour measurements do not supply molecular stoichiometry, dimensions
    or universal chromosome counts.
  evidence:
