discussions:
- discussion_id: identity_and_mereology
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the chromosome assembly distinct from its formation process and tether
    subcomplexes.
  notes: Ignored- and hidden-inclusive name, synonym, identity and citation searches
    plus parsed YAML identities found no existing bouquet record. GO:0045141 denotes
    meiotic telomere clustering, a biological process, not the structure. GO:0034993
    and GO:1990612 denote smaller membrane linkers; neither is an exact identity.
    The bouquet is a protein-DNA assembly within the nucleus, containing nuclear chromosomes
    and their telomeric regions, not part of one chromosome or the whole SPB. It is
    distinct from the quiescent telomere hypercluster, ordinary interphase clusters,
    telomerase and the entire horsetail nucleus.
