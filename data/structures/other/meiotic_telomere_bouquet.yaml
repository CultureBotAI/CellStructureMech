identifier: cellstructuremech:meiotic_telomere_bouquet
label: meiotic telomere bouquet
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A polarized nuclear chromosome assembly in which telomeric ends and their
  anchoring proteins cluster within a restricted region of the nuclear envelope during
  meiotic prophase. Characterized in fission and budding yeast, it organizes chromosome
  ends while chromosome arms extend into the nucleus; its duration and tethering machinery
  differ between species.
definition_source: DOI:10.1038/celldisc.2017.41
mapping_status: PROPOSED
