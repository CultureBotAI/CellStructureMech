functions:
- function_id: telomere_organization
  label: telomere organization
  grounding: GO:0032200
  description: Polarized organization of chromosome ends during meiotic prophase.
  evidence:
  - reference: DOI:10.26508/lsa.202000824
    notes: Direct imaging of Rap1-marked peripheral clusters.
  - reference: DOI:10.1038/celldisc.2017.41
    notes: Taz1-marked telomeres remain clustered near the SPB during prophase.
- function_id: pairing_and_recombination
  label: Support of homolog pairing and meiotic recombination
  description: The budding-yeast tether/bouquet system supports efficient homolog
    pairing and gene conversion, without making clustering alone the exclusive cause.
  evidence:
  - reference: DOI:10.26508/lsa.202000824
    notes: Mps2-depleted and csm4-deleted cells show delayed pairing at LYS4 and reduced
      gene conversion at ARG4/HIS4. Tethering, motion and clustering effects are not
      experimentally isolated from one another.
- function_id: meiotic_spindle_support
  label: Support of meiotic spindle formation
  description: Maintained fission-yeast telomere-SPB attachment supports normal SPB
    behavior and spindle formation.
  evidence:
  - reference: DOI:10.1038/celldisc.2017.41
    notes: Premature Bqt1 destruction increases spindle defects. Some bouquet-deficient
      cells still divide successfully, so no absolute requirement or universal fungal
      function is asserted.
