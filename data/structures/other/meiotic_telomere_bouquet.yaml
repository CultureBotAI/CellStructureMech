  - subject: maintenance
    predicate: supports
    object: cdk1
    description: The maintained bouquet supports timely accumulation of CDK1-cyclin
      B at the SPB.
    evidence:
    - reference: DOI:10.1038/celldisc.2017.41
      notes: Live-cell Cdc2/Cdc13 localization and bqt1 deletion comparisons; the
