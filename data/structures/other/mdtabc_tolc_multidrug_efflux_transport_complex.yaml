    predicate: transports
    object: xenobiotic
    description: MdtABC-TolC exports novobiocin, bile salts, quinolones, fosfomycin,
      detergents, myricetin, zinc, and other exported substrates through the tripartite
      pump.
    evidence:
    - reference: ComplexPortal:CPX-2119
      notes: CPX-2119 summarizes the MdtABC-TolC complex as exporting novobiocin,
        bile salts, quinolones, fosfomycin, detergents, myricetin, and zinc.
  - subject: outer_membrane_export
