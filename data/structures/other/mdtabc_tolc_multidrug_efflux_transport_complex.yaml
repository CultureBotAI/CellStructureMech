identifier: cellstructuremech:mdtabc_tolc_multidrug_efflux_transport_complex
label: MdtABC-TolC multidrug efflux transport complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An Escherichia coli Resistance-Nodulation-Division-family cell-envelope
  efflux pump complex composed of MdtA, MdtB, MdtC, and TolC subunits that exports
  novobiocin, bile salts, quinolones, fosfomycin, detergents, myricetin, zinc, and
  other substrates from the cell.
definition_source: ComplexPortal:CPX-2119
