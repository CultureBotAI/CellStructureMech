      MdtC.
    evidence:
    - reference: ComplexPortal:CPX-2119
      notes: CPX-2119 curates MdtB and MdtC as linked participants in the E. coli
        MdtABC-TolC pump.
  - subject: mdtc
    predicate: couples to
    object: mdta
    description: MdtC completes the inner-membrane MdtBC transport core that couples
      to the MdtA adaptor.
    evidence:
    - reference: ComplexPortal:CPX-2119
      notes: CPX-2119 curates MdtA, MdtB, and MdtC as participants in the E. coli
        MdtABC-TolC pump.
  - subject: mdta
    predicate: couples to
    object: tolc
    description: MdtA membrane-fusion adaptor subunits connect the MdtBC transporter
      to the TolC outer-membrane channel.
    evidence:
    - reference: UniProtKB:P76397
      notes: UniProtKB reports that MdtABC forms a tripartite efflux system and requires
        TolC for function.
  - subject: mdtabc_tolc
    predicate: enables
    object: xenobiotic_transport
    description: The assembled MdtABC-TolC complex enables xenobiotic transmembrane
      transporter activity.
    evidence:
    - reference: ComplexPortal:CPX-2119
      notes: Complex Portal cross-references GO:0042910 for the MdtABC-TolC complex.
