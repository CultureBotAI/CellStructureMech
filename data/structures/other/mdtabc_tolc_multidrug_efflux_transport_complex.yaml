  title: MdtABC-TolC exports xenobiotics across the cell envelope
  description: MdtB, MdtC, MdtA, and TolC form an envelope-spanning RND efflux pump
    that exports drug substrates and other xenobiotics from E. coli.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the four-protein MdtABC-TolC boundary and whole-complex
    xenobiotic export function without resolving RND substrate-binding sites, proton-coupled
    transport states, or TolC gate opening.
