- discussion_id: trappi_excludes_trappii_trappiii_specific_subunits
  prompt: Do not model Tca17, Trs65, Trs85, Trs120 or Trs130 as constituent TRAPPI
    core-complex components.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#bet3_trappi_subunit
  - components#bet5_trappi_subunit
  - components#trs20_trappi_subunit
  - components#trs23_trappi_subunit
  - components#trs31_trappi_subunit
  - components#trs33_trappi_subunit
  - causal_graphs#yeast_trappi_er_to_golgi_tethering
  rationale: GO:0030008 is the broader TRAPP-complex parent, whereas GO:1990070 denotes
    the TRAPPI core complex. Tca17, Trs65, Trs120 and Trs130 are TRAPPII-specific
    subunits in the GO definition of GO:1990071; Trs85 is the defining extra yeast
    TRAPPIII subunit in GO:1990072.
  resolution_note: 'Declined: additional yeast TRAPP subunits belong to the TRAPPII/TRAPPIII
    subtype boundary rather than the exact TRAPPI core complex curated here.'
  evidence:
  - reference: GO:1990071
    notes: GO:1990071 lists Tca17, Trs65, Trs120 and Trs130 among the yeast TRAPPII
      protein-complex subunits.
  - reference: GO:1990072
    notes: GO:1990072 lists Trs85 as a yeast TRAPPIII protein-complex subunit.
  - reference: DOI:10.1078/S0171-9335(04)70009-6
    notes: Sacher et al. 2000 identified Trs65, Trs85, Trs120 and Trs130 among the
      broader set of yeast TRAPP subunits.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
