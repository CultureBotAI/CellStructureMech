identifier: GO:1990070
label: TRAPPI protein complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'A complex that tethers COPII vesicles at ER-Golgi intermediate compartment.
  Its role in this part of the vesicular transport may start at the ER exit sites.
  Binds to a component of the COPII coat. In yeast it includes the following subunits:
  Bet3 (as homodimer), Bet5, Trs20, Trs23, Trs31, Trs33 which are regarded as the
  core subunits of all TRAPP complexes in yeast.'
definition_source: GO:1990070
mapping_status: PROPOSED
