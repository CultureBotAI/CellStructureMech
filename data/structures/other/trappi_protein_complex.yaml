causal_graphs:
- graph_id: yeast_trappi_er_to_golgi_tethering
  title: TRAPPI supports yeast ER-to-Golgi vesicle tethering
  description: In Saccharomyces cerevisiae, Bet3, Bet5, Trs20, Trs23, Trs31 and Trs33
    form the TRAPPI core complex that specifically tethers COPII vesicles during ER-to-Golgi
    traffic.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records TRAPPI core subunit membership and ER-to-Golgi transport
    involvement without modeling the Ypt1/Rab1 guanine-nucleotide-exchange reaction,
    COPII coat contacts, or later recruitment of other tethers.
