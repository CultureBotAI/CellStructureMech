identifier: GO:0005657
label: replication fork
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: The Y-shaped region of a replicating DNA molecule, resulting from the
  separation of the DNA strands and in which the synthesis of new strands takes place.
  Also includes associated protein complexes. The Y-shaped nucleoprotein junction
  on a replicating chromosome where parental double-stranded DNA is unwound by the
  replicative DNA helicase into leading and lagging single-stranded templates and
  copied by the replisome in bacteria, archaea, and microbial eukaryotes. When stalled
  by DNA lesions or dNTP depletion, the replication fork recruits RPA, the 9-1-1 (Ddc1–Mec3–Rad17)
  checkpoint clamp, and Mec1/ATR kinases to stabilize the fork and prevent replication
  catastrophe.
