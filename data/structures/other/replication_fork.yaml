causal_graphs:
- graph_id: replication_fork_mechanism
  title: Replication fork progression, stalling sensing, and 9-1-1 checkpoint stabilization
  description: Unwinding of parental DNA ahead of DNA polymerases at a stalled replication
    fork exposes RPA-coated ssDNA–dsDNA junctions, recruiting Rad24-RFC to load the
    Ddc1–Mec3–Rad17 clamp and activate Mec1/Rad53 fork-stabilizing signaling.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the three fission-yeast checkpoint clamp constituents
    and their GO-level DNA-damage-response function without resolving RFC-like clamp
    loading, Rad3-Rad26 signaling or Chk1 activation.
