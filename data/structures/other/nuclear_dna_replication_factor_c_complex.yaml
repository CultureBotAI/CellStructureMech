functions:
- function_id: dna_clamp_loader_activity
  label: DNA clamp loader activity
  grounding: GO:0003689
  description: DNA replication factor C loads the sliding-clamp processivity factor
    PCNA onto DNA. Mediated by nuclear DNA replication factor C complex (GO:0043599)
    within the pentameric nuclear DNA replication factor C clamp-loader complex.
  evidence:
  - reference: GO:0005663
    notes: GO:0005663 defines the RFC complex by its role in loading PCNA onto DNA.
