identifier: GO:0043599
label: nuclear DNA replication factor C complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A nuclear complex of five polypeptides that loads the DNA polymerase processivity
  factor proliferating cell nuclear antigen (PCNA) onto DNA, thereby permitting processive
  DNA synthesis catalyzed by DNA polymerase delta or epsilon. In Saccharomyces and
  several other species, the subunits are known as Rfc1p-Rfc5p, although subunit names
  do not necessarily correspond between different species.
