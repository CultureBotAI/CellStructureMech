  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Exhibits nuclear DNA replication factor C complex (GO:0043599) within the
    pentameric nuclear DNA replication factor C clamp-loader complex. Budding yeast
    has a DNA replication factor C complex encoded by the RFC1, RFC2, RFC3, RFC4,
    and RFC5 genes.
