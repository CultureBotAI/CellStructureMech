causal_graphs:
- graph_id: nuclear_dna_replication_factor_c_complex_mechanism
  title: Nuclear RFC ATP-dependent PCNA sliding clamp loading onto primed DNA
  description: The pentameric nuclear DNA replication factor C complex (Rfc1-Rfc5)
    binds primer-template junctions at the nuclear replication fork and uses ATP binding
    and hydrolysis to open and close the homotrimeric PCNA ring around DNA.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records RFC composition and GO-level clamp-loader and DNA-replication
    functions without resolving PCNA ring opening, ATPase cycling, or primer-template
    engagement.
