    notes: GO:0003689 is the Gene Ontology molecular-function term for DNA clamp loader
      activity.
- function_id: dna_replication
  label: DNA replication
  grounding: GO:0006260
  description: DNA replication factor C permits processive DNA synthesis by loading
    PCNA for replicative DNA polymerases. Mediated by nuclear DNA replication factor
    C complex (GO:0043599) within the pentameric nuclear DNA replication factor C
    clamp-loader complex.
  evidence:
  - reference: GO:0005663
    notes: GO:0005663 defines the RFC complex as permitting processive DNA synthesis
      catalyzed by DNA polymerase.
  - reference: GO:0006260
    notes: GO:0006260 is the Gene Ontology biological-process term for DNA replication.
