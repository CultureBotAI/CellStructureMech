discussions:
- discussion_id: cell_cortex_substructure_boundary
  prompt: Should actin, Arp2/3, or septin proteins be duplicated as direct cell cortex
    components?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#yeast_cell_cortex_substructure_topology
  rationale: GO:0005938 denotes the sub-plasma-membrane region. Actin cortical patches
    and septin rings are cortex-localized substructures that already have their own
    structure records, so actin, Arp2/3, and septin constituents remain on those lower-level
    records instead of being duplicated as molecular components of the parent region.
  evidence:
  - reference: GO:0005938
    notes: GO:0005938 identifies the cell-cortex region.
  - reference: GO:0030479
    notes: GO:0030479 identifies the actin cortical patch as a cortex-localized structure.
  - reference: GO:0005940
    notes: GO:0005940 identifies the septin ring at the cell cortex.
