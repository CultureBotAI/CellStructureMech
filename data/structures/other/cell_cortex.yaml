functions:
- function_id: cortical_cytoskeletal_organization
  label: cortical cytoskeletal organization
  description: The budding-yeast cell cortex localizes actin cortical patches during
    endocytic internalization and septin rings at the division plane.
  evidence:
  - reference: GO:0005938
    notes: GO:0005938 defines the cell cortex as the sub-plasma-membrane region that
      can contain actin filaments and associated proteins.
  - reference: DOI:10.1016/S0092-8674(03)00883-3
    notes: Kaksonen, Sun and Drubin 2003 followed yeast endocytic internalization
      at cortical actin-patch sites.
  - reference: DOI:10.3389/fcell.2016.00123
    notes: Glomb and Gronemeyer 2016 review septin-ring organization and cytokinesis
      functions at the budding-yeast cortex.
