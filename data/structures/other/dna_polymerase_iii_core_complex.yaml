functions:
- function_id: dna_polymerase_core_activity
  label: DNA-directed DNA polymerase activity
  grounding: GO:0003887
  description: The DNA polymerase III core carries the polymerase and 3'-5' proofreading
    activities that become processive when auxiliary holoenzyme subunits load and
    tether the beta clamp.
  evidence:
  - reference: GO:0044776
    notes: GO:0044776 defines the core as the subcomplex that carries out polymerase
      and 3'-5' exonuclease proofreading activities.
  - reference: PMID:3283127
    notes: Maki and Kornberg 1988 reported that the Pol III core possesses polymerase
      and proofreading activities while auxiliary subunits provide processivity.
