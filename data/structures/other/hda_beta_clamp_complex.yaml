- discussion_id: distinguish_hda_beta_and_dnaa_hda_states
  prompt: Keep the Hda-beta clamp complex distinct from the DnaA-Hda complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - has_part
  - components#hda_regulator
  - components#dnaN_beta_clamp
  - causal_graphs#hda_beta_clamp_rida
  rationale: GO:1990085 denotes Hda bound to the DnaN beta clamp, whereas GO:1990083
    separately denotes the DnaA-Hda complex. Kurz et al. 2004 established direct Hda-beta
    interaction, and GO:1990085 scopes that Hda-beta entity to the replication-inhibiting
    state.
  resolution_note: Curated Hda and the beta sliding clamp on GO:1990085 and left DnaA
    itself out of the component list, has_part links, and graph edges.
  evidence:
  - reference: GO:1990085
    notes: GO:1990085 denotes the Hda-beta clamp complex.
  - reference: GO:1990083
    notes: GO:1990083 denotes the separately scoped DnaA-Hda complex.
  - reference: PMID:15150238
    notes: Kurz et al. 2004 established Hda interaction with the beta sliding clamp.
  posed_by: codex
