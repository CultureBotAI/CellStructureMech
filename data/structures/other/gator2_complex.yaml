  - reference: DOI:10.1126/science.1232044
    notes: Bar-Peled et al. 2013 separated human GATOR into GATOR1 and GATOR2 subcomplexes
      that regulate Rag-dependent amino-acid-sensitive mTORC1 signaling.
  posed_by: codex
  posed_date: '2026-09-18'
  resolved_date: '2026-09-18'
