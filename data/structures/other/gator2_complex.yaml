  - components#seh1_gator2_subunit
  - components#sec13_gator2_subunit
  - causal_graphs#yeast_gator2_torc1_regulation
  rationale: GO separates GATOR2/SEACAT from GATOR1/SEACIT, and Bar-Peled et al. 2013
    separated human GATOR into two subcomplexes; the Iml1/Npr2/Npr3 GAP branch therefore
    belongs in the distinct GATOR1 record.
  resolution_note: 'Declined: GATOR1/SEACIT was kept as the sibling GAP subcomplex
    instead of as a constituent of GATOR2.'
  evidence:
  - reference: GO:0061700
    notes: Gene Ontology cellular-component term for the GATOR2 complex, including
      the Saccharomyces cerevisiae SEACAT counterpart.
  - reference: GO:1990130
