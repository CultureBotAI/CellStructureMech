identifier: GO:0030689
label: Noc complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: Any of several heterodimers containing one or two Noc proteins, associated
  with preribosomal complexes; involved in ribosome biogenesis. A family of nucleolar
  and nucleoplasmic heterodimeric ribosome-biogenesis factor complexes in Saccharomyces
  cerevisiae and other eukaryotes composed of Noc (nucleolar complex-associated) proteins,
  specifically the Noc1p–Noc2p complex and the Noc2p–Noc3p complex. Noc complexes
  associate with nascent 90S and pre-60S ribosomal particles to coordinate rRNA folding
  and processing with the intranuclear transport of pre-60S subunits from the nucleolus
  to the nucleoplasm.
