identifier: GO:0016581
label: NuRD complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An approximately 2 MDa multi-subunit complex that exhibits ATP-dependent
  chromatin remodeling activity in addition to histone deacetylase (HDAC) activity,
  and has been shown to establish transcriptional repression of a number of target
  genes in vertebrates, invertebrates and fungi. Amongst its subunits, the NuRD complex
  contains histone deacetylases, histone binding proteins and Mi-2-like proteins.
  The Nucleosome Remodeling and Deacetylase (NuRD) family of multiprotein chromatin
  silencing complexes (exemplified in microbial eukaryotes by the fission yeast Schizosaccharomyces
  pombe SHREC complex) that couples class II histone deacetylase activity (Clr3) with
  CHD/Mi-2-family ATP-dependent chromatin remodeling (Mit1). Together with scaffold
  subunits Clr1, Clr2, and the AAA+ ATPase chaperone Cdc20/Ccq1, NuRD/SHREC deacetylates
  H3K14ac and positions nucleosomes to compact heterochromatin.
