identifier: GO:0071986
label: Ragulator complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A vacuolar membrane-anchored guanine nucleotide exchange factor (GEF)
  complex for the Rag GTPases (Gtr1-Gtr2 GTPase complex GO:1990131) in TORC1 signaling
  pathway. In human, Ragulator is comprised of the membrane anchor subunit LAMTOR1
  (Meh1p in S. cerevisiae, Lam1 in S. pombe), a GEF subunit LAMTOR2 ( Slm4 in S. cerevisiae
  , Lam2 in S. pombe ) , LAMTOR3 (no S. cerevisiae ortholog identified, Lam3 in S.
  pombe) , LAMTOR4 (no S. cerevisiae ortholog identified, Lam4 in S. pombe), and LAMTOR5
  (no S. cerevisiae or S. pombe ortholog identified).
