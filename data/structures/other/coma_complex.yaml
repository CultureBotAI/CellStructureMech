functions:
- function_id: inner_outer_kinetochore_bridging
  label: inner-to-outer kinetochore bridging
  description: COMA links centromeric DNA-proximal kinetochore subunits to microtubule-bound
    modules during kinetochore assembly.
  evidence:
  - reference: GO:0000817
    notes: GO:0000817 defines COMA by the bridge it forms between centromeric-DNA-proximal
      and microtubule-bound kinetochore subunits.
  - reference: DOI:10.1101/gad.1144403
    notes: De Wulf, McAinsh and Sorger 2003 analyzed COMA within a hierarchical budding-yeast
      kinetochore assembly pathway.
