identifier: GO:0000817
label: COMA complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A kinetochore multiprotein complex that bridges the subunits that are
  in contact with centromeric DNA and the subunits bound to microtubules during kinetochore
  assembly. In yeast, consists of Ctf19p, Okp1p, Mcm21p, and Ame1p.
