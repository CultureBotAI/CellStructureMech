  title: Cohesin-dockerin binding assembles a cellulose-degrading machine
  description: A primary scaffoldin concentrates dockerin-bearing hydrolases through
    cohesin-dockerin interactions, and the assembled complex binds insoluble cellulose
    so its enzymes can hydrolyze plant cell-wall polysaccharides cooperatively.
