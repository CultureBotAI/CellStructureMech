discussions:
- discussion_id: ap3_mucocyst_boundary
  prompt: Use Tetrahymena AP-3 as AP-3 evidence without curating it as a mature mucocyst
    component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - taxonomic_distribution
  - canonical_examples
  rationale: Kaur et al. 2017 support a required upstream role for AP-3 in Tetrahymena
    mucocyst formation and maturation. This anchors the AP-3 adaptor-complex record,
    while AP-3 remains outside the mucocyst component list because the cited role
    is biogenesis rather than stable mature-organelle membership.
  evidence:
  - reference: DOI:10.1091/mbc.e17-01-0018
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
- discussion_id: ap3_clathrin_scope
  prompt: Avoid modeling every AP-3 adaptor complex as a clathrin-coat constituent.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#ap3_adaptor_complex_topology
  rationale: The GO:0030123 definition explicitly notes that AP-3 does not appear
    to associate with clathrin in all organisms. This record therefore keeps the parent-level
    membrane-coat adaptor identity through GO:0030119 but avoids a universal AP-3
    to clathrin edge.
  evidence:
  - reference: GO:0030123
    notes: GO definition for AP-3 adaptor complexes.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
