identifier: GO:0030123
label: AP-3 adaptor complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heterotetrameric AP-type membrane coat adaptor complex that consists
  of beta3, delta, mu3 and sigma3 subunits and is found associated with endosomal
  membranes. AP-3 does not appear to associate with clathrin in all organisms. In
  at least humans, the AP-3 complex can be heterogeneric due to the existence of multiple
  subunit isoforms encoded by different genes (beta3A and beta3B, mu3A and mu3B, and
  sigma3A and sigma3B).
