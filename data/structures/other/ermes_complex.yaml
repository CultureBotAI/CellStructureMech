functions:
- function_id: er_mitochondria_lipid_exchange
  label: ER-mitochondria lipid exchange
  description: ERMES physically links ER and mitochondrial membranes and its Mmm1-Mdm12
    module can mediate direct lipid transfer between membranes.
  evidence:
  - reference: GO:0032865
    notes: GO:0032865 defines ERMES as linking the ER with mitochondria and potentially
      promoting calcium and phospholipid exchange between those organelles.
  - reference: DOI:10.1083/jcb.201704119
    notes: Kawano et al. 2018 found that the Mmm1-Mdm12 module of ERMES could transfer
      lipids between membranes in vitro.
