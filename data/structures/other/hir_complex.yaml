discussions:
- discussion_id: asf1_not_hir_component
  prompt: Do not model Asf1 as a constituent of the HIR complex.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: Green et al. 2005 reported that Hir1, Hir2, Hir3 and Hpc2 comprise the
    budding-yeast HIR complex and that this complex copurifies with Asf1, supporting
    Asf1 as a histone-deposition partner rather than one of the four HIR constituents.
  resolution_note: 'Declined: Asf1 cooperates and copurifies with HIR during histone
    deposition, but the HIR complex itself is curated as Hir1, Hir2, Hir3 and Hpc2.'
  evidence:
  - reference: DOI:10.1016/j.cub.2005.10.053
    notes: Green et al. 2005 reported that the budding-yeast HIR complex comprises
      Hir1, Hir2, Hir3 and Hpc2 and copurifies with Asf1.
  posed_by: codex
  posed_date: '2026-09-26'
  resolved_date: '2026-09-26'
- discussion_id: resolve_hir_family_groundings
  prompt: Resolve exact source-neutral family groundings for the HIR complex constituents.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#hir1_hir_subunit
  - components#hir2_hir_subunit
  - components#hir3_hir_subunit
  - components#hpc2_hir_subunit
  rationale: GO:0000417 defines the Saccharomyces Hir1p, Hir2p, Hir3p and Hpc2p proteins
    as HIR complex constituents. Exact cross-eukaryotic InterPro, Pfam, NCBIfam or
    UniProt family boundaries for these HIR subunit classes need narrower curation
    before the component labels can be grounded.
  evidence:
  - reference: GO:0000417
    notes: GO:0000417 defines the budding-yeast HIR complex subunits.
  posed_by: codex
  posed_date: '2026-09-26'
