discussions:
- discussion_id: exclude_ssue_from_ssud_complex
  prompt: Should the SsuE FMN reductase be modeled as a component of the alkanesulfonate
    monooxygenase complex?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: No. GO:1990201 denotes the SsuD tetrameric alkanesulfonate monooxygenase
    complex, while GO:1990200 separately denotes the SsuD-SsuE complex and GO:1990202
    denotes the SsuE FMN reductase dimer.
  evidence:
  - reference: GO:1990201
    notes: GO:1990201 defines the E. coli alkanesulfonate monooxygenase complex as
      a SsuD tetramer.
  - reference: GO:1990200
    notes: GO:1990200 is the sibling cellular-component term for the SsuD-SsuE complex.
  - reference: GO:1990202
    notes: GO:1990202 is the sibling cellular-component term for the FMN reductase
      complex.
  posed_by: codex
  posed_date: '2026-10-01'
