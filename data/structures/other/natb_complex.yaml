components:
- component_id: nat3_natb_catalytic_subunit
  label: Nat3 NatB catalytic subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - NAT3
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The budding-yeast NatB literature follows Nat3 naming; no exact
    source-neutral InterPro, Pfam, NCBIfam or UniProt family identifier for this NatB
    subunit class was curated in this pass.
  role: Catalytic constituent of the budding-yeast NatB complex that works with Mdm20
    to provide N-terminal acetyltransferase activity.
  evidence:
  - reference: DOI:10.1074/jbc.M304690200
    notes: Polevoda et al. 2003 report that Saccharomyces cerevisiae NatB is composed
      of interacting Nat3p and Mdm20p subunits, both required for NatB acetyltransferase
      activity.
  - reference: DOI:10.1016/s0006-291x(03)01316-0
    notes: Polevoda and Sherman 2003 review the eukaryotic N-terminal acetyltransferase
      complexes and describe yeast NatB as the Nat3p catalytic subunit with the Mdm20p
      auxiliary subunit.
