identifier: GO:0031416
label: NatB complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A conserved complex that catalyzes the transfer of an acetyl group to
  the N-terminal residue of a protein acceptor molecule that has a Met-Glu, Met-Asp,
  Met-Asn, or Met-Met N-terminus. In Saccharomyces the complex includes Nat3p and
  Mdm20p.
