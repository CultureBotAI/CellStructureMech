  - reference: GO:0031416
    notes: GO:0031416 defines the NatB complex by transfer of acetyl groups to N-terminal
      Met-Glu, Met-Asp, Met-Asn or Met-Met protein residues.
  - reference: DOI:10.1074/jbc.M304690200
    notes: Polevoda et al. 2003 describe budding-yeast NatB as an Nalpha-terminal
      acetyltransferase that acts on proteins with Met-Glu or Met-Asp N-termini and
      subclasses with Met-Asn or Met-Met N-termini.
