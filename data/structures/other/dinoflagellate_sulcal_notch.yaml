identifier: GO:0097618
label: dinoflagellate sulcal notch
structure_category: OTHER
structure_kind: SUBCELLULAR_REGION
definition: A dinoflagellate sulcus that extends all the way to the posterior end
  of the cell (also known as antapex). The presence of a sulcal notch makes the dinoflagellate
  hypocone appear bilobed.
