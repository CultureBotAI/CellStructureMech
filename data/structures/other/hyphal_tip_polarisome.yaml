components:
- component_id: spa2_scaffold
  label: SPA-2 polarisome scaffold
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - SPA-2
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SPA-2 is curated as the Neurospora hyphal-tip polarisome marker
    and scaffold homolog; no exact source-neutral family CURIE was assigned for the
    fungal Spa2 cohort.
  role: Scaffold marker that partially overlaps the Spitzenkorper and extends into
    the apical dome of mature Neurospora hyphae.
  evidence:
  - reference: DOI:10.1371/journal.pone.0030372
    notes: Lichius et al. 2012 compared BUD-6 and BNI-1 localization with SPA-2 as
      a bona fide Neurospora polarisome marker and integrated SPA-2 into the mature
      hyphal-tip architecture.
- component_id: bud6_actin_associated_polarity_protein
  label: BUD-6 actin-associated polarity protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - BUD-6
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: BUD-6 is curated as the Neurospora Bud6/Aip3 homolog observed in
    the mature hyphal-tip architecture; no exact source-neutral family CURIE was assigned
    for the broader fungal Bud6 cohort.
  role: Actin-associated polarity protein that forms a subapical cloud around the
    Spitzenkorper in mature Neurospora hyphae.
  evidence:
  - reference: DOI:10.1371/journal.pone.0030372
    notes: Lichius et al. 2012 localized BUD-6 to a dynamic subapical cloud that surrounds
      the Spitzenkorper during Neurospora mature hyphal-tip growth.
- component_id: bni1_formin
  label: BNI-1 formin
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - BNI-1
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: BNI-1 is curated as the Neurospora formin in the hyphal-tip polarisome;
    no exact fungal-wide formin family CURIE was assigned because broader families
    include paralogs outside this localized architecture.
  role: Formin that localizes in apical clusters and the Spitzenkorper core at mature
    Neurospora hyphal tips.
  evidence:
  - reference: DOI:10.1371/journal.pone.0030372
    notes: Lichius et al. 2012 assayed BNI-1 and placed it in both the apical cap
      and Spitzenkorper core of the mature Neurospora hyphal tip.
