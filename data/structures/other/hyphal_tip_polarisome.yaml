- discussion_id: exclude_polarisome_independent_roles
  prompt: Keep septal plugging, cell fusion, and cytokinesis roles outside the first
    hyphal-tip polarisome boundary.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#bud6_actin_associated_polarity_protein
  - components#bni1_formin
  - causal_graphs#mature_hyphal_tip_polarisome_topology
  rationale: Lichius et al. 2012 identified BUD-6 and BNI-1 functions at cell-fusion
    sites, septa, and cytokinetic rings that are independent of the hyphal-tip polarisome,
