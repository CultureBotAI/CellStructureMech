discussions:
- discussion_id: septin_and_polarity_machinery_on_substructures
  prompt: Keep septin and polarisome proteins on their own structure records rather
    than duplicating them as cellular bud neck components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#bud_neck_septin_topology
  rationale: GO:0005935 and UniProt SL-0029 identify the mother-daughter neck region.
    The septin ring and bud-neck polarisome are localized substructures, so this regional
    record links the septin ring by has_part and leaves septin or polarisome protein
    constituents on their own records.
  resolution_note: Curated region-level bud-neck topology and did not duplicate septin
    or polarisome proteins as direct molecular components.
  evidence:
  - reference: GO:0005935
    notes: GO:0005935 identifies the cellular bud neck region.
  - reference: GO:0005940
    notes: GO:0005940 identifies the septin ring substructure.
  - reference: DOI:10.3389/fcell.2016.00123
    notes: Glomb and Gronemeyer 2016 review septin-ring organization at the budding-yeast
      bud neck.
