identifier: GO:1990203
label: MdtBC Complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex containing two transmembrane subunits; a MdtB dimer
  and one unit of MdtC. Capable of exporting substrates across the cell membrane.
  Involved in conferring antibiotic resistance of Gram-negative bacteria by transporting
  drugs across the membrane.
