identifier: GO:0071261
label: Ssh1 translocon complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An endoplasmic-reticulum translocon complex with a core heterotrimer of
  alpha, beta, and gamma subunits, represented in budding yeast by Ssh1p, Sbh2p, and
  Sss1p, that supports cotranslational protein transport across the ER membrane.
