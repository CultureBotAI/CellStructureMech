- discussion_id: ssh1_partner_boundary
  prompt: Should membrane-bound ribosomes or the SRP receptor beta subunit be included
    as Ssh1 translocon complex components?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#ssh1_alpha_translocon_subunit
  - components#sbh2_beta_subunit
  - components#sss1_gamma_subunit
  - causal_graphs#ssh1_cotranslational_er_translocation
  rationale: Membrane-bound ribosomes and the SRP receptor contact Ssh1 during cotranslational
    ER import, but the directly curated core is the Ssh1p/Sbh2p/Sss1p trimer.
  evidence:
  - reference: PMID:8612571
    notes: Finke et al. 1996 used membrane-bound ribosome interaction as evidence
      for Ssh1 cotranslational function.
  - reference: DOI:10.1091/mbc.01-10-0518
    notes: Wittke et al. 2002 used Ssh1p proximity to the SRP receptor beta subunit
      as evidence for cotranslational translocation.
  resolution_note: Modeled Ssh1p, Sbh2p, and Sss1p as Ssh1 translocon constituents
    and left ribosomes and the SRP receptor outside the core complex.
  posed_by: codex
  posed_date: '2026-09-18'
