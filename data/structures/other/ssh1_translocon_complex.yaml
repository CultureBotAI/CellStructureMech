functions:
- function_id: ssh1_cotranslational_er_translocation
  label: Ssh1-dependent cotranslational ER protein translocation
  description: The Ssh1 translocon supports cotranslational translocation of a subset
    of signal-sequence-bearing substrates across the endoplasmic-reticulum membrane.
  evidence:
  - reference: GO:0071261
    notes: GO:0071261 defines Ssh1 as a translocon complex involved in the cotranslational
      pathway of protein transport across the ER membrane.
  - reference: PMID:8612571
    notes: Finke et al. 1996 discovered the Ssh1p complex in the Saccharomyces cerevisiae
      ER membrane and proposed that, unlike Sec61, it functions exclusively in cotranslational
      protein transport.
  - reference: DOI:10.1091/mbc.01-10-0518
    notes: Wittke et al. 2002 showed that Ssh1p physically approaches the SRP receptor
      beta subunit in vivo and recognizes a subset of ER signal sequences.
