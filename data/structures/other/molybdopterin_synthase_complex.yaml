identifier: GO:1990140
label: molybdopterin synthase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heterotetrameric protein complex that catalyses sulfur transfer from
  the sulfur carrier subunit of molybdopterin synthase to precursor Z to synthesize
  molybdopterin as part of molybdopterin cofactor (Moco) biosynthesis. In E. coli
  the subunits are MoaE and MoaD; in human, MOCS2B and MOCS2A. Moco biosynthesis and
  its constituent molecules are evolutionarily conserved.
