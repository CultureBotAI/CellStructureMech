components:
- component_id: moad_sulfur_carrier_subunit
  label: Molybdopterin synthase sulfur carrier subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR044672
  gene_symbols:
  - moaD
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: Small ubiquitin-fold sulfur carrier subunit containing a conserved C-terminal
    Gly-Gly motif that carries a thiocarboxylate group into the MoaE active site to
    donate dithiolene sulfur atoms to precursor Z.
  protein_examples:
  - uniprot_id: UniProtKB:P30748
    protein_label: Molybdopterin synthase sulfur carrier subunit
    gene_symbol: moaD
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-31'
    role: Reviewed Escherichia coli K-12 sulfur carrier subunit MoaD.
    evidence:
    - reference: UniProtKB:P30748
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 MoaD.
    - reference: PMID:17223713
      snippet: In Escherichia coli, the MoaD protein plays a central role in the conversion
        of precursor Z to molybdopterin (MPT) during molybdenum cofactor biosynthesis.
        MoaD has a fold similar to that of ubiquitin and contains a highly conserved
        C-terminal Gly-Gly motif, which in its active form contains a transferrable
        sulfur in the form of a thiocarboxylate group.
      notes: Establishes the structure and thiocarboxylate sulfur-carrier role of
        E. coli MoaD.
  evidence:
  - reference: GO:1990140
    notes: GO:1990140 defines MoaD as the sulfur carrier subunit of molybdopterin
      synthase.
  - reference: InterPro:IPR044672
    notes: InterPro family entry for molybdopterin synthase sulfur carrier subunit
      MoaD.
  - reference: PMID:18092812
    snippet: Previous studies have determined that the conversion of the sulfur- and
      metal-free precursor Z to MPT by MPT synthase involves the transfer of sulfur
      atoms from a C-terminal MoaD thiocarboxylate to the C-1' and C-2' positions
      of precursor Z.
    notes: Demonstrates C-terminal MoaD thiocarboxylate sulfur transfer to precursor
      Z.
- component_id: moae_catalytic_subunit
  label: Molybdopterin synthase catalytic subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR003448
  gene_symbols:
  - moaE
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: Large catalytic subunit that forms the central homodimer, binds precursor
    Z at its dimer interface, and docks two MoaD subunits at opposite ends to catalyze
    dithiolene ring formation.
  protein_examples:
  - uniprot_id: UniProtKB:P30749
    protein_label: Molybdopterin synthase catalytic subunit
    gene_symbol: moaE
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-31'
    role: Reviewed Escherichia coli K-12 catalytic subunit MoaE.
    evidence:
    - reference: UniProtKB:P30749
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 MoaE.
    - reference: PMID:18092812
      snippet: The second step is catalyzed by the heterotetrameric MPT synthase protein
        consisting of two large (MoaE) and two small (MoaD) subunits with the MoaD
        subunits located at opposite ends of a central MoaE dimer.
      notes: Establishes the central MoaE dimer architecture of the MPT synthase heterotetramer.
  evidence:
  - reference: GO:1990140
    notes: GO:1990140 defines MoaE as the catalytic subunit of molybdopterin synthase.
  - reference: InterPro:IPR003448
    notes: InterPro family entry for MoaE-like catalytic domain.
  - reference: PMID:18092812
    snippet: In the complex, precursor Z is bound by strictly conserved residues in
      a pocket at the MoaE dimer interface in close proximity of the C-terminal glycine
      of MoaD.
    notes: Demonstrates precursor Z binding at the MoaE dimer interface.
