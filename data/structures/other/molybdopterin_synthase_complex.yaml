functions:
- function_id: molybdopterin_synthase_activity
  label: molybdopterin synthase activity
  grounding: GO:0030366
  description: Catalyzes the sequential transfer of two sulfur atoms from thiocarboxylated
    MoaD subunits to the C-2' and C-1' positions of cyclic pyranopterin monophosphate
    (precursor Z) to form molybdopterin.
  evidence:
  - reference: GO:0030366
    notes: GO molecular-function term for molybdopterin synthase activity.
  - reference: PMID:18092812
    snippet: Previous studies have determined that the conversion of the sulfur- and
      metal-free precursor Z to MPT by MPT synthase involves the transfer of sulfur
      atoms from a C-terminal MoaD thiocarboxylate to the C-1' and C-2' positions
      of precursor Z.
    notes: Establishes the sulfur-transfer reaction catalyzed by molybdopterin synthase.
- function_id: mo_molybdopterin_cofactor_biosynthetic_process
  label: Mo-molybdopterin cofactor biosynthetic process
  grounding: GO:0006777
  description: Synthesizes the dithiolene-bearing pyranopterin (molybdopterin) scaffold
    required for molybdenum coordination during Moco biosynthesis.
  evidence:
  - reference: GO:0006777
    notes: GO biological-process term for Mo-molybdopterin cofactor biosynthetic process.
  - reference: PMID:17223713
    snippet: In Escherichia coli, the MoaD protein plays a central role in the conversion
      of precursor Z to molybdopterin (MPT) during molybdenum cofactor biosynthesis.
    notes: Demonstrates the role of MPT synthase in molybdenum cofactor biosynthesis.
