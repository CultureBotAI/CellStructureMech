identifier: GO:0098561
label: methyl accepting chemotaxis protein complex
definition: 'The chemoreceptor array: a hexagonal lattice of trimers-of-dimers of
  methyl-accepting chemotaxis proteins, held at the membrane by the CheA kinase and
  the CheW coupling protein. The array is the cell''s sensory organ, and its geometry
  — a 12 nm hexagonal spacing conserved across bacteria and archaea — is what gives
  chemotaxis its cooperativity and gain.'
definition_source: DOI:10.1073/pnas.0905181106
synonyms:
- synonym_text: chemoreceptor array
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1073/pnas.0905181106
- synonym_text: chemosensory array
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1146/annurev-biophys-070816-033555
structure_category: OTHER
structure_kind: SUBCELLULAR_REGION
components:
- component_id: mcp
  label: methyl-accepting chemotaxis proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tar
  - tsr
  - trg
  - tap
  essentiality: ESSENTIAL
  stoichiometry: trimers of dimers at each lattice vertex
  role: Bind ligands and transmit the signal down a long coiled-coil to the kinase;
    methylation of their helices sets adaptation.
  evidence:
  - reference: DOI:10.1073/pnas.0905181106
    notes: Briegel et al. 2009 resolve the trimer-of-dimers lattice across many species.
- component_id: chea
  label: histidine kinase CheA
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - cheA
  essentiality: ESSENTIAL
  role: The output kinase; its autophosphorylation is what receptor occupancy modulates.
  evidence:
  - reference: DOI:10.1073/pnas.0905181106
    notes: Briegel et al. 2009 place CheA in the baseplate beneath the receptor lattice.
- component_id: chew
  label: coupling protein CheW
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - cheW
  essentiality: ESSENTIAL
  role: Couples receptors to the kinase and, with CheA, forms the rings that hold
    the hexagonal geometry.
  evidence:
  - reference: DOI:10.1073/pnas.0905181106
    notes: Briegel et al. 2009 describe the CheA/CheW baseplate defining the 12 nm
      spacing.
