  rationale: 'The graph deliberately stops where the source stops. Drawing the step
    from background knowledge would be the defect #161 records.'
  resolution_note: Added an evidence-backed CheA-to-phospho-CheY edge from the Stewart
    1997 kinetic characterization of CheA-to-CheY phosphotransfer.
