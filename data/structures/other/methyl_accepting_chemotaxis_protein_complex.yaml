  reference: DOI:10.1073/pnas.0905181106
functions:
- function_id: chemotaxis_signalling
  label: chemotaxis
  grounding: GO:0006935
  description: Converts occupancy of receptor binding sites into a change in CheA
    autophosphorylation, and so into flagellar switching.
  evidence:
  - reference: DOI:10.1073/pnas.0905181106
    notes: Briegel et al. 2009 relate array architecture to chemotactic signalling.
  - reference: DOI:10.1146/annurev-biophys-070816-033555
    notes: The cryotomography review (2017) uses the chemoreceptor array as its worked
      example of structure resolved in situ.
