    distant lineages.
  reference: DOI:10.1073/pnas.0905181106
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: VARIABLE
  note: Archaeal chemotaxis uses the same array architecture, coupled to the archaellum
