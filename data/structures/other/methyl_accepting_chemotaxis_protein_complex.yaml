  prompt: The CheA-to-CheY phosphotransfer step is missing from the signalling graph
    because Parkinson et al. 2015 does not state it in a quotable sentence. Should
    a primary source for the phosphotransfer be added, or is the array's output adequately
    described by 'the receptor cluster produces phospho-CheY signals'?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
