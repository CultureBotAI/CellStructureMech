  edges:
  - subject: mcp
    predicate: oligomerizes into
    object: receptor_trimer
    description: Chemoreceptor dimers are organized as trimers of dimers at vertices
      of the lattice.
    evidence:
    - reference: DOI:10.1073/pnas.1115719109
      notes: Briegel et al. 2012 combined crystallography with cryo-electron tomography
        of native arrays to place receptor trimers of dimers at hexagonal lattice
        vertices.
  - subject: chea
    predicate: bridges
    object: receptor_trimer
    description: One CheA dimer connects two receptor trimers as part of the core
      chemotaxis signaling unit.
    evidence:
    - reference: DOI:10.1073/pnas.1104824108
      notes: Li and Hazelbauer 2011 showed that purified core signaling complexes
        contained two receptor trimers of dimers and two CheW proteins for each CheA
        dimer.
  - subject: chew
    predicate: couples
    object: receptor_trimer
    description: CheW links receptor trimers to CheA and helps build the repeating
      core signaling unit.
    evidence:
    - reference: DOI:10.1073/pnas.1104824108
      notes: Li and Hazelbauer 2011 established the two-CheW stoichiometry of the
        two-trimer, one-CheA-dimer core unit.
  - subject: receptor_trimer
    predicate: combines with
    object: chea_chew_ring
    description: Receptor trimer vertices surround rings of alternating CheA P5 regulatory
      domains and CheW couplers.
    evidence:
    - reference: DOI:10.1073/pnas.1115719109
      notes: Briegel et al. 2012 modeled the receptor trimers surrounding alternating
        CheA/CheW rings in the cytoplasmic baseplate.
  - subject: chea_chew_ring
    predicate: forms
    object: core_signaling_unit
    description: The CheA/CheW ring and associated receptor trimers define the repeated
      building block of the chemoreceptor array.
    evidence:
    - reference: DOI:10.1021/bi5000614
      notes: Briegel, Li, Bilwes, Hughes, Jensen and Crane 2014 reviewed a sequential
        assembly model in which two receptor trimers, one CheA dimer, and two CheW
        monomers form the core functional unit before hexagons and the superlattice.
  - subject: core_signaling_unit
    predicate: tiles into
    object: array
    description: Core units share CheA/CheW linkers to produce the extended hexagonal
      chemotaxis array with conserved 12 nm spacing.
    evidence:
    - reference: DOI:10.1073/pnas.0905181106
      notes: Briegel et al. 2009 found a conserved hexagonal lattice spacing of about
        12 nm in chemoreceptor arrays from diverse bacteria and archaea.
    - reference: DOI:10.1073/pnas.1115719109
      notes: Briegel et al. 2012 showed that CheA dimerization domains link neighboring
        rings to form the extended stable array.
- graph_id: chemoreceptor_array_signalling
  title: Chemoeffector binding is amplified by the array and read out as phospho-CheY
  description: 'The array''s function is gain: binding at one receptor reaches ~35
    kinases, and the cluster''s output is a phospho-CheY signal the flagellar motor
    reads. The edges stop where the cited source stops -- the CheA-to-CheY phosphotransfer
    step itself is not stated quotably here, and motor switching is a trait rather
    than part of this structure.'
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  nodes:
  - node_id: chemoeffector
    label: attractant chemoeffector
    node_type: CHEMICAL
  - node_id: mcp
    label: methyl-accepting chemotaxis protein
    node_type: GENE_OR_PROTEIN
    component_ref: mcp
    xrefs:
    - Pfam:PF00015
  - node_id: chew
    label: CheW coupling protein
    node_type: GENE_OR_PROTEIN
    component_ref: chew
    xrefs:
    - Pfam:PF01584
  - node_id: chea
    label: CheA histidine autokinase
    node_type: GENE_OR_PROTEIN
    component_ref: chea
  - node_id: array
    label: methyl accepting chemotaxis protein complex
    node_type: STRUCTURE
    grounding: GO:0098561
    description: The assembled array. The cited source calls it the chemosensory array
      or receptor cluster; the node carries the GO label its grounding defines.
  - node_id: autophosphorylation
    label: CheA autophosphorylation
    node_type: MOLECULAR_FUNCTION
  - node_id: phospho_chey
    label: phospho-CheY
    node_type: GENE_OR_PROTEIN
  - node_id: motor_reversal
    label: flagellar motor reversal to clockwise rotation
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: chew
    predicate: couples
    object: chea
    description: CheW is what puts the kinase under receptor control.
    evidence:
    - reference: DOI:10.1016/j.tim.2015.03.003
      snippet: Chemoreceptors form stable core signaling complexes with two cytoplasmic
        proteins, CheA, a histidine autokinase, and CheW, which couples CheA to receptor
        control.
      notes: Verbatim from the open-access full text (PMC4417406).
  - subject: chemoeffector
    predicate: regulates
    object: chea
    description: One binding event reaches tens of kinases; this is the array's gain.
    evidence:
    - reference: DOI:10.1016/j.tim.2015.03.003
      snippet: In the chemosensory array, attractant binding to a single receptor
        can regulate ~35 CheA kinase proteins [ 82 ].
      notes: Verbatim. The ~35:1 ratio is the quantitative statement of why the array
        is a structure rather than a collection of receptors.
  - subject: mcp
    predicate: modulates
    object: autophosphorylation
    description: Receptor conformation sets kinase activity over a 100-fold range.
    evidence:
    - reference: DOI:10.1016/j.tim.2015.03.003
      snippet: MCP signaling complexes modulate CheA autophosphorylation activity
        over more than a 100-fold range, most likely through changes in receptor conformation
        or dynamic motions that allosterically regulate P1-P4' interactions and/or
        the kinase active site.
      notes: Verbatim. The authors hedge the mechanism with 'most likely'; the 100-fold
        modulation itself is reported without hedge.
  - subject: array
    predicate: amplifies
    object: autophosphorylation
    description: Cooperativity converts a small concentration change into a large
      kinase activity change.
    evidence:
    - reference: DOI:10.1016/j.tim.2015.03.003
      snippet: These receptors operate in cooperative arrays to produce large changes
        in the activity of a signaling kinase CheA in response to small changes in
        chemoeffector concentration.
      notes: Verbatim from PMC4417406.
  - subject: array
    predicate: produces
    object: phospho_chey
    description: The cluster's output signal, delivered in pulses.
    evidence:
    - reference: DOI:10.1016/j.tim.2015.03.003
      snippet: These observations imply that a cell’s receptor cluster produces phospho-CheY
        signals in a pulsatile manner, consistent with essentially all-ON or all-OFF
        array behavior.
      notes: Verbatim. Stated as an implication of the observations, not a direct
        measurement, and the edge is no stronger than that. The CheA-to-CheY phosphotransfer
        step is not stated quotably in this source, so it is not drawn as an edge.
  - subject: chea
    predicate: transfers phosphoryl group to
    object: phospho_chey
    description: Autophosphorylated CheA binds CheY and transfers its phosphoryl group
      to generate the phospho-CheY signal read by the flagellar motor.
    evidence:
    - reference: DOI:10.1021/bi962261k
      notes: Stewart 1997 kinetically characterized CheA-to-CheY phosphotransfer as
        reversible CheY binding to phospho-CheA followed by rapid reversible phosphoryl
        transfer.
  - subject: phospho_chey
    predicate: signals
    object: motor_reversal
    description: Phospho-CheY diffuses to the motor and is the clockwise signal.
    evidence:
    - reference: DOI:10.1016/j.tim.2015.03.003
      snippet: The motor that was closer to the cell’s receptor cluster reversed first,
        followed by the second motor with a time lag determined by its distance from
        the first motor and consistent with the intracellular diffusion rate of phospho-CheY,
        the CW rotational signal.
      notes: Verbatim. Motor reversal is included as the readout of this structure's
        output, not as part of the structure; the motility phenotype itself is the
        METPO:1000702 trait link.
