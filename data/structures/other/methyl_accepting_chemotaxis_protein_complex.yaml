    label: MCP trimer of dimers
    node_type: STRUCTURE
  - node_id: chea
    label: CheA histidine kinase dimer
    node_type: GENE_OR_PROTEIN
    component_ref: chea
  - node_id: chew
    label: CheW coupling protein
    node_type: GENE_OR_PROTEIN
    component_ref: chew
    xrefs:
    - Pfam:PF01584
  - node_id: chea_chew_ring
    label: alternating CheA/CheW baseplate ring
    node_type: STRUCTURE
  - node_id: core_signaling_unit
    label: chemoreceptor core signaling unit
    node_type: STRUCTURE
  - node_id: array
    label: methyl accepting chemotaxis protein complex
