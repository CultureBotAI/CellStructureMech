causal_graphs:
- graph_id: chea_chew_hexagonal_array_assembly
  title: CheA and CheW network receptor trimers into a hexagonal array
  description: Methyl-accepting chemotaxis proteins assemble as receptor trimers of
    dimers. CheA dimers and CheW couplers connect neighboring trimers through a baseplate
    of alternating CheA regulatory domains and CheW subunits, yielding the extended
    hexagonal array that supports cooperative chemotaxis signalling.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
