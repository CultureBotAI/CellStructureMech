- component_id: grdc_protein_c
  label: Glycine reductase protein C
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE was asserted for glycine reductase
    protein C. Acetoanaerobium sticklandii has distinct grdC and grdD genes for the
    large and small subunits of protein C, and the verified InterPro matches on those
    accessions are broader CoA-transferase signatures rather than a GrdC-specific
    family.
  gene_symbols:
  - grdC
  - grdD
  essentiality: UNKNOWN
  role: Protein C constituent that forms an acetylated enzyme intermediate and completes
    acetyl phosphate formation.
  evidence:
  - reference: GO:0030700
    notes: GO:0030700 defines glycine reductase complex as usually containing protein
      C.
  - reference: PMID:2018775
    notes: Arkowitz and Abeles 1991 isolated acetyl protein C and showed that protein
      C catalyzes phosphate exchange into acetyl phosphate.
  - reference: PMID:11271425
    notes: Graentzdoerffer et al. 2001 reported that C. sticklandii transcripts downstream
      of grdB cover genes encoding both subunits of protein C.
