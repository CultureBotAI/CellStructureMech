discussions:
- discussion_id: resolve_grdc_grounding
  prompt: Should glycine reductase protein C be split into taxon-specific GrdC and
    GrdD subunits with exact family groundings?
  kind: CURATION_TODO
  status: OPEN
  rationale: GO:0030700 models glycine reductase protein C as one of the three usual
    glycine reductase components, but the C. sticklandii grd operon encodes both large
    and small subunits of protein C. Leave protein C at reviewed-label-only until
    a source-neutral family or subcomplex grounding can be verified.
  evidence:
  - reference: GO:0030700
    notes: GO:0030700 names protein C as a usual component of the glycine reductase
      complex.
  - reference: PMID:11271425
    notes: Graentzdoerffer et al. 2001 found grdC and grdD in the C. sticklandii glycine
      reductase operon.
