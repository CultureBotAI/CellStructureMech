- component_id: sub2_yra1_mrna_export_module
  label: Sub2 DEAD-box RNA helicase and Yra1 mRNA export adaptor module
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: ATP-dependent RNA helicase Sub2 (UAP56) and RNA-binding export adaptor Yra1
    (ALYREF) that assemble with the four-subunit THO core complex to form the holo-TREX
    transcription-export complex and hand mRNPs to Mex67-Mtr2.
  evidence:
  - reference: PMID:11979277
    notes: Strasser et al. 2002 demonstrate that the four-subunit THO complex associates
      with Sub2 and Yra1 to form the conserved TREX (transcription-export) complex.
