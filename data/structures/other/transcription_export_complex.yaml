identifier: GO:0000346
label: transcription export complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: The transcription export (TREX) complex couples transcription elongation
  by RNA polymerase II to mRNA export. The complex associates with the polymerase
  and travels with it along the length of the transcribed gene. TREX is composed of
  the THO transcription elongation complex as well as other proteins that couple THO
  to mRNA export proteins. The TREX complex is known to be found in a wide range of
  eukaryotes, including S. cerevisiae and metazoans. The conserved eukaryotic transcription-export
  (TREX) multiprotein complex that couples RNA polymerase II transcription elongation
  with nascent mRNP packaging and nuclear export. In Saccharomyces cerevisiae and
  other microbial eukaryotes, the TREX complex is assembled from the pentameric THO
  core complex (Tho2, Hpr1, Mft1, Thp2, Tex1), the DEAD-box RNA helicase Sub2 (UAP56),
  and the RNA-binding export adaptor Yra1 (ALYREF), which recruits the Mex67–Mtr2
  export receptor.
