identifier: GO:1990082
label: DnaA-L2 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that inhibits unwinding of DNA at the origin of replication
  and assembly of the pre-primosome. In E. coli, this complex is composed of DnaA
  and of the ribosomal protein L2.
