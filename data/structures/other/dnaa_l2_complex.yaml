- discussion_id: distinguish_l2_from_other_dnaa_inhibitors
  prompt: Keep the DnaA-L2 complex distinct from DnaA-Dps and RIDA complexes.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - components#dnaa_initiator
  - components#ribosomal_protein_l2
  - causal_graphs#dnaa_l2_inhibition
  rationale: GO:1990082 denotes DnaA bound to ribosomal protein L2, whereas GO:1990084
    denotes the DnaA-Dps complex, GO:1990083 denotes the DnaA-Hda complex, and GO:1990085
    denotes Hda bound to the DnaN beta clamp.
  resolution_note: Curated only DnaA and ribosomal protein L2 on GO:1990082 and left
    Dps, Hda, and the beta clamp out of the component list and graph edges.
  evidence:
  - reference: GO:1990082
    notes: GO:1990082 denotes the DnaA-L2 complex.
  - reference: GO:1990084
    notes: GO:1990084 denotes the separately scoped DnaA-Dps complex.
  - reference: GO:1990083
    notes: GO:1990083 denotes the separately scoped DnaA-Hda complex.
  - reference: GO:1990085
    notes: GO:1990085 denotes the separately scoped Hda-beta clamp complex.
