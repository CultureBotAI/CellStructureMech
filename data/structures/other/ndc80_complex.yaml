  label: kinetochore-microtubule attachment
  description: The Ndc80 complex forms an outer-kinetochore interface needed to generate
    stable attachments between kinetochores and spindle microtubules.
  evidence:
  - reference: GO:0031262
    notes: GO:0031262 defines the Ndc80 complex by its role in stable kinetochore-microtubule
      attachments.
  - reference: DOI:10.1534/genetics.112.145276
    notes: Biggins 2013 reviewed Ndc80 as a core outer kinetochore microtubule-coupling
      complex.
