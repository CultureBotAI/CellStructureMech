causal_graphs:
- graph_id: yeast_hops_vacuole_fusion
  title: HOPS supports yeast homotypic vacuole fusion
  description: In Saccharomyces cerevisiae, Vps11, Vps16, Vps18, Vps33, Vps39/Vam6
    and Vps41/Vam2 form HOPS, a vacuole-associated Ypt7 effector complex required
    for homotypic vacuole fusion.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph represents yeast HOPS subunit membership, Ypt7 binding, and
    homotypic-vacuole-fusion involvement without modeling priming-dependent 65S to
    38S remodeling or trans-SNARE pairing.
