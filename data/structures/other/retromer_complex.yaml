identifier: GO:0030904
label: retromer complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A conserved hetero-pentameric membrane-associated complex involved in
  retrograde transport from endosomes to the Golgi apparatus. The budding yeast retromer
  comprises Vps35p, Vps29p, Vps26p, Vps5p, and Vps17p. The mammalian complex shows
  slight variation in composition compared to yeast, and comprises SNX1 or SNX2, SNX5
  or SNX6, VPS26A or VPS26B, VPS29, and VPS35.
