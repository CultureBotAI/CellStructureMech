- discussion_id: tfiih_core_portion_boundaries
  prompt: Keep generic GO:0000439 separate from its context-specific holo-TFIIH and
    NEF3 portion terms.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - components#ssl2_xpb_tfiih_core_subunit
  - components#tfb1_p62_tfiih_core_subunit
  - components#tfb2_p52_tfiih_core_subunit
  - components#ssl1_p44_tfiih_core_subunit
  - components#tfb4_p34_tfiih_core_subunit
  - components#tfb5_p8_tfiih_core_subunit
  - components#rad3_xpd_tfiih_core_subunit
  rationale: GO:0000439 denotes the reusable seven-subunit TFIIH core. GO:0000438
    and GO:0000440 denote that core only when it is part of the general transcription
    factor TFIIH or the NEF3 complex, respectively.
  resolution_note: Modeled GO:0000439 as the generic TFIIH core complex and left the
    two GO portion terms as narrower classes rather than has-part targets.
  evidence:
  - reference: GO:0000439
    notes: GO:0000439 identifies the broader TFIIH core complex.
  - reference: GO:0000438
    notes: OLS reports GO:0000438 as the holo-TFIIH-specific TFIIH core portion child
      of GO:0000439.
  - reference: GO:0000440
    notes: OLS reports GO:0000440 as the NEF3-specific TFIIH core portion child of
      GO:0000439.
  posed_by: codex
  posed_date: '2026-09-30'
