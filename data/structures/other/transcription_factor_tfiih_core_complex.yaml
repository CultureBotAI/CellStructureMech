identifier: GO:0000439
label: transcription factor TFIIH core complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'The 7 subunit core of TFIIH that is a part of either the general transcription
  factor holo-TFIIH or the nucleotide-excision repair factor 3 complex. In S. cerevisiae/humans
  the complex is composed of: Ssl2/XPB, Tfb1/p62, Tfb2/p52, Ssl1/p44, Tfb4/p34, Tfb5/p8
  and Rad3/XPD.'
