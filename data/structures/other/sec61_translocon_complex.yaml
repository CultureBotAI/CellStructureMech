discussions:
- discussion_id: sec61_core_boundary
  prompt: Should Sec62, Sec63, Kar2, or ribosomes be included as Sec61 translocon
    complex components?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#sec61_alpha_channel_subunit
  - components#sbh1_beta_subunit
  - components#sss1_gamma_subunit
  - causal_graphs#sec61_er_translocation
  rationale: GO:0005784 exactly denotes the heterotrimeric Sec61 channel. Sec62, Sec63,
    and Kar2 participate in posttranslational transport with Sec61, and ribosomes
    engage Sec61 during cotranslational transport, but those factors are associated
    machinery rather than constituents of the Sec61 core.
  evidence:
  - reference: GO:0005784
    notes: GO:0005784 defines the Sec61 translocon as a core heterotrimeric ER membrane
      complex.
  - reference: DOI:10.1016/0092-8674(95)90077-2
    notes: Panzner et al. 1995 used additional purified Sec factors and Kar2p for
      posttranslational reconstitution beyond the Sec61 channel itself.
  resolution_note: Modeled only Sec61p, Sbh1p, and Sss1p as constituents and left
    Sec62/Sec63/Kar2 and ribosomes outside this core-complex record.
  posed_by: codex
  posed_date: '2026-09-15'
- discussion_id: sbh1_rtn1_boundary
  prompt: Should the Sec61 beta subunit's Rtn1p-containing pool make Rtn1p a Sec61
    translocon component?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#sbh1_beta_subunit
  rationale: Sbh1p can interact with Rtn1p in complexes that do not contain Sec61p
    or Sss1p, so that ER-shaping pool is outside the Sec61 translocon boundary.
  evidence:
  - reference: DOI:10.1074/jbc.M701840200
    notes: Feng et al. 2007 found Sbh1p-Rtn1p complexes without detectable Sec61p
      and Sss1p.
  resolution_note: Included Sbh1p as a Sec61 beta subunit but excluded Rtn1p from
    the Sec61 translocon complex component list.
  posed_by: codex
  posed_date: '2026-09-15'
