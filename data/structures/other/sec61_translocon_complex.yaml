components:
- component_id: sec61_alpha_channel_subunit
  label: Sec61 alpha protein-conducting channel subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SEC61
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Sec61/SecY alpha-channel homologs are conserved across eukaryotic,
    bacterial, and archaeal protein-conducting channels; no exact source-neutral family
    CURIE was curated.
  role: Multi-pass ER membrane subunit that forms the protein-conducting pore and
    lateral gate of the Sec61 translocon.
  evidence:
  - reference: GO:0005784
    notes: GO:0005784 defines the Sec61 translocon as a heterotrimer whose alpha subunit
      forms the core protein-conducting channel.
  - reference: DOI:10.1091/mbc.3.2.129
    notes: Stirling et al. 1992 cloned Saccharomyces SEC61 and found that Sec61p is
      an integral ER membrane protein required for secretory and membrane-polypeptide
      insertion.
- component_id: sbh1_beta_subunit
  label: Sbh1 Sec61 beta subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SBH1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Sbh1 is the Saccharomyces beta subunit of the Sec61 complex; no
    exact source-neutral family CURIE was curated for the eukaryotic Sec61 beta subunit.
  role: Small tail-anchored beta subunit that associates with Sec61p and Sss1p in
    the yeast Sec61 translocon.
  evidence:
  - reference: DOI:10.1038/367654a0
    notes: Hartmann et al. 1994 identified yeast Sbh1p as a conserved component of
      the eukaryotic protein-translocation complex.
  - reference: DOI:10.1074/jbc.M701840200
    notes: Feng et al. 2007 showed that the Sbh1p transmembrane domain is sufficient
      for coimmunoprecipitation with Sec61p and Sss1p.
- component_id: sss1_gamma_subunit
  label: Sss1 Sec61 gamma subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SSS1
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Sss1 is the Saccharomyces gamma subunit of the Sec61 complex; no
    exact source-neutral family CURIE was curated for the eukaryotic Sec61 gamma subunit.
  role: Small conserved gamma subunit that forms part of the heterotrimeric Sec61
    core and supports secretory-protein translocation.
  evidence:
  - reference: DOI:10.1002/j.1460-2075.1993.tb06092.x
    notes: Esnault et al. 1993 showed that SSS1 is essential for yeast secretory-protein
      translocation and encodes a conserved ER membrane protein.
  - reference: DOI:10.1074/jbc.M701840200
    notes: Feng et al. 2007 assayed Sss1p coimmunoprecipitation with Sbh1p and Sec61p
      in Saccharomyces cells.
