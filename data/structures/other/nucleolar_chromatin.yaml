causal_graphs:
- graph_id: nucleolar_chromatin_mechanism
  title: Nucleolar chromatin rDNA repeat organization and RNA polymerase I transcription
  description: Active repeats of nucleolar chromatin are maintained in an open state
    for dense RNA polymerase I transcription and co-transcriptional snoRNP processing,
    while Sir2/RENT-mediated deacetylation stabilizes rDNA copy number.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph summarizes core nucleolar rDNA transcription and pre-rRNA
    processing steps without asserting every yeast ribosome-assembly factor or all
    pre-40S and pre-60S intermediates.
