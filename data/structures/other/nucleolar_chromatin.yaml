identifier: GO:0030874
label: nucleolar chromatin
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: The portion of nuclear chromatin associated with the nucleolus; includes
  the DNA encoding the ribosomal RNA. The specialized chromosomal chromatin domain
  located within the nucleolus of yeasts, filamentous fungi, and protists, encompassing
  the tandemly repeated ribosomal DNA (rDNA) array (such as the ~150 rDNA repeats
  on chromosome XII of Saccharomyces cerevisiae). Nucleolar chromatin alternates between
  open, Hmo1-bound, nucleosome-depleted repeats actively transcribed by RNA polymerase
  I and silent, nucleosome-packed repeats maintained by the RENT (Net1–Cdc14–Sir2)
  histone deacetylase complex to suppress illegitimate rDNA recombination.
