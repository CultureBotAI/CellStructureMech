  note: Exhibits nucleolar chromatin (GO:0030874) in nucleolar rDNA chromatin organization
    and transcription. Nucleoli are non-membrane-bounded bodies of eukaryotic nuclei
    that concentrate ribosomal gene transcription and early ribosome biogenesis.
