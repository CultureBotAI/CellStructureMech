      required for 18S rRNA biogenesis.
- component_id: box_haca_snornp_complex
  label: box H/ACA snoRNP complex
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0031429
  essentiality: UNKNOWN
  role: Small nucleolar ribonucleoprotein complex that guides pseudouridylation of
    rRNA during ribosome synthesis. Functions in nucleolar rDNA chromatin organization
    and transcription in nucleolar chromatin.
  evidence:
  - reference: GO:0031429
    notes: GO:0031429 defines the box H/ACA snoRNP complex as a nucleolar complex
      that catalyzes pseudouridylation of rRNA residues.
