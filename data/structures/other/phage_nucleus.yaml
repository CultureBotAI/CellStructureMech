identifier: cellstructuremech:phage_nucleus
label: phage nucleus
structure_category: OTHER
structure_kind: PROTEIN_SHELLED_ORGANELLE
definition: A jumbo-bacteriophage protein-shelled compartment that assembles in infected
  bacterial cells, surrounds replicating phage DNA, and spatially separates phage
  genome replication and transcription from bacterial translation.
definition_source: DOI:10.1126/science.aal2130
