    infected Pseudomonas chlororaphis cells.
  reference: DOI:10.1126/science.aal2130
functions:
- function_id: phage_genome_compartmentalization
  label: phage genome compartmentalization
  description: The phage nucleus shell encloses replicating phage DNA and separates
    viral replication and transcription from ribosomal translation in the infected
    bacterial cytoplasm.
  evidence:
  - reference: DOI:10.1126/science.aal2130
    notes: Chaikeeratisak et al. 2017 found that gp105 shells surround phage DNA while
      excluding ribosomes.
  - reference: DOI:10.1016/j.celrep.2017.07.064
    notes: Chaikeeratisak et al. 2017 showed that nucleus-like compartments and PhuZ
      spindles are conserved among large Pseudomonas phages.
- function_id: phage_dna_antidefense_shielding
  label: phage DNA antidefense shielding
  description: The chimallin shell blocks access of some bacterial DNA-targeting immune
    machineries to the phage genome.
  evidence:
  - reference: DOI:10.1038/s41564-019-0612-5
    notes: Malone et al. 2020 showed that a phage nucleus protects jumbo-phage DNA
      from CRISPR-Cas DNA targeting while remaining vulnerable to type III RNA-targeting
      immunity.
  - reference: DOI:10.1038/s41586-022-05013-4
    notes: Laughlin et al. 2022 linked chimallin shell architecture with selective
      exchange across the jumbo-phage nuclear shell.
evidence:
- reference: DOI:10.1126/science.aal2130
  notes: Chaikeeratisak et al. 2017, 'Assembly of a nucleus-like structure during
    viral replication in bacteria', Science.
- reference: DOI:10.1016/j.celrep.2017.07.064
  notes: Chaikeeratisak et al. 2017, 'The Phage Nucleus and Tubulin Spindle Are Conserved
    among Large Pseudomonas Phages', Cell Reports.
- reference: DOI:10.1038/s41564-019-0612-5
  notes: Malone et al. 2020, 'A jumbo phage that forms a nucleus-like structure evades
    CRISPR-Cas DNA targeting but is vulnerable to type III RNA-based immunity', Nature
    Microbiology.
- reference: DOI:10.1038/s41586-022-05013-4
  notes: Laughlin et al. 2022, 'Architecture and self-assembly of the jumbo bacteriophage
    nuclear shell', Nature.
