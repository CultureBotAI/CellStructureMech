  role: Major phage nuclear shell protein that polymerizes into the proteinaceous
    lattice surrounding replicating jumbo-phage DNA.
  evidence:
  - reference: DOI:10.1126/science.aal2130
    notes: Chaikeeratisak et al. 2017 identified 201phi2-1 gp105 as an early, highly
      expressed phage protein that forms the nucleus-like shell.
  - reference: DOI:10.1038/s41586-022-05013-4
    notes: Laughlin et al. 2022 named the major jumbo-bacteriophage nuclear shell
      protein chimallin and analyzed its shell self-assembly.
