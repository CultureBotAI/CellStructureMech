- discussion_id: exclude_phuz_from_shell_components
  prompt: PhuZ is not asserted as a phage nucleus shell constituent.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#chimallin
  rationale: PhuZ forms a tubulin-like spindle that positions and rotates the phage
    nucleus, but the first phage-nucleus record models the chimallin shell rather
    than the separate spindle polymer.
  evidence:
  - reference: DOI:10.1016/j.celrep.2017.07.064
    notes: Chaikeeratisak et al. 2017 modeled PhuZ as the phage tubulin spindle associated
      with the phage nucleus in large Pseudomonas phages.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
