causal_graphs:
- graph_id: emc_er_membrane_insertion
  title: EMC inserts transmembrane domains into the ER membrane
  description: EMC is embedded in the endoplasmic-reticulum membrane, directly inserts
    selected transmembrane domains, and can cooperate with the Sec61 translocon during
    cotranslational topogenesis.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures structure-level ER localization and transmembrane-domain
    insertion without asserting exact EMC subunit family groundings or the full client-recognition
    cycle.
  nodes:
  - node_id: emc_complex
    label: EMC complex
    node_type: STRUCTURE
    grounding: GO:0072546
  - node_id: er_membrane
    label: endoplasmic reticulum membrane
    node_type: STRUCTURE
    grounding: GO:0005789
  - node_id: sec61_translocon_complex
    label: Sec61 translocon complex
    node_type: STRUCTURE
    grounding: GO:0005784
  - node_id: er_tmd_insertion
    label: EMC-dependent ER transmembrane-domain insertion
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: emc_complex
    predicate: is embedded in
    object: er_membrane
    description: EMC is a transmembrane protein complex in the ER membrane.
    evidence:
    - reference: GO:0072546
      notes: GO:0072546 defines EMC as a transmembrane protein complex located in
        the endoplasmic reticulum.
    - reference: DOI:10.1038/s41586-020-2389-3
      notes: Bai et al. 2020 determined the structure of Saccharomyces cerevisiae
        EMC and described the transmembrane subunits that form the membrane region.
  - subject: emc_complex
    predicate: supports
    object: er_tmd_insertion
    description: EMC supports insertion of selected tail-anchored and multipass transmembrane
      domains into the ER membrane.
    evidence:
    - reference: DOI:10.1126/science.aao3099
      notes: Guna et al. 2018 reconstituted EMC-dependent substrate insertion with
        purified EMC in synthetic liposomes.
    - reference: DOI:10.7554/eLife.57887
      notes: O'Donnell et al. 2020 resolved human EMC architecture that suggested
        a path for energy-independent membrane insertion of transmembrane domains.
  - subject: emc_complex
    predicate: cooperates with
    object: sec61_translocon_complex
    description: EMC can initiate first-transmembrane-domain insertion and cooperate
      with Sec61 during topogenesis of multipass ER membrane proteins.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.10.009
      notes: Chitwood et al. 2018 found that purified EMC and SRP receptor were sufficient
        for correctly oriented first-transmembrane-domain insertion for beta1-adrenergic
        receptor, whereas Sec61 was required for insertion of the next transmembrane
        domain.
