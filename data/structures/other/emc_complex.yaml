functions:
- function_id: emc_dependent_er_tmd_insertion
  label: protein insertion into ER membrane
  grounding: GO:0045048
  description: EMC promotes insertion and correct topogenesis of selected tail-anchored
    and multipass transmembrane domains in the ER membrane.
  evidence:
  - reference: GO:0045048
    notes: GO:0045048 denotes incorporation of a protein into the endoplasmic-reticulum
      membrane with proper topogenic orientation.
  - reference: DOI:10.1126/science.aao3099
    notes: Guna et al. 2018 showed that purified EMC catalyzes transmembrane-domain
      insertion of eligible substrates in a reconstituted liposome system.
  - reference: DOI:10.1016/j.cell.2018.10.009
    notes: Chitwood et al. 2018 found that EMC initiates cotranslational insertion
      of the first transmembrane domain of tested GPCR substrates and cooperates with
      Sec61 for later transmembrane-domain insertion.
