    notes: GO:0072546 names S. cerevisiae EMC1, EMC2, AIM27, EMC4, KRE27 and EMC6
      in its definition.
  - reference: DOI:10.1038/s41586-020-2389-3
    notes: Bai et al. 2020 reported that Saccharomyces cerevisiae EMC contains Emc1-6,
      Emc7 and Emc10.
