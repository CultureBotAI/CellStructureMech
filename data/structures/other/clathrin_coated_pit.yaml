identifier: GO:0005905
label: clathrin-coated pit
structure_category: OTHER
structure_kind: SUBCELLULAR_REGION
definition: A part of the endomembrane system in the form of an invagination of a
  membrane upon which a clathrin coat forms, and that can be converted by vesicle
  budding into a clathrin-coated vesicle. Coated pits form on the plasma membrane,
  where they are involved in receptor-mediated selective transport of many proteins
  and other macromolecules across the cell membrane, in the trans-Golgi network, and
  on some endosomes.
