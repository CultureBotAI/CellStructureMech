discussions:
- discussion_id: leave_clathrin_ap2_on_coated_pit_coat
  prompt: Keep clathrin and AP-2 molecular components on the clathrin coat of coated
    pit record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - has_part
  - causal_graphs#yeast_clathrin_coated_pit_budding
  rationale: GO:0005905 denotes the coated membrane invagination, while GO:0030132
    denotes the coat substructure that comprises clathrin and AP-2. The whole-pit
    record therefore links GO:0030132 through has_part and leaves the coat protein
    constituents on that substructure record.
  evidence:
  - reference: GO:0005905
    notes: GO cellular-component term for the clathrin-coated pit.
  - reference: GO:0030132
