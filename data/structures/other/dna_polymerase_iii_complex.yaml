identifier: GO:0009360
label: DNA polymerase III complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A DNA polymerase III holoenzyme complex organized into a Pol III core,
  a beta sliding-clamp processivity factor, and a clamp-loader complex that together
  support processive DNA replication.
definition_source: GO:0009360
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-24T11:03:50Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-24T11:05:01Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added DNA polymerase complex parentage, the GO-backed holoenzyme synonym,
    GO-grounded Pol III core, beta-clamp, and clamp-loader subcomplex components,
    an Escherichia coli K-12 canonical example, DNA-directed DNA polymerase function
    evidence, and a compact processive DNA synthesis graph.
  llm_assisted: true
synonyms:
- synonym_text: DNA polymerase III holoenzyme complex
  synonym_type: EXACT_SYNONYM
  source: GO:0009360
parent_structures:
- GO:0042575
components:
- component_id: pol_iii_core
  label: DNA polymerase III, core complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0044776
  role: Polymerase and proofreading-exonuclease subassembly of the DNA polymerase
    III holoenzyme.
  evidence:
  - reference: GO:0044776
    notes: GO:0044776 defines the DNA polymerase III core complex as the alpha-, epsilon-,
      and theta-subunit assembly that carries out polymerase and 3'-5' exonuclease
      proofreading activities.
  - reference: GO:0009360
    notes: GO:0009360 lists the Pol III core as one of the three functionally essential
      DNA polymerase III holoenzyme subassemblies.
- component_id: beta_sliding_clamp
  label: DNA polymerase III, beta sliding clamp processivity factor complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0044775
  role: Sliding-clamp processivity factor that tethers the Pol III core to template
    DNA during high-speed replication.
  evidence:
  - reference: GO:0044775
    notes: GO:0044775 defines the beta sliding-clamp processivity factor as the DNA
      polymerase III holoenzyme subcomplex that tethers the catalytic polymerase subunit
      to DNA.
  - reference: GO:0009360
    notes: GO:0009360 lists the beta sliding-clamp processivity factor as one of the
      three functionally essential DNA polymerase III holoenzyme subassemblies.
- component_id: clamp_loader
  label: DNA polymerase III, clamp loader complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0043846
  role: Clamp-loading subassembly that places the beta processivity factor on the
    primer-template and helps organize leading- and lagging-strand replication.
  evidence:
  - reference: GO:0043846
    notes: GO:0043846 defines the DNA polymerase III clamp-loader complex as a heptamer
      that includes DnaX tau and gamma products plus the chi/psi subcomplex.
  - reference: GO:0009360
    notes: GO:0009360 states that the clamp-loading complex assembles the beta processivity
      factor onto the primer template.
canonical_examples:
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  note: Reference strain for the reviewed UniProtKB DnaX tau/gamma subunit accession
    cited by the GO:0009360 definition.
  reference: UniProtKB:P06710
functions:
- function_id: dna_directed_dna_polymerase_activity
  label: DNA-directed DNA polymerase activity
  grounding: GO:0003887
  description: The DNA polymerase III holoenzyme carries out template-directed DNA
    strand extension while its clamp-loader and beta-clamp subassemblies support processivity
    at the replication fork.
  evidence:
  - reference: GO:0003887
    notes: GO:0003887 defines DNA-directed DNA polymerase activity as DNA-template-directed
      extension of the 3'-end of a DNA strand.
  - reference: GO:0009360
    notes: GO:0009360 defines the DNA polymerase III holoenzyme as a Pol III core,
      beta sliding-clamp, and clamp-loader assembly that functions at the replication
      fork.
