identifier: GO:0031500
label: Tea1 cell-end complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A high molecular weight complex characterized in S. pombe containing the
  cell-end anchoring protein Tea1. This complex is transported to the cell ends by
  microtubules and is involved in bipolar growth and the maintennce of normal cell
  polarity.
definition_source: GO:0031500
mapping_status: PROPOSED
parent_structures:
- GO:0005875
part_of:
- GO:0000133
components:
- component_id: tea1_kelch_scaffold_subunit
  label: Tip elongation aberrant protein 1 (Tea1)
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR015915
  gene_symbols:
  - tea1
  - alp8
  stoichiometry: Core Kelch-repeat/coiled-coil polarity marker subunit of the high-molecular-weight
    Tea1 complex
  essentiality: DISPENSABLE
  role: Kelch-repeat and C-terminal coiled-coil cell-end polarity protein that is
    delivered on growing microtubule plus ends to cell tips, where it anchors to Mod5/Tea3
    and binds Tea4 to recruit the formin For3 for bipolar polarized growth.
  evidence:
  - reference: GO:0031500
    notes: GO:0031500 defines the Tea1 cell-end complex as a high molecular weight
      complex characterized in S. pombe containing the cell-end anchoring protein
      Tea1.
  - reference: PMID:9200612
    notes: Mata and Nurse 1997 (DOI:10.1016/s0092-8674(00)80279-2) demonstrated that
      S. pombe Tea1 is transported on microtubule plus ends to cell tips to maintain
      antipodal cell polarity.
