functions:
- function_id: establishment_or_maintenance_of_cell_polarity
  label: establishment or maintenance of cell polarity
  grounding: GO:0007163
  description: Delivered on microtubule plus ends to the cell cortex at both cell
    tips, where Tea1 associates with Tea3 and Tea4 to mark cell ends, recruit polarity
    effectors, and maintain normal bipolar cell growth.
  evidence:
  - reference: GO:0031500
    notes: GO:0031500 defines the Tea1 cell-end complex as transported to cell ends
      by microtubules and involved in bipolar growth and maintenance of normal cell
      polarity.
  - reference: PMID:9200612
    notes: Mata and Nurse 1997 showed that microtubule-mediated delivery of Tea1 to
      cell ends is required to establish and maintain antipodal cell polarity in S.
      pombe.
  - reference: PMID:15936270
    notes: Tatebe et al. 2005 demonstrated that Tea4/Wsh3 binds Tea1 at cell ends
      to promote bipolar growth and maintain cell polarity.
