    gene_symbol: tea1
    taxon_id: NCBITaxon:284812
    taxon_label: Schizosaccharomyces pombe 972h-
    entry_status: REVIEWED
    retrieved_on: '2026-10-25'
    role: Reviewed S. pombe Tea1 subunit (also declared as synonym alp8) that nucleates
      the high-molecular-weight Tea1 cell-end complex.
    evidence:
    - reference: UniProtKB:P87061
      notes: Reviewed Swiss-Prot entry for Schizosaccharomyces pombe tip elongation
        aberrant protein 1 (tea1).
    - reference: PMID:9200612
      notes: Mata and Nurse 1997 characterized S. pombe Tea1 delivery by microtubules
        and cortical cell-end anchoring.
- component_id: tea3_anchoring_subunit
  label: Tip elongation aberrant protein 3 (Tea3)
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR015915
  gene_symbols:
  - tea3
  stoichiometry: Cell-end cortical anchoring partner of Tea1
  essentiality: DISPENSABLE
  role: Kelch-repeat and coiled-coil cell-end cortex protein that physically interacts
    with Tea1 and Mod5 at non-growing cell ends to anchor the Tea1 cell-end complex
    and promote bipolar growth initiation.
  evidence:
  - reference: PMID:12007420
    notes: Arellano et al. 2002 (DOI:10.1016/s0960-9822(02)00821-7) showed that S.
      pombe Tea3p is a cell-end marker that directly interacts with Tea1p to activate
      polarized growth.
  - reference: PMID:14663827
    notes: Snaith and Sawin 2003 (DOI:10.1002/yea.1054) dissected the interactions
      of Tea1p and Tea3p in establishing cell-end polarity complexes in S. pombe.
  protein_examples:
  - uniprot_id: UniProtKB:O14248
    protein_label: Tip elongation aberrant protein 3
    gene_symbol: tea3
    taxon_id: NCBITaxon:284812
    taxon_label: Schizosaccharomyces pombe 972h-
    entry_status: REVIEWED
    retrieved_on: '2026-10-25'
    role: Reviewed S. pombe Tea3 cell-end marker subunit that binds Tea1 at the cell
      cortex.
    evidence:
    - reference: UniProtKB:O14248
      notes: Reviewed Swiss-Prot entry for Schizosaccharomyces pombe tip elongation
        aberrant protein 3 (tea3).
    - reference: PMID:12007420
      notes: Arellano et al. 2002 identified S. pombe Tea3p and its physical interaction
        with Tea1p.
- component_id: tea4_sh3_adaptor_subunit
  label: Tip elongation aberrant protein Tea4
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR053039
  gene_symbols:
  - tea4
  - wsh3
  stoichiometry: SH3-domain effector adaptor subunit of the Tea1 cell-end complex
  essentiality: DISPENSABLE
  role: SH3-domain cell-end adaptor protein (also known as Wsh3) that binds Tea1 directly
    in the high-molecular-weight Tea1 cell-end complex and links cortical Tea1 to
    the formin For3 for bipolar actin cable assembly.
  evidence:
  - reference: PMID:15936270
    notes: Tatebe et al. 2005 (DOI:10.1016/j.cub.2005.04.061) identified Wsh3/Tea4
      as a novel cell-end factor that binds Tea1 and is essential for bipolar Tea1
      function and cell polarity in S. pombe.
  protein_examples:
  - uniprot_id: UniProtKB:O60132
    protein_label: Tip elongation aberrant protein Tea4
    gene_symbol: tea4
    taxon_id: NCBITaxon:284812
    taxon_label: Schizosaccharomyces pombe 972h-
    entry_status: REVIEWED
    retrieved_on: '2026-10-25'
    role: Reviewed S. pombe Tea4 subunit (also declared as synonym wsh3) that associates
      with Tea1 in the cell-end polarity complex.
    evidence:
    - reference: UniProtKB:O60132
      notes: Reviewed Swiss-Prot entry for Schizosaccharomyces pombe tip elongation
        aberrant protein Tea4.
    - reference: PMID:15936270
      notes: Tatebe et al. 2005 characterized S. pombe Wsh3/Tea4 as a direct binding
        partner of Tea1 at cell ends.
