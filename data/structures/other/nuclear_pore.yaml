identifier: GO:0005643
label: nuclear pore
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A membrane-embedded eukaryotic protein complex that forms a discrete pore
  in the nuclear envelope where the inner and outer nuclear membranes join and mediates
  exchange between the nucleus and cytoplasm.
definition_source: GO:0005643
mapping_status: PROPOSED
