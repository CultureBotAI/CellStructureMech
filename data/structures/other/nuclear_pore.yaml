causal_graphs:
- graph_id: nucleoporin_scaffold_transport_channel
  title: Nucleoporins build a nuclear-envelope pore
  description: Membrane nucleoporins anchor the nuclear pore at the fused nuclear-envelope
    membrane, scaffold nucleoporins build the pore architecture, and FG-repeat nucleoporins
    line the central channel.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures core Saccharomyces NPC component classes without
    asserting all individual Nup copies or every stable subcomplex.
  nodes:
  - node_id: membrane_nucleoporins
    label: transmembrane nucleoporins
    node_type: GENE_OR_PROTEIN
    component_ref: membrane_nucleoporins
  - node_id: scaffold_nucleoporins
    label: scaffold nucleoporins
    node_type: GENE_OR_PROTEIN
    component_ref: scaffold_nucleoporins
  - node_id: fg_repeat_nucleoporins
    label: FG-repeat nucleoporins
    node_type: GENE_OR_PROTEIN
    component_ref: fg_repeat_nucleoporins
  - node_id: nuclear_pore
    label: nuclear pore
    node_type: STRUCTURE
    grounding: GO:0005643
  edges:
  - subject: membrane_nucleoporins
    predicate: anchor
    object: nuclear_pore
    description: Transmembrane nucleoporins anchor the NPC where inner and outer nuclear
      membranes join.
    evidence:
    - reference: GO:0005643
      notes: GO:0005643 places the pore at the junction between the inner and outer
        nuclear membranes.
    - reference: DOI:10.1016/j.cell.2021.12.015
      notes: Akey et al. 2022 modeled membrane anchors in the yeast NPC.
  - subject: scaffold_nucleoporins
    predicate: assemble into
    object: nuclear_pore
    description: Scaffold nucleoporins build the ring-like framework of the yeast
      NPC.
    evidence:
    - reference: DOI:10.1083/jcb.148.4.635
      notes: Rout et al. 2000 mapped the yeast NPC composition and architecture.
  - subject: fg_repeat_nucleoporins
    predicate: line
    object: nuclear_pore
    description: FG-repeat nucleoporins line the NPC channel and form its selective
      transport barrier.
    evidence:
    - reference: DOI:10.1534/genetics.111.127803
      notes: Aitchison and Rout 2012 review FG nucleoporins in yeast NPC transport.
