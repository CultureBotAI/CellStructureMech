- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: COMMON
  note: Nuclear pore complexes are embedded in the nuclear envelope of eukaryotic
    cells and mediate gated exchange between the nucleus and cytoplasm.
  reference: DOI:10.1101/cshperspect.a000562
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Budding-yeast model in which the nuclear pore complex composition, architecture,
    and transport mechanism were mapped by proteomics and localization.
  reference: DOI:10.1083/jcb.148.4.635
functions:
- function_id: nucleocytoplasmic_transport
  label: nucleocytoplasmic transport
  description: The nuclear pore complex forms the gated channel for macromolecular
    transport between the nucleus and the cytoplasm.
  evidence:
  - reference: GO:0005643
    notes: GO:0005643 defines the nuclear pore as the protein complex that provides
      an opening in the nuclear envelope.
  - reference: DOI:10.1534/genetics.111.127803
    notes: Aitchison and Rout 2012 review yeast NPC organization and transport through
      it.
evidence:
- reference: GO:0005643
  notes: Gene Ontology cellular-component term for nuclear pore.
