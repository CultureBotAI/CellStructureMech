identifier: GO:0005643
label: nuclear pore
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A membrane-embedded eukaryotic protein complex that forms a discrete pore
  in the nuclear envelope where the inner and outer nuclear membranes join and mediates
  exchange between the nucleus and cytoplasm.
definition_source: GO:0005643
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-11T06:14:58Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-11T06:16:55Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added nuclear pore complex synonymy, nuclear-envelope parthood, scaffold,
    FG-repeat and membrane nucleoporin component classes, Eukaryota distribution,
    a Saccharomyces cerevisiae example, nucleocytoplasmic transport function, DOI/GO
    evidence, a nucleoporin assembly and transport graph, and a Nup grounding TODO.
  llm_assisted: true
- timestamp: '2026-09-11T06:25:32Z'
  curator: codex
  action: NARROWED_ESSENTIALITY
  changes: Changed scaffold, FG-repeat, and membrane nucleoporin essentiality from
