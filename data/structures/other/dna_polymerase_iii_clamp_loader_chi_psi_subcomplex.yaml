identifier: GO:0043847
label: DNA polymerase III, clamp loader chi/psi subcomplex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A dimer composed of the chi and psi subunits which is a subassembly of
  the DNA polymerase III clamp loader complex and serves as a bridge between the DnaX
  complex and the single-stranded DNA-binding protein (SSB).
