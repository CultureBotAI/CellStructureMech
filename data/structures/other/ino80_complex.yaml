causal_graphs:
- graph_id: yeast_ino80_chromatin_remodeling
  title: INO80-C carries yeast chromatin remodeling
  description: In Saccharomyces cerevisiae, Ino80, Rvb1, Rvb2, Ies5, Ies3, Nhp10,
    Ies6, Ies1, Arp8, Arp4, Act1, Taf14, Ies2, Ies4 and Arp5 form the INO80-C chromatin-remodeling
    complex.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the 15 INO80-C constituent classes and their connection
    to ATP-dependent chromatin remodeling without resolving the ordered assembly pathway
    or the nucleosome-engagement cycle.
