- graph_id: mlafedb_phospholipid_transport
  title: MlaFEDB participates in phospholipid transport
  description: MlaE, MlaF, MlaD, and MlaB form the MlaFEDB inner-membrane ABC transporter
    that receives MlaC phospholipid substrates in the Mla outer-membrane lipid-asymmetry
    system.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the four-protein inner-membrane MlaFEDB boundary
    and its whole-complex phospholipid-transport function without asserting a resolved
    retrograde-versus-antegrade direction, MlaC docking geometry, or nucleotide-state
    transport cycle.
