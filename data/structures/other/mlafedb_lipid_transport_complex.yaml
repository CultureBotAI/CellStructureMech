identifier: cellstructuremech:mlafedb_lipid_transport_complex
label: MlaFEDB lipid transport complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An Escherichia coli inner-membrane ABC transporter complex composed of
  MlaE, MlaF, MlaD, and MlaB subunits that participates in phospholipid transport
  during maintenance of outer-membrane lipid asymmetry.
definition_source: ComplexPortal:CPX-3464
