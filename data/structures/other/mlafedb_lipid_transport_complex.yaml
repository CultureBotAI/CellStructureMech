discussions:
- discussion_id: mlaf_component_family_grounding
  prompt: Resolve an exact source-neutral MlaF protein family before replacing its
    reviewed-label-only component row.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#mlaf_atp_binding_subunit
  rationale: ComplexPortal:CPX-3464, PDB:7CGE, and the reviewed E. coli K-12 UniProt
    record exactly identify MlaF, but its UniProt InterPro cross-references are broad
    ABC-transporter, AAA+ ATPase, ABC-transporter signature, and P-loop NTPase entries
    rather than an exact MlaF family.
  evidence:
  - reference: ComplexPortal:CPX-3464
    notes: CPX-3464 curates P63386/MlaF as a participant.
  - reference: UniProtKB:P63386
    notes: Reviewed E. coli K-12 MlaF UniProtKB entry.
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: exclude_mlac_and_outer_membrane_mla_complex
  prompt: Should MlaC or the outer-membrane Mla complex be curated as constituents
    of the MlaFEDB lipid transport complex?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#mlae_permease_subunit
  - components#mlaf_atp_binding_subunit
  - components#mlad_binding_subunit
  - components#mlab_binding_subunit
  rationale: MlaC shuttles phospholipid substrates between the outer-membrane Mla
    machinery and the inner-membrane MlaFEDB transporter, but ComplexPortal:CPX-3464
    scopes the MlaFEDB complex itself to MlaE, MlaF, MlaD, and MlaB.
  evidence:
  - reference: ComplexPortal:CPX-3464
    notes: CPX-3464 lists MlaE, MlaF, MlaD, and MlaB as the MlaFEDB participants and
      mentions MlaC as a shuttling protein in the function description.
  posed_by: codex
  posed_date: '2026-10-02'
  resolution_note: Keep MlaC and the outer-membrane Mla machinery outside the MlaFEDB
    component boundary and include MlaC only as a handoff node in the nonmechanistic
    function graph.
