identifier: GO:0030119
label: AP-type membrane coat adaptor complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: Any of several heterotetrameric complexes that link clathrin (or another
  coat-forming molecule, as hypothesized for AP-3 and AP-4) to a membrane surface;
  they are found on coated pits and coated vesicles, and mediate sorting of cargo
  proteins into vesicles. Each AP complex contains two large (a beta and one of either
  an alpha, gamma, delta, or epsilon) subunits (110-130 kDa), a medium (mu) subunit
  (approximately 50 kDa), and a small (sigma) subunit (15-20 kDa).
