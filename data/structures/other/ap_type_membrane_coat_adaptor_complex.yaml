discussions:
- discussion_id: ap_adaptor_mereology_boundary
  prompt: Represent AP-type membrane coat adaptor complex as part of membrane coat
    rather than as a membrane-coat subtype.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - parent_structures
  - part_of
  rationale: GO:0030119 is a membrane protein complex that is part of GO:0030117 membrane
    coat. This record therefore keeps GO:0098796 as its is-a parent and uses part_of
    for GO:0030117 instead of making the AP adaptor complex a subclass of the coat
    it helps assemble.
  evidence:
  - reference: GO:0030119
    notes: GO term and relationship source for AP-type membrane coat adaptor complexes.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
- discussion_id: mucocyst_ap3_scope
  prompt: Use Tetrahymena AP-3 as AP-type adaptor evidence without making AP-3 a mature
    mucocyst component.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - taxonomic_distribution
  - canonical_examples
  rationale: Kaur et al. 2017 support the presence and upstream mucocyst-biogenesis
    role of a Tetrahymena AP-3 complex. That evidence anchors this AP-type adaptor
    record, while the mucocyst record continues to exclude AP-3 from mature mucocyst
    components because the cited role is maturation rather than stable membership
    in docked mucocysts.
  evidence:
  - reference: DOI:10.1091/mbc.e17-01-0018
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
