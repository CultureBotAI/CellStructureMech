discussions:
- discussion_id: coated_pit_vs_endocytic_vesicle_coat_boundary
  prompt: Keep the clathrin coat of coated pit distinct from the clathrin coat of
    an endocytic vesicle.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - part_of
  rationale: GO:0030132 is the AP-2-containing clathrin coat on a clathrin-coated
    pit, whereas GO:0030128 is the clathrin coat of an endocytic vesicle. This record
    therefore places GO:0030132 under the broader clathrin coat and models GO:0005905
    clathrin-coated pit as the containing structure rather than treating the coated-pit
    and endocytic-vesicle coats as interchangeable.
  evidence:
  - reference: GO:0030132
    notes: GO cellular-component term for the coated-pit clathrin coat.
  - reference: GO:0030128
    notes: GO cellular-component term for the endocytic-vesicle clathrin coat.
  - reference: GO:0005905
    notes: GO cellular-component term for the clathrin-coated pit.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
