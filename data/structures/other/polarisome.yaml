components:
- component_id: spa2_pea2_scaffold
  label: Spa2/Pea2 polarisome scaffold
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - SPA2
  - PEA2
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Spa2 and Pea2 homologs are used as fungal polarisome markers, but
    no exact source-neutral family CURIE for the fungal Spa2/Pea2 scaffold cohort
    was curated.
  role: Core scaffold proteins that localize to polarized-growth sites and help organize
    the Saccharomyces polarisome.
  evidence:
  - reference: DOI:10.1083/jcb.135.3.725
    notes: Valtz and Herskowitz 1996 showed that Pea2 localizes to polarized-growth
      sites in a pattern similar to Spa2 and that Pea2 and Spa2 depend on one another
      for stable localization.
  - reference: DOI:10.1083/jcb.202006193
    notes: Dunkler et al. 2021 studied Spa2 and Pea2 as known polarisome proteins
      recruited by type V myosin in budding yeast.
- component_id: bni1_formin
  label: Bni1 formin
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - BNI1
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Saccharomyces Bni1 polarisome formin is not grounded to a broader
    formin family here because formin paralog usage differs across fungi.
  role: Formin effector that nucleates actin filament assembly from the budding-yeast
    polarisome.
  evidence:
  - reference: GO:0000133
    notes: GO:0000133 lists Bni1p among Saccharomyces polarisome proteins.
  - reference: DOI:10.1128/MCB.18.7.4053
    notes: Sheu et al. 1998 connected Spa2 with Bni1 and other yeast morphogenesis
      proteins.
  - reference: DOI:10.1038/s41467-019-13125-1
    notes: Xie et al. 2019 modeled Aip5, Bni1, and Bud6 around Spa2-mediated actin
      polymerization.
- component_id: bud6_actin_nucleation_factor
  label: Bud6 actin nucleation-promoting factor
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - BUD6
  - AIP3
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bud6/Aip3 is curated as the Saccharomyces actin nucleation-promoting
    constituent named in the GO definition; no exact fungal-wide family grounding
    was assigned.
  role: Actin nucleation-promoting factor associated with the Bni1-containing budding-yeast
    polarisome.
  evidence:
  - reference: GO:0000133
    notes: GO:0000133 lists Bud6p among Saccharomyces polarisome proteins.
  - reference: DOI:10.1038/s41467-019-13125-1
    notes: Xie et al. 2019 studied Bud6 with Bni1 in a Spa2-mediated actin-polymerization
      system.
taxonomic_distribution:
- taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  presence: VARIABLE
  note: Polarisome proteins and tip-localized polarisome-like assemblies are characterized
    in budding yeasts and filamentous fungi, but the exact component arrangement varies
    with growth mode and lineage.
  reference: DOI:10.1371/journal.pone.0030372
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Budding-yeast model in which Pea2 and Spa2 localize to polarized-growth sites
    during budding and mating.
  reference: DOI:10.1083/jcb.135.3.725
- taxon_id: NCBITaxon:5141
  taxon_label: Neurospora crassa
  note: Filamentous fungal model in which SPA-2, BUD-6, and BNI-1 have distinct localizations
    around the apical dome and Spitzenkorper during hyphal growth.
  reference: DOI:10.1371/journal.pone.0030372
functions:
- function_id: polarized_actin_assembly
  label: polarized actin assembly
  description: The polarisome scaffolds actin-assembly factors at polarized-growth
    sites to promote local actin filament polymerization.
  evidence:
  - reference: GO:0000133
    notes: GO:0000133 defines the polarisome by its role in directing localized assembly
      of actin filaments at polarization sites.
  - reference: DOI:10.1038/s41467-019-13125-1
    notes: Xie et al. 2019 dissected Spa2-mediated macromolecular condensation for
      actin polymerization.
evidence:
