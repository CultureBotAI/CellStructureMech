causal_graphs:
- graph_id: spa2_polarisome_actin_assembly
  title: Spa2-centered polarisomes concentrate actin assembly factors
  description: In Saccharomyces cerevisiae, the Spa2/Pea2 scaffold localizes to polarized-growth
    sites, while Bni1 formin and Bud6 act in the Spa2-mediated module that drives
    local actin-filament assembly.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph summarizes budding-yeast polarisome organization without
    asserting a complete physical interaction map or a conserved filamentous-fungal
    stoichiometry.
