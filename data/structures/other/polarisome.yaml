- reference: DOI:10.1128/MCB.18.7.4053
  notes: Sheu et al. 1998, 'Spa2p interacts with cell polarity proteins and signaling
    components involved in yeast cell morphogenesis', Molecular and Cellular Biology.
- reference: DOI:10.1038/s41467-019-13125-1
  notes: Xie et al. 2019, 'Polarisome scaffolder Spa2-mediated macromolecular condensation
