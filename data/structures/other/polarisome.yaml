- reference: GO:0031561
  notes: Gene Ontology cellular-component term for the cellular bud tip polarisome.
- reference: GO:0031562
  notes: Gene Ontology cellular-component term for the hyphal tip polarisome.
- reference: GO:0031563
  notes: Gene Ontology cellular-component term for the mating projection tip polarisome.
- reference: DOI:10.1083/jcb.135.3.725
  notes: Valtz and Herskowitz 1996, 'Pea2 protein of yeast is localized to sites of
    polarized growth and is required for efficient mating and bipolar budding', Journal
