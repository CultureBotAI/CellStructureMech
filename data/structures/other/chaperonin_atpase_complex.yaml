  edges:
  - subject: cpn60_groel_subunit
    predicate: is part of
    object: chaperonin_atpase_complex
    description: Multiple identical ~60 kDa Cpn60/GroEL ATPase subunits assemble into
      the symmetric ring-shaped central cavity of the chaperonin ATPase complex.
    evidence:
    - reference: GO:0016465
      notes: GO:0016465 defines the complex as a symmetric ring-shaped structure of
        multiple identical ~60 kDa subunits.
  - subject: cochaperonin_lid_subunit
    predicate: caps
    object: chaperonin_atpase_complex
    description: In the bacterial chaperonin ATPase complex, the smaller GroES co-chaperonin
      subunits cap one ~60 kDa chaperonin ring to enclose the cis folding cavity.
    evidence:
    - reference: DOI:10.1038/41944
      notes: Xu, Horwich and Sigler 1997 showed how the heptameric GroES dome caps
        the GroEL ring to seal the folding chamber.
  - subject: chaperonin_atpase_complex
    predicate: promotes
    object: protein_folding
    description: The central cavity of the chaperonin ATPase complex receives unfolded
      peptides and promotes their ATP-dependent folding into the native conformation.
    evidence:
    - reference: GO:0016465
      notes: GO:0016465 defines the complex by its central cavity that receives unfolded
        peptides and promotes their folding.
    - reference: DOI:10.1038/41944
      notes: Xu, Horwich and Sigler 1997 characterized the enlarged cis cavity that
        promotes substrate protein folding.
  - subject: cochaperonin_lid_subunit
    predicate: caps
    object: cpn60_groel_subunit
    description: The heptameric GroES/Cpn10 lid binds the ATP-bound apical domains
      of a GroEL/Cpn60 heptameric ring to enclose the folding cavity.
    evidence:
    - reference: DOI:10.1038/41944
      notes: Crystal structure of the asymmetric GroEL-GroES-(ADP)7 chaperonin complex
        showing GroES capping the GroEL cis ring.
  - subject: chaperonin_atpase_complex
    predicate: forms
    object: cis_folding_cavity
    description: ATP binding and GroES association trigger en bloc apical domain elevation
      and twist in the GroEL ring, creating an enlarged hydrophilic cis folding chamber.
    evidence:
    - reference: DOI:10.1038/41944
      notes: Crystal structure of the asymmetric GroEL-GroES-(ADP)7 chaperonin complex.
  - subject: cis_folding_cavity
    predicate: promotes
    object: protein_folding
    description: Encapsulation of the non-native polypeptide inside the hydrophilic
      cis cavity prevents aggregation and promotes productive folding until ATP hydrolysis
      triggers lid release.
    evidence:
    - reference: GO:0016465
    - reference: DOI:10.1038/41944
      notes: Encapsulated cis chamber isolates non-native polypeptide substrates for
        productive folding.
