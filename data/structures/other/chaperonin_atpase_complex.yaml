identifier: GO:0016465
label: chaperonin ATPase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multimeric ATPase complex involved in protein folding. It has a symmetric
  ring-shaped structure and consists of multiple identical ~60kDa subunits and, in
  the bacterial complex, several smaller subunits; a central cavity receives unfolded
  peptides and promotes their folding into the native conformation.
definition_source: GO:0016465
mapping_status: PROPOSED
parent_structures:
