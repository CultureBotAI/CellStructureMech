      kDa chaperonin chains in PDB:1AON.
    evidence:
    - reference: UniProtKB:P0A6F5
      notes: UniProtKB P0A6F5 is the reviewed Escherichia coli K-12 entry for chaperonin
        GroEL.
    - reference: PDB:1AON
      notes: RCSB SIFTS maps PDB:1AON polymer entity 1 to UniProtKB:P0A6F5 with fourteen
        protein chains.
- component_id: cochaperonin_lid_subunit
  label: GroES chaperonin
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR020818
  gene_symbols:
  - groES
  stoichiometry: 7 copies per heptameric co-chaperonin ring in the bacterial complex
  essentiality: ESSENTIAL
  role: Smaller (~10 kDa) co-chaperonin lid subunit present in bacterial group I chaperonin
    ATPase complexes that caps the ~60 kDa chaperonin ring.
  evidence:
  - reference: GO:0016465
    notes: GO:0016465 specifies that in the bacterial complex several smaller subunits
      accompany the ~60 kDa chaperonin ring subunits.
  - reference: InterPro:IPR020818
    notes: InterPro IPR020818 is the family entry for GroES chaperonins.
  - reference: DOI:10.1038/41944
    notes: Xu, Horwich and Sigler 1997 resolved the heptameric GroES cap bound to
      the GroEL cylinder in PDB:1AON.
