functions:
- function_id: protein_folding
  label: protein folding
  grounding: GO:0006457
  description: A central ring-shaped cavity in the chaperonin ATPase complex receives
    unfolded polypeptide substrates and uses ATP binding and hydrolysis to promote
    their folding into the native conformation.
  evidence:
  - reference: GO:0016465
    notes: GO:0016465 defines the chaperonin ATPase complex by its central cavity
      that receives unfolded peptides and promotes their folding into the native conformation.
  - reference: DOI:10.1038/41944
    notes: Xu, Horwich and Sigler 1997 showed how co-chaperonin capping of the chaperonin
      ATPase ring enlarges and remodels the cis folding chamber.
evidence:
