part_of:
- GO:0005829
components:
- component_id: cpn60_groel_subunit
  label: Chaperonin Cpn60/GroEL
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR001844
  gene_symbols:
  - groEL
  stoichiometry: 14 copies in two stacked heptameric rings in the bacterial prototype
  essentiality: ESSENTIAL
  role: Multimeric ~60 kDa ATPase chaperonin ring subunit that forms the symmetric
    double-ring central cavity receiving unfolded polypeptide substrates.
  evidence:
  - reference: GO:0016465
    notes: GO:0016465 defines the chaperonin ATPase complex as consisting of multiple
      identical ~60 kDa ATPase subunits arranged in a symmetric ring-shaped structure.
  - reference: InterPro:IPR001844
    notes: InterPro IPR001844 is the family entry for Chaperonin Cpn60/GroEL.
  - reference: DOI:10.1038/41944
    notes: Xu, Horwich and Sigler 1997 resolved the 14-subunit GroEL double-ring architecture
      of the bacterial chaperonin ATPase complex (PDB:1AON).
