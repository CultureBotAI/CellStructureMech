discussions:
- discussion_id: resolve_gltb_gltd_component_grounding
  prompt: Can the GltB and GltD components be grounded to exact source-neutral families?
  kind: CURATION_TODO
  status: OPEN
  rationale: GltB has only domain/broad dehydrogenase signatures in the reviewed E.
    coli UniProtKB entry, and the closest reviewed GltD InterPro family also covers
    AegA/UacF oxidoreductase relatives. Keep both components reviewed-label-only until
    exact large-chain and small-chain families are verified.
  evidence:
  - reference: UniProtKB:P09831
    notes: The reviewed GltB entry lists broad or domain-level InterPro signatures
      rather than an exact large-chain family.
  - reference: InterPro:IPR006006
    notes: IPR006006 covers GltD and closely related AegA/UacF proteins, so it is
      broader than the GltD component.
