    notes: GO molecular-function term for ubiquitin conjugating enzyme activity.
  - reference: PMID:32265276
    snippet: The heterodimeric ubiquitin-conjugating enzyme (E2), Ubc13-Mms2, catalyses
      K63-specific polyubiquitylation in genome maintenance and inflammatory signalling.
    notes: Confirms the heterodimeric E2 ubiquitin-conjugating activity of Ubc13-Mms2.
- function_id: protein_k63_linked_ubiquitination
  label: protein K63-linked ubiquitination
  grounding: GO:0070534
  description: Specifically catalyzes synthesis of lysine-63-linked polyubiquitin
    chains on target substrates such as PCNA and endosomal membrane proteins.
  evidence:
  - reference: GO:0070534
    notes: GO biological-process term for protein K63-linked ubiquitination.
  - reference: PMID:10089880
    snippet: We show that Mms2p forms a specific heteromeric complex with the UBC13-encoded
      E2 and is required for the Ubc13p-dependent assembly of polyubiquitin chains
      linked through lysine 63.
    notes: Demonstrates K63-linked polyubiquitin chain assembly by Ubc13p-Mms2p.
- function_id: error_free_postreplication_dna_repair
  label: error-free postreplication DNA repair
  grounding: GO:0042275
  description: Mediates K63-linked polyubiquitination of PCNA to promote error-free
    postreplicative DNA damage tolerance.
  evidence:
  - reference: GO:0042275
    notes: GO biological-process term for error-free postreplication DNA repair.
  - reference: PMID:34995738
    snippet: In the budding yeast Saccharomyces cerevisiae, K63-linked polyubiquitination
      of proliferating cell nuclear antigen (PCNA) is mediated by a Ubc13-Mms2 heterodimer,
      leading to error-free DDT.
    notes: Establishes Ubc13-Mms2-mediated K63-polyubiquitination of PCNA in error-free
      DNA damage tolerance.
