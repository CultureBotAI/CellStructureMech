      linked through lysine 63.
    notes: Confirms Ubc13p as the catalytic E2 partner of Mms2p.
- component_id: mms2_uev_regulatory_subunit
  label: Ubiquitin-conjugating enzyme variant MMS2
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR016135
  gene_symbols:
  - MMS2
  stoichiometry: '1'
  essentiality: ESSENTIAL
  role: Noncatalytic ubiquitin-conjugating enzyme variant (UEV) subunit (Mms2p) that
    lacks an active-site cysteine and binds acceptor ubiquitin to orient its Lys63
    residue toward the Ubc13p catalytic center.
  protein_examples:
  - uniprot_id: UniProtKB:P53152
    protein_label: Ubiquitin-conjugating enzyme variant MMS2
    gene_symbol: MMS2
    taxon_id: NCBITaxon:559292
    taxon_label: Saccharomyces cerevisiae S288C
    entry_status: REVIEWED
    retrieved_on: '2026-10-31'
    role: Reviewed Saccharomyces cerevisiae S288C noncatalytic UEV subunit Mms2p.
    evidence:
    - reference: UniProtKB:P53152
      notes: Reviewed Swiss-Prot entry for Saccharomyces cerevisiae S288C Mms2p.
    - reference: PMID:10089880
      snippet: Ubiquitin-conjugating enzyme variant (UEV) proteins resemble ubiquitin-conjugating
        enzymes (E2s) but lack the defining E2 active-site residue. The MMS2-encoded
        UEV protein has been genetically implicated in error-free postreplicative
        DNA repair in Saccharomyces cerevisiae.
      notes: Identifies Mms2p as the noncanonical UEV subunit required for error-free
        postreplicative DNA repair.
  evidence:
  - reference: GO:0031372
    notes: GO:0031372 defines Mms2p as the UEV subunit of the yeast UBC13-MMS2 complex.
  - reference: InterPro:IPR016135
    notes: InterPro superfamily entry for ubiquitin-conjugating enzyme/RWD-like proteins.
  - reference: PMID:10089880
    snippet: These findings support a model in which an Mms2p/Ubc13p complex assembles
      novel polyubiquitin chains for signaling in DNA repair, and they suggest that
      UEV proteins may act to increase diversity and selectivity in ubiquitin conjugation.
    notes: Establishes the selectivity-conferring role of Mms2p in the Mms2p/Ubc13p
      heterodimer.
