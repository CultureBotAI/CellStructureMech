identifier: GO:0035658
label: Mon1-Ccz1 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that functions as a guanine nucleotide exchange factor
  (GEF) and converts Rab-GDP to Rab-GTP. In S. cerevisiae, this complex consists of
  at least Mon1 and Ccz1, and serves as a GEF for the Rab Ypt7p.
definition_source: GO:0035658
mapping_status: PROPOSED
xrefs:
- ComplexPortal:CPX-1674
parent_structures:
- GO:0032045
part_of:
- GO:0005770
components:
- component_id: mon1_longin_subunit
  label: Vacuolar fusion protein MON1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR004353
  gene_symbols:
  - MON1
  stoichiometry: 1 copy per Mon1-Ccz1 heterodimer
  essentiality: ESSENTIAL
  role: Tri-longin-domain subunit (Mon1p) that heterodimerizes with Ccz1p to form
    the catalytic Rab7/Ypt7p guanine nucleotide exchange factor (GEF) interface on
    late endosomes and vacuoles.
  evidence:
  - reference: GO:0035658
    notes: GO:0035658 defines the Saccharomyces cerevisiae Mon1-Ccz1 complex as consisting
      of Mon1 and Ccz1.
  - reference: PMID:20797862
    notes: Nordmann et al. 2010 (DOI:10.1016/j.cub.2010.08.002) demonstrated that
      neither Mon1 nor Ccz1 alone has GEF activity, whereas the assembled Mon1-Ccz1
      heterodimer directly catalyzes nucleotide exchange on the Rab GTPase Ypt7p.
  - reference: PMID:12364329
    notes: Wang et al. 2002 (DOI:10.1074/jbc.m208191200) showed that S. cerevisiae
      Mon1p and Ccz1p form a stable complex required for vacuole fusion and endosome-to-vacuole
      trafficking.
