functions:
- function_id: ypt7_rab_guanyl_nucleotide_exchange
  label: guanyl-nucleotide exchange factor activity
  grounding: GO:0005085
  description: Catalyzes the exchange of bound GDP for GTP on the late-endosomal and
    vacuolar Rab GTPase Ypt7p, driving Rab5-to-Rab7 (Vps21p-to-Ypt7p) endosomal maturation
    and HOPS-mediated vacuolar membrane fusion.
  evidence:
  - reference: GO:0035658
    notes: GO:0035658 defines the Mon1-Ccz1 complex as a GEF that converts Rab-GDP
      to Rab-GTP (specifically Ypt7p in S. cerevisiae).
  - reference: PMID:20797862
    notes: Nordmann et al. 2010 reconstituted Ypt7p GDP-to-GTP exchange catalyzed
      by purified S. cerevisiae Mon1-Ccz1.
