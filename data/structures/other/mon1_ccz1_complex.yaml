- component_id: ccz1_longin_subunit
  label: Vacuolar fusion protein CCZ1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR013176
  gene_symbols:
  - CCZ1
  stoichiometry: 1 copy per Mon1-Ccz1 heterodimer
  essentiality: ESSENTIAL
  role: Tri-longin-domain partner subunit (Ccz1p) that pairs with Mon1p to remodel
    the nucleotide-binding pocket of Ypt7p and promote GDP-to-GTP exchange on late
    endosomal and vacuolar membranes.
  evidence:
  - reference: GO:0035658
    notes: GO:0035658 names Ccz1 as an essential subunit of the S. cerevisiae Mon1-Ccz1
      complex.
  - reference: PMID:20797862
    notes: Nordmann et al. 2010 showed that Ccz1p is required with Mon1p to constitute
      the active Ypt7p guanine nucleotide exchange factor.
  - reference: PMID:12364329
    notes: Wang et al. 2002 demonstrated that Ccz1p and Mon1p co-immunoprecipitate
      as a stable complex on vacuolar and endosomal membranes.
