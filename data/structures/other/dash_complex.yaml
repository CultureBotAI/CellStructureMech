causal_graphs:
- graph_id: dash_outer_kinetochore_microtubule_attachment
  title: DASH links the outer kinetochore to spindle microtubules
  description: In budding yeast, the DASH/Dam1 complex is an outer-kinetochore multiprotein
    complex that binds microtubules and contributes to kinetochore-spindle attachment.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph places DASH in the outer kinetochore and records the high-level
    microtubule-attachment link without modeling ring closure, phosphorylation, or
    force-coupling states.
