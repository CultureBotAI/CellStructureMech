discussions:
- discussion_id: resolve_dash_subunit_boundaries
  prompt: Resolve exact source-neutral family groundings for the curated DASH subunits
    and verify the omitted Dad3, Dad4, Hsk-family microprotein boundary.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#duo1_dash_subunit
  - components#dam1_dash_subunit
  - components#dad1_dash_subunit
  - components#dad2_dash_subunit
  - components#ask1_dash_subunit
  - components#spc19_dash_subunit
  - components#spc34_dash_subunit
  rationale: GO defines DASH as a yeast 8-10 subunit complex. This first pass curates
    seven subunits directly named in GO, Cheeseman 2001, and Janke 2002, and leaves
    tiny Dad/Hsk-family DASH subunits for a dedicated source-neutral grounding and
    boundary review.
  evidence:
  - reference: GO:0042729
    notes: Gene Ontology cellular-component term for the DASH complex.
  - reference: DOI:10.1083/jcb.200109063
    notes: Cheeseman et al. 2001 purified a budding-yeast Dam1p complex containing
      Dam1p, Duo1p, Dad1p, Spc19p, Spc34p, Dad2p and Ask1p and linked the complex
      to outer kinetochore function.
  - reference: DOI:10.1093/emboj/21.1.181
    notes: Janke et al. 2002 studied Ask1p, Dad2p, Spc19p and Spc34p as subunits of
      the budding-yeast Duo1p-Dam1p-Dad1p complex.
  - reference: DOI:10.1128/MCB.25.2.767-778.2005
    notes: Li, Li and Elledge 2005 analyzed additional small DASH subunits, including
      Hsk3 as a helper of Ask1 association.
  posed_by: codex
  posed_date: '2026-09-18'
