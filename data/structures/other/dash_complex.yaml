identifier: GO:0042729
label: DASH complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A large protein complex, containing around 8-10 subunits in yeast, including
  Duo1p, Dam1p, Dad1p and Ask1p. The complex forms part of the outer kinetochore,
  associates with microtubules when the kinetochore attaches to the spindle, and plays
  a role in spindle attachment, chromosome segregation and spindle stability.
definition_source: GO:0042729
mapping_status: PROPOSED
