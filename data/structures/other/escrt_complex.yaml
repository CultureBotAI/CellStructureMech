discussions:
- discussion_id: child_records_hold_escrt_subunits
  prompt: Should individual ESCRT-0, ESCRT-I, ESCRT-II, ESCRT-III and ESCRT-IV subunits
    be curated on the generic ESCRT complex record?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0036452 is the generic ESCRT complex parent for several distinct ESCRT
    complexes. The ESCRT-0, ESCRT-I, ESCRT-II, ESCRT-III and ESCRT-IV child terms
    carry different subunit and assembly boundaries that should not be merged into
    a single parent component table.
  resolution_note: Kept this record focused on the GO:0036452 parent and left ESCRT-specific
    subunits and stoichiometry on dedicated child records or future ESCRT-IV curation.
  evidence:
  - reference: GO:0036452
    notes: QuickGO lists the named ESCRT child complexes as is_a children of the ESCRT
      complex.
  - reference: GO:1990621
    notes: ESCRT IV has a distinct GO child term from ESCRT-0, ESCRT-I, ESCRT-II and
      ESCRT-III.
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed the ESCRT pathway as a set of distinct
      complexes and associated factors.
  posed_by: codex
  posed_date: '2026-09-24'
  resolved_date: '2026-09-24'
