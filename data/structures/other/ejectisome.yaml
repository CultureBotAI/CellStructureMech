components:
- component_id: ejectisin_polypeptides
  label: ejectisin polypeptides
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Small, approximately 6-kDa polypeptides that make up a major component of
    cryptophycean ejectisomes.
  evidence:
  - reference: DOI:10.1007/s00709-012-0440-4
    notes: Ammermann et al. 2013 found 6-kDa polypeptides dominating isolated and
      reconstituted cryptophyte ejectisome fragments, and introduced the name ejectisins
      for those major ejectisome components.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam or NCBIfam accession for
    the cryptophyte 6-kDa ejectisin structural polypeptides was verified in this pass.
taxonomic_distribution:
- taxon_id: NCBITaxon:3027
  taxon_label: Cryptophyceae
  presence: VARIABLE
  note: Ejectisomes were isolated from Chroomonas and Cryptomonas species, and ejectisin
    components are described as cryptophycean; this record does not assert that every
    Cryptophyceae species carries ejectisomes.
  reference: DOI:10.1007/s00709-012-0440-4
canonical_examples:
- taxon_id: NCBITaxon:3028
  taxon_label: Chroomonas
  note: Cryptophyte genus represented among the cultures used to isolate and characterize
    discharged ejectisomes and ejectisin-rich ejectisome filaments.
  reference: PMID:22868567
evidence:
- reference: DOI:10.1007/s00709-011-0267-4
  notes: Rhiel and Westermann 2012 isolated discharged ejectisomes from pigmented
    cryptophytes and characterized their tubular paracrystalline fragments by transmission
    electron microscopy.
- reference: DOI:10.1007/s00709-012-0440-4
  notes: Ammermann et al. 2013 purified Chroomonas and Cryptomonas ejectisome fragments
    and identified ejectisins as major cryptophycean ejectisome polypeptides.
- reference: PMID:21336864
  notes: PubMed record for the Rhiel and Westermann 2012 discharged ejectisome ultrastructure
    study.
- reference: PMID:22868567
  notes: PubMed record for the Ammermann et al. 2013 ejectisin component study.
causal_graphs:
- graph_id: ejectisins_build_discharged_ejectisome_filaments
  title: Ejectisins are major components of discharged ejectisomes
  description: Cryptophyte ejectisomes contain small ejectisin polypeptides and discharge
    as tubular or filamentous proteinaceous structures with a paracrystalline lattice.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the observed proteinaceous lattice of discharged
    ejectisomes and the major ejectisin component class; it leaves the full membrane
    context, undischarged ribbon architecture and discharge trigger unresolved.
  nodes:
  - node_id: ejectisin_polypeptides
    label: ejectisin polypeptides
    node_type: GENE_OR_PROTEIN
    component_ref: ejectisin_polypeptides
  - node_id: ejectisome
    label: ejectisome
    node_type: STRUCTURE
    grounding: cellstructuremech:ejectisome
  - node_id: discharged_ejectisome_filaments
    label: discharged ejectisome filaments
    node_type: STRUCTURE
  edges:
  - subject: ejectisin_polypeptides
    predicate: are major component of
    object: ejectisome
    description: Approximately 6-kDa ejectisin polypeptides dominate isolated cryptophyte
      ejectisome fragments and reconstituted ejectisome-like filaments.
    evidence:
    - reference: DOI:10.1007/s00709-012-0440-4
      notes: Ammermann et al. 2013 found the isolated ejectisome-fragment protein
