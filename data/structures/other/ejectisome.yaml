discussions:
- discussion_id: resolve_ejectisin_grounding
  prompt: Resolve exact source-neutral InterPro, Pfam or NCBIfam grounding for the
    cryptophyte 6-kDa ejectisin polypeptides.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#ejectisin_polypeptides
  rationale: Ejectisins were identified as major cryptophycean ejectisome components,
    but this pass did not verify a curated family accession that exactly denotes those
    small structural polypeptides.
  evidence:
  - reference: DOI:10.1007/s00709-012-0440-4
    notes: Ammermann et al. 2013 matched N-terminal amino-acid sequence from isolated
      ejectisome polypeptides to Guillardia theta cDNA-deduced polypeptides.
  posed_by: codex
  posed_date: '2026-09-22'
- discussion_id: resolve_ejectisome_boundary
  prompt: Resolve the undischarged ejectisome membrane context, ribbon substructure
    names and species-level cryptophyte culture boundaries.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#ejectisins_build_discharged_ejectisome_filaments
  rationale: The current graph is limited to isolated discharged ejectisome fragments
    from a Chroomonas and two Cryptomonas species; the mature resting architecture,
    membrane boundary and exact culture species need further curation before adding
    substructures.
  evidence:
  - reference: DOI:10.1007/s00709-011-0267-4
    notes: Rhiel and Westermann 2012 characterized discharged ejectisome fragments
      rather than a complete conserved assembly pathway for resting ejectisomes.
  - reference: DOI:10.1007/s00709-012-0440-4
    notes: Ammermann et al. 2013 isolated fragments from two Cryptomonas and one Chroomonas
      species.
  posed_by: codex
  posed_date: '2026-09-22'
