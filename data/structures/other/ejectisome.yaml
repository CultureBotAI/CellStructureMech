identifier: cellstructuremech:ejectisome
label: ejectisome
structure_category: OTHER
structure_kind: OTHER
definition: A cryptophyte extrusive organelle that discharges proteinaceous paracrystalline
  ribbons or filaments built in part from small ejectisin polypeptides.
definition_source: DOI:10.1007/s00709-012-0440-4
mapping_status: PROPOSED
