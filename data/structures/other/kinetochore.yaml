causal_graphs:
- graph_id: yeast_inner_outer_kinetochore_bridge
  title: Inner kinetochore complexes recruit the outer microtubule-binding module
  description: In the budding-yeast kinetochore, Cse4 centromeric chromatin anchors
    inner kinetochore assemblies, COMA links DNA-proximal and microtubule-bound subunits,
    MIND/Mtw1 recruits Ndc80, and Ndc80 forms the outer module.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph places core Saccharomyces kinetochore subcomplexes in an
    inner-to-outer assembly hierarchy without enumerating every CBF3, Mif2, Ctf19,
    Dam1/DASH or regulatory input.
  nodes:
  - node_id: centromeric_cse4_nucleosome
    label: centromeric Cse4/CENP-A nucleosome platform
    node_type: GENE_OR_PROTEIN
    component_ref: centromeric_cse4_nucleosome
  - node_id: coma_complex
    label: COMA complex
    node_type: STRUCTURE
    grounding: GO:0000817
    component_ref: coma_complex
  - node_id: mis12_mind_type_complex
    label: MIS12/MIND type complex
    node_type: STRUCTURE
    grounding: GO:0000444
    component_ref: mis12_mind_type_complex
  - node_id: ndc80_complex
    label: Ndc80 complex
    node_type: STRUCTURE
    grounding: GO:0031262
    component_ref: ndc80_complex
  - node_id: kinetochore
    label: kinetochore
    node_type: STRUCTURE
    grounding: GO:0000776
  edges:
  - subject: centromeric_cse4_nucleosome
    predicate: anchors assembly of
    object: kinetochore
    description: Cse4-containing centromeric chromatin forms the inner platform on
      which budding-yeast kinetochores assemble.
    evidence:
    - reference: DOI:10.1534/genetics.112.145276
      notes: Biggins 2013 reviewed Cse4/CENP-A as the centromeric chromatin foundation
        for budding-yeast kinetochore assembly.
  - subject: coma_complex
    predicate: bridges inner and outer modules of
    object: kinetochore
    description: The COMA complex bridges DNA-proximal kinetochore subunits and outer
      microtubule-binding modules.
    evidence:
    - reference: GO:0000817
      notes: GO:0000817 defines COMA as a kinetochore complex bridging centromeric-DNA-proximal
        and microtubule-bound subunits.
  - subject: mis12_mind_type_complex
    predicate: recruits
    object: ndc80_complex
    description: MIS12/MIND-type complexes help recruit outer kinetochore subunits
      that bind to microtubules.
    evidence:
    - reference: GO:0000444
      notes: GO:0000444 defines the MIS12/MIND type complex as helping recruit outer
        microtubule-binding kinetochore subunits.
  - subject: ndc80_complex
    predicate: forms outer microtubule-binding module of
    object: kinetochore
    description: The Ndc80 complex forms a conserved outer-kinetochore module of the
      budding-yeast kinetochore.
    evidence:
    - reference: GO:0031262
      notes: GO:0031262 defines the Ndc80 complex as an outer kinetochore subcomplex.
    - reference: DOI:10.1083/jcb.200305100
      notes: Westermann et al. 2003 placed Ndc80 in the budding-yeast kinetochore
        molecular core.
