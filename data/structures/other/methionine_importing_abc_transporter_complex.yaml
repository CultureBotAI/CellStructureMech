  label: ABC-type D-methionine transporter activity
  grounding: GO:0033232
  description: MetNI couples ATP hydrolysis to transport of D-methionine and methionine
    derivatives across the plasma membrane.
  evidence:
  - reference: GO:0033232
    notes: GO:0033232 is the Gene Ontology molecular-function term for ABC-type D-methionine
      transporter activity.
  - reference: DOI:10.1073/pnas.1811003115
    notes: Nguyen et al. 2018 characterized D-methionine derivative transport by the
      E. coli MetNI transporter and solved the PDB:6CVL MetNIQ structure.
- function_id: l_methionine_transmembrane_transport
