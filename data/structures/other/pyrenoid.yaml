components:
- component_id: rubisco_holoenzyme
  label: ribulose bisphosphate carboxylase complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0048492
  essentiality: ESSENTIAL
  role: Ribulose-1,5-bisphosphate carboxylase/oxygenase complexes densely concentrated
    in the pyrenoid matrix to fix CO2.
  evidence:
  - reference: DOI:10.1016/j.cell.2017.08.008
    notes: Freeman Rosenzweig et al. 2017 characterized the Chlamydomonas reinhardtii
      pyrenoid as a Rubisco-rich, non-membrane-bound, liquid-like organelle.
  - reference: DOI:10.1073/pnas.1522866113
    notes: Mackinder et al. 2016 showed that EPYC1 links Rubisco in the Chlamydomonas
      pyrenoid matrix.
- component_id: epyc1_rubisco_linker
  label: EPYC1 Rubisco linker
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: EPYC1 is curated as the Chlamydomonas Rubisco-linking pyrenoid
    matrix protein; no exact source-neutral family CURIE was resolved for this first
    pyrenoid record.
  gene_symbols:
  - EPYC1
  role: Intrinsically disordered Chlamydomonas matrix linker that multivalently binds
    Rubisco holoenzymes and drives their phase separation into a pyrenoid-like condensate.
  evidence:
  - reference: DOI:10.1073/pnas.1522866113
    notes: Mackinder et al. 2016 identified EPYC1 as a repeat protein that binds Rubisco
      and links Rubisco complexes to form the pyrenoid.
  - reference: DOI:10.1038/s41467-018-07624-w
    notes: Wunder et al. 2018 showed that Chlamydomonas EPYC1 and Rubisco can phase-separate
      into liquid droplets in vitro.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: Pyrenoids are non-membrane-bound chloroplast organelles found across most
    eukaryotic algae and in the hornwort land-plant lineage, not throughout Eukaryota.
  reference: DOI:10.1093/plcell/koad157
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  presence: COMMON
  note: The Chlamydomonas pyrenoid has a Rubisco/EPYC1 matrix and is a genetically
    tractable model for the algal carbon-concentrating mechanism.
  reference: DOI:10.1016/j.cell.2017.08.044
canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Green alga in which EPYC1 was tied to Rubisco matrix assembly, pyrenoid inheritance,
    and liquid-like pyrenoid organization.
  reference: DOI:10.1016/j.cell.2017.08.008
functions:
- function_id: carbon_dioxide_fixation
  label: carbon fixation
  grounding: GO:0015977
  description: The pyrenoid concentrates Rubisco so CO2 can be fixed by the Calvin-Benson-Bassham
    cycle in the chloroplast.
  evidence:
  - reference: DOI:10.1016/j.cell.2017.08.008
    notes: Freeman Rosenzweig et al. 2017 describe the pyrenoid as the algal CO2-fixing
      organelle and tracked its Rubisco-rich matrix during cell division.
  - reference: DOI:10.1093/plcell/koad157
    notes: He, Crans, and Jonikas 2023 review the pyrenoid as the eukaryotic CO2-concentrating
      organelle.
- function_id: rubisco_matrix_phase_separation
  label: Rubisco matrix phase separation
  description: The Chlamydomonas pyrenoid matrix forms by multivalent interactions
    between EPYC1 and Rubisco holoenzymes.
  evidence:
  - reference: DOI:10.1073/pnas.1522866113
    notes: Mackinder et al. 2016 established EPYC1 as a Rubisco-linking repeat protein
      needed for normal pyrenoid formation.
  - reference: DOI:10.1038/s41467-018-07624-w
    notes: Wunder et al. 2018 reconstituted liquid droplet formation from Rubisco
      and EPYC1.
evidence:
- reference: DOI:10.1016/j.cell.2017.08.008
  notes: Freeman Rosenzweig et al. 2017, The Eukaryotic CO2-Concentrating Organelle
    Is Liquid-like and Exhibits Dynamic Reorganization, Cell.
- reference: DOI:10.1073/pnas.1522866113
  notes: Mackinder et al. 2016, A repeat protein links Rubisco to form the eukaryotic
    carbon-concentrating organelle, PNAS.
- reference: DOI:10.1038/s41467-018-07624-w
  notes: Wunder et al. 2018, The phase separation underlying the pyrenoid-based microalgal
    Rubisco supercharger, Nature Communications.
- reference: DOI:10.1016/j.cell.2017.08.044
  notes: Mackinder et al. 2017, A Spatial Interactome Reveals the Protein Organization
    of the Algal CO2-Concentrating Mechanism, Cell.
- reference: DOI:10.1093/plcell/koad157
  notes: 'He, Crans, and Jonikas 2023, The pyrenoid: the eukaryotic CO2-concentrating
    organelle, Plant Cell.'
