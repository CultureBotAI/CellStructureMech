causal_graphs:
- graph_id: yeast_garp_endosome_to_golgi_tethering
  title: GARP supports yeast endosome-to-Golgi retrograde transport
  description: In Saccharomyces cerevisiae, Vps51 joins Vps52, Vps53 and Vps54 to
    form the GARP complex, a trans-Golgi-network tethering complex that links retrograde
    endosome-to-Golgi transport to the t-SNARE Tlg1p.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph represents yeast GARP subunit membership, Vps51-Tlg1 association,
    TGN localization and endosome-to-Golgi transport involvement without modeling
    SNARE-mediated fusion steps.
