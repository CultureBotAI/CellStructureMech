functions:
- function_id: retrograde_transport_endosome_to_golgi
  label: retrograde transport, endosome to Golgi
  grounding: GO:0042147
  description: GARP is a Golgi-localized tethering complex required for retrograde
    transport from early and late endosomes back to the trans-Golgi network.
  evidence:
  - reference: GO:0042147
    notes: GO:0042147 denotes vesicle-mediated retrograde transport from endosomes
      back to the trans-Golgi network.
  - reference: DOI:10.1091/mbc.e02-10-0654
    notes: Conibear, Cleck and Stevens 2003 found that all four yeast GARP members
      are required for retrograde transport from early and late endosomes back to
      the trans-Golgi network.
