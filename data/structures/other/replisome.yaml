identifier: GO:0030894
label: replisome
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multi-component enzymatic machine at the replication fork which mediates
  DNA replication. Includes DNA primase, one or more DNA polymerases, DNA helicases,
  and other proteins. Across Bacteria, Archaea, and microbial eukaryotes, the replisome
  couples replicative DNA helicase unwinding (DnaB, MCM, or CMG) with RNA primer synthesis,
  clamp-loader-mediated sliding clamp assembly (beta clamp or PCNA), and high-processivity
  leading- and lagging-strand DNA polymerases.
