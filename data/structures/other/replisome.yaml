- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: COMMON
  note: Eukaryotic nuclear and organellar replisomes built around the CMG (Cdc45-MCM-GINS)
    helicase, Pol epsilon, Pol delta, and Pol alpha-primase.
  reference: PMID:19228417
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: Bacterial replisomes built around the DnaB replicative helicase, DnaG primase,
    and DNA polymerase III holoenzyme.
  reference: GO:0030894
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: COMMON
  note: Archaeal replisomes built around the MCM homohexameric helicase, GINS, Primase,
    and PolB/PolD replicative DNA polymerases.
  reference: PMID:19228417
