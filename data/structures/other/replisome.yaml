functions:
- function_id: dna_replication
  label: DNA replication
  grounding: GO:0006260
  description: The CMG complex supports DNA unwinding during eukaryotic DNA replication.
  evidence:
  - reference: GO:0071162
    notes: GO:0071162 defines the CMG complex as involved in unwinding DNA during
      replication.
  - reference: GO:0006260
    notes: GO:0006260 is the Gene Ontology biological-process term for DNA replication.
  - reference: PMID:19228417
    notes: Akman and MacNeill 2009 describe the Cdc45, MCM and GINS components of
      CMG as essential for chromosomal DNA replication in eukaryotic cells.
