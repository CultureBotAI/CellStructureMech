causal_graphs:
- graph_id: replisome_mechanism
  title: Replisome helicase-primase-polymerase coordination at the replication fork
  description: Replicative helicase, primase, clamp loader, sliding clamps, and replicative
    DNA polymerases assemble into the replisome at the replication fork to couple
    parental duplex unwinding with coordinated leading- and lagging-strand synthesis.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the three GO-defined CMG constituents and DNA-replication
    function without resolving MCM2-7 ring activation, Cdc45/GINS binding interfaces
    or replisome coupling.
