identifier: GO:0000408
label: EKC/KEOPS complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multiprotein complex conserved across Archaea and Eukarya (composed
  of Kae1, Bud32, Cgi121, Pcc1, and in fungi/metazoa Gon7) that catalyzes the biosynthesis
  of the essential N(6)-L-threonylcarbamoyladenine (t6A) modification at position
  37 of ANN-decoding tRNAs and supports telomere maintenance and transcription.
definition_source: GO:0000408
