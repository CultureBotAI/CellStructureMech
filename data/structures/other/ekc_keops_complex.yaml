functions:
- function_id: trna_t6a_synthase_activity
  label: tRNA N(6)-L-threonylcarbamoyladenine synthase activity
  grounding: GO:0061711
  description: Catalyzes the transfer of the threonylcarbamoyl group onto N6 of adenosine-37
    in ANN-decoding tRNAs.
  evidence:
  - reference: GO:0061711
    notes: GO molecular-function term for tRNA N(6)-L-threonylcarbamoyladenine synthase
      activity.
  - reference: PMID:39639027
    snippet: The enzyme complex KEOPS (Kinase, Endopeptidase and Other Proteins of
      Small size) installs the universally conserved and essential N6-threonylcarbamoyl
      adenosine modification (t6A) on ANN-decoding tRNAs in eukaryotes and in archaea.
    notes: Establishes tRNA N6-threonylcarbamoyladenosine synthase activity of KEOPS.
- function_id: trna_t6a_modification
  label: tRNA threonylcarbamoyladenosine modification
  grounding: GO:0002949
  description: Installs the essential t6A modification at position 37 of ANN-decoding
    tRNAs to maintain reading-frame fidelity and cellular fitness.
  evidence:
  - reference: GO:0002949
    notes: GO biological-process term for tRNA threonylcarbamoyladenosine modification.
  - reference: PMID:38477398
    snippet: KEOPS cooperates with Sua5/YRDC to catalyze the biosynthesis of tRNA
      N6-threonylcarbamoyladenosine (t6A), an essential modification needed for fitness
      of cellular organisms.
    notes: Demonstrates the role of KEOPS in tRNA t6A biosynthesis.
