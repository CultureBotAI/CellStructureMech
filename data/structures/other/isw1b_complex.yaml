discussions:
- discussion_id: isw1b_subunit_grounding
  prompt: Curate exact source-neutral InterPro, Pfam, NCBIfam or UniProt family groundings
    for the Isw1b ATPase, Ioc2 and Ioc4 component classes when terms that denote those
    classes can be verified.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#isw1_isw1b_atpase_subunit
  - components#ioc2_isw1b_subunit
  - components#ioc4_isw1b_subunit
  rationale: The Isw1 ATPase is shared between Isw1a and Isw1b, and the available
    Ioc2 and Ioc4 motifs are broader than the Isw1b subunit classes, so exact grounding
    should avoid broad ATPase, PHD, or PWWP domain terms that do not denote these
    subunit classes.
  evidence:
  - reference: DOI:10.1128/MCB.23.1.80-91.2003
    notes: Vary et al. 2003 resolved Isw1a and Isw1b as separable Isw1 complexes.
  posed_by: codex
  posed_date: '2026-09-26'
