identifier: GO:0000775
label: chromosome, centromeric region
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: The region of a chromosome that includes the centromeric DNA and associated
  proteins. In mitosis or meiosis II, this region connects the chromosome to spindle
  microtubules via the kinetochore. In Saccharomyces cerevisiae, Schizosaccharomyces
  pombe, and other microbial eukaryotes, the centromeric region comprises specialized
  CenH3 (Cse4/Cnp1) centromeric nucleosomes, point- or regional-centromere DNA-binding
  factors (such as the CBF3 complex), pericentromeric cohesin/heterochromatin, and
  the assembled inner and outer kinetochore complexes.
definition_source: GO:0000775
