causal_graphs:
- graph_id: chromosome_centromeric_region_mechanism
  title: Centromeric DNA specification, Cse4 chromatin assembly, and kinetochore incorporation
    in the chromosome, centromeric region
  description: Centromeric DNA (SO:0000577) specifies assembly of the Cse4/CENP-A
    centromeric nucleosome platform, which recruits inner (COMA, MIS12/MIND) and outer
    (Ndc80) kinetochore subcomplexes to form the chromosome, centromeric region (GO:0000775)
    and mediate chromosome segregation (GO:0007059).
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Covers the core Saccharomyces cerevisiae centromeric DNA, Cse4 nucleosome,
    and inner-to-outer kinetochore assembly hierarchy within the chromosome, centromeric
    region (GO:0000775).
