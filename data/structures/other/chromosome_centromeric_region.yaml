  grounding_notes: Sequence Ontology term SO:0000577 (centromere) denotes the chromosomal
    centromeric DNA sequence locus (such as the ~125 bp CDEI-CDEII-CDEIII point centromere
    in Saccharomyces cerevisiae) that specifies assembly of centromeric chromatin.
  role: Chromosomal centromeric DNA sequence locus that specifies assembly of the
    Cse4/CENP-A centromeric nucleosome and the overlying kinetochore within the chromosome,
    centromeric region.
  evidence:
  - reference: DOI:10.1534/genetics.112.145276
    notes: Biggins 2013 reviews how the Saccharomyces cerevisiae point centromeric
      DNA locus nucleates the Cse4 centromeric nucleosome and kinetochore within the
      chromosome, centromeric region.
