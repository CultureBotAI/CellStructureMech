identifier: GO:0043596
label: nuclear replication fork
structure_category: OTHER
structure_kind: OTHER
definition: The Y-shaped region of a nuclear replicating DNA molecule, resulting from
  the separation of the DNA strands and in which the synthesis of new strands takes
  place. Also includes associated protein complexes. In Saccharomyces cerevisiae,
  Schizosaccharomyces pombe, and other microbial eukaryotes, the nuclear replication
  fork couples CMG (Cdc45-MCM-GINS) helicase unwinding of chromosomal DNA with leading-strand
  synthesis by DNA polymerase epsilon, lagging-strand synthesis by DNA polymerase
  alpha-primase and delta, PCNA clamp loading, and nucleosome reassembly.
