functions:
- function_id: dna_replication
  label: DNA replication
  grounding: GO:0006260
  description: Serves as the active chromosomal site where the nuclear replisome unwinds
    parental duplex DNA and coordinates coupled leading- and lagging-strand DNA synthesis.
  evidence:
  - reference: GO:0005657
    notes: GO defines the replication fork as the active site of chromosomal DNA unwinding
      and nascent strand synthesis during DNA replication.
- function_id: dna_damage_response
  label: DNA damage response
  grounding: GO:0006974
  description: The checkpoint clamp complex is loaded onto damaged DNA and supports
    the cellular response to DNA damage.
  evidence:
  - reference: GO:0030896
    notes: GO:0030896 defines the checkpoint clamp complex as loaded onto DNA at sites
      of DNA damage.
  - reference: GO:0006974
    notes: GO:0006974 is the Gene Ontology biological-process term for DNA damage
      response.
