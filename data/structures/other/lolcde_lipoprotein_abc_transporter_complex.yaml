identifier: cellstructuremech:lolcde_lipoprotein_abc_transporter_complex
label: LolCDE lipoprotein ABC transporter complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An Escherichia coli inner-membrane ABC transporter complex composed of
  one LolC transmembrane subunit, two LolD ATP-binding subunits, and one LolE transmembrane
  subunit that uses LolD ATP hydrolysis to release outer membrane-specific lipoproteins
  from the inner membrane for periplasmic trafficking.
