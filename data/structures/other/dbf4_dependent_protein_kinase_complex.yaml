identifier: GO:0031431
label: Dbf4-dependent protein kinase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heterodimeric protein complex required for the activation of DNA replication
  origins; comprises a catalytic subunit and a regulatory subunit (in Saccharomyces,
  Cdc7p and Dbf4p, respectively); complexes identified in other species generally
  contain proteins related to the Saccharomyces proteins.
