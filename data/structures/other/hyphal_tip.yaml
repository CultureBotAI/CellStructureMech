causal_graphs:
- graph_id: hyphal_tip_mechanism
  title: Hyphal tip polarized exocytosis and cell wall extension
  description: Cdc42 GTPase signaling recruits the polarisome scaffold (Spa2, Pea2,
    Bud6) and formin Bni1 to the hyphal tip, nucleating actin cables that direct Myo2-driven
    secretory vesicles to sustain apical hyphal tip expansion.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph records the localized mature-tip architecture without asserting
    direct physical contacts among SPA-2, BUD-6, BNI-1, or Spitzenkorper constituents.
