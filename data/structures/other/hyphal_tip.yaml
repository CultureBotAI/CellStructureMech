functions:
- function_id: hyphal_tip_polarity_maintenance
  label: hyphal-tip polarity maintenance
  description: The hyphal tip polarisome contributes to maintained polarized tip growth
    in Neurospora hyphae.
  evidence:
  - reference: GO:0031562
    notes: GO:0031562 defines the hyphal tip polarisome by its role in determining
      cell polarity at the tip of a growing fungal hypha.
  - reference: DOI:10.1371/journal.pone.0030372
    notes: Lichius et al. 2012 concluded that the Neurospora SPA-2, BUD-6, and BNI-1
      arrangement in the mature apical dome is a filamentous tip-growth-apparatus
      architecture.
