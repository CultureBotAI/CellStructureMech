identifier: GO:0001411
label: hyphal tip
structure_category: OTHER
structure_kind: SUBCELLULAR_REGION
definition: The end, or tip, of a fungal hypha, where polarized growth occurs during
  hyphal elongation. The dome-shaped, rapidly expanding apical region of a fungal
  or oomycete hypha where polarized exocytosis, cell wall biosynthesis, and cytoskeletal
  remodeling are concentrated. In filamentous fungi and dimorphic yeasts such as Candida
  albicans and Ashbya gossypii, the hyphal tip houses the Spitzenkörper and polarisome
  complex that nucleate actin cables and focus secretory vesicle fusion.
definition_source: GO:0001411
