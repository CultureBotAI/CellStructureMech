identifier: GO:0009379
label: Holliday junction helicase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A DNA helicase complex found at Holliday junctions where the helicase
  activity is involved in the migration of the junction branch point. The best-characterized
  example is the E. coli RuvAB complex, in which a hexamer of RuvB subunits possesses
  helicase activity that is modulated by association with RuvA.
