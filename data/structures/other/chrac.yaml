identifier: GO:0008623
label: CHRAC
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An ISWI complex that contains an ATPase subunit of the ISWI family (SNF2H
  in mammals, Isw2 in S. cerevisiae), an ACF1 homolog, and additional small histone
  fold subunits (generally two of these, but Xenopus has only one and some additional
  non-conserved subunits). CHRAC plays roles in the regulation of RNA polymerase II
  transcription and in DNA replication and repair.
