  label: mRNA 3'-end processing
  grounding: GO:0031124
  description: Cleavage bodies concentrate CstF-64 and CPSF-100, proteins involved
    in pre-mRNA 3'-end cleavage and polyadenylation, in dynamic nuclear foci associated
    with Cajal bodies and S-phase histone loci.
  evidence:
  - reference: GO:0071920
    notes: GO:0071920 defines cleavage bodies as nuclear bodies involved in mRNA 3'-end
      processing and containing proteins involved in pre-mRNA 3'-end cleavage and
      polyadenylation.
  - reference: DOI:10.1091/mbc.10.11.3815
    notes: Schul et al. 1999 analyzed CstF-64-positive cleavage bodies beside coiled
