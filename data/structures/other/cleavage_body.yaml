    in RNA 3'-processing Factors Associate with Coiled Bodies and Histone Genes in
    a Cell Cycle-dependent Manner, Molecular Biology of the Cell.
- reference: DOI:10.1091/mbc.e05-08-0768
  notes: Li, Roy, Katyal and colleagues 2006, Dynamic Nature of Cleavage Bodies and
    Their Spatial Relationship to DDX1 Bodies, Cajal Bodies, and Gems, Molecular Biology
    of the Cell.
- reference: DOI:10.1091/mbc.12.10.3046
  notes: Bleoo et al. 2001 connected human DDX1 with CstF in pre-mRNA 3'-end processing,
    informing the open DDX1 boundary question for cleavage-body curation.
