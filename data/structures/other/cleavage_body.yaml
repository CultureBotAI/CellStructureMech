  gene_symbols:
  - CSTF2
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: CstF-64 is curated as the cleavage-stimulation-factor subunit enriched
    in cleavage bodies; no exact reviewed source-neutral InterPro, Pfam or NCBIfam
    accession was assigned in this first record.
  role: mRNA 3'-end cleavage/polyadenylation factor that concentrates in cleavage
    bodies, especially during S phase.
  evidence:
  - reference: PMID:8654386
    notes: Schul et al. 1996 identified nuclear domains containing the RNA 3' cleavage
      factor CstF 64 kDa close to coiled bodies.
  - reference: DOI:10.1091/mbc.e05-08-0768
    notes: Li et al. 2006 used CstF-64 as a cleavage-body marker and found that CstF-64-containing
      cleavage bodies were primarily observed in S-phase HeLa cells.
- component_id: cpsf100
  label: CPSF-100
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - CPSF2
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: CPSF-100 is curated as the cleavage and polyadenylation specificity
    factor subunit enriched in cleavage bodies; no exact reviewed source-neutral InterPro,
    Pfam or NCBIfam accession was assigned in this first record.
  role: mRNA 3'-end cleavage/polyadenylation factor that marks cleavage bodies with
    CstF-64 and can persist in these foci into G2 phase.
  evidence:
  - reference: PMID:8654386
    notes: Schul et al. 1996 identified CPSF 100 kDa with CstF 64 kDa in nuclear cleavage-factor
      domains close to coiled bodies.
  - reference: DOI:10.1091/mbc.e05-08-0768
    notes: Li et al. 2006 followed CPSF-100-positive cleavage bodies in synchronized
      HeLa cells and their relationship to DDX1 bodies and Cajal bodies.
