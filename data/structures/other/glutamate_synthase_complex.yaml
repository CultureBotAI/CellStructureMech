  role: Large glutamate synthase subunit that binds glutamine and participates in
    amide transfer to 2-oxoglutarate in the NADPH-dependent GltBD complex. Functions
    within the iron-sulfur flavoprotein glutamate synthase (GOGAT) complex in glutamate
    synthase complex.
