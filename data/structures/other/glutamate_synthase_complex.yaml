identifier: GO:0031026
label: glutamate synthase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex that possesses glutamate synthase activity. The iron-sulfur
  flavoprotein glutamine:2-oxoglutarate amidotransferase (GOGAT) enzyme complex that
  catalyzes the reductive transfer of the amide amino group from L-glutamine to 2-oxoglutarate
  to yield two molecules of L-glutamate. Operating alongside glutamine synthetase
  in the high-affinity GS-GOGAT ammonia assimilation pathway across bacteria, archaea,
  yeasts, and microalgae, the glutamate synthase complex couples an amidotransferase
  site with FMN and [3Fe-4S]/[4Fe-4S] clusters through an intramolecular ammonia tunnel.
