functions:
- function_id: glutamate_biosynthetic_process
  label: glutamate biosynthetic process
  description: Catalyzes the reductive transfer of the amide nitrogen of L-glutamine
    to 2-oxoglutarate to yield two molecules of L-glutamate via an intramolecular
    ammonia tunnel linking the glutaminase and FMN/[3Fe-4S] synthase active sites.
  evidence:
  - reference: PMID:4565085
    notes: Miller and Stadtman 1972 purify and characterize E. coli glutamate synthase
      as an iron-sulfur flavoprotein complex catalyzing reductive glutamate synthesis.
