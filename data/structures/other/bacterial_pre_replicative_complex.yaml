discussions:
- discussion_id: resolve_bacterial_prerc_component_groundings
  prompt: Resolve exact source-neutral DnaA and oriC origin DNA groundings for the
    bacterial pre-replicative complex.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#dnaa_initiator
  - components#oric_origin_dna
  rationale: GO:0036389 defines the bacterial pre-RC as a protein-DNA complex at oriC,
    and GO:1990101 identifies DnaA-oriC binding as the first step in bacterial pre-RC
    assembly. Exact source-neutral InterPro, Pfam, NCBIfam, UniProt family or SO sequence-feature
    CURIEs need narrower curation before these components can be grounded.
  evidence:
  - reference: GO:0036389
    notes: GO:0036389 defines the bacterial pre-RC as a protein-DNA complex.
  - reference: GO:1990101
    notes: GO:1990101 defines DnaA-oriC binding as the first step in bacterial pre-RC
      assembly.
  posed_by: codex
  posed_date: '2026-10-01'
- discussion_id: distinguish_prerc_substates
  prompt: Keep the generic bacterial pre-RC distinct from named DnaA-oriC, DnaA-DiaA,
    DnaA-HU and helicase-loading complexes.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - components#dnaa_initiator
  - components#oric_origin_dna
  - causal_graphs#bacterial_prerc_assembly
  rationale: GO:0036389 denotes the generic bacterial pre-RC at oriC. GO models DnaA-oriC,
    DnaA-DiaA and DnaA-HU complexes as separate named cellular components, and DnaB-DnaC
    complexes mark later helicase loading states rather than required parts of every
    bacterial pre-RC.
  resolution_note: Curated only DnaA and oriC on the generic bacterial pre-RC and
    left other DnaA-bound substates and DnaB-DnaC helicase loading out of has_part
    and graph edges.
  evidence:
  - reference: GO:0036389
    notes: GO:0036389 denotes the generic bacterial pre-RC class.
  - reference: GO:1990101
    notes: GO:1990101 denotes the narrower DnaA-oriC complex.
  - reference: GO:1990102
    notes: GO:1990102 denotes the DiaA-containing DnaA-oriC complex.
  - reference: GO:1990103
    notes: GO:1990103 denotes the HU-containing DnaA-DNA complex.
  - reference: GO:1990100
    notes: GO:1990100 denotes the DnaB-DnaC helicase-loading complex.
  posed_by: codex
  posed_date: '2026-10-01'
  resolved_date: '2026-10-01'
