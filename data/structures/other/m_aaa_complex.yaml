- discussion_id: protease_partner_and_substrate_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Distinguish the m-AAA protease from its substrate and the larger prohibitin-protease
    association.
  rationale: The same 2026 study combines yeast reporter genetics, C. thermophilum
    heterologous purification, predicted interfaces and human in situ imaging. Treating
    all as one endogenous yeast structure would conflate species, preparations and
    entity boundaries.
  resolution_note: Curate the Yta10/Yta12 protease with its annotated zinc cofactor.
    MrpL32 is a substrate, not a component. The separately recorded mitochondrial
    prohibitin complex is a regulatory partner, not a mandatory protease constituent;
    PHB1 deletion is represented as an external perturbation. Do not assert a universal
    PHB-containing assembly, transfer human in situ localization to yeast, or present
    predicted PHB-protease contacts as atomic experimental contacts. Canonical examples
    document studied organisms without asserting clade-wide prevalence.
  evidence:
  - reference: DOI:10.1038/s41467-026-73040-0
    notes: Figures 3-4, yeast construction methods and Discussion separate these evidence
      types.
  - reference: ComplexPortal:CPX-1654
    notes: The source composition contains Yta10, Yta12 and zinc, not PHB or MrpL32.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: native_architecture_and_preparation_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve native yeast architecture and context-specific stoichiometry from
    fully read primary structural evidence.
  rationale: EMD-1712 represents a cross-linked detergent sample with C6 symmetry
    and reported 3:3 subunit counts. Complex Portal leaves copy counts unspecified
    and lists 1000 kDa, whereas EMDB lists 0.5 MDa for its sample. These source annotations
    are not reconciled as one physiological mass or fixed family-wide stoichiometry.
  notes: No canonical copy counts or physical mass are asserted. The full 2011 paper
    remains unread after PMC CAPTCHA and inaccessible publisher routes; no bypass
    was attempted. Its exact ATPase-mutant construct must not be filled from search
    excerpts. The 2026 high-resolution PHB cage is not an atomic structure of the
    intact yeast m-AAA complex.
  evidence:
  - reference: https://www.ebi.ac.uk/emdb/EMD-1712
    notes: Native XML sample and reconstruction metadata.
  - reference: ComplexPortal:CPX-1654
    notes: Native source properties and unspecified stoichiometry.
  - reference: DOI:10.1038/s41467-026-73040-0
    notes: Figures 1 and 3 address PHB architecture and PHB-protease models/negative-stain
      classes in different species and preparations.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: physiological_processing_and_stress_link
  kind: CURATION_TODO
  status: OPEN
  prompt: Test endogenous substrate processing and the causal route from protease
    regulation to respiratory peroxide sensitivity.
  rationale: The 2026 processing assay uses a TEF-driven C-terminal Strep reporter
    and endpoint precursor fractions. Domain replacements can affect more than one
    molecular property, and growth is a distinct assay. Neither reporter changes nor
    growth phenotypes alone prove assembly failure, general proteome hyperdegradation
    or a direct MrpL32-to-stress mechanism.
  evidence:
  - reference: DOI:10.1038/s41467-026-73040-0
    notes: Figure 4 and processing/oxidative-stress methods bound the measured interventions
      and endpoints.
  posed_by: codex
  posed_date: '2026-10-05'
