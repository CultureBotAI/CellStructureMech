components:
- component_id: yta10
  label: Yta10-type m-AAA protease subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native reviewed UniProt and InterPro checks resolve shared ATP-dependent
    Zinc Metalloprotease IPR050928 and broader FtsH IPR005936 families; IPR011546
    is a domain. These do not distinguish the Yta10 and Yta12 paralog classes, so
    no broad family or domain is asserted as exact identity.
  gene_symbols:
  - AFG3
  - YTA10
  role: AAA ATPase/metalloprotease subunit class represented by Yta10 in the studied
    yeast heteromer; catalytic domains face the matrix.
  evidence:
  - reference: ComplexPortal:CPX-1654
    notes: The source assigns reviewed UniProt P39925, primary gene AFG3 and alias
      YTA10, as an enzymatic participant.
  - reference: https://www.ebi.ac.uk/emdb/EMD-1712
    notes: The deposited yeast preparation contains Yta10 and Yta12. Membership is
      distinct from an inferred assembly sequence or a universal two-paralog composition.
