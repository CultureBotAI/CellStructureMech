functions:
- function_id: mitochondrial_protein_processing
  label: mitochondrial protein processing
  grounding: GO:0034982
  description: Proteolytic maturation of mitochondrial precursor proteins; the curated
    primary assay monitors a C-terminally Strep-tagged MrpL32 reporter in yeast mitochondria.
  evidence:
  - reference: DOI:10.1038/s41467-026-73040-0
    notes: Figure 4a-b and Methods quantify precursor/total MrpL32 after growth in
      YPG for 14 h at 30 C, using four biological replicates. This endpoint assay
      is not a direct measurement of processing rate, endogenous untagged substrate
      behavior or ribosome incorporation.
- function_id: atp_dependent_proteolysis
  label: ATP-dependent peptidase activity
  grounding: GO:0004176
  description: ATP-dependent proteolysis by the matrix-facing mitochondrial inner-membrane
    protease.
  evidence:
  - reference: ComplexPortal:CPX-1654
    notes: Curated source function identifies an ATP-dependent protease with catalytic
      domains facing the matrix. The 2026 reporter assay does not independently test
      ATP dependence.
causal_graphs:
- graph_id: yeast_mrpL32_processing_control
  title: Yeast m-AAA processing and perturbation responses
  graph_kind: REGULATION
  scope_status: MECHANISTIC
  description: Domain replacements in Yta12 and loss of Phb1 alter MrpL32 reporter
    maturation and growth under respiratory oxidative stress.
  scope_notes: Experiment-bounded intervention-response graph from Figure 4 in W303-1B
    derivatives. SIM and IMSD intervals are replaced by GGGGGS linkers, not clean
    deletions of the entire Yta12 protein. Processing is inferred from a precursor/total
    reporter endpoint; growth is a separate plate assay. No edge claims that altered
    MrpL32 processing itself causes peroxide sensitivity, or that these experiments
    resolve a direct atomic PHB-Yta12 interface.
  nodes:
  - node_id: maaa
    label: m-AAA complex
    node_type: STRUCTURE
    grounding: GO:0005745
  - node_id: processing
    label: mitochondrial protein processing
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0034982
    description: Assayed maturation of the C-terminal Strep-tagged MrpL32 reporter,
      not all mitochondrial proteolysis.
  - node_id: phb1_loss
    label: PHB1 deletion
    node_type: STATE
    description: Deletion of the external prohibitin regulator in the tested yeast
      background.
  - node_id: sim_replacement
    label: Yta12 SIM replaced by a linker
    node_type: STATE
    description: Endogenous Yta12 residues 236-251 replaced by GGGGGS; a perturbed
      subunit state, not a separate canonical component.
  - node_id: imsd_replacement
    label: Yta12 IMSD replaced by a linker
    node_type: STATE
    description: Endogenous Yta12 residues 199-290 replaced by GGGGGS; not proof that
      the entire protease fails to assemble.
  - node_id: stress_sensitivity
    label: Reduced growth under respiratory peroxide stress
    node_type: STATE
    description: Reduced growth on YPG with 2 mM H2O2 at 30 C relative to the wild-type
      control; not a universal stress phenotype.
  edges:
  - subject: maaa
    predicate: catalyzes
    object: processing
    description: The yeast protease supports maturation of the tested mitochondrial
      precursor reporter.
    evidence:
    - reference: DOI:10.1038/s41467-026-73040-0
      notes: Introduction, Figure 4a-b and MrpL32 processing methods identify the
        protease and assay its substrate-processing output. Mature and precursor species
        are distinguished by anti-Strep immunoblotting.
  - subject: phb1_loss
    predicate: enhances assayed maturation
    object: processing
    description: Loss of Phb1 lowers the precursor fraction relative to wild type.
    evidence:
    - reference: DOI:10.1038/s41467-026-73040-0
      notes: 'Figure 4a-b: the precursor/total MrpL32 ratio is reduced in the phb1
        deletion strain. The authors interpret this as enhanced processing; flux and
        untagged endogenous protein were not measured here.'
  - subject: sim_replacement
    predicate: enhances assayed maturation
    object: processing
    description: Replacing the Yta12 SIM interval lowers the reporter precursor fraction.
    evidence:
    - reference: DOI:10.1038/s41467-026-73040-0
      notes: 'Figure 4a-b and cloning methods: the GGGGGS replacement of residues
        236-251 yields a lower precursor/total ratio. This supports SIM-dependent
        control without directly visualizing a yeast PHB-binding interface.'
  - subject: imsd_replacement
    predicate: impairs assayed maturation
    object: processing
    description: Replacing the larger intermembrane-space interval increases reporter
      precursor accumulation.
    evidence:
    - reference: DOI:10.1038/s41467-026-73040-0
      notes: 'Figure 4a-b: the IMSD replacement raises the precursor/total ratio.
        Compromised protease assembly is the authors'' interpretation, not a directly
        demonstrated consequence in this assay.'
  - subject: phb1_loss
    predicate: increases
    object: stress_sensitivity
    description: Loss of Phb1 reduces growth under respiratory peroxide stress.
    evidence:
    - reference: DOI:10.1038/s41467-026-73040-0
      notes: 'Figure 4c: serial-dilution growth on YPG with 2 mM H2O2 is reduced and
        partially rescued by PHB1 expression. The corresponding sensitivity is not
        observed on fermentative YPD in this experiment.'
  - subject: sim_replacement
    predicate: increases
    object: stress_sensitivity
    description: The Yta12 SIM replacement sensitizes yeast in the respiratory peroxide
      plate assay.
    evidence:
    - reference: DOI:10.1038/s41467-026-73040-0
      notes: 'Figure 4d: compare YPG with and without 2 mM H2O2 and the separate YPD
        controls; incubation is 3 days on YPG and 2 days on YPD at 30 C.'
  - subject: imsd_replacement
    predicate: increases
    object: stress_sensitivity
    description: The larger Yta12 IMSD replacement also sensitizes yeast under the
      tested respiratory peroxide condition.
    evidence:
    - reference: DOI:10.1038/s41467-026-73040-0
      notes: 'Figure 4d: impaired growth under peroxide is distinct from basal viability
        on YPG. This is not equivalent to deletion of the entire YTA12 gene.'
