  organism: Saccharomyces cerevisiae (NCBITaxon:4932)
  description: Released single-particle cryo-EM reconstruction of a cross-linked,
    detergent-solubilized yeast m-AAA preparation; a structural sample, not an identity-equivalent
    cross-reference for every m-AAA complex.
  conditions:
  - Glutaraldehyde-cross-linked recombinant yeast preparation
  - 1% n-octyl-beta-D-glucopyranoside, 5 mM ATP and 10 mM MgCl2
  - C6 symmetry imposed in reconstruction
  platform: Single-particle cryo-EM; JEOL 2010F
  url: https://www.ebi.ac.uk/emdb/EMD-1712
  publication: DOI:10.1074/jbc.M110.158741
  findings: Depositor metadata describes a Yta10/Yta12 heterohexamer with three copies
    of each and 12 angstrom reconstruction resolution. These are sample/model annotations,
    not universal canonical copy counts or a resolved alternating paralog arrangement.
  notes: Full native XML SHA-256 723a9513e5b5082264156a59e0bfd49f7e168af9596506a9a0d286446fca0ad4.
    The entry supersedes EMD-1543. No strain or mutation details absent from the header
    are filled from search snippets. Resolution and map box dimensions are not biological
    physical properties; no map or image is hosted.
