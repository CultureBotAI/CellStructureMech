identifier: GO:0071819
label: DUBm complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that forms part of SAGA-type complexes SAGA and SLIK,
  and mediates deubiquitination of histone H2B. In S. cerevisiae, the DUBm consists
  of the proteins Ubp8p, Sgf11p, Sus1p, and Sgf73p.
