- discussion_id: resolve_dubm_subunit_groundings
  prompt: Resolve exact source-neutral family groundings for the curated DUBm protein
    constituents.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#ubp8_dubm_subunit
  - components#sgf11_dubm_subunit
  - components#sus1_dubm_subunit
  - components#sgf73_dubm_anchor_subunit
  rationale: Ubp8, Sgf11, Sus1, and Sgf73 are shared between SAGA and SLIK and have
    metazoan homologues or domain-level identifiers; curate InterPro, Pfam, NCBIfam
    or UniProt family accessions only when they denote the DUBm component class rather
    than a broader domain.
  evidence:
  - reference: DOI:10.1038/s41586-020-1933-5
    notes: Wang et al. 2020 resolved the Saccharomyces cerevisiae SAGA DUB-module
      architecture.
  - reference: DOI:10.1016/j.jbc.2021.100671
    notes: Adamus et al. 2021 detected the same four DUBm proteins in purified Saccharomyces
      cerevisiae SLIK.
  posed_by: codex
  posed_date: '2026-09-30'
- discussion_id: dubm_boundaries
  prompt: Keep DUBm distinct from whole SAGA-family complexes and from HAT or core
    modules.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  - components#ubp8_dubm_subunit
  - components#sgf11_dubm_subunit
  - components#sus1_dubm_subunit
  - components#sgf73_dubm_anchor_subunit
  rationale: GO:0071819 denotes the Ubp8/Sgf11/Sus1/Sgf73 deubiquitinase module, while
    GO:0000124 and GO:0046695 denote whole SAGA-family transcriptional coactivator
    complexes that also contain core, Tra1, and HAT-module constituents.
  resolution_note: Curated the four DUB-module proteins on the DUBm record and linked
    the module to SAGA-family parent complexes via part_of.
  evidence:
  - reference: GO:0071819
    notes: GO:0071819 identifies the DUBm complex.
  - reference: GO:0000124
    notes: GO:0000124 identifies the whole SAGA complex.
  - reference: GO:0046695
    notes: GO:0046695 identifies the whole SLIK SAGA-like complex.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
