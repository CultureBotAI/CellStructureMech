    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: mic19
    predicate: directly binds
    object: mic60
    description: The Mic19 CHCH region binds the Mic60 mitofilin region.
    evidence:
    - reference: DOI:10.1038/ncomms15258
      notes: Isothermal titration calorimetry and domain deletions establish direct
        binding; isolated Mic19 coiled-coil region does not bind Mic60.
    - reference: DOI:10.1126/sciadv.abo4946
      notes: Fusion-domain crystal structures and binding-interface substitutions
        resolve the heteromeric contact.
  - subject: mic60
    predicate: recruits Mic19 into
    object: lipid_bound_complex
    description: Mic60 lipid binding recruits Mic19 into a liposome-associated assembly.
    evidence:
    - reference: DOI:10.1038/ncomms15258
      notes: Liposome co-sedimentation detects Mic19 in the presence of Mic60; Mic19
        alone does not bind the tested membranes.
  - subject: mic19
    predicate: promotes
    object: higher_order_assembly
    description: Mic19 binding promotes higher-order assembly of purified soluble
      Mic60.
    evidence:
    - reference: DOI:10.1126/sciadv.abo4946
      notes: Hydrodynamic and cross-linking experiments support Mic19-induced oligomerization,
        with an inferred tetrameric Mic60 arrangement rather than a universal native
        copy count.
  - subject: mic60
    predicate: drives
    object: membrane_tubulation
    description: The soluble Mic60 region binds and deforms model lipid membranes
      through its lipid-binding regions.
    evidence:
    - reference: DOI:10.1038/ncomms15258
      notes: Electron microscopy shows tubulation with purified Mic60; deletion of
        the amphipathic LBS1 region abolishes lipid binding and remodeling.
  - subject: lipid_bound_complex
    predicate: enhances
    object: membrane_tubulation
    description: Adding full Mic19 increases Mic60-dependent liposome tubulation and
      branching relative to Mic60 alone.
    evidence:
    - reference: DOI:10.1038/ncomms15258
      notes: Figure 3 reconstitution assays compare Mic60 alone with full Mic19 and
        Mic19 domain constructs. Full Mic19 stimulates membrane deformation; its domains
        have different effects on dye leakage.
discussions:
- discussion_id: mic19_family_grounding
  prompt: Establish an exact taxon-agnostic Mic19 family grounding without treating
    DUF1690 membership as identity.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#mic19
  rationale: Reviewed yeast Mic19 cross-references a fungal DUF family, but the current
    family description does not establish equivalence to the complete Mic19 component
    class. CHCH-domain membership alone is also insufficient.
  evidence:
  - reference: InterPro:IPR012471
    notes: The current InterPro family label is Protein of unknown function DUF1690
      and its description names uncharacterized fungal proteins.
  - reference: DOI:10.1038/ncomms15258
    notes: Direct experiments establish the Mic19 component independently of a database
      family assignment.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: native_architecture_scope
  prompt: Determine the native microbial complex architecture and copy number, and
    directly test the proposed crista-junction strut and diffusion-barrier functions.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#mic60_mic19_membrane_remodeling
  rationale: The 2022 structural model combines isolated fungal domains and engineered
    fusion constructs. The authors explicitly leave the molecular identity of yeast
    junction-spanning tomographic densities unresolved. Purified-protein oligomerization
    does not prove one universal native 4:4 assembly.
  evidence:
  - reference: DOI:10.1126/sciadv.abo4946
    notes: Discussion and Figure 5 present an architectural model and testable barrier/strut
      hypotheses, not direct molecular identification of a native junction-spanning
      complex.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: micos_and_recombinant_boundaries
  prompt: Keep the Mic60-Mic19 subcomplex distinct from full MICOS, MIB and experimental
    expression hosts.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: Other MICOS subunits and outer-membrane partners occur in the surrounding
    machinery but are not constituent identities of this two-component subcomplex.
    Expression in Escherichia coli does not make the complex a bacterial structure.
  resolution_note: Only Mic60 and Mic19 are components; MICOS is linked by part_of.
    Yeast YPH499 derivatives provide the canonical in vivo example. S288c accessions
    used for family lookup are not added as strain-matched protein examples, and recombinant
    fusion constructs are not treated as native stoichiometry.
  evidence:
  - reference: DOI:10.1038/ncomms15258
    notes: Methods distinguish fungal protein sequences, bacterial expression hosts,
      and YPH499-derived yeast experiments.
  - reference: DOI:10.1126/sciadv.abo4946
    notes: Structural and yeast experiments address the named Mic60-Mic19 subcomplex
      within MICOS.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
