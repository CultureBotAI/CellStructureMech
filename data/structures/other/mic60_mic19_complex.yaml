synonyms:
- synonym_text: Mic19-Mic60 subcomplex
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/ncomms15258
parent_structures:
- GO:0098800
part_of:
- GO:0061617
components:
- component_id: mic60
  label: MICOS complex subunit MIC60
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR019133
  gene_symbols:
  - MIC60
  role: Membrane-anchored scaffold whose intermembrane-space region binds Mic19 and
    lipids; its coiled-coil and mitofilin regions contribute oligomerization and membrane-remodeling
    interfaces.
  evidence:
  - reference: DOI:10.1038/ncomms15258
    notes: Purified Chaetomium thermophilum Mic60 soluble region binds and tubulates
      Folch liposomes and directly binds Mic19; lipid-binding-site mutations disrupt
      crista junctions in budding yeast.
  - reference: DOI:10.1126/sciadv.abo4946
    notes: Fungal domain structures and mutational analysis identify Mic60 oligomerization,
      Mic19-binding and lipid-binding interfaces. Crystal domain constructs are not
      a full native complex structure.
  - reference: InterPro:IPR019133
    notes: InterPro resolves this accession as a family named MICOS complex subunit
      MIC60, rather than a generic coiled-coil domain.
- component_id: mic19
  label: MICOS complex subunit Mic19
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The reviewed budding-yeast Mic19 protein maps to InterPro IPR012471
    and Pfam PF07956 (DUF1690). The issuing family description only establishes uncharacterized
    fungal proteins, not an exact source-neutral Mic19 family boundary. These are
    not asserted as exact groundings.
  gene_symbols:
  - MIC19
  role: CHCH-domain-containing binding partner that promotes Mic60 higher-order assembly
    and enhances membrane remodeling by the soluble Mic60 region in fungal reconstitution
    assays.
  evidence:
  - reference: DOI:10.1038/ncomms15258
    notes: Calorimetry establishes direct Mic19-Mic60 binding through the Mic19 CHCH
      region and Mic60 mitofilin region. Full Mic19 enhances Mic60-dependent liposome
      tubulation, branching and dye leakage; Mic19 alone does not bind or remodel
      these liposomes.
  - reference: DOI:10.1126/sciadv.abo4946
    notes: Mic19 promotes higher-order assembly of purified fungal Mic60; interface
      substitutions impair binding and budding-yeast crista-junction organization.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding-yeast mitochondrial MICOS contains the Mic60-Mic19 subcomplex; the
    cited experiments use YPH499 derivatives. This species-level assertion does not
    establish universal presence in fungi or every strain.
  reference: DOI:10.1126/sciadv.abo4946
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: YPH499-derived strains expressing Mic60 or Mic19 interface variants were examined
    by mitochondrial affinity purification and electron microscopy. These in vivo
    experiments are distinct from the purified Chaetomium thermophilum proteins used
    for membrane reconstitution.
  reference: DOI:10.1126/sciadv.abo4946
functions:
- function_id: cristae_formation
  label: cristae formation
  grounding: GO:0042407
  description: Supports formation and organization of mitochondrial crista junctions
    through cooperative Mic60-Mic19 assembly and membrane remodeling, within the larger
    MICOS machinery.
  evidence:
  - reference: DOI:10.1038/ncomms15258
    notes: Mic60 lipid-binding mutants in YPH499-derived yeast lose normal crista
      junctions and accumulate detached lamellar cristae; purified fungal Mic19 enhances
      Mic60-driven membrane deformation.
  - reference: DOI:10.1126/sciadv.abo4946
    notes: Mic60 oligomerization-interface and Mic60-Mic19 interaction-interface variants
      impair crista-junction formation in yeast. The complex is not asserted to be
      sufficient for native crista formation by itself.
evidence:
- reference: DOI:10.1038/ncomms15258
  notes: Hessenberger et al. (2017), Regulated membrane remodeling by Mic60 controls
    formation of mitochondrial crista junctions. Full Results, Discussion, methods
    and Figure 4 inspected in checksum-verified PMC5460017 version 1.
- reference: DOI:10.1126/sciadv.abo4946
  notes: Bock-Bierbaum et al. (2022), Structural insights into crista junction formation
    by the Mic60-Mic19 complex. Full Results, Discussion and relevant methods inspected
    in checksum-verified PMC9432830 version 1.
- reference: GO:0098800
  notes: The local complex is a type of inner mitochondrial membrane protein complex;
    this broader GO term is not its exact identity.
- reference: GO:0061617
  notes: MICOS is the containing complex, not an is-a parent or synonym of the two-component
    subcomplex.
causal_graphs:
- graph_id: mic60_mic19_membrane_remodeling
  title: Direct binding and cooperative membrane remodeling by fungal Mic60 and Mic19
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  description: Purified fungal proteins establish direct interaction, Mic60-dependent
    lipid recruitment, Mic19-enhanced oligomerization and membrane tubulation.
  scope_notes: Biochemical edges concern Chaetomium thermophilum Mic60 soluble region
    lacking its N-terminal transmembrane anchor and purified Mic19 in Folch liposome
    assays. They are not a reconstruction of native yeast MICOS, a physiological membrane-leakage
    claim, or proof of an in situ diffusion barrier. Higher-order assembly is supported,
    but universal 4:4 stoichiometry is not asserted.
