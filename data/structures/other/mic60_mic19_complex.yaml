identifier: cellstructuremech:mic60_mic19_complex
label: Mic60-Mic19 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heteromeric MICOS subcomplex composed of Mic60 and Mic19 that couples
  protein assembly to mitochondrial inner-membrane remodeling and crista-junction
  organization.
definition_source: DOI:10.1126/sciadv.abo4946
mapping_status: PROPOSED
