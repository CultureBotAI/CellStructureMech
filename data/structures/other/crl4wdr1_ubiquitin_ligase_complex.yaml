  description: Source-bounded protein and cellular readouts of a receptor-subunit
    intervention.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: Each edge starts at RNAi, not at an inferred intermediate. The 24-hour
    chase, immunoprecipitation and phosphostaining, 24/48-hour abundance measurements
    and 48-hour attachment phenotype remain distinct. No edge asserts direct substrate
    ubiquitination, a proteasomal reaction, obligatory assembly order or exclusive
    TbPLK mediation.
