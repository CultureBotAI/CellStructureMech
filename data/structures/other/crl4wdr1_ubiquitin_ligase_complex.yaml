identifier: cellstructuremech:crl4wdr1_ubiquitin_ligase_complex
label: CRL4WDR1 ubiquitin ligase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A WDR1-containing Cullin4-DDB1 protein complex characterized in procyclic
  Trypanosoma brucei. The named CRL4WDR1 association participates in regulation of
  TbPLK protein turnover; its complete catalytic composition and direct ubiquitination
  of TbPLK have not been established.
definition_source: DOI:10.1371/journal.ppat.1006146
mapping_status: PROPOSED
