  - subject: wdr1_rnai
    predicate: decreases abundance of
    object: wdr1
    description: WDR1 protein is depleted by the induced RNAi intervention.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1006146
      notes: Figures 4A and 6A monitor tagged WDR1 protein. Figure 6A includes 24-
        and 48-hour induction samples; this is protein depletion, not proof of complex
        disassembly.
  - subject: wdr1_rnai
    predicate: reduces
    object: tbplk_turnover
    description: TbPLK is lost more slowly during cycloheximide treatment after 24
      hours of RNAi.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1006146
      notes: 'Figure 6B-C: 0-6-hour chase, normalized to TbPSA6; three independent
