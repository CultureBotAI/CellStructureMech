        reaction.'
  - subject: wdr1_rnai
    predicate: increases
    object: tbplk_abundance
    description: TbPLK protein accumulates after 24 and 48 hours of WDR1 RNAi.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1006146
      notes: 'Figure 6A: anti-TbPLK immunoblot with TbPSA6 loading control; three
        repeats reported as similar.'
  - subject: wdr1_rnai
    predicate: decreases
    object: polyub_ip
    description: Less anti-ubiquitin signal is recovered in TbPLK immunoprecipitates
      after 24 hours of RNAi.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1006146
      notes: Figure 6D and accompanying Results explicitly warn that the detected
        polyubiquitinated proteins could include TbPLK or co-precipitated partners.
        No substrate identity is assigned.
  - subject: wdr1_rnai
    predicate: yields cells retaining
    object: late_ps54
    description: PS54 staining persists in 1N2K and 2N2K cells after 24 hours of RNAi.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1006146
      notes: 'Figure 7: PS54 detects phospho-Ser54 TbCentrin2, with 20H5 marking the
