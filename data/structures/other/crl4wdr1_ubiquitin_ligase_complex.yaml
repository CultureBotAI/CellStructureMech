discussions:
- discussion_id: exact_identity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate CRL4WDR1 from generic Cul4 and other DDB1 complexes.
  rationale: Shared cullin or receptor names do not establish equivalence.
  notes: Parsed identities and synonyms across 876 prior records and whole-repository
    hidden/ignored-inclusive name, locus, DOI, PMID and candidate identifier searches
    found no existing record; prior mentions concern the Cullin-E boundary. Native
    GO queries for CRL4WDR1 and WDR1 found no entry. GO:0080008 is the broader Cul4-RING
    parent; GO:0031464/0031465 denote A/B subclasses, GO:0043494 denotes CLRC, and
    GO:0070912/0070913 denote different transcription-coupled repair heterodimers.
    Exact Complex Portal name and locus queries found no entry. WDR1 hits there denote
    predicted human complexes, not this assembly.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
  - reference: GO:0080008
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: cullin_nomenclature
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the WDR1-specific assembly distinct from Cullin-E and broader Cullin-D
    isolates.
  rationale: A scaffold identity is not the identity of all its receptor-specific
    complexes.
  notes: The primary paper assigns WDR1 to TbCUL4/Tb927.3.1290 and reports no co-isolation
    with TbCUL1/Tb927.11.11430. The modern Table 1 calls these TbCul-D and TbCul-E
    respectively, despite its Discussion attributing the older PLK result to Cullin-E.
    Modern Cullin-D isolates contain DCAF proteins Tb927.11.3190 and Tb927.8.840 and
    Rbx1/Tb927.10.1810; they do not establish those as members of CRL4WDR1. Neither
    a Cul4A versus Cul4B assignment nor generic Cullin-D nuclear localization is imposed
    on this receptor-specific record.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
  - reference: DOI:10.1038/s41598-025-32077-9
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
