components:
- component_id: cullin4
  label: Cullin4 scaffold subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - CUL4
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro Cullin4 and Cullin-D text searches returned no
    entry. The verified reference protein Q57XW2 maps to the broader Cullin family
    IPR045093 and shared domains, not an exact Cullin4 family established here. Its
    putative Cullin4B name is not used to assert A/B orthology.
  role: Defining cullin scaffold co-isolated with WDR1 and DDB1; direct contacts and
    copy number are unresolved.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
    notes: Figure 3B-D and the complex-identification Results identify TbCUL4 as Tb927.3.1290.
      WDR1 immunoprecipitation from a cell line with endogenously tagged WDR1, TbCUL4
      and TbDDB1 recovers both partners. Other tested cullins, including TbCUL1/Tb927.11.11430,
      did not co-precipitate WDR1 in that assay.
- component_id: ddb1
  label: DDB1 adaptor subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - DDB1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro DDB1 search and the verified reference protein
    Q586I3 resolve the broader RSE1/DDB1/CPSF1 family IPR050358 and shared propeller
    domains. None is an exact DDB1-only family mapping established by this review.
  role: Adaptor co-isolated with WDR1; a WDR1 N-terminal fragment retrieves DDB1 from
    cell lysate.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
    notes: Figure 3C-E identifies TbDDB1 as Tb927.6.5110. The WDR1 1-300 amino-acid
      GST fusion pulls down tagged DDB1 from trypanosome lysate; this is not a binding
      experiment with two purified partners.
- component_id: wdr1
  label: WDR1 substrate-recognition subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - WDR1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro WDR1 search returned WDR11/12/18/19 entries, not
    an exact family for this receptor. WD40 repeats and a PDZ domain are not equivalent
    to the entire WDR1 class. Complex Portal WDR1 hits were predicted human complexes
    rather than this trypanosome assembly.
  role: Receptor-class constituent that associates with DDB1 through its N-terminal
    region and recognizes TbPLK through C-terminal fragments. Its depletion slows
    TbPLK turnover.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
    notes: Results and Figures 2-3 identify WDR1 as Tb927.10.15080. Directional yeast
      two-hybrid and GST/lysate pull-down support TbPLK recognition by C-terminal
      fragments; the PDZ domain alone is insufficient and is not required. Deleting
      the TbPLK PEST motif disrupts fragment-mediated association. Full-length WDR1
      was not tested in yeast because cloning failed. Growth defects after RNAi do
      not establish essentiality for complex assembly.
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: 'The paper studies procyclic cells: strain 29-13 for inducible RNAi and Lister
    427 for endogenous tagging, with tagging also performed in RNAi lines. Two nonoverlapping
    WDR1 RNAi fragments and two clones per fragment were tested; the paper presents
    one representative clone after reporting similar phenotypes. The 927 locus identifiers
    are reference annotations, not the cultured strain. Yeast two-hybrid hosts and
    recombinant E. coli expression hosts are not canonical organisms for this complex.'
  reference: DOI:10.1371/journal.ppat.1006146
functions:
- function_id: tbplk_turnover
  label: regulation of TbPLK protein turnover
  description: WDR1 depletion slows the loss of TbPLK during a cycloheximide chase
    and increases its abundance in procyclic T. brucei. This supports a turnover-regulatory
    role for the named association, but does not establish direct covalent ubiquitination
    of TbPLK by a purified complex.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
    notes: 'Figure 6A-C measures abundance at 24/48 hours of RNAi and a 0-6-hour chase
      after 24 hours of induction. Figure 6D detects less polyubiquitinated material
      in TbPLK immunoprecipitates, but the Results explicitly leave its identity unresolved:
      TbPLK itself and/or associated proteins.'
- function_id: organelle_inheritance
  label: support of bilobe duplication and flagellum attachment
  description: WDR1 RNAi impairs bilobe duplication, basal-body segregation and new
    flagellum-attachment-zone assembly, with detached flagella at 48 hours. These
    are perturbation-supported cellular outputs, not proof that every phenotype is
    mediated exclusively by direct TbPLK ubiquitination.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
    notes: Figures 4-5 show basal-body, bilobe, FAZ and attachment phenotypes after
      48 hours of WDR1 RNAi. Figure 7 shows persistent phospho-Ser54 TbCentrin2 staining
      in late-cycle cells at 24 hours. TbPLK overexpression in S4 Figure phenocopies
      several effects, but is not a rescue or an epistasis test.
evidence:
- reference: DOI:10.1371/journal.ppat.1006146
  notes: Hu, Zhou, Han and Li; PMID:28052114. Current PMC5241021.1 JATS identity,
    license and checksum verified. Complex-identification, depletion, turnover and
    overexpression Results, Discussion and relevant Methods inspected. Native Figures
    2, 3 and 6 were visually inspected with media checksums verified. Supports the
    named association and measured intervention outputs; the Figure 8 causal model
    exceeds the direct biochemical resolution.
- reference: DOI:10.1038/s41598-025-32077-9
  notes: PMID:41413177; Table 1 maps the same Tb927.3.1290 scaffold to TbCul-D, not
    TbCul-E. The newer scaffold-isolation study identifies additional DCAF proteins
    and Rbx1, without resolving their membership in the WDR1-specific assembly. Used
    for nomenclature and boundary comparison only.
causal_graphs:
