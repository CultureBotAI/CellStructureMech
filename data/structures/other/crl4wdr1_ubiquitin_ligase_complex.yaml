- discussion_id: client_and_marker_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not convert captured client proteins or experimental markers into obligatory
    constituents.
  rationale: Co-isolation and downstream readouts have different biological roles.
  notes: TbPLK is recovered with the three tagged core proteins in Figure 3D, but
    the source interprets it as a recognized client. It is not asserted to be an invariant
    structural subunit. TbCentrin2, TbCentrin4, FAZ1, TbPSA6, antibodies, recombinant-expression
    hosts and APC/C are not constituents. Cdc27/APC/C depletion also affects TbPLK
    turnover, so CRL4WDR1 is not claimed as the sole pathway. Rbx1 and other DCAFs
    from broader Cullin-D isolates are excluded pending receptor-specific membership
    evidence.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
  - reference: DOI:10.1038/s41598-025-32077-9
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: catalytic_resolution
  kind: CURATION_TODO
  status: OPEN
  prompt: Establish the complete catalytic assembly and direct covalent substrate
    reaction.
  rationale: Co-immunoprecipitation and chase data do not identify all catalytic subunits
    or ubiquitinated proteins.
  notes: The 2017 paper does not experimentally identify a RING subunit within the
    WDR1-specific assembly, resolve fixed stoichiometry or show purified CRL4WDR1
    ubiquitinating TbPLK. Figure 6D leaves the polyubiquitinated species unresolved.
    Figure 8 is a model, not proof of the entire ubiquitination, turnover, phosphorylation
    and FAZ chain. TbPLK overexpression phenocopy does not establish exclusive mediation.
    Subunit assembly essentiality, physical dimensions and broad clade distribution
    remain unset.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1006146
  posed_by: codex
  posed_date: '2026-10-04'
  attaches_to:
  - functions#tbplk_turnover
  - causal_graphs#wdr1_depletion_outputs
