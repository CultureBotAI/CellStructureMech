      in MIMAS.'
  grounding: InterPro:IPR002113
- component_id: rcf1
  label: Mitochondrial Respiratory Supercomplex Factor 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - RCF1
  essentiality: UNKNOWN
  role: Respiratory assembly factor with MIMAS-associated and respiratory-chain pools.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
    notes: 'Figures 1A-B, 2F and 4G: Rcf1 co-migrates and co-isolates with MIMAS.
      R67A reduces its MIMAS association, whereas Q61A/Q71A increases it, in the tested
      rcf1/rcf2 deletion background. This does not establish fixed occupancy.'
  grounding: InterPro:IPR050355
- component_id: psd1
  label: Phosphatidylserine decarboxylase, eukaryotic type 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - PSD1
  essentiality: UNKNOWN
  role: Phosphatidylethanolamine-producing constituent used to isolate intact MIMAS.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
    notes: 'Figures 2E-H and 3F-G: Psd1 is incorporated into MIMAS. Active Psd1, but
      not S463A, restores MIMAS integrity in psd1-null cells, although S463A can join
      MIMAS in wild-type mitochondria. Catalytic competence and physical incorporation
      are distinct; complete assembly essentiality is not assigned from destabilization.'
  grounding: InterPro:IPR033661
- component_id: nde1
  label: external mitochondrial NADH dehydrogenase
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - NDE1
  essentiality: UNKNOWN
  role: Intermembrane-space-facing dehydrogenase represented by the MIMAS-associated
    Nde1 pool.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
    notes: 'Figure 2A-C,F-G,I-J: Nde1 co-migrates and co-isolates with MIMAS; crosslinking
      in intact mitochondria followed by denaturing affinity isolation supports proximity
      to AAC. The matrix-facing Ndi1 has a different profile.'
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro search did not resolve an external-specific family.
    The verified Nde1 reference protein maps to IPR045024, Alternative NADH dehydrogenase,
    which also includes internal Ndi1 and bacterial proteins. That broader family
    is not substituted for this external mitochondrial class.
- component_id: tafazzin
  label: Tafazzin
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - TAZ1
  essentiality: UNKNOWN
  role: Phospholipid-remodeling enzyme with a MIMAS-associated population.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
    notes: 'Figure 2D-F: Taz1 migrates in the MIMAS range and is recovered with Psd1.
      Its membership does not prove that cardiolipin remodeling is locally coupled
      to transport or respiratory-chain assembly.'
  grounding: InterPro:IPR000872
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: The primary study uses YPH499- or W303-1A-derived strains and isolated mitochondria.
    Culture conditions vary by experiment. Methods identify a Neurospora crassa AAC
    construct for import assays, despite Figure 1F naming Aac2; this heterologous
    precursor does not establish a second canonical organism. Endogenous yeast AAC
    membership has separate complexome and biochemical support.
  reference: DOI:10.1016/j.celrep.2024.113772
functions:
- function_id: respiratory_biogenesis_platform
  label: platform for respiratory-chain subunit biogenesis
  description: MIMAS groups respiratory biogenesis factors and transiently accommodates
    imported Cox13. Its role as a platform preceding incorporation into complex IV
    is an interpretation of import/chase and Rcf1-association experiments, not direct
    tracking of transfer between complexes or an obligatory route for all respiratory
    subunits.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
    notes: 'Figure 4D-G: precursor import/chase distinguishes transient Cox13 association
      from mature respiratory complexes. Rcf1 point mutants shift its distribution.
      The source presents broader metabolic integration as a model.'
