- discussion_id: functional_limits
  kind: CURATION_TODO
  status: OPEN
  prompt: Test local metabolic coupling and lipid organization.
  rationale: Proximity and enzyme membership do not establish metabolite channeling.
  notes: The primary study and 2026 review leave exact stoichiometry, spatial arrangement,
    local PE composition, metabolite channeling and collective regulation unresolved.
    The short graph records Psd1-dependent integrity only. It does not assert that
    MIMAS is required for every activity of its proteins, that PE binds a specific
    site, or that cardiolipin has no role in every condition.
  evidence:
