  essentiality: UNKNOWN
  role: Metabolite carrier represented by the MIMAS-associated pool of Aac2.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
    notes: 'Figures 1B and 2G-J: complexome migration, enrichment in intact Psd1-isolated
