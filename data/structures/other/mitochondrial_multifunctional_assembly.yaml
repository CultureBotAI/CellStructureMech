causal_graphs:
- graph_id: pe_dependent_integrity
  title: Psd1 activity supports MIMAS integrity
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: A bounded enzyme-product-stability mechanism. Genetic rescue supports
    PE dependence, not a resolved lipid-binding site, local PE concentration or complete
    assembly order. No extra edges are inferred from co-migration.
  nodes:
  - node_id: psd1
    label: Phosphatidylserine decarboxylase, eukaryotic type 1
    node_type: GENE_OR_PROTEIN
    component_ref: psd1
    grounding: InterPro:IPR033661
  - node_id: pe_production
    label: Psd1-dependent phosphatidylethanolamine production
    node_type: BIOLOGICAL_PROCESS
  - node_id: mimas_integrity
    label: MIMAS integrity
    node_type: STATE
    description: Preservation of the high-molecular-mass assembly in the native-gel
      assays.
  edges:
  - subject: psd1
    predicate: catalyzes
    object: pe_production
    description: Psd1 converts phosphatidylserine into phosphatidylethanolamine.
    evidence:
    - reference: DOI:10.1016/j.celrep.2024.113772
      notes: Results on phospholipid biosynthesis and Figure 3 distinguish active
        Psd1 from its catalytically inactive S463A variant.
  - subject: pe_production
    predicate: supports
    object: mimas_integrity
    description: Psd1-dependent PE production supports stability of the assembly.
    evidence:
    - reference: DOI:10.1016/j.celrep.2024.113772
      notes: 'Figure 3B-G: psd1 deletion destabilizes MIMAS, whereas crd1 deletion
        does not show the same effect. Active Psd1 rescues the psd1-null defect, while
        S463A does not despite incorporation in wild-type mitochondria. PE dependence
        is the authors'' mechanistic inference from these experiments, not direct
        measurement of a lipid-protein contact.'
discussions:
- discussion_id: exact_identity
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Distinguish MIMAS from other mitochondrial assemblies.
  rationale: Similar mitochondrial-complex names do not establish equivalent identity.
  notes: Parsed identities and synonyms across 877 prior records and hidden/ignored-inclusive
    whole-repository searches found no MIMAS record or prior primary citation. Native
    GO MIMAS search returned no entry; the complete multifunctional result contained
    two molecular-function terms, not a cellular component. Complex Portal exact-name
    searches returned no entry. GO:0098800 is an is-a parent; GO:0005743 is the containing
    membrane. INAC, MICOS, SAM and MIB denote different assemblies. MIMAS-A and MIMAS-B
    are migration populations, not separately resolved organelles.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
  - reference: DOI:10.1002/pro.70653
  - reference: GO:0098800
  - reference: GO:0005743
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: composition_and_architecture
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve complete membership and architecture.
  rationale: The first record represents experimentally supported classes, not an
    exhaustive stoichiometry.
  notes: Five classes are curated here. Additional carriers, dehydrogenases, lipid
    enzymes and respiratory biogenesis factors described in the paper remain candidates
    for claim-by-claim expansion. Psd1 enrichment and complexome correlation alone
    do not make every hit an invariant subunit. MIMAS-A and MIMAS-B migrate at apparent
    masses near 3.3 and 2.5 MDa; these are not exact particle masses or copy counts.
    Obtain resolved architecture and appropriately licensed imaging before adding
    dimensions or a structural image. Primary gels are not hosted under NC-ND terms.
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: client_and_complex_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep transient clients and neighboring complexes separate.
  rationale: A transient assembly intermediate is not mature constituent membership.
  notes: 'Cox13 is excluded as a stable constituent: its imported precursor visits
    MIMAS, whereas mature Cox13 occupies respiratory complexes. Mature respiratory
    supercomplexes, ATP synthase, prohibitins and matrix-facing Ndi1 have distinct
    profiles. No part_of relation to MICOS, SAM, MIB or respiratory supercomplexes
    is inferred. No entire-family membership follows from a shared InterPro family.'
  evidence:
  - reference: DOI:10.1016/j.celrep.2024.113772
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: families_and_strains
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve external dehydrogenase grounding and studied-strain examples.
  rationale: Reference-proteome annotations do not identify every experimentally used
    allele.
  notes: Native UniProt and InterPro records support the four asserted family mappings.
    Nde1 maps to the broader IPR045024, so its external-specific class stays label-only.
    Verified S288c references P18239, Q03713, P39006, P40215 and Q06510 are not substituted
    for the studied YPH499/W303-derived strains in protein_examples. The iModulonDB
    adapter listed 28 datasets without a matching yeast organism; not applicable,
    not negative evidence. Clade-wide distribution remains unset.
  evidence:
