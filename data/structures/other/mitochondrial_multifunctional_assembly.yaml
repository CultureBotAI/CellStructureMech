identifier: cellstructuremech:mitochondrial_multifunctional_assembly
label: mitochondrial multifunctional assembly
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A biochemically isolatable protein-lipid assembly of the mitochondrial
  inner membrane characterized in Saccharomyces cerevisiae. MIMAS brings together
  metabolite carriers, dehydrogenases, respiratory-chain biogenesis factors and phospholipid
  enzymes, with stability dependent on phosphatidylethanolamine production.
definition_source: DOI:10.1016/j.celrep.2024.113772
mapping_status: PROPOSED
