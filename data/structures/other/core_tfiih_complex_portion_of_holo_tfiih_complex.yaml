- discussion_id: core_tfiih_holo_boundaries
  prompt: Keep the GO:0000438 portion term distinct from both generic TFIIH core and
    whole holo TFIIH.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - part_of
  - components#ssl2_xpb_tfiih_core_subunit
  - components#tfb1_p62_tfiih_core_subunit
  - components#tfb2_p52_tfiih_core_subunit
  - components#ssl1_p44_tfiih_core_subunit
  - components#tfb4_p34_tfiih_core_subunit
  - components#tfb5_p8_tfiih_core_subunit
  - components#rad3_xpd_tfiih_core_subunit
  rationale: GO:0000438 denotes the GO:0000439 TFIIH core complex specifically when
    it is part of the GO:0005675 holo-TFIIH complex. TFIIK is a partner subcomplex
    of whole holo TFIIH, not part of the TFIIH core portion itself.
  resolution_note: Modeled GO:0000439 as an is-a parent, linked GO:0005675 through
    part_of, and curated only the seven TFIIH core constituents as components of this
    portion.
  evidence:
  - reference: GO:0000438
    notes: GO:0000438 identifies the TFIIH core complex portion when it is part of
      holo TFIIH.
  - reference: GO:0000439
    notes: GO:0000439 identifies the broader TFIIH core complex.
  - reference: GO:0005675
    notes: GO:0005675 identifies whole holo TFIIH as containing core TFIIH plus TFIIK.
  posed_by: codex
  posed_date: '2026-10-01'
  resolved_date: '2026-10-01'
