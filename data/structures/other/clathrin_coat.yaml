components:
- component_id: clathrin_triskelion_scaffold
  label: clathrin triskelion scaffold
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Polymerized three-legged clathrin heavy-chain and light-chain complexes that
    build the clathrin coat lattice.
  evidence:
  - reference: GO:0030118
    notes: GO:0030118 defines clathrin coats as membrane coats made from polymerized
      clathrin triskelions.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The triskelion is represented at the source-neutral protein-complex
    level; no exact Complex Portal, GO, InterPro, Pfam, or NCBIfam CURIE was curated
    in this pass.
- component_id: ap_type_clathrin_adaptors
  label: AP-type clathrin adaptor complexes
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Adaptor complexes that connect polymerized clathrin to membrane surfaces and
    cargo during clathrin-coat assembly.
  evidence:
  - reference: GO:0030118
    notes: GO:0030118 frames clathrin coats as clathrin triskelions linked to membranes
      through AP adaptor complexes.
  - reference: GO:0030119
    notes: GO:0030119 defines AP-type membrane coat adaptor complexes as membrane-coat
      complexes that link clathrin or another coat-forming molecule to a membrane
      surface.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: AP-type clathrin adaptors span subtype-specific adaptor complexes
    and related membrane/cargo linkers; this parent record keeps them broad until
    exact family or complex boundaries are curated for each coat subtype.
