identifier: GO:0030118
label: clathrin coat
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A membrane coat found on coated pits and some coated vesicles; consists
  of polymerized clathrin triskelions, each comprising three clathrin heavy chains
  and three clathrin light chains, linked to the membrane via one of the AP adaptor
  complexes.
