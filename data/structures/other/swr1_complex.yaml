causal_graphs:
- graph_id: yeast_swr1_h2az_exchange
  title: SWR-C carries yeast ATP-dependent H2AZ exchange
  description: In Saccharomyces cerevisiae, Swr1, Swc2, Bdf1, Swc3, Arp6, Swc5, Yaf9,
    Swc6, Swc7, Rvb1, Rvb2, Arp4, Swc4 and Act1 form the SWR-C chromatin-remodeling
    complex.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the fourteen SWR-C constituent classes and their
    connection to ATP-dependent H2AZ exchange without resolving the ordered subunit-assembly
    pathway or nucleosome substrate-engagement cycle.
