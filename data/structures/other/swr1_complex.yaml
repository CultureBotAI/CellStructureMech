  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding yeast is the organism in which GO:0000812 defines the Swr1 complex
    as an H2AZ-depositing chromatin remodeling complex.
  reference: GO:0000812
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Mizuguchi et al. 2004 purified the budding-yeast SWR1 complex and showed that
    it catalyzes ATP-dependent exchange of nucleosomal H2A-H2B for H2AZ-H2B dimers.
  reference: DOI:10.1126/science.1090701
functions:
- function_id: h2az_histone_chaperone_activity
  label: ATP-dependent H2AZ histone chaperone activity
  grounding: GO:0140849
  description: The SWR1 complex catalyzes ATP-dependent replacement of canonical H2A-H2B
    dimers with H2AZ-H2B dimers in nucleosomes.
  evidence:
  - reference: GO:0140849
    notes: GO:0140849 is the Gene Ontology molecular-function term for ATP-dependent
      H2AZ histone chaperone activity.
  - reference: DOI:10.1126/science.1090701
    notes: Mizuguchi et al. 2004 biochemically characterized ATP-driven H2AZ exchange
      by the budding-yeast SWR1 complex.
- function_id: chromatin_remodeling
  label: chromatin remodeling
  grounding: GO:0006338
  description: The Swr1 complex is an INO80-type chromatin-remodeling complex that
    deposits H2AZ into chromatin.
  evidence:
  - reference: GO:0006338
    notes: GO:0006338 is the Gene Ontology biological-process term for chromatin remodeling.
  - reference: GO:0000812
    notes: GO:0000812 defines the Swr1 complex as a multisubunit protein complex involved
      in chromatin remodeling.
