identifier: GO:0000812
label: Swr1 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multisubunit protein complex that is involved in chromatin remodeling.
  It is required for the incorporation of the histone variant H2AZ into chromatin.
  In S. cerevisiae, the complex contains Swr1p, a Swi2/Snf2-related ATPase, and 12
  additional subunits.
