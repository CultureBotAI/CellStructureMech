    source-neutral InterPro, Pfam, NCBIfam or UniProt family identifier for this SAS-I
    catalytic subunit class was curated in this pass.
  role: MYST-family histone acetyltransferase catalytic constituent of the budding-yeast
    SAS-I complex.
  evidence:
  - reference: GO:0033255
    notes: GO:0033255 defines the Saccharomyces SAS acetyltransferase complex as containing
      catalytic Sas2p.
  - reference: DOI:10.1101/gad.929001
    notes: Meijsing and Ehrenhofer-Murray 2001 found Sas2 in a nuclear protein complex
      with Sas4 and Sas5 and termed the complex SAS-I.
  - reference: DOI:10.1074/jbc.M210709200
    notes: Sutton et al. 2003 reconstituted the SAS complex and showed that Sas2-dependent
      histone acetyltransferase activity requires Sas4 and is stimulated by Sas5.
