identifier: GO:0071203
label: WASH complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that localizes at the surface of endosomes, where it
  recruits and activates the Arp2/3 complex to induce actin polymerization. In human,
  the WASH complex is composed of F-actin-capping protein subunits alpha and beta,
  WASH1, FAM21, KIAA1033, KIAA0196 and CCDC53.
