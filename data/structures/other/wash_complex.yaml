causal_graphs:
- graph_id: human_wash_endosomal_arp23_activation
  title: WASH activates Arp2/3-mediated endosomal actin assembly
  description: In human cells, WASH-complex subunits assemble a WASH complex that
    localizes to endosomes and activates the Arp2/3 complex to drive actin filament
    polymerization.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures WASH-complex membership and the endosomal Arp2/3
    activation relationship without modeling WASH tail-domain autoinhibition, retromer
    or dynactin recruitment, or dynamin-driven membrane fission.
