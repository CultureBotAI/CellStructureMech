functions:
- function_id: endosomal_actin_filament_polymerization
  label: actin filament polymerization
  grounding: GO:0030041
  description: WASH localizes the WASH complex to endosomes, where the complex activates
    Arp2/3-mediated actin nucleation.
  evidence:
  - reference: GO:0030041
    notes: GO:0030041 denotes assembly of actin filaments by addition of actin monomers
      to a filament.
  - reference: DOI:10.1016/j.devcel.2009.09.010
    notes: Derivery et al. 2009 found that purified human WASH complex activates Arp2/3-mediated
      actin nucleation.
