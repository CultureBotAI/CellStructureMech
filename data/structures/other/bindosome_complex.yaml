functions:
- function_id: surface_sugar_binding_protein_organization
  label: cell-surface sugar-binding protein organization
  description: The bindosome organizes archaeal sugar-binding proteins at the cell
    surface for sugar uptake through cognate membrane ABC transporters.
  evidence:
  - reference: GO:7770042
    notes: GO:7770042 describes the bindosome as facilitating the interaction between
      solute-binding proteins and ABC transporters during sugar uptake.
  - reference: DOI:10.1007/s00792-010-0353-0
    notes: Zolghadr et al. 2011 connected Bas-dependent surface localization of sugar-binding-protein
      complexes with glucose uptake in S. solfataricus.
