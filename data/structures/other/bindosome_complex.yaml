discussions:
- discussion_id: exclude_bas_assembly_machinery
  prompt: Should BasEF or BasABC be curated as constituents of the mature bindosome
    complex?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#sugar_binding_proteins
  rationale: GO:7770042 identifies the bindosome as the assembled sugar-binding-protein
    complex. Zolghadr et al. showed that BasEF and BasABC are type-IV-pilin-like machinery
    required for functional surface localization of the sugar-binding proteins; BasEF
    was not required for formation of the extracted 400 and 600 kDa complexes themselves.
    The Bas system was therefore left out of the mature bindosome component list.
  evidence:
  - reference: DOI:10.1007/s00792-010-0353-0
    notes: The study separated the BasEF membrane complex from the high-molecular-mass
      sugar-binding-protein complexes.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: resolve_s_layer_constituent_boundary
  prompt: Resolve whether SlaA or other S-layer material should be modeled as a bindosome
    constituent or as a neighboring envelope scaffold.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#sugar_binding_proteins
  rationale: The 600 kDa S. solfataricus sugar-binding-protein complex co-purified
    with the main S-layer protein SlaA, whereas the 400 kDa complex contained GlcS
    and SSO3043 and the GO definition keeps the bindosome scoped to sugar-binding
    proteins. This pass therefore records the S-layer association without making SlaA
    a source-neutral bindosome subunit.
  evidence:
  - reference: DOI:10.1007/s00792-010-0353-0
    notes: Zolghadr et al. found SlaA in the larger extracted complex and interpreted
      the sugar-binding complexes as S-layer associated.
  - reference: GO:7770042
  posed_by: codex
  posed_date: '2026-10-03'
