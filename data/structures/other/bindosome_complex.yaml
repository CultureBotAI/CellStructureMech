identifier: GO:7770042
label: bindosome complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A membrane-associated protein complex found in archaea that consists of
  sugar binding proteins assembled via a type IV pilin-like assembly system. The complex
  is located at the cell surface and functions in sugar uptake by facilitating the
  interaction between solute binding proteins and ABC transporters. The complex forms
  high molecular mass structures (400-600 kDa) that are integrated within or closely
  associated with the S-layer.
