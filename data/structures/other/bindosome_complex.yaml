  role: Cell-surface solute-binding proteins assembled into high-molecular-mass complexes
    that position captured sugars near membrane ABC importers.
  evidence:
  - reference: GO:7770042
    notes: GO:7770042 defines the bindosome complex as an archaeal membrane-associated
      complex consisting of sugar-binding proteins.
  - reference: DOI:10.1007/s00792-010-0353-0
    notes: Zolghadr et al. 2011 extracted 400 and 600 kDa sugar-binding-protein complexes
      from the Sulfolobus solfataricus cell surface.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam, NCBIfam, or UniProtKB family
    CURIE was curated for the combined archaeal cell-surface sugar-binding-protein
    class. GlcS and AraS have direct sugar-binding assignments in S. solfataricus;
    Zolghadr et al. 2011 also detected SSO3043 and SSO1273 putative solute-binding
    proteins in extracted high-molecular-mass complexes without resolving their exact
    substrates.
