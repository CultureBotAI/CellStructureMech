identifier: GO:0000781
label: chromosome, telomeric region
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: The terminal region of a linear chromosome that includes the telomeric
  DNA repeats and associated proteins, required for replication and stability of the
  chromosome end. In Saccharomyces cerevisiae, Schizosaccharomyces pombe, and other
  microbial eukaryotes, the chromosome, telomeric region comprises terminal telomeric
  DNA repeats bound by sequence-specific duplex repeat-binding and telomere-associated
  proteins (such as Rap1 and Taz1) that form a protective nucleoprotein cap at chromosome
  ends and mediate telomere organization.
