causal_graphs:
- graph_id: chromosome_telomeric_region_mechanism
  title: Telomeric DNA repeat recognition and nucleoprotein assembly of the chromosome,
    telomeric region
  description: Terminal telomeric repeat DNA (SO:0000624) recruits duplex telomere-binding
    protein Taz1 in Schizosaccharomyces pombe and TE2IP/Rap1 (directly in Saccharomyces
    cerevisiae and via Taz1 in S. pombe) to assemble the chromosome, telomeric region
    (GO:0000781) and mediate telomere organization (GO:0032200).
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Covers the conserved core telomeric DNA-protein cap in S. cerevisiae
    (Rap1-bound TG1-3 repeats) and S. pombe (Taz1-Rap1-bound terminal repeats), distinct
    from transient meiotic nuclear-envelope bouquet tethering complexes.
