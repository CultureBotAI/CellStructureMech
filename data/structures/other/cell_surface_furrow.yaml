identifier: GO:0097610
label: cell surface furrow
structure_category: OTHER
structure_kind: SUBCELLULAR_REGION
definition: A furrow that may be found on the cell surface. Examples include the cingulum
  and sulcus found in some dinoflagellates. A persistent invaginated groove or trench
  in the cortical cell surface of single-celled microbial eukaryotes—including the
  equatorial cingulum and ventral sulcus furrows of dinoflagellates, as well as the
  ventral feeding/flagellar grooves of excavates, cryptophytes, and euglenids. Supported
  by underlying cortical alveoli, epiplastids, and microtubular ribbons, the cell
  surface furrow channels flagellar beating waves and directs hydrodynamic flow for
  propulsion and prey capture.
