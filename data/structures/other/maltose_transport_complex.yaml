identifier: GO:1990060
label: maltose transport complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A pentameric ATP-binding cassette (ABC) importer complex (MalEFGK2) in
  the bacterial inner membrane and periplasm, composed of the periplasmic maltose/maltodextrin-binding
  protein MalE, heterodimeric transmembrane permease subunits MalF and MalG, and homodimeric
  ATP-binding cassette subunits MalK2.
