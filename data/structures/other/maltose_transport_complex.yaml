  gene_symbols:
  - malK
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: Homodimeric nucleotide-binding domain (NBD) subunit that binds and hydrolyzes
    ATP to power alternating-access conformational transitions of the MalFG transmembrane
    core.
  protein_examples:
  - uniprot_id: UniProtKB:P68187
    protein_label: Maltose/maltodextrin import ATP-binding protein MalK
    gene_symbol: malK
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-30'
    role: Reviewed Escherichia coli K-12 MalK ATP-binding subunit.
    evidence:
    - reference: UniProtKB:P68187
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 MalK.
    - reference: PMID:29194754
      snippet: In this study, we performed all-atom molecular dynamics (MD) simulations
        on the maltose transporter and found that both the binding of MalE to the
        periplasmic side of the TMDs and binding of ATP to the MalK2 are necessary
        to facilitate the conformational change from the inward-facing state to the
        occluded state, in which MalK2 is completely dimerized.
      notes: Shows ATP-dependent MalK2 dimerization driving conformational transitions.
