      snippet: In addition to the TMDs and NBDs, the periplasmic maltose binding protein
        MalE captures maltose and shuttle it to the transporter.
      notes: Establishes MalE as the periplasmic maltose-capturing subunit in E. coli.
  evidence:
  - reference: GO:1990060
    notes: GO:1990060 defines the pentameric maltose transport complex containing
      MalE.
  - reference: InterPro:IPR006059
    notes: InterPro entry for periplasmic maltose-binding protein MalE.
  - reference: PMID:26338707
    snippet: We conclude that open-state MalE stabilizes MalFGK2 in the outward-facing
      conformation until maltose triggers return to the inward-facing state for substrate
      and Pi release.
    notes: Demonstrates the mechanistic requirement for MalE in the MalFGK2 cycle.
