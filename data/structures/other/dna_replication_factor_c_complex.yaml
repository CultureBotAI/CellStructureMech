identifier: GO:0005663
label: DNA replication factor C complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex that loads the DNA polymerase processivity factor proliferating
  cell nuclear antigen (PCNA) onto DNA, thereby permitting processive DNA synthesis
  catalyzed by DNA polymerase. In eukaryotes the complex consists of five polypeptides.
