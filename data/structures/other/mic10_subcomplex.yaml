functions:
- function_id: inner_mitochondrial_membrane_organization
  label: inner mitochondrial membrane organization
  grounding: GO:0007007
  description: Contributes a Mic10-based organizing module to the MICOS machinery
    that maintains mitochondrial crista architecture.
  evidence:
  - reference: DOI:10.7554/elife.07739
    notes: Genetics, microscopy and Mic27 immunopurification distinguish an independent
      organizing center from the Mic60-containing module. Junction localization of
      Mic27 foci is inferred from proximity to crista markers, not resolved by direct
      immuno-electron microscopy.
  - reference: DOI:10.1016/j.jmb.2018.04.037
    notes: Antagonistic Mic26-Mic27 effects regulate the Mic10 oligomeric scaffold.
evidence:
- reference: DOI:10.1016/j.jmb.2018.04.037
  notes: Rampelt et al. (2018), Assembly of the Mitochondrial Cristae Organizer Mic10
    Is Regulated by Mic26-Mic27 Antagonism and Cardiolipin. Main text, captions and
    Figures 1-4 inspected in the institutional publisher-version PDF.
- reference: DOI:10.7554/elife.07739
  notes: Friedman et al. (2015), MICOS coordinates with respiratory complexes and
    lipids to establish mitochondrial inner membrane architecture. Relevant Results,
    Discussion, strain methods and Figure 3 inspected in checksum-verified PMC4434539
    version 1.
- reference: DOI:10.1083/jcb.202003024
  notes: Tirrell et al. (2020), MICOS subcomplexes assemble independently on the mitochondrial
    inner membrane in proximity to ER contact sites. Subcomplex-localization and ERMES-perturbation
    Results plus strain methods inspected in checksum-verified PMC7545361 version
    1.
