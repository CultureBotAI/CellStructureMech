causal_graphs:
- graph_id: yeast_mic10_subcomplex_assembly
  title: Mic10 oligomer regulation and conditional Mic27 focal assembly
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  description: Protein-specific perturbations distinguish regulation of Mic10 oligomers
    from focal assembly of a Mic27-containing organizing center.
  scope_notes: Oligomer edges concern isolated YPH499-derived mitochondria in the
    2018 study. Focal-assembly edges concern W303-derived MICOS deletion strains in
    2015. These are distinct assays and backgrounds, not one reconstructed temporal
    pathway. Neither a fixed stoichiometry nor complete dissociation of MICOS follows
    from a shifted native-gel ladder.
