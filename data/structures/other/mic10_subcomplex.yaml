discussions:
- discussion_id: four_subunit_and_conditional_core_boundaries
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Reconcile the four-subunit MIC10 module with the three-protein organizing
    center seen in deletion strains.
  rationale: The 2015 Mic27/Mic12/Mic10 assembly does not establish that Mic26 is
    absent from the normal module; the experiments ask which proteins sustain focal
    assembly without other MICOS subunits.
  resolution_note: Retain all four components supported by the 2018 study. Do not
    treat the conditional three-protein core as an exact synonym of the four-protein
    module. Keep Mic60-Mic19 and full MICOS as distinct entities; MICOS is linked
    through part_of.
  evidence:
  - reference: DOI:10.7554/elife.07739
    notes: Mic26 is diffuse in mic60-deletion cells and a role in focal assembly was
      not detected.
  - reference: DOI:10.1016/j.jmb.2018.04.037
    notes: Four-subunit definition and Mic26-Mic10 cross-linking establish the broader
      module boundary.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: lipid_and_contact_site_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Distinguish environmental assembly dependencies from constituent identity.
  rationale: Genetic cardiolipin dependence and proximity to ER contact sites do not
    identify additional stoichiometric components of this protein module.
  resolution_note: Do not add cardiolipin, ERMES, Vps13 or respiratory complexes as
    constituents. Cardiolipin loss can shift Mic10 native-gel migration without gross
    MICOS dissociation; Mic27 focal assembly is strongly cardiolipin dependent when
    Mic60 is absent. Vps13-L1627S bypass restores foci despite ERMES loss, so ERMES
    is not an obligatory physical template.
  evidence:
  - reference: DOI:10.1016/j.jmb.2018.04.037
    notes: Single crd1 deletion and combined mic27/crd1 deletion have different effects.
  - reference: DOI:10.7554/elife.07739
    notes: Cardiolipin requirement for focal Mic27 assembly was tested in the mic60-deletion
      background.
  - reference: DOI:10.1083/jcb.202003024
    notes: ERMES perturbation and Vps13 bypass distinguish ERMES function from obligatory
      ERMES-complex presence; localization overlap does not prove direct binding.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: native_architecture_and_lipid_binding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve intact native subcomplex architecture, stoichiometry and direct
    cardiolipin-binding interfaces.
  attaches_to:
  - causal_graphs#yeast_mic10_subcomplex_assembly
  rationale: Native-gel migration, cross-linking and fluorescent foci do not establish
    one atomic structure or copy number. Direct cardiolipin binding to Mic10 is proposed
    from the perturbation data rather than independently measured in the cited 2018
    study.
  evidence:
  - reference: DOI:10.1016/j.jmb.2018.04.037
    notes: The lipid-binding explanation is an interpretation of altered assembly
      behavior, not a resolved binding site.
  posed_by: codex
  posed_date: '2026-10-04'
