identifier: GO:0000502
label: proteasome complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A large multisubunit complex which catalyzes protein degradation, found
  in eukaryotes, archaea and some bacteria. In eukaryotes, this complex consists of
  the barrel shaped proteasome core complex and one or two associated proteins or
  complexes that act in regulating entry into or exit from the core.
definition_source: GO:0000502
