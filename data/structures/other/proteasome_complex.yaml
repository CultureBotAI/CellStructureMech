synonyms:
- synonym_text: proteasome
  synonym_type: EXACT_SYNONYM
  source: GO:0000502
- synonym_text: 26S proteasome
  synonym_type: RELATED_SYNONYM
  source: GO:0000502
components:
- component_id: core_complex
  label: proteasome core complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005839
  essentiality: ESSENTIAL
  role: Barrel-shaped 20S proteolytic core that sequesters active sites in an internal
    chamber.
  evidence:
  - reference: GO:0005839
    notes: GO:0005839 identifies the proteasome core complex as the barrel-shaped
      proteolytic core.
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 review the eukaryotic 26S proteasome as a 20S
      core particle capped by a 19S regulatory particle.
- component_id: accessory_complexes
  label: proteasome accessory complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0022624
  essentiality: UNKNOWN
  role: Caps or regulators that bind the 20S core and control protein entry into,
    or exit from, the proteolytic core complex.
  evidence:
  - reference: GO:0022624
    notes: GO:0022624 defines proteasome accessory complexes as caps on one or both
      ends of the core that regulate entry or exit.
  - reference: DOI:10.3389/fmolb.2019.00023
    notes: Muller and Weber-Ban 2019 review bacterial regulator complexes that associate
      with the 20S core particle to recruit and internalize substrates.
taxonomic_distribution:
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: COMMON
  note: Archaeal proteasome systems combine 20S cores with proteasome-associated ATPases
    such as PAN.
  reference: DOI:10.1042/ETLS20180025
- taxon_id: NCBITaxon:201174
  taxon_label: Actinomycetota
  presence: VARIABLE
  note: Bacterial proteasomes occur in mycobacteria and other actinobacteria, where
    20S cores pair with regulators such as Mpa, Bpa, or Cpa.
  reference: DOI:10.3389/fmolb.2019.00023
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: COMMON
  note: Eukaryotic ubiquitin-proteasome degradation is carried out by 26S proteasomes
    built from 20S core particles and 19S regulatory particles.
  reference: DOI:10.1146/annurev-biochem-060410-150257
canonical_examples:
- taxon_id: NCBITaxon:83332
  taxon_label: Mycobacterium tuberculosis H37Rv
  note: Actinobacterial model whose 20S proteasome core and Mpa/Bpa regulator routes
    anchor bacterial proteasome-complex studies.
  reference: DOI:10.3389/fmolb.2019.00023
functions:
- function_id: proteasomal_protein_catabolism
  label: proteasomal protein catabolic process
  grounding: GO:0010498
  description: Proteasome complexes couple regulated substrate access through accessory
    complexes to proteolysis in the 20S core.
  evidence:
  - reference: GO:0000502
    notes: The GO graph asserts GO:0010498 has_participant GO:0000502, connecting
      the proteasome complex to proteasomal protein catabolism.
  - reference: DOI:10.1042/ETLS20180025
    notes: Maupin-Furlow 2018 reviews archaeal targeted proteolysis by proteasomes
      associated with AAA-ATPase networks.
  - reference: DOI:10.3389/fmolb.2019.00023
    notes: Muller and Weber-Ban 2019 review bacterial proteasomal degradation routes
      that combine the 20S core with alternative regulator complexes.
