  - components#hu_dimer
  - components#oric_origin_dna
  - causal_graphs#dnaa_hu_initiation
  rationale: GO:1990103 denotes a HU-containing DnaA-DNA complex. GO models the plain
    DnaA-oriC complex as GO:1990101, the DiaA-containing complex as GO:1990102, and
    DnaB-DnaC helicase loading separately as GO:1990100.
  resolution_note: Curated the HU-bound DnaA-DNA boundary and left DiaA stimulation,
    origin unwinding mechanics and DnaB-DnaC helicase loading as nonmechanistic graph
    scope.
  evidence:
