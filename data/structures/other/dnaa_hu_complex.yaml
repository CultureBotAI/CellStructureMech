identifier: GO:1990103
label: DnaA-HU complex
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A protein-DNA complex containing DNA-bound DnaA attached to HU. HU is
  a dimer encoded by two closely related genes. Essential for the initiation of replication
  in bacteria; stimulates the DnaA-dependent unwinding of oriC.
