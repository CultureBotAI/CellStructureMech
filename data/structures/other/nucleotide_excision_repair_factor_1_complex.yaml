identifier: GO:0000110
label: nucleotide-excision repair factor 1 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: One of several protein complexes involved in nucleotide-excision repair;
  possesses DNA damage recognition and endodeoxynuclease activities. In S. cerevisiae,
  it is composed of Rad1p, Rad10p, and Rad14p; in human the subunits are ERCC4/XPF,
  ERCC1 and XPA, respectively.
