  action: EXPANDED_RECORD
  changes: Added Lpt synonymy, GO transporter-complex parentage, LptA-G reviewed-label-only
    components, bacterial taxonomy, E. coli canonical example, ATP-dependent LPS transport
    function, evidence, and component grounding/boundary discussions.
  llm_assisted: true
synonyms:
- synonym_text: Lpt machinery
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1074/jbc.R117.802512
- synonym_text: Lpt transenvelope complex
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1021/bi300592c
parent_structures:
- GO:1990351
components:
- component_id: lpta_periplasmic_bridge_protein
  label: LptA periplasmic bridge protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: LptA is the periplasmic Lpt bridge protein rather than a broad
    periplasmic beta-jellyroll class; no exact source-neutral InterPro, Pfam, NCBIfam,
    or UniProtKB family CURIE was asserted.
  gene_symbols:
  - lptA
  role: Periplasmic bridge constituent that polymerizes between the inner-membrane
    and outer-membrane Lpt subcomplexes.
  evidence:
  - reference: DOI:10.1128/JB.01126-06
    notes: Sperandeo et al. 2007 identified E. coli LptA as a periplasmic protein
      implicated in LPS transport from the inner to the outer membrane.
  - reference: DOI:10.1126/science.aar1886
    notes: Sherman et al. 2018 reconstituted membrane-to-membrane LPS movement through
      an Lpt protein bridge.
- component_id: lptb_cytoplasmic_atpase
  label: LptB cytoplasmic ATPase
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: LptB is the ATPase of the LptB2FGC extractor, not the full bacterial
    ABC ATPase family; no exact source-neutral family CURIE was asserted.
  gene_symbols:
  - lptB
  role: Cytoplasmic ATPase constituent that powers LPS extraction by the inner-membrane
    LptBFGC subcomplex.
  evidence:
  - reference: DOI:10.1128/JB.01126-06
    notes: Sperandeo et al. 2007 identified E. coli LptB as an essential protein implicated
      in LPS transport to the outer membrane.
  - reference: DOI:10.1126/science.1228984
    notes: Okuda, Freinkman and Kahne 2012 showed that cytoplasmic ATP hydrolysis
      powers E. coli LPS transport across the periplasm.
- component_id: lptc_inner_membrane_adapter
  label: LptC inner-membrane adapter
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: LptC is the inner-membrane Lpt component that links the LptBFG
    extractor to the LptA bridge; no exact source-neutral family CURIE was asserted.
  gene_symbols:
  - lptC
  role: Inner-membrane adapter constituent of LptB2FGC that contacts the periplasmic
    LptA bridge.
  evidence:
  - reference: DOI:10.1016/j.febslet.2009.05.051
    notes: Narita and Tokuda 2009 biochemically characterized the E. coli LptBFGC
      inner-membrane ABC transporter complex.
  - reference: DOI:10.1074/jbc.R117.802512
    notes: Sperandeo, Martorana and Polissi 2017 review LptC as the inner-membrane
      Lpt component that bridges LptBFG and LptA.
- component_id: lptd_outer_membrane_beta_barrel
  label: LptD outer-membrane beta-barrel
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: LptD is the LPS-specific outer-membrane beta-barrel of LptDE rather
    than a broad beta-barrel or Omp85 class; no exact source-neutral family CURIE
    was asserted.
  gene_symbols:
  - lptD
  role: Outer-membrane beta-barrel constituent that receives LPS from the periplasmic
    bridge and participates in final outer-membrane insertion.
  evidence:
  - reference: DOI:10.1073/pnas.0604744103
    notes: Wu et al. 2006 identified the E. coli outer-membrane Imp/RlpB, now LptD/LptE,
      protein complex that assembles LPS in the outer membrane.
  - reference: DOI:10.1073/pnas.0912872107
    notes: Chng et al. 2010 characterized LptD as part of the two-protein outer-membrane
      LptDE complex in E. coli.
- component_id: lpte_outer_membrane_lipoprotein
  label: LptE outer-membrane lipoprotein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: LptE is the lipoprotein plug partner of LptD in the LPS transport
    machine; no exact source-neutral family CURIE was asserted.
  gene_symbols:
  - lptE
  role: Outer-membrane lipoprotein constituent that complexes with LptD in the LPS
    insertion site.
  evidence:
  - reference: DOI:10.1073/pnas.0604744103
    notes: Wu et al. 2006 identified RlpB, now LptE, as the lipoprotein partner of
      the E. coli outer-membrane LPS assembly complex.
  - reference: DOI:10.1073/pnas.0912872107
    notes: Chng et al. 2010 characterized LptE as part of the two-protein outer-membrane
      LptDE complex in E. coli.
- component_id: lptf_inner_membrane_permease
  label: LptF inner-membrane permease
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: LptF is a permease constituent of the LptB2FGC extractor, not a
    generic ABC permease; no exact source-neutral family CURIE was asserted.
  gene_symbols:
  - lptF
  role: Inner-membrane permease constituent of the LptB2FGC ABC transporter.
  evidence:
  - reference: DOI:10.1073/pnas.0801196105
    notes: Ruiz et al. 2008 identified LptF as one of two inner-membrane proteins
      required for LPS transport to the E. coli outer membrane.
  - reference: DOI:10.1016/j.febslet.2009.05.051
    notes: Narita and Tokuda 2009 biochemically characterized the E. coli LptBFGC
      inner-membrane ABC transporter complex.
- component_id: lptg_inner_membrane_permease
  label: LptG inner-membrane permease
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: LptG is a permease constituent of the LptB2FGC extractor, not a
    generic ABC permease; no exact source-neutral family CURIE was asserted.
  gene_symbols:
  - lptG
  role: Inner-membrane permease constituent of the LptB2FGC ABC transporter.
  evidence:
  - reference: DOI:10.1073/pnas.0801196105
    notes: Ruiz et al. 2008 identified LptG as one of two inner-membrane proteins
      required for LPS transport to the E. coli outer membrane.
  - reference: DOI:10.1016/j.febslet.2009.05.051
    notes: Narita and Tokuda 2009 biochemically characterized the E. coli LptBFGC
      inner-membrane ABC transporter complex.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: The Lpt machinery assembles in Gram-negative diderm bacteria that transport
    LPS to an outer membrane, so it is represented as variable within Bacteria rather
    than universal.
  reference: DOI:10.1074/jbc.R117.802512
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: E. coli LptA-G constitute the model LPS transport system used to reconstitute
    membrane-to-membrane LPS movement.
  reference: DOI:10.1126/science.aar1886
functions:
- function_id: atp_dependent_lps_transport_to_outer_membrane
  label: ATP-dependent lipopolysaccharide transport to the outer membrane
  description: Extracts LPS from the cytoplasmic membrane and transports it through
    a periplasmic LptA bridge to the LptDE outer-membrane insertion site.
  evidence:
  - reference: GO:0062051
    notes: GO:0062051 defines the system by ATP-dependent LPS transport from its cytoplasmic-membrane
      synthesis site across the periplasm to the outer membrane.
  - reference: DOI:10.1126/science.aar1886
    notes: Sherman et al. 2018 reconstituted LPS transport between inner- and outer-membrane
      Lpt complexes in separate proteoliposomes.
evidence:
- reference: GO:0062051
  notes: GO:0062051 is an active cellular-component term for the lipopolysaccharide
    transport system and is_a GO:1990351 transporter complex.
- reference: DOI:10.1074/jbc.R117.802512
  notes: Sperandeo, Martorana and Polissi 2017 review the Lpt machinery that transports
    LPS to the outer membrane of Gram-negative bacteria.
- reference: DOI:10.1126/science.aar1886
  notes: Sherman et al. 2018 reconstituted Lpt-dependent transport of LPS to the cell
    surface through a membrane-to-membrane protein bridge.
- reference: DOI:10.1021/bi100493e
  notes: Chng, Gronenberg and Kahne 2010 reported that the E. coli proteins required
    for LPS assembly form a transenvelope complex.
