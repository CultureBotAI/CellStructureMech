- discussion_id: exclude_msba_from_lpt_system
  prompt: Should MsbA be curated as a constituent of the lipopolysaccharide transport
    system?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#lptb_cytoplasmic_atpase
  - components#lptf_inner_membrane_permease
  - components#lptg_inner_membrane_permease
  rationale: MsbA flips nascent LPS across the inner membrane before the Lpt machine
    extracts LPS and transports it across the periplasm to the outer membrane. MsbA
    is therefore upstream of, rather than a constituent of, the Lpt transport system.
  evidence:
  - reference: DOI:10.1074/jbc.R117.802512
    notes: Sperandeo, Martorana and Polissi 2017 separate MsbA flipping from Lpt-mediated
      LPS extraction and transport to the cell surface.
  posed_by: codex
  posed_date: '2026-10-01'
