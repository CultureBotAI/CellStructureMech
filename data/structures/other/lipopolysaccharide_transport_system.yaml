identifier: GO:0062051
label: lipopolysaccharide transport system
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein-containing complex that functions to transport lipopolysaccharide
  from its site of synthesis at the cytoplasmic membrane across the periplasm to the
  outer membrane in an ATP-dependent manner.
