taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: The Lpt machinery assembles in Gram-negative diderm bacteria that transport
    LPS to an outer membrane, so it is represented as variable within Bacteria rather
    than universal.
  reference: DOI:10.1074/jbc.R117.802512
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: E. coli LptA-G constitute the model LPS transport system used to reconstitute
    membrane-to-membrane LPS movement.
  reference: DOI:10.1126/science.aar1886
functions:
- function_id: atp_dependent_lps_transport_to_outer_membrane
  label: ATP-dependent lipopolysaccharide transport to the outer membrane
  description: Extracts LPS from the cytoplasmic membrane and transports it through
    a periplasmic LptA bridge to the LptDE outer-membrane insertion site.
  evidence:
  - reference: GO:0062051
    notes: GO:0062051 defines the system by ATP-dependent LPS transport from its cytoplasmic-membrane
      synthesis site across the periplasm to the outer membrane.
  - reference: DOI:10.1126/science.aar1886
    notes: Sherman et al. 2018 reconstituted LPS transport between inner- and outer-membrane
      Lpt complexes in separate proteoliposomes.
evidence:
- reference: GO:0062051
  notes: GO:0062051 is an active cellular-component term for the lipopolysaccharide
    transport system and is_a GO:1990351 transporter complex.
- reference: DOI:10.1074/jbc.R117.802512
  notes: Sperandeo, Martorana and Polissi 2017 review the Lpt machinery that transports
    LPS to the outer membrane of Gram-negative bacteria.
- reference: DOI:10.1126/science.aar1886
  notes: Sherman et al. 2018 reconstituted Lpt-dependent transport of LPS to the cell
    surface through a membrane-to-membrane protein bridge.
- reference: DOI:10.1021/bi100493e
  notes: Chng, Gronenberg and Kahne 2010 reported that the E. coli proteins required
    for LPS assembly form a transenvelope complex.
