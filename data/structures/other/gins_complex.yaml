- discussion_id: keep_cdc45_mcm_outside_gins
  prompt: Keep Cdc45 and MCM helicase proteins outside the GINS component list.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#sld5_subunit
  - components#psf1_subunit
  - components#psf2_subunit
  - components#psf3_subunit
  - causal_graphs#gins_chromosomal_dna_replication
  rationale: GO:0000811 defines GINS itself as a heterotetrameric complex, and Takayama
    et al. 2003 separated GINS from other replication initiation factors. Cdc45 and
    MCM proteins therefore belong to adjacent replisome or CMG-helicase context, not
    as constituents of the GINS complex.
  evidence:
  - reference: GO:0000811
    notes: GO:0000811 defines GINS as a heterotetrameric protein complex.
  - reference: DOI:10.1101/gad.1065903
    notes: Takayama et al. 2003 described GINS while discussing its relationships
      with other origin-loading factors.
  posed_by: codex
  posed_date: '2026-09-27'
  resolved_date: '2026-09-27'
