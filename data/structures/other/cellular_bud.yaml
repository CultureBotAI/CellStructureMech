functions:
- function_id: budding_growth
  label: budding growth
  description: The cellular bud is the daughter-cell outgrowth that expands by polarized
    growth before cytokinesis separates it from the mother yeast cell.
  evidence:
  - reference: DOI:10.1083/jcb.135.3.725
    notes: Valtz and Herskowitz 1996 studied bipolar and mating-projection growth
      through Saccharomyces polarity proteins that localize to budding sites.
  - reference: DOI:10.3389/fcell.2016.00123
    notes: Glomb and Gronemeyer 2016 review the mother-bud neck as the cortical cytokinesis
      site organized during budding-yeast growth.
