causal_graphs:
- graph_id: cellular_bud_topology
  title: Cellular bud topology
  description: The yeast cellular bud has a surrounding bud membrane, a distal bud
    tip, and a bud neck that constricts the connection between the mother and daughter
    cell.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures GO- and UniProt-backed bud regions without asserting
    a complete polarity, septin, or cytokinesis mechanism.
