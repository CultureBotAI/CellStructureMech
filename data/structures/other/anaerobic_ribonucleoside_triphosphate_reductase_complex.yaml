    notes: GO:0031250 defines NrdD as the large catalytic subunit of the complex.
  - reference: InterPro:IPR012833
    notes: InterPro family entry for anaerobic ribonucleoside-triphosphate reductase
      NrdD.
  - reference: PMID:11427536
    snippet: Deoxyribonucleotide synthesis by anaerobic class III ribonucleotide reductases
      requires two proteins, NrdD and NrdG. NrdD contains catalytic and allosteric
      sites and, in its active form, a stable glycyl radical.
    notes: Confirms NrdD as the catalytic glycyl-radical reductase subunit.
- component_id: nrdg_fe_s_activase_subunit
  label: Anaerobic ribonucleoside-triphosphate reductase-activating protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR012837
  gene_symbols:
  - nrdG
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: Small [4Fe-4S]-cluster-binding beta2 activase subunit that reductively cleaves
    S-adenosylmethionine to generate the stable glycyl radical on NrdD.
  protein_examples:
  - uniprot_id: UniProtKB:P0A9N8
    protein_label: Anaerobic ribonucleoside-triphosphate reductase-activating protein
    gene_symbol: nrdG
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-31'
    role: Reviewed Escherichia coli K-12 [4Fe-4S] radical-SAM activase subunit NrdG.
    evidence:
    - reference: UniProtKB:P0A9N8
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 NrdG.
    - reference: PMID:9305874
      snippet: Here, we demonstrate that AdoMet is directly reduced by the Fe-S center
        of beta2 during the activation of the enzyme, resulting in methionine and
        glycyl radical formation.
      notes: Establishes the [4Fe-4S]-dependent AdoMet cleavage activity of the beta2
        (NrdG) subunit.
  evidence:
  - reference: GO:0031250
    notes: GO:0031250 defines NrdG as the smaller iron-binding activating subunit.
  - reference: InterPro:IPR012837
    notes: InterPro family entry for anaerobic ribonucleoside-triphosphate reductase-activating
      protein NrdG.
  - reference: PMID:11427536
    snippet: This radical is generated by NrdG with its [4Fe-4S](+) cluster and S-adenosylmethionine.
      We now find that NrdD and NrdG from Lactobacillus lactis anaerobically form
      a tight alpha(2)beta(2) complex, suggesting that radical generation by NrdG
      and radical transfer to the specific glycine residue of NrdD occurs within the
      complex.
    notes: Demonstrates alpha2-beta2 NrdD-NrdG complex formation and radical activation.
