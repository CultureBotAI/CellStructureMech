identifier: GO:0031250
label: anaerobic ribonucleoside-triphosphate reductase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An enzyme complex composed of 4 subunits, 2 copies of the large protein
  (nrdD in E. coli) and 2 copies of the small protein (nrdG in E. coli). It catalyzes
  the generation of 2'deoxyribonucleotides under anaerobic growth conditions. The
  larger subunit is the catalytic unit that is activated by the smaller iron-binding
  subunit.
