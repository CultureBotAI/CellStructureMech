  grounding: InterPro:IPR012833
  gene_symbols:
  - nrdD
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: Large catalytic alpha2 homodimer subunit that harbors an oxygen-sensitive
    glycyl radical and reduces ribonucleoside triphosphates to deoxyribonucleotides
    using formate as electron donor.
