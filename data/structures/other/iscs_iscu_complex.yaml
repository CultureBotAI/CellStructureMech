functions:
- function_id: cysteine_desulfurase_activity
  label: cysteine desulfurase activity
  grounding: GO:0031071
  description: Catalyzes PLP-dependent desulfuration of L-cysteine to L-alanine, forming
    a persulfide intermediate on IscS Cys328 for transfer to acceptor proteins.
  evidence:
  - reference: GO:0031071
    notes: GO molecular-function term for cysteine desulfurase activity.
  - reference: PMID:20404999
    snippet: IscS interacts with its partners through an extensive surface area centered
      on the active site Cys328. The structures indicate that the acceptor proteins
      approach Cys328 from different directions and suggest that the conformational
      plasticity of a long loop containing this cysteine is essential for the ability
      of IscS to transfer sulfur to multiple acceptor proteins.
    notes: Demonstrates Cys328-mediated persulfide sulfur transfer by IscS.
- function_id: iron_sulfur_cluster_assembly
  label: iron-sulfur cluster assembly
  grounding: GO:0016226
  description: Transfers sulfur from IscS to the disordered state of IscU and coordinates
    iron incorporation to assemble [2Fe-2S] and [4Fe-4S] clusters.
  evidence:
  - reference: GO:0016226
    notes: GO biological-process term for iron-sulfur cluster assembly.
  - reference: PMID:22203963
    snippet: Cluster assembly takes place in the complex between IscU and the cysteine
      desulfurase, IscS, and our NMR studies demonstrate that IscS binds preferentially
      the D form of apo-IscU.
    notes: Demonstrates Fe-S cluster assembly within the IscS-IscU complex.
- function_id: trna_wobble_uridine_modification
  label: tRNA wobble uridine modification
  grounding: GO:0002098
  description: Initiates persulfide sulfur relay to tRNA thiolation acceptors (such
    as TusA and ThiI) for wobble uridine modification.
  evidence:
  - reference: GO:0002098
    notes: GO biological-process term for tRNA wobble uridine modification.
  - reference: PMID:20404999
    snippet: Several IscS-interacting partners including IscU, a scaffold for Fe-S
      cluster assembly; TusA, the first member of a sulfur relay leading to sulfur
      incorporation into the wobble uridine of several tRNAs; ThiI, involved in tRNA
      modification and thiamine biosynthesis; and rhodanese RhdA are sulfur acceptors.
    notes: Links IscS persulfide transfer to tRNA wobble uridine modification.
