- component_id: iscs_cysteine_desulfurase_subunit
  label: Cysteine desulfurase IscS
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR010240
  gene_symbols:
  - iscS
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: PLP-dependent cysteine desulfurase homodimer subunit that abstracts sulfur
    from L-cysteine onto its active-site Cys328 persulfide loop and transfers it to
    bound IscU scaffold subunits.
  protein_examples:
  - uniprot_id: UniProtKB:P0A6B7
