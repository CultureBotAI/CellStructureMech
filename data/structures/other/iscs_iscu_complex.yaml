    - reference: UniProtKB:P0A6B7
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 IscS.
    - reference: PMID:20404999
      snippet: The cysteine desulfurase IscS is a highly conserved master enzyme initiating
        sulfur transfer via persulfide to a range of acceptor proteins involved in
        Fe-S cluster assembly, tRNA modifications, and sulfur-containing cofactor
        biosynthesis.
      notes: Establishes IscS as the master cysteine desulfurase initiating persulfide
        transfer.
  evidence:
  - reference: GO:1990330
    notes: GO:1990330 defines the central IscS dimer of the IscS-IscU complex.
  - reference: InterPro:IPR010240
    notes: InterPro family entry for cysteine desulfurase IscS.
  - reference: PMID:20404999
    snippet: We have determined the crystal structures of IscS-IscU and IscS-TusA
      complexes providing the first insight into their different modes of binding
      and the mechanism of sulfur transfer.
    notes: Determines the crystal structure of the E. coli IscS-IscU complex.
- component_id: iscu_fe_s_scaffold_subunit
  label: Iron-sulfur cluster assembly scaffold protein IscU
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR011339
  gene_symbols:
  - iscU
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: Conformationally dynamic scaffold subunit that binds IscS in its disordered
    (D) state to accept persulfide sulfur from IscS Cys328 and converts to a structured
    (S) state to stabilize assembled Fe-S clusters.
  protein_examples:
  - uniprot_id: UniProtKB:P0ACD4
    protein_label: Iron-sulfur cluster assembly scaffold protein IscU
    gene_symbol: iscU
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-31'
    role: Reviewed Escherichia coli K-12 Fe-S cluster assembly scaffold subunit IscU.
    evidence:
    - reference: UniProtKB:P0ACD4
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 IscU.
    - reference: PMID:22203963
      snippet: Cluster assembly takes place in the complex between IscU and the cysteine
        desulfurase, IscS, and our NMR studies demonstrate that IscS binds preferentially
        the D form of apo-IscU.
      notes: Demonstrates preferential binding of apo-IscU to IscS during Fe-S cluster
        assembly.
  evidence:
  - reference: GO:1990330
    notes: GO:1990330 defines the two IscU protomers attached to the central IscS
      dimer.
  - reference: InterPro:IPR011339
    notes: InterPro family entry for NifU-like N-terminal iron-sulfur scaffold domain
      (IscU).
  - reference: PMID:22203963
    snippet: It appears that IscU has evolved to exist in a disordered conformational
      state that is the initial substrate for the desulfurase and to convert to a
      structured state that stabilizes the cluster once it is assembled.
    notes: Describes the conformational cycle of IscU in the IscS-IscU complex.
