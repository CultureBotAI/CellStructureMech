identifier: GO:1990330
label: IscS-IscU complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heterotetrameric protein complex involved in the sulfur transfer during
  iron-sulfur cluster assembly and in the modification of tRNA wobble positions. In
  E. coli it consists of a central IscS dimer with the IscU protomers attached to
  one of the IscS units each via a disulfide (-SSH) group.
definition_source: GO:1990330
mapping_status: PROPOSED
