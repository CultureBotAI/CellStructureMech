identifier: GO:1990621
label: ESCRT IV complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An ESCRT complex that has AAA-ATPase activity and is involved in ESCRT-mediated
  intralumenal vesicle formation and the final stages of cytokinesis. The complex
  catalyzes disassembly of the ESCRT III filament around the neck of the budding vesicle
  in an ATP-driven reaction, resulting in membrane scission and recycling of the ESCRT
  III components back to the cytosol. In yeast, it is formed by the AAA ATPase Vps4
  and its cofactor Vta1.
