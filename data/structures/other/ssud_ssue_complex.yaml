discussions:
- discussion_id: resolve_ssud_grounding
  prompt: Resolve an exact source-neutral family grounding for SsuD alkanesulfonate
    monooxygenase.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#ssud_alkanesulfonate_monooxygenase
  rationale: The first record represents SsuD by its reviewed E. coli gene name and
    avoids mapping it to InterPro:IPR050172 because that family also covers RutA monooxygenases.
  evidence:
  - reference: InterPro:IPR050172
    notes: InterPro IPR050172 is named SsuD/RutA monooxygenase.
  posed_by: codex
  posed_date: '2026-10-01'
- discussion_id: do_not_assert_six_subunit_stoichiometry
  prompt: Should the SsuD-SsuE complex assert a fixed six-subunit stoichiometry?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: No. The first biochemical study characterized isolated SsuD as a homotetramer
    and isolated SsuE as a homodimer, while the later interaction study supported
    a stable SsuD-SsuE complex and proposed a 1:1 monomeric SsuE:SsuD association.
    This record leaves the assembled complex subunit count unmodeled.
  evidence:
  - reference: PMID:10480865
    notes: Eichhorn et al. 1999 reported native oligomer states for purified SsuD
      and SsuE.
  - reference: PMID:16997955
    notes: Gao and Ellis 2006 detected SsuD-SsuE complex formation and proposed 1:1
      monomeric association for the interaction.
  posed_by: codex
  posed_date: '2026-10-01'
