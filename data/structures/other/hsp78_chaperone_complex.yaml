functions:
- function_id: disaggregation
  label: ATP-dependent protein disaggregase activity
  grounding: GO:0140545
  description: Supports resolubilization of heat-aggregated reporter protein in isolated
    yeast mitochondria. Recovery into a soluble fraction is not itself evidence of
    refolding or restored reporter enzymatic activity.
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.102494
    notes: Figure 2 compares recovery of imported radiolabeled b2(107)Delta-DHFRDS
      reporter in wild-type-complemented, Hsp78TR, deletion and ATP-depleted mitochondria.
      Organelle-wide ATP depletion is not an Hsp78-specific intervention.
  - reference: UniProtKB:P33416
    notes: Reviewed annotation supports ATP-dependent disaggregation and functional
      cooperation with mitochondrial Hsp70; cooperation does not imply a fixed heteromeric
      composition.
- function_id: atp_hydrolysis
  label: ATP hydrolysis activity
  grounding: GO:0016887
  description: ATPase activity of Hsp78, measured with purified recombinant yeast
    protein.
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.102494
    notes: Figure 1C measures phosphate release with 0.08 microgram/microliter protein
      and 0.25 mM ATP at 37 C. The Hsp78TR construct retains residual activity and
      is not ATPase-null.
causal_graphs:
- graph_id: yeast_hsp78_assayed_function
  title: Yeast Hsp78 oligomer membership and assay-bounded interventions
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  description: Hsp78 membership, purified-protein ATPase activity, mitochondrial reporter
    resolubilization and post-heat growth assays.
  scope_notes: Separate assay nodes prevent a direct causal chain from phosphate release
    to restored protein folding or respiration. The reporter was imported into isolated
    mitochondria, aggregated for 5 minutes at 42 C and allowed to recover for 60 minutes
    at 25 C. Hsp78WT and Hsp78TR complementation uses induced C-terminally His-tagged
    constructs in an hsp78 deletion background. TR expression is somewhat lower than
    WT, and the mutation affects multiple biochemical properties. Static oligomer
    assays do not measure an assembly pathway.
  nodes:
  - node_id: hsp78
    label: Hsp78-type chaperone subunit
    node_type: GENE_OR_PROTEIN
    component_ref: hsp78
  - node_id: assembly
    label: Hsp78 chaperone complex
    node_type: STRUCTURE
    grounding: cellstructuremech:hsp78_chaperone_complex
  - node_id: atpase
    label: ATP hydrolysis activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0016887
    description: Phosphate-release assay on bacterially expressed purified yeast protein.
  - node_id: solubilization
    label: Recovery of soluble mitochondrial DHFR reporter
    node_type: STATE
    description: Recovery into the soluble fraction after heat aggregation; reporter
      enzymatic activity was not measured.
  - node_id: tr
    label: Hsp78TR complementation
    node_type: STATE
    description: Yeast hsp78 deletion cells complemented with the induced His-tagged
      Hsp78TR construct, and mitochondria isolated from those cells. This state is
      not the bacterially expressed purified-protein preparation.
  - node_id: deletion
    label: HSP78 deletion
    node_type: STATE
  - node_id: wt_complementation
    label: Hsp78WT complementation
    node_type: STATE
  - node_id: growth
    label: Growth on glycerol after acquired-thermotolerance treatment
    node_type: STATE
    description: Serial-dilution growth readout after sequential temperature treatments,
      not direct respiration flux.
  - node_id: purified_tr
    label: Purified recombinant Hsp78TR assay preparation
    node_type: STATE
    description: Yeast Hsp78TR expressed and affinity-purified from E. coli for comparison
      with purified Hsp78WT in the phosphate-release assay. ATPase activity is reduced,
      not absent. The source disagrees on the second mutation number, so no single
      residue pair is asserted.
  edges:
  - subject: hsp78
    predicate: forms
    object: assembly
    evidence:
    - reference: DOI:10.1016/j.jbc.2022.102494
      notes: Figure 1E-F supports oligomeric Hsp78 preparations; native-gel migration
        was interpreted as trimeric and hexameric species, without a universal copy
        count.
  - subject: assembly
    predicate: catalyzes
    object: atpase
    evidence:
    - reference: DOI:10.1016/j.jbc.2022.102494
      notes: Figure 1C measures ATP-dependent phosphate release from purified Hsp78.
        The active oligomeric state was not independently assigned for each assay
        point.
  - subject: purified_tr
    predicate: impairs
    object: atpase
    evidence:
    - reference: DOI:10.1016/j.jbc.2022.102494
      notes: Figure 1C reports approximately 70 percent lower ATPase activity of purified
        Hsp78TR than WT, not complete loss.
  - subject: tr
    predicate: impairs
    object: solubilization
    evidence:
    - reference: DOI:10.1016/j.jbc.2022.102494
      notes: Figure 2A-C shows reduced reporter recovery in Hsp78TR mitochondria relative
        to WT complementation. This does not isolate ATP hydrolysis from substrate
        binding, expression or assembly changes.
  - subject: deletion
    predicate: impairs
    object: solubilization
    evidence:
    - reference: DOI:10.1016/j.jbc.2022.102494
      notes: Figure 2A-C shows reduced reporter resolubilization in hsp78 deletion
        mitochondria under the specified heat/recovery conditions.
  - subject: wt_complementation
    predicate: restores relative to deletion
    object: solubilization
    evidence:
    - reference: DOI:10.1016/j.jbc.2022.102494
      notes: Figure 2A-C shows improved recovery with Hsp78WT complementation, not
        quantitative recovery of all substrate or demonstration of restored DHFR activity.
  - subject: tr
    predicate: impairs
    object: growth
    evidence:
    - reference: DOI:10.1016/j.jbc.2022.102494
      notes: Figure 1D compares serial dilutions on glucose and glycerol after 60
        minutes at 42 C, a 30-minute 30 C regeneration step specified in Methods,
        and 60 minutes at 48 C. TR impairs subsequent growth on glycerol relative
        to WT complementation; glucose growth is similar. No direct respiration or
        universal heat-survival claim is inferred.
evidence:
- reference: DOI:10.1016/j.jbc.2022.102494
  notes: Jaworek, Sylvester, Cenini and Voos (2022), PMID 36115461. Read abstract,
    Results, Discussion, Methods, Data availability and main-figure captions in PMC9574514.1;
    actual Figures 1 and 2 inspected. XML SHA-256 75b5f2c13addf3554fbd534e58fea2aa26605afe26987185a88cc7b3c9a5b2d8.
    Older oligomer studies cited by the authors were not fully accessible and are
    not independently treated as inspected evidence.
- reference: UniProtKB:P33416
