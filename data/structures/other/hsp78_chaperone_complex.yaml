components:
- component_id: hsp78
  label: Hsp78-type chaperone subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro combined matches for reviewed yeast P33416 include
    the broader ClpA/B families IPR001270 and IPR050130, plus domains, sites and a
    P-loop superfamily. No exact Hsp78-type family was identified among those matches;
    none is adopted as an exact component grounding.
  gene_symbols:
  - HSP78
  role: ATPase chaperone subunit forming mitochondrial Hsp78 oligomers. The curated
    yeast preparations show multiple oligomeric states, so no invariant copy number
    is assigned.
  protein_examples:
  - uniprot_id: UniProtKB:P33416
    protein_label: Heat shock protein 78, mitochondrial
    gene_symbol: HSP78
    taxon_id: NCBITaxon:559292
    taxon_label: Saccharomyces cerevisiae S288C
    entry_status: REVIEWED
    retrieved_on: '2026-10-05'
    role: Reviewed reference sequence for the mitochondrial chaperone subunit, not
      an identifier for the whole oligomer or the experimental strain.
    evidence:
    - reference: UniProtKB:P33416
      notes: Native reviewed entry verifies HSP78, YDR258C, YD9320A.08C, reference
        taxon and matrix localization. Its homohexamer annotation does not establish
        a fixed copy number in every preparation.
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.102494
    notes: Figure 1E and Results report Hsp78-containing oligomers after digitonin
      solubilization of isolated yeast mitochondria. Figure 1F analyzes purified bacterially
      expressed yeast protein by size-exclusion chromatography. Neither assay is an
      atomic structure or a time-resolved assembly pathway.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P33416/?page_size=200
    notes: 'Native combined endpoint inspected 2026-10-05: nine integrated matches,
      next=null. IPR001270 and IPR050130 are broader ClpA/B families; four domains,
      two conserved sites and one homologous superfamily are not exact Hsp78 family
      identities. This bounded result motivates label-only grounding, not a claim
      that every possible authority lacks an exact term.'
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  reference: DOI:10.1016/j.jbc.2022.102494
  note: Yeast Hsp78 oligomerization and disaggregation experiments. Methods identify
