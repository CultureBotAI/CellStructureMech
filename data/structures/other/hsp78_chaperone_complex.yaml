identifier: cellstructuremech:hsp78_chaperone_complex
label: Hsp78 chaperone complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An oligomeric mitochondrial matrix chaperone assembly built from Hsp78-type
  subunits and involved in ATP-dependent solubilization of aggregated proteins.
definition_source: DOI:10.1016/j.jbc.2022.102494
mapping_status: PROPOSED
