discussions:
- discussion_id: identity_and_component_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate the Hsp78 oligomer from its subunit, cooperating chaperones and
    potential clients.
  rationale: Hsp78 is one gene product but forms a distinct mitochondrial oligomer.
    Copurification does not establish invariant structural membership.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.102494
    notes: Primary study establishes the experimental context and its limitations.
  resolution_note: Mint the assembly identity after bounded native QuickGO and OLS
    GO label/synonym searches for Hsp78, ClpB and Hsp100 did not return an exact term.
    The broad chaperone-complex parent is not equivalent. Keep Ssc1, Mdj1, potential
    substrates and post-lysis contaminants outside canonical composition; no fixed
    Hsp78-Hsp70 heteromer is demonstrated. Whole-worktree hidden/ignored-inclusive
    searches and parsed identity fields of all 885 pre-existing records found no Hsp78
    duplicate.
  resolved_date: '2026-10-05'
- discussion_id: exact_component_family
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve an exact source-neutral Hsp78-type component family if an authority
    supplies one.
  rationale: The nine integrated InterPro matches for reviewed P33416 include broader
    ClpA/B families, domains and sites; using those as an exact Hsp78 identity would
    overstate specificity.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.102494
    notes: Primary study establishes the experimental context and its limitations.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/protein/uniprot/P33416/?page_size=200
    notes: 'Native combined endpoint inspected 2026-10-05: nine integrated matches,
      next=null. IPR001270 and IPR050130 are broader ClpA/B families; four domains,
      two conserved sites and one homologous superfamily are not exact Hsp78 family
      identities. This bounded result motivates label-only grounding, not a claim
      that every possible authority lacks an exact term.'
  - reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/IPR050130/
    notes: Native family metadata inspected 2026-10-05 marks its description llm=true
      and checked=false. That description is not used as primary biological evidence.
  - reference: https://github.com/CultureBotAI/CellStructureMech/issues/2051
    notes: Review identified missing direct database evidence; native endpoint provenance
      has now been attached without changing the original rationale, date or label-only
      decision.
  notes: Leave grounding unset with REVIEWED_LABEL_ONLY. IPR050130 includes an unchecked
    LLM-generated description, which is not used as primary biological evidence. An
    unassigned plausible ClpB family is not a verified match.
- discussion_id: oligomer_and_protocol_conflicts
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve preparation-dependent oligomeric states and source-internal construct/protocol
    discrepancies before asserting a fixed copy number or residue-specific mechanism.
  rationale: Figure 1A and Results give E216Q/E614Q for Hsp78TR, whereas Methods give
    E612Q for the second substitution. High-salt SEC is described with NaCl in Results
    and KCl in Methods, and the compared buffers also differ in ATP and magnesium.
    Figure 2D and Methods differ in aggregation and centrifugation conditions.
  posed_by: codex
  posed_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.102494
    notes: Primary study establishes the experimental context and its limitations.
  notes: Use the named TR construct rather than choosing a residue pair. Preserve
    trimer/hexamer migration interpretations as preparation-specific, not universal
    stoichiometry. Do not infer a salt-only causal effect or reconcile conflicting
    protocols silently. The reporter assay and aggregate-binding workflow are distinct
    experiments; reporter solubility is not refolding activity. Reviewed UniProt homohexamer
    annotation does not override the primary preparation-dependent observations.
- discussion_id: assay_state_separation
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate purified recombinant Hsp78TR assays from yeast complementation
    in the causal graph.
  rationale: The initial graph reused a state labelled Hsp78TR complementation for
    an ATPase assay performed on bacterially expressed purified protein. Correct edge
    notes did not repair the mismatched intervention subject.
  resolution_note: Retarget only the ATPase impairment edge to a distinct purified-protein
    state. Retain yeast complementation for reporter resolubilization and growth.
    No new biological edge, native bacterial taxon or residue-specific claim is added.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.102494
    notes: Figure 1C and Methods, In vitro ATPase assay, explicitly use protein expressed
      and purified from E. coli; yeast and mitochondrial assays use separate preparations.
  - reference: https://github.com/CultureBotAI/CellStructureMech/issues/2050
    notes: Adversarial-review finding and required assay-state separation.
