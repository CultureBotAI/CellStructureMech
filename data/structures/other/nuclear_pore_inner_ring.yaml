  description: The nuclear pore inner ring contributes the inner scaffold around the
    central transport channel.
  evidence:
  - reference: DOI:10.1126/science.aac9176
    notes: Stuwe et al. 2015 determined a fungal inner-ring architecture that placed
      scaffold nucleoporins around the transport channel.
  - reference: DOI:10.1016/j.cell.2021.12.015
    notes: Akey et al. 2022 resolved how the inner-ring scaffold fits within the yeast
      nuclear pore.
