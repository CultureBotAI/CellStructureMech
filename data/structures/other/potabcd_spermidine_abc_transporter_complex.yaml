identifier: cellstructuremech:potabcd_spermidine_abc_transporter_complex
label: PotABCD spermidine ABC transporter complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An Escherichia coli PotABCD ATP-binding cassette importer composed of
  two PotA ATP-binding subunits, one PotB permease, one PotC permease, and one PotD
  periplasmic substrate-binding protein that imports spermidine and can also import
  putrescine.
definition_source: ComplexPortal:CPX-4383
