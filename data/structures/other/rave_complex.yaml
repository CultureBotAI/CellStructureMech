identifier: GO:0043291
label: RAVE complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multisubunit complex that in Saccharomyces is composed of three subunits,
  Rav1p, Rav2p and Skp1p. Acts transiently to catalyze assembly of cytoplasmic V1
  with membrane embedded V0 to form the V-ATPase holoenzyme.
