functions:
- function_id: histone_deacetylase_activity
  label: histone deacetylase activity
  grounding: GO:0004407
  description: The Rpd3S complex deacetylates histones across gene coding regions
    through its Rpd3 catalytic subunit.
  evidence:
  - reference: GO:0032221
    notes: GO:0032221 defines Rpd3S as a histone deacetylase complex that deacetylates
      histones across gene coding regions.
  - reference: GO:0004407
    notes: GO:0004407 is the Gene Ontology molecular-function term for histone deacetylase
      activity.
  - reference: DOI:10.1016/j.cell.2005.10.023
    notes: Carrozza et al. 2005 found that RCO1 and EAF3 mutants disrupted open-reading-frame
      deacetylation and suppression of intragenic transcription.
  - reference: DOI:10.1016/j.cell.2005.10.025
    notes: Keogh et al. 2005 found that Eaf3 recruits Rpd3C(S) to Set2-methylated
      H3K36 nucleosomes for deacetylation of transcribed regions.
