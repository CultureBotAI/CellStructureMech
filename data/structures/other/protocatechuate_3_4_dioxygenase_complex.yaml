identifier: GO:7770085
label: protocatechuate 3,4-dioxygenase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex which is capable of protocatechuate 3,4-dioxygenase
  activity. It consists of an alpha subunit (PcaG) and a beta subunit (PcaH), with
  the non-heme iron active site formed at the alpha-beta interface.
