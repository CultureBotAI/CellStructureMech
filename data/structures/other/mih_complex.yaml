part_of:
- GO:0005935
components:
- component_id: mlc1_subunit
  label: Myosin light chain 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR002048
  gene_symbols:
  - MLC1
  stoichiometry: Constituent EF-hand light-chain subunit of the trimeric MIH complex
  essentiality: ESSENTIAL
  role: EF-hand myosin light chain that binds the IQ motifs of Iqg1p, recruiting Iqg1p
    to the cellular bud neck to nucleate assembly of the Mlc1p-Iqg1p-Hof1p (MIH) complex.
  evidence:
  - reference: GO:0120155
    notes: GO:0120155 defines the S. cerevisiae MIH complex as consisting of Mlc1p,
      Iqg1p, and Hof1p.
  - reference: PMID:24895401
    notes: Tian et al. 2014 (DOI:10.1242/jcs.153429) demonstrated stepwise and cooperative
      assembly of the Mlc1p-Iqg1p-Hof1p cytokinetic core complex at the Saccharomyces
      cerevisiae bud neck.
