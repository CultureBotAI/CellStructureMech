functions:
- function_id: cytokinesis_septum_coordination
  label: cytokinesis
  grounding: GO:0000910
  description: Bridges actomyosin contractile ring constriction and primary septum
    synthesis at the cellular bud neck, coordinating plasma membrane ingression and
    abscission during yeast cytokinesis.
  evidence:
  - reference: GO:0120155
    notes: GO:0120155 defines the MIH complex as a trimeric complex involved in cytokinesis
      that bridges actomyosin ring contraction and septum synthesis.
  - reference: PMID:24895401
    notes: Tian et al. 2014 showed that cooperative assembly of the Mlc1p-Iqg1p-Hof1p
      complex coordinates actomyosin ring contraction with centripetal septum formation.
