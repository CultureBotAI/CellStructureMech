identifier: GO:0120155
label: MIH complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A trimeric complex involved in cytokinesis. Proposed to bridge actomyosin
  ring contraction and septum synthesis in yeast, resulting in the coordination of
  these processes, and leading to plasma membrane ingression and fusion. In the yeast
  Saccharomyces cerevisiae this complex consists of Mlc1p, Iqg1p and Hof1p proteins.
definition_source: GO:0120155
mapping_status: PROPOSED
synonyms:
- synonym_text: Mlc1p-Iqg1p-Hof1p complex
  synonym_type: EXACT_SYNONYM
  source: GO:0120155
parent_structures:
