      notes: Reviewed Swiss-Prot entry for Saccharomyces cerevisiae S288C myosin light
        chain 1 (MLC1).
    - reference: PMID:24895401
      notes: Tian et al. 2014 characterized Mlc1p as a constituent subunit of the
        S. cerevisiae MIH complex.
- component_id: iqg1_scaffold_subunit
  label: Ras GTPase-activating-like protein IQG1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR000593
  gene_symbols:
  - IQG1
  - CYK1
  stoichiometry: Central IQGAP scaffold subunit of the trimeric MIH complex
  essentiality: ESSENTIAL
  role: IQGAP-family scaffold protein that binds Mlc1p via its IQ motifs and Hof1p
    via its N-terminal and C-terminal regions to couple actomyosin contractile ring
    constriction to primary septum synthesis.
  evidence:
  - reference: GO:0120155
    notes: GO:0120155 specifies Iqg1p as one of the three subunits of the S. cerevisiae
      MIH complex.
  - reference: PMID:24895401
    notes: Tian et al. 2014 showed that Iqg1p directly interacts with Mlc1p and Hof1p
      to assemble the cytokinetic MIH core complex.
  protein_examples:
  - uniprot_id: UniProtKB:Q12280
    protein_label: Ras GTPase-activating-like protein IQG1
    gene_symbol: IQG1
    taxon_id: NCBITaxon:559292
    taxon_label: Saccharomyces cerevisiae S288C
    entry_status: REVIEWED
    retrieved_on: '2026-10-25'
    role: Reviewed S. cerevisiae S288C Iqg1p (also declared as synonym CYK1) IQGAP
      scaffold subunit of the trimeric MIH complex.
    evidence:
    - reference: UniProtKB:Q12280
      notes: Reviewed Swiss-Prot entry for Saccharomyces cerevisiae S288C IQG1.
    - reference: PMID:24895401
      notes: Tian et al. 2014 demonstrated how Iqg1p bridges Mlc1p and Hof1p in the
        MIH complex.
- component_id: hof1_fbar_subunit
  label: Cytokinesis protein 2 (Hof1p)
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR031160
  gene_symbols:
  - HOF1
  - CYK2
  stoichiometry: F-BAR/SH3 membrane- and septum-coupling subunit of the trimeric MIH
    complex
  essentiality: DISPENSABLE
  role: F-BAR and C-terminal SH3 domain cytokinesis protein that binds Iqg1p and Inn1p/Chs2p
    at the cellular bud neck, coupling actomyosin ring contraction to plasma membrane
    ingression and septum synthesis.
  evidence:
  - reference: GO:0120155
    notes: GO:0120155 specifies Hof1p as one of the three constituent subunits of
      the S. cerevisiae MIH complex.
  - reference: PMID:24895401
    notes: Tian et al. 2014 showed that Hof1p binds Iqg1p to complete the trimeric
      MIH complex and coordinate cytokinesis with septum synthesis.
  protein_examples:
