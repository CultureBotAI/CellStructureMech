    polymerase I rDNA transcription and pre-rRNA synthesis. Budding-yeast model in
    which nucleolar ribosome synthesis includes 35S pre-rRNA processing and U3-containing
    small-subunit processome assembly.
  reference: DOI:10.1038/nature00769
