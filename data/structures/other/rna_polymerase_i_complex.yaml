identifier: GO:0005736
label: RNA polymerase I complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: RNA polymerase I, one of three nuclear DNA-directed RNA polymerases found
  in all eukaryotes, is a multisubunit complex; typically it produces rRNAs. Two large
  subunits comprise the most conserved portion including the catalytic site and share
  similarity with other eukaryotic and bacterial multisubunit RNA polymerases. The
  remainder of the complex is composed of smaller subunits (generally ten or more),
  some of which are also found in RNA polymerase III and others of which are also
  found in RNA polymerases II and III. Although the core is competent to mediate ribonucleic
  acid synthesis, it requires additional factors to select the appropriate template.
  The 14-subunit DNA-directed RNA polymerase I holoenzyme localized in the eukaryotic
  nucleolus of yeasts, fungi, and protists that exclusively transcribes ribosomal
  DNA (rDNA) repeats into the polycistronic 35S/47S pre-rRNA precursor. In Saccharomyces
  cerevisiae, the RNA polymerase I complex comprises the Rpa190–Rpa135 catalytic core,
  five shared Rpb subunits, the Rpa43–Rpa14 stalk, and the TFIIF/TFIIE-like Rpa49–Rpa34
  heterodimer.
