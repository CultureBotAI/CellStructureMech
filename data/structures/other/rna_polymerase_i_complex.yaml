  title: RNA polymerase I complex rDNA transcription and co-transcriptional rRNA processing
  description: Recruited to nucleolar rDNA promoters, the 14-subunit RNA polymerase
    I complex synthesizes the 35S pre-rRNA transcript, which immediately nucleates
    snoRNP-guided modification and pre-ribosome assembly.
