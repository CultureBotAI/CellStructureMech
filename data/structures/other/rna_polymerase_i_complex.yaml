  reference: DOI:10.1038/nature00769
functions:
- function_id: transcription_by_rna_polymerase_i
  label: transcription by RNA polymerase I
  grounding: GO:0006360
  description: RNA polymerase I in the nucleolus transcribes ribosomal DNA to produce
    the major pre-rRNA precursor.
  evidence:
  - reference: GO:0006360
    notes: GO:0006360 denotes RNA synthesis from a DNA template by RNA polymerase
      I.
  - reference: DOI:10.1146/annurev.genet.33.1.261
    notes: Venema and Tollervey 1999 review rDNA transcription as the first stage
      of yeast ribosome synthesis.
- function_id: rrna_processing
  label: rRNA processing
  grounding: GO:0006364
  description: Nucleolar ribonucleoproteins process primary rRNA transcripts as part
    of ribosome biogenesis.
  evidence:
  - reference: GO:0006364
    notes: GO:0006364 denotes conversion of a primary rRNA transcript into mature
      rRNA molecules.
  - reference: DOI:10.1038/nature00769
    notes: Dragon et al. 2002 identified the nucleolar U3 small-subunit processome
      as required for 18S rRNA biogenesis.
- function_id: ribosome_biogenesis
  label: ribosome biogenesis
  grounding: GO:0042254
  description: The nucleolus organizes early transcription, rRNA processing, and preribosomal
    assembly steps that contribute to production of cytoplasmic ribosomal subunits.
  evidence:
  - reference: GO:0042254
    notes: GO:0042254 denotes the biosynthesis, assembly, and arrangement of ribosome-subunit
      constituents.
  - reference: DOI:10.1038/nrm2184
    notes: Boisvert et al. 2007 review the nucleolus as a eukaryotic nuclear body
      centered on ribosome biogenesis.
