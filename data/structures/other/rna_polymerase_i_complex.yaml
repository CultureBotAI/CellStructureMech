components:
- component_id: rpa190_rpa135_catalytic_core
  label: RNA polymerase I 10-subunit catalytic core (Rpa190, Rpa135, AC40-AC19, Rpb5/6/8/10/12)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Core DNA-directed RNA polymerase I assembly containing the active-site cleft
    formed by Rpa190 and Rpa135, the shared Pol I/III AC40-AC19 alpha-like heterodimer,
    and five common Rpb subunits that synthesize the 35S/47S pre-rRNA precursor.
  evidence:
  - reference: DOI:10.1038/nrm2184
    notes: Reviews the subunit composition and nucleolar transcription mechanism of
      eukaryotic RNA polymerase I.
- component_id: rpa43_rpa14_stalk_and_rpa49_rpa34_subcomplex
  label: RNA polymerase I stalk (Rpa43-Rpa14) and intrinsic TFIIF/TFIIE-like heterodimer
    (Rpa49-Rpa34.5)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Pol I-specific peripheral subcomplexes where the Rpa43-Rpa14 stalk recruits
    initiation factor Rrn3 and the Rpa49-Rpa34.5 heterodimer promotes promoter opening,
    processive rDNA elongation, and intrinsic RNA cleavage.
  evidence:
  - reference: DOI:10.1146/annurev.genet.33.1.261
    notes: Reviews the specialized initiation and elongation subcomplexes of Saccharomyces
      cerevisiae RNA polymerase I.
