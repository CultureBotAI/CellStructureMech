    notes: Boisvert et al. 2007 review the nucleolus as a eukaryotic nuclear body
      centered on ribosome biogenesis.
evidence:
- reference: GO:0005736
  notes: 'Gene Ontology cellular-component term for RNA polymerase I complex: RNA
    polymerase I, one of three nuclear DNA-directed RNA polymerases found in all eukaryotes,
    is a multisubunit complex; typically it produces rRNAs. Two large subunits comprise
    the most conserved portion including the catalytic site and share similarity with
    other eukaryotic and bacterial multisubunit RNA polymerases. The remainder of
    the complex is composed of smaller subunits (generally ten or more), some of which
    are also found in RNA polymerase III and others of which are also found in RNA
    polymerases II and III. Although the core is competent to mediate ribonucleic
    acid synthesis, it requires additional factors to select the appropriate template.'
