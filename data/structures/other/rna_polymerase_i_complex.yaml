      as required for 18S rRNA biogenesis.
- function_id: ribosome_biogenesis
  label: ribosome biogenesis
  grounding: GO:0042254
  description: Mediated by RNA polymerase I complex (GO:0005736) in RNA polymerase
    I rDNA transcription and pre-rRNA synthesis. The nucleolus organizes early transcription,
    rRNA processing, and preribosomal assembly steps that contribute to production
    of cytoplasmic ribosomal subunits.
  evidence:
  - reference: GO:0042254
    notes: GO:0042254 denotes the biosynthesis, assembly, and arrangement of ribosome-subunit
      constituents.
  - reference: DOI:10.1038/nrm2184
    notes: Boisvert et al. 2007 review the nucleolus as a eukaryotic nuclear body
      centered on ribosome biogenesis.
