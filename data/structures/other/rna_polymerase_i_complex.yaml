    primary rRNA transcripts as part of ribosome biogenesis.
  evidence:
  - reference: GO:0006364
    notes: GO:0006364 denotes conversion of a primary rRNA transcript into mature
      rRNA molecules.
  - reference: DOI:10.1038/nature00769
