  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - MGR1
  role: Membrane adaptor that contacts substrates and supports their recruitment to
    Yme1.
  evidence:
  - reference: DOI:10.1083/jcb.201702125
    notes: 'Figures 3-4: Mgr1 associates with Tom22-HA and contributes to Yme1 recruitment;
