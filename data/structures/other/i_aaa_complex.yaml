  label: Yme1 i-AAA protease
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native UniProt P32795 and InterPro checks resolve the broad FtsH
    family IPR005936 and Yme1-like N-terminal domain IPR048438, not an exact whole-protein
    Yme1 family. Neither is adopted as Yme1 identity.
