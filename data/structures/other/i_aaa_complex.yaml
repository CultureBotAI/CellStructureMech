  component_role: CONSTITUENT
  gene_symbols:
  - MGR3
  - FMP24
  role: Mgr3 membrane adaptor that contacts substrates and cooperates with Mgr1 in
    recruitment to Yme1.
  evidence:
  - reference: DOI:10.1083/jcb.201702125
    notes: 'Figures 3-4: Mgr3 supports optimal Tom22 recruitment and crosslinks to
      its intermembrane-space domain. Both adaptors cooperate; Mgr1 can retain some
      recruitment without Mgr3.'
  - reference: InterPro:IPR040201
    notes: The authority spells the family label Mrg3-like; the reviewed MGR3 protein
      Q04472 maps to this family. The label is preserved, not interpreted as a different
      gene.
