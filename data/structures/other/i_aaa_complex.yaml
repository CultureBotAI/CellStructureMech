functions:
- function_id: atp_dependent_proteolysis
  label: ATP-dependent peptidase activity
  grounding: GO:0004176
  description: ATP-dependent degradation of selected mitochondrial protein substrates;
    the curated yeast mechanism includes adaptor-assisted turnover of Tom22 and Om45.
  evidence:
  - reference: DOI:10.1083/jcb.201702125
    notes: Figure 1 tests tagged substrates using deletion and catalytic mutants.
      Figure 2 separately measures endogenous Tom22 at 37 C in glucose medium and
      Om45 at 40 C in respiratory medium. Mgr1/Mgr3 deletion blocks both; yme1 deletion
      cannot be tested for Om45 at 40 C because it fails to grow. Tags accelerate
      turnover, and these experiments do not show constitutive degradation of all
      outer-membrane proteins.
causal_graphs:
- graph_id: yeast_adaptor_assisted_tom22_turnover
  title: Adaptor-assisted recruitment and degradation of Tom22
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  description: Mgr1 and Mgr3 contact the substrate and support recruitment to the
    Yme1 protease.
  scope_notes: Source-bounded synthesis of BY4741 recruitment/turnover and W303 photo-crosslinking
    experiments, not one directly observed temporal sequence. Much of the contact
    evidence uses tagged Tom22 and protease-dead Yme1. The recruitment-to-processing
    transition is a supported mechanistic interpretation, not a visualized handoff
    or an exclusive degradation route.
