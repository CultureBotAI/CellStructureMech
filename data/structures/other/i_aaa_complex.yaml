identifier: GO:0031942
label: i-AAA complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: Protease complex of the mitochondrial inner membrane whose catalytic residues
  lie on the intermembrane space side of the inner membrane; involved in mitochondrial
  protein turnover. Contains a subunit belonging to the AAA family of ATP-dependent
  metalloproteases.
