    notes: 'Figure 1 and Results: deletion or ATPase/protease inactivation of Yme1
      blocks turnover of tested Tom22-HA and Om45-HA substrates.'
  - reference: ComplexPortal:CPX-1655
    notes: The exact accession annotates YME1 as an enzymatic participant, separately
      from MGR1, MGR3 and zinc.
