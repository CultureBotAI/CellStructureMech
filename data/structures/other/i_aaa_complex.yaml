    outer-membrane proteins Tom22 and Om45. Main Results/discussion, strain and recruitment/crosslinking
    methods, Figures 1-4 and Table S1 inspected in checksum-verified PMC5748973 version
    1.
- reference: GO:0098800
  notes: Exact inner mitochondrial membrane protein complex parent; distinct from
    parthood in the membrane.
- reference: GO:0005743
  notes: Containing mitochondrial inner membrane; the protease catalytic domains face
    the intermembrane space.
discussions:
- discussion_id: yme1_exact_family
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve an exact whole-protein family grounding for Yme1 without conflating
    it with FtsH or one domain.
  attaches_to:
  - components#yme1
  rationale: Bounded native UniProt/InterPro checks verified IPR005936 as a broader
    FtsH family and IPR048438 as an N-terminal domain. Neither exactly denotes this
    component class.
  evidence:
  - reference: UniProtKB:P32795
    notes: Reviewed reference sequence used only as an identity/family lookup anchor;
      organism-specific composition is retained separately.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: complex_and_substrate_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Separate the adaptor-bearing yeast assembly, protease core and substrate
    proteins.
  rationale: Substrate binding and catalytic loss of function do not make Tom22 or
    Om45 constituents or prove that adaptor deletion prevents Yme1 oligomerization.
  resolution_note: Curate Yme1, Mgr1, Mgr3 and the source-annotated zinc cofactor.
    Exclude Tom22/Om45 substrates and comparison proteases from composition. Keep
    the strain-specific Complex Portal assertion separate; its source taxon label
    is retained even though taxon 559292 denotes S288C. Do not equate an isolated
    Yme1 oligomer with the intact adaptor-bearing assembly, or the inner-membrane
    abbreviation MIM in this paper with the outer-membrane MIM insertase. No fixed
    copy numbers are asserted.
  evidence:
  - reference: DOI:10.1083/jcb.201702125
    notes: Results distinguish substrate recruitment, degradation and Yme1 native-gel
      behavior.
  - reference: ComplexPortal:CPX-1655
    notes: Four source participants; all source stoichiometry values are null.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: intact_architecture_and_native_substrates
  kind: CURATION_TODO
  status: OPEN
  prompt: Establish intact adaptor-bearing architecture and physiological substrate
    range with direct structural and condition-matched evidence.
  rationale: Native-gel migration and trapped photo-crosslinks do not determine stoichiometry
    or visualize substrate movement. Tagged substrates turn over faster than endogenous
    proteins, and temperature/media matter. The linked biochemical figure is not a
    micrograph of the complex. Earlier adaptor papers and the separate Yme1 core structural
    study require full-text review before extending this record.
  evidence:
  - reference: DOI:10.1083/jcb.201702125
    notes: Figures 1-4 and Results qualify substrate, strain, catalytic-mutant and
      assay scope.
  posed_by: codex
  posed_date: '2026-10-04'
