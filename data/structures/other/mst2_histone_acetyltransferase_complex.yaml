identifier: GO:0036410
label: Mst2 histone acetyltransferase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that can catalyze the acetylation of lysine at position
  14 in histone H3, and contains Mst2 as the catalytic subunit. In fission yeast,
  contains at least Mst2, Nto1, Ptf2, Ptf1 and Eaf6.
