discussions:
- discussion_id: ap2_coat_boundary
  prompt: Represent AP-2 as an adaptor complex within endocytic clathrin coats, not
    as a complete clathrin coat.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - part_of
  rationale: GO:0030122 is a clathrin adaptor complex and plasma membrane protein
    complex that is part of GO:0030128 clathrin coat of endocytic vesicle and GO:0030132
    clathrin coat of coated pit. This record therefore represents the AP-2 adaptor
    heterotetramer and links it to those containing coats through part_of.
  evidence:
  - reference: GO:0030122
    notes: GO relationship source for AP-2.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
- discussion_id: ap2_alpha_isoform_boundary
  prompt: Represent alphaA and alphaC as isoforms of one AP-2 alpha subunit class.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#ap2_alpha_subunit
  rationale: The GO definition notes that human AP-2 can be heterogeneric because
    alpha1 and alpha2 isoforms are encoded by different genes. The taxon-agnostic
    component list therefore keeps one AP-2 alpha subunit class rather than making
    human paralogs separate core component classes.
  evidence:
  - reference: GO:0030122
    notes: GO definition source for AP-2 alpha subunit isoform handling.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
- discussion_id: resolve_ap2_subunit_groundings
  prompt: Resolve exact source-neutral groundings for the AP-2 alpha, beta2, mu2 and
    sigma2 subunit classes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
