components:
- component_id: mak3_natc_catalytic_subunit
  label: Mak3 NatC catalytic subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - MAK3
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The budding-yeast NatC literature follows Mak3 naming; no exact
    source-neutral InterPro, Pfam, NCBIfam or UniProt family identifier for this NatC
    subunit class was curated in this pass.
  role: Catalytic constituent of the budding-yeast NatC complex that works with Mak10
    and Mak31 to form active NatC.
  evidence:
  - reference: DOI:10.1074/jbc.M011440200
    notes: Polevoda and Sherman 2001 report that Saccharomyces cerevisiae NatC contains
      Mak3p, Mak10p and Mak31p, and that all three subunits associate to form the
      active complex.
  - reference: DOI:10.1016/s0006-291x(03)01316-0
    notes: Polevoda and Sherman 2003 review the eukaryotic N-terminal acetyltransferase
      complexes and describe yeast NatC as Mak3p with the Mak10 and Mak31p auxiliary
      subunits.
