functions:
- function_id: protein_n_terminal_amino_acid_acetyltransferase_activity
  label: protein-N-terminal amino-acid acetyltransferase activity
  grounding: GO:0004596
  description: Transfer of an acetyl group from acetyl-CoA to the N-terminal alpha-amino
    group of NatC substrate proteins.
  evidence:
  - reference: GO:0004596
    notes: GO:0004596 is the Gene Ontology molecular-function term for protein-N-terminal
      amino-acid acetyltransferase activity.
  - reference: GO:0031417
    notes: GO:0031417 defines the NatC complex by transfer of acetyl groups to N-terminal
      Met-Ile, Met-Leu, Met-Trp or Met-Phe protein residues.
  - reference: DOI:10.1074/jbc.M011440200
    notes: Polevoda and Sherman 2001 show that the Mak3p, Mak10p and Mak31p subunits
      associate to form active yeast NatC and that deleting any one subunit disrupts
      in vivo acetylation of a NatC substrate.
