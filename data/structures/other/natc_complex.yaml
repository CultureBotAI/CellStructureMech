identifier: GO:0031417
label: NatC complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A conserved complex that catalyzes the transfer of an acetyl group to
  the N-terminal residue of a protein acceptor molecule that has a Met-Ile, Met-Leu,
  Met-Trp, or Met-Phe N-terminus. In Saccharomyces the complex includes Mak3p, Mak10p,
  and Mak31p.
