identifier: GO:0070210
label: Rpd3L-Expanded complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that contains a histone deacetylase and is part of the
  chromatin remodeling machinery. In Saccharomyces cerevisiae this complex contains
  the Rpd3p, Sin3p, Ume1p, Pho23p, Sap30p, Sds3p, Cti6p, Rxt2p, Rxt3p, Dep1p, Ume6p,
  Ash1p, Dot6p, Snt1, Sif2p, Set3p, Hos2p, Tos4p and Tod6p proteins.
definition_source: GO:0070210
mapping_status: PROPOSED
