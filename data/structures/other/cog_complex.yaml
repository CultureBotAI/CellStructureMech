functions:
- function_id: golgi_vesicle_transport
  label: Golgi vesicle transport
  grounding: GO:0048193
  description: COG acts as a Golgi vesicle tethering complex during retrograde vesicular
    traffic within and to the Golgi apparatus.
  evidence:
  - reference: GO:0048193
    notes: GO:0048193 denotes vesicle-mediated movement into, out of or within the
      Golgi apparatus.
  - reference: DOI:10.1247/csf.18014
    notes: Ishii, Lupashin and Nakano 2018 studied yeast COG subunit interactions
      in the context of Golgi membrane trafficking.
