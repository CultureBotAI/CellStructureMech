identifier: GO:0017119
label: COG complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multisubunit tethering complex of the CATCHR family (complexes associated
  with tethering containing helical rods) that has a role in tethering vesicles to
  the Golgi prior to fusion. Composed of 8 subunits COG1-8.
definition_source: GO:0017119
mapping_status: PROPOSED
