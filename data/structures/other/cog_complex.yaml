    boundaries are reviewed per subunit.
  evidence:
  - reference: DOI:10.1074/jbc.M400662200
    notes: Loh and Hong 2004 compared all eight COG subunits.
  posed_by: codex
  posed_date: '2026-09-16'
- discussion_id: cog_copi_snare_boundary
  prompt: Do not model COPI coats or Golgi SNAREs as constituent COG components.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - causal_graphs#yeast_cog_golgi_tethering
  rationale: COG physically and functionally interacts with COPI coats and Golgi SNARE
    proteins, but its constituent subunits are Cog1 through Cog8.
  resolution_note: 'Declined: COPI and SNARE proteins are represented as COG-adjacent
    Golgi trafficking machinery rather than constituent COG subunits.'
  evidence:
  - reference: DOI:10.1083/jcb.200412003
    notes: Zolov and Lupashin 2005 found that mammalian COG physically interacts with
      COPI and the GS28 SNARE.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
