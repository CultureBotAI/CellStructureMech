identifier: GO:0000347
label: THO complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A eukaryotic nuclear protein complex that promotes transcription elongation
  and can act as part of the transcription export complex to couple RNA polymerase
  II transcription with mRNA export from the nucleus.
