functions:
- function_id: trna_wobble_base_modification
  label: tRNA wobble base modification
  grounding: GO:0002097
  description: Elongator supports post-transcriptional modification of tRNA wobble
    nucleosides at anticodon position 34.
  evidence:
  - reference: GO:0033588
    notes: Gene Ontology annotates GO:0033588 as capable_of_part_of GO:0002097, tRNA
      wobble base modification.
  - reference: GO:0002097
    notes: GO:0002097 is the Gene Ontology biological-process term for post-transcriptional
      modification of the position-34 tRNA wobble base.
  - reference: DOI:10.1261/rna.7247705
    notes: Huang et al. 2005 showed that the Elongator complex is required for an
      early step of tRNA wobble uridine modification.
