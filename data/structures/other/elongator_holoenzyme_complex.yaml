causal_graphs:
- graph_id: yeast_elongator_trna_wobble_modification
  title: Elongator supports yeast tRNA wobble-base modification
  description: In Saccharomyces cerevisiae, the Elp1-Elp2-Elp3 and Elp4-Elp5-Elp6
    subcomplexes form the six-subunit Elongator holoenzyme, which supports tRNA wobble-base
    modification.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the six curated Elongator constituents and the broad
    tRNA wobble-base modification function without resolving Elongator conformational
    states, Elp3 catalysis or the downstream tRNA-modification cascade.
