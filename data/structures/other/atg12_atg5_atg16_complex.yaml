  - APG12
  stoichiometry: '2'
  essentiality: ESSENTIAL
  role: Ubiquitin-like modifier protein covalently conjugated via its C-terminal glycine
    to an internal lysine of Atg5; mediates PAS recruitment via Atg17 interaction
    and activates the E2 enzyme Atg3.
