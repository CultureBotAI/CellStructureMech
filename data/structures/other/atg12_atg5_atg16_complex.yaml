identifier: GO:0034274
label: Atg12-Atg5-Atg16 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heterohexameric ubiquitin-like E3 ligase complex localized to the phagophore
  assembly site (pre-autophagosomal structure, PAS) in yeast and other eukaryotes,
  formed by two copies of the covalent Atg12-Atg5 conjugate bound to a homodimer of
  coiled-coil Atg16; stimulates Atg3-mediated conjugation of Atg8 to phosphatidylethanolamine
  (PE) and scaffolds membrane shaping during autophagosome biogenesis.
