        efficiently condensed in the droplets through specific Atg12-Atg17 interaction,
        which is also important for the PAS targeting of the E3 complex in vivo.
      notes: Establishes Atg12 role in PAS droplet recruitment and E3 ligase function
        in S. cerevisiae.
  evidence:
