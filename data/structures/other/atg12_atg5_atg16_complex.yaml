      complex.
  - reference: InterPro:IPR007242
    notes: InterPro family entry for autophagy-related protein 12 (Atg12).
  - reference: PMID:41457424
    snippet: In most species, Atg12 covalently binds Atg5, forming the Atg12-Atg5-Atg16
      complex that functions as an E3-like enzyme to promote Atg8 conjugation with
      phosphatidylethanolamine (PE), a step essential for autophagosomal maturation.
    notes: Confirms covalent Atg12-Atg5 conjugation in the Atg12-Atg5-Atg16 E3 complex.
