      phosphatidylethanolamine (PE), a step essential for autophagosomal maturation.
    notes: Establishes the E3-like Atg8-PE ligase activity of the Atg12-Atg5-Atg16
      complex.
- function_id: autophagosome_assembly
  label: autophagosome assembly
