identifier: GO:0005760
label: gamma DNA polymerase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A DNA polymerase complex consisting of a large subunit, responsible for
  the catalytic activities, and a small accessory subunit. Functions in the replication
  and repair of mitochondrial DNA.
