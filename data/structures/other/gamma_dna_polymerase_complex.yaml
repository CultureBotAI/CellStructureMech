- discussion_id: model_accessory_subunit_homodimer
  prompt: Represent the homodimeric mammalian Pol gamma B accessory subunit as a single
    accessory-subunit class.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#pol_gamma_accessory_subunit
  rationale: GO:0005760 names a large catalytic subunit and a small accessory subunit;
    mammalian structural evidence shows that the accessory subunit functions as a
    homodimer. The component list models molecular classes, so the accessory subunit
    remains a single component class rather than two duplicate component rows.
  evidence:
  - reference: GO:0005760
    notes: GO:0005760 defines the gamma DNA polymerase complex as a large catalytic
      subunit and a small accessory subunit that function in mitochondrial DNA replication
      and repair.
  - reference: PMID:11172710
    notes: Carrodeguas et al. showed that mammalian Pol gamma B, the accessory subunit
      of DNA polymerase gamma, functions as a homodimer.
  resolution_note: The component list includes one accessory-subunit class; the p55/POLG2
    copy number can be added later as a taxon-specific complex composition or stoichiometry
    detail.
  posed_by: codex
  posed_date: '2026-09-27'
