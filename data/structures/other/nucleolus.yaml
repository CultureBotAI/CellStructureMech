  label: nucleolar chromatin
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0030874
  essentiality: UNKNOWN
  role: Nucleolus-associated nuclear chromatin that includes the DNA encoding ribosomal
    RNA.
  evidence:
  - reference: GO:0030874
    notes: GO:0030874 defines nucleolar chromatin as nuclear chromatin associated
      with the nucleolus, including DNA that encodes rRNA.
- component_id: rna_polymerase_i_complex
  label: RNA polymerase I complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005736
  essentiality: UNKNOWN
  role: Nucleolar polymerase complex that transcribes ribosomal DNA to produce the
    large pre-rRNA precursor.
  evidence:
  - reference: GO:0005736
    notes: GO:0005736 identifies RNA polymerase I as a eukaryotic nuclear complex
      that typically produces rRNAs.
  - reference: DOI:10.1146/annurev.genet.33.1.261
    notes: Venema and Tollervey 1999 review RNA polymerase I transcription during
      Saccharomyces cerevisiae ribosome synthesis.
- component_id: small_subunit_processome
  label: small-subunit processome
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0032040
  essentiality: UNKNOWN
  role: Early preribosomal ribonucleoprotein complex that contains 35S pre-rRNA and
    U3 snoRNA in budding yeast.
  evidence:
  - reference: GO:0032040
    notes: GO:0032040 defines the small-subunit processome as a large early preribosomal
      ribonucleoprotein complex.
  - reference: DOI:10.1038/nature00769
    notes: Dragon et al. 2002 characterized a large nucleolar U3 ribonucleoprotein
      required for 18S rRNA biogenesis.
- component_id: box_haca_snornp_complex
  label: box H/ACA snoRNP complex
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0031429
  essentiality: UNKNOWN
  role: Small nucleolar ribonucleoprotein complex that guides pseudouridylation of
    rRNA during ribosome synthesis.
  evidence:
  - reference: GO:0031429
    notes: GO:0031429 defines the box H/ACA snoRNP complex as a nucleolar complex
      that catalyzes pseudouridylation of rRNA residues.
