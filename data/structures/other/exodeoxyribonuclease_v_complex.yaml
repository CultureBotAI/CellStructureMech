functions:
- function_id: exodeoxyribonuclease_v_activity
  label: exodeoxyribonuclease V activity
  grounding: GO:0008854
  description: RecBCD catalyzes ATP-dependent exonucleolytic cleavage of DNA to yield
    5'-phosphooligonucleotides.
  evidence:
  - reference: GO:0008854
    notes: GO:0008854 defines exodeoxyribonuclease V activity as ATP-dependent exonucleolytic
      DNA cleavage in either polarity to yield 5'-phosphooligonucleotides.
  - reference: InterPro:IPR006697
    notes: InterPro describes the RecBCD enzyme as a multisubunit enzyme composed
      of RecB, RecC, and RecD.
  - reference: PDB:1W36
    notes: PDB:1W36 contains the E. coli RecB, RecC, and RecD subunits bound to a
      DNA hairpin polymer entity.
