discussions:
- discussion_id: resolve_antapex_molecular_constituents
  prompt: Add antapex molecular components only after directly localized constituents
    and exact source-neutral family groundings have been identified.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO defines the dinoflagellate antapex as a point of the hypocone, but
    this pass did not find exact family-level evidence for antapex-specific molecular
    constituents.
  evidence:
  - reference: GO:0097684
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: antapical_horn_is_narrower_than_antapex
  prompt: Keep dinoflagellate antapical horn separate from the general dinoflagellate
    antapex unless curating the narrower GO:0097687 class.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: QuickGO identifies GO:0097687 as an is_a child of GO:0097684 and GO:0097687
    defines a horn-shaped antapex found in thecate species, so the antapical horn
    should remain a specialized child class of the general antapex.
  evidence:
  - reference: GO:0097684
  - reference: GO:0097687
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:0097684 as the general dinoflagellate antapex and leave
    the horn-shaped thecate antapical horn for separate GO:0097687 curation.
