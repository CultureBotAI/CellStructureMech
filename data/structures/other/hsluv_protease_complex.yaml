identifier: GO:0009376
label: HslUV protease complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An ATP-dependent protease complex present in many Bacteria and Eukarya,
  composed of stacking HslU (ClpY) hexameric AAA+ ATPase rings and HslV (ClpQ) dodecameric
  peptidase double rings; recognizes, unfolds, and translocates protein substrates
  such as the cell division inhibitor SulA into the HslV proteolytic chamber.
