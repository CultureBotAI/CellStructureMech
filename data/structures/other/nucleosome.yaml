identifier: GO:0000786
label: nucleosome
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A complex comprised of DNA wound around a multisubunit core and associated
  proteins, which forms the primary packing unit of DNA into higher order structures.
  The fundamental repeating nucleoprotein packaging unit of eukaryotic chromatin in
  yeasts, filamentous fungi, microalgae, and protists, consisting of ~147 base pairs
  of chromosomal DNA wrapped in 1.65 left-handed superhelical turns around a histone
  octamer composed of a central (H3–H4)2 tetramer flanked by two H2A–H2B dimers. Nucleosome
  positioning and post-translational histone modifications govern DNA accessibility
  for transcription, replication, and repair.
