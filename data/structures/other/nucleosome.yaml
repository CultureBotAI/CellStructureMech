causal_graphs:
- graph_id: nucleosome_mechanism
  title: Nucleosome assembly, DNA wrapping, and chromatin compaction
  description: Histone chaperones deposit an (H3–H4)2 tetramer and two H2A–H2B dimers
    onto ~147 bp of chromosomal DNA to form the canonical nucleosome, compacting genomic
    DNA and establishing the substrate for epigenetic regulation.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph separates DNA and chromatin proteins from the assembled
    nuclear chromosome but does not enumerate histone variants, condensin/cohesin,
    centromeres or telomere-specific complexes.
