taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Exhibits nucleosome (GO:0000786) in the core nucleosome particle and chromosomal
    chromatin fiber. Budding yeast carries its nuclear genome on chromosomes that
    are folded into a constrained three-dimensional nuclear arrangement.
  reference: DOI:10.1038/nature08973
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Characterized model system for nucleosome (GO:0000786) in the core nucleosome
    particle and chromosomal chromatin fiber. Reference yeast system used to model
    nuclear chromosome folding and spatial genome organization.
  reference: DOI:10.1038/nature08973
