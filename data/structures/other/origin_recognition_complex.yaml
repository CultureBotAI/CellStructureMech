identifier: GO:0000808
label: origin recognition complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multisubunit complex that is located at the replication origins of a
  chromosome. The conserved hexameric AAA+ ATPase protein complex (Orc1–Orc6) that
  binds specifically to chromosomal replication origins (such as autonomously replicating
  sequences in Saccharomyces cerevisiae or AT-rich origin tracts in Schizosaccharomyces
  pombe) throughout the cell cycle. In G1 phase, the origin recognition complex recruits
  Cdc6 and Cdt1 to load head-to-head double hexamers of the Mcm2–7 replicative helicase
  onto DNA.
