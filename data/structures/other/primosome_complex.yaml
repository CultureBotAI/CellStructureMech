identifier: GO:1990077
label: primosome complex
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A protein-DNA complex essential for initiation or restart of DNA replication
  in bacteria. At a minimum, it contains a DNA helicase and associated protein(s)
  which unwind the double-stranded DNA (dsDNA) and move along a single strand of DNA
  in the 5' to 3' direction. Typically, it also contains a primase which synthesizes
  a RNA primer.
