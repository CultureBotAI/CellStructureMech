identifier: cellstructuremech:holdfast
label: holdfast
structure_category: OTHER
structure_kind: OTHER
definition: A polar extracellular adhesive matrix of Caulobacter vibrioides composed
  of secreted holdfast polysaccharide that is anchored at the old cell pole or stalk
  tip and enables irreversible surface attachment.
definition_source: DOI:10.1128/JB.00112-19
mapping_status: PROPOSED
