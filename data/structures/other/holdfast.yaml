synonyms:
- synonym_text: Caulobacter holdfast
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/JB.00112-19
- synonym_text: holdfast adhesin
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/mBio.00294-17
parent_structures:
- GO:0031012
components:
- component_id: holdfast_polysaccharide
  label: holdfast polysaccharide
  component_type: POLYSACCHARIDE
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Caulobacter holdfast polysaccharide has glucose, 3-O-methylglucose,
    mannose, xylose and N-acetylglucosamine content, but no exact CHEBI or glycan
    accession was curated for the complete polymer.
  role: Forms the extracellular adhesive matrix that binds surfaces at the old cell
    pole or stalk tip.
  evidence:
  - reference: DOI:10.1128/JB.00276-19
    notes: Hershey et al. 2019 extracted C. crescentus holdfast material and surveyed
      the carbohydrate composition of the holdfast polysaccharide.
  - reference: DOI:10.1128/mBio.00294-17
    notes: Sprecher et al. 2017 treated the Caulobacter holdfast as a localized polysaccharide
      adhesin whose cohesive properties are developmentally regulated.
- component_id: hfa_holdfast_anchor
  label: HfaA-HfaB-HfaD holdfast anchor
  component_type: PROTEIN_COMPLEX
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - hfaA
  - hfaB
  - hfaD
  essentiality: DISPENSABLE
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: HfaA, HfaB and HfaD form holdfast anchoring machinery in Caulobacter,
    but no exact source-neutral complex CURIE was curated for this first record.
  role: Anchors the secreted holdfast matrix at the old cell pole or stalk tip so
    it remains attached to the cell surface.
  evidence:
  - reference: DOI:10.1128/JB.00112-19
    notes: Sulkowski et al. 2019 analyze HfaA, HfaB and HfaD as proteins that anchor
      Caulobacter holdfast at the old cell pole.
taxonomic_distribution:
- taxon_id: NCBITaxon:155892
  taxon_label: Caulobacter vibrioides
  presence: UNIVERSAL
  note: The Caulobacter holdfast is a polar adhesin of the C. vibrioides developmental
    cycle, with synthesis and surface adhesion regulated by cell cycle stage and environmental
    cues.
  reference: DOI:10.1128/mBio.00294-17
canonical_examples:
- taxon_id: NCBITaxon:565050
  taxon_label: Caulobacter vibrioides NA1000
  note: Caulobacter vibrioides NA1000 is a standard holdfast model used to dissect
    holdfast anchoring, polysaccharide composition and c-di-GMP-dependent adhesiveness.
  reference: DOI:10.1128/JB.00112-19
functions:
- function_id: surface_adhesion
  label: irreversible surface adhesion
  description: The holdfast glues the old pole or stalk tip to abiotic surfaces during
    the Caulobacter surface-attachment program.
  evidence:
  - reference: DOI:10.1128/mBio.00294-17
    notes: Sprecher et al. 2017 studied the cohesive properties that make the Caulobacter
      holdfast an adhesive surface organelle.
- function_id: old_pole_anchoring
  label: polar holdfast anchoring
  description: Hfa anchoring proteins retain the secreted holdfast matrix at the old
    cell pole or stalk tip instead of allowing it to be released into the medium.
  evidence:
  - reference: DOI:10.1128/JB.00112-19
    notes: Sulkowski et al. 2019 show that Hfa proteins form a multiprotein anchoring
      complex for old-pole holdfast retention.
evidence:
- reference: DOI:10.1128/JB.00112-19
  notes: Sulkowski NI et al. 2019, 'A Multiprotein Complex Anchors Adhesive Holdfast
    at the Old Cell Pole of Caulobacter crescentus', Journal of Bacteriology.
- reference: DOI:10.1128/JB.00276-19
  notes: Hershey DM et al. 2019, 'Composition of the Holdfast Polysaccharide from
    Caulobacter crescentus', Journal of Bacteriology.
- reference: DOI:10.1128/mBio.00294-17
  notes: Sprecher KS et al. 2017, 'Cohesive Properties of the Caulobacter crescentus
    Holdfast Adhesin Are Regulated by a Novel c-di-GMP Effector Protein', mBio.
causal_graphs:
- graph_id: holdfast_synthesis_anchoring_adhesion
  title: Holdfast polysaccharide is cohesion-tuned and anchored
  description: HfsK responds to c-di-GMP to tune adhesive-matrix cohesion, and Hfa
    proteins anchor the completed holdfast at the old pole or stalk tip so it can
    glue the cell to abiotic surfaces.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
