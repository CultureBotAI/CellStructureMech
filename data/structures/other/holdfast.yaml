    component_ref: holdfast_polysaccharide
  - node_id: hfa_holdfast_anchor
    label: HfaA-HfaB-HfaD holdfast anchor
    node_type: GENE_OR_PROTEIN
    component_ref: hfa_holdfast_anchor
  - node_id: old_pole_or_stalk_tip
    label: old pole or stalk tip
    node_type: CELLULAR_LOCALIZATION
  - node_id: holdfast
    label: holdfast
    node_type: STRUCTURE
    grounding: cellstructuremech:holdfast
  - node_id: abiotic_surface
    label: abiotic surface
    node_type: ENVIRONMENTAL_FACTOR
  edges:
  - subject: hfsk_c_di_gmp_effector
    predicate: tunes cohesion of
    object: holdfast_polysaccharide
    description: HfsK responds to c-di-GMP and tunes the cohesive properties of holdfast
      material before or during surface attachment.
    evidence:
    - reference: DOI:10.1128/mBio.00294-17
      notes: Sprecher et al. 2017 link a novel c-di-GMP effector to regulated Caulobacter
        holdfast cohesion.
  - subject: holdfast_polysaccharide
    predicate: forms
    object: holdfast
    description: The extracellular holdfast adhesin is built from secreted holdfast
      polysaccharide.
    evidence:
    - reference: DOI:10.1128/JB.00276-19
      notes: Hershey et al. 2019 chemically analyze isolated holdfast polysaccharide.
  - subject: hfa_holdfast_anchor
    predicate: anchors
    object: holdfast
    description: HfaA, HfaB and HfaD keep the holdfast attached at the old pole or
      stalk tip.
    evidence:
    - reference: DOI:10.1128/JB.00112-19
      notes: Sulkowski et al. 2019 characterize a multiprotein Hfa complex required
        for Caulobacter holdfast anchoring.
  - subject: holdfast
    predicate: localizes to
    object: old_pole_or_stalk_tip
    description: The anchored holdfast is retained at the old cell pole and, after
      stalk formation, at the stalk tip.
    evidence:
    - reference: DOI:10.1128/JB.00112-19
      notes: Sulkowski et al. 2019 focus on anchoring adhesive holdfast at the Caulobacter
        old cell pole.
  - subject: holdfast
    predicate: adheres cell to
    object: abiotic_surface
    description: Cohesive holdfast material provides the polar glue that irreversibly
      attaches Caulobacter cells to abiotic surfaces.
    evidence:
    - reference: DOI:10.1128/mBio.00294-17
      notes: Sprecher et al. 2017 investigate the Caulobacter holdfast adhesin as
        the developmentally regulated adhesive for surface attachment.
discussions:
- discussion_id: hfs_biosynthesis_boundary
  prompt: Keep Hfs synthesis, export and HfsK cohesion proteins out of the component
    table for this first holdfast record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - causal_graphs#holdfast_synthesis_anchoring_adhesion
  rationale: Hfs proteins synthesize, export or modify holdfast material before or
    during assembly. The HfsK effector is represented as graph machinery, Hfs synthesis/export
    factors are omitted until direct gene-level edges are curated, and the component
    table contains the holdfast polysaccharide plus the Hfa machinery that anchors
    the assembled adhesin.
  evidence:
  - reference: DOI:10.1128/JB.00276-19
    notes: Hershey et al. 2019 distinguish holdfast polysaccharide composition from
      genes required for its biosynthesis.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
