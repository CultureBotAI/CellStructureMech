identifier: GO:0033100
label: NuA3 histone acetyltransferase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A Gcn5-independent multisubunit complex that catalyzes the acetylation
  of histone H3. The budding yeast complex includes Sas3p, Taf30p, and Yng1p. The
  yeast Nucleosomal Acetyltransferase of histone H3 (NuA3) multiprotein complex in
  Saccharomyces cerevisiae and related fungi that specifically acetylates lysine 14
  (and lysine 23) of nucleosomal histone H3 to facilitate RNA polymerase II transcription
  elongation and DNA replication. The core NuA3 complex comprises the MYST-family
  catalytic subunit Sas3p, the H3K4me3-binding PHD-finger scaffold Yng1p, the H3K36me3-reading
  PWWP subunit Pdp3p, Nto1p, Eaf6p, and Taf14p.
