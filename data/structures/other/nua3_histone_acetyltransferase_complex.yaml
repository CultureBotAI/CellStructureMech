causal_graphs:
- graph_id: nua3_histone_acetyltransferase_complex_mechanism
  title: NuA3 histone acetyltransferase complex methylation-coupled H3K14 acetylation
  description: Yng1p and Pdp3p reader domains recruit the NuA3 histone acetyltransferase
    complex to H3K4me3- and H3K36me3-modified nucleosomes, activating Sas3p to acetylate
    H3K14 and stimulate transcription elongation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the GO-defined NuA3a constituents and their connection
    to histone acetyltransferase activity without resolving Yng1-dependent H3K4me3
    recognition, Sas3 catalytic chemistry or transcriptional recruitment.
