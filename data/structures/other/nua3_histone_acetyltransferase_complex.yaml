functions:
- function_id: histone_acetyltransferase_activity
  label: histone acetyltransferase activity
  grounding: GO:0004402
  description: Mediated by NuA3 histone acetyltransferase complex (GO:0033100) in
    the NuA3 histone H3 acetyltransferase holocomplex. The NuA3a complex catalyzes
    histone H3 acetylation through its Sas3 catalytic subunit and associates with
    H3K4me3 using Yng1p.
  evidence:
  - reference: GO:1990467
    notes: GO:1990467 defines NuA3a as a NuA3 complex that catalyzes histone H3 acetylation.
  - reference: GO:0004402
    notes: GO:0004402 is the Gene Ontology molecular-function term for histone acetyltransferase
      activity.
  - reference: DOI:10.1074/mcp.M114.038224
    notes: Gilbert et al. 2014 distinguished Yng1p-associated NuA3a from Pdp3p-associated
      NuA3b.
