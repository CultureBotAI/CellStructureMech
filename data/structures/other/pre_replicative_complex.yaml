identifier: GO:0036387
label: pre-replicative complex
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A protein-DNA complex that forms at the origin of replication during the
  initial step of DNA replication and allows the origin to become competent, or 'licensed',
  for replication. A multiprotein-DNA nucleoprotein assembly formed at chromosomal
  replication origins prior to S-phase initiation in eukaryotes, archaea, or bacteria
  that licenses the origin for bidirectional DNA synthesis. In eukaryotes (ORC–Cdc6–Cdt1–Mcm2-7)
  and bacteria (ATP-DnaA filaments recruiting DnaC-bound DnaB helicase hexamers onto
  oriC), the pre-replicative complex unwinds or poises origin DNA for replicative
  helicase activation.
