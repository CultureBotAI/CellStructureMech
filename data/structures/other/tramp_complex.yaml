identifier: GO:0031499
label: TRAMP complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multiprotein complex having distributive polyadenylation activity of
  a variety of RNA substrates including hypomodified and incorrectly folded tRNAs,
  pre-snRNAs, pre-snoRNAs, incorrectly spliced or processed pre-mRNAs, cryptic unstable
  transcripts (CUTs), pre-rRNAs and rRNA fragments released as part of rRNA processing.
  In S. cerevisiae, the complex consists of either Pap2 (also known as Trf4) or Trf5,
  Air1 or Air2, and Mtr4, and is involved in RNA 3'-end processing and in RNA surveillance
  and quality control.
