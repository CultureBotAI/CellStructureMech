components:
- component_id: phagophore_assembly_site_atg_machinery
  label: phagophore assembly site Atg machinery
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The phagophore assembly site is defined by assembled Atg autophagosome-formation
    machinery, but the exact cohort varies by autophagy mode and organism. No single
    source-neutral protein-family or protein-complex CURIE was curated for the full
    PAS-associated Atg machinery.
  role: Atg protein machinery that concentrates at the PAS and organizes phagophore
    expansion during autophagosome formation.
  evidence:
  - reference: GO:0000407
    notes: GO:0000407 defines the phagophore assembly site as a punctate site where
      Atg machinery assembles upon autophagy induction.
  - reference: DOI:10.1093/emboj/20.21.5971
    notes: Suzuki et al. 2001 localized multiple Apg proteins to the yeast pre-autophagosomal
      structure and showed APG gene function is required for its organization.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding yeast forms a phagophore assembly site near the vacuole during autophagosome
    biogenesis.
  reference: DOI:10.1093/emboj/20.21.5971
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Saccharomyces cerevisiae is the genetic and fluorescence microscopy model
    in which the PAS was defined as a punctate Apg/Atg organizing site for autophagosome
    formation.
  reference: DOI:10.1093/emboj/20.21.5971
functions:
- function_id: autophagosome_assembly_platform
  label: autophagosome assembly platform
  description: The phagophore assembly site concentrates Atg machinery at a punctate
    cytoplasmic site to organize phagophore expansion and autophagosome formation.
  evidence:
  - reference: GO:0000045
    notes: GO:0000045 defines autophagosome assembly as the formation of a double-membrane-bounded
      autophagosome.
  - reference: DOI:10.1093/emboj/20.21.5971
    notes: Suzuki et al. 2001 showed that PAS organization by concerted APG gene functions
      is essential for autophagosome formation in yeast.
