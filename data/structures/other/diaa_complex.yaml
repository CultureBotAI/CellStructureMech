- discussion_id: exclude_dnaa_oric
  prompt: Leave DnaA and oriC DNA out of the scoped GO:1990125 DiaA complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#diaa_regulator
  - causal_graphs#diaa_facilitates_initiation
  rationale: GO:1990125 denotes the free DiaA homotetramer. GO models the DiaA-containing
    DnaA-oriC protein-DNA assembly separately as GO:1990102, so DnaA and oriC are
    binding partners in that larger complex rather than constituents of GO:1990125.
  resolution_note: Curated only the DiaA homotetramer as the GO:1990125 component
    boundary and left DiaA-bound DnaA-oriC assembly as nonmechanistic graph scope.
  evidence:
  - reference: GO:1990125
    notes: GO:1990125 scopes the DiaA complex to the homotetramer.
  - reference: GO:1990102
    notes: GO:1990102 denotes the separate DnaA-DiaA-DNA complex that includes DnaA
      and oriC DNA.
  posed_by: codex
  posed_date: '2026-10-01'
  resolved_date: '2026-10-01'
