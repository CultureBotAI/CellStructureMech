  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:1990099 groups alternative DnaA-, DnaT/PriA/PriB-, DnaT/PriA/PriC-,
    and Rep/PriC-containing pre-primosomes. This generic chaperoning-protein component
    is intentionally ungrounded until the narrower family boundaries can be curated.
  role: Associated replication protein that chaperones the DNA helicase to replication-origin
