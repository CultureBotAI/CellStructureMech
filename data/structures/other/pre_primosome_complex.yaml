discussions:
- discussion_id: resolve_pre_primosome_component_groundings
  prompt: Resolve exact source-neutral DNA-helicase, helicase-chaperone and replication-site
    DNA groundings for the pre-primosome complex.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#dna_helicase
  - components#helicase_chaperone
  - components#replication_site_dna
  rationale: GO:1990099 defines the generic pre-primosome as a protein-DNA complex
    containing a DNA helicase, associated proteins that chaperone the helicase to
    DNA, and replication-origin or restart DNA. Exact source-neutral InterPro, Pfam,
    NCBIfam, UniProt family or SO sequence-feature CURIEs for these components need
    narrower curation before the labels can be grounded.
  evidence:
  - reference: GO:1990099
    notes: GO:1990099 defines the generic pre-primosome boundary.
  posed_by: codex
  posed_date: '2026-10-01'
- discussion_id: distinguish_pre_primosome_boundary
  prompt: Model the generic pre-primosome complex separately from concrete DnaB-DnaC
    pre-primosomes and primase-containing core primosomes.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - components#dna_helicase
  - components#helicase_chaperone
  - components#replication_site_dna
  - causal_graphs#pre_primosome_assembly
  rationale: GO:1990099 denotes a primase-lacking pre-primosome class. GO models GO:1990157,
    GO:1990158, GO:1990159 and GO:1990160 as narrower is-a children rather than as
    parts of every pre-primosome, and GO:1990098 models helicase-primase core primosomes
    separately.
  resolution_note: Curated GO:1990077 as the generic is-a parent, left the narrower
    DnaA-bound and restart-specific pre-primosomes out of has_part, and kept DnaG
    primase out of this primase-lacking record.
  evidence:
  - reference: GO:1990099
    notes: GO:1990099 defines pre-primosome complexes as lacking a primase component.
  - reference: GO:1990098
    notes: GO:1990098 denotes the DNA-bound core primosome class that contains at
      least one primase.
  - reference: GO:1990157
    notes: GO:1990157 denotes a narrower DnaA-DnaB-DnaC pre-primosome.
  - reference: GO:1990160
    notes: GO:1990160 denotes a narrower DnaB-DnaC-Rep-PriC pre-primosome.
  posed_by: codex
  posed_date: '2026-10-01'
  resolved_date: '2026-10-01'
