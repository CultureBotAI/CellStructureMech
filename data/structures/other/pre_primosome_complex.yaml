identifier: GO:1990099
label: pre-primosome complex
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: Any of the protein-DNA complexes that contain a DNA helicase and associated
  protein(s) at the origin of replication, and build up to assembling the core primosome.
  The associated protein(s) chaperone the helicase to the DNA, and assembly of the
  pre-primosome is essential for the initiation or restart of replication. Pre-primosome
  complexes lack a primase component.
definition_source: GO:1990099
mapping_status: PROPOSED
