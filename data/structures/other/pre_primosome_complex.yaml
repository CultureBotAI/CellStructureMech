  title: pre-primosome positions helicase before primase recruitment
  description: An associated replication protein chaperones a DNA helicase to an origin
    or restart DNA scaffold to form a primase-lacking pre-primosome used during replication
    initiation or restart.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the generic GO:1990099 boundary without resolving
    the DnaA-bound initiation assembly, alternative PriA/PriB/PriC/DnaT restart assemblies,
    Rep/PriC restart branch, ATPase cycling, DnaC release or later DnaG primase recruitment.
