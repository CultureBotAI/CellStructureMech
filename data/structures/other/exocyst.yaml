identifier: GO:0000145
label: exocyst
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A vesicle tethering complex peripherally associated with the plasma membrane
  that determines where vesicles dock and fuse. At least eight complex components
  are conserved between yeast and mammals.
