causal_graphs:
- graph_id: sec4_exocyst_targeting
  title: Sec4 and Sec15 link secretory vesicles to exocytic sites
  description: In budding yeast, Sec4p interacts with the exocyst component Sec15p
    on secretory vesicles, Sec3p marks polarized plasma-membrane sites, and the exocyst
    targets vesicles to those sites.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the Sec4p/Sec15p and Sec3p boundary relationships
    without asserting a complete order of exocyst assembly or vesicle fusion.
  nodes:
  - node_id: sec4p
    label: Sec4p
    node_type: GENE_OR_PROTEIN
    xrefs:
