  - node_id: sec15_exocyst_subunit
    label: Sec15 exocyst subunit
    node_type: GENE_OR_PROTEIN
    component_ref: sec15_exocyst_subunit
  - node_id: sec3_exocyst_subunit
    label: Sec3 exocyst subunit
    node_type: GENE_OR_PROTEIN
    component_ref: sec3_exocyst_subunit
  - node_id: exocyst
    label: exocyst
    node_type: STRUCTURE
    grounding: GO:0000145
  - node_id: exocytic_sites
    label: polarized exocytic sites
    node_type: CELLULAR_LOCALIZATION
  - node_id: secretory_vesicles
    label: secretory vesicles
    node_type: STRUCTURE
  - node_id: exocytosis
    label: exocytosis
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006887
  edges:
  - subject: sec4p
    predicate: interacts with
    object: sec15_exocyst_subunit
    description: GTP-bound Sec4p interacts with the exocyst component Sec15p on secretory
      vesicles.
    evidence:
    - reference: DOI:10.1093/emboj/18.4.1071
      notes: Guo et al. 1999 tested GTP-bound Sec4p interaction with Sec15p during
        vesicle targeting.
  - subject: sec15_exocyst_subunit
    predicate: is constituent of
    object: exocyst
    description: Sec15p is one of the Sec complex proteins in the yeast exocyst.
    evidence:
    - reference: DOI:10.1083/jcb.130.2.299
      notes: TerBush and Novick 1995 identified Sec15p in the Sec6/Sec8/Sec15 complex.
    - reference: DOI:10.1002/j.1460-2075.1996.tb01039.x
      notes: TerBush et al. 1996 named the Sec3p/Sec5p/Sec6p/Sec8p/Sec10p/Sec15p/Exo70p
        complex the exocyst and showed that it is required for exocytosis in Saccharomyces
        cerevisiae.
  - subject: sec3_exocyst_subunit
    predicate: marks
    object: exocytic_sites
    description: Sec3p marks polarized plasma-membrane sites for secretion in budding
      yeast.
    evidence:
    - reference: DOI:10.1016/S0092-8674(00)80948-4
      notes: Finger et al. 1998 characterized Sec3p as a spatial landmark for polarized
        secretion.
  - subject: exocyst
    predicate: targets
    object: secretory_vesicles
    description: The exocyst targets secretory vesicles to plasma-membrane sites used
      for exocytosis.
    evidence:
    - reference: DOI:10.1093/emboj/18.4.1071
      notes: Guo et al. 1999 framed the exocyst as a Sec4p effector system for targeted
        secretion.
  - subject: secretory_vesicles
    predicate: undergo
    object: exocytosis
    description: Exocyst-tethered secretory vesicles fuse at polarized plasma-membrane
      sites during exocytosis.
    evidence:
    - reference: DOI:10.1093/emboj/18.4.1071
      notes: Exocyst targeting of secretory vesicles to polarized plasma-membrane
        sites supports exocytosis.
