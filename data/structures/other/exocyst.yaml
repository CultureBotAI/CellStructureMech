- discussion_id: sec4p_is_effector_not_subunit
  prompt: Should Sec4p be curated as an exocyst component?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - causal_graphs#sec4_exocyst_targeting
  rationale: Sec4p acts through the exocyst component Sec15p during targeting of secretory
    vesicles; it is not part of the stable exocyst complex defined by the Sec and
    Exo subunits.
  resolution_note: 'Declined: Sec4p is represented as a regulatory GTPase node in
    the function graph rather than as a constituent exocyst subunit.'
  evidence:
  - reference: DOI:10.1093/emboj/18.4.1071
  posed_by: codex
  posed_date: '2026-09-12'
  resolved_date: '2026-09-12'
