identifier: GO:0030121
label: AP-1 adaptor complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heterotetrameric AP-type membrane coat adaptor complex that consists
  of beta1, gamma, mu1 and sigma1 subunits and links clathrin to the membrane surface
  of a vesicle; vesicles with AP-1-containing coats are normally found primarily in
  the trans-Golgi network. In at least humans, the AP-1 complex can be heterogeneric
  due to the existence of multiple subunit isoforms encoded by different genes (gamma1
  and gamma2, mu1A and mu1B, and sigma1A, sigma1B and sigma1C).
