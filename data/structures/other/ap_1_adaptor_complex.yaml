functions:
- function_id: ap1_late_golgi_cargo_sorting
  label: AP-1-dependent late-Golgi cargo sorting
  description: Yeast AP-1 contributes to clathrin-associated sorting of late Golgi
    and Golgi/early-endosome cargoes.
  evidence:
  - reference: DOI:10.1016/S1534-5807(02)00127-2
    notes: Valdivia et al. 2002 connect the yeast clathrin adaptor protein complex
      1 to efficient retention of a subset of late Golgi membrane proteins.
  - reference: DOI:10.1091/mbc.e15-09-0621
    notes: Whitfield et al. 2016 show that budding yeast has two AP-1 forms with alternate
      mu chains that confer distinct cargo-sorting functions.
