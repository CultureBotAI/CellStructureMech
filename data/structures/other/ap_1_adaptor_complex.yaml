discussions:
- discussion_id: ap1_tgn_coat_boundary
  prompt: Represent AP-1 as a TGN coat adaptor, not as the complete TGN clathrin coat.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - part_of
  rationale: GO:0030121 is a subtype of GO:0030131 clathrin adaptor complex and part
    of GO:0030130 clathrin coat of trans-Golgi network vesicle. This record therefore
    represents the AP-1 adaptor heterotetramer and links it to the containing TGN
    clathrin coat through part_of.
  evidence:
  - reference: GO:0030121
    notes: GO term and relationship source for AP-1 adaptor complexes.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
- discussion_id: mil1_not_ap1_core_subunit
  prompt: Exclude Mil1 from core AP-1 subunits.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#ap1_beta1_subunit
  - components#ap1_gamma_subunit
  - components#ap1_mu1_subunit
  - components#ap1_sigma1_subunit
  - causal_graphs#ap1_adaptor_complex_topology
  rationale: Whitfield et al. 2016 identify Mil1 as a conserved regulatory protein
    that binds the Apm2 alternate mu subunit and contributes to membrane recruitment.
    That supports a regulatory interaction, not stable beta1/gamma/mu1/sigma1 membership
    in the core AP-1 heterotetramer.
  evidence:
  - reference: DOI:10.1091/mbc.e15-09-0621
    notes: Whitfield et al. 2016 evidence for Mil1-Apm2 regulation.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
