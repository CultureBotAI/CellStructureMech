discussions:
- discussion_id: accessory_complex_family_boundary
  prompt: Should 19S, PAN, PA28, Mpa, Bpa, or Cpa subunits be listed as components
    of the generic proteasome accessory complex?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#accessory_complex_caps_20s_core
  rationale: GO:0022624 groups alternative proteasome caps and regulators. Those specific
    eukaryotic, archaeal, and actinobacterial complexes do not share one curated source-neutral
    component set.
  evidence:
  - reference: GO:0022624
    notes: GO descendants of GO:0022624 include specific regulatory particle, activator-complex,
      and proteasome-activating nucleotidase classes.
  - reference: DOI:10.3389/fmolb.2019.00023
    notes: Muller and Weber-Ban 2019 review multiple bacterial regulator families
      that can route proteins into actinobacterial 20S proteasomes.
  resolution_note: Left molecular components unset on this generic cap record and
    reserved family-specific subunits for future records about exact child accessory
    complexes.
