functions:
- function_id: proteasome_core_access_regulation
  label: proteasome core access regulation
  description: Proteasome accessory complexes cap 20S core particles and regulate
    substrate entry into, or product exit from, the proteolytic chamber.
  evidence:
  - reference: GO:0022624
    notes: GO:0022624 defines proteasome accessory complexes as caps that regulate
      entry into, or exit from, the proteasome core complex.
  - reference: DOI:10.3389/fmolb.2019.00023
    notes: Muller and Weber-Ban 2019 review bacterial regulator complexes that associate
      with the 20S core to recruit and internalize substrates.
