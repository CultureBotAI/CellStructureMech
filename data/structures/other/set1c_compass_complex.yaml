identifier: GO:0048188
label: Set1C/COMPASS complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A conserved protein complex that catalyzes methylation of histone H3.
  In Saccharomyces the complex contains Shg1p, Sdc1p, Swd1p, Swd2p, Swd3p, Spp1p,
  Bre2p, and the trithorax-related Set1p; in mammals it contains the catalytic subunit
  (SETD1A or SETD1B), WDR5, WDR82, RBBP5, ASH2L/ASH2, CXXC1/CFP1, HCFC1 and DPY30.
definition_source: GO:0048188
