identifier: GO:1990084
label: DnaA-Dps complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that negatively regulates strand-opening at the origin
  of replication, thereby interfering with replication initiation. This complex is
  thought to be involved in the regulation of replication under oxidative stress conditions.
  In E. coli, this complex is composed of DnaA and Dps.
