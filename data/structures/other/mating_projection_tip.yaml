functions:
- function_id: mating_projection_tip_polarized_growth_site
  label: mating-projection tip polarized-growth site
  description: The mating projection tip is the polarized apex of the pheromone-induced
    projection where membrane, polarisome, and actin-fusion structures organize growth
    and cell fusion.
  evidence:
  - reference: GO:0043332
    notes: GO:0043332 defines the mating projection tip as the projection apex and
      site of polarized growth.
  - reference: GO:0031563
    notes: GO:0031563 identifies a polarisome localized at the mating projection tip.
  - reference: GO:1990819
    notes: GO:1990819 identifies the actin fusion focus at the mating projection tip.
  - reference: DOI:10.1083/jcb.201411124
    notes: Dudin et al. 2015 connected the fission-yeast actin fusion focus with local
      cell-wall dissolution during cell fusion.
  - reference: DOI:10.1091/mbc.3.4.429
    notes: Read et al. 1992 tracked Spa2p segregation to Saccharomyces cerevisiae
      projection tips during mating projection formation.
