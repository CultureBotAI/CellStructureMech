discussions:
- discussion_id: localized_machinery_not_tip_components
  prompt: Keep polarisome proteins, actin-fusion-focus proteins, and hydrolases on
    their own structure or protein records rather than duplicating them as direct
    mating projection tip components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#mating_projection_tip_localized_structures
  rationale: GO:0043332 identifies the tip region, while GO:0031563 and GO:1990819
    identify localized assemblies at that region. Those assemblies are linked as tip-localized
    structures here, leaving their protein constituents on complex-specific or ProteinTraitsMech
    records.
  resolution_note: Curated the tip as a region with localized substructures and did
    not duplicate polarisome, actin-focus, or cell-wall hydrolase proteins as direct
    components.
  evidence:
  - reference: GO:0043332
    notes: GO:0043332 identifies the mating projection tip.
  - reference: GO:0031563
    notes: GO:0031563 identifies a mating-projection-tip polarisome.
  - reference: GO:1990819
    notes: GO:1990819 identifies the mating projection actin fusion focus.
  posed_by: codex
