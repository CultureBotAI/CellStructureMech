identifier: GO:0031390
label: Ctf18 RFC-like complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heptameric complex related to replication factor C, which loads the
  DNA polymerase processivity factor proliferating cell nuclear antigen (PCNA) onto
  DNA and plays a vital role in chromosome cohesion. In Saccharomyces the subunits
  are known as Ctf18p, Rfc2p, Rfc3p, Rfc4p, Rfc5p, Dcc1p, and Ctf8p.
