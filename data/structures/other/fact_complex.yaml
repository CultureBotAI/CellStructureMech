discussions:
- discussion_id: nhp6_not_core_fact_component
  prompt: Do not model Nhp6 as a core FACT complex constituent.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: Formosa et al. 2001 reported that Spt16/Cdc68 and Pob3 form a yeast heterodimer
    and that this heterodimer combines with Nhp6 to form the nucleosome-binding factor
    SPN, supporting Nhp6 as a DNA-binding cofactor for the yeast SPN activity rather
    than one of the two FACT core constituents.
  resolution_note: 'Declined: Nhp6 is important for the yeast SPN nucleosome-binding
    factor, but this record curates the FACT core as the Spt16-Pob3 complex.'
  evidence:
  - reference: DOI:10.1093/emboj/20.13.3506
    notes: Formosa et al. 2001 distinguished the Spt16-Pob3 heterodimer from its combination
      with the HMG protein Nhp6 in SPN.
  posed_by: codex
  posed_date: '2026-09-26'
  resolved_date: '2026-09-26'
