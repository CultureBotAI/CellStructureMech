identifier: GO:1990083
label: DnaA-Hda complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that inactivates the function of DnaA by inhibiting
  the phosphorylation of DnaA-ADP to DnaA-ATP and thereby preventing multiple events
  of replication initiation. In E. coli, this complex is composed of DnaA and Hda.
