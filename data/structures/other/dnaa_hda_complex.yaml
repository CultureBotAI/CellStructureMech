    notes: GO:1990083 defines the DnaA-Hda complex around DnaA and Hda constituents.
  posed_by: codex
  posed_date: '2026-10-01'
- discussion_id: distinguish_hda_bound_states
  prompt: Keep the DnaA-Hda complex distinct from the Hda-beta clamp complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - components#dnaa_initiator
  - components#hda_regulator
  - causal_graphs#dnaa_hda_rida
  rationale: GO:1990083 denotes the DnaA-Hda complex, whereas GO:1990085 separately
    denotes Hda bound to the DnaN beta clamp. Keyamura and Katayama 2011 studied DnaA-Hda
    contacts during RIDA in the context of DNA-loaded clamp-Hda but do not make the
    beta clamp a required constituent of the GO:1990083 entity.
  resolution_note: Curated only DnaA and Hda on the GO:1990083 complex and left the
    Hda-beta clamp regulatory state out of has_part and graph edges.
  evidence:
  - reference: GO:1990083
    notes: GO:1990083 denotes the DnaA-Hda complex.
  - reference: GO:1990085
    notes: GO:1990085 denotes the separately scoped Hda-beta clamp complex.
  - reference: PMID:15150238
    notes: Kurz et al. 2004 established Hda interaction with the beta sliding clamp.
  posed_by: codex
  posed_date: '2026-10-01'
  resolved_date: '2026-10-01'
