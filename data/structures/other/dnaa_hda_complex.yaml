- discussion_id: resolve_dnaa_hda_component_groundings
  prompt: Resolve exact source-neutral DnaA and Hda family groundings for the DnaA-Hda
    complex.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#dnaa_initiator
  - components#hda_regulator
  rationale: GO:1990083 names DnaA and Hda as the E. coli constituents of the DnaA-Hda
    complex. Exact source-neutral InterPro, Pfam, NCBIfam or UniProt family CURIEs
    need narrower curation before these components can be grounded.
  evidence:
