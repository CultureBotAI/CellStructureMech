- discussion_id: core_tfiih_nef3_boundaries
  prompt: Keep the GO:0000440 portion term distinct from both the generic TFIIH core
    complex and whole NEF3.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - part_of
  - components#ssl2_xpb_tfiih_core_subunit
  - components#tfb1_p62_tfiih_core_subunit
  - components#tfb2_p52_tfiih_core_subunit
  - components#ssl1_p44_tfiih_core_subunit
  - components#tfb4_p34_tfiih_core_subunit
  - components#tfb5_p8_tfiih_core_subunit
  - components#rad3_xpd_tfiih_core_subunit
  rationale: GO:0000440 denotes the GO:0000439 TFIIH core complex specifically when
    it is part of the GO:0000112 NEF3 complex. Rad2 is a partner constituent of NEF3,
    not part of the TFIIH core portion itself.
  resolution_note: Modeled GO:0000439 as an is-a parent, linked GO:0000112 through
    part_of, and curated only the seven TFIIH core constituents as components of this
    portion.
  evidence:
  - reference: GO:0000440
    notes: GO:0000440 identifies the TFIIH core complex portion when it is part of
      NEF3.
  - reference: GO:0000439
    notes: GO:0000439 identifies the broader TFIIH core complex.
  - reference: GO:0000112
    notes: GO:0000112 identifies whole NEF3 as containing Rad2p and the core TFIIH-Ssl2p
      complex.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
