discussions:
- discussion_id: resolve_orc_subunit_groundings
  prompt: Resolve exact source-neutral family groundings for Orc1-Orc6 origin-recognition-complex
    subunit classes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#orc1_subunit
  - components#orc2_subunit
  - components#orc3_subunit
  - components#orc4_subunit
  - components#orc5_subunit
  - components#orc6_subunit
  rationale: PMID:22405012 identifies Orc1, Orc4, Orc5, Orc2, Orc3 and Orc6 as the
    six Saccharomyces ORC subunits, while PMID:19344485 reports that Orc1-Orc5 appear
    to be present in all eukaryotes and that Orc6 is poorly conserved outside budding
    yeast. This record therefore leaves ORC subunit components label-only rather than
    asserting unverified exact InterPro, Pfam, NCBIfam or UniProtKB family CURIEs.
  evidence:
  - reference: PMID:19344485
    notes: The PubMed abstract for the ORC protein-family review summarizes Orc1-Orc6
      conservation across eukaryotes.
  - reference: PMID:22405012
    notes: The PubMed abstract for the 2012 Structure cryo-EM paper places the Saccharomyces
      Orc1-Orc6 subunits.
  posed_by: codex
  posed_date: '2026-09-27'
