- reference: GO:0003688
  notes: Gene Ontology molecular-function term for DNA replication origin binding.
- reference: PMID:1579162
  notes: PubMed record for the Bell and Stillman paper that purified a budding-yeast
    multiprotein ORC with ATP-dependent binding to cellular replication origins.
- reference: PMID:19344485
  notes: PubMed record for the origin-recognition-complex protein-family review covering
    Orc1-Orc6 conservation across eukaryotes.
- reference: PMID:22405012
  notes: PubMed record for a Saccharomyces cerevisiae ORC-Cdc6-origin-DNA cryo-EM
    paper that places the six ORC subunits.
causal_graphs:
- graph_id: orc_binds_replication_origins
  title: ORC binds replication origins
  description: The six Saccharomyces Orc subunits form an origin recognition complex
    that binds replication-origin DNA.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records yeast ORC subunit membership and DNA-origin binding
    without resolving origin licensing, Cdc6/Cdt1/MCM loading, ATPase-state transitions
    or metazoan ORC subcomplexes.
