taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: COMMON
  note: The ORC protein-family review reports that Orc1-Orc5 appear to be present
    in all eukaryotes and that Orc6 is poorly conserved outside budding yeast.
  reference: PMID:19344485
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Bell and Stillman originally purified the origin recognition complex from
    budding yeast and assayed origin-specific DNA binding in Saccharomyces cerevisiae.
  reference: PMID:1579162
functions:
- function_id: dna_replication_origin_binding
  label: DNA replication origin binding
  grounding: GO:0003688
  description: The origin recognition complex recognizes DNA replication origins in
    an ATP-dependent manner.
  evidence:
  - reference: GO:0003688
    notes: GO:0003688 is the Gene Ontology molecular-function term for DNA replication
      origin binding.
  - reference: PMID:1579162
    notes: The PubMed abstract for Bell and Stillman 1992 reports ATP-dependent origin-specific
      DNA binding by the Saccharomyces cerevisiae origin recognition complex.
evidence:
- reference: GO:0005664
  notes: Gene Ontology cellular-component term for the nuclear origin of replication
    recognition complex.
- reference: GO:0000808
