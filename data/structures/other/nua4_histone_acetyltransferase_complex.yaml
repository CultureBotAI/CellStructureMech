functions:
- function_id: histone_acetyltransferase_activity
  label: histone acetyltransferase activity
  grounding: GO:0004402
  description: The NuA4 complex acetylates histone H4 and H2A N-terminal tails through
    its Esa1 catalytic subunit.
  evidence:
  - reference: GO:0035267
    notes: GO:0035267 defines NuA4/TIP60 as a complex having histone acetylase activity
      on chromatin.
  - reference: GO:0004402
    notes: GO:0004402 is the Gene Ontology molecular-function term for histone acetyltransferase
      activity.
  - reference: DOI:10.1128/MCB.24.5.1884-1896.2004
    notes: Doyon et al. 2004 describe the yeast NuA4 multisubunit complex as responsible
      for acetylating histone H4 and H2A N-terminal tails.
