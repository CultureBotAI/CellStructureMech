identifier: GO:0035267
label: NuA4 histone acetyltransferase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex having histone acetylase activity on chromatin, as well as ATPase,
  DNA helicase and structural DNA binding activities. The complex is thought to be
  involved in double-strand DNA break repair. Subunits of the human complex include
  HTATIP/TIP60, TRRAP, RUVBL1, BUVBL2, beta-actin and BAF53/ACTL6A. In yeast, the
  complex has 13 subunits, including the catalytic subunit Esa1 (homologous to human
  Tip60).
definition_source: GO:0035267
