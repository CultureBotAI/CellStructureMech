discussions:
- discussion_id: resolve_bud_tip_polarisome_family_groundings
  prompt: Resolve exact source-neutral family groundings for Spa2, Pea2, and Bud6/Aip3
    at the cellular bud tip.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#spa2_pea2_scaffold
  - components#bud6_actin_nucleation_factor
  rationale: This localized record deliberately reuses the reviewed-label-only Saccharomyces
    polarisome cohorts from the broader polarisome record instead of guessing InterPro,
    Pfam, NCBIfam, or UniProtKB family groundings whose broader homologous families
    do not exactly delimit the bud-tip complex.
  evidence:
  - reference: DOI:10.1128/MCB.18.7.4053
    notes: Sheu et al. 1998 delimited the Spa2, Pea2, and Bud6/Aip3 12S polarisome
      in budding yeast.
  posed_by: codex
  posed_date: '2026-09-28'
- discussion_id: bni1_aip5_exocyst_and_mapk_boundary
  prompt: Keep Bni1, Aip5, the exocyst, and MAPK signaling proteins outside the first
    cellular-bud-tip polarisome component boundary.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#spa2_pea2_scaffold
  - components#bud6_actin_nucleation_factor
  - causal_graphs#bud_tip_12s_polarisome_topology
  rationale: GO:0000133 and later Saccharomyces polarisome studies implicate Bni1,
    Aip5, and other actin-assembly factors in the broader polarisome, but Sheu et
    al. 1998 directly support a Spa2/Pea2/Bud6 12S complex and discuss Bni1 only as
    a possible additional component. The exocyst is a separate bud-tip-localized complex
    and the MAPK factors tested by Sheu et al. are interacting signaling proteins,
    not curated constituents of the GO:0031561 structure.
  resolution_note: Curated the directly supported Spa2/Pea2 and Bud6/Aip3 12S complex
    and deferred Bni1, Aip5, Myo2, exocyst, and MAPK pathway proteins until exact
    localized component evidence is curated.
  evidence:
  - reference: GO:0031561
    notes: GO:0031561 identifies the localized bud-tip polarisome complex.
  - reference: GO:0000145
    notes: GO:0000145 identifies the exocyst as a distinct complex.
  - reference: DOI:10.1128/MCB.18.7.4053
    notes: Sheu et al. 1998 directly assayed Spa2, Pea2, and Bud6 in the 12S polarisome
      while treating MAPK factors and Bni1 outside that directly demonstrated component
      set.
  posed_by: codex
  posed_date: '2026-09-28'
  resolved_date: '2026-09-28'
