  essentiality: CONDITIONAL
  gene_symbols:
  - SPA2
  - PEA2
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Spa2 and Pea2 are curated as the Saccharomyces scaffold cohort
    that helps delimit the bud-tip polarisome; no exact source-neutral family CURIE
    was assigned for this grouped fungal component.
  role: Scaffold proteins that localize to budding growth sites and form a stable
    pair in the Saccharomyces 12S polarisome.
  evidence:
  - reference: DOI:10.1083/jcb.135.3.725
    notes: Valtz and Herskowitz 1996 showed that Pea2 and Spa2 localize to polarized-growth
      sites in budding and mating cells and depend on one another for stable localization.
  - reference: DOI:10.1128/MCB.18.7.4053
    notes: Sheu et al. 1998 found that Spa2 interacts with Pea2 in two-hybrid and
      coimmunoprecipitation experiments.
- component_id: bud6_actin_nucleation_factor
  label: Bud6/Aip3 actin nucleation-promoting factor
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - BUD6
  - AIP3
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bud6/Aip3 is curated as the Saccharomyces actin-associated 12S
    polarisome constituent from Sheu et al. 1998; no exact family grounding was assigned
    for a broader fungal cohort.
  role: Actin-associated polarity protein that cosediments with Spa2 and Pea2 in the
    budding-yeast 12S polarisome.
  evidence:
  - reference: DOI:10.1128/MCB.18.7.4053
    notes: Sheu et al. 1998 showed that Spa2 interacts with Bud6/Aip3 by two-hybrid
      analysis and that a significant portion of Spa2, Pea2, and Bud6 cosediments
      as a 12S multiprotein complex.
