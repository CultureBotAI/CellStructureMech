functions:
- function_id: bud_tip_polarized_morphogenesis
  label: bud-tip polarized morphogenesis
  description: The cellular bud tip polarisome concentrates Spa2, Pea2, and Bud6/Aip3
    at budding growth sites to support polarized morphogenesis in Saccharomyces cerevisiae.
  evidence:
  - reference: GO:0031561
    notes: GO:0031561 defines the cellular bud tip polarisome by its role in determining
      cell polarity at the tip of a growing fungal bud.
  - reference: DOI:10.1128/MCB.18.7.4053
    notes: Sheu et al. 1998 proposed that Spa2, Pea2, and Bud6 act together in a complex
      to promote polarized morphogenesis.
