functions:
- function_id: poly_a_specific_ribonuclease_activity
  label: poly(A)-specific ribonuclease activity
  grounding: GO:0004535
  description: CCR4-NOT supplies the major Ccr4/Caf1-dependent cytoplasmic poly(A)-specific
    exonuclease activity in budding yeast.
  evidence:
  - reference: GO:0004535
    notes: GO:0004535 is the Gene Ontology molecular-function term for poly(A)-specific
      ribonuclease activity.
  - reference: DOI:10.1016/s0092-8674(01)00225-2
    notes: Tucker et al. 2001 showed that Ccr4 and Caf1 are critical components of
      the major Saccharomyces cerevisiae cytoplasmic mRNA deadenylase.
- function_id: deadenylation_dependent_mrna_decay
  label: nuclear-transcribed mRNA catabolic process, deadenylation-dependent decay
  grounding: GO:0000288
  description: CCR4-NOT participates in deadenylation-dependent mRNA decay by shortening
    cytoplasmic mRNA poly(A) tails.
  evidence:
  - reference: GO:0000288
    notes: GO:0000288 is the Gene Ontology biological-process term for deadenylation-dependent
      decay of nuclear-transcribed mRNAs.
  - reference: DOI:10.1016/s0092-8674(01)00225-2
    notes: Tucker et al. 2001 showed that Ccr4 and Caf1 are required for normal mRNA
      deadenylation in vivo.
