- discussion_id: defer_dnac_stoichiometry
  prompt: Leave DnaC stoichiometry unresolved rather than choosing a DnaB6-DnaC3 or
    DnaB6-DnaC6 narrow subcomplex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - synonyms
  - components#dnac_helicase_loader
  rationale: GO:1990100 uses DnaB6-DnaC3 and DnaB6-DnaC6 as narrow synonyms for the
    broader DnaB-DnaC complex. The broader record can safely assert hexameric DnaB
    from the GO definition without committing the DnaC component row to one narrower
    loading-state stoichiometry.
  resolution_note: Curated DnaB6-DnaC3 and DnaB6-DnaC6 as narrow synonyms and left
    DnaC stoichiometry unset.
  evidence:
