discussions:
- discussion_id: resolve_endocytic_clathrin_coat_component_groundings
  prompt: Resolve exact source-neutral groundings for endocytic-vesicle clathrin triskelions
    and adaptor or cargo-selection factors.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#clathrin_triskelion_scaffold
  - components#endocytic_clathrin_adaptors
  rationale: GO:0030128 exactly grounds the endocytic-vesicle clathrin coat and GO:0030122
    captures its exact AP-2 adaptor-complex part, but this initial pass keeps the
    clathrin triskelion scaffold and broader non-AP-2 endocytic adaptor classes reviewed-label-only
    until exact source-neutral complex or protein-family identifiers are curated.
  evidence:
  - reference: GO:0030128
  - reference: GO:0030122
  - reference: GO:0030118
  - reference: DOI:10.1016/j.devcel.2005.04.014
  posed_by: codex
  posed_date: '2026-09-16'
- discussion_id: keep_endocytic_clathrin_coat_distinct_from_broad
  prompt: Keep the endocytic-vesicle clathrin coat distinct from the broader clathrin
    vesicle coat record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - part_of
  rationale: GO:0030128 is the clathrin coat subtype on endocytic vesicles, while
    GO:0030125 is the broader clathrin vesicle coat parent that also covers TGN and
    synaptic vesicle subtypes.
  resolution_note: Represented GO:0030128 as a child of GO:0030125 and as part of
    the GO:0030669 endocytic vesicle membrane rather than duplicating the broad clathrin
    vesicle coat record.
  evidence:
  - reference: GO:0030128
    notes: GO term for the endocytic vesicle clathrin coat.
  - reference: GO:0030125
    notes: GO term for the broader clathrin vesicle coat parent.
  - reference: GO:0030130
    notes: GO term for the TGN vesicle sibling clathrin coat subtype.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
