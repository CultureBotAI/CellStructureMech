functions:
- function_id: clathrin_dependent_endocytosis
  label: clathrin-dependent endocytosis
  grounding: GO:0072583
  description: The clathrin coat of endocytic vesicles participates in clathrin-dependent
    endocytosis by organizing coated endocytic vesicles.
  evidence:
  - reference: GO:0072583
    notes: GO:0072583 denotes endocytic uptake through clathrin-coated pits that form
      clathrin-coated endocytic vesicles.
  - reference: DOI:10.1016/j.cell.2005.09.024
    notes: Kaksonen, Toret and Drubin 2005 analyzed the modular clathrin- and actin-mediated
      endocytic machinery in yeast.
