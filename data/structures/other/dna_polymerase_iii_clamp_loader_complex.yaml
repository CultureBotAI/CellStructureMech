identifier: GO:0043846
label: DNA polymerase III, clamp loader complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heptamer that includes the tau and gamma products of the dnaX gene and
  the chi/psi subcomplex. Confers structural asymmetry that allows the polymerase
  to replicate both leading and lagging strands.
definition_source: GO:0043846
mapping_status: PROPOSED
