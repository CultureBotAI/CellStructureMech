causal_graphs:
- graph_id: clamp_loader_beta_clamp_loading
  title: Clamp loader assembles the beta clamp on DNA
  description: The Pol III clamp loader combines DnaX, delta, delta-prime, chi, and
    psi subunits to open and load the beta sliding clamp on primer-template DNA.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures subunit membership and GO-level clamp loading without
    modelling ATPase-state transitions, clamp-ring opening geometry, or polymerase
    switching at the replication fork.
