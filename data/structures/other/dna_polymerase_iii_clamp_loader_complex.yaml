functions:
- function_id: dna_clamp_loading
  label: DNA clamp loader activity
  grounding: GO:0003689
  description: The DNA polymerase III clamp-loader complex opens the beta sliding-clamp
    ring and loads it around primer-template DNA using its ATPase motor.
  evidence:
  - reference: GO:0003689
    notes: GO:0003689 defines DNA clamp loader activity as ATP-hydrolysis-driven opening
      and closing of a sliding clamp around DNA duplex.
  - reference: PMID:11525729
    notes: Jeruzalmi et al. 2001 described the E. coli gamma complex as an AAA+ ATPase
      that loads the beta sliding clamp onto DNA.
- function_id: dna_replication
  label: DNA replication
  grounding: GO:0006260
  description: The clamp-loader complex helps the Pol III holoenzyme coordinate leading-
    and lagging-strand DNA replication.
  evidence:
  - reference: GO:0043846
    notes: GO:0043846 defines the clamp-loader complex by its structural asymmetry
      in leading- and lagging-strand replication.
  - reference: GO:0006260
    notes: GO:0006260 is the Gene Ontology biological-process term for DNA replication.
