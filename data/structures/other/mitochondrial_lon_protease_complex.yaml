discussions:
- discussion_id: identity_and_substrate_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Distinguish the mitochondrial oligomer from its protein subunit, substrates
    and related proteases.
  rationale: Pim1 is a single gene product but forms a structurally resolved oligomer.
    The InterPro family includes chloroplastic proteins; matrix Lon is distinct from
    membrane-anchored i-AAA and m-AAA complexes.
  resolution_note: Mint a mitochondrial assembly identity and use GO peptidase complex
    only as parent. Fully paginated QuickGO Lon/Pim1 searches and OLS GO label/synonym
    searches for Lon protease, Pim1, mitochondrial Lon and protease La did not resolve
    an exact cellular-component term. Keep the cargo chain, assay substrate and expression
    host outside canonical composition. Do not infer universal copy number or broad
    taxonomic prevalence from the yeast experiments.
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.101694
    notes: Structurally distinct oligomer, separate from substrate.
  - reference: InterPro:IPR027503
    notes: Broader source-neutral component family.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: historical_oligomer_conflict
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile historical seven-subunit and modern six-subunit Pim1 preparations
    without assuming a universal native oligomer.
  rationale: The 1999 study interpreted a seven-subunit ring from mass measurements
    and electron microscopy of C-terminally His-tagged protein overexpressed in yeast
    and purified from mitochondria, including cross-linked preparations. The 2022
    structure instead resolves six subunits of mature N-terminally His-tagged yeast
    protein expressed in bacteria and frozen with ATPgammaS and copurified substrate.
  notes: Neither preparation alone establishes an invariant in situ mitochondrial
    copy count. Canonical stoichiometry and physical mass are therefore omitted; preparation
    differences and conflicting conclusions remain visible.
  evidence:
  - reference: DOI:10.1073/pnas.96.12.6787
    notes: Primary Methods, Results and Discussion inspected from the publisher.
  - reference: DOI:10.1016/j.jbc.2022.101694
    notes: Results explicitly contrast the prior interpretation; the closed substrate-bound
      hexamer is directly resolved.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: publication_archive_accessions
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Resolve the paper's inconsistent structural accessions against native archives.
  rationale: The primary Data availability section lists EMD-25505 and PDB 7XSO. Native
    matching records are EMD-25502 and PDB 7SXO; each cites the exact Pim1 publication
    and crosslinks the other.
  resolution_note: Adopt only EMD-25502 and 7SXO as datasets. Native EMD-25505 describes
    a SARS-CoV-2 spike reconstruction, while 7XSO describes a CRISPR-Cas gRAMP structure.
    The publication strings are retained here solely to document the discrepancy,
    not as identifiers for Pim1. Global A6B1 archive stoichiometry includes substrate
    and does not confirm the 1999 seven-Pim1 interpretation.
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.101694
    notes: Inspected Data availability section.
  - reference: https://www.rcsb.org/structure/7SXO
    notes: Matching entry, primary citation and assembly metadata.
  - reference: https://www.ebi.ac.uk/emdb/EMD-25502
    notes: Matching native map header and reciprocal PDB link.
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
- discussion_id: source_detail_discrepancies
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile publication and archive detail differences before asserting exact
    substrate or construct boundaries.
  rationale: The article describes a nine-residue polyalanine substrate model, whereas
    the native PDB entity is a 12-residue unknown sequence. The paper reports approximately
    3.21 angstrom resolution versus the archive's 3.3 angstrom. Methods begin the
    construct at Met182 while the figure schematic labels 181, and Figure 1's pore-loop
    residue notation is internally inconsistent.
  notes: These differences do not change the supported six-Pim1 assembly in the 2022
    preparation. Avoid asserting substrate identity, an exact pore-loop residue claim,
    universal construct boundaries or biological size from these source details.
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.101694
    notes: Results, Methods, Figures 1 and 3 and their captions.
  - reference: https://www.rcsb.org/structure/7SXO
    notes: Native polymer entity and experimental metadata.
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: physiological_roles_unresolved
  kind: CURATION_TODO
  status: OPEN
  prompt: Test the insertion and C-terminal extension with physiological substrates
    or binding partners.
  rationale: The insertion mutants retain beta-casein degradation in vitro, but that
    does not establish native dispensability. Substrate/adaptor recruitment, DNA binding,
    peptide exit and a requirement for substrate in hexamerization are hypotheses
    in the inspected study. The C-terminal Results heading is stronger than the supporting
    experiments and Discussion.
  notes: Do not encode these proposed roles or a two-residue hand-over-hand translocation
    step as directly measured causal events. The latter is an interpretation of static
    structural states rather than a time-resolved trajectory.
  evidence:
  - reference: DOI:10.1016/j.jbc.2022.101694
    notes: Results, Discussion and Figure 3 bound the tested interventions and proposed
      mechanisms.
  posed_by: codex
  posed_date: '2026-10-05'
