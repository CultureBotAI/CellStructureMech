datasets:
- accession: PDB:7SXO
  title: Cryo-EM structure of substrate-translocating S. cerevisiae Lon (PIM1)
  dataset_type: STRUCTURAL_IMAGING
  repository: OTHER
  organism: Saccharomyces cerevisiae S288C (NCBITaxon:559292)
  description: Experimental cryo-EM atomic model of a recombinant yeast Lon-substrate
    preparation, not an identity-equivalent record for every mitochondrial Lon assembly.
  conditions:
  - Mature N-terminally His-tagged yeast Pim1 expressed in E. coli BL21 (DE3) Codon
    Plus RIPL
  - 3 mg/ml WT protein incubated with 1 mM ATPgammaS on ice for 20 minutes before
    freezing
  platform: Single-particle cryo-EM
  url: https://www.rcsb.org/structure/7SXO
  publication: DOI:10.1016/j.jbc.2022.101694
  findings: Assembly 1 contains six Pim1 chains A-F and an additional substrate chain
    G. Its global A6B1 heptameric annotation counts substrate, not seven Pim1 subunits.
    The model annotates four ATP and two ADP molecules; this is distinct from ATPgammaS
    used in preparation.
  notes: Native entry, polymer entities and assembly inspected. Entity 1 maps to UniProt
    P36775 and taxon 559292. Entity 2 is a 12-residue unknown-sequence substrate annotated
    to the E. coli host, but its biological identity is not established. No coordinates
    are hosted; construct mass and map resolution are not canonical biological properties.
  evidence:
  - reference: https://www.rcsb.org/structure/7SXO
    supports: SUPPORT
    notes: Native archive crosslinks EMD-25502 and matches the primary title, authors,
      DOI and PMID. Archive resolution is 3.3 angstrom; the paper reports approximately
      3.21 angstrom.
