discussions:
- discussion_id: resolve_dnab_dnag_family_groundings
  prompt: Resolve exact source-neutral DnaB and DnaG family groundings for the DnaB-DnaG
    complex.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#dnab_helicase
  - components#dnag_primase
  rationale: GO:1990156 defines DnaB and DnaG as constituents of this primase-helicase
    complex. Exact source-neutral InterPro, Pfam, NCBIfam or UniProt family boundaries
    for these component classes need narrower curation before the labels can be grounded.
  evidence:
  - reference: GO:1990156
    notes: GO:1990156 defines the DnaB-DnaG complex around DnaB and DnaG constituents.
  posed_by: codex
  posed_date: '2026-10-01'
- discussion_id: model_core_primosome_as_part_of
  prompt: Model the GO:1990098 core primosome relationship as parthood rather than
    DnaB-DnaG complex is-a core primosome complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - part_of
  - parent_structures
  rationale: OLS reports GO:0033202 as the direct GO:1990156 is-a parent and reports
    GO:1990098 as a separate hierarchical parent. GO:1990098 denotes a protein-DNA
    complex containing a helicase and primase, while GO:1990156 is a DnaB-DnaG protein
    complex.
  resolution_note: Curated GO:0033202 under parent_structures and GO:1990098 under
    part_of.
  evidence:
  - reference: GO:1990156
    notes: GO:1990156 defines DnaB-DnaG as a protein complex.
  - reference: GO:1990098
    notes: GO:1990098 defines a core primosome as a protein-DNA complex containing
      at least one DNA helicase and one primase.
  posed_by: codex
  posed_date: '2026-10-01'
  resolved_date: '2026-10-01'
