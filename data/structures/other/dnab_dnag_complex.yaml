  label: DnaG primase
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - dnaG
  stoichiometry: 3 primase copies per DnaB hexamer in the stabilized E. coli complex
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: DnaG is represented as the primase constituent named by GO:1990156;
    exact source-neutral InterPro, Pfam, NCBIfam or UniProt family boundaries were
