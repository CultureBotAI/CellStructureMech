identifier: GO:1990156
label: DnaB-DnaG complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex containing homohexameric DnaB helicase, and DnaG (a
  primase). Facilitates the unwinding of double-stranded DNA and the synthesis of
  RNA primer sequences during DNA replication and repair in Prokaryotes.
definition_source: GO:1990156
