    DnaB and DnaG reviewed-label-only components, E. coli scope, DNA-replication-primer-synthesis
    function evidence, GO/PubMed/DOI evidence, a nonmechanistic primer-synthesis graph,
    and grounding/parthood discussions.
  llm_assisted: true
