  role: Primase constituent that synthesizes RNA primer sequences while bound to DnaB
    helicase.
  evidence:
  - reference: GO:1990156
    notes: GO:1990156 defines the DnaB-DnaG complex as containing DnaG primase.
  - reference: PMID:14557266
    notes: Tougu and Marians 2003 reported three DnaG primase molecules per E. coli
      DnaB hexamer in their stabilized primase-helicase complex.
