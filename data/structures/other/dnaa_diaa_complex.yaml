    Pfam, NCBIfam or UniProt family boundaries were not curated in this pass.
  role: Homotetramer-forming DiaA constituent that binds multiple DnaA molecules at
    oriC.
  evidence:
  - reference: GO:1990102
    notes: GO:1990102 defines the DnaA-DiaA complex as containing a tetramer of DiaA
      attached to DnaA on oriC DNA.
  - reference: GO:1990125
    notes: GO:1990125 defines the DiaA complex as a homotetrameric protein complex.
  - reference: PMID:17699754
