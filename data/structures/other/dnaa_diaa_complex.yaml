  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: DnaA is represented as the oriC-bound initiator protein constituent
    named by GO:1990102; exact source-neutral InterPro, Pfam, NCBIfam or UniProt family
    boundaries were not curated in this pass.
  role: DnaA initiator constituent bound to oriC DNA and contacted by DiaA.
  evidence:
  - reference: GO:1990102
    notes: GO:1990102 defines the DnaA-DiaA complex as DiaA attached to multiple DnaA
      molecules bound to oriC DNA.
  - reference: PMID:15326179
    notes: Ishida et al. 2004 identified DiaA as an E. coli DnaA-associating factor
      that binds directly to DnaA.
  - reference: PMID:17699754
