identifier: GO:0000112
label: nucleotide-excision repair factor 3 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: One of several protein complexes involved in nucleotide-excision repair;
  possesses endodeoxynuclease and DNA helicase activities. In S. cerevisiae, it is
  composed of Rad2p and the core TFIIH-Ssl2p complex (core TFIIH is composed of Rad3p,
  Tfb1p, Tfb2p, Ssl1p, Tfb4p and Tfb5p. Note that Ssl2p is also called Rad25p).
