- discussion_id: torc2_boundary
  prompt: Keep TORC2-specific Avo1, Avo2, Avo3/Tsc11, Bit61, Slm1 and Slm2 outside
    this TORC1 record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#tor_kinase_torc1_subunit
  - components#lst8_torc1_subunit
  - causal_graphs#yeast_torc1_subunit_signaling
  rationale: GO separates rapamycin-sensitive TORC1 from TORC2 as sibling complexes.
    Tor2 and Lst8 can occur in yeast TORC2, but Avo1, Avo2, Avo3/Tsc11, Bit61, Slm1
    and Slm2 are TORC2-side subunits outside GO:0031931.
  resolution_note: 'Declined: TORC2-only subunits were treated as constituents of
    GO:0031932 rather than GO:0031931.'
  evidence:
  - reference: GO:0031931
    notes: Gene Ontology cellular-component term for the TORC1 complex.
  - reference: GO:0031932
    notes: Gene Ontology cellular-component term for the TORC2 complex.
  - reference: DOI:10.1016/s1097-2765(02)00636-6
    notes: Loewith et al. 2002 separated budding-yeast TOR into two complexes and
      assigned TORC1 to the rapamycin-sensitive growth-control branch.
  posed_by: codex
  posed_date: '2026-09-18'
  resolved_date: '2026-09-18'
- discussion_id: rag_gator_ego_boundary
  prompt: Keep Gtr1-Gtr2, GATOR1/SEACIT, GATOR2/SEACAT and Ragulator/EGO outside this
    TORC1 constituent record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#tor_kinase_torc1_subunit
  - causal_graphs#yeast_torc1_subunit_signaling
  rationale: Gtr1-Gtr2 and its GATOR and Ragulator/EGO control complexes are upstream
    TORC1-pathway regulators or anchors with their own GO cellular-component identities,
    not constituents of the TORC1 catalytic complex.
  resolution_note: 'Declined: Rag-family and SEA/GATOR/EGO neighbors were left as
    separate complexes outside GO:0031931.'
