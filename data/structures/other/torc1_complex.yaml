identifier: GO:0031931
label: TORC1 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that contains at least TOR (target of rapamycin) and
  Raptor (regulatory-associated protein of TOR), or orthologs of, in complex with
  other signaling components. Mediates the phosphorylation and activation of S6K.
  In Saccharomyces, the complex contains Kog1p, Lst8p, Tco89p, and either Tor1p or
  Tor2p.
definition_source: GO:0031931
