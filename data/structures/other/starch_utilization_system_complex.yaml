- discussion_id: exclude_susab_susr_from_outer_membrane_complex
  prompt: Should SusA, SusB, or SusR be curated as constituents of the outer-membrane
    starch utilization system complex?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#susc_tonb_dependent_transporter
  - components#susd_starch_binding_lipoprotein
  - components#suse_starch_binding_lipoprotein
  - components#susf_starch_binding_lipoprotein
  - components#susg_alpha_amylase
  rationale: Martens et al. 2009 place SusA and SusB in the periplasm and describe
    SusR as an inner-membrane regulator, whereas the curated SusCDEFG constituents
    are outer-membrane proteins. SusA, SusB, and SusR are therefore out of scope for
    this outer-membrane complex.
  evidence:
  - reference: DOI:10.1074/jbc.R109.022848
    notes: The review separates outer-membrane SusCDEFG from periplasmic SusA/SusB
      and the cytoplasmic-membrane regulator SusR.
  posed_by: codex
  posed_date: '2026-10-01'
