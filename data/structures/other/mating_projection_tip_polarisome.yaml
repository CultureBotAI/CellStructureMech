  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - BUD6
  - AIP3
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bud6/Aip3 is a Saccharomyces polarisome constituent named by the
    broader GO polarisome boundary; no exact family grounding or mating-projection-specific
    functional edge was assigned here.
  role: Canonical Saccharomyces polarisome actin nucleation-promoting factor that
    was tested in periodic mating-projection assays.
  evidence:
  - reference: GO:0000133
    notes: GO:0000133 lists Bud6p among Saccharomyces polarisome proteins.
  - reference: DOI:10.1083/jcb.200307065
    notes: Bidlingmaier and Snyder 2004 treated Bud6 as a known polarisome component
      and found that bud6 deletion did not change the frequency or morphology of pheromone-induced
      mating projections.
