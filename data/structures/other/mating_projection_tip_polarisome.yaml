  label: Bni1 formin
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - BNI1
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bni1 is the Saccharomyces formin tested with Spa2 and Pea2 during
    mating-projection growth; broader formin families include paralogs not delimited
    to this localized polarisome.
  role: Formin effector in the Spa2/Pea2 polarisome module that supports mating-projection
    initiation.
  evidence:
  - reference: GO:0000133
    notes: GO:0000133 names Bni1p as a Saccharomyces polarisome protein.
  - reference: DOI:10.1083/jcb.200307065
    notes: Bidlingmaier and Snyder 2004 tested Bni1 with Spa2 and Pea2 in pheromone-treated
