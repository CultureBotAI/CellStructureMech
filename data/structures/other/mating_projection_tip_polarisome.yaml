- discussion_id: cdc42_and_fus_proteins_outside_polarisome_boundary
  prompt: Keep Cdc42 regulators and Fus1/Fus2 outside the mating-projection-tip polarisome
    component boundary.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#spa2_pea2_scaffold
  - components#bni1_formin
  - components#bud6_actin_nucleation_factor
  - causal_graphs#shmoo_tip_polarisome_topology
  rationale: Bidlingmaier and Snyder 2004 assayed Cdc24, Bem3, Fus1, and Fus2 together
    with polarisome mutants during mating-projection cycling, but the exact GO:0031563
    structure denotes the localized polarisome complex rather than every Cdc42 regulator
    or cell-fusion protein that affects projection initiation or termination.
  resolution_note: Curated Spa2/Pea2, Bni1, and Bud6 as constituents and left Cdc24,
    Bem3, Fus1, and Fus2 as out-of-record pathway factors.
  evidence:
  - reference: GO:0031563
    notes: GO:0031563 identifies the localized polarisome complex at the mating projection
      tip.
  - reference: DOI:10.1083/jcb.200307065
    notes: Bidlingmaier and Snyder 2004 separated Cdc42 regulators and Fus proteins
      from the Spa2, Pea2, and Bni1 polarisome component set.
  posed_by: codex
  posed_date: '2026-09-28'
  resolved_date: '2026-09-28'
- discussion_id: bud6_no_periodic_projection_edge
  prompt: Retain Bud6/Aip3 as a constituent without asserting a periodic mating-projection
    phenotype edge.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#bud6_actin_nucleation_factor
  - causal_graphs#shmoo_tip_polarisome_topology
  rationale: GO:0000133 and the broader polarisome record include Bud6/Aip3 in the
    canonical Saccharomyces polarisome boundary. Bidlingmaier and Snyder 2004 tested
    bud6 deletion in the same pheromone-induced projection assay but reported that
    it did not affect projection frequency or morphology, so Bud6 is retained as a
    constituent and left out of the first phenotype graph until a precise localized
    Bud6 edge is curated.
  resolution_note: Included Bud6/Aip3 as a reviewed-label-only constituent but left
    the topology graph focused on the Spa2/Pea2-Bni1 projection-cycle module.
  evidence:
  - reference: GO:0000133
    notes: GO:0000133 names Bud6p in the Saccharomyces polarisome component boundary.
  - reference: DOI:10.1083/jcb.200307065
    notes: Bidlingmaier and Snyder 2004 assayed bud6 deletion in pheromone-treated
      budding yeast and reported no periodic mating-projection phenotype.
  posed_by: codex
  posed_date: '2026-09-28'
  resolved_date: '2026-09-28'
