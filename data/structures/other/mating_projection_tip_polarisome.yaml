- component_id: spa2_pea2_scaffold
  label: Spa2/Pea2 polarisome scaffold
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - SPA2
  - PEA2
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Spa2 and Pea2 are curated as the Saccharomyces scaffold cohort
    used to delimit mating-projection-tip polarisomes; no exact source-neutral family
    CURIE was assigned for this fungal grouped component.
  role: Scaffold proteins that localize to polarized-growth sites and support periodic
    mating-projection growth.
  evidence:
  - reference: DOI:10.1083/jcb.135.3.725
    notes: Valtz and Herskowitz 1996 found Pea2 and Spa2 at sites of polarized growth
      in budding and mating Saccharomyces cells.
  - reference: DOI:10.1083/jcb.200307065
    notes: Bidlingmaier and Snyder 2004 assayed Spa2 and Pea2 during pheromone-induced
      mating-projection initiation and termination cycles.
