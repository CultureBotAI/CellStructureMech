- component_id: lpd_l_protein
  label: Dihydrolipoyl dehydrogenase
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact glycine-cleavage-specific L-protein family was asserted.
    E. coli LpdA is a shared E3 flavoprotein that also serves pyruvate and 2-oxoglutarate
    dehydrogenase complexes, so broad dihydrolipoamide dehydrogenase InterPro signatures
    would overclaim glycine cleavage specificity.
  gene_symbols:
