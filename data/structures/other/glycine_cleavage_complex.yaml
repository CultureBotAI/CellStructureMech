- discussion_id: resolve_l_protein_grounding
  prompt: Can the glycine cleavage L-protein be grounded to an exact source-neutral
    family?
  kind: CURATION_TODO
  status: OPEN
  rationale: The E. coli L protein is LpdA/Lpd, a dihydrolipoyl dehydrogenase shared
    by multiple multienzyme complexes. Keep the component reviewed-label-only until
    an exact L-protein family or glycine cleavage subcomplex grounding is verified.
  evidence:
  - reference: GO:0005960
    notes: GO:0005960 names dihydrolipoamide dehydrogenase as the E. coli glycine
      cleavage L protein.
  - reference: UniProtKB:P0A9P0
    notes: UniProtKB P0A9P0 describes E. coli LpdA/Lpd as the E3 component of several
      dehydrogenase complexes and as glycine cleavage L protein.
