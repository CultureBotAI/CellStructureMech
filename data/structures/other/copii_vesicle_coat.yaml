  role: Inner COPII coat subcomplex that links cargo and the ER membrane to the outer
    Sec13/Sec31 cage.
  evidence:
  - reference: GO:0030134
    notes: GO:0030134 describes the COPII coat complex as formed by Sec23p/Sec24p
      and Sec13p/Sec31p heterodimers.
  - reference: DOI:10.7554/elife.00951
    notes: Zanetti et al. 2013 resolved a membrane-assembled COPII coat and distinguish
      inner coat proteins from outer COPII cage components.
