  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0030134 defines the COPII coat as formed by Sec23p/Sec24p and
    Sec13p/Sec31p heterodimers, but no exact GO, Complex Portal, InterPro, or Pfam
    CURIE was curated for the source-neutral Sec13/Sec31 outer-coat complex.
  role: Outer COPII coat subcomplex that polymerizes into a cage around the inner
    coat on nascent ER-derived vesicles.
  evidence:
  - reference: GO:0030134
    notes: GO:0030134 describes the COPII coat complex as formed by Sec23p/Sec24p
