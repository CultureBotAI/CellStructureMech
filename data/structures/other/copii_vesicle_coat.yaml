identifier: GO:0030127
label: COPII vesicle coat
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A COPII coat protein complex that assembles on endoplasmic-reticulum membranes
  to bud COPII-coated ER-to-Golgi transport vesicles; in budding yeast it contains
  Sar1p, Sec23p, Sec24p, Sec13p, and Sec31p.
