    notes: GO:0030127 names Sar1p among the Saccharomyces cerevisiae COPII vesicle
      coat subunits.
  - reference: DOI:10.1016/0092-8674(94)90138-4
    notes: Barlowe et al. 1994 identified Sar1p with Sec13p, Sec31p, Sec23p, and Sec24p
      as Sec proteins that form the COPII coat driving ER vesicle budding.
