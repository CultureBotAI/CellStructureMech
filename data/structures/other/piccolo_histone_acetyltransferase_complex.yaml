  - reference: DOI:10.1101/gad.1056603
    notes: Boudreault et al. 2003 identified Esa1 as a Piccolo NuA4 subunit.
  - reference: DOI:10.1128/MCB.25.13.5535-5542.2005
    notes: Selleck et al. 2005 reconstituted Piccolo with Esa1 and minimal Epl1/Yng2
      segments.
