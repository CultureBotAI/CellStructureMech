identifier: GO:0032777
label: piccolo histone acetyltransferase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A heterotrimeric H4/H2A histone acetyltransferase complex with a substrate
  preference of chromatin over free histones. It contains a subset of the proteins
  found in the larger NuA4 histone acetyltransferase complex; for example, the S.
  cerevisiae complex contains Esa1p, Yng2p, and Epl1p.
