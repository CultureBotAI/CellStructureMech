  grounding_notes: Curated from the Saccharomyces cerevisiae Rho1p regulatory subunit;
    no exact source-neutral family CURIE was assigned for this glucan-synthase-associated
    regulatory subunit.
  role: Regulatory GTPase subunit that stimulates the Fks-containing 1,3-beta-D-glucan
    synthase complex.
  evidence:
