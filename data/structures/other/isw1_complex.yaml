identifier: GO:0016587
label: Isw1 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that contains an Isw1 subunit from the ISWI-family of
  ATPases and acts to modify chromatin structure. A family of yeast imitation-switch
  (ISWI) ATP-dependent chromatin remodeling complexes built around the catalytic SNF2-family
  ATPase subunit Isw1p in Saccharomyces cerevisiae and related fungi. Existing primarily
  as the dimeric Isw1a complex (Isw1p–Ioc3p) at promoter-proximal regions and the
  trimeric Isw1b complex (Isw1p–Ioc2p–Ioc4p) over coding regions, the Isw1 complex
  slides nucleosomes to establish regular nucleosome spacing and suppress cryptic
  transcription.
