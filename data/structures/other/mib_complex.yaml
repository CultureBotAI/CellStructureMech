discussions:
- discussion_id: mib_identity_boundary
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Does MIB duplicate MICOS, SAM or MIMAS?
  rationale: MIB denotes the larger bridging assembly; its existing MICOS and SAM
    records denote subcomplexes. The GO synonym mitofilin complex is retained without
    treating every mitofilin-containing assembly as MIB.
  resolution_note: Use GO:0140275 and explicit has_part relations, not a local identifier
    or equivalence to a constituent.
  evidence:
  - reference: GO:0140275
    notes: Exact MIB composition and synonymy.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: mib_individual_component_groundings
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact DNAJC11-related and metaxin family mappings and strain-matched
    protein examples.
  rationale: The two component rows describe subcomplexes, not an exhaustive protein
    inventory. Separate metaxin representation must not double-count a SAM constituent.
    No individual family or reference-strain accession is asserted before its scope
    is verified.
  evidence:
  - reference: GO:0140275
    notes: The definition also names DNAJC11-related protein and metaxin 1.
  - reference: DOI:10.1016/j.cub.2024.04.028
    notes: Figure 1F-G includes a DNAJC11 homolog among MIB-associated proteins.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: mmc1_not_a_core_mib_component
  kind: INTERPRETATION
  status: RESOLVED
  prompt: Should Mmc1 be encoded as an obligatory MIB constituent?
  rationale: Mmc1 associates with MICOS, but the source separates its activity from
    MICOS assembly. Association alone does not establish an obligatory MIB subunit.
  resolution_note: Do not add Mmc1 as a core constituent or assign its oligomer mass
    to MIB.
  evidence:
  - reference: DOI:10.1016/j.cub.2024.04.028
    notes: 'Figures 4 and 7: MICOS/MIB association persists without Mmc1; Mmc1 forms
      large assemblies independently of MICOS.'
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: mib_yeast_domain_conflict
  kind: CONTROVERSY
  status: OPEN
  prompt: Resolve differing mitofilin C-terminal truncation results before adding
    a domain-level yeast bridging mechanism.
  rationale: Two budding-yeast studies report opposite changes in SAM co-isolation
    after C-terminal truncation. The fission-yeast example does not resolve that experimental
    disagreement.
  notes: No universal C-terminal dependency, fixed TOM membership or budding-yeast
    canonical example is asserted here.
  evidence:
  - reference: DOI:10.1091/mbc.E11-10-0831
    notes: 'Read Results: Fcj1(1-472) loses Tob55 co-isolation, with reduced-solubility
      caveat.'
  - reference: DOI:10.1016/j.jmb.2012.05.004
    notes: 'Only abstract inspected: C-terminal deletion enhances TOM/SAM association.
      Full text was not reachable through publisher or Europe PMC routes; construct-level
      reconciliation remains open.'
  posed_by: codex
  posed_date: '2026-10-04'
