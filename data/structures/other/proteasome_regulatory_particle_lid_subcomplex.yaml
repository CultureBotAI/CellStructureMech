identifier: GO:0008541
label: proteasome regulatory particle, lid subcomplex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: The subcomplex of the proteasome regulatory particle that forms the peripheral
  lid, which is added on top of the base subcomplex. In Saccharomyces cerevisiae and
  other microbial eukaryotes, the nine-subunit 19S lid subcomplex comprises the PCI-domain
  scaffolds Rpn3, Rpn5, Rpn6, Rpn7, Rpn9, and Rpn12, the MPN-domain heterodimer Rpn8-Rpn11,
  and Sem1, positioning the Zn2+-dependent deubiquitinase Rpn11 directly above the
  Rpt ATPase pore to cleave ubiquitin chains en bloc during translocation.
