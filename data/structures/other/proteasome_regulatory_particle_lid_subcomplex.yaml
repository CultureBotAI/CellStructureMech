synonyms:
- synonym_text: 19S proteasome lid subcomplex
  synonym_type: EXACT_SYNONYM
  source: GO:0008541
components:
- component_id: rpn11_rpn8_deubiquitinase_dimer
  label: Rpn11-Rpn8 MPN-domain deubiquitinase heterodimer
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Catalytic JAMM/MPN+ Zn2+ metalloprotease subunit Rpn11 paired with the structural
    MPN-domain subunit Rpn8 directly over the Rpt ATPase pore to cleave polyubiquitin
    chains from translocating substrates.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 describe the Rpn11-Rpn8 MPN heterodimer as
      the catalytic deubiquitination center of the 19S lid.
- component_id: lid_pci_horseshoe_scaffold
  label: 19S lid PCI-domain horseshoe scaffold (Rpn3, Rpn5, Rpn6, Rpn7, Rpn9, Rpn12,
    Sem1)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Six winged-helix PCI-domain subunits and the Sem1/Dss1 stapler peptide that
    assemble into a horseshoe-shaped scaffold clamping the Rpn11-Rpn8 dimer onto the
    19S base and 20S alpha ring.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 review the six PCI-domain subunits and Sem1
      that form the structural scaffold of the 19S lid subcomplex.
