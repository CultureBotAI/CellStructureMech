- discussion_id: keep_tgn_clathrin_coat_distinct_from_broad_clathrin_coat
  prompt: Keep the TGN-specific clathrin-coat record distinct from the broader clathrin
    vesicle coat record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  - part_of
  rationale: GO:0030130 is the clathrin coat on trans-Golgi-network vesicles, whereas
    GO:0030125 is the broader clathrin vesicle coat parent over endocytic, synaptic,
    and TGN vesicle subclasses.
  resolution_note: Used GO:0030130 as the record identifier, asserted GO:0030125 only
    as an is-a parent, and linked the record by part_of to the GO:0012510 TGN transport-vesicle
    membrane.
  evidence:
  - reference: GO:0030130
    notes: GO:0030130 identifies the TGN vesicle-specific clathrin coat.
  - reference: GO:0030125
    notes: GO:0030125 identifies the broader clathrin vesicle coat parent.
  - reference: GO:0012510
    notes: GO:0030130 is part of the TGN transport-vesicle membrane identified by
      GO:0012510.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
