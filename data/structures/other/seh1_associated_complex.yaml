identifier: GO:0035859
label: Seh1-associated complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A GTPase-activating protein (GAP) complex that regulates TORC1 signaling
  by interacting with the Rag GTPase. In S. cerevisiae the complex contains Seh1p,
  Sec13p, Npr2p, Npr3p, Iml1p, Mtc5p, Rtc1p, and Sea4p.
