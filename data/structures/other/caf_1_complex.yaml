identifier: GO:0033186
label: CAF-1 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A conserved heterotrimeric protein complex that promotes histone H3 and
  H4 deposition onto newly synthesized DNA during replication or DNA repair; specifically
  facilitates replication-dependent nucleosome assembly with the major histone H3
  (H3.1). In many species the CAF-1 subunits are designated p150, p60, and p48.
