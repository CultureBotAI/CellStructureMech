identifier: GO:0030906
label: retromer, cargo-selective complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'The trimeric subcomplex of the retromer, believed to be closely associated
  with the membrane. This trimeric complex is responsible for recognizing and binding
  to cargo molecules. The complex comprises three Vps proteins in both yeast and mammalian
  cells: Vps35p, Vps29p, and Vps26p in yeast, and VPS35, VPS29 and VPS26A or VPS26B
  in mammals.'
