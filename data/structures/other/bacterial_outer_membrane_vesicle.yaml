  title: Outer membrane blebs package periplasm into vesicles
  description: A Gram-negative outer membrane bulges outward, enclosing periplasmic
    material in an outer-membrane-derived bilayer that is released as a bacterial
    outer membrane vesicle.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the OMV boundary and cargo packaging relationship
    without asserting one complete scission mechanism for all Gram-negative bacteria.
