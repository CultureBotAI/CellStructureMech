discussions:
- discussion_id: resolve_omv_component_groundings
  prompt: Resolve exact source-neutral identifiers for OMV lipid, outer-membrane protein
    and lumen-cargo component classes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#outer_membrane_vesicle_bilayer
  - components#outer_membrane_vesicle_cargo
  rationale: The first OMV record models the conserved vesicle boundary and cargo
    concept but leaves the heterogeneous LPS, phospholipid, beta-barrel and soluble-cargo
    sets ungrounded until exact component identifiers can be verified.
  evidence:
  - reference: DOI:10.1002/pmic.200700196
    notes: Lee et al. 2007 showed that native E. coli OMVs contain a mixed protein
      cargo.
  - reference: DOI:10.1038/nrmicro3525
    notes: Schwechheimer and Kuehn 2015 review the mixed outer-membrane and periplasmic
      content of OMVs.
  posed_by: codex
  posed_date: '2026-09-12'
- discussion_id: exclude_non_omv_membrane_vesicles
  prompt: Gram-positive bacterial membrane vesicles and outer-inner membrane vesicles
    are outside the exact GO:0061701 boundary.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  rationale: GO:0061701 denotes Gram-negative outer membrane vesicles. This record
    therefore excludes broader bacterial extracellular vesicle classes that originate
    from the cytoplasmic membrane or contain both outer and inner membrane.
  evidence:
  - reference: GO:0061701
    notes: The GO:0061701 definition restricts the vesicle to release from Gram-negative
      bacterial outer membranes.
  - reference: DOI:10.1038/s41579-018-0112-2
    notes: Toyofuku, Nomura and Eberl 2019 distinguish multiple bacterial membrane-vesicle
      origins rather than treating every bacterial EV as an OMV.
  posed_by: codex
  posed_date: '2026-09-12'
  resolved_date: '2026-09-12'
