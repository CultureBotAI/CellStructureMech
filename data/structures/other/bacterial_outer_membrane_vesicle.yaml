components:
- component_id: outer_membrane_vesicle_bilayer
  label: outer membrane vesicle proteolipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The vesicle membrane is outer-membrane-derived and contains lipopolysaccharide,
    phospholipids, and outer-membrane proteins; no exact source-neutral CURIE was
    curated for the complete proteolipid OMV bilayer mixture.
  role: Outer-membrane-derived bilayer that encloses periplasmic material in the released
    vesicle.
  evidence:
  - reference: GO:0061701
    notes: GO:0061701 defines the bacterial outer membrane vesicle as a bilayered
      proteolipid vesicle released from Gram-negative bacterial outer membranes.
  - reference: DOI:10.1038/nrmicro3525
    notes: Schwechheimer and Kuehn 2015 review OMVs as outer membrane buds from Gram-negative
      bacteria that carry outer-membrane and periplasmic material.
- component_id: outer_membrane_vesicle_cargo
  label: outer membrane vesicle lumen cargo
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: OMV lumen cargo is heterogeneous across species and conditions,
    spanning soluble periplasmic proteins and other molecules, so no exact taxon-agnostic
    protein, RNA, lipid, or polysaccharide CURIE denotes the full cargo set.
  role: Variable lumen material packaged inside the OMV during budding and exported
    from the producing cell.
  evidence:
  - reference: DOI:10.1002/pmic.200700196
    notes: Lee et al. 2007 profiled native Escherichia coli outer membrane vesicles
      and catalogued the proteins packaged in those vesicles.
  - reference: DOI:10.1038/s41579-018-0112-2
    notes: Toyofuku, Nomura and Eberl 2019 review bacterial membrane-vesicle types
      and the distinct cargo sets associated with their origins.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Outer membrane vesicles are a Gram-negative bacterial vesicle class; bacteria
    with other envelope architectures release related but non-OMV membrane vesicles.
  reference: DOI:10.1038/s41579-018-0112-2
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Gram-negative model in which native outer membrane vesicle proteomes and OMV-driven
    host inflammatory responses have been experimentally characterized.
  reference: DOI:10.1371/journal.pone.0011334
functions:
- function_id: outer_membrane_vesicle_export
  label: outer membrane vesicle-mediated export
  description: Outer membrane vesicles bud from the cell surface to export outer-membrane
    and periplasmic molecules into the extracellular environment.
  evidence:
  - reference: DOI:10.1038/nrmicro3525
    notes: Schwechheimer and Kuehn 2015 review outer membrane vesicle biogenesis and
      functions in Gram-negative bacteria.
- function_id: outer_membrane_vesicle_intercellular_delivery
  label: outer membrane vesicle intercellular delivery
  description: The vesicle carries bacterial envelope and lumen cargo to other cells,
    supporting interactions with host cells and neighboring microbes.
  evidence:
  - reference: DOI:10.1038/s41579-018-0112-2
    notes: Toyofuku, Nomura and Eberl 2019 review bacterial membrane vesicles as extracellular
      carriers that move biomolecules among bacteria and to host cells.
