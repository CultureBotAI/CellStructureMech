discussions:
- discussion_id: identity_and_aliases
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep TUSK distinct from the basal-body A-tusk and from cullin or SAGA-family
    complexes.
  rationale: A shared name fragment or related enzyme family does not establish structure
    identity.
  notes: Whole-repository hidden/ignored-inclusive alias, slug, locus, accession,
    DOI and PMID searches and parsed identities across 874 prior records found only
    unrelated A-tusk context, not this complex. Current native GO searches for TUSK,
    TUS, Tpr86, SkpZ and the three-protein combination returned zero hits; GO:0032991
    is a verified broader parent, not an exact identity. Earlier broad queries containing
    complex exceeded QuickGO's 25-page cap and are not claimed exhaustive. Native
    Complex Portal TUSK, Tpr86 and SkpZ queries returned no entries. Figure 3 uses
    TUS complex, and the inspected ISG75 paper uses TUS deubiquitinase complex for
    the same three proteins. No equivalence to DUBm or an E3 ligase is asserted.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
  - reference: DOI:10.15698/mic2023.02.790
  - reference: GO:0032991
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: component_family_groundings
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact source-neutral family identifiers for the three TUSK constituent
    classes.
  rationale: Shared repeats, domains and divergent paralogs must not be promoted to
    exact family identity.
  notes: Native InterPro searches found no Tpr86 or SkpZ entry and only the IPR024729
    ICP0-binding domain for Usp7. The paper's Tpr86-related IPR011990 is a homologous
    superfamily and IPR002885 is a repeat. These are declined as component identities.
    Protein-example accessions remain unset because exact source-locus UniProt queries
    did not resolve them; such bounded misses do not prove absence. Generic Skp1,
    TPR and deubiquitinase domains do not identify TUSK-specific membership.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
  - reference: InterPro:IPR011990
  - reference: InterPro:IPR002885
  - reference: InterPro:IPR024729
  posed_by: codex
  posed_date: '2026-10-04'
  attaches_to:
  - components#tpr86
  - components#usp7
  - components#skpz
- discussion_id: source_locus_and_effect_size_conflicts
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile the Tpr86 locus and the percentage-versus-ratio wording before
    adding exact identifiers or effect sizes.
  rationale: The source contains internal inconsistencies that do not invalidate the
    named reciprocal-isolation evidence.
  notes: The main text calls Tpr86 Tb927.11.810, whereas Table 1 gives Tb927.10.810.
    No accession is guessed from either string. Results say Usp7 and Tpr86 are reduced
    by 38% and about 42%, whereas Table 1 lists ratios 0.38 and 0.42. Only the agreed
    qualitative decreases enter the function and graph; no arithmetic reconciliation
    or exact percent loss is asserted. Figure 4's inset is read as abundance corroboration,
    not a measured degradation half-life.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
  posed_by: codex
  posed_date: '2026-10-04'
  attaches_to:
  - components#tpr86
  - causal_graphs#skpz_perturbation_abundance_outputs
- discussion_id: localization_and_stoichiometry
  kind: CURATION_TODO
  status: OPEN
  prompt: Establish native complex localization, subunit copy numbers and oligomeric
    state independently of tag artifacts.
  rationale: Co-isolation establishes membership but not fixed stoichiometry, direct
    pairwise contacts or exact organellar parthood.
  notes: The authors call TUSK heterotrimeric, but tagged-cell BN-PAGE gives apparent
    400- and 600-kDa species and explicitly permits alternative stoichiometry or composition.
    Neither those migration values nor the summed subunit masses are curated as intrinsic
    complex properties. Their own tagged localization was ambiguous; TrypTag localization
    is discussed by the paper, but its native images were not independently inspected
    here. No fixed endosome/Golgi part_of, molecule count, dimension or structure-assembly
    essentiality is inferred.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: mechanism_and_function_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: Test direct TUSK substrate recognition and deubiquitination without treating
    the dark-cullin analogy as established mechanism.
  rationale: An intervention's abundance outputs do not identify the intermediates
    connecting it to each affected protein.
  notes: Tpr86 scaffolding, SkpZ substrate delivery, Usp7-mediated removal of ubiquitin
    from individual surface substrates and subsequent lysosomal routing remain proposed
    links. The curated NONMECHANISTIC graph preserves only measured RNAi outputs.
    The GPI-linked response may be secondary; ESAG7 is soluble and associated with
    GPI-anchored ESAG6, and ESAG5 anchoring is uncertain. No direct GPI substrate
    claim, universal cohort direction, catalytic specificity or narrower GO function
    is assigned from whole-cell proteomics. Ortholog conservation across kinetoplastids
    is not an experimentally demonstrated distribution of assembled TUSK, so only
    the studied species is a canonical example.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
  posed_by: codex
  posed_date: '2026-10-04'
  attaches_to:
  - functions#surface_protein_abundance_regulation
  - causal_graphs#skpz_perturbation_abundance_outputs
- discussion_id: declined_additional_constituents
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not promote initial co-isolates or analogous cullin machinery to TUSK
    constituents.
  rationale: Not every enrichment hit is a specific, reproducible complex member.
  notes: GRESAG4 and PFC17 were enriched in the initial SkpZ experiment but were not
    recovered in reciprocal Tpr86 isolation and were rejected as contaminants by the
    authors. The source also spells the latter PCF17 in one sentence. Cullin and Rbx1
    machinery were not established as TUSK members; the dark-cullin analogy is not
    a cullin assignment. Vdu1 is a separate deubiquitinase, and changed abundance
    of VAMP7b or surface cargo does not make those proteins constituents.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: specimen_and_dataset_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Retain assay stages, reference-database versions and accession discrepancies
    without conflating samples.
  rationale: Protein-search annotation strains and pipeline versions are not the experimental
    organism or one interchangeable protocol.
  notes: Native NCBI confirms Trypanosoma brucei taxon 5691. The study distinguishes
    procyclic 427 tagging/immunoprecipitation from bloodstream 2T1/Lister 427 RNAi.
    The 927 annotation databases and source-specific releases 24, 8.1 and 39.0 are
    retained as processing context, not canonical strains. Native PRIDE metadata verifies
    both accessions and the paper DOI; PXD021000's PMID zero is not imported, and
    PXD021797 corrects the paper's XD021797 typographic form using its data-availability
    statement and native entry. Links are not exact complex xrefs. iModulonDB has
    no matching organism among the 28 listed datasets and is not negative evidence.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: native_assembly_imaging
  kind: CURATION_TODO
  status: OPEN
  prompt: Obtain experimentally resolved imaging of the assembled TUSK complex.
  rationale: Biochemical readouts, knockdown phenotypes and predicted architectures
    show different things.
  notes: Original Figure 3 co-immunoprecipitation/BN-PAGE and Figure 4 proteomics/immunoblot
    graphics were visually inspected and their native media checksums verified, but
    no complex micrograph is asserted. Figure 7's membrane hypertrophy is a knockdown
    phenotype, not TUSK localization. Figure 6C is a predicted Tpr86 subunit model
    and Figure 8 a proposed architecture; neither is an experimentally resolved whole-complex
    structure. No image, dimension or atomic-model xref is inferred from these panels.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
  posed_by: codex
  posed_date: '2026-10-04'
