components:
- component_id: tpr86
  label: Tpr86 TUSK subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - Tpr86
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro Tpr86 search returned no entry. The paper's IPR011990
    and IPR002885 are a broad homologous superfamily and a repeat, respectively, not
    the Tpr86 component family. The source also has conflicting locus strings, so
    no protein accession is substituted for family identity.
  role: Constituent recovered with SkpZ and Usp7; a substrate-scaffolding role is
    proposed, not demonstrated.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
    notes: Native SkpZ affinity isolation identified Tpr86; reciprocal tagged-Tpr86
      isolation in three biological replicates recovered SkpZ and Usp7 (Results and
      Figure 6B). Figure 3A supports Tpr86-Usp7 co-isolation. These support complex
      membership, not exact pairwise contact sites or assembly essentiality.
- component_id: usp7
  label: Usp7 TUSK subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - Usp7
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro Usp7 search returned IPR024729, an ICP0-binding
    domain rather than a whole Usp7 family. No exact source-neutral family mapping
    for this constituent was established. Exact source-locus UniProt queries returned
    no entries; that query limit is not proof that protein entries do not exist.
  role: Deubiquitinase-family constituent; direct substrate delivery and a complete
    catalytic mechanism of the assembled TUSK complex remain unresolved.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
    notes: SkpZ and Tpr86 affinity isolations recover TbUsp7, and Figure 3A shows
      tagged-Usp7 immunoprecipitation co-enriching Tpr86 with an enolase control.
      The paper identifies Usp7 as the deubiquitinase-family member; molecular activity
      of individual candidate surface substrates is not assigned from these interactions.
- component_id: skpz
  label: SkpZ TUSK subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SkpZ
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro SkpZ search returned no entry. The primary phylogeny
    distinguishes SkpZ from other Skp1 paralogs, so generic Skp1 or POZ domains would
    be broader than this constituent class. No exact family identifier was established.
  role: Divergent Skp1-like constituent; its depletion alters other TUSK subunit levels
    and selected surface-protein cohorts. Direct substrate-adaptor action is a hypothesis.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
    notes: Affinity isolation of endogenously tagged SkpZ and reciprocal tagged-Tpr86
      isolation identify the three-member TUSK association. The phylogeny distinguishes
      the SkpZ lineage from Skp1.1, Skp1.3 and Skp1.4. RNAi effects on protein abundance
      do not establish whether the residual complex can assemble without SkpZ.
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: Native complex membership was examined using tagged proteins and affinity
    isolation. Tagging and immunoprecipitation Methods specify procyclic-form 427
    cells, whereas the culture and RNAi experiments describe bloodstream-form 2T1
    cells derived from Lister 427. The SILAC abundance comparison follows 48 hours
    of induction. These assay stages are retained separately. Strain 927 protein databases
    used for peptide identification are reference annotations, not the cultured experimental
    strain.
  reference: DOI:10.3389/fpara.2023.1118284
functions:
- function_id: surface_protein_abundance_regulation
  label: regulation of surface-protein abundance
  description: In the studied bloodstream-form T. brucei RNAi context, SkpZ depletion
    reduces Usp7 and Tpr86 levels and decreases total abundance of selected transmembrane
    surface/endosomal proteins while increasing selected predicted GPI-anchored protein
    cohorts. Whole-cell proteomics measures abundance, not surface-specific occupancy
    or direct deubiquitination of each affected protein.
  evidence:
  - reference: DOI:10.3389/fpara.2023.1118284
    notes: Results, Table 1 and Figure 4 report qualitative cohort directions after
      48-hour SkpZ RNAi; the ISG75 immunoblot corroborates reduced abundance. The
      Discussion explicitly allows indirect effects for GPI-linked proteins. ESAG7
      is a soluble partner of GPI-anchored ESAG6, and ESAG5 anchoring is uncertain;
      neither is relabeled as a demonstrated GPI-anchored protein here.
