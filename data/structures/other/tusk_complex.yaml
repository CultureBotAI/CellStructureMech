  changes: Added the native TUSK three-component association, source-backed aliases,
    scoped Trypanosoma example, qualitative abundance function, experiment-bounded
    nonmechanistic graph and two PRIDE links. Preserved locus/effect-size conflicts,
    assay-stage and database-version boundaries, uncertain localization/stoichiometry
    and hypothetical catalytic mechanism; declined broader family grounds and unsupported
    constituents.
