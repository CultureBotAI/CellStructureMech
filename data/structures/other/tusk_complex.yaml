    of TUSK catalysis or substrate delivery.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: All edges start at the measured intervention. No edge connects a proposed
    Tpr86 scaffold, SkpZ substrate adaptor, Usp7 catalytic step or lysosomal delivery
    into an established pathway. Whole-cell steady-state abundance cannot establish
    direct substrates, degradation rates or surface-localized fractions.
  nodes:
