identifier: cellstructuremech:tusk_complex
label: TUSK complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex containing Usp7, the divergent Skp1-like protein SkpZ,
  and Tpr86, experimentally characterized in Trypanosoma brucei. It is distinct from
  cullin ubiquitin-ligase complexes and is implicated in coordinated regulation of
  surface-protein abundance.
definition_source: DOI:10.3389/fpara.2023.1118284
mapping_status: PROPOSED
