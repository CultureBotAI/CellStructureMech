evidence:
- reference: DOI:10.3389/fpara.2023.1118284
  notes: Yamada et al. 2023, PMID:39816833. Checksum-verified PMC11732084.1 abstract,
    complex-isolation and knockdown Results, Discussion and relevant culture, tagging,
    SILAC, immunoprecipitation and BN-PAGE Methods inspected. Original Figures 3 and
    4 visually inspected. Supports a named physical complex and bounded perturbation
    effects, not the proposed dark-cullin mechanism as established fact.
- reference: DOI:10.15698/mic2023.02.790
  notes: The ISG75 study names the same SkpZ/Tpr86/Usp7 association as the TUS deubiquitinase
    complex. Its reference 58 links the prior title/preprint to the TUSK paper; the
    inspected paragraph supplies synonym provenance, not a new composition.
causal_graphs:
