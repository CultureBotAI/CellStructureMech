functions:
- function_id: chromosomal_origin_anchoring
  label: chromosomal-origin anchoring
  description: The PopZ polar microdomain anchors the ParB-bound chromosomal origin
    region at the Caulobacter cell pole.
  evidence:
  - reference: DOI:10.1016/j.cell.2008.07.015
    notes: Bowman et al. 2008 connected PopZ polymers to anchoring of the chromosomal
      origin/ParB complex at a bacterial cell pole.
- function_id: pole_regulatory_organization
  label: pole-specific client-protein organization
  description: The PopZ polar microdomain serves as a hub for multiple client proteins
    that contribute to sequential changes in Caulobacter pole composition.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2010.07088.x
    notes: Bowman et al. 2010 showed that the PopZ polar subdomain organizes sequential
      changes in pole composition and function.
  - reference: DOI:10.1073/pnas.1602380113
    notes: Holmes et al. 2016 identified PopZ as an intrinsically disordered hub for
      organizing bacterial cell poles.
evidence:
- reference: DOI:10.1016/j.cell.2008.07.015
