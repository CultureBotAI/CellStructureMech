- reference: DOI:10.1016/j.cell.2008.07.016
  notes: Ebersbach, Briegel, Jensen and Jacobs-Wagner 2008, 'A Self-Associating Protein
    Critical for Chromosome Attachment, Division, and Polar Organization in Caulobacter',
