functions:
- function_id: ion_gradient_dependent_solute_uptake
  label: ion-gradient-dependent solute uptake
  description: Couples extracytoplasmic receptor binding to secondary active solute
    import without direct ATP hydrolysis.
  evidence:
  - reference: GO:0031317
    notes: GO:0031317 defines TRAP transporter complexes by transport of varied substrates
      without direct ATP power and with energy from ion gradients.
  - reference: DOI:10.1128/JB.179.17.5482-5493.1997
    notes: Forward et al. 1997 found that R. capsulatus DctPQM succinate uptake tracked
      membrane potential rather than ATP abundance.
evidence:
- reference: GO:0031317
  notes: GO:0031317 is an active cellular-component term for the tripartite ATP-independent
    periplasmic transporter complex and is_a GO:1990351 transporter complex.
- reference: DOI:10.1128/JB.179.17.5482-5493.1997
  notes: Forward et al. 1997 characterized the R. capsulatus dctPQM genes, showed
    that dctP, dctQ, and dctM were sufficient for C4-dicarboxylate transport, and
    proposed the TRAP transporter name.
- reference: DOI:10.1099/00221287-145-12-3431
  notes: Rabus et al. 1999 analyzed TRAP transporters as an ancient family of extracytoplasmic
    solute-receptor-dependent secondary active transporters.
- reference: DOI:10.1111/j.1574-6976.2010.00236.x
  notes: Mulligan, Fischer and Thomas 2011 reviewed tripartite ATP-independent periplasmic
    transporters in bacteria and archaea.
