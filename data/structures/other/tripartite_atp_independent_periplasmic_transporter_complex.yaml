identifier: GO:0031317
label: tripartite ATP-independent periplasmic transporter complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex consisting of two membrane proteins and one extracytoplasmic
  solute receptor. Such transporters transport a variety of substrates without direct
  ATP power, instead using energy from ion gradients.
definition_source: GO:0031317
mapping_status: PROPOSED
