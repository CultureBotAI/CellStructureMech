  changes: Added GO synonymy, transporter-complex parentage, TRAP receptor and membrane
    components, bacterial and archaeal taxonomy, the R. capsulatus DctPQM canonical
    example, ion-gradient-dependent transport function, evidence, and a receptor-grounding
    discussion.
  llm_assisted: true
synonyms:
- synonym_text: TRAP transporter complex
  synonym_type: EXACT_SYNONYM
  source: GO:0031317
- synonym_text: TRAP-T transporter complex
  synonym_type: EXACT_SYNONYM
