components:
- component_id: trap_extracytoplasmic_solute_receptor
  label: TRAP extracytoplasmic solute receptor
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: TRAP transporters use extracytoplasmic solute receptors from DctP
    and TAXI families; no single exact source-neutral InterPro, Pfam, NCBIfam, or
    UniProtKB family CURIE was asserted for the full receptor class.
  role: Binds substrate outside the cytoplasmic membrane and delivers it to the DctQ/DctM-type
    membrane transporter.
  evidence:
  - reference: GO:0031317
    notes: GO:0031317 defines the TRAP transporter complex as containing one extracytoplasmic
      solute receptor.
  - reference: DOI:10.1128/JB.179.17.5482-5493.1997
    notes: Forward et al. 1997 identified DctP as the periplasmic C4-dicarboxylate-binding
      component of the Rhodobacter capsulatus DctPQM TRAP transporter.
- component_id: trap_small_membrane_dctq
  label: TRAP transporter, small membrane protein DctQ
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR007387
  role: Small integral membrane constituent of DctPQM-type TRAP transporters.
  evidence:
  - reference: GO:0031317
    notes: GO:0031317 defines the TRAP transporter complex as containing two membrane
      proteins.
  - reference: InterPro:IPR007387
    notes: InterPro:IPR007387 covers TRAP transporter small membrane proteins of the
      DctQ family.
  - reference: DOI:10.1128/JB.179.17.5482-5493.1997
    notes: Forward et al. 1997 identified R. capsulatus dctQ as a membrane-protein
      gene required with dctP and dctM for functional C4-dicarboxylate transport.
- component_id: trap_large_membrane_dctm
  label: TRAP transporter large membrane protein DctM
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR004681
  role: Large integral membrane constituent of DctPQM-type TRAP transporters.
  evidence:
  - reference: GO:0031317
    notes: GO:0031317 defines the TRAP transporter complex as containing two membrane
      proteins.
  - reference: InterPro:IPR004681
    notes: InterPro:IPR004681 covers TRAP transporter large membrane proteins of the
      DctM family.
  - reference: DOI:10.1128/JB.179.17.5482-5493.1997
    notes: Forward et al. 1997 identified R. capsulatus dctM as a membrane-protein
      gene required with dctP and dctQ for functional C4-dicarboxylate transport.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
