- component_id: trap_extracytoplasmic_solute_receptor
  label: TRAP extracytoplasmic solute receptor
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: TRAP transporters use extracytoplasmic solute receptors from DctP
    and TAXI families; no single exact source-neutral InterPro, Pfam, NCBIfam, or
    UniProtKB family CURIE was asserted for the full receptor class.
  role: Binds substrate outside the cytoplasmic membrane and delivers it to the DctQ/DctM-type
    membrane transporter.
  evidence:
  - reference: GO:0031317
    notes: GO:0031317 defines the TRAP transporter complex as containing one extracytoplasmic
      solute receptor.
  - reference: DOI:10.1128/JB.179.17.5482-5493.1997
    notes: Forward et al. 1997 identified DctP as the periplasmic C4-dicarboxylate-binding
      component of the Rhodobacter capsulatus DctPQM TRAP transporter.
