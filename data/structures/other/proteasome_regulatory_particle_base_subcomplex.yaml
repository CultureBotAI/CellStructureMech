synonyms:
- synonym_text: 19S proteasome base subcomplex
  synonym_type: EXACT_SYNONYM
  source: GO:0008540
components:
- component_id: rpt_atpase_ring
  label: 19S base AAA+ ATPase heterohexameric ring (Rpt1-Rpt6)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Heterohexameric AAA+ ATPase motor ring (Rpt1-Rpt6) whose C-terminal HbYX tails
    dock into pockets of the 20S alpha ring to open the proteolytic gate while aromatic
    pore loops mechanically unfold and translocate substrates.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 describe the ordered Rpt1-Rpt6 AAA+ heterohexamer
      at the core of the 19S base subcomplex.
- component_id: rpn1_rpn2_receptor_scaffold
  label: 19S base non-ATPase scaffold and ubiquitin receptor module (Rpn1, Rpn2, Rpn10,
    Rpn13)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Toroidal PC-repeat scaffold subunits (Rpn1, Rpn2) and intrinsic ubiquitin
    receptors (Rpn10, Rpn13) that capture polyubiquitinated proteins and recruit shuttle
    factors and Ubp6 to the base.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 review the non-ATPase Rpn1/Rpn2 scaffolds and
      Rpn10/Rpn13 ubiquitin receptors of the 19S base.
