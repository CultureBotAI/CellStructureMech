identifier: GO:0008540
label: proteasome regulatory particle, base subcomplex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: The subcomplex of the proteasome regulatory particle that directly associates
  with the proteasome core complex. In Saccharomyces cerevisiae and other microbial
  eukaryotes, the 19S base subcomplex consists of the heterohexameric AAA+ ATPase
  motor ring (Rpt1-Rpt6) together with the large scaffolding subunits Rpn1 and Rpn2
  and the ubiquitin receptors Rpn10 and Rpn13, which capture ubiquitinated substrates,
  mechanically unfold them, and open the alpha-ring gate of the 20S core particle.
definition_source: GO:0008540
mapping_status: PROPOSED
parent_structures:
- GO:0032991
part_of:
- GO:0005838
synonyms:
- synonym_text: 19S proteasome base subcomplex
  synonym_type: EXACT_SYNONYM
  source: GO:0008540
components:
- component_id: core_complex
  label: proteasome core complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005839
  essentiality: ESSENTIAL
  role: Barrel-shaped 20S proteolytic core that sequesters active sites in an internal
    chamber. Functions in the proteasome regulatory particle cap in proteasome regulatory
    particle. Functions within the AAA+ ATPase-containing base subcomplex of the proteasome
    regulatory particle.
  evidence:
  - reference: GO:0005839
    notes: GO:0005839 identifies the proteasome core complex as the barrel-shaped
      proteolytic core.
  - reference: DOI:10.1146/annurev-biochem-060410-150257
    notes: Tomko and Hochstrasser 2013 review the eukaryotic 26S proteasome as a 20S
      core particle capped by a 19S regulatory particle.
- component_id: accessory_complexes
  label: proteasome accessory complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0022624
  essentiality: UNKNOWN
  role: Caps or regulators that bind the 20S core and control protein entry into,
    or exit from, the proteolytic core complex. Functions in the proteasome regulatory
    particle cap in proteasome regulatory particle. Functions within the AAA+ ATPase-containing
    base subcomplex of the proteasome regulatory particle.
  evidence:
  - reference: GO:0022624
    notes: GO:0022624 defines proteasome accessory complexes as caps on one or both
      ends of the core that regulate entry or exit.
  - reference: DOI:10.3389/fmolb.2019.00023
    notes: Muller and Weber-Ban 2019 review bacterial regulator complexes that associate
      with the 20S core particle to recruit and internalize substrates.
taxonomic_distribution:
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: COMMON
  note: Exhibits proteasome regulatory particle, base subcomplex (GO:0008540) within
    the AAA+ ATPase-containing base subcomplex of the proteasome regulatory particle.
    Exhibits proteasome regulatory particle (GO:0005838) in the proteasome regulatory
    particle cap. Archaeal proteasome systems combine 20S cores with proteasome-associated
    ATPases such as PAN.
  reference: DOI:10.1042/ETLS20180025
- taxon_id: NCBITaxon:201174
  taxon_label: Actinomycetota
  presence: VARIABLE
  note: Exhibits proteasome regulatory particle, base subcomplex (GO:0008540) within
    the AAA+ ATPase-containing base subcomplex of the proteasome regulatory particle.
    Exhibits proteasome regulatory particle (GO:0005838) in the proteasome regulatory
    particle cap. Bacterial proteasomes occur in mycobacteria and other actinobacteria,
    where 20S cores pair with regulators such as Mpa, Bpa, or Cpa.
  reference: DOI:10.3389/fmolb.2019.00023
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: COMMON
  note: Exhibits proteasome regulatory particle, base subcomplex (GO:0008540) within
    the AAA+ ATPase-containing base subcomplex of the proteasome regulatory particle.
    Exhibits proteasome regulatory particle (GO:0005838) in the proteasome regulatory
    particle cap. Eukaryotic ubiquitin-proteasome degradation is carried out by 26S
    proteasomes built from 20S core particles and 19S regulatory particles.
  reference: DOI:10.1146/annurev-biochem-060410-150257
canonical_examples:
