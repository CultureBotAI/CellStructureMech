causal_graphs:
- graph_id: proteasome_regulatory_particle_base_subcomplex_mechanism
  title: 19S base subcomplex ATP-driven substrate unfolding and 20S gate opening
  description: Ubiquitin receptors Rpn10/Rpn13 and scaffolds Rpn1/Rpn2 on the 19S
    base subcomplex deliver polyubiquitinated substrates to the Rpt1-Rpt6 AAA+ ATPase
    ring, which unfolds the polypeptide and docks C-terminal HbYX motifs into the
    20S alpha ring to open the proteolytic gate.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
