causal_graphs:
- graph_id: trapp_complex_mechanism
  title: TRAPP complex Ypt1/Rab1 nucleotide exchange and secretory vesicle tethering
  description: The shared catalytic core of the TRAPP complex (Bet5p–Trs23p–Bet3p–Trs31p)
    binds vesicle coats and remodels the Ypt1 switch I region to catalyze GDP-to-GTP
    exchange, driving vesicle tethering and SNARE-mediated fusion at the Golgi.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records TRAPPI core subunit membership and ER-to-Golgi transport
    involvement without modeling the Ypt1/Rab1 guanine-nucleotide-exchange reaction,
    COPII coat contacts, or later recruitment of other tethers.
