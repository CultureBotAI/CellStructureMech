identifier: GO:0030008
label: TRAPP complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A large complex that acts as a tethering factor involved in transporting
  vesicles from the ER through the Golgi to the plasma membrane. A TRAPP (transport
  protein particle) complex has a core set of proteins which are joined by specific
  subunits depending on the cellular component where a given TRAPP complex is active.
  The conserved eukaryotic Transport Protein Particle (TRAPP) family of multisubunit
  vesicle-tethering and Rab guanine nucleotide exchange factor (GEF) complexes in
  yeasts, fungi, and protists. Built around a shared heptameric core (Bet3p dimer,
  Bet5p, Trs20p, Trs23p, Trs31p, Trs33p) that forms the catalytic GEF site, TRAPP
  complexes (TRAPPI, TRAPPII, and TRAPPIII) activate Ypt1/Rab1 and Ypt31/32 GTPases
  to coordinate ER-to-Golgi transport, intra-Golgi trafficking, and autophagy.
