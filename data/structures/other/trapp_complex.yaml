functions:
- function_id: er_to_golgi_vesicle_mediated_transport
  label: endoplasmic reticulum to Golgi vesicle-mediated transport
  grounding: GO:0006888
  description: Mediated by TRAPP complex (GO:0030008) within the core Transport Protein
    Particle (TRAPP) GEF and tethering complex. TRAPPI tethers COPII vesicles at the
    ER-Golgi interface during anterograde vesicle-mediated transport toward the Golgi.
  evidence:
  - reference: GO:0006888
    notes: GO:0006888 denotes COPII-vesicle-mediated transport from the endoplasmic
      reticulum to the Golgi.
  - reference: DOI:10.1016/s1097-2765(01)00190-3
    notes: Sacher et al. 2001 reconstituted COPII vesicle targeting with purified
      TRAPP I.
