discussions:
- discussion_id: er_sec_subcomplex_boundary
  prompt: Should individual Sec61p, Sbh1p, Sss1p, Sec62p, Sec63p, Sec71p, or Sec72p
    subunits be duplicated as direct ER Sec complex components?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - has_part#GO:0005784
  - has_part#GO:0031207
  - causal_graphs#yeast_er_sec_complex_posttranslational_import
  rationale: GO:0031205 is the parent ER Sec complex made from Sec61 and Sec62/Sec63
    subcomplexes in yeast. The individual Sec61p/Sbh1p/Sss1p and Sec62p/Sec63p/Sec71p/Sec72p
    proteins belong on those lower-level subcomplex records, so this parent record
    uses has_part links to avoid duplicating the same components at two hierarchy
    levels.
  evidence:
  - reference: GO:0031205
    notes: GO:0031205 defines the yeast ER Sec complex by its Sec61 and Sec62/Sec63
      subcomplexes.
  - reference: GO:0005784
    notes: GO:0005784 defines the Sec61 heterotrimeric channel, whose constituents
      are curated on the Sec61 translocon complex record.
  - reference: GO:0031207
    notes: GO:0031207 defines the Sec62/Sec63 tetramer, whose constituents are curated
      on the Sec62/Sec63 complex record.
