functions:
- function_id: posttranslational_er_protein_import
  label: posttranslational ER protein import
  description: The ER Sec complex brings the Sec61 protein-conducting channel and
    the Sec62/Sec63 subcomplex together at the ER membrane to support Kar2/BiP-coupled
    posttranslational import of substrate proteins into the endoplasmic reticulum.
  evidence:
  - reference: GO:0031205
    notes: GO:0031205 defines the ER Sec complex as an ER-membrane complex involved
      in protein translocation into the ER.
  - reference: DOI:10.1016/0092-8674(95)90077-2
    notes: Panzner et al. 1995 reconstituted yeast posttranslational protein transport
      with a purified Sec-protein complex and Kar2p.
  - reference: DOI:10.1091/mbc.e03-06-0390
    notes: Plath et al. 2004 photo-crosslinked a substrate precursor to Sec62p and
      Sec61p in the yeast Sec complex during posttranslational ER import.
  - reference: DOI:10.1038/s41586-018-0856-x
    notes: Wu, Cabanos and Rapoport 2019 determined the structure of the yeast ER
      post-translational protein translocation machinery.
