identifier: GO:0031205
label: endoplasmic reticulum Sec complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An endoplasmic reticulum membrane-associated complex involved in the translocation
  of proteins that are targeted to the ER. In yeast, this complex consists of two
  subcomplexes, namely, the Sec61 complex and the Sec62/Sec63 complex.
