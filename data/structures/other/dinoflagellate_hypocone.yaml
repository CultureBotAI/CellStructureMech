discussions:
- discussion_id: resolve_hypocone_molecular_constituents
  prompt: Add hypocone molecular components only after directly localized constituents
    and exact source-neutral family groundings have been identified.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO defines the dinoflagellate hypocone as a subcellular region below
    the cingulum, but this pass did not find exact family-level evidence for hypocone-specific
    molecular constituents.
  evidence:
  - reference: GO:0097614
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: antapex_is_narrower_than_hypocone
  prompt: Keep dinoflagellate antapex separate from the general dinoflagellate hypocone
    unless curating the narrower GO:0097684 class.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: QuickGO lists GO:0097684 as a part_of child of GO:0097614, so the dinoflagellate
    antapex should be modeled as a hypocone part rather than folded into the whole
    hypocone record as an exact synonym.
  evidence:
  - reference: GO:0097614
  - reference: GO:0097684
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:0097614 as the whole posterior hypocone region and leave
    the antapex for separate GO:0097684 curation.
- discussion_id: epicone_is_sibling
  prompt: Keep dinoflagellate epicone separate from the dinoflagellate hypocone because
    GO models it as the anterior counterpart.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0097613 is the anterior counterpart of GO:0097614 and is separated
    from the hypocone by the cingulum, so it should not be modeled as a synonym or
    part of the posterior hypocone region.
  evidence:
  - reference: GO:0097614
  - reference: GO:0097613
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:0097614 as the posterior dinoflagellate hypocone and keep
    the anterior epicone in GO:0097613.
- discussion_id: sulcal_notch_is_sulcus_subclass
  prompt: Keep dinoflagellate sulcal notch separate from the whole dinoflagellate
    hypocone unless curating the narrower GO:0097618 class.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0097618 is a subclass of the dinoflagellate sulcus that extends to
    the antapex and can make the hypocone appear bilobed; it is adjacent to the hypocone
    boundary rather than a subtype or synonym of the whole posterior hypocone.
  evidence:
  - reference: GO:0097614
  - reference: GO:0097618
  - reference: GO:0097612
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:0097614 as the whole posterior hypocone region and leave
    the sulcal notch for separate GO:0097618 curation.
