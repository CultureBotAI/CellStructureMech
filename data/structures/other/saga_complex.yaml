functions:
- function_id: histone_acetyltransferase_activity
  label: histone acetyltransferase activity
  grounding: GO:0004402
  description: The SAGA HAT module contains the Gcn5 catalytic subunit and supports
    histone acetylation by the complex.
  evidence:
  - reference: GO:0004402
    notes: GO:0004402 is the Gene Ontology molecular-function term for histone acetyltransferase
      activity.
  - reference: GO:0000124
    notes: GO:0000124 defines SAGA as a SAGA-type histone acetyltransferase complex.
  - reference: DOI:10.1038/s41586-020-1933-5
    notes: Wang et al. 2020 describe the SAGA HAT module as containing the histone
      H3 acetyltransferase Gcn5.
- function_id: cysteine_type_deubiquitinase_activity
  label: cysteine-type deubiquitinase activity
  grounding: GO:0004843
  description: The SAGA DUB module deubiquitinates histone H2B through the Ubp8 catalytic
    subunit.
  evidence:
  - reference: GO:0004843
    notes: GO:0004843 is the Gene Ontology molecular-function term for cysteine-type
      deubiquitinase activity.
  - reference: GO:0000124
    notes: GO:0000124 asserts that the SAGA complex is capable of cysteine-type deubiquitinase
      activity.
  - reference: DOI:10.1101/gad.1144003
    notes: Henry et al. 2003 identified SAGA-associated Ubp8 as a mediator of histone
      H2B deubiquitylation during transcriptional activation.
