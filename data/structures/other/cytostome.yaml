functions:
- function_id: endocytic_cargo_uptake
  label: endocytic cargo uptake
  description: The T. cruzi epimastigote cytostome admits extracellular macromolecular
    cargo into the endocytic route that passes through an early endosomal network
    before reservosome storage.
  evidence:
  - reference: DOI:10.1078/0171-9335-00112
    notes: Porto-Carreiro et al. 2000 traced endocytic cargo entering through the
      cytostome and later reaching reservosomes in T. cruzi epimastigotes.
