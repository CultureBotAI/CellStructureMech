functions:
- function_id: dna_templated_transcription_elongation
  label: DNA-templated transcription elongation
  grounding: GO:0006354
  description: The THO complex promotes transcription elongation, including transcription
    of repeat-containing genes. Mediated by THO complex part of transcription export
    complex (GO:0000445) within the THO subcomplex incorporated into the transcription
    export (TREX) complex.
  evidence:
  - reference: GO:0000347
    notes: GO:0000347 defines the THO complex as required for transcription elongation
      through genes containing tandem DNA repeats.
  - reference: GO:0006354
    notes: GO:0006354 is the Gene Ontology biological-process term for DNA-templated
      transcription elongation.
  - reference: PMID:16983072
    notes: Voynov et al. 2006 reported that genes with internal repeats require the
      THO complex for transcription.
- function_id: mrna_export_from_nucleus
  label: mRNA export from nucleus
  grounding: GO:0006406
  description: The THO complex acts within the transcription export complex that couples
    transcription to mRNA export. Mediated by THO complex part of transcription export
    complex (GO:0000445) within the THO subcomplex incorporated into the transcription
    export (TREX) complex.
  evidence:
  - reference: GO:0000347
    notes: GO:0000347 describes THO as part of the TREX complex that couples transcription
      to mRNA export to the cytoplasm.
  - reference: GO:0006406
    notes: GO:0006406 is the Gene Ontology biological-process term for mRNA export
      from nucleus.
  - reference: PMID:11979277
    notes: Strasser et al. 2002 identified TREX as a conserved complex that couples
      transcription with mRNA export.
