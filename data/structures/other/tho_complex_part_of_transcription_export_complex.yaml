identifier: GO:0000445
label: THO complex part of transcription export complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'The THO complex when it is part of the TREX (TRanscription EXport) complex
  that is involved in coupling transcription to export of mRNAs to the cytoplasm.
  In S. cerevisiae, it is composed of four subunits: Hpr1, Tho2, Thp1, and Mft1, while
  the human complex is composed of 7 subunits. In budding yeast, the tetrameric THO
  core (Tho2, Hpr1, Mft1, Thp2) travels with elongating RNA polymerase II and recruits
  the Sub2 RNA helicase and Yra1 adaptor to form the complete TREX complex on nascent
  pre-mRNAs.'
