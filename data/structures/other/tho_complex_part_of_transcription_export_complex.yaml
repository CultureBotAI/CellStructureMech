causal_graphs:
- graph_id: tho_complex_part_of_transcription_export_complex_mechanism
  title: TREX-integrated THO subcomplex recruitment of Sub2-Yra1 onto nascent mRNA
  description: Within the transcription export (TREX) complex, the tetrameric THO
    subcomplex (Tho2, Hpr1, Mft1, Thp2) binds the phosphorylated RNA polymerase II
    CTD and nascent transcript, providing the structural platform that loads Sub2
    and Yra1 for Mex67-Mtr2 recruitment.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the four budding-yeast THO constituents and GO-level
    transcription-elongation and mRNA-export functions without resolving nascent-RNP
    remodeling, Sub2 and Yra1 recruitment, or repeat-associated recombination.
