functions:
- function_id: histone_deacetylase_activity
  label: histone deacetylase activity
  grounding: GO:0004407
  description: The HDA1 complex removes acetyl groups from histone lysine residues
    through the Hda1 Class II catalytic subunits together with Hda2p and Hda3p.
  evidence:
  - reference: GO:0070823
    notes: GO:0070823 defines the HDA1 complex as a histone deacetylase complex.
  - reference: GO:0004407
    notes: GO:0004407 is the Gene Ontology molecular-function term for histone deacetylase
      activity.
  - reference: DOI:10.1073/pnas.081560698
    notes: Wu et al. 2001 reported that mutations in any of HDA1, HDA2 or HDA3 disrupt
      HDA1 complex catalytic activity in vitro and in vivo.
  - reference: DOI:10.1074/jbc.271.26.15837
    notes: Carmen et al. 1996 purified the 350-kDa budding-yeast HDA histone deacetylase
      activity and assigned HDA1 and HDA3 as complex subunits.
