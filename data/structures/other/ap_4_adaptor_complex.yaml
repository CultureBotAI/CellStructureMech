functions:
- function_id: ap4_tgn_cargo_sorting
  label: AP-4-dependent trans-Golgi network cargo sorting
  description: AP-4 is a trans-Golgi-network-associated adaptor complex implicated
    in recognition and sorting of cargo proteins with tyrosine-based motifs.
  evidence:
  - reference: DOI:10.1091/mbc.10.8.2787
    notes: Hirst et al. 1999 identified AP-4, localized it to nonclathrin-coated vesicles
      near the trans-Golgi network, and reported that its mu4 subunit specifically
      interacts with a tyrosine-based sorting signal.
