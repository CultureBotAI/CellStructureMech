discussions:
- discussion_id: ap4_clathrin_scope
  prompt: Avoid modeling AP-4 as a constitutive clathrin-coat adaptor.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - parent_structures
  - causal_graphs#ap4_adaptor_complex_topology
  rationale: GO:0030124 makes AP-4 a child of AP-type membrane coat adaptor complex
    but explicitly notes that it is unclear whether AP-4 forms clathrin coats in vivo.
    This record therefore keeps AP-4 under the AP-type parent while avoiding a universal
    AP-4-to-clathrin-coat edge or a clathrin-coat part_of assertion.
  evidence:
  - reference: GO:0030124
    notes: GO definition and parentage source for AP-4.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
