identifier: GO:0030124
label: AP-4 adaptor complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An AP-type membrane coat adaptor complex that consists of beta4, epsilon,
  mu4 and sigma4 subunits and is found associated with membranes in the trans-Golgi
  network; it is not clear whether AP-4 forms clathrin coats in vivo.
