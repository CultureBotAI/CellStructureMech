discussions:
- discussion_id: exclude_paad_from_paabce
  prompt: Should PaaD be modeled as a constituent of the phenylacetyl-CoA 1,2-epoxidase
    complex?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: No. GO:0062077 uses the paaABCE complex synonym and QuickGO annotates
    PaaA, PaaB, PaaC and PaaE, but not PaaD, to the complex. Grishin et al. 2011 found
    that PaaD did not form a stable complex with the other proteins in the tested
    pull-downs and was not necessary for in vitro PaaABCE catalysis, while noting
    that it may assist maturation of the monooxygenase in vivo.
  evidence:
  - reference: GO:0062077
    notes: GO:0062077 names the PaaABCE complex without PaaD.
  - reference: PMID:21247899
    notes: Grishin et al. 2011 tested PaaD in co-purification, pull-down, and activity
      assays and discussed it as a possible maturation factor rather than a direct
      catalytic constituent.
  posed_by: codex
  posed_date: '2026-10-01'
