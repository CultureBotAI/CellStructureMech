discussions:
- discussion_id: resolve_apex_molecular_constituents
  prompt: Add apex molecular components only after directly localized constituents
    and exact source-neutral family groundings have been identified.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO defines the dinoflagellate apex as a point of the epicone, but this
    pass did not find exact family-level evidence for apex-specific molecular constituents.
  evidence:
  - reference: GO:0097683
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: apical_horn_is_narrower_than_apex
  prompt: Keep the horn-shaped thecate dinoflagellate apical horn separate from the
    general dinoflagellate apex unless curating the narrower GO:0097686 class.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: QuickGO lists GO:0097686 as an is_a child of GO:0097683 and GO:0097686
    defines a horn-shaped apex found in thecate species, so the dinoflagellate apical
    horn should be modeled as a specialized apex rather than folded into the whole
    apex record as an exact synonym.
  evidence:
  - reference: GO:0097683
  - reference: GO:0097686
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:0097683 as the general dinoflagellate apex and leave the
    horn-shaped thecate apical horn for separate GO:0097686 curation.
