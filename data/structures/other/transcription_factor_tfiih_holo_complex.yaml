identifier: GO:0005675
label: transcription factor TFIIH holo complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex that is capable of kinase activity directed towards the C-terminal
  Domain (CTD) of the largest subunit of RNA polymerase II and is essential for initiation
  at RNA polymerase II promoters in vitro. It is composed of the core TFIIH complex
  and the TFIIK complex.
