discussions:
- discussion_id: tfiih_holo_subcomplex_boundaries
  prompt: Model holo TFIIH as core TFIIH plus TFIIK, without flattening both subcomplexes
    into protein constituents.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - has_part
  - components#core_tfiih_holo_portion
  - components#tfiik_complex
  rationale: GO:0005675 denotes the whole TFIIH holo complex and defines it as composed
    of the core TFIIH complex and TFIIK. The core has a separate GO:0000438 portion
    term, and TFIIK has the separate GO:0070985 component term.
  resolution_note: Modeled GO:0000438 and GO:0070985 as GO-grounded protein-complex
    constituents and as has_part targets, leaving TFIIH-core and TFIIK protein-level
    expansion to their own records.
  evidence:
  - reference: GO:0005675
    notes: GO:0005675 identifies whole holo TFIIH.
  - reference: GO:0000438
    notes: GO:0000438 identifies the core TFIIH portion of holo TFIIH.
  - reference: GO:0070985
    notes: GO:0070985 identifies the TFIIK subcomplex.
  posed_by: codex
  posed_date: '2026-10-01'
  resolved_date: '2026-10-01'
