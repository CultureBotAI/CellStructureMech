functions:
- function_id: atp_dependent_xenobiotic_export
  label: ABC-type xenobiotic transporter activity
  grounding: GO:0008559
  description: MacAB-TolC uses the MacB ABC transporter to export macrolide antibiotics
    and other xenobiotics through the MacA adaptor and TolC outer-membrane channel.
  evidence:
  - reference: GO:1990196
    notes: GO:1990196 defines MacAB-TolC by its 14- and 15-membered macrolide transport
      specificity.
  - reference: PMID:18955484
    notes: Tikhonova et al. 2009 reported that E. coli MacB is a dimeric ABC transporter
      whose ATPase activity and macrolide-binding capacity are regulated by MacA.
