identifier: GO:1990071
label: TRAPPII protein complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'A complex that mediates intra-Golgi traffic, Golgi exit, endosome-to-Golgi
  traffic, and the trafficking of autophagy proteins from Golgi to the phagophore
  assembly site. Binds to a component of the COPI coat. In yeast it includes the following
  subunits: Bet3 (as homodimer), Bet5, Tca17, Trs20, Trs23, Trs31, Trs33, Trs65, Trs120,
  Trs130. The whole complex is thought to dimerize with itself.'
definition_source: GO:1990071
mapping_status: PROPOSED
