- discussion_id: nup145n_not_nup145c
  prompt: Keep the Nup145N/Nup98 linker class distinct from the Nup145C/Nup96 outer-ring
    product.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#nup145n_nup98_family
  rationale: The Saccharomyces NUP145 gene encodes a precursor that produces both
    Nup145N and Nup145C. This record models only the N-terminal linker Nup; the C-terminal
    product belongs to the Nup84/Y-complex outer ring.
  evidence:
  - reference: DOI:10.1038/nsmb.3084
    notes: Fischer et al. 2015 studied Nup145N as a linker Nup between NPC modules.
  - reference: DOI:10.1093/emboj/21.3.387
    notes: Lutzmann et al. 2002 reconstituted Nup145C with the Saccharomyces Nup84
      outer-ring complex.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
