  prompt: Leave PriA, PriB, DnaT and DnaG out of the GO:1990160 DnaB-DnaC-Rep-PriC
    complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#dnab_dnac_complex
  - components#rep_helicase
  - components#pric_restart_protein
  - causal_graphs#dnab_dnac_rep_pric_restart
