identifier: cellstructuremech:cullin_e_ubiquitin_ligase_complex
label: Cullin-E ubiquitin ligase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A cullin-RING protein complex defined by the Cullin-E scaffold, experimentally
  characterized in Trypanosoma brucei by co-isolation with Rbx1, Skp1.2 and kelch-domain
  proteins. The associated kelch proteins are candidate client-recognition subunits;
  simultaneous occupancy and fixed stoichiometry have not been established.
definition_source: DOI:10.1038/s41598-025-32077-9
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-10-04T18:55:03Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-10-04T18:56:49Z'
  curator: codex
  action: CURATED_RECORD
  changes: Added four source-bounded constituent classes, verified broad GO parent,
    studied Trypanosoma example, organelle-replication function, nonmechanistic RNAi
    graph and PRIDE link. Preserved control/stage/locus discrepancies; excluded the
    misattributed older WDR1-PLK mechanism and unsupported stoichiometry, family mappings,
    substrates and assembly imaging.
  llm_assisted: true
parent_structures:
