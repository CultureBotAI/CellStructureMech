components:
- component_id: cullin_e
  label: Cullin-E scaffold subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - Cul-E
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro Cullin-E search returned no entry. IPR045093 is
    the broader Cullin type family; conserved cullin domains do not identify this
    divergent paralog class. No exact source-neutral family mapping was established.
  role: Defining cullin scaffold used as the affinity-isolation bait; its depletion
    disrupts coordination of organelle replication in the studied cells.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
    notes: Table 1 and the Cullin-E Results identify Tb927.11.11430 as TbCul-E. Endogenously
      C-terminally 3xHA-tagged scaffold was immunoisolated from procyclic T. brucei;
      Supplementary Table S3, CULE row 2, confirms the bait locus. RNAi lethality
      does not establish assembly essentiality.
- component_id: rbx1
  label: Rbx1 RING subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - Rbx1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro Rbx1 search returned no entry. The RING-box search
    resolved IPR051031, a broader RING-box E3 Ubiquitin Ligase family, not an exact
    mapping of the source's Rbx1 ortholog versus its additional Rbx-like paralogs.
    Its native description is flagged as unchecked LLM-generated text and is not used
    as independent functional evidence.
  role: Co-isolated RING-family constituent of the Cullin-E association; exact contacts
    and substrate-specific catalytic activity were not reconstituted.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
    notes: Table 1, Figure 2B and Supplementary Table S3 CULE row 7 identify Tb927.10.1810
      with the Cullin-E bait. The paper distinguishes this Rbx1 ortholog from the
      other Rbx-like paralogs; their family similarity does not make them additional
      Cullin-E constituents.
- component_id: skp1_2
  label: Skp1.2 adaptor subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - Skp1.2
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro Skp1.2 search returned no entry. The Skp1 search
    returned broader families IPR001232 and IPR016897 plus domains and superfamilies;
    none was established as the exact Skp1.2 paralog class.
  role: Co-isolated Skp1-family constituent proposed to participate in adaptor recruitment;
    a direct binding or delivery mechanism remains unresolved.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
    notes: Table 1, Figure 2B and Supplementary Table S3 CULE row 3 identify Tb927.9.8370
      as the Skp1.2 constituent. This locus is distinct from the TUSK-associated SkpZ
      lineage, so the two complexes are not conflated.
- component_id: kelch_client_recognition
  label: kelch-domain client-recognition subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Native InterPro kelch results include repeats, domains, superfamilies
    and BTB-kelch families. The source's candidate adaptors lack the BTB and F-box
    architecture of conventional adaptors. No exact shared source-neutral family for
    this constituent class was established.
  role: Class representing four co-isolated kelch-domain proteins with proposed client-recognition
    roles, not four copies of a proven obligatory subunit or a claim that all four
    occupy one particle simultaneously.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
    notes: The Cullin-E Results and Table 1 identify Tb927.8.6140, Tb927.11.11450,
      Tb927.5.1980 and Tb927.1.820 as kelch-domain proteins. All four have both significance
      flags in Supplementary Table S3 CULE rows 5, 10, 4 and 9 respectively, corroborating
      Figure 2B. Co-enrichment supports association but does not test exact stoichiometry
      or client recognition.
canonical_examples:
- taxon_id: NCBITaxon:5691
  taxon_label: Trypanosoma brucei
  note: 'Complex isolation used endogenously tagged procyclic-form Lister 427 cells.
    RNAi experiments are kept separate: Figure 6 depicts the bloodstream cell cycle
    and the qRT-PCR Methods name parental 2T1 cells, while the RNAi subsection does
    not explicitly restate stage and strain. The 927 protein database used for peptide
    annotation is not the cultured strain. The species taxon was verified at NCBI;
    no broad clade-level assembly distribution is inferred.'
  reference: DOI:10.1038/s41598-025-32077-9
functions:
- function_id: organelle_replication_coordination
  label: coordination of organelle replication
  description: Cullin-E RNAi in the studied T. brucei cells produces an increasing
    fraction with one kinetoplast and two nuclei (1K2N); imaged 1K2N cells also retain
    a single Golgi apparatus. This supports a role in coordinating division events,
    but does not identify the molecular pathway or demonstrate that any affected protein
    is a direct ligase substrate.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
    notes: The paper's own Cullin-E knockdown Results and Figure 6B-D provide DAPI
      counts and GRASP immunofluorescence. The function is bounded to these observations,
      not the paper's conflicted attribution of older WDR1/PLK work to Cullin-E.
datasets:
- accession: PXD042022
  title: Trypanosome cullin isolation and depletion proteomics
  description: Publication-linked affinity-isolation and RNAi proteomics; identifier
    and landing-page reference only.
  organism: Trypanosoma brucei
  dataset_type: PROTEOMICS
  repository: PRIDE
  url: https://www.ebi.ac.uk/pride/archive/projects/PXD042022
  publication: DOI:10.1038/s41598-025-32077-9
  notes: Native accession, organism 5691, DOI and PMID:41413177 verified. The native
    entry is a PARTIAL submission. It describes three tagged isolations and six wild-type
    controls, whereas the paper's Methods and Supplementary Table S3 list seven wild-type
    controls. Cullin-E RNAi uses label-free proteomics at 12 and 24 hours; the separate
    Cullin-A experiment uses SILAC. No raw spectra, processed table or bulk repository
    text is redistributed. Published Supplementary Table S3 was inspected read-only.
evidence:
- reference: DOI:10.1038/s41598-025-32077-9
  notes: Canavate del Pino et al., PMID:41413177. Current PMC12816148.1 JATS identity
    and checksum verified; Table 1, composition and knockdown Results, Discussion
    and relevant Methods inspected. Original Figures 2, 6 and 7 visually inspected
    with native media checksum verification. Supplementary Table S3 CULE identifiers
    and enrichment flags independently inspected. Supports the named complex and bounded
    perturbation outputs, not fixed architecture or the asserted older WDR1/PLK mechanism.
- reference: DOI:10.1371/journal.ppat.1006146
  notes: PMID:28052114, native PMC5241021.1. The older Results and Figure 3 assign
    the WDR1-DDB1 association to TbCUL4, Tb927.3.1290, and report that TbCUL1, Tb927.11.11430,
    did not co-precipitate WDR1. This establishes the cross-paper identity conflict;
    it is not evidence for a WDR1/PLK mechanism in Cullin-E.
