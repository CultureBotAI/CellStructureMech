discussions:
- discussion_id: identity_and_scope
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep the Cullin-E association distinct from other cullins and TUSK.
  rationale: A scaffold name or broader ligase class is not an exact complex identity.
  notes: Whole-repository hidden/ignored-inclusive name, locus, alias, DOI, PMID and
    accession searches found only the prior unaccepted discovery lead; parsed identities
    and synonyms across 875 prior records found no match. Native GO Cullin-E, TbCul-E,
    CulE, TbCulE, exact-locus and cullin queries were inspected with complete returned
    pages. GO:0031461 is the verified broader cullin-RING ubiquitin ligase complex
    parent, not an exact identity. Exact Complex Portal queries found no entry. The
    modern letter-based naming avoids assumed orthology to mammalian CUL1. Old protein
    name TbCUL1 is not adopted as an exact complex synonym.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
  - reference: DOI:10.1371/journal.ppat.1006146
  - reference: GO:0031461
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
