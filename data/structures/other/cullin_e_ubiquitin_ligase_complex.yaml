- discussion_id: wdr1_plk_cross_complex_conflict
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Exclude the older WDR1-DDB1-PLK mechanism from Cullin-E.
  rationale: The newer paper's citation attribution conflicts with the cited primary
    identifiers.
  notes: The older paper's TbCUL4 is Tb927.3.1290, corresponding to the newer Table
    1 TbCul-D scaffold. It co-precipitates WDR1 and DDB1. The older TbCUL1 is Tb927.11.11430,
    corresponding to TbCul-E, and explicitly does not co-precipitate WDR1 in that
    experiment. The newer Discussion nevertheless attributes prior PLK-substrate evidence
    to Cullin-E. No WDR1, DDB1 or PLK constituent, substrate or causal edge is imported
    from that reference. This is a boundary decision, not a claim that all possible
    Cullin-E/PLK relationships have been disproved.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
  - reference: DOI:10.1371/journal.ppat.1006146
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: architecture_and_direct_substrates
  kind: CURATION_TODO
  status: OPEN
  prompt: Establish simultaneous composition, localization and direct ligase substrates.
  rationale: Affinity enrichment and RNAi abundance changes do not reconstruct a molecular
    mechanism.
  notes: Table 1, Figure 2B and the checked S3 rows support association. They do not
    resolve copy number, direct pairwise contacts, kelch-subunit co-occupancy or assembly
    requirements. The RNAi outputs support the bounded function and NONMECHANISTIC
    graph, not direct ubiquitylation of KKT9 or other changed proteins. No organellar
    part_of, physical dimension, essential assembly subunit, broad phylogenetic assembly
    distribution or exact narrower GO function is inferred.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
  posed_by: codex
  posed_date: '2026-10-04'
  attaches_to:
  - functions#organelle_replication_coordination
  - causal_graphs#cullin_e_depletion_outputs
- discussion_id: declined_other_enrichment_hits
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Keep uncertain enrichment hits and modifiers separate from established constituent
    classes.
  rationale: Not every affinity-isolation hit is a stable structural constituent or
    client.
  notes: The source notes Nedd8, RFC subunit 4, VPS13 and Tb927.6.4360 among Cullin-E
    co-isolates, while saying the physiological significance of most additional hits
    is unclear. Nedd8 is retained as modification context rather than an obligatory
    complex subunit. These hits, changed RNAi proteins, other cullin baits and other
    Rbx-like paralogs are not promoted to components or direct substrates.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: assay_and_source_discrepancies
  kind: CURATION_TODO
  status: OPEN
  prompt: Reconcile RNAi specimen detail, control counts and the duplicate Figure
    7 locus.
  rationale: Source-specific descriptions must not be silently harmonized.
  notes: The isolation/tagging Methods specify procyclic Lister 427 cells; the RNAi
    subsection does not explicitly specify stage/strain, the qRT-PCR subsection names
    parental 2T1, and Figure 6A depicts bloodstream forms. No claim makes all experiments
    procyclic. Native PRIDE lists six wild-type isolation controls, versus seven in
    paper Methods and S3 (WT_1 through WT_7); Figure 2's caption uses n > 3. The record
    does not flatten these to one replicate count. Figure 7 labels both ESAG11 and
    VSG-related points with Tb927.1.4900; neither ambiguous assignment enters the
    graph. The reference database 927 release 42 is annotation context, not a cultured
    strain. The structured iModulonDB adapter lists 28 datasets without a matching
    Trypanosoma organism; it is not applicable, not negative biological evidence.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: native_assembly_imaging
  kind: CURATION_TODO
  status: OPEN
  prompt: Obtain experimentally resolved imaging of the assembled Cullin-E complex.
  rationale: Phenotype images and generic or predicted models do not locate or resolve
    this assembly.
  notes: Original Figures 2, 6 and 7 were visually inspected and their native media
    checksums verified. They show enrichment, RNAi phenotypes and proteomic changes,
    not a resolved Cullin-E particle. Figure 6D marks Golgi and mitochondria, not
    Cullin-E. Figure 8 is a generic scheme based on a human Cullin1 complex, not an
    experimental structure of this complex. Native JATS establishes CC BY 4.0, but
    no figure is hosted or presented as a complex micrograph.
  evidence:
  - reference: DOI:10.1038/s41598-025-32077-9
  posed_by: codex
  posed_date: '2026-10-04'
