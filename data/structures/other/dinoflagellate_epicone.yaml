discussions:
- discussion_id: resolve_epicone_molecular_constituents
  prompt: Add epicone molecular components only after directly localized constituents
    and exact source-neutral family groundings have been identified.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO defines the dinoflagellate epicone as a subcellular region above the
    cingulum, but this pass did not find exact family-level evidence for epicone-specific
    molecular constituents.
  evidence:
  - reference: GO:0097613
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: apex_is_narrower_than_epicone
  prompt: Keep dinoflagellate apex separate from the general dinoflagellate epicone
    unless curating the narrower GO:0097683 class.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: QuickGO lists GO:0097683 as a part_of child of GO:0097613, so the dinoflagellate
    apex should be modeled as an epicone part rather than folded into the whole epicone
    record as an exact synonym.
  evidence:
  - reference: GO:0097613
  - reference: GO:0097683
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:0097613 as the whole anterior epicone region and leave
    the apex for separate GO:0097683 curation.
- discussion_id: hypocone_is_sibling
  prompt: Keep dinoflagellate hypocone separate from the dinoflagellate epicone unless
    curating the posterior GO:0097614 class.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0097614 is the posterior counterpart of GO:0097613 and is separated
    from the epicone by the cingulum, so it should not be modeled as a synonym or
    part of the anterior epicone region.
  evidence:
  - reference: GO:0097613
  - reference: GO:0097614
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:0097613 as the anterior dinoflagellate epicone and leave
    the posterior hypocone for separate GO:0097614 curation.
