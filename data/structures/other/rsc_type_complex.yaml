functions:
- function_id: chromatin_remodeling
  label: chromatin remodeling
  grounding: GO:0006338
  description: ATP-dependent remodeling of nucleosome positions and histone-DNA contacts
    that changes chromatin architecture.
  evidence:
  - reference: GO:0006338
    notes: GO:0006338 is the Gene Ontology biological-process term for chromatin remodeling.
  - reference: GO:0016586
    notes: Gene Ontology models the RSC-type complex as capable of chromatin remodeling.
  - reference: PMID:8980231
    notes: Cairns et al. 1996 isolated RSC as an essential and abundant chromatin-remodeling
      complex.
evidence:
