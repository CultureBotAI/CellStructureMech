causal_graphs:
- graph_id: yeast_rsc_chromatin_remodeling
  title: RSC supports ATP-dependent chromatin remodeling
  description: In Saccharomyces cerevisiae, the Sth1 ATPase and accessory RSC subunits
    assemble into an ATP-dependent remodeler that engages nucleosomes through the
    core and Arp-module lobes.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the curated Sth1 ATPase subunit and broad chromatin-remodeling
    activity without resolving histone-tail reader engagement, nucleosome translocation
    or RSC recruitment to individual loci.
  nodes:
  - node_id: sth1_rsc_atpase_subunit
    label: Sth1 RSC ATPase subunit
    node_type: GENE_OR_PROTEIN
    component_ref: sth1_rsc_atpase_subunit
  - node_id: rsc_type_complex
    label: RSC-type complex
    node_type: STRUCTURE
    grounding: GO:0016586
  - node_id: chromatin_remodeling
    label: chromatin remodeling
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006338
  edges:
  - subject: sth1_rsc_atpase_subunit
    predicate: contributes to
    object: rsc_type_complex
    description: Sth1 is the ATPase-domain-containing catalytic constituent of budding-yeast
      RSC.
    evidence:
    - reference: DOI:10.7554/eLife.54449
      notes: Patel et al. 2019 assign Sth1 to the RSC core and Arp-module architecture.
  - subject: rsc_type_complex
    predicate: supports
    object: chromatin_remodeling
    description: The RSC-type complex carries out chromatin remodeling.
    evidence:
    - reference: GO:0006338
      notes: GO:0006338 lists GO:0016586 as a cellular component capable of chromatin
        remodeling.
