identifier: GO:0016586
label: RSC-type complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A SWI/SNF-type complex that contains a bromodomain containing-protein,
  such as yeast Rsc1 or Rsc4 or mammalian PB1/BAF180. The RSC complex is generally
  recruited to RNA polymerase III promoters and is specifically recruited to RNA polymerase
  II promoters by transcriptional activators and repressors; it is also involved in
  non-homologous end joining.
