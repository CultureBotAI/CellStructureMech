identifier: GO:0048492
label: ribulose bisphosphate carboxylase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex containing either both large and small subunits or just small
  subunits which carries out the activity of producing 3-phosphoglycerate from carbon
  dioxide and ribulose-1,5-bisphosphate. The multi-subunit ribulose-1,5-bisphosphate
  carboxylase/oxygenase (RuBisCO) enzyme complex that catalyzes the primary carbon-fixation
  step of the Calvin-Benson-Bassham cycle by carboxylating ribulose-1,5-bisphosphate
  with CO2 to yield two molecules of 3-phosphoglycerate. In cyanobacteria, purple
  bacteria, chemoautotrophic bacteria, and microalgae, Form I RuBisCO assembles as
  a hexadecameric L8S8 complex (eight catalytic RbcL/CbbL large subunits and eight
  RbcS/CbbS small subunits) often concentrated within bacterial carboxysomes or algal
  pyrenoids.
