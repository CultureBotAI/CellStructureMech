- component_id: bmc_t
  label: BMC-T shell pseudohexamers (CcmO, CcmP)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ccmO
  - ccmP
  essentiality: CONDITIONAL
  role: 'Tandem-BMC-domain paralogues that tile the shell alongside the BMC-H hexamers.
    Essentiality differs within the set and the field carries the weaker value: UniProt
    states CcmO is required for carboxysome formation and for recruiting CcmK2, while
    CcmP is a gated dimer of stacked trimers thought to control metabolite passage
    rather than to be required for assembly. Functions in the ribulose bisphosphate
    carboxylase (RuBisCO) holoenzyme in ribulose bisphosphate carboxylase complex.'
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The only InterPro entry both share is the generic BMC domain (IPR000249),
    which BMC-H proteins carry too, so no exact family term denotes the BMC-T set.
    CcmP alone has IPR044870.
  evidence:
  - reference: PMID:22928045
    notes: UniProt cites this paper (P46205) for CcmO being required to recruit the
      major shell protein CcmK2 to the pre-carboxysome, and for its oligomerisation
      and interaction with CcmK2.
  - reference: PMID:24267892
    notes: UniProt cites this paper (P46205, P46204) for CcmO's role in carboxysome
      formation.
  - reference: PMID:23572529
    notes: UniProt cites this paper (Q31QW7) for CcmP forming a dimer of stacked trimers
      in the shell and for the gating that is thought to control transport of RuBisCO
      reactants.
