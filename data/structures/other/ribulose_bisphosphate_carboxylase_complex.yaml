  essentiality: DISPENSABLE
  role: Distributes carboxysomes along the nucleoid. McdB binds the carboxysome and,
    with the McdA ATPase, sets spacing, size and inheritance; without the system carboxysomes
    aggregate rather than failing to form. Functions in the ribulose bisphosphate
    carboxylase (RuBisCO) holoenzyme in ribulose bisphosphate carboxylase complex.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro assigns only the McdB C-terminal domain IPR063627 to this
    example; no integrated family denotes the complete McdB positioning component.
  evidence:
  - reference: PMID:30520729
    notes: UniProt cites this paper (Q8GJM6) for McdA and McdB together mediating
      carboxysome spacing, and for McdB self-association and interaction with McdA.
  - reference: PMID:34406783
    notes: UniProt cites this paper (Q8GJM6) for the same distribution role and for
      preventing carboxysome aggregation.
