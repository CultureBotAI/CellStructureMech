identifier: GO:0030117
label: membrane coat
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: Any of several different proteinaceous coats that can associate with membranes.
  Membrane coats include those formed by clathrin plus an adaptor complex, the COPI
  and COPII complexes, and possibly others. They are found associated with membranes
  on many vesicles as well as other membrane features such as pits and perhaps tubules.
