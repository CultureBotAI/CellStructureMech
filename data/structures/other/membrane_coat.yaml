components:
- component_id: membrane_coat_scaffold_proteins
  label: membrane-coat scaffold proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Membrane coats are a source-neutral parent over clathrin coats,
    vesicle coats, COPI coats, COPII coats, and possible non-vesicle coats; no exact
    InterPro, Pfam, NCBIfam, GO, or Complex Portal CURIE denotes a universal membrane-coat
    scaffold family.
  role: Proteinaceous scaffold subunits or coat subcomplexes that assemble into coats
    on membranes.
  evidence:
  - reference: GO:0030117
    notes: GO defines membrane coats as proteinaceous coats that associate with membranes,
      including clathrin/adaptor, COPI and COPII coats.
  - reference: GO:0030118
    notes: GO places clathrin coats under the membrane-coat parent.
  - reference: GO:0030120
    notes: GO places vesicle coats under the membrane-coat parent.
- component_id: membrane_coat_recruitment_modules
  label: membrane-coat adaptor and recruitment modules
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Membrane-coat recruitment factors span AP-type adaptor complexes,
    COPI Arf-family GTPases, COPII Sar1-family GTPases, and additional subtype-specific
    cargo-selection factors; no exact source-neutral protein-family or protein-complex
    CURIE denotes that full class.
  role: Connects coat scaffold assemblies to membranes or cargo in subtype-specific
    membrane coats.
  evidence:
  - reference: GO:0030119
    notes: GO defines AP-type membrane coat adaptor complexes as membrane-coat complexes
      that link clathrin or another protein scaffold to membranes and selected cargo.
  - reference: DOI:10.1016/0092-8674(91)90176-y
    notes: Serafini et al. 1991 identified ADP-ribosylation factor as a subunit of
      Golgi-derived COP-coated vesicle coats.
  - reference: DOI:10.1016/0092-8674(94)90138-4
    notes: Barlowe et al. 1994 identified Sar1p as one of the proteins that forms
      the COPII coat on ER-derived vesicles.
