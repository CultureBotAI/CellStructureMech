part_of:
- GO:0030874
components:
- component_id: nucleolar_chromatin
  label: nucleolar chromatin
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0030874
  essentiality: UNKNOWN
  role: Nucleolus-associated nuclear chromatin that includes the DNA encoding ribosomal
    RNA. Functions in nucleolar rDNA chromatin organization and transcription in nucleolar
    chromatin. Functions along the tandemly repeated nucleolar rDNA protrusion.
  evidence:
  - reference: GO:0030874
    notes: GO:0030874 defines nucleolar chromatin as nuclear chromatin associated
      with the nucleolus, including DNA that encodes rRNA.
- component_id: rna_polymerase_i_complex
  label: RNA polymerase I complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005736
  essentiality: UNKNOWN
  role: Nucleolar polymerase complex that transcribes ribosomal DNA to produce the
    large pre-rRNA precursor. Functions in nucleolar rDNA chromatin organization and
    transcription in nucleolar chromatin. Functions along the tandemly repeated nucleolar
    rDNA protrusion.
  evidence:
  - reference: GO:0005736
    notes: GO:0005736 identifies RNA polymerase I as a eukaryotic nuclear complex
      that typically produces rRNAs.
  - reference: DOI:10.1146/annurev.genet.33.1.261
    notes: Venema and Tollervey 1999 review RNA polymerase I transcription during
      Saccharomyces cerevisiae ribosome synthesis.
- component_id: small_subunit_processome
  label: small-subunit processome
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0032040
  essentiality: UNKNOWN
  role: Early preribosomal ribonucleoprotein complex that contains 35S pre-rRNA and
    U3 snoRNA in budding yeast. Functions in nucleolar rDNA chromatin organization
    and transcription in nucleolar chromatin. Functions along the tandemly repeated
    nucleolar rDNA protrusion.
  evidence:
  - reference: GO:0032040
    notes: GO:0032040 defines the small-subunit processome as a large early preribosomal
      ribonucleoprotein complex.
  - reference: DOI:10.1038/nature00769
    notes: Dragon et al. 2002 characterized a large nucleolar U3 ribonucleoprotein
      required for 18S rRNA biogenesis.
- component_id: box_haca_snornp_complex
  label: box H/ACA snoRNP complex
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0031429
  essentiality: UNKNOWN
  role: Small nucleolar ribonucleoprotein complex that guides pseudouridylation of
    rRNA during ribosome synthesis. Functions in nucleolar rDNA chromatin organization
    and transcription in nucleolar chromatin. Functions along the tandemly repeated
    nucleolar rDNA protrusion.
  evidence:
  - reference: GO:0031429
    notes: GO:0031429 defines the box H/ACA snoRNP complex as a nucleolar complex
      that catalyzes pseudouridylation of rRNA residues.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: COMMON
  note: Exhibits rDNA protrusion (GO:0030875) along the tandemly repeated nucleolar
    rDNA protrusion. Exhibits nucleolar chromatin (GO:0030874) in nucleolar rDNA chromatin
    organization and transcription. Nucleoli are non-membrane-bounded bodies of eukaryotic
    nuclei that concentrate ribosomal gene transcription and early ribosome biogenesis.
  reference: GO:0005730
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Characterized model system for rDNA protrusion (GO:0030875) along the tandemly
    repeated nucleolar rDNA protrusion. Characterized model system for nucleolar chromatin
    (GO:0030874) in nucleolar rDNA chromatin organization and transcription. Budding-yeast
    model in which nucleolar ribosome synthesis includes 35S pre-rRNA processing and
    U3-containing small-subunit processome assembly.
  reference: DOI:10.1038/nature00769
functions:
- function_id: transcription_by_rna_polymerase_i
  label: transcription by RNA polymerase I
  grounding: GO:0006360
  description: Mediated by nucleolar chromatin (GO:0030874) in nucleolar rDNA chromatin
    organization and transcription. RNA polymerase I in the nucleolus transcribes
    ribosomal DNA to produce the major pre-rRNA precursor. Mediated by rDNA protrusion
    (GO:0030875) along the tandemly repeated nucleolar rDNA protrusion.
  evidence:
  - reference: GO:0006360
    notes: GO:0006360 denotes RNA synthesis from a DNA template by RNA polymerase
      I.
  - reference: DOI:10.1146/annurev.genet.33.1.261
    notes: Venema and Tollervey 1999 review rDNA transcription as the first stage
      of yeast ribosome synthesis.
- function_id: rrna_processing
  label: rRNA processing
  grounding: GO:0006364
  description: Mediated by nucleolar chromatin (GO:0030874) in nucleolar rDNA chromatin
    organization and transcription. Nucleolar ribonucleoproteins process primary rRNA
    transcripts as part of ribosome biogenesis. Mediated by rDNA protrusion (GO:0030875)
    along the tandemly repeated nucleolar rDNA protrusion.
  evidence:
  - reference: GO:0006364
    notes: GO:0006364 denotes conversion of a primary rRNA transcript into mature
      rRNA molecules.
  - reference: DOI:10.1038/nature00769
    notes: Dragon et al. 2002 identified the nucleolar U3 small-subunit processome
      as required for 18S rRNA biogenesis.
- function_id: ribosome_biogenesis
  label: ribosome biogenesis
  grounding: GO:0042254
  description: Mediated by nucleolar chromatin (GO:0030874) in nucleolar rDNA chromatin
    organization and transcription. The nucleolus organizes early transcription, rRNA
    processing, and preribosomal assembly steps that contribute to production of cytoplasmic
    ribosomal subunits. Mediated by rDNA protrusion (GO:0030875) along the tandemly
    repeated nucleolar rDNA protrusion.
  evidence:
  - reference: GO:0042254
    notes: GO:0042254 denotes the biosynthesis, assembly, and arrangement of ribosome-subunit
      constituents.
  - reference: DOI:10.1038/nrm2184
    notes: Boisvert et al. 2007 review the nucleolus as a eukaryotic nuclear body
      centered on ribosome biogenesis.
