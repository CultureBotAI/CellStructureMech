- component_id: rent_rdna_silencing_machinery
  label: rDNA chromatin silencing deacetylase Sir2 (RENT complex subunit)
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - SIR2
  essentiality: DISPENSABLE
  role: NAD+-dependent histone deacetylase recruited to the rDNA non-transcribed spacer
    (NTS1/NTS2) within the RENT complex to silence Pol II transcription and suppress
    unequal rDNA sister-chromatid recombination.
  evidence:
