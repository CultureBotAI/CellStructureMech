identifier: GO:0030875
label: rDNA protrusion
structure_category: OTHER
structure_kind: OTHER
definition: Any of the tandem arrays of rDNA localized at the periphery of the nucleus
  and protruding into the nucleolus, and associated proteins. May be visible as a
  single or double spot by DAPI staining. In Saccharomyces cerevisiae and Schizosaccharomyces
  pombe, the rDNA protrusion comprises the tandemly repeated 35S/37S ribosomal DNA
  array on chromosome XII or III extending from the nuclear chromatin mass into the
  crescent-shaped nucleolus, bound by Fob1, Sir2/RENT, Net1, Hmo1, and RNA polymerase
  I.
