causal_graphs:
- graph_id: rdna_protrusion_mechanism
  title: Nucleolar rDNA protrusion organization and RNA polymerase I transcription
  description: Tandem rDNA repeats organized into the nucleolar rDNA protrusion recruit
    RENT (Net1-Sir2-Cdc14) and RNA polymerase I complexes to couple high-rate pre-rRNA
    transcription with repeat stability.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph summarizes core nucleolar rDNA transcription and pre-rRNA
    processing steps without asserting every yeast ribosome-assembly factor or all
    pre-40S and pre-60S intermediates.
