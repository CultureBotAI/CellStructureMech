identifier: GO:1990158
label: DnaB-DnaC-DnaT-PriA-PriB complex
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A protein-DNA complex consisting of the helicase loading complex DnaB-DnaC,
  replication restart proteins DnaT, PriA and PriB, and associated DNA. Involved in
  the restart of DNA replication after a stalled replication fork has been repaired.
