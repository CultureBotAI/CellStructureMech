identifier: GO:0097691
label: bacterial extracellular vesicle
structure_category: OTHER
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: Small membrane vesicle (< 1 um) that buds off a prokaryotic cell plasma
  membrane, able to carry proteins, phospholipids, lipopolysaccharides, nucleic acids,
  viruses, and more. Important in intercellular communication and pathogenesis; can
  exist within host cells.
