components:
- component_id: bacterial_extracellular_vesicle_membrane
  label: bacterial extracellular vesicle membrane
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bacterial extracellular vesicle membranes are mixed lipid, protein,
    and cell-envelope-derived assemblies whose composition and origin vary across
    Gram-negative outer membrane vesicles, outer-inner membrane vesicles, and Gram-positive
    membrane vesicles. ComponentTypeEnum has no MEMBRANE value, so this broad composite
    membrane is typed as OTHER until exact source-neutral membrane groundings can
    be verified.
  role: Composite membrane that bounds the released bacterial extracellular vesicle
    and carries or encloses its packaged cargo.
  evidence:
  - reference: GO:0097691
    notes: GO:0097691 defines the bacterial extracellular vesicle as a small membrane
      vesicle that buds from a bacterial plasma membrane.
  - reference: DOI:10.1038/s41579-018-0112-2
    notes: Toyofuku, Nomura and Eberl 2019 review distinct bacterial membrane-vesicle
      origins and compositions.
- component_id: bacterial_extracellular_vesicle_cargo
  label: bacterial extracellular vesicle cargo
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bacterial extracellular vesicle cargo is heterogeneous across species,
    envelope architectures, and release pathways; no single protein, nucleic-acid,
    lipid, or polysaccharide CURIE denotes the variable packaged material.
  role: Variable bacterial material packaged inside or associated with the extracellular
    vesicle for export to neighboring microbes or host cells.
  evidence:
  - reference: GO:0097691
    notes: GO:0097691 lists proteins, phospholipids, lipopolysaccharides, nucleic
      acids and viruses among the cargos bacterial extracellular vesicles can carry.
  - reference: DOI:10.1016/j.semcdb.2015.02.006
    notes: Kim et al. 2015 review bacterial extracellular vesicles from Gram-negative
      and Gram-positive bacteria as extracellular carriers of bioactive cargo.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Both Gram-negative and Gram-positive bacteria release extracellular membrane
    vesicles, with occurrence and vesicle origin varying by species and growth condition.
  reference: DOI:10.1016/j.semcdb.2015.02.006
canonical_examples:
- taxon_id: NCBITaxon:1280
  taxon_label: Staphylococcus aureus
  note: Staphylococcus aureus is a Gram-positive model in which extracellular membrane
    vesicle release and vesicle protein cargo were experimentally characterized.
  reference: DOI:10.1002/pmic.200900338
functions:
- function_id: bacterial_extracellular_cargo_delivery
  label: bacterial extracellular cargo delivery
  description: Bacterial extracellular vesicles move membrane-associated and luminal
    cargo from producing bacteria into the extracellular milieu, where vesicle contents
    can affect neighboring microbes or host cells.
  evidence:
  - reference: DOI:10.1038/s41579-018-0112-2
    notes: Toyofuku, Nomura and Eberl 2019 review bacterial membrane vesicles as vehicles
      for molecular cargo in microbe-microbe and host-microbe interactions.
