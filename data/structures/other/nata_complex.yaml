      Ser, Ala, Gly or Thr residues of protein acceptors.
  - reference: DOI:10.1128/MCB.23.20.7403-7414.2003
    notes: Gautschi et al. 2003 describe yeast NatA as an N-alpha-acetyltransferase
      that acts cotranslationally at ribosomes.
