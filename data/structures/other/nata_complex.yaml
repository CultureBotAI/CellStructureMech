  - NAT1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The budding-yeast NatA literature follows Nat1 naming; no exact
    source-neutral InterPro, Pfam, NCBIfam or UniProt family identifier for this NatA
    subunit class was curated in this pass.
  role: Noncatalytic auxiliary constituent that anchors budding-yeast NatA to ribosomes
    and positions nascent polypeptides for N-terminal acetylation.
  evidence:
  - reference: DOI:10.1128/MCB.23.20.7403-7414.2003
    notes: Gautschi et al. 2003 purified Saccharomyces cerevisiae NatA from ribosomal
      salt wash, identified Nat1p, Ard1p and Nat5p in the complex, and showed that
      Nat1p anchors the complex to ribosomes.
