identifier: GO:0031415
label: NatA complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A conserved complex that catalyzes the transfer of an acetyl group to
  an N-terminal Ser, Ala, Gly, or Thr residue of a protein acceptor molecule. In Saccharomyces
  the complex includes Nat1p and Ard1p, and may contain additional proteins.
