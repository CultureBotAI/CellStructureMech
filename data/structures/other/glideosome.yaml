  title: GAP50 anchors the MyoA glideosome at the IMC
  description: MyoA, MLC1, GAP45 and GAP50 form an apicomplexan actomyosin motor complex
    that is anchored to the inner membrane complex and supports parasite gliding motility
    and host-cell invasion.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures the core Toxoplasma glideosome complex identified
    by Gaskins et al. It leaves actin-filament flux, microneme adhesins, aldolase
    coupling, GAP40 and GAPM proteins outside the first-pass component boundary.
