  reference: DOI:10.1083/jcb.200311137
functions:
- function_id: cell_surface_adhesin_mediated_gliding_motility
  label: cell surface adhesin-mediated gliding motility
  grounding: GO:0071980
  description: The inner-membrane-complex-anchored glideosome drives the actomyosin-dependent
    gliding motility of apicomplexan parasites.
  evidence:
  - reference: GO:0071980
    notes: Gene Ontology defines cell surface adhesin-mediated gliding motility as
      gliding driven by adhesins propelled by membrane motor proteins.
  - reference: DOI:10.1016/j.mib.2009.06.008
    notes: Daher and Soldati-Favre 2009 review the glideosome as the myosin-based
      motor for apicomplexan parasite motility.
- function_id: host_cell_invasion
  label: host-cell invasion
  description: The glideosome supports active entry of motile apicomplexan stages
    into host cells.
  evidence:
  - reference: GO:0160055
    notes: Gene Ontology defines the glideosome as regulating parasite gliding motility
      and invasion of host cells.
  - reference: DOI:10.1046/j.1365-2958.2002.03056.x
    notes: Opitz and Soldati 2002 review the early glideosome model for Toxoplasma
      gliding and host-cell invasion.
evidence:
