components:
- component_id: myoa_class_xiv_myosin_heavy_chain
  label: MyoA class XIV myosin heavy chain
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - MyoA
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Apicomplexan MyoA is the glideosome myosin heavy-chain motor; available
    family groundings for reviewed Plasmodium MyoA entries cover broad myosin motor
    domains rather than the source-neutral glideosome MyoA family.
  role: Class XIV myosin heavy-chain motor that assembles with light-chain and GAP
    proteins in the apicomplexan glideosome.
  evidence:
  - reference: GO:0160055
    notes: Gene Ontology defines the glideosome as containing myosin heavy chains.
  - reference: DOI:10.1083/jcb.200311137
    notes: Gaskins et al. 2004 identified TgMyoA in a Toxoplasma glideosome complex.
- component_id: mlc1_myosin_light_chain
  label: MLC1 myosin light chain
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - MLC1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Apicomplexan glideosome light chains include TgMLC1 and Plasmodium
    MTIP-like proteins, but no exact source-neutral CURIE for this functional light-chain
    cohort was verified in this pass.
  role: Myosin light-chain partner of the MyoA heavy chain in the glideosome motor.
  evidence:
  - reference: GO:0160055
    notes: Gene Ontology defines the glideosome as containing myosin light chains.
  - reference: DOI:10.1083/jcb.200311137
    notes: Gaskins et al. 2004 identified TgMLC1 in the Toxoplasma glideosome complex.
