  - GAP45
  essentiality: UNKNOWN
  role: Glideosome-associated protein constituent of the apicomplexan motor complex.
  evidence:
  - reference: GO:0160055
    notes: Gene Ontology defines the glideosome as containing GAP45.
  - reference: Pfam:PF29346
    notes: Pfam PF29346 is the Glideosome-associated protein 45 family, integrated
      by InterPro as IPR063210.
  - reference: DOI:10.1083/jcb.200311137
    notes: Gaskins et al. 2004 identified TgGAP45 in the Toxoplasma glideosome complex.
- component_id: gap50_membrane_receptor
  label: GAP50 membrane receptor
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - GAP50
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GAP50 maps to broad metallophosphatase or purple-acid-phosphatase
    entries in UniProt cross-references; those domains are not exact for the apicomplexan
    glideosome GAP50 membrane-receptor family.
  role: Integral membrane receptor that anchors the MyoA/light-chain/GAP45 motor complex
    to the inner membrane complex.
  evidence:
  - reference: GO:0160055
    notes: Gene Ontology defines the glideosome as containing GAP50.
  - reference: DOI:10.1083/jcb.200311137
    notes: Gaskins et al. 2004 identified TgGAP50 and reported it as the integral
