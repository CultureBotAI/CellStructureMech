identifier: GO:0160055
label: glideosome
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex composed of at least GAP45 (gliding-associated protein),
  GAP50 and myosin heavy and light chains. Anchored via GAP50 to the inner membrane
  complex of motile and invasive forms of apicomplexan parasites and regulates parasite
  gliding motility and invasion of host cells.
