- reference: GO:0005730
  notes: Gene Ontology cellular-component term for the nucleolus.
- reference: ComplexPortal:CPX-1669
  notes: EBI Complex Portal entry for the Saccharomyces cerevisiae RENT complex (Net1-Sir2-Cdc14).
- reference: PMID:10219245
  notes: Straight et al. 1999 (DOI:10.1016/s0092-8674(00)80734-5), Net1, a Sir2-associated
    nucleolar protein required for rDNA silencing and nucleolar integrity, Cell.
- reference: PMID:11511359
  notes: Shou et al. 2001 (DOI:10.1016/s1097-2765(01)00291-x), Net1 stimulates RNA
    polymerase I transcription and regulates nucleolar structure independently of
    controlling mitotic exit, Molecular Cell.
- reference: PMID:12056824
  notes: Yoshida and Toh-e 2002 (DOI:10.1016/s0006-291x(02)00544-2), budding yeast
    Cdc5 phosphorylates Net1 and assists Cdc14 release from the nucleolus.
causal_graphs:
- graph_id: rent_complex_nucleolar_silencing_and_cdc14_sequestration
  title: Net1p scaffolds Sir2p and Cdc14p in the nucleolar RENT complex for rDNA silencing
    and mitotic exit control
  description: In Saccharomyces cerevisiae, Net1p binds Sir2p and Cdc14p to assemble
    the nucleolar RENT complex, recruiting Sir2p to mediate rDNA heterochromatin formation
    while sequestering Cdc14p to regulate exit from mitosis.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Captures core Net1p-Sir2p-Cdc14p assembly in the nucleolus and its
    dual roles in rDNA silencing and mitotic-exit regulation; FEAR/MEN kinase signaling
    cascades are omitted.
