    role: Reviewed Saccharomyces cerevisiae S288C Cdc14p phosphatase subunit of the
      nucleolar RENT complex.
    evidence:
    - reference: UniProtKB:Q00684
      notes: Reviewed Swiss-Prot entry for Saccharomyces cerevisiae S288C tyrosine-protein
        phosphatase CDC14.
    - reference: PMID:10219245
      notes: Straight et al. 1999 identified Cdc14p as a subunit of the nucleolar
        RENT complex.
