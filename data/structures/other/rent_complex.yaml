functions:
- function_id: rdna_heterochromatin_silencing
  label: rDNA heterochromatin formation
  grounding: GO:0000183
  description: Anchors NAD-dependent histone deacetylase Sir2p at nucleolar ribosomal
    DNA repeats via Net1p to establish silent rDNA chromatin and suppress unequal
    rDNA sister-chromatid recombination.
  evidence:
  - reference: GO:0030869
    notes: GO:0030869 defines the RENT complex as mediating transcriptional silencing
      at the rDNA locus.
  - reference: PMID:10219245
    notes: Straight et al. 1999 demonstrated that Net1p recruits Sir2p to the rDNA
      locus for rDNA transcriptional silencing.
- function_id: mitotic_exit_regulation
  label: regulation of exit from mitosis
  grounding: GO:0007096
  description: Sequesters and inhibits the Cdc14p protein phosphatase in the nucleolus
    through interphase and early mitosis before releasing active Cdc14p in anaphase
    to drive mitotic exit.
  evidence:
  - reference: PMID:10219245
    notes: Straight et al. 1999 showed that Net1p tethers Cdc14p in the nucleolus
      until telophase.
  - reference: PMID:11511359
    notes: Shou et al. 2001 dissected the Net1p domain that binds and inhibits Cdc14p
      until mitotic exit.
evidence:
- reference: GO:0030869
