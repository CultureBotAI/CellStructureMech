    protein_label: Nucleolar protein NET1
    gene_symbol: NET1
    taxon_id: NCBITaxon:559292
    taxon_label: Saccharomyces cerevisiae S288C
    entry_status: REVIEWED
    retrieved_on: '2026-10-30'
    role: Reviewed Saccharomyces cerevisiae S288C Net1p (also declared as synonym
      CFI1) core scaffold subunit of the nucleolar RENT complex.
    evidence:
    - reference: UniProtKB:P47035
      notes: Reviewed Swiss-Prot entry for Saccharomyces cerevisiae S288C nucleolar
        protein NET1.
    - reference: PMID:10219245
      notes: Straight et al. 1999 characterized S. cerevisiae Net1p as the scaffold
        of the RENT complex.
- component_id: sir2_histone_deacetylase_subunit
  label: NAD-dependent histone deacetylase SIR2
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR003000
  gene_symbols:
  - SIR2
  essentiality: ESSENTIAL
  role: NAD-dependent histone deacetylase catalytic subunit recruited by Net1p to
    nucleolar rDNA repeats, where it deacetylates histones to mediate rDNA transcriptional
    silencing and suppress rDNA recombination.
  evidence:
  - reference: GO:0030869
    notes: GO:0030869 names Sir2p as a constituent subunit of the Saccharomyces RENT
      complex.
  - reference: PMID:10219245
    notes: Straight et al. 1999 demonstrated that Net1p binds Sir2p in the RENT complex
      and is required for Sir2p localization and transcriptional silencing at rDNA.
  protein_examples:
