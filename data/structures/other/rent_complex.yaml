identifier: GO:0030869
label: RENT complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that mediates transcriptional silencing at the rDNA
  locus (the name derives from regulator of nucleolar silencing and telophase). In
  Saccharomyces the complex contains Net1p, Sir2p, Cdc14p, and at least one more subunit.
definition_source: GO:0030869
mapping_status: PROPOSED
xrefs:
- ComplexPortal:CPX-1669
parent_structures:
- GO:0005677
part_of:
- GO:0005730
components:
- component_id: net1_nucleolar_scaffold_subunit
  label: Nucleolar protein NET1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR043185
  gene_symbols:
  - NET1
  - CFI1
  essentiality: ESSENTIAL
  role: Core nucleolar scaffold subunit (Net1p / Cfi1p) of the RENT complex that binds
    both Sir2p and Cdc14p, anchoring Sir2p at rDNA repeats for rDNA chromatin silencing
    and sequestering Cdc14p in the nucleolus in an inactive state until anaphase.
  evidence:
  - reference: GO:0030869
    notes: GO:0030869 names Net1p as a core subunit of the Saccharomyces RENT complex.
  - reference: PMID:10219245
    notes: Straight et al. 1999 (DOI:10.1016/s0092-8674(00)80734-5) identified Net1
      as the scaffold of the nucleolar RENT complex that recruits Sir2 to rDNA and
      sequesters Cdc14 until telophase.
  - reference: PMID:11511359
    notes: Shou et al. 2001 (DOI:10.1016/s1097-2765(01)00291-x) mapped separate functional
      domains of Net1 that bind Cdc14, Sir2, and RNA polymerase I in the RENT complex.
  protein_examples:
