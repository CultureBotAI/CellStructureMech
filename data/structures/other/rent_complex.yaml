    entry_status: REVIEWED
    retrieved_on: '2026-10-30'
    role: Reviewed Saccharomyces cerevisiae S288C Sir2p NAD-dependent histone deacetylase
      subunit of the RENT complex.
    evidence:
    - reference: UniProtKB:P06700
      notes: Reviewed Swiss-Prot entry for Saccharomyces cerevisiae S288C NAD-dependent
        histone deacetylase SIR2.
    - reference: PMID:10219245
      notes: Straight et al. 1999 identified Sir2p as a subunit of the nucleolar RENT
        complex.
- component_id: cdc14_phosphatase_subunit
  label: Tyrosine-protein phosphatase CDC14
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR044506
  gene_symbols:
  - CDC14
  essentiality: ESSENTIAL
  role: Dual-specificity protein phosphatase subunit held inactive by Net1p in the
    nucleolar RENT complex during interphase and early mitosis, and released in anaphase
    to dephosphorylate Cdk substrates and trigger mitotic exit.
  evidence:
  - reference: GO:0030869
    notes: GO:0030869 names Cdc14p as a core subunit of the Saccharomyces RENT complex.
  - reference: PMID:10219245
    notes: Straight et al. 1999 showed that Net1p sequesters and inhibits Cdc14p within
      the nucleolar RENT complex until telophase.
  - reference: PMID:12056824
    notes: Yoshida and Toh-e 2002 (DOI:10.1016/s0006-291x(02)00544-2) demonstrated
      how budding yeast Cdc14 release from Net1 in the RENT complex is regulated during
      mitotic exit.
  protein_examples:
