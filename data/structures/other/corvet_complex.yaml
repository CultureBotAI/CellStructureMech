causal_graphs:
- graph_id: yeast_corvet_endosomal_tethering
  title: CORVET supports yeast endosomal tethering
  description: In Saccharomyces cerevisiae, Vps3 and Vps8 join Vps11, Vps16, Vps18
    and Vps33 to form the CORVET complex, an endosomal tethering complex that interacts
    with Rab5 homolog Vps21 during endo-lysosomal biogenesis.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph represents canonical yeast CORVET subunit membership, Vps21
    binding, and endo-lysosomal-biogenesis involvement without modeling CORVET-to-HOPS
    conversion or SNARE-mediated fusion steps.
