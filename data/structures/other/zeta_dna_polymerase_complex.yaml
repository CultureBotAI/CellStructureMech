- discussion_id: resolve_pol_zeta_subunit_groundings
  prompt: Resolve exact source-neutral family groundings for the Rev3, Rev7, Pol31,
    and Pol32 subunit classes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#rev3_catalytic_subunit
  - components#rev7_subunit
  - components#pol31_subunit
  - components#pol32_subunit
  rationale: GO:0016035 exactly identifies the zeta DNA polymerase complex and primary
