identifier: GO:0016035
label: zeta DNA polymerase complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: An error-prone eukaryotic DNA polymerase complex that carries out translesion
  DNA synthesis and damage-tolerance mutagenesis; in Saccharomyces cerevisiae, DNA
  polymerase zeta contains Rev3, Rev7, and the Pol31 and Pol32 accessory subunits
  shared with DNA polymerase delta.
