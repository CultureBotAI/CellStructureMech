    source-neutral InterPro, Pfam, NCBIfam or UniProtKB family CURIEs were not curated
    in this pass.
  evidence:
  - reference: GO:0016035
    notes: GO:0016035 defines the Saccharomyces form of the complex as containing
      Rev3 and Rev7.
  - reference: PMID:23066099
    notes: Makarova et al. purified a four-subunit Saccharomyces cerevisiae Pol zeta
      complex.
  posed_by: codex
  posed_date: '2026-09-27'
- discussion_id: model_four_subunit_pol_zeta
  prompt: Represent Saccharomyces cerevisiae DNA polymerase zeta as a four-subunit
    Rev3/Rev7/Pol31/Pol32 complex.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - GO:0016035
  rationale: GO:0016035 describes the historical Rev3/Rev7 Pol zeta dimer and notes
    that Rev1 is often associated with it. Later primary evidence identified Pol31
    and Pol32 as additional Pol zeta subunits and purified a four-subunit Rev3/Rev7/Pol31/Pol32
    assembly, while Rev1 remained an assembly or recruitment factor rather than a
    stable constituent of the Pol zeta complex.
  evidence:
  - reference: PMID:8658138
    notes: Nelson et al. originally characterized yeast Pol zeta as a Rev3/Rev7 complex.
  - reference: PMID:22711820
    notes: Johnson et al. identified Pol31 and Pol32 as essential yeast Pol zeta subunits.
  - reference: PMID:23066099
    notes: Makarova et al. purified the four-subunit Rev3, Rev7, Pol31, and Pol32
      complex.
  - reference: PMID:25737057
    notes: Makarova and Burgers reviewed the four-subunit Pol zeta complex and its
      essential interactions with Rev1 and PCNA.
  resolution_note: The component list includes Rev3, Rev7, Pol31 and Pol32, and leaves
    Rev1 outside the stable complex boundary.
  posed_by: codex
  posed_date: '2026-09-27'
