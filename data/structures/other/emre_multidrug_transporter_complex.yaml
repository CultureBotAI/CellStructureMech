identifier: GO:1990207
label: EmrE multidrug transporter complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A transmembrane protein complex capable of transporting positively charged
  hydrophobic drugs across the plasma membrane thereby involved in conferring resistance
  to a wide range of toxic compounds (e.g. methyl viologen, ethidium bromide and acriflavine).
  It is commonly found in bacteria. In E. coli it forms a homodimer.
