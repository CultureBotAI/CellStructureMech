identifier: GO:0009337
label: sulfite reductase complex (NADPH)
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A multisubunit iron flavoprotein, which in yeast is composed of 2 alpha
  and 2 beta subunits. Catalyzes the reduction of sulfite to sulfide.
