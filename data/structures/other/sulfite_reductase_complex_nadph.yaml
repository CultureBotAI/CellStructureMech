functions:
- function_id: sulfite_reductase_nadph_activity
  label: sulfite reductase (NADPH) activity
  grounding: GO:0004783
  description: Catalyzes the six-electron reduction of sulfite to hydrogen sulfide
    using NADPH via FAD, FMN, [4Fe-4S], and siroheme cofactors.
  evidence:
  - reference: GO:0004783
    notes: GO molecular-function term for sulfite reductase (NADPH) activity.
  - reference: PMID:26088143
    snippet: Assimilatory NADPH-sulfite reductase (SiR) from Escherichia coli is a
      structurally complex oxidoreductase that catalyzes the six-electron reduction
      of sulfite to sulfide.
    notes: Establishes the six-electron NADPH-dependent sulfite reductase activity.
- function_id: sulfate_assimilation
  label: sulfate assimilation
  grounding: GO:0000103
  description: Reduces inorganic sulfite derived from sulfate or thiosulfate into
    sulfide for incorporation into cysteine, homocysteine, and methionine.
  evidence:
  - reference: GO:0000103
    notes: GO biological-process term for sulfate assimilation.
  - reference: PMID:1479340
    snippet: The assimilation of sulphate in Saccharomyces cerevisiae, comprising
      the reduction of sulphate to sulphide and the incorporation of the sulphur atom
      into a four-carbon chain, requires the integrity of 13 different genes.
    notes: Demonstrates the role of sulfite reductase in the sulfate assimilation
      pathway.
