discussions:
- discussion_id: outer_kinetochore_component_boundary
  prompt: Keep individual MIS12/MIND and Ndc80 subunits, lineage-specific outer kinetochore
    complexes, inner kinetochore assemblies, and checkpoint regulators outside the
    generic outer kinetochore component list.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#mis12_mind_type_complex
  - components#ndc80_complex
  - causal_graphs#outer_kinetochore_microtubule_interface
  rationale: The generic outer kinetochore is represented by conserved, named subcomplexes;
    individual protein families are curated inside those subcomplex records, lineage-restricted
    outer kinetochore complexes stay in their own records, and nonconstituent checkpoint
    factors should be reviewed separately.
  evidence:
  - reference: GO:0000940
  - reference: DOI:10.1534/genetics.112.145276
  posed_by: claude-code
  posed_date: '2026-09-23'
