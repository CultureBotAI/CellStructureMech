  - reference: GO:0000940
    notes: GO:0000940 defines the outer kinetochore as the region that mediates kinetochore-microtubule
      interactions.
  - reference: DOI:10.1534/genetics.112.145276
    notes: Biggins 2013 reviewed the outer kinetochore as a microtubule-coupling layer
      in budding yeast.
