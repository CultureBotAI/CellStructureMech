identifier: GO:0000815
label: ESCRT III complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex with membrane scission activity that plays a major role in many
  processes where membranes are remodelled - including endosomal transport (vesicle
  budding), nuclear envelope organisation (membrane closure, mitotic bridge cleavage),
  and cytokinesis (abscission).
definition_source: GO:0000815
