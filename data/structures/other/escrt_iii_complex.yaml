functions:
- function_id: multivesicular_body_sorting_pathway
  label: multivesicular body sorting pathway
  grounding: GO:0071985
  description: ESCRT-III acts late in the endosomal MVB pathway to remodel limiting
    membranes during intraluminal vesicle formation.
  evidence:
  - reference: GO:0071985
    notes: GO:0071985 denotes the multivesicular body sorting pathway that targets
      ubiquitylated transmembrane proteins into luminal vesicles.
  - reference: DOI:10.1016/S1534-5807(02)00220-4
    notes: Babst et al. 2002 identified ESCRT-III as a yeast endosome-associated complex
      required for MVB sorting.
- function_id: membrane_fission
  label: membrane fission
  grounding: GO:0090148
  description: ESCRT-III complexes assemble on membranes as remodeling polymers that
    drive membrane constriction and scission events.
  evidence:
  - reference: GO:0000815
    notes: GO:0000815 defines ESCRT III complex as a complex with membrane scission
      activity.
  - reference: DOI:10.1016/j.devcel.2011.05.015
    notes: Henne, Buchkovich and Emr 2011 reviewed the ESCRT pathway as membrane remodeling
      and scission machinery.
