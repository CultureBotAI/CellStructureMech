causal_graphs:
- graph_id: yeast_escrt_iii_mvb_membrane_remodeling
  title: ESCRT-III remodels yeast endosomal membranes
  description: In Saccharomyces cerevisiae, Vps20, Snf7/Vps32, Vps24 and Vps2 assemble
    into the ESCRT-III complex, which remodels endosomal membranes during multivesicular-body
    sorting.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph represents the core yeast ESCRT-III complex and its endosomal
    membrane remodeling role without modeling ESCRT-I/II recruitment, Vps4 recycling,
    Doa4 deubiquitination or Bro1 regulation.
