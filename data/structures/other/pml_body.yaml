causal_graphs:
- graph_id: sumoylated_pml_body_assembly
  title: PML scaffolds SUMO-dependent PML-body assembly
  description: PML protein scaffolds ND10/PML bodies, SUMO modification supports the
    mature body, and Sp100 accumulates in the assembled nuclear body.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph summarizes the PML/SUMO/Sp100 core of PML-body formation
    without asserting a complete SUMO cascade, PML isoform set, stress-induced client
    repertoire or RNF4-dependent turnover mechanism.
  nodes:
  - node_id: pml_protein
    label: PML protein
    node_type: GENE_OR_PROTEIN
    component_ref: pml_protein
  - node_id: sp100_autoantigen
    label: Sp100 nuclear antigen
    node_type: GENE_OR_PROTEIN
    component_ref: sp100_autoantigen
  - node_id: pml_sumoylation
    label: PML SUMOylation
    node_type: BIOLOGICAL_PROCESS
  - node_id: pml_body
    label: PML body
    node_type: STRUCTURE
    grounding: GO:0016605
  edges:
  - subject: pml_protein
    predicate: scaffolds
    object: pml_body
    description: PML is required to gather ND10-associated proteins into PML bodies.
    evidence:
    - reference: DOI:10.1083/jcb.147.2.221
      notes: Ishov et al. 1999 found that PML reintroduction restored de novo ND10
        formation in Pml-null cells.
  - subject: pml_sumoylation
    predicate: supports formation of
    object: pml_body
    description: Covalent SUMO modification of PML supports PML-body formation.
    evidence:
    - reference: DOI:10.1182/blood.V95.9.2748.009k31a_2748_2752
      notes: Zhong et al. 2000 showed that a PML mutant that could not be modified
        by SUMO-1 failed to relocalize nuclear-body proteins.
    - reference: DOI:10.1016/j.molcel.2006.09.013
      notes: Shen et al. 2006 characterized SUMO and SUMO-interacting motif contributions
        to PML-body formation.
  - subject: sp100_autoantigen
    predicate: accumulates in
    object: pml_body
    description: Sp100 is one of the defining proteins that accumulates in ND10/PML
      bodies.
    evidence:
    - reference: GO:0016605
      notes: GO:0016605 defines PML bodies in relation to SP100 auto-antibodies.
    - reference: DOI:10.1083/jcb.147.2.221
      notes: Ishov et al. 1999 described Sp100 as an ND10-associated protein.
