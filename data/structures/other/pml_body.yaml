identifier: GO:0016605
label: PML body
structure_category: OTHER
structure_kind: OTHER
definition: A class of nuclear body; they react against SP100 auto-antibodies (PML,
  promyelocytic leukemia); cells typically contain 10-30 PML bodies per nucleus; alterations
  in the localization of PML bodies occurs after viral infection.
