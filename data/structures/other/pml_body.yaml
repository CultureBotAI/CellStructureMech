functions:
- function_id: partner_protein_sumoylation
  label: partner protein sumoylation
  description: PML nuclear bodies can recruit SUMO-pathway machinery and promote sumoylation
    of recruited partner proteins during oxidative stress.
  evidence:
  - reference: DOI:10.1083/jcb.201305148
    notes: Sahin et al. 2014 connected oxidative-stress-induced PML nuclear-body assembly
      to sumoylation of partner proteins.
