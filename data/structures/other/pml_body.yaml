components:
- component_id: pml_protein
  label: PML protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - PML
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PML is curated as the defining scaffold protein of PML bodies;
    no exact source-neutral InterPro, Pfam or NCBIfam accession was assigned in this
    first record.
  role: Scaffold protein required for PML-body formation and recruitment of other
    ND10/PML-body proteins.
  evidence:
  - reference: DOI:10.1083/jcb.147.2.221
    notes: Ishov et al. 1999 found that ND10-associated proteins were dispersed in
      Pml-null cells and were recruited to de novo ND10 after PML reintroduction.
  - reference: DOI:10.1182/blood.V95.9.2748.009k31a_2748_2752
    notes: Zhong et al. 2000 showed that PML is required for proper PML nuclear-body
      formation in primary Pml-null cells and that SUMO modification of PML is required
      for this role.
- component_id: sp100_autoantigen
  label: Sp100 nuclear antigen
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SP100
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Sp100 is curated as a defining PML/ND10 body protein recognized
    in this body; no exact source-neutral InterPro, Pfam or NCBIfam accession was
    assigned in this first record.
  role: Nuclear autoantigen that accumulates with PML in ND10/PML bodies.
  evidence:
  - reference: GO:0016605
    notes: GO:0016605 defines PML bodies in relation to SP100 auto-antibodies.
  - reference: DOI:10.1083/jcb.147.2.221
    notes: Ishov et al. 1999 described ND10 as discrete nuclear accumulations of proteins
      including PML and Sp100.
