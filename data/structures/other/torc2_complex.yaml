identifier: GO:0031932
label: TORC2 complex
structure_category: OTHER
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that contains at least TOR (target of rapamycin) and
  Rictor (rapamycin-insensitive companion of TOR), or orthologs of, in complex with
  other signaling components. Mediates the phosphorylation and activation of PKB (also
  called AKT). In Saccharomyces, the complex contains Avo1p, Avo2p, Tsc11p, Lst8p,
  Bit61p, Slm1p, Slm2p, and Tor2p.
