- discussion_id: torc1_boundary
  prompt: Keep TORC1-specific Kog1, Tco89 and Tor1 outside this TORC2 record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#tor2_torc2_kinase_subunit
  - components#lst8_torc2_subunit
  - causal_graphs#yeast_torc2_subunit_signaling
  rationale: GO separates rapamycin-sensitive TORC1 from TORC2 as sibling complexes.
    Tor2 and Lst8 can occur in both yeast TOR complexes, but Kog1, Tco89 and Tor1
    are outside GO:0031932.
  resolution_note: 'Declined: TORC1-side subunits were treated as constituents of
    GO:0031931 rather than GO:0031932.'
  evidence:
  - reference: GO:0031932
    notes: Gene Ontology cellular-component term for the TORC2 complex.
  - reference: GO:0031931
    notes: Gene Ontology cellular-component term for the TORC1 complex.
  - reference: DOI:10.1016/s1097-2765(02)00636-6
    notes: Loewith et al. 2002 separated budding-yeast TOR into two complexes and
      assigned TORC2 to the rapamycin-insensitive branch.
