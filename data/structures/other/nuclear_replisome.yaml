causal_graphs:
- graph_id: nuclear_replisome_mechanism
  title: Nuclear replisome assembly around the CMG helicase and coupled DNA synthesis
  description: S-phase CDK and DDK phosphorylation assemble the CMG helicase, which
    recruits DNA polymerases epsilon and alpha-primase (via Ctf4), PCNA, and Mrc1–Tof1–Csm3
    to form the processive nuclear replisome.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the three GO-defined CMG constituents and DNA-replication
    function without resolving MCM2-7 ring activation, Cdc45/GINS binding interfaces
    or replisome coupling.
