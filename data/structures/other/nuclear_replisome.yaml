identifier: GO:0043601
label: nuclear replisome
structure_category: OTHER
structure_kind: NUCLEOPROTEIN_COMPLEX
definition: A multi-component enzymatic machine at the nuclear replication fork, which
  mediates DNA replication. Includes DNA primase, one or more DNA polymerases, DNA
  helicases, and other proteins. The complete multiprotein DNA replication machinery
  assembled at eukaryotic nuclear replication forks in yeasts, fungi, and protists.
  Centered on the replicative CMG helicase (Cdc45–Mcm2-7–GINS), the nuclear replisome
  integrates leading-strand DNA polymerase epsilon, lagging-strand DNA polymerase
  alpha-primase and delta tethered via Ctf4, the PCNA sliding clamp and RFC clamp
  loader, RPA, and the fork protection complex (Mrc1–Tof1–Csm3) to coordinate high-fidelity
  chromosome duplication.
