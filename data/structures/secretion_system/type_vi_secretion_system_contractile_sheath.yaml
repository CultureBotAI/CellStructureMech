  edges:
  - subject: tssb
    predicate: assembles into
    object: extended_sheath
    description: TssB/VipA copolymerizes into the extended contractile sheath.
    evidence:
    - reference: DOI:10.1038/nature10846
      notes: Basler et al. 2012 visualized VipA-labeled T6SS sheath extension in living
        cells.
  - subject: tssc
    predicate: assembles into
    object: extended_sheath
    description: TssC/VipB copolymerizes with TssB/VipA into the extended contractile
      sheath.
    evidence:
    - reference: DOI:10.1038/nature10846
      notes: Basler et al. 2012 showed VipA and VipB form dynamic contractile T6SS
        sheaths.
  - subject: extended_sheath
    predicate: polymerizes around
    object: hcp_tube
    description: The sheath extends around the Hcp tube before T6SS firing.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
      notes: Cherrak et al. 2019 review T6SS sheath extension around the Hcp tube.
  - subject: extended_sheath
    predicate: contracts into
    object: contracted_sheath
    description: The extended TssB/TssC sheath contracts into the contracted sheath
      state during T6SS firing.
    evidence:
    - reference: DOI:10.1038/nature10846
      notes: Basler et al. 2012 linked VipA/VipB sheath contraction with T6SS firing.
  - subject: extended_sheath
    predicate: carries out
    object: t6ss_firing
    description: Contraction of the extended sheath powers type VI secretion.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
      notes: Cherrak et al. 2019 review the T6SS as a contractile injection machine
        that fires by sheath contraction.
  - subject: clpv
    predicate: recycles
    object: contracted_sheath
    description: ClpV disassembles the contracted sheath for subunit reuse.
    evidence:
    - reference: DOI:10.1038/nature10846
      notes: Basler et al. 2012 observed ClpV-dependent VipA/VipB sheath turnover
        in Vibrio cholerae.
