identifier: cellstructuremech:type_vi_secretion_system_contractile_sheath
label: type VI secretion system contractile sheath
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial type VI secretion system subassembly in which TssB/VipA- and
  TssC/VipB-family proteins polymerize into a metastable sheath around the Hcp tube
  and contract to drive Hcp/VgrG/PAAR spike ejection.
definition_source: DOI:10.1038/nature10846
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-23T06:25:22Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-23T06:26:11Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added T6SS contractile-sheath synonyms, GO complex parentage, whole-system
    parthood, TssB and TssC constituent rows, ClpV-associated recycling machinery,
    bacterial distribution, a Vibrio cholerae canonical example, contractile firing
    function, a sheath extension/contraction graph, and a TODO for exact protein-family
    grounding.
  llm_assisted: true
- timestamp: '2026-09-23T06:27:07Z'
  curator: codex
  action: CURATION_TIGHTENING
  changes: Kept ClpV-mediated sheath recycling in the causal graph but removed it
    as a StructureFunction because recycling acts on, rather than is carried out by,
    the contractile sheath.
  llm_assisted: true
- timestamp: '2026-09-23T06:37:34Z'
  curator: codex
  action: ADDRESS_REVIEW
  changes: 'Resolved PR #1363 review issue #1364 by routing the sheath-contraction
    graph edge from the extended sheath to the contracted sheath state.'
  llm_assisted: true
synonyms:
- synonym_text: T6SS contractile sheath
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/microbiolspec.PSIB-0031-2019
- synonym_text: TssB/TssC contractile sheath
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/microbiolspec.PSIB-0031-2019
- synonym_text: VipA/VipB sheath
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nature10846
parent_structures:
- GO:0032991
part_of:
- GO:0033104
components:
- component_id: tssb_sheath_subunit
  label: TssB sheath subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tssB
  - vipA
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: TssB/VipA is a T6SS sheath constituent, but no exact source-neutral
    TssB protein-family CURIE was curated.
  role: Sheath protein that copolymerizes with TssC/VipB to form the extended and
    contracted T6SS sheath.
  evidence:
  - reference: DOI:10.1038/nature10846
    notes: Basler et al. 2012 visualized VipA-tagged dynamic T6SS sheaths in living
      Vibrio cholerae cells.
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review TssB/VipA as one of the two contractile sheath
      subunits.
- component_id: tssc_sheath_subunit
  label: TssC sheath subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tssC
  - vipB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: TssC/VipB is a T6SS sheath constituent, but no exact source-neutral
    TssC protein-family CURIE was curated.
  role: Sheath protein that copolymerizes with TssB/VipA to build the contractile
    sheath around the Hcp tube.
  evidence:
  - reference: DOI:10.1038/nature10846
    notes: Basler et al. 2012 showed that VipA and VipB build the dynamic contractile
      T6SS sheath.
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review TssC/VipB as one of the two contractile sheath
      subunits.
- component_id: clpv_sheath_recycler
  label: ClpV sheath recycler
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - clpV
  - tssH
  essentiality: DISPENSABLE
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: ClpV/TssH is an AAA+ ATPase that recycles contracted sheaths in
    ClpV-containing T6SSs; no exact source-neutral ClpV/TssH family CURIE was curated.
  role: ATPase that disassembles contracted TssB/TssC sheaths for reuse after firing
    in ClpV-containing systems.
  evidence:
  - reference: DOI:10.1038/nature10846
    notes: Basler et al. 2012 tracked ClpV-dependent turnover of VipA/VipB sheaths
      after contraction in Vibrio cholerae.
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review ClpV recycling and note that some T6SSs fire
      without ClpV.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: The TssB/TssC sheath is the contractile tail sheath of bacterial type VI secretion
    systems, which occur patchily across Gram-negative lineages.
  reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
canonical_examples:
- taxon_id: NCBITaxon:666
  taxon_label: Vibrio cholerae
  note: Live-cell reference species used to show VipA/VipB sheath extension, contraction
    and ClpV-dependent recycling.
  reference: DOI:10.1038/nature10846
functions:
- function_id: t6ss_contractile_firing
  label: T6SS contractile sheath firing
  description: The extended TssB/TssC sheath contracts and propels the Hcp tube plus
    VgrG/PAAR spike during type VI secretion.
  evidence:
  - reference: DOI:10.1038/nature10846
    notes: Basler et al. 2012 linked VipA/VipB sheath extension and contraction to
      type VI secretion.
evidence:
- reference: DOI:10.1038/nature10846
  notes: Basler et al. 2012, Type VI secretion requires a dynamic contractile phage
    tail-like structure, Nature.
- reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
  notes: Cherrak et al. 2019, Structure and Activity of the Type VI Secretion System,
    Microbiology Spectrum.
causal_graphs:
- graph_id: tssbc_sheath_extension_contraction_and_recycling
  title: The TssB/TssC sheath extends, fires and is recycled
  description: TssB/VipA and TssC/VipB assemble into an extended sheath around the
    Hcp tube. Sheath contraction fires the T6SS, and ClpV can disassemble the contracted
    polymer for subunit reuse.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: This graph focuses on sheath polymer extension, contraction and recycling.
    It leaves baseplate nucleation, VgrG/PAAR spike architecture and effector loading
    to sibling records.
