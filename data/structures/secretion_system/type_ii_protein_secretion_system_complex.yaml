  edges:
  - subject: inner_platform
    predicate: couples
    object: assembly_atpase
    description: The inner-membrane platform positions the cytoplasmic GspE ATPase
      within the T2SS machine.
    evidence:
    - reference: DOI:10.1038/nrmicro2762
      notes: Korotkov et al. 2012 review the contacts between the cytoplasmic ATPase
        and inner-membrane platform proteins.
  - subject: assembly_atpase
    predicate: powers extension of
    object: pseudopilus
    description: ATP hydrolysis by GspE-family ATPases powers pseudopilus assembly.
    evidence:
    - reference: DOI:10.1038/nrmicro2762
      notes: Korotkov et al. 2012 describe the ATPase as the motor that drives pseudopilus
        assembly.
  - subject: pseudopilus
    predicate: contacts
    object: folded_cargo
    description: The growing pseudopilus is proposed to push folded cargo out of the
      periplasm.
    evidence:
    - reference: DOI:10.1016/j.bbamcr.2013.12.020
      notes: Nivaskumar and Francetic 2014 discuss the pseudopilus-dependent piston
        model for type II secretion.
  - subject: secretin
    predicate: gates
    object: t2ss
    description: The GspD-family secretin supplies the gated outer-membrane exit channel
      of the assembled T2SS.
    evidence:
    - reference: DOI:10.1128/ecosalplus.ESP-0034-2018
      notes: Korotkov and Sandkvist 2019 review the GspD secretin channel in type
        II secretion.
  - subject: folded_cargo
    predicate: passes through
    object: secretin
    description: Folded substrates cross the outer membrane through the secretin pore.
    evidence:
    - reference: DOI:10.1038/nrmicro2762
      notes: Korotkov et al. 2012 review folded periplasmic substrates leaving the
        cell through the T2SS secretin.
  - subject: t2ss
    predicate: exports
    object: extracellular_cargo
    description: The complete T2SS exports folded substrates to the cell surface or
      extracellular space.
    evidence:
    - reference: DOI:10.1128/ecosalplus.ESP-0034-2018
      notes: Korotkov and Sandkvist 2019 review the architecture, function, and substrates
        of the T2SS.
