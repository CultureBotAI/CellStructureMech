- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Canonical type II secretion systems are diderm bacterial machines with a discontinuous
    distribution among proteobacterial pathogens and environmental species.
  reference: DOI:10.1128/ecosalplus.ESP-0034-2018
canonical_examples:
- taxon_id: NCBITaxon:666
  taxon_label: Vibrio cholerae
  note: The Eps/Gsp system is a major structural and functional model for type II
    secretion.
  reference: DOI:10.1038/nrmicro2762
functions:
- function_id: folded_periplasmic_protein_export
  label: folded periplasmic protein export
  description: T2SS transports substrates that have first crossed the inner membrane
    through the Sec or Tat pathways from the periplasm to the cell exterior.
  evidence:
  - reference: DOI:10.1038/nrmicro2762
    notes: Korotkov et al. 2012 review type II secretion as an outer-membrane export
      route for folded periplasmic proteins.
evidence:
- reference: DOI:10.1038/nrmicro2762
  notes: 'Korotkov KV, Sandkvist M and Hol WGJ 2012, The type II secretion system:
    biogenesis, molecular architecture and mechanism, Nature Reviews Microbiology.'
- reference: DOI:10.1016/j.bbamcr.2013.12.020
  notes: 'Nivaskumar M and Francetic O 2014, Type II secretion system: A magic beanstalk
    or a protein escalator, Biochimica et Biophysica Acta.'
- reference: DOI:10.1128/ecosalplus.ESP-0034-2018
  notes: Korotkov KV and Sandkvist M 2019, Architecture, Function, and Substrates
    of the Type II Secretion System, EcoSal Plus.
causal_graphs:
- graph_id: atpase_pseudopilus_secretin_export
  title: The ATPase and pseudopilus drive folded cargo through the secretin
  description: The inner-membrane platform couples the cytoplasmic assembly ATPase
    to a periplasmic pseudopilus, which drives folded substrates toward and through
    the outer-membrane secretin.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
