identifier: cellstructuremech:type_vi_secretion_system_hcp_tube
label: type VI secretion system Hcp tube
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial type VI secretion system tail-tube subassembly in which Hcp-family
  proteins stack into hexameric rings that form the inner tube expelled by contractile-sheath
  firing.
definition_source: DOI:10.1128/microbiolspec.PSIB-0031-2019
