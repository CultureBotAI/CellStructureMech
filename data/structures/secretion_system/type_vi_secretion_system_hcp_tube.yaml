  edges:
  - subject: hcp
    predicate: assembles into
    object: hcp_tube
    description: Hcp proteins stack as hexameric rings to form the T6SS inner tube.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
      notes: Cherrak et al. 2019 review Hcp ring stacking as the basis of T6SS inner-tube
        assembly.
  - subject: baseplate
    predicate: primes polymerization of
    object: hcp_tube
    description: The assembled T6SS baseplate primes Hcp inner-tube polymerization.
    evidence:
    - reference: DOI:10.15252/embj.201797103
      notes: Nazarov et al. 2018 imaged baseplates at the distal ends of T6SS sheath-tube
        assemblies.
  - subject: spike
    predicate: caps
    object: hcp_tube
    description: The VgrG/PAAR spike caps the Hcp tube to form the puncturing tip.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
      notes: Cherrak et al. 2019 review the VgrG/PAAR spike as the cap at the distal
        end of the Hcp tube.
  - subject: contractile_sheath
    predicate: ejects
    object: hcp_tube
    description: Contraction of the surrounding sheath ejects the Hcp tube during
      T6SS firing.
    evidence:
    - reference: DOI:10.1038/nature10846
      notes: Basler et al. 2012 linked VipA/VipB sheath contraction to T6SS firing.
