  reference: DOI:10.15252/embj.201797103
functions:
- function_id: t6ss_hcp_tube_ejection
  label: T6SS Hcp tube ejection
  description: The Hcp tube is expelled during type VI secretion to deliver the VgrG/PAAR
    spike and associated effectors out of the cell.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review the T6SS as a contractile machine in which sheath
      contraction ejects the Hcp tube and spike.
evidence:
- reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
  notes: Cherrak et al. 2019, Structure and Activity of the Type VI Secretion System,
    Microbiology Spectrum.
- reference: DOI:10.15252/embj.201797103
  notes: Nazarov et al. 2018, Cryo-EM reconstruction of Type VI secretion system baseplate
    and sheath distal end, EMBO Journal.
- reference: DOI:10.1038/nature10846
  notes: Basler et al. 2012, Type VI secretion requires a dynamic contractile phage
    tail-like structure, Nature.
causal_graphs:
- graph_id: hcp_tube_polymerization_and_ejection
  title: The Hcp tube polymerizes from the baseplate and is ejected
  description: Hcp rings stack into an inner tube whose polymerization is primed by
    the baseplate and whose ejection is powered by contractile-sheath firing.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: This graph focuses on Hcp tube polymerization and ejection. It leaves
    membrane-core docking, baseplate assembly, sheath contraction and VgrG/PAAR spike
    architecture to sibling records.
