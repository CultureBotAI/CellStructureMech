  component_role: CONSTITUENT
  gene_symbols:
  - virB3
  - virB6
  - virB8
  essentiality: ESSENTIAL
  role: Inner-membrane channel and assembly platform that couples cytoplasmic ATPases
    to the outer-membrane core.
  evidence:
  - reference: DOI:10.1007/82_2018_94
    notes: Li and Christie 2018 review VirB inner-membrane subunits and their architecture
