  essentiality: ESSENTIAL
  role: Cytoplasmic ATPases that supply energy for T4SS assembly and substrate transfer.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0012-2018
    notes: Li, Hu and Christie 2019 review the conserved VirB4/VirB11 ATPases across
      structurally diverse type IV secretion systems.
