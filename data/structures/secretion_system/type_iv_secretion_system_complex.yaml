identifier: GO:0043684
label: type IV secretion system complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial envelope-spanning secretion complex related to conjugation
  machines that uses VirB-family channel, pilus, ATPase and coupling-protein subassemblies
  to translocate DNA and protein substrates.
definition_source: GO:0043684
mapping_status: PROPOSED
