  label: VirD4-like type IV coupling protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - virD4
  essentiality: CONDITIONAL
  role: Substrate receptor that recruits DNA or protein cargo to many type IV secretion
    machines.
  evidence:
  - reference: DOI:10.1007/82_2018_94
    notes: Li and Christie 2018 review VirD4 as the coupling protein that recruits
      Agrobacterium T-DNA and effector substrates to the VirB channel.
- component_id: conjugative_pilus
  label: VirB2/VirB5 extracellular pilus
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - virB2
  - virB5
  essentiality: CONDITIONAL
  role: Extracellular pilus subassembly used by many T4SSs for surface contact and
    substrate delivery.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0012-2018
    notes: Li, Hu and Christie 2019 review T4SS pili as subassemblies in conjugation
      and effector translocation systems.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Type IV secretion systems are widespread but patchy in bacterial genomes and
    occur as conjugation, effector translocation, and DNA uptake or release machines.
  reference: DOI:10.1128/microbiolspec.PSIB-0012-2018
canonical_examples:
- taxon_id: NCBITaxon:358
  taxon_label: Agrobacterium tumefaciens
  note: The VirB/VirD4 T4SS is the model conjugation-related machine for T-DNA and
    effector transfer into plant cells.
  reference: DOI:10.1007/82_2018_94
functions:
- function_id: dna_and_protein_translocation
  label: DNA and protein substrate translocation
  description: T4SSs transfer monomeric or multimeric proteins and, in some systems,
    DNA-protein substrates between cells or into the extracellular milieu.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0012-2018
    notes: Li, Hu and Christie 2019 review the substrate and functional diversity
      of bacterial type IV secretion systems.
evidence:
- reference: DOI:10.1128/microbiolspec.PSIB-0012-2018
  notes: Li YG, Hu B and Christie PJ 2019, Biological and Structural Diversity of
