- reference: DOI:10.1126/science.1166101
  notes: Fronzes et al. 2009, Structure of a type IV secretion system core complex,
    Science.
- reference: DOI:10.1038/nature13081
  notes: Low et al. 2014 resolved a larger type IV secretion system architecture including
    inner- and outer-membrane subassemblies.
