identifier: GO:0030256
label: type I protein secretion system complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A Gram-negative bacterial trans-envelope protein secretion complex in
  which an inner-membrane ABC transporter and membrane-fusion protein recruit a TolC-like
  outer-membrane channel for one-step export of C-terminal-signal substrates.
definition_source: GO:0030256
