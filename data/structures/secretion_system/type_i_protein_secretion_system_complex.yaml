functions:
- function_id: one_step_protein_export
  label: one-step type I protein secretion
  description: C-terminal signal-bearing substrates are exported from the cytosol
    to the cell exterior without a stable periplasmic intermediate.
  evidence:
  - reference: DOI:10.1093/femsle/fny094
    notes: Kanonenberg et al. 2018 review the type I secretion pathway as a three-component
      system that exports its substrate.
evidence:
- reference: DOI:10.1128/microbiolspec.PSIB-0003-2018
  notes: Spitz et al. 2019, Type I Secretion Systems-One Mechanism for All?, Microbiology
    Spectrum.
- reference: DOI:10.1016/j.bbamcr.2004.05.001
  notes: Delepelaire P 2004, Type I secretion in gram-negative bacteria, Biochimica
    et Biophysica Acta.
- reference: DOI:10.1093/femsle/fny094
  notes: Kanonenberg et al. 2018, Type I secretion system-it takes three and a substrate,
    FEMS Microbiology Letters.
causal_graphs:
- graph_id: abc_mfp_tolc_one_step_export
  title: An ABC-MFP-TolC conduit exports type I substrates
  description: The inner-membrane ABC transporter recognizes substrates and cooperates
    with a membrane-fusion protein to recruit a TolC-family outer-membrane factor,
    forming a continuous channel that exports substrates across both Gram-negative
    membranes.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  nodes:
  - node_id: abc_transporter
    label: type I secretion ABC transporter
    node_type: GENE_OR_PROTEIN
    component_ref: abc_transporter
