- reference: DOI:10.1016/j.bbamcr.2004.05.001
  notes: Delepelaire P 2004, Type I secretion in gram-negative bacteria, Biochimica
    et Biophysica Acta.
- reference: DOI:10.1093/femsle/fny094
  notes: Kanonenberg et al. 2018, Type I secretion system-it takes three and a substrate,
    FEMS Microbiology Letters.
causal_graphs:
- graph_id: abc_mfp_tolc_one_step_export
  title: An ABC-MFP-TolC conduit exports type I substrates
  description: The inner-membrane ABC transporter recognizes substrates and cooperates
    with a membrane-fusion protein to recruit a TolC-family outer-membrane factor,
    forming a continuous channel that exports substrates across both Gram-negative
    membranes.
