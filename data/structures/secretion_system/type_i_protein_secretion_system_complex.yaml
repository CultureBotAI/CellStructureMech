  - node_id: secretion_substrate
    label: C-terminal type I secretion substrate
    node_type: GENE_OR_PROTEIN
    xrefs:
    - UniProtKB:P09983
    description: Unfolded C-terminal secretion-signal-bearing polypeptide substrate
      recognized by the inner-membrane ABC transporter and exported in one step through
      the tripartite tunnel, exemplified in Escherichia coli by chromosomal alpha-hemolysin
      HlyA (UniProtKB:P09983; DOI:10.1016/j.bbamcr.2004.05.001; DOI:10.1093/femsle/fny094).
  - node_id: t1ss
    label: type I protein secretion system complex
    node_type: STRUCTURE
    grounding: GO:0030256
  - node_id: extracellular_substrate
    label: secreted type I substrate
    node_type: STATE
  edges:
  - subject: abc_transporter
    predicate: recognizes
    object: secretion_substrate
    description: The ABC transporter engages type I substrates that carry a C-terminal
      secretion signal.
    evidence:
    - reference: DOI:10.1093/femsle/fny094
      notes: Kanonenberg et al. 2018 review the substrate signal and ABC transporter
        role in type I secretion.
    - reference: DOI:10.1016/j.bbamcr.2004.05.001
      notes: Delepelaire 2004 reviews recognition of C-terminal secretion signals
        on RTX substrates such as Escherichia coli HlyA by the type I ABC transporter.
  - subject: abc_transporter
    predicate: binds
    object: membrane_fusion_protein
    description: The inner-membrane ABC transporter works with the membrane fusion
      protein adaptor as the inner module of the tripartite apparatus.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0003-2018
      notes: Spitz et al. 2019 review type I systems as an ABC transporter, a membrane
        fusion protein, and an outer-membrane protein.
  - subject: membrane_fusion_protein
    predicate: recruits
    object: outer_membrane_factor
    description: The adaptor bridges the inner-membrane transporter to the TolC-family
      channel.
    evidence:
    - reference: DOI:10.1016/j.bbamcr.2004.05.001
      notes: Delepelaire 2004 reviews assembly of tripartite type I secretion machines
        across the two membranes.
  - subject: outer_membrane_factor
    predicate: completes
    object: t1ss
    description: The outer-membrane factor completes the secretion conduit so substrates
      can bypass the periplasm.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0003-2018
      notes: Spitz et al. 2019 review the outer-membrane protein as part of the continuous
        type I secretion system channel.
  - subject: t1ss
    predicate: exports
    object: extracellular_substrate
    description: The assembled type I system exports its substrate from the cytosol
      to the extracellular space.
    evidence:
    - reference: DOI:10.1016/j.bbamcr.2004.05.001
      notes: Delepelaire 2004 reviews type I secretion as direct export from the cytoplasm
        to the external medium.
    - reference: DOI:10.1093/femsle/fny094
      notes: Kanonenberg et al. 2018 review one-step type I secretion of RTX substrates
        such as Escherichia coli HlyA across both membranes.
