components:
- component_id: abc_transporter
  label: type I secretion ABC transporter
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - hlyB
  - rtxB
  essentiality: ESSENTIAL
  role: Inner-membrane ATP-binding cassette transporter that recognizes type I substrates
    and powers export.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0003-2018
    notes: Spitz et al. 2019 review the ABC transporter as one of the three conserved
      type I secretion system components.
- component_id: membrane_fusion_protein
  label: type I secretion membrane fusion protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - hlyD
  - rtxD
  essentiality: ESSENTIAL
  role: Periplasmic adaptor anchored in the inner membrane that links the ABC transporter
    to the outer-membrane channel.
  evidence:
  - reference: DOI:10.1016/j.bbamcr.2004.05.001
    notes: Delepelaire 2004 reviews the membrane fusion protein adaptor as part of
      the canonical Gram-negative type I secretion apparatus.
- component_id: outer_membrane_factor
  label: TolC-family outer-membrane factor
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - tolC
  essentiality: ESSENTIAL
  role: Outer-membrane channel that completes the continuous trans-envelope export
    conduit.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0003-2018
    notes: Spitz et al. 2019 review TolC-family outer-membrane channels as the third
      component of tripartite type I secretion complexes.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Tripartite type I secretion systems occur in many Gram-negative bacteria but
    are absent from monoderm lineages and many diderm strains.
  reference: DOI:10.1128/microbiolspec.PSIB-0003-2018
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: The HlyB-HlyD-TolC hemolysin apparatus is the prototype tripartite type I
    secretion system.
  reference: DOI:10.1016/j.bbamcr.2004.05.001
functions:
- function_id: one_step_protein_export
  label: one-step type I protein secretion
  description: C-terminal signal-bearing substrates are exported from the cytosol
    to the cell exterior without a stable periplasmic intermediate.
  evidence:
  - reference: DOI:10.1093/femsle/fny094
    notes: Kanonenberg et al. 2018 review the type I secretion pathway as a three-component
      system that exports its substrate.
evidence:
- reference: DOI:10.1128/microbiolspec.PSIB-0003-2018
