functions:
- function_id: t6ss_spike_puncturing_tip
  label: T6SS spike-mediated puncturing
  description: The VgrG/PAAR spike caps the Hcp tube as the sharpened puncturing tip
    fired outward during type VI secretion.
  evidence:
  - reference: DOI:10.1038/nature12453
    notes: Shneider et al. 2013 showed that PAAR proteins sharpen the T6SS VgrG spike
      and proposed a contraction-driven VgrG-PAAR effector-delivery model.
evidence:
- reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
  notes: Cherrak et al. 2019, Structure and Activity of the Type VI Secretion System,
    Microbiology Spectrum.
- reference: DOI:10.1038/nature12453
  notes: Shneider et al. 2013, PAAR-repeat proteins sharpen and diversify the type
    VI secretion system spike, Nature.
causal_graphs:
- graph_id: vgrg_paar_spike_caps_hcp_tube
  title: VgrG and PAAR form the spike that caps the Hcp tube
  description: VgrG proteins form the T6SS spike core and PAAR-repeat proteins sharpen
    that spike. The mature VgrG/PAAR spike caps the Hcp tube to complete the puncturing
    tip.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: This graph focuses on VgrG/PAAR tip assembly. It leaves baseplate assembly,
    Hcp tube polymerization and sheath-powered ejection to sibling records.
