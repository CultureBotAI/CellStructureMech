identifier: cellstructuremech:type_vi_secretion_system_vgrg_paar_spike_complex
label: type VI secretion system VgrG/PAAR spike complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial type VI secretion system tip subassembly in which trimeric
  VgrG proteins cap the Hcp tube and associate with PAAR-repeat proteins to sharpen
  the puncturing spike.
definition_source: DOI:10.1128/microbiolspec.PSIB-0031-2019
mapping_status: PROPOSED
