components:
- component_id: vgrg_spike_protein
  label: VgrG spike protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - vgrG
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: VgrG proteins form the T6SS spike core, but no exact source-neutral
    CURIE was curated for the taxon-agnostic VgrG family.
  role: Spike protein that trimerizes to cap the Hcp tube and carries PAAR-repeat
    proteins at the puncturing tip.
  evidence:
  - reference: DOI:10.1038/nature12453
    notes: Shneider et al. 2013 identify the T6SS spike as a VgrG complex that binds
      PAAR-repeat proteins at the tip.
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review VgrG as the spike protein capping the Hcp tube
      in T6SS machines.
- component_id: paar_spike_tip_protein
  label: PAAR spike-tip protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - paar
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PAAR-repeat proteins sharpen the T6SS spike, but this curation
    pass did not verify an exact source-neutral family CURIE for the taxon-agnostic
    component row.
  role: PAAR-repeat protein that binds the VgrG spike and forms a sharp conical extension
    of the puncturing tip.
  evidence:
  - reference: DOI:10.1038/nature12453
    notes: Shneider et al. 2013 showed that PAAR-repeat proteins sharpen the T6SS
      VgrG spike and are needed for T6SS-mediated secretion and target-cell killing
      in Vibrio cholerae and Acinetobacter baylyi assays.
