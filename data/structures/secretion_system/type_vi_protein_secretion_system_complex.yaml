identifier: GO:0033104
label: type VI protein secretion system complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial contractile injection machine whose envelope-spanning membrane
  complex anchors a baseplate and sheath-wrapped Hcp tube; sheath contraction propels
  the Hcp/VgrG/PAAR spike and associated effectors out of the cell into target cells.
definition_source: GO:0033104
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-04T19:12:48Z'
  curator: claude
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-04T19:13:19Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added T6SS synonyms, components, taxonomy, examples, function, evidence,
    a contractile-injection graph, and a subassembly-splitting todo.
  llm_assisted: true
synonyms:
- synonym_text: T6SS complex
  synonym_type: EXACT_SYNONYM
  source: GO:0033104
- synonym_text: type VI secretion system
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/microbiolspec.PSIB-0031-2019
parent_structures:
- GO:0032991
components:
- component_id: membrane_complex
  label: TssJ/TssL/TssM membrane complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - tssJ
  - tssL
  - tssM
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This heterotrimeric envelope-spanning module has no exact source-neutral
    complex CURIE curated yet.
  role: Envelope-spanning anchor and channel that recruits the cytoplasmic baseplate
    and orients firing toward the cell exterior.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review TssJ, TssL and TssM as the membrane complex
      anchoring the T6SS.
  - reference: DOI:10.1038/nature14667
    notes: Durand et al. 2015 determined the biogenesis and structure of the TssJLM
      type VI secretion membrane core complex.
- component_id: baseplate
  label: T6SS baseplate and wedge complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - tssE
  - tssF
  - tssG
  - tssK
  - vgrG
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The T6SS baseplate is a multi-family assembly analogous to a phage
    baseplate; no exact whole-baseplate CURIE was curated.
  role: Cytoplasmic phage-baseplate-like platform that docks to the membrane complex
    and initiates tail-tube and sheath polymerization.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1005545
    notes: Brunet et al. 2015 reconstituted interactions among TssE, TssF, TssG, TssK
      and VgrG and proposed a T6SS phage-like baseplate complex.
  - reference: DOI:10.15252/embj.201797103
    notes: Nazarov et al. 2018 imaged the baseplate at the end of Vibrio cholerae
      T6SS sheaths and showed its relationship to sheath-tube polymerization.
- component_id: hcp_tube
  label: Hcp inner tube
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - hcp
  essentiality: ESSENTIAL
  role: Stacked hexameric tube that carries effectors and is expelled from the cell
    when the surrounding sheath contracts.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review Hcp as the inner tube ejected by the contractile
      sheath.
- component_id: contractile_sheath
  label: TssB/TssC contractile sheath
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - tssB
  - tssC
  - vipA
  - vipB
  essentiality: ESSENTIAL
  role: Metastable sheath surrounding the Hcp tube; contraction drives spike and tube
    ejection.
  evidence:
  - reference: DOI:10.1038/nature10846
    notes: Basler et al. 2012 showed that T6SS requires dynamic VipA/VipB contractile
      phage-tail-like sheath structures.
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review sheath extension, contraction and recycling
      during T6SS firing.
- component_id: spike_complex
  label: VgrG/PAAR spike complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - vgrG
  - paar
  essentiality: ESSENTIAL
  role: Tip complex capping the Hcp tube and presenting or sharpening effector delivery
    into target cells.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review the VgrG/PAAR spike at the distal end of the
      Hcp tube.
- component_id: clpv_recycler
  label: ClpV sheath recycler
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - clpV
  - tssH
  essentiality: DISPENSABLE
  role: AAA+ ATPase that disassembles contracted sheaths for subunit reuse after firing
    in ClpV-containing systems.
  evidence:
  - reference: DOI:10.1038/nature10846
    notes: Basler et al. 2012 tracked ClpV-dependent turnover of VipA/VipB sheaths
      in living Vibrio cholerae cells.
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review ClpV recycling of contracted sheaths and note
      that some T6SSs fire without ClpV.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: T6SS loci occur in many Gram-negative bacterial lineages but are absent from
    other bacterial clades and individual strains.
  reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Type VI secretion is a bacterial contractile injection system with no curated
    archaeal occurrence in GO.
  reference: GO:0033104
canonical_examples:
- taxon_id: NCBITaxon:666
  taxon_label: Vibrio cholerae
  note: Model bacterium for live-cell imaging and cryo-EM of dynamic T6SS sheath contraction
    and baseplate architecture.
  reference: DOI:10.1038/nature10846
functions:
- function_id: type_vi_protein_secretion
  label: protein secretion by the type VI secretion system
  grounding: GO:0033103
  description: Sheath contraction expels an Hcp tube and VgrG/PAAR spike loaded with
    effectors into the extracellular milieu or target cells.
  evidence:
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review T6SS firing as a contractile injection mechanism
      for effector delivery.
evidence:
- reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
  notes: Cherrak Y, Flaugnatti N, Durand E, Journet L and Cascales E 2019, Structure
    and Activity of the Type VI Secretion System, Microbiology Spectrum.
- reference: DOI:10.1038/nature14667
  notes: Durand et al. 2015, Biogenesis and structure of a type VI secretion membrane
    core complex, Nature.
- reference: DOI:10.1038/nature10846
  notes: Basler et al. 2012, Type VI secretion requires a dynamic contractile phage
    tail-like structure, Nature.
- reference: DOI:10.1371/journal.pgen.1005545
  notes: Brunet et al. 2015, The Type VI secretion TssEFGK-VgrG phage-like baseplate
    is recruited to the TssJLM membrane complex via multiple contacts and serves as
    assembly platform for tail tube and sheath polymerization, PLoS Genetics.
- reference: DOI:10.15252/embj.201797103
  notes: Nazarov et al. 2018, Cryo-EM reconstruction of Type VI secretion system baseplate
    and sheath distal end, EMBO Journal.
causal_graphs:
- graph_id: contractile_tube_injection
  title: A baseplate-primed sheath ejects an Hcp tube and VgrG spike
  description: The TssJLM membrane complex recruits a phage-like baseplate. The baseplate
    primes Hcp tube polymerization and TssB/TssC sheath extension; when the sheath
    contracts, it ejects the Hcp-VgrG-PAAR spike and any associated effectors through
    the envelope into a target cell.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
