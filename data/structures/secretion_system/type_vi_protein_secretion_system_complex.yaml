  edges:
  - subject: membrane
    predicate: recruits
    object: baseplate
    description: The envelope-spanning membrane complex recruits and anchors the cytoplasmic
      baseplate through TssK-containing contacts.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1005545
      notes: Brunet et al. 2015 proposed multiple contacts between the TssEFGK-VgrG
        baseplate and the TssJLM membrane complex.
  - subject: baseplate
    predicate: primes polymerization of
    object: tube
    description: The phage-like baseplate nucleates tail-tube assembly in the bacterial
      cytoplasm.
    evidence:
    - reference: DOI:10.15252/embj.201797103
      notes: Nazarov et al. 2018 imaged T6SS baseplates attached to the distal ends
        of Vibrio cholerae sheath-tube assemblies.
  - subject: baseplate
    predicate: primes polymerization of
    object: sheath
    description: Extended contractile sheath polymerizes from the baseplate around
      the Hcp tube.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
      notes: Cherrak et al. 2019 review baseplate-initiated sheath-tube polymerization.
  - subject: spike
    predicate: caps
    object: tube
    description: The VgrG/PAAR spike caps the Hcp tube to form a puncturing tip.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
      notes: Cherrak et al. 2019 review the VgrG/PAAR spike as the cap at the end
        of the Hcp tube.
  - subject: sheath
    predicate: contracts to eject
    object: spike
    description: Contraction of the metastable sheath propels the Hcp tube and spike
      outward through the envelope.
    evidence:
    - reference: DOI:10.1038/nature10846
      notes: Basler et al. 2012 showed VipA/VipB sheath extension and contraction
        coupled to type VI secretion.
  - subject: t6ss
    predicate: carries out
    object: secretion
    description: The assembled apparatus exports effector proteins by contractile
      firing.
    evidence:
    - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
      notes: Cherrak et al. 2019 review the T6SS as a spring-like apparatus that injects
        effectors into target cells.
  - subject: clpv
    predicate: recycles
    object: sheath
    description: ClpV disassembles contracted sheath polymers so sheath subunits can
      be reused for another firing cycle.
    evidence:
    - reference: DOI:10.1038/nature10846
      notes: Basler et al. 2012 observed ClpV-dependent T6SS sheath turnover in Vibrio
        cholerae.
