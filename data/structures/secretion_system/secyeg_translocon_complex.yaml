components:
- component_id: secy_channel_subunit
  label: SecY protein-conducting channel subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - secY
  - prlA
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SecY is a conserved bacterial core-channel component; no exact
    source-neutral family CURIE was curated.
  role: Multi-pass membrane subunit that forms the hourglass-shaped protein-conducting
    pore and lateral gate of the SecYEG channel.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-050511-102312
    notes: Park and Rapoport 2012 review SecY/Sec61 as the central pore-forming subunit
      of the conserved protein-conducting channel.
  - reference: DOI:10.1038/s41467-019-10918-2
    notes: Ma et al. 2019 resolved a bacterial substrate-engaged SecA-SecY translocation
      machine that shows preprotein inside SecY.
- component_id: sece_clamp_subunit
  label: SecE clamp subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - secE
  - prlG
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SecE is the conserved partner that stabilizes bacterial SecY; no
    exact source-neutral family CURIE was curated.
  role: Membrane clamp that braces the two halves of SecY and stabilizes the protein-conducting
    channel.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-050511-102312
    notes: Park and Rapoport 2012 review SecE as the subunit that embraces SecY/Sec61
      and holds the channel together.
  - reference: DOI:10.1093/emboj/16.10.2756
    notes: Duong and Wickner 1997 dissected the catalytic roles of the SecYE, SecG,
      and SecDF-YajC subunits of the E. coli preprotein translocase holoenzyme.
- component_id: secg_accessory_subunit
  label: SecG accessory channel subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - secG
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SecG is the third named bacterial SecYEG subunit; no exact source-neutral
    family CURIE was curated.
  role: Small membrane subunit that associates with SecY and SecE to form the bacterial
    SecYEG heterotrimer.
  evidence:
  - reference: DOI:10.1038/nrmicro.2016.161
    notes: Tsirigotaki et al. 2017 review SecG as a bacterial SecYEG channel subunit.
  - reference: DOI:10.1093/emboj/16.10.2756
    notes: Duong and Wickner 1997 separated the functions of SecYE, SecG, and SecDF-YajC
      in purified E. coli preprotein translocase.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: The SecYEG channel is broadly conserved in bacterial cytoplasmic membranes
    as the core of the Sec protein-export route.
  reference: DOI:10.1038/nrmicro.2016.161
canonical_examples:
