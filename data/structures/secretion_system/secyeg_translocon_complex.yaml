- timestamp: '2026-09-07T00:07:36Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added SecYEG synonymy, protein-complex parentage, broader GO:0031522 Sec-complex
    parthood, SecY, SecE, and SecG components, bacterial taxonomic scope, an Escherichia
    coli canonical example, GO:0043952 protein transport function grounding, record
    evidence, a SecA-driven preprotein-translocation graph, and a Sec holo-translocon
    boundary TODO.
  llm_assisted: true
- timestamp: '2026-09-07T00:08:20Z'
  curator: claude
  action: REVIEW_FIX
  changes: 'Resolved issue #218 by narrowing the GO:0043952 function description to
