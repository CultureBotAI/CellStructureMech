identifier: cellstructuremech:secyeg_translocon_complex
label: SecYEG translocon complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial cytoplasmic-membrane Sec-pathway protein-conducting channel
  built from SecY, SecE, and SecG, through which unfolded secretory proteins or nascent
  membrane proteins move during translocation or membrane insertion.
definition_source: DOI:10.1038/nrmicro.2016.161
mapping_status: PROPOSED
