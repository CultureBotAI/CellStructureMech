functions:
- function_id: protein_transport_by_sec_complex
  label: protein transport by the Sec complex
  grounding: GO:0043952
  description: The SecYEG channel translocates unfolded secretory preproteins across
    the bacterial cytoplasmic membrane via the Sec complex.
  evidence:
  - reference: GO:0043952
    notes: GO:0043952 defines unfolded-protein transport across Gram-positive and
      Gram-negative bacterial cytoplasmic membranes by the Sec complex.
  - reference: DOI:10.1038/nrmicro.2016.161
    notes: Tsirigotaki et al. 2017 review the Sec pathway as the main bacterial export
      route for unfolded secretory preproteins and membrane proteins.
evidence:
- reference: DOI:10.1038/nrmicro.2016.161
  notes: Tsirigotaki et al. 2017, Protein export through the bacterial Sec pathway,
    Nature Reviews Microbiology.
- reference: DOI:10.1146/annurev-biophys-050511-102312
  notes: Park and Rapoport 2012, Mechanisms of Sec61/SecY-Mediated Protein Translocation
    Across Membranes, Annual Review of Biophysics.
- reference: DOI:10.1093/emboj/16.10.2756
  notes: Duong and Wickner 1997, Distinct catalytic roles of the SecYE, SecG and SecDFyajC
    subunits of preprotein translocase holoenzyme, The EMBO Journal.
- reference: DOI:10.1038/nature17163
  notes: Li et al. 2016, Crystal structure of a substrate-engaged SecY protein-translocation
    channel, Nature.
- reference: DOI:10.1038/s41467-019-10918-2
  notes: Ma et al. 2019, Structure of the substrate-engaged SecA-SecY protein translocation
    machine, Nature Communications.
causal_graphs:
- graph_id: seca_driven_preprotein_translocation
  title: SecA drives preproteins through SecYEG
  description: SecY and SecE form the stabilized channel core, SecG completes the
    bacterial SecYEG heterotrimer, and the SecA ATPase drives unfolded preproteins
    through the SecY pore during post-translational secretion.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
