  edges:
  - subject: sece_clamp_subunit
    predicate: stabilizes
    object: secy_channel_subunit
    description: SecE wraps around SecY and stabilizes the protein-conducting channel
      fold.
    evidence:
    - reference: DOI:10.1146/annurev-biophys-050511-102312
      notes: Park and Rapoport 2012 review SecE's bracing role in the SecY/Sec61 channel.
  - subject: secy_channel_subunit
    predicate: forms pore of
    object: secyeg
    description: SecY contributes the central pore and lateral gate of the SecYEG
      translocon.
    evidence:
    - reference: DOI:10.1038/nature17163
      notes: Li et al. 2016 captured a substrate-engaged SecY channel with preprotein
        density in the pore.
  - subject: secg_accessory_subunit
    predicate: associates with
    object: secy_channel_subunit
    description: SecG associates with SecY and SecE as the third subunit of the bacterial
      SecYEG channel.
    evidence:
    - reference: DOI:10.1093/emboj/16.10.2756
      notes: Duong and Wickner 1997 characterized SecG separately from SecYE within
        the E. coli preprotein translocase.
  - subject: seca_atpase
    predicate: binds
    object: secyeg
    description: SecA binds the SecYEG channel to form the post-translational preprotein-translocation
      state.
    evidence:
    - reference: DOI:10.1038/s41467-019-10918-2
      notes: Ma et al. 2019 resolved a substrate-engaged bacterial SecA-SecY translocation
        machine.
  - subject: seca_atpase
    predicate: pushes
    object: unfolded_preprotein
    description: SecA ATPase cycles drive unfolded secretory preprotein segments through
      the SecY channel.
    evidence:
    - reference: DOI:10.1038/nrmicro.2016.161
      notes: Tsirigotaki et al. 2017 review ATP-driven SecA motor action during Sec-dependent
        protein export.
  - subject: secyeg
    predicate: carries out
    object: sec_transport
    description: The SecYEG channel provides the membrane conduit for Sec-dependent
      protein transport.
    evidence:
