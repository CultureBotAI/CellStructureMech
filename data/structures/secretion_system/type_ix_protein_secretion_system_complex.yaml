  llm_assisted: true
- timestamp: '2026-09-06T20:02:28Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added type IX secretion synonymy, protein-complex parentage, PorL/PorM,
    PorK/PorN, Sov/SprA, PorV, and PorW components, Bacteroidota taxonomic scope,
    a Porphyromonas gingivalis canonical example, GO:0160303 type IX secretion function
    grounding, record evidence, and a T9SS export graph.
  llm_assisted: true
- timestamp: '2026-09-06T20:03:29Z'
