identifier: cellstructuremech:type_ix_protein_secretion_system_complex
label: type IX protein secretion system complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A Bacteroidota trans-envelope secretion nanomachine that couples an inner-membrane
  PorL/PorM-family motor to PorK/PorN outer-membrane rings and a SprA/Sov translocon
  to export folded C-terminal-domain-bearing proteins across the outer membrane.
definition_source: DOI:10.1099/mic.0.001320
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-06T20:01:35Z'
  curator: claude
