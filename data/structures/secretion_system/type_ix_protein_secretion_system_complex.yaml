  - node_id: pork_porn_outer_membrane_ring
    label: PorK/PorN outer-membrane ring complex
    node_type: GENE_OR_PROTEIN
    component_ref: pork_porn_outer_membrane_ring
  - node_id: sov_spra_outer_membrane_translocon
    label: Sov/SprA outer-membrane translocon
    node_type: GENE_OR_PROTEIN
    component_ref: sov_spra_outer_membrane_translocon
  - node_id: porv_outer_membrane_shuttle
    label: PorV-family outer-membrane shuttle
    node_type: GENE_OR_PROTEIN
  - node_id: porw_ring_translocon_linker
    label: PorW ring-translocon linker
    node_type: GENE_OR_PROTEIN
    component_ref: porw_ring_translocon_linker
  - node_id: t9ss
    label: type IX protein secretion system complex
    node_type: STRUCTURE
    grounding: cellstructuremech:type_ix_protein_secretion_system_complex
  - node_id: ctd_substrates
    label: T9SS C-terminal-domain-bearing substrates
    node_type: GENE_OR_PROTEIN
  - node_id: type_ix_secretion
    label: protein secretion by the type IX secretion system
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0160303
  edges:
  - subject: porl_porm_motor
    predicate: powers
    object: type_ix_secretion
    description: The PorL/PorM-family inner-membrane motor uses the proton motive
      force to power type IX secretion.
    evidence:
    - reference: DOI:10.1038/s41564-020-00823-6
      notes: Hennell James et al. 2021 resolved GldLM and PorLM motor structures and
        tested proton-coupling residues needed for motility and secretion.
  - subject: pork_porn_outer_membrane_ring
    predicate: scaffolds
    object: t9ss
    description: PorK and PorN assemble into large rings on the outer-membrane side
      of the T9SS.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1005820
      notes: Gorasia et al. 2016 isolated PorK/PorN ring-like structures from Porphyromonas
        gingivalis.
  - subject: porw_ring_translocon_linker
    predicate: links
    object: sov_spra_outer_membrane_translocon
    description: PorW connects the PorK/PorN ring to the Sov translocon within the
      outer-membrane part of the apparatus.
    evidence:
    - reference: DOI:10.1128/spectrum.01602-21
      notes: Gorasia et al. 2022 placed PorW between the PorK/N ring complex and Sov
        translocon by T9SS interactome analysis.
  - subject: sov_spra_outer_membrane_translocon
    predicate: translocates
    object: ctd_substrates
    description: SprA/Sov forms an outer-membrane beta-barrel channel with gated periplasmic
      and lateral openings for type IX protein substrates.
    evidence:
    - reference: DOI:10.1038/s41586-018-0693-y
      notes: Lauber et al. 2018 resolved SprA as the T9SS protein-conducting translocon.
  - subject: sov_spra_outer_membrane_translocon
    predicate: passes substrates to
    object: porv_outer_membrane_shuttle
    description: The SprA/Sov translocon opens laterally toward PorV so exported cargo
      can be handed to an outer-membrane shuttle protein.
    evidence:
    - reference: DOI:10.1038/s41586-018-0693-y
      notes: Lauber et al. 2018 determined SprA structures bound to PorV at the lateral
        opening.
  - subject: t9ss
    predicate: carries out
    object: type_ix_secretion
    description: The assembled T9SS exports folded CTD-bearing proteins from the periplasm
      across the outer membrane.
    evidence:
    - reference: GO:0160303
      notes: GO:0160303 defines the type IX secretion process as periplasm-to-outer-membrane
        protein movement via the T9SS.
discussions:
- discussion_id: porv_poru_porz_component_boundary
  prompt: Resolve which PorV-family shuttle proteins and PorU/PorZ cargo-processing
    or attachment proteins are stable structural T9SS constituents rather than substrate
    handoff machinery.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#porw_ring_translocon_linker
  - causal_graphs#t9ss_outer_membrane_export
  rationale: PorV and PorU/PorZ are strongly tied to cargo handoff and C-terminal-domain
    processing in Porphyromonas gingivalis, but the first generic Bacteroidota T9SS
    record only models the trans-envelope core and the PorW bridge to avoid representing
    substrate shuttles as universal core constituents.
  evidence:
  - reference: DOI:10.1099/mic.0.001320
    supports: SUPPORT
    notes: Paillat et al. 2023 review type IX effector selection, transport, processing,
      and post-export sorting.
  - reference: DOI:10.1128/spectrum.01602-21
    supports: SUPPORT
    notes: Gorasia et al. 2022 placed PorW in the core PorK/N-Sov connection while
      expanding the broader T9SS interactome.
  posed_by: claude
  posed_date: '2026-09-06'
