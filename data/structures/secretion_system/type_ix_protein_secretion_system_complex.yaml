  llm_assisted: true
synonyms:
- synonym_text: type IX secretion system
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1099/mic.0.001320
- synonym_text: T9SS
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/microbiolspec.PSIB-0002-2018
- synonym_text: Por secretion system
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1073/pnas.0912010107
parent_structures:
- GO:0032991
components:
- component_id: porl_porm_motor
  label: PorL/PorM inner-membrane motor
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - porL
  - porM
  - gldL
  - gldM
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The PorL/PorM and GldL/GldM orthologous motors have no exact source-neutral
    complex CURIE curated yet.
  role: Inner-membrane proton-driven motor complex that energizes type IX secretion
    and related Bacteroidota gliding motility.
  evidence:
  - reference: DOI:10.1038/s41564-020-00823-6
    notes: Hennell James et al. 2021 resolved GldLM and PorLM as inner-membrane rotary
      motors for type 9 secretion and gliding motility.
  - reference: DOI:10.1038/s41467-017-02784-7
    notes: Leone et al. 2018 showed that PorM and GldM form periplasm-spanning arches
      coupled to type IX secretion and gliding machinery.
- component_id: pork_porn_outer_membrane_ring
  label: PorK/PorN outer-membrane ring complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - porK
  - porN
  - gldK
  - gldN
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Bacteroidota PorK/PorN-GldK/GldN outer-membrane ring subassembly
    has no exact source-neutral complex CURIE curated yet.
  role: Large outer-membrane-associated ring that forms a scaffold for the type IX
    secretion envelope complex.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1005820
    notes: Gorasia et al. 2016 isolated and imaged PorK/PorN rings from Porphyromonas
      gingivalis T9SS preparations.
  - reference: DOI:10.3390/microorganisms8081173
    notes: Gorasia et al. 2020 review the PorK/PorN ring as an outer-membrane T9SS
      subcomplex.
- component_id: sov_spra_outer_membrane_translocon
  label: Sov/SprA outer-membrane translocon
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - sov
  - sprA
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Sov and SprA are orthologous T9SS translocon beta-barrel proteins;
    no exact family CURIE was curated.
  role: Outer-membrane beta-barrel translocon that forms the protein-conducting channel
    for type IX substrates.
  evidence:
  - reference: DOI:10.1038/s41586-018-0693-y
    notes: Lauber et al. 2018 identified SprA as the T9SS protein-conducting translocon
      and resolved SprA complexes with PorV or plug partners.
- component_id: porw_ring_translocon_linker
  label: PorW ring-translocon linker
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - porW
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PorW links the Porphyromonas gingivalis PorK/PorN ring and Sov
    translocon; no exact source-neutral PorW family CURIE was curated, and orthology
    outside Porphyromonas needs follow-up.
  role: Links the PorK/PorN ring complex to the Sov translocon in the outer-membrane
    portion of the Porphyromonas gingivalis T9SS.
  evidence:
  - reference: DOI:10.1128/spectrum.01602-21
    notes: Gorasia et al. 2022 identified PorW as the physical connection between
      the PorK/PorN ring and Sov translocon.
taxonomic_distribution:
- taxon_id: NCBITaxon:976
  taxon_label: Bacteroidota
  presence: COMMON
  note: T9SS is common in Bacteroidota but absent from some members, with secretion
    and gliding systems apparently confined to this phylum.
  reference: DOI:10.1128/microbiolspec.PSIB-0002-2018
canonical_examples:
- taxon_id: NCBITaxon:837
  taxon_label: Porphyromonas gingivalis
  note: Model periodontal pathogen used by Sato et al. 2010 to discover the Por secretion
    system through comparative genomics and gingipain-secretion genetics.
  reference: DOI:10.1073/pnas.0912010107
functions:
- function_id: protein_secretion_by_type_ix_secretion_system
  label: protein secretion by the type IX secretion system
  grounding: GO:0160303
  description: The T9SS moves folded, C-terminal-domain-bearing substrates from the
    periplasm across the outer membrane in Bacteroidota bacteria.
  evidence:
  - reference: DOI:10.1099/mic.0.001320
    notes: Paillat et al. 2023 review how T9SS effectors are selected, transported
      through SprA/Sov, and processed after export.
  - reference: GO:0160303
    notes: GO:0160303 defines type IX secretion as protein movement from the periplasmic
      space across the Bacteroidota outer membrane via the T9SS.
evidence:
- reference: DOI:10.1073/pnas.0912010107
  notes: Sato et al. 2010, A protein secretion system linked to bacteroidete gliding
    motility and pathogenesis, Proceedings of the National Academy of Sciences.
- reference: DOI:10.1128/microbiolspec.PSIB-0002-2018
  notes: McBride 2019, Bacteroidetes Gliding Motility and the Type IX Secretion System,
    Microbiology Spectrum.
- reference: DOI:10.3390/microorganisms8081173
  notes: 'Gorasia et al. 2020, The Type IX Secretion System: Advances in Structure,
    Function and Organisation, Microorganisms.'
- reference: DOI:10.1038/s41586-018-0693-y
  notes: Lauber et al. 2018, Type 9 secretion system structures reveal a new protein
    transport mechanism, Nature.
- reference: DOI:10.1038/s41564-020-00823-6
  notes: Hennell James et al. 2021, Structure and mechanism of the proton-driven motor
    that powers type 9 secretion and gliding motility, Nature Microbiology.
- reference: DOI:10.1128/spectrum.01602-21
  notes: Gorasia et al. 2022, Protein Interactome Analysis of the Type IX Secretion
    System Identifies PorW as the Missing Link between the PorK/N Ring Complex and
    the Sov Translocon, Microbiology Spectrum.
causal_graphs:
- graph_id: t9ss_outer_membrane_export
  title: PorL/PorM energizes PorK/PorN-Sov export
  description: The PorL/PorM-family inner-membrane motor supplies proton-driven energy,
    the PorK/PorN ring scaffolds the outer-membrane side, PorW links the ring to Sov,
    and SprA/Sov forms the outer-membrane translocon that passes folded type IX substrates
    to a PorV-family shuttle.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  nodes:
  - node_id: porl_porm_motor
    label: PorL/PorM inner-membrane motor
    node_type: GENE_OR_PROTEIN
