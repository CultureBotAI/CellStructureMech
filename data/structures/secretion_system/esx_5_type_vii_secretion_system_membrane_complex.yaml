identifier: cellstructuremech:esx_5_type_vii_secretion_system_membrane_complex
label: ESX-5 type VII secretion system membrane complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A mycobacterial ESX-5 type VII secretion inner-membrane complex in which
  EccB5, EccC5, EccD5, EccE5, and MycP5 assemble into a multi-megadalton nanomachine
  that exports Esx and PE/PPE-family protein substrates.
definition_source: DOI:10.1038/s41586-021-03517-z
mapping_status: PROPOSED
