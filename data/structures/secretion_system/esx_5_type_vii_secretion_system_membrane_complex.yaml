synonyms:
- synonym_text: mycobacterial ESX-5 secretion system membrane complex
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/nmicrobiol.2017.47
- synonym_text: ESX-5 membrane complex
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1111/j.1365-2958.2012.08206.x
- synonym_text: T7SS membrane complex
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/s41586-021-03517-z
parent_structures:
- GO:0032991
components:
- component_id: eccb5_periplasmic_scaffold
  label: EccB5 periplasmic scaffold protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - eccB5
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: EccB5 is the ESX-5 paralogue of the EccB component family; no exact
    source-neutral CURIE for an ESX-5-specific EccB5 family was curated.
  role: Dimerizes in the periplasmic dome and scaffolds the membrane-anchored ESX-5
    secretion chamber.
  evidence:
  - reference: DOI:10.1038/s41586-021-03517-z
    notes: Bunduc et al. 2021 placed six EccB5 copies in the M. tuberculosis ESX-5
      periplasmic dome.
  - reference: DOI:10.1111/j.1365-2958.2012.08206.x
    notes: Houben et al. 2012 detected EccB5 in the native ESX-5 membrane complex
      from Mycobacterium marinum and M. bovis BCG.
- component_id: eccc5_atpase_motor
  label: EccC5 secretion ATPase
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - eccC5
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: EccC5 is the ESX-5 FtsK/SpoIIIE-family ATPase; no exact source-neutral
    CURIE for an ESX-5-specific EccC5 family was curated.
  role: ATPase with cytosolic motor domains and central transmembrane bundles positioned
    to power ESX-5 substrate export.
  evidence:
  - reference: DOI:10.1038/s41586-021-03517-z
    notes: Bunduc et al. 2021 resolved EccC5 dimers with cytosolic ATPase domains
      and central transmembrane bundles in the ESX-5 complex.
  - reference: DOI:10.1038/nmicrobiol.2017.47
    notes: Beckham et al. 2017 placed EccC5 in the purified mycobacterial ESX-5 membrane
      complex.
- component_id: eccd5_transmembrane_core
  label: EccD5 transmembrane core protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - eccD5
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: EccD5 is the ESX-5 hydrophobic EccD paralogue; no exact source-neutral
    CURIE for an ESX-5-specific EccD5 family was curated.
  role: Multi-pass inner-membrane component that supplies most of the transmembrane
    helices in the ESX-5 secretion complex.
  evidence:
  - reference: DOI:10.1038/s41586-021-03517-z
    notes: Bunduc et al. 2021 found twelve EccD5 copies in the M. tuberculosis ESX-5
      membrane-embedded core.
  - reference: DOI:10.1111/j.1365-2958.2012.08206.x
    notes: Houben et al. 2012 showed that EccD5 is a constituent of the ESX-5 membrane
      complex.
- component_id: ecce5_membrane_complex_protein
  label: EccE5 membrane complex protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - eccE5
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: EccE5 is the ESX-5 EccE paralogue; no exact source-neutral CURIE
    for an ESX-5-specific EccE5 family was curated.
  role: Inner-membrane component that contacts EccB5, EccC5, and EccD5 in each ESX-5
    protomer.
  evidence:
  - reference: DOI:10.1038/s41586-021-03517-z
    notes: Bunduc et al. 2021 resolved six EccE5 copies in the intact ESX-5 membrane
      complex.
  - reference: DOI:10.1111/j.1365-2958.2012.08206.x
    notes: Houben et al. 2012 identified EccE5 in the native ESX-5 membrane complex.
- component_id: mycp5_mycosin_protease
  label: MycP5 mycosin protease
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - mycP5
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: MycP5 is the ESX-5-associated mycosin protease; no exact source-neutral
    CURIE for an ESX-5-specific MycP5 family was curated.
  role: Periplasmic mycosin that caps and stabilizes the EccB5 dome of the assembled
    ESX-5 membrane complex.
  evidence:
  - reference: DOI:10.1038/s41586-021-03517-z
    notes: Bunduc et al. 2021 found three MycP5 copies capping the ESX-5 periplasmic
      chamber and stabilizing the full complex.
taxonomic_distribution:
- taxon_id: NCBITaxon:1763
  taxon_label: Mycobacterium
  presence: VARIABLE
  note: ESX-5 is a mycobacterial ESX paralogue system associated with slow-growing
    mycobacteria rather than a universal ESX locus across the genus.
  reference: DOI:10.1016/j.bbamcr.2013.11.003
canonical_examples:
- taxon_id: NCBITaxon:83332
  taxon_label: Mycobacterium tuberculosis H37Rv
  note: Source of the ESX-5 locus cloned for the intact ESX-5 structure that resolved
    the EccB5/EccC5/EccD5/EccE5/MycP5 stoichiometry.
  reference: DOI:10.1038/s41586-021-03517-z
functions:
- function_id: protein_secretion_by_type_vii_secretion_system
  label: protein secretion by the type VII secretion system
  grounding: GO:0044315
  description: The ESX-5 membrane complex exports Esx and PE/PPE-family type VII substrates
    in M. tuberculosis and related slow-growing mycobacteria.
  evidence:
  - reference: DOI:10.1016/j.bbamcr.2013.11.003
    notes: Houben et al. 2014 review ESX-5 as one of the mycobacterial type VII secretion
      pathways for protein export across the cell envelope.
  - reference: DOI:10.1038/s41586-021-03517-z
    notes: Bunduc et al. 2021 interpret the ESX-5 inner-membrane complex as the core
      assembly for PE/PPE substrate transport.
evidence:
- reference: DOI:10.1038/s41586-021-03517-z
  notes: Bunduc CM et al. 2021, Structure and dynamics of a mycobacterial type VII
    secretion system, Nature.
- reference: DOI:10.1111/j.1365-2958.2012.08206.x
  notes: Houben ENG et al. 2012, Composition of the type VII secretion system membrane
    complex, Molecular Microbiology.
- reference: DOI:10.1016/j.bbamcr.2013.11.003
  notes: Houben ENG, Korotkov KV and Bitter W 2014, Take five - Type VII secretion
    systems of Mycobacteria, Biochimica et Biophysica Acta.
- reference: DOI:10.1038/nmicrobiol.2017.47
  notes: Beckham KSH et al. 2017, Structure of the mycobacterial ESX-5 type VII secretion
    system membrane complex by single-particle analysis, Nature Microbiology.
causal_graphs:
- graph_id: esx5_membrane_complex_export
  title: EccB5/EccD5/MycP5 build the ESX-5 chamber over EccC5
  description: Six EccB5, six EccE5, twelve EccD5, six EccC5, and three MycP5 copies
    form the ESX-5 inner-membrane core. EccB5 and MycP5 build the periplasmic dome,
    EccD5 supplies much of the transmembrane core, and EccC5 ATPase domains sit on
    the cytosolic side where they are positioned to drive type VII substrate export.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
