  edges:
  - subject: eccb5_periplasmic_scaffold
    predicate: forms dome of
    object: esx5_membrane_complex
    description: EccB5 dimers form a periplasmic dome on the membrane-embedded ESX
      complex.
    evidence:
    - reference: DOI:10.1038/s41586-021-03517-z
      notes: Bunduc et al. 2021 resolved three EccB5 dimers in the ESX-5 periplasmic
        dome.
  - subject: mycp5_mycosin_protease
    predicate: caps
    object: esx5_membrane_complex
    description: MycP5 binds above the EccB5 dome and stabilizes the assembled ESX-5
      membrane complex.
    evidence:
    - reference: DOI:10.1038/s41586-021-03517-z
      notes: MycP5-bound ESX-5 complexes were more stable than MycP5-free complexes.
  - subject: eccd5_transmembrane_core
    predicate: forms membrane core of
    object: esx5_membrane_complex
    description: EccD5 supplies the dominant multi-pass transmembrane component of
      the ESX-5 core.
    evidence:
    - reference: DOI:10.1038/s41586-021-03517-z
      notes: The intact ESX-5 structure contains twelve EccD5 copies in the membrane
        region.
  - subject: ecce5_membrane_complex_protein
    predicate: bridges subunits within
    object: esx5_membrane_complex
    description: EccE5 packs into each ESX-5 protomer alongside EccB5, EccC5, and
      EccD5.
    evidence:
    - reference: DOI:10.1038/s41586-021-03517-z
      notes: Bunduc et al. 2021 assigned six EccE5 copies to the intact ESX-5 assembly.
  - subject: eccc5_atpase_motor
    predicate: powers
    object: protein_export
    description: The cytosolic EccC5 ATPase domains are positioned to couple ATP hydrolysis
      to ESX substrate export.
    evidence:
    - reference: DOI:10.1038/nmicrobiol.2017.47
      notes: Beckham et al. 2017 linked EccC5 to the cytosolic face of the ESX-5 membrane
        complex by single-particle analysis.
  - subject: esx5_membrane_complex
    predicate: exports
    object: type_vii_substrates
    description: The assembled ESX-5 membrane complex exports folded type VII substrates
      across the mycobacterial cell envelope.
    evidence:
    - reference: DOI:10.1016/j.bbamcr.2013.11.003
      notes: Houben et al. 2014 review the mycobacterial ESX-5 pathway as a specialized
        type VII protein secretion system.
