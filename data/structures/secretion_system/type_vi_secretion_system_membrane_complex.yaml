  edges:
  - subject: tssj
    predicate: assembles into
    object: membrane_complex
    description: TssJ contributes to the outer-membrane side of the TssJLM membrane
      core complex.
    evidence:
    - reference: DOI:10.1038/nature14667
      notes: Durand et al. 2015 reconstituted a membrane core containing TssJ, TssL
        and TssM.
  - subject: tssm
    predicate: assembles into
    object: membrane_complex
    description: TssM assembles with TssJ and TssL in the T6SS membrane core complex.
    evidence:
    - reference: DOI:10.1038/nature14667
      notes: Durand et al. 2015 analyzed the assembly and structure of the TssJLM
        membrane core.
  - subject: tssl
    predicate: assembles into
    object: membrane_complex
    description: TssL assembles with TssM and TssJ in the T6SS membrane core complex.
    evidence:
    - reference: DOI:10.1038/nature14667
      notes: Durand et al. 2015 analyzed TssL as one of the three TssJLM membrane-core
        constituents.
  - subject: membrane_complex
    predicate: anchors
    object: baseplate
    description: The assembled TssJLM membrane complex docks the T6SS baseplate to
      the cell envelope.
