identifier: cellstructuremech:type_vi_secretion_system_membrane_complex
label: type VI secretion system membrane complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial type VI secretion system subassembly in which TssJ-, TssL-,
  and TssM-family proteins form an envelope-spanning membrane core of the secretion
  apparatus.
definition_source: DOI:10.1038/nature14667
mapping_status: PROPOSED
