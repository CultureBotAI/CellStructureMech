taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: The TssJ/TssL/TssM membrane complex is the envelope anchor of bacterial type
    VI secretion systems, which occur patchily across Gram-negative lineages.
  reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Enteroaggregative Escherichia coli supplied the TssJLM membrane core reconstituted
    and structurally characterized by Durand et al.
  reference: DOI:10.1038/nature14667
functions:
- function_id: t6ss_membrane_core_anchoring
  label: T6SS membrane-core anchoring
  description: The TssJLM membrane complex anchors the type VI secretion apparatus
    in the cell envelope and recruits the cytoplasmic baseplate.
  evidence:
  - reference: DOI:10.1038/nature14667
    notes: Durand et al. 2015 determined the architecture and biogenesis of the TssJLM
      membrane core complex.
  - reference: DOI:10.1371/journal.pgen.1005545
    notes: Brunet et al. 2015 proposed multiple contacts between the TssEFGK-VgrG
      baseplate and the TssJLM membrane complex.
evidence:
- reference: DOI:10.1038/nature14667
  notes: Durand et al. 2015, Biogenesis and structure of a type VI secretion membrane
    core complex, Nature.
- reference: DOI:10.1371/journal.pgen.1005545
  notes: Brunet et al. 2015, The Type VI secretion TssEFGK-VgrG phage-like baseplate
    is recruited to the TssJLM membrane complex via multiple contacts and serves as
    assembly platform for tail tube and sheath polymerization, PLoS Genetics.
- reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
  notes: Cherrak et al. 2019, Structure and Activity of the Type VI Secretion System,
    Microbiology Spectrum.
causal_graphs:
- graph_id: tssjlm_membrane_core_assembly
  title: TssJ, TssL and TssM assemble the T6SS membrane core
  description: The TssJ lipoprotein and the TssL/TssM inner-membrane proteins assemble
    an envelope-spanning membrane complex that anchors the T6SS baseplate.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: This graph covers TssJLM membrane-core assembly and baseplate docking.
    It leaves baseplate, Hcp tube, sheath and spike biogenesis to sibling records.
