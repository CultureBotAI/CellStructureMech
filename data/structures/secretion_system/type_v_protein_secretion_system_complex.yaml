identifier: GO:0098046
label: type V protein secretion system complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex of proteins that permits the translocation of proteins across
  the outer membrane via a transmembrane pore, formed by a beta-barrel, into the extracellular
  milieu or directly into host cells; the secreted proteins contain all the information
  required for translocation of an effector molecule through the cell envelope. The
  type V secretion systems includes the autotransporters (type Va), the two-partner
  secretion system (type Vb) and the Oca family (type Vc).
