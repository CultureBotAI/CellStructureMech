identifier: GO:0031522
label: cell envelope Sec protein transport complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A transmembrane protein complex involved in the translocation of proteins
  across the cytoplasmic membrane. In Gram-negative bacteria, Sec-translocated proteins
  are subsequently secreted via the type II, IV, or V secretion systems. Sec complex
  components include SecA, D, E, F, G, Y and YajC. The bacterial and archaeal cell
  envelope general secretory (Sec) holotranslocon machinery that mediates co-translational
  insertion of inner membrane proteins and post-translational translocation of unfolded
  preproteins across the cytoplasmic membrane. Centered on the heterotrimeric SecYEG
  protein-conducting channel, the cell envelope Sec protein transport complex associates
  with the cytoplasmic SecA ATPase motor, the SecDF-YajC proton-motive-force-driven
  accessory complex, and the YidC membrane insertase.
