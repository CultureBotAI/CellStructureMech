  title: Cell envelope Sec protein transport complex translocation and membrane insertion
  description: Unfolded preproteins delivered by SecB to the SecA ATPase or nascent
    chains targeted by SRP engage the cell envelope Sec protein transport complex
    (SecYEG–SecDF–YajC–YidC) for ATP- and PMF-driven export across or insertion into
    the cytoplasmic membrane.
