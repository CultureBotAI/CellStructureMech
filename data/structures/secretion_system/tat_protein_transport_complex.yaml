components:
- component_id: tata_family_translocation_component
  label: TatA-family translocation component
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tatA
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: TatA-family transport-site proteins are represented by multiple
    TatA-like families and paralogs across bacteria and bacteria-derived organelles;
    no exact source-neutral family CURIE was curated.
  role: Oligomeric membrane component recruited by substrate-bound receptor complexes
    to form the active Tat transport site.
  evidence:
  - reference: DOI:10.1038/s41564-026-02399-z
    notes: Deme et al. 2026 structurally resolved early Escherichia coli TatABC states
      containing TatA bound to substrate-loaded TatBC.
  - reference: DOI:10.1021/bi500169s
    notes: Behrendt and Bruser 2014 characterized the transition from E. coli TatBC
      receptor complexes to substrate-bound TatABC complexes.
- component_id: tatc_family_receptor_component
  label: TatC-family receptor component
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tatC
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: TatC-family receptors occur in bacterial TatABC and minimal TatAC
    translocases, but this component represents the TatC partner of the three-component
    TatABC complex; no exact source-neutral family CURIE was curated.
  role: Core membrane receptor component that recognizes twin-arginine signal peptides
    and nucleates substrate-bound Tat translocase assembly.
  evidence:
  - reference: DOI:10.1038/s41564-026-02399-z
    notes: Deme et al. 2026 resolved the TatC contacts that recognize the twin-arginine
      targeting sequence in bacterial TatBC and TatABC core complexes.
- component_id: tatb_family_receptor_component
  label: TatB-family receptor component
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tatB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: TatB is the receptor partner of TatC in three-component bacterial
    TatABC systems; minimal Gram-positive TatAC systems without a separate TatB are
    outside this GO:0033281 record boundary.
  role: Receptor subunit in three-component Tat systems that cooperates with TatC
    to bind signal peptides before TatA recruitment.
  evidence:
  - reference: DOI:10.1038/s41564-026-02399-z
    notes: Deme et al. 2026 resolved E. coli TatBC receptor and TatABC complexes in
      resting and substrate-bound states.
  - reference: DOI:10.1021/bi500169s
    notes: Behrendt and Bruser 2014 biochemically characterized the E. coli TatBC
      complex and its substrate-triggered shift toward TatABC.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Three-component TatABC protein-transport complexes occur in many bacteria,
    but Tat systems are absent from some bacteria and simplified to two-component
    TatAC machines in some Gram-positive lineages.
  reference: DOI:10.1038/nrmicro2814
canonical_examples:
