  title: TatBC recognizes folded cargo and recruits TatA
  description: In three-component bacterial Tat systems, TatB and TatC form a membrane
    receptor that recognizes a folded substrate's twin-arginine signal peptide, recruits
    TatA-family protomers, and forms a proton-motive-force dependent transport site.
