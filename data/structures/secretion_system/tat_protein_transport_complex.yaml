identifier: GO:0033281
label: TAT protein transport complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex of three proteins integral to the cytoplasmic membrane of bacteria
  and membranes of organelles derived from bacteria (chloroplasts and mitochondria)
  involved in membrane transport of folded proteins.
definition_source: GO:0033281
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-06T20:18:45Z'
  curator: claude
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-06T20:20:25Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added Tat translocase synonymy, protein-complex parentage, TatA, TatB,
    and TatC components, bacterial and archaeal taxonomic scope, Escherichia coli
    and Bacillus subtilis canonical examples, GO:0043953 protein transport function
    grounding, record evidence, and a TatBC-TatA substrate-recognition graph.
  llm_assisted: true
- timestamp: '2026-09-06T20:22:01Z'
  curator: claude
  action: REVIEW_FIX
  changes: 'Resolved issue #216 by scoping the GO:0033281 record to three-component
    TatABC systems, making TatB essential in that boundary, removing Bacillus minimal
    TatAC and archaeal taxonomic assertions, and recording the TatAC boundary as a
    resolved discussion.'
  llm_assisted: true
synonyms:
- synonym_text: Tat translocase
  synonym_type: EXACT_SYNONYM
