functions:
- function_id: protein_transport_by_tat_complex
  label: protein transport by the Tat complex
  grounding: GO:0043953
  description: The Tat complex moves folded twin-arginine-signal-bearing substrates
    across an energized cytoplasmic membrane.
  evidence:
  - reference: GO:0043953
    notes: GO:0043953 defines folded-protein transport across bacterial cytoplasmic
      membranes or membranes of bacteria-derived organelles by the TAT complex.
  - reference: DOI:10.1038/nrmicro2814
    notes: Palmer and Berks 2012 review the bacterial Tat pathway as an export route
      for folded proteins.
evidence:
