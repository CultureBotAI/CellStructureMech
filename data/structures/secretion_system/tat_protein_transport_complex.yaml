  edges:
  - subject: tatc_receptor
    predicate: binds targeting motif on
    object: folded_twin_arginine_substrate
    description: TatC makes specific contacts with the substrate's conserved twin-arginine
      targeting residues in the Tat signal peptide.
    evidence:
    - reference: DOI:10.1038/s41564-026-02399-z
      notes: Deme et al. 2026 structurally mapped the bacterial TatC contacts with
        Tat signal-peptide targeting sequences.
  - subject: tatb_receptor
    predicate: clamps
    object: folded_twin_arginine_substrate
    description: TatB clamps the signal-peptide body as the substrate engages the
      three-component TatBC receptor.
    evidence:
    - reference: DOI:10.1038/s41564-026-02399-z
      notes: Deme et al. 2026 resolved TatB positions around Tat-bound signal peptides
        in substrate-loaded E. coli Tat core complexes.
  - subject: tatc_receptor
    predicate: assembles with
    object: tatb_receptor
    description: TatB and TatC assemble as the receptor module of the three-component
      bacterial Tat translocase.
    evidence:
    - reference: DOI:10.1021/bi500169s
      notes: Behrendt and Bruser 2014 characterized the E. coli TatBC complex and
        its conversion toward a substrate-bound TatABC assembly.
  - subject: folded_twin_arginine_substrate
    predicate: triggers recruitment of
    object: tata_translocation_component
    description: Substrate binding to TatBC promotes recruitment of TatA-family protomers
      to the receptor complex.
    evidence:
    - reference: DOI:10.1038/s41564-026-02399-z
      notes: Deme et al. 2026 captured early substrate-bound TatABC states and model
        TatA recruitment after substrate binding.
  - subject: tata_translocation_component
    predicate: completes
    object: tat_complex
    description: TatA-family protomers complete the active transport site after cargo-loaded
      receptor complexes have formed.
    evidence:
    - reference: DOI:10.1007/s10930-019-09859-y
      notes: Frain et al. 2019 review the TatA assembly step that follows cargo recognition
        by the Tat receptor.
  - subject: proton_motive_force
    predicate: powers
    object: tat_transport
    description: The energized membrane drives Tat-dependent transport of folded proteins
      across the cytoplasmic membrane.
    evidence:
    - reference: DOI:10.1038/nrmicro2814
      notes: Palmer and Berks 2012 review energy coupling and folded protein movement
        by the bacterial Tat pathway.
  - subject: tat_complex
    predicate: carries out
    object: tat_transport
    description: The TAT protein transport complex carries out folded-protein transport
      through the Tat pathway.
    evidence:
    - reference: GO:0043953
      notes: GO:0043953 defines protein transport by the Tat complex as folded-protein
        movement across the relevant membrane by the TAT complex.
discussions:
- discussion_id: minimal_tatac_out_of_scope
  prompt: Do two-component Gram-positive TatAC translocases belong in this GO:0033281
    TAT protein transport complex record?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#tatb_family_receptor_component
  - taxonomic_distribution#NCBITaxon:2
  rationale: Bacillus subtilis TatAdCd and TatAyCy are named, minimal two-component
    translocases whose bifunctional TatA-family proteins fill the receptor role handled
    by TatB in E. coli-like TatABC complexes.
  resolution_note: 'Declined: GO:0033281 is defined as a three-protein TAT protein
    transport complex, so this record keeps a TatABC/TatBC receptor boundary. Two-component
    Bacillus TatAC translocases and archaeal Tat variants need their own exact identity
    check before curation.'
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2004.04341.x
    supports: SUPPORT
    notes: Jongbloed et al. 2004 identified two minimal Tat translocases in Bacillus.
  - reference: DOI:10.1016/j.bbamcr.2013.10.008
    supports: SUPPORT
    notes: Goosens et al. 2014 review Gram-positive Tat systems that lack a separate
      TatB component.
  posed_by: claude
  posed_date: '2026-09-06'
  resolved_date: '2026-09-06'
