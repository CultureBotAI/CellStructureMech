identifier: cellstructuremech:type_vi_secretion_system_baseplate
label: type VI secretion system baseplate
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial type VI secretion system subassembly in which TssE-, TssF-,
  TssG-, and TssK-family proteins form a phage-baseplate-like platform that docks
  to the TssJ/TssL/TssM membrane complex and initiates Hcp tube and contractile-sheath
  assembly.
definition_source: DOI:10.1371/journal.pgen.1005545
mapping_status: PROPOSED
