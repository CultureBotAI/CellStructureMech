components:
- component_id: tss_e_baseplate_protein
  label: TssE baseplate protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tssE
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The baseplate TssE constituent is homologous to phage baseplate
    proteins in T6SS-bearing bacteria; no exact source-neutral TssE family CURIE was
    curated.
  role: Phage-baseplate-like constituent of the TssEFGK-VgrG assembly.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1005545
    notes: Brunet et al. 2015 included TssE in the T6SS TssEFGK-VgrG phage-like baseplate
      complex.
- component_id: tss_f_baseplate_protein
  label: TssF baseplate protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tssF
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral protein-family CURIE was curated for TssF
    as a T6SS baseplate subunit.
  role: Baseplate wedge constituent that partners with TssG, TssE, TssK and VgrG in
    the cytoplasmic baseplate.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1005545
    notes: Brunet et al. 2015 reconstituted TssF contacts in the TssEFGK-VgrG baseplate
      complex.
- component_id: tss_g_baseplate_protein
  label: TssG baseplate protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tssG
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral protein-family CURIE was curated for TssG
    as a T6SS baseplate subunit.
  role: Baseplate wedge constituent that associates with TssF and helps form the phage-like
    baseplate.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1005545
    notes: Brunet et al. 2015 placed TssG in the TssEFGK-VgrG baseplate complex.
- component_id: tss_k_baseplate_protein
  label: TssK baseplate protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - tssK
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral protein-family CURIE was curated for TssK
    as the baseplate-to-membrane-complex connector.
  role: Baseplate constituent that links the cytoplasmic phage-like baseplate to the
    TssJ/TssL/TssM membrane complex.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1005545
    notes: Brunet et al. 2015 proposed that TssK makes several contacts between the
      TssEFGK-VgrG baseplate and the TssJLM membrane complex.
- component_id: vgrg_spike_hub
  label: VgrG spike hub
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - vgrG
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: VgrG proteins form T6SS spike trimers and interface with the baseplate;
    no exact source-neutral CURIE was curated for the baseplate-localized VgrG constituent.
  role: Central spike protein that connects the baseplate with the Hcp tube and the
    PAAR sharpened tip.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1005545
    notes: Brunet et al. 2015 included VgrG in the TssEFGK-VgrG baseplate model.
  - reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
    notes: Cherrak et al. 2019 review the VgrG/PAAR spike as the cap at the distal
      end of the Hcp tube.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: The T6SS baseplate is a module of bacterial type VI secretion systems, which
    occur patchily across Gram-negative lineages.
  reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
canonical_examples:
- taxon_id: NCBITaxon:666
  taxon_label: Vibrio cholerae
  note: Cryo-EM reference species in which the baseplate was imaged at the distal
    end of type VI secretion sheath-tube assemblies.
  reference: DOI:10.15252/embj.201797103
functions:
- function_id: t6ss_sheath_tube_assembly_platform
  label: T6SS sheath-tube assembly platform
  description: The type VI secretion baseplate docks to the membrane complex and initiates
    polymerization of the Hcp tube and its surrounding contractile sheath.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1005545
    notes: Brunet et al. 2015 proposed that the baseplate is recruited to TssJLM and
      serves as a platform for tail tube and sheath assembly.
  - reference: DOI:10.15252/embj.201797103
    notes: Nazarov et al. 2018 imaged baseplates at the ends of Vibrio cholerae sheath-tube
      assemblies.
evidence:
- reference: DOI:10.1371/journal.pgen.1005545
  notes: Brunet et al. 2015, The Type VI secretion TssEFGK-VgrG phage-like baseplate
    is recruited to the TssJLM membrane complex via multiple contacts and serves as
    assembly platform for tail tube and sheath polymerization, PLoS Genetics.
- reference: DOI:10.15252/embj.201797103
  notes: Nazarov et al. 2018, Cryo-EM reconstruction of Type VI secretion system baseplate
    and sheath distal end, EMBO Journal.
- reference: DOI:10.1128/microbiolspec.PSIB-0031-2019
  notes: Cherrak et al. 2019, Structure and Activity of the Type VI Secretion System,
    Microbiology Spectrum.
causal_graphs:
- graph_id: baseplate_recruits_and_primes_t6ss_tail
  title: The T6SS baseplate anchors and primes sheath-tube growth
  description: TssE, TssF, TssG, TssK and VgrG form a phage-like baseplate that docks
    onto the TssJ/TssL/TssM membrane complex. The docked baseplate then starts Hcp
    tube polymerization and contractile-sheath extension.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: This graph is restricted to baseplate assembly and its role in nucleating
    the T6SS sheath-tube. It does not model effector loading, sheath contraction or
    ClpV-mediated sheath recycling.
