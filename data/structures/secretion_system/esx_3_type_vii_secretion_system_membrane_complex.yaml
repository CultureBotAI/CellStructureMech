definition: A Mycobacterium smegmatis ESX-3 type VII secretion inner-membrane core
  complex in which EccB3, EccC3, EccD3, and EccE3 assemble into a dimeric membrane-embedded
  secretion machine.
definition_source: DOI:10.1038/s41586-019-1633-1
