    EccD-like, or YukD-like domains rather than an exact ESX-3-specific EccD3 family.
  role: Multi-pass inner-membrane constituent present as two copies per ESX-3 protomer
    and providing much of the transmembrane core.
  evidence:
  - reference: DOI:10.1038/s41586-019-1633-1
