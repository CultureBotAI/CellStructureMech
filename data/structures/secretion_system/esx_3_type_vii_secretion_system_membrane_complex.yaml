  - eccC3
  stoichiometry: '2'
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: UniProtKB:A0QQ40 identifies the reviewed Mycolicibacterium smegmatis
    MC2 155 EccC3 protein, but its verified InterPro and Pfam mappings cover broader
    FtsK/SpoIIIE ATPase signatures rather than an exact ESX-3-specific EccC3 family.
  role: Type VII secretion ATPase constituent whose membrane-proximal segment is present
    in each ESX-3 protomer and links the core to cytosolic ATPase domains.
  evidence:
  - reference: DOI:10.1038/s41586-019-1633-1
    notes: Famelis et al. 2019 modeled EccC3 as an ESX-3 core component whose stalk
      connects the membrane core with flexible ATPase domains.
  - reference: DOI:10.7554/eLife.52983
    notes: Poweleit et al. 2019 resolved endogenous M. smegmatis ESX-3 protomers containing
      one EccC3 copy apiece.
