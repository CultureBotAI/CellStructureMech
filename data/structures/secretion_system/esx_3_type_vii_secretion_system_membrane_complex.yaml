functions:
- function_id: protein_secretion_by_type_vii_secretion_system
  label: protein secretion by the type VII secretion system
  grounding: GO:0044315
  description: The ESX-3 membrane complex is the membrane-embedded core of a mycobacterial
    type VII secretion pathway.
  evidence:
  - reference: DOI:10.1038/s41586-019-1633-1
    notes: Famelis et al. 2019 describe ESX-3 as a type VII secretion system that
      exports proteins in mycobacteria.
  - reference: DOI:10.7554/eLife.52983
    notes: Poweleit et al. 2019 studied the endogenous ESX-3 secretion system and
      modeled its membrane-embedded core.
evidence:
- reference: DOI:10.1038/s41586-019-1633-1
  notes: Famelis, Rivera-Calzada, Degliesposti et al. 2019, Architecture of the mycobacterial
    type VII secretion system, Nature.
- reference: DOI:10.7554/eLife.52983
  notes: Poweleit, Czudnochowski, Nakagawa et al. 2019, The structure of the endogenous
    ESX-3 secretion system, eLife.
- reference: PDB:6SGW
  notes: RCSB PDB entry 6SGW is a 3.8 A electron-microscopy model of the recombinant
    Mycobacterium smegmatis ESX-3 core complex associated with EMDB map EMD-10186.
causal_graphs:
- graph_id: esx3_membrane_core_architecture
  title: EccB3/EccC3/EccD3/EccE3 build the ESX-3 core
  description: EccB3, EccC3, EccD3, and EccE3 form a membrane-embedded ESX-3 core
    in which two 1:1:2:1 protomers dimerize to produce the solved secretion-system
    complex.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: This graph is restricted to ESX-3 core-complex architecture; it does
    not model ESX substrate recognition, iron or zinc uptake physiology, or the distinct
    ESX-5 membrane complex.
