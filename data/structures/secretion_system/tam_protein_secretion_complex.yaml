- discussion_id: tam_autotransporter_function_boundary
  prompt: Curate a TAM function row only after deciding whether the record should
    use a narrow autotransporter biogenesis wording or a broader adhesin-protein secretion
    wording.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO:0097347 labels TAM as a protein secretion complex, while the definition
    paper discovered it through efficient secretion of autotransporter adhesins; the
    first record therefore avoids overclaiming a generic type V secretion function.
  evidence:
  - reference: GO:0097347
    supports: SUPPORT
    notes: GO:0097347 defines TAM as enabling adhesin-protein secretion in Gram-negative
      bacteria.
  - reference: PMID:22466966
    supports: SUPPORT
    notes: The PubMed/Europe PMC abstract for Selkrig et al. 2012 reports that TAM
      promotes efficient autotransporter secretion in proteobacteria.
  posed_by: codex
  posed_date: '2026-09-29'
