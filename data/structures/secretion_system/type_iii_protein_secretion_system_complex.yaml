  edges:
  - subject: inner_rings
    predicate: align
    object: export_apparatus
    description: The inner-membrane rings organize the basal body around the membrane
      export apparatus.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.20
      notes: Deng et al. 2017 review the export apparatus within the inner rings of
        the injectisome basal body.
  - subject: secretin
    predicate: extends
    object: translocation_conduit
    description: The secretin ring supplies the outer-membrane channel of the basal
      body.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.20
      notes: Deng et al. 2017 describe the outer-membrane secretin as part of the
        envelope-spanning basal body.
  - subject: export_apparatus
    predicate: exports
    object: unfolded_effectors
    description: The export apparatus gates type III substrates and exports them in
      an unfolded state.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.01.034
      notes: Galan and Waksman 2018 describe unfolded substrates passing through the
        type III needle conduit.
  - subject: needle
    predicate: extends
    object: translocation_conduit
    description: The helical needle filament forms the narrow channel that carries
      unfolded effectors beyond the bacterial surface.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.01.034
      notes: Galan and Waksman 2018 report a helical needle filament enclosing an
        inner channel that conducts unfolded substrates.
  - subject: translocon
    predicate: completes
    object: translocation_conduit
    description: Translocon proteins insert in the host membrane and connect the injectisome
      channel to the host cytosol.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.20
      notes: Deng et al. 2017 review translocon insertion into the host membrane during
        one-step effector translocation.
  - subject: translocation_conduit
    predicate: delivers
    object: t3ss_secretion
    description: The assembled conduit exports effector proteins directly from the
      bacterial cytoplasm into the eukaryotic host cell.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.20
      notes: Deng et al. 2017 review injectisome-mediated one-step effector delivery
        from bacteria into host cells.
