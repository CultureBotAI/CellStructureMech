functions:
- function_id: t3ss_secretion
  label: protein secretion by the type III secretion system
  grounding: GO:0030254
  description: Effectors are exported unfolded through a continuous channel from cytoplasm
    to host cytosol.
  evidence:
  - reference: DOI:10.1038/nrmicro.2017.20
    notes: Deng et al. 2017 review one-step effector translocation into host cells.
evidence:
- reference: DOI:10.1038/nrmicro.2017.20
  notes: Deng W et al. 2017, 'Assembly, structure, function and regulation of type
    III secretion systems', Nature Reviews Microbiology.
