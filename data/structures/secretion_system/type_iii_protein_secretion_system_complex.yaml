discussions:
- discussion_id: flagellum_homology
  prompt: Model the shared ancestry of the injectisome export apparatus and the flagellar
    fT3SS explicitly.
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - components#export_apparatus
  rationale: 'The two export apparatuses are homologous and the schema has no relation
    for ''evolutionarily related to''. GO:0009288 is recorded as an xref for now,
    which understates the relationship: an xref means equivalence elsewhere, not shared
    ancestry.'
