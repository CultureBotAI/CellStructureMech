identifier: GO:0030257
label: type III protein secretion system complex
definition: 'The injectisome: a syringe-like envelope-spanning machine that delivers
  effector proteins from the bacterial cytoplasm directly into a eukaryotic host cell.
  Rings in the inner and outer membranes surround an export apparatus; an extracellular
  needle carries the secretion channel to a translocon pore in the host membrane.
  It is evolutionarily related to the flagellar export apparatus.'
definition_source: GO:0030257
synonyms:
- synonym_text: injectisome
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/nrmicro.2017.20
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
components:
- component_id: secretin
  label: outer-membrane secretin ring
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - invG
  - yscC
  - escC
  essentiality: ESSENTIAL
  role: Oligomeric ring forming the channel through the outer membrane.
  evidence:
  - reference: DOI:10.1038/nrmicro.2017.20
    notes: Deng et al. 2017 describe the secretin ring spanning the outer membrane
      in the basal body.
- component_id: inner_rings
  label: inner-membrane rings (PrgH/PrgK family)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - prgH
  - prgK
  - escJ
  essentiality: ESSENTIAL
  role: Concentric rings anchoring the basal body in the inner membrane and peptidoglycan.
  evidence:
  - reference: DOI:10.1038/nrmicro.2017.20
    notes: Deng et al. 2017 describe the inner-membrane rings of the basal body.
- component_id: export_apparatus
  label: export apparatus (SctR/S/T/U/V)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - spaP
  - spaQ
  - spaR
  - spaS
  - invA
  essentiality: ESSENTIAL
  role: Membrane export gate that selects and unfolds substrates; homologous to the
    flagellar fT3SS.
  evidence:
  - reference: DOI:10.1038/nrmicro.2017.20
    notes: Deng et al. 2017 describe the export apparatus and its homology with the
      flagellar system.
  - reference: DOI:10.1016/j.cell.2018.01.034
    notes: Galan & Waksman 2018 describe the needle conduit and the export apparatus
      shared with the flagellar system.
- component_id: needle
  label: needle filament
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - prgI
  - yscF
  - escF
  essentiality: ESSENTIAL
  role: Helical polymer of a single small subunit with a ~2.5 nm channel through which
    unfolded effectors pass.
  evidence:
  - reference: DOI:10.1038/nrmicro.2017.20
    notes: Deng et al. 2017 describe the needle as a helical polymer with a narrow
      central channel.
  - reference: DOI:10.1016/j.cell.2018.01.034
    notes: Galan & Waksman 2018 describe the needle conduit and the export apparatus
      shared with the flagellar system.
- component_id: translocon
  label: translocon pore (SctE/SctB)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - sipB
  - sipC
  - yopB
  - yopD
  essentiality: CONDITIONAL
  role: Inserts into the host membrane to complete the conduit; dispensable for secretion
    in vitro, required for translocation.
  evidence:
  - reference: DOI:10.1038/nrmicro.2017.20
    notes: Deng et al. 2017 describe translocon insertion into the host membrane.
taxonomic_distribution:
- taxon_id: NCBITaxon:1236
  taxon_label: Gammaproteobacteria
  presence: VARIABLE
  note: Common in host-associated lineages (Salmonella, Yersinia, Shigella, EPEC);
    absent from most free-living relatives.
  reference: DOI:10.1038/nrmicro.2017.20
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  reference: DOI:10.1038/nrmicro.2017.20
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: SPI-1 injectisome; the structural reference system.
  reference: DOI:10.1038/nrmicro.2017.20
functions:
- function_id: t3ss_secretion
  label: protein secretion by the type III secretion system
  grounding: GO:0030254
  description: Effectors are exported unfolded through a continuous channel from cytoplasm
    to host cytosol.
  evidence:
  - reference: DOI:10.1038/nrmicro.2017.20
    notes: Deng et al. 2017 review one-step effector translocation into host cells.
evidence:
- reference: DOI:10.1038/nrmicro.2017.20
  notes: Deng W et al. 2017, 'Assembly, structure, function and regulation of type
    III secretion systems', Nature Reviews Microbiology.
- reference: DOI:10.1016/j.cell.2018.01.034
  notes: Galan JE & Waksman G 2018, 'Protein-Injection Machines in Bacteria', Cell
    — independent review covering the injectisome alongside the other injection systems.
