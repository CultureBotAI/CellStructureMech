identifier: cellstructuremech:holo_translocon_secyeg_secdf_yajc_yidc_complex
label: Holo-translocon SecYEG-SecDF-YajC-YidC complex
structure_category: SECRETION_SYSTEM
structure_kind: MULTIPROTEIN_COMPLEX
definition: An Escherichia coli Sec-pathway plasma-membrane holo-translocon complex
  in which SecY, SecE, SecG, SecD, SecF, YajC, and YidC assemble as a heteroheptamer
  that supports protein secretion and membrane-protein insertion.
