  edges:
  - subject: secyeg_core
    predicate: forms pore and lateral gate of
    object: holotranslocon
    description: The SecYEG core supplies the central pore and lateral gate within
      the E. coli holo-translocon.
    evidence:
    - reference: ComplexPortal:CPX-1095
      notes: Complex Portal describes SecYEG as the central pore and lateral gate
        of CPX-1095.
  - subject: secdf_yajc_module
    predicate: assembles with
    object: secyeg_core
    description: SecDF-YajC is present with SecYEG in the SecYEG-SecDF-YajC-YidC holo-translocon
      boundary.
    evidence:
    - reference: ComplexPortal:CPX-1095
      notes: CPX-1095 curates SecD, SecF, YajC, SecY, SecE, and SecG as participants
        in one source complex.
    - reference: PMID:27435098
      notes: Komar et al. 2016 identify the bacterial holo-translocon as a SecYEG-SecDF-YajC-YidC
        supercomplex.
  - subject: yidc_insertase
    predicate: assembles with
    object: holotranslocon
    description: YidC is a protein participant in the E. coli SecYEG-SecDF-YajC-YidC
      holo-translocon.
    evidence:
    - reference: ComplexPortal:CPX-1095
      notes: CPX-1095 curates P25714/YidC as a one-copy participant in the E. coli
        K-12 complex.
  - subject: proton_motive_force
    predicate: assists
    object: secdf_yajc_module
    description: The SecDF portion of the holo-translocon stimulates SecYEG-mediated
      protein translocation with assistance from proton-motive force.
    evidence:
    - reference: ComplexPortal:CPX-1095
      notes: Complex Portal describes SecDF as stimulating protein translocation through
        SecYEG with proton-motive-force assistance.
  - subject: yidc_insertase
    predicate: facilitates insertion into
    object: inner_membrane_lipid_bilayer
    description: YidC facilitates movement of membrane-protein segments from the SecY
      lateral gate into the lipid bilayer and their folding or assembly in the inner
      membrane.
    evidence:
    - reference: ComplexPortal:CPX-1095
      notes: CPX-1095 describes YidC facilitating passage from the SecY lateral gate
        into the bilayer and then folding or assembly of inner-membrane proteins.
    - reference: PMID:27924919
      notes: Botte et al. 2016 resolved a central cavity in the SecYEG-SecDF-YidC
        holo-translocon model that informs membrane-protein insertion.
  - subject: holotranslocon
    predicate: enables
    object: sec_transport
    description: The assembled SecYEG-SecDF-YajC-YidC holo-translocon supports Sec-pathway
      protein transport.
    evidence:
