causal_graphs:
- graph_id: htl_sec_transport_and_membrane_insertion
  title: Sec holo-translocon couples transport and insertion
  description: SecYEG, SecDF-YajC, and YidC assemble as the bacterial holo-translocon,
    where the SecYEG core supplies the pore and lateral gate, SecDF supports proton-motive-force
    assisted translocation, and YidC cooperates with the lateral gate for membrane-protein
    insertion.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records CPX-1095 subcomplex boundaries and whole-complex
    activities without specifying the SecA ATPase cycle or cotranslational versus
    post-translational substrate handoff state.
  nodes:
