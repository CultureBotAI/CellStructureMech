      notes: Complex Portal cross-references GO:0043952 on the E. coli K-12 holo-translocon.
  - subject: holotranslocon
    predicate: enables
    object: membrane_insertase_activity
    description: The YidC-containing holo-translocon supports membrane-protein insertion
      in the inner membrane.
    evidence:
