- discussion_id: exclude_seca_from_holotranslocon_boundary
  prompt: Should SecA be modeled as a constituent of the SecYEG-SecDF-YajC-YidC holo-translocon?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#secy_channel_subunit
  - causal_graphs#htl_sec_transport_and_membrane_insertion
  rationale: SecA drives post-translational substrates through Sec-family channels,
    but CPX-1095 scopes the holo-translocon itself to SecYEG, SecDF-YajC, and YidC.
  evidence:
  - reference: ComplexPortal:CPX-1095
    notes: CPX-1095 lists SecY, SecE, SecG, SecD, SecF, YajC, and YidC as participants
      and does not include SecA as a complex participant.
  posed_by: codex
  posed_date: '2026-10-02'
  resolution_note: Keep SecA outside the curated holo-translocon component boundary
    and mention it only in future substrate-handoff graphs when evidence requires
    it.
