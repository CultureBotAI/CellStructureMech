  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    snippet: The filaments were approximately 40–160 nm long and approximately 5 nm
      in diameter, consistent with the dimensions of single FtsZ protofilaments based
      on previous calculations and in vitro EM studies ( 93 , 183 ).
    notes: Verbatim from the open-access full text (PMC8610174).
  - reference: DOI:10.1038/sj.emboj.7601895
    notes: Results describe predominantly40-120nm filaments, longest about160nm, in
      the NA1000 pseudo-time course; initial predivisional reconstructions give80-160nm.
      Overexpressed FtsZG109S filaments can be much longer.
- property: DIAMETER
  value: ~5
  unit: UO:0000018
  context: individual arc-like FtsZ protofilaments in Caulobacter crescentus, by cryo-electron
    tomography; not whole-ring diameter
  reference: DOI:10.1146/annurev-biophys-121219-081703
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    snippet: The filaments were approximately 40–160 nm long and approximately 5 nm
      in diameter, consistent with the dimensions of single FtsZ protofilaments based
      on previous calculations and in vitro EM studies ( 93 , 183 ).
    notes: Verbatim; the same sentence gives filament length and diameter.
  - reference: DOI:10.1038/sj.emboj.7601895
    notes: Results report approximately5nm diameter for arc-like filaments. Cryo-ECT
