- property: TRANSLOCATION_SPEED
  value: 25-30 nm/s
  context: apparent directional movement of FtsZ clusters at midcell in E. coli and
    B. subtilis
  reference: DOI:10.1146/annurev-biophys-121219-081703
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    snippet: In both E. coli and B. subtilis , it was also discovered that FtsZ clusters
      in the Z-ring exhibited apparent directional movement with a speed of approximately
      25–30 nm/s at midcell ( 20 , 239 ) ( Figure 5d ).
    notes: Verbatim from PMC8610174. The rate is carried in `value` because UO has
      no nanometre-per-second term, and tagging a speed with UO:0000018 (nanometer)
      would state the wrong dimension.
- property: OTHER
  value: ~16
  unit: UO:0000018
  context: peak-to-peak separation of inner-membrane and FtsZ density at a constriction
    in a Caulobacter crescentus cell overexpressing FtsZG109S, by cryo-electron tomography;
    not Z-ring radial thickness
  reference: DOI:10.1038/sj.emboj.7601895
  evidence:
  - reference: DOI:10.1038/sj.emboj.7601895
    notes: 'Results, Figure6 caption and Methods: a density profile through a constricted
      region of an FtsZG109S-overexpressing cell has an FtsZ peak16nm inside the inner-membrane
      peak; an unconstricted NA1000 region is the negative control. This is an experiment-specific
      spacing, not a universal physiological value.'
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    notes: The review instead summarizes approximately13nm beneath the membrane. The
      inspected texts do not explain the13-versus16nm difference. The maintained value
      follows the explicitly defined primary peak-to-peak experiment; the review discrepancy
      remains unresolved, not silently reconciled.
