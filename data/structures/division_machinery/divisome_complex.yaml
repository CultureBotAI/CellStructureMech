discussions:
- discussion_id: ring_dimensions_unsourced
  prompt: Which organism- and method-specific measurements describe FtsZ filament
    dimensions, membrane spacing and Z-ring radial thickness? The cited review gives
    E. coli fluorescence-based radial estimates and discusses disagreement with cryo-electron
    tomography; these are not a universal ring thickness. The separate C. crescentus
    membrane-spacing property now identifies its primary experiment and retains the
    review/primary discrepancy.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#ftsz
  rationale: A first pass added filament length and ring thickness attributed to McQuillen
    & Xiao 2020 without reading it; both were removed (#91). Super-resolution measurements
    of the ring are exactly the kind of figure that varies by method and organism,
    so they need the paper, not a recollection.
  posed_by: claude
  posed_date: '2026-08-31'
  notes: 'Narrowed 2026-09-03 after #65: FtsZ protofilament length (40-160 nm) and
    diameter (~5 nm) now carry verbatim snippets, so only the Z-ring''s radial thickness
    remains. The ~13 nm THICKNESS property on this record is the filament-to-membrane
    spacing at the constriction site, a different quantity, as its evidence notes
    state. Resolution in the current review supersedes the historical prompt that
    the review gives no radial-thickness figure. Original rationale and posed_date
    are preserved; membrane spacing and ring radial thickness remain distinct.'
  resolved_date: '2026-10-12'
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    notes: Z-ring structure and microscopy comparison sections give radial estimates
      and methodological qualifications.
  - reference: DOI:10.1038/sj.emboj.7601895
    notes: Figure6 density-profile spacing is a different quantity from ring radial
      thickness.
  resolution_note: 'The original no-number premise is corrected: McQuillen and Xiao2020
    report approximately40-60nm radial thickness from E. coli single-molecule localization
    studies and discuss their disagreement with single-layer cryo-ECT observations.
    No method-independent radial thickness is asserted. Filament dimensions now name
    C. crescentus and cryo-ECT; the separate membrane-spacing property uses the primary16nm
    peak-to-peak experiment and explicitly retains the unresolved13nm review discrepancy.'
