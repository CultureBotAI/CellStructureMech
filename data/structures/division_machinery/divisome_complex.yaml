- component_id: septal_pg_synthase
  label: septal peptidoglycan synthase (FtsW-FtsI)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - ftsW
  - ftsI
  essentiality: ESSENTIAL
  role: Builds the septal cell wall. In the E. coli two-track model, fast FtsZ-dependent
    movement distributes synthesis-inactive molecules, whereas slow processive movement
    is coupled to active peptidoglycan synthesis and is independent of FtsZ treadmilling
    speed.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    notes: McQuillen & Xiao 2020 review FtsW-FtsI septal synthesis and its coupling
      to FtsZ dynamics.
  - reference: DOI:10.1111/j.1749-6632.2012.06818.x
    notes: Egan & Vollmer 2012 review the septal synthases and the membrane anchoring
      of FtsZ.
  - reference: DOI:10.1038/s41564-020-00853-0
    notes: 'Yang et al. 2021, Results and Discussion: single-molecule tracking and
      perturbations distinguish fast FtsZ-dependent and slow synthesis-dependent FtsW/FtsI
      populations in E. coli. Two-track interpretation is a model, not a universal
      rate law for all bacteria.'
