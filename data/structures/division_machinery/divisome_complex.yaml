  - sepF
  essentiality: ESSENTIAL
  role: Anchor FtsZ filaments to the inner membrane. The listed anchors are lineage-dependent
    alternatives or partners; ESSENTIAL describes the tethering function, not independent
    essentiality of every listed gene in every lineage.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
