evidence:
- reference: DOI:10.1146/annurev-biophys-121219-081703
  notes: McQuillen R & Xiao J 2020, 'Insights into the Structure, Function, and Dynamics
    of the Bacterial Cytokinetic FtsZ-Ring', Annual Review of Biophysics.
- reference: DOI:10.1111/j.1749-6632.2012.06818.x
  notes: Egan AJF & Vollmer W 2012, 'The physiology of bacterial cell division', Annals
    of the New York Academy of Sciences — independent review of divisome composition
    and septal synthesis.
- reference: DOI:10.1038/s41467-021-23099-8
  notes: 'Scope boundary: archaeal FtsZ/SepF division systems exist, including M.
    smithii with a pseudomurein wall. Shared FtsZ is not evidence for the bacterial
    FtsW-FtsI peptidoglycan inventory curated here. Removing the earlier Archaea occurrence
    row does not assert absence of archaeal divisomes.'
causal_graphs:
- graph_id: treadmilling_guides_septum
  title: FtsZ-dependent distribution and synthesis-dependent motion in the E. coli
    two-track model
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  nodes:
  - node_id: ftsz
    label: FtsZ filaments
    node_type: GENE_OR_PROTEIN
