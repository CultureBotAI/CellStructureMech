  - node_id: tether
    label: E. coli FtsA/ZipA membrane tethers
    node_type: GENE_OR_PROTEIN
    component_ref: membrane_tethers
    description: The E. coli subset of the cross-lineage membrane-tether component
      group; SepF is not asserted as an E. coli anchor.
  - node_id: ring
    label: FtsZ ring
    node_type: STRUCTURE
  - node_id: treadmilling
    label: FtsZ treadmilling
    node_type: BIOLOGICAL_PROCESS
  - node_id: synthase
    label: FtsW-FtsI septal synthase
    node_type: GENE_OR_PROTEIN
    component_ref: septal_pg_synthase
  - node_id: septum
    label: division septum assembly
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0000917
  - node_id: fast_population
    label: fast synthesis-inactive FtsW-FtsI population
    node_type: STATE
  - node_id: active_population
    label: slow synthesis-active FtsW-FtsI population
    node_type: STATE
  edges:
  - subject: tether
    predicate: anchors
    object: ftsz
    description: In E. coli, FtsA and ZipA anchor FtsZ filaments to the inner membrane.
      SepF belongs to other bacterial lineage examples in the component group, not
      the E. coli inventory of this graph.
    evidence:
    - reference: DOI:10.1146/annurev-biophys-121219-081703
      notes: 'McQuillen & Xiao 2020: FtsA and ZipA hold FtsZ filaments at the membrane.'
    - reference: DOI:10.1038/s41467-021-23099-8
      notes: Introduction describes lineage-dependent bacterial membrane anchors;
        FtsA, ZipA and SepF are not an obligatory universal three-protein set.
  - subject: ftsz
    predicate: assembles into
    object: ring
    description: Membrane-tethered FtsZ filaments polymerize into the cytokinetic
      Z ring at midcell.
    evidence:
    - reference: DOI:10.1146/annurev-biophys-121219-081703
      notes: McQuillen & Xiao 2020 describe filament assembly into the Z ring at midcell.
  - subject: ftsz
    predicate: undergoes
    object: treadmilling
    description: Membrane-associated FtsZ polymers undergo GTPase-dependent treadmilling
      within the ring.
    evidence:
    - reference: DOI:10.1146/annurev-biophys-121219-081703
      notes: Review of bacterial FtsZ dynamics; polymer turnover is distinct from
        bulk translocation of a fixed polymer.
  - subject: synthase
    predicate: has population
    object: fast_population
    description: E. coli septal FtsW/FtsI includes a fast-moving population whose
      movement depends on FtsZ treadmilling.
    evidence:
    - reference: DOI:10.1038/s41564-020-00853-0
      notes: Results distinguish fast and slow moving populations by tracking and
        perturbation.
  - subject: treadmilling
    predicate: drives movement of
    object: fast_population
    description: In the E. coli two-track model, FtsZ-dependent fast movement distributes
      synthesis-inactive synthases, rather than driving their active polymerization.
    evidence:
    - reference: DOI:10.1038/s41564-020-00853-0
      notes: Changing FtsZ GTPase activity changes the fast population; inhibiting
        peptidoglycan synthesis preferentially eliminates the slow population.
  - subject: synthase
    predicate: has population
    object: active_population
    description: A slow population moves processively during active septal peptidoglycan
      synthesis.
    evidence:
    - reference: DOI:10.1038/s41564-020-00853-0
      notes: Slow movement depends on active synthesis and not FtsZ treadmilling speed.
  - subject: fast_population
    predicate: can enter
    object: active_population
    description: The proposed two-track model places FtsN-promoted release from the
      FtsZ track into the synthesis-active population; this is the model interpretation,
      not a resolved molecular transition mechanism.
    evidence:
    - reference: DOI:10.1038/s41564-020-00853-0
      notes: Results show that FtsN promotes the slow active population; Discussion
        proposes the transition between tracks.
  - subject: active_population
    predicate: carries out
    object: septum
    description: The synthesis-active FtsW-FtsI population polymerizes and crosslinks
      septal peptidoglycan in the E. coli model.
    evidence:
    - reference: DOI:10.1038/s41564-020-00853-0
      notes: FtsW glycosyltransferase and FtsI transpeptidase perturbations tie the
        slow population to septal synthesis.
  description: 'E. coli model supported by single-molecule tracking and perturbations:
    fast, synthesis-inactive FtsW/FtsI follows treadmilling FtsZ, whereas slow movement
    accompanies active septal synthesis independently of FtsZ treadmilling speed.
    FtsN promotes the active population. This does not assert identical rate coupling
    in B. subtilis or all bacteria, or a fully resolved molecular coupling mechanism.'
