  - reference: DOI:10.1111/j.1749-6632.2012.06818.x
    notes: Egan & Vollmer 2012 review the septal synthases and the membrane anchoring
      of FtsZ.
  - reference: DOI:10.1038/s41467-021-23099-8
    notes: Introduction reviews lineage-dependent bacterial FtsZ anchors and overlapping
      FtsA/SepF functions. Its M. smithii experiments concern a distinct archaeal
      system, not occurrence of this bacterial peptidoglycan machine.
