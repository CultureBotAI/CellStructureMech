identifier: GO:1990586
label: divisome complex
definition: The membrane-associated protein machine that builds the peptidoglycan
  division septum in FtsZ-dependent bacterial cytokinesis. Membrane-tethered FtsZ
  filaments organize the division site and help distribute septal synthases; movement
  during active synthesis is not universally driven by FtsZ treadmilling.
definition_source: GO:1990586
synonyms:
- synonym_text: Z ring
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1146/annurev-biophys-121219-081703
structure_category: DIVISION_MACHINERY
structure_kind: MULTIPROTEIN_COMPLEX
components:
- component_id: ftsz
  label: FtsZ filaments
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ftsZ
  essentiality: ESSENTIAL
  role: Tubulin homologue whose GTP-dependent filaments form the Z ring and whose
    treadmilling helps distribute septal synthases; this does not make treadmilling
    the universal rate-setting motor of active synthesis.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    notes: McQuillen & Xiao 2020 review FtsZ filament treadmilling and its role in
      organising the ring.
  protein_examples:
  - uniprot_id: UniProtKB:P0A9A6
    protein_label: Cell division protein FtsZ
    gene_symbol: ftsZ
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-09-08'
    role: The single reviewed UniProtKB entry for gene ftsZ in Escherichia coli K-12,
      a taxon this record names. Identifier for the component's declared gene symbol;
      it is not itself evidence that the protein is part of this structure.
    evidence:
    - reference: PMID:1944597
      notes: Bi EF et al. 1991, ‘FtsZ ring structure associated with division in Escherichia
        coli.’, Nature. ECO:0000269 experimental evidence cited by UniProt for the
        'Cytoplasm' localisation of P0A9A6.
    - reference: PMID:8917533
      notes: Ma X et al. 1996, ‘Colocalization of cell division proteins FtsZ and
        FtsA to cytoskeletal structures in living Escherichia coli cells by using
        green fluorescent protein.’, Proc Natl Acad Sci U S A. ECO:0000269 experimental
        evidence cited by UniProt for the 'Cytoplasm' localisation of P0A9A6.
- component_id: membrane_tethers
  label: membrane tethers (FtsA, ZipA/SepF)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
