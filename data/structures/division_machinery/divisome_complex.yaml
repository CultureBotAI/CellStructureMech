identifier: GO:1990586
label: divisome complex
definition: The membrane-associated protein machine that constricts a dividing bacterial
  cell. It is organised by the FtsZ ring — treadmilling filaments of the tubulin homologue
  FtsZ tethered to the inner membrane — which positions and moves the septal peptidoglycan
  synthases that build the division septum.
definition_source: GO:1990586
synonyms:
- synonym_text: Z ring
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1146/annurev-biophys-121219-081703
structure_category: DIVISION_MACHINERY
structure_kind: MULTIPROTEIN_COMPLEX
components:
- component_id: ftsz
  label: FtsZ filaments
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ftsZ
  essentiality: ESSENTIAL
  role: Tubulin homologue whose GTP-dependent treadmilling filaments form the ring
    and distribute the septal synthases.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    notes: McQuillen & Xiao 2020 review FtsZ filament treadmilling and its role in
      organising the ring.
- component_id: membrane_tethers
  label: membrane tethers (FtsA, ZipA/SepF)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ftsA
  - zipA
  - sepF
  essentiality: ESSENTIAL
  role: Anchor FtsZ filaments to the inner membrane; the anchor differs between lineages.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    notes: McQuillen & Xiao 2020 describe FtsA and ZipA tethering FtsZ to the membrane.
  - reference: DOI:10.1111/j.1749-6632.2012.06818.x
    notes: Egan & Vollmer 2012 review the septal synthases and the membrane anchoring
      of FtsZ.
- component_id: septal_pg_synthase
  label: septal peptidoglycan synthase (FtsW-FtsI)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - ftsW
  - ftsI
  essentiality: ESSENTIAL
  role: Builds the septal cell wall; its movement is guided by the treadmilling FtsZ
    filaments.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    notes: McQuillen & Xiao 2020 review FtsW-FtsI septal synthesis and its coupling
      to FtsZ dynamics.
  - reference: DOI:10.1111/j.1749-6632.2012.06818.x
    notes: Egan & Vollmer 2012 review the septal synthases and the membrane anchoring
      of FtsZ.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: FtsZ-based division is the norm; a few lineages (e.g. Chlamydiae, some Planctomycetes)
    divide without FtsZ.
  reference: DOI:10.1146/annurev-biophys-121219-081703
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: VARIABLE
  note: Euryarchaeota use FtsZ; some other archaea divide with an ESCRT-III-related
    system instead.
  reference: DOI:10.1146/annurev-biophys-121219-081703
