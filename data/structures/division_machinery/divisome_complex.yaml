physical_properties:
- property: LENGTH
  value: 40-160
  unit: UO:0000018
  context: individual FtsZ protofilaments at midcell, by cryo-electron tomography
  reference: DOI:10.1146/annurev-biophys-121219-081703
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    snippet: The filaments were approximately 40–160 nm long and approximately 5 nm
      in diameter, consistent with the dimensions of single FtsZ protofilaments based
      on previous calculations and in vitro EM studies ( 93 , 183 ).
    notes: Verbatim from the open-access full text (PMC8610174).
- property: DIAMETER
  value: ~5
  unit: UO:0000018
  context: single FtsZ protofilament
  reference: DOI:10.1146/annurev-biophys-121219-081703
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    snippet: The filaments were approximately 40–160 nm long and approximately 5 nm
      in diameter, consistent with the dimensions of single FtsZ protofilaments based
      on previous calculations and in vitro EM studies ( 93 , 183 ).
    notes: Verbatim; the same sentence gives filament length and diameter.
- property: TRANSLOCATION_SPEED
  value: 25-30 nm/s
  context: apparent directional movement of FtsZ clusters at midcell in E. coli and
    B. subtilis
  reference: DOI:10.1146/annurev-biophys-121219-081703
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    snippet: In both E. coli and B. subtilis , it was also discovered that FtsZ clusters
      in the Z-ring exhibited apparent directional movement with a speed of approximately
      25–30 nm/s at midcell ( 20 , 239 ) ( Figure 5d ).
    notes: Verbatim from PMC8610174. The rate is carried in `value` because UO has
      no nanometre-per-second term, and tagging a speed with UO:0000018 (nanometer)
      would state the wrong dimension.
- property: THICKNESS
  value: ~13
  unit: UO:0000018
  context: distance from the inner membrane to arc-like FtsZ filaments at the constriction
    site
  reference: DOI:10.1146/annurev-biophys-121219-081703
  evidence:
  - reference: DOI:10.1146/annurev-biophys-121219-081703
    snippet: It was observed that individual, arc-like FtsZ filaments were positioned
      approximately 13 nm underneath the inner membrane at the site of midcell constriction
      ( 116 ) ( Figure 4c ).
    notes: Verbatim from PMC8610174. This is the filament-to-membrane spacing, not
      the radial thickness of the Z-ring, which the review reports as unchanged even
      under FtsZ overexpression.
