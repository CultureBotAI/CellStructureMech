    retrieved_on: '2026-10-25'
    role: Reviewed E. coli K-12 FtsL subunit (also declared as synonyms mraR, yabD)
      of the ternary FtsQBL divisome subcomplex.
    evidence:
    - reference: UniProtKB:P0AEN4
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 cell division protein
        FtsL.
    - reference: PMID:15165235
      notes: Buddelmeijer and Beckwith 2004 demonstrated co-immunoprecipitation of
        E. coli FtsL with FtsB and FtsQ.
- component_id: ftsq_subunit
  label: Cell division protein FtsQ
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR005548
  gene_symbols:
  - ftsQ
  stoichiometry: 1 copy per heterotrimeric FtsQBL protomer
  essentiality: ESSENTIAL
  role: Essential POTRA-domain bitopic membrane protein that binds the FtsBL heterodimer
    via its C-terminal periplasmic region and targets the preassembled FtsQBL complex
    to the division septum.
  evidence:
  - reference: GO:1990587
    notes: GO:1990587 defines FtsQ as a core subunit of the Escherichia coli FtsQBL
      complex.
  - reference: PMID:15165235
    notes: Buddelmeijer and Beckwith 2004 showed that FtsQ binds the FtsBL subcomplex
      prior to septal recruitment and directs it to the midcell division site.
  - reference: PMID:21672257
    notes: Villanelo et al. 2011 (DOI:10.1186/1472-6807-11-28) modeled the periplasmic
      assembly interface of the E. coli FtsB/FtsL/FtsQ complex.
  protein_examples:
  - uniprot_id: UniProtKB:P06136
