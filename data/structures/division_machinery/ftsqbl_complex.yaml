    role: Reviewed E. coli K-12 FtsQ subunit that binds the FtsBL subcomplex and mediates
      septal localization of the FtsQBL complex.
    evidence:
    - reference: UniProtKB:P06136
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 cell division protein
        FtsQ.
    - reference: PMID:15165235
      notes: Buddelmeijer and Beckwith 2004 demonstrated that FtsQ associates with
        FtsB and FtsL to form the FtsQBL complex.
