  taxon_label: Bacteria
  presence: COMMON
  note: Conserved across diderm and monoderm bacteria as the FtsQBL (or DivIB-DivIC-FtsL)
    late-early divisome subcomplex bridging early Z-ring components to septal peptidoglycan
    synthesis.
  reference: PMID:15165235
canonical_examples:
- taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli K-12
  note: Reference bacterial strain in which preassembly of the ternary FtsQ-FtsB-FtsL
    complex prior to septal localization was biochemically established.
  reference: PMID:15165235
functions:
- function_id: ftsz_dependent_cytokinesis
  label: FtsZ-dependent cytokinesis
  grounding: GO:0043093
  description: Preassembles from FtsB, FtsL, and FtsQ prior to septal localization
    and is recruited to the midcell divisome to license FtsW-FtsI septal peptidoglycan
    synthesis during prokaryotic FtsZ-dependent cytokinesis.
  evidence:
  - reference: GO:1990587
    notes: GO:1990587 defines the FtsQBL complex as required for prokaryotic FtsZ-dependent
      cytokinesis.
  - reference: PMID:15165235
    notes: Buddelmeijer and Beckwith 2004 established that the preassembled FtsQBL
      complex is transported to the septum to drive downstream divisome maturation
      and cell division.
- function_id: division_septum_assembly
  label: division septum assembly
  grounding: GO:0000917
  description: Serves as the structural scaffold within the divisome that bridges
    early septal ring proteins to the late peptidoglycan transglycosylase-transpeptidase
    machinery (FtsW-FtsI) during division septum assembly.
  evidence:
  - reference: PMID:15165235
    notes: Buddelmeijer and Beckwith 2004 showed that FtsQBL complex formation and
      septal localization are required to recruit downstream septal assembly proteins
      FtsW and FtsI.
  - reference: PMID:19233928
    notes: Gonzalez and Beckwith 2009 showed that distinct periplasmic domains of
      FtsB within the FtsQBL complex mediate interactions required for divisome construction
      at the septum.
evidence:
