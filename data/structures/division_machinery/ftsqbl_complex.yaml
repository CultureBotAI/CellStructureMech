    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-25'
    role: Reviewed E. coli K-12 FtsB subunit (also declared as synonym ygbQ) cited
      in the GO:1990587 ontology comment and characterized in PMID:15165235.
    evidence:
    - reference: UniProtKB:P0A6S5
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 cell division protein
        FtsB.
    - reference: PMID:15165235
      notes: Buddelmeijer and Beckwith 2004 characterized E. coli FtsB within the
        ternary FtsQBL complex.
- component_id: ftsl_subunit
  label: Cell division protein FtsL
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR011922
  gene_symbols:
  - ftsL
  - mraR
  - yabD
  stoichiometry: 1 copy per heterotrimeric FtsQBL protomer
  essentiality: ESSENTIAL
  role: Essential bitopic membrane divisome subunit that forms a heterodimeric coiled-coil
    subcomplex with FtsB and recruits FtsQ and downstream septal peptidoglycan synthase
    FtsWI.
  evidence:
  - reference: GO:1990587
    notes: GO:1990587 specifies FtsL as one of the three constituent subunits of the
      E. coli FtsQBL complex.
  - reference: PMID:15165235
    notes: Buddelmeijer and Beckwith 2004 showed that FtsL and FtsB stabilize each
      other and associate with FtsQ to form the FtsQBL complex.
