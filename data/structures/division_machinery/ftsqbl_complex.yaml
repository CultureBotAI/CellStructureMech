identifier: GO:1990587
label: FtsQBL complex
structure_category: DIVISION_MACHINERY
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex required for prokaryotic cell division (FtsZ-dependent
  cytokinesis). Part of the divisome. Assembled independently of the other divisome
  components in the cytoplasm prior to transport to the cell septum. In E. coli consists
  of FtsB, FtsL and FtsQ.
definition_source: GO:1990587
mapping_status: PROPOSED
synonyms:
- synonym_text: FtsB-FtsL-FtsQ complex
  synonym_type: EXACT_SYNONYM
  source: GO:1990587
parent_structures:
- GO:1990586
part_of:
- GO:1990586
has_part:
- GO:1990588
components:
- component_id: ftsb_subunit
  label: Cell division protein FtsB
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR023081
  gene_symbols:
  - ftsB
  - ygbQ
  stoichiometry: 1 copy per heterotrimeric FtsQBL protomer (forms 1:1:1 or 2:2:2 oligomeric
    assemblies)
  essentiality: ESSENTIAL
  role: Bitopic inner-membrane divisome subunit whose periplasmic coiled-coil and
    C-terminal domain pair with FtsL and bind the periplasmic domain of FtsQ to assemble
    the ternary FtsQBL complex prior to septal recruitment.
  evidence:
  - reference: GO:1990587
    notes: GO:1990587 defines the Escherichia coli FtsQBL complex as consisting of
      FtsB, FtsL, and FtsQ and cites FtsB (UniProtKB:P0A6S5) in PMID:15165235.
  - reference: PMID:15165235
    notes: Buddelmeijer and Beckwith 2004 (DOI:10.1111/j.1365-2958.2004.04044.x) demonstrated
      by co-immunoprecipitation that E. coli FtsB, FtsL, and FtsQ form a ternary subcomplex
      independently of septal localization.
  - reference: PMID:19233928
    notes: Gonzalez and Beckwith 2009 (DOI:10.1128/JB.01597-08) mapped the periplasmic
      coiled-coil and C-terminal domains of FtsB required for interaction with FtsL
      and FtsQ.
