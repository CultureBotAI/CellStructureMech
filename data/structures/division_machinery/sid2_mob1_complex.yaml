identifier: GO:0034973
label: Sid2-Mob1 complex
structure_category: DIVISION_MACHINERY
structure_kind: MULTIPROTEIN_COMPLEX
definition: A conserved fungal NDR-family protein kinase complex localized to the
  spindle pole body and medial cell division site, composed of the catalytic serine/threonine
  protein kinase Sid2 (fission yeast) or Dbf2/Dbf20 (budding yeast) bound to its regulatory
  activator subunit Mob1; acts as the terminal effector kinase complex of the septation
  initiation network (SIN) and mitotic exit network (MEN) to trigger mitotic exit,
  Cdc14 release, and cytokinetic septum assembly.
