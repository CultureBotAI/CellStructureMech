  reference: DOI:10.1038/nrmicro2677
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaea build no peptidoglycan sacculus.
  reference: DOI:10.1038/nrmicro2677
canonical_examples:
