identifier: cellstructuremech:elongasome
label: elongasome
definition: The membrane-associated Rod complex that synthesizes lateral peptidoglycan
  during rod-shaped growth in model bacteria such as Escherichia coli and Bacillus
  subtilis. Its SEDS-family RodA polymerase works with an elongation-specific class
  B penicillin-binding transpeptidase, PBP2 in E. coli. Associated MreB filaments
  orient synthesis, while wall synthesis and filament motion are coupled; this is
  not a universal mechanism of rod shape in all bacteria.
definition_source: DOI:10.1038/nmicrobiol.2016.172
synonyms:
- synonym_text: Rod complex
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/nature19331
- synonym_text: RodA-PBP2 complex
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1038/nmicrobiol.2016.172
structure_category: DIVISION_MACHINERY
structure_kind: MULTIPROTEIN_COMPLEX
parent_structures:
- GO:0098797
components:
- component_id: roda
  label: SEDS glycosyltransferase RodA
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - rodA
  essentiality: ESSENTIAL
  role: Polymerises the glycan strand; the SEDS-family partner of the class B PBP.
  evidence:
  - reference: DOI:10.1038/nature19331
    snippet: Here, we have presented evidence that the SEDS family protein RodA is
      the principal PGT in the Rod complex and is likely to be responsible for its
      dynamic movement.
    notes: Verbatim from PMC5161649. Meeske et al.2016 establish RodA polymerase activity
      in B. subtilis. Typas et al.2011 do mention RodA in Table1 and Figure1, with
      a then-proposed flippase function; mentioning the protein is different from
      establishing its later polymerase activity. Earlier history asserting the name
      was absent is retained as historical provenance, not current evidence.
  - reference: DOI:10.1038/nature19331
    snippet: RodA is a member of the SEDS family of proteins that play essential but
      ill-defined roles in cell wall biogenesis during growth, division and sporulation.
    notes: Verbatim; supports the SEDS family assignment in the component label.
  protein_examples:
