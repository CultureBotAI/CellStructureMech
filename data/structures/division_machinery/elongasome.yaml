    entry_status: REVIEWED
    retrieved_on: '2026-09-08'
    role: The single reviewed UniProtKB entry for gene rodA, which UniProt lists under
      the primary name mrdB, in Escherichia coli K-12, a taxon this record names.
      Identifier for the component's declared gene symbol; it is not itself evidence
      that the protein is part of this structure.
    evidence:
    - reference: PMID:6348029
      notes: Stoker NG et al. 1983, ‘Identification of the rodA gene product of Escherichia
        coli.’, J Bacteriol. ECO:0000269 experimental evidence cited by UniProt for
        the 'Cell inner membrane' localisation of P0ABG7.
