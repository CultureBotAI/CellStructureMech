functions:
- function_id: sidewall_synthesis
  label: regulation of cell shape
  grounding: GO:0008360
  description: Inserts peptidoglycan into the cylindrical sidewall, maintaining width
    and extending length.
  evidence:
  - reference: DOI:10.1038/nrmicro2677
    notes: Typas et al. 2011 tie elongation-complex activity to cell shape.
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 link the complex's circumferential motion to rod maintenance.
evidence:
- reference: DOI:10.1038/nrmicro2677
  notes: Typas A, Banzhaf M, Gross CA, Vollmer W 2011, 'From the regulation of peptidoglycan
    synthesis to bacterial growth and morphology', Nature Reviews Microbiology.
- reference: DOI:10.1016/j.cell.2018.02.050
  notes: 'Shi H, Bratton BP, Gitai Z, Huang KC 2018, ''How to Build a Bacterial Cell:
    MreB as the Foreman of E. coli Construction'', Cell.'
- reference: DOI:10.1038/nmicrobiol.2016.172
  notes: Primary E. coli radiolabeling, perturbation and imaging experiments distinguish
    RodA/PBP2 synthesis from semi-autonomous aPBP activity and the wall product.
- reference: DOI:10.1038/nature19331
  notes: Primary B. subtilis work establishes RodA as the Rod-complex glycan polymerase.
- reference: DOI:10.1038/s41467-021-23099-8
  notes: 'Scope comparison only: archaeal pseudomurein is distinct from bacterial
    peptidoglycan. This paper does not establish a domain-wide negative assay for
    the elongasome; the unsupported Archaea ABSENT row is removed without asserting
    presence.'
