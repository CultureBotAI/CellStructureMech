  edges:
  - subject: roda
    predicate: polymerises
    object: pg_synthesis
    description: RodA is the glycan-strand polymerase of the Rod complex.
    evidence:
    - reference: DOI:10.1038/nature19331
      snippet: Here, we have presented evidence that the SEDS family protein RodA
        is the principal PGT in the Rod complex and is likely to be responsible for
        its dynamic movement.
      notes: Verbatim from PMC5161649.
  - subject: pbp2
    predicate: is required for
    object: complex_motion
    description: Depleting the elongation-specific transpeptidase abolishes movement,
      which is what identifies synthesis as the motor.
    evidence:
    - reference: DOI:10.1038/nrmicro2677
      snippet: Interestingly, inhibition or depletion of the specific elongation class
        B TPases (PBP2 in E. coli , and PBP2A and PBPH in B. subtilis) eliminates
        filament movement in both organisms, suggesting that peptidoglycan synthesis
        itself is the motor that drives filament movement
      notes: Verbatim from the open-access full text (PMC5433867). The authors hedge
        with 'suggesting', and the edge is no stronger than that.
  - subject: pg_synthesis
    predicate: drives
    object: complex_motion
    description: Synthesis is the motor; the filament is steered by it rather than
      pulling it.
    evidence:
    - reference: DOI:10.1038/nrmicro2677
      snippet: Interestingly, inhibition or depletion of the specific elongation class
        B TPases (PBP2 in E. coli , and PBP2A and PBPH in B. subtilis) eliminates
        filament movement in both organisms, suggesting that peptidoglycan synthesis
        itself is the motor that drives filament movement
      notes: 'Verbatim from PMC5433867. This is the sentence that supports the predicate:
        stopping synthesis stops the movement. The velocity correlation below shows
        the two are coupled, which on its own would not establish which drives which.'
    - reference: DOI:10.1038/nrmicro2677
      snippet: Consistent with this idea, both MreB and the peptidoglycan synthesis
        complexes move with comparable velocities in roughly similar circumferential
        directions 47 – 48 , mirroring the position of glycan chains in the sacculus
        22 .
      notes: Verbatim. Comparable velocities in a shared direction show the filament
        and the synthesis complex are coupled; they do not by themselves say which
        moves the other.
  - subject: rodz
    predicate: couples
    object: mreb
    description: RodZ bridges the filament to the wall-synthesis enzymes across the
      membrane.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.02.050
      snippet: In E. coli, RodZ’s cytoplasmic domain binds MreB ( Van den Ent et al.,
        2010 ) while its periplasmic domain binds several cell-wall synthesis enzymes
        ( Morgenstein et al., 2015 ; Shiomi et al., 2013 ).
      notes: Verbatim from PMC5846203.
  - subject: rodz
    predicate: is required for
    object: complex_motion
    description: Without RodZ the filament stops rotating and the cell rounds.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.02.050
      snippet: Deletion of rodZ leads to round cells, in which MreB no longer rotates
        around the cell circumference ( Morgenstein et al., 2015 ) but instead moves
        diffusively.
      notes: Verbatim from PMC5846203.
  - subject: complex_motion
    predicate: produces
    object: sidewall
    description: Insertion along a circumferential track lengthens the cylinder rather
      than widening it.
    evidence:
    - reference: DOI:10.1038/nrmicro2677
      snippet: Consistent with this idea, both MreB and the peptidoglycan synthesis
        complexes move with comparable velocities in roughly similar circumferential
        directions 47 – 48 , mirroring the position of glycan chains in the sacculus
        22 .
      notes: The circumferential direction of travel is what makes the product elongation
        rather than widening.
  - subject: mreb
    predicate: is required for
    object: rod_shape
    description: 'Losing the filament loses the rod: cells stop elongating and widen.'
    evidence:
    - reference: DOI:10.1038/nrmicro2677
      snippet: When MreB is depleted, or filament formation is specifically inhibited
        (for example, with A22 ( S -(3,4-dichlorobenzyl)isothiourea)), cells rapidly
        stop elongating, increase their diameter and grow with spherical morphology,
        indicating that MreB is required for rod-shaped growth 40 – 42 .
      notes: Verbatim from PMC5433867.
  - subject: sidewall
    predicate: maintains
    object: rod_shape
    description: Sustained circumferential insertion is what keeps the cylinder a
      cylinder.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.02.050
      snippet: MreB both senses and changes cell shape, thereby generating a self-organizing
        feedback system for shape maintenance.
      notes: Verbatim from PMC5846203; the same sentence grounds the MreB record's
        MODULATES cell-shape link.
