associated_traits:
- trait_id: METPO:1000681
  trait_label: rod shaped
  relation: MODULATES
  evidence:
  - reference: DOI:10.1038/nmicrobiol.2016.172
    notes: The Rod system supports rod-shaped growth in E. coli; this is not universal
      necessity for every rod-shaped bacterium.
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: The review describes MreB-independent rod-shaped lineages and shape-restoring
      suppressors. MODULATES denotes the bounded shape-maintenance role, not sufficiency
      or universal necessity.
discussions:
- discussion_id: guided_by_mreb
  prompt: This machine is guided by the MreB filament, and the schema has no relation
    that says so.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - components#rodz
  rationale: The partner statement to the discussion on the MreB filament record (#119).
    RodZ couples the two, which is recorded in that component's role, but the structure-to-structure
    relationship has no field.
  evidence:
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 describe RodZ-mediated coupling between MreB filaments
      and the elongasome.
  - reference: https://github.com/CultureBotAI/CellStructureMech/issues/119
    notes: Repository issue recording removal of the non-equivalent MreB/elongasome
      xref.
  posed_by: claude
  posed_date: '2026-09-02'
- discussion_id: definition_source_predates_roda
  prompt: Which source establishes the RodA polymerase assignment used in the definition?
    The definition and synonyms now cite inspected 2016 primary evidence. Typas et
    al. 2011 mention RodA, but predate the polymerase discovery; absence of that later
    finding is not absence of the protein name.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - definition
  - definition_source
  rationale: The RodA component now carries Meeske 2016 with verbatim support (#161),
    so the claim itself is sourced. What remains is that the record-level definition
    still attributes it to a review that predates the finding. Rewording a definition
    changes what the record asserts it is, which is a curator's call, not an automatic
    edit.
  posed_by: claude
  posed_date: '2026-09-02'
  resolved_date: '2026-10-12'
  evidence:
  - reference: DOI:10.1038/nmicrobiol.2016.172
    notes: Primary E. coli RodA/PBP2 synthesis evidence.
  - reference: DOI:10.1038/nature19331
    notes: Primary RodA polymerase evidence in B. subtilis.
  - reference: DOI:10.1038/nrmicro2677
    notes: Table1 includes RodA with a proposed flippase assignment.
  - reference: https://github.com/CultureBotAI/CellStructureMech/issues/161
    notes: Repository issue tracking verbatim evidence verification for the RodA component
      and definition source.
  resolution_note: Rebased the bounded definition on Cho et al.2016 and the Rod-complex
    synonym on Meeske et al.2016. Typas2011 predates the polymerase discovery but
    does mention RodA; the historical prompt and history overstated absence of the
    name. Current component evidence explicitly corrects that distinction. Rationale
    and posed_date are preserved.
causal_graphs:
- graph_id: elongasome_sidewall_elongation
  title: Rod-system synthesis, MreB rotation and model-specific shape maintenance
  description: E. coli RodA/PBP2 synthesize lateral wall, and inhibition experiments
    couple synthesis to MreB rotation. MreB rotation and synthase movement are separate
    readouts, not interchangeable with rod shape. RodZ promotes normal MreB rotation,
    but suppressor backgrounds can retain rod shape without rotation. B. subtilis
    uses related machinery, including its own elongation-specific transpeptidases;
    this graph is not a universal inventory or necessity claim.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  nodes:
  - node_id: mreb
    label: MreB filament
    node_type: STRUCTURE
    description: Curves-sensing actin homologue that orients the complex circumferentially.
    grounding: cellstructuremech:mreb_filament
  - node_id: rodz
    label: RodZ
    node_type: GENE_OR_PROTEIN
    component_ref: rodz
  - node_id: roda
    label: SEDS glycosyltransferase RodA
    node_type: GENE_OR_PROTEIN
    component_ref: roda
  - node_id: pbp2
    label: class B penicillin-binding protein PBP2
    node_type: GENE_OR_PROTEIN
    component_ref: pbp2
  - node_id: pg_synthesis
    label: peptidoglycan biosynthetic process
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0009252
  - node_id: complex_motion
    label: circumferential MreB filament rotation
    node_type: BIOLOGICAL_PROCESS
    description: The filament-motion readout measured in the cited perturbation studies;
      not all movement of every synthase molecule.
  - node_id: sidewall
    label: cylindrical sidewall extension
    node_type: BIOLOGICAL_PROCESS
  - node_id: rod_shape
    label: rod-shaped cell
    node_type: STATE
  - node_id: synthase_motion
    label: directional RodA-PBP2 movement in E. coli
    node_type: BIOLOGICAL_PROCESS
  - node_id: mrec_mred
    label: MreC-MreD transmembrane scaffold
    node_type: GENE_OR_PROTEIN
    component_ref: mrec_mred
  edges:
  - subject: roda
    predicate: polymerizes glycans during
    object: pg_synthesis
    description: RodA polymerase activity supplies new glycan strands in the Rod system.
    evidence:
    - reference: DOI:10.1038/nature19331
      notes: B. subtilis biochemical and genetic experiments establish RodA polymerase
        activity; Cho2016 supplies complementary E. coli evidence.
  - subject: pbp2
    predicate: crosslinks peptides during
    object: pg_synthesis
    description: E. coli PBP2 provides elongation-specific transpeptidase activity;
      B. subtilis uses related but differently named class B PBPs.
    evidence:
    - reference: DOI:10.1038/nmicrobiol.2016.172
      notes: Mecillinam perturbation separates glycan polymerization from crosslinking
        in the E. coli Rod system.
  - subject: pg_synthesis
    predicate: drives coupled
    object: complex_motion
    description: In the studied E. coli conditions, inhibiting Rod-system synthesis
      arrests MreB rotation, supporting synthesis-coupled movement rather than an
      MreB polymerization motor.
    evidence:
    - reference: DOI:10.1038/nmicrobiol.2016.172
      notes: RodA(D262N) inhibits Rod-system polymerization and MreB rotation; aPBP
        inhibition does not eliminate that rotation before lysis.
  - subject: rodz
    predicate: couples
    object: mreb
    description: RodZ connects MreB to wall-synthesis proteins in the E. coli model.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.02.050
      notes: Review discusses cytoplasmic MreB binding and periplasmic interactions
        with synthetic proteins.
  - subject: rodz
    predicate: promotes
    object: complex_motion
    description: RodZ supports normal MreB rotation. Shape-restoring suppressors can
      bypass RodZ loss without restoring rotation under standard laboratory conditions.
    evidence:
    - reference: DOI:10.1073/pnas.1509610112
      notes: Complete primary abstract distinguishes normal rotation from suppressor-restored
        rod shape; not evidence that all synthase movement is absent.
  - subject: pg_synthesis
    predicate: is coupled to
    object: synthase_motion
    description: A directionally moving fraction of E. coli RodA/PBP2 accompanies
      the active Rod system; not every molecule is processive.
    evidence:
    - reference: DOI:10.1038/nmicrobiol.2016.172
      notes: Imaging resolves both nondirectional diffusion and MreB-like circumferential
        motion for RodA/PBP2; directional fractions respond to Rod-system perturbation.
  - subject: pg_synthesis
    predicate: produces
    object: sidewall
    description: Polymerization and crosslinking insert lateral peptidoglycan; filament
      rotation alone is not asserted to produce the wall.
    evidence:
    - reference: DOI:10.1038/nmicrobiol.2016.172
      notes: Primary radiolabeling and synthesis perturbations support the wall-producing
        activity of the Rod system.
  - subject: mreb
    predicate: supports
    object: rod_shape
    description: MreB-dependent wall organization supports rod shape in the studied
      model systems; this does not exclude MreB-independent rods or suppressor-dependent
      phenotypes.
    evidence:
    - reference: DOI:10.1016/j.cell.2018.02.050
      notes: Review describes morphology perturbations, geometric organization and
        lineage-specific exceptions.
  - subject: sidewall
    predicate: maintains
    object: rod_shape
    description: Organized lateral wall growth contributes to maintaining width and
      elongation in these rod-shaped model systems.
    evidence:
    - reference: DOI:10.1038/nrmicro2677
      notes: Review connects spatial control of peptidoglycan growth to bacterial
        morphology; no universal constant-width law is inferred.
  - subject: mrec_mred
    predicate: scaffolds synthases during
    object: pg_synthesis
    description: The transmembrane MreC-MreD subcomplex bridges cytoplasmic MreB filaments
      to periplasmic peptidoglycan synthases during lateral cell wall elongation.
    evidence:
    - reference: DOI:10.1038/nrmicro2677
      snippet: In rod-shaped bacteria, two protein complexes, the elongasome and the
        divisome, direct cell wall synthesis during elongation and division, respectively.
      notes: Supports the role of the MreC-MreD transmembrane scaffold within the
        elongasome during lateral peptidoglycan synthesis.
