identifier: cellstructuremech:elongasome
label: elongasome
definition: The sidewall peptidoglycan-synthesis machine of rod-shaped bacteria, also
  called the Rod complex. A SEDS-family glycosyltransferase (RodA) works with a class
  B penicillin-binding protein (PBP2) to polymerise and crosslink new wall material
  into the cylinder, while MreC, MreD and RodZ couple the complex to MreB filaments,
  which distribute it around the circumference. It is the elongation counterpart of
  the divisome.
definition_source: DOI:10.1038/nrmicro2677
synonyms:
- synonym_text: Rod complex
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/nrmicro2677
- synonym_text: RodA-PBP2 complex
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1016/j.cell.2018.02.050
structure_category: DIVISION_MACHINERY
structure_kind: MULTIPROTEIN_COMPLEX
parent_structures:
- GO:0098797
components:
- component_id: roda
  label: SEDS glycosyltransferase RodA
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - rodA
  essentiality: ESSENTIAL
  role: Polymerises the glycan strand; the SEDS-family partner of the class B PBP.
  evidence:
  - reference: DOI:10.1038/nrmicro2677
    notes: Typas et al. 2011 review the elongation machinery and its separation from
      the division machinery.
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 describe RodA-PBP2 as the synthetic core the filaments
      carry.
- component_id: pbp2
  label: class B penicillin-binding protein PBP2
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - mrdA
  - pbpA
  essentiality: ESSENTIAL
  role: Crosslinks the new glycan strands into the existing sacculus; the target of
    mecillinam.
  evidence:
  - reference: DOI:10.1038/nrmicro2677
    notes: Typas et al. 2011 describe PBP2 as the elongation-specific crosslinking
      enzyme.
- component_id: mrec_mred
  label: MreC and MreD
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - mreC
  - mreD
  essentiality: ESSENTIAL
  role: 'Membrane and periplasmic subunits that hold the synthases in an active arrangement.
    Moved here from the MreB filament record, where they were mis-scoped: they build
    this machine, not the filament (#102).'
  evidence:
  - reference: DOI:10.1038/nrmicro2677
    notes: Typas et al. 2011 place MreC and MreD within the elongation complex.
- component_id: rodz
  label: RodZ
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - rodZ
  essentiality: CONDITIONAL
  role: Bridges the assembled complex to MreB filaments; acts on the machine rather
    than forming it.
  evidence:
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 describe RodZ coupling MreB to the synthetic complex.
