- component_id: rodz
  label: RodZ
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - rodZ
  essentiality: CONDITIONAL
  role: Couples MreB to wall-synthesis proteins in E. coli. RodZ loss impairs MreB
    rotation in ordinary backgrounds, but suppressors can restore rod shape without
    restoring rotation.
  evidence:
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 describe RodZ coupling MreB to the synthetic complex.
  - reference: DOI:10.1073/pnas.1509610112
    notes: 'Complete primary abstract: RodZ links MreB rotation to wall synthesis;
      suppressors restore shape without rotation in standard laboratory conditions.
      Full Methods were not available in this review.'
  protein_examples:
  - uniprot_id: UniProtKB:P27434
    protein_label: Cytoskeleton protein RodZ
    gene_symbol: rodZ
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-09-08'
    role: The single reviewed UniProtKB entry for gene rodZ in Escherichia coli K-12,
      a taxon this record names; other reviewed entries for this symbol exist on sub-strain
      nodes and this is the one at the taxon the record names. Identifier for the
      component's declared gene symbol; it is not itself evidence that the protein
      is part of this structure.
    evidence:
    - reference: PMID:19008860
      notes: Shiomi D et al. 2008, ‘Determination of bacterial rod shape by a novel
        cytoskeletal membrane protein.’, EMBO J. ECO:0000269 experimental evidence
        cited by UniProt for the 'Cell inner membrane' localisation of P27434.
