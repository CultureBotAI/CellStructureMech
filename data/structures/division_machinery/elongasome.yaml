- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: Reference Gram-positive elongation machinery.
  reference: DOI:10.1038/nrmicro2677
functions:
- function_id: sidewall_synthesis
  label: regulation of cell shape
  grounding: GO:0008360
  description: Inserts peptidoglycan into the cylindrical sidewall, maintaining width
    and extending length.
  evidence:
  - reference: DOI:10.1038/nrmicro2677
    notes: Typas et al. 2011 tie elongation-complex activity to cell shape.
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 link the complex's circumferential motion to rod maintenance.
