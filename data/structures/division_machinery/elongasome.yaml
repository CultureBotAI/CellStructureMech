  evidence:
  - reference: DOI:10.1038/nrmicro2677
    notes: Typas et al. 2011 tie elongation-complex activity to cell shape.
  - reference: DOI:10.1016/j.cell.2018.02.050
    notes: Shi et al. 2018 link the complex's circumferential motion to rod maintenance.
