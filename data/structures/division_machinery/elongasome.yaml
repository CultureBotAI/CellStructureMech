discussions:
- discussion_id: guided_by_mreb
  prompt: This machine is guided by the MreB filament, and the schema has no relation
    that says so.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - components#rodz
  rationale: The partner statement to the discussion on the MreB filament record (#119).
    RodZ couples the two, which is recorded in that component's role, but the structure-to-structure
    relationship has no field.
  posed_by: claude
  posed_date: '2026-09-02'
- discussion_id: definition_source_predates_roda
  prompt: definition_source cites Typas et al. 2011 for a definition that names RodA
    as a SEDS-family glycosyltransferase, but RodA was shown to be the polymerase
    in 2016 and the string RodA does not occur in that review. Should the definition
    be reworded to what Typas supports, or the definition_source changed to Meeske
    et al. 2016 (DOI:10.1038/nature19331)?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - definition
  - definition_source
  rationale: The RodA component now carries Meeske 2016 with verbatim support (#161),
    so the claim itself is sourced. What remains is that the record-level definition
    still attributes it to a review that predates the finding. Rewording a definition
    changes what the record asserts it is, which is a curator's call, not an automatic
    edit.
  posed_by: claude
  posed_date: '2026-09-02'
causal_graphs:
- graph_id: elongasome_sidewall_elongation
  title: Peptidoglycan synthesis moves the complex, and the sidewall extends without
    widening
  description: The cited sources put the motor in the synthase, not the filament.
    Inhibiting the elongation-specific transpeptidase stops filament movement, so
    peptidoglycan synthesis drives the motion rather than being carried by it. MreB
    and RodZ set where and in which direction that synthesis happens; losing either
    gives a round cell.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  nodes:
  - node_id: mreb
    label: MreB filament
    node_type: STRUCTURE
    description: Curves-sensing actin homologue that orients the complex circumferentially.
    grounding: cellstructuremech:mreb_filament
