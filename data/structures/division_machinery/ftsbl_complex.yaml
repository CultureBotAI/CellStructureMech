functions:
- function_id: ftsz_dependent_cytokinesis
  label: FtsZ-dependent cytokinesis
  grounding: GO:0043093
  description: Forms a mutually stabilizing FtsB-FtsL heterodimer prior to septal
    transport, providing the binding surface for FtsQ and the activating interface
    for septal peptidoglycan synthases during FtsZ-dependent cytokinesis.
  evidence:
  - reference: GO:1990588
    notes: GO:1990588 defines the FtsBL complex as required for prokaryotic cell division
      (FtsZ-dependent cytokinesis).
  - reference: PMID:15165235
    notes: Buddelmeijer and Beckwith 2004 showed that FtsBL subcomplex formation is
      required for binding FtsQ and subsequent localization to the division septum.
evidence:
