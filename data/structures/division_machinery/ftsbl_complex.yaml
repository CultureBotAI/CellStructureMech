identifier: GO:1990588
label: FtsBL complex
structure_category: DIVISION_MACHINERY
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex required for prokaryotic cell division (FtsZ-dependent
  cytokinesis). Part of the divisome. Assembled independently of the other divisome
  components in the cytoplasm prior to transport to the cell septum. In E. coli consists
  of FtsB and FtsL.
definition_source: GO:1990588
mapping_status: PROPOSED
synonyms:
- synonym_text: FtsB-FtsL complex
  synonym_type: EXACT_SYNONYM
  source: GO:1990588
parent_structures:
- GO:1990586
part_of:
- GO:1990587
- GO:0005829
components:
- component_id: ftsb_subunit
  label: Cell division protein FtsB
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR023081
  gene_symbols:
  - ftsB
  - ygbQ
  stoichiometry: 1 copy per FtsBL heterodimer (or 2 copies in a heterotetrameric coiled-coil
    bundle)
  essentiality: ESSENTIAL
  role: Bitopic membrane divisome subunit that pairs with FtsL via transmembrane and
    periplasmic coiled-coil segments to form the preassembled FtsBL subcomplex independently
    of FtsQ.
  evidence:
  - reference: GO:1990588
    notes: GO:1990588 defines the Escherichia coli FtsBL complex as consisting of
      FtsB and FtsL and cites FtsB (UniProtKB:P0A6S5) in PMID:15165235.
  - reference: PMID:15165235
    notes: Buddelmeijer and Beckwith 2004 showed that FtsB and FtsL form a subcomplex
      in the absence of FtsQ.
  - reference: PMID:11972052
    notes: Buddelmeijer et al. 2002 (DOI:10.1073/pnas.092128499) demonstrated that
      FtsB (YgbQ) and FtsL are mutually codependent for stability and septal localization.
  protein_examples:
  - uniprot_id: UniProtKB:P0A6S5
    protein_label: Cell division protein FtsB
    gene_symbol: ftsB
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-25'
    role: Reviewed E. coli K-12 FtsB subunit (also declared as synonym ygbQ) cited
      in the GO:1990588 ontology comment and shown to form the FtsQ-independent FtsBL
      subcomplex in PMID:15165235.
    evidence:
    - reference: UniProtKB:P0A6S5
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 cell division protein
        FtsB.
    - reference: PMID:15165235
      notes: Buddelmeijer and Beckwith 2004 demonstrated FtsB-FtsL subcomplex assembly
        in E. coli.
- component_id: ftsl_subunit
  label: Cell division protein FtsL
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR011922
  gene_symbols:
  - ftsL
  - mraR
  - yabD
  stoichiometry: 1 copy per FtsBL heterodimer (or 2 copies in a heterotetrameric coiled-coil
    bundle)
  essentiality: ESSENTIAL
  role: Bitopic membrane divisome subunit that co-folds with FtsB into a transmembrane
    and periplasmic coiled-coil heterodimer required for FtsQ binding and downstream
    divisome activation.
  evidence:
  - reference: GO:1990588
    notes: GO:1990588 defines FtsL as one of the two constituent subunits of the E.
      coli FtsBL complex.
  - reference: PMID:15165235
    notes: Buddelmeijer and Beckwith 2004 showed that FtsL co-immunoprecipitates with
      FtsB in FtsQ-depleted cells, establishing an independent FtsBL subcomplex.
  protein_examples:
  - uniprot_id: UniProtKB:P0AEN4
    protein_label: Cell division protein FtsL
    gene_symbol: ftsL
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-25'
    role: Reviewed E. coli K-12 FtsL subunit (also declared as synonyms mraR, yabD)
      that forms the heterodimeric FtsBL subcomplex with FtsB.
    evidence:
    - reference: UniProtKB:P0AEN4
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 cell division protein
        FtsL.
    - reference: PMID:15165235
      notes: Buddelmeijer and Beckwith 2004 demonstrated FtsL-FtsB subcomplex formation
        in E. coli.
