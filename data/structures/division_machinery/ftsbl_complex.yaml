- reference: PMID:15165235
  notes: Buddelmeijer and Beckwith 2004 (Mol Microbiol, DOI:10.1111/j.1365-2958.2004.04044.x),
    demonstrating FtsQ-independent assembly of the E. coli FtsB-FtsL subcomplex.
- reference: PMID:11972052
  notes: Buddelmeijer et al. 2002 (Proc Natl Acad Sci U S A, DOI:10.1073/pnas.092128499),
    establishing codependent stability and localization of FtsB (YgbQ) and FtsL.
