identifier: GO:0009295
label: nucleoid
definition: The non-membrane-bounded subcellular region in which a bacterial chromosome
  is compacted and organized with nucleoid-associated proteins while remaining dynamically
  coupled to transcription and replication.
definition_source: DOI:10.1038/nrmicro2261
structure_category: NUCLEOID
structure_kind: SUBCELLULAR_REGION
components:
- component_id: chromosomal_dna
  label: chromosomal DNA
  component_type: DNA
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: The genome polymer whose compaction and spatial organization define the nucleoid.
  evidence:
  - reference: DOI:10.1038/nrmicro2261
    notes: Dorman reviews chromosome organization in the bacterial nucleoid.
- component_id: nucleoid_associated_proteins
  label: nucleoid-associated proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  role: Bend, bridge, wrap, and constrain DNA and couple chromosome structure to gene
    expression.
  evidence:
  - reference: DOI:10.1038/nrmicro2261
    notes: The review covers major NAP families and their regulatory roles.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: UNIVERSAL
  note: The chromosome occupies a nucleoid rather than a membrane-bounded nucleus.
  reference: DOI:10.1038/nrmicro2261
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Best-characterized bacterial nucleoid and NAP system.
  reference: DOI:10.1038/nrmicro2261
functions:
- function_id: chromosome_organization
  label: chromosome organization
  grounding: GO:0051276
  description: Compacts and spatially organizes the chromosome while preserving access
    to DNA.
  evidence:
  - reference: DOI:10.1038/nrmicro2261
    notes: Nucleoid architecture is integrated with gene expression.
evidence:
- reference: DOI:10.1038/nrmicro2261
  notes: Bacterial nucleoid-associated proteins, nucleoid structure and gene expression.
- reference: DOI:10.1371/journal.pgen.1008456
  notes: Verma, Qian and Adhya 2019 review multiscale Escherichia coli nucleoid architecture.
causal_graphs:
- graph_id: nap_supercoiling_chromosome_compaction
  title: NAPs and supercoils compact DNA into an organized nucleoid
  description: Nucleoid-associated proteins bind the bacterial chromosome and alter
    its local geometry by bending, wrapping, bridging, and constraining DNA. These
    local nucleoprotein states combine with plectonemic supercoils and topological
    domains to compact the chromosome into a dynamic nucleoid that still supports
    DNA replication and transcription.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  nodes:
  - node_id: chromosomal_dna
    label: chromosomal DNA
    node_type: GENETIC_ELEMENT
    component_ref: chromosomal_dna
  - node_id: nucleoid_associated_proteins
    label: nucleoid-associated proteins
    node_type: GENE_OR_PROTEIN
    component_ref: nucleoid_associated_proteins
  - node_id: local_dna_bridging
    label: locally bent and bridged DNA
    node_type: STATE
  - node_id: plectonemic_supercoils
    label: plectonemic supercoiled loops
    node_type: STATE
  - node_id: nucleoid
    label: nucleoid
    node_type: STRUCTURE
    grounding: GO:0009295
  - node_id: chromosome_organization
    label: chromosome organization
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0051276
  edges:
  - subject: nucleoid_associated_proteins
    predicate: bind
    object: chromosomal_dna
    description: NAPs bind the bacterial chromosome at abundant specific and nonspecific
      sites.
    evidence:
    - reference: DOI:10.1038/nrmicro2261
      notes: Dillon and Dorman 2010 review NAP binding across the bacterial chromosome.
  - subject: nucleoid_associated_proteins
    predicate: bend and bridge
    object: local_dna_bridging
    description: NAPs bend, wrap, bridge, and bunch DNA at the sub-kilobase scale.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1008456
      notes: Verma, Qian and Adhya 2019 review DNA bending, looping, bridging and
        wrapping by nucleoid-associated architectural proteins.
  - subject: local_dna_bridging
    predicate: constrains
    object: plectonemic_supercoils
    description: Architectural proteins constrain negative supercoils and help partition
      chromosomal DNA into topological loops.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1008456
      notes: Verma, Qian and Adhya 2019 describe NAP constraint of negative supercoils
        as a route to chromosome topological organization.
  - subject: chromosomal_dna
    predicate: folds into
    object: plectonemic_supercoils
    description: Supercoiling folds the chromosome into plectonemic loops at the tens-of-kilobases
      scale.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1008456
      notes: Verma, Qian and Adhya 2019 describe larger bacterial chromosome loops
        as plectonemic forms induced by supercoiling.
  - subject: plectonemic_supercoils
    predicate: compact into
    object: nucleoid
    description: Plectonemic loops and longer-range contacts coalesce into a compact,
      spatially organized nucleoid.
    evidence:
    - reference: DOI:10.1371/journal.pgen.1008456
      notes: Verma, Qian and Adhya 2019 review hierarchical compaction of E. coli
        chromosomal DNA into spatial domains and the nucleoid.
  - subject: nucleoid
    predicate: organizes
    object: chromosome_organization
    description: The final folded nucleoid keeps the chromosome condensed while leaving
      DNA accessible for replication, transcription, and segregation.
    evidence:
    - reference: DOI:10.1038/nrmicro2261
      notes: Dillon and Dorman 2010 review the dynamic coupling of bacterial nucleoid
        structure with gene expression.
