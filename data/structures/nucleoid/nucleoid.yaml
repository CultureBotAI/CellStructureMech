identifier: GO:0009295
label: nucleoid
definition: The non-membrane-bounded subcellular region in which a bacterial chromosome
  is compacted and organized with nucleoid-associated proteins while remaining dynamically
  coupled to transcription and replication.
definition_source: DOI:10.1038/nrmicro2261
structure_category: NUCLEOID
structure_kind: SUBCELLULAR_REGION
components:
- component_id: chromosomal_dna
  label: chromosomal DNA
  component_type: DNA
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: The genome polymer whose compaction and spatial organization define the nucleoid.
  evidence:
  - reference: DOI:10.1038/nrmicro2261
    notes: Dorman reviews chromosome organization in the bacterial nucleoid.
- component_id: nucleoid_associated_proteins
  label: nucleoid-associated proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  role: Bend, bridge, wrap, and constrain DNA and couple chromosome structure to gene
    expression.
  evidence:
  - reference: DOI:10.1038/nrmicro2261
    notes: The review covers major NAP families and their regulatory roles.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
