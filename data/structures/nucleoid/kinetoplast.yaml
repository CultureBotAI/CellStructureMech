identifier: GO:0020023
label: kinetoplast
structure_category: NUCLEOID
structure_kind: SUBCELLULAR_REGION
definition: A sub-structure within the large single mitochondrion of kinetoplastid
  parasites and which is closely associated with the flagellar pocket and basal body
  of the flagellum.
definition_source: GO:0020023
mapping_status: PROPOSED
