  - node_id: kinetoplast_associated_proteins
    label: kinetoplast-associated proteins
    node_type: GENE_OR_PROTEIN
    component_ref: kinetoplast_associated_proteins
  - node_id: kinetoplast
    label: kinetoplast
    node_type: STRUCTURE
    grounding: GO:0020023
  edges:
  - subject: kdna_minicircles
    predicate: catenate into
    object: catenated_kdna_network
    description: Thousands of minicircles are topologically interlocked to form the
      major repeated DNA species in the kDNA network.
    evidence:
    - reference: DOI:10.1128/EC.1.4.495-502.2002
      notes: Lukes et al. 2002 review minicircle catenation in kinetoplast DNA networks.
  - subject: kdna_maxicircles
    predicate: catenate into
    object: catenated_kdna_network
    description: Dozens of maxicircles are interlocked with the minicircle network
      to carry the coding portion of the mitochondrial genome.
    evidence:
    - reference: DOI:10.1146/annurev-micro-092611-150057
      notes: Jensen and Englund 2012 review the network of catenated maxicircles and
        minicircles in kDNA.
  - subject: kinetoplast_associated_proteins
    predicate: compact
    object: catenated_kdna_network
    description: KAP proteins bind the kinetoplast DNA network and contribute to its
      condensed mitochondrial organization.
    evidence:
    - reference: DOI:10.1371/journal.pone.0187516
      notes: de Souza et al. 2017 localized kinetoplast-associated proteins to kDNA
        and expanded the known KAP repertoire.
  - subject: catenated_kdna_network
    predicate: condenses into
    object: kinetoplast
    description: The catenated mitochondrial DNA network forms the disk-shaped kinetoplast
      in the matrix of the single kinetoplastid mitochondrion.
    evidence:
    - reference: DOI:10.1128/EC.1.4.495-502.2002
      notes: Lukes et al. 2002 describe one kDNA network condensed into a disk-shaped
        kinetoplast.
