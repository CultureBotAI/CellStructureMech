discussions:
- discussion_id: generic_plastid_nucleoid_proteins
  prompt: Keep plastid nucleoid-associated proteins out of the generic record until
    an exact, source-neutral component family is curated.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#plastid_dna
  rationale: Plastid nucleoids are DNA-protein structures, but specific nucleoid-associated
    protein complements vary across plastid lineages and the Chlamydomonas HLP example
    already belongs on the exact chloroplast nucleoid child record. This generic plastid
    nucleoid record therefore curates plastid DNA and records the protein boundary
    as follow-up rather than guessing a broad InterPro, Pfam, or NCBIfam accession.
  evidence:
  - reference: GO:0042646
  - reference: DOI:10.1093/gbe/evv233
  - reference: DOI:10.1093/mp/ssp083
