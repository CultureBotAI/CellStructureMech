components:
- component_id: mitochondrial_dna
  label: mitochondrial DNA
  component_type: DNA
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Mitochondrial genome DNA packaged with DNA-binding proteins into nucleoprotein
    foci inside the mitochondrial matrix.
  evidence:
  - reference: DOI:10.1242/jcs.028605
    notes: Kucej et al. 2008 assayed Saccharomyces cerevisiae mitochondrial DNA organization
      in nucleoids under different metabolic states.
  - reference: DOI:10.1016/j.tcb.2007.08.007
    notes: Kucej and Butow 2007 review mitochondrial nucleoids as nucleoprotein structures
      that package and maintain mitochondrial DNA.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Mitochondrial DNA is an organellar genome molecule; no exact source-neutral
    Sequence Ontology CURIE was curated for this DNA component.
- component_id: mitochondrial_hmg_box_proteins
  label: mitochondrial HMG-box DNA-binding proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: High-mobility-group DNA-binding proteins represented by Saccharomyces cerevisiae
    Abf2 that bind and package mtDNA within mitochondrial nucleoids.
  evidence:
  - reference: DOI:10.1242/jcs.028605
    notes: Kucej et al. 2008 used ChIP-on-chip to show that Saccharomyces cerevisiae
      Abf2 binds most of the mitochondrial genome in vivo.
  - reference: DOI:10.1534/genetics.108.095786
    notes: Sia et al. 2009 studied loss of the abundant Saccharomyces cerevisiae mitochondrial
      nucleoid-associated protein Abf2p.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Saccharomyces cerevisiae Abf2 directly supports this component
    class, but no exact InterPro, Pfam, NCBIfam, or UniProt family CURIE was curated
    for a source-neutral mitochondrial HMG-box nucleoid protein component.
