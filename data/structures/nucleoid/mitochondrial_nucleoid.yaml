functions:
- function_id: mitochondrial_genome_maintenance
  label: mitochondrial genome maintenance
  description: The mitochondrial nucleoid packages mitochondrial DNA into matrix-localized
    nucleoprotein foci that support mtDNA organization and stability.
  evidence:
  - reference: DOI:10.1242/jcs.028605
    notes: Kucej et al. 2008 connected Abf2-mediated mtDNA packaging and metabolic
      remodeling with yeast mitochondrial nucleoid organization.
  - reference: DOI:10.1534/genetics.108.095786
    notes: Sia et al. 2009 showed that loss of yeast Abf2p destabilizes repetitive
      mitochondrial DNA.
