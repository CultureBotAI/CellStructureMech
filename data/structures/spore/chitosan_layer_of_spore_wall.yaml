functions:
- function_id: outer_ascospore_wall_maturation
  label: outer ascospore-wall maturation
  description: The chitosan layer forms the deacetylated chitin-containing surface
    beneath the dityrosine layer and contributes to construction of a rigid mature
    Saccharomyces ascospore wall.
  evidence:
  - reference: DOI:10.1074/jbc.271.49.31420
    notes: Christodoulidou et al. 1996 identified two sporulation-specific chitin
      deacetylase genes required for Saccharomyces ascospore-wall rigidity.
  - reference: DOI:10.1371/journal.pgen.1003700
    notes: Lin et al. 2013 tested the redundant Saccharomyces gene network that controls
      outer spore-wall assembly.
