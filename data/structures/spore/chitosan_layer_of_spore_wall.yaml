  title: Chitin deacetylation produces the chitosan layer of the ascospore wall
  description: In Saccharomyces cerevisiae, chitin deacetylases convert spore-wall
    chitin into chitosan, which forms the second outermost ascospore-wall layer between
    the inner layers and the dityrosine surface.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph records chitosan-layer composition, its topology, and the
    placement of Cda1/Cda2 in precursor modification without treating Chs3, Cda1,
    or Cda2 as mature-layer constituents.
