discussions:
- discussion_id: chitosan_chebi_scope
  prompt: Use CHEBI:16261 for the chitosan polymer constituent, not for the complete
    chitosan layer structure.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#chitosan
  rationale: CHEBI:16261 denotes the source-neutral chitosan polymer, whereas GO:0005631
    denotes the full Saccharomyces spore-wall layer made from chitosan.
  resolution_note: Grounded only the polysaccharide component to CHEBI:16261 and kept
    the record identity grounded to GO:0005631.
  evidence:
  - reference: CHEBI:16261
    notes: ChEBI term for the chitosan aminoglycan.
  - reference: GO:0005631
    notes: GO:0005631 identifies the complete chitosan layer of the Saccharomyces
      spore wall.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
- discussion_id: chitin_modification_enzyme_boundary
  prompt: Treat Chs3, Cda1, and Cda2 as chitosan-layer biosynthetic machinery rather
    than mature-layer constituents.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#chitosan
  - causal_graphs#saccharomyces_chitosan_layer_assembly
  rationale: Chs3 synthesizes chitin and Cda1/Cda2 modify chitin into chitosan for
    wall assembly, but the curated constituent is the resulting chitosan polymer rather
    than its biosynthetic enzymes.
  resolution_note: Left Chs3, Cda1, and Cda2 out of components and represented Cda1/Cda2
    only as upstream assembly machinery in the graph.
  evidence:
  - reference: DOI:10.1016/S0014-5793(99)01334-4
    notes: Christodoulidou et al. 1999 studied the Cda1 and Cda2 chitin deacetylase
      enzymes in ascospore-wall assembly.
  - reference: DOI:10.1128/MMBR.69.4.565-584.2005
    notes: Neiman 2005 reviews Chs3-dependent chitin synthesis followed by deacetylation
      to make the chitosan layer.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
