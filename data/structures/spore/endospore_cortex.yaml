components:
- component_id: endospore_cortex_peptidoglycan
  label: endospore cortex peptidoglycan
  component_type: PEPTIDOGLYCAN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Peptidoglycan is groundable broadly, but the chemically modified,
    loosely cross-linked muramic-delta-lactam cortex peptidoglycan layer does not
    have an exact source-neutral CHEBI or GO component term.
  role: Thick, modified peptidoglycan layer that holds the mature endospore core in
    a dehydrated, heat-resistant state and is cleaved during germination.
  evidence:
  - reference: DOI:10.1128/9781555819323.ch10
    notes: Setlow 2016 reviews modified cortex peptidoglycan as a determinant of core
      dehydration and wet-heat resistance.
