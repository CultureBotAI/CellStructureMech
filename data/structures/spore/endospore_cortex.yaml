- taxon_id: NCBITaxon:1239
  taxon_label: Bacillota
  presence: COMMON
  note: Endospore cortex is produced by endospore-forming Bacillota lineages and is
    lost from many non-sporulating members of the phylum.
  reference: DOI:10.1038/nrmicro2921
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
