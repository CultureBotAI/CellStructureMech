discussions:
- discussion_id: cortex_external_structure_boundary
  prompt: Keep the endospore cortex separate from the broader endospore external encapsulating
    structure.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0043595 denotes only the thick cortex layer, while GO:0043591 denotes
    the multilayered external structure containing the cortex, coat and outer membrane.
  resolution_note: Curated the cortex as an ENVELOPE_LAYER and linked it to GO:0043591
    with part_of.
  evidence:
  - reference: GO:0043595
    notes: GO:0043595 is the endospore cortex part term.
  - reference: GO:0043591
    notes: GO:0043591 identifies the containing endospore external encapsulating structure.
- discussion_id: cortex_peptidoglycan_grounding
  prompt: Find an exact source-neutral grounding for endospore cortex peptidoglycan.
  kind: CURATION_TODO
  status: OPEN
  rationale: The cortex is a peptidoglycan layer with characteristic chemical modifications,
    but its peptidoglycan constituent has no exact CHEBI, GO or other source-neutral
    family term in the curated identifier set.
  evidence:
  - reference: DOI:10.1128/9781555819323.ch10
    notes: Setlow 2016 reviews the modified peptidoglycan chemistry of the endospore
      cortex.
