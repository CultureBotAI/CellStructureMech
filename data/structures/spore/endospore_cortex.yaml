functions:
- function_id: spore_core_dehydration
  label: spore core dehydration
  description: The endospore cortex helps maintain low water content in the spore
    core, a major physical basis for wet-heat resistance.
  evidence:
  - reference: DOI:10.1128/9781555819323.ch10
    notes: Setlow 2016 reviews the cortex contribution to low core water content and
      endospore wet-heat resistance.
evidence:
- reference: GO:0043595
  notes: Gene Ontology cellular-component term for the endospore cortex.
- reference: GO:0043591
