functions:
- function_id: spore_wall_protection
  label: spore wall protection
  description: The exospore contributes to the thick wall that surrounds and protects
    extracellular microsporidian spores during host-to-host transmission.
  evidence:
  - reference: DOI:10.1002/pmic.200700584
    notes: Wu et al. 2008 describe microsporidian resistant spores as protected by
      a thick wall made of a glycoprotein-rich exospore and a chitin-rich endospore.
  - reference: DOI:10.1128/IAI.68.4.2268-2275.2000
    notes: Bohne et al. 2000 describe the rigid spore wall as surrounding the Encephalitozoon
      cuniculi spore and providing mechanical resistance.
