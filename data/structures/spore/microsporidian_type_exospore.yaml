discussions:
- discussion_id: microsporidian_exospore_vs_bacterial_exosporium
  prompt: Keep the microsporidian-type exospore separate from the bacterial exosporium.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: GO:0090642 denotes the outer layer of a microsporidian spore wall, whereas
    bacterial exosporia are optional outer layers of bacterial endospore coats that
    occur in a different spore architecture.
  evidence:
  - reference: GO:0090642
    notes: GO:0090642 explicitly scopes the exospore term to microsporidian spore
      walls.
  - reference: DOI:10.1038/nrmicro2921
    notes: McKenney et al. 2012 describe bacterial exosporia as loose outermost layers
      present in only some bacterial endospore species.
  posed_by: codex
  posed_date: '2026-09-12'
  resolved_date: '2026-09-12'
- discussion_id: ground_exospore_spore_wall_proteins
