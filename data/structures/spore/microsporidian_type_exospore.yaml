  rationale: This record models SWP1, SWP32 and NbSWP16 as an aggregate exospore protein
    cohort because known exospore-localized SWPs are lineage-specific and no exact
    source-neutral family term was curated. A follow-up pass should split and ground
    any exact InterPro, Pfam or NCBIfam families for individual SWP classes without
    collapsing unrelated exospore proteins.
  evidence:
