    notes: GO:0031321 defines ascospore-type prospore assembly as the encapsulation
      of each haploid nucleus by a double membrane.
evidence:
- reference: GO:1905754
  notes: 'Gene Ontology cellular-component term for ascospore-type prospore nucleus:
    Any nucleus that is part of a ascospore-type prospore.'
- reference: GO:0042764
  notes: 'Gene Ontology cellular-component term for ascospore-type prospore: An immature
    spore undergoing development. The spore usually consists of nucleic acid, prospore
    membrane(s) that encase the nucleic acid, and ultimately a cell wall that covers
    the membrane(s). This type of spore is observed in ascospore-forming fungi.'
