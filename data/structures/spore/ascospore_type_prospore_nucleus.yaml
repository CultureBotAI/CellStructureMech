  component_type: DNA
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Segregated haploid genome complement packaged into nuclear chromatin within
    each ascospore-type prospore following meiosis II nuclear lobe division.
  evidence:
  - reference: DOI:10.1083/jcb.140.1.29
    notes: Describes the engulfment of each haploid meiotic nuclear lobe by the growing
      prospore membrane during yeast sporulation.
- component_id: prospore_nuclear_envelope
