identifier: GO:1905754
label: ascospore-type prospore nucleus
structure_category: SPORE
structure_kind: MEMBRANE_BOUNDED_ORGANELLE
definition: Any nucleus that is part of a ascospore-type prospore. In sporulating
  Saccharomyces cerevisiae and Schizosaccharomyces pombe asci, each of the four haploid
  nuclear lobes generated by meiosis II is engulfed by an expanding prospore membrane
  nucleated at the meiotic outer plaque of the spindle pole body, partitioning one
  haploid ascospore-type prospore nucleus into each developing prospore.
definition_source: GO:1905754
