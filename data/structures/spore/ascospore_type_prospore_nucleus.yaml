functions:
- function_id: ascospore_type_prospore_assembly
  label: ascospore-type prospore assembly
  grounding: GO:0031321
  description: Expansion and closure of the prospore membrane encapsulate haploid
    meiotic nuclei to create immature ascospores.
  evidence:
