- discussion_id: dit1_dit2_component_boundary
  prompt: Treat Dit1 and Dit2 as precursor biosynthetic enzymes rather than dityrosine-layer
    constituents.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#dityrosine_containing_spore_wall_macromolecule
  - causal_graphs#saccharomyces_dityrosine_layer_assembly
  rationale: DIT1 and DIT2 encode sporulation-specific enzymes that synthesize soluble
    LL-dityrosine-containing precursors before incorporation into the wall, so they
    support the precursor-biosynthesis pathway rather than a mature-layer constituent
    call.
  resolution_note: Curated the dityrosine-containing macromolecule as the sole component
    in this first layer record and left Dit1/Dit2 out of components.
  evidence:
  - reference: DOI:10.1073/pnas.91.10.4524
    notes: Briza et al. 1994 showed that DIT1 and DIT2 produce soluble LL-dityrosine-containing
      spore-wall precursors.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
- discussion_id: saccharomyces_dityrosine_isp3_boundary
  prompt: Keep the Saccharomyces dityrosine layer separate from the Schizosaccharomyces
    Isp3 layer.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: GO:0005630 denotes the Saccharomyces dityrosine layer, whereas GO:1990916
    denotes the Schizosaccharomyces pombe Isp3 spore-wall layer.
  resolution_note: Curated GO:0005630 as its own Saccharomyces-focused record and
    left GO:1990916 in the existing Isp3 layer record.
  evidence:
  - reference: GO:0005630
    notes: GO:0005630 identifies the Saccharomyces dityrosine layer.
  - reference: GO:1990916
    notes: GO:1990916 identifies the Schizosaccharomyces pombe Isp3 layer.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
