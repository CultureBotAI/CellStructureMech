causal_graphs:
- graph_id: saccharomyces_ascospore_wall_layers
  title: Inner polysaccharides and outer layers build a resistant ascospore wall
  description: In budding yeast, mannan- and glucan-rich inner layers are covered
    by a chitosan layer and a dityrosine-rich outer layer to build a multilaminar
    ascospore wall that surrounds the spore plasma membrane and protects the dormant
    spore.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph records established Saccharomyces layer topology and stress-barrier
    function without asserting the full redundant outer-wall assembly network or treating
    Schizosaccharomyces Isp3 layers as identical to budding-yeast layers.
  nodes:
  - node_id: prospore_membrane
    label: prospore membrane
    node_type: STRUCTURE
    grounding: GO:0005628
  - node_id: inner_wall_polysaccharides
    label: ascospore inner-wall mannan and beta-glucan layers
    node_type: CHEMICAL
    component_ref: inner_wall_polysaccharides
  - node_id: chitosan_outer_layer
    label: chitosan
    node_type: CHEMICAL
    component_ref: chitosan_outer_layer
  - node_id: chitosan_layer
    label: chitosan layer of spore wall
    node_type: STRUCTURE
    grounding: GO:0005631
  - node_id: dityrosine_rich_outer_layer
    label: ascospore wall dityrosine-rich outer layer
    node_type: CHEMICAL
    component_ref: dityrosine_rich_outer_layer
  - node_id: ascospore_wall
    label: ascospore wall
    node_type: STRUCTURE
    grounding: GO:0005619
  - node_id: spore_stress_resistance
    label: spore environmental stress resistance
    node_type: CAPACITY
  edges:
  - subject: prospore_membrane
    predicate: templates deposition of
    object: ascospore_wall
    description: During Saccharomyces sporulation, ascospore-wall material is deposited
      between the leaflets of the closed prospore membrane.
    evidence:
    - reference: GO:0030476
      notes: GO:0030476 defines ascospore wall assembly as deposition of wall components
        in the lumenal space between the outer and inner prospore-membrane leaflets.
  - subject: inner_wall_polysaccharides
    predicate: assemble into
    object: ascospore_wall
    description: Inner mannan- and beta-glucan-rich layers form the basal layers of
      the Saccharomyces ascospore wall.
    evidence:
    - reference: GO:0005632
      notes: GO:0005632 denotes either of the two innermost Saccharomyces spore-wall
        layers.
    - reference: DOI:10.1128/MMBR.69.4.565-584.2005
      notes: Neiman 2005 reviews Saccharomyces ascospore-wall layers and their deposition
        after prospore-membrane closure.
  - subject: chitosan_outer_layer
    predicate: forms
    object: chitosan_layer
    description: Chitosan polymer material forms the second outermost Saccharomyces
      ascospore-wall layer.
    evidence:
    - reference: CHEBI:16261
      notes: ChEBI term for chitosan.
    - reference: GO:0005631
      notes: GO:0005631 identifies the complete chitosan layer as the second outermost
        Saccharomyces spore-wall layer.
    - reference: DOI:10.1128/MMBR.69.4.565-584.2005
      notes: Neiman 2005 reviews chitosan as the Saccharomyces ascospore-wall layer
        beneath the dityrosine layer.
  - subject: chitosan_layer
    predicate: overlies
    object: inner_wall_polysaccharides
    description: The chitosan layer is positioned outside the two inner Saccharomyces
      spore-wall layers.
    evidence:
    - reference: GO:0005631
      notes: GO:0005631 defines the chitosan layer as the second outermost Saccharomyces
        spore-wall layer.
    - reference: GO:0005632
      notes: GO:0005632 defines the inner layers as the two innermost Saccharomyces
        spore-wall layers.
  - subject: dityrosine_rich_outer_layer
    predicate: overlies
    object: chitosan_layer
    description: The dityrosine-rich layer forms the outermost layer over the chitosan
      layer in the Saccharomyces ascospore wall.
    evidence:
    - reference: GO:0005630
      notes: GO:0005630 defines the dityrosine layer as the outermost Saccharomyces
        spore-wall layer.
    - reference: GO:0005631
      notes: GO:0005631 places the chitosan layer immediately under the outermost
        Saccharomyces dityrosine layer.
    - reference: DOI:10.1371/journal.pgen.1003700
      notes: Lin et al. 2013 studied genes controlling Saccharomyces outer spore-wall
        assembly.
  - subject: ascospore_wall
    predicate: provides
    object: spore_stress_resistance
    description: The mature ascospore wall protects dormant spores from environmental
      insults.
    evidence:
    - reference: DOI:10.1128/MMBR.69.4.565-584.2005
      notes: Neiman 2005 reviews the mature spore wall as a source of environmental
        stress resistance.
    - reference: DOI:10.1371/journal.pone.0002873
      notes: Coluccio et al. 2008 showed that the yeast spore wall enables survival
        through the Drosophila digestive tract.
discussions:
- discussion_id: ascospore_layer_record_boundary
  prompt: Decide when to split Saccharomyces ascospore-wall layers into standalone
    records.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - has_part
  - causal_graphs#saccharomyces_ascospore_wall_layers
  rationale: GO has an exact cellular-component term for the Saccharomyces inner spore-wall
    layers. GO:1990916, GO:0005630, and GO:0005631 now have standalone records; the
    remaining exact Saccharomyces layer term remains linked here by has_part but awaits
    separate focused curation.
  evidence:
  - reference: GO:0005632
    notes: GO:0005632 denotes the inner layer of the Saccharomyces spore wall.
- discussion_id: ascospore_wall_polymer_grounding
  prompt: Resolve exact source-neutral component groundings for the ascospore-wall
    polysaccharides and dityrosine-rich outer material.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#inner_wall_polysaccharides
  - components#dityrosine_rich_outer_layer
  rationale: The remaining ungrounded mannan/glucan and dityrosine-rich material labels
    are reviewed but ungrounded until exact CHEBI or polymer identifiers can be confirmed;
    the chitosan polymer component is now grounded to CHEBI:16261.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1003700
    notes: Lin et al. 2013 studied Saccharomyces outer spore-wall assembly without
      defining source-neutral polymer CURIEs for every ascospore-wall material.
  - reference: CHEBI:16261
    notes: ChEBI term for the chitosan polymer.
