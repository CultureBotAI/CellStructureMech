components:
- component_id: inner_wall_polysaccharides
  label: ascospore inner-wall mannan and beta-glucan layers
  component_type: POLYSACCHARIDE
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0005632 denotes the inner spore-wall layers, but no exact source-neutral
    CHEBI term was curated for the ascospore-specific mixture of inner mannan and
    beta-glucan polymers.
  role: Innermost mannan-rich and beta-glucan-rich polysaccharide layers that form
    the basal wall underneath the chitosan and dityrosine-rich outer layers.
  evidence:
  - reference: GO:0005632
    notes: GO:0005632 identifies the two innermost Saccharomyces spore-wall layers.
  - reference: DOI:10.1128/MMBR.69.4.565-584.2005
    notes: Neiman 2005 reviews assembly of the multilaminar Saccharomyces cerevisiae
      ascospore wall.
- component_id: chitosan_outer_layer
  label: chitosan
  component_type: POLYSACCHARIDE
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Chitosan polymer material in the Saccharomyces ascospore wall, positioned
    below the dityrosine-rich surface.
  evidence:
  - reference: CHEBI:16261
    notes: ChEBI term for chitosan.
  - reference: GO:0005631
    notes: GO:0005631 identifies the complete chitosan layer as the second outermost
      Saccharomyces spore-wall layer.
  - reference: DOI:10.1016/S0014-5793(99)01334-4
    notes: Christodoulidou et al. 1999 studied Saccharomyces Cda1/Cda2 chitin deacetylases
      and their role in ascospore-wall assembly.
  grounding: CHEBI:16261
- component_id: dityrosine_rich_outer_layer
  label: ascospore wall dityrosine-rich outer layer
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0005630 denotes the whole dityrosine layer, while the outer
    layer contains a dityrosine-bearing macromolecular material whose exact source-neutral
    component boundary was not curated in this pass.
  role: Outermost dityrosine-containing layer of the Saccharomyces ascospore wall
    that contributes to the resistant spore surface.
  evidence:
  - reference: GO:0005630
    notes: GO:0005630 identifies the dityrosine layer as the outermost Saccharomyces
      spore-wall layer.
  - reference: DOI:10.1371/journal.pgen.1003700
    notes: Lin et al. 2013 analyzed assembly of the Saccharomyces outer spore wall,
      including the dityrosine layer.
taxonomic_distribution:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  presence: COMMON
  note: Budding yeast builds an ascospore wall around each haploid spore during meiosis
    and sporulation; this species-level scope avoids asserting that Saccharomyces
    layer chemistry is identical across all ascospore-forming fungi.
  reference: DOI:10.1128/MMBR.69.4.565-584.2005
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Budding-yeast model for prospore-membrane closure, spore-wall polymer deposition,
    and chitosan/dityrosine outer-wall assembly.
  reference: DOI:10.1128/MMBR.69.4.565-584.2005
functions:
- function_id: ascospore_stress_barrier
  label: ascospore environmental stress barrier
  description: The mature ascospore wall surrounds the spore plasma membrane and protects
    the dormant spore from environmental stresses.
  evidence:
  - reference: DOI:10.1128/MMBR.69.4.565-584.2005
    notes: Neiman 2005 reviews the mature Saccharomyces spore wall as a multilaminar
      wall that provides environmental stress resistance.
  - reference: DOI:10.1371/journal.pone.0002873
    notes: Coluccio et al. 2008 tested Saccharomyces ascospore survival after passage
      through the Drosophila digestive tract.
evidence:
