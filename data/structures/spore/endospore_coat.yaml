  grounding_notes: The bacterial endospore coat is assembled from many unrelated protein
    families in basement, inner-coat, outer-coat, and crust layers; no single InterPro,
    Pfam, NCBIfam, GO, or Complex Portal term was curated that denotes the whole source-neutral
    coat protein cohort.
  role: Morphogenetic and structural proteins that assemble into the multilayered
    coat shell outside the cortex, including the SpoIVA basement layer and SafA/CotE-organized
    inner and outer layers.
  evidence:
