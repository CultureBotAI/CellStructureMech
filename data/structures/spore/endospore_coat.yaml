components:
- component_id: coat_protein_cohort
  label: endospore coat proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - spoIVA
  - safA
  - cotE
  stoichiometry: dozens of proteins in Bacillus subtilis
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The bacterial endospore coat is assembled from many unrelated protein
    families in basement, inner-coat, outer-coat, and crust layers; no single InterPro,
    Pfam, NCBIfam, GO, or Complex Portal term was curated that denotes the whole source-neutral
    coat protein cohort.
  role: Morphogenetic and structural proteins that assemble into the multilayered
    coat shell outside the cortex, including the SpoIVA basement layer and SafA/CotE-organized
    inner and outer layers.
  evidence:
  - reference: DOI:10.1038/nrmicro2921
    notes: McKenney, Driks and Eichenberger 2012 review the Bacillus subtilis coat's
      basement, inner, outer, and crust layers and the SpoIVA, SafA, and CotE morphogenetic
      proteins that organize coat assembly.
  - reference: PMID:3139490
    notes: Zheng et al. identified CotE as a morphogenetic protein needed to assemble
      the outer Bacillus subtilis spore coat.
taxonomic_distribution:
- taxon_id: NCBITaxon:1239
  taxon_label: Bacillota
  presence: COMMON
  note: Endospore coats occur in endospore-forming Bacillota lineages as a mature-spore
    surface layer, with many non-sporulating Bacillota lacking the structure.
  reference: DOI:10.1038/nrmicro2921
canonical_examples:
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: Classical model for the proteinaceous endospore coat layers organized by SpoIVA,
    SafA, CotE, and other coat morphogenetic proteins.
  reference: DOI:10.1038/nrmicro2921
functions:
- function_id: coat_permeability_barrier
  label: endospore coat permeability barrier
  description: The multilayered endospore coat restricts lytic enzymes and large toxic
    molecules from accessing the dormant spore interior.
  evidence:
  - reference: DOI:10.1038/nrmicro2921
    notes: McKenney, Driks and Eichenberger 2012 review the bacterial endospore coat
      as a protective barrier outside the cortex.
  - reference: GO:0043593
    notes: GO:0043593 defines the endospore coat as impermeable to many toxic molecules.
evidence:
- reference: GO:0043593
  notes: Gene Ontology cellular-component term for the endospore coat.
- reference: GO:0043591
  notes: Gene Ontology cellular-component term for the endospore external encapsulating
    structure that contains the coat.
- reference: DOI:10.1038/nrmicro2921
  notes: 'McKenney, Driks and Eichenberger 2012, The Bacillus subtilis endospore:
    assembly and functions of the multilayered coat, Nature Reviews Microbiology.'
- reference: PMID:3139490
  notes: Zheng et al. 1988 identified CotE as a morphogenetic protein needed for Bacillus
    subtilis outer spore-coat assembly.
