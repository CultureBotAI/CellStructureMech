identifier: GO:0043593
label: endospore coat
structure_category: SPORE
structure_kind: ENVELOPE_LAYER
definition: The layer in a bacterial endospore that lies under the exosporium, and
  is impermeable to many toxic molecules. The coat may also contain enzymes that are
  involved in endospore germination.
