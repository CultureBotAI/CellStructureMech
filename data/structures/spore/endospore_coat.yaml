discussions:
- discussion_id: coat_layer_boundary
  prompt: Keep the endospore coat separate from the broader endospore external encapsulating
    structure.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0043593 denotes the proteinaceous endospore coat layer, whereas GO:0043591
    denotes the broader external encapsulating structure that also includes the cortex
    and outer endospore membrane.
  resolution_note: Curated GO:0043593 as the coat layer and linked it to GO:0043591
    with part_of.
  evidence:
  - reference: GO:0043593
    notes: GO:0043593 is the endospore coat part term.
  - reference: GO:0043591
    notes: GO:0043591 identifies the larger endospore external encapsulating structure.
