identifier: GO:0042601
label: endospore-forming forespore
structure_category: SPORE
structure_kind: SUBCELLULAR_REGION
definition: Portion of the cell formed during the process of bacterial sporulation
  that will ultimately become the core of the endospore. An endospore is a type of
  dormant cell that is resistant to adverse conditions.
definition_source: GO:0042601
mapping_status: PROPOSED
