causal_graphs:
- graph_id: asymmetric_septation_creates_forespore
  title: Asymmetric septation creates the forespore
  description: During Bacillus subtilis sporulation, polar septation partitions the
    developing cell into a small forespore compartment and a larger mother-cell compartment.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the compartment topology created by asymmetric division
    and leaves the SpoIIE, SpoIIQ, SpoIIIA and SpoIIIE protein networks that drive
    signaling and engulfment to a dedicated mechanistic sporulation pass.
  nodes:
  - node_id: asymmetric_polar_septum
    label: asymmetric polar septum
    node_type: STRUCTURE
  - node_id: endospore_forming_forespore
    label: endospore-forming forespore
    node_type: STRUCTURE
    grounding: GO:0042601
  edges:
  - subject: asymmetric_polar_septum
    predicate: delimits
    object: endospore_forming_forespore
    description: The asymmetric polar septum separates the smaller forespore from
      the larger mother-cell compartment during early endospore formation.
    evidence:
    - reference: uniprot.location:SL-0119
      notes: UniProt SL-0119 describes sporulation as forming an asymmetrically positioned
        septum that divides the developing cell into forespore and mother-cell compartments.
    - reference: DOI:10.1016/j.cub.2005.02.041
      notes: Ramamurthi and Losick 2005 review protein localization to the Bacillus
        subtilis forespore during sporulation.
discussions:
- discussion_id: bacterial_forespore_scope
  prompt: Keep the bacterial forespore separate from the broader intracellular immature
    spore and from ascospore-type prospore records.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0042601 specifically denotes the bacterial sporulation compartment
    that becomes an endospore core, whereas GO:0042763 also parents fungal ascospore-type
    prospores and the existing GO:0005628 prospore membrane record is a yeast double-membrane
    structure.
  resolution_note: Curated the exact bacterial GO:0042601 forespore rather than the
    GO:0042763 intracellular-immature-spore umbrella or the yeast ascospore-type prospore.
  evidence:
  - reference: GO:0042601
    notes: GO:0042601 denotes the bacterial endospore-forming forespore.
  - reference: GO:0042763
    notes: GO:0042763 is the broader intracellular immature spore parent.
  - reference: GO:0042764
    notes: GO:0042764 is the sibling ascospore-type prospore term.
