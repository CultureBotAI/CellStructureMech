  rationale: GO:1990916 denotes the Schizosaccharomyces pombe Isp3 layer, whereas
    GO:0005631 and GO:0005630 denote Saccharomyces chitosan and dityrosine spore-wall
    layers.
  resolution_note: Curated GO:1990916 as its own Schizosaccharomyces-focused record,
    linked it to the broad ascospore wall by part_of, and left the Saccharomyces layers
    for separate records.
