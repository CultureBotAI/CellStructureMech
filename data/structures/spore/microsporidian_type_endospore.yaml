taxonomic_distribution:
- taxon_id: NCBITaxon:6029
  taxon_label: Microsporidia
  presence: COMMON
  note: Microsporidian spores have a thick wall made of an outer exospore and a chitin-containing
    inner endospore; this scope is tied to the spore stage.
  reference: DOI:10.1016/j.ijpara.2005.10.005
canonical_examples:
- taxon_id: NCBITaxon:27978
  taxon_label: Nosema bombycis
