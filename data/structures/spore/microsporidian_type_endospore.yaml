discussions:
- discussion_id: microsporidian_vs_bacterial_endospore
  prompt: Keep the microsporidian-type endospore separate from the bacterial endospore
    external encapsulating structure.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: Microsporidian biology uses endospore for a chitin-rich inner spore-wall
    layer, whereas GO:0043591 denotes a bacterial external encapsulating structure
    containing cortex, coat and sometimes exosporium layers.
  evidence:
  - reference: GO:0090641
    notes: The GO:0090641 term comment explicitly distinguishes the microsporidian
      endospore from bacterial endospore structures.
  posed_by: codex
  posed_date: '2026-09-12'
  resolved_date: '2026-09-12'
