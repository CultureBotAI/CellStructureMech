functions:
- function_id: spore_wall_protection
  label: spore wall protection
  description: The endospore contributes to the thick wall that protects extracellular
    microsporidian spores during transmission between host cells.
  evidence:
  - reference: DOI:10.1016/j.ijpara.2005.10.005
    notes: Peuvel-Fanget et al. 2006 describe environmentally resistant microsporidian
      spores with a rigid wall composed of an exospore and chitin-rich endospore.
  - reference: DOI:10.1128/IAI.01225-09
    notes: Polonais et al. 2010 describe the infective resistance stage as a microsporidian
      spore protected by a thick wall whose inner layer is the chitin- and protein-containing
      endospore.
evidence:
