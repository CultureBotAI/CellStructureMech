  - node_id: endospore_cortex
    label: endospore cortex
    node_type: STRUCTURE
    grounding: GO:0043595
  - node_id: low_core_water_content
    label: low core water content
    node_type: STATE
  edges:
  - subject: spore_inner_membrane
    predicate: surrounds
    object: endospore_core
    description: The spore inner membrane surrounds the endospore core and separates
      it from the mature-spore exterior.
    evidence:
    - reference: GO:0140549
      notes: GO:0140549 defines the spore inner membrane by its position around the
        endospore core.
  - subject: endospore_cortex
    predicate: lies outside
    object: spore_inner_membrane
    description: The endospore cortex is a layer outside the spore inner membrane
      in the mature Bacillus endospore.
    evidence:
    - reference: DOI:10.1038/nrmicro2921
      notes: McKenney, Driks and Eichenberger 2012 review the Bacillus subtilis endospore
        as a layered core, cortex, and coat structure.
  - subject: endospore_cortex
    predicate: maintains
    object: low_core_water_content
    description: Modified cortex peptidoglycan helps maintain low water content in
      the dormant spore core enclosed by the inner membrane.
    evidence:
    - reference: DOI:10.1128/9781555819323.ch10
      notes: Setlow 2016 reviews the cortex contribution to spore core dehydration.
discussions:
- discussion_id: inner_membrane_scope
  prompt: Keep the spore inner membrane separate from the generic UniProt Spore membrane
    location, the forespore membrane, the outer endospore membrane, and non-bacterial
    prospore membranes.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0140549 denotes the bacterial membrane surrounding the endospore core,
    GO:0043594 denotes the separate outer endospore membrane between cortex and coat,
    GO:0005628 denotes a fungal ascospore-type prospore membrane, and UniProt SL-0363
    is a broader spore membrane location without a GO mapping.
  resolution_note: Curated the exact GO:0140549 spore inner membrane record, used
    GO:0016020 as its membrane parent, and retained SL-0363 only as broad synonym
    and record-level evidence provenance.
  evidence:
  - reference: GO:0140549
    notes: GO:0140549 is the bacterial spore inner membrane term.
  - reference: GO:0043594
    notes: GO:0043594 is the separate outer endospore membrane term.
  - reference: GO:0005628
    notes: GO:0005628 is the fungal prospore membrane term.
  - reference: uniprot.location:SL-0363
    notes: UniProt SL-0363 is a generic Spore membrane location.
