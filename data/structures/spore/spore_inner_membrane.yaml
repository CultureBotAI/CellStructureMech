discussions:
- discussion_id: inner_membrane_scope
  prompt: Keep the spore inner membrane separate from the generic UniProt Spore membrane
    location, the forespore membrane, the outer endospore membrane, and non-bacterial
    prospore membranes.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0140549 denotes the bacterial membrane surrounding the endospore core,
    GO:0043594 denotes the separate outer endospore membrane between cortex and coat,
    GO:0005628 denotes a fungal ascospore-type prospore membrane, and UniProt SL-0363
    is a broader spore membrane location without a GO mapping.
  resolution_note: Curated the exact GO:0140549 spore inner membrane record, used
    GO:0016020 as its membrane parent, retained the GO broad synonym, and kept SL-0363
    only as record-level evidence provenance.
  evidence:
  - reference: GO:0140549
    notes: GO:0140549 is the bacterial spore inner membrane term.
  - reference: GO:0043594
    notes: GO:0043594 is the separate outer endospore membrane term.
  - reference: GO:0005628
    notes: GO:0005628 is the fungal prospore membrane term.
  - reference: uniprot.location:SL-0363
    notes: UniProt SL-0363 is a generic Spore membrane location.
