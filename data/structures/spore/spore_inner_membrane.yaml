causal_graphs:
- graph_id: spore_inner_membrane_core_boundary
  title: Spore inner membrane bounds the endospore core
  description: The spore inner membrane encloses the dormant endospore core. The endospore
    cortex lies outside that inner membrane and helps maintain low water content in
    the core.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records mature-spore layer topology and dehydration context
    rather than the developmental membrane remodeling that produces the final inner
    and outer spore membranes.
