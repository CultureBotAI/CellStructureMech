      notes: Moreno-Borchart et al. 2001 tied LEP coat assembly to formation of the
        growing prospore membrane.
    - reference: GO:0070056
      notes: GO:0070056 describes a protein-coated leading-edge region on the prospore
        membrane.
  - subject: prospore_membrane
