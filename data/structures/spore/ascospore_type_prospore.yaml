causal_graphs:
- graph_id: ascospore_type_prospore_mechanism
  title: Ascospore-type prospore formation via spindle pole body vesicle fusion
  description: Meiotic outer plaque assembly at the spindle pole body recruits Spo20p
    SNARE complexes, septins, and the Don1p leading-edge coat to expand the prospore
    membrane around each haploid nucleus and close the ascospore-type prospore.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph summarizes where the membrane initiates and where the leading-edge
    coat localizes without asserting the full SNARE, phospholipase D, septin, or spindle-pole-body
    remodeling pathway.
