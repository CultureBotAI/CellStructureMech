identifier: GO:0042764
label: ascospore-type prospore
structure_category: SPORE
structure_kind: SUBCELLULAR_REGION
definition: An immature spore undergoing development. The spore usually consists of
  nucleic acid, prospore membrane(s) that encase the nucleic acid, and ultimately
  a cell wall that covers the membrane(s). This type of spore is observed in ascospore-forming
  fungi. The nascent intracellular spore compartment formed during meiosis II in ascomycete
  yeasts such as Saccharomyces cerevisiae and Schizosaccharomyces pombe before spore
  wall maturation. Each ascospore-type prospore is delimited by the double-layered
  prospore membrane that grows from the spindle pole body to engulf a haploid nucleus
  and maternal cytoplasm.
