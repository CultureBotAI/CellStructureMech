  note: Exhibits ascospore-type prospore (GO:0042764) in ascospore-type prospore engulfment
    and morphogenesis. Budding yeast builds prospore membranes during the sporulation
    program; this species-level scope avoids asserting conservation of the membrane
    or leading-edge protein set across all ascospore-forming fungi.
