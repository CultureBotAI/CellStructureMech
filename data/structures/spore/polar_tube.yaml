causal_graphs:
- graph_id: polar_tube_eversion_and_cargo_delivery
  title: Polar tube eversion opens a conduit from the spore
  description: The dormant spore stores the tube in a compact polar-filament state.
    Germination ejects and everts the tube, creating a conduit that carries sporoplasm
    cargo out of the spore.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
