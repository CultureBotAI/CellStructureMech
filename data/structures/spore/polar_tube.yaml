synonyms:
- synonym_text: polar filament
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1186/s13071-023-05908-9
components:
- component_id: polar_tube_proteins
  label: polar tube proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Lineage-specific structural proteins that build the compact polar filament
    in the dormant spore and the everted polar tube after germination.
  evidence:
  - reference: DOI:10.1016/j.ijpara.2005.04.003
    notes: Xu and Weiss 2005 reviewed PTP1, PTP2 and PTP3 as identified protein constituents
      of the microsporidian polar tube.
  - reference: DOI:10.1016/j.jprot.2022.104617
    notes: Lv et al. 2022 compared Nosema bombycis polar filaments and everted polar
      tubes by proteomic profiling.
  - reference: DOI:10.1371/journal.pbio.3002533
    notes: Sharma et al. 2024 combined cryo-electron tomography with affinity purification
      and mass spectrometry of germinated microsporidian polar tubes.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The polar tube wall is assembled from several divergent microsporidian
    PTPs; no exact source-neutral family or complex term was assigned for the aggregate
    PTP set.
taxonomic_distribution:
- taxon_id: NCBITaxon:6029
  taxon_label: Microsporidia
  presence: COMMON
  note: The polar tube is a defining invasion apparatus of microsporidian spores;
    this scope is tied to the spore stage, not every vegetative cell.
  reference: DOI:10.1186/s13071-023-05908-9
canonical_examples:
- taxon_id: NCBITaxon:27978
  taxon_label: Nosema bombycis
  note: Silkworm-infecting microsporidian in which proteomic profiles of compact polar
    filaments and everted polar tubes were compared.
  reference: DOI:10.1016/j.jprot.2022.104617
functions:
- function_id: host_cell_invasion
  label: host cell invasion
  description: The polar tube rapidly everts from the spore, penetrates or apposes
    the host-cell surface and establishes the route used to initiate infection.
  evidence:
  - reference: DOI:10.1016/j.ijpara.2005.04.003
    notes: Xu and Weiss 2005 reviewed polar-tube discharge and host-cell invasion
      by microsporidian spores.
  - reference: DOI:10.1186/s13071-023-05908-9
    notes: Chen et al. 2023 reviewed polar-tube origin, structure, composition and
      function in microsporidia.
- function_id: sporoplasm_delivery
  label: sporoplasm delivery
  description: After firing, the everted tube acts as a narrow conduit for microsporidian
    sporoplasm and associated cargo released from the spore.
  evidence:
  - reference: DOI:10.1128/mbio.02749-23
    notes: Lv et al. 2024 visualized polaroplast-derived membranes moving through
      fired Nosema bombycis polar tubes during sporoplasm membrane formation.
  - reference: DOI:10.1371/journal.pbio.3002533
    notes: Sharma et al. 2024 imaged cargo-containing states of Vairimorpha necatrix
      polar tubes during germination by cryo-electron tomography.
