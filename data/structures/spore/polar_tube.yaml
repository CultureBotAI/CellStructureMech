    description: Environmental stimulation of a microsporidian spore triggers extrusion
      and eversion of the compact polar filament into the fired polar tube.
    evidence:
    - reference: DOI:10.1186/s13071-023-05908-9
      notes: Chen et al. 2023 reviewed the transition from polar filament to discharged
        polar tube.
    - reference: DOI:10.1371/journal.pbio.3002533
      notes: Sharma et al. 2024 captured Vairimorpha necatrix polar-tube states during
        germination.
  - subject: polar_tube
    predicate: conducts
    object: sporoplasm
    description: The everted tube provides the path used by the sporoplasm as it leaves
      the fired spore.
    evidence:
    - reference: DOI:10.1016/j.ijpara.2005.04.003
      notes: Xu and Weiss 2005 reviewed the tube as the route for sporoplasm passage
        into a new host cell.
    - reference: DOI:10.1371/journal.pbio.3002533
      notes: Sharma et al. 2024 imaged cargo-containing polar tubes during Vairimorpha
        necatrix germination.
