identifier: GO:0044099
label: polar tube
structure_category: SPORE
structure_kind: FILAMENT
definition: A microsporidian invasion tube that is coiled inside the spore as the
  polar filament and rapidly everts from the anterior pole during germination, forming
  a conduit for the sporoplasm toward a host cell.
definition_source: GO:0044099
mapping_status: PROPOSED
