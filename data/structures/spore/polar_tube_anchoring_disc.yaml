functions:
- function_id: polar_tube_attachment
  label: polar tube attachment
  description: The anchoring disc attaches the intracellular polar tube to the inside
    of the anterior spore wall, positioning the tube for apical release during germination.
  evidence:
  - reference: GO:0160202
    notes: GO:0160202 defines the polar tube anchoring disc as the anterior invasion-apparatus
      component that attaches the polar tube to the inside of the spore wall.
  - reference: DOI:10.1016/j.ijpara.2005.04.003
    notes: Xu and Weiss 2005 reviewed polar-tube attachment and discharge as part
      of microsporidian spore invasion.
