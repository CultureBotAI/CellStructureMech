discussions:
- discussion_id: mature_spore_outer_membrane_boundary
  prompt: Keep the mature outer endospore membrane separate from developmental forespore
    membrane annotations.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0043594 and UniProt SL-0365 denote the mature bacterial spore outer
    membrane, whereas forespore inner and outer membranes are developmental localizations
    in the smaller compartment of a sporulating cell.
  resolution_note: Curated only the mature outer endospore membrane and used the UniProt
    SL-0365 Spore outer membrane xref.
  evidence:
  - reference: GO:0043594
    notes: GO:0043594 denotes the outer membrane around a bacterial endospore.
  - reference: uniprot.location:SL-0365
    notes: UniProt SL-0365 is scoped to mature bacterial spores rather than forespores
      during sporulation.
- discussion_id: outer_endospore_membrane_lipid_grounding
  prompt: Find an exact source-neutral grounding for outer endospore membrane lipids.
  kind: CURATION_TODO
  status: OPEN
  rationale: The membrane is groundable as a GO cellular component, but no exact generic
    lipid, CHEBI, GO, or membrane-composition term for its mature-spore bilayer was
    curated.
  evidence:
  - reference: GO:0043594
    notes: GO:0043594 identifies the membrane structure, not a specific lipid composition.
