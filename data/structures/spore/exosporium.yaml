components:
- component_id: exosporium_protein_cohort
  label: exosporium proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - bclA
  - bxpB
  - exsY
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Bacillus cereus-group exosporium is a basal-layer shell plus
    a BclA-rich external nap built from multiple unrelated proteins; no single source-neutral
    InterPro, Pfam, NCBIfam, GO, or Complex Portal term was curated that denotes the
    whole exosporium protein cohort.
  role: Protein constituents of the crystalline basal layer and external hairlike
    nap that make up the Bacillus exosporium surface.
  evidence:
  - reference: DOI:10.1128/MMBR.00050-15
    notes: Stewart 2015 reviews the Bacillus cereus-group exosporium as a basal shell
      carrying an external nap whose principal collagen-like glycoprotein is BclA,
      and discusses BxpB and ExsY as exosporium structural proteins.
  - reference: DOI:10.1111/mmi.13650
    notes: Terry et al. 2017 biochemically dissected Bacillus cereus exosporium architecture
      and related ExsY, BclA, and ExsFA/BxpB to basal-layer and nap assembly.
taxonomic_distribution:
- taxon_id: NCBITaxon:1239
  taxon_label: Bacillota
  presence: VARIABLE
  note: Bacterial exosporia are a patchy outer-spore layer best characterized in Bacillus
    cereus-group species, present in selected spore-forming Bacillota and absent from
    Bacillus subtilis spores.
  reference: DOI:10.1128/MMBR.00050-15
canonical_examples:
- taxon_id: NCBITaxon:1392
  taxon_label: Bacillus anthracis
  note: Bacillus cereus-group model whose mature spores carry a loose basal-layer
    and nap exosporium used for exosporium assembly and surface-architecture studies.
  reference: DOI:10.1128/MMBR.00050-15
functions:
- function_id: spore_surface_interface
  label: outer spore surface interface
  description: The exosporium forms the outermost surface of exosporium-bearing bacterial
    endospores and presents a semipermeable layer for environmental and host interactions.
  evidence:
  - reference: DOI:10.1128/MMBR.00050-15
    notes: Stewart 2015 reviews the bacterial exosporium as the outer spore layer
      that interacts with the environment and, in pathogens, host innate-immune surfaces.
  - reference: DOI:10.1111/mmi.13650
    notes: Terry et al. 2017 connect Bacillus cereus-group exosporium basal-layer
      architecture with surface exposure, semipermeability, and channels through the
      layer.
evidence:
- reference: GO:0043592
  notes: Gene Ontology cellular-component term for the bacterial endospore exosporium.
- reference: GO:0005618
  notes: Gene Ontology cellular-component term for cell wall; GO places the exosporium
    as part of a cell wall.
- reference: GO:0043593
  notes: Gene Ontology cellular-component term for the endospore coat beneath the
    exosporium.
- reference: GO:0090642
  notes: Gene Ontology cellular-component term for the distinct microsporidian-type
    exospore.
- reference: uniprot.location:SL-0367
  notes: UniProt Subcellular Location SL-0367 is a generic Perispore location spanning
    bacterial and eukaryotic spores; it is retained as record-level boundary evidence,
    not as an exact xref.
- reference: DOI:10.1128/MMBR.00050-15
  notes: 'Stewart 2015, The Exosporium Layer of Bacterial Spores: a Connection to
    the Environment and the Infected Host, Microbiology and Molecular Biology Reviews.'
- reference: DOI:10.1111/mmi.13650
  notes: Terry et al. 2017, Molecular tiling on the surface of a bacterial spore -
    the exosporium of the Bacillus anthracis/cereus/thuringiensis group, Molecular
    Microbiology.
