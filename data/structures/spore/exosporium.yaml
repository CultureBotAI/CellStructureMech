identifier: GO:0043592
label: exosporium
structure_category: SPORE
structure_kind: ENVELOPE_LAYER
definition: The outermost layer of a bacterial endospore, which is loosely attached
  and located outside of the endospore coat. It is generally composed of protein,
  carbohydrate, and perhaps lipid.
definition_source: GO:0043592
mapping_status: PROPOSED
