discussions:
- discussion_id: bacterial_exosporium_boundary
  prompt: Keep the bacterial exosporium separate from the microsporidian-type exospore
    and generic UniProt Perispore location.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - synonyms
  rationale: GO:0043592 explicitly denotes the bacterial endospore exosporium, whereas
    GO:0090642 denotes a microsporidian spore-wall exospore and UniProt SL-0367 uses
    Perispore generically for bacterial and eukaryotic outer spore surfaces.
  resolution_note: Curated GO:0043592 as bacterial exosporium, kept the GO epispore,
    exospore, and perispore synonyms, and retained UniProt SL-0367 only as record-level
    boundary evidence.
  evidence:
  - reference: GO:0043592
    notes: GO:0043592 identifies exosporium as a bacterial endospore component.
  - reference: GO:0090642
    notes: GO:0090642 identifies microsporidian-type exospore as a separate spore-wall
      component.
  - reference: uniprot.location:SL-0367
    notes: SL-0367 is a broader Perispore location with Exosporium and Perine synonyms.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
