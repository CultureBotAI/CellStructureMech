components:
- component_id: prospore_membrane_lipid_bilayer
  label: prospore membrane lipid bilayer
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Double membrane that expands from the meiotic spindle-pole body region and
    surrounds haploid nuclei during ascospore formation.
  evidence:
  - reference: GO:0005628
    notes: GO:0005628 defines the prospore membrane as a double-membraned structure
      that extends from the cytoplasmic face of spindle pole bodies during meiosis.
  - reference: DOI:10.1083/jcb.140.1.29
    notes: Neiman 1998 analyzed prospore membrane formation in Saccharomyces cerevisiae
      as a sporulation-specific branch of post-Golgi secretion.
- component_id: leading_edge_protein_coat
  label: prospore membrane leading edge protein coat
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - SSP1
  - ADY3
  - DON1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The leading-edge protein coat is curated from yeast localization
    and protein-identification studies; no exact source-neutral Complex Portal, GO,
    InterPro, Pfam or NCBIfam term was chosen for the whole transient coat or for
    its individual budding-yeast subunit families.
  role: Protein coat at the lip of the growing prospore membrane that marks the leading
    edge before membrane closure.
  evidence:
  - reference: GO:0070056
    notes: GO:0070056 defines the prospore membrane leading edge as the protein-coated
      region that extends to surround the spore nucleus.
  - reference: DOI:10.1093/emboj/20.24.6946
    notes: Moreno-Borchart et al. 2001 linked formation of the Saccharomyces prospore
      membrane to leading-edge protein coat assembly.
