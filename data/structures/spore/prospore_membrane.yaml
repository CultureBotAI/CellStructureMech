causal_graphs:
- graph_id: secretory_vesicles_build_prospore_membrane
  title: Secretory traffic and the leading edge build the prospore membrane
  description: During budding-yeast sporulation, post-Golgi secretory traffic supplies
    membrane at meiotic outer plaques to generate prospore membranes, while leading-edge
    coat proteins track the open rim of the growing membrane before closure.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph summarizes where the membrane initiates and where the leading-edge
    coat localizes without asserting the full SNARE, phospholipase D, septin, or spindle-pole-body
    remodeling pathway.
  nodes:
  - node_id: post_golgi_secretory_vesicles
    label: post-Golgi secretory vesicles
    node_type: STRUCTURE
  - node_id: meiotic_outer_plaque
    label: meiotic outer plaque
    node_type: STRUCTURE
  - node_id: prospore_membrane
    label: prospore membrane
    node_type: STRUCTURE
    grounding: GO:0005628
  - node_id: lep_coat
    label: prospore membrane leading edge protein coat
    node_type: GENE_OR_PROTEIN
    component_ref: leading_edge_protein_coat
  - node_id: prospore_membrane_leading_edge
    label: prospore membrane leading edge
    node_type: STRUCTURE
    grounding: GO:0070056
  - node_id: haploid_meiotic_nucleus
    label: haploid meiotic nucleus
    node_type: ORGANELLE
  edges:
  - subject: post_golgi_secretory_vesicles
    predicate: supplies membrane for
    object: prospore_membrane
    description: Sporulation-specific post-Golgi vesicle traffic supplies membrane
      needed for de novo prospore membrane formation.
    evidence:
    - reference: DOI:10.1083/jcb.140.1.29
      notes: Neiman 1998 found that late secretory SEC1, SEC4 and SEC8 function is
        required for prospore membrane formation in Saccharomyces cerevisiae.
  - subject: meiotic_outer_plaque
    predicate: anchors initiation of
    object: prospore_membrane
    description: The prospore membrane initiates from meiotic outer plaques on spindle
      pole bodies.
    evidence:
    - reference: DOI:10.1093/emboj/19.14.3657
      notes: Knop and Strasser 2000 studied the spindle-pole-body role in assembling
        prospore membranes during meiosis.
    - reference: GO:0032120
      notes: GO:0032120 defines prospore membrane formation as nascent membrane growth
        from the meiotic outer plaque.
  - subject: lep_coat
    predicate: localizes to
    object: prospore_membrane_leading_edge
    description: Leading-edge protein coat components mark the lip of the extending
      prospore membrane.
    evidence:
    - reference: DOI:10.1093/emboj/20.24.6946
      notes: Moreno-Borchart et al. 2001 tied LEP coat assembly to formation of the
        growing prospore membrane.
    - reference: GO:0070056
      notes: GO:0070056 describes a protein-coated leading-edge region on the prospore
        membrane.
  - subject: prospore_membrane
    predicate: encapsulates
    object: haploid_meiotic_nucleus
    description: Prospore membrane growth and closure encapsulate the haploid meiotic
      nucleus during immature ascospore formation.
    evidence:
    - reference: GO:0005628
      notes: GO:0005628 defines the prospore membrane as encompassing the nuclear
        lobes formed during meiosis.
    - reference: GO:0031321
      notes: GO:0031321 defines ascospore-type prospore assembly as encapsulation
        of each haploid nucleus by a double membrane.
