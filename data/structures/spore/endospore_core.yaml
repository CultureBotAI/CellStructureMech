identifier: GO:0070477
label: endospore core
structure_category: SPORE
structure_kind: SUBCELLULAR_REGION
definition: An intracellular part that represents the innermost portion of an endospore;
  the endospore core is dehydrated, enriched in dipicolinic acid and divalent cations,
  and metabolically inactive.
