causal_graphs:
- graph_id: endospore_core_dehydrated_interior
  title: Cortex maintains low water in the endospore core
  description: The dormant endospore core is the innermost compartment and is bounded
    by the spore inner membrane. Outside the core, the endospore cortex helps maintain
    the low core water content that supports wet-heat resistance.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records high-level core topology and dehydration rather than
    the molecular mechanisms of cortex synthesis, core dehydration, or germination-specific
    rehydration.
  nodes:
  - node_id: endospore_core
    label: endospore core
    node_type: STRUCTURE
    grounding: GO:0070477
  - node_id: spore_inner_membrane
    label: spore inner membrane
    node_type: STRUCTURE
    grounding: GO:0140549
  - node_id: endospore_cortex
    label: endospore cortex
    node_type: STRUCTURE
    grounding: GO:0043595
  - node_id: low_core_water_content
    label: low core water content
    node_type: STATE
  - node_id: wet_heat_resistance
    label: wet-heat resistance
    node_type: CAPACITY
  edges:
  - subject: spore_inner_membrane
    predicate: surrounds
    object: endospore_core
    description: The spore inner membrane surrounds the endospore core and separates
      it from the surrounding cortex and external environment.
    evidence:
    - reference: GO:0140549
      notes: GO:0140549 defines the spore inner membrane as the membrane surrounding
        the spore core.
  - subject: endospore_cortex
    predicate: maintains
    object: low_core_water_content
    description: Modified cortex peptidoglycan helps maintain low water content in
      the dormant spore core.
    evidence:
    - reference: DOI:10.1128/9781555819323.ch10
      notes: Setlow 2016 reviews the cortex contribution to spore core dehydration.
  - subject: low_core_water_content
    predicate: enables
    object: wet_heat_resistance
    description: Low core water content is a major determinant of mature endospore
      resistance to wet heat.
    evidence:
    - reference: DOI:10.1128/9781555819323.ch10
      notes: Setlow 2016 reviews low core water content as a determinant of spore
        wet-heat resistance.
discussions:
- discussion_id: core_layer_boundary
  prompt: Keep the endospore core separate from the surrounding spore inner membrane,
    cortex, coat, and external encapsulating structure.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0070477 denotes the innermost dehydrated endospore core, whereas GO:0140549
    denotes the membrane surrounding it, GO:0043595 denotes the cortex outside that
    membrane, and GO:0043591 denotes the broader cortex-coat external encapsulating
    structure.
  resolution_note: Curated GO:0070477 as only the endospore core and recorded nearby
    membrane and cortex terms as evidence and graph nodes rather than parent or part_of
    values.
  evidence:
  - reference: GO:0070477
    notes: GO:0070477 is the endospore core term.
  - reference: GO:0140549
    notes: GO:0140549 is the surrounding spore inner membrane term.
  - reference: GO:0043595
    notes: GO:0043595 is the surrounding endospore cortex term.
  - reference: GO:0043591
    notes: GO:0043591 is the broader endospore external encapsulating structure term.
- discussion_id: uniprot_spore_core_scope
  prompt: Use UniProt SL-0253 as spore-core provenance without treating it as an exact
    cross-reference for the bacterial endospore core.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: SL-0253 denotes the generic UniProt Spore core location under the broader
    Spore hierarchy and carries no GO mapping, so it is not a true equivalent to GO:0070477.
  resolution_note: Retained SL-0253 as synonym and record-level evidence provenance,
    but removed it from xrefs.
  evidence:
  - reference: uniprot.location:SL-0253
    notes: UniProt SL-0253 is the generic Spore core location.
  - reference: GO:0070477
    notes: GO:0070477 is the narrower bacterial endospore core term.
