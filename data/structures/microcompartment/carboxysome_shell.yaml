functions:
- function_id: selective_metabolite_permeability
  label: selective metabolite permeability
  description: Pores through shell facets allow small metabolites such as bicarbonate
    to cross the shell while restricting larger or unfavorably charged solutes.
  evidence:
  - reference: DOI:10.1038/nrmicro.2018.10
    notes: Kerfeld et al. 2018 review selective metabolite flux through pores in BMC-H
      and BMC-T carboxysome shell proteins.
- function_id: co2_retention
  label: CO2 retention
  description: The shell acts as a CO2 leakage barrier, retaining carbon dioxide generated
    inside the lumen for fixation by encapsulated RuBisCO.
  evidence:
  - reference: DOI:10.1038/nrmicro.2018.10
    notes: Kerfeld et al. 2018 describe the carboxysome shell as limiting CO2 leakage
      from the compartment.
  - reference: DOI:10.1371/journal.pone.0007521
    notes: Cai et al. 2009 experimentally linked CsoS4 vertex caps to closed shells
      that act as a CO2 leakage barrier in Halothiobacillus neapolitanus.
evidence:
- reference: DOI:10.1038/nrmicro.2018.10
  notes: Kerfeld CA, Aussignargues C, Zarzycki J, Cai F and Sutter M 2018, Bacterial
    microcompartments, Nature Reviews Microbiology.
- reference: DOI:10.1371/journal.pbio.0050144
  notes: Tsai Y et al. 2007, Structural Analysis of CsoS1A and the Protein Shell of
    the Halothiobacillus neapolitanus Carboxysome, PLoS Biology.
- reference: DOI:10.1371/journal.pone.0043871
  notes: Rae BD, Long BM, Badger MR and Price GD 2012, Structural determinants of
    the outer shell of beta-carboxysomes in Synechococcus elongatus PCC 7942, PLoS
    One.
- reference: PMID:23572529
  notes: Cai F et al. 2013, The structure of CcmP, a tandem bacterial microcompartment
    domain protein from the beta-carboxysome, forms a subcompartment within a microcompartment,
    Journal of Biological Chemistry.
- reference: DOI:10.1371/journal.pone.0007521
  notes: Cai F, Menon BB, Cannon GC, Curry KJ, Shively JM and Heinhorst S 2009, The
    pentameric vertex proteins are necessary for the icosahedral carboxysome shell
    to function as a CO2 leakage barrier, PLoS One.
- reference: DOI:10.1128/JB.06444-11
  notes: Roberts EW, Cai F, Kerfeld CA, Cannon GC and Heinhorst S 2012, Isolation
    and characterization of the Prochlorococcus carboxysome reveal the presence of
    the novel shell protein CsoS1D, Journal of Bacteriology.
causal_graphs:
- graph_id: protein_shell_selective_barrier
  title: Shell tiles close a selective carboxysome barrier
  description: BMC-H, BMC-T, and BMC-P paralogues build a closed polyhedral carboxysome
    shell. Pores in the shell allow bicarbonate entry while the shell slows CO2 escape
    from the lumen.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
