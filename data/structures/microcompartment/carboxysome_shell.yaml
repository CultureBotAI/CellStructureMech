identifier: cellstructuremech:carboxysome_shell
label: carboxysome shell
structure_category: MICROCOMPARTMENT
structure_kind: MULTIPROTEIN_COMPLEX
definition: The polyhedral protein coat of alpha- and beta-carboxysomes, built from
  BMC-H, BMC-T, and BMC-P shell proteins that enclose RuBisCO and carbonic anhydrase
  while controlling metabolite traffic between the lumen and cytosol.
definition_source: DOI:10.1038/nrmicro.2018.10
mapping_status: PROPOSED
