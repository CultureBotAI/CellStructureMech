    grounding: CHEBI:16526
  edges:
  - subject: bmc_h
    predicate: tiles facets of
    object: shell
    description: BMC-H hexamers form the flat facets of the polyhedral carboxysome
      shell.
    evidence:
    - reference: DOI:10.1038/nrmicro.2018.10
      notes: Kerfeld et al. 2018 review BMC-H hexamers as the dominant facet-forming
        carboxysome shell proteins.
  - subject: bmc_t
    predicate: contributes pores to
    object: shell
    description: Tandem-BMC-domain shell proteins insert larger pseudohexamer pores
      into the shell lattice.
    evidence:
    - reference: PMID:23572529
      notes: Cai et al. 2013 resolved CcmP as a dimer of stacked trimers in the beta-carboxysome
        shell.
  - subject: bmc_p
    predicate: caps vertices of
    object: shell
    description: BMC-P pentamers provide pentagonal caps that close shell vertices.
    evidence:
    - reference: DOI:10.1038/nrmicro.2018.10
      notes: Kerfeld et al. 2018 review BMC-P proteins as pentameric vertex caps in
        carboxysomes and related BMCs.
    - reference: DOI:10.1371/journal.pone.0007521
      notes: Cai et al. 2009 linked CsoS4 vertex pentamers to normal icosahedral shell
        closure.
  - subject: shell
    predicate: permits passage of
    object: bicarbonate
    description: Selective pores admit bicarbonate from the cytosol into the carboxysome
      lumen.
    evidence:
    - reference: DOI:10.1038/nrmicro.2018.10
      notes: Kerfeld et al. 2018 review the model that positively charged shell pores
        favor passage of bicarbonate and other anions.
  - subject: shell
    predicate: limits loss of
    object: co2
    description: The proteinaceous shell slows escape of CO2 generated around RuBisCO.
    evidence:
    - reference: DOI:10.1038/nrmicro.2018.10
      notes: Kerfeld et al. 2018 review the shell permeability model in which carboxysome
        pores keep CO2 from leaking back to the cytosol.
    - reference: DOI:10.1371/journal.pone.0007521
      notes: Cai et al. 2009 showed that CsoS4 vertex deletions compromise the carboxysome
        shell as a CO2 leakage barrier.
discussions:
- discussion_id: exclude_lumen_cargo_and_adaptors
  prompt: Should encapsulated RuBisCO, carbonic anhydrase, CcmM or CcmN be duplicated
    as carboxysome shell components?
  kind: CURATION_TODO
  status: RESOLVED
  rationale: The shell record is scoped to the polyhedral protein coat. Encapsulated
    cargo and beta-carboxysome adaptors are components of the whole carboxysome and
    shape shell closure, but they are not shell tiles or vertex proteins.
  resolution_note: 'Declined: leave RuBisCO, carboxysomal carbonic anhydrase, CcmM/CsoS2
    scaffolds and CcmN adaptors on the enclosing carboxysome record.'
  posed_by: claude
  posed_date: '2026-09-07'
  resolved_date: '2026-09-07'
