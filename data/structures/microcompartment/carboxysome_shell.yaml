identifier: cellstructuremech:carboxysome_shell
label: carboxysome shell
structure_category: MICROCOMPARTMENT
structure_kind: MULTIPROTEIN_COMPLEX
definition: The polyhedral protein coat of alpha- and beta-carboxysomes, built from
  BMC-H, BMC-T, and BMC-P shell proteins that enclose RuBisCO and carbonic anhydrase
  while controlling metabolite traffic between the lumen and cytosol.
definition_source: DOI:10.1038/nrmicro.2018.10
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-07T00:20:21Z'
  curator: claude
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-07T00:31:45Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added shell synonymy, carboxysome parthood, BMC-H/BMC-T/BMC-P coat components,
    bacterial taxonomic scope, alpha- and beta-carboxysome examples, shell permeability
    functions, core literature evidence, a selective-barrier causal graph, and a boundary
    discussion excluding lumen cargo and adaptors from the shell record.
  llm_assisted: true
- timestamp: '2026-09-07T00:40:25Z'
  curator: claude
  action: FIX_DISCUSSION_ANCHOR
  changes: Removed the section-wide discussion anchor because discussion anchors must
    name an existing local id such as components#bmc_h, not a bare section.
  llm_assisted: true
synonyms:
- synonym_text: carboxysome protein shell
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1038/nrmicro.2018.10
- synonym_text: alpha-carboxysome shell
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1038/nrmicro.2018.10
- synonym_text: beta-carboxysome shell
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1038/nrmicro.2018.10
part_of:
- GO:0031470
components:
- component_id: bmc_h
  label: BMC-H shell hexamers (CcmK / CsoS1)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ccmK
  - csoS1
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: IPR046380 exactly covers reviewed beta-carboxysome CcmK proteins,
    but alpha-carboxysome CsoS1 proteins lack it. Their only shared family, IPR050575,
    is the generic bacterial microcompartment shell family and also covers non-carboxysome
    shell proteins, so no exact family CURIE was curated.
  role: Hexameric single-BMC-domain proteins that tile the shell facets.
  evidence:
  - reference: DOI:10.1038/nrmicro.2018.10
    notes: Kerfeld et al. 2018 review BMC-H proteins as hexameric carboxysome shell
      tiles built from CcmK proteins in beta-carboxysomes and CsoS1 proteins in alpha-carboxysomes.
  - reference: DOI:10.1371/journal.pbio.0050144
    notes: Tsai et al. 2007 structurally analyzed the Halothiobacillus neapolitanus
      alpha-carboxysome shell protein CsoS1A.
  - reference: DOI:10.1371/journal.pone.0043871
    notes: Rae et al. 2012 analyzed CcmK proteins in the Synechococcus elongatus PCC
      7942 beta-carboxysome outer shell.
- component_id: bmc_t
  label: BMC-T shell pseudohexamers (CcmO, CcmP, CsoS1D)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ccmO
  - ccmP
  - csoS1D
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: BMC-T shell proteins are tandem-BMC-domain proteins, but carboxysome
    CcmO, CcmP and CsoS1D families are not covered by one exact source-neutral InterPro
    or Pfam family CURIE.
  role: Tandem-BMC-domain proteins that contribute pseudohexamers to the shell and
    can introduce larger gated pores.
  evidence:
  - reference: DOI:10.1038/nrmicro.2018.10
    notes: Kerfeld et al. 2018 review BMC-T paralogues as pseudohexameric shell proteins
      in carboxysomes and other bacterial microcompartments.
  - reference: PMID:23572529
    notes: Cai et al. 2013 structurally analyzed Synechococcus elongatus CcmP, a beta-carboxysome
      tandem-BMC-domain protein that forms a double-trimer pseudohexamer in the shell.
- component_id: bmc_p
  label: BMC-P shell pentamers (CcmL / CsoS4)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ccmL
  - csoS4A
  - csoS4B
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: IPR046387 exactly covers the beta-carboxysome CcmL family, whereas
    alpha-carboxysome CsoS4A and CsoS4B are distinct families. Their only shared candidate
    is broader than carboxysome vertex proteins, so no exact family CURIE was curated.
  role: Pentameric shell proteins that cap the vertices of the polyhedral shell.
  evidence:
  - reference: DOI:10.1038/nrmicro.2018.10
    notes: Kerfeld et al. 2018 review BMC-P proteins as pentameric caps at the vertices
      of carboxysome and other BMC shells.
  - reference: DOI:10.1371/journal.pone.0043871
    notes: Rae et al. 2012 found that CcmL is part of the minimum structural determinant
      set for the Synechococcus elongatus PCC 7942 beta-carboxysome outer shell.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Carboxysome shells occur in cyanobacterial and proteobacterial carboxysomes
    but are absent from bacterial lineages and strains without carboxysome loci.
  reference: DOI:10.1038/nrmicro.2018.10
canonical_examples:
- taxon_id: NCBITaxon:927
  taxon_label: Halothiobacillus neapolitanus
  note: Alpha-carboxysome model whose CsoS1A shell protein and isolated protein shell
    were structurally analyzed.
  reference: DOI:10.1371/journal.pbio.0050144
- taxon_id: NCBITaxon:1140
  taxon_label: Synechococcus elongatus PCC 7942
  note: Beta-carboxysome model used to test the roles of CcmK2, CcmK3, CcmK4, CcmO,
    and CcmL in the outer shell.
  reference: DOI:10.1371/journal.pone.0043871
functions:
- function_id: selective_metabolite_permeability
  label: selective metabolite permeability
  description: Pores through shell facets allow small metabolites such as bicarbonate
    to cross the shell while restricting larger or unfavorably charged solutes.
  evidence:
  - reference: DOI:10.1038/nrmicro.2018.10
    notes: Kerfeld et al. 2018 review selective metabolite flux through pores in BMC-H
      and BMC-T carboxysome shell proteins.
- function_id: co2_retention
  label: CO2 retention
  description: The shell acts as a CO2 leakage barrier, retaining carbon dioxide generated
    inside the lumen for fixation by encapsulated RuBisCO.
  evidence:
  - reference: DOI:10.1038/nrmicro.2018.10
    notes: Kerfeld et al. 2018 describe the carboxysome shell as limiting CO2 leakage
      from the compartment.
evidence:
- reference: DOI:10.1038/nrmicro.2018.10
  notes: Kerfeld CA, Aussignargues C, Zarzycki J, Cai F and Sutter M 2018, Bacterial
    microcompartments, Nature Reviews Microbiology.
- reference: DOI:10.1371/journal.pbio.0050144
  notes: Tsai Y et al. 2007, Structural Analysis of CsoS1A and the Protein Shell of
    the Halothiobacillus neapolitanus Carboxysome, PLoS Biology.
- reference: DOI:10.1371/journal.pone.0043871
  notes: Rae BD, Long BM, Badger MR and Price GD 2012, Structural determinants of
    the outer shell of beta-carboxysomes in Synechococcus elongatus PCC 7942, PLoS
    One.
- reference: PMID:23572529
  notes: Cai F et al. 2013, The structure of CcmP, a tandem bacterial microcompartment
    domain protein from the beta-carboxysome, forms a subcompartment within a microcompartment,
    Journal of Biological Chemistry.
causal_graphs:
- graph_id: protein_shell_selective_barrier
  title: Shell tiles close a selective carboxysome barrier
  description: BMC-H, BMC-T, and BMC-P paralogues build a closed polyhedral carboxysome
    shell. Pores in the shell allow bicarbonate entry while the shell slows CO2 escape
    from the lumen.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
