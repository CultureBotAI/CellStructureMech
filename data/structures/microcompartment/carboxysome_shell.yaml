components:
- component_id: bmc_h
  label: BMC-H shell hexamers (CcmK / CsoS1)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ccmK
  - csoS1
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: IPR046380 exactly covers reviewed beta-carboxysome CcmK proteins,
    but alpha-carboxysome CsoS1 proteins lack it. Their only shared family, IPR050575,
    is the generic bacterial microcompartment shell family and also covers non-carboxysome
    shell proteins, so no exact family CURIE was curated.
  role: Hexameric single-BMC-domain proteins that tile the shell facets.
  evidence:
  - reference: DOI:10.1038/nrmicro.2018.10
    notes: Kerfeld et al. 2018 review BMC-H proteins as hexameric carboxysome shell
      tiles built from CcmK proteins in beta-carboxysomes and CsoS1 proteins in alpha-carboxysomes.
  - reference: DOI:10.1371/journal.pbio.0050144
    notes: Tsai et al. 2007 structurally analyzed the Halothiobacillus neapolitanus
      alpha-carboxysome shell protein CsoS1A.
  - reference: DOI:10.1371/journal.pone.0043871
    notes: Rae et al. 2012 analyzed CcmK proteins in the Synechococcus elongatus PCC
      7942 beta-carboxysome outer shell.
