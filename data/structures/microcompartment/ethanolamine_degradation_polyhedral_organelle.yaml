identifier: GO:0031471
label: ethanolamine degradation polyhedral organelle
structure_category: MICROCOMPARTMENT
structure_kind: PROTEIN_SHELLED_ORGANELLE
definition: An organelle found in bacteria consisting of a proteinaceous coat containing
  enzymes for the degradation of ethanolamine whose purpose is the protection of the
  rest of the cell from the toxic acetaldehyde product of the enzyme ethanolamine
  ammonia lyase.
definition_source: GO:0031471
mapping_status: PROPOSED
