  edges:
  - subject: eut_bmc_domain_shell_proteins
    predicate: self-assemble into
    object: eut_shell
    description: EutS alone, and the EutSMNLK shell-protein set, can assemble BMC-like
      shells in a heterologous E. coli system.
    evidence:
    - reference: DOI:10.1038/srep24359
      notes: Held et al. observed EutS and EutSMNLK polyhedral bodies by TEM after
        recombinant expression in E. coli.
  - subject: eutn_vertex_shell_protein
    predicate: contributes pentameric shell vertices to
    object: eut_shell
    description: EutN belongs to the vertex-protein lineage of bacterial microcompartment
      shell proteins and is pentameric in solution.
    evidence:
    - reference: DOI:10.1002/pro.2246
      notes: Wheatley et al. found that EutN is predominantly pentameric in solution
        while studying BMC vertex proteins.
  - subject: eutc_targeting_peptide
    predicate: binds
    object: eut_bmc_domain_shell_proteins
    description: The EutC N-terminal targeting peptide binds EutS, linking ethanolamine-catabolic
      cargo to the Eut shell.
    evidence:
    - reference: DOI:10.1073/pnas.1207516109
      notes: Fan et al. showed that EutC and EutE targeting sequences bind the EutS
        shell protein to mediate cargo encapsulation.
  - subject: eutc_targeting_peptide
    predicate: directs encapsulation of
    object: eut_lumen_enzymes
    description: An N-terminal EutC targeting sequence can route fused cargo to the
      lumen of recombinant Eut shells.
    evidence:
    - reference: DOI:10.1371/journal.pone.0033342
      notes: Choudhary et al. used the 19-residue EutC targeting sequence to localize
        reporters to EutS and EutSMNLK compartments.
  - subject: eutq
    predicate: binds
    object: eut_bmc_domain_shell_proteins
    description: EutQ interacts with EutM in vitro and can promote multiple EutSMNLK
      compartments in the recombinant assembly system.
    evidence:
    - reference: DOI:10.1038/srep24359
      notes: Held et al. found EutQ-EutM binding in pull-down assays and linked EutQ
        to multiple EutSMNLK compartment formation.
