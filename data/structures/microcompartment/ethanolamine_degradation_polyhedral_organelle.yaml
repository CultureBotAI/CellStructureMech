functions:
- function_id: ethanolamine_catabolism
  label: ethanolamine catabolic process
  grounding: GO:0046336
  description: Sequesters ethanolamine-catabolic chemistry in a protein shell so the
    cell can convert ethanolamine through acetaldehyde to acetyl-phosphate, acetyl-CoA,
    and ethanol.
  evidence:
  - reference: DOI:10.1128/JB.02179-12
    notes: Huseby and Roth used Salmonella genetics to test how the Eut microcompartment
      routes ethanolamine catabolism and recycles private NAD and CoA pools.
- function_id: acetaldehyde_cofactor_confinement
  label: acetaldehyde and cofactor confinement
  description: Restricts acetaldehyde and large NAD/CoA cofactors from freely diffusing
    between the lumen and cytosol during ethanolamine breakdown.
  evidence:
  - reference: DOI:10.1128/JB.02179-12
    notes: Genetic evidence supported retention and recycling of NAD and CoA within
      the Eut compartment and restricted diffusion of the acetaldehyde intermediate.
evidence:
- reference: DOI:10.1128/mbio.00066-18
  notes: Kaval and Garsin review bacterial ethanolamine utilization, including eut
    loci and the Eut microcompartment in pathogens.
- reference: DOI:10.1128/jb.181.17.5317-5329.1999
  notes: Kofoid et al. defined the 17-gene Salmonella eut operon and recognized five
    shell-protein homologues.
- reference: DOI:10.1128/JB.02179-12
  notes: Huseby and Roth provide a mechanistic genetic model of ethanolamine catabolism
    and cofactor recycling within the Eut microcompartment.
causal_graphs:
- graph_id: eut_shell_assembly_and_cargo_targeting
  title: Eut shell proteins assemble a cargo-targeting compartment
  description: Eut BMC-domain and BMC-P shell proteins form the ethanolamine-utilization
    protein shell. Short targeting sequences on lumen enzymes bind the shell protein
    EutS, and EutQ modulates the number of EutSMNLK compartments in a recombinant
    assembly system.
