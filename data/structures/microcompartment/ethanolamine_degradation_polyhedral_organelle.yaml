  - eutM
  - eutL
  - eutK
  essentiality: UNKNOWN
  role: Hexameric and pseudohexameric BMC-domain proteins that tile the facets and
    pores of the ethanolamine-utilization shell.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: EutS, EutM, EutL, and EutK carry BMC domains, but the generic BMC-domain
    families also cover carboxysome and other metabolosome shell proteins, so no exact
    ethanolamine-metabolosome shell family was curated.
  evidence:
  - reference: DOI:10.1128/jb.181.17.5317-5329.1999
    notes: Kofoid et al. identified the Salmonella eut operon and its eutS, eutM,
      eutL, eutK, and eutN shell homologues.
  - reference: DOI:10.1128/JB.00652-10
    notes: Takenoya et al. solved E. coli EutL and EutM shell protein structures and
      assigned them to the ethanolamine-utilizing microcompartment shell.
  - reference: DOI:10.1038/srep24359
    notes: Held et al. assembled EutS-only and EutSMNLK nanocompartments from Salmonella
      shell proteins in E. coli and confirmed BMC-like particles by TEM.
