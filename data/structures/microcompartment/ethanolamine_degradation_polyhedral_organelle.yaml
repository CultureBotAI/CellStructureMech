  essentiality: UNKNOWN
  role: Pentameric BMV-family shell protein homologous to the pentamers that close
    bacterial microcompartment vertices.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The BMV-domain family covers EutN and PduN but also broader carboxysome
    and glycyl-radical metabolosome vertex proteins; no exact family for EutN alone
    was curated.
  evidence:
