identifier: GO:0031470
label: carboxysome
definition: A bacterial microcompartment — a polyhedral, selectively permeable protein
  shell about 100–200 nm across — that encapsulates RuBisCO and carbonic anhydrase
  to concentrate CO2 around RuBisCO in cyanobacteria and many chemoautotrophs. Alpha-carboxysomes
  (cso genes) and beta-carboxysomes (ccm genes) evolved their shells and scaffolds
  independently.
definition_source: DOI:10.1038/nrmicro.2018.10
synonyms:
- synonym_text: polyhedral body
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1038/nrmicro1913
structure_category: MICROCOMPARTMENT
structure_kind: PROTEIN_SHELLED_ORGANELLE
