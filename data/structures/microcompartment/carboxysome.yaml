discussions:
- discussion_id: rbcx_not_a_component
  prompt: Should the RuBisCO assembly chaperone RbcX (Q31N04) be a carboxysome component?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#rubisco
  rationale: The UniProt Subcellular Location seeding reported RbcX as annotated to
    the carboxysome with no matching component. It is an RbcL-specific folding chaperone
    whose homodimer binds the exposed C-terminus of an RbcL monomer during assembly;
    it is not part of the assembled structure. Recording the decision so the next
    seeding run does not re-raise it.
  resolution_note: 'Declined: RbcX is assembly machinery for the cargo, not a component
    of the carboxysome. Its localisation annotation reflects where it acts.'
  posed_by: claude
  posed_date: '2026-08-30'
  resolved_date: '2026-08-30'
  evidence:
  - reference: PMID:20080631
    notes: UniProt (Q31N04) describes RbcX as an RbcL-specific chaperone whose central
      cleft binds the RbcL C-terminus during RuBisCO assembly.
