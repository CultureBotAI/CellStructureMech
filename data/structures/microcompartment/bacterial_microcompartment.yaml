      notes: Kerfeld et al. 2018 review BMC-P proteins as pentameric vertex caps.
  - subject: bacterial_microcompartment
    predicate: encapsulates
    object: enzyme_cargo
    description: BMC shells enclose pathway-specific enzyme cargo rather than leaving
      every reaction in the cytosol.
    evidence:
    - reference: DOI:10.1038/nrmicro.2018.10
      notes: Kerfeld et al. 2018 compare carboxysome and metabolosome enzyme cargo
        in BMC interiors.
  - subject: bacterial_microcompartment
    predicate: selectively exchanges
    object: metabolic_intermediates
    description: Pores in the protein shell tune metabolite passage between the encapsulated
