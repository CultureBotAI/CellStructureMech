    predicate: tile facets of
    object: bacterial_microcompartment
    description: BMC-H hexamers tile the flat facets of the polyhedral BMC shell.
    evidence:
    - reference: DOI:10.1126/science.aan3289
      notes: The Haliangium ochraceum intact-shell structure placed BMC-H proteins
        in the shell facet lattice.
  - subject: bmc_t_gated_shell_proteins
    predicate: form gated pores in
    object: bacterial_microcompartment
    description: BMC-T pseudohexamers contribute larger gated pores to the shell lattice
      in BMCs that encode them.
    evidence:
    - reference: DOI:10.1016/j.str.2019.01.017
      notes: Greber et al. 2019 resolved BMC-T double trimers and the variable pores
        in the Haliangium ochraceum shell.
  - subject: bmc_p_vertex_shell_proteins
    predicate: cap vertices of
    object: bacterial_microcompartment
    description: BMC-P pentamers provide the pentagonal units that close vertices
      of the icosahedral shell.
    evidence:
