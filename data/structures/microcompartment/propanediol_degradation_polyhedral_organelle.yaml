- component_id: pdu_bmc_t_shell_proteins
  label: Pdu BMC-T shell proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - pduB
  - pduT
  - pduU
  essentiality: CONDITIONAL
  role: Tandem or circularly permuted BMC-domain shell proteins that tile the Pdu
    shell and contribute pores and shell-cargo contacts.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PduB, PduT, and PduU are BMC-T shell proteins, but their domain
    architecture is shared with other BMC shell proteins and no exact Pdu BMC-T family
    was curated.
  evidence:
  - reference: DOI:10.1128/JB.185.17.5086-5095.2003
    notes: Havemann and Bobik detected PduB and PduU in the purified Pdu organelle
      fraction.
  - reference: DOI:10.1038/s41467-022-30608-w
    notes: Yang et al. connected the PduB N terminus with shell-cargo assembly during
      Pdu metabolosome biogenesis.
