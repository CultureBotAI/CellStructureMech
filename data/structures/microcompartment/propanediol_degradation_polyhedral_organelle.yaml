  edges:
  - subject: pducde_diol_dehydratase
    predicate: co-assembles with
    object: pdu_lumen_enzyme_core
    description: PduCDE participates in the ordered assembly of a luminal cargo core
      that can form independently of a visible shell focus.
    evidence:
    - reference: DOI:10.1038/s41467-022-30608-w
      notes: Yang et al. observed cargo assemblies that form independently at cell
        poles during Pdu metabolosome biogenesis.
  - subject: pdum_structural_protein
    predicate: bridges
    object: pdu_shell_cargo_complex
    description: PduM promotes shell-cargo binding between the assembled enzyme core
      and PduB-associated shell proteins.
    evidence:
    - reference: DOI:10.1038/s41467-022-30608-w
      notes: Yang et al. placed PduM between the PduB N-terminal region and cargo
        enzymes in the biogenesis model.
  - subject: pdu_lumen_enzyme_core
    predicate: binds
    object: pdu_bmc_t_shell_proteins
    description: Terminal targeting sequences on luminal enzymes mediate encapsulation
      by contacting shell proteins.
    evidence:
    - reference: DOI:10.1073/pnas.0913199107
      notes: Fan et al. established that short N-terminal extensions package enzymes
        into bacterial microcompartments.
    - reference: DOI:10.1128/JB.05661-11
      notes: Fan and Bobik showed that PduD's N-terminal region is sufficient for
        targeting PduCDE to Pdu microcompartments.
  - subject: pdu_bmc_h_shell_proteins
    predicate: tiles
    object: pdu_shell_cargo_complex
    description: Pdu BMC-H proteins form abundant shell tiles in native Salmonella
      Pdu metabolosomes.
    evidence:
    - reference: DOI:10.1128/JB.185.17.5086-5095.2003
      notes: Purified Salmonella Pdu polyhedral organelles contained both Pdu shell
        proteins and 1,2-propanediol degradation enzymes.
  - subject: pdun_vertex_shell_protein
    predicate: caps
    object: pdu_shell_cargo_complex
    description: Pentameric PduN supplies the vertex geometry needed to close the
      polyhedral Pdu shell.
    evidence:
    - reference: DOI:10.1002/pro.2246
      notes: Wheatley et al. assigned PduN to the pentameric vertex-protein set of
        bacterial microcompartment shells.
  - subject: pdu_shell_cargo_complex
    predicate: matures into
    object: pdu_metabolosome
    description: Coordination of independent shell and cargo assemblies yields the
      closed Pdu metabolosome.
    evidence:
    - reference: DOI:10.1038/s41467-022-30608-w
      notes: Yang et al. proposed a hierarchical model in which independent shell
        and cargo assemblies converge during native Pdu metabolosome biogenesis.
