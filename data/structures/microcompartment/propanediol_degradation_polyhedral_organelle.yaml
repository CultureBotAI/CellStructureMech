- component_id: pdun_vertex_shell_protein
  label: PduN BMC-P vertex shell protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - pduN
  essentiality: UNKNOWN
  role: Pentameric shell protein that occupies vertices of the polyhedral Pdu shell.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The BMV-domain family covers several bacterial microcompartment
    vertex proteins; no exact family for PduN alone was curated.
  evidence:
  - reference: DOI:10.1002/pro.2246
    notes: Wheatley et al. identified PduN as a pentameric vertex protein of the Pdu
      microcompartment shell.
  - reference: DOI:10.1038/s41467-020-15888-4
    notes: Yang et al. include PduN among the quantified structural shell proteins
      of native Salmonella Pdu metabolosomes.
