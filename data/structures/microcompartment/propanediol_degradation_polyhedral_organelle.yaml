- component_id: pdum_structural_protein
  label: PduM structural protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - pduM
  essentiality: UNKNOWN
  role: Structural protein that promotes coupling between the Pdu enzyme core and
    the closing shell during metabolosome biogenesis.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral family CURIE for PduM was curated.
  evidence:
  - reference: DOI:10.1128/JB.06529-11
    notes: Sinha et al. identified PduM as a structural component of the Salmonella
      1,2-propanediol microcompartment.
  - reference: DOI:10.1038/s41467-022-30608-w
    notes: Yang et al. placed PduM in the shell-cargo assembly pathway that builds
      the native Pdu metabolosome.
