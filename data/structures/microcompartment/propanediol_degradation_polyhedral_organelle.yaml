    notes: Havemann et al. showed that PduA is a shell protein required for normal
      polyhedral organelle formation in Salmonella.
  - reference: DOI:10.1128/JB.185.17.5086-5095.2003
    notes: Havemann and Bobik purified Salmonella Pdu polyhedral organelles and detected
      PduA and PduJ as organelle components.
  - reference: DOI:10.1038/s41467-020-15888-4
    notes: Yang et al. quantified the absolute abundance and organization of Pdu shell
      proteins in native Salmonella metabolosomes.
