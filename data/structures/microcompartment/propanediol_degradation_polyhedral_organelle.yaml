- component_id: pducde_diol_dehydratase
  label: PduCDE diol dehydratase
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - pduC
  - pduD
  - pduE
  essentiality: DISPENSABLE
  role: Encapsulated cobalamin-dependent dehydratase that converts 1,2-propanediol
    to propionaldehyde in the lumen.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0050215 denotes propanediol dehydratase activity rather than
    the PduCDE protein complex; no exact source-neutral complex CURIE was curated.
  evidence:
  - reference: DOI:10.1128/JB.179.21.6633-6639.1997
    notes: Bobik et al. showed that pduCDE encode the three subunits necessary and
      sufficient for propanediol dehydratase activity in Salmonella.
  - reference: DOI:10.1128/JB.05661-11
    notes: Fan and Bobik showed that the PduD N-terminal region packages PduCDE into
      the Pdu microcompartment.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Propanediol-utilization bacterial microcompartment loci are patchy across
    Bacteria and occur as one BMC type among many.
  reference: DOI:10.1038/s41467-021-24126-4
canonical_examples:
- taxon_id: NCBITaxon:99287
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
  note: Salmonella Typhimurium LT2 is the source of the classic pdu locus and of the
    native Pdu metabolosomes purified, quantified, and imaged in mechanistic studies.
  reference: DOI:10.1128/JB.185.17.5086-5095.2003
functions:
- function_id: propanediol_catabolism
  label: 1,2-propanediol catabolic process
  grounding: GO:0051144
  description: Compartmentalizes cobalamin-dependent 1,2-propanediol dehydration and
    downstream propionaldehyde metabolism.
  evidence:
  - reference: DOI:10.1128/JB.184.5.1253-1261.2002
    notes: Havemann et al. tied Pdu polyhedral bodies to coenzyme B12-dependent 1,2-propanediol
      degradation in Salmonella.
- function_id: propionaldehyde_sequestration
  label: propionaldehyde sequestration
  description: Keeps the reactive propionaldehyde intermediate inside the protein
    shell to limit DNA and cellular damage.
  evidence:
  - reference: DOI:10.1128/JB.01925-07
    notes: Sampson and Bobik showed that the Pdu microcompartment protects Salmonella
      from DNA and cell damage caused by a reactive propanediol catabolism intermediate.
evidence:
- reference: DOI:10.1038/s41467-020-15888-4
  notes: Yang et al. used imaging and quantitative proteomics to define the composition
    and organization of native Salmonella Pdu metabolosomes.
- reference: DOI:10.1038/s41467-022-30608-w
  notes: Yang et al. dissected convergent shell and cargo assembly pathways of the
    Salmonella Pdu metabolosome.
- reference: DOI:10.1128/JB.185.17.5086-5095.2003
  notes: Havemann and Bobik purified Pdu polyhedral organelles and identified shell
    and enzymatic components.
causal_graphs:
- graph_id: pdu_shell_cargo_convergent_biogenesis
  title: Pdu shell and cargo assemblies converge into a metabolosome
  description: Pdu shell proteins and Pdu luminal enzymes can each form early assemblies
    at the cell pole. Short terminal targeting sequences and PduM then link the enzyme
    core to BMC-domain shell proteins so the Pdu shell closes around 1,2-propanediol-catabolic
    cargo.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
