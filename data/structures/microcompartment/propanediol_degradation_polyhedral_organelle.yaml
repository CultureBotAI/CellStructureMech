identifier: GO:0031472
label: propanediol degradation polyhedral organelle
structure_category: MICROCOMPARTMENT
structure_kind: PROTEIN_SHELLED_ORGANELLE
definition: An organelle found in bacteria consisting of a proteinaceous coat containing
  enzymes for the degradation of 1,2-propanediol whose purpose is the protection of
  the rest of the cell from the toxic propionaldehyde product of the enzyme diol dehydratase.
definition_source: GO:0031472
