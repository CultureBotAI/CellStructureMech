identifier: GO:0033180
label: proton-transporting V-type ATPase, V1 domain
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'A protein complex that forms part of a proton-transporting V-type ATPase
  and catalyzes ATP hydrolysis. The V1 complex consists of: (1) a globular headpiece
  with three alternating copies of subunits A and B that form a ring, (2) a central
  rotational stalk composed of single copies of subunits D and F, and (3) a peripheral
  stalk made of subunits C, E, G and H. Subunits A and B mediate the hydrolysis of
  ATP at three reaction sites associated with subunit A. The peripheral cytoplasmic
  ATP-hydrolyzing sector (V1 domain) of the proton-transporting V-type ATPase complex.
  In yeasts, fungi, and protists, the V1 domain comprises a catalytic A3B3 hexamer
  (Vma1p and Vma2p), a central rotor stalk (subunits D/Vma8p and F/Vma7p), and three
  peripheral stator stalks (subunits E/Vma4p, G/Vma10p, C/Vma5p, and H/Vma13p) that
  convert ATP hydrolysis into mechanical torque on the V0 proteolipid ring.'
