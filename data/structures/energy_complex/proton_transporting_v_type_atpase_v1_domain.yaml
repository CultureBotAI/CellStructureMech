  title: V-type ATPase V1 domain ATP hydrolysis and reversible glucose-regulated docking
  description: Alternating ATP hydrolysis within the A3B3 catalytic head of the proton-transporting
    V-type ATPase V1 domain drives rotation of the D–F central stalk, while the RAVE
    complex regulates reversible V1 docking onto the membrane V0 sector.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures V1 as the ATP-hydrolyzing catalytic sector of the
    intact V-ATPase without asserting its individual catalytic-head, central-stalk,
    or peripheral-stalk subunit composition.
