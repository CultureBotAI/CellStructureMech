- component_id: oxygen_evolving_manganese_calcium_cluster
  label: oxygen-evolving manganese-calcium cluster
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  role: Catalytic metal-oxo cofactor cluster that accumulates oxidizing equivalents
