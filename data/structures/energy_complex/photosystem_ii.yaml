identifier: GO:0009523
label: photosystem II
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A photosystem that contains a pheophytin-quinone reaction center with
  associated accessory pigments and electron carriers. In cyanobacteria and chloroplasts,
  in the presence of light, PSII functions as a water-plastoquinone oxidoreductase,
  transferring electrons from water to plastoquinone, whereas other photosynthetic
  bacteria carry out anoxygenic photosynthesis and oxidize other compounds to re-reduce
  the photoreaction center.
