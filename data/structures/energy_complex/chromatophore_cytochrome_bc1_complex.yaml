identifier: cellstructuremech:chromatophore_cytochrome_bc1_complex
label: chromatophore cytochrome bc1 complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A purple-bacterial chromatophore membrane cytochrome bc1 protein complex
  that oxidizes quinol from the chromatophore quinone pool and supplies electrons
  to return carriers during cyclic photosynthetic electron transport. The carrier
  depends on the organism; cytochrome c2 is the characterized route in Cereibacter
  (Rhodobacter) sphaeroides.
definition_source: DOI:10.1038/s41467-021-21397-9
