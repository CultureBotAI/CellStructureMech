causal_graphs:
- graph_id: chromatophore_bc1_quinol_oxidation
  title: Chromatophore cytochrome bc1 turns over the quinone pool
  description: In Cereibacter (Rhodobacter) sphaeroides chromatophores, cytochrome
    bc1 oxidizes quinol and supplies electrons to cytochrome c2 in the cyclic electron-transfer
    system containing RC-LH1-PufX cores.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph places chromatophore cytochrome bc1 in the cyclic electron-transport
    loop without resolving the Rieske iron-sulfur protein, cytochrome b, cytochrome
    c1, or Q-cycle proton-coupling chemistry. The c2 and RC-LH1-PufX route is scoped
    to C. sphaeroides, not all purple bacteria; other taxa use different return carriers
    and core architectures.
