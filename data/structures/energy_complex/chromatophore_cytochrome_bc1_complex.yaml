  description: Reoxidizes quinol and returns electrons toward reaction centers through
    organism-dependent carriers; in Cereibacter (Rhodobacter) sphaeroides this includes
    soluble cytochrome c2.
  evidence:
  - reference: DOI:10.1074/jbc.M412088200
    notes: Comayras et al. 2005 modeled chromatophore quinone-domain behavior around
      cytochrome bc1 and reaction-center antenna complexes.
  - reference: DOI:10.1038/s41467-021-21397-9
    notes: Kawakami et al. 2021, Introduction, distinguishes soluble c-type cytochromes
      and HiPIP return carriers and specifically identifies the bc1-to-RC cytochrome
      c2 route in R. sphaeroides; its primary structure is a T. tepidum HiPIP:LH1-RC
      complex.
