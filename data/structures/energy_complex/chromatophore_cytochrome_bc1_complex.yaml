identifier: cellstructuremech:chromatophore_cytochrome_bc1_complex
label: chromatophore cytochrome bc1 complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A purple-bacterial chromatophore membrane cytochrome bc1 protein complex
  that oxidizes quinol from the chromatophore quinone pool and returns electrons toward
  reaction-center antenna cores through soluble cytochrome c2 during cyclic photosynthetic
  electron transport.
definition_source: DOI:10.1074/jbc.M412088200
