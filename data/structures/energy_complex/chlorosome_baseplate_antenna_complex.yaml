causal_graphs:
- graph_id: baseplate_excitation_transfer
  title: The CsmA baseplate routes chlorosome excitation outward
  description: CsmA apoproteins bind bacteriochlorophyll a to form the two-dimensional
    chlorosome baseplate antenna. The baseplate accepts excitation from bacteriochlorophyll
    aggregates and routes it toward membrane reaction-center complexes.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the source, baseplate, and downstream direction
    of excitation flow without modeling excitonic state transitions or lineages that
    insert Fenna-Matthews-Olson or B808-866 antenna complexes between the chlorosome
    and reaction center.
