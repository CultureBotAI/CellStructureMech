identifier: cellstructuremech:chlorosome_baseplate_antenna_complex
label: chlorosome baseplate antenna complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacteriochlorophyll a-CsmA light-harvesting protein-pigment array on
  one face of green bacterial chlorosomes that accepts excitation energy from chlorosome
  bacteriochlorophyll aggregates and couples it toward membrane reaction-center complexes.
definition_source: DOI:10.1038/ncomms12454
mapping_status: PROPOSED
