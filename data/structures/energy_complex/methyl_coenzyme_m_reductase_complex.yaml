  title: MCR reduces methyl-coenzyme M to methane
  description: The alpha2 beta2 gamma2 methyl coenzyme M reductase complex catalyzes
    the final methanogenesis reaction, consuming coenzyme B and methyl-coenzyme M
    while releasing methane and coenzyme M-coenzyme B heterodisulfide.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the GO-level net reaction and required alpha, beta,
    and gamma subunit families without resolving the nickel tetrapyrrole cofactor,
    coenzyme binding geometry, radical intermediates, or conformational states.
