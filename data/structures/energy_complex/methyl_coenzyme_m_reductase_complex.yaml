identifier: GO:0044674
label: methyl coenzyme M reductase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Methyl coenzyme M reductase complex is a hexameric archaeal alpha2 beta2
  gamma2 enzyme complex that catalyzes coenzyme B-dependent reduction of methyl-coenzyme
  M to methane during the terminal step of methanogenesis.
