identifier: GO:0016613
label: vanadium-iron nitrogenase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: An alternative nitrogenase enzyme complex containing a vanadium-iron active-site
  cluster (FeV-cofactor) expressed under molybdenum depletion in species such as Azotobacter
  vinelandii. Although the GO:0016613 ontology definition retains older generic alpha2-beta2
  tetramer wording, structural resolution of the A. vinelandii VFe protein (PDB:5N6Y)
  shows a heterohexameric alpha2beta2delta2 catalytic dinitrogenase component (VnfD2K2G2)
  partnered with a homodimeric iron-protein nitrogenase reductase (VnfH2).
definition_source: DOI:10.1038/nchembio.2428
mapping_status: PROPOSED
parent_structures:
- GO:0016610
components:
- component_id: vnfd_alpha_subunit
  label: Nitrogenase vanadium-iron protein alpha chain
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR010142
  gene_symbols:
  - vnfD
  stoichiometry: 2 copies per VnfD2K2G2 vanadium-iron dinitrogenase heterohexamer
  essentiality: ESSENTIAL
  role: Catalytic alpha subunit of the vanadium-iron dinitrogenase (VFe protein) that
    coordinates the active-site FeV-cofactor and forms the VnfG-binding contact surface.
  evidence:
  - reference: PMID:28692069
    notes: Sippel and Einsle 2017 (DOI:10.1038/nchembio.2428; PDB:5N6Y) resolved the
      1.35-Angstrom structure of Azotobacter vinelandii VnfD2K2G2 vanadium nitrogenase,
      showing VnfD housing the FeV-cofactor and binding VnfG.
  - reference: PMID:2345152
    notes: Joerger et al. 1990 (DOI:10.1128/jb.172.6.3400-3408.1990) characterized
      the Azotobacter vinelandii vnfDGK operon encoding the vanadium-dependent nitrogenase
      subunits.
