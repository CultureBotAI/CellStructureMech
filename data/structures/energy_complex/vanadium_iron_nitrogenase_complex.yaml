  grounding: InterPro:IPR005977
  gene_symbols:
  - vnfH
  stoichiometry: 2 copies per VnfH2 reductase homodimer
  essentiality: ESSENTIAL
  role: ATP-dependent iron-protein 2 reductase subunit (VnfH) that forms a [4Fe-4S]-bridged
    homodimer delivering electrons to the VnfD2K2G2 catalytic component during vanadium-dependent
    nitrogen fixation.
  evidence:
  - reference: GO:0016613
    notes: GO:0016613 defines the vanadium-iron nitrogenase complex as containing
      a homodimeric nitrogenase reductase paired with the vanadium-iron dinitrogenase.
  - reference: PMID:3226421
    notes: Raina et al. 1988 (DOI:10.1007/bf00340189) cloned and sequenced the Azotobacter
      vinelandii vnfH gene encoding the iron-protein reductase of the vanadium nitrogenase
      system.
