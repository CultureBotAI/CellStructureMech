functions:
- function_id: vanadium_iron_nitrogenase_activity
  label: nitrogenase activity
  grounding: GO:0016163
  description: Catalyzes ATP-dependent reduction of dinitrogen to ammonium and dihydrogen
    at the vanadium-containing FeV-cofactor under molybdenum-limiting conditions.
  evidence:
  - reference: GO:0016163
    notes: GO:0016163 defines nitrogenase activity.
  - reference: PMID:28692069
    notes: Sippel and Einsle 2017 resolved the FeV-cofactor active site of A. vinelandii
      vanadium nitrogenase that catalyzes dinitrogen and carbon monoxide reduction.
