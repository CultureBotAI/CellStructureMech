  gene_symbols:
  - vnfG
  stoichiometry: 2 copies per VnfD2K2G2 vanadium-iron dinitrogenase heterohexamer
  essentiality: ESSENTIAL
  role: Four-helix-bundle delta subunit (VnfG) bound exclusively to the VnfD alpha
    subunit on the periphery of the VnfD2K2G2 catalytic component and required for
    diazotrophic growth with vanadium.
  evidence:
  - reference: PMID:28692069
    notes: Sippel and Einsle 2017 (DOI:10.1038/nchembio.2428; PDB:5N6Y) resolved two
      four-helix VnfG subunits bound to VnfD in the A. vinelandii VnfD2K2G2 heterohexamer,
      refuting older generic tetramer assumptions.
  - reference: PMID:2345152
    notes: Joerger et al. 1990 (DOI:10.1128/jb.172.6.3400-3408.1990) demonstrated
      that vnfG lies between vnfD and vnfK and is required for vanadium-dependent
      diazotrophic growth.
