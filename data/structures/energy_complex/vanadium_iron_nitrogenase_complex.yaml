causal_graphs:
- graph_id: vanadium_iron_nitrogenase_assembly_and_catalysis
  title: VnfD2K2G2 and VnfH2 assembly and catalysis in the vanadium-iron nitrogenase
    complex
  description: In Azotobacter vinelandii, VnfD alpha, VnfK beta, and VnfG delta subunits
    assemble the heterohexameric VFe catalytic component that partners with the homodimeric
    VnfH reductase to form the vanadium-iron nitrogenase complex and catalyze dinitrogen
    reduction.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Represents the A. vinelandii VnfD2K2G2-VnfH2 subunit architecture (PDB:5N6Y)
    and GO:0016163 nitrogenase activity without modeling VnfEN-mediated FeV-cofactor
    maturation.
