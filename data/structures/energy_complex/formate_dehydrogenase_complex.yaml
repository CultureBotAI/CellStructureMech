causal_graphs:
- graph_id: formate_dehydrogenase_complex_mechanism
  title: Formate dehydrogenase complex formate oxidation and redox-loop quinone reduction
  description: Formate oxidation at the selenocysteine-Mo-bisMGD catalytic site of
    the formate dehydrogenase complex transfers electrons through an iron-sulfur wire
    to a di-heme b membrane subunit that reduces menaquinone with cytoplasmic protons.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the whole-complex function and constituent layout
    without resolving individual Mo-bisMGD, iron-sulfur, heme, or quinone-site electron-transfer
    steps.
