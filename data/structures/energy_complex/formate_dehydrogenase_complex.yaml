identifier: GO:0009326
label: formate dehydrogenase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: An enzyme complex that catalyzes the dehydrogenation of formate to produce
  carbon dioxide (CO2). A multisubunit molybdenum/tungsten-cofactor- and iron-sulfur-cluster-containing
  oxidoreductase complex in bacteria and archaea (including respiratory membrane-bound
  Fdh-N/FdnGHI and Fdh-O/FdoGHI in Escherichia coli and cytoplasmic NAD+/F420-linked
  formate dehydrogenases in methanogens and methylotrophs) that catalyzes the two-electron
  oxidation of formate (HCOO-) to CO2 and H+. Respiratory formate dehydrogenase complexes
  couple periplasmic formate oxidation to menaquinone reduction via a redox loop that
  conserves energy as proton-motive force.
definition_source: GO:0009326
mapping_status: PROPOSED
parent_structures:
- GO:1990204
components:
