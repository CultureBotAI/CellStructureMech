  label: formate dehydrogenase-N alpha subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - fdnG
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral family was asserted for nitrate-inducible
    FdnG; the reviewed E. coli entry carries molybdopterin oxidoreductase domains
    and Fdn/Fdo-adjacent signatures that were not verified as exclusive to formate
    dehydrogenase N alpha subunits.
  role: Mo-bisMGD catalytic alpha subunit of the nitrate-inducible formate dehydrogenase
    N complex. Functions within the respiratory/metabolic formate dehydrogenase holoenzyme
    in formate dehydrogenase complex in the canonical membrane-bound respiratory FdnGHI/FdoGHI
    holoenzyme (alongside soluble cytoplasmic NAD+-dependent isoforms across taxa).
