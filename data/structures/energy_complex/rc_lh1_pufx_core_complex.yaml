identifier: cellstructuremech:rc_lh1_pufx_core_complex
label: RC-LH1-PufX core complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A purple-bacterial chromatophore membrane protein complex that contains
  a photochemical reaction center, LH1 antenna proteins and PufX, receives excitation
  from surrounding LH2 antennae, and reduces quinone during cyclic photosynthetic
  electron transport.
