  taxon_label: Bacteria
  presence: UNIVERSAL
  note: Lost only in a few lineages with no membrane bioenergetics.
  reference: DOI:10.1146/annurev-biochem-013118-110903
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: UNIVERSAL
  note: Archaea use the related A-type ATP synthase, homologous to the V-type ATPase.
  reference: DOI:10.1146/annurev-biochem-013118-110903
canonical_examples:
