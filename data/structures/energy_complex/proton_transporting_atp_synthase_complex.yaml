identifier: GO:0045259
label: proton-transporting ATP synthase complex
definition: 'The rotary motor enzyme that makes ATP from ADP and phosphate using the
  ion motive force across the membrane. It has two coupled sectors: a membrane-embedded
  Fo, whose c-ring turns as protons cross it, and a soluble F1 (alpha3beta3gammadeltaepsilon),
  whose catalytic beta subunits are driven through their conformational cycle by the
  rotating gamma subunit.'
definition_source: GO:0045259
synonyms:
- synonym_text: F1Fo ATP synthase
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1146/annurev-biochem-013118-110903
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
components:
- component_id: f1_head
  label: F1 catalytic head (alpha3beta3)
  component_type: PROTEIN_COMPLEX
  gene_symbols:
  - atpA
  - atpD
  stoichiometry: three alpha and three beta subunits, alternating
  essentiality: ESSENTIAL
  role: Carries the three catalytic sites; ATP is made as each beta subunit passes
    through its conformational cycle.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 describes the alpha3beta3 head and its three catalytic
      sites.
- component_id: central_stalk
  label: central stalk (gamma, epsilon)
  component_type: PROTEIN_COMPLEX
  gene_symbols:
  - atpG
  - atpC
  essentiality: ESSENTIAL
  role: Rotates inside the alpha3beta3 head, driving the catalytic cycle; couples
    Fo rotation to F1.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 describes the central stalk transmitting rotation into
      the catalytic head.
- component_id: c_ring
  label: Fo c-ring
  component_type: PROTEIN_COMPLEX
  gene_symbols:
  - atpE
  stoichiometry: 8-17 c subunits depending on the organism
  essentiality: ESSENTIAL
  role: 'The rotor: each subunit carries an ion-binding site, and the ring turns as
    ions pass.'
  evidence:
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 reviews c-ring stoichiometries and their bearing on the
      H+/ATP ratio.
- component_id: a_subunit
  label: Fo subunit a
  component_type: PROTEIN
  gene_symbols:
  - atpB
  essentiality: ESSENTIAL
  role: Provides the two offset half-channels through which ions enter and leave the
    c-ring.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 describes the two half-channels in subunit a and the ion
      path across the membrane.
- component_id: peripheral_stalk
  label: peripheral stalk (b2, delta)
  component_type: PROTEIN_COMPLEX
  gene_symbols:
  - atpF
  - atpH
  essentiality: ESSENTIAL
  role: 'Stator: holds the alpha3beta3 head against the torque of the rotating central
    stalk.'
  evidence:
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 describes the peripheral stalk as the stator resisting
      rotation of the head.
taxonomic_distribution:
