  note: The genetic and biochemical reference for the bacterial F1Fo enzyme (atp operon).
  reference: DOI:10.1146/annurev-biochem-013118-110903
- taxon_id: NCBITaxon:1423
  taxon_label: Bacillus subtilis
  note: Reference Gram-positive enzyme.
  reference: DOI:10.1146/annurev-biochem-013118-110903
functions:
- function_id: atp_synthesis
  label: proton motive force-driven ATP synthesis
  grounding: GO:0015986
  description: Ion flux down the electrochemical gradient turns the rotor, and rotation
    drives ATP synthesis in F1.
  evidence:
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 reviews rotary catalysis and its coupling to the ion motive
      force.
