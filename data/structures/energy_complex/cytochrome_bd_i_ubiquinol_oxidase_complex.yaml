causal_graphs:
- graph_id: cytochrome_bd_i_quinol_oxygen_coupling
  title: Cytochrome bd-I reduces oxygen with ubiquinol electrons
  description: Cytochrome bd-I oxidase converts ubiquinol and oxygen to ubiquinone
    and water through its CydA and CydB large subunits and contributes to respiratory
    energy conservation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the terminal oxidase reaction, the two large CydAB
    subunits, and the CydX and YnhF-like/CydH small single-transmembrane subunits
    of the intact bd-I complex without resolving heme b558, heme b595, heme d, or
    quinone-channel chemistry.
