functions:
- function_id: ubiquinol_oxygen_terminal_oxidase_activity
  label: ubiquinol:oxygen terminal oxidase activity
  description: Cytochrome bd-I oxidizes ubiquinol, reduces molecular oxygen to water,
    and conserves respiratory-chain energy without using the heme-copper oxidase fold.
  evidence:
  - reference: InterPro:IPR002585
    notes: InterPro describes CydA-family proteins as alternative oxidases that oxidize
      ubiquinol and reduce oxygen as part of the electron transport chain.
  - reference: DOI:10.1126/science.aay0967
    notes: Safarian et al. 2019 solved the E. coli cytochrome bd-I oxidase structure
      deposited as PDB:6RKO.
  - reference: PMID:31604309
    notes: The PubMed abstract for Safarian et al. 2019 describes cytochrome bd-type
      quinol oxidases as respiratory-chain enzymes that catalyze molecular-oxygen
      reduction to water.
