discussions:
- discussion_id: bd_i_small_subunit_scope
  prompt: Resolve how CydX/YbgT and YnhF-like small subunits should be split across
    cytochrome bd-I, bd-II, and two-subunit CydAB oxidases.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#cydx_small_subunit
  - components#ynhf_like_cydh_subunit
  rationale: PDB:6RKO supports a four-subunit E. coli bd-I oxidase with CydX and YnhF,
    while PDB:7NKZ supports a two-subunit Mycobacterium tuberculosis bd oxidase; this
    record should not project E. coli bd-I small subunits onto every bd-type oxidase.
  evidence:
  - reference: PDB:6RKO
    notes: PDB:6RKO resolves CydA, CydB, YnhF, and CydX polymer entities in E. coli
      cytochrome bd-I oxidase.
  - reference: PDB:7NKZ
    notes: PDB:7NKZ resolves a two-polymer-entity Mycobacterium tuberculosis cytochrome
      bd oxidase.
  posed_by: codex
  posed_date: '2026-09-24'
