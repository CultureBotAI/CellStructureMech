identifier: cellstructuremech:cytochrome_bd_i_ubiquinol_oxidase_complex
label: cytochrome bd-I ubiquinol oxidase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Cytochrome bd-I ubiquinol oxidase complex is a membrane-bound CydAB respiratory
  terminal oxidase with small bd-I accessory subunits that oxidizes ubiquinol, reduces
  molecular oxygen to water, and contributes to the respiratory proton motive force.
definition_source: DOI:10.1126/science.aay0967
mapping_status: PROPOSED
