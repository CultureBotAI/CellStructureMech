causal_graphs:
- graph_id: cytochrome_bd_i_quinol_oxygen_coupling
  title: Cytochrome bd-I reduces oxygen with ubiquinol electrons
  description: Cytochrome bd-I oxidase passes electrons from ubiquinol through its
    CydA and CydB large subunits to oxygen and contributes to respiratory energy conservation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the terminal oxidase reaction and the two large
    CydAB subunits without resolving heme b558, heme b595, heme d, or quinone-channel
    chemistry.
