identifier: GO:0045277
label: respiratory chain complex IV
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Respiratory chain complex IV is a membrane-bound cytochrome c oxidase
  complex that transfers electrons from reduced cytochrome c to dioxygen and couples
  oxygen reduction to proton translocation across a respiratory membrane.
