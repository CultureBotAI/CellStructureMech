discussions:
- discussion_id: complex_iv_component_groundings
  prompt: Resolve exact source-neutral families for cytochrome c oxidase subunits
    II and III, and add lineage-specific mitochondrial, cbb3, ba3, and caa3 accessory
    subunits without collapsing them into the Paracoccus aa3 four-subunit model.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#cytochrome_c_oxidase_subunit_ii
  - components#cytochrome_c_oxidase_subunit_iii
  rationale: GO exactly grounds respiratory chain complex IV across mitochondrial
    and bacterial cytochrome c oxidases, but the first component model is anchored
    to the PDB:1QLE Paracoccus aa3 complex and should not invent exact family CURIEs
    for subunits whose InterPro entries are broad or domain-only.
  evidence:
  - reference: PDB:1QLE
    notes: PDB:1QLE resolves the four-subunit Paracoccus denitrificans aa3 cytochrome
      c oxidase.
  - reference: InterPro:IPR045187
    notes: IPR045187 is a family that spans cytochrome c and quinol oxidase subunit
      II proteins.
  - reference: InterPro:IPR024791
    notes: IPR024791 is a family that includes cytochrome c oxidase subunit III plus
      quinol oxidase subunit III child families.
  posed_by: codex
  posed_date: '2026-09-24'
