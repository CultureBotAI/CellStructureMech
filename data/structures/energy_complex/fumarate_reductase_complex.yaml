functions:
- function_id: quinol_fumarate_reductase_activity
  label: quinol:fumarate reductase activity
  description: Fumarate reductase oxidizes quinol to quinone while reducing fumarate
    to succinate during anaerobic respiratory electron transport.
  evidence:
  - reference: GO:0045283
    notes: GO:0045283 defines fumarate reductase by the quinol-to-quinone and fumarate-to-succinate
      reaction opposite to respiratory complex II.
  - reference: DOI:10.1126/science.284.5422.1961
    notes: Iverson et al. 1999 solved the structure of the E. coli fumarate reductase
      respiratory complex.
