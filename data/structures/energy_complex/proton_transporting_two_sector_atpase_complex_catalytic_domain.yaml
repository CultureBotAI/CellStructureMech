  edges:
  - subject: central_rotational_stalk
    predicate: drives conformational cycling of
    object: catalytic_hexamer_head
    description: Rotation of the asymmetric central-stalk axle inside the catalytic
      hexamer drives sequential open, loose, and tight conformational transitions
      across the three catalytic nucleotide-binding sites.
    evidence:
    - reference: GO:0033178
    - reference: DOI:10.1146/annurev-biochem-013118-110903
      snippet: ATP synthases are rotary molecular motors that couple transmembrane
        ion transport in the membrane-embedded F0 sector to ATP synthesis or hydrolysis
        in the soluble F1 sector.
      notes: Supports rotational driving of catalytic-hexamer conformational cycling
        by the central stalk.
  - subject: central_rotational_stalk
    predicate: is part of
    object: catalytic_domain
    description: The central rotational stalk forms the asymmetric rotor shaft inside
      the catalytic domain.
    evidence:
    - reference: GO:0033178
      notes: GO:0033178 defines the catalytic sector as consisting of a hexameric
        head and a central stalk.
  - subject: catalytic_hexamer_head
    predicate: is part of
    object: catalytic_domain
    description: The alternating hexameric head subunits form the three catalytic
      nucleotide-binding sites of the catalytic domain.
    evidence:
    - reference: DOI:10.1146/annurev-biochem-013118-110903
      notes: Kuehlbrandt 2019 describes the hexameric catalytic head containing three
        nucleotide-binding catalytic sites.
  - subject: catalytic_domain
    predicate: mediates
    object: rotary_atp_catalysis
    description: Conformational cycling of the hexameric head coupled to rotary motion
      of the central stalk catalyzes ATP synthesis or hydrolysis.
    evidence:
    - reference: GO:0033178
      notes: GO:0033178 defines the domain by catalyzing ATP synthesis or hydrolysis
        coupled to rotary motion of the central stalk.
    - reference: DOI:10.1146/annurev-biochem-013118-110903
      notes: Kuehlbrandt 2019 reviews rotary catalysis in the catalytic domain.
