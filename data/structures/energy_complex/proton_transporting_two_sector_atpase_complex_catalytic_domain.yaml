identifier: GO:0033178
label: proton-transporting two-sector ATPase complex, catalytic domain
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that forms part of a proton-transporting two-sector
  ATPase complex and catalyzes ATP synthesis or hydrolysis. The catalytic sector consists
  of a hexameric head and a central stalk; substrate binding and rotary motion of
  the central stalk is coupled to proton transport in the membrane sector.
definition_source: GO:0033178
mapping_status: PROPOSED
