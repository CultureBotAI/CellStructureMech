functions:
- function_id: rotary_atp_catalysis
  label: proton-transporting ATPase activity, rotational mechanism
  grounding: GO:0046961
  description: Catalyzes ATP synthesis or hydrolysis in the hexameric head coupled
    to rotary motion of the central stalk and proton translocation in the membrane
    sector.
  evidence:
  - reference: GO:0033178
    notes: GO:0033178 defines the catalytic domain by catalyzing ATP synthesis or
      hydrolysis coupled via rotary motion of the central stalk to proton transport.
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 reviews rotary catalysis in the hexameric head driven
      by the central stalk.
  - reference: DOI:10.1038/nrm2272
    notes: Forgac 2007 reviews ATP hydrolysis in the V1 catalytic domain driving rotary
      proton transport.
