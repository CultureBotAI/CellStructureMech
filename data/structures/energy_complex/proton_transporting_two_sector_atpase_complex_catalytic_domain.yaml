  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - atpA
  - atpD
  - VMA1
  - VMA2
  stoichiometry: three alternating catalytic and non-catalytic subunit pairs (alpha3beta3
    or A3B3)
  essentiality: ESSENTIAL
  role: Alternating hexameric ring (alpha3beta3 in F1, A3B3 in V1) containing three
    catalytic nucleotide-binding sites that synthesize or hydrolyze ATP.
  evidence:
  - reference: GO:0033178
    notes: GO:0033178 defines the catalytic sector as consisting of a hexameric head
      and a central stalk that catalyze ATP synthesis or hydrolysis.
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 describes the alpha3beta3 hexameric head and its three
      catalytic sites.
