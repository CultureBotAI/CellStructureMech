  essentiality: ESSENTIAL
  role: Asymmetric central shaft (gamma/epsilon in F1, D/F in V1) whose rotation inside
    the hexameric head couples catalytic conformational cycling to proton transport
    in the membrane sector.
  evidence:
  - reference: GO:0033178
    notes: GO:0033178 specifies that substrate binding and rotary motion of the central
      stalk is coupled to proton transport in the membrane sector.
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 describes the rotating gamma/epsilon central stalk driving
      conformational cycling of the catalytic beta subunits.
