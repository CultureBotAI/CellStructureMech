identifier: GO:0033176
label: proton-transporting V-type ATPase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A proton-transporting two-sector ATPase complex that couples ATP hydrolysis
  to the transport of protons across a concentration gradient. The resulting transmembrane
  electrochemical potential of H+ is used to drive a variety of (i) secondary active
  transport systems via H+-dependent symporters and antiporters and (ii) channel-mediated
  transport systems. The complex comprises a membrane sector (V0) that carries out
  proton transport and a cytoplasmic compartment sector (V1) that catalyzes ATP hydrolysis.
  V-type ATPases are found in the membranes of organelles such as vacuoles, endosomes,
  and lysosomes, and in the plasma membrane. A rotary proton-pumping nanomachine composed
  of a peripheral catalytic V1 domain that hydrolyzes ATP and a membrane-embedded
  V0 domain that translocates protons across biological membranes. Present across
  yeasts, filamentous fungi, protists, and certain bacteria (V/A-type ATPases), the
  proton-transporting V-type ATPase complex acidifies vacuoles, lysosomes, endosomes,
  Golgi cisternae, and acidocalcisomes to energize secondary active transport and
  pH-dependent proteolysis.
