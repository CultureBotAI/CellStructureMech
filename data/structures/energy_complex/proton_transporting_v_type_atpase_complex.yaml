causal_graphs:
- graph_id: proton_transporting_v_type_atpase_complex_mechanism
  title: Proton-transporting V-type ATPase rotary catalysis and organelle acidification
  description: Reversible association of the cytosolic V1 catalytic sector with the
    membrane V0 sector reconstitutes the proton-transporting V-type ATPase complex,
    coupling ATP hydrolysis to rotary c-ring proton translocation across organelle
    membranes.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph distinguishes V1 catalysis from V0 proton transport but
    does not assert a complete subunit-level rotary cycle.
