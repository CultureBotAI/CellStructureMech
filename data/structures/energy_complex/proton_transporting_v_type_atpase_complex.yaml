  essentiality: ESSENTIAL
  role: Cytosolic catalytic sector that hydrolyzes ATP and couples catalysis to rotation
    of the central rotor and membrane proteolipid ring, not rotation of the entire
    V0 sector. Functions in the rotary proton-transporting V-type ATPase holoenzyme
    in proton-transporting V-type ATPase complex.
  evidence:
  - reference: GO:0000221
    notes: GO:0000221 defines the vacuolar V1 domain as a V-ATPase domain found in
      the vacuolar membrane.
  - reference: DOI:10.1128/MMBR.70.1.177-191.2006
    notes: Kane 2006 reviews organelle acidification by the yeast vacuolar H+-ATPase
      and the soluble V1 sector.
  - reference: DOI:10.1038/nature14365
    notes: Zhao et al. 2015 abstract distinguishes the rotating central subcomplex
      from peripheral stalks that prevent the entire membrane-bound region from turning.
