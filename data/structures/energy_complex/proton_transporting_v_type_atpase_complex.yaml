  note: Exhibits proton-transporting V-type ATPase complex (GO:0033176) in the rotary
    proton-transporting V-type ATPase holoenzyme. Budding yeast vacuoles are acidified
    by a membrane V-ATPase whose assembly, regulation, and structure have been characterized
    genetically and structurally.
  reference: DOI:10.1128/MMBR.70.1.177-191.2006
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Characterized model system for proton-transporting V-type ATPase complex (GO:0033176)
    in the rotary proton-transporting V-type ATPase holoenzyme. Fungal model for vacuolar
    V-ATPase assembly, reversible disassembly, structure, function, and compartment-specific
    regulation of acidification.
  reference: DOI:10.1128/MMBR.70.1.177-191.2006
functions:
- function_id: vacuolar_lumen_acidification
  label: vacuolar acidification
  grounding: GO:0007035
  description: Mediated by proton-transporting V-type ATPase complex (GO:0033176)
    in the rotary proton-transporting V-type ATPase holoenzyme. The vacuolar V-ATPase
    pumps protons across the vacuolar membrane to lower the pH of the vacuolar lumen.
  evidence:
  - reference: GO:0007035
    notes: GO:0007035 denotes processes that lower vacuolar pH by raising the vacuolar
      hydrogen-ion concentration.
  - reference: DOI:10.1016/j.bbamcr.2008.08.003
    notes: Li and Kane 2009 review the yeast lysosome-like vacuole and its V-ATPase-dependent
      acidification.
- function_id: rotary_proton_pumping
  label: proton-transporting ATPase activity, rotational mechanism
  grounding: GO:0046961
  description: Mediated by proton-transporting V-type ATPase complex (GO:0033176)
    in the rotary proton-transporting V-type ATPase holoenzyme. ATP hydrolysis in
    V1 is coupled through rotary catalysis to proton translocation through V0.
  evidence:
  - reference: GO:0046961
    notes: GO:0046961 denotes ATP-driven proton transport across a membrane by a rotational
      mechanism.
  - reference: DOI:10.1038/nrm2272
    notes: Forgac 2007 reviews V-ATPases as rotary proton pumps that couple ATP hydrolysis
      to proton transport.
