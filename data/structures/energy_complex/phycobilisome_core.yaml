identifier: cellstructuremech:phycobilisome_core
label: phycobilisome core
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Allophycocyanin-containing central cylinder assembly of a phycobilisome
  that receives excitation energy from peripheral rods and routes it toward chlorophyll
  photosystems.
definition_source: DOI:10.1146/annurev-biophys-062920-063657
mapping_status: PROPOSED
