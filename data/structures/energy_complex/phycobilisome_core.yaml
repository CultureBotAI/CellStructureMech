components:
- component_id: allophycocyanin_core_phycobiliproteins
  label: allophycocyanin core phycobiliproteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - apcA
  - apcB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro:IPR012128 covers the broader phycobilisome alpha/beta
    subunit family, including rod phycobiliproteins as well as allophycocyanin alpha
    and beta proteins; InterPro:IPR006245 covers allophycocyanin beta subunits without
    alpha subunits. No exact source-neutral InterPro, Pfam, NCBIfam, or Complex Portal
    CURIE for the complete allophycocyanin core phycobiliprotein set was verified.
  role: Core allophycocyanin alpha and beta subunits that assemble into the central
    phycobilisome core cylinders and carry tuned bilin chromophores for rod-to-photosystem
    excitation transfer.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews the allophycocyanin core as the central cylinder assembly
      that accepts excitation from peripheral phycobilisome rods.
  - reference: DOI:10.1038/s41467-021-25813-y
    notes: Sauer et al. 2021 resolved PCC 7002 and PCC 7120 allophycocyanin core subunits
      within intact phycobilisomes by cryo-EM.
- component_id: core_linkers_and_terminal_emitters
  label: phycobilisome core linker and terminal emitter polypeptides
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - apcC
  - apcD
  - apcE
  - apcF
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro:IPR011134 covers allophycocyanin linker proteins, but
    the core linker and terminal emitter set is broader and includes specialized terminal
    emitters and the ApcE core-membrane linker. No exact taxon-agnostic CURIE spanning
    this mixed core set was verified.
  role: Core linker and terminal-emitter polypeptides that stabilize the allophycocyanin
    core and tune final excitation transfer toward chlorophyll photosystems.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews core linker and terminal-emitter roles in phycobilisome
      assembly and downhill energy transfer.
  - reference: DOI:10.1038/s41467-021-25813-y
    notes: Sauer et al. 2021 modeled PCC 7002 and PCC 7120 core linkers and terminal
      emitters in light-harvesting and photoprotected phycobilisome states.
- component_id: core_phycobilin_chromophores
  label: allophycocyanin-bound phycobilin chromophores
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: A phycobilisome core carries covalently attached bilin pigments,
    but this pass did not verify an exact ChEBI CURIE for the complete allophycocyanin-bound
    chromophore set.
  role: Covalently attached linear tetrapyrrole pigments that absorb and relay excitation
    within the allophycocyanin core.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews allophycocyanin-bound phycobilins as the energy-transfer
      chromophores of the phycobilisome core.
taxonomic_distribution:
- taxon_id: NCBITaxon:1117
  taxon_label: Cyanobacteriota
  presence: COMMON
  note: Cyanobacterial phycobilisomes contain allophycocyanin cores that accept excitation
    from peripheral rods.
  reference: DOI:10.1146/annurev-biophys-062920-063657
- taxon_id: NCBITaxon:2763
  taxon_label: Rhodophyta
  presence: COMMON
  note: Red algal phycobilisomes share the core-and-rod architecture in which a central
    allophycocyanin core collects excitation from rods.
  reference: DOI:10.1146/annurev-biophys-062920-063657
canonical_examples:
- taxon_id: NCBITaxon:32049
  taxon_label: Picosynechococcus sp. PCC 7002
  note: Cyanobacterial model whose phycobilisome core was resolved by cryo-EM to model
    core-mediated excitation transfer.
  reference: DOI:10.1038/s41467-021-25813-y
- taxon_id: NCBITaxon:32053
  taxon_label: Thermostichus vulcanus
  note: Thermophilic cyanobacterium whose core and rods were resolved in an intact
    light-harvesting phycobilisome.
  reference: DOI:10.1038/s41467-022-30962-9
functions:
- function_id: allophycocyanin_core_energy_transfer
  label: photosynthesis, light harvesting
  grounding: GO:0009765
  description: The phycobilisome core receives excitation from peripheral phycobiliprotein
    rods and transfers it through terminal emitters toward chlorophyll-containing
    photosystems.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews rod-to-core energy transfer through allophycocyanin and
      terminal emitters in phycobilisomes.
  - reference: DOI:10.1038/s41467-021-25813-y
    notes: Sauer et al. 2021 modeled excitation-energy transfer through cyanobacterial
      phycobilisome cores.
evidence:
- reference: DOI:10.1146/annurev-biophys-062920-063657
  notes: Sui 2021, Structure of Phycobilisomes, Annual Review of Biophysics.
- reference: DOI:10.1038/s41467-021-25813-y
  notes: Sauer et al. 2021, Structural insight into the mechanism of energy transfer
    in cyanobacterial phycobilisomes, Nature Communications.
- reference: DOI:10.1038/s41467-022-30962-9
  notes: Kawakami et al. 2022, Core and rod structures of a thermophilic cyanobacterial
    light-harvesting phycobilisome, Nature Communications.
- reference: GO:0030076
  notes: Gene Ontology cellular-component term for the broader light-harvesting complex
    class.
- reference: GO:0030089
  notes: Gene Ontology cellular-component term for the containing phycobilisome complex.
- reference: GO:0009765
  notes: Gene Ontology biological-process term for photosynthesis, light harvesting.
- reference: InterPro:IPR012128
  notes: InterPro family for phycobilisome alpha/beta subunits; broader than the allophycocyanin-only
    core phycobiliproteins because it also includes peripheral rod phycobiliproteins.
- reference: InterPro:IPR006245
  notes: InterPro family for allophycocyanin beta subunits; narrower than the complete
    alpha/beta core phycobiliprotein component.
- reference: InterPro:IPR011134
  notes: InterPro family for allophycocyanin linker proteins; narrower than the combined
    phycobilisome core linker and terminal emitter set.
causal_graphs:
- graph_id: phycobilisome_core_energy_transfer
  title: The allophycocyanin core routes rod excitation to photosystems
  description: Peripheral phycobilisome rods transfer captured excitation to the central
    allophycocyanin core. Core bilins and terminal emitters route that energy toward
    chlorophyll-containing photosystems.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records source-to-core-to-photosystem directionality without
    modeling individual excitonic states or lineage-specific photoprotective rearrangements.
