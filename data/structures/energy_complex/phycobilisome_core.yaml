discussions:
- discussion_id: ground_phycobilisome_core_constituents
  prompt: Resolve exact InterPro, Pfam, NCBIfam, Complex Portal or ChEBI accessions
    for phycobilisome core allophycocyanins, terminal emitters, core linkers and bound
    phycobilins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#allophycocyanin_core_phycobiliproteins
  - components#core_linkers_and_terminal_emitters
  - components#core_phycobilin_chromophores
  rationale: This first child record keeps mixed allophycocyanin, terminal emitter,
    core-linker and chromophore sets reviewed-label-only because a broad phycobiliprotein
    family or phycobilin class could blur core constituents with peripheral rod constituents.
  posed_by: codex
  posed_date: '2026-10-03'
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews the distinct allophycocyanin core, terminal-emitter and
      linker polypeptides used by phycobilisomes.
  - reference: InterPro:IPR012128
    notes: InterPro:IPR012128 is broader than allophycocyanin core phycobiliproteins
      because it also covers rod alpha/beta phycobiliproteins.
  - reference: InterPro:IPR006245
    notes: InterPro:IPR006245 denotes the beta subunit branch rather than the complete
      alpha/beta allophycocyanin core subunit set.
  - reference: InterPro:IPR011134
    notes: InterPro:IPR011134 covers allophycocyanin linker proteins without covering
      every core linker or terminal emitter.
- discussion_id: core_not_whole_phycobilisome
  prompt: Keep the phycobilisome core distinct from the whole phycobilisome and from
    peripheral phycobilisome rods.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - part_of
  rationale: GO:0030089 denotes the complete phycobilisome. The core is a named allophycocyanin-containing
    subassembly of the complete antenna, while peripheral rods contain different phycobiliproteins
    and dock onto the core.
  resolution_note: Minted cellstructuremech:phycobilisome_core with GO:0030076 as
    a broader light-harvesting-complex parent and GO:0030089 as the containing phycobilisome.
  posed_by: codex
  posed_date: '2026-10-03'
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews the phycobilisome as a core-and-rod light-harvesting complex.
  - reference: GO:0030089
    notes: GO:0030089 identifies the whole phycobilisome rather than the core subassembly
      alone.
