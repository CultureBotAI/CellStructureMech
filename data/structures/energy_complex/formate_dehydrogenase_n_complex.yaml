functions:
- function_id: formate_dehydrogenase_quinone_activity
  label: formate dehydrogenase (quinone) activity
  grounding: GO:0036397
  description: The FdnGHI complex oxidizes formate to carbon dioxide while reducing
    a membrane quinone to quinol.
  evidence:
  - reference: GO:0036397
    notes: GO:0036397 defines formate dehydrogenase (quinone) activity as formate
      plus quinone yielding CO2 plus quinol.
  - reference: PMID:11884747
    notes: Jormakka et al. 2002 solved the E. coli formate dehydrogenase-N structure
      and described its basis for proton-motive-force generation.
