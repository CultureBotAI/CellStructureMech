identifier: cellstructuremech:formate_dehydrogenase_n_complex
label: formate dehydrogenase N complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A nitrate-inducible, membrane-bound formate:quinone oxidoreductase complex
  whose FdnG, FdnH, and FdnI subunits oxidize formate and pass electrons to a membrane
  quinone during anaerobic respiration.
definition_source: ComplexPortal:CPX-1975
