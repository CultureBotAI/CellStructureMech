definition: A peripheral bacteriochlorophyll-containing light-harvesting antenna protein
  complex of purple bacterial chromatophore membranes that broadens the photosynthetic
  absorption cross-section and transfers excitation energy toward RC-LH1 reaction-center
  core complexes.
