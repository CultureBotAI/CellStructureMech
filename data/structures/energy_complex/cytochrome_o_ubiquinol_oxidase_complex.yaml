functions:
- function_id: cytochrome_bo3_ubiquinol_oxidase_activity
  label: cytochrome bo3 ubiquinol oxidase activity
  grounding: GO:0009486
  description: Cytochrome bo3 ubiquinol oxidase oxidizes ubiquinol, reduces molecular
    oxygen to water, and moves protons to the periplasmic side of the respiratory
    membrane.
  evidence:
  - reference: GO:0009486
    notes: GO:0009486 defines the cytochrome bo3 ubiquinol oxidase reaction with ubiquinol
      as donor, oxygen as acceptor, and proton release on the periplasmic side.
  - reference: DOI:10.1038/82824
    notes: Abramson et al. 2000 solved the E. coli ubiquinol oxidase structure and
      its ubiquinone binding site.
