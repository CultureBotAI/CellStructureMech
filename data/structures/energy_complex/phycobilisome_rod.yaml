discussions:
- discussion_id: ground_phycobilisome_rod_constituents
  prompt: Resolve exact InterPro, Pfam, NCBIfam, Complex Portal, or ChEBI accessions
    for phycobilisome rod phycobiliproteins, rod linkers, and bound phycobilins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#rod_phycobiliproteins
  - components#rod_linker_polypeptides
  - components#rod_phycobilin_chromophores
  rationale: This first rod child record keeps the mixed rod phycobiliprotein, linker,
    and chromophore groups reviewed-label-only because a broad phycobiliprotein family
    would blur rod constituents with core constituents.
  posed_by: codex
  posed_date: '2026-10-03'
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews the distinct rod phycobiliproteins, rod linkers, and phycobilins
      used by phycobilisomes.
  - reference: InterPro:IPR012128
    notes: InterPro:IPR012128 is broader than rod phycobiliproteins because it also
      covers allophycocyanin core subunits.
- discussion_id: rod_not_whole_phycobilisome
  prompt: Keep the phycobilisome rod distinct from the whole phycobilisome and from
    the allophycocyanin core.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - part_of
  rationale: GO:0030089 denotes the complete phycobilisome. The rod is a peripheral
    phycobiliprotein subassembly of the complete antenna, while the allophycocyanin
    core is a different central subassembly that accepts rod excitation.
  resolution_note: Minted cellstructuremech:phycobilisome_rod with GO:0030076 as a
    broader light-harvesting-complex parent and GO:0030089 as the containing phycobilisome.
  posed_by: codex
  posed_date: '2026-10-03'
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews the phycobilisome as a core-and-rod light-harvesting complex.
  - reference: GO:0030089
    notes: GO:0030089 identifies the whole phycobilisome rather than a rod subassembly.
