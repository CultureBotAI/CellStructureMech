identifier: cellstructuremech:phycobilisome_rod
label: phycobilisome rod
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Peripheral phycobiliprotein cylinder subassembly of a phycobilisome that
  binds phycobilin chromophores, absorbs excitation energy, and transfers it inward
  to the allophycocyanin core.
definition_source: DOI:10.1038/s41467-022-30962-9
mapping_status: PROPOSED
