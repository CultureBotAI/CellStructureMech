parent_structures:
- GO:0030076
part_of:
- GO:0030089
components:
- component_id: rod_phycobiliproteins
  label: rod phycobiliproteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - cpcA
  - cpcB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro:IPR012128 covers the broader phycobilisome alpha/beta
    subunit family, including allophycocyanin core subunits as well as rod phycocyanin
    and phycoerythrin subunits. No exact source-neutral InterPro, Pfam, NCBIfam, or
    Complex Portal CURIE for the complete rod-only phycobiliprotein set was verified.
  role: Pigment-binding alpha and beta phycobiliprotein subunits that assemble into
    peripheral rod disks and absorb incoming light.
  evidence:
  - reference: DOI:10.1038/s41467-022-30962-9
    notes: Kawakami et al. 2022 resolved a T. vulcanus phycocyanin rod and describe
      phycobiliprotein alpha and beta subunits with linear tetrapyrrole chromophores
      as the phycocyanin rod building blocks.
- component_id: rod_linker_polypeptides
  label: phycobilisome rod linker polypeptides
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - cpcC
  - cpcD
  - cpcG
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Rod, rod-cap, and rod-core linker polypeptides are structurally
    distinct. No exact taxon-agnostic InterPro, Pfam, NCBIfam, or Complex Portal CURIE
    spanning the mixed phycobilisome rod linker set was verified.
  role: Rod-associated linkers stabilize stacked phycobiliprotein disks and tune chromophore
    energies for transfer from rods toward the allophycocyanin core.
  evidence:
  - reference: DOI:10.1038/s41467-022-30962-9
    notes: Kawakami et al. 2022 classify T. vulcanus rod, rod-terminal, and rod-core
      linker proteins and model linker positions in the phycocyanin rod structure.
- component_id: rod_phycobilin_chromophores
  label: rod-bound phycobilin chromophores
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Phycobilisome rods carry covalently attached bilin pigments, but
    this pass did not verify an exact ChEBI CURIE for the complete rod-bound chromophore
    set.
  role: Covalently attached linear tetrapyrrole pigments that absorb photons and initiate
    rod-to-core excitation transfer.
  evidence:
  - reference: DOI:10.1038/s41467-022-30962-9
    notes: Kawakami et al. 2022 describe phycocyanobilin chromophores covalently bound
      to the alpha and beta subunits of T. vulcanus phycobilisome rods.
taxonomic_distribution:
- taxon_id: NCBITaxon:1117
  taxon_label: Cyanobacteriota
  presence: COMMON
  note: Cyanobacterial hemidiscoidal phycobilisomes contain phycocyanin rods; Kawakami
    et al. 2022 resolved a T. vulcanus PC rod.
  reference: DOI:10.1038/s41467-022-30962-9
- taxon_id: NCBITaxon:2763
  taxon_label: Rhodophyta
  presence: COMMON
  note: Red algal phycobilisomes include densely packed phycoerythrin rods in block
    and hemiellipsoidal PBS architectures.
  reference: DOI:10.1038/s41467-022-30962-9
canonical_examples:
- taxon_id: NCBITaxon:32053
  taxon_label: Thermostichus vulcanus
  note: Thermophilic cyanobacterium whose stacked phycocyanin rods were resolved from
    a light-harvesting phycobilisome preparation.
  reference: DOI:10.1038/s41467-022-30962-9
functions:
- function_id: rod_to_core_light_harvesting
  label: photosynthesis, light harvesting
  grounding: GO:0009765
  description: Phycobilisome rods absorb light in peripheral phycobiliprotein-bound
    bilins and transfer the resulting excitation inward to the allophycocyanin core.
  evidence:
  - reference: DOI:10.1038/s41467-022-30962-9
    notes: Kawakami et al. 2022 resolved a light-harvesting phycobilisome rod and
      describe phycobilisomes as solar-energy-capturing antennae for photosynthetic
      reaction centers.
evidence:
- reference: DOI:10.1038/s41467-022-30962-9
  notes: Kawakami et al. 2022, Core and rod structures of a thermophilic cyanobacterial
    light-harvesting phycobilisome, Nature Communications.
- reference: GO:0030076
  notes: Gene Ontology cellular-component term for the broader light-harvesting complex
    class.
- reference: GO:0030089
  notes: Gene Ontology cellular-component term for the containing phycobilisome complex.
- reference: GO:0009765
  notes: Gene Ontology biological-process term for photosynthesis, light harvesting.
- reference: InterPro:IPR012128
  notes: InterPro family for phycobilisome alpha/beta subunits; broader than the rod-only
    phycobiliproteins because it also includes allophycocyanin core subunits.
causal_graphs:
- graph_id: phycobilisome_rod_light_capture
  title: Peripheral rods absorb light and transfer excitation to the core
  description: Rod phycobiliproteins bind phycobilin chromophores that capture light.
    Rod linkers stabilize disk stacking and tune the downhill transfer path toward
    the allophycocyanin core.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records rod assembly and rod-to-core transfer directionality
    without modeling individual bilin sites or lineage-specific rod composition.
