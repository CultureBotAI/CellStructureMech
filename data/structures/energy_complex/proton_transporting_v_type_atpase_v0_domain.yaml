identifier: GO:0033179
label: proton-transporting V-type ATPase, V0 domain
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein complex that forms part of a proton-transporting V-type ATPase
  and mediates proton transport across a membrane. The V0 complex consists of at least
  four different subunits (a,c,d and e); six or more c subunits form a proton-binding
  rotor ring. The integral membrane proton-translocating sector (V0 domain) of the
  proton-transporting V-type ATPase complex. Assembled in the endoplasmic reticulum
  of yeasts, fungi, and protists from the a-subunit stator (Vph1p/Stv1p) Containing
  two hemichannels, a decameric proteolipid c-ring rotor (Vma3p, Vma11p, Vma16p),
  and coupling subunits d (Vma6p) and e (Vma9p), the V0 domain conducts protons across
  endomembranes when driven by the V1 rotary motor.
