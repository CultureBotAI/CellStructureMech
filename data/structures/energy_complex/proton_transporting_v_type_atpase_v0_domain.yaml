  title: V-type ATPase V0 domain ER assembly and rotary proton translocation
  description: ER assembly factors Vma21p, Vma12p, and Vma22p assemble the proteolipid
    c-ring and stator subunit a into the proton-transporting V-type ATPase V0 domain,
    which conducts protons through two offset hemichannels during V1-driven rotation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures V0 as the membrane proton-translocation sector of
    the intact V-ATPase without asserting its individual proteolipid ring, stalk,
    or a-subunit composition.
