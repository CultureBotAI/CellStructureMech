  reference: DOI:10.1038/ncomms12454
functions:
- function_id: photosynthetic_light_harvesting
  label: photosynthesis, light harvesting
  grounding: GO:0009765
  description: Light-harvesting complexes absorb radiant energy in photosynthetic
    antenna pigments and route the resulting excitation toward reaction-center complexes.
  evidence:
  - reference: GO:0030076
    notes: GO defines light-harvesting complexes by radiant-energy harvest and transfer
      to a reaction center.
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviewed phycobilisome light capture and downhill excitation-energy
      transfer to photosystems.
  - reference: DOI:10.1038/ncomms12454
    notes: Nielsen et al. 2016 modeled excitation transfer through the CsmA baseplate
      toward downstream reaction centers.
