synonyms:
- synonym_text: antenna complex
  synonym_type: RELATED_SYNONYM
  source: GO:0030076
parent_structures:
- GO:0032991
components:
- component_id: photosynthetic_antenna_apoproteins
  label: photosynthetic antenna apoproteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral CURIE for all pigment-binding antenna apoprotein
    families across phycobilisomes, purple-bacterial LH2 complexes and chlorosome
    CsmA baseplates was verified in this pass.
  role: Pigment-binding protein subunits or scaffolds that organize photosynthetic
    antenna pigments for light absorption and excitation-energy transfer.
  evidence:
  - reference: GO:0030076
    notes: GO defines a light-harvesting complex as a protein-pigment complex.
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviewed phycobiliprotein and linker-polypeptide organization
      in phycobilisome antennae.
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 imaged LH2 antenna complexes in native purple-bacterial
      photosynthetic membranes.
  - reference: DOI:10.1038/ncomms12454
    notes: Nielsen et al. 2016 resolved the CsmA protein lattice of the chlorosome
      baseplate antenna complex.
- component_id: photosynthetic_antenna_pigments
  label: photosynthetic antenna pigments
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No single ChEBI CURIE exactly covers the chlorophyll, bacteriochlorophyll
    and phycobilin pigments bound by all microbial light-harvesting complex classes.
  role: Light-absorbing cofactors whose tuned excitation energies support radiant-energy
    capture and transfer to photosynthetic reaction centers.
  evidence:
  - reference: GO:0030076
    notes: GO defines a light-harvesting complex as a pigment-containing protein complex.
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviewed phycobilin chromophores covalently attached to cyanobacterial
      phycobilisomes.
  - reference: DOI:10.1038/nature02823
    notes: Bahatyrova et al. 2004 localized bacteriochlorophyll-containing LH2 complexes
      in purple-bacterial chromatophores.
  - reference: DOI:10.1038/ncomms12454
    notes: Nielsen et al. 2016 modeled bacteriochlorophyll a pigments bound inside
      the chlorosome CsmA baseplate.
taxonomic_distribution:
