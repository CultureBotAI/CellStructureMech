identifier: GO:0030076
label: light-harvesting complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A protein-pigment complex that may be closely or peripherally associated
  to photosynthetic reaction centers that participate in harvesting and transferring
  radiant energy to the reaction center.
definition_source: GO:0030076
mapping_status: PROPOSED
