functions:
- function_id: rotary_proton_atp_coupling
  label: proton-transporting ATPase activity, rotational mechanism
  grounding: GO:0046961
  description: Couples transmembrane proton translocation through the membrane sector
    (Fo or Vo) to ATP synthesis or hydrolysis in the cytoplasmic catalytic sector
    (F1 or V1) via rotation of the central rotor.
  evidence:
  - reference: GO:0016469
    notes: GO:0016469 defines the complex by rotational catalysis of ATP synthesis
      or hydrolysis coupled to transmembrane proton transport.
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 reviews rotational coupling between the Fo proton turbine
      and F1 catalytic head.
  - reference: DOI:10.1038/nrm2272
    notes: Forgac 2007 reviews rotary coupling between V1 ATP hydrolysis and V0 proton
      transport.
