identifier: GO:0016469
label: proton-transporting two-sector ATPase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A large protein complex that catalyzes the synthesis or hydrolysis of
  ATP by a rotational mechanism, coupled to the transport of protons across a membrane.
  The complex comprises a membrane sector (F0 or V0) that carries out proton transport
  and a cytoplasmic compartment sector (F1 or V1) that catalyzes ATP synthesis or
  hydrolysis.
