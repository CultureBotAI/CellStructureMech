causal_graphs:
- graph_id: narghi_quinol_nitrate_electron_transfer
  title: NarGHI routes quinol electrons to nitrate
  description: NarI accepts quinol-derived electrons through hemes and passes them
    through NarH iron-sulfur centers to the NarG Mo-bisMGD site that reduces nitrate
    to nitrite.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures NarI-to-NarH-to-NarG electron flow without resolving
    individual heme, 3Fe-4S, 4Fe-4S, or molybdenum-center redox states.
