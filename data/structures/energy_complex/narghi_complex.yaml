  edges:
  - subject: nari_gamma
    predicate: receives electrons from
    object: quinol
    description: The membrane NarI cytochrome receives electrons from quinol and passes
      them toward the NarH beta subunit.
    evidence:
    - reference: GO:0044799
      notes: GO:0044799 states that NarGHI electrons pass from NarI hemes down a NarH/NarG
        iron-sulfur chain.
  - subject: narh_beta
    predicate: relays electrons toward
    object: narg_alpha
    description: NarH relays electrons through iron-sulfur centers toward the NarG
      molybdenum catalytic site.
    evidence:
    - reference: GO:0044799
      notes: GO:0044799 places NarH between the NarI hemes and the Mo-bisMGD cofactor
        in NarG.
  - subject: nitrate
    predicate: accepts electrons in
    object: nitrate_reductase_quinone_activity
    description: Nitrate is the terminal electron acceptor reduced to nitrite by NarGHI
      quinol:nitrate oxidoreductase activity.
    evidence:
    - reference: GO:0160182
      notes: GO:0160182 defines the reaction as quinol plus nitrate yielding quinone,
        water, and nitrite.
  - subject: nari_gamma
    predicate: contributes to
    object: nitrate_reductase_quinone_activity
    description: The NarI membrane cytochrome supplies quinol-derived electrons to
      the NarGHI quinol:nitrate reductase reaction.
    evidence:
    - reference: PMID:12910261
      notes: Bertero et al. 2003 resolved the NarI transmembrane electron-entry subunit
        in the nitrate reductase A structure.
  - subject: narghi
    predicate: enables
    object: nitrate_reductase_quinone_activity
    description: The complete NarGHI complex oxidizes quinol while reducing nitrate
      to nitrite.
    evidence:
    - reference: GO:0044799
      notes: GO:0044799 defines NarGHI as the terminal reductase in anaerobic nitrate-respiration
        electron transport.
    - reference: ComplexPortal:CPX-1974
      notes: Complex Portal CPX-1974 curates the E. coli K-12 NarGHI nitrate reductase
        A complex.
