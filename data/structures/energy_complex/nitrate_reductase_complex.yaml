functions:
- function_id: nitrate_reductase_quinone_activity
  label: nitrate reductase (quinone) activity
  grounding: GO:0160182
  description: The NarGHI complex oxidizes quinol to quinone while reducing nitrate
    to nitrite during anaerobic nitrate respiration.
  evidence:
  - reference: GO:0160182
    notes: GO:0160182 defines quinol-dependent nitrate reductase activity as catalysis
      of quinol plus nitrate to quinone, water, and nitrite.
  - reference: PMID:12910261
    notes: Bertero et al. 2003 structurally traced the NarGHI respiratory electron-transfer
      route from NarI through NarH to the NarG Mo-bisMGD catalytic site.
