identifier: GO:0009325
label: nitrate reductase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: An enzyme complex that catalyzes the formation of nitrate from nitrite
  with the concomitant reduction of an acceptor. A molybdenum-cofactor- and iron-sulfur-containing
  multisubunit oxidoreductase complex (exemplified by the respiratory membrane-bound
  NarGHI complex in Escherichia coli and denitrifying bacteria, periplasmic NapAB,
  and assimilatory Nas/Nia complexes in bacteria, fungi, and microalgae) that catalyzes
  the two-electron reduction of nitrate (NO3-) to nitrite (NO2-). In anaerobic respiration,
  the membrane-bound nitrate reductase complex couples quinol oxidation in the cytoplasmic
  membrane to proton-motive force generation.
