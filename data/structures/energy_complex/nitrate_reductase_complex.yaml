  gene_symbols:
  - narG
  essentiality: CONDITIONAL
  role: Molybdenum-bis(molybdopterin guanine dinucleotide)-binding catalytic alpha
    subunit that accepts electrons from NarH and reduces nitrate to nitrite. Functions
    within the molybdopterin nitrate reductase respiratory/assimilatory complex in
    nitrate reductase complex in the canonical membrane-bound respiratory NarGHI holoenzyme
    (alongside periplasmic NapAB and soluble assimilatory isoforms across taxa).
