  label: nitrate reductase (quinone) activity
  grounding: GO:0160182
  description: Mediated by nitrate reductase complex (GO:0009325) within the molybdopterin
    nitrate reductase respiratory/assimilatory complex. The NarGHI complex oxidizes
    quinol to quinone while reducing nitrate to nitrite during anaerobic nitrate respiration.
  evidence:
