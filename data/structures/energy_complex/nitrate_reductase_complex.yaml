causal_graphs:
- graph_id: nitrate_reductase_complex_mechanism
  title: Nitrate reductase complex electron relay, nitrate reduction, and PMF generation
  description: Electrons from menaquinol/ubiquinol oxidation at the membrane heme
    b subunit flow through the [Fe-S] relay subunit to the Mo-bisMGD catalytic site
    of the nitrate reductase complex, reducing nitrate to nitrite and generating a
    transmembrane proton gradient.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures NarI-to-NarH-to-NarG electron flow without resolving
    individual heme, 3Fe-4S, 4Fe-4S, or molybdenum-center redox states.
