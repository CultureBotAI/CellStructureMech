    to proton translocation.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the NADH-to-quinone and proton-coupling layout without
    resolving individual Nuo/Nqo subunits, iron-sulfur centers, quinone-channel conformational
    changes, or accessory mitochondrial subunits.
