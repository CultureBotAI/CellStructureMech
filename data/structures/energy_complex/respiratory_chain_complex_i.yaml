        route to the quinone-binding site.
  - subject: quinone_pool
    predicate: activates proton pumping by
    object: membrane_arm
    description: Quinone reduction is coupled across the L-shaped enzyme to proton-translocation
      pathways in the membrane arm.
    evidence:
    - reference: PMID:23417064
      notes: Baradaran et al. 2013 proposed that redox energy from quinone reduction
        drives long-range conformational changes in antiporter-like membrane domains.
  - subject: membrane_arm
    predicate: contributes to
    object: proton_gradient
    description: The membrane arm translocates protons while complex I reduces quinone,
      adding to the respiratory proton motive force.
    evidence:
