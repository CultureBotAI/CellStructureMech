        proton translocation.
  - subject: membrane_arm
    predicate: contributes to
    object: nadh_ubiquinone_activity
    description: The proton-pumping membrane arm is the membrane-coupling sector of
      the NADH:quinone oxidoreductase.
    evidence:
    - reference: PMID:23417064
      notes: Baradaran et al. 2013 resolved the intact enzyme that couples NADH:ubiquinone
        electron transfer to proton translocation.
