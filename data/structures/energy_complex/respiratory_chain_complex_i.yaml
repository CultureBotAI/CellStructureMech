identifier: GO:0045271
label: respiratory chain complex I
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Respiratory chain complex I is an enzyme of the respiratory chain. It
  consists of several polypeptide chains and is L-shaped, with a horizontal arm lying
  in the membrane and a vertical arm that projects into the matrix. The electrons
  of NADH enter the chain at this complex.
