functions:
- function_id: nadh_ubiquinone_oxidoreductase
  label: NADH dehydrogenase (ubiquinone) activity
  grounding: GO:0008137
  description: Complex I oxidizes NADH, passes electrons through its peripheral arm
    to the quinone site, reduces quinone, and couples that redox reaction to proton
    translocation by the membrane arm.
  evidence:
  - reference: GO:0008137
    notes: GO:0008137 defines the complex I molecular function as NADH-dependent ubiquinone
      reduction coupled to proton translocation.
  - reference: PMID:23417064
    notes: Baradaran et al. 2013 connected the intact bacterial complex I structure
      to electron transfer, quinone reduction, and coupled proton translocation.
