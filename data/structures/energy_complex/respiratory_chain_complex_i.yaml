components:
- component_id: peripheral_electron_transfer_arm
  label: peripheral electron-transfer arm
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  role: Hydrophilic arm that binds the NADH-oxidizing module and an iron-sulfur relay,
    accepting electrons for delivery toward the quinone site.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral GO, Complex Portal, InterPro, Pfam, or
    NCBIfam CURIE was verified for the complete soluble electron-transfer arm without
    collapsing bacterial Nuo/Nqo and mitochondrial conserved core nomenclature.
  essentiality: ESSENTIAL
  evidence:
  - reference: GO:0045271
    notes: GO:0045271 defines complex I as an L-shaped respiratory-chain enzyme with
      an arm that projects from the membrane and receives NADH-derived electrons.
  - reference: PMID:23417064
    notes: Baradaran et al. 2013 resolved the Thermus thermophilus complex I structure,
      including the hydrophilic electron-transfer domain and its iron-sulfur clusters.
- component_id: membrane_proton_pumping_arm
  label: membrane proton-pumping arm
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  role: Membrane-embedded antiporter-like arm that converts quinone-site redox chemistry
    into proton translocation across the membrane.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This row denotes the complete membrane arm shared by bacterial
    and mitochondrial complex I enzymes; no exact source-neutral family CURIE was
    curated for that multi-subunit arm.
  essentiality: ESSENTIAL
  evidence:
  - reference: GO:0045271
    notes: GO:0045271 defines respiratory complex I as L-shaped, with one arm lying
      in the membrane.
  - reference: PMID:23417064
    notes: Baradaran et al. 2013 resolved the T. thermophilus membrane arm and described
      antiporter-like domains linked to proton translocation.
canonical_examples:
- taxon_id: NCBITaxon:274
  taxon_label: Thermus thermophilus
