  edges:
  - subject: nadh
    predicate: donates electrons to
    object: peripheral_arm
    description: NADH-derived electrons enter the complex I peripheral arm before
      passing through its internal redox cofactors.
    evidence:
    - reference: GO:0045271
      notes: GO:0045271 defines respiratory complex I as the respiratory-chain complex
        where electrons of NADH enter.
  - subject: peripheral_arm
    predicate: reduces
    object: quinone_pool
    description: Electrons move through iron-sulfur cofactors in the peripheral arm
      toward a quinone-binding chamber.
    evidence:
