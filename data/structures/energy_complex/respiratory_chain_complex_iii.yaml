  title: Complex III links quinol oxidation to cytochrome c reduction
  description: Respiratory complex III uses a cytochrome b, Rieske iron-sulfur protein,
    and cytochrome c1 core to move electrons from quinol to cytochrome c and contribute
    to a proton motive force.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the three-subunit catalytic core and the overall
    quinol-to-cytochrome-c reaction without resolving individual hemes, the Q-cycle
    bifurcation, ubiquinone-site occupancy, or inhibitor-induced Rieske-domain movements.
