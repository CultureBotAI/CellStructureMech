    notes: GO:0008121 defines the quinol plus ferricytochrome c oxidoreductase reaction
      coupled to proton translocation.
  - reference: DOI:10.1074/jbc.M708608200
    notes: Esser et al. 2008 solved inhibitor-bound structures of the Cereibacter
      sphaeroides cytochrome bc1 complex.
