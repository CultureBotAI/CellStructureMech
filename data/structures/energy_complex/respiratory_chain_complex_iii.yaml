components:
- component_id: cytochrome_b
  label: cytochrome b
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR030689
  gene_symbols:
  - fbcB
  - petB
  essentiality: ESSENTIAL
  role: Central membrane cytochrome that binds the quinol redox sites and carries
    low- and high-potential b-type hemes.
  evidence:
  - reference: GO:0045275
    notes: GO:0045275 defines cytochrome b as one of the three catalytic core subunits
      of respiratory complex III.
  - reference: InterPro:IPR030689
    notes: InterPro IPR030689 is the source-neutral family for cytochrome b proteins
      in cytochrome bc1 complexes.
  - reference: PDB:2QJP
    notes: RCSB maps PDB:2QJP polymer entity 1 to Cereibacter sphaeroides cytochrome
      b, UniProtKB:Q02761.
- component_id: rieske_iron_sulfur_subunit
  label: Rieske iron-sulfur subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR006317
  gene_symbols:
  - fbcF
  - petA
  essentiality: ESSENTIAL
  role: 2Fe-2S protein that accepts electrons from the quinol-oxidation site and transfers
    them toward cytochrome c1.
  evidence:
  - reference: GO:0045275
    notes: GO:0045275 defines the Rieske iron-sulfur protein as one of the three catalytic
      core subunits.
  - reference: InterPro:IPR006317
    notes: InterPro IPR006317 names the ubiquinol-cytochrome c reductase iron-sulphur
      subunit family and separates it from the cyanobacterial and chloroplast b6f
      Rieske protein.
  - reference: PDB:2QJP
    notes: RCSB maps PDB:2QJP polymer entity 3 to Cereibacter sphaeroides ubiquinol-cytochrome
      c reductase iron-sulfur subunit, UniProtKB:Q02762.
- component_id: cytochrome_c1
  label: cytochrome c1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR002326
  gene_symbols:
  - fbcC
  essentiality: ESSENTIAL
  role: c-type cytochrome that receives electrons from the Rieske iron-sulfur subunit
    and passes them to soluble cytochrome c.
  evidence:
  - reference: GO:0045275
    notes: GO:0045275 defines cytochrome c1 as one of the three catalytic core subunits.
  - reference: InterPro:IPR002326
    notes: InterPro IPR002326 is the source-neutral family for cytochrome c1 subunits
      of cytochrome bc1 complexes.
  - reference: PDB:2QJP
    notes: RCSB maps PDB:2QJP polymer entity 2 to Cereibacter sphaeroides cytochrome
      c1, UniProtKB:Q02760.
