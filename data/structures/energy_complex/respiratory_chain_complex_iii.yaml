identifier: GO:0045275
label: respiratory chain complex III
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Respiratory chain complex III is a membrane-bound cytochrome bc1 oxidoreductase
  complex that uses a cytochrome b, Rieske iron-sulfur protein, and cytochrome c1
  catalytic core to transfer electrons from quinol to cytochrome c while translocating
  protons.
definition_source: GO:0045275
