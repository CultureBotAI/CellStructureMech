functions:
- function_id: sodium_pumping_nadh_quinone_oxidoreductase_activity
  label: sodium-pumping NADH:quinone oxidoreductase activity
  description: Na+-NQR couples electron transfer from NADH to ubiquinone with export
    of sodium ions from the cytoplasm toward the periplasm.
  evidence:
  - reference: GO:0160292
    notes: GO:0160292 defines the complex as the bacterial NqrABCDEF protein complex
      that couples NADH-to-ubiquinone electron transfer to sodium-ion transport from
      cytoplasm to periplasm.
  - reference: PDB:7XK3
    notes: RCSB annotates all six PDB:7XK3 polymer entities with EC 7.2.1.1, NADH:ubiquinone
      reductase (Na+-transporting).
  - reference: DOI:10.1038/s41467-022-31718-1
    notes: Kishikawa et al. 2022 solved Vibrio cholerae Na+-NQR cryo-EM structures
      and describe the enzyme as coupling NADH-to-ubiquinone electron transfer with
      Na+ pumping.
