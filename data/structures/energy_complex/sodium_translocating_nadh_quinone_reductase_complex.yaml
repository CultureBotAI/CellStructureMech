identifier: GO:0160292
label: sodium-translocating NADH:quinone reductase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Sodium-translocating NADH:quinone reductase complex is a bacterial respiratory-chain
  protein complex composed of NqrA, NqrB, NqrC, NqrD, NqrE, and NqrF that transfers
  electrons from NADH to ubiquinone while exporting sodium ions across the cytoplasmic
  membrane.
