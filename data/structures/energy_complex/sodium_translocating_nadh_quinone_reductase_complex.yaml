causal_graphs:
- graph_id: sodium_nqr_redox_sodium_coupling
  title: Na+-NQR couples NADH oxidation to sodium export
  description: The sodium-translocating NADH:quinone reductase complex reduces ubiquinone
    with NADH-derived electrons while moving sodium ions from the cytoplasm toward
    the periplasm.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures whole-enzyme redox-to-sodium coupling without resolving
    individual flavin, riboflavin, 2Fe-2S, or ubiquinone-site electron-transfer steps.
