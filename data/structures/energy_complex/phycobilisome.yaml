- component_id: linker_polypeptides
  label: phycobilisome linker polypeptides
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - cpcC
  - cpcD
  - cpcG
  - apcC
  - apcE
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Rod, core, core-membrane and terminal-emitter linker proteins are
    structurally and functionally distinct; no exact single family CURIE was curated
    for the full linker set.
  role: Internal and terminal linkers organize phycobiliprotein disks, stabilize core
    and rod geometry, and tune bilin energies along the transfer path.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 summarizes rod, core and core-membrane linker roles in phycobilisome
      assembly and energy transfer.
  - reference: DOI:10.1038/s41467-022-30962-9
    notes: Kawakami et al. 2022 modelled linker positions in the core and rods of
      a cyanobacterial phycobilisome.
