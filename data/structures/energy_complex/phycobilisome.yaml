identifier: GO:0030089
label: phycobilisome
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A membrane-associated light-harvesting pigment-protein complex of cyanobacteria
  and red algae, built from phycobiliprotein core and rod cylinders plus linker polypeptides,
  that funnels phycobilin excitation energy to photosynthetic reaction centers.
definition_source: GO:0030089
