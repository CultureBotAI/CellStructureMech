functions:
- function_id: photosynthetic_light_harvesting
  label: photosynthetic light harvesting
  description: Phycobilisomes absorb visible light through phycobilin-bearing rods
    and transfer excitation through the allophycocyanin core to photosystem II and,
    in some states, photosystem I.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews phycobilisome light capture and downhill excitation-energy
      transfer to photosystems.
- function_id: photoprotection
  label: photoprotection
  description: Some cyanobacterial phycobilisomes switch to quenched or orange-carotenoid-protein-bound
    states that dissipate excess absorbed energy.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews phycobilisome quenching and photoprotective states in
      cyanobacteria.
evidence:
- reference: DOI:10.1146/annurev-biophys-062920-063657
  notes: Sui 2021, Structure of Phycobilisomes, Annual Review of Biophysics.
- reference: DOI:10.1038/s41467-021-25813-y
  notes: Sauer et al. 2021, Structural insight into the mechanism of energy transfer
    in cyanobacterial phycobilisomes, Nature Communications.
- reference: DOI:10.1038/s41467-022-30962-9
  notes: Kawakami et al. 2022, Core and rod structures of a thermophilic cyanobacterial
    light-harvesting phycobilisome, Nature Communications.
- reference: DOI:10.1038/cr.2015.59
  notes: Chang et al. 2015, Structural organization of an intact phycobilisome and
    its association with photosystem II, Cell Research.
causal_graphs:
- graph_id: rod_core_energy_funnel
  title: Rods and linkers funnel bilin excitation through the allophycocyanin core
  description: Phycobilins covalently attached to rod phycobiliproteins absorb visible
    light. Linker proteins order stacked rod and core cylinders so excitation energy
    moves from rods into the allophycocyanin core and then into chlorophyll-containing
    photosystems.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
