- component_id: phycobilin_chromophores
  label: phycobilin chromophores
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Linear tetrapyrrole pigments covalently attached to phycobiliproteins; their
    tuned excitation energies create the directional energy-transfer gradient.
  evidence:
  - reference: DOI:10.1146/annurev-biophys-062920-063657
    notes: Sui 2021 reviews covalent phycobilin attachment and spectral tuning across
      phycobilisomes.
