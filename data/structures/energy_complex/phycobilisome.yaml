  edges:
  - subject: phycobilins
    predicate: are bound by
    object: rods
    description: Rod phycobiliproteins covalently bind linear phycobilin pigments
      that capture visible light.
    evidence:
    - reference: DOI:10.1146/annurev-biophys-062920-063657
      notes: Sui 2021 reviews the bilins carried by rod phycobiliproteins and their
        role as light absorbers.
  - subject: rods
    predicate: assemble into
    object: phycobilisome
    description: Phycobiliprotein disks stack into peripheral rods of the phycobilisome.
    evidence:
    - reference: DOI:10.1038/s41467-022-30962-9
      notes: Kawakami et al. 2022 resolved stacked phycocyanin rods in a cyanobacterial
        phycobilisome.
  - subject: core
    predicate: forms
    object: phycobilisome
    description: Allophycocyanin subunits build the core cylinders onto which peripheral
      rods dock.
    evidence:
    - reference: DOI:10.1038/s41467-021-25813-y
      notes: Sauer et al. 2021 resolved the Synechocystis phycobilisome core by cryo-EM.
  - subject: linkers
    predicate: stabilize and tune
    object: phycobilisome
    description: Linker polypeptides occupy rod and core cavities, determine the architecture
      of the assembled phycobilisome and tune chromophore energies.
    evidence:
    - reference: DOI:10.1038/s41467-022-30962-9
      notes: Kawakami et al. 2022 modelled linkers inside phycobiliprotein assemblies
        of the thermophilic cyanobacterial phycobilisome.
  - subject: rods
    predicate: transfer excitation to
    object: core
    description: The antenna rods pass absorbed excitation energy inward to the allophycocyanin
      core.
    evidence:
    - reference: DOI:10.1146/annurev-biophys-062920-063657
      notes: Sui 2021 describes the rod-to-core direction of excitation-energy transfer
        through the phycobilisome.
  - subject: core
    predicate: transfers excitation to
    object: photosystems
    description: Terminal emitters in the allophycocyanin core pass energy to thylakoid
      photosystems.
    evidence:
    - reference: DOI:10.1038/s41467-021-25813-y
      notes: Sauer et al. 2021 modelled energy transfer through the allophycocyanin
        core toward photosystem acceptors.
  - subject: photosystems
    predicate: perform
    object: light_harvesting
    description: Energy delivered from the phycobilisome enters the photosynthetic
      reaction machinery.
    evidence:
    - reference: DOI:10.1038/cr.2015.59
      notes: Chang et al. 2015 visualized phycobilisomes associated with photosystem
        II from Nostoc sp. PCC 7120.
