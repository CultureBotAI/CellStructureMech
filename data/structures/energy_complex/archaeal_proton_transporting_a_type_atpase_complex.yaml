        synthase subunit K.
    - reference: PMID:12768457
      notes: Lingl et al. 2003 verified subunit K as part of the intact M. jannaschii
        A1AO ATP synthase.
- component_id: atpi_stator_subunit
  label: A-type ATP synthase subunit I
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR002490
  gene_symbols:
  - atpI
  stoichiometry: 1 copy per A1AO holoenzyme
  essentiality: ESSENTIAL
  role: Integral membrane stator subunit of the AO sector that forms proton-access
    half-channels at the interface with the AtpK rotor ring and anchors the peripheral
    stalks.
  evidence:
  - reference: PMID:12768457
    notes: Lingl et al. 2003 identified the membrane stator subunit I (AtpI) in the
      purified M. jannaschii A1AO ATP synthase.
  - reference: PMID:19203996
    notes: Vonck et al. 2009 showed how the membrane-embedded subunit I anchors the
      two peripheral stalks against the AO rotor ring.
  protein_examples:
