  gene_symbols:
  - atpB
  stoichiometry: 3 copies per A1 headpiece (A3B3 hexamer)
  essentiality: ESSENTIAL
  role: Non-catalytic nucleotide-binding subunit of the peripheral A1 sector that
    assembles with three AtpA subunits into the A3B3 catalytic hexamer.
  evidence:
  - reference: PMID:12768457
    notes: Lingl et al. 2003 identified subunit B (AtpB) in the purified M. jannaschii
