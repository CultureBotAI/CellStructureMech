functions:
- function_id: proton_motive_force_driven_atp_synthesis
  label: proton motive force-driven ATP synthesis
  grounding: GO:0015986
  description: Couples transmembrane proton translocation through the membrane-embedded
    AO sector (AtpI-AtpK) to rotational catalysis in the peripheral A1 (AtpA3AtpB3)
    headpiece to synthesize or hydrolyze ATP.
  evidence:
  - reference: GO:1990490
    notes: GO:1990490 defines the archaeal proton-transporting A-type ATPase complex
      as catalyzing the synthesis or hydrolysis of ATP by a rotational mechanism coupled
      to proton transport across a membrane.
  - reference: PMID:15220347
    notes: Coskun et al. 2004 characterized the rotational coupling architecture between
      the AO membrane domain and A1 catalytic headpiece in M. jannaschii.
