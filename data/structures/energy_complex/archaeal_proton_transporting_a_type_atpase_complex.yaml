identifier: GO:1990490
label: archaeal proton-transporting A-type ATPase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A large proton-transporting two-sector ATPase protein complex that catalyzes
  the synthesis or hydrolysis of ATP by a rotational mechanism, coupled to the transport
  of protons across a membrane and is found in Archaea.
definition_source: GO:1990490
mapping_status: PROPOSED
synonyms:
- synonym_text: A-type ATPase protein complex
  synonym_type: BROAD_SYNONYM
  source: GO:1990490
