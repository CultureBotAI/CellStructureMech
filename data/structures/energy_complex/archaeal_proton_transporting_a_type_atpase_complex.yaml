- component_id: atpk_rotor_ring_subunit
  label: A-type ATP synthase subunit K
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR000245
  gene_symbols:
  - atpK
  stoichiometry: Oligomeric membrane rotor ring (c/K-ring) in the AO sector
  essentiality: ESSENTIAL
  role: Membrane-embedded proteolipid rotor-ring subunit of the AO sector that translocates
    ions across the archaeal membrane to drive rotation of the central stalk.
  evidence:
  - reference: PMID:12768457
    notes: Lingl et al. 2003 demonstrated that the M. jannaschii A1AO ATP synthase
      contains the membrane proteolipid subunit K (AtpK) in the AO sector.
  - reference: PMID:19203996
    notes: Vonck et al. 2009 (DOI:10.1074/jbc.M808498200) resolved the membrane-embedded
      AO rotor ring and stator architecture of the archaeal A1AO ATP synthase.
  protein_examples:
