components:
- component_id: atpa_catalytic_subunit
  label: A-type ATP synthase subunit A
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR005726
  gene_symbols:
  - atpA
  stoichiometry: 3 copies per A1 catalytic headpiece (A3B3 hexamer)
  essentiality: ESSENTIAL
  role: Catalytic nucleotide-binding subunit of the peripheral A1 sector that alternates
    with subunit B in the A3B3 hexamer and catalyzes rotational ATP synthesis or hydrolysis.
  evidence:
  - reference: PMID:12768457
    notes: Lingl et al. 2003 (DOI:10.1007/s00792-003-0318-7) isolated the intact nine-subunit
      A1AO ATP synthase from Methanocaldococcus jannaschii containing catalytic subunit
      A (AtpA).
  - reference: PMID:15220347
    notes: Coskun et al. 2004 (DOI:10.1074/jbc.M406196200) resolved the A3B3 headpiece
      and peripheral stalk organization of the M. jannaschii A-type ATP synthase by
      electron microscopy.
