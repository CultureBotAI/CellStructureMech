- taxon_id: NCBITaxon:1117
  taxon_label: Cyanobacteriota
  presence: COMMON
  note: Cyanobacteria use PSI as a major photosynthetic-membrane complex that receives
    electrons from plastocyanin and passes them toward ferredoxin.
  reference: GO:0009522
canonical_examples:
