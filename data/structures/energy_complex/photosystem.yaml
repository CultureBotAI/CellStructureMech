functions:
- function_id: photosynthetic_electron_transport
  label: photosynthetic electron transport chain
  grounding: GO:0009767
  description: Mediated by photosystem (GO:0009521) within the photosynthetic pigment-protein
    photosystem complex. In oxygenic/cyanobacterial PSI, light excitation of P700
    drives electron transfer through iron-sulfur centers toward ferredoxin, with upstream
    soluble donors restoring the reaction center. This P700 description does not cover
    all bacterial type-I reaction centers included in the generic GO definition.
  evidence:
  - reference: GO:0009522
    notes: GO:0009522 defines PSI as a light-dependent plastocyanin-ferredoxin oxidoreductase
      in cyanobacteria and chloroplasts.
  - reference: PMID:11418848
    notes: Jordan et al. 2001 connected the cyanobacterial PSI structure to light
      capture and electron transfer.
