    I (PsaA/PsaB reaction center core) was determined.
  reference: PMID:11418848
- taxon_id: NCBITaxon:32053
  taxon_label: Thermostichus vulcanus
  note: Thermophilic cyanobacterium used for atomic-resolution crystallographic determination
