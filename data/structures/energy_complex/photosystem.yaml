- component_id: photosynthetic_antenna_pigments
  label: core antenna chlorophylls, bacteriochlorophylls, and carotenoids
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Bound tetrapyrrole (chlorophyll or bacteriochlorophyll) and carotenoid cofactors
    that harvest photons, transfer excitation energy to the reaction center special
    pair, and quench triplet states.
  evidence:
  - reference: PMID:11418848
    notes: Jordan et al. 2001 resolve the network of antenna chlorophylls and carotenoids
      coordinated within the photosystem core.
