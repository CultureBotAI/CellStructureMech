causal_graphs:
- graph_id: photosystem_mechanism
  title: Photosystem light harvesting, primary charge separation, and electron transfer
  description: Excitation energy absorbed by antenna chlorophylls funnels to the special-pair
    reaction center chlorophyll of the photosystem, triggering ultrafast electron
    transfer through quinone and iron-sulfur acceptors to reduce soluble electron
    carriers.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the PSI input and output carriers without resolving
    individual Psa/Psc subfamilies, cofactors, or alternate cyclic type-I photosystem
    electron paths.
