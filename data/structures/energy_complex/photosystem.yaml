identifier: GO:0009521
label: photosystem
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A complex located in a photosynthetic membrane that consists of a photoreaction
  center associated with accessory pigments and electron carriers. Examples of this
  component are found in Arabidopsis thaliana and in photosynthetic bacterial and
  archaeal species. A pigment-protein supercomplex embedded in the photosynthetic
  thylakoid or cytoplasmic membranes of cyanobacteria, phototrophic bacteria, and
  eukaryotic microalgae that harvests light energy via chlorophyll/bacteriochlorophyll
  and carotenoid antennas and drives photochemical charge separation across a reaction
  center. Photosystems (including oxygenic Photosystem I and II and anoxygenic type
  I/II reaction centers) initiate photosynthetic electron transport coupled to ATP
  and NAD(P)H synthesis.
