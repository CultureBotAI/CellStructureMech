- component_id: psi_bound_pigments
  label: PSI chlorophyll and carotenoid cofactors
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  role: Accessory chlorophyll and carotenoid cofactors that capture excitation energy
    and couple it to reaction-center charge separation. Functions within the photosynthetic
    pigment-protein photosystem complex in photosystem.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This row groups PSI-bound pigments and avoids asserting one CHEBI
    term for a mixed chlorophyll/carotenoid cofactor set.
  essentiality: ESSENTIAL
  evidence:
