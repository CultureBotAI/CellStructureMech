  title: AnfD2K2G2 and AnfH2 assembly and catalysis in the iron-iron nitrogenase complex
  description: AnfD alpha, AnfK beta, and AnfG delta chains assemble the heterohexameric
    FeFe catalytic component that docks with homodimeric AnfH reductase to form the
    iron-iron nitrogenase complex and catalyze ATP-dependent dinitrogen reduction.
