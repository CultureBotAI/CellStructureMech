- component_id: anfh_reductase_subunit
  label: Nitrogenase iron-only iron protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR005977
  gene_symbols:
  - anfH
  stoichiometry: 2 copies per AnfH2 reductase homodimer (two AnfH2 homodimers bind
    per AnfD2K2G2 hexamer in the ADP-AlF3-trapped PDB:8OIE complex)
  essentiality: ESSENTIAL
  role: ATP-dependent iron-protein reductase subunit (AnfH; member of InterPro:IPR005977
    alongside NifH and VnfH) that forms a [4Fe-4S]-bridged homodimer and docks onto
    AnfD2K2G2 to drive electron transfer into the P-cluster.
  evidence:
  - reference: PMID:38062208
    notes: Schmidt et al. 2024 (DOI:10.1038/s41594-023-01124-2; PDB:8OIE) resolved
      two AnfH2 homodimers bound to the R. capsulatus AnfD2K2G2 hexamer in an ADP-AlF3-trapped
      state.
  - reference: PMID:8332060
    notes: Schueddekopf et al. 1993 characterized R. capsulatus anfH as encoding the
      Fe protein reductase of the iron-only nitrogenase.
