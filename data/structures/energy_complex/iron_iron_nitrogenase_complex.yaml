identifier: GO:0016611
label: iron-iron nitrogenase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: An alternative nitrogenase enzyme complex containing an iron-only active-site
  cluster (FeFe-cofactor) expressed when both molybdenum and vanadium are depleted
  in diazotrophs such as Rhodobacter capsulatus and Azotobacter vinelandii. Although
  the GO:0016611 ontology definition describes an older alpha1-beta2 or alpha2-beta2
  dinitrogenase stoichiometry, crystallographic and cryo-EM structures (PDB:8BOQ,
  PDB:8OIE) demonstrate a heterohexameric alpha2beta2delta2 catalytic component (AnfD2K2G2)
  partnered with a homodimeric iron-protein nitrogenase reductase (AnfH2).
definition_source: DOI:10.1038/s41594-023-01124-2
mapping_status: PROPOSED
parent_structures:
- GO:0016610
components:
- component_id: anfd_alpha_subunit
  label: Nitrogenase iron-iron protein alpha chain
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR011290
  gene_symbols:
  - anfD
  stoichiometry: 2 copies per AnfD2K2G2 iron-iron dinitrogenase heterohexamer
  essentiality: ESSENTIAL
  role: Catalytic alpha subunit of the iron-iron dinitrogenase (FeFe protein) that
    coordinates the active-site [8Fe-9S-C-homocitrate] FeFe-cofactor and binds the
    AnfG delta subunit.
  evidence:
  - reference: PMID:38062208
    notes: Schmidt et al. 2024 (DOI:10.1038/s41594-023-01124-2; PDB:8OIE) resolved
      the Rhodobacter capsulatus AnfD2K2G2-(AnfH2)2 iron nitrogenase complex and the
      FeFe-cofactor binding site in AnfD.
  - reference: PMID:8332060
    notes: Schueddekopf et al. 1993 (DOI:10.1111/j.1365-2958.1993.tb01611.x) sequenced
      and mutated the R. capsulatus anfHDGK operon, showing that anfD is essential
      for iron-only nitrogenase activity.
  - reference: PMID:2644222
    notes: Joerger et al. 1989 (DOI:10.1128/jb.171.2.1075-1086.1989) determined the
      Azotobacter vinelandii anfHDGKOR operon sequence.
