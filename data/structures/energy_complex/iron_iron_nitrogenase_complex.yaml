functions:
- function_id: iron_iron_nitrogenase_activity
  label: nitrogenase activity
  grounding: GO:0016163
  description: Catalyzes ATP-dependent reduction of dinitrogen to ammonium and dihydrogen
    at the iron-only FeFe-cofactor when molybdenum and vanadium are unavailable.
  evidence:
  - reference: GO:0016163
    notes: GO:0016163 defines nitrogenase activity.
  - reference: PMID:38062208
    notes: Schmidt et al. 2024 characterized dinitrogen and carbon dioxide reduction
      by the R. capsulatus AnfD2K2G2-AnfH2 iron-only nitrogenase complex.
