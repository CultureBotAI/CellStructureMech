- reference: GO:0016610
  notes: Parent Gene Ontology cellular-component term for the generic nitrogenase
    complex.
- reference: PMID:38062208
  notes: Schmidt et al. 2024 (DOI:10.1038/s41594-023-01124-2), structure and mechanism
    of the Rhodobacter capsulatus iron-only nitrogenase complex (PDB:8OIE).
- reference: PMID:8332060
  notes: Schueddekopf et al. 1993 (DOI:10.1111/j.1365-2958.1993.tb01611.x), characterization
