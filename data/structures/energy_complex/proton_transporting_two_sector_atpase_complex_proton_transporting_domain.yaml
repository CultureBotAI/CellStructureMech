functions:
- function_id: proton_transmembrane_transport
  label: proton transmembrane transport
  grounding: GO:1902600
  description: Conducts protons across the lipid bilayer via protonation and deprotonation
    of the rotating proteolipid c-ring at the interface with stator subunit a half-channels.
  evidence:
  - reference: GO:0033177
    notes: GO:0033177 defines the domain by mediating proton transport across a membrane
      as part of a two-sector ATPase complex.
  - reference: DOI:10.1146/annurev-biochem-013118-110903
    notes: Kuehlbrandt 2019 reviews transmembrane proton translocation through the
      subunit a half-channels and rotating c-ring.
