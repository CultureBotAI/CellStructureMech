identifier: GO:0031004
label: potassium ion-transporting ATPase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: 'Protein complex that carries out the reaction: ATP + H2O + K+(out) =
  ADP + phosphate + K+(in). It is a high affinity potassium uptake system. The E.
  coli complex consists of 4 proteins: KdpA is the potassium ion translocase, KdpB
  is the ATPase, and KdpC and KdpF seem to be involved in assembly and stabilization
  of the complex.'
definition_source: GO:0031004
mapping_status: PROPOSED
