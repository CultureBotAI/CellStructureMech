    role: Reviewed Escherichia coli K-12 KdpB P-type ATPase catalytic subunit.
    evidence:
    - reference: UniProtKB:P03960
      notes: Reviewed Swiss-Prot entry for Escherichia coli K-12 KdpB.
    - reference: PMID:41259220
      snippet: KdpB belongs to the superfamily of P-type ATPases with a conserved
        binding site for ions within the membrane domain and three cytoplasmic domains
        that orchestrate ATP hydrolysis via an aspartyl phosphate intermediate.
      notes: Establishes KdpB as the catalytic P-type ATPase subunit in E. coli.
  evidence:
  - reference: GO:0031004
