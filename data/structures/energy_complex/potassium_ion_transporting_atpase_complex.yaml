functions:
- function_id: p_type_potassium_transporter_activity
  label: P-type potassium transmembrane transporter activity
  grounding: GO:0008556
  description: Catalyzes ATP-driven active uptake of potassium ions across the prokaryotic
    plasma membrane via an aspartyl-phosphate intermediate.
  evidence:
  - reference: GO:0008556
    notes: GO molecular-function term for P-type potassium transmembrane transporter
      activity.
  - reference: PMID:41259220
    snippet: Under osmotic stress, bacteria express a heterotetrameric protein complex,
      KdpFABC, which functions as an ATP-dependent K+ pump to maintain intracellular
      potassium levels.
    notes: Demonstrates ATP-dependent potassium pump activity of KdpFABC.
- function_id: potassium_ion_transport
  label: potassium ion transport
  grounding: GO:0006813
  description: Maintains intracellular potassium homeostasis and turgor under potassium-depleted
    or osmotic-stress conditions.
  evidence:
  - reference: GO:0006813
    notes: GO biological-process term for potassium ion transport.
  - reference: PMID:41384914
    snippet: KdpFABC is an ATP-dependent membrane complex that enables prokaryotes
      to maintain potassium homeostasis under potassium-limited conditions.
    notes: Establishes the physiological role of KdpFABC in potassium ion transport
      and homeostasis.
