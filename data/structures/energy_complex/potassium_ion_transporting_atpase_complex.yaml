  - reference: PMID:34272288
    snippet: Our structures suggest a mechanism where ATP hydrolysis is coupled to
      K+ transfer between alternative sites in KdpB, ultimately reaching a low-affinity
      site where a water-filled pathway allows release of K+ to the cytoplasm.
    notes: Demonstrates KdpB-mediated ATP hydrolysis and cytoplasmic potassium release.
