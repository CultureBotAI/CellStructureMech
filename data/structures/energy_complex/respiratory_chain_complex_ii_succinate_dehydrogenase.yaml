    component_ref: sdha_flavoprotein
  - node_id: iron_sulfur_subunit
    label: succinate dehydrogenase iron-sulfur subunit
    node_type: GENE_OR_PROTEIN
    component_ref: sdhb_iron_sulfur_subunit
  - node_id: membrane_anchor
    label: succinate dehydrogenase SdhCD membrane anchor
    node_type: GENE_OR_PROTEIN
