identifier: GO:0045273
label: respiratory chain complex II (succinate dehydrogenase)
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: Respiratory chain complex II (succinate dehydrogenase) is a respiratory-chain
  enzyme complex that oxidizes succinate, passes electrons through flavin and iron-sulfur
  centers to membrane quinone, and thereby connects tricarboxylic-acid-cycle electron
  flow with the respiratory quinone pool.
definition_source: GO:0045273
mapping_status: PROPOSED
