  edges:
  - subject: succinate
    predicate: feeds electrons to
    object: flavoprotein
    description: Succinate is oxidized at the flavoprotein/FAD portion of complex
      II.
    evidence:
    - reference: DOI:10.1126/science.1079605
      notes: Yankovskaya et al. 2003 resolved the E. coli complex II flavoprotein
