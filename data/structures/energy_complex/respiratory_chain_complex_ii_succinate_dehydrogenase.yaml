    evidence:
    - reference: DOI:10.1126/science.1079605
      notes: Yankovskaya et al. 2003 placed the iron-sulfur subunit between the flavoprotein
        and SdhC/SdhD membrane subunits in the E. coli structure.
  - subject: membrane_anchor
    predicate: binds
    object: ubiquinone_q2
    description: The SdhCD membrane domain provides a quinone-binding site in the
      E. coli complex II structure.
    evidence:
    - reference: PDB:1NEK
      notes: The RCSB PDB:1NEK deposition resolves the E. coli SdhC/SdhD transmembrane
        subunits with bound ubiquinone Q2.
    - reference: DOI:10.1126/science.1079605
      notes: Yankovskaya et al. 2003 resolved the E. coli membrane anchor that carries
        bound ubiquinone on the quinone side of the complex.
  - subject: complex_ii
    predicate: enables
    object: succinate_dehydrogenase_activity
    description: The complete SdhABCD complex carries out the overall succinate:quinone
      oxidoreductase molecular function.
    evidence:
    - reference: GO:0045273
      notes: GO:0045273 defines respiratory chain complex II as the succinate dehydrogenase
        complex that catalyzes succinate oxidation by ubiquinone.
    - reference: PDB:1NEK
      notes: PDB:1NEK resolves the E. coli complex II SdhA, SdhB, SdhC, and SdhD proteins
        in one four-polymer structure.
