components:
- component_id: sdha_flavoprotein
  label: succinate dehydrogenase flavoprotein subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  role: Catalytic flavoprotein subunit that oxidizes succinate at FAD and begins electron
    transfer through the complex II soluble head.
  gene_symbols:
  - sdhA
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral component CURIE was asserted for the full
    SdhA family; the PDB:1NEK structure resolves the E. coli SdhA polymer entity and
    GO:0045273 grounds the complete four-polypeptide complex.
  evidence:
  - reference: GO:0045273
    notes: GO defines respiratory chain complex II as a succinate dehydrogenase complex
      that contains flavin-adenine dinucleotide and iron-sulfur.
  - reference: PDB:1NEK
    notes: RCSB maps PDB:1NEK polymer entity 1 to the E. coli SdhA flavoprotein subunit.
- component_id: sdhb_iron_sulfur_subunit
  label: succinate dehydrogenase iron-sulfur subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  role: Iron-sulfur subunit that relays electrons from the FAD site of SdhA toward
    the membrane quinone-reduction site.
  gene_symbols:
  - sdhB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral component CURIE was asserted for the complete
    SdhB iron-sulfur protein family rather than individual iron-sulfur binding domains.
  evidence:
  - reference: DOI:10.1126/science.1079605
    notes: Yankovskaya et al. 2003 resolved the four-subunit E. coli complex II architecture
      with an iron-sulfur protein linking the flavoprotein to the membrane anchor.
  - reference: PDB:1NEK
    notes: RCSB maps PDB:1NEK polymer entity 2 to the E. coli SdhB iron-sulfur protein.
- component_id: sdhcd_membrane_anchor
  label: succinate dehydrogenase SdhCD membrane anchor
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  role: Membrane-anchor module that binds quinone-site cofactors and connects the
    soluble succinate-oxidizing subunits to the respiratory membrane.
  gene_symbols:
  - sdhC
  - sdhD
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: This component row represents the paired SdhC/SdhD membrane-anchor
    subcomplex in E. coli complex II; no exact taxon-neutral GO, Complex Portal, or
    family CURIE was verified for the whole heterodimeric module.
  evidence:
  - reference: DOI:10.1126/science.1079605
    notes: Yankovskaya et al. 2003 resolved the E. coli SdhC and SdhD transmembrane
      subunits as the membrane domain of respiratory complex II.
  - reference: PDB:1NEK
    notes: RCSB maps PDB:1NEK polymer entities 3 and 4 to E. coli SdhC and SdhD, respectively.
