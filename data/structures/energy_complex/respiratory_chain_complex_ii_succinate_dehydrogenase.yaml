causal_graphs:
- graph_id: complex_ii_succinate_quinone_coupling
  title: Complex II links succinate oxidation to quinone reduction
  description: Respiratory complex II accepts electrons from succinate at its flavoprotein,
    relays them through iron-sulfur centers, and reduces a membrane quinone at its
    anchor.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the structural route from the succinate/FAD side
    to the membrane quinone side without resolving individual cofactors, quinone-channel
    chemistry, or lineage-specific menaquinone versus ubiquinone use.
  nodes:
