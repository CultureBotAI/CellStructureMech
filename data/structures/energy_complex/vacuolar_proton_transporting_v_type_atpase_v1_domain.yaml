discussions:
- discussion_id: v1_sector_not_standalone_pump
  prompt: Represent the V1 domain as the ATP-hydrolyzing sector of the intact vacuolar
    V-ATPase rather than as a standalone membrane proton pump.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#yeast_v1_domain_catalytic_sector
  rationale: GO:0000221 denotes the V1 domain, which GO places part-of the whole vacuolar
    V-ATPase complex; the V1 sector couples ATP hydrolysis to the V0 proton-translocation
    sector in the intact rotary enzyme.
  resolution_note: Curated V1 as a cytosolic catalytic sector and limited the graph
    to V1 ATP hydrolysis and V0 coupling inside the intact V-ATPase.
  evidence:
  - reference: GO:0000221
  - reference: GO:0016471
  - reference: DOI:10.1038/nrm2272
