identifier: GO:0016610
label: nitrogenase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A nitrogenase enzyme complex composed of tetrameric dinitrogenase and
  homodimeric nitrogenase reductase subcomplexes that together catalyze ATP-dependent
  reduction of dinitrogen to ammonia.
definition_source: GO:0016610
mapping_status: PROPOSED
