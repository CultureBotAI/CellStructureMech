causal_graphs:
- graph_id: molybdenum_iron_nitrogenase_assembly_and_catalysis
  title: Assembly and ATP-coupled dinitrogen reduction by the molybdenum-iron nitrogenase
    complex
  description: NifD alpha and NifK beta chains assemble the heterotetrameric MoFe
    dinitrogenase core that docks with homodimeric NifH1 iron-protein reductase to
    form the molybdenum-iron nitrogenase complex and catalyze ATP-dependent dinitrogen
    reduction.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Captures NifD/NifK/NifH1 subunit assembly into the A. vinelandii molybdenum-iron
    nitrogenase complex and its catalysis of dinitrogen reduction; NifB/NifEN-mediated
    FeMo-cofactor biosynthesis is omitted.
