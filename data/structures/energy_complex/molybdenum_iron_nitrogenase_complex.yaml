- component_id: nifh_reductase_subunit
  label: Nitrogenase iron protein 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR005977
  gene_symbols:
  - nifH1
  - nifH
  stoichiometry: 2 copies per NifH2 reductase homodimer (two NifH2 homodimers bind
    one NifD2K2 tetramer in the trapped PDB:1N2C assembly)
  essentiality: ESSENTIAL
  role: ATP-binding iron-protein reductase subunit that forms a homodimer bridging
    a single [4Fe-4S] cluster and transiently docks onto the NifD2K2 MoFe protein
    to couple MgATP hydrolysis to electron transfer into the P-cluster.
  evidence:
  - reference: GO:0016612
    notes: GO:0016612 defines the molybdenum-iron nitrogenase complex as containing
      a homodimeric nitrogenase reductase paired with the alpha2-beta2 dinitrogenase.
  - reference: PMID:9163420
    notes: Schindelin et al. 1997 (DOI:10.1038/387370a0; PDB:1N2C) resolved two NifH2
      homodimers docked on the NifD2K2 tetramer in the ADP-AlF4--stabilized transition-state
      complex.
