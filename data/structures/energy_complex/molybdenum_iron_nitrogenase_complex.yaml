identifier: GO:0016612
label: molybdenum-iron nitrogenase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: An enzyme complex containing a molybdenum-iron cluster found in many diazotrophic
  species. It is composed of two component proteins, molybdenum-iron dinitrogenase
  (MoFe protein, an alpha2beta2 heterotetramer NifD2K2 carrying P-clusters and active-site
  FeMo-cofactors) and nitrogenase reductase (Fe protein, a homodimer NifH2 carrying
  a subunit-bridging [4Fe-4S] cluster) that transiently dock to couple MgATP hydrolysis
  to electron transfer and dinitrogen reduction.
definition_source: GO:0016612
mapping_status: PROPOSED
parent_structures:
- GO:0016610
components:
- component_id: nifd_alpha_subunit
  label: Nitrogenase molybdenum-iron protein alpha chain
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR005972
  gene_symbols:
  - nifD
  stoichiometry: 2 copies per NifD2K2 molybdenum-iron dinitrogenase heterotetramer
  essentiality: ESSENTIAL
  role: Catalytic alpha subunit of the molybdenum-iron dinitrogenase (MoFe protein)
    that houses the active-site FeMo-cofactor ([Mo-7Fe-9S-C-homocitrate]) and forms
    the alpha-beta interface coordinating the [8Fe-7S] P-cluster.
  evidence:
  - reference: GO:0016612
    notes: GO:0016612 defines the molybdenum-iron dinitrogenase component as an alpha2-beta2
      heterotetramer.
  - reference: PMID:9163420
    notes: Schindelin et al. 1997 (DOI:10.1038/387370a0; PDB:1N2C) resolved the Azotobacter
      vinelandii MoFe protein alpha chain (NifD) in the ADP-AlF4--stabilized nitrogenase
      complex.
  - reference: PMID:12215645
    notes: Einsle et al. 2002 (DOI:10.1126/science.1073877) resolved the 1.16-Angstrom
      crystal structure of Azotobacter vinelandii MoFe protein and the interstitial
      ligand at the center of the NifD FeMo-cofactor.
