functions:
- function_id: molybdenum_iron_nitrogenase_activity
  label: nitrogenase activity
  grounding: GO:0016163
  description: Catalyzes ATP-dependent reduction of dinitrogen (N2) to ammonium coupled
    to obligately evolved dihydrogen (H2) and oxidation of reduced ferredoxin or flavodoxin
    at the FeMo-cofactor active site.
  evidence:
  - reference: GO:0016163
    notes: GO:0016163 defines nitrogenase activity.
  - reference: PMID:9163420
    notes: Schindelin et al. 1997 demonstrated how MgATP-driven NifH2 conformational
      change gates electron transfer into the NifD2K2 MoFe protein for dinitrogen
      reduction.
