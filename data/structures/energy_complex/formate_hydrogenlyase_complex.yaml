identifier: cellstructuremech:formate_hydrogenlyase_complex
label: formate hydrogenlyase complex
structure_category: ENERGY_COMPLEX
structure_kind: MULTIPROTEIN_COMPLEX
definition: A membrane-bound Escherichia coli formate hydrogenlyase complex in which
  FdhF and HycB-HycG subunits couple formate oxidation to proton reduction, yielding
  carbon dioxide and hydrogen gas.
definition_source: DOI:10.1038/s41467-022-32831-x
