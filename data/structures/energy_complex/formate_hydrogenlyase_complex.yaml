functions:
- function_id: formate_hydrogenlyase_activity
  label: formate hydrogenlyase activity
  description: The membrane-bound FHL complex oxidizes formate to carbon dioxide and
    transfers the released electrons through the Hyc module to reduce protons to molecular
    hydrogen.
  evidence:
  - reference: PMID:36104349
    notes: Steinhilper et al. 2022 describe E. coli FHL as a membrane-bound complex
      that couples formate oxidation by FdhF to proton reduction at the Hyc hydrogenase
      module.
evidence:
- reference: PDB:7Z0T
  notes: RCSB Protein Data Bank entry for the seven-protein E. coli formate hydrogenlyase
    composite cryo-EM structure.
- reference: GO:1990204
  notes: Gene Ontology cellular-component parent term for oxidoreductase complexes.
- reference: PMID:36104349
  notes: PubMed identifier for Steinhilper et al. 2022, Structure of the membrane-bound
    formate hydrogenlyase complex from Escherichia coli.
- reference: DOI:10.1038/s41467-022-32831-x
  notes: DOI for the Steinhilper et al. 2022 E. coli formate hydrogenlyase paper.
causal_graphs:
- graph_id: formate_hydrogenlyase_formate_to_hydrogen
  title: FHL couples formate oxidation to hydrogen evolution
  description: The membrane-bound E. coli formate hydrogenlyase complex uses FdhF
    and the HycB-HycG module to transfer electrons from formate to protons.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records the whole-complex reaction and the PDB:7Z0T subunit
    boundary without resolving individual metal clusters, membrane-coupling conformational
    changes, or maturation proteins.
