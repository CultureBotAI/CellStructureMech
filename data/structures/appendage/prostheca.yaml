  title: MreB-dependent wall synthesis extends the Caulobacter stalk
  description: Cell-cycle regulators control Caulobacter stalk biogenesis, MreB-dependent
    stalk-wall machinery builds stalk-specific peptidoglycan, and continued envelope
    extension yields a polar prostheca whose StpX and crossband proteins help maintain
    local stalk organization.
