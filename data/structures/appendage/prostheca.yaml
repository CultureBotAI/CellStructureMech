identifier: cellstructuremech:prostheca
label: prostheca
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A tubular projection of the bacterial cell envelope and cytoplasm that
  extends away from the main cell body in prosthecate bacteria. In stalked Caulobacter
  cells, the prostheca contains the inner membrane, peptidoglycan and outer membrane
  layers of the Gram-negative envelope and supports stalk-specific compartmentalization
  and nutrient uptake.
definition_source: DOI:10.1073/pnas.0909119107
mapping_status: PROPOSED
