discussions:
- discussion_id: stalk_machinery_boundary
  prompt: Keep Caulobacter-specific StpX, crossband proteins and stalk wall-synthesis
    proteins out of the prostheca component table.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - causal_graphs#caulobacter_stalk_wall_synthesis_extension
  rationale: This record denotes the envelope extension, whose cross-lineage constituents
    are the wall and membrane materials, not every protein needed for Caulobacter
    stalk elongation or compartmentalization. The first mechanism graph captures PbpC/MreB-dependent
    stalk wall synthesis, StpX localization and StpABCD crossbands as Caulobacter
    actors until exact component boundaries can be asserted.
  evidence:
  - reference: DOI:10.1371/journal.pone.0184063
    notes: Curtis 2017 compares Caulobacter and Brevundimonas stalk formation and
      highlights limited conservation for several Caulobacter stalk-associated proteins.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
