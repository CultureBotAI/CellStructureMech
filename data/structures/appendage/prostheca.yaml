components:
- component_id: stalk_peptidoglycan
  label: stalk peptidoglycan
  component_type: PEPTIDOGLYCAN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The prostheca contains stalk-specific peptidoglycan, but no exact
    source-neutral accession was curated for the Caulobacter stalk wall mesh.
  role: Forms the rigid cell-wall layer that supports the narrow cylindrical extension
    from the cell body.
  evidence:
  - reference: DOI:10.1371/journal.pgen.1007897
    notes: Billini et al. 2019 dissect stalk-specific peptidoglycan formation by Caulobacter
      stalk wall-synthesis machinery.
  - reference: DOI:10.1111/mmi.12422
    notes: Hughes et al. 2013 connect a penicillin-binding protein with synthesis
      and protein localization in the Caulobacter stalk organelle.
- component_id: stalk_envelope_lipids
  label: stalk envelope membrane lipids
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Caulobacter prosthecae extend the inner and outer membranes, but
    the first record does not assert a defined stalk-specific lipid species or exact
    lipid mixture.
  role: Build membrane bilayers that continue from the cell body envelope into the
    prostheca.
  evidence:
  - reference: DOI:10.1073/pnas.0909119107
    notes: Hughes et al. 2010 describe the Caulobacter stalk as a cylindrical extension
      of all cell envelope layers.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Prosthecae are produced by a subset of bacteria with stalked or otherwise
    prosthecate morphology and are absent from most bacterial lineages.
  reference: DOI:10.1371/journal.pone.0184063
- taxon_id: NCBITaxon:155892
  taxon_label: Caulobacter vibrioides
  presence: UNIVERSAL
  note: Caulobacter vibrioides swarmer cells differentiate into stalked cells that
    elaborate a polar prostheca during the normal developmental cycle.
  reference: DOI:10.1111/j.1365-2958.2005.04970.x
canonical_examples:
- taxon_id: NCBITaxon:565050
  taxon_label: Caulobacter vibrioides NA1000
  note: Model strain used to dissect cell-cycle-coupled stalk biogenesis, StpX stalk
    localization and MreB-dependent stalk-specific peptidoglycan assembly.
  reference: DOI:10.1073/pnas.0909119107
functions:
- function_id: stalk_envelope_extension
  label: polar envelope extension
  description: Cell-cycle-coupled stalk biogenesis extends the Caulobacter envelope
    at the old pole after the swarmer-to-stalked transition.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2005.04970.x
    notes: Biondi et al. 2006 identify a phosphorelay system that controls Caulobacter
      stalk biogenesis during cell-cycle progression.
- function_id: dilute_nutrient_scavenging
  label: nutrient uptake from dilute media
  description: The narrow envelope extension can increase the cell surface available
    for nutrient uptake in dilute media.
  evidence:
  - reference: DOI:10.1073/pnas.0602047103
    notes: Wagner et al. 2006 test a nutrient-uptake role for bacterial cell-envelope
      extensions.
  - reference: DOI:10.1046/j.1365-2958.2002.03071.x
    notes: Ireland et al. 2002 find transport-related proteins in isolated Caulobacter
      stalks.
- function_id: stalk_compartmentalization
  label: stalk compartmentalization
  description: Protein diffusion barriers divide the Caulobacter stalk from the cell
    body and separate stalk segments from each other.
  evidence:
  - reference: DOI:10.1016/j.cell.2012.10.046
    notes: Schlimpert et al. 2012 show that crossband diffusion barriers compartmentalize
      the Caulobacter stalk.
