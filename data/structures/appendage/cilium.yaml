causal_graphs:
- graph_id: ift_builds_membrane_sheathed_axoneme
  title: Intraflagellar transport builds the ciliary axoneme
  description: A basal body seeds axoneme extension, a transition-zone gate organizes
    entry into the membrane-bounded ciliary compartment, and intraflagellar-transport
    particles move cargo along axonemal microtubules for cilium assembly.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph keeps the conserved geometry of the ciliary base, membrane
    and axoneme separate from the many lineage-specific IFT-A, IFT-B, kinesin-II and
    dynein-2 subunits that require component-level curation.
