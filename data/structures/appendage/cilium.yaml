functions:
- function_id: cilium_assembly
  label: cilium assembly
  grounding: GO:0060271
  description: The basal body, transition-zone gate and bidirectional intraflagellar
    transport machinery assemble the membrane-sheathed axoneme.
  evidence:
  - reference: DOI:10.1038/nrm952
    notes: Rosenbaum and Witman 2002 review intraflagellar transport as machinery
      required to build and maintain eukaryotic cilia and flagella.
- function_id: cilium_dependent_cell_motility
  label: cilium-dependent cell motility
  grounding: GO:0060285
  description: Motile 9+2 cilia beat through axonemal dynein activity, bending the
    ciliary shaft to move cells such as Chlamydomonas through liquid.
  evidence:
  - reference: DOI:10.1104/pp.010807
    notes: Silflow and Lefebvre 2001 review Chlamydomonas flagella as motility organelles
      built on a conserved eukaryotic ciliary axoneme.
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 used Chlamydomonas axonemes to model dynein-generated
      microtubule sliding forces.
evidence:
