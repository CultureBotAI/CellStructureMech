identifier: GO:0005929
label: cilium
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A specialized eukaryotic organelle that consists of a filiform extrusion
  of the cell surface and of some cytoplasmic parts; it is largely bounded by an extrusion
  of the plasma membrane, contains a longitudinal microtubule array, and is anchored
  to a basal body.
definition_source: GO:0005929
