  edges:
  - subject: ciliary_basal_body
    predicate: nucleates
    object: axoneme
    description: The basal body provides the microtubule template from which the ciliary
      axoneme extends.
    evidence:
    - reference: GO:0036064
      notes: GO:0036064 defines the ciliary basal body as the axoneme-growth nucleation
        site.
  - subject: axoneme
    predicate: forms core of
    object: cilium
    description: The axoneme is the microtubule and associated-protein core of the
      Chlamydomonas cilium.
    evidence:
    - reference: DOI:10.1126/science.1128618
      notes: Nicastro et al. 2006 resolved the axonemal core from Chlamydomonas flagella.
  - subject: ciliary_membrane
    predicate: bounds
    object: cilium
    description: A specialized extension of the plasma membrane surrounds the ciliary
      compartment.
    evidence:
    - reference: GO:0060170
      notes: GO:0060170 defines the ciliary membrane as the plasma-membrane portion
        around the cilium.
  - subject: ciliary_transition_zone
    predicate: gates entry into
    object: cilium
    description: The transition zone links the axoneme to the ciliary membrane and
      helps gate material entering the cilium.
    evidence:
    - reference: GO:0035869
      notes: GO:0035869 identifies the ciliary transition zone as a membrane-linked
        ciliary gate.
  - subject: ift_particle
    predicate: transports cargo along
    object: axoneme
    description: IFT particles move cargo bidirectionally along axonemal microtubules
      beneath the ciliary membrane.
    evidence:
    - reference: DOI:10.1038/nrm952
      notes: Rosenbaum and Witman 2002 review bidirectional IFT-particle transport
        along the Chlamydomonas axoneme.
  - subject: ift_particle
    predicate: supports
    object: cilium_assembly
    description: Intraflagellar-transport particles shuttle ciliary cargo required
      for assembly and maintenance of the membrane-sheathed axoneme.
    evidence:
    - reference: DOI:10.1038/nrm952
      notes: Rosenbaum and Witman 2002 review IFT as a requirement for cilium and
        flagellum assembly and maintenance.
discussions:
- discussion_id: not_bacterial_flagellum_or_archaellum
  prompt: Should bacterial-type flagella or archaeal-type flagella be merged under
    the cilium record?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0005929 explicitly scopes cilium to the membrane-sheathed, microtubule-based
    eukaryotic organelle. Bacterial-type flagella and archaeal-type flagella are nonhomologous
    prokaryotic appendages with separate GO identities and separate CellStructureMech
    records.
  resolution_note: Kept cilium scoped to eukaryotic flagella/cilia and did not xref
    bacterial-type or archaeal-type flagellum records as synonyms or parts.
  evidence:
  - reference: GO:0005929
    notes: GO:0005929 defines cilium as a eukaryotic organelle.
  - reference: GO:0009288
    notes: GO:0009288 separately denotes the bacterial-type flagellum.
  - reference: GO:0097589
    notes: GO:0097589 separately denotes the archaeal-type flagellum.
  posed_by: codex
  posed_date: '2026-09-12'
  resolved_date: '2026-09-12'
