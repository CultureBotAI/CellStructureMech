discussions:
- discussion_id: ift_particle_boundary
  prompt: Keep the intraciliary transport particle distinct from the complete cilium,
    the axoneme, and IFT motor complexes.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: GO:0030990 denotes the mobile IFT protein-particle complex that acts
    inside the cilium, GO:0005929 denotes the complete membrane-sheathed cilium, and
    GO:0005930 denotes the axonemal microtubule core on which IFT particles move.
  resolution_note: Curated GO:0030990 as the exact IFT particle and used GO:0005929
    for cilium parthood.
  evidence:
  - reference: GO:0030990
    notes: GO:0030990 identifies the intraciliary transport particle.
  - reference: GO:0005929
    notes: GO:0005929 identifies the complete eukaryotic cilium.
  - reference: GO:0005930
    notes: GO:0005930 identifies the axoneme.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
