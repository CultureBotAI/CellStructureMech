functions:
- function_id: stalk_diffusion_barrier
  label: stalk diffusion barrier
  description: Crossbands restrict soluble and membrane-protein exchange between the
    cell body and the prostheca, and between neighboring stalk compartments.
  evidence:
  - reference: DOI:10.1016/j.cell.2012.10.046
    notes: Schlimpert et al. 2012 show that crossbands block diffusion across Caulobacter
      stalk compartments.
evidence:
- reference: DOI:10.1016/j.cell.2012.10.046
  notes: Schlimpert S et al. 2012, 'General protein diffusion barriers create compartments
    within bacterial cells', Cell.
- reference: DOI:10.1128/JB.178.13.3939-3948.1996
  notes: Poindexter JS and Staley JT 1996, 'Caulobacter and Asticcacaulis stalk bands
    as indicators of stalk age', Journal of Bacteriology.
- reference: PMID:4126821
  notes: Jones HC and Schmidt JM 1973, 'Ultrastructural study of crossbands occurring
    in the stalks of Caulobacter crescentus', Journal of Bacteriology.
