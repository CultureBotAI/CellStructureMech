identifier: cellstructuremech:stalk_crossband
label: stalk crossband
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A disk-like multiprotein diffusion barrier that spans the Caulobacter
  stalk cross-section. StpABCD-containing stalk crossbands partition the prostheca
  into compartments by limiting exchange of soluble and membrane proteins between
  the cell body and stalk segments.
definition_source: DOI:10.1016/j.cell.2012.10.046
mapping_status: PROPOSED
