  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - part_of
  - causal_graphs#stp_crossband_stalk_barrier
  rationale: The prostheca record captures the whole envelope projection and its generic
    wall and membrane materials. Crossbands are discrete proteinaceous barriers inside
    that projection, so they receive a separate record with part_of pointing back
    to the prostheca.
  evidence:
  - reference: DOI:10.1016/j.cell.2012.10.046
    notes: Schlimpert et al. 2012 define crossbands as discrete proteinaceous barriers
