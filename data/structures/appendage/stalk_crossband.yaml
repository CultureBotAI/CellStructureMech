- component_id: stp_cd_barrier_sealing_proteins
  label: StpC/StpD crossband barrier-sealing proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - stpC
  - stpD
  essentiality: DISPENSABLE
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Caulobacter StpC and StpD are crossband constituents that tighten
    the diffusion barrier; no exact source-neutral family CURIE was curated.
  role: Seal the StpA/StpB scaffold to produce an efficient protein diffusion barrier.
    Structural essentiality is DISPENSABLE because crossbands remain visible without
    StpC/D, but those barriers are leaky; this does not mean normal barrier function
    is dispensable.
  evidence:
  - reference: DOI:10.1016/j.cell.2012.10.046
    notes: Schlimpert et al. 2012 observe visible crossbands in stpC/stpD mutants
      and partial loss of periplasmic compartmentalization in the stpCD deletion strain,
      distinguishing structural formation from barrier sealing.
