  - stpD
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: StpA, StpB, StpC and StpD are the Caulobacter proteins identified
    in stalk crossbands; no exact source-neutral family CURIE was curated.
  role: Assemble into the proteinaceous crossband that spans the stalk and forms a
    diffusion barrier.
  evidence:
