      to form Caulobacter stalk crossbands.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Stalk crossbands have been described in stalks of Caulobacter and Asticcacaulis,
    but are absent from most bacterial morphologies.
  reference: DOI:10.1128/JB.178.13.3939-3948.1996
- taxon_id: NCBITaxon:155892
  taxon_label: Caulobacter vibrioides
  presence: UNIVERSAL
  note: Crossbands form along the Caulobacter stalk as part of the stalked-cell program.
  reference: DOI:10.1016/j.cell.2012.10.046
canonical_examples:
