functions:
- function_id: peptidoglycan_bushing_anchor
  label: peptidoglycan bushing anchoring
  description: The P ring associates with the peptidoglycan layer and provides the
    peptidoglycan-side portion of the LP-ring bushing around the distal rod.
  evidence:
  - reference: DOI:10.1038/s41467-021-24715-3
    notes: Yamaguchi et al. 2021 placed the Salmonella FlgI P ring in the peptidoglycan-proximal
      part of the LP ring.
- function_id: lp_ring_bushing_support
  label: LP-ring bushing support
  description: Together with the L ring, the P ring forms a bushing that surrounds
    the distal rod and supports rotation of the flagellar drive shaft.
  evidence:
  - reference: DOI:10.1038/s41467-021-24715-3
    notes: Yamaguchi et al. 2021 structurally resolved the LP ring around the distal
      rod in Salmonella hook-basal-body complexes.
