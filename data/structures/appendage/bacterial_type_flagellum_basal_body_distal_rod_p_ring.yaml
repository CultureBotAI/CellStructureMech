discussions:
- discussion_id: exclude_l_ring_rod_and_assembly_factors
  prompt: Should the L ring, distal rod, FlgA, or FlgJ be curated as P-ring components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flgi
  rationale: The mature GO:0009428 P ring is the FlgI ring at the peptidoglycan-proximal
    side of the LP-ring bushing. FlgH forms the adjacent L ring, the FlgG distal rod
    runs through the bushing, and FlgA and FlgJ act during outer-ring or rod assembly
    rather than remaining constituents of the mature P ring.
  resolution_note: 'Declined: keep FlgI as the only mature P-ring constituent and
    represent the adjoining L ring, FlgG distal rod and assembly factors outside this
    record''s component list.'
  posed_by: claude
  posed_date: '2026-09-07'
  resolved_date: '2026-09-07'
