components:
- component_id: cana_cannula_glycoprotein
  label: CanA cannula glycoprotein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: CanA is a cannula-forming glycoprotein characterized from Pyrodictium
    abyssi TAG11, distinct from the native AV2 major subunit CanX. No exact source-neutral
    InterPro, Pfam or NCBIfam family grounding was verified.
  role: Cannula glycoprotein whose recombinant mature form assembles into hollow cannula-like
    fibers in vitro through calcium coordination and donor-strand complementation;
    warming accelerates assembly under the tested conditions.
  evidence:
  - reference: DOI:10.1038/s41467-025-64120-8
    notes: Sleutel et al. 2025 resolved in vitro filaments assembled from recombinant
      P. abyssi TAG11 CanA. The native ex vivo AV2 cannula reconstruction in the same
      paper instead identifies the distinct homologue CanX as its major subunit.
  - reference: DOI:10.1038/s41598-025-13242-6
    notes: Munte et al. 2025 solved the NMR solution structure of the N-terminally
      truncated K1-CanA construct and separately characterized divalent-ion-induced
      polymerization of full-length recombinant CanA.
- component_id: canx_cannula_glycoprotein
  label: CanX cannula glycoprotein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: CanX names the native cannula major-subunit class identified in
    P. abyssi AV2, not an alias of TAG11 CanA. Sleutel et al. found no Pfam or PANTHER
    domain match for the native subunit and placed cannula-like proteins in the broader
    TasA superfamily; no exact source-neutral family grounding is asserted here.
  role: Major glycoprotein subunit of native cannulae resolved from P. abyssi AV2,
    joined by donor-strand complementation and calcium-coordinated interfaces. This
    does not establish obligatory coassembly with CanA or exclude low-occupancy minor
    subunits.
  evidence:
  - reference: DOI:10.1038/s41467-025-64120-8
    notes: Sleutel et al. 2025 assigned the native AV2 cannula cryo-EM map to CanX,
      a homologue distinct from the recombinant TAG11 CanA used in their in vitro
      assembly experiments.
taxonomic_distribution:
- taxon_id: NCBITaxon:54256
  taxon_label: Pyrodictium abyssi
  presence: COMMON
  note: Pyrodictium abyssi produces extracellular cannulae that were visualized as
    a cell-associated tubular network in ultrastructural studies.
  reference: DOI:10.1006/jsbi.1995.1032
canonical_examples:
- taxon_id: NCBITaxon:54256
  taxon_label: Pyrodictium abyssi
  note: Hyperthermophilic archaeon in which cannulae were shown by cryo-electron tomography
    to enter the periplasmic space without crossing into the cytoplasm.
  reference: DOI:10.1016/S1047-8477(02)00581-6
functions:
- function_id: extracellular_cell_network_formation
  label: extracellular Pyrodictium cell-network formation
  description: Cannulae extend from the Pyrodictium cell envelope and physically interconnect
    cells in an extracellular network; the transported cargo or signaling role of
    the network remains unresolved.
  evidence:
  - reference: DOI:10.1016/S1047-8477(02)00581-6
    notes: Nickell et al. 2003 used cryo-electron tomography to show how Pyrodictium
      cannulae contact the cell envelope and interconnect cells.
  - reference: DOI:10.1006/jsbi.1995.1032
    notes: Rieger et al. 1995 characterized the extracellular network of Pyrodictium
      abyssi cannulae in ultrastructural sections.
evidence:
- reference: DOI:10.1006/jsbi.1995.1032
  notes: Rieger et al. 1995, Ultrastructure of the hyperthermophilic archaeon Pyrodictium
    abyssi, Journal of Structural Biology.
- reference: DOI:10.1016/S1047-8477(02)00581-6
  notes: Nickell et al. 2003, Pyrodictium cannulae enter the periplasmic space but
    do not enter the cytoplasm, as revealed by cryo-electron tomography, Journal of
    Structural Biology.
- reference: DOI:10.1038/s41467-025-64120-8
  notes: Sleutel et al. 2025, Donor strand complementation and calcium ion coordination
    drive the chaperone-free polymerization of archaeal cannulae, Nature Communications.
- reference: DOI:10.1038/s41598-025-13242-6
  notes: Munte et al. 2025, Biophysical characterization and solution structure of
    the cannulae-forming protein CanA from the hyperthermophilic archaeon Pyrodictium
    abyssi, Scientific Reports.
causal_graphs:
- graph_id: calcium_dependent_cana_cannula_assembly
  title: Recombinant CanA coordinates calcium during in vitro fiber assembly
  description: Recombinant mature P. abyssi TAG11 CanA coordinates calcium and undergoes
    donor-strand complementation to assemble hollow cannula-like fibers in vitro.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Restricted to the experimentally characterized recombinant CanA assembly
    system. Calcium was necessary but not sufficient for rapid assembly under the
    tested conditions; warming accelerated polymerization. Native AV2 CanX fibers
    provide a distinct structural comparison, not evidence that the native subunit
    is CanA. Cell-level nucleation, envelope attachment, CanB/CanC incorporation and
    physiological cargo transport are not modeled.
  nodes:
  - node_id: cana_cannula_glycoprotein
    label: CanA cannula glycoprotein
    node_type: GENE_OR_PROTEIN
    component_ref: cana_cannula_glycoprotein
  - node_id: calcium_ion
    label: calcium ion
    node_type: CHEMICAL
  - node_id: hollow_cannula_fiber
    label: in vitro CanA cannula-like fiber
    node_type: STRUCTURE
  edges:
  - subject: cana_cannula_glycoprotein
    predicate: coordinates
    object: calcium_ion
    description: Recombinant CanA interfaces coordinate calcium ions in the in vitro
      filament, supporting donor-strand-complemented assembly.
    evidence:
    - reference: DOI:10.1038/s41467-025-64120-8
      notes: Sleutel et al. 2025 resolved calcium-bound interfaces in recombinant
        TAG11 CanA filaments assembled in vitro.
  - subject: cana_cannula_glycoprotein
    predicate: polymerizes into
    object: hollow_cannula_fiber
    description: Recombinant mature CanA polymerizes into hollow cannula-like fibers
      under the tested in vitro assembly conditions.
    evidence:
    - reference: DOI:10.1038/s41467-025-64120-8
      notes: Sleutel et al. 2025 used cryo-EM to resolve recombinant CanA filaments;
        their separate native AV2 reconstruction was composed principally of CanX.
    - reference: DOI:10.1038/s41598-025-13242-6
      notes: Munte et al. 2025 assayed divalent-ion-induced polymerization of full-length
        recombinant CanA, distinct from the truncated K1-CanA NMR construct.
discussions:
- discussion_id: resolve_cana_family_grounding
  prompt: Resolve exact source-neutral protein-family groundings for CanA and CanX
    and the component boundaries of CanB and CanC.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#cana_cannula_glycoprotein
  - components#canx_cannula_glycoprotein
  rationale: The first archaeal cannula record keeps only CanA as a reviewed label-only
    component because this pass did not verify an exact Pfam, InterPro or NCBIfam
    family for CanA or resolve whether the homologous CanB and CanC glycoproteins
    should be separate curated components. Follow-up inspection of Sleutel et al.
    2025 distinguishes the native AV2 major subunit CanX from recombinant TAG11 CanA.
    Both are now represented separately without implying that they coexist in one
    native filament; exact family mappings and CanB/CanC component boundaries remain
    unresolved.
  evidence:
  - reference: DOI:10.1038/s41598-025-13242-6
    notes: Munte et al. 2025 reviewed CanA, CanB and CanC as homologous Pyrodictium
      abyssi glycoproteins present in cannulae.
  - reference: DOI:10.1038/s41467-025-64120-8
    notes: Sleutel et al. 2025 distinguish native CanX and recombinant CanA and discuss
      the unresolved possibility of low-occupancy minor subunits.
  posed_by: codex
  posed_date: '2026-09-11'
- discussion_id: resolve_cannula_network_function
  prompt: Resolve the physiological cargo or signaling role of the Pyrodictium cannula
    network.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - functions#extracellular_cell_network_formation
  rationale: Electron microscopy supports cannula-mediated physical interconnection
    of Pyrodictium cells, but the exchanged material, if any, remains unresolved.
  evidence:
  - reference: DOI:10.1016/S1047-8477(02)00581-6
    notes: Nickell et al. 2003 showed that cannulae enter the periplasmic space rather
      than the cytoplasm.
  posed_by: codex
  posed_date: '2026-09-11'
