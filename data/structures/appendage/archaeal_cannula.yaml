  edges:
  - subject: calcium_ion
    predicate: coordinates polymerization of
    object: cana_cannula_glycoprotein
    description: Calcium ion coordination helps drive chaperone-free CanA polymerization
      through donor-strand complementation.
    evidence:
    - reference: DOI:10.1038/s41467-025-64120-8
      notes: Sleutel et al. 2025 resolved calcium-bound CanA interfaces in self-assembled
        archaeal cannulae.
  - subject: cana_cannula_glycoprotein
    predicate: polymerizes into
    object: hollow_cannula_fiber
    description: CanA subunits polymerize into the hollow fiber core of the extracellular
      cannula.
    evidence:
    - reference: DOI:10.1038/s41467-025-64120-8
      notes: Sleutel et al. 2025 compared native and reassembled CanA cannula fibers
        by cryo-EM.
    - reference: DOI:10.1038/s41598-025-13242-6
      notes: Munte et al. 2025 analyzed divalent-ion-induced CanA polymerization into
        hollow-fiber networks.
  - subject: hollow_cannula_fiber
    predicate: forms
    object: archaeal_cannula
    description: The cannula is an extracellular hollow tube built from the archaeal
      cannula fiber.
    evidence:
    - reference: DOI:10.1016/S1047-8477(02)00581-6
      notes: Nickell et al. 2003 resolved hollow Pyrodictium cannulae by cryo-electron
        tomography.
  - subject: archaeal_cannula
    predicate: enters
    object: cell_envelope
    description: Pyrodictium cannulae penetrate the archaeal envelope into the periplasmic
      space but stop outside the cytoplasm.
    evidence:
    - reference: DOI:10.1016/S1047-8477(02)00581-6
      notes: Nickell et al. 2003 found one cannula entering the periplasmic space
        while a paired cannula contacted the cell surface.
  - subject: archaeal_cannula
    predicate: interconnects cells within
    object: cell_cell_network
    description: Cell-surface cannulae interconnect Pyrodictium cells within a dense
      extracellular network.
    evidence:
    - reference: DOI:10.1006/jsbi.1995.1032
      notes: Rieger et al. 1995 characterized the Pyrodictium abyssi cannula network
        by ultrastructural electron microscopy.
discussions:
- discussion_id: resolve_cana_family_grounding
  prompt: Resolve exact source-neutral protein-family groundings and component boundaries
    for Pyrodictium cannula CanA, CanB and CanC glycoproteins.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#cana_cannula_glycoprotein
  rationale: The first archaeal cannula record keeps only CanA as a reviewed label-only
    component because this pass did not verify an exact Pfam, InterPro or NCBIfam
    family for CanA or resolve whether the homologous CanB and CanC glycoproteins
    should be separate curated components.
  evidence:
  - reference: DOI:10.1038/s41598-025-13242-6
    notes: Munte et al. 2025 reviewed CanA, CanB and CanC as homologous Pyrodictium
      abyssi glycoproteins present in cannulae.
  posed_by: codex
  posed_date: '2026-09-11'
- discussion_id: resolve_cannula_network_function
  prompt: Resolve the physiological cargo or signaling role of the Pyrodictium cannula
