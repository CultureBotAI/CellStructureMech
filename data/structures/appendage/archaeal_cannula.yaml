identifier: cellstructuremech:archaeal_cannula
label: archaeal cannula
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: An extracellular hollow tubular archaeal cell projection, characterized
  in Pyrodictium species, that extends from the cell envelope as a proteinaceous filament
  and forms networks between cells.
definition_source: DOI:10.1016/S1047-8477(02)00581-6
mapping_status: PROPOSED
