components:
- component_id: cana_cannula_glycoprotein
  label: CanA cannula glycoprotein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: CanA is a Pyrodictium abyssi cannula-forming glycoprotein, but
    no exact source-neutral InterPro, Pfam or NCBIfam family grounding for the archaeal
    cannula subunit class was verified in this pass.
  role: Extracellular glycoprotein subunit that polymerizes into hollow archaeal cannula
    fibers in a calcium-dependent, chaperone-free reaction.
  evidence:
  - reference: DOI:10.1038/s41467-025-64120-8
    notes: Sleutel et al. 2025 used cryo-EM on ex vivo and in vitro Pyrodictium abyssi
      CanA fibers to resolve calcium-coordinated, donor-strand-complemented cannula
      polymerization.
  - reference: DOI:10.1038/s41598-025-13242-6
    notes: Munte et al. 2025 solved the CanA solution structure and characterized
      divalent-ion-induced CanA polymerization.
taxonomic_distribution:
- taxon_id: NCBITaxon:54256
  taxon_label: Pyrodictium abyssi
  presence: COMMON
  note: Pyrodictium abyssi produces extracellular cannulae that were visualized in
    ultrastructural studies and later used for CanA fiber structural analysis.
  reference: DOI:10.1006/jsbi.1995.1032
canonical_examples:
- taxon_id: NCBITaxon:54256
  taxon_label: Pyrodictium abyssi
  note: Hyperthermophilic archaeon in which cannulae were characterized by thin-section
    electron microscopy, cryo-electron tomography, and CanA structural reconstitution.
  reference: DOI:10.1016/S1047-8477(02)00581-6
functions:
- function_id: extracellular_cell_network_formation
  label: extracellular Pyrodictium cell-network formation
  description: Cannulae extend from the Pyrodictium cell envelope and physically interconnect
    cells in an extracellular network; the transported cargo or signaling role of
    the network remains unresolved.
  evidence:
  - reference: DOI:10.1016/S1047-8477(02)00581-6
    notes: Nickell et al. 2003 used cryo-electron tomography to show how Pyrodictium
      cannulae contact the cell envelope and interconnect cells.
  - reference: DOI:10.1006/jsbi.1995.1032
    notes: Rieger et al. 1995 characterized the extracellular network of Pyrodictium
      abyssi cannulae in ultrastructural sections.
evidence:
- reference: DOI:10.1006/jsbi.1995.1032
  notes: Rieger et al. 1995, Ultrastructure of the hyperthermophilic archaeon Pyrodictium
    abyssi, Journal of Structural Biology.
- reference: DOI:10.1016/S1047-8477(02)00581-6
  notes: Nickell et al. 2003, Pyrodictium cannulae enter the periplasmic space but
    do not enter the cytoplasm, as revealed by cryo-electron tomography, Journal of
    Structural Biology.
- reference: DOI:10.1038/s41467-025-64120-8
  notes: Sleutel et al. 2025, Donor strand complementation and calcium ion coordination
    drive the chaperone-free polymerization of archaeal cannulae, Nature Communications.
- reference: DOI:10.1038/s41598-025-13242-6
  notes: Munte et al. 2025, Biophysical characterization and solution structure of
    the cannulae-forming protein CanA from the hyperthermophilic archaeon Pyrodictium
    abyssi, Scientific Reports.
causal_graphs:
- graph_id: calcium_dependent_cana_cannula_assembly
  title: Calcium coordinates CanA into Pyrodictium cannula fibers
  description: Pyrodictium CanA binds calcium ions and undergoes donor-strand complementation
    to assemble hollow extracellular cannula fibers that extend from the cell envelope
    and participate in a cell-surface network.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: This graph is restricted to the CanA polymerization mechanism resolved
    by structural studies and does not model cell-level nucleation, CanB or CanC incorporation,
    or the unknown biological cargo of the cannula network.
