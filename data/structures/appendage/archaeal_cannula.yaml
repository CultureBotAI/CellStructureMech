  changes: Added archaeal cannula synonymy, GO cell-projection parentage, a label-only
    CanA glycoprotein component, Pyrodictium abyssi scope and exemplar rows, cell-network
    formation function, DOI evidence, a calcium-dependent CanA assembly graph, and
    TODOs for CanA-family grounding and cannula network function.
  llm_assisted: true
synonyms:
- synonym_text: cannulae
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1016/S1047-8477(02)00581-6
parent_structures:
