discussions:
- discussion_id: exclude_p_ring_rod_lps_outer_membrane_and_assembly_factors
  prompt: Should the P ring, distal rod, lipopolysaccharide, outer membrane, FlgA,
    or FlgJ be curated as L-ring components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flgh
  rationale: The mature GO:0009427 L ring is the FlgH ring at the outer-membrane side
    of the LP-ring bushing. FlgI forms the adjacent P ring, the FlgG distal rod runs
    through the bushing, lipopolysaccharide and the cell outer membrane host the L
    ring, and FlgA and FlgJ act during outer-ring or rod assembly rather than remaining
    constituents of the mature L ring.
  resolution_note: 'Declined: keep FlgH as the only mature L-ring constituent and
    represent the adjoining P ring, FlgG distal rod, lipopolysaccharide, outer membrane
    and assembly factors outside this record''s component list.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
