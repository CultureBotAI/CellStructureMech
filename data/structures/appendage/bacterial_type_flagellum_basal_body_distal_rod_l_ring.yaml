functions:
- function_id: outer_membrane_bushing_anchor
  label: outer-membrane bushing anchoring
  description: The L ring sits at the outer-membrane side of the LP-ring bushing around
    the distal rod in Gram-negative flagellar basal bodies.
  evidence:
  - reference: DOI:10.1038/s41467-021-24715-3
    notes: Yamaguchi et al. 2021 placed the Salmonella FlgH L ring at the outer side
      of the LP ring.
- function_id: lp_ring_bushing_support
  label: LP-ring bushing support
  description: Together with the P ring, the L ring forms a bushing that surrounds
    the distal rod and supports rotation of the flagellar drive shaft.
  evidence:
  - reference: DOI:10.1038/s41467-021-24715-3
    notes: Yamaguchi et al. 2021 structurally resolved the LP ring around the distal
      rod in Salmonella hook-basal-body complexes.
