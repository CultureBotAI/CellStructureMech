identifier: GO:0031514
label: motile cilium
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A cilium which may have a variable arrangement of axonemal microtubules
  and also contains molecular motors. It may beat with a whip-like pattern that promotes
  cell motility or transport of fluids and other cells across a cell surface, such
  as on epithelial cells that line the lumenal ducts of various tissues; or they may
  display a distinct twirling motion that directs fluid flow asymmetrically across
  the cellular surface to affect asymmetric body plan organization. Motile cilia can
  be found in single as well as multiple copies per cell. A membrane-bounded ciliary
  projection capable of active whip-like or undulating beating that propels swimming
  cells or generates fluid flow across microbial cell surfaces. In flagellated green
  algae (Chlamydomonas reinhardtii), ciliates (Tetrahymena thermophila), and kinetoplastids
  (Trypanosoma brucei), the motile cilium contains an axoneme powered by outer and
  inner dynein arms and regulated by radial spokes and intraflagellar transport (IFT)
  trains.
