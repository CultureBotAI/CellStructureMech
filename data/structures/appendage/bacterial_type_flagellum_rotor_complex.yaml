discussions:
- discussion_id: exclude_nonrotor_basal_body_parts
  prompt: Should the stator units, export apparatus, or axial rod be curated as rotor-complex
    components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#ms_ring
  - components#c_ring
  - causal_graphs#ms_c_ring_rotor_function
  rationale: GO:0120107 is scoped to the membrane-anchored ring and motor switch complex
    that rotate as the basal-body rotor. Stator units apply torque to the rotor, the
    rod receives rotation from it, the membrane export gate occupies the MS-ring center,
    and the broader flagellar type III export apparatus associates with that gate,
    but those neighboring structures are not part of the MS-ring/C-ring rotor complex.
  resolution_note: 'Declined: model only the MS ring and C ring as rotor constituents,
    and represent stator and rod interactions in functions or causal graphs.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
