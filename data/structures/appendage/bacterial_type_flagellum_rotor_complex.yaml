components:
- component_id: ms_ring
  label: MS ring (FliF)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - fliF
  essentiality: ESSENTIAL
  role: Membrane-embedded rotor ring that anchors the MS/C-ring rotor in the inner
    membrane and positions the cytoplasmic C ring.
  evidence:
  - reference: DOI:10.1038/s41467-021-24507-9
    notes: Kawamoto et al. 2021 resolved the native Salmonella FliF MS ring and measured
      attached C-ring symmetry.
- component_id: c_ring
  label: C ring / switch complex (FliG, FliM, FliN)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - fliG
  - fliM
  - fliN
  essentiality: ESSENTIAL
  role: Cytoplasmic rotor and switch ring that contacts stators through FliG and changes
    motor direction in response to CheY-P.
  evidence:
  - reference: DOI:10.1038/emboj.2011.188
    notes: Paul et al. 2011 mapped FliG, FliM and FliN in the Salmonella flagellar
      rotor architecture.
  - reference: DOI:10.1038/nature09300
    notes: Lee et al. 2010 structurally connected the FliG/FliM/FliN torque ring to
      rotational switching.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: MS-ring/C-ring rotor complexes occur in bacteria that encode bacterial-type
    flagellar basal bodies and are absent from bacteria without the rotary flagellar
    system.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related rotary appendages and do not
    contain the FliF/FliG/FliM/FliN rotor of bacterial flagella.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Source organism for C-ring electron microscopy, native MS-ring cryo-EM, and
    the FliG/FliM/FliN rotor-architecture model.
  reference: DOI:10.1128/JB.00552-06
functions:
- function_id: ms_c_ring_rotor_assembly
  label: MS-ring and C-ring rotor assembly
  description: The C ring assembles on the cytoplasmic face of the FliF MS ring to
    produce the basal-body rotor.
  evidence:
  - reference: DOI:10.1073/pnas.89.14.6304
    notes: Francis et al. 1992 placed the FliG switch protein on the cytoplasmic face
      of the flagellar M ring.
  - reference: DOI:10.1038/s41467-021-24507-9
    notes: Kawamoto et al. 2021 imaged the C ring attached to the native Salmonella
      MS ring.
- function_id: torque_reception_and_rod_rotation
  label: torque reception and rod rotation
  description: Stators apply torque to the C ring through FliG, and the MS-ring/rod
    connection transmits rotor motion into the axial rod.
  evidence:
  - reference: DOI:10.1016/j.tim.2014.12.011
    notes: Minamino and Imada 2015 review the MS ring and C ring as the rotor coupled
      to stator torque.
  - reference: DOI:10.1016/j.cell.2021.03.057
    notes: Tan et al. 2021 resolved how the MS ring and proximal rod are coupled for
      torque transmission.
- function_id: directional_switching
  label: directional switching
  description: The C-ring switch complex biases the flagellar rotor between clockwise
    and counterclockwise states in response to CheY-P.
  evidence:
  - reference: DOI:10.1038/nature09300
    notes: Lee et al. 2010 connected FliG/FliM/FliN torque-ring architecture to rotational
      switching.
  - reference: DOI:10.1073/pnas.90.19.8787
    notes: Welch et al. 1993 showed that CheY phosphorylation promotes switch-complex
      binding through FliM.
