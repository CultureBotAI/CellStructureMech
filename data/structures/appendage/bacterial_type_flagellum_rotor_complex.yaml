identifier: GO:0120107
label: bacterial-type flagellum rotor complex
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: The bacterial flagellar basal-body rotor built from the membrane-anchored
  FliF MS ring and the cytoplasmic FliG/FliM/FliN C ring, which together receive torque
  from stator units, rotate the axial rod, and bias clockwise or counterclockwise
  motor output.
definition_source: DOI:10.1016/j.tim.2014.12.011
mapping_status: PROPOSED
