discussions:
- discussion_id: exclude_bushings_and_assembly_factors
  prompt: Should LP rings, FlgD, or FlgJ be curated as bacterial-type flagellum basal-body
    rod components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flie
  rationale: The mature GO:0030694 rod is scoped to the FliE/FlgB/FlgC/FlgF/FlgG axial
    polymer. The L and P rings surround the distal rod as bushings, whereas FlgD and
    FlgJ act during axial assembly rather than remaining mature rod subunits.
  resolution_note: 'Declined: keep L/P rings, FlgD and FlgJ on the enclosing basal-body
    or whole-flagellum records unless separate mature substructure records are curated.'
  posed_by: claude
  posed_date: '2026-09-07'
  resolved_date: '2026-09-07'
