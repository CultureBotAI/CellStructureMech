  - subject: proximal_rod
    predicate: combines with
    object: distal_rod
    description: The proximal and distal rod segments form the continuous central
      basal-body rod.
    evidence:
    - reference: DOI:10.1016/0022-2836(90)90365-S
      notes: Homma et al. 1990 model the Salmonella rod as sequential FlgB/FlgC/FlgF
        proximal segments followed by the FlgG distal segment.
  - subject: distal_rod
    predicate: completes
    object: rod
    description: The FlgG distal rod extends the central rod through the L and P ring
