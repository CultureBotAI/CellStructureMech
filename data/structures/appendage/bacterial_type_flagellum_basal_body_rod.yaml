functions:
- function_id: axial_drive_shaft
  label: axial drive-shaft torque transmission
  description: The basal-body rod connects the MS ring to the hook and transmits rotation
    as a drive shaft through the cell envelope.
  evidence:
  - reference: DOI:10.1016/j.cell.2021.03.057
    notes: Tan et al. 2021 resolved FliE/FlgB couplings that transmit torque from
      the MS ring into the proximal rod.
  - reference: PMID:15136044
    notes: Saijo-Hamano et al. 2004 describe the central rod as the drive shaft that
      transmits torque to the hook and filament.
- function_id: periplasmic_axis
  label: periplasmic axial scaffold
  description: The assembled rod spans the periplasmic portion of the basal body and
    forms the axial scaffold that is surrounded by the P and L rings.
  evidence:
  - reference: DOI:10.1038/s41564-021-00895-y
    notes: Johnson et al. 2021 resolved the intact Salmonella basal body and the FlgG
      distal rod running through the periplasm.
  - reference: DOI:10.1038/s41467-021-24715-3
    notes: Yamaguchi et al. 2021 resolved the Salmonella LP-ring bushing surrounding
      the distal rod.
evidence:
- reference: DOI:10.1146/annurev.micro.57.030502.090832
  notes: Macnab RM 2003, How bacteria assemble flagella.
- reference: DOI:10.1016/0022-2836(90)90365-S
  notes: Homma M, Kutsukake K, Hasebe M, Iino T and Macnab RM 1990, FlgB, FlgC, FlgF
