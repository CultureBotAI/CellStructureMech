- reference: DOI:10.1038/s41564-021-00895-y
  notes: Johnson S et al. 2021, Molecular structure of the intact bacterial flagellar
    basal body.
causal_graphs:
- graph_id: segmented_rod_drive_shaft
  title: Rod proteins assemble the axial drive shaft
  description: FliE, FlgB, FlgC and FlgF form the proximal rod and FlgG forms the
    distal rod. Together they make the central basal-body rod that spans the periplasm
    and transmits torque from the MS ring to the hook.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
