  action: EXPANDED_RECORD
  changes: Added exact synonymy, GO pilus parentage, FimA/FimF/FimG/FimH/FimI constituents,
    E. coli taxonomy, GO:0140623 assembly and mannose-sensitive adhesion functions,
    literature evidence, a FimC/FimD assembly graph, and grounding/boundary discussions.
  llm_assisted: true
