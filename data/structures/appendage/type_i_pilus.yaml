identifier: GO:0140621
label: type I pilus
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A chaperone-usher bacterial pilus assembled from a helical FimA rod tipped
  by the adaptor subunits FimF and FimG and the mannose-binding FimH adhesin. In Escherichia
  coli, the type I pilus is polymerized through the outer-membrane FimD usher and
  terminated by a basal FimI subunit that anchors the completed rod to the assembly
  platform.
definition_source: GO:0140621
mapping_status: PROPOSED
