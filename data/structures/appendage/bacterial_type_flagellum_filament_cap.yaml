discussions:
- discussion_id: exclude_filament_and_junction
  prompt: Should flagellin, FlgK, or FlgL be curated as filament-cap components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flid_hap2
  rationale: GO:0009421 is scoped to the distal cap rather than the flagellin filament
    or the FlgK/FlgL hook-filament junction below it. FliD is the cap constituent;
    flagellin, FlgK and FlgL are neighboring axial proteins.
  resolution_note: 'Declined: keep flagellin on the GO:0009420 filament record and
    FlgK/FlgL on the GO:0009422 junction record.'
  posed_by: claude
  posed_date: '2026-09-09'
  resolved_date: '2026-09-09'
- discussion_id: oligomeric_state_scope
  prompt: Should the FliD subunit count be curated as universally pentameric?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - physical_properties
  rationale: The native Salmonella cap resolved by Einenkel et al. 2025 is pentameric,
    but Postel et al. 2016 showed that purified bacterial FliD proteins can adopt
    diverse oligomeric states.
  resolution_note: 'Declined: store the count only with native Salmonella context
    rather than as a species-independent cap count.'
  posed_by: claude
  posed_date: '2026-09-09'
  resolved_date: '2026-09-09'
