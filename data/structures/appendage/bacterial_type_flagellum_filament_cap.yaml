taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: FliD/HAP2 filament caps occur in bacteria that assemble completed bacterial-type
    flagellar filaments and are absent from lineages that lack the rotary flagellar
    system.
  reference: DOI:10.1128/JB.181.23.7149-7153.1999
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related appendages and do not use FliD/HAP2
    caps to assemble bacterial-type flagellin filaments.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:28901
  taxon_label: Salmonella enterica
  note: Source species for native extracellular flagellum structures that resolved
    the pentameric FliD cap at the filament tip.
  reference: DOI:10.1038/s41564-025-02037-0
- taxon_id: NCBITaxon:197
  taxon_label: Campylobacter jejuni
  note: Source species for a pre-filament hook-filament junction-cap complex used
    to analyze FliD before flagellin incorporation.
  reference: DOI:10.1038/s41564-025-02037-0
functions:
- function_id: filament_tip_capping
  label: filament tip capping
  description: FliD/HAP2 oligomers cap the distal end of the bacterial flagellar filament.
  evidence:
  - reference: DOI:10.1128/JB.181.23.7149-7153.1999
    notes: Macnab 1999 reviews HAP2/FliD as the cap at the distal filament end.
  - reference: DOI:10.1038/s41564-025-02037-0
    notes: Einenkel et al. 2025 resolved FliD caps at native Salmonella filament tips.
- function_id: flagellin_incorporation
  label: cap-mediated flagellin incorporation
  description: The cap presents a terminal-domain platform that guides exported flagellin
    into the growing filament lattice.
  evidence:
  - reference: DOI:10.1126/science.290.5499.2148
    notes: Yonekura et al. 2000 modeled the bacterial flagellar cap as a rotary promoter
      of flagellin self-assembly.
  - reference: DOI:10.1073/pnas.2534343100
    notes: Maki-Yonekura et al. 2003 linked HAP2 domain movement to cap-filament complex
      formation and growth.
  - reference: DOI:10.1038/s41564-025-02037-0
    notes: Einenkel et al. 2025 resolved filament-assembly intermediates and connected
      FliD terminal-domain movement to flagellin incorporation.
