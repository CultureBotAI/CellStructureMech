causal_graphs:
- graph_id: flid_cap_filament_elongation
  title: FliD caps the filament tip and guides flagellin addition
  description: FliD/HAP2 oligomerizes into a filament cap at the distal tip of the
    flagellar filament. The cap sits on the hook-filament junction before filament
    assembly and later moves at the filament end to guide exported flagellin subunits
    into the elongating lattice.
