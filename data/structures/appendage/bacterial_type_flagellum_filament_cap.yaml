components:
- component_id: flid_hap2
  label: flagellar filament cap protein FliD/HAP2
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR040026
  gene_symbols:
  - fliD
  stoichiometry: 5 FliD/HAP2 subunits in the native Salmonella cap; oligomeric state
    varies in isolated caps from some bacteria
  essentiality: ESSENTIAL
  role: Oligomerizes at the distal end of the bacterial flagellar filament to cap
    the growing tip and promote flagellin incorporation.
  evidence:
  - reference: DOI:10.1126/science.290.5499.2148
    notes: Yonekura et al. 2000 localized HAP2/FliD as the flagellar filament cap
      that promotes flagellin self-assembly.
  - reference: DOI:10.1038/s41564-025-02037-0
    notes: Einenkel et al. 2025 resolved a pentameric FliD cap in the native Salmonella
      extracellular flagellum.
  - reference: DOI:10.7554/eLife.18857
    notes: Postel et al. 2016 showed that FliD capping proteins from different bacteria
      can adopt distinct oligomeric states, bounding the Salmonella pentameric stoichiometry.
