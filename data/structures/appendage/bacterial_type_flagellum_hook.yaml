components:
- component_id: flge
  label: hook protein FlgE
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro:IPR020013 was declined because it spans FlgE plus the
    rod proteins FlgF and FlgG. InterPro:IPR012835 is labeled Flagellar hook FlgE
    but covers the epsilonproteobacterial FlgE family, so it would ground the Campylobacter
    example without covering Salmonella-type hooks. The component stays label-only
    until a source-neutral FlgE family can be asserted across the bacterial hook scope.
  gene_symbols:
  - flgE
  essentiality: ESSENTIAL
  role: Polymerizes into the short, curved tubular hook that connects the basal body
    to the external filament.
  evidence:
  - reference: DOI:10.1146/annurev.micro.57.030502.090832
    notes: Macnab 2003 reviews the hook as the FlgE-built flexible connector between
      the flagellar basal body and filament.
  - reference: DOI:10.1038/ncomms13425
    notes: Matsunami et al. 2016 resolved the Campylobacter jejuni hook as a helical
      tube built from FlgE.
  - reference: DOI:10.3390/biom9090462
    notes: Horvath et al. 2019 resolved the Salmonella flagellar hook and modeled
      FlgE intermolecular contacts that support universal-joint mechanics.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: FlgE hooks are widespread in bacterial-type flagella but are absent from bacteria
    without flagellar loci.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related appendages and do not use the
    FlgE hook of bacterial flagella.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:197
  taxon_label: Campylobacter jejuni
  note: Source species for the complete cryo-EM structure of a bacterial flagellar
    hook.
  reference: DOI:10.1038/ncomms13425
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Model species used to resolve hook intermolecular interactions and native
    hook supercoiling.
  reference: DOI:10.3390/biom9090462
functions:
- function_id: universal_joint_torque_transmission
  label: universal-joint torque transmission
  description: The hook bends while remaining torsionally stiff enough to transmit
    motor rotation from the basal body to the helical filament.
  evidence:
  - reference: DOI:10.1038/s41467-019-13252-9
    notes: Kato et al. 2019 resolved the native supercoiled Salmonella hook and linked
      its FlgE lattice to universal-joint bending and torque transmission.
  - reference: DOI:10.3390/biom9090462
    notes: Horvath et al. 2019 analyzed Salmonella FlgE contacts that explain hook
      flexibility during universal-joint function.
evidence:
- reference: DOI:10.1146/annurev.micro.57.030502.090832
  notes: Macnab RM 2003, How bacteria assemble flagella.
- reference: DOI:10.1038/ncomms13425
  notes: Matsunami H et al. 2016, Complete structure of the bacterial flagellar hook
    reveals extensive set of stabilizing interactions.
- reference: DOI:10.3390/biom9090462
  notes: Horvath P, Kato T, Miyata T and Namba K 2019, Structure of Salmonella flagellar
    hook reveals intermolecular domain interactions for the universal joint function.
- reference: DOI:10.1038/s41467-019-13252-9
  notes: Kato T et al. 2019, Structure of the native supercoiled flagellar hook as
    a universal joint.
causal_graphs:
- graph_id: flge_hook_universal_joint
  title: FlgE builds the torque-transmitting hook
  description: FlgE subunits polymerize into a short curved tube. The resulting hook
    connects the basal body and filament, bends as the filament changes angle, and
    transmits motor torque into rotation of the filament propeller.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
