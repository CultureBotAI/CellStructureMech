  edges:
  - subject: flge
    predicate: polymerizes into
    object: hook
    description: Multiple FlgE copies polymerize into the helical tube of the bacterial
      flagellar hook.
    evidence:
    - reference: DOI:10.1038/ncomms13425
      notes: Matsunami et al. 2016 resolved a complete Campylobacter jejuni hook built
        from polymerized FlgE.
  - subject: flge
    predicate: forms
    object: flge_interfaces
    description: Adjacent FlgE subunits form lateral and axial contacts within the
      hook lattice.
    evidence:
    - reference: DOI:10.3390/biom9090462
      notes: Horvath et al. 2019 modeled Salmonella FlgE intermolecular domain interactions
        in the hook.
  - subject: flge_interfaces
    predicate: stabilize
    object: hook
    description: FlgE contacts stabilize a tubular hook that can bend while resisting
      twisting.
    evidence:
    - reference: DOI:10.1038/s41467-019-13252-9
      notes: Kato et al. 2019 linked the native supercoiled hook lattice to a flexible
        universal joint.
  - subject: hook
    predicate: connects
    object: basal_body
    description: The proximal hook sits above the basal body as the flexible axial
      connector.
    evidence:
    - reference: DOI:10.1146/annurev.micro.57.030502.090832
      notes: Macnab 2003 reviews the hook as the axial substructure connecting the
        basal body to the external filament.
  - subject: hook
    predicate: connects
    object: filament
    description: The distal hook couples to the helical filament through the hook-filament
      junction.
    evidence:
    - reference: DOI:10.1146/annurev.micro.57.030502.090832
      notes: Macnab 2003 reviews assembly of the hook, hook-filament junction and
        filament.
  - subject: hook
    predicate: transmits torque to
    object: filament
    description: The flexible hook acts as a universal joint that carries basal-body
      rotation to the filament.
    evidence:
    - reference: DOI:10.1038/s41467-019-13252-9
      notes: Kato et al. 2019 resolved the native hook conformation used to explain
        universal-joint torque transmission.
  - subject: hook
    predicate: transmits torque into
    object: flagellar_rotation
    description: The flexible hook acts as a universal joint that carries basal-body
      rotation into rotation of the filament propeller.
    evidence:
    - reference: DOI:10.1038/s41467-019-13252-9
      notes: Kato et al. 2019 resolved the native hook conformation used to explain
        universal-joint torque transmission.
  - subject: flagellar_rotation
    predicate: turns
    object: filament
    description: Torque transmitted through the hook rotates the helical filament.
    evidence:
    - reference: DOI:10.1146/annurev.biochem.72.121801.161737
      notes: Berg 2003 reviews the bacterial flagellar motor and helical filament
        as the rotary swimming organelle.
  - subject: flagellar_rotation
    predicate: drives
    object: motility
    description: Rotation of the helical filament drives swimming motility.
    evidence:
    - reference: DOI:10.1146/annurev.biochem.72.121801.161737
      notes: Berg 2003 reviews swimming by rotating helical flagellar filaments.
discussions:
- discussion_id: exclude_cap_and_junction
  prompt: Should FlgD, FlgK, or FlgL be curated as bacterial-type flagellum hook components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flge
  rationale: The GO:0009424 hook record is scoped to the FlgE tube. FlgD forms the
    hook cap during assembly, and FlgK/FlgL form the hook-filament junction after
    hook completion; each is adjacent to, rather than part of, the mature hook.
  resolution_note: 'Declined: leave FlgD and FlgK/FlgL on the enclosing flagellum
    or on future cap and junction substructure records.'
  posed_by: claude
  posed_date: '2026-09-07'
  resolved_date: '2026-09-07'
