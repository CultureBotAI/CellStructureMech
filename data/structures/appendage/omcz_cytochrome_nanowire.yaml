  title: OmcZ subunits branch hemes for nanowire conduction
  description: OmcZ octaheme c-type cytochromes polymerize into an extracellular filament
    whose branched heme arrangement and surface-exposed heme site provide a structural
    basis for conductive OmcZ nanowires.
  graph_kind: FUNCTION
