  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: UniProtKB:Q74BG5 identifies the Geobacter sulfurreducens PCA OmcZ
    protein, but its RCSB/UniProt InterPro and Pfam mappings cover broad multiheme
    or IPT domains rather than an exact source-neutral family for OmcZ cytochrome
    nanowire subunits.
  role: Octaheme c-type cytochrome subunit that polymerizes into the extracellular
    OmcZ filament and positions covalently bound hemes in a branched arrangement.
  evidence:
  - reference: DOI:10.7554/eLife.81551
    notes: Wang et al. 2022 solved the Geobacter OmcZ filament by cryo-EM and modeled
      the filament as a polymer of OmcZ octaheme cytochrome subunits.
  - reference: PDB:8D9M
    notes: RCSB PDB entry 8D9M is the cryo-EM model of OmcZ nanowires from Geobacter
      sulfurreducens and aligns polymer entity 1 to UniProtKB:Q74BG5.
