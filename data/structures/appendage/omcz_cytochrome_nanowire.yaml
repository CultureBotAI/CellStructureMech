functions:
- function_id: branched_heme_long_range_electron_transfer
  label: branched-heme long-range electron transfer
  description: OmcZ subunits arrange covalently bound hemes in a branched network
    with a surface-exposed heme site per subunit, providing a structural path for
    long-range electron transfer in conductive OmcZ filaments.
  evidence:
  - reference: DOI:10.7554/eLife.81551
    notes: Wang et al. 2022 contrasted OmcZ with linear OmcS and OmcE heme chains
      and connected the OmcZ branched, surface-exposed heme arrangement with the filament's
      high conductivity.
evidence:
- reference: DOI:10.7554/eLife.81551
  notes: Wang, Chan, Suciu et al. 2022, Structure of Geobacter OmcZ filaments suggests
    extracellular cytochrome polymers evolved independently multiple times, eLife.
- reference: PDB:8D9M
  notes: RCSB PDB entry 8D9M is a 4.2 A helical cryo-EM model of Geobacter sulfurreducens
    OmcZ nanowires associated with EMDB map EMD-27266.
