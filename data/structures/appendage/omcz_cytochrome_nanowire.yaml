definition: An extracellular electrically conductive Geobacter sulfurreducens filament
  assembled from the octaheme c-type cytochrome OmcZ; each subunit contributes a branched
  heme arrangement with a surface-exposed heme site to the cytochrome polymer.
definition_source: DOI:10.7554/eLife.81551
