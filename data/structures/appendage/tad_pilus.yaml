    evidence:
    - reference: DOI:10.1038/s41467-024-50280-6
      notes: Hohl et al. 2024 structurally and biochemically analyze bidirectional
        pilus processing by CpaF.
    - reference: DOI:10.1126/science.aan5706
      notes: Ellison et al. 2017 show that Caulobacter Tad pili retract and that retraction
