discussions:
- discussion_id: cpaf_cpa_boundary
  prompt: Keep CpaF and the rest of the Cpa assembly machinery out of the component
    table for this first Tad pilus record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - causal_graphs#cpaf_pila_tad_pilus_dynamics
  rationale: This record denotes the extracellular PilA filament rather than the complete
    Tad envelope machine. CpaF is therefore shown as the extension-retraction motor
    in the function graph, while exact structural boundaries for the rest of the Cpa
    machinery remain out of scope.
  evidence:
  - reference: DOI:10.1038/s41467-024-50280-6
    notes: Hohl et al. 2024 resolve CpaF as a motor acting in the Tad pilus system.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
