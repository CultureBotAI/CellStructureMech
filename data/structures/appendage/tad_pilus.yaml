  - subject: tad_pilus
    predicate: contacts
    object: abiotic_surface
    description: Extension projects the Tad pilus away from the pole so its distal
      end can encounter nearby surfaces.
    evidence:
    - reference: DOI:10.1128/mBio.01237-19
      notes: Sangermani et al. 2019 image Tad pilus extension toward the surface during
        Caulobacter colonization assays.
  - subject: tad_pilus
    predicate: supports
    object: surface_colonization
    description: Repeated Tad pilus extension and retraction near a surface contributes
      to dynamic exploration and surface colonization.
