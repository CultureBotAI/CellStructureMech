identifier: cellstructuremech:tad_pilus
label: Tad pilus
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A tight-adherence subtype of type IV pilus that extends and retracts from
  a bacterial cell pole. In Caulobacter vibrioides, Tad pili are polar PilA filaments
  whose dynamic activity promotes surface sensing, surface colonization and holdfast-dependent
  permanent attachment.
definition_source: DOI:10.1128/mBio.01237-19
mapping_status: PROPOSED
