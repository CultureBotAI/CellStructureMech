components:
- component_id: pila_major_pilin
  label: PilA major pilin
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - pilA
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PilA is the Caulobacter Tad pilus major pilin; no exact source-neutral
    PilA family CURIE was curated for this first record.
  role: Polymerizes into the polar Tad pilus filament that extends and retracts during
    Caulobacter surface exploration.
  evidence:
  - reference: DOI:10.1128/mBio.01237-19
    notes: Sangermani et al. 2019 image dynamic Caulobacter Tad pili and identify
      PilA as the pilin building the polar filament.
  - reference: DOI:10.1126/science.aan5706
    notes: Ellison et al. 2017 fluorescently labeled Caulobacter PilA to directly
      observe Tad pilus extension and retraction.
taxonomic_distribution:
- taxon_id: NCBITaxon:155892
  taxon_label: Caulobacter vibrioides
  presence: UNIVERSAL
  note: Caulobacter vibrioides encodes polar Tad pili used by swarmer cells for dynamic
    surface colonization before holdfast-mediated permanent attachment.
  reference: DOI:10.1128/mBio.01237-19
canonical_examples:
- taxon_id: NCBITaxon:565050
  taxon_label: Caulobacter vibrioides NA1000
  note: Caulobacter vibrioides NA1000 is the model strain in direct-imaging and optical-trapping
    studies of dynamic Tad pili.
  reference: DOI:10.1128/mBio.01237-19
functions:
- function_id: tad_pilus_extension_retraction
  label: Tad pilus extension and retraction
  description: The CpaF motor extends and retracts polar PilA filaments so Caulobacter
    cells can repeatedly probe nearby surfaces.
  evidence:
  - reference: DOI:10.1126/science.aan5706
    notes: Ellison et al. 2017 directly observed extension and retraction of labeled
      Caulobacter Tad pili.
  - reference: DOI:10.1038/s41467-024-50280-6
    notes: Hohl et al. 2024 show bidirectional processing by the Tad pilus CpaF motor.
- function_id: surface_colonization
  label: surface colonization
  description: Cycles of Tad pilus extension, surface contact and retraction help
    Caulobacter cells remain near a surface long enough to deposit a holdfast.
  evidence:
  - reference: DOI:10.1128/mBio.01237-19
    notes: Sangermani et al. 2019 propose that the flagellum and Tad pili cooperate
      to progressively drive Caulobacter surface colonization.
evidence:
- reference: DOI:10.1128/mBio.01237-19
  notes: Sangermani M et al. 2019, 'Tad Pili Play a Dynamic Role in Caulobacter crescentus
    Surface Colonization', mBio.
- reference: DOI:10.1126/science.aan5706
  notes: Ellison CK et al. 2017, 'Obstruction of pilus retraction stimulates bacterial
    surface sensing', Science.
- reference: DOI:10.1038/s41467-024-50280-6
  notes: Hohl M et al. 2024, 'Bidirectional pilus processing in the Tad pilus system
    motor CpaF', Nature Communications.
