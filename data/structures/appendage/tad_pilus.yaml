  changes: Added Tad/Flp synonymy, type IV pilus parentage, PilA as the major pilin
    constituent, Caulobacter taxonomy, extension-retraction and surface-colonization
    functions, a CpaF/PilA dynamics graph, DOI evidence, and grounding/boundary discussions.
  llm_assisted: true
- timestamp: '2026-09-11T02:51:48Z'
