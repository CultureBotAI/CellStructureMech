  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: UniProtKB:Q74A86 identifies the Geobacter sulfurreducens PCA OmcS
    protein, but no exact source-neutral InterPro, Pfam or NCBIfam family grounding
    was verified for extracellular OmcS cytochrome nanowire subunits in this pass.
  role: Six-heme c-type cytochrome subunit that packs head-to-tail into the extracellular
    conductive nanowire and aligns hemes along the filament axis.
  evidence:
  - reference: DOI:10.1016/j.cell.2019.03.029
    notes: Wang et al. 2019 solved the cryo-EM structure of Geobacter sulfurreducens
      OmcS nanowires and modeled stacked OmcS monomers as the proteinaceous filament.
  - reference: DOI:10.1038/s42003-019-0448-9
    notes: Filman et al. 2019 independently resolved OmcS as head-to-tail stacked
      monomers in an extracellular Geobacter sulfurreducens cytochrome filament.
