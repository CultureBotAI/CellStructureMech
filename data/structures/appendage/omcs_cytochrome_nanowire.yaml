functions:
- function_id: stacked_heme_long_range_electron_transfer
  label: stacked-heme long-range electron transfer
  description: OmcS monomers align six covalently bound hemes per subunit into a continuous
    chain along the filament axis, providing a redox path for long-range extracellular
    electron transfer.
  evidence:
  - reference: DOI:10.1016/j.cell.2019.03.029
    notes: Wang et al. 2019 connected the OmcS filament's stacked heme arrangement
      with micrometer-scale electron transport in purified nanowires.
  - reference: DOI:10.1038/s42003-019-0448-9
    notes: Filman et al. 2019 resolved a 3.4 A OmcS filament structure whose continuous
      heme stack can support long-range electron transport.
evidence:
- reference: DOI:10.1016/j.cell.2019.03.029
  notes: Wang, Gu, O'Brien et al. 2019, Structure of Microbial Nanowires Reveals Stacked
    Hemes that Transport Electrons over Micrometers, Cell.
- reference: DOI:10.1038/s42003-019-0448-9
  notes: Filman, Marino, Ward et al. 2019, Cryo-EM reveals the structural basis of
    long-range electron transport in a cytochrome-based bacterial nanowire, Communications
    Biology.
causal_graphs:
- graph_id: stacked_heme_omcs_nanowire_conduction
  title: OmcS monomers align hemes for nanowire conduction
  description: OmcS six-heme c-type cytochrome monomers polymerize into a helical
    extracellular filament in which a stacked heme chain runs along the nanowire axis
    and provides a path for long-range electron transfer.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: This graph is restricted to OmcS filament architecture and the stacked-heme
    conduction path; it does not model OmcS export, nanowire localization on cells,
    or the distinct OmcE and OmcZ cytochrome nanowire classes.
