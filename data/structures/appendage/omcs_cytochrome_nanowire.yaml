definition: An extracellular electrically conductive Geobacter sulfurreducens cell
  projection assembled as a helical filament of OmcS six-heme c-type cytochrome monomers
  whose stacked hemes provide a path for long-range electron transport.
definition_source: DOI:10.1016/j.cell.2019.03.029
