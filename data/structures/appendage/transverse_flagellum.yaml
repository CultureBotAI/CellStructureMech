identifier: GO:0097608
label: transverse flagellum
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A motile cilium found in dinoflagellates. It coils around the cell and
  provides the forward thrust for motility. It is often contained in a furrow called
  the cingulum, and emerges from a flagellar pore located in the cingulum. The ribbon-like
  anterior/equatorial eukaryotic flagellum of dinoflagellates that emerges from the
  ventral flagellar pore and beats within the horizontal cingulum furrow encircling
  the cell. It contains a 9+2 axoneme paired with a contractile striated paraflagellar
  rod (paraxonemal strand) that holds the flagellum in a helical wave, generating
  both forward thrust and rotational torque during swimming.
