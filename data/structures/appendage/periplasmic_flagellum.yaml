- component_id: flaA_sheath
  label: FlaA flagellar proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - flaA
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: FlaA proteins are spirochete periplasmic flagellar constituents
    with lineage-dependent localization; no exact source-neutral family CURIE was
    curated here. The retained component ID is historical and does not assert a universal
    sheath.
  role: Flagellar constituents whose architecture varies by lineage. FlaA forms a
    sheath around the FlaB core in Brachyspira hyodysenteriae; Borrelia burgdorferi
    FlaA is a minor filament-associated protein with unresolved precise localization,
    and Leptospira sheath formation does not require FlaA in the cited deletion studies.
  evidence:
  - reference: DOI:10.3390/biom10040550
    notes: Nakamura 2020 distinguishes Brachyspira FlaA sheath architecture from tentative
      basal FlaA localization in Borrelia and a Leptospira sheath that persists after
      flaA deletion, with FcpA a major sheath constituent.
  - reference: DOI:10.1128/JB.180.9.2418-2425.1998
    notes: Ge et al. 1998 copurified FlaA with Borrelia burgdorferi periplasmic flagella
      but did not establish a sheath location. The proposed localization near the
      hook was explicitly tentative.
