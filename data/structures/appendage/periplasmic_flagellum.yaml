  edges:
  - subject: flaB_core
    predicate: polymerizes into
    object: filament
    description: FlaB flagellins build the core of the periplasmic flagellar filament.
    evidence:
    - reference: DOI:10.3390/biom10040550
      notes: Nakamura 2020 reviews the conserved FlaB core of spirochete periplasmic
        flagellar filaments.
  - subject: flaA_sheath
    predicate: forms sheath around
    object: filament
    description: FlaA proteins form the sheath that surrounds the FlaB core in the
      spirochete filament.
    evidence:
    - reference: DOI:10.1016/j.tim.2022.09.010
      notes: San Martin et al. 2023 review the FlaA sheath surrounding polymerized
        FlaB protomers in the spirochete periplasmic flagellar filament.
  - subject: filament
    predicate: is part of
    object: periplasmic_flagellum
    description: The sheathed filament is the elongated axial part of the periplasmic
      flagellum.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3000050
      notes: Qin et al. 2018 resolved filaments connected to polar periplasmic flagellar
        motors in Borrelia burgdorferi.
  - subject: basal_body_motor
    predicate: drives
    object: flagellar_rotation
    description: The polar spirochete basal body is the rotary motor that drives periplasmic
      flagellar rotation.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3000050
      notes: Qin et al. 2018 imaged Borrelia burgdorferi periplasmic flagella attached
        to basal bodies with the spirochete collar and cytoplasmic ATPase complex.
  - subject: flagellar_rotation
    predicate: turns
    object: filament
    description: Flagellar rotation turns the internal sheathed filament in the spirochete
      periplasm.
    evidence:
    - reference: DOI:10.3390/biom10040550
      notes: Nakamura 2020 reviews rotation of endoflagella inside the spirochete
        periplasmic space.
  - subject: flagellar_rotation
    predicate: produces
    object: cell_deformation
    description: Rotation of periplasmic filaments imposes shape changes on the spirochete
      cell cylinder.
    evidence:
    - reference: DOI:10.1073/pnas.200221797
      notes: Motaleb et al. 2000 used Borrelia burgdorferi flaB mutants to show that
        periplasmic flagella provide a skeletal contribution to the normal flat-wave
        cell shape.
  - subject: cell_deformation
    predicate: drives
    object: motility
    description: Periplasmic-flagellum-driven cell-body deformation produces spirochete
      motility.
    evidence:
    - reference: DOI:10.3390/biom10040550
      notes: Nakamura 2020 reviews fluid and surface propulsion driven by periplasmic
        flagellar rotation inside spirochetes.
