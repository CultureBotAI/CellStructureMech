identifier: GO:0055040
label: periplasmic flagellum
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A bacterial-type flagellar appendage of spirochetes whose filaments reside
  in the periplasmic space between the cytoplasmic and outer membranes, attach near
  the cell poles, and rotate to deform the cell cylinder for motility.
definition_source: DOI:10.3390/biom10040550
mapping_status: PROPOSED
