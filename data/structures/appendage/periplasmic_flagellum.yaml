  edges:
  - subject: flaB_core
    predicate: polymerizes into
    object: filament
    description: FlaB flagellins build the core of the periplasmic flagellar filament.
    evidence:
    - reference: DOI:10.3390/biom10040550
      notes: Nakamura 2020 reviews the conserved FlaB core of spirochete periplasmic
        flagellar filaments.
  - subject: flaA_sheath
    predicate: associates with
    object: filament
    description: FlaA associates with periplasmic flagella; a sheath role is lineage-specific
      rather than a universal property of spirochete filaments.
    evidence:
    - reference: DOI:10.1128/JB.180.9.2418-2425.1998
      notes: Ge et al. copurified Borrelia FlaA with flagella but left its precise
        localization unresolved.
    - reference: DOI:10.3390/biom10040550
      notes: Nakamura distinguishes Brachyspira FlaA sheath architecture, tentative
        basal localization in Borrelia and Leptospira sheath retention after FlaA
        deletion.
  - subject: filament
    predicate: is part of
    object: periplasmic_flagellum
    description: The filament is the elongated axial part of the periplasmic flagellum;
      its sheath composition is not uniform across spirochetes.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3000050
      notes: Qin et al. 2018 resolved filaments connected to polar periplasmic flagellar
        motors in Borrelia burgdorferi.
  - subject: basal_body_motor
    predicate: drives
    object: flagellar_rotation
    description: The polar spirochete basal body is the rotary motor that drives periplasmic
      flagellar rotation.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3000050
      notes: Qin et al. 2018 imaged Borrelia burgdorferi periplasmic flagella attached
        to basal bodies with the spirochete collar and cytoplasmic ATPase complex.
  - subject: flagellar_rotation
    predicate: turns
    object: filament
    description: Flagellar rotation turns the internal filament in the spirochete
      periplasm.
    evidence:
    - reference: DOI:10.3390/biom10040550
      notes: Nakamura 2020 reviews rotation of endoflagella inside the spirochete
        periplasmic space.
  - subject: flagellar_rotation
    predicate: produces
    object: cell_deformation
    description: During swimming, periplasmic flagellar rotation drives dynamic deformation
      such as wave propagation along Borrelia and Brachyspira cell bodies.
    evidence:
    - reference: DOI:10.3390/biom10040550
      notes: Section 4.1 reviews wave propagation driven by periplasmic flagellar
        rotation in Borrelia and Brachyspira. This swimming mechanism is distinct
        from maintenance of resting flat-wave shape.
    - reference: DOI:10.1073/pnas.200221797
      notes: 'Boundary evidence, not proof of this active edge: Motaleb et al. found
        that CCCP-paralyzed Borrelia cells retain flat-wave shape. The resting skeletal
        contribution therefore does not require rotation.'
  - subject: cell_deformation
    predicate: drives
    object: motility
    description: Dynamic cell-body deformation during swimming, including propagating
      waves, produces spirochete propulsion.
    evidence:
    - reference: DOI:10.3390/biom10040550
      notes: Nakamura 2020 reviews fluid and surface propulsion driven by periplasmic
        flagellar rotation inside spirochetes.
