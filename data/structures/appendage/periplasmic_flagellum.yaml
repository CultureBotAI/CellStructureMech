synonyms:
- synonym_text: endoflagellum
  synonym_type: EXACT_SYNONYM
  source: DOI:10.3390/biom10040550
- synonym_text: periplasmic flagellar filament
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1016/j.tim.2022.09.010
parent_structures:
- GO:0009288
components:
- component_id: flaB_core
  label: FlaB core flagellins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - flaB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Spirochetes can encode several related FlaB core flagellins; no
    single InterPro family was curated that exactly covers the taxon-agnostic periplasmic
    flagellar core set.
  role: Major flagellin class that polymerizes into the core of the periplasmic flagellar
    filament.
  evidence:
  - reference: DOI:10.3390/biom10040550
    notes: Nakamura 2020 reviews FlaB proteins as the conserved spirochete periplasmic
      flagellar core proteins.
  - reference: DOI:10.1073/pnas.200221797
    notes: Motaleb et al. 2000 disrupted Borrelia burgdorferi flaB and showed that
      periplasmic flagella are required for both motility and the normal flat-wave
      cell shape.
- component_id: flaA_sheath
  label: FlaA sheath proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - flaA
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: FlaA sheath proteins are spirochete-specific periplasmic flagellar
    constituents without a curated exact source-neutral family CURIE.
  role: Minor flagellar proteins that form the spirochete sheath around the FlaB core
    filament.
  evidence:
  - reference: DOI:10.3390/biom10040550
    notes: Nakamura 2020 reviews the FlaA sheath plus FlaB core architecture of known
      spirochete periplasmic flagella.
  - reference: DOI:10.1128/JB.180.9.2418-2425.1998
    notes: Ge et al. 1998 detected FlaA and FlaB in Borrelia burgdorferi periplasmic
      flagella and found FlaA in several spirochete species.
  protein_examples:
  - uniprot_id: UniProtKB:P70856
    protein_label: Flagellar filament outer layer protein
    gene_symbol: flaA
    taxon_id: NCBITaxon:224326
    taxon_label: Borreliella burgdorferi B31
    entry_status: REVIEWED
    retrieved_on: '2026-09-08'
    role: The single reviewed UniProtKB entry for gene flaA in Borreliella burgdorferi
      B31, a taxon this record names. Identifier for the component's declared gene
      symbol; it is not itself evidence that the protein is part of this structure.
    evidence:
    - reference: https://www.uniprot.org/uniprotkb/P70856
      notes: UniProtKB reviewed (Swiss-Prot) entry P70856, the single reviewed entry
        for gene flaA in Borreliella burgdorferi B31. Establishes the accession and
        gene identity only; the component's membership in this structure rests on
        the record's own sources.
- component_id: basal_body_motor
  label: spirochete flagellar basal body motor
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0120100 denotes the broader bacterial-type flagellum motor rather
    than the spirochete periplasmic basal body with its lineage-specific collar and
    cytoplasmic ATPase complex.
  role: Polar rotary basal body that anchors the periplasmic filament and transmits
    torque to it.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3000050
    notes: Qin et al. 2018 used in situ cryoET of Borrelia burgdorferi to visualize
      the periplasmic flagellar basal body, collar, and distinct cytoplasmic ATPase
      complex.
taxonomic_distribution:
- taxon_id: NCBITaxon:203691
  taxon_label: Spirochaetota
  presence: COMMON
  note: Periplasmic flagella are characteristic endoflagella of motile spirochetes
    and reside between the inner and outer membranes.
  reference: DOI:10.3390/biom10040550
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: RARE
  note: The organelle is a spirochete-specific form of the bacterial flagellum rather
    than a general bacterial appendage.
  reference: DOI:10.3390/biom10040550
canonical_examples:
- taxon_id: NCBITaxon:139
  taxon_label: Borreliella burgdorferi
  note: Qin et al. imaged intact periplasmic flagella and basal-body motors in Borrelia
    burgdorferi cells by cryo-electron tomography.
  reference: DOI:10.1371/journal.pbio.3000050
functions:
- function_id: motility
  label: bacterial-type flagellum-dependent cell motility
  grounding: GO:0071973
  description: Internal flagellar rotation within the periplasm deforms the spirochete
    cell cylinder and produces swimming motility.
  evidence:
  - reference: DOI:10.3390/biom10040550
    notes: Nakamura 2020 reviews propulsion by rotation of periplasmic flagella inside
      the narrow spirochete periplasmic space.
  - reference: DOI:10.1073/pnas.200221797
    notes: Motaleb et al. 2000 showed that Borrelia burgdorferi periplasmic flagella
      have both motility and skeletal roles.
evidence:
- reference: DOI:10.3390/biom10040550
  notes: Nakamura 2020, Spirochete Flagella and Motility, Biomolecules.
- reference: DOI:10.1371/journal.pbio.3000050
  notes: Qin et al. 2018, Cryo-electron tomography of periplasmic flagella in Borrelia
    burgdorferi reveals a distinct cytoplasmic ATPase complex, PLOS Biology.
- reference: DOI:10.1073/pnas.200221797
  notes: Motaleb et al. 2000, Borrelia burgdorferi periplasmic flagella have both
    skeletal and motility functions, Proceedings of the National Academy of Sciences.
- reference: DOI:10.1016/j.tim.2022.09.010
  notes: San Martin et al. 2023, Diving into the complexity of the spirochetal endoflagellum,
    Trends in Microbiology.
causal_graphs:
- graph_id: periplasmic_flagellum_cell_deformation
  title: A sheathed FlaB filament rotates in the periplasm to deform the cell cylinder
  description: FlaB proteins form the core of a sheathed periplasmic filament, the
    polar basal body anchors and drives rotation of that filament, and internal flagellar
    rotation changes spirochete cell shape to generate motility.
