identifier: GO:0009433
label: bacterial-type flagellum basal body, C ring
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: The cytoplasmic FliG/FliM/FliN switch ring of the bacterial flagellar
  basal body, assembled on the MS ring to form the rotor face that receives torque
  from Mot/Pom stator units and changes rotational bias in response to phosphorylated
  CheY.
definition_source: DOI:10.1016/j.tim.2014.12.011
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-08T07:35:28Z'
  curator: claude
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-08T07:36:37Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added GO C-ring synonymy and basal-body parthood; curated FliG, FliM and
    FliN components with exact InterPro groundings; added bacterial and archaeal taxonomic
    scope, Salmonella as a canonical example, rotor assembly, stator coupling and
    rotational switching functions, primary literature evidence, a FliG/FliM/FliN
    switch-complex causal graph, and resolved boundary discussions for Bacillus FliY
    and neighboring motor subcomplexes.
  llm_assisted: true
- timestamp: '2026-09-08T07:56:50Z'
  curator: claude
  action: ADDRESS_REVIEW
  changes: 'Resolved #274 by moving morphology-only Thomas 1999 evidence off the FliN
    component, resolved #275 by routing FliG/FliM/FliN graph edges into the GO:0009433
    C-ring node, and resolved #276 by adding Welch 1993 as direct CheY-P-to-FliM binding
    evidence.'
  llm_assisted: true
