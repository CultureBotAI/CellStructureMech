components:
- component_id: flig
  label: Flagellar motor switch protein FliG
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR000090
  gene_symbols:
  - fliG
  essentiality: ESSENTIAL
  role: Links the C ring to FliF in the MS ring and presents the rotor surface that
    contacts stator A subunits during torque generation.
  evidence:
  - reference: DOI:10.1073/pnas.89.14.6304
    notes: Francis et al. 1992 localized Salmonella FliG to the cytoplasmic face of
      the flagellar M ring.
  - reference: DOI:10.1016/j.tim.2014.12.011
    notes: Minamino and Imada 2015 review FliG as the C-ring protein that contacts
      the stator to couple ion-driven force to rotor rotation.
- component_id: flim
  label: Flagellar motor switch protein FliM
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR001689
  gene_symbols:
  - fliM
  essentiality: ESSENTIAL
  role: Builds the switch lattice between FliG and FliN and carries phosphorylated
    CheY input into clockwise/counterclockwise rotational switching.
  evidence:
  - reference: DOI:10.1038/nature09300
    notes: Lee et al. 2010 structurally analyzed FliG, FliM and FliN interactions
      that underlie C-ring switching.
  - reference: DOI:10.1128/mBio.00079-19
    notes: Sakai et al. 2019 probed FliG-FliM rearrangements in the flagellar switch
      complex during rotational biasing.
- component_id: flin
  label: Flagellar motor switch FliN
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR012826
  gene_symbols:
  - fliN
  essentiality: ESSENTIAL
  role: Forms the lower switch-complex layer with FliM to stabilize the cytoplasmic
    C ring.
  evidence:
  - reference: DOI:10.1038/emboj.2011.188
    notes: Paul et al. 2011 mapped FliM and FliN beneath FliG in the Salmonella flagellar
      rotor architecture.
  - reference: DOI:10.1038/nature09300
    notes: Lee et al. 2010 structurally connected FliN to the FliG/FliM/FliN torque
      ring.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: FliG/FliM/FliN-family C rings occur in bacteria that assemble bacterial-type
    flagellar basal bodies and are absent from lineages that lack this rotary appendage.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaea assemble type-IV-pilus-related archaella rather than FliG/FliM/FliN
    bacterial flagellar C rings.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Classical model organism for genetic, biochemical and cryo-EM studies of the
    FliG/FliM/FliN C-ring switch complex.
  reference: DOI:10.1128/JB.00552-06
functions:
- function_id: basal_body_rotor_assembly
  label: basal-body rotor assembly
  description: FliG attaches to the cytoplasmic side of the FliF MS ring and recruits
    the FliM/FliN switch lattice to build the mature C-ring rotor.
  evidence:
  - reference: DOI:10.1073/pnas.89.14.6304
    notes: Francis et al. 1992 placed FliG at the cytoplasmic face of the Salmonella
      M ring.
  - reference: DOI:10.1038/s41467-021-24507-9
    notes: Kawamoto et al. 2021 measured native Salmonella C-ring symmetry relative
      to the FliF MS-ring core.
- function_id: rotor_stator_torque_coupling
  label: rotor-stator torque coupling
  description: FliG in the C ring contacts membrane stator units so Mot/Pom A-subunit
    rotation can apply torque to the basal-body rotor.
  evidence:
  - reference: DOI:10.1016/j.tim.2014.12.011
    notes: Minamino and Imada 2015 review the FliG-stator interface that transmits
      motor torque to the C ring.
  - reference: DOI:10.1038/s41564-020-0788-8
    notes: Deme et al. 2020 modeled MotA/PomA-family stator subunits meshing with
      FliG in the rotor.
- function_id: rotational_switching
  label: rotational switching
  description: The switch complex changes C-ring conformation to bias the flagellar
    motor between clockwise and counterclockwise rotation after phosphorylated CheY
    binds primarily to FliM.
  evidence:
  - reference: DOI:10.1073/pnas.90.19.8787
    notes: Welch et al. 1993 showed that CheY binds the switch complex with FliM as
      the primary docking site and that the extent of CheY-FliM binding depends on
      CheY phosphorylation.
  - reference: DOI:10.1038/nature09300
    notes: Lee et al. 2010 connected FliG/FliM/FliN structure to the molecular basis
      of flagellar rotational switching.
  - reference: DOI:10.1128/mBio.00079-19
    notes: Sakai et al. 2019 experimentally examined conformational rearrangements
      within the switch complex.
