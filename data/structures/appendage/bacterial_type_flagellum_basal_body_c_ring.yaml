discussions:
- discussion_id: fliy_variant_boundary
  prompt: Should Bacillus subtilis FliY be folded into the curated FliN component?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flin
  rationale: Ward et al. 2019 support FliY as the Bacillus subtilis lower switch-complex
    protein, but the exact InterPro grounding used for this record's FliN component
    is restricted to FliN from organisms such as Salmonella and Escherichia.
  resolution_note: 'Declined: keep the core component grounded to exact FliN and document
    the FliY replacement as a lineage variant until an exact B. subtilis FliY-family
    component is modeled.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
- discussion_id: exclude_neighboring_motor_subcomplexes
  prompt: Should the MS ring, stator units or flagellar export apparatus be components
    of this record?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - part_of
  - causal_graphs#fli_switch_rotor
  rationale: GO:0009433 names only the cytoplasmic C ring. The FliF MS ring, Mot/Pom
    stator complexes and type III export apparatus are neighboring basal-body substructures
    that physically and functionally couple to the C ring but are not its FliG/FliM/FliN
    constituents.
  resolution_note: 'Declined: encode the C ring as part of the broader basal body
    and refer to MS-ring, stator and export-apparatus structures only in functions
    or mechanism graphs.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
