identifier: GO:1990905
label: dinoflagellate peduncle
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A small, flexible, finger-like projection of cytoplasm containing an array
  of microtubles and located near the flagellar pores in some photosynthetic as well
  as nonphotosynthetic dinoflagellate species. Its functions are not fully understood,
  but it has been associated with feeding behavior (phagotrophy).
