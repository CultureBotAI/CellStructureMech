evidence:
- reference: GO:1990905
  notes: Gene Ontology cellular-component term for the dinoflagellate peduncle, defined
    as a cytoplasmic projection near the flagellar pores that contains an array of
    microtubules.
- reference: GO:0120025
  notes: Gene Ontology cellular-component term for plasma membrane bounded cell projection;
    QuickGO records it as the current direct is_a parent of GO:1990905.
- reference: PMID:1480107
  notes: PubMed record for the Lee and Kugrens 1992 dinoflagellate/ciliate review
    cited by GO:1990905.
- reference: DOI:10.1128/mr.56.4.529-542.1992
  notes: Lee and Kugrens 1992 is the Microbiological Reviews article behind PMID:1480107;
    PMC exposed the article metadata and HTML body in this pass, but not peduncle-specific
    searchable body text, so this record uses it only as bibliographic corroboration
    for the GO xref.
- reference: DOI:10.3390/microorganisms2010073
  notes: Okamoto and Keeling 2014 reviewed the dinoflagellate flagellar apparatus
    and distinguished the widespread microtubular strand or basket near the flagellar
    apparatus from confirmed peduncle membership in specific lineages, noting that
    the analogous gonyaulacoid strand had not been shown to extend into the peduncle.
- reference: PMID:27694777
  notes: PubMed record for Okamoto and Keeling 2014, the open-access review of dinoflagellate,
    perkinsid, and colpodellid flagellar apparatus ultrastructure.
- reference: DOI:10.1038/s41467-022-28867-8
  notes: Larsson et al. 2022 observed Australian Prorocentrum cf. balticum strains
    feeding on Rhodomonas salina through a short tubular peduncle and confirmed myzocytosis
    by visualizing intracellular food vacuoles.
- reference: PMID:35288549
  notes: PubMed record for Larsson et al. 2022, the primary open-access mucosphere-assisted
    feeding study later tied to Prorocentrum insidiosum sp. nov.
- reference: DOI:10.1111/jeu.70017
  notes: Larsson et al. 2025 described Prorocentrum insidiosum sp. nov. for the Australian
    strains originally reported as Prorocentrum cf. balticum by Larsson et al. 2022
    and characterized their morphology and phylogeny.
- reference: PMID:40448289
  notes: PubMed record for Larsson et al. 2025, an open-access morphological and phylogenetic
    characterization of the mucosphere-producing dinoflagellate Prorocentrum insidiosum.
