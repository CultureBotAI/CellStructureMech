discussions:
- discussion_id: resolve_peduncle_molecular_constituents
  prompt: Add peduncle molecular components only after directly localized constituents
    and exact source-neutral family groundings have been identified.
  kind: CURATION_TODO
  status: OPEN
  rationale: GO and ultrastructural literature define the peduncle as a microtubule-containing
    cytoplasmic projection, but this pass did not find exact family-level evidence
    for peduncle-specific molecular constituents; broad tubulin and microtubule terms
    do not encode the dinoflagellate peduncle context.
  evidence:
  - reference: GO:1990905
  - reference: DOI:10.3390/microorganisms2010073
  posed_by: codex
  posed_date: '2026-10-02'
- discussion_id: peduncle_is_projection_not_flagellar_apparatus
  prompt: Keep the peduncle as a cytoplasmic cell projection even though it is topologically
    associated with the dinoflagellate flagellar apparatus.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:1990905 classifies the peduncle under plasma membrane bounded cell
    projection, and Okamoto and Keeling 2014 treated the microtubular strand or basket
    as a microtubule bundle that bypasses close to the flagellar apparatus rather
    than as a core basal-body root or connective fiber.
  evidence:
  - reference: GO:1990905
  - reference: GO:0120025
  - reference: DOI:10.3390/microorganisms2010073
  posed_by: codex
  posed_date: '2026-10-02'
  resolved_date: '2026-10-02'
  resolution_note: Model GO:1990905 as a membrane-bounded cell projection rather than
    a flagellar-apparatus substructure.
- discussion_id: evaluate_peduncle_apical_complex_homology
  prompt: Evaluate dinoflagellate-peduncle/apical-complex homology before adding apical-complex
    components, secretory-vesicle parts, or homology edges to this record.
  kind: CURATION_TODO
  status: OPEN
  rationale: Okamoto and Keeling 2014 reviewed the hypothesis that the dinoflagellate
    peduncle is homologous to the apical complex and noted electron-dense vesicles
    associated with some peduncles, but this record should not import apical-complex
    structure until the specific homology and component boundaries are directly curated.
  evidence:
  - reference: DOI:10.3390/microorganisms2010073
  posed_by: codex
  posed_date: '2026-10-02'
