  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: resolve_connector_motility_mechanism
  prompt: Model the FC motor and old- versus new-flagellum attachment mechanisms once
    the kinesin components have exact boundaries.
  kind: CURATION_TODO
  status: OPEN
  rationale: Davidge et al. 2006 showed that FC motility is separable from new-axoneme
    extension, and Varga et al. 2017 assigned kinesin-family proteins to opposite
    FC attachment sides. The motility graph should wait until those proteins are curated
    as FC components or deliberately excluded.
  evidence:
  - reference: DOI:10.1242/jcs.03203
  - reference: DOI:10.1073/pnas.1703553114
  posed_by: codex
  posed_date: '2026-10-03'
