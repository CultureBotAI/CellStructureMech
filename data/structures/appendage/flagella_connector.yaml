functions:
- function_id: new_to_old_flagellum_linkage
  label: new-to-old flagellum linkage
  description: The FC couples the distal tip of the growing new flagellum to the flank
    of the old flagellum during T. brucei flagellum biogenesis.
  evidence:
  - reference: DOI:10.1242/jcs.00995
    notes: Briggs et al. 2004 characterized the T. brucei flagella connector as a
      mobile transmembrane junction linking the new and old flagella.
  - reference: DOI:10.1371/journal.pntd.0004312
    notes: Hoog et al. 2016 resolved FC layers between the new and old flagella by
      electron tomography and cryo-electron tomography.
- function_id: flagella_connector_tip_motility
  label: new-flagellum tip tracking
  description: The FC remains associated with the tip of the assembling new flagellum
    while moving along the old flagellum.
  evidence:
  - reference: DOI:10.1126/science.1063775
    notes: Moreira-Leite et al. 2001 first described the motile junction that connects
      the growing new flagellum to the old flagellum during trypanosome cell division.
  - reference: DOI:10.1242/jcs.03203
    notes: Davidge et al. 2006 used intraflagellar-transport mutants to dissect FC
      movement from extension of the new flagellar axoneme.
- function_id: distal_flagellar_tip_coupling
  label: new-tip to old-shaft microtubule coupling
  description: FC-associated proteins link the connector membrane junction to extending
    microtubule tips in the assembling new flagellum and to axonemal microtubules
    along the lateral shaft of the mature old flagellum.
  evidence:
  - reference: DOI:10.1073/pnas.1703553114
    notes: Varga et al. 2017 assigned a kinesin-15 family member to the link with
      extending new-flagellum microtubule tips and a kinetoplastid-specific kinesin
      to attachment to mature-flagellum microtubules. This does not place the old-side
      attachment at the old distal tip or equate the connector with the separate axonemal
      cap.
  - reference: DOI:10.1371/journal.pntd.0004312
    notes: Hoog et al. 2016 resolved the connector between the new flagellum tip and
      the lateral side of the old flagellum; it travels along the old flagellum and
      stops roughly halfway along its length. This supplies the spatial context for
      the mature-flagellum microtubule attachment.
evidence:
- reference: DOI:10.1126/science.1063775
  notes: Moreira-Leite, Sherwin, Kohl and Gull 2001, A trypanosome structure involved
    in transmitting cytoplasmic information during cell division, Science.
- reference: DOI:10.1242/jcs.00995
  notes: 'Briggs et al. 2004, The flagella connector of Trypanosoma brucei: an unusual
    mobile transmembrane junction, Journal of Cell Science.'
- reference: DOI:10.1242/jcs.03203
  notes: Davidge et al. 2006, Trypanosome IFT mutants provide insight into the motor
    location for mobility of the flagella connector and flagellar membrane formation,
    Journal of Cell Science.
- reference: DOI:10.1371/journal.pntd.0004312
  notes: Hoog et al. 2016, 3D Architecture of the Trypanosoma brucei Flagella Connector,
    a Mobile Transmembrane Junction, PLOS Neglected Tropical Diseases.
- reference: DOI:10.1073/pnas.1703553114
  notes: Varga, Moreira-Leite, Portman and Gull 2017, Protein diversity in discrete
    structures at the distal tip of the trypanosome flagellum, Proceedings of the
    National Academy of Sciences of the United States of America.
discussions:
- discussion_id: curate_flagella_connector_components
  prompt: Resolve the complete set of T. brucei FC constituent proteins and their
    exact source-neutral groundings.
  kind: CURATION_TODO
  status: OPEN
  rationale: Varga et al. 2017 identified seven flagella-connector constituents and
    three axonemal-capping-structure constituents. This first record defers component
    curation until the connector, axonemal cap and adjacent distal-tip boundaries
    can be separated without absorbing neighboring structures.
  evidence:
