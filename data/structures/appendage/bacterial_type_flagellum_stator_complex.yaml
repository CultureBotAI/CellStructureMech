synonyms:
- synonym_text: bacterial-type flagellum motor force generator complex
  synonym_type: EXACT_SYNONYM
  source: GO:0120101
- synonym_text: bacterial-type flagellum torque generator complex
  synonym_type: EXACT_SYNONYM
  source: GO:0120101
part_of:
- GO:0120100
components:
- component_id: a_subunit
  label: flagellar stator A subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: MotA and PomA form homologous A subunits in proton- and sodium-driven
    bacterial flagellar stators; no exact integrated InterPro family covering the
    full MotA/PomA class was identified during curation.
  gene_symbols:
  - motA
  - pomA
  stoichiometry: 5 A subunits per solved MotAB stator core
  essentiality: ESSENTIAL
  role: Builds the pentameric membrane ring that rotates around the anchored B-subunit
    dimer and engages FliG in the C ring.
  evidence:
  - reference: DOI:10.1016/j.cell.2020.08.016
    notes: Santiveri et al. 2020 resolved MotA/MotB stator units as MotA5MotB2 assemblies.
  - reference: DOI:10.1038/s41564-020-0788-8
    notes: Deme et al. 2020 independently resolved pentameric MotA rings in bacterial
      flagellar stator complexes.
- component_id: b_subunit
  label: flagellar stator B subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: MotB and PomB are the anchored B subunits of proton- and sodium-driven
    bacterial flagellar stators; no exact integrated InterPro family covering the
    full MotB/PomB class was identified during curation.
  gene_symbols:
  - motB
  - pomB
  stoichiometry: 2 B subunits per solved MotAB stator core
  essentiality: ESSENTIAL
  role: Forms the dimeric ion-pathway core and anchors the stator to peptidoglycan
    through its periplasmic domain.
  evidence:
  - reference: DOI:10.1016/j.cell.2020.08.016
    notes: Santiveri et al. 2020 placed two B subunits at the center of the MotAB
      stator unit.
  - reference: DOI:10.1016/j.str.2018.02.016
    notes: Kojima et al. 2018 showed that the periplasmic domain of the stator B subunit
      controls peptidoglycan binding and ion influx.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: MotA/MotB- and PomA/PomB-family stator complexes occur in rotary bacterial
    flagellar motors but are absent from bacteria without bacterial flagella.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related appendages and do not use Mot/Pom
    stator complexes for rotation.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:197
  taxon_label: Campylobacter jejuni
  note: Source genus and species for one of the high-resolution MotA5MotB2 stator
    structures that revised the core stoichiometry.
  reference: DOI:10.1016/j.cell.2020.08.016
functions:
- function_id: ion_driven_torque_generation
  label: ion-driven torque generation
  description: Proton or sodium transit through the stator drives rotation of the
    A-subunit pentamer around the anchored B-subunit dimer, which applies torque to
    the flagellar rotor.
  evidence:
  - reference: DOI:10.1016/j.cell.2020.08.016
    notes: Santiveri et al. 2020 combined MotAB structures, mutagenesis and functional
      assays into a model for stator rotation and torque generation.
  - reference: DOI:10.1038/s41564-020-0788-8
    notes: Deme et al. 2020 modeled MotA5MotB2 as the ion-driven gear that drives
      the FliG rotor ring.
- function_id: dynamic_peptidoglycan_anchoring
  label: dynamic peptidoglycan anchoring
  description: The B-subunit periplasmic domain binds peptidoglycan after activation,
    positioning stator units around the cytoplasmic rotor while allowing exchange
    at the motor.
  evidence:
  - reference: DOI:10.1016/j.str.2018.02.016
    notes: Kojima et al. 2018 linked B-subunit periplasmic-domain rearrangement to
      peptidoglycan binding and stator activation.
