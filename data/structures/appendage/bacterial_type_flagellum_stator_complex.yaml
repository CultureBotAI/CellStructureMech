  edges:
  - subject: a_subunit
    predicate: forms pentameric ring in
    object: stator_complex
    description: Five A subunits form the outer ring of the MotAB stator core in the
      cytoplasmic membrane.
    evidence:
    - reference: DOI:10.1016/j.cell.2020.08.016
      notes: Santiveri et al. 2020 resolved MotAB as an A5B2 assembly.
  - subject: b_subunit
    predicate: forms dimeric core in
    object: stator_complex
    description: Two B subunits form the anchored central dimer of the MotAB stator
      core.
    evidence:
    - reference: DOI:10.1016/j.cell.2020.08.016
      notes: Santiveri et al. 2020 placed the B-subunit dimer inside the A-subunit
        pentamer.
  - subject: b_subunit
    predicate: anchors to
    object: peptidoglycan
    description: The periplasmic B-subunit domain anchors activated stator units to
      the peptidoglycan layer.
    evidence:
    - reference: DOI:10.1016/j.str.2018.02.016
      notes: Kojima et al. 2018 modeled the B-subunit peptidoglycan-binding rearrangement
        that activates the stator.
  - subject: ion_flux
    predicate: drives
    object: stator_complex
    description: Ion flow through the stator pore drives A-subunit rotation around
      the B-subunit dimer.
    evidence:
    - reference: DOI:10.1038/s41564-020-0788-8
      notes: Deme et al. 2020 modeled ion-driven rotation of the MotA pentamer around
        MotB.
  - subject: stator_complex
    predicate: applies torque to
    object: c_ring
    description: The rotating A-subunit ring pushes against FliG in the C ring to
      turn the flagellar rotor.
    evidence:
    - reference: DOI:10.1038/s41564-020-0788-8
      notes: Deme et al. 2020 modeled the stator as a rotating MotA pentamer meshing
        with FliG.
    - reference: DOI:10.7554/eLife.48979
      notes: Chang et al. 2019 imaged stator densities around bacterial flagellar
        rotors in cells.
discussions:
- discussion_id: use_modern_5_to_2_stoichiometry
  prompt: Should GO:0120101's historical A4B2 stator stoichiometry be copied into
    this record?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - physical_properties
  rationale: GO:0120101 is still the exact cellular-component identifier for the bacterial
    flagellar stator complex, but its text was minted before high-resolution MotAB
    structures revised the core from A4B2 to A5B2.
  resolution_note: 'Declined: keep GO:0120101 as the exact identifier but source the
    local stoichiometry to the 2020 cryo-EM structures.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
- discussion_id: exclude_rotor_ms_ring_fliL_and_scaffolds
  prompt: Should the C ring, MS ring, FliL, MotX/MotY, or other stator-associated
    scaffolds be curated as core stator components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#a_subunit
  - components#b_subunit
  rationale: The mature GO:0120101 stator complex is scoped to the ion-conducting
    A/B subunit core, including proton-driven MotA/MotB and sodium-driven PomA/PomB
    variants. The MS ring and C ring are rotor-side structures that the stator acts
    on, while FliL and lineage-specific MotX/MotY-family scaffolds decorate or recruit
    stators outside the conserved A/B core.
  resolution_note: 'Declined: keep only the A- and B-family stator subunits as constituents
    and represent the rotor and accessory scaffolds outside this record''s component
    list.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
