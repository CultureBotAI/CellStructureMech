identifier: GO:0120101
label: bacterial-type flagellum stator complex
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: An ion-driven membrane complex in the bacterial flagellar motor, typically
  with five A subunits surrounding two B subunits, that transduces proton or sodium
  flow into torque on the flagellar rotor and anchors to the cell wall through the
  B subunits.
definition_source: DOI:10.1016/j.cell.2020.08.016
mapping_status: PROPOSED
