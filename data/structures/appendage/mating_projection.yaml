discussions:
- discussion_id: localized_complexes_not_projection_components
  prompt: Keep polarisome and septin proteins on their own structure records rather
    than duplicating them as mating projection components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#mating_projection_polarity_topology
  rationale: GO:0005937 identifies the whole projection, while GO child terms identify
    localized membrane, tip, base, septin, and polarisome substructures. This projection-level
    record links those substructures with has_part and graph edges while leaving their
    molecular subunits on the polarisome and septin records.
  resolution_note: Curated projection-level topology and did not duplicate polarisome
    or septin proteins as direct mating-projection components.
  evidence:
  - reference: GO:0005937
    notes: GO:0005937 identifies the mating projection.
  - reference: GO:0031563
    notes: GO:0031563 identifies the mating projection tip polarisome.
  - reference: GO:0032175
    notes: GO:0032175 identifies the mating projection septin ring.
  - reference: GO:0032162
    notes: GO:0032162 identifies the mating projection septin band.
