  title: Mating-projection polarity topology
  description: The fungal mating projection has a surrounding membrane, a polarized-growth
    tip, a basal region, septin structures at the neck, and a tip-localized polarisome.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph records GO-backed projection regions and localized polarisome
    or septin substructures without asserting a complete pheromone-response pathway,
    septin transition order, or actin-polymerization mechanism.
