  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: UniProtKB:Q74FJ0 identifies the Geobacter sulfurreducens PCA OmcE
    protein, but its verified InterPro and Pfam mappings cover broad multiheme or
    paired-CXXCH signatures rather than an exact source-neutral family for OmcE cytochrome
    nanowire subunits.
  role: Tetraheme c-type cytochrome subunit that polymerizes into the extracellular
    OmcE nanowire and packs covalently bound hemes within the filament core.
  evidence:
  - reference: DOI:10.1038/s41564-022-01159-z
    notes: Wang et al. 2022 solved the cryo-EM structure of an extracellular Geobacter
      OmcE cytochrome filament and modeled OmcE tetraheme cytochrome subunits in the
      helical assembly.
  - reference: PDB:7TFS
    notes: RCSB PDB entry 7TFS is the helical cryo-EM model of OmcE nanowires from
      Geobacter sulfurreducens and aligns polymer entity 1 to UniProtKB:Q74FJ0.
