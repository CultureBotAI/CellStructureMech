functions:
- function_id: tetraheme_filament_electron_transfer
  label: tetraheme filament electron transfer
  description: OmcE subunits pack four covalently bound hemes per subunit within a
    helical cytochrome filament, providing a candidate structural path for electron
    transfer through the nanowire.
  evidence:
  - reference: DOI:10.1038/s41564-022-01159-z
    notes: Wang et al. 2022 reported the tetraheme packing in the extracellular OmcE
      cytochrome filament and interpreted the heme arrangement as the structural basis
      for nanowire electron transfer.
evidence:
- reference: DOI:10.1038/s41564-022-01159-z
  notes: Wang et al. 2022, Cryo-EM structure of an extracellular Geobacter OmcE cytochrome
    filament reveals tetrahaem packing, Nature Microbiology.
- reference: PDB:7TFS
  notes: RCSB PDB entry 7TFS is a 4.3 A helical cryo-EM model of OmcE nanowires from
    Geobacter sulfurreducens associated with EMDB map EMD-25879.
