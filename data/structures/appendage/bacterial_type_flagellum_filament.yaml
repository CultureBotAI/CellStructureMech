  edges:
  - subject: flagellin
    predicate: polymerizes into
    object: protofilament
    description: Flagellin molecules stack head-to-tail within longitudinal protofilaments.
    evidence:
    - reference: DOI:10.1038/s41598-019-51440-1
      notes: Yonekura et al. 2019 resolved repeating flagellin subunits in an 11-protofilament
