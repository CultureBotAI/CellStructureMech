causal_graphs:
- graph_id: flagellin_helical_propeller
  title: Flagellin protofilaments form a rotary propeller
  description: Flagellin subunits pack into protofilaments that form a long tubular
    helix. When the basal body transmits torque through the hook, rotation of that
    helical filament generates thrust for swimming motility.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
