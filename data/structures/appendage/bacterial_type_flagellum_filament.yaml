taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: External flagellin filaments are widespread among bacterial-type flagella
    but are absent from non-flagellated bacterial lineages and from periplasmic spirochete
    variants whose filaments sit inside the outer membrane.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaea swim with archaella, which are type-IV-pilus-related appendages rather
    than homologs of bacterial flagellin filaments.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Classical genetic model for bacterial flagellum assembly, including filament
    growth through the central channel.
  reference: DOI:10.1146/annurev.micro.57.030502.090832
- taxon_id: NCBITaxon:83334
  taxon_label: Escherichia coli O157:H7
  note: Source serotype for purified H7 flagellar filaments characterized by microscopy
    and immunoassay.
  reference: DOI:10.1128/jcm.26.7.1367-1372.1988
functions:
- function_id: helical_propeller_thrust
  label: helical propeller thrust
  description: Motor-driven rotation of the helical filament generates thrust for
    swimming motility.
  evidence:
  - reference: DOI:10.1146/annurev.biochem.72.121801.161737
    notes: Berg 2003 reviews how rotation of a helical bacterial flagellar filament
      propels swimming cells.
evidence:
- reference: DOI:10.1146/annurev.micro.57.030502.090832
