    - reference: DOI:10.1038/s41467-026-71203-7
      notes: Zhu et al. 2026 resolved Vibrio alginolyticus flagellin packing by cryo-EM.
  - subject: protofilament
    predicate: packs into
    object: filament
    description: Protofilaments assemble laterally into the tubular bacterial flagellar
      filament.
    evidence:
    - reference: DOI:10.1038/s41598-019-51440-1
      notes: Yonekura et al. 2019 describe the Kurthia flagellar filament as a tube
        built from 11 protofilaments.
  - subject: flagellin
    predicate: extends
    object: filament
    description: During assembly, exported flagellin molecules add below the distal
      cap to elongate the filament.
    evidence:
    - reference: DOI:10.1146/annurev.micro.57.030502.090832
      notes: Macnab 2003 reviews filament growth by flagellin export through the flagellar
        channel and assembly beneath FliD.
  - subject: flagellar_rotation
    predicate: turns
    object: filament
    description: Basal-body torque is transmitted through the hook to rotate the external
      filament.
    evidence:
    - reference: DOI:10.1146/annurev.biochem.72.121801.161737
      notes: Berg 2003 reviews the bacterial flagellar motor and helical filament
        as the rotary swimming organelle.
  - subject: filament
    predicate: generates
    object: thrust
    description: A rotating helical filament acts as a propeller that pushes against
      the surrounding fluid.
    evidence:
    - reference: DOI:10.1146/annurev.biochem.72.121801.161737
      notes: Berg 2003 reviews the hydrodynamic role of helical flagellar filaments
        in swimming.
  - subject: thrust
    predicate: enables
    object: motility
    description: Filament-generated thrust drives bacterial-type flagellum-dependent
      swimming motility.
    evidence:
    - reference: DOI:10.1146/annurev.biochem.72.121801.161737
      notes: Berg 2003 reviews swimming by rotating flagellar filaments.
discussions:
- discussion_id: exclude_hook_and_cap
  prompt: Should the hook, hook-filament junction, or FliD cap be curated as bacterial-type
    flagellum filament components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flagellin
  rationale: The filament record is scoped to the flagellin polymer. The hook, hook-filament
    junction proteins and FliD cap transmit torque or template polymerization, but
    they are distinct adjoining flagellar substructures rather than the long propeller
    filament itself.
  resolution_note: 'Declined: leave FlgE, FlgK/FlgL and FliD on the enclosing bacterial-type
    flagellum record or future substructure records.'
  posed_by: claude
  posed_date: '2026-09-07'
  resolved_date: '2026-09-07'
