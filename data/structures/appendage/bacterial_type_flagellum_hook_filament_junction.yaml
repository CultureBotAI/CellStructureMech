causal_graphs:
- graph_id: flgkl_hook_filament_junction
  title: FlgK and FlgL connect the hook to the filament
  description: FlgK assembles next to the hook and FlgL next to the filament to form
    a two-layer hook-filament junction. The junction joins the flexible hook to the
    rigid filament, supports FliD cap placement during filament initiation, and buffers
    hook-derived mechanical stress.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
