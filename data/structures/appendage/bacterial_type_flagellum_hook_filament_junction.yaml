  edges:
  - subject: flgk_hap1
    predicate: forms proximal layer of
    object: hook_filament_junction
    description: FlgK/HAP1 subunits form the hook-proximal layer of the junction.
    evidence:
    - reference: DOI:10.1128/jb.169.3.1168-1173.1987
      notes: Ikeda et al. 1987 localized HAP1 between the hook and HAP3.
  - subject: flgl_hap3
    predicate: forms distal layer of
    object: hook_filament_junction
    description: FlgL/HAP3 subunits form the filament-proximal layer of the junction.
    evidence:
    - reference: DOI:10.1128/jb.169.3.1168-1173.1987
      notes: Ikeda et al. 1987 localized HAP3 between HAP1 and the flagellin filament.
  - subject: flgk_hap1
    predicate: contacts
    object: hook
    description: The FlgK layer contacts the distal end of the FlgE hook.
    evidence:
    - reference: DOI:10.1038/s41564-025-02037-0
      notes: Einenkel et al. 2025 resolved FlgK next to FlgE in the native Salmonella
        junction.
  - subject: flgk_hap1
    predicate: contacts
    object: flgl_hap3
    description: FlgK and FlgL interact to build the paired junction at the hook-filament
      boundary.
    evidence:
    - reference: DOI:10.1016/S0022-2836(02)00139-0
      notes: Furukawa et al. 2002 detected FlgK binding to FlgL in solution.
  - subject: flgl_hap3
    predicate: contacts
    object: filament
    description: The FlgL layer contacts the first flagellin subunits of the filament.
    evidence:
    - reference: DOI:10.1038/s41564-025-02037-0
      notes: Einenkel et al. 2025 resolved FlgL against FliC in the native Salmonella
        junction.
  - subject: filament_cap
    predicate: assembles on
    object: hook_filament_junction
    description: The FliD cap sits above the junction during filament assembly.
    evidence:
    - reference: DOI:10.1038/s41564-025-02037-0
      notes: Einenkel et al. 2025 resolved a Campylobacter cap atop the hook-filament
        junction before filament assembly.
  - subject: flagellin
    predicate: polymerizes above
    object: hook_filament_junction
    description: Flagellin subunits incorporate above the hook-filament junction to
      grow the filament.
    evidence:
    - reference: DOI:10.1038/s41564-025-02037-0
      notes: Einenkel et al. 2025 resolved Salmonella flagellin incorporation intermediates
        above the FlgK/FlgL junction.
  - subject: hook_filament_junction
    predicate: buffers
    object: mechanical_stress
    description: The assembled FlgK/FlgL junction limits stress propagation from the
      hook into the filament lattice.
    evidence:
    - reference: DOI:10.1038/s41564-025-02037-0
      notes: Einenkel et al. 2025 linked FlgK elasticity to mechanical buffering at
        the hook-filament junction.
discussions:
- discussion_id: exclude_filament_cap
  prompt: Should FliD be curated as a hook-filament junction component?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flgk_hap1
  - components#flgl_hap3
  rationale: The mature GO:0009422 hook-filament junction is the FlgK/FlgL complex
