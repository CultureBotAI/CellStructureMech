taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: FlgK/FlgL hook-filament junctions occur in bacteria that assemble complete
    bacterial-type flagella and are absent from lineages that lack the rotary flagellar
    system.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related appendages and do not contain
    the FlgK/FlgL junction proteins of bacterial flagella.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:28901
  taxon_label: Salmonella enterica
  note: Source species for the native FlgK/FlgL hook-filament junction resolved with
    its surrounding hook, filament and FliD cap.
  reference: DOI:10.1038/s41564-025-02037-0
functions:
- function_id: hook_filament_coupling
  label: hook-filament coupling
  description: FlgK and FlgL form a short junction between the flexible hook and the
    rigid flagellin filament.
  evidence:
  - reference: DOI:10.1128/jb.162.1.183-189.1985
    notes: Homma and Iino 1985 localized HAP1 and HAP3 between the hook and filament
      in Salmonella.
  - reference: DOI:10.1038/s41564-025-02037-0
    notes: Einenkel et al. 2025 resolved the FlgK/FlgL junction connecting the native
      Salmonella hook to the filament.
- function_id: mechanical_stress_buffering
  label: mechanical stress buffering
  description: The FlgK/FlgL junction mechanically separates the curved hook from
    the filament and limits stress transfer into the filament lattice.
  evidence:
  - reference: DOI:10.1038/s41564-025-02037-0
    notes: Einenkel et al. 2025 structurally modeled the hook-filament junction as
      a buffer that prevents hook-derived stress from propagating into the filament.
- function_id: filament_assembly_initiation
  label: filament assembly initiation
  description: The junction provides the distal hook platform on which the FliD cap
    assembles to initiate ordered flagellin incorporation into the growing filament.
  evidence:
  - reference: DOI:10.1038/s41564-025-02037-0
    notes: Einenkel et al. 2025 resolved a Campylobacter hook-filament junction with
      the FliD cap before filament assembly and native Salmonella cap-filament intermediates.
