  changes: Added GO hook-filament junction synonymy and bacterial-flagellum parthood;
    curated FlgK/HAP1 and FlgL/HAP3 as constituent junction proteins; added bacterial
    and archaeal taxonomic scope, Salmonella LT2 as a canonical example, hook-filament
    coupling, mechanical-buffering and filament-initiation functions, 11:11 FlgK/FlgL
    stoichiometry, a FlgKL junction graph, and a resolved boundary discussion excluding
    the FliD filament cap.
  llm_assisted: true
