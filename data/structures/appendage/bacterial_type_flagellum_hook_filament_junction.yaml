identifier: GO:0009422
label: bacterial-type flagellum hook-filament junction
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: The FlgK/FlgL hook-associated protein junction at the distal end of the
  bacterial-type flagellar hook that couples the flexible hook to the flagellin filament
  and buffers mechanical stress while initiating filament assembly.
definition_source: DOI:10.1038/s41564-025-02037-0
mapping_status: PROPOSED
