components:
- component_id: flgk_hap1
  label: hook-associated protein FlgK/HAP1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: FlgK is the HAP1 protein of the bacterial flagellar hook-filament
    junction. No exact integrated family grounding was curated during record creation;
    the component stays label-only rather than reusing broad flagellar axial-protein
    signatures.
  gene_symbols:
  - flgK
  stoichiometry: 11 FlgK/HAP1 subunits per Salmonella junction
  essentiality: ESSENTIAL
  role: Forms the proximal hook-filament junction layer that adjoins the distal FlgE
    hook and contacts FlgL.
  evidence:
  - reference: DOI:10.1128/jb.169.3.1168-1173.1987
    notes: Ikeda et al. 1987 localized HAP1 to the Salmonella hook-proximal side of
      the hook-filament junction and estimated 11 HAP1 copies per flagellum.
  - reference: DOI:10.1038/s41564-025-02037-0
    notes: Einenkel et al. 2025 resolved FlgK in the native Salmonella hook-filament
      junction.
- component_id: flgl_hap3
  label: hook-associated protein FlgL/HAP3
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - flgL
  stoichiometry: 11 FlgL/HAP3 subunits per Salmonella junction
  essentiality: ESSENTIAL
  role: Forms the distal hook-filament junction layer that couples FlgK to the first
    flagellin subunits of the filament.
  evidence:
  - reference: DOI:10.1128/jb.169.3.1168-1173.1987
    notes: Ikeda et al. 1987 localized HAP3 to the Salmonella filament-proximal side
      of the hook-filament junction and estimated 11 HAP3 copies per flagellum.
  - reference: DOI:10.1016/S0022-2836(02)00139-0
    notes: Furukawa et al. 2002 detected direct interactions among monomeric FlgK,
      FlgL and flagellin, supporting the junction interface that couples the junction
      to the filament.
  grounding: InterPro:IPR013384
  protein_examples:
