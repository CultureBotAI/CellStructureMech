identifier: GO:0032179
label: germ tube
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: The slender tubular outgrowth first produced by most spores in germination.
  A polarized cylindrical outgrowth emerging from a germinating fungal spore or yeast
  cell during the transition to filamentous hyphal growth, notably in Candida albicans,
  Aspergillus fumigatus, and Neurospora crassa. Germ tube emergence and extension
  depend on Cdc42-mediated polarity establishment, Spitzenkörper/polarisome vesicle
  delivery, and a basal septin collar/cap.
