  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Germ-tube septin caps are formed by fungal septin GTPases, but
    no exact source-neutral InterPro, Pfam, or NCBIfam CURIE was assigned for the
    complete germ-tube cap cohort.
  role: Septin GTPases that form the faint cap at the leading edge of filamentous
    fungal germ tubes. Functions in germ tube emergence, polarized growth, and septin
    organization in germ tube.
  evidence:
