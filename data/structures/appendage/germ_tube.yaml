causal_graphs:
- graph_id: germ_tube_mechanism
  title: Fungal germ tube emergence and polarized apical extension
  description: Hypha-inducing cues activate Ras1/cAMP-PKA and Cdc42 polarity modules
    while assembling a septin collar and apical secretory machinery that drive emergence
    and elongation of the fungal germ tube.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph records GO-backed germ-tube-cap composition and apical localization
    without asserting an ordered recruitment mechanism for fungal septins or ergosterol-rich
    membrane domains.
