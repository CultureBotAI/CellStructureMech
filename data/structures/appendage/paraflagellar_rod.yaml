identifier: GO:0097740
label: paraflagellar rod
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A large lattice-like axial structure found in some flagellated protists
  which extends alongside the axoneme. Protein components of the paraflagellar rod
  are likely implicated, among other, in adenine nucleotide signaling and metabolism,
  and in calcium signaling.
definition_source: GO:0097740
