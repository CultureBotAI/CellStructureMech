    extra-axonemal paraflagellar rod.
  evidence:
  - reference: DOI:10.1083/jcb.109.4.1695
    notes: Schlaeppi et al. 1989 identified the tandem PFRA/PFRB gene product as a
      major helical protein of the Trypanosoma brucei paraflagellar rod.
  - reference: DOI:10.1242/jcs.112.16.2753
    notes: Maga et al. 1999 showed that Leishmania mexicana PFR1 is distributed through
      the PFR and is required for native PFR formation.
