components:
- component_id: pfr1
  label: paraflagellar rod protein PFR1
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - PFR1
  - PFRC
  - PFRD
  essentiality: ESSENTIAL
  role: Major lattice protein that co-assembles with PFR2 in the full paraflagellar
    rod of the studied trypanosome and Leishmania models; Leishmania PFR1 can associate
    with axoneme attachment fibers without PFR2.
  evidence:
  - reference: PMID:7961827
    notes: Deflorin et al. 1994 distinguished the T. brucei 73 kDa PFRC/PFRD product
      from 69 kDa PFRA/PFRB.
  - reference: DOI:10.1016/j.molbiopara.2004.03.006
    notes: Gadelha et al. 2004 consolidate T. brucei PFRC as PFR1, orthologous to
      Leishmania PFR1.
  - reference: DOI:10.1242/jcs.112.16.2753
    notes: Maga et al. 1999 found Leishmania mexicana PFR1 throughout the PFR and
      required for native formation; PFR1 can associate with attachment fibers without
      PFR2.
  protein_examples:
  - uniprot_id: UniProtKB:Q26789
    protein_label: 73 kDa paraflagellar rod protein
    gene_symbol: PFRC
    taxon_id: NCBITaxon:5702
    taxon_label: Trypanosoma brucei brucei
    entry_status: REVIEWED
    retrieved_on: '2026-09-08'
    role: Reviewed UniProtKB entry for the PFRC/PFRD-encoded 73 kDa protein in Trypanosoma
      brucei brucei, assigned to consolidated PFR1 by Gadelha et al. 2004. The source
      protein name and historical UniProt mnemonic PFR2_TRYBB are not a cross-species
      orthology assertion.
    evidence:
    - reference: https://www.uniprot.org/uniprotkb/Q26789
      notes: UniProtKB reviewed entry Q26789 verifies the source-native 73 kDa protein
        name and PFRC/PFRD genes. The consolidated family assignment follows Gadelha
        et al. 2004, not the ordinal UniProt mnemonic.
    - reference: DOI:10.1016/j.molbiopara.2004.03.006
      notes: Table 1 and Fig. 1 map T. brucei PFRC to PFR1 and PFRA to PFR2, consistently
        with Leishmania nomenclature.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro:IPR007824 / Pfam:PF05149 covers both PFR1 and PFR2 rather
    than the individual consolidated PFR1 family. No exact source-neutral PFR1-only
    CURIE was curated.
- component_id: pfr2
  label: paraflagellar rod protein PFR2
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - PFR2
  - PFRA
  - PFRB
  essentiality: CONDITIONAL
  role: Major lattice protein required for full native PFR architecture in the studied
    trypanosome and Leishmania models, not for every reduced PFR. Gadelha et al. found
    no evidence for PFR2 in the reduced Crithidia deanei rod using several assays,
    while noting their detection limitations.
  evidence:
  - reference: DOI:10.1083/jcb.109.4.1695
    notes: Schlaeppi et al. 1989 characterized the helical PFRA/PFRB product, subsequently
      assigned to consolidated PFR2.
  - reference: DOI:10.1016/j.molbiopara.2004.03.006
    notes: Gadelha et al. 2004 consolidate T. brucei PFRA as PFR2, orthologous to
      Leishmania PFR2.
  - reference: DOI:10.1242/jcs.112.16.2753
    notes: Maga et al. 1999 showed that Leishmania PFR2 is required for native full
      PFR assembly, while PFR1 can form stable associations with attachment fibers
      without it.
  - reference: DOI:10.1128/EC.4.3.516-525.2005
    notes: Gadelha et al. 2005 imaged a reduced PFR in Crithidia deanei and found
      no PFR2 with PCR, hybridization and protein assays. The combined negative results
      support a lineage distinction, not proof of universal gene absence.
  protein_examples:
  - uniprot_id: UniProtKB:P22225
