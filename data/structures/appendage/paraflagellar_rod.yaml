causal_graphs:
- graph_id: pfr1_pfr2_lattice_assembly
  title: PFR1 and PFR2 build the paraflagellar rod lattice
  description: PFR1 and PFR2 co-assemble into the full PFR lattice in the studied
    Trypanosoma and Leishmania models. In T. brucei, cytoplasmic PFR-AF1 and PFR-AF2
    act upstream of flagellar assembly and support major PFR protein accumulation.
    This model does not require the same composition in reduced rods such as that
    of Crithidia deanei.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  nodes:
  - node_id: pfr1
    label: paraflagellar rod protein PFR1
    node_type: GENE_OR_PROTEIN
    component_ref: pfr1
  - node_id: pfr2
    label: paraflagellar rod protein PFR2
    node_type: GENE_OR_PROTEIN
    component_ref: pfr2
  - node_id: paraflagellar_rod
    label: paraflagellar rod
    node_type: STRUCTURE
    grounding: GO:0097740
  - node_id: axoneme
    label: axoneme
    node_type: STRUCTURE
    grounding: GO:0005930
  - node_id: pfr_af1
    label: PFR assembly factor 1
    node_type: GENE_OR_PROTEIN
  - node_id: pfr_af2
    label: PFR assembly factor 2
    node_type: GENE_OR_PROTEIN
  edges:
  - subject: pfr1
    predicate: co-assembles into
    object: paraflagellar_rod
    description: Leishmania PFR1 is a major structural constituent throughout the
      native PFR and can associate with axoneme attachment fibers without PFR2.
    evidence:
    - reference: DOI:10.1242/jcs.112.16.2753
      notes: Maga et al. 1999 examined PFR1 localization and its requirement for native
        Leishmania PFR formation.
  - subject: pfr2
    predicate: co-assembles into
    object: paraflagellar_rod
    description: PFR2 partners with PFR1 in the full native PFR of the studied trypanosome
      and Leishmania models; this is not a universal requirement for reduced rods.
    evidence:
    - reference: DOI:10.1128/MCB.19.12.8191
      notes: Bastin et al. 1999 tracked tagged PFRA, now consolidated as PFR2, into
        new and old T. brucei PFRs.
    - reference: DOI:10.1016/j.molbiopara.2004.03.006
      notes: The nomenclature crosswalk maps historical T. brucei PFRA to PFR2.
    - reference: DOI:10.1242/jcs.112.16.2753
      notes: Maga et al. 1999 showed Leishmania PFR2 is required for the full native
        PFR, with residual PFR1-containing material possible without PFR2.
  - subject: paraflagellar_rod
    predicate: anchors to
    object: axoneme
    description: The PFR assembles next to the axoneme and is attached to it through
      axoneme attachment fibers.
    evidence:
    - reference: DOI:10.1242/jcs.112.16.2753
      notes: Maga et al. 1999 used Leishmania PFR mutants to show that fibers attaching
        the PFR to the axoneme can assemble in the absence of the bulk PFR.
  - subject: pfr_af1
    predicate: promotes assembly of
    object: paraflagellar_rod
    description: Cytoplasmic PFR-AF1 is required for PFR formation and normal levels
      of major PFR proteins.
    evidence:
    - reference: DOI:10.1242/jcs.242271
      notes: Alves et al. 2020 found that deleting PFR-AF1 dramatically disrupts PFR
        formation in T. brucei.
  - subject: pfr_af2
    predicate: promotes assembly of
    object: paraflagellar_rod
    description: Cytoplasmic PFR-AF2 is required for PFR formation and normal levels
      of major PFR proteins.
    evidence:
    - reference: DOI:10.1242/jcs.242271
      notes: Alves et al. 2020 found that deleting PFR-AF2 dramatically disrupts PFR
        formation in T. brucei.
discussions:
- discussion_id: minor_component_boundary
  prompt: Should all proteomic PFR candidates be curated as paraflagellar-rod components
    now?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#pfr1
  - components#pfr2
  rationale: The PFR proteome contains many low-abundance or regulatory proteins in
    addition to the two major lattice proteins; Portman et al. 2009 identified 20
    novel PFR components by RNAi-ablation proteomics and epitope tagging. This first
    GO:0097740 record therefore enumerates only PFR1/PFR2, while additional candidates
    need family-by-family curation to avoid folding transient or nearby flagellar
    proteins into the structural lattice boundary.
  posed_by: claude
  posed_date: '2026-09-09'
- discussion_id: cytoplasmic_assembly_factors
  prompt: Are PFR-AF1 and PFR-AF2 paraflagellar-rod components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - causal_graphs#pfr1_pfr2_lattice_assembly
  rationale: PFR-AF1 and PFR-AF2 are cytoplasmic proteins required for PFR formation,
    but the component boundary in docs/CURATION.md excludes factors that act on a
    subunit before assembly and then depart.
  resolution_note: Curated PFR-AF1 and PFR-AF2 as assembly graph nodes rather than
    as components of the mature paraflagellar rod.
  posed_by: claude
  posed_date: '2026-09-09'
  resolved_date: '2026-09-09'
- discussion_id: consolidated_pfr_nomenclature
  prompt: Reconcile historical PFRA/PFRC and UniProt names with cross-species PFR1/PFR2
    orthology.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#pfr1
  - components#pfr2
  rationale: Gadelha et al. 2004 Table 1 and Fig. 1 consolidate T. brucei PFRC/PFRD
    (Q26789, 73 kDa) as PFR1 and PFRA/PFRB (P22225, 69 kDa) as PFR2. Historical UniProt
    mnemonics use the opposite ordinal numbering and must not substitute for this
    cross-species family assignment.
  resolution_note: Aligned modern component families, gene symbols, protein examples
    and graph citations; retained source-native protein labels and all previous curation
    events.
  evidence:
  - reference: DOI:10.1016/j.molbiopara.2004.03.006
    notes: Primary nomenclature table and phylogeny establish the crosswalk.
  posed_by: codex
  posed_date: '2026-10-11'
  resolved_date: '2026-10-11'
