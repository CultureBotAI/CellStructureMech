    gene_symbol: PFRA
    taxon_id: NCBITaxon:5702
    taxon_label: Trypanosoma brucei brucei
    entry_status: REVIEWED
    retrieved_on: '2026-09-08'
    role: Reviewed UniProtKB entry for the PFRA/PFRB-encoded 69 kDa protein in Trypanosoma
      brucei brucei, assigned to consolidated PFR2 by Gadelha et al. 2004. The source
      protein name and historical UniProt mnemonic PFR1_TRYBB are not a cross-species
      orthology assertion.
    evidence:
    - reference: https://www.uniprot.org/uniprotkb/P22225
      notes: UniProtKB reviewed entry P22225 verifies the source-native 69 kDa protein
        name and PFRA/PFRB genes. The consolidated family assignment follows Gadelha
        et al. 2004, not the ordinal UniProt mnemonic.
    - reference: DOI:10.1016/j.molbiopara.2004.03.006
      notes: Table 1 and Fig. 1 map T. brucei PFRC to PFR1 and PFRA to PFR2, consistently
        with Leishmania nomenclature.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro:IPR007824 / Pfam:PF05149 covers both PFR1 and PFR2 rather
    than the individual consolidated PFR2 family. No exact source-neutral PFR2-only
    CURIE was curated.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: RARE
  note: The paraflagellar rod is restricted to a small set of flagellated protist
    lineages rather than a conserved feature of eukaryotic cilia.
  reference: PMID:7961827
- taxon_id: NCBITaxon:33682
  taxon_label: Euglenozoa
  presence: VARIABLE
  note: Within Euglenozoa, PFRs are prominent in kinetoplastid flagella, but they
    can be greatly reduced and cryptic in some endosymbiont-bearing kinetoplastids.
  reference: DOI:10.1128/EC.4.3.516-525.2005
canonical_examples:
- taxon_id: NCBITaxon:5702
  taxon_label: Trypanosoma brucei brucei
  note: Trypanosome model in which deletion of cytoplasmic PFR-AF1 or PFR-AF2 showed
    that both assembly factors are required for paraflagellar rod formation.
  reference: DOI:10.1242/jcs.242271
- taxon_id: NCBITaxon:5665
  taxon_label: Leishmania mexicana
  note: Genetic model in which PFR1 and PFR2 knockouts established that both major
    proteins are required for native PFR formation and flagellar motility.
  reference: DOI:10.1242/jcs.112.16.2753
functions:
- function_id: flagellar_waveform_control
  label: flagellar waveform control
  description: The PFR provides an extra-axonemal scaffold needed for normal kinetoplastid
    flagellar beating and cell motility.
  evidence:
  - reference: DOI:10.1038/35300
    notes: Bastin et al. 1998 disrupted the PFR in T. brucei and linked PFR loss to
      a trypanosome motility defect.
  - reference: PMID:9497035
    notes: Santrich et al. 1997 showed that a Leishmania mexicana PFR2 knockout lacks
      most PFR structure and has altered flagellar beat waveform and forward swimming.
- function_id: extra_axonemal_pfr_assembly
  label: extra-axonemal PFR assembly
  description: New PFR lattice proteins are delivered into the flagellum and incorporated
    into the elongating paraflagellar rod, a process that requires cytoplasmic PFR
    assembly factors.
  evidence:
  - reference: DOI:10.1128/MCB.19.12.8191
    notes: Bastin et al. 1999 followed tagged PFRA during PFR growth and observed
      a major distal addition site plus minor incorporation along the partially assembled
      PFR.
  - reference: DOI:10.1242/jcs.242271
    notes: Alves et al. 2020 identified cytoplasmic PFR-AF1 and PFR-AF2 as factors
      required for PFR formation.
- function_id: flagellar_signaling_platform
  label: flagellar signaling platform
  description: The PFR-associated protein cohort includes calcium/calmodulin and adenine-nucleotide
    signaling or metabolic proteins that can influence flagellar beating.
  evidence:
  - reference: DOI:10.1074/jbc.M808859200
    notes: Portman et al. 2009 used RNAi-mutant comparative proteomics to expand the
      PFR cohort and infer calcium/calmodulin regulatory links among some components.
  - reference: DOI:10.1016/j.ijpara.2009.10.005
    notes: Portman and Gull 2010 review links between the PFR proteome, adenine-nucleotide
      metabolism, calcium signaling and motility regulation.
evidence:
- reference: DOI:10.1083/jcb.109.4.1695
  notes: Schlaeppi, Deflorin and Seebeck 1989, The major component of the paraflagellar
