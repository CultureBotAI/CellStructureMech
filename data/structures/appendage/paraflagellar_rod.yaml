- reference: PMID:7961827
  notes: Deflorin, Rudolf and Seebeck 1994, The major components of the paraflagellar
    rod of Trypanosoma brucei are two similar, but distinct proteins which are encoded
    by two different gene loci, Journal of Biological Chemistry.
- reference: DOI:10.1242/jcs.112.16.2753
