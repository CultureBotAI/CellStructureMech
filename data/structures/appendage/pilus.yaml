functions:
- function_id: surface_interaction
  label: bacterial surface interaction
  description: Bacterial pili project from the cell surface and, depending on subtype,
    mediate adhesion, cell-cell interactions, biofilm formation, conjugation, DNA
    uptake or twitching motility.
  evidence:
  - reference: uniprot.location:SL-0113
    notes: UniProt Subcellular Location entry SL-0113 summarizes adhesion, motility,
      cell-cell interaction, biofilm, conjugation and DNA uptake roles for bacterial
      pili.
  - reference: DOI:10.1038/nrmicro.2017.40
    notes: Hospenthal, Costa and Waksman 2017 review the adhesive, motility and DNA-uptake
      roles of Gram-negative bacterial pili.
