components:
- component_id: flagellin
  label: flagellin (FliC)
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - fliC
  - fljB
  stoichiometry: ~20,000 subunits per filament; 11 protofilaments
  essentiality: ESSENTIAL
  role: Polymerises into the helical propeller filament.
  evidence:
  - reference: DOI:10.1146/annurev.micro.57.030502.090832
    notes: Macnab 2003 reviews filament assembly from FliC exported through the central
      channel and capped by FliD.
  - reference: DOI:10.3390/biom11020186
    snippet: Around 20,000 subunits of flagellin assemble to form the flagellar filament,
      which can grow up to a 20 µm in length [ 25 , 75 ].
    notes: 'Verbatim support for the ~20,000 subunits per filament in this component''s
      stoichiometry, which #7 asked to be checked against Macnab 2003. It is not in
      that review''s reachable text (#171); this open-access source states it.'
  - reference: DOI:10.1038/s41598-019-51440-1
    snippet: Flagellar filaments of almost all bacteria contain 11 protofilaments,
      with the exception of Campylobacter jejuni , which only has seven 5 , 6 .
    notes: 'Verbatim support for the 11 protofilaments in the same stoichiometry field,
      and it bounds the claim: Campylobacter jejuni has seven, so 11 is not universal.'
