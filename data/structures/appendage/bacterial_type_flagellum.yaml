  edges:
  - subject: pmf
    predicate: powers
    object: stator
    description: Proton (or sodium) flux through the MotA/MotB channel drives rotation
      of the MotA pentamer around MotB.
    evidence:
    - reference: DOI:10.1016/j.cell.2020.08.016
      notes: Santiveri et al. 2020 propose ion flow rotates MotA around the MotB dimer.
  - subject: stator
    predicate: applies torque to
    object: c_ring
    description: The rotating MotA ring engages FliG at the rim of the C ring.
    evidence:
    - reference: DOI:10.1038/s41564-020-0788-8
      notes: Deme et al. 2020 model the stator as a gear meshing with FliG.
  - subject: c_ring
    predicate: drives
    object: rotation
    evidence:
    - reference: DOI:10.1016/j.tim.2014.12.011
      notes: The C ring, MS ring and rod rotate as one rigid rotor.
  - subject: rotation
    predicate: propels
    object: filament
    evidence:
    - reference: DOI:10.1146/annurev.biochem.72.121801.161737
      notes: Rotation of the helical filament produces thrust.
  - subject: filament
    predicate: enables
    object: swimming
    predicate_id: RO:0002327
    evidence:
    - reference: DOI:10.1146/annurev.biochem.72.121801.161737
      notes: Berg 2003.
