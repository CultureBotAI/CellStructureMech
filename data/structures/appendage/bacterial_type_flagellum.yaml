physical_properties:
- property: DIAMETER
  value: ~20
  unit: UO:0000018
  context: filament
  reference: DOI:10.1146/annurev.micro.57.030502.090832
- property: LENGTH
  value: 5-20
  unit: UO:0000017
  context: filament
  reference: DOI:10.3390/biom11020186
  evidence:
  - reference: DOI:10.3390/biom11020186
    snippet: Around 20,000 subunits of flagellin assemble to form the flagellar filament,
      which can grow up to a 20 µm in length [ 25 , 75 ].
    notes: Verbatim from the open-access full text (PMC7911332). The source supports
      the upper bound of the recorded 5-20 um range; the lower bound is not stated
      here and remains unsourced. Replaces Macnab 2003, which is abstract-only and
      does not contain the figure (#171).
- property: ROTATION_SPEED
  value: ~100-300
  unit: UO:0000092
  context: Escherichia coli motor; ~125 Hz at high load with the filament attached,
    300 Hz or faster at low load
  reference: DOI:10.1128/jb.00353-25
  evidence:
  - reference: DOI:10.1128/jb.00353-25
    snippet: When attached to the flagellar filament (high load), E. coli motors spin
      at ~125 Hz; when the filament is absent (low load), motors rotate at 300 Hz
      or faster ( 27 , 28 ).
    notes: 'Verbatim from the open-access full text (PMC12713396). This corrects the
      record: the context previously attributed the whole 100-300 Hz range to light
      load, but the lower figure is the high-load value and only the upper is low-load.
      Replaces the Berg 2003 review, which is abstract-only and does not contain the
      numbers (#171).'
