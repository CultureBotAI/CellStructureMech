- component_id: stator
  label: stator unit (MotA5MotB2)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - motA
  - motB
  essentiality: DISPENSABLE
  role: 'Ion-driven torque generator anchored to peptidoglycan through MotB. A constituent
    of the motor, not machinery acting on it: DISPENSABLE here means the flagellum
    still assembles without MotA/MotB, but it cannot rotate (docs/CURATION.md, component
    boundary).'
  evidence:
  - reference: DOI:10.1016/j.cell.2020.08.016
    notes: Santiveri et al. 2020 resolve the 5:2 MotA:MotB stoichiometry and show
      the unit rotates.
  - reference: DOI:10.1038/s41564-020-0788-8
    notes: Deme et al. 2020 report the same 5:2 architecture independently.
  - reference: DOI:10.7554/eLife.48979
    notes: Chang et al. 2019 imaged ΔmotA and ΔmotB cells with assembled but paralysed
      flagella, showing that the stator is required for torque rather than for flagellar
      assembly.
