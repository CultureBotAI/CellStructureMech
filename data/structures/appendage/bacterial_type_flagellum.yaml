identifier: GO:0009288
label: bacterial-type flagellum
definition: 'The rotary motility organelle of bacteria: a long helical filament of
  flagellin joined by a flexible hook to a basal body that spans the cell envelope.
  The basal body houses a rotor (MS and C rings) driven by membrane-embedded stator
  units that convert ion flow (H+ or Na+) into torque; the flagellar type III export
  apparatus at its base secretes the axial subunits. Not homologous to the archaeal
  archaellum or the eukaryotic cilium.'
definition_source: DOI:10.1146/annurev.biochem.72.121801.161737
synonyms:
- synonym_text: bacterial flagellum
  synonym_type: EXACT_SYNONYM
  source: GO:0009288
structure_category: APPENDAGE
structure_kind: APPENDAGE
has_part:
- GO:0009420
