  edges:
  - subject: flgg
    predicate: builds
    object: distal_rod
    description: FlgG forms the distal rod segment adjacent to the rod-hook junction.
    evidence:
    - reference: DOI:10.1016/0022-2836(90)90365-S
      notes: Homma et al. 1990 localized FlgG to the distal Salmonella basal-body
        rod.
  - subject: proximal_rod
    predicate: adjoins
    object: distal_rod
    description: The proximal rod lies immediately cell-proximal to the FlgG distal
      rod.
    evidence:
    - reference: DOI:10.1016/0022-2836(90)90365-S
      notes: Homma et al. 1990 model the Salmonella rod as FlgB/FlgC/FlgF proximal
