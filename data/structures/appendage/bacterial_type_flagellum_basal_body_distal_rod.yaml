        basal body.
  - subject: p_ring
    predicate: encircles
    object: distal_rod
    description: The P ring forms the peptidoglycan-proximal portion of the bushing
      around the distal rod.
    evidence:
    - reference: DOI:10.1038/s41467-021-24715-3
      notes: Yamaguchi et al. 2021 structurally assigned the FlgI P ring within the
        Salmonella LP-ring assembly around the rod.
  - subject: l_ring
    predicate: encircles
    object: distal_rod
    description: The L ring forms the outer-membrane portion of the bushing around
      the distal rod.
    evidence:
    - reference: DOI:10.1038/s41467-021-24715-3
      notes: Yamaguchi et al. 2021 structurally assigned the FlgH L ring within the
        Salmonella LP-ring assembly around the rod.
discussions:
- discussion_id: exclude_lp_rings_hook_and_assembly_factors
  prompt: Should L/P rings, the hook, or rod assembly factors be curated as bacterial-type
    flagellum distal-rod components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flgg
  rationale: The mature GO:0009426 distal rod is scoped to the FlgG axial polymer
    even though the GO L- and P-ring terms sit under the distal rod. The L and P rings
    surround the distal rod as Gram-negative bushings, the hook continues the external
    axial structure, and export or capping proteins act during assembly rather than
    remaining mature distal-rod subunits.
  resolution_note: 'Declined: keep FlgG as the only mature distal-rod constituent
    and represent L/P rings, hooks, and export or capping proteins on their own records
    or on the enclosing basal-body record.'
  posed_by: claude
  posed_date: '2026-09-07'
  resolved_date: '2026-09-07'
