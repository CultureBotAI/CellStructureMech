identifier: GO:0009426
label: bacterial-type flagellum basal body, distal rod
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: The portion of the central rod of the bacterial-type flagellar basal body
  that is distal to the cell membrane; spans most of the distance between the inner
  and outer membranes.
definition_source: GO:0009426
mapping_status: PROPOSED
