components:
- component_id: flgg
  label: flagellar basal-body rod protein FlgG
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR012834
  gene_symbols:
  - flgG
  essentiality: ESSENTIAL
  role: Forms the FlgG distal rod polymer that extends the basal-body rod through
    the P- and L-ring bushing.
  evidence:
  - reference: DOI:10.1016/0022-2836(90)90365-S
    notes: Homma et al. 1990 assigned Salmonella FlgG to the distal rod segment adjacent
      to the rod-hook junction.
  - reference: DOI:10.1038/s41564-021-00895-y
    notes: Johnson et al. 2021 modeled the intact Salmonella basal-body rod with a
      FlgG distal rod polymer.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: Distal rods occur in bacterial-type flagellar basal bodies but are absent
    from bacteria without flagellar loci.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related appendages and do not contain
    the FlgG bacterial-type flagellar distal rod.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Cryo-EM model for FlgG distal-rod position inside the Gram-negative LP-ring
    bushing.
  reference: DOI:10.1038/s41564-021-00895-y
functions:
- function_id: periplasmic_distal_rod_axis
  label: periplasmic distal rod axis formation
  description: FlgG forms the distal segment of the central basal-body rod, extending
    the rotating axis toward the hook-side end of the cell envelope.
  evidence:
  - reference: DOI:10.1016/0022-2836(90)90365-S
    notes: Homma et al. 1990 placed FlgG as the distal Salmonella rod protein in the
      segmented basal-body rod.
  - reference: PMID:15136044
    notes: Saijo-Hamano et al. 2004 biochemically characterized Salmonella FlgG with
      the other exported basal-body rod proteins and FliE.
- function_id: lp_ring_bushing_axis
  label: LP-ring bushing axis
  description: In Gram-negative Salmonella, the distal rod is the rotating FlgG axis
    surrounded by the P and L rings.
  evidence:
  - reference: DOI:10.1038/s41564-021-00895-y
    notes: Johnson et al. 2021 resolved the FlgG distal rod in the intact Salmonella
      flagellar basal body.
  - reference: DOI:10.1038/s41467-021-24715-3
    notes: Yamaguchi et al. 2021 resolved the Salmonella LP-ring bushing that surrounds
      the distal rod.
evidence:
- reference: DOI:10.1128/JB.181.23.7149-7153.1999
  notes: 'Macnab RM 1999, The bacterial flagellum: reversible rotary propellor and
    type III export apparatus.'
