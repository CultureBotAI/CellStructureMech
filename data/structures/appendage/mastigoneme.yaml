components:
- component_id: mst1_hrgp
  label: MST1 hydroxyproline-rich mastigoneme glycoprotein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - MST1
  role: Major extracellular glycoprotein forming the Chlamydomonas mastigoneme filament.
  evidence:
  - reference: DOI:10.1016/j.cell.2024.03.005
    notes: Dai et al. 2024 resolved the Chlamydomonas mastigoneme structure as an
      MST1 hydroxyproline-rich glycoprotein filament wrapped around MST3.
  - reference: DOI:10.1083/jcb.202001122
    notes: Liu et al. 2020 studied mastigonemes as hair-like glycoprotein polymers
      on Chlamydomonas cilia.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam or NCBIfam accession was
    curated for the complete MST1 mastigoneme glycoprotein family.
- component_id: mst3_hrgp
  label: MST3 hydroxyproline-rich mastigoneme glycoprotein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - MST3
  role: Hydroxyproline-rich glycoprotein that co-assembles with MST1 in the Chlamydomonas
    mastigoneme.
  evidence:
  - reference: DOI:10.1016/j.cell.2024.03.005
    notes: Dai et al. 2024 resolved mastigonemes as MST1 filaments wrapped around
      a single copy of MST3.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral InterPro, Pfam or NCBIfam accession was
    curated for the complete MST3 mastigoneme glycoprotein family.
- component_id: pkd2_anchor
  label: PKD2 mastigoneme organizer
  component_type: PROTEIN
  component_role: ASSOCIATED_MACHINERY
  gene_symbols:
  - PKD2
  role: Ciliary membrane protein that organizes Chlamydomonas mastigonemes on the
    ciliary surface.
  evidence:
  - reference: DOI:10.1083/jcb.202001122
    notes: Liu et al. 2020 showed that Chlamydomonas PKD2 organizes mastigonemes on
      cilia.
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PKD2 is a TRP-channel protein family, but this pass did not curate
    an exact accession for the Chlamydomonas ciliary mastigoneme-organizing paralogue.
