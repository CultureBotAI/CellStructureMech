identifier: GO:0120102
label: bacterial-type flagellum secretion apparatus
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A flagellum-specific type III export apparatus at the bacterial basal
  body, comprising a membrane-associated FlhA/FlhB/FliP/FliQ/FliR export gate and
  a cytoplasmic FliH/FliI/FliJ ATPase complex that support export of rod, hook, and
  filament subunits through the growing flagellum.
definition_source: DOI:10.1016/j.bbamcr.2013.09.005
mapping_status: PROPOSED
