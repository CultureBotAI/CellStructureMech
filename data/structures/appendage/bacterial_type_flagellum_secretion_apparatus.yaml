discussions:
- discussion_id: exclude_fli_o_from_conserved_core
  prompt: Should FliO be curated as a conserved constituent of the mature FlhA/FlhB/FliP/FliQ/FliR
    export-gate core?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - functions#membrane_gate_assembly
  - causal_graphs#flagellar_export_gate_assembly_and_function
  rationale: GO:0120102's legacy definition lists FliO with the secretion apparatus
    membrane proteins, and FliO promotes FliP assembly in the Salmonella system. However,
    the biochemically reconstituted Salmonella core contains FliP5-FliQ4-FliR1-FlhB1,
    the final gate is modeled with a FlhA nonamer, and FliO is not part of that conserved
    final membrane-gate stoichiometry.
  resolution_note: Keep FliO out of the conserved component list and mechanism graph
    while documenting its Salmonella-specific FliP assembly role as a boundary decision.
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
- discussion_id: flii_grounding_scope
  prompt: Should the broad InterPro FliI/YscN family ground the FliI component?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flii
  rationale: InterPro currently offers a mixed FliI/YscN type III secretion ATPase
    family and three clade-specific flagellar FliI entries. The broad entry overstates
    this flagellum-specific component, while any one clade-specific entry understates
    its bacterial scope.
  resolution_note: Keep FliI REVIEWED_LABEL_ONLY until an exact all-flagellar FliI
    family can be asserted.
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
