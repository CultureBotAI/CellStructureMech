- graph_id: flagellar_export_gate_assembly_and_function
  title: Membrane gate assembly drives flagellar substrate export
  description: FliP and FliR form a helical core with peripheral FliQ subunits and
    FlhB around its base. FlhA connects this gate to the cytoplasmic FliH/FliI/FliJ
    ATPase machinery. Efficient intact-system export is proton-motive-force driven
    in the cited Salmonella experiments; sodium coupling was demonstrated with ATPase-system
    defects.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
