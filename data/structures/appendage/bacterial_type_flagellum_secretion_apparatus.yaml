    FlhB, FliP, FliQ, FliR, FliH, FliI, FliJ and FliO with exact InterPro groundings
    where possible; added bacterial and archaeal taxonomic scope, a Salmonella canonical
    example, export, membrane-gate assembly and energy-coupling functions, primary
    literature evidence, an export-gate assembly and function graph, and boundary
    discussions for FliO and FliI.
  llm_assisted: true
