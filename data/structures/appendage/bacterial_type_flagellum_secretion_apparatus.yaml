  edges:
  - subject: flip
    predicate: assembles with
    object: fliq
    description: FliQ subunits associate peripherally with FliP in the helical Salmonella
      FliP5-FliQ4-FliR1 export-gate core; the static structure does not by itself
      establish assembly order.
    evidence:
    - reference: DOI:10.1038/s41594-018-0086-9
      notes: 'Kuhlen et al. 2018 reconstructed Salmonella Typhimurium FliP5-FliQ4-FliR1
        by cryo-EM: FliP and FliR form a helical core with peripheral FliQ subunits.
        The structure does not by itself measure assembly order.'
  - subject: flir
    predicate: coassembles with
    object: flip
    description: One FliR subunit is integrated with five FliP subunits in the helical
      Salmonella export-gate core, rather than being added as an external cap.
    evidence:
    - reference: DOI:10.1038/s41594-018-0086-9
      notes: 'Kuhlen et al. 2018 reconstructed Salmonella Typhimurium FliP5-FliQ4-FliR1
        by cryo-EM: FliP and FliR form a helical core with peripheral FliQ subunits.
        The structure does not by itself measure assembly order.'
  - subject: flhb
    predicate: contacts
    object: flir
    description: A single FlhB contacts the FliP/FliQ/FliR core and wraps around its
      base in the solved Vibrio mimicus complex.
    evidence:
    - reference: DOI:10.1038/s41467-020-15071-9
      notes: Kuhlen et al. 2020 resolved Vibrio mimicus FliP5-FliQ4-FliR1-FlhB1. FlhB
        contacts the helical core and wraps around its base; this is distinct from
        the earlier Salmonella FliPQR structure.
  - subject: flha
    predicate: completes
    object: secretion_apparatus
    description: Nine FlhA copies form the cytoplasmic ring that couples substrate
      delivery to the membrane export gate.
    evidence:
    - reference: DOI:10.1111/mmi.12529
      notes: Morimoto et al. 2014 measured nine FlhA subunits in the Salmonella flagellar
        basal body.
  - subject: flih
    predicate: forms carriers with
    object: flii
    description: FliH binds FliI as a FliH2-FliI heterotrimer that contributes to
      the peripheral flagellar ATPase assembly.
    evidence:
    - reference: DOI:10.1073/pnas.1524025113
      notes: Imada et al. 2016 resolved a FliH C-terminal dimer bound to FliI, supporting
        the FliH2-FliI carrier architecture; the complete ATPase assembly was modeled.
  - subject: flii
    predicate: oligomerizes around
    object: flij
    description: In the structural model, six FliI subunits surround one FliJ central
      stalk within the FliH12-FliI6-FliJ1 ATPase assembly.
    evidence:
    - reference: DOI:10.1073/pnas.1524025113
      notes: Imada et al. 2016 modeled the FliI6-FliJ1 ring and central stalk inside
        the FliH12-FliI6-FliJ1 ATPase complex.
  - subject: flij
    predicate: couples to
    object: flha
    description: FliJ interacts with FlhA on the cytoplasmic side of the apparatus
      to connect ATPase activity with export-gate activation.
    evidence:
    - reference: DOI:10.1128/JB.182.15.4207-4215.2000
      notes: Minamino et al. 2000 found that FliJ is a general export component that
        interacts with FliH, FliI and FlhA.
  - subject: atpase
    predicate: docks on
    object: flha
    description: The FliH/FliI/FliJ ATPase complex docks at FlhA to support efficient
      export.
    evidence:
    - reference: DOI:10.1073/pnas.1524025113
      notes: Imada et al. 2016 structurally modeled the flagellar ATPase complex next
        to the FlhA nonamer.
  - subject: ion_motive_force
    predicate: energizes
    object: secretion_apparatus
    description: Proton motive force drives the intact ATPase-assisted Salmonella
      export apparatus. Sodium-dependent export was demonstrated when the ATPase system
      was compromised, not with the intact FliH/FliI/FliJ system under those conditions.
    evidence:
    - reference: DOI:10.1371/journal.ppat.1005495
      notes: Minamino et al. 2016 found sodium-dependent export in ATPase-compromised
        Salmonella, including FliH/FliI or FliJ defects; the intact FliH/FliI/FliJ
        system showed no sodium dependence under the tested conditions and supported
        efficient proton-motive-force-driven export.
  - subject: secretion_apparatus
    predicate: exports
    object: axial_substrates
    description: The flagellar type III secretion apparatus transports rod, hook and
      filament proteins for ordered assembly outside the cytoplasm.
    evidence:
    - reference: DOI:10.1016/j.bbamcr.2013.09.005
      notes: Minamino 2014 reviewed export of flagellar substrates through the flagellar
        type III export apparatus.
  - subject: ms_ring
    predicate: houses
    object: secretion_apparatus
    description: The MS ring houses the membrane-associated export gate, whose helical
      core is positioned within the basal body; the broader apparatus includes cytoplasmic
      FlhA and ATPase regions.
    evidence:
    - reference: DOI:10.1007/82_2019_170
      notes: Minamino et al. 2019 reviewed the export apparatus in the context of
        the flagellar basal body.
    - reference: DOI:10.1038/s41594-018-0086-9
      notes: 'Kuhlen et al. 2018 reconstructed Salmonella Typhimurium FliP5-FliQ4-FliR1
        by cryo-EM: FliP and FliR form a helical core with peripheral FliQ subunits.
        The structure does not by itself measure assembly order.'
discussions:
- discussion_id: exclude_fli_o_from_conserved_core
  prompt: Should FliO be curated as a conserved constituent of the mature FlhA/FlhB/FliP/FliQ/FliR
    export-gate core?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - functions#membrane_gate_assembly
  - causal_graphs#flagellar_export_gate_assembly_and_function
  rationale: GO:0120102 includes FliO in its legacy inventory. Fukumura et al. 2017
    studied FliO-assisted isolated FliP hexamers and detergent-dependent associations,
    not a FliP5-FliQ4-FliR1-FlhB1 reconstruction. Later structures resolved Salmonella
    FliP5-FliQ4-FliR1 (Kuhlen 2018) and Vibrio mimicus FliP5-FliQ4-FliR1-FlhB1 (Kuhlen
    2020), supporting exclusion of transient assembly factor FliO from the conserved
    mature core.
  resolution_note: Keep FliO out of the conserved component list and mechanism graph
    while documenting its Salmonella-specific FliP assembly role as a boundary decision.
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
- discussion_id: flii_grounding_scope
  prompt: Should the broad InterPro FliI/YscN family ground the FliI component?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flii
  rationale: InterPro currently offers a mixed FliI/YscN type III secretion ATPase
    family and three clade-specific flagellar FliI entries. The broad entry overstates
    this flagellum-specific component, while any one clade-specific entry understates
    its bacterial scope.
  resolution_note: Keep FliI REVIEWED_LABEL_ONLY until an exact all-flagellar FliI
    family can be asserted.
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
