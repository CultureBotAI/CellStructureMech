taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Flagellum-specific type III export apparatuses occur in bacteria that assemble
    bacterial-type flagella and are absent from bacteria that lack the flagellar system.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related rotary filaments rather than
    bacterial flagella and do not use a FlhA/FlhB/FliP/FliQ/FliR export gate.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Classical genetic and biochemical model for flagellar type III export and
    source organism for the reconstituted FliP5-FliQ4-FliR1-FlhB1 export-gate core.
  reference: DOI:10.1371/journal.pbio.2002281
functions:
- function_id: axial_subunit_export
  label: flagellar axial-subunit export
  description: The apparatus secretes unfolded rod, hook and filament substrates from
    the cytoplasm through the narrow central channel of the growing bacterial flagellum.
  evidence:
  - reference: DOI:10.1128/JB.181.5.1388-1394.1999
    notes: Minamino and Macnab 1999 classified Salmonella flagellar export substrates
      for the apparatus.
  - reference: DOI:10.1016/j.bbamcr.2013.09.005
    notes: Minamino 2014 reviewed export of flagellar axial proteins through the bacterial
      flagellar type III pathway.
- function_id: membrane_gate_assembly
  label: membrane export-gate assembly
  description: FliP assembly seeds the FliP/FliQ/FliR membrane core, which combines
    with FlhA and FlhB to form the flagellar export gate.
  evidence:
  - reference: DOI:10.1371/journal.pbio.2002281
    notes: Fukumura et al. 2017 determined the FliP5-FliQ4-FliR1-FlhB1 core stoichiometry.
  - reference: DOI:10.1007/82_2019_170
    notes: Minamino et al. 2019 reviewed the ordered assembly pathway of the flagellar
      type III export apparatus.
- function_id: energy_coupled_export
  label: ATPase- and ion-coupled export
  description: A soluble FliH/FliI/FliJ ATPase complex and proton or sodium motive
    force activate the export gate and drive efficient processive export.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1005495
    notes: Minamino et al. 2016 showed that the flagellar export gate can use proton
      and sodium gradients.
  - reference: DOI:10.1038/s42003-024-06081-0
    notes: Kinoshita et al. 2024 found that FliH and FliI help FlhA enforce ordered
      protein export.
