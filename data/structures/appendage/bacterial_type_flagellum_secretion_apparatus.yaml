taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Flagellum-specific type III export apparatuses occur in bacteria that assemble
    bacterial-type flagella and are absent from bacteria that lack the flagellar system.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related rotary filaments rather than
    bacterial flagella and do not use a FlhA/FlhB/FliP/FliQ/FliR export gate.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Source organism for the cryo-EM reconstruction of the FliP5-FliQ4-FliR1 export-gate
    core. The FlhB-containing complex cited elsewhere was reconstructed from Vibrio
    mimicus.
  reference: DOI:10.1038/s41594-018-0086-9
functions:
- function_id: axial_subunit_export
  label: flagellar axial-subunit export
  description: The apparatus secretes unfolded rod, hook and filament substrates from
    the cytoplasm through the narrow central channel of the growing bacterial flagellum.
  evidence:
  - reference: DOI:10.1128/JB.181.5.1388-1394.1999
    notes: Minamino and Macnab 1999 classified Salmonella flagellar export substrates
      for the apparatus.
  - reference: DOI:10.1016/j.bbamcr.2013.09.005
    notes: Minamino 2014 reviewed export of flagellar axial proteins through the bacterial
      flagellar type III pathway.
- function_id: membrane_gate_assembly
  label: membrane export-gate assembly
  description: FliP and FliR form a helical export-gate core with peripheral FliQ
    subunits. FlhB associates around the core base, and FlhA connects the gate with
    cytoplasmic substrate-delivery machinery.
  evidence:
  - reference: DOI:10.1038/s41594-018-0086-9
    notes: 'Kuhlen et al. 2018 reconstructed Salmonella Typhimurium FliP5-FliQ4-FliR1
      by cryo-EM: FliP and FliR form a helical core with peripheral FliQ subunits.
      The structure does not by itself measure assembly order.'
  - reference: DOI:10.1038/s41467-020-15071-9
    notes: Kuhlen et al. 2020 resolved Vibrio mimicus FliP5-FliQ4-FliR1-FlhB1. FlhB
      contacts the helical core and wraps around its base; this is distinct from the
      earlier Salmonella FliPQR structure.
  - reference: DOI:10.1007/82_2019_170
    notes: Minamino et al. 2019 reviewed the ordered assembly pathway of the flagellar
      type III export apparatus.
- function_id: energy_coupled_export
  label: ATPase- and ion-coupled export
  description: The FliH/FliI/FliJ ATPase complex promotes efficient proton-motive-force-driven
    export. In the cited Salmonella experiments, gates with a compromised ATPase system
    could additionally use sodium motive force, while the intact ATPase-assisted system
    showed no sodium dependence under the tested conditions.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1005495
    notes: Minamino et al. 2016 found sodium-dependent export in ATPase-compromised
      Salmonella, including FliH/FliI or FliJ defects; the intact FliH/FliI/FliJ system
      showed no sodium dependence under the tested conditions and supported efficient
      proton-motive-force-driven export.
  - reference: DOI:10.1038/s42003-024-06081-0
    notes: Kinoshita et al. 2024 found that FliH and FliI help FlhA enforce ordered
      protein export.
