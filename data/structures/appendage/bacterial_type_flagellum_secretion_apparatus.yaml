components:
- component_id: flha
  label: Flagellar biosynthesis protein FlhA
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR006301
  gene_symbols:
  - flhA
  stoichiometry: 9 FlhA subunits in the Salmonella export apparatus
  essentiality: ESSENTIAL
  role: Forms the nonameric cytoplasmic ring of the export gate and coordinates late-substrate
    delivery, proton or sodium coupling, and ordered export.
  evidence:
  - reference: DOI:10.1111/mmi.12529
    notes: Morimoto et al. 2014 measured nine FlhA molecules per Salmonella flagellar
      basal body.
  - reference: DOI:10.1038/s42003-024-06081-0
    notes: Kinoshita et al. 2024 linked the FlhA cytoplasmic ring to ordered flagellar
      substrate recognition.
- component_id: flhb
  label: Flagellar biosynthetic protein FlhB
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR006136
  gene_symbols:
  - flhB
  stoichiometry: 1 FlhB subunit in the FliP5-FliQ4-FliR1-FlhB1 core
  essentiality: ESSENTIAL
  role: Caps the FliP/FliQ/FliR export-gate core and participates in substrate specificity
    switching with FlhA.
  evidence:
  - reference: DOI:10.1371/journal.pbio.2002281
    notes: Fukumura et al. 2017 reconstituted FliP5-FliQ4-FliR1 with a single FlhB
      subunit.
- component_id: flip
  label: Flagellar transport protein FliP
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR005837
  gene_symbols:
  - fliP
  stoichiometry: 5 FliP subunits in the Salmonella export-gate core
  essentiality: ESSENTIAL
  role: Builds the FliP pentamer at the base of the membrane export gate.
  evidence:
  - reference: DOI:10.1371/journal.pbio.2002281
    notes: Fukumura et al. 2017 established FliP5 as part of the Salmonella flagellar
      export-gate core stoichiometry.
- component_id: fliq
  label: Flagellar biosynthesis protein FliQ
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR006305
  gene_symbols:
  - fliQ
  stoichiometry: 4 FliQ subunits in the Salmonella export-gate core
  essentiality: ESSENTIAL
  role: Completes the small hydrophobic-protein ring of the membrane export gate.
  evidence:
  - reference: DOI:10.1371/journal.pbio.2002281
    notes: Fukumura et al. 2017 established FliQ4 as part of the Salmonella flagellar
      export-gate core stoichiometry.
- component_id: flir
  label: Flagellar biosynthesis protein FliR
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR006303
  gene_symbols:
  - fliR
  stoichiometry: 1 FliR subunit in the Salmonella export-gate core
  essentiality: ESSENTIAL
  role: Sits in the export-gate core next to FlhB and helps close the FliP/FliQ/FliR
    channel.
  evidence:
  - reference: DOI:10.1371/journal.pbio.2002281
    notes: Fukumura et al. 2017 established FliR1 as part of the Salmonella flagellar
      export-gate core stoichiometry.
- component_id: flih
  label: Flagellar assembly protein FliH
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR000563
  gene_symbols:
  - fliH
  stoichiometry: 12 FliH subunits per FliI6-FliJ1 ATPase complex
  essentiality: DISPENSABLE
  role: Tethers the FliI ATPase to the export gate and improves energy coupling and
    substrate ordering.
  evidence:
  - reference: DOI:10.1073/pnas.1524025113
    notes: Imada et al. 2016 resolved the FliH2-FliI heterotrimer and FliH12-FliI6-FliJ1
      ATPase architecture.
  - reference: DOI:10.1038/s42003-024-06081-0
    notes: Kinoshita et al. 2024 showed that FliH and FliI help FlhA enforce ordered
      flagellar protein export.
- component_id: flii
  label: flagellar type III export ATPase FliI
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: InterPro has a broad FliI/YscN family and several clade-specific
    flagellar FliI families, but no exact integrated family covering all flagellar
    FliI ATPases without the injectisome YscN/SctN homologs.
  gene_symbols:
  - fliI
  stoichiometry: 6 FliI subunits per FliH12-FliI6-FliJ1 ATPase complex
  essentiality: DISPENSABLE
  role: Forms the hexameric ATPase ring that binds export substrates and works with
    the ion-driven gate to drive flagellar protein export.
  evidence:
  - reference: DOI:10.1073/pnas.1524025113
    notes: Imada et al. 2016 resolved the FliI6 ring around FliJ in the ATPase complex.
  - reference: DOI:10.1371/journal.ppat.1005495
    notes: Minamino et al. 2016 tested how the export gate and ATPase use ion gradients
      for export.
- component_id: flij
  label: Flagellar export FliJ
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR012823
  gene_symbols:
  - fliJ
  stoichiometry: 1 FliJ subunit per FliH12-FliI6-FliJ1 ATPase complex
  essentiality: DISPENSABLE
  role: Acts as the central stalk of the flagellar ATPase complex and couples FliI
    ATP hydrolysis to the export gate.
  evidence:
  - reference: DOI:10.1073/pnas.1524025113
    notes: Imada et al. 2016 placed FliJ at the center of the FliI ATPase ring.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Flagellum-specific type III export apparatuses occur in bacteria that assemble
    bacterial-type flagella and are absent from bacteria that lack the flagellar system.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related rotary filaments rather than
    bacterial flagella and do not use a FlhA/FlhB/FliP/FliQ/FliR export gate.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Classical genetic and biochemical model for flagellar type III export and
    source organism for the reconstituted FliP5-FliQ4-FliR1-FlhB1 export-gate core.
  reference: DOI:10.1371/journal.pbio.2002281
functions:
- function_id: axial_subunit_export
  label: flagellar axial-subunit export
  description: The apparatus secretes unfolded rod, hook and filament substrates from
    the cytoplasm through the narrow central channel of the growing bacterial flagellum.
  evidence:
  - reference: DOI:10.1128/JB.181.5.1388-1394.1999
    notes: Minamino and Macnab 1999 classified Salmonella flagellar export substrates
      for the apparatus.
  - reference: DOI:10.1016/j.bbamcr.2013.09.005
    notes: Minamino 2014 reviewed export of flagellar axial proteins through the bacterial
      flagellar type III pathway.
- function_id: membrane_gate_assembly
  label: membrane export-gate assembly
  description: FliP assembly seeds the FliP/FliQ/FliR membrane core, which combines
    with FlhA and FlhB to form the flagellar export gate.
  evidence:
  - reference: DOI:10.1371/journal.pbio.2002281
    notes: Fukumura et al. 2017 determined the FliP5-FliQ4-FliR1-FlhB1 core stoichiometry.
  - reference: DOI:10.1007/82_2019_170
    notes: Minamino et al. 2019 reviewed the ordered assembly pathway of the flagellar
      type III export apparatus.
- function_id: energy_coupled_export
  label: ATPase- and ion-coupled export
  description: A soluble FliH/FliI/FliJ ATPase complex and proton or sodium motive
    force activate the export gate and drive efficient processive export.
  evidence:
  - reference: DOI:10.1371/journal.ppat.1005495
    notes: Minamino et al. 2016 showed that the flagellar export gate can use proton
      and sodium gradients.
  - reference: DOI:10.1038/s42003-024-06081-0
    notes: Kinoshita et al. 2024 found that FliH and FliI help FlhA enforce ordered
      protein export.
