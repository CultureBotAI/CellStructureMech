identifier: GO:0120102
label: bacterial-type flagellum secretion apparatus
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A flagellum-specific type III export apparatus at the cytoplasmic side
  of the bacterial MS ring that uses a FlhA/FlhB/FliP/FliQ/FliR membrane export gate
  and a FliH/FliI/FliJ cytoplasmic ATPase complex to export rod, hook, and filament
  subunits through the growing flagellum.
definition_source: DOI:10.1016/j.bbamcr.2013.09.005
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-08T04:46:20Z'
