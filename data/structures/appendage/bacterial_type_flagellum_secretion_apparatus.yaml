components:
- component_id: flha
  label: Flagellar biosynthesis protein FlhA
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR006301
  gene_symbols:
  - flhA
  stoichiometry: 9 FlhA subunits in the Salmonella export apparatus
  essentiality: ESSENTIAL
  role: Forms the nonameric cytoplasmic ring of the export gate and coordinates late-substrate
    delivery and ordered export. In the cited Salmonella experiments, the intact ATPase-assisted
    apparatus uses proton motive force, whereas ATPase-compromised gates can also
    use sodium motive force.
  evidence:
  - reference: DOI:10.1111/mmi.12529
    notes: Morimoto et al. 2014 measured nine FlhA molecules per Salmonella flagellar
      basal body.
  - reference: DOI:10.1038/s42003-024-06081-0
    notes: Kinoshita et al. 2024 linked the FlhA cytoplasmic ring to ordered flagellar
      substrate recognition.
  - reference: DOI:10.1371/journal.ppat.1005495
    notes: Minamino et al. 2016 found sodium-dependent export in ATPase-compromised
      Salmonella, including FliH/FliI or FliJ defects; the intact FliH/FliI/FliJ system
      showed no sodium dependence under the tested conditions and supported efficient
      proton-motive-force-driven export.
