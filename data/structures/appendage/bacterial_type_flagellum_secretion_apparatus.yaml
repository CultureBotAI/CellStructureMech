causal_graphs:
- graph_id: flagellar_export_gate_assembly_and_function
  title: Membrane gate assembly drives flagellar substrate export
  description: FliP, FliQ and FliR form the small hydrophobic membrane core, FlhB
    caps that core, FlhA completes the membrane gate, the FliH/FliI/FliJ ATPase complex
    couples to FlhA, and ATP plus ion motive force drive rod, hook and filament subunits
    through the MS-ring-embedded export apparatus.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
