components:
- component_id: arli_arlj_motor
  label: ArlI/ArlJ motor core
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlI
  - arlJ
  - flaI
  - flaJ
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The ATPase and membrane-platform pair spans distinct protein families
    and the historical Arl/Fla naming systems; no exact source-neutral CURIE for the
    core subcomplex was verified.
  role: Cytosolic ATPase and polytopic membrane-platform core that couple ATP hydrolysis
    to archaellum assembly and filament rotation.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review FlaI/ArlI as the ATPase and FlaJ/ArlJ as
      the conserved polytopic membrane protein of archaellum operons.
  - reference: DOI:10.7554/eLife.27470
    notes: Daum et al. 2017 resolved the in situ Pyrococcus furiosus archaellum machinery
      and placed the motor complex at the cell envelope.
- component_id: arlh_regulator
  label: ArlH motor regulator
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - arlH
  - flaH
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: ArlH/FlaH is an archaellum-specific P-loop ATPase; no exact family
    CURIE was verified for the full regulator class in this pass.
  role: Nucleotide-dependent regulator that interacts with ArlI/FlaI and is required
    for motor assembly and function in the studied Sulfolobus motor.
  evidence:
  - reference: DOI:10.1111/mmi.13260
    notes: Chaudhury et al. tested the nucleotide-dependent FlaH-FlaI interaction
      and showed that it is required for archaellum motor assembly and function.
- component_id: arlfg_anchor
  label: ArlF/ArlG S-layer anchor
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlF
  - arlG
  - flaF
  - flaG
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: ArlF/FlaF and ArlG/FlaG are envelope-side archaellum anchor proteins
    with lineage-specific conservation; no exact CURIE for the two-protein anchor
    module was verified.
  role: Pseudo-periplasmic envelope module that connects the archaeal-type flagellum
    motor to the archaeal cell envelope and S-layer in characterized lineages.
  evidence:
  - reference: DOI:10.1016/j.str.2015.03.001
    notes: Banerjee et al. 2015 showed that Sulfolobus acidocaldarius FlaF binds the
      S-layer protein and anchors the archaellum in the cell envelope.
  - reference: DOI:10.7554/eLife.27470
    notes: Daum et al. 2017 placed the Pyrococcus furiosus archaellum basal machinery
      at the cell envelope by in situ cryo-electron tomography.
- component_id: cytosolic_scaffold
  label: ArlX/ArlCDE cytosolic scaffold
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlX
  - arlC
  - arlD
  - arlE
  - flaX
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Crenarchaeal ArlX/FlaX and euryarchaeal ArlCDE occupy analogous
    cytosolic scaffold or switch positions but are not one homologous protein family
    or an exactly grounded universal subcomplex.
  role: Lineage-specific cytosolic ring or switch module that organizes the ArlI/ArlJ
    motor core and links the motor to chemotaxis control.
  evidence:
  - reference: DOI:10.1074/jbc.M112.414383
    notes: Banerjee et al. showed that the crenarchaeal FlaX protein forms ring-shaped
      assemblies and interacts with the motor ATPase FlaI.
  - reference: DOI:10.1038/s41467-022-28337-1
    notes: Gambelli et al. 2022 summarize ArlX in Crenarchaeota and ArlCDE in Euryarchaeota
      as cytosolic ring modules surrounding ArlI/ArlJ.
taxonomic_distribution:
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: VARIABLE
  note: Archaellum motors occur in archaeal lineages that encode the archaeal-type
    flagellum and are absent from archaea that lack the motility operon.
  reference: DOI:10.3389/fmicb.2015.00023
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: ABSENT
  note: Bacterial flagellar motors are non-homologous rotary machines built from FliF/FliG/FliM/FliN
    rotors and Mot/Pom stators rather than archaellum Arl/Fla subassemblies.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:2285
  taxon_label: Sulfolobus acidocaldarius
  note: Crenarchaeal source for biochemical analysis of FlaX scaffold ring formation
    and interaction with the motor ATPase FlaI.
  reference: DOI:10.1074/jbc.M112.414383
- taxon_id: NCBITaxon:2261
  taxon_label: Pyrococcus furiosus
  note: Euryarchaeal source for in situ cryo-ET of basal archaellum machinery at the
    archaeal cell envelope.
  reference: DOI:10.7554/eLife.27470
functions:
- function_id: atp_powered_archaellum_assembly
  label: ATP-powered archaellum assembly
  description: The motor uses ATP hydrolysis by ArlI/FlaI to assemble archaellin subunits
    at the base of the growing archaeal-type flagellum filament.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review ATP-powered archaellum filament assembly
      by the basal motor.
- function_id: atp_powered_archaellum_rotation
  label: ATP-powered archaellum rotation
  description: The motor rotates the assembled archaellin filament to drive archaeal-type
    flagellum-dependent motility.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review ATP-powered rotation of the archaellum as
      the basis of archaeal swimming.
evidence:
- reference: DOI:10.3389/fmicb.2015.00023
  notes: 'Albers SV and Jarrell KF 2015, The archaellum: how archaea swim, Frontiers
    in Microbiology.'
- reference: DOI:10.1074/jbc.M112.414383
  notes: Banerjee et al., FlaX, A Unique Component of the Crenarchaeal Archaellum,
    Forms Oligomeric Ring-shaped Structures and Interacts with the Motor ATPase FlaI,
    Journal of Biological Chemistry.
- reference: DOI:10.1016/j.str.2015.03.001
  notes: Banerjee et al. 2015, FlaF Is a beta-Sandwich Protein that Anchors the Archaellum
    in the Archaeal Cell Envelope by Binding the S-Layer Protein, Structure.
- reference: DOI:10.1111/mmi.13260
  notes: Chaudhury et al., The nucleotide-dependent interaction of FlaH and FlaI is
    essential for assembly and function of the archaellum motor, Molecular Microbiology.
- reference: DOI:10.7554/eLife.27470
  notes: Daum et al. 2017, Structure and in situ organisation of the Pyrococcus furiosus
    archaellum machinery, eLife.
- reference: DOI:10.1038/s41467-022-28337-1
  notes: Gambelli et al. 2022, An archaellum filament composed of two alternating
    subunits, Nature Communications.
- reference: GO:0032991
  notes: Gene Ontology cellular-component parent term for protein-containing complexes.
