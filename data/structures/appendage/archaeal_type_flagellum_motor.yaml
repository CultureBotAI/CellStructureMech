taxonomic_distribution:
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: VARIABLE
  note: Archaellum motors occur in archaeal lineages that encode the archaeal-type
    flagellum and are absent from archaea that lack the motility operon.
  reference: DOI:10.3389/fmicb.2015.00023
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Litorilinea aerophila DSM 25763 forms archaellin filaments and swims after
    growth on motility plates. Other Chloroflexota candidates are supported by genome
    surveys, not equivalent experimental observations. Its motor architecture is inferred
    from loci and predicted ArlI/ArlJ structures, not a directly resolved bacterial
    motor.
  reference: DOI:10.1038/s41564-025-02110-8
