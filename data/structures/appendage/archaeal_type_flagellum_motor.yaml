identifier: cellstructuremech:archaeal_type_flagellum_motor
label: archaeal-type flagellum motor
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A membrane-associated ATP-powered motor complex of the archaeal-type flagellum
  that assembles and rotates the external archaellin filament.
definition_source: DOI:10.3389/fmicb.2015.00023
mapping_status: PROPOSED
