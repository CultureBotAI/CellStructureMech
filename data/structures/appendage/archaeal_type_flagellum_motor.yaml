- component_id: cytosolic_scaffold
  label: ArlX/ArlCDE cytosolic scaffold
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlX
  - arlC
  - arlD
  - arlE
  - flaX
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Crenarchaeal ArlX/FlaX and euryarchaeal ArlCDE occupy analogous
    cytosolic scaffold or switch positions but are not one homologous protein family
    or an exactly grounded universal subcomplex.
  role: Lineage-specific cytosolic ring or switch module that organizes the ArlI/ArlJ
    motor core and links the motor to chemotaxis control.
  evidence:
  - reference: DOI:10.1074/jbc.M112.414383
    notes: Banerjee et al. showed that the crenarchaeal FlaX protein forms ring-shaped
      assemblies and interacts with the motor ATPase FlaI.
  - reference: DOI:10.1038/s41467-022-28337-1
    notes: Gambelli et al. 2022 summarize ArlX in Crenarchaeota and ArlCDE in Euryarchaeota
      as cytosolic ring modules surrounding ArlI/ArlJ.
