- discussion_id: exclude_filament_and_processing
  prompt: Archaellins and prearchaellin maturation enzymes are out of scope for the
    motor record.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - components#arli_arlj_motor
  - components#arlh_regulator
  - components#arlfg_anchor
  - components#cytosolic_scaffold
  - causal_graphs#archaellum_motor_assembly_rotation
  rationale: The archaellum motor is the basal ATP-powered machine. Archaellins are
    the polymerized filament subunits, and PibD/FlaK-like prepilin peptidases act
    on archaellin precursors before filament assembly rather than forming part of
    the basal motor.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 distinguish prearchaellin processing and the external
      filament from the basal motor machinery.
  posed_by: codex
  posed_date: '2026-09-23'
  resolved_date: '2026-09-23'
