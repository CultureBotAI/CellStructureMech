- component_id: arlh_regulator
  label: ArlH motor regulator
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - arlH
  - flaH
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: ArlH/FlaH is a KaiC-like ATP-binding motor regulator; no exact
    family CURIE was verified for the full regulator class. ATP binding and autophosphorylation
    must not be equated with demonstrated ATPase activity.
  role: Nucleotide-dependent regulator that interacts with ArlI/FlaI and is required
    for motor assembly and function in the studied Sulfolobus motor.
  evidence:
  - reference: DOI:10.1111/mmi.13260
    notes: Chaudhury et al. 2016 measured ATP binding and nucleotide-dependent FlaH-FlaI
      interaction but no detectable in vitro ATPase activity under the tested conditions;
      this does not establish universal catalytic inactivity.
  - reference: DOI:10.1111/mmi.14781
    notes: The 2021 study demonstrated ArlH autophosphorylation and its regulatory
      relationship to oligomerization and ArlI interaction; phosphorylation is distinct
      from an unqualified ATPase claim.
