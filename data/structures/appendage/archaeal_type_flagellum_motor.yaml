- component_id: arlfg_anchor
  label: ArlF/ArlG S-layer anchor
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlF
  - arlG
  - flaF
  - flaG
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: ArlF/FlaF and ArlG/FlaG are envelope-side archaellum anchor proteins
    with lineage-specific conservation; no exact CURIE for the two-protein anchor
    module was verified.
  role: Envelope-side FlaF/FlaG module proposed to anchor the archaellum to the S-layer
    in characterized archaeal lineages; binding and complex-formation experiments
    support the model without resolving every motor contact.
  evidence:
  - reference: DOI:10.1016/j.str.2015.03.001
    notes: Banerjee et al. 2015 demonstrated binding of soluble Sulfolobus acidocaldarius
      FlaF to isolated S-layer and proposed an anchoring role; the complete FlaF/FlaG-to-motor
      bridge was not directly resolved.
  - reference: DOI:10.1038/s41564-019-0622-3
    notes: The inspected Tsai et al. 2020 primary abstract reports FlaG/FlaF complex
      formation and motility-disrupting interface mutations, supporting an S-layer-anchoring
      model. Full text was unavailable; direct contacts to the intact motor are not
      established by this abstract.
