functions:
- function_id: atp_powered_archaellum_assembly
  label: ATP-powered archaellum assembly
  description: The motor uses ATP hydrolysis by ArlI/FlaI to assemble archaellin subunits
    at the base of the growing archaeal-type flagellum filament.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review ATP-powered archaellum filament assembly
      by the basal motor.
- function_id: atp_powered_archaellum_rotation
  label: ATP-powered archaellum rotation
  description: The motor rotates the assembled archaellin filament to drive archaeal-type
    flagellum-dependent motility.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review ATP-powered rotation of the archaellum as
      the basis of archaeal swimming.
evidence:
