- discussion_id: tentacle_boundary
  prompt: Keep the whole feeding projection distinct from its extrusomes and other
    protist appendages.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: The record denotes the tubular feeding apparatus, not its dense secretory
    bodies. Functional analogy alone does not identify it with a dinoflagellate peduncle
    or haptonema.
  evidence:
  - reference: DOI:10.1083/jcb.25.3.459
  posed_by: codex
  posed_date: '2026-10-03'
