  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The ciliary membrane carries a sorted and organism-specific protein
    repertoire, so this aggregate is left label-only until exact conserved families
    are curated.
  role: Membrane proteins that localize to the ciliary membrane for signaling, trafficking,
    and cilium function.
  evidence:
