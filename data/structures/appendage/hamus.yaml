components:
- component_id: hamus_120_kda_subunits
  label: hamus 120 kDa subunits
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The hami of uncultivated Candidatus Altarchaeum hamiconexum are
    proteinaceous and dominated by 120 kDa subunits, but this pass did not verify
    an exact source-neutral family CURIE for those altiarchaeal hamus proteins.
  role: Major proteinaceous constituents of the extracellular helical filament and
    terminal hook.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2005.04294.x
    notes: Moissl et al. 2005 biochemically and ultrastructurally characterized hami
      as mostly 120 kDa proteinaceous subunits assembled into helical appendages with
      grappling-hook termini.
  - reference: DOI:10.3389/fmicb.2015.00543
    notes: Perras et al. 2015 compared the grappling-hook hami of Candidatus Altarchaeum
      hamiconexum with archaeal S-layer proteins in sequence and structure.
taxonomic_distribution:
- taxon_id: NCBITaxon:1803513
  taxon_label: Candidatus Altarchaeum hamiconexum
  presence: COMMON
  note: Hami were ultrastructurally characterized on cells of the uncultivated SM1/Altarchaeum
    archaeon from cold sulphidic spring biofilms.
  reference: DOI:10.1111/j.1365-2958.2005.04294.x
canonical_examples:
- taxon_id: NCBITaxon:1803513
  taxon_label: Candidatus Altarchaeum hamiconexum
  note: Uncultivated archaeal species whose surface hami were described by electron
    microscopy, cryo-electron tomography and biofilm ultrastructural analysis.
  reference: DOI:10.3389/fmicb.2014.00397
functions:
- function_id: biotic_abiotic_surface_adhesion
  label: biotic and abiotic surface adhesion
  description: Hami project from the archaeal cell surface and mediate strong adhesion
    to chemically distinct biotic and abiotic surfaces.
  evidence:
  - reference: DOI:10.1111/j.1365-2958.2005.04294.x
    notes: Moissl et al. 2005 connected each cell's halo of hami with adhesion to
      surfaces of different chemical composition.
  - reference: DOI:10.3389/fmicb.2014.00397
    notes: Perras et al. 2014 localized hami as major contact structures at the SM1/Altarchaeum
      cell surface in biofilm ultrastructure.
evidence:
- reference: DOI:10.1111/j.1365-2958.2005.04294.x
  notes: Moissl et al. 2005, The unique structure of archaeal hami, highly complex
    cell appendages with nano-grappling hooks, Molecular Microbiology.
- reference: DOI:10.3389/fmicb.2014.00397
  notes: 'Perras et al. 2014, Grappling archaea: ultrastructural analyses of an uncultivated,
    cold-loving archaeon, and its biofilm, Frontiers in Microbiology.'
- reference: DOI:10.3389/fmicb.2015.00543
  notes: Perras et al. 2015, S-layers at second glance? Altiarchaeal grappling hooks
    (hami) resemble archaeal S-layer proteins in structure and sequence, Frontiers
    in Microbiology.
