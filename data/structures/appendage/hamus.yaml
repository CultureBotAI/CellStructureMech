definition: An archaeal cell-surface appendage composed of proteinaceous helical filaments
  with periodic prickles and a terminal grappling hook, used by Candidatus Altarchaeum
  hamiconexum cells to attach to biotic and abiotic surfaces.
definition_source: DOI:10.1111/j.1365-2958.2005.04294.x
