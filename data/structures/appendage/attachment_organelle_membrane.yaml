discussions:
- discussion_id: surface_adhesins_on_whole_organelle
  prompt: Keep P1/P40/P90, P30, and internal-core proteins on the whole attachment
    organelle record rather than duplicating them as attachment organelle membrane
    components.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - record
  - causal_graphs#attachment_organelle_membrane_topology
  rationale: GO:0033111 and SL-0021 denote the membrane around the organelle. Nakane
    et al. map P1/P40/P90 and P30 to the broader organelle surface and map HMW2, P65,
    and HMW3 to the electron-dense internal core, so those proteins remain components
    of the whole attachment organelle record.
  resolution_note: Curated only the lipid-boundary component and the attachment organelle/plasma-membrane
    topology for the membrane record.
  evidence:
  - reference: GO:0033111
    notes: GO:0033111 identifies the membrane boundary around the attachment organelle.
  - reference: DOI:10.1371/journal.ppat.1005299
    notes: Nakane et al. 2015 mapped known surface and internal core proteins across
      the attachment organelle.
  posed_by: codex
  posed_date: '2026-09-12'
