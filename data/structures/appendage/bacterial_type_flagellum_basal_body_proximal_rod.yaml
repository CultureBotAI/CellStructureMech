discussions:
- discussion_id: exclude_distal_rod_ms_ring_and_export_gate
  prompt: Should FlgG, the MS ring, or the flagellar export apparatus be curated as
    proximal-rod components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flie
  rationale: The mature GO:0009429 proximal rod is scoped to the FliE/FlgB/FlgC/FlgF
    segment. FlgG forms the distal rod, the FliF MS ring is motor-proximal to FliE,
    and the flagellar type III export apparatus secretes axial substrates but is not
    a mature proximal-rod subunit.
  resolution_note: 'Declined: keep FlgG on the distal rod, FliF on the MS ring, and
    export-gate proteins on the enclosing basal-body or export-apparatus records.'
  posed_by: claude
  posed_date: '2026-09-07'
  resolved_date: '2026-09-07'
