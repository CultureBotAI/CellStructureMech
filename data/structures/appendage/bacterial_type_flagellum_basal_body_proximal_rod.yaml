taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: Proximal rods occur in bacterial-type flagellar basal bodies but are absent
    from bacteria without flagellar loci.
  reference: DOI:10.1128/JB.181.23.7149-7153.1999
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related appendages and do not contain
    the FliE/FlgB/FlgC/FlgF proximal rod.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Structural Salmonella model for FliE and FlgB contacts at the motor-proximal
    base of the rod.
  reference: DOI:10.1016/j.cell.2021.03.057
functions:
- function_id: motor_distal_rod_coupling
  label: motor to distal-rod mechanical coupling
  description: The proximal rod links the FliF/MS-ring side of the motor to the FlgG
    distal rod to carry rotation into the external hook-filament assembly.
  evidence:
  - reference: DOI:10.1016/j.cell.2021.03.057
    notes: Tan et al. 2021 resolved FliE and FlgB contacts that couple the MS ring
      to the helical rod.
  - reference: DOI:10.1128/JB.182.11.3029-3036.2000
    notes: Minamino et al. 2000 placed the FliE-FlgB junction at the proximal end
      of the rod.
- function_id: proximal_rod_segment_assembly
  label: proximal rod segment formation
  description: FliE, FlgB, FlgC and FlgF provide the motor-proximal axial subunits
    of the segmented rod next to the distal FlgG segment.
  evidence:
  - reference: DOI:10.1016/0022-2836(90)90365-S
    notes: Homma et al. 1990 model the Salmonella rod as sequential FlgB/FlgC/FlgF
      proximal segments followed by the FlgG distal segment.
  - reference: DOI:10.1016/0022-2836(92)90958-m
    notes: Kubori et al. 1992 used Salmonella assembly intermediates to place FliE
      and the FlgB/FlgC/FlgF/FlgG proteins in the rod assembly pathway.
evidence:
