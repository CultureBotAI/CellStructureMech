identifier: GO:0009429
label: bacterial-type flagellum basal body, proximal rod
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: The portion of the central rod of the bacterial-type flagellar basal body
  that is proximal to the cell membrane; the proximal rod connects the distal rod
  to the flagellar motor.
definition_source: GO:0009429
mapping_status: PROPOSED
