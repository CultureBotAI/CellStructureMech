- reference: DOI:10.1128/ecosalplus.ESP-0037-2018
  notes: 'Bhoite S, Van Gerven N, Chapman MR and Remaut H 2019, Curli Biogenesis:
    Bacterial Amyloid Assembly by the Type VIII Secretion Pathway, EcoSal Plus.'
- reference: DOI:10.1038/s41467-019-14145-7
  notes: Yan et al. 2020 reconstituted and structurally analyzed curli substrate recognition
    by CsgF-CsgG secretion channel complexes.
causal_graphs:
- graph_id: type_viii_curli_amyloid_assembly
  title: Csg secretion and nucleation build the curli fiber
  description: The outer-membrane CsgG pore and accessory factors move CsgA to the
    cell surface, CsgB nucleates CsgA polymerization, and the resulting amyloid polymer
    forms the curli fiber.
