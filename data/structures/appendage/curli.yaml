functions:
- function_id: curli_assembly
  label: curli assembly
  grounding: GO:0098775
  description: CsgA subunits are secreted and nucleated on the cell surface to build
    an extracellular amyloid fiber.
  evidence:
  - reference: DOI:10.1128/ecosalplus.ESP-0037-2018
    notes: The EcoSal Plus review frames curli biogenesis as bacterial amyloid assembly
      by the type VIII secretion pathway.
- function_id: biofilm_matrix_adhesion
  label: biofilm matrix adhesion
  description: Curli fibers contribute an adhesive amyloid scaffold to enterobacterial
    extracellular matrices.
  evidence:
  - reference: DOI:10.1146/annurev.micro.60.080805.142106
    notes: Barnhart and Chapman 2006 review curli functions in surface adhesion, cell
      aggregation, and biofilm formation.
evidence:
