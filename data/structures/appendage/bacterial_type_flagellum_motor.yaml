causal_graphs:
- graph_id: flagellar_motor_torque_and_switching
  title: Stators drive the MS/C-ring rotor
  description: Dynamic stators anchor around the MS/C-ring rotor, ion flow through
    each stator applies torque to FliG in the C ring, the MS ring transmits rotation
    to the rod, and CheY-P shifts C-ring switching state.
