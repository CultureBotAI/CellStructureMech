identifier: GO:0120100
label: bacterial-type flagellum motor
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A bacterial flagellar basal-body motor composed of an MS-ring/C-ring rotor
  complex and one or more Mot/Pom-family stator complexes in the cytoplasmic membrane
  that convert ion flow into rotary torque and bias clockwise or counterclockwise
  output.
definition_source: DOI:10.1016/j.tim.2014.12.011
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-09T00:39:20Z'
  curator: claude
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-09T00:40:01Z'
  curator: claude
  action: EXPANDED_RECORD
  changes: Added basal-body parthood and rotor/stator parts; curated rotor and stator
    constituent subcomplexes; added bacterial and archaeal taxonomic scope, Salmonella
    as a canonical example, ion-driven torque, dynamic stator anchoring and CheY-P
    switching functions, a rotor/stator motor causal graph, and resolved discussions
    for stator stoichiometry and nonmotor flagellum parts.
  llm_assisted: true
has_part:
- GO:0120107
- GO:0120101
part_of:
