components:
- component_id: rotor_complex
  label: bacterial-type flagellum rotor complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - fliF
  - fliG
  - fliM
  - fliN
  essentiality: ESSENTIAL
  role: Rotating MS/C-ring assembly that receives stator torque and sets clockwise
    or counterclockwise motor bias.
  evidence:
  - reference: DOI:10.1016/j.tim.2014.12.011
    notes: Minamino and Imada 2015 review the MS ring and C ring as the rotor of the
      bacterial flagellar motor.
  - reference: DOI:10.1038/emboj.2011.188
    notes: Paul et al. 2011 mapped the FliG/FliM/FliN C ring onto the Salmonella flagellar
      rotor.
- component_id: stator_complex
  label: bacterial-type flagellum stator complex
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - motA
  - motB
  - pomA
  - pomB
  essentiality: ESSENTIAL
  role: Membrane ion-channel unit that anchors to the cell wall and applies proton-
    or sodium-driven torque to FliG in the rotor.
  evidence:
  - reference: DOI:10.1016/j.cell.2020.08.016
    notes: Santiveri et al. 2020 resolved MotAB stators as pentameric A-subunit rings
      around B-subunit dimers.
  - reference: DOI:10.1038/s41564-020-0788-8
    notes: Deme et al. 2020 independently resolved bacterial flagellar stators and
      modeled their engagement with FliG in the rotor.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Bacterial-type flagellum motors occur in bacteria with rotary bacterial flagella
    and are absent from bacteria that lack the flagellar system.
  reference: DOI:10.1038/nrmicro1887
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: ABSENT
  note: Archaeal archaella are type-IV-pilus-related rotary appendages and do not
    contain FliF/FliG/FliM/FliN rotors or Mot/Pom stators.
  reference: DOI:10.3389/fmicb.2015.00023
canonical_examples:
- taxon_id: NCBITaxon:90371
  taxon_label: Salmonella enterica subsp. enterica serovar Typhimurium
  note: Classical model for flagellar motor genetics and source organism for C-ring,
    MS-ring and rotor-architecture studies.
  reference: DOI:10.1128/JB.00552-06
functions:
- function_id: ion_driven_rotary_torque
  label: ion-driven rotary torque
  description: Proton- or sodium-driven stator units apply torque to the C-ring face
    of the rotor to spin the MS ring and axial rod.
  evidence:
  - reference: DOI:10.1016/j.tim.2014.12.011
    notes: Minamino and Imada 2015 review the rotor-stator interface used for bacterial
      flagellar torque.
  - reference: DOI:10.1016/j.cell.2020.08.016
    notes: Santiveri et al. 2020 modeled MotAB stator rotation as the force source
      for flagellar torque generation.
- function_id: dynamic_stator_anchoring
  label: dynamic stator anchoring
  description: Stator units dock around the rotor and anchor through their B-subunit
    peptidoglycan-binding domains while dynamically exchanging at the motor.
  evidence:
  - reference: DOI:10.7554/eLife.48979
    notes: Chang et al. 2019 imaged stator complexes around bacterial flagellar rotors
      in cells.
  - reference: DOI:10.1016/j.str.2018.02.016
    notes: Kojima et al. 2018 linked B-subunit rearrangement to peptidoglycan binding
      and stator activation.
- function_id: chemotactic_directional_switching
  label: chemotactic directional switching
  description: Phosphorylated CheY binds FliM in the C-ring switch complex to shift
    the motor between clockwise and counterclockwise rotational states.
  evidence:
  - reference: DOI:10.1073/pnas.90.19.8787
    notes: Welch et al. 1993 directly demonstrated phosphorylation-dependent CheY
      binding to FliM in the switch complex.
  - reference: DOI:10.1038/nature09300
    notes: Lee et al. 2010 connected the FliG/FliM/FliN torque ring to rotational
      switching.
evidence:
