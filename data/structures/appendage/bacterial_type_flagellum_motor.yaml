  edges:
  - subject: stator_complex
    predicate: docks around
    object: rotor_complex
    description: Membrane stator units assemble dynamically around the flagellar rotor.
    evidence:
    - reference: DOI:10.7554/eLife.48979
      notes: Chang et al. 2019 imaged stator complexes around bacterial flagellar
        rotors in cells.
  - subject: stator_complex
    predicate: anchors to
    object: peptidoglycan
    description: The stator B-subunit dimer anchors active stator units to the peptidoglycan
      layer.
    evidence:
    - reference: DOI:10.1016/j.str.2018.02.016
      notes: Kojima et al. 2018 linked B-subunit peptidoglycan binding to stator activation.
  - subject: ion_flux
    predicate: drives
    object: stator_complex
    description: Ion flow drives rotation of the stator A-subunit ring around the
      anchored B-subunit dimer.
    evidence:
    - reference: DOI:10.1016/j.cell.2020.08.016
      notes: Santiveri et al. 2020 modeled MotAB stator rotation as the ion-coupled
        force source.
  - subject: stator_complex
    predicate: applies torque to
    object: c_ring
    description: Stator A subunits engage FliG in the C ring to turn the rotor.
    evidence:
    - reference: DOI:10.1038/s41564-020-0788-8
      notes: Deme et al. 2020 modeled the stator as an ion-driven MotA pentamer meshing
        with FliG.
  - subject: c_ring
    predicate: assembles with
    object: ms_ring
    description: The C ring attaches to the cytoplasmic face of the MS ring to form
      the MS/C-ring rotor.
    evidence:
    - reference: DOI:10.1038/s41467-021-24507-9
      notes: Kawamoto et al. 2021 measured C-ring symmetry relative to the FliF MS
        ring in native Salmonella basal bodies.
  - subject: ms_ring
    predicate: transmits rotation to
    object: rod
    description: The MS ring couples rotor motion through FliE to the proximal rod.
    evidence:
    - reference: DOI:10.1016/j.cell.2021.03.057
      notes: Tan et al. 2021 resolved the MS-ring, FliE and proximal-rod coupling
        geometry.
  - subject: chey_p
    predicate: biases
    object: c_ring
    description: Phosphorylated CheY binds primarily to FliM to bias the C-ring switch
      toward clockwise output.
    evidence:
    - reference: DOI:10.1073/pnas.90.19.8787
      notes: Welch et al. 1993 showed phosphorylation-dependent CheY binding through
        FliM in the bacterial switch complex.
discussions:
- discussion_id: modern_stator_stoichiometry
  prompt: Should the GO definition's A4B2 stator stoichiometry be copied?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#stator_complex
  rationale: GO:0120100 remains the exact cellular-component term for the bacterial
    flagellar motor, but its 2017 definition predates the 2020 MotAB structures that
    resolved the stator core as A5B2 rather than A4B2.
  resolution_note: 'Declined: keep the exact GO identity term but leave the stale
    A4B2 wording out of the local definition and source modern stator stoichiometry
    to Santiveri et al. 2020 and Deme et al. 2020 through the dedicated stator-complex
    record.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
- discussion_id: exclude_nonmotor_flagellum_parts
  prompt: Should the rod, hook, filament, LP rings, or export apparatus be curated
    as motor components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#rotor_complex
  - components#stator_complex
  rationale: The bacterial flagellar motor is the membrane rotor plus stator torque
    generator. The rod, hook and filament transmit or receive the motor output, the
    LP rings act as envelope bushings, and the export apparatus secretes axial subunits,
    but they are outside the rotor/stator motor boundary.
  resolution_note: 'Declined: keep only the rotor and stator as motor constituents
    and represent rod output in the mechanism graph.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
