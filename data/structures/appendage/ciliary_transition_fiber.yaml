functions:
- function_id: basal_body_membrane_linkage
  label: basal-body membrane linkage
  description: The radial transition-fiber complex links the distal basal body and
    cilium to the plasma membrane.
  evidence:
  - reference: GO:0097539
    notes: The exact cellular-component definition supplies this anatomical linking
      function; no individual protein is assigned direct lipid binding.
- function_id: support_new_flagellum_assembly
  label: support of new flagellum assembly
  description: Transition-fiber-associated proteins contribute to normal new-flagellum
    assembly in procyclic trypanosomes.
  evidence:
  - reference: DOI:10.1242/jcs.261692
    notes: RNAi of FBF1 and five other mapped proteins impairs new-flagellum assembly.
      This does not isolate fiber docking, prove loss of every blade, or establish
      a specific IFT-entry reaction.
causal_graphs:
- graph_id: tfk1_cc1_targeting
  title: TFK1 domain-dependent targeting to transition fibers
  description: Experimentally delimited component recruitment and self-interaction
    in the trypanosome transition-fiber assembly context.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: This graph concerns incorporation of one resident, not construction
    of the whole fiber. CC1 targeting was tested in cells retaining endogenous TFK1.
    Self-interaction could explain recruitment, but that causal connection was not
    isolated and is not drawn. Y2H does not determine native oligomer stoichiometry.
