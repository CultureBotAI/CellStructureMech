discussions:
- discussion_id: transition_fiber_boundary
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Separate transition fibers from the surrounding basal body and distal transition-zone
    linkers.
  rationale: Adjacent records mention this structure but do not denote the discrete
    radial appendage complex.
  notes: Ignored- and hidden-inclusive searches found no existing identity record.
    The basal body is the enclosing structure, not an is-a parent. Y-shaped links
    are distinct, and the GO scopes of distal-appendage and bare transition-fiber
    synonyms are preserved.
  evidence:
  - reference: GO:0097539
    notes: Exact appendage-complex identity.
  - reference: GO:0036064
    notes: Enclosing ciliary basal body.
  - reference: GO:0097537
    notes: Distinct transition-zone Y-link complex.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
- discussion_id: complete_component_inventory_and_grounding
  kind: CURATION_TODO
  status: OPEN
  prompt: Resolve exact CEP164 and TFK1 families, strain-paired protein examples,
    and the remaining mapped component classes.
  rationale: The four curated families are not a complete inventory. Thirty proteins
    were mapped in 2024, in addition to previously studied RP2 and TFK1; localization,
    constitutive membership and assembly essentiality require separate judgements.
  notes: The verified TFK1 accession Q585C9 matches the published locus, RefSeq cross-reference
    and length, but represents TREU927 while the domain experiments use SmOx427. No
    strain-specific protein example or cross-taxon prevalence is asserted. CEP164
    domain entries are not whole-family identities; stoichiometry remains unset.
  evidence:
  - reference: DOI:10.1242/jcs.261692
    notes: The mapping study reports a substantially larger inventory and non-identical
      paralogue timing.
  - reference: DOI:10.1242/jcs.259893
    notes: The experimental strain context and cloned genomic locus must not be conflated.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: separate_targeting_from_complete_assembly
  kind: CURATION_TODO
  status: OPEN
  prompt: Determine native binding partners, self-association requirements, blade
    assembly dependencies and molecular gating reactions.
  rationale: Domain targeting, protein-depletion phenotypes and whole-fiber construction
    are different claims.
  notes: No TFK1 self-association-to-targeting edge is inferred. Loss of CEP164A signal
    after CEP90 or TFP68 depletion does not distinguish missing fibers from failed
    marker recruitment. Worm or mammalian FBF1-IFT mechanisms and cytokinesis hypotheses
    are not imported as demonstrated trypanosome reactions.
  evidence:
  - reference: DOI:10.1242/jcs.259893
    notes: CC1 can interact with endogenous full-length TFK1; the targeting experiments
      do not separate this route from other binding partners.
  - reference: DOI:10.1242/jcs.261692
    notes: The authors explicitly leave the docking and marker-recruitment alternatives
      unresolved.
  posed_by: codex
  posed_date: '2026-10-04'
- discussion_id: rp2_antibody_not_tubulin_binding_proof
  kind: CURATION_TODO
  status: RESOLVED
  prompt: Do not infer a tubulin-binding reaction from basal-body YL1/2 staining.
  rationale: YL1/2 recognition of RP2 confounds interpreting disappearance of the
    basal-body signal as loss of a tubulin pool.
  notes: RP2 membership here uses tagged-protein spatial localization, not YL1/2 staining
    as evidence of direct RP2-tubulin binding. Tubulin is not added as a fiber constituent
    on that basis.
  evidence:
  - reference: DOI:10.1016/j.protis.2017.07.002
    notes: The primary abstract identifies RP2, rather than tyrosinated alpha-tubulin,
      as the mature-basal-body antigen recognized by YL1/2.
  - reference: DOI:10.1242/jcs.259893
    notes: Figure 2 uses TY1-tagged RP2 for its relative localization.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
