identifier: GO:0097539
label: ciliary transition fiber
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A nine-bladed, propeller-like protein complex that links the distal end
  of the basal body and the cilium to the plasma membrane. Functions in protein sorting
  and gating (i.e. active and passive transport of proteins in and out of the cilium).
