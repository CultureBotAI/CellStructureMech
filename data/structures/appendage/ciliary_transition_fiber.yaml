components:
- component_id: tfk1
  label: transition fibre kinetoplastid-specific protein 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No integrated InterPro entry was returned for the verified TFK1
    protein Q585C9 or the TFK1 text search. A generic coiled-coil domain or unrelated
    PANTHER prediction is not an exact family grounding.
  gene_symbols:
  - TFK1
  essentiality: UNKNOWN
  role: Resident of the transition-fiber matrix region in Trypanosoma brucei. RNAi
    leaves gross fiber-region architecture intact; bloodstream-form lethality does
    not establish assembly essentiality.
  evidence:
  - reference: DOI:10.1242/jcs.259893
    notes: Figures 2-3 localize TFK1 between CEP164C puncta and distal to RP2. Figure
      5 tests its CC1 targeting region and self-interaction; RNAi is not a null allele.
- component_id: cep164
  label: CEP164 family protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The live CEP164 InterPro search returned N-terminal and coiled-coil
    domain entries, not an exact integrated whole-protein family. No domain is promoted
    to family identity.
  gene_symbols:
  - CEP164A
  - CEP164B
  - CEP164C
  essentiality: UNKNOWN
  role: 'Spatially and temporally differentiated transition-fiber proteins. The trypanosome
    paralogues are not interchangeable: CEP164C is associated with older flagella,
    whereas A and B also label the new flagellum base.'
  evidence:
  - reference: DOI:10.1242/jcs.259893
    notes: Figure 2 resolves a punctate CEP164C pattern distinct from the TFK1 matrix
      pattern.
  - reference: DOI:10.1242/jcs.261692
    notes: Spatial mapping and cell-cycle analysis distinguish CEP164A, B and C; localization
      does not prove that every paralogue is required for fiber assembly.
- component_id: rp2
  label: Protein XRP2
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR039093
  grounding_notes: InterPro verifies the XRP2 family and assigns it to the trypanosome
    RP2 locus product Q388J8. Domain names are not evidence for a particular tubulin-binding
    or GTPase reaction at this structure.
  gene_symbols:
  - RP2
  - XRP2
  essentiality: UNKNOWN
  role: A proximal, approximately ring-like resident of the trypanosome transition-fiber
    region, spatially distinct from TFK1.
  evidence:
  - reference: DOI:10.1242/jcs.259893
    notes: Figure 2 uses endogenously TY1-tagged RP2 to distinguish its distribution
      from TFK1.
  - reference: InterPro:IPR039093
    notes: Authority-verified family type and canonical label Protein XRP2.
- component_id: fbf1
  label: Fas-binding factor 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR033561
  gene_symbols:
  - FBF1
  essentiality: UNKNOWN
  role: Transition-fiber-associated protein with an approximately ninefold arrangement
    around the trypanosome basal body. It supports normal new-flagellum assembly,
    but its exact placement in blade versus matrix and fiber-assembly requirement
    remain unresolved here.
  evidence:
  - reference: DOI:10.1242/jcs.261692
    notes: Figure 1H expansion microscopy resolves the FBF1 pattern; Figure 5D shows
      strongly shortened new flagella after depletion. Neither establishes a specific
      molecular gating interaction in trypanosomes.
  - reference: InterPro:IPR033561
    notes: Authority-verified FBF1 family identity; its mammalian and nematode mechanistic
      annotations are not transferred to the trypanosome.
