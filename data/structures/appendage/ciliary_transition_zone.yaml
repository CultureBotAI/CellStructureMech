identifier: GO:0035869
label: ciliary transition zone
structure_category: APPENDAGE
structure_kind: SUBCELLULAR_REGION
definition: A region of the cilium between the basal body and proximal segment that
  is characterized by Y-shaped assemblages that connect axonemal microtubules to the
  ciliary membrane. The ciliary transition zone appears to function as a gate that
  controls ciliary membrane composition and separates the cytosol from the ciliary
  plasm.
definition_source: GO:0035869
