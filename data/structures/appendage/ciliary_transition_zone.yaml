functions:
- function_id: ciliary_compartment_gating
  label: ciliary compartment gating
  description: The transition zone forms a proximal ciliary gate that separates the
    ciliary compartment from the cytosol and helps control ciliary protein composition.
  evidence:
  - reference: GO:0035869
    notes: GO:0035869 defines the ciliary transition zone as a gate controlling ciliary
      membrane composition and separating ciliary plasm from cytosol.
  - reference: DOI:10.1101/cshperspect.a028134
    notes: Garcia-Gonzalo and Reiter 2017 reviewed transition fibers and the transition
      zone as ciliary composition gatekeepers.
