identifier: GO:0097546
label: ciliary base
structure_category: APPENDAGE
structure_kind: SUBCELLULAR_REGION
definition: Area of the cilium (also called flagellum) where the basal body and the
  axoneme are anchored to the plasma membrane. The ciliary base encompasses the distal
  part of the basal body, transition fibers and transition zone and is structurally
  and functionally very distinct from the rest of the cilium. In this area proteins
  are sorted and filtered before entering the cilium, and many ciliary proteins localize
  specifically to this area. The specialized proximal region of a eukaryotic cilium
  or flagellum encompassing the basal body docking site, transition fibers, and ciliary
  transition zone in ciliated protists and microalgae. The ciliary base acts as a
  molecular gate and assembly hub where intraflagellar transport (IFT) trains are
  loaded and membrane diffusion between the plasma membrane and ciliary membrane is
  regulated.
