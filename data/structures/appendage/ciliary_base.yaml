causal_graphs:
- graph_id: ciliary_base_mechanism
  title: Ciliary base transition zone assembly anddiffusion barrier gating
  description: CEP290, NPHP, and MKS modules assemble at the ciliary base above the
    docked basal body to form Y-links and the ciliary necklace, establishing the selective
    barrier that controls entry of ciliary membrane proteins and IFT trains.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures the transition-zone boundary and gating role without
    enumerating the lineage-specific CEP290, MKS, NPHP or TCTN module families.
