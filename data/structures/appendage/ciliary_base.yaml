components:
- component_id: transition_zone_y_linkers
  label: Y-shaped link
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_notes: 'GO:0035869 defines Y-shaped linkers at this ciliary region, but
    no exact source-neutral CURIE for the assembled linker material was curated. Reassessment
    on 2026-10-10: the earlier label-only decision is superseded by GO:0097537, the
    exact assembled Y-shaped link complex. The preceding rationale records the earlier
    curation state, not current absence; molecular composition remains incompletely
    resolved.'
  role: Y-shaped connections spanning from proximal axonemal microtubules to the adjacent
    ciliary membrane. Functions at the ciliary base gating and IFT assembly zone in
    ciliary base.
  evidence:
  - reference: GO:0035869
    notes: GO:0035869 defines the ciliary transition zone by Y-shaped assemblages
      that connect axonemal microtubules to the ciliary membrane.
  - reference: DOI:10.1083/jcb.201006105
    notes: Craige et al. 2010 showed that Chlamydomonas CEP290 localizes to the flagellar
      transition zone and is needed for normal microtubule-membrane tethering there.
  - reference: GO:0097537
    notes: Exact GO cellular-component identity for the Y-shaped protein complex within
      the ciliary transition zone. This grounds the assembled linker, not a complete
      list of its constituent protein families or a Y-link-specific gating mechanism.
  grounding: GO:0097537
- component_id: transition_zone_axonemal_microtubules
  label: transition-zone axonemal microtubules
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The GO definition identifies axonemal microtubules contacted by
    the transition-zone Y-linkers, but this record is scoped to the transition-zone
    segment rather than the complete axoneme.
  role: Proximal axonemal microtubule segment contacted by transition-zone Y-linkers
    near the ciliary base. Functions at the ciliary base gating and IFT assembly zone
    in ciliary base.
  evidence:
  - reference: GO:0035869
    notes: GO:0035869 places axonemal microtubules in the definition of the ciliary
      transition zone.
- component_id: transition_zone_protein_network
  label: transition-zone protein network
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The ciliary transition zone contains several taxon- and module-specific
    protein families, so this aggregate is left label-only until exact conserved families
    are curated.
  role: Protein constituents that localize to the transition zone to organize the
    microtubule-membrane gate and tune ciliary protein composition. Functions at the
    ciliary base gating and IFT assembly zone in ciliary base.
  evidence:
  - reference: DOI:10.1038/s41467-022-31751-0
    notes: Wang et al. 2022 found that Chlamydomonas TCTN1 loss disrupts transition-zone
      wedge-shaped structures and compared how TCTN1, CEP290 and NPHP4 mutants alter
      ciliary composition and ectosome shedding.
  - reference: DOI:10.1101/cshperspect.a028134
    notes: Garcia-Gonzalo and Reiter 2017 reviewed the transition zone as a protein-rich
      gate that controls ciliary composition.
