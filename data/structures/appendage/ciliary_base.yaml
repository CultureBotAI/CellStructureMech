taxonomic_distribution:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  presence: COMMON
  note: Exhibits ciliary base (GO:0097546) at the ciliary base gating and IFT assembly
    zone. Chlamydomonas motile cilia contain a proximal transition zone; TCTN1 loss
    disrupts its wedge-shaped structures, and TCTN1, CEP290 and NPHP4 each influence
    ciliary protein composition.
  reference: DOI:10.1038/s41467-022-31751-0
