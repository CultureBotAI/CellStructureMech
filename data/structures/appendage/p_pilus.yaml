identifier: cellstructuremech:p_pilus
label: P pilus
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A chaperone-usher adhesive pilus of uropathogenic Escherichia coli built
  from a PapA helical rod and a PapG-PapF-PapE-PapK tip fibrillum. The P pilus is
  assembled by the PapD chaperone and PapC usher and uses its distal PapG adhesin
  to bind host glycolipid receptors.
definition_source: DOI:10.1128/ecosalplus.ESP-0007-2017
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-11T02:04:09Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-11T02:05:11Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added P pilus synonymy, GO pilus parentage, PapA/PapG/PapF/PapE/PapK/PapH
    constituents, E. coli taxonomy, assembly and adhesion functions, literature evidence,
    a PapD/PapC assembly graph, and grounding/boundary discussions.
  llm_assisted: true
- timestamp: '2026-09-11T02:11:53Z'
  curator: codex
  action: REFINED_CAUSAL_GRAPH
  changes: Rephrased the PapE-to-PapK assembly edge as an adaptor connection rather
    than a polymerization edge into PapK.
  llm_assisted: true
synonyms:
- synonym_text: pyelonephritis-associated pilus
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/ecosalplus.ESP-0007-2017
- synonym_text: P fimbria
  synonym_type: EXACT_SYNONYM
  source: DOI:10.1128/ecosalplus.ESP-0007-2017
- synonym_text: Pap pilus
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1128/ecosalplus.ESP-0007-2017
parent_structures:
- GO:0009289
components:
- component_id: papa_major_rod_subunit
  label: PapA major rod subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - papA
  stoichiometry: hundreds to thousands of copies per P pilus rod
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PapA is the P pilus major rod subunit; no exact source-neutral
    PapA family CURIE was curated for this first record.
  role: Polymerizes into the right-handed helical rod that forms most of the extracellular
    P pilus.
  evidence:
  - reference: DOI:10.1371/journal.ppat.0030073
    notes: Verger et al. 2007 solved the crystal structure of the PapA rod subunit
      and discuss PapA as the major subunit of the P pilus rod.
  - reference: DOI:10.1016/j.cell.2015.11.049
    notes: Hospenthal et al. 2016 used cryo-EM to resolve the P pilus rod as a helical
      PapA assembly.
- component_id: papg_tip_adhesin
  label: PapG tip adhesin
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - papG
  stoichiometry: 1 distal adhesin per tip fibrillum
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PapG is the P pilus distal adhesin; no exact source-neutral PapG
    family CURIE was curated for this first record.
  role: Caps the distal end of the tip fibrillum and binds Gal-alpha(1-4)Gal glycolipid
    receptors on host cells.
  evidence:
  - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
    notes: Werneburg and Thanassi 2018 review PapG as the P pilus adhesin that recognizes
      globoseries glycolipid receptors.
- component_id: papf_tip_adaptor
  label: PapF tip adaptor subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - papF
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PapF is a P pilus minor tip subunit; no exact source-neutral PapF
    family CURIE was curated for this first record.
  role: Links the distal PapG adhesin to the PapE tip fibrillum.
  evidence:
  - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
    notes: Werneburg and Thanassi 2018 review ordered PapG, PapF, PapE, PapK, PapA,
      and PapH incorporation by the P pilus chaperone-usher pathway.
- component_id: pape_tip_fibrillum_subunit
  label: PapE tip fibrillum subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - papE
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PapE is the P pilus tip-fibrillum subunit; no exact source-neutral
    PapE family CURIE was curated for this first record.
  role: Polymerizes into the short flexible fibrillum at the pilus tip.
  evidence:
  - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
    notes: Werneburg and Thanassi 2018 describe repeated PapE subunits between PapF
      and PapK within the P pilus tip fibrillum.
- component_id: papk_tip_adaptor
  label: PapK tip adaptor subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - papK
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PapK is the P pilus minor subunit that couples the tip fibrillum
    to the rod; no exact source-neutral PapK family CURIE was curated for this first
    record.
  role: Connects the PapE tip fibrillum to the PapA helical rod.
  evidence:
  - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
    notes: Werneburg and Thanassi 2018 place PapK between the PapE tip fibrillum and
      the PapA rod in the P pilus assembly order.
- component_id: paph_terminator
  label: PapH terminator subunit
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - papH
  stoichiometry: 1 basal terminator per assembled rod
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PapH is the P pilus rod-terminating and anchoring subunit; no exact
    source-neutral PapH family CURIE was curated for this first record.
  role: Terminates PapA rod extension and anchors the completed pilus at the outer
    membrane.
  evidence:
  - reference: DOI:10.1038/sj.embor.7400833
    notes: Verger et al. 2006 analyzed PapH-dependent P pilus termination in uropathogenic
      Escherichia coli.
taxonomic_distribution:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  presence: VARIABLE
  note: P pili are chaperone-usher adhesive appendages encoded by pap operons in uropathogenic
    Escherichia coli rather than universal E. coli structures.
  reference: DOI:10.1128/ecosalplus.ESP-0007-2017
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Uropathogenic E. coli P pili are the experimental model for PapA rod biogenesis,
    PapG tip-mediated adhesion, and PapH termination.
  reference: DOI:10.1128/ecosalplus.ESP-0007-2017
functions:
- function_id: p_pilus_assembly
  label: P pilus assembly
  description: The PapD chaperone and PapC usher polymerize PapG, PapF, PapE, PapK,
    PapA, and PapH subunits in a defined order to build the tip fibrillum, helical
    rod, and basal terminator of the P pilus.
  evidence:
  - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
    notes: Werneburg and Thanassi 2018 review P pilus assembly as an ordered PapD/PapC
      chaperone-usher pathway.
  - reference: DOI:10.1038/nrmicro.2017.40
    notes: Hospenthal, Costa and Waksman 2017 review P pili within the broader chaperone-usher
      pilus biogenesis pathway.
- function_id: galabiose_dependent_adhesion
  label: Gal-alpha(1-4)Gal-dependent adhesion
  description: The distal PapG adhesin binds host globoseries glycolipids that present
    a Gal-alpha(1-4)Gal receptor epitope.
  evidence:
  - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
    notes: Werneburg and Thanassi 2018 review PapG-mediated binding of P pili to globoseries
      glycolipid receptors.
evidence:
- reference: DOI:10.1128/ecosalplus.ESP-0007-2017
  notes: Werneburg GT and Thanassi DG 2018, 'Pili Assembled by the Chaperone/Usher
    Pathway in Escherichia coli and Salmonella', EcoSal Plus.
- reference: DOI:10.1038/nrmicro.2017.40
  notes: Hospenthal MK, Costa TRD and Waksman G 2017, 'A comprehensive guide to pilus
    biogenesis in Gram-negative bacteria', Nature Reviews Microbiology.
- reference: DOI:10.1016/j.cell.2015.11.049
  notes: Hospenthal MK et al. 2016, 'Structure of a Chaperone-Usher Pilus Reveals
    the Molecular Basis of Rod Uncoiling', Cell.
- reference: DOI:10.1371/journal.ppat.0030073
  notes: Verger D et al. 2007, 'Crystal Structure of the P Pilus Rod Subunit PapA',
    PLOS Pathogens.
- reference: DOI:10.1038/sj.embor.7400833
  notes: Verger D et al. 2006, 'Molecular mechanism of P pilus termination in uropathogenic
    Escherichia coli', EMBO Reports.
causal_graphs:
- graph_id: pap_chaperone_usher_tip_rod_assembly
  title: PapD and PapC assemble the P pilus tip and rod
  description: PapD carries pilus subunits to the PapC usher. PapC initiates assembly
    with the distal PapG adhesin, then incorporates PapF, PapE, and PapK to build
    the tip fibrillum, PapA repeatedly to form the rod, and PapH to terminate and
    anchor the completed appendage.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
