    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: papd_chaperone
    predicate: delivers to
    object: papc_usher
    description: PapD stabilizes folded P pilus subunits and delivers them to the
      PapC outer-membrane usher.
    evidence:
    - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
      notes: Werneburg and Thanassi 2018 review the PapD periplasmic chaperone and
        PapC usher steps of P pilus biogenesis.
  - subject: papc_usher
    predicate: starts assembly with
    object: papg_adhesin
    description: The PapC usher starts P pilus biogenesis with the distal PapG adhesin.
    evidence:
    - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
      notes: Werneburg and Thanassi 2018 describe ordered P pilus subunit incorporation
        beginning with PapG.
  - subject: papg_adhesin
    predicate: connects to
    object: papf_tip_adaptor
    description: PapG caps the distal end of the P pilus and connects to PapF.
    evidence:
    - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
      notes: Werneburg and Thanassi 2018 review PapF as the next incorporated subunit
        after the PapG adhesin.
  - subject: papf_tip_adaptor
    predicate: connects to
    object: pape_tip_fibrillum_subunit
    description: PapF links the distal PapG adhesin to the PapE subunits of the tip
      fibrillum.
    evidence:
    - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
      notes: Werneburg and Thanassi 2018 place PapE after PapF in the P pilus assembly
        order.
  - subject: pape_tip_fibrillum_subunit
    predicate: connects to
    object: papk_tip_adaptor
    description: PapE subunits form the tip fibrillum, and the proximal PapE subunit
      connects to PapK before the PapA rod begins.
    evidence:
    - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
      notes: Werneburg and Thanassi 2018 place PapK between the PapE tip fibrillum
        and PapA rod subunits.
  - subject: papk_tip_adaptor
    predicate: connects to
    object: papa_major_rod_subunit
    description: PapK joins the PapE tip fibrillum to the first PapA rod subunits.
    evidence:
    - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
      notes: Werneburg and Thanassi 2018 describe PapK as the adaptor incorporated
        before the PapA rod.
  - subject: papa_major_rod_subunit
    predicate: polymerizes into
    object: p_pilus
    description: PapA is repeatedly incorporated to form the thick helical P pilus
      rod.
    evidence:
    - reference: DOI:10.1016/j.cell.2015.11.049
      notes: Hospenthal et al. 2016 resolve the helical P pilus rod as an assembly
        of PapA subunits.
  - subject: paph_terminator
    predicate: terminates
    object: p_pilus
    description: PapH terminates PapA addition and anchors the basal end of the completed
      P pilus at the outer membrane.
    evidence:
    - reference: DOI:10.1038/sj.embor.7400833
      notes: Verger et al. 2006 identify the mechanism by which PapH terminates P
        pilus growth.
  - subject: papc_usher
    predicate: carries out
    object: p_pilus_assembly
    description: The outer-membrane PapC usher polymerizes and secretes P pilus subunits
      through the envelope.
    evidence:
    - reference: DOI:10.1038/nrmicro.2017.40
      notes: Hospenthal, Costa and Waksman 2017 review outer-membrane ushers as assembly
        platforms for chaperone-usher pili.
discussions:
- discussion_id: papd_papc_boundary
  prompt: Keep PapD and PapC out of the component table for this first P pilus record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - causal_graphs#pap_chaperone_usher_tip_rod_assembly
  rationale: PapD and PapC are required for ordered P pilus biogenesis and are therefore
    shown in the assembly graph, but this record denotes the extracellular appendage
    built from PapA, PapE, PapF, PapG, PapK, and PapH rather than the periplasmic
    chaperone or outer-membrane usher that polymerizes and secretes those subunits.
  evidence:
  - reference: DOI:10.1128/ecosalplus.ESP-0007-2017
    notes: Werneburg and Thanassi 2018 distinguish PapD and PapC assembly factors
      from the assembled P pilus subunits.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
- discussion_id: resolve_pap_family_groundings
  prompt: Resolve exact source-neutral family groundings for the PapA, PapG, PapF,
    PapE, PapK, and PapH constituent subunits.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#papa_major_rod_subunit
  - components#papg_tip_adhesin
  - components#papf_tip_adaptor
  - components#pape_tip_fibrillum_subunit
  - components#papk_tip_adaptor
  - components#paph_terminator
  rationale: The record intentionally uses reviewed labels for the E. coli P pilus
    subunits until InterPro, Pfam, or NCBIfam accessions can be verified without overclaiming
    a broader chaperone-usher domain as an exact subunit family.
  posed_by: codex
  posed_date: '2026-09-11'
