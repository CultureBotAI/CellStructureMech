  edges:
  - subject: arlk_pibd
    predicate: matures
    object: prearchaellin
    description: A type-IV-prepilin-peptidase-like enzyme cleaves prearchaellins before
      they assemble into the archaellum filament.
    evidence:
    - reference: DOI:10.3389/fmicb.2015.00023
      notes: Albers and Jarrell 2015 review class-3 signal-peptide processing of prearchaellins
        by PibD or FlaK-like enzymes.
  - subject: archaellins
    predicate: polymerize into
    object: archaellum
    description: Mature archaellin subunits build the extracellular helical filament
      of the archaellum.
    evidence:
    - reference: DOI:10.1038/s41467-022-28337-1
      notes: Gambelli et al. 2022 resolved the Methanocaldococcus villosus filament
        as a polymer of alternating ArlB1 and ArlB2 archaellins.
  - subject: scaffold
    predicate: organizes
    object: arli_arlj
    description: Cytosolic ArlX or ArlCDE-family modules form scaffold and switch
      assemblies around the ATPase motor core.
    evidence:
    - reference: DOI:10.1074/jbc.M112.414383
      notes: Banerjee et al. 2012 showed that FlaX forms oligomeric rings and interacts
        with FlaI in the Sulfolobus acidocaldarius motor.
    - reference: DOI:10.1038/s41467-022-28337-1
      notes: Gambelli et al. 2022 summarize the Crenarchaeota versus Euryarchaeota
        ring modules surrounding ArlI/ArlJ.
  - subject: arlh
    predicate: regulates
    object: arli_arlj
    description: The ArlH/FlaH nucleotide state controls its interaction with ArlI/FlaI
      in the motor complex.
    evidence:
    - reference: DOI:10.1111/mmi.13260
      notes: Chaudhury et al. 2016 established the nucleotide-dependent FlaH-FlaI
        interaction and its requirement for archaellum assembly and function.
  - subject: anchor
    predicate: anchors
    object: arli_arlj
    description: Envelope-side ArlF/ArlG-family proteins connect the motor complex
      to the cell envelope and S-layer.
    evidence:
    - reference: DOI:10.1016/j.str.2015.03.001
      notes: Banerjee et al. 2015 showed that FlaF binds the Sulfolobus S-layer protein
        and anchors the archaellum in the cell envelope.
  - subject: arli_arlj
    predicate: assembles and rotates
    object: archaellum
    description: ATP hydrolysis at the motor core powers assembly and rotation of
      the external archaellin filament.
    evidence:
    - reference: DOI:10.3389/fmicb.2015.00023
      notes: Albers and Jarrell 2015 review FlaI/ArlI as the ATPase that powers archaeal
        flagellum assembly and rotation.
  - subject: archaellum
    predicate: drives
    object: motility
    description: Rotation of the assembled archaellum filament propels archaeal cells
      through liquid or across semi-solid surfaces.
    evidence:
    - reference: DOI:10.3389/fmicb.2015.00023
      notes: Albers and Jarrell 2015 review archaellum rotation as the archaeal swimming
        mechanism.
