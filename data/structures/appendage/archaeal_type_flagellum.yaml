identifier: GO:0097589
label: archaeal-type flagellum
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A non-membrane-bounded archaeal motility organelle, also called the archaellum,
  whose ATP-powered membrane motor rotates one or more glycosylated type-IV-pilin-like
  archaellin filaments outside the cell to drive swimming.
definition_source: GO:0097589
mapping_status: PROPOSED
