components:
- component_id: archaellins
  label: archaellin filament subunits
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - arlA
  - arlB
  - flaA
  - flaB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Archaellins are type-IV-pilin-like filament proteins with lineage-specific
    paralogues; no exact family CURIE was curated for the full archaellin class.
  role: Glycosylated type-IV-pilin-like subunits that polymerize into the extracellular
    helical filament.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review prearchaellin processing, N-glycosylation
      and filament assembly from archaellin subunits.
  - reference: DOI:10.1038/s41467-022-28337-1
    notes: Gambelli et al. 2022 solved the Methanocaldococcus villosus archaellum
      filament and found two alternating archaellins, ArlB1 and ArlB2, in the filament.
- component_id: arli_arlj_motor
  label: ArlI/ArlJ archaellum motor core
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlI
  - arlJ
  - flaI
  - flaJ
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The ATPase and membrane-platform pair spans distinct protein families
    and historical Arl/Fla nomenclatures; no exact single family or complex CURIE
    was curated.
  role: Cytosolic AAA+ ATPase and polytopic membrane platform that assemble and rotate
    the archaellum filament by ATP hydrolysis.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review FlaI/ArlI as the assembly ATPase and FlaJ/ArlJ
      as the only polytopic membrane protein conserved in archaellum operons.
- component_id: arlh_regulator
  label: ArlH motor regulator
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - arlH
  - flaH
  essentiality: ESSENTIAL
  role: Nucleotide-dependent motor protein that interacts with ArlI/FlaI and is required
    for archaellum assembly and function in the studied motor.
  evidence:
  - reference: DOI:10.1111/mmi.13260
    notes: Chaudhury et al. 2016 tested the nucleotide-dependent FlaH-FlaI interaction
      and its requirement for archaellum motor assembly and function.
  protein_examples:
  - uniprot_id: UniProtKB:Q4J9K9
    protein_label: Archaeal flagellar ATP-binding protein FlaH
    gene_symbol: flaH
    taxon_id: NCBITaxon:330779
    taxon_label: Sulfolobus acidocaldarius DSM 639
    entry_status: REVIEWED
    retrieved_on: '2026-09-08'
    role: The single reviewed UniProtKB entry for gene flaH in Sulfolobus acidocaldarius
      DSM 639, a taxon this record names. Identifier for the component's declared
      gene symbol; it is not itself evidence that the protein is part of this structure.
    evidence:
    - reference: PMID:24103130
      notes: Banerjee A et al. 2013, ‘Insights into subunit interactions in the Sulfolobus
        acidocaldarius archaellum cytoplasmic complex.’, FEBS J. ECO:0000269 experimental
        evidence cited by UniProt for the 'Archaeal flagellum' localisation of Q4J9K9.
- component_id: arlfg_anchor
  label: ArlF/ArlG S-layer anchor
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlF
  - arlG
  - flaF
  - flaG
  essentiality: CONDITIONAL
  role: Envelope-side FlaF/FlaG module proposed to anchor the archaellum to the S-layer
    in characterized archaeal lineages; binding and complex-formation experiments
    support the model without resolving every motor contact.
  evidence:
  - reference: DOI:10.1016/j.str.2015.03.001
    notes: Banerjee et al. 2015 demonstrated binding of soluble Sulfolobus acidocaldarius
      FlaF to isolated S-layer and proposed an anchoring role; the complete FlaF/FlaG-to-motor
      bridge was not directly resolved.
  - reference: DOI:10.1038/s41564-019-0622-3
    notes: The inspected Tsai et al. 2020 primary abstract reports FlaG/FlaF complex
      formation and motility-disrupting interface mutations, supporting an S-layer-anchoring
      model. Full text was unavailable; direct contacts to the intact motor are not
      established by this abstract.
- component_id: cytosolic_scaffold
  label: ArlX/ArlCDE cytosolic scaffold
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlX
  - arlC
  - arlD
  - arlE
  - flaX
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Crenarchaeal ArlX/FlaX and euryarchaeal ArlCDE occupy analogous
    cytosolic scaffold or switch positions but are different proteins; a single exact
    family grounding would overmerge them.
  role: Lineage-specific cytosolic ring or switch module that organizes the motor
    ATPase and links the archaellum to chemotaxis control.
  evidence:
  - reference: DOI:10.1074/jbc.M112.414383
    notes: Banerjee et al. 2012 showed that crenarchaeal FlaX forms ring-shaped assemblies
      and interacts with FlaI.
  - reference: DOI:10.1038/s41467-022-28337-1
    notes: Gambelli et al. 2022 summarize ArlX in Crenarchaeota and ArlCDE in Euryarchaeota
      as cytosolic ring modules surrounding the motor.
  - reference: DOI:10.1111/febs.12534
    notes: The inspected abstract of Banerjee et al. 2013 reports that Sulfolobus
      acidocaldarius FlaX interacts with FlaI and FlaH in the cytoplasmic archaellum
      complex. The full text was not accessible for this curation.
taxonomic_distribution:
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: VARIABLE
  note: Archaella are archaeal motility organelles whose operons are patchily distributed
    across archaeal genomes.
  reference: DOI:10.3389/fmicb.2015.00023
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Litorilinea aerophila DSM 25763 forms archaellin filaments and swims after
    growth on motility plates. Other Chloroflexota candidates are supported by genome
    surveys, not equivalent experimental observations.
  reference: DOI:10.1038/s41564-025-02110-8
canonical_examples:
- taxon_id: NCBITaxon:2285
  taxon_label: Sulfolobus acidocaldarius
  note: Crenarchaeal model for biochemical characterization of FlaX ring formation
    and interaction with the motor ATPase FlaI, as reported in the inspected primary
    abstract.
  reference: DOI:10.1074/jbc.M112.414383
- taxon_id: NCBITaxon:2261
  taxon_label: Pyrococcus furiosus
  note: Euryarchaeal model for in situ cryo-ET of the archaellum machinery at the
    cell envelope.
  reference: DOI:10.7554/eLife.27470
- taxon_id: NCBITaxon:667126
  taxon_label: Methanocaldococcus villosus
  note: Source of a high-resolution heteropolymeric archaellum filament structure
    with alternating ArlB1 and ArlB2 subunits.
  reference: DOI:10.1038/s41467-022-28337-1
functions:
- function_id: archaeal_swimming_motility
  label: archaeal-type flagellum-dependent cell motility
  grounding: GO:0097590
  description: Rotation of the archaellum filament drives swimming in characterized
    archaea and in Litorilinea aerophila.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review archaellum-driven archaeal swimming and
      the ATP-powered motor that distinguishes it from ion-powered bacterial flagella.
  - reference: DOI:10.1038/s41564-025-02110-8
    notes: The study links experimentally identified archaellum filaments to swimming
      in Litorilinea aerophila.
evidence:
- reference: DOI:10.3389/fmicb.2015.00023
  notes: 'Albers SV and Jarrell KF 2015, The archaellum: how Archaea swim, Frontiers
    in Microbiology.'
- reference: DOI:10.1074/jbc.M112.414383
  notes: Banerjee et al. 2012, FlaX, a unique component of the crenarchaeal archaellum,
    forms oligomeric ring-shaped structures and interacts with the motor ATPase FlaI,
    Journal of Biological Chemistry.
- reference: DOI:10.1016/j.str.2015.03.001
  notes: Banerjee et al. 2015, FlaF is a beta-sandwich protein that anchors the archaellum
    in the archaeal cell envelope by binding the S-layer protein, Structure.
- reference: DOI:10.1111/mmi.13260
  notes: Chaudhury et al. 2016, The nucleotide-dependent interaction of FlaH and FlaI
    is essential for assembly and function of the archaellum motor, Molecular Microbiology.
- reference: DOI:10.7554/eLife.27470
  notes: Daum et al. 2017, Structure and in situ organisation of the Pyrococcus furiosus
    archaellum machinery, eLife.
- reference: DOI:10.1038/s41467-022-28337-1
  notes: Gambelli et al. 2022, An archaellum filament composed of two alternating
    subunits, Nature Communications.
- reference: DOI:10.1038/s41564-025-02110-8
  notes: Sivabalasarma et al. 2025 experimentally identified archaellum filaments
    and swimming in Litorilinea aerophila; motor architecture was assessed with genomic
    and structural predictions.
causal_graphs:
- graph_id: atp_powered_base_assembly_rotation
  title: ATP-driven basal assembly builds and rotates the archaellum filament
  description: Prearchaellins are processed and assembled by an ATP-powered ArlI/ArlJ
    motor. ArlH and lineage-specific scaffold proteins organize that motor; envelope-side
    FlaF/FlaG proteins are proposed to anchor it to the S-layer. Motor-driven filament
    rotation propels archaeal cells.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
