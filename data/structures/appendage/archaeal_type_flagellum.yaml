components:
- component_id: archaellins
  label: archaellin filament subunits
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - arlA
  - arlB
  - flaA
  - flaB
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Archaellins are type-IV-pilin-like filament proteins with lineage-specific
    paralogues; no exact family CURIE was curated for the full archaellin class.
  role: Glycosylated type-IV-pilin-like subunits that polymerize into the extracellular
    helical filament.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review prearchaellin processing, N-glycosylation
      and filament assembly from archaellin subunits.
  - reference: DOI:10.1038/s41467-022-28337-1
    notes: Gambelli et al. 2022 solved the Methanocaldococcus villosus archaellum
      filament and found two alternating archaellins, ArlB1 and ArlB2, in the filament.
- component_id: arli_arlj_motor
  label: ArlI/ArlJ archaellum motor core
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlI
  - arlJ
  - flaI
  - flaJ
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The ATPase and membrane-platform pair spans distinct protein families
    and historical Arl/Fla nomenclatures; no exact single family or complex CURIE
    was curated.
  role: Cytosolic AAA+ ATPase and polytopic membrane platform that assemble and rotate
    the archaellum filament by ATP hydrolysis.
  evidence:
  - reference: DOI:10.3389/fmicb.2015.00023
    notes: Albers and Jarrell 2015 review FlaI/ArlI as the assembly ATPase and FlaJ/ArlJ
      as the only polytopic membrane protein conserved in archaellum operons.
  - reference: DOI:10.1111/febs.12534
    notes: Banerjee et al. 2013 mapped interactions among Sulfolobus acidocaldarius
      FlaI, FlaJ and other cytoplasmic archaellum-complex proteins.
- component_id: arlh_regulator
  label: ArlH motor regulator
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - arlH
  - flaH
  essentiality: ESSENTIAL
  role: Nucleotide-dependent motor protein that interacts with ArlI/FlaI and is required
    for archaellum assembly and function in the studied motor.
  evidence:
  - reference: DOI:10.1111/mmi.13260
    notes: Chaudhury et al. 2016 tested the nucleotide-dependent FlaH-FlaI interaction
      and its requirement for archaellum motor assembly and function.
  protein_examples:
  - uniprot_id: UniProtKB:Q4J9K9
    protein_label: Archaeal flagellar ATP-binding protein FlaH
    gene_symbol: flaH
    taxon_id: NCBITaxon:330779
    taxon_label: Sulfolobus acidocaldarius DSM 639
    entry_status: REVIEWED
    retrieved_on: '2026-09-08'
    role: The single reviewed UniProtKB entry for gene flaH in Sulfolobus acidocaldarius
      DSM 639, a taxon this record names. Identifier for the component's declared
      gene symbol; it is not itself evidence that the protein is part of this structure.
    evidence:
    - reference: PMID:24103130
      notes: Banerjee A et al. 2013, ‘Insights into subunit interactions in the Sulfolobus
        acidocaldarius archaellum cytoplasmic complex.’, FEBS J. ECO:0000269 experimental
        evidence cited by UniProt for the 'Archaeal flagellum' localisation of Q4J9K9.
- component_id: arlfg_anchor
  label: ArlF/ArlG S-layer anchor
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlF
  - arlG
  - flaF
  - flaG
  essentiality: CONDITIONAL
  role: Pseudo-periplasmic stator and anchor proteins that connect the membrane motor
    to the archaeal cell envelope in characterized lineages.
  evidence:
  - reference: DOI:10.1016/j.str.2015.03.001
    notes: Banerjee et al. 2015 showed that Sulfolobus acidocaldarius FlaF binds the
      S-layer protein and anchors the archaellum in the cell envelope.
  - reference: DOI:10.7554/eLife.27470
    notes: Daum et al. 2017 place archaellum machinery at the Pyrococcus furiosus
      cell envelope by in situ cryo-electron tomography.
- component_id: cytosolic_scaffold
  label: ArlX/ArlCDE cytosolic scaffold
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - arlX
  - arlC
  - arlD
  - arlE
  - flaX
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Crenarchaeal ArlX/FlaX and euryarchaeal ArlCDE occupy analogous
    cytosolic scaffold or switch positions but are different proteins; a single exact
    family grounding would overmerge them.
  role: Lineage-specific cytosolic ring or switch module that organizes the motor
    ATPase and links the archaellum to chemotaxis control.
  evidence:
  - reference: DOI:10.1074/jbc.M112.414383
    notes: Banerjee et al. 2012 showed that crenarchaeal FlaX forms ring-shaped assemblies
      and interacts with FlaI.
  - reference: DOI:10.1038/s41467-022-28337-1
    notes: Gambelli et al. 2022 summarize ArlX in Crenarchaeota and ArlCDE in Euryarchaeota
      as cytosolic ring modules surrounding the motor.
