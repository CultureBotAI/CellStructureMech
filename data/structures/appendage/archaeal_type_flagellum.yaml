identifier: GO:0097589
label: archaeal-type flagellum
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A non-membrane-bounded motility organelle, also called the archaellum,
  characterized in Archaea and in the bacterium Litorilinea aerophila; a membrane-associated
  motor drives swimming through rotation of extracellular type-IV-pilin-like archaellin
  filaments.
definition_source: DOI:10.1038/s41564-025-02110-8
mapping_status: PROPOSED
