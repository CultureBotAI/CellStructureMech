identifier: GO:0009425
label: bacterial-type flagellum basal body
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: The basal cell-envelope substructure of a bacterial flagellum, consisting
  of a rod, a series of rings, Mot stator proteins, the switch complex, and the proximal
  flagellum-specific type III export apparatus.
definition_source: GO:0009425
mapping_status: PROPOSED
