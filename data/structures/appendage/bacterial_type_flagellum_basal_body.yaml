  edges:
  - subject: ms_ring
    predicate: nucleates assembly of
    object: basal_body
    description: The FliF MS ring is the first ring scaffold and organizes later basal-body
      assembly around the inner membrane.
    evidence:
    - reference: DOI:10.1038/s41467-021-24507-9
      notes: Kawamoto et al. 2021 support the MS ring as a basal-body core and template
        for flagellar assembly.
  - subject: c_ring
    predicate: assembles on
    object: ms_ring
    description: The FliG/FliM/FliN C ring attaches to the cytoplasmic face of the
      FliF MS ring.
    evidence:
    - reference: DOI:10.1038/s41467-021-24507-9
      notes: Kawamoto et al. 2021 analyzed C-ring symmetry in native Salmonella basal
        bodies relative to the FliF MS ring.
  - subject: export_apparatus
    predicate: is housed by
    object: ms_ring
    description: The export gate lies in the central opening of the MS ring to secrete
      axial subunits.
    evidence:
    - reference: DOI:10.1038/s41467-021-24507-9
      notes: Kawamoto et al. 2021 linked the 23-subunit core of the M ring to a pore
        sized for the flagellar protein export gate.
  - subject: export_apparatus
    predicate: exports subunits for
    object: rod
    description: The flagellar export apparatus delivers the FliE, FlgB, FlgC, FlgF
      and FlgG axial proteins used to build the rod.
    evidence:
    - reference: DOI:10.1146/annurev.micro.57.030502.090832
      notes: Macnab 2003 reviews export of rod and other axial subunits through the
        flagellum-specific type III export apparatus.
    - reference: DOI:10.1016/0022-2836(92)90958-m
      notes: Kubori et al. 1992 used Salmonella assembly intermediates to place FliE
        and the FlgB/FlgC/FlgF/FlgG proteins in the rod assembly pathway.
  - subject: lp_rings
    predicate: form bushing around
    object: rod
    description: The L and P rings surround the distal rod to let it rotate through
      the Gram-negative outer envelope.
    evidence:
    - reference: DOI:10.1038/s41467-021-24715-3
      notes: Yamaguchi et al. 2021 resolved the FlgH/FlgI LP ring encircling the Salmonella
        distal rod.
  - subject: stator
    predicate: applies torque to
    object: c_ring
    description: Ion flow through MotA/MotB drives MotA rotation, which pushes against
      FliG in the C ring.
    evidence:
    - reference: DOI:10.1038/s41564-020-0788-8
      notes: Deme et al. 2020 model the stator complex as a rotating MotA pentamer
        meshing with FliG.
  - subject: c_ring
    predicate: drives
    object: rotation
    description: Torque on the C ring turns the MS ring and rod as the basal-body
      rotor.
    evidence:
    - reference: DOI:10.1016/j.cell.2021.03.057
      notes: Tan et al. 2021 resolved the structural path used to transmit torque
        from the MS ring into the rod.
