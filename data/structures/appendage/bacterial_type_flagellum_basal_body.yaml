- component_id: export_apparatus
  label: flagellar type III membrane export gate (FlhA, FlhB, FliP, FliQ, FliR)
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  gene_symbols:
  - flhA
  - flhB
  - fliP
  - fliQ
  - fliR
  essentiality: ESSENTIAL
  role: Membrane export gate housed inside the basal body that works with the cytoplasmic
    FliH/FliI/FliJ ATPase complex to secrete axial rod, hook and filament subunits.
  evidence:
  - reference: DOI:10.1146/annurev.micro.57.030502.090832
    notes: Macnab 2003 reviews export of axial flagellar substrates through the basal-body
      export apparatus during ordered flagellum assembly.
