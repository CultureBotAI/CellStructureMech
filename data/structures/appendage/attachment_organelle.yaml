identifier: GO:0033099
label: attachment organelle
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A membrane-bounded polar cell extension in Mycoplasma species that concentrates
  cytadherence and cytoskeletal proteins for host-cell attachment, gliding motility,
  and organelle-linked cell division.
definition_source: GO:0033099
mapping_status: PROPOSED
