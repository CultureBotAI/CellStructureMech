discussions:
- discussion_id: exclude_c_ring_export_gate_rod_and_collars
  prompt: Should the C ring, export apparatus, rod, or accessory collar proteins be
    curated as MS-ring components?
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#flif
  rationale: The mature GO:0009431 MS ring is scoped to the FliF ring embedded in
    the cytoplasmic membrane. The FliG/FliM/FliN C ring assembles on the cytoplasmic
    face, the flagellar export gate sits in the center of the MS ring, FliE and the
    rod extend distally from it, and species-specific collar proteins decorate broader
    basal-body or motor assemblies rather than the core MS ring.
  resolution_note: 'Declined: keep FliF as the only mature MS-ring constituent and
    represent the adjoining C ring, export apparatus, rod and collars outside this
    record''s component list.'
  posed_by: claude
  posed_date: '2026-09-08'
  resolved_date: '2026-09-08'
