functions:
- function_id: inner_membrane_basal_body_anchor
  label: inner-membrane basal-body anchoring
  description: The FliF MS ring forms the cytoplasmic-membrane platform that mounts
    the bacterial flagellar basal body.
  evidence:
  - reference: DOI:10.1128/JB.181.23.7149-7153.1999
    notes: Macnab 1999 reviews the MS ring as the membrane-embedded base of the bacterial
      flagellar basal body.
  - reference: DOI:10.1038/s41467-021-24507-9
    notes: Kawamoto et al. 2021 structurally resolved the Salmonella MS ring as the
      core ring of the native basal body.
- function_id: rotor_export_gate_template
  label: rotor and export-gate templating
  description: The MS ring provides the scaffold on which the C ring assembles and
    a central opening that accommodates the flagellar export gate.
  evidence:
  - reference: DOI:10.1038/s41467-021-24507-9
    notes: Kawamoto et al. 2021 related Salmonella C-ring symmetry and the export-gate
      opening to the 34-subunit native MS ring.
