identifier: GO:0097609
label: longitudinal flagellum
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A motile cilium found in dinoflagellates. It trails the cell and acts
  as a steering rudder. It is often partially contained in a furrow called the sulcus,
  and emerges from a flagellar pore located in the sulcus. The posteriorly directed
  eukaryotic flagellum of dinoflagellates that emerges from the ventral flagellar
  pore, lies along the longitudinal sulcus furrow, and trails behind the cell body.
  Together with the transverse flagellum, the longitudinal flagellum beats with planar
  waves to provide directional steering and forward propulsion in free-living and
  symbiotic dinoflagellates.
