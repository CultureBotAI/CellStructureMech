identifier: cellstructuremech:archaeal_type_flagellum_filament
label: archaeal-type flagellum filament
structure_category: APPENDAGE
structure_kind: FILAMENT
definition: An extracellular helical archaellum filament assembled from glycosylated
  type-IV-pilin-like archaellin subunits and rotated by the archaeal-type flagellum
  motor to propel archaeal cells.
definition_source: DOI:10.3389/fmicb.2015.00023
mapping_status: PROPOSED
