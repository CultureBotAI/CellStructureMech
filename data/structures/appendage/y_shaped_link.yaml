identifier: GO:0097537
label: Y-shaped link
structure_category: APPENDAGE
structure_kind: MULTIPROTEIN_COMPLEX
definition: A Y-shaped protein complex in the ciliary transition zone that connects
  the cilium axoneme to the ciliary necklace. Both protein sorting and protein gating
  occur at this point in the cilium allowing some, but not all proteins to enter the
  cilium.
