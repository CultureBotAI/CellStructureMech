discussions:
- discussion_id: linker_not_transition_zone_or_transition_fiber
  prompt: Distinguish the Y-shaped linker subassembly from adjacent ciliary structures.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: The existing ciliary-transition-zone record already mentions Y-linkers
    as an architectural component, but denotes the whole region. GO:0097537 denotes
    the discrete linker complex and is linked here by part_of, not treated as a synonym
    of that region.
  notes: 'This record excludes GO:0097539 external transition fibers, the luminal
    stellate-fiber system and the central cylinder. Y-links and longitudinal wedge
    densities are not declared exact synonyms: the primary study explicitly leaves
    their equivalence unresolved.'
  evidence:
  - reference: GO:0097537
    notes: Exact linker subassembly identity.
  - reference: GO:0035869
    notes: Enclosing transition-zone region.
  - reference: GO:0097539
    notes: Distinct external basal-body-to-membrane transition fibers.
  - reference: DOI:10.1083/jcb.201006105
    notes: The Discussion distinguishes known Y-link morphology from unresolved wedge
      equivalence.
  posed_by: codex
  posed_date: '2026-10-04'
  resolved_date: '2026-10-04'
