  edges:
  - subject: cep290
    predicate: supports normal architecture of
    object: y_link
    description: In Chlamydomonas, CEP290 supports normal connector architecture;
      its loss removes most Y-links but does not eliminate every connector.
    evidence:
    - reference: DOI:10.1083/jcb.201006105
      notes: Figures 3C-D and 4 combine mutant cross sections with immunogold placement.
        Rare surviving Y-connectors limit the claim to normal architecture rather
        than absolute assembly dependence.
  - subject: y_link
    predicate: contributes to
    object: membrane_tethering
    description: Y-links participate in the connector ensemble that tethers the transition-zone
      membrane to doublet microtubules.
    evidence:
    - reference: DOI:10.1083/jcb.201006105
      notes: Figure 3 shows cross-sectional links between doublets and membrane; connector
        disruption accompanies increased membrane spacing and loss of membrane retention
        after detergent extraction. Wedge densities are also affected, so this is
        not Y-link-specific sufficiency.
