components:
- component_id: cep290
  label: Centrosomal protein of 290kDa
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR026201
  grounding_notes: 'The InterPro authority identifies IPR026201 as the CEP290 protein
    family, not the whole Y-link complex. No organism-specific accession is asserted:
    current Chlamydomonas UniProt search results require reconciliation with the experimentally
    studied CEP290/POC3 sequence.'
  gene_symbols:
  - CEP290
  - POC3
  essentiality: UNKNOWN
  role: A linker-associated constituent supporting normal microtubule-membrane connector
    architecture in Chlamydomonas. It is not the entire linker; rare Y-connectors
    persist in the cep290 null mutant, so absolute assembly essentiality is not asserted.
  evidence:
  - reference: DOI:10.1083/jcb.201006105
    notes: Immunogold localization in Figure 4 places the middle region of CEP290
      on or near Y-connectors; Figure 3 shows most connectors absent or abnormal in
      the deletion mutant. The authors explicitly report rare remaining Y-connectors
      and infer additional constituents.
  - reference: InterPro:IPR026201
    notes: Live InterPro metadata verifies the family type and the canonical label
      Centrosomal protein of 290kDa; it does not supply linker stoichiometry.
canonical_examples:
- taxon_id: NCBITaxon:3055
  taxon_label: Chlamydomonas reinhardtii
  note: Wild-type, cep290 deletion and complemented cells were examined. Transition-zone
    cross sections resolve peripheral Y-connectors; immunogold microscopy and detergent-extraction
    assays link CEP290 to connector architecture and membrane attachment.
  reference: DOI:10.1083/jcb.201006105
functions:
- function_id: transition_zone_membrane_tethering
  label: transition-zone membrane tethering
  description: Microtubule-membrane connectors physically couple the transition-zone
    doublets to the surrounding ciliary membrane. The Chlamydomonas evidence concerns
    the connector ensemble, not purified Y-links acting alone.
  evidence:
  - reference: DOI:10.1083/jcb.201006105
    notes: Figure 3 compares connector defects with greater and more variable membrane
      spacing and loss of detergent-resistant membrane attachment in cep290 cells.
causal_graphs:
- graph_id: cep290_dependent_connector_tethering
  title: CEP290-supported connector architecture and membrane tethering
  description: A bounded physical mechanism supported by Chlamydomonas localization,
    mutant ultrastructure and membrane-extraction experiments.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: The experiment perturbs CEP290 and affects both Y-connectors and longitudinal
    wedge densities. It supports connector-mediated tethering, not a Y-link-only sufficiency
    assay, direct CEP290-lipid binding, an absolute requirement for every linker,
    or a molecular gating pathway.
