identifier: GO:0097729
label: 9+2 motile cilium
structure_category: APPENDAGE
structure_kind: APPENDAGE
definition: A motile cilium where the axoneme has a ring of nine outer microtubule
  doublets plus two central microtubules (and is therefore called a 9+2 axoneme).
  A canonical motile cilium (or eukaryotic flagellum) whose axoneme consists of nine
  peripheral microtubule doublets surrounding a central pair of singlet microtubules
  (the 9+2 arrangement). Conserved across Chlamydomonas reinhardtii, Tetrahymena thermophila,
  and Trypanosoma brucei, the 9+2 motile cilium integrates central pair projections,
  radial spokes, nexin-dynein regulatory complexes, and dynein arms to produce planar
  or ciliary waveforms.
