components:
- component_id: axoneme
  label: axoneme
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005930
  essentiality: ESSENTIAL
  role: Microtubule-based core of the cilium; 9+2 axonemes in Chlamydomonas motile
    cilia carry outer doublets, a central pair, dynein arms, radial spokes and regulatory
    linkers. Functions in 9+2 motile cilium axoneme assembly and waveform regulation
    in 9+2 motile cilium.
  evidence:
  - reference: GO:0005930
    notes: GO:0005930 identifies the axoneme as the microtubule and protein core of
      eukaryotic cilia and flagella.
  - reference: DOI:10.1126/science.1128618
    notes: Nicastro et al. 2006 resolved the 9+2 Chlamydomonas axoneme architecture
      by cryoelectron tomography.
- component_id: ciliary_membrane
  label: ciliary membrane
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0060170
  essentiality: ESSENTIAL
  role: Specialized plasma-membrane extension that surrounds the axoneme and houses
    ciliary membrane proteins. Functions in 9+2 motile cilium axoneme assembly and
    waveform regulation in 9+2 motile cilium.
  evidence:
  - reference: GO:0060170
    notes: GO:0060170 defines the ciliary membrane as the portion of plasma membrane
      surrounding a cilium.
  - reference: DOI:10.1083/jcb.200504008
    notes: Pazour et al. 2005 identified proteins in purified Chlamydomonas flagella,
      including signal-transduction and membrane-associated candidates.
- component_id: ciliary_basal_body
  label: ciliary basal body
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0036064
  essentiality: ESSENTIAL
  role: Centriole-derived microtubule cylinder at the ciliary base that anchors the
    organelle and nucleates axoneme growth. Functions in 9+2 motile cilium axoneme
    assembly and waveform regulation in 9+2 motile cilium.
  evidence:
  - reference: GO:0036064
    notes: GO:0036064 defines the ciliary basal body as the membrane-tethered microtubule
      array at the base of a eukaryotic cilium.
  - reference: DOI:10.1104/pp.010807
    notes: Silflow and Lefebvre 2001 reviewed basal bodies as the centriolar organizers
      of Chlamydomonas flagella.
- component_id: ciliary_transition_zone
  label: ciliary transition zone
  component_type: OTHER
  component_role: CONSTITUENT
  grounding: GO:0035869
  essentiality: UNKNOWN
  role: Gated region between the basal body and ciliary shaft that links axonemal
    doublets to the ciliary membrane and helps separate ciliary contents from the
    cytosol. Functions in 9+2 motile cilium axoneme assembly and waveform regulation
    in 9+2 motile cilium.
  evidence:
  - reference: GO:0035869
    notes: GO:0035869 defines the ciliary transition zone by Y-shaped links between
      axonemal microtubules and the ciliary membrane.
  - reference: GO:0097546
    notes: GO:0097546 places transition fibers and the transition zone at the ciliary
      base where proteins are sorted before cilium entry.
- component_id: intraciliary_transport_particle
  label: intraciliary transport particle
  component_type: PROTEIN_COMPLEX
  component_role: ASSOCIATED_MACHINERY
  grounding: GO:0030990
  essentiality: UNKNOWN
  role: IFT protein-particle complex that moves ciliary cargo bidirectionally along
    axonemal microtubules to assemble and maintain the cilium. Functions in 9+2 motile
    cilium axoneme assembly and waveform regulation in 9+2 motile cilium.
  evidence:
  - reference: GO:0030990
    notes: GO:0030990 identifies the intraciliary transport particle protein complex.
  - reference: DOI:10.1038/nrm952
    notes: Rosenbaum and Witman 2002 review IFT particles as transport machinery for
      cilium and flagellum assembly and maintenance.
