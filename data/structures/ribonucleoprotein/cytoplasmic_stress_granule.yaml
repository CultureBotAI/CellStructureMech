functions:
- function_id: mrnp_triage_during_stress
  label: mRNP triage during stress
  description: Cytoplasmic stress granules concentrate nontranslating mRNPs and translation-initiation
    components when yeast cells encounter glucose deprivation or heat shock.
  evidence:
  - reference: DOI:10.1083/jcb.200807043
    notes: Buchan, Muhlrad and Parker 2008 connected yeast stress granules to remodeling
      of mRNPs that had accumulated in preexisting P-bodies.
  - reference: DOI:10.1242/jcs.045104
    notes: Grousl et al. 2009 found that robust heat shock induces Saccharomyces stress
      granules with eIF3 and 40S ribosomal subunit markers.
evidence:
