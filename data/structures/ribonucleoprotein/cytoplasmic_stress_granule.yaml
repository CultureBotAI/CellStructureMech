components:
- component_id: stalled_mrna_cargo
  label: stalled stress-granule mRNA cargo
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Stress-granule mRNA cargo is the translationally stalled mRNA pool
    captured in cytoplasmic stress granules; no exact Sequence Ontology or GO CURIE
    for this stress-granule-localized mRNA state was curated in this first record.
  role: Translationally stalled mRNAs that concentrate in cytoplasmic stress granules
    under glucose deprivation.
  evidence:
  - reference: DOI:10.1083/jcb.200807043
    notes: Buchan, Muhlrad and Parker 2008 analyzed yeast stress granules formed by
      nontranslating mRNPs under glucose deprivation.
- component_id: pab1_pub1_pbp1_rna_binding_markers
  label: Pab1/Pub1/Pbp1 stress-granule RNA-binding markers
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - PAB1
  - PUB1
  - PBP1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Pab1, Pub1 and Pbp1 are curated as yeast RNA-binding stress-granule
    markers or assembly inputs; no exact source-neutral InterPro, Pfam or NCBIfam
    accession covers the full cohort.
  role: Pab1 and Pub1 mark glucose-deprivation stress granules, while Pub1 and Pbp1
    promote visible granule assembly.
  evidence:
  - reference: DOI:10.1083/jcb.200807043
    notes: Buchan, Muhlrad and Parker 2008 used Pab1 and Pub1 as yeast stress-granule
      markers and linked Pub1 and Pbp1 to stress-granule assembly.
  - reference: DOI:10.1371/journal.pone.0010006
    notes: Swisher and Parker 2010 assayed Pbp1, Pbp4, Lsm12, Dhh1 and Pab1 localization
      and effects on Saccharomyces stress granules.
- component_id: eif3_40s_translation_initiation_cohort
  label: eIF3/40S translation-initiation cohort
  component_type: OTHER
  component_role: CONSTITUENT
  gene_symbols:
  - TIF32
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Robust heat-shock stress granules contain eIF3 and 40S small ribosomal
    subunit markers; this mixed protein/RNP cohort is not identical to the exact GO
    eIF3 complex term or to the exact 40S ribosomal subunit.
  role: Translation-initiation components, including eIF3a/Tif32 and 40S small ribosomal
    subunits, that mark robust heat-shock stress granules in budding yeast.
  evidence:
  - reference: DOI:10.1242/jcs.045104
    notes: Grousl et al. 2009 showed that robust heat-shock stress granules in Saccharomyces
      contain eIF3 and small but not large ribosomal subunits.
