causal_graphs:
- graph_id: yeast_stress_granule_assembly
  title: Yeast mRNPs and RNA-binding proteins assemble stress granules
  description: In Saccharomyces cerevisiae, stalled mRNP cargo localizes to cytoplasmic
    stress granules during glucose deprivation, Pab1/Pub1/Pbp1 RNA-binding markers
    or inputs support visible granule assembly, and heat-shock-localized eIF3/40S
    translation-initiation components concentrate in cytoplasmic stress granules,
    while P-bodies promote stress-granule assembly during glucose deprivation.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph summarizes yeast glucose-deprivation and robust heat-shock
    stress-granule assembly inputs without asserting a complete condensate interaction
    network or flattening the stress-specific composition into one universal component
    set.
  nodes:
  - node_id: stalled_mrna_cargo
    label: stalled stress-granule mRNA cargo
    node_type: RNA
    component_ref: stalled_mrna_cargo
