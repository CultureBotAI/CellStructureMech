identifier: GO:0071017
label: U12-type catalytic step 1 spliceosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that is formed by the displacement of the U11 and
  U4atac snRNPs from the precatalytic spliceosome; the U12, U5 and U6atac snRNPs remain
  associated with the mRNA. This complex, sometimes called the activated spliceosome,
  is the catalytically active form of the spliceosome, and includes many proteins
  in addition to those found in the U12, and U5 and U6atac snRNPs.
