discussions:
- discussion_id: resolve_rnase_p_component_boundaries
  prompt: Resolve source-neutral component boundaries across RNase P complex lineages.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - causal_graphs#rnase_p_trna_leader_cleavage
  rationale: GO:0030677 captures the shared RNase P ribonucleoprotein identity and
    pre-tRNA 5-prime leader cleavage function, while its term comment flags that chloroplast
    complexes called RNase P appear not to contain RNA. Exact RNA and protein components
    should be curated on source-specific dimeric, multimeric, nucleolar, cyanelle
    and mitochondrial children before assigning source-neutral constituents to this
    generic parent; chloroplast or other RNA-free RNase P-like complexes need separate
    protein-only modeling instead of inheriting a generic RNase P RNA component.
  evidence:
  - reference: GO:0030677
  - reference: GO:0030680
  - reference: GO:0030681
  - reference: GO:0030678
