components:
- component_id: pre_35s_rrna
  label: 35S pre-rRNA
  component_type: RNA
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral Sequence Ontology class for the budding-yeast
    35S precursor ribosomal RNA was assigned in this pass; SO:0002393 denotes the
    broader precursor_RNA class, not 35S pre-rRNA specifically.
  role: Precursor ribosomal RNA constituent of budding-yeast 90S preribosomes.
  evidence:
  - reference: GO:0030686
    notes: GO:0030686 defines the budding-yeast 90S preribosome as containing 35S
      pre-rRNA.
  - reference: DOI:10.1016/s1097-2765(02)00579-8
    notes: Grandi et al. 2002 characterized early 90S pre-ribosomal particles that
      coprecipitated 35S pre-rRNA.
- component_id: u3_snorna
  label: U3 snoRNA
  component_type: RNA
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral RNA ontology class for U3 snoRNA was verified
    in this pass; GO:0030686 and the Grandi et al. 2002 PubMed record support U3 membership
    of 90S pre-ribosomal particles.
  role: Small nucleolar RNA constituent associated with the budding-yeast 90S preribosome
    through the U3 snoRNP.
  evidence:
  - reference: GO:0030686
    notes: GO:0030686 defines the budding-yeast 90S preribosome as containing U3 snoRNA.
  - reference: DOI:10.1016/s1097-2765(02)00579-8
    notes: Grandi et al. 2002 characterized 90S pre-ribosomal particles that coprecipitated
      U3 snoRNA and included the U3 snoRNP.
- component_id: early_90s_protein_cohort
  label: 90S preribosome protein cohort
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The 90S preribosome contains early-associating ribosomal proteins
    and associated processing factors, but exact source-neutral InterPro, Pfam, NCBIfam,
    Complex Portal or GO boundaries for that heterogeneous protein cohort were not
    assigned in this first record.
  role: Early-associating mostly small-subunit ribosomal proteins and associated 40S
    subunit processing factors in the 90S preribosome.
  evidence:
  - reference: GO:0030686
    notes: GO:0030686 describes early-associating ribosomal proteins, most of which
      are part of the small ribosomal subunit, and associated proteins in the budding-yeast
      90S preribosome.
  - reference: DOI:10.1016/s1097-2765(02)00579-8
    notes: Grandi et al. 2002 identified non-ribosomal proteins, including U3-associated
      proteins and other 18S-rRNA synthesis factors, in 90S pre-ribosomal particles.
