identifier: GO:0030686
label: 90S preribosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A large ribonucleoprotein complex considered to be the earliest preribosomal
  complex. In S. cerevisiae, it has a size of 90S and consists of the 35S pre-rRNA,
  early-associating ribosomal proteins most of which are part of the small ribosomal
  subunit, the U3 snoRNA and associated proteins.
