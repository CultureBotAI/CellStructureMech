  grounding_notes: The 90S preribosome contains early-associating ribosomal proteins
    and associated processing factors, but exact source-neutral InterPro, Pfam, NCBIfam,
    Complex Portal or GO boundaries for that heterogeneous protein cohort were not
    assigned in this first record.
  role: Early-associating mostly small-subunit ribosomal proteins and associated 40S
    subunit processing factors in the 90S preribosome.
  evidence:
  - reference: GO:0030686
    notes: GO:0030686 describes early-associating ribosomal proteins, most of which
      are part of the small ribosomal subunit, and associated proteins in the budding-yeast
      90S preribosome.
  - reference: DOI:10.1016/s1097-2765(02)00579-8
    notes: Grandi et al. 2002 identified non-ribosomal proteins, including U3-associated
      proteins and other 18S-rRNA synthesis factors, in 90S pre-ribosomal particles.
