functions:
- function_id: ribosome_biogenesis
  label: ribosome biogenesis
  grounding: GO:0042254
  description: As an early preribosomal ribonucleoprotein, the 90S preribosome contributes
    to assembly of ribosomal subunits.
  evidence:
  - reference: GO:0042254
    notes: GO:0042254 is the Gene Ontology biological-process term for ribosome biogenesis.
  - reference: GO:0030684
    notes: GO:0030684 defines preribosomal complexes as being formed during ribosome
      biogenesis.
  - reference: DOI:10.1016/s1097-2765(02)00579-8
    notes: Grandi et al. 2002 characterized early pre-ribosomal particles and their
      association with 40S subunit assembly factors.
