identifier: GO:0005691
label: U6atac snRNP
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonucleoprotein complex that contains small nuclear RNA U6atac, the
  Lsm2-8 heptameric ring complex, as well as several proteins that are unique to the
  U6atac snRNP, most of which remain associated with the U6atac snRNA both while the
  U6atac snRNP is free or assembled into the U4atac/U6atac snRNP or into a series
  of spliceosomal complexes.
