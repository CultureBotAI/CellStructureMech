identifier: GO:0071005
label: U2-type precatalytic spliceosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that is formed by the recruitment of the preassembled
  U4/U6.U5 tri-snRNP to the prespliceosome. Although all 5 snRNPs are present, the
  precatalytic spliceosome is catalytically inactive. The precatalytic spliceosome
  includes many proteins in addition to those found in the U1, U2 and U4/U6.U5 snRNPs.
