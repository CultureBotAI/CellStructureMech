functions:
- function_id: preactivation_snrnp_organization
  label: preactivation snRNP and pre-mRNA organization
  description: The precatalytic B complex holds U2 snRNP, U4/U6.U5 tri-snRNP and pre-mRNA
    in the spliceosomal assembly state that precedes active-site formation and first-step
    catalysis.
  evidence:
  - reference: GO:0071005
    notes: GO:0071005 identifies this complex as a catalytically inactive spliceosomal
      state containing all five snRNPs.
  - reference: DOI:10.1038/nature22799
    notes: Plaschka, Lin and Nagai 2017 structurally analyzed the yeast pre-catalytic
      B complex and inferred events leading to spliceosomal active-site formation.
