causal_graphs:
- graph_id: u2_type_b_complex_assembly
  title: U4/U6.U5 tri-snRNP recruitment forms the precatalytic B complex
  description: The U2-type precatalytic spliceosome forms when preassembled U4/U6.U5
    tri-snRNP joins the U1- and U2-containing prespliceosome on pre-mRNA, creating
    a catalytically inactive complex poised for RNA-RNA remodeling.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph records the defining snRNP assemblies and the U2/U6 interface
    observed in a yeast B-complex structure without modeling U1 handoff, Prp28-dependent
    remodeling, Brr2 helicase activation or all B-complex protein factors.
  nodes:
  - node_id: u1_snrnp
    label: U1 snRNP
    node_type: STRUCTURE
    grounding: GO:0005685
    component_ref: u1_snrnp
  - node_id: u2_snrnp
    label: U2 snRNP
    node_type: STRUCTURE
    grounding: GO:0005686
    component_ref: u2_snrnp
  - node_id: u4_u6_u5_tri_snrnp
    label: U4/U6 x U5 tri-snRNP complex
    node_type: STRUCTURE
    grounding: GO:0046540
    component_ref: u4_u6_u5_tri_snrnp
  - node_id: u2_type_prespliceosome
    label: U2-type prespliceosome
    node_type: STRUCTURE
    grounding: GO:0071004
  - node_id: u2_type_precatalytic_spliceosome
    label: U2-type precatalytic spliceosome
    node_type: STRUCTURE
    grounding: GO:0071005
  edges:
  - subject: u1_snrnp
    predicate: associates with
    object: u2_type_prespliceosome
    description: The U2-type prespliceosome contains U1 snRNP at the 5-prime splice
      site and U2 snRNP at the branch-point sequence.
    evidence:
    - reference: GO:0071004
      notes: GO:0071004 defines the U2-type prespliceosome by 5-prime splice-site
        association with U1 snRNP and branch-point recognition by U2 snRNP.
  - subject: u4_u6_u5_tri_snrnp
    predicate: is recruited to
    object: u2_type_prespliceosome
    description: The preassembled U4/U6.U5 tri-snRNP joins the prespliceosome to create
      the U2-type precatalytic spliceosome.
    evidence:
    - reference: GO:0071005
      notes: GO:0071005 defines the U2-type precatalytic spliceosome as the state
        formed by recruitment of U4/U6.U5 tri-snRNP to the prespliceosome.
  - subject: u2_snrnp
    predicate: interfaces with
    object: u4_u6_u5_tri_snrnp
    description: In the yeast B complex, the U2 snRNP contacts U4/U6.U5 tri-snRNP
      through U2/U6 helix II and an SF3b to U4/U6 di-snRNP interface.
    evidence:
    - reference: DOI:10.1038/nature22799
      notes: Plaschka, Lin and Nagai 2017 modeled the yeast B-complex U2/U6 helix
        II and U2 SF3b to U4/U6 di-snRNP contacts.
