  evidence:
  - reference: GO:0005689
    notes: GO:0005689 is the Gene Ontology cellular-component term for the series
      of spliceosomal complexes that form during U12-type splicing.
  - reference: GO:0071015
    notes: GO:0071015 defines the U12-type prespliceosome by cooperative binding of
      heterodimeric U11/U12 snRNP.
  - reference: GO:0071016
    notes: GO:0071016 defines the U12-type precatalytic spliceosome by U4atac/U6atac.U5
      tri-snRNP recruitment to the U12-type prespliceosome.
  - reference: GO:0071017
    notes: GO:0071017 defines the U12-type catalytic step 1 spliceosome as the state
      that retains U12, U5 and U6atac snRNPs after U11 and U4atac snRNP displacement.
