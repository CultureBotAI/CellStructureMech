components:
- component_id: u4_u6_family_snrnp
  label: U4/U6-family snRNP
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO:0097526 spans the GO:0071001 U4/U6 snRNP and the GO:0071002
    U4atac/U6atac snRNP; no single exact source-neutral CURIE exists for the alternative
    U4/U6-family snRNP subcomplex.
  role: Major- or minor-spliceosome U4/U6-family snRNP subcomplex that associates
    with U5 snRNP to form a spliceosomal tri-snRNP complex.
  evidence:
  - reference: GO:0097526
    notes: GO:0097526 defines spliceosomal tri-snRNP complexes as formed by association
      of a U4/U6 or U4atac/U6atac snRNP with U5 snRNP.
  - reference: GO:0071001
    notes: GO:0071001 is the Gene Ontology cellular-component term for the major U4/U6
      snRNP.
  - reference: GO:0071002
    notes: GO:0071002 is the Gene Ontology cellular-component term for the minor U4atac/U6atac
      snRNP.
- component_id: u5_snrnp
  label: U5 snRNP
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005682
  role: U5 small nuclear ribonucleoprotein subcomplex shared by major and minor spliceosomal
    tri-snRNP complexes.
  evidence:
  - reference: GO:0097526
    notes: GO:0097526 includes U5 snRNP as the common snRNP partner in spliceosomal
      tri-snRNP complexes.
  - reference: GO:0005682
    notes: GO:0005682 is the Gene Ontology cellular-component term for the U5 snRNP.
