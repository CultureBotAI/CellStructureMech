identifier: GO:0097526
label: spliceosomal tri-snRNP complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal snRNP complex that is formed by the association of the
  U4/U6 (or U4atac/U6atac) snRNP with the U5 snRNP.
