definition: Telomerase is a ribonucleoprotein enzyme complex, with a minimal catalytic
  core composed of a catalytic reverse transcriptase subunit and an RNA subunit that
  provides the template for telomeric DNA addition. In vivo, the holoenzyme complex
  often contains additional subunits.
