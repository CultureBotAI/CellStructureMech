identifier: GO:0005692
label: U11 snRNP
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonucleoprotein complex that contains small nuclear RNA U11, a heptameric
  ring of Sm proteins, as well as several proteins that are unique to the U11 snRNP,
  most of which remain associated with the U11 snRNA both while the U11 snRNP is free
  or assembled into a series of spliceosomal complexes.
