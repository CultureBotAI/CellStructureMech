      containing 4.5S RNA and Ffh.
- component_id: ffh_srp54_gtpase
  label: Ffh/SRP54 GTPase
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - ffh
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Ffh is the bacterial SRP54 homolog and the conserved signal-sequence-binding
    SRP GTPase; no exact source-neutral InterPro, Pfam or NCBIfam family CURIE was
    assigned in this pass.
  role: Signal-sequence-binding SRP GTPase that recognizes ribosome-nascent-chain
    complexes and pairs with the FtsY receptor GTPase during delivery to the membrane
    translocon.
  evidence:
  - reference: DOI:10.1016/j.bbamcr.2013.10.013
    notes: Saraogi and Shan 2014 reviewed Ffh as the conserved bacterial SRP protein
      subunit.
  - reference: DOI:10.1093/emboj/16.16.4880
    notes: Powers and Walter 1997 reconstituted Escherichia coli SRP-dependent targeting
      from Ffh, 4.5S RNA, FtsY and a ribosome-nascent-chain substrate.
