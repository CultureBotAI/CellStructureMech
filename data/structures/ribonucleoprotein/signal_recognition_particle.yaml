causal_graphs:
- graph_id: bacterial_srp_membrane_targeting
  title: Bacterial SRP delivers nascent membrane proteins to SecYEG
  description: In bacteria, the Ffh/SRP RNA particle binds ribosome-nascent-chain
    complexes carrying hydrophobic signal sequences and hands them to the FtsY receptor
    for delivery to the SecYEG translocon.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph records the core bacterial targeting route without modeling
    SRP conformational rearrangements, GTP hydrolysis kinetics, the translating ribosome
    or species-specific accessory factors as SRP components.
  nodes:
