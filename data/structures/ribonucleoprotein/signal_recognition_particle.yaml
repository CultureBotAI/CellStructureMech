    node_type: GENE_OR_PROTEIN
    component_ref: ffh_srp54_gtpase
  - node_id: bacterial_srp
    label: signal recognition particle
    node_type: STRUCTURE
    grounding: GO:0048500
  - node_id: ribosome_nascent_chain
    label: ribosome-nascent-chain complex
    node_type: STRUCTURE
  - node_id: ftsy_receptor
    label: FtsY SRP receptor
    node_type: GENE_OR_PROTEIN
  - node_id: secyeg_translocon
    label: SecYEG translocon complex
    node_type: STRUCTURE
