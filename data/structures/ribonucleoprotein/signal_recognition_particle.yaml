  attaches_to:
  - components#ffh_srp54_gtpase
  - causal_graphs#bacterial_srp_membrane_targeting
  rationale: The first SRP record captures the conserved Ffh/SRP54 plus SRP RNA core
    and the bacterial Ffh-4.5S RNA system. Archaeal and eukaryotic SRPs have expanded
    protein compositions that should be curated as exact grounded components or child
    records only after their source-neutral family boundaries are verified.
