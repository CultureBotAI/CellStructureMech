  - subject: ffh_srp54_gtpase
    predicate: recognizes
    object: ribosome_nascent_chain
    description: Ffh binds hydrophobic signal sequences as they emerge from translating
      ribosomes.
    evidence:
    - reference: DOI:10.1016/j.bbamcr.2013.10.013
      notes: Saraogi and Shan 2014 reviewed Ffh/SRP54 recognition of signal sequences
        on ribosome-nascent-chain complexes.
  - subject: bacterial_srp
    predicate: docks with
    object: ftsy_receptor
    description: The SRP-FtsY GTPase pair forms a receptor-bound targeting complex
      during delivery to the bacterial membrane.
    evidence:
    - reference: DOI:10.1093/emboj/16.16.4880
      notes: Powers and Walter 1997 reconstituted targeting with Escherichia coli
        SRP and the FtsY receptor.
  - subject: ftsy_receptor
    predicate: delivers cargo to
    object: secyeg_translocon
    description: The receptor-bound SRP route targets ribosome-nascent-chain complexes
      to the membrane translocon.
    evidence:
    - reference: DOI:10.1016/j.bbamcr.2013.10.013
      notes: Saraogi and Shan 2014 reviewed bacterial SRP delivery of membrane-protein
        substrates to the membrane translocation machinery through FtsY.
  - subject: bacterial_srp
    predicate: supports
    object: protein_targeting_to_membrane
    description: SRP carries hydrophobic nascent chains from the ribosome to the membrane
      targeting pathway.
    evidence:
    - reference: DOI:10.1093/emboj/16.16.4880
      notes: Powers and Walter 1997 reconstituted E. coli SRP-dependent cotranslational
        targeting.
