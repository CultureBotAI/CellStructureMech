  posed_by: codex
  posed_date: '2026-09-23'
- discussion_id: exclude_ftsy_and_translocon_as_components
  prompt: Exclude the bacterial FtsY SRP receptor and SecYEG translocon from the signal
    recognition particle component list.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - causal_graphs#bacterial_srp_membrane_targeting
  rationale: FtsY and SecYEG are receptor or destination machinery for SRP-mediated
    targeting, not constituents of the SRP ribonucleoprotein.
  evidence:
  - reference: DOI:10.1093/emboj/16.16.4880
  - reference: DOI:10.1016/j.bbamcr.2013.10.013
