discussions:
- discussion_id: lsm2_8_complex_boundary
  prompt: Keep the Lsm2-8 protein ring distinct from complete U6-family snRNPs and
    from individual Lsm proteins.
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - identifier
  - part_of
  rationale: GO:0120115 denotes the heteroheptameric Lsm2-8 protein complex, whereas
    GO:0005688 and GO:0005691 denote complete U6 and U6atac small nuclear ribonucleoprotein
    complexes that contain snRNA and additional proteins.
  resolution_note: Curated GO:0120115 as a child protein complex with U6 and U6atac
    snRNP parthood.
  evidence:
  - reference: GO:0120115
    notes: GO:0120115 identifies the Lsm2-8 complex.
  - reference: GO:0005688
    notes: GO:0005688 identifies the U6 snRNP.
  - reference: GO:0005691
    notes: GO:0005691 identifies the U6atac snRNP.
  posed_by: codex
  posed_date: '2026-09-30'
  resolved_date: '2026-09-30'
