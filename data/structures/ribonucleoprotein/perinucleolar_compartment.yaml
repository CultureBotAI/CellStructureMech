components:
- component_id: polypyrimidine_tract_binding_protein
  label: polypyrimidine tract-binding protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PTB is represented as the hnRNP I protein enriched in and required
    for the human perinucleolar compartment; no exact source-neutral InterPro, Pfam
    or NCBIfam accession was assigned in this first record.
  role: RNA-binding protein concentrated in the PNC and required with RNA polymerase
    III transcripts to maintain PNC integrity.
  evidence:
  - reference: DOI:10.1083/jcb.129.5.1181
    notes: Matera et al. 1995 identified hnRNP I/PTB as a protein concentrated in
      the perinucleolar compartment.
  - reference: DOI:10.1091/mbc.E02-12-0818
    notes: Wang et al. 2003 showed that PTB and RNA polymerase III transcripts are
      essential for perinucleolar compartment integrity.
- component_id: rna_polymerase_iii_transcripts
  label: RNA polymerase III transcript cohort
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The perinucleolar compartment contains several RNA polymerase III
    transcripts, including Y RNAs and RNase P and RNase MRP RNAs in the original human-cell
    study; no single Sequence Ontology CURIE covers this heterogeneous PNC-resident
    RNA cohort.
  role: Pol III-transcribed RNAs concentrated in the PNC and required with PTB for
    visible PNC integrity.
  evidence:
  - reference: DOI:10.1083/jcb.129.5.1181
    notes: Matera et al. 1995 found human Y RNAs, RNase P RNA and RNase MRP RNA colocalized
      in perinucleolar compartments.
  - reference: DOI:10.1091/mbc.E02-12-0818
    notes: Wang et al. 2003 showed that RNA polymerase III transcripts and PTB are
      essential for PNC integrity.
