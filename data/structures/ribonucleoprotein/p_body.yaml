  title: Yeast mRNPs and Edc3/Lsm4 scaffolds assemble P-bodies
  description: In Saccharomyces cerevisiae, nontranslating mRNPs enter cytoplasmic
    P-bodies, while Edc3 and the Q/N-rich Lsm4 tail promote aggregation into microscopically
    visible foci.
