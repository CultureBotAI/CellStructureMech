components:
- component_id: nontranslating_mrna_cargo
  label: nontranslating mRNA cargo
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Nontranslating mRNAs are modeled as the RNA cargo scaffolded into
    yeast P-bodies; no exact Sequence Ontology or GO term for the P-body-localized,
    translationally repressed mRNA pool was asserted.
  role: Translationally repressed mRNAs concentrated in P-bodies and required for
    visible P-body assembly.
  evidence:
  - reference: DOI:10.1261/rna.7258505
    notes: Teixeira et al. 2005 reported that yeast processing bodies require RNA
      for assembly and contain nontranslating mRNAs.
  - reference: DOI:10.1126/science.1115791
    notes: Brengues, Teixeira and Parker 2005 showed exchange of mRNAs between polysomes
      and cytoplasmic processing bodies.
- component_id: mrna_decay_protein_cohort
  label: mRNA decapping and 5-to-3 decay protein cohort
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  gene_symbols:
  - DCP1
  - DCP2
  - DHH1
  - XRN1
  - PAT1
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The first P-body record groups heterogeneous yeast decapping and
    5-to-3 decay factors as P-body proteins; no exact source-neutral family or complex
    CURIE covers this full cohort.
  role: mRNA-decapping, decay and decapping-activation proteins concentrated in yeast
    P-bodies.
  evidence:
  - reference: DOI:10.1126/science.1082320
    notes: Sheth and Parker 2003 provided evidence that mRNA decapping and 5-to-3
      decay occur in discrete cytoplasmic yeast foci called processing bodies.
  - reference: DOI:10.1016/j.molcel.2007.02.011
    notes: Parker and Sheth 2007 reviewed P-body proteins involved in mRNA translation
      control and degradation.
- component_id: edc3_lsm4_assembly_scaffolds
  label: Edc3/Lsm4 P-body assembly scaffolds
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  gene_symbols:
  - EDC3
  - LSM4
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Edc3 and the Q/N-rich C-terminal region of Lsm4 are represented
    as Saccharomyces P-body assembly scaffolds; no exact source-neutral family term
    was curated for this two-protein assembly cohort.
  role: Redundant assembly-promoting proteins that drive formation of microscopically
    visible Saccharomyces P-bodies under glucose deprivation.
  evidence:
  - reference: DOI:10.1083/jcb.200704147
    notes: Decker, Teixeira and Parker 2007 showed that Edc3p and the Q/N-rich domain
      of Lsm4p function in processing-body assembly in Saccharomyces cerevisiae.
taxonomic_distribution:
- taxon_id: NCBITaxon:2759
  taxon_label: Eukaryota
  presence: VARIABLE
  note: P-bodies are eukaryotic cytoplasmic mRNA-protein foci, but visible foci vary
    with lineage, cell state and translational repression or mRNA-decay conditions.
  reference: DOI:10.1016/j.molcel.2007.02.011
canonical_examples:
