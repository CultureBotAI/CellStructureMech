identifier: GO:0000932
label: P-body
structure_category: RIBONUCLEOPROTEIN
structure_kind: OTHER
definition: A focus in the cytoplasm where mRNAs may become inactivated by decapping
  or some other mechanism. Protein and RNA localized to these foci are involved in
  mRNA degradation, nonsense-mediated mRNA decay (NMD), translational repression,
  and RNA-mediated gene silencing.
definition_source: GO:0000932
mapping_status: PROPOSED
