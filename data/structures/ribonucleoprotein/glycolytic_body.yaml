- component_id: rna
  label: RNA
  component_type: RNA
  component_role: CONSTITUENT
  grounding: SO:0000356
  essentiality: UNKNOWN
  role: Associated RNA supports G-body assembly and integrity. No single obligatory
    transcript species, universal RNA stoichiometry or complete RNA-depletion state
    is established.
  evidence:
  - reference: DOI:10.7554/eLife.48480
    notes: Hypoxic G-body RIP-seq and smFISH demonstrate associated RNAs. G-body-targeted
      active RNases inhibit nascent formation and fracture preformed bodies; untargeted
      RNase and inhibited-RNase controls constrain this interpretation. Normoxic PAR-CLIP
      alone is not localization evidence.
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  reference: DOI:10.7554/eLife.48480
  note: Hypoxic yeast G bodies studied using Pfk2-, Fba1- and Eno2-tagged strains,
    with BY4742 as the untagged immunoprecipitation control. AnaeroPack cultures used
    YPD or synthetic medium with 5% glucose. This species example does not assert
    universal occurrence.
- taxon_id: NCBITaxon:559292
  taxon_label: Saccharomyces cerevisiae S288C
  reference: DOI:10.1016/j.celrep.2017.06.082
  note: Reference lineage for the BY4741-background experiments and reviewed protein
    exemplars; not a claim that the unmodified S288C stock was imaged. The study also
    observed Pfk2 puncta in HAP1-wild-type W303, ruling out restriction to the S288C
    hap1 allele.
functions:
- function_id: glycolytic_organization
  label: Spatial organization of glycolytic enzymes
  description: Concentrates several glycolytic enzymes in a non-membrane-bound cytoplasmic
    compartment during glucose-supported hypoxic growth.
  evidence:
  - reference: DOI:10.1016/j.celrep.2017.06.082
    notes: Direct dual-color enzyme colocalization, immunogold TEM and biochemical
      enrichment support spatial organization. Hypoxia-preconditioned cells with G
      bodies consume glucose faster than normoxia-preconditioned controls, but preconditioning
      and Snf1 perturbation have effects beyond the structure.
- function_id: hypoxic_fitness
  label: Contribution to competitive growth under hypoxia
  description: G-body-capable cells have a competitive growth advantage over cells
    expressing a G-body-targeted active RNase in the tested hypoxic cultures.
  evidence:
  - reference: DOI:10.7554/eLife.48480
    notes: Growth competition after normoxic preculture includes untargeted MqsR and
      Pfk2-D348S fusion controls. Targeted RNA degradation may affect local RNAs beyond
      morphology; this does not prove a single exclusive metabolic mechanism or universal
      survival requirement.
physical_properties:
- property: DIAMETER
  value: 200-500
  unit: UO:0000018
  context: Approximate diameter of electron-dense, non-membrane-bound Pfk2-GFP-labeled
    bodies in hypoxic S. cerevisiae, measured by immunogold TEM in the 2017 study.
    Not an invariant size or the Gaussian radius inferred from later fluorescence
    images.
  reference: DOI:10.1016/j.celrep.2017.06.082
  evidence:
  - reference: DOI:10.1016/j.celrep.2017.06.082
    notes: Hypoxia triggers glycolytic body formation Results describe the approximate
      TEM diameter and cite Figures 1D and S2C.
evidence:
- reference: DOI:10.1016/j.celrep.2017.06.082
  notes: Jin et al. 2017; PMID 28746874, PMC5586494.1. Read the defining localization,
    proteomic-validation, Snf1, metabolism, viability and culture Results/Methods
    from native JATS. PMC metadata reports not retracted. TDM licensing does not authorize
    hosting its figures.
- reference: DOI:10.7554/eLife.48480
  notes: Fuller et al. 2020; PMID 32298230, PMC7162659.1. Read RNA enrichment/localization,
    targeted-RNase, multivalency, gel-behavior and competition Results plus relevant
    Methods and Discussion. Native metadata is not retracted and JATS specifies CC
    BY 4.0. Figure 3 supplement 1 was visually inspected.
- reference: DOI:10.1371/journal.pone.0283002
  notes: Utsumi et al. 2023. Read the publisher's Introduction and Results/Discussion
    on engineered peptide recruitment. META body is broader terminology; engineered
    Adh1 recruitment is not native Adh1 membership evidence.
causal_graphs:
- graph_id: rna_supported_formation
  title: RNA-dependent G-body formation during hypoxic growth
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Cell-level interventions in S. cerevisiae. RNA dependence is supported,
    but an exclusive RNA-scaffold mechanism, transcript identity and a purified phase
    boundary are not established.
  nodes:
  - node_id: hypoxia
    label: Hypoxia with available glucose
    node_type: ENVIRONMENTAL_FACTOR
  - node_id: rna
    label: RNA
    node_type: RNA
    grounding: SO:0000356
    component_ref: rna
  - node_id: targeted_rnase
    label: Induction of Pfk2-fused active RNase
    node_type: EXPERIMENTAL_FACTOR
  - node_id: formation
    label: G-body formation
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: hypoxia
    predicate: promotes
    object: formation
    description: Hypoxic growth with glucose induces glycolytic-enzyme foci.
    evidence:
    - reference: DOI:10.1016/j.celrep.2017.06.082
      notes: Figure 1 and glucose-deprivation controls establish the tested environmental
        context.
  - subject: rna
    predicate: supports
    object: formation
    description: Associated RNA is required for efficient nascent G-body formation
      under the tested conditions.
    evidence:
    - reference: DOI:10.7554/eLife.48480
      notes: RIP-seq and smFISH establish RNA association; targeted MqsR/RNase A perturbations
        and activity/targeting controls support the requirement.
  - subject: targeted_rnase
    predicate: inhibits
    object: formation
    description: G-body-targeted active RNase reduces the fraction of hypoxic cells
      forming G bodies.
    evidence:
    - reference: DOI:10.7554/eLife.48480
      notes: Pfk2-MqsR acts dose-dependently; untargeted MqsR does not reproduce the
        effect and MqsA inhibition rescues formation. RNase A provides a second enzyme
        test; H12A retains residual activity.
- graph_id: rna_dependent_integrity
  title: Targeted RNase fractures preformed G bodies
  graph_kind: DISASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Bodies were first assembled during 20 hours of hypoxia and then followed
    in normoxia while RNase was induced. Fragmentation is not equated with complete
    dissolution.
  nodes:
  - node_id: targeted_rnase
