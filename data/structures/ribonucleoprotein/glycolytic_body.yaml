discussions:
- discussion_id: identity_boundary
  prompt: Which broader or related structures must not be merged with the glycolytic
    body?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: A local identifier is retained because complete cached OAK label/alias
    searches and current QuickGO glycolytic searches did not yield an exact cellular-component
    term. GO:0036464 is a broader class, not identity.
  evidence:
  - reference: DOI:10.1016/j.celrep.2017.06.082
    supports: SUPPORT
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
  resolution_note: The defining microscopy distinguishes Pab1 stress granules and
    Edc3 P-bodies from G bodies; adjacent puncta do not establish identity. Membrane-bounded
    glycosomes and mammalian glucosomes are not exact mappings here.
- discussion_id: meta_and_engineered_clients
  prompt: Does the META-body terminology or engineered recruitment establish an exact
    synonym or native constituent?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: Terminology and engineered localization must not inflate the native structural
    scope.
  evidence:
  - reference: DOI:10.1371/journal.pone.0283002
    supports: SUPPORT
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
  resolution_note: The 2023 Introduction uses META body collectively for multiple
    metabolic condensates, including purinosomes. It is not an exact synonym. Adh1
    peptide-fusion recruitment is engineered and does not establish unmodified Adh1
    as a resident.
- discussion_id: adjacency_and_regulators
  prompt: Should adjacent proteins, genetic regulators and all proteomics hits be
    listed as constituents?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: The 2017 workflow distinguishes 156 candidate hits from microscopy-supported
    localization.
  evidence:
  - reference: DOI:10.1016/j.celrep.2017.06.082
    supports: SUPPORT
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
  resolution_note: Fas1 and Pre3/Pre8/Rpn2 adjacency in the inspected 2017 Results
    is not counted as residence. Snf1 loss affects formation but does not establish
    Snf1 residence. Snf1-dependent Pfk2 phosphorylation is dispensable in the tested
    phosphosite mutants. SOD1, IRA2 and ARD1 deletion phenotypes alone are not component
    evidence.
- discussion_id: remaining_inventory
  prompt: Which additional low-frequency or earlier-study candidates are bona fide
    G-body residents?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The inspected Results report more candidates than the conservative high-confidence
    inventory curated here. Pgi1, Tdh3, Gpm1 and Eno1 form hypoxic puncta with residual
    cytoplasmic signal, but their dual-label validation and the full supplemental/2013
    candidate sets have not been independently audited.
  evidence:
  - reference: DOI:10.1016/j.celrep.2017.06.082
    supports: SUPPORT
  posed_by: codex
  posed_date: '2026-10-05'
- discussion_id: physical_state
  prompt: Do gel-like observations prove a universal liquid-liquid phase-separation
    mechanism?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: The 2020 study reports slow fusion, limited fluorescence recovery and
    incomplete sensitivity to 1,6-hexanediol.
  evidence:
  - reference: DOI:10.7554/eLife.48480
    supports: SUPPORT
  posed_by: codex
  posed_date: '2026-10-05'
  resolved_date: '2026-10-05'
  resolution_note: Describe the observed bodies as membraneless, RNA-containing and
    gel-like in the tested assays. Do not equate hexanediol resistance with a definitive
    material-state diagnostic, rapid liquid behavior or reversible dissolution on
    return to normoxia.
- discussion_id: metabolic_mechanism
  prompt: How does G-body organization change metabolic output independently of pleiotropic
    perturbations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: Hypoxic preconditioning, Snf1 loss and targeted RNA degradation constrain
    but do not uniquely isolate the causal contribution of compartmentalization. The
    2020 Discussion leaves substrate channeling, altered enzyme kinetics and local
    translation unresolved.
  evidence:
  - reference: DOI:10.7554/eLife.48480
    supports: SUPPORT
  posed_by: codex
  posed_date: '2026-10-05'
