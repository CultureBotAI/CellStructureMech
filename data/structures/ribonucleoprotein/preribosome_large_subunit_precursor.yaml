components:
- component_id: lsu_preribosome_rna_cohort
  label: large-subunit preribosome RNA cohort
  component_type: RNA
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: No exact source-neutral Sequence Ontology class for the 27SA, 27SB
    and/or 7S precursor rRNAs plus 5S rRNA present in large-subunit preribosome precursors
    was assigned in this pass; SO:0002393 denotes precursor_RNA broadly and SO:0000652
    denotes only mature 5S rRNA.
  role: 27SA, 27SB and/or 7S precursor rRNAs plus 5S rRNA assembled into a eukaryotic
    cytoplasmic large-subunit preribosomal precursor.
  evidence:
  - reference: GO:0030687
    notes: GO:0030687 defines the large-subunit precursor preribosome as containing
      27SA, 27SB and/or 7S pre-rRNA with 5S rRNA.
  - reference: SO:0002393
    notes: SO:0002393 denotes the broader precursor_RNA class, not specific large-subunit
      precursor rRNA species.
- component_id: lsu_preribosome_protein_cohort
  label: large-subunit preribosome protein cohort
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Large-subunit preribosome precursors contain late-associating large-subunit
    ribosomal proteins and associated proteins, but exact source-neutral InterPro,
    Pfam, NCBIfam, Complex Portal or GO boundaries for that heterogeneous protein
    cohort were not assigned in this first record.
  role: Ribosomal proteins and associated assembly factors carried by eukaryotic large-subunit
    preribosome precursors.
  evidence:
  - reference: GO:0030687
    notes: GO:0030687 defines the large-subunit precursor preribosome as containing
      ribosomal proteins, including late-associating large-subunit ribosomal proteins,
      and associated proteins.
