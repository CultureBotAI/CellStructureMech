functions:
- function_id: large_ribosomal_subunit_biogenesis
  label: ribosomal large subunit biogenesis
  grounding: GO:0042273
  description: As a precursor of the eukaryotic cytoplasmic large ribosomal subunit,
    the large-subunit preribosome participates in large-subunit biogenesis.
  evidence:
  - reference: GO:0042273
    notes: GO:0042273 is the Gene Ontology biological-process term for ribosomal large
      subunit biogenesis.
  - reference: GO:0030687
    notes: GO:0030687 defines this preribosome as a precursor of the eukaryotic cytoplasmic
      large ribosomal subunit.
- function_id: ribosome_biogenesis
  label: ribosome biogenesis
  grounding: GO:0042254
  description: The large-subunit preribosome is a preribosomal complex formed as part
    of the broader ribosome-biogenesis program.
  evidence:
  - reference: GO:0042254
    notes: GO:0042254 is the Gene Ontology biological-process term for ribosome biogenesis.
  - reference: GO:0030684
    notes: GO:0030684 defines preribosomal complexes as being formed during ribosome
      biogenesis.
evidence:
- reference: GO:0030687
  notes: Gene Ontology cellular-component term for the preribosome, large subunit
    precursor and its 66S preribosome narrow synonym.
- reference: GO:0030684
  notes: Gene Ontology cellular-component parent term for preribosomal complexes.
- reference: GO:0042273
  notes: Gene Ontology biological-process term for ribosomal large subunit biogenesis.
- reference: GO:0042254
  notes: Gene Ontology biological-process term for ribosome biogenesis.
- reference: SO:0002393
  notes: Sequence Ontology term for the broader precursor_RNA class, which is not
    specific to large-subunit precursor rRNAs.
- reference: SO:0000652
  notes: Sequence Ontology term for 5S_rRNA, which covers one RNA in the GO:0030687
    precursor-rRNA cohort but not the full RNA cohort.
- reference: PMID:10567516
  notes: PubMed identifier for Kressler, Linder and de la Cruz 1999, the review publication
    cited in the GO:0030687 definition.
- reference: DOI:10.1128/MCB.19.12.7897
  notes: DOI for Kressler, Linder and de la Cruz 1999, 'Protein trans-Acting Factors
    Involved in Ribosome Biogenesis in Saccharomyces cerevisiae', verified through
    NCBI E-utilities.
