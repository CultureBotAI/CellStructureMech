definition: A preribosomal complex consisting of 27SA, 27SB, and/or 7S pre-rRNA, 5S
  rRNA, ribosomal proteins including late-associating large subunit proteins, and
  associated proteins; a precursor of the eukaryotic cytoplasmic large ribosomal subunit.
