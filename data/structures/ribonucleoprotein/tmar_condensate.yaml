identifier: cellstructuremech:tmar_condensate
label: TmaR condensate
structure_category: RIBONUCLEOPROTEIN
structure_kind: OTHER
definition: A polar, membraneless ribonucleoprotein condensate organized by TmaR in
  Escherichia coli that recruits phosphotransferase-system enzyme I and participates
  in spatial regulation of sugar utilization.
definition_source: DOI:10.1016/j.celrep.2025.115436
mapping_status: PROPOSED
