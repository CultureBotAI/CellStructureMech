  edges:
  - subject: tmar
    predicate: undergoes
    object: condensation
    description: TmaR assembles by phase separation.
    evidence:
    - reference: DOI:10.1016/j.celrep.2023.113393
      notes: Final-paper abstract reports cellular and reconstituted phase separation;
        no material-property numbers are imported.
  - subject: rna
    predicate: promotes
    object: condensation
    description: Heterotypic RNA interactions support TmaR condensation.
    evidence:
    - reference: DOI:10.1016/j.celrep.2023.113393
      notes: The abstract identifies RNA as an in vivo and in vitro condensation partner,
        without establishing every RNA species as necessary.
  - subject: condensation
    predicate: forms
    object: condensate
    description: TmaR phase separation produces a polar membraneless compartment.
    evidence:
    - reference: DOI:10.1016/j.celrep.2023.113393
      notes: The final abstract connects TmaR condensation with its polar organization
        and transcript-related function.
  - subject: tmar
    predicate: interacts with
    object: ei
    description: TmaR recognizes and recruits EI through protein interactions.
    evidence:
    - reference: DOI:10.1016/j.celrep.2025.115436
      notes: Figures 1I and 3A-B, far-western controls and bacterial two-hybrid assays
        support interaction. G266 effects differ between assays; overexpression can
        compensate reduced interaction.
  - subject: condensate
    predicate: supports
    object: retention
    description: The assembled polar condensate provides the EI-retention compartment.
    evidence:
    - reference: DOI:10.1016/j.celrep.2025.115436
      notes: Native chromosomal reporters colocalize; TmaR recruitment mutants retain
        foci while EI becomes diffuse (Figures 1F-G and 2D). Some variants also alter
        scaffold abundance.
  - subject: ei
    predicate: undergoes
    object: retention
    description: A cellular fraction of EI is retained at TmaR foci.
    evidence:
    - reference: DOI:10.1016/j.celrep.2025.115436
      notes: EI localization shifts with TmaR abundance and EI/TmaR interaction mutations;
        no fixed occupancy or stoichiometry is inferred.
  - subject: retention
    predicate: restrains
    object: sugar_use
    description: TmaR-mediated EI sequestration limits sugar consumption in the assayed
      backgrounds.
    evidence:
    - reference: DOI:10.1016/j.celrep.2025.115436
      notes: Figure 3D-E links recruitment-defective variants to altered sugar consumption.
        The interpretation combines localization and functional perturbations; it
        is not a purified condensate-specific enzyme assay.
discussions:
- discussion_id: identity_and_h_body_boundary
  prompt: Distinguish the TmaR scaffolded condensate from a protein, one EI-TmaR complex
    and the H-body.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: Shared polar location and stress-induced co-condensation do not imply
    identical structure identity or permanent parthood.
  notes: Minted after hidden/ignored-inclusive repository searches and exact GO searches
    for TmaR, TmaR condensate, TmaR-EI condensate and enzyme I condensate. GO:0036464
    is a broader parent, not identity. EI occupancy is variable, so the TmaR-EI name
    is a related synonym. Hfq-dependent stress bodies remain separately curated; no
    fixed is-a or part-of link between the two condensates is asserted.
  evidence:
  - reference: DOI:10.1016/j.celrep.2025.115436
    notes: Native TmaR condensates persist without EI; the structure is not a stoichiometric
      EI-TmaR heterocomplex.
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: TmaR foci persist in hfq and ppk deletion backgrounds (Figure 1L).
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: specific_tmar_family_grounding
  prompt: Resolve TmaR at its issuing family authority rather than substituting a
    generic sequence family.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: InterPro's DUF496 and unreviewed UPF0265 descriptions alone do not establish
    the intended functional class.
  notes: The NCBI public model API identifies NF040881.1 as an NCBIFAM equivalog for
    PTS system regulator TmaR; reviewed UniProt P0A8M6 independently links this model.
    Accepted the exact NCBIfam grounding. This does not assert that every sequence-family
    member forms a condensate in every taxon.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/genome/annotation_prok/evidence/NF040881/
    notes: Checked accession, product name, family_type, source, tmaR symbol and PMID
      33376208 on 2026-10-03.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: native_constituent_scope
  prompt: Keep scaffold/client essentiality and native organism scope separate from
    heterologous reconstitution.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: EI and TmaR require co-expression for the tested yeast condensates, unlike
    native bacterial TmaR foci. Plasmid cross-species complementation is not endogenous
    taxonomic prevalence.
  notes: TmaR is the defining scaffold and EI a DISPENSABLE constituent. HPr is a
    modeled EI interaction partner, not a demonstrated condensate constituent here.
    Hfq/polyP stress co-condensation is documented in the separate H-body record,
    not imported as constitutive basal TmaR membership. Retained only MG1655 as canonical
    example; no prevalence rows, yeast or Salmonella native-structure claims, fixed
    stoichiometry or strain-mismatched protein examples.
  evidence:
  - reference: DOI:10.1016/j.celrep.2025.115436
    notes: Results distinguish bacterial and yeast assembly, and Figure 5 uses plasmid
      cross-species combinations.
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Figure 1L supports TmaR foci without Hfq/polyP, while stress conditions
      permit co-condensation.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: mechanistic_and_statistical_limits
  prompt: Do not promote docking, consumption measurements or discordant significance
    descriptions into stronger claims.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: The 2025 interface is a model with mutational support, not an experimentally
    solved EI-TmaR complex. Figure 3E marks K95E, whereas the Results text singles
    out A84G among patch-II variants.
  notes: No atomic closed-conformation/HPr-exclusion edge is asserted. The record
    cites the unambiguous F8L/V11I glucose-consumption result, without declaring all
    other mutants significant or nonsignificant. GO:0046325 was checked but not assigned
    because consumption is not a direct import-flux assay. Screen selection, protein-abundance
    and tagging effects limit interpretation of individual mutants.
  evidence:
  - reference: DOI:10.1016/j.celrep.2025.115436
    notes: Compared Figure 3E with its Results, and read the docking and screen limitations;
      affinity, kinetics and native stoichiometry were not established.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: resolve_rna_cargo_and_requirements
  prompt: Assess the full 2023 primary experiments before adding specific RNA cargo
    or transcript-stability mechanisms.
  kind: CURATION_TODO
  status: OPEN
  rationale: The verified abstract supports RNA-assisted assembly and flagellar transcript
    protection but not an exhaustive cargo list, quantitative half-lives or universal
    necessity.
  notes: Publisher full-text routes were attempted but inaccessible; RNA essentiality
    remains UNKNOWN and no detailed motility/biofilm graph is asserted. The readable
    2025 Introduction summarizes the earlier work, not an independent replication
    of every RNA experiment.
  evidence:
  - reference: DOI:10.1016/j.celrep.2023.113393
    notes: Readable final abstract only; no invented snippets or substitution of the
      2022 preprint.
  - reference: DOI:10.1016/j.celrep.2025.115436
    notes: RNA/flagellar-transcript claims in the Introduction cite the earlier study.
  posed_by: codex
  posed_date: '2026-10-03'
