  curator: codex
  action: EXPANDED_RECORD
  changes: Added three grounded component classes, MG1655 example, two source-bounded
    functions, seven-edge mechanism graph, native/H-body boundaries and an explicit
    RNA-evidence follow-up; verified exact NCBIfam TmaR equivalog.
  llm_assisted: true
synonyms:
- synonym_text: TmaR-EI polar condensate
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1016/j.celrep.2025.115436
