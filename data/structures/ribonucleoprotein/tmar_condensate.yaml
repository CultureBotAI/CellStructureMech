components:
- component_id: tmar
  label: PTS system regulator TmaR
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: NCBIfam:NF040881
  grounding_notes: NCBI's exact model NF040881.1 is an NCBIFAM equivalog named PTS
    system regulator TmaR, with gene symbol tmaR and PMID 33376208. Verified through
    the issuing authority's public hmm_info API and the reviewed UniProt P0A8M6 cross-reference.
    This functional model is used instead of adopting the broader DUF496 label or
    InterPro's unreviewed UPF0265 description.
  gene_symbols:
  - tmaR
  essentiality: ESSENTIAL
  role: Defining scaffold of the polar condensate and recruiter of enzyme I.
  evidence:
  - reference: DOI:10.1016/j.celrep.2025.115436
    notes: Native-locus imaging and recruitment mutants separate TmaR clustering from
      EI recruitment (Figures 1F-G and 2D).
  - reference: https://www.ncbi.nlm.nih.gov/genome/annotation_prok/evidence/NF040881/
    notes: 'Live authority model: NF040881.1, source NCBIFAM, family_type equivalog,
      product_name PTS system regulator TmaR; checked 2026-10-03.'
- component_id: ei
  label: Phosphotransferase system, enzyme I
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR024692
  gene_symbols:
  - ptsI
  essentiality: DISPENSABLE
  role: Recruited enzyme client. Native bacterial TmaR condensates can form without
    EI; recruitment regulates sugar utilization.
  evidence:
  - reference: DOI:10.1016/j.celrep.2025.115436
    notes: Results explicitly distinguish EI-independent bacterial TmaR condensation
      from two-protein reconstitution in yeast. Figures 1-3 test client recruitment
      and interaction.
- component_id: rna
  label: RNA
  component_type: RNA
  component_role: CONSTITUENT
  grounding: SO:0000356
  essentiality: UNKNOWN
  role: Heterotypic condensation partner and transcript cargo; no universal RNA-species
    requirement or exhaustive cargo inventory is asserted.
  evidence:
  - reference: DOI:10.1016/j.celrep.2023.113393
    notes: Readable final-paper abstract reports RNA-dependent heterotypic phase separation
      in vivo and in vitro and protection of flagellar transcripts. Full Results were
      not accessible through the attempted publisher routes; specific RNA identities
      and quantitative requirements are not imported.
canonical_examples:
- taxon_id: NCBITaxon:511145
  taxon_label: Escherichia coli str. K-12 substr. MG1655
  reference: DOI:10.1016/j.celrep.2025.115436
  note: Key resources and strain-construction Methods identify MG1655 derivatives
    for native-locus TmaR-YFP/EI-mCherry imaging. Standard growth uses supplemented
    M9-glucose at 30 C; individual biochemical and sugar-consumption assays also use
    specified plasmids. This example is not a species-wide prevalence claim.
functions:
- function_id: ei_sequestration
  label: Spatial regulation of sugar utilization
  description: Polar retention of EI by TmaR limits EI-dependent sugar consumption
    in the tested E. coli backgrounds.
  evidence:
  - reference: DOI:10.1016/j.celrep.2025.115436
    notes: Figures 1-3 combine localization and interaction perturbations with consumption
      assays. F8L and V11I recruitment-defective TmaR variants show elevated glucose
      consumption. This is not a direct measurement of transport flux or the catalytic
      state of each condensed EI molecule.
- function_id: transcript_protection
  label: Flagellar transcript protection
  description: The primary report associates protection of flagella-related transcripts
    in TmaR condensates with control of flagella production and motility.
  evidence:
  - reference: DOI:10.1016/j.celrep.2023.113393
    notes: Supported at the level of the readable final-paper abstract. Transcript-specific
      half-lives, exact cargo membership and downstream causal edges await full-text
      assessment.
evidence:
- reference: DOI:10.1016/j.celrep.2025.115436
  notes: Albocher-Kedem et al. 2025; PMC11937232. Full Results, relevant Methods,
    limitations and MG1655 resource table read through PMC BioC and Europe PMC JATS.
    Figures 1 and 3 visually inspected; downloaded bytes match PMC metadata MD5. CC
    BY-NC-ND figures are not hosted.
- reference: DOI:10.1016/j.celrep.2023.113393
  notes: Szoke et al. 2023; PMID 37934665. Final-paper abstract verified at Europe
    PMC and the publisher. Publisher full-text routes returned access errors; no full
    Results reading or preprint substitution is claimed.
- reference: DOI:10.1371/journal.pbio.3003775
  notes: Guan et al. 2026; Figure 1L and corresponding Results independently show
    TmaR foci without Hfq or polyP, supporting a boundary from the Hfq-organized H-body.
causal_graphs:
- graph_id: tmar_polar_ei_sequestration
  title: TmaR condensation couples EI retention to sugar-use control
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  description: RNA-associated TmaR condensation supports polar EI retention and regulation
    of sugar consumption.
  scope_notes: RNA/assembly edges are limited to the 2023 primary abstract; EI interaction,
    localization and functional perturbations use the fully read 2025 study. Native
    bacterial behavior is not inferred from yeast alone. No atomic docking mechanism,
    universal RNA essentiality or direct glucose-import measurement is asserted.
