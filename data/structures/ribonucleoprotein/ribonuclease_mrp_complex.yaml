- function_id: tricistronic_rrna_cleavage
  label: endonucleolytic cleavage of tricistronic rRNA transcript (SSU-rRNA, 5.8S
    rRNA, LSU-rRNA)
  grounding: GO:0000479
  description: Budding-yeast RNase MRP cleaves the internal transcribed spacer 1 of
    pre-rRNA at the A3 site to promote formation of the mature 5-prime end of 5.8S
    rRNA.
  evidence:
  - reference: GO:0000479
    notes: GO:0000479 covers endonucleolytic cleavage of tricistronic rRNA transcripts
      during rRNA processing.
  - reference: DOI:10.1128/mcb.13.12.7935-7941.1993
    notes: Schmitt and Clayton 1993 connected nuclear RNase MRP to pre-5.8S rRNA processing
      in S. cerevisiae.
  - reference: DOI:10.1073/pnas.91.2.659
    notes: Chu et al. 1994 showed that the NME1-encoded RNase MRP RNA is required
      for normal yeast rRNA processing.
