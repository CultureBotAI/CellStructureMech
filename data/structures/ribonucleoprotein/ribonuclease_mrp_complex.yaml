identifier: GO:0000172
label: ribonuclease MRP complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: 'A ribonucleoprotein complex that contains an RNA molecule of the snoRNA
  family, and cleaves the rRNA precursor as part of rRNA transcript processing. It
  also has other roles: In S. cerevisiae it is involved in cell cycle-regulated degradation
  of daughter cell-specific mRNAs, while in mammalian cells it also enters the mitochondria
  and processes RNAs to create RNA primers for DNA replication.'
