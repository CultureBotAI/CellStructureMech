identifier: GO:0030679
label: cyanelle ribonuclease P complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonuclease P complex located in the cyanelle, where it catalyzes the
  5' endonucleolytic cleavage of precursor tRNAs to yield mature tRNAs. The best characterized
  cyanelle ribonuclease P complex, from the alga Cyanophora paradoxa, contains a single
  RNA molecule that is necessary but not sufficient for catalysis, and several protein
  molecules.
