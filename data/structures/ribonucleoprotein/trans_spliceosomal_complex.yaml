identifier: GO:0071023
label: trans spliceosomal complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that forms during the addition of a specific spliced
  leader (SL) sequence to the 5'-end of a messenger RNA primary transcript, a process
  which occurs in a number of eukaryotic organisms, including trypanosomatid protozoans,
  euglenoids, nematodes, trematodes, and chordates.
