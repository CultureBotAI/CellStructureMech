  label: pre-mRNA processing factor reservoir
  description: Interchromatin granule clusters concentrate pre-mRNA splicing and RNA-processing
    factors in mammalian nuclear bodies proposed to serve as assembly, modification
    and/or storage sites for pre-mRNA processing machinery.
  evidence:
  - reference: DOI:10.1091/mbc.e04-03-0253
    notes: Saitoh et al. 2004 found that most identified IGC proteins were associated
      with RNA metabolism and that pre-mRNA splicing proteins predominated.
