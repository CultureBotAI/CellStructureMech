functions:
- function_id: stress_induced_satellite_iii_rnp_organization
  label: stress-induced satellite III RNP organization
  description: Nuclear stress granules assemble on satellite III repeats in heat-shocked
    human cells, retain satellite III repeat RNAs and accumulate pre-mRNA processing
    factors.
  evidence:
  - reference: DOI:10.1083/jcb.200306104
    notes: Jolly et al. 2004 showed that satellite III RNAs are transcribed in HSF1-containing
      nuclear stress granules and remain associated with the 9q12 region.
  - reference: DOI:10.1101/cshperspect.a000695
    notes: Biamonti and Vourc'h 2010 reviewed nuclear stress bodies as heat-shock-induced
      subnuclear organelles formed on satellite III arrays.
