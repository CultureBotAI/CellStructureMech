components:
- component_id: heat_shock_factor_1
  label: heat shock factor 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - HSF1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: HSF1 is represented as the heat-shock transcription factor that
    binds satellite III repeats and concentrates in human nuclear stress granules;
    no exact source-neutral InterPro, Pfam or NCBIfam accession was assigned in this
    first record.
  role: Activated heat shock factor that binds satellite III repeats and concentrates
    at the stress-induced nuclear granule.
  evidence:
  - reference: DOI:10.1083/jcb.200109018
    notes: Jolly et al. 2002 mapped HSF1 granules to human chromosome 9 heterochromatin
      and showed direct HSF1 binding to satellite III repeats during stress.
  - reference: DOI:10.1083/jcb.200306104
    notes: Jolly et al. 2004 connected HSF1-containing nuclear stress granules with
      RNA polymerase II transcription of satellite III repeats.
- component_id: satellite_iii_stress_rna
  label: satellite III stress-induced RNA
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Stress-induced HSATIII RNA is curated as a human satellite III
    repeat transcript retained at nuclear stress granules; no exact Sequence Ontology
    CURIE for this stress-induced repeat RNA was assigned in this first record.
  role: Large stress-induced satellite III noncoding RNAs that remain associated with
    the heterochromatic nuclear stress granule locus.
  evidence:
  - reference: DOI:10.1083/jcb.200306104
    notes: Jolly et al. 2004 showed that satellite III repeats are transcribed into
      large stable RNAs that remain associated with human nuclear stress granule loci.
- component_id: pre_mrna_processing_factor_cohort
  label: pre-mRNA processing factor cohort
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Heat-shock nuclear stress granules recruit a heterogeneous set
    of pre-mRNA processing factors; no exact source-neutral family, complex or cohort
    CURIE was assigned in this first record.
  role: Pre-mRNA processing factors that accumulate in nuclear stress granules after
    heat shock.
  evidence:
  - reference: DOI:10.1091/mbc.12.11.3502
    notes: Denegri et al. 2001 identified stress-induced nuclear bodies as sites that
      accumulate pre-mRNA processing factors in heat-shocked human cells.
