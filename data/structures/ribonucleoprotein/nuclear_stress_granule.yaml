causal_graphs:
- graph_id: hsf1_satiii_nuclear_stress_granule_assembly
  title: HSF1 and satellite III RNAs organize nuclear stress granules
  description: In heat-shocked human cells, HSF1 binds satellite III repeats, satellite
    III repeats are transcribed into RNAs retained at the locus, and pre-mRNA processing
    factors accumulate in the resulting nuclear stress granule.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph summarizes the canonical HSF1 and satellite III repeat axis
    without asserting a complete condensate assembly pathway, the exact boundary of
    every splicing or hnRNP factor recruited to the body, or all chromosome-specific
    human satellite III nucleation sites.
  nodes:
  - node_id: heat_shock_factor_1
    label: heat shock factor 1
    node_type: GENE_OR_PROTEIN
    component_ref: heat_shock_factor_1
