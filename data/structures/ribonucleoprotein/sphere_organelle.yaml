components:
- component_id: coilin_sph1
  label: coilin/SPH-1
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Xenopus sphere-organelle antigen SPH-1 is modeled with its
    coilin relationship as a first-pass protein component; no exact source-neutral
    InterPro, Pfam or NCBIfam accession covering this amphibian sphere-organelle protein
    was assigned.
  role: Coilin-related SPH-1 protein concentrated in the cortex of Xenopus laevis
    sphere organelles.
  evidence:
  - reference: DOI:10.1083/jcb.122.4.767
    notes: Tuma, Stolk and Roth 1993 localized SPH-1 specifically to the cortex of
      Xenopus laevis sphere organelles and found that cloned SPH-1 encodes a p80-coilin-related
      protein.
- component_id: u7_snrna
  label: U7 snRNA
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: U7 snRNA is curated as a native sphere-organelle-enriched small
    nuclear RNA; no exact Sequence Ontology or RNAcentral CURIE was assigned in this
    first record.
  role: Small nuclear RNA concentrated in amphibian oocyte sphere organelles and able
    to induce coiled-body-like structures when increased in Xenopus oocyte nuclei.
  evidence:
  - reference: DOI:10.1007/s004120050385
    notes: Tuma and Roth 1999 described amphibian oocyte sphere organelles as coiled
      bodies containing high concentrations of U7 snRNA and showed that increasing
      nuclear U7 snRNA induced coiled-body-like structures in Xenopus oocytes.
