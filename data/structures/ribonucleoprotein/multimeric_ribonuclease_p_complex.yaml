functions:
- function_id: ribonuclease_p_activity
  label: ribonuclease P activity
  grounding: GO:0004526
  description: The multimeric ribonuclease P complex removes 5-prime extra nucleotides
    from precursor tRNA by endonucleolytic RNA cleavage.
