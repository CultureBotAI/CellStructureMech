    notes: GO:0001682 is the Gene Ontology biological-process term for tRNA 5'-leader
      removal.
  - reference: GO:0030677
    notes: GO:0030677 defines ribonuclease P complexes by their cleavage of precursor
      tRNAs to generate mature 5-prime tRNA ends.
