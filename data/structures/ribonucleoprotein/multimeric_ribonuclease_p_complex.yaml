  - reference: GO:0030677
    notes: GO:0030677 defines ribonuclease P complexes as catalyzing pre-tRNA leader-sequence
      cleavage.
- function_id: trna_5_leader_removal
  label: tRNA 5'-leader removal
  grounding: GO:0001682
  description: RNase P complexes generate mature tRNA 5-prime ends by cleaving 5-prime
    leader sequences from pre-tRNAs.
  evidence:
