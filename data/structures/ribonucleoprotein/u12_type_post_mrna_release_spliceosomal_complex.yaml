- discussion_id: resolve_u12_type_post_mrna_release_spliceosome_components
  prompt: Classify literature-reported U12-type post-mRNA release spliceosomal complex
    proteins beyond the GO-defined U12, U5 and U6atac snRNP subcomplexes as source-neutral
    constituents or out-of-boundary remodeling factors, and decide how to represent
    the excised intron RNA.
