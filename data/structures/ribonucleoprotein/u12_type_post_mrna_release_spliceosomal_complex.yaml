    snRNP subcomplexes. Reports of additional U12-type post-mRNA release spliceosomal
    complex proteins need boundary review against transient assembly or remodeling
    factors and exact source-neutral grounding, and the RNA substrate boundary should
    be resolved before the component list is expanded.
