components:
- component_id: pre_mrna_splicing_factor_cohort
  label: pre-mRNA splicing factor cohort
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SRSF1
  - SRSF2
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SR proteins and other pre-mRNA splicing factors are modeled as
    a broad nuclear-speckle resident cohort; no exact source-neutral InterPro, Pfam
    or NCBIfam accession covering this heterogeneous speckle-localized factor set
    was assigned.
  role: Pre-mRNA splicing factors concentrated in nuclear speckles and dynamically
    supplied to active transcription sites.
  evidence:
  - reference: GO:0016607
    notes: GO:0016607 defines nuclear specks by localization of splicing factors in
      the domain.
  - reference: DOI:10.1038/387523a0
    notes: Misteli, Caceres and Spector 1997 tracked a GFP-tagged pre-mRNA splicing
      factor between nuclear speckles and sites of transcription.
- component_id: son_srrm2_scaffold_proteins
  label: SON/SRRM2 scaffold proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SON
  - SRRM2
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SON and SRRM2 are curated as two large speckle scaffold proteins
    required for visible human nuclear-speckle formation; no exact source-neutral
    family or complex CURIE covers this two-protein structural cohort.
  role: Large intrinsically disordered scaffold proteins that form the core structural
    framework of nuclear speckles.
  evidence:
  - reference: DOI:10.7554/eLife.60579
    notes: Ilik et al. 2020 identified SON and SRRM2 as essential for nuclear speckle
      formation.
  - reference: DOI:10.1242/jcs.206854
    notes: Fei et al. 2017 resolved SON in the central region of human nuclear speckles
      by super-resolution microscopy.
- component_id: malat1_lncrna
  label: MALAT1 lncRNA
  component_type: RNA
  component_role: CONSTITUENT
  gene_symbols:
  - MALAT1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: MALAT1 is represented as a long noncoding RNA enriched at mammalian
    nuclear speckles; no exact Sequence Ontology CURIE for the speckle-resident MALAT1
    RNA species was assigned.
  role: Long noncoding RNA enriched in nuclear speckles and associated with SR-splicing-factor
    organization.
  evidence:
  - reference: DOI:10.1016/j.molcel.2010.08.011
    notes: Tripathi et al. 2010 localized MALAT1 to nuclear speckles and connected
      it to SR-splicing-factor organization.
  - reference: DOI:10.1242/jcs.206854
    notes: Fei et al. 2017 found MALAT1 enriched toward the periphery of human nuclear
      speckles.
