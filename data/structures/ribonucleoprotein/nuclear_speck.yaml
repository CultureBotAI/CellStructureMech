functions:
- function_id: pre_mrna_splicing_factor_organization
  label: pre-mRNA splicing factor organization
  description: Nuclear speckles concentrate pre-mRNA splicing factors and dynamically
    supply them to active transcription sites.
  evidence:
  - reference: DOI:10.1038/387523a0
    notes: Misteli, Caceres and Spector 1997 showed dynamic exchange of an SR splicing
      factor between nuclear speckles and transcription sites in living cells.
  - reference: DOI:10.1101/cshperspect.a000646
    notes: Spector and Lamond 2011 reviewed nuclear speckles as subnuclear domains
      enriched in pre-mRNA splicing factors.
