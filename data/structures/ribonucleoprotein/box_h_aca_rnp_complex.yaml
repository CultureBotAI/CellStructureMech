  role: Conserved four-protein enzymatic core consisting of the catalytic pseudouridine
    synthase Cbf5p (dyskerin/TruB homolog) and accessory subunits Gar1p, Nhp2p, and
    Nop10p.
  evidence:
  - reference: PMID:9843512
    notes: Henras et al. 1998 identified Gar1p, Nhp2p, Nop10p, and Cbf5p as components
      of the yeast box H/ACA RNP family.
  - reference: PMID:14562095
    notes: Huh WK et al. 2003, 'Global analysis of protein localization in budding
      yeast.', Nature — confirms nucleolar localization of the yeast Cbf5p, Gar1p,
      Nhp2p, and Nop10p box H/ACA RNP core subunits.
