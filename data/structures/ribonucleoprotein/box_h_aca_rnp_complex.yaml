  essentiality: ESSENTIAL
  role: Small non-coding RNA containing hairpin-hinge-hairpin-tail secondary structure
    with conserved H-box and ACA-box motifs that scaffolds the RNP and typically base-pairs
    with substrate RNA to position the target uridine.
  evidence:
  - reference: GO:0072588
    notes: GO:0072588 defines the complex as containing a small RNA with an H/ACA
      box sequence motif.
  - reference: PMID:9843512
    notes: Henras A et al. 1998, 'Nhp2p and Nop10p are essential for the function
      of H/ACA snoRNPs.', EMBO J — characterizes the box H/ACA snoRNA-protein complex
      required for rRNA pseudouridylation.
