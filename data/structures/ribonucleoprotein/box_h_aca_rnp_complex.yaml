identifier: GO:0072588
label: box H/ACA RNP complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonucleoprotein complex containing a small RNA with an H/ACA box sequence
  motif that catalyzes pseudouridylation of RNA molecules. Most members of this family
  use guide RNAs to direct the site of pseudouridylation of target RNAs (for example,
  box H/ACA snoRNPs and box H/ACA scaRNPs) although some members do not modify other
  RNAs (for example, telomerase RNP).
