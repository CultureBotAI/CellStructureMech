discussions:
- discussion_id: resolve_u2_type_post_spliceosomal_components
  prompt: Classify literature-reported U2-type post-spliceosomal complex proteins
    beyond the GO-defined U2, U5 and U6 snRNP subcomplexes as source-neutral constituents
    or out-of-boundary remodeling factors, and decide how to represent the spliced-product
    and excised-intron RNAs.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#u2_snrnp
  - components#u5_snrnp
  - components#u6_snrnp
  - causal_graphs#u2_type_post_spliceosomal_snrnp_retention
  rationale: The first GO:0071021 record captures the defining U2, U5 and U6 snRNP
    subcomplexes. Reports of additional U2-type post-spliceosomal complex proteins
    need boundary review against transient assembly or remodeling factors and exact
    source-neutral grounding, and the spliced-product and excised-intron RNA boundaries
    should be resolved before the component list is expanded.
  evidence:
  - reference: GO:0071021
  - reference: DOI:10.1016/j.cell.2009.02.009
