  - Hrb57A
  - S5
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Omega-speckle-associated hnRNPs are represented as the Drosophila
    RNA binding proteins tested by Prasanth et al.; no exact source-neutral InterPro,
    Pfam or NCBIfam accession covering this curated cohort was assigned.
  role: Heterogeneous nuclear RNA-binding proteins that colocalize with hsr-omega
    transcripts in omega speckles and physically associate with hsr-omega RNA.
  evidence:
  - reference: DOI:10.1242/jcs.113.19.3485
    notes: Prasanth et al. 2000 colocalized HRB87F, Hrp40, Hrb57A and S5 hnRNPs with
      omega speckles and detected physical association between hnRNPs and hsr-omega
      transcripts.
taxonomic_distribution:
- taxon_id: NCBITaxon:7227
  taxon_label: Drosophila melanogaster
  presence: VARIABLE
  note: Omega speckles were discovered in Drosophila melanogaster larval and adult
    cell types as hsr-omega-n RNA- and hnRNP-containing nuclear speckles whose number
    varies by cell type and heat-shock state.
  reference: DOI:10.1242/jcs.113.19.3485
canonical_examples:
- taxon_id: NCBITaxon:7227
  taxon_label: Drosophila melanogaster
  note: Drosophila melanogaster cells were used to define omega speckles as hsr-omega
    nuclear-transcript foci that colocalize with hnRNPs and remain distinct from SR-protein
    interchromatin granules.
  reference: DOI:10.1242/jcs.113.19.3485
functions:
- function_id: hnrnp_trafficking_and_availability
  label: hnRNP trafficking and availability regulation
  description: Drosophila omega speckles organize hsr-omega-n noncoding RNA and hnRNP
    proteins in nuclear foci that regulate the trafficking and availability of hnRNPs
    and related RNA-binding proteins.
  evidence:
  - reference: DOI:10.1242/jcs.113.19.3485
    notes: Prasanth et al. 2000 concluded from hsr-omega localization, hnRNP colocalization
      and hsr-omega-nullosomic disruption that omega speckles organize hnRNP trafficking
      and availability.
