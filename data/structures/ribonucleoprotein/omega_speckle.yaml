    granule.
- reference: GO:0031981
  notes: Gene Ontology cellular-component term for the nuclear lumen; omega speckles
    are nucleoplasmic speckles.
- reference: DOI:10.1242/jcs.113.19.3485
  notes: Prasanth, Rajendra, Lal and Lakhotia 2000, Omega speckles - a novel class
    of nuclear speckles containing hnRNPs associated with noncoding hsr-omega RNA
    in Drosophila, Journal of Cell Science.
