identifier: GO:0071010
label: prespliceosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that is formed by association of the 5' splice
  site and the branch point sequence with specific snRNPs. The prespliceosome includes
  many proteins in addition to those found in the bound snRNPs. Commitment to a given
  pair of 5' and 3' splice sites occurs at the time of prespliceosome formation. Prespliceosome
  complexes are not active for splicing, but are instead an early step in the assembly
  of a spliceosomal complex.
