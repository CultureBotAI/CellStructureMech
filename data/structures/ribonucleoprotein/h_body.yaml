- discussion_id: resolve_tmar_functional_family
  prompt: Establish an exact source-neutral family grounding for the TmaR pole-localizer
    class.
  kind: CURATION_TODO
  status: OPEN
  rationale: Verified sequence-family membership alone does not show that the wider
    DUF496 or UPF0265 families are coextensive with the named TmaR functional class.
  notes: InterPro IPR007458 and IPR053375 and reviewed UniProt P0A8M6 were examined.
    TmaR remains explicitly label-only rather than equated to either broad family.
    Its localization and condition-specific requirement are independently supported
    by Figure 1.
  evidence:
