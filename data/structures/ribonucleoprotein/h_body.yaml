identifier: cellstructuremech:h_body
label: H-body
structure_category: RIBONUCLEOPROTEIN
structure_kind: OTHER
definition: A stress-responsive, polar, membraneless ribonucleoprotein condensate
  organized by Hfq in Escherichia coli, with polyphosphate-modulated assembly and
  enrichment of polyadenylated transcripts and RNA-processing proteins.
definition_source: DOI:10.1371/journal.pbio.3003775
mapping_status: PROPOSED
