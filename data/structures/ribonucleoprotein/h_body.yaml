    function, seven-edge assembly graph, identity and evidence boundaries, and an
    explicit TmaR family-grounding follow-up.
  llm_assisted: true
synonyms:
- synonym_text: Hfq condensate
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1371/journal.pbio.3003775
parent_structures:
