components:
- component_id: hfq
  label: RNA-binding protein Hfq
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Defining RNA-binding scaffold of the H-body; many Hfq molecules assemble into
    a mesoscale condensate, rather than one Hfq hexamer constituting the entire structure.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Endogenous fluorescent reporters locate Hfq in polar bodies. Purified Hfq
      phase separates above a concentration threshold, reduced by polyphosphate within
      a concentration window (Figures 1 and 4).
  grounding: InterPro:IPR005001
  gene_symbols:
  - hfq
- component_id: polyp
  label: polyphosphate
  component_type: SMALL_MOLECULE
  component_role: CONSTITUENT
  essentiality: DISPENSABLE
  role: Inorganic polyanion that co-partitions with Hfq and modulates condensation,
    client enrichment and body persistence. Its absence does not eliminate all nitrogen-starvation-induced
    Hfq bodies.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Figure 3 reports modest but significant Hfq/polyP colocalization, with
      strong enrichment in only a subset of foci. Figures 1 and 4 show residual foci
      in nitrogen-starved ppk mutants and Hfq-only droplets at high protein concentrations;
      excess polyP redissolves reconstituted droplets. The grounding denotes the polymer
      class, not a fixed chain length.
  grounding: CHEBI:16838
- component_id: mrna
  label: mRNA
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: Polyadenylated transcript cargo; the RNA-class grounding does not assert that
    all mRNAs localize to the body or that RNA is universally required for its assembly.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Figure 5E FISH shows poly(A)-transcript colocalization with Hfq in a subset
      of nitrogen-starved WT cells, with limited signal-to-noise. Figure 4 uses an
      rA30 oligonucleotide, not a full mRNA, for ternary Hfq/polyP/RNA reconstitution.
      RNase A does not dissolve the lysate HMW Hfq assemblies in the tested assay.
  grounding: SO:0000234
- component_id: rnase_e
  label: Ribonuclease E
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: RNA-processing client enriched with Hfq in nitrogen-starvation bodies; neither
    catalytic inactivity within the body nor a requirement for H-body assembly is
    asserted.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Figure 4G-I shows RNase E in polyP-dependent HMW Hfq assemblies and endogenous
      fluorescent RNase E enrichment at Hfq foci. Hfq is the organizing scaffold here;
      the Caulobacter BR-body RNase E-scaffold essentiality is not transferred.
  grounding: InterPro:IPR028878
  gene_symbols:
  - rne
- component_id: rhlb
  label: ATP-dependent RNA helicase RhlB type
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  role: RNA-helicase client whose endogenous fluorescent foci colocalize with Hfq
    under nitrogen starvation in the presence of polyP.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Figure 5C directly images RhlB/Hfq colocalization in WT and its loss in
      the ppk deletion background. The verified E. coli RhlB product maps to the IPR023554
      family, not the Xanthomonadaceae-focused IPR022077 family or the RhlB helicase
      domain.
  grounding: InterPro:IPR023554
  gene_symbols:
  - rhlB
- component_id: tmar
  label: TmaR
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  role: Co-condensing polar regulator required for Hfq-body assembly during the tested
    nitrogen-starvation condition. It also forms distinct foci without Hfq, and is
    not universally required under stronger osmotic stress.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Figure 1L compares endogenous Hfq/TmaR localization and deletion backgrounds;
      Hfq foci are lost without TmaR during nitrogen starvation. Figure 1M retains
      some Hfq foci without TmaR at 1.17 M NaCl. The Results discuss prior direct
      co-condensation evidence.
  gene_symbols:
  - tmaR
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Verified E. coli TmaR (formerly YeeX) maps to the DUF496 family
    IPR007458 and UPF0265 family IPR053375. These describe wider, largely uncharacterized
    sequence families; no exact TmaR functional-family boundary was established. A
    broad family or domain is not asserted as equivalent to the named pole-localizer
    class.
canonical_examples:
- taxon_id: NCBITaxon:511145
  taxon_label: Escherichia coli str. K-12 substr. MG1655
  note: The study uses MG1655-derived strains with endogenous fluorescent fusions,
    nitrogen starvation in defined Gutnick medium, and strong osmotic stress at 1.17
    M NaCl. This is an experimentally demonstrated strain example, not a prevalence
    assertion across E. coli or bacteria.
  reference: DOI:10.1371/journal.pbio.3003775
functions:
- function_id: rna_protein_sequestration
  label: RNA and protein sequestration
  description: Concentrates polyadenylated transcripts and selected RNA-processing
    proteins during nitrogen starvation. PolyP-dependent body organization is associated
    with selective transcript stabilization; the genetic comparisons do not isolate
    condensation from all other Hfq and polyP activities.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Figures 4H-I and 5C,E directly localize RNase E, RhlB and poly(A) RNA.
      Transcript half-life and poly(A)-tail measurements in WT versus ppk deletion
      strains support selective preservation, but the Discussion calls for separation-of-function
      mutants before attributing survival specifically to condensation.
evidence:
- reference: DOI:10.1371/journal.pbio.3003775
  notes: Guan et al. 2026, peer-reviewed PLOS Biology article. Full Results, relevant
    Methods and Discussion read through the publisher and NCBI PMC BioC (PMC13193609);
    Figures 1, 4 and 5 visually inspected. Uses the final H-body terminology and revised
    results, not unqualified claims from the earlier HP-body preprint.
causal_graphs:
- graph_id: polyp_modulated_h_body_assembly
  title: Polyphosphate modulates stress-induced H-body assembly
  description: Nitrogen starvation increases polyphosphate, which promotes Hfq condensation
    within a concentration window; the assembled bodies enrich selected RNA and protein
    cargo.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Combines explicitly distinguished MG1655 cellular perturbations with
    purified Hfq/polyP reconstitution. PolyP is a promoter, not a universal prerequisite;
    TmaR dependence is restricted to the assayed nitrogen-starvation condition. Cargo
    enrichment is supported by localization, not proof of RNase inhibition or condensate-specific
    survival causation.
