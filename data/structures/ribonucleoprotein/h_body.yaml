  edges:
  - subject: n_starvation
    predicate: induces accumulation of
    object: polyp
    description: Nitrogen-starved WT cells accumulate long-chain polyphosphate.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3003775
      notes: Figure 1A measures polyP accumulation after entry into nitrogen starvation;
        the ppk deletion strain lacks detectable polyP.
  - subject: polyp
    predicate: promotes
    object: condensation
    description: Polyphosphate lowers the Hfq concentration needed for droplet formation
      within a permissive concentration window.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3003775
      notes: Figure 4A-D shows concentration-dependent reconstitution and ternary
        complexes. Figure 1 compares cellular ppk deletion and Ppk10k-driven polyP
        accumulation. Excess polyP dissolves droplets, so the effect is not monotonic.
  - subject: hfq
    predicate: undergoes
    object: condensation
    description: Hfq self-associates and forms condensates at sufficient protein concentration;
      polyP facilitates this at lower concentrations.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3003775
      notes: Purified Hfq forms droplets at high protein concentration without polyP,
        while native gels show polyP-dependent HMW Hfq assemblies in starved WT lysates
        (Figure 4).
  - subject: tmar
    predicate: enables under nitrogen starvation
    object: condensation
    description: TmaR supports Hfq-focus assembly in the nitrogen-starvation condition,
      but this requirement does not extend to every osmotic-stress condition.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3003775
      notes: Figure 1L and S1H show loss of nitrogen-starvation Hfq foci in tmaR mutants,
        not rescued by Ppk10k. Figure 1M shows residual Hfq foci in tmaR mutants under
        strong osmotic stress.
  - subject: condensation
    predicate: forms
    object: h_body
    description: Cellular Hfq condensation produces the stress-responsive polar H-body.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3003775
      notes: Endogenous Hfq imaging, focus dynamics, hexanediol sensitivity and FRAP
        support the cellular condensate interpretation (Figures 1-3); purified droplets
        are a reconstitution, not an assertion that every cellular constituent is
        reconstituted.
  - subject: h_body
    predicate: concentrates
    object: rnase_e
    description: Nitrogen-starvation H-bodies enrich RNase E as an RNA-processing
      client.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3003775
      notes: Figure 4G-I combines HMW-complex association with live-cell RNase E/Hfq
        colocalization. These experiments do not establish whether the sequestered
        enzyme is catalytically inactive.
  - subject: h_body
    predicate: sequesters
    object: mrna
    description: H-bodies contain polyadenylated transcript cargo in the observed
      nitrogen-starved WT cells.
    evidence:
    - reference: DOI:10.1371/journal.pbio.3003775
      notes: Figure 5E shows poly(A)-RNA/Hfq colocalization in a subset of WT cells.
        Low FISH signal-to-noise limits quantification; no universal transcript occupancy
        or assembly requirement is inferred.
discussions:
- discussion_id: identity_and_condensate_boundary
  prompt: Distinguish H-body from BR-body, one Hfq hexamer and unrelated polyphosphate
    stores.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: Shared RNA or RNase E membership does not establish identical condensate
    identity. GO:0140365 has a broad minimal-component definition but an exact BR-body
    synonym and Caulobacter RNase E-scaffold provenance; it does not specifically
    denote Hfq-organized H-bodies.
  notes: Minted cellstructuremech:h_body after hidden/ignored-inclusive deduplication
    and exact GO searches for H-body, HP-body, Hfq and Hfq condensate. Used GO:0036464
    as the broader is-a parent and GO:0005737 for parthood. No BR-body equivalence
    or parentage is inferred. HslU-marked bacterial aggresomes, membrane-bounded acidocalcisomes,
    independently formed TmaR foci and mammalian P-bodies are not synonyms.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Minted cellstructuremech:h_body after hidden/ignored-inclusive deduplication
      and exact GO searches for H-body, HP-body, Hfq and Hfq condensate. Used GO:0036464
      as the broader is-a parent and GO:0005737 for parthood. No BR-body equivalence
      or parentage is inferred. HslU-marked bacterial aggresomes, membrane-bounded
      acidocalcisomes, independently formed TmaR foci and mammalian P-bodies are not
      synonyms.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: constituents_not_bulk_proteome
  prompt: Keep direct localization evidence separate from candidate proteomic associations.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: The native-gel screen can include polyP-binding proteins that do not
    interact with Hfq. The final paper reports mostly diffuse enolase fluorescence,
    unlike a stronger interpretation of the preprint.
  notes: Curated a supported six-component subset, not an exhaustive proteome. RNase
    E and RhlB have direct localization support. Enolase, Ppk and other proteins identified
    only by gel enrichment in this pass remain candidate associations, not established
    constituents. Ppk synthesis is not itself proof of incorporation. TmaR co-condensation
    and conditional assembly dependence justify inclusion despite its independently
    formed foci.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Curated a supported six-component subset, not an exhaustive proteome. RNase
      E and RhlB have direct localization support. Enolase, Ppk and other proteins
      identified only by gel enrichment in this pass remain candidate associations,
      not established constituents. Ppk synthesis is not itself proof of incorporation.
      TmaR co-condensation and conditional assembly dependence justify inclusion despite
      its independently formed foci.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: scope_of_polyphosphate_and_rna_effects
  prompt: Do not equate polyphosphate promotion with universal necessity or transcript
    preservation with proven RNase inhibition.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: Residual Hfq foci persist without polyP during nitrogen starvation, whereas
    effects are stronger under 1.17 M NaCl. Knockouts affect multiple processes and
    cannot uniquely assign survival or transcript-stability changes to condensation.
  notes: Set polyP DISPENSABLE and TmaR CONDITIONAL; RNA/client essentialities remain
    UNKNOWN. No broad taxonomic prevalence, generic survival edge, universal mRNA
    requirement or inactive-degradosome mechanism is asserted. Transcript stabilization
    is contextual association in the function evidence, not an isolated causal graph
    edge. Half-life sampling at 15-minute intervals emphasizes long-lived transcripts,
    as acknowledged in Methods.
  evidence:
  - reference: DOI:10.1371/journal.pbio.3003775
    notes: Set polyP DISPENSABLE and TmaR CONDITIONAL; RNA/client essentialities remain
      UNKNOWN. No broad taxonomic prevalence, generic survival edge, universal mRNA
      requirement or inactive-degradosome mechanism is asserted. Transcript stabilization
      is contextual association in the function evidence, not an isolated causal graph
      edge. Half-life sampling at 15-minute intervals emphasizes long-lived transcripts,
      as acknowledged in Methods.
  posed_by: codex
  posed_date: '2026-10-03'
