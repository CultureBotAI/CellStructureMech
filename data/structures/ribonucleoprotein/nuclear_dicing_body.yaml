functions:
- function_id: primary_mirna_processing
  label: primary miRNA processing
  grounding: GO:0031053
  description: Arabidopsis D-bodies concentrate DCL1, HYL1, SERRATE and pri-miRNA
    substrates in nuclear foci associated with primary miRNA processing.
  evidence:
  - reference: DOI:10.1016/j.cub.2007.04.005
    notes: Fang and Spector 2007 proposed that D-bodies orchestrate pri-miRNA processing
      and/or storage and assembly of miRNA-processing complexes.
  - reference: DOI:10.1038/s41556-020-00606-5
    notes: Xie et al. 2021 linked SERRATE-driven D-body formation to efficient pri-miRNA
      and pre-miRNA processing.
