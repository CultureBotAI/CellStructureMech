identifier: GO:0010445
label: nuclear dicing body
structure_category: RIBONUCLEOPROTEIN
structure_kind: OTHER
definition: A small round nuclear body, measuring 0.2-0.8 microns in diameter that
  is diffusely distributed throughout the nucleoplasm. Several proteins known to be
  involved in miRNA processing have been localized to these structures. D-bodies are
  thought to be involved in primary-miRNA processing and/or storage/assembly of miRNA
  processing complexes.
