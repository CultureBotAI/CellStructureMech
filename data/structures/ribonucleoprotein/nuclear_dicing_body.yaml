components:
- component_id: dicer_like_1
  label: Dicer-like 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - DCL1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Arabidopsis Dicer-like 1 is curated as the RNase III enzyme resident
    in nuclear dicing bodies; no exact source-neutral InterPro, Pfam or NCBIfam accession
    was assigned in this first record.
  role: RNase III enzyme concentrated in D-bodies and acting in plant primary miRNA
    processing with HYL1 and SERRATE.
  evidence:
  - reference: DOI:10.1016/j.cub.2007.04.005
    notes: Fang and Spector 2007 localized Arabidopsis DCL1 with HYL1 to nuclear dicing
      bodies and showed that a DCL1 mutant impaired in miRNA processing failed to
      target to D-bodies.
  - reference: DOI:10.1073/pnas.0701061104
    notes: Song et al. 2007 showed that HYL1 and DCL1 fusion proteins colocalize to
      small nuclear bodies that lack the Cajal-body marker Atcoilin.
- component_id: hyponastic_leaves1
  label: HYPONASTIC LEAVES1
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - HYL1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: HYL1 is curated as the Arabidopsis double-stranded RNA-binding
    protein resident in DCL1-containing D-bodies; no exact source-neutral InterPro,
    Pfam or NCBIfam accession was assigned in this first record.
  role: Double-stranded RNA-binding partner of DCL1 that localizes to D-bodies during
    plant primary miRNA processing.
  evidence:
  - reference: DOI:10.1016/j.cub.2007.04.005
    notes: Fang and Spector 2007 colocalized HYL1 with DCL1 in nuclear dicing bodies
      in living Arabidopsis cells.
  - reference: DOI:10.1073/pnas.0701061104
    notes: Song et al. 2007 found that HYL1 and DCL1 nuclear bodies are distinct from
      Arabidopsis Cajal bodies.
- component_id: serrate
  label: SERRATE
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - SE
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: SERRATE is curated as the Arabidopsis zinc-finger protein that
    interacts with DCL1 and HYL1 in D-bodies and can drive D-body assembly; no exact
    source-neutral InterPro, Pfam or NCBIfam accession was assigned in this first
    record.
  role: D-body scaffold-like protein whose phase separation recruits DCL1, HYL1 and
    pri/pre-miRNAs into D-body condensates.
  evidence:
  - reference: DOI:10.1016/j.cub.2007.04.005
    notes: Fang and Spector 2007 observed DCL1, HYL1 and SERRATE bimolecular-fluorescence-complementation
      interactions in nuclear dicing bodies.
  - reference: DOI:10.1038/s41556-020-00606-5
    notes: Xie et al. 2021 showed that SERRATE can drive DCL1, HYL1 and pri/pre-miRNAs
      into phase-separated D-body droplets and that SERRATE mutation abrogates D-body
      formation in vivo.
- component_id: primary_mirna_transcripts
  label: primary miRNA transcript cohort
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: D-bodies recruit multiple primary and precursor miRNA substrates
    rather than one named RNA species; no exact Sequence Ontology CURIE was assigned
    to this heterogeneous substrate cohort.
  role: Primary miRNA substrates recruited into D-bodies for DCL1/HYL1/SERRATE-dependent
    processing.
  evidence:
  - reference: DOI:10.1016/j.cub.2007.04.005
    notes: Fang and Spector 2007 recruited an introduced primary miRNA transcript
      to Arabidopsis D-bodies.
  - reference: DOI:10.1038/s41556-020-00606-5
    notes: Xie et al. 2021 reported that SERRATE brings pri/pre-miRNAs into D-body
      droplets and that pre-miRNAs can be processed inside those droplets.
