identifier: GO:0071004
label: U2-type prespliceosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that is formed by association of the 5' splice
  site with the U1 snRNP, while the branch point sequence is recognized by the U2
  snRNP. The prespliceosome includes many proteins in addition to those found in the
  U1 and U2 snRNPs. Commitment to a given pair of 5' and 3' splice sites occurs at
  the time of prespliceosome formation.
