identifier: GO:0005732
label: sno(s)RNA-containing ribonucleoprotein complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: 'A ribonucleoprotein complex that contains an RNA molecule of the snoRNA
  family and associated proteins. Many are involved in a step of processing of rRNA
  molecules: cleavage, 2''-O-methylation, or pseudouridylation, but other RNA types
  can be targets as well. The majority fall into one of two classes, box C/D type
  or box H/ACA type, which are conserved across eukaryotes and archaea. Other members
  include the telomerase RNA and the ribonuclease MRP RNA.'
