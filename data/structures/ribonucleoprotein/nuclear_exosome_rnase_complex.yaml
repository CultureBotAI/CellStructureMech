identifier: GO:0000176
label: nuclear exosome (RNase complex)
structure_category: RIBONUCLEOPROTEIN
structure_kind: MULTIPROTEIN_COMPLEX
definition: A ribonuclease complex that has 3-prime to 5-prime processive and distributive
  hydrolytic exoribonuclease activity and endoribonuclease activity, producing 5-prime-phosphomonoesters.
  Participates in a multitude of cellular RNA processing and degradation events preventing
  nuclear export and/or translation of aberrant RNAs. Restricted to processing linear
  and circular single-stranded RNAs (ssRNA) only. RNAs with complex secondary structures
  may have to be unwound or pre-processed by co-factors prior to entering the complex,
  esp if the 3-prime end is structured.
