functions:
- function_id: mrna_decoding
  label: mRNA decoding
  description: The bacterial 30S subunit monitors codon-anticodon geometry and selects
    cognate aminoacyl-tRNAs during translation.
  evidence:
  - reference: DOI:10.1126/science.1060612
    notes: Ogle et al. 2001 show 16S rRNA A1492, A1493, and G530 rearrangements around
      the codon-anticodon helix in the 30S decoding site.
evidence:
- reference: GO:0015935
  notes: Gene Ontology cellular-component term for the small ribosomal subunit.
- reference: GO:0005840
  notes: Gene Ontology cellular-component term for the containing ribosome.
- reference: DOI:10.1038/35030006
  notes: Wimberly et al. 2000, Structure of the 30S ribosomal subunit, Nature.
- reference: DOI:10.1126/science.1060612
  notes: Ogle et al. 2001, Recognition of cognate transfer RNA by the 30S ribosomal
    subunit, Science.
causal_graphs:
- graph_id: ssu_decoding_center
  title: 30S decoding center reads mRNA codons
  description: In the bacterial 30S subunit, the small-subunit rRNA scaffold positions
    a decoding center that inspects codon-anticodon geometry.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures the structurally resolved bacterial 30S decoding
    role of the small subunit, not the full elongation cycle handled by the parent
    ribosome record.
  nodes:
  - node_id: small_ribosomal_subunit
    label: small ribosomal subunit
    node_type: STRUCTURE
    grounding: GO:0015935
  - node_id: ssu_rrna
    label: small-subunit rRNA
    node_type: RNA
    component_ref: ssu_rrna
  - node_id: mrna_codon
    label: mRNA codon
    node_type: RNA
  - node_id: ssu_protein_cohort
    label: small subunit ribosomal proteins (uS/bS/eS cohort)
    node_type: GENE_OR_PROTEIN
    component_ref: ssu_protein_cohort
    description: Universal and domain-specific ribosomal proteins that stabilize the
      head, body, and platform domains of the small-subunit rRNA.
  edges:
  - subject: ssu_rrna
    predicate: forms decoding center of
    object: small_ribosomal_subunit
    description: 16S rRNA nucleotides in the bacterial 30S subunit form a decoding
      center that monitors codon-anticodon geometry.
    evidence:
    - reference: DOI:10.1126/science.1060612
      notes: Ogle et al. 2001 show the 30S decoding-center bases A1492, A1493, and
        G530 interacting with the minor groove of the codon-anticodon helix.
  - subject: small_ribosomal_subunit
    predicate: decodes
    object: mrna_codon
    description: The 30S subunit reads mRNA codons at its decoding center.
    evidence:
    - reference: DOI:10.1126/science.1060612
      notes: Ogle et al. 2001 structurally analyzed how the 30S subunit recognizes
        a cognate tRNA anticodon paired with mRNA.
  - subject: ssu_protein_cohort
    predicate: contributes to
    object: small_ribosomal_subunit
    description: Small-subunit ribosomal proteins bind across the 16S/18S rRNA domains
      to stabilize the assembled small ribosomal subunit and shape the mRNA path.
    evidence:
    - reference: DOI:10.1038/35030006
      notes: Wimberly et al. 2000 resolved the ribosomal protein cohort bound across
        the 16S rRNA domains in the 30S small ribosomal subunit.
    - reference: DOI:10.1128/MMBR.00013-07
      notes: Kaczanowska and Rydén-Aulin 2007 reviewed the structural and assembly
        roles of small-subunit ribosomal proteins.
discussions:
- discussion_id: split_small_subunit_components
  prompt: Split exact small-subunit rRNA and protein families across bacterial, archaeal,
    eukaryotic, and organellar ribosomes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#ssu_rrna
  - components#ssu_protein_cohort
  rationale: The cross-lineage GO:0015935 term covers homologous small ribosomal subunits
    with different rRNAs and many distinct ribosomal protein families. This first
    standalone record keeps the composition at coarse reviewed-label-only granularity
    until each exact source-neutral family is split and grounded.
  evidence:
  - reference: DOI:10.1038/35030006
    notes: Wimberly et al. 2000 resolve the bacterial 30S subunit with 16S rRNA and
      small-subunit proteins.
  - reference: DOI:10.1038/nature08403
    notes: Schmeing and Ramakrishnan 2009 review conserved and divergent structural
      features of translation.
  posed_by: codex
  posed_date: '2026-09-15'
- discussion_id: complex_portal_cpx_3802_scope
  prompt: Keep ComplexPortal:CPX-3802 scoped to the E. coli 30S source composition
    instead of making it an equivalent xref.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: ComplexPortal:CPX-3802 is the Escherichia coli K-12 30S small ribosomal
    subunit composition, whereas GO:0015935 denotes small ribosomal subunits across
    bacteria, archaea, eukaryotes, and organelles.
  resolution_note: Cited CPX-3802 as the E. coli K-12 exemplar source and did not
    add it to xrefs.
  evidence:
  - reference: ComplexPortal:CPX-3802
    notes: ComplexPortal:CPX-3802 is scoped to the E. coli K-12 30S small ribosomal
      subunit.
  - reference: GO:0015935
    notes: GO:0015935 is a cross-taxon small ribosomal subunit term.
