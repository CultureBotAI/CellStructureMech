  rationale: The cross-lineage GO:0015935 term covers homologous small ribosomal subunits
    with different rRNAs and many distinct ribosomal protein families. This first
    standalone record keeps the composition at coarse reviewed-label-only granularity
    until each exact source-neutral family is split and grounded.
  evidence:
