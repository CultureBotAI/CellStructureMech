    predicate: forms decoding center of
    object: small_ribosomal_subunit
    description: 16S rRNA nucleotides in the bacterial 30S subunit form a decoding
      center that monitors codon-anticodon geometry.
    evidence:
    - reference: DOI:10.1126/science.1060612
      notes: Ogle et al. 2001 show the 30S decoding-center bases A1492, A1493, and
        G530 interacting with the minor groove of the codon-anticodon helix.
  - subject: small_ribosomal_subunit
    predicate: decodes
    object: mrna_codon
    description: The 30S subunit reads mRNA codons at its decoding center.
    evidence:
