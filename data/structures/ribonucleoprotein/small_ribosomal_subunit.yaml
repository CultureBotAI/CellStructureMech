functions:
- function_id: mrna_decoding
  label: mRNA decoding
  description: The bacterial 30S subunit monitors codon-anticodon geometry and selects
    cognate aminoacyl-tRNAs during translation.
  evidence:
  - reference: DOI:10.1126/science.1060612
    notes: Ogle et al. 2001 show 16S rRNA A1492, A1493, and G530 rearrangements around
      the codon-anticodon helix in the 30S decoding site.
evidence:
- reference: GO:0015935
  notes: Gene Ontology cellular-component term for the small ribosomal subunit.
- reference: GO:0005840
  notes: Gene Ontology cellular-component term for the containing ribosome.
- reference: DOI:10.1038/35030006
  notes: Wimberly et al. 2000, Structure of the 30S ribosomal subunit, Nature.
- reference: DOI:10.1126/science.1060612
  notes: Ogle et al. 2001, Recognition of cognate transfer RNA by the 30S ribosomal
    subunit, Science.
causal_graphs:
- graph_id: ssu_decoding_center
  title: 30S decoding center reads mRNA codons
  description: In the bacterial 30S subunit, the small-subunit rRNA scaffold positions
    a decoding center that inspects codon-anticodon geometry.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures the structurally resolved bacterial 30S decoding
    role of the small subunit, not the full elongation cycle handled by the parent
    ribosome record.
  nodes:
  - node_id: small_ribosomal_subunit
    label: small ribosomal subunit
    node_type: STRUCTURE
    grounding: GO:0015935
  - node_id: ssu_rrna
    label: small-subunit rRNA
    node_type: RNA
    component_ref: ssu_rrna
  - node_id: mrna_codon
    label: mRNA codon
    node_type: RNA
  edges:
