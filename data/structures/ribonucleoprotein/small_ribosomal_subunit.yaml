components:
- component_id: ssu_rrna
  label: small-subunit rRNA
  component_type: RNA
  component_role: CONSTITUENT
  stoichiometry: '1'
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bacterial and archaeal small subunits are built on 16S rRNA, whereas
    eukaryotic cytosolic small subunits use 18S rRNA; no single SO term was curated
    that exactly denotes the cross-lineage small-subunit rRNA class.
  role: Structural RNA core of the small ribosomal subunit that forms the bacterial
    30S body, platform, and head and carries the decoding center.
  evidence:
  - reference: DOI:10.1038/35030006
    notes: Wimberly et al. 2000 resolved the Thermus thermophilus 30S structure with
      16S rRNA forming the body, platform, and head.
  - reference: DOI:10.1126/science.1060612
    notes: Ogle et al. 2001 structurally analyzed 16S rRNA bases in the 30S decoding
      center during cognate tRNA recognition.
- component_id: ssu_protein_cohort
  label: small-subunit ribosomal proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  stoichiometry: 21 proteins in Escherichia coli
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The small-subunit protein set contains many unrelated protein families
    and varies across bacterial, archaeal, eukaryotic, and organellar small ribosomal
    subunits; no single InterPro, Pfam, NCBIfam, GO, or Complex Portal term was curated
    that denotes the entire source-neutral cohort.
  role: Proteins that bind and stabilize the folded small-subunit rRNA scaffold to
    form a functional decoding subunit.
  evidence:
  - reference: DOI:10.1038/35030006
    notes: Wimberly et al. 2000 placed 20 proteins in the Thermus thermophilus 30S
      structure, mainly on the solvent-exposed surface.
  - reference: DOI:10.1128/MMBR.00013-07
    notes: Kaczanowska and Ryden-Aulin 2007 report 21 protein constituents for the
      Escherichia coli 30S subunit.
