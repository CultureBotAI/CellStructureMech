identifier: GO:0005655
label: nucleolar ribonuclease P complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonuclease P complex located in the nucleolus of a eukaryotic cell,
  where it catalyzes the 5' endonucleolytic cleavage of precursor tRNAs to yield mature
  tRNAs. Eukaryotic nucleolar ribonuclease P complexes generally contain a single
  RNA molecule that is necessary but not sufficient for catalysis, and several protein
  molecules.
