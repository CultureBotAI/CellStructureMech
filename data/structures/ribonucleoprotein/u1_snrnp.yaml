identifier: GO:0005685
label: U1 snRNP
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonucleoprotein complex that contains small nuclear RNA U1, a heptameric
  ring of Sm proteins, as well as several proteins that are unique to the U1 snRNP,
  most of which remain associated with the U1 snRNA both while the U1 snRNP is free
  or assembled into a series of spliceosomal complexes.
