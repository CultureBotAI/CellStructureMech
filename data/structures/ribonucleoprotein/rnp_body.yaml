    node_type: BIOLOGICAL_PROCESS
  - node_id: rnp_body
    label: RNP body
    node_type: STRUCTURE
    grounding: GO:0140365
  - node_id: rna_cleavage
    label: RNase E-mediated RNA cleavage
    node_type: BIOLOGICAL_PROCESS
  - node_id: disassembly
    label: BR-body disassembly
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: rnase_e
    predicate: drives
    object: condensation
    description: The disordered RNase E CTD drives condensate assembly under the tested
      conditions.
    evidence:
    - reference: DOI:10.1016/j.molcel.2018.08.003
      notes: CTD deletion abolishes foci, CTD-only constructs form foci, and purified
        CTD forms salt- and concentration-dependent liquid-like droplets.
  - subject: mrna
    predicate: promotes
    object: condensation
    description: Available mRNA supports cellular body formation; RNA addition promotes
      purified CTD condensation over a broader salt range within a concentration window.
    evidence:
    - reference: DOI:10.1016/j.molcel.2018.08.003
      notes: Rifampicin/T7 experiments establish the cellular mRNA dependence; poly-A
        titrations promote droplets at intermediate RNA concentrations, while excess
        RNA inhibits condensation.
  - subject: condensation
    predicate: forms
    object: rnp_body
    description: RNase E condensation with RNA produces bacterial RNP bodies.
    evidence:
    - reference: DOI:10.1016/j.molcel.2018.08.003
      notes: Live-cell fusion dynamics, RNase E domain perturbations and purified-protein
        phase behavior support the condensate interpretation.
  - subject: rnase_e
    predicate: catalyzes
    object: rna_cleavage
    description: The catalytic N-terminal domain cleaves RNA, distinct from the CTD
      assembly function.
    evidence:
    - reference: DOI:10.1016/j.molcel.2018.08.003
      notes: Catalytically impaired RNase E and CTD-only replacements retain bodies
        but fail to support their normal rapid disassembly.
  - subject: rnp_body
    predicate: stimulates
    object: rna_cleavage
    description: Condensate organization accelerates the initial cleavage of tested
      mRNA substrates in the assayed growth conditions.
    evidence:
    - reference: DOI:10.1016/j.molcel.2020.04.001
      notes: qRT-PCR half-lives are prolonged in the noncondensing NTD mutant and
        partly restored by the condensation-competent degradosome-binding-site mutant,
        separating condensation from client recruitment.
  - subject: rna_cleavage
    predicate: enables
    object: disassembly
    description: RNA cleavage permits rapid BR-body dissolution during the observed
      growth-condition cycle.
    evidence:
    - reference: DOI:10.1016/j.molcel.2018.08.003
      notes: Wild-type bodies are dynamic on the minute scale; two catalytic mutants
        retain bodies throughout ten-minute imaging, and RNase A treatment dissolves
        stabilized bodies in lysates.
discussions:
- discussion_id: condensate_not_degradosome_or_eukaryotic_granule
  prompt: Keep the BR-body condensate distinct from one RNA degradosome and from eukaryotic
    granules.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: The existing bacterial degradosome record describes a protein complex
    with an E. coli-centered component set. BR-bodies are mesoscale RNase E/RNA condensates
    whose assembly persists after several degradosome-client binding sites are removed.
    Eukaryotic P-bodies and stress granules are analogies, not exact identities.
  notes: Used exact GO:0140365 rather than a duplicate degradosome identifier. No
    enolase, eukaryotic translation-initiation complex, ribosome or tmRNA constituent
    was transferred. The 2020 RNA-enrichment and imaging experiments show depletion
    of ribosomal RNAs, tmRNA and ribosomes from BR-bodies. The four curated components
    are a supported subset, not an exhaustive proteome; PNPase, RNase D, small RNAs
    and antisense RNAs remain additional evidenced composition leads.
  evidence:
  - reference: DOI:10.1016/j.molcel.2018.08.003
    notes: RNase E scaffold/client-binding-site experiments distinguish condensate
      assembly from degradosome recruitment.
  - reference: DOI:10.1016/j.molcel.2020.04.001
    notes: RNA enrichment and super-resolution imaging delimit the cargo and ribosome
      boundary.
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
- discussion_id: resolve_client_families
  prompt: Establish exact taxon-neutral family groundings for the RhlB and aconitase
    client classes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#rhlb
  - components#aconitase
  rationale: The verified strain-specific UniProt mappings identify the assayed loci,
    but domain and broad superfamily matches cannot substitute for exact whole-protein
    family groundings. Current UniProt calls CCNA_01923 RhpA, whereas the paper and
    gene symbol call it RhlB; this nomenclature difference is explicitly retained.
  notes: Client localization and dispensability for condensate formation are supported
    independently by the 2018 experiments. No guessed family accessions were added.
  evidence:
  - reference: DOI:10.1016/j.molcel.2018.08.003
    notes: Figure 3 and fluorescent-fusion methods establish the assayed clients and
      their loci.
  posed_by: codex
  posed_date: '2026-10-03'
- discussion_id: taxon_occurrence_not_prevalence
  prompt: Distinguish the verified NA1000 example from species-wide prevalence.
  kind: CURATION_TODO
  status: RESOLVED
  rationale: A species-level VARIABLE presence row would imply patchiness across lineages
    that the curated NA1000 experiments do not establish. A qualifying note cannot
    remove that assertion from the structured field.
  notes: Removed the provisional distribution row before commit. Retained NCBITaxon:565050
    under canonical_examples. The 2018 paper also images Agrobacterium and Sinorhizobium,
    but these are not extrapolated into an order- or class-wide prevalence statement
    in this focused record.
  evidence:
  - reference: DOI:10.1016/j.molcel.2018.08.003
  posed_by: codex
  posed_date: '2026-10-03'
  resolved_date: '2026-10-03'
