components:
- component_id: rnase_e
  label: Ribonuclease E
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR028878
  gene_symbols:
  - rne
  essentiality: ESSENTIAL
  role: 'Core scaffold in Caulobacter: its disordered C-terminal domain supports condensation
    with RNA and recruits degradosome clients; its catalytic domain cleaves RNA. Family
    membership alone does not establish BR-body formation in other bacteria.'
  protein_examples:
  - uniprot_id: UniProtKB:A0A0H3CAR6
    protein_label: Ribonuclease E
    gene_symbol: rne
    taxon_id: NCBITaxon:565050
    taxon_label: Caulobacter vibrioides NA1000
    entry_status: UNREVIEWED
    retrieved_on: '2026-10-03'
    role: Experimentally tested BR-body scaffold and endoribonuclease.
    evidence:
    - reference: UniProtKB:A0A0H3CAR6
      notes: UniProt identifies CCNA_01954 in taxon 565050; the accession is an unreviewed
        sequence mapping, not independent localization evidence.
    - reference: DOI:10.1016/j.molcel.2018.08.003
      notes: Methods identify CCNA_01954 as the locus used for the experimentally
        localized fluorescent fusion.
  evidence:
  - reference: DOI:10.1016/j.molcel.2018.08.003
    notes: CTD deletion disperses RNase E; CTD-only constructs form condensates. RNase
      E depletion disperses RhlB and aconitase foci. Assembly essentiality refers
      to this scaffold, not a requirement for its catalytic domain.
  - reference: InterPro:IPR028878
    notes: Verified Ribonuclease E family, rather than the broader RNase E/G family;
      UniProt maps the experimentally used CCNA_01954 product to it.
- component_id: mrna
  label: mRNA
  component_type: RNA
  component_role: CONSTITUENT
  grounding: SO:0000234
  essentiality: CONDITIONAL
  role: RNA cargo and assembly substrate. Long, poorly translated mRNAs are preferentially
    enriched in the experimentally isolated Caulobacter bodies; the SO grounding denotes
    the RNA class, not this translation state.
  evidence:
  - reference: DOI:10.1016/j.molcel.2018.08.003
    notes: In vivo mRNA depletion disperses bodies and rifampicin-resistant T7 transcription
      preserves them. Purified RNase E CTD can condense without RNA at suitable protein
      and salt concentrations, so mRNA is not asserted to be universally required
      in vitro.
  - reference: DOI:10.1016/j.molcel.2020.04.001
    notes: RNA sequencing of active-site-mutant-stabilized bodies enriches mRNAs,
      small RNAs and antisense RNAs. Longer RNAs stimulate CTD droplet assembly in
      vitro; mRNA is not the only RNA class present.
- component_id: rhlb
  label: RhlB RNA helicase
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - rhlB
  essentiality: DISPENSABLE
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The Caulobacter CCNA_01923 product maps to the RhlB-like helicase
    domain IPR044742, not an exact whole-protein family. InterPro searches also found
    RhlB families IPR022077 and IPR023554, but their coverage of this experimentally
    tested product was not established; no domain is promoted to a family grounding.
  role: RNase E-recruited helicase client within Caulobacter BR-bodies. Loss of its
    RNase E binding site eliminates client foci without eliminating RNase E bodies.
  protein_examples:
  - uniprot_id: UniProtKB:A0A0H3C8I9
    protein_label: DEAD-box ATP-dependent RNA helicase RhpA
    gene_symbol: rhlB
    taxon_id: NCBITaxon:565050
    taxon_label: Caulobacter vibrioides NA1000
    entry_status: UNREVIEWED
    retrieved_on: '2026-10-03'
    role: RhlB in the paper; UniProt currently labels the same locus RhpA while retaining
      the rhlB gene symbol.
    evidence:
    - reference: UniProtKB:A0A0H3C8I9
      notes: UniProt identifies CCNA_01923 in taxon 565050; the accession is an unreviewed
        sequence mapping, not independent localization evidence.
    - reference: DOI:10.1016/j.molcel.2018.08.003
      notes: Methods identify CCNA_01923 as the locus used for the experimentally
        localized fluorescent fusion.
  evidence:
  - reference: DOI:10.1016/j.molcel.2018.08.003
    notes: Figure 3 and associated binding-site deletion experiments show RhlB co-localization
