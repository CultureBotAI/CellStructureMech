  reference: DOI:10.1016/j.molcel.2018.08.003
functions:
- function_id: mrna_catabolism
  label: mRNA catabolic process
  grounding: GO:0006402
  description: During the assayed Caulobacter growth conditions, BR-bodies preferentially
    organize poorly translated mRNAs and decay enzymes, stimulating initial endonucleolytic
    cleavage and subsequent degradation. This does not assert identical RNA fate under
    every stress condition.
  evidence:
  - reference: DOI:10.1016/j.molcel.2020.04.001
    notes: Global half-life profiling and paired RNA-seq/qRT-PCR comparisons distinguish
      condensation-dependent initial cleavage from the contribution of recruited exoribonucleases
      to decay of intermediates.
evidence:
- reference: GO:0140365
  notes: Active GO cellular-component identity with exact BR-body synonym and original-paper
    PMID 30197298; GO:0036464 is its is-a parent.
- reference: DOI:10.1016/j.molcel.2018.08.003
  notes: Al-Husini et al. 2018, alpha-proteobacterial RNA degradosomes assemble liquid-liquid
    phase separated RNP bodies. Full-text results and methods read through NCBI PMC
    BioC (PMC6151146).
- reference: DOI:10.1016/j.molcel.2020.04.001
  notes: Al-Husini et al. 2020, BR-bodies provide selectively permeable condensates
    that stimulate mRNA decay and prevent release of decay intermediates. Results
    read through NCBI PMC BioC (PMC7245546).
causal_graphs:
- graph_id: caulobacter_br_body_cycle
  title: RNA-dependent condensation couples BR-body assembly to RNA cleavage
  description: Caulobacter RNase E and available mRNA promote condensation; the resulting
    bodies stimulate RNA cleavage, which enables their dynamic disassembly.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  scope_notes: Based on NA1000-derived cellular perturbations and purified Caulobacter
    RNase E CTD assays from 2018 and 2020. RNA promotes rather than universally enables
    in vitro condensation. The graph describes the growth-condition decay cycle, not
    all stress states, all bacterial RNase E proteins, or a fixed stoichiometric complex.
  nodes:
  - node_id: rnase_e
    label: Ribonuclease E
    node_type: GENE_OR_PROTEIN
    grounding: InterPro:IPR028878
    component_ref: rnase_e
