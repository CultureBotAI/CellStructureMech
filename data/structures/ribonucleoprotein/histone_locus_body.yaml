components:
- component_id: npat_mxc_scaffold
  label: NPAT/Mxc scaffold protein
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - NPAT
  - mxc
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: NPAT and Drosophila Mxc are curated together as the conserved HLB
    scaffold factor; no exact source-neutral InterPro, Pfam or NCBIfam accession covering
    the orthologous scaffold family was assigned in this first record.
  role: Scaffold protein concentrated at replication-dependent histone gene loci that
    promotes histone locus body assembly.
  evidence:
  - reference: DOI:10.1091/mbc.E14-10-1445
    notes: Terzo et al. 2015 tested Multi Sex Combs accumulation and formation functions
      in the Drosophila histone locus body.
  - reference: DOI:10.1074/jbc.M114.616466
    notes: Yang et al. 2014 analyzed a conserved NPAT/Mxc interaction that is essential
      for histone locus body biogenesis.
- component_id: flash
  label: FLASH
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - FLASH
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: FLASH is represented as a conserved histone locus body resident
    protein and NPAT/Mxc interactor; no exact reviewed InterPro, Pfam or NCBIfam family
    accession was assigned in this first record.
  role: HLB resident protein that interacts with NPAT/Mxc and supports histone locus
    body biogenesis.
  evidence:
  - reference: DOI:10.1074/jbc.M114.616466
    notes: Yang et al. 2014 characterized the NPAT/Mxc-FLASH interaction in HLB biogenesis.
  - reference: DOI:10.1091/mbc.E20-03-0176
    notes: Koreski et al. 2020 analyzed multiple Drosophila HLB assembly interactions
      involving Mxc and FLASH.
- component_id: u7_snrnp
  label: U7 snRNP
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  grounding: GO:0005683
  essentiality: UNKNOWN
  role: Ribonucleoprotein component of histone 3'-end processing that localizes to
    the HLB in Drosophila.
  evidence:
  - reference: GO:0035363
    notes: GO:0035363 states that U7 snRNP is located in the Drosophila histone locus
      body rather than in a distinct Cajal body.
  - reference: DOI:10.1083/jcb.200511038
    notes: Liu et al. 2006 localized Drosophila U7 snRNP to a separate histone locus
      body associated with the histone gene locus.
taxonomic_distribution:
- taxon_id: NCBITaxon:7227
  taxon_label: Drosophila melanogaster
  presence: VARIABLE
  note: Drosophila melanogaster was used to define the HLB as a nuclear body at the
    histone gene locus and to study Mxc/FLASH-dependent HLB assembly.
  reference: DOI:10.1083/jcb.200511038
- taxon_id: NCBITaxon:9606
  taxon_label: Homo sapiens
  presence: VARIABLE
  note: Human NPAT and FLASH were used to define a conserved interaction required
    for HLB biogenesis.
  reference: DOI:10.1074/jbc.M114.616466
canonical_examples:
- taxon_id: NCBITaxon:7227
  taxon_label: Drosophila melanogaster
  note: Drosophila embryos and tissues were used to connect U7 snRNP, Mxc and FLASH
    with assembly and function of the HLB at the replication-dependent histone gene
    locus.
  reference: DOI:10.1091/mbc.e06-11-1033
functions:
- function_id: replication_dependent_histone_mrna_biogenesis
  label: replication-dependent histone mRNA biogenesis
  description: Histone locus bodies concentrate replication-dependent histone transcription
    and pre-mRNA processing factors at the histone gene cluster.
  evidence:
  - reference: DOI:10.1080/15476286.2016.1265198
    notes: Duronio and Marzluff 2017 reviewed HLB assembly and function in cell-cycle-regulated
      histone gene expression.
  - reference: DOI:10.1083/jcb.201504043
    notes: Tatomer et al. 2016 showed that concentrating pre-mRNA processing factors
      in the HLB facilitates efficient Drosophila histone mRNA biogenesis.
