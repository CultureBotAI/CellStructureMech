- timestamp: '2026-09-28T00:42:12Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added GO HLB synonymy, nuclear-RNP-granule parentage, nuclear-lumen parthood,
    label-only NPAT/Mxc and FLASH components, a GO-grounded U7 snRNP component, Drosophila
    and human HLB taxonomic scope, a Drosophila canonical example, histone mRNA biogenesis
    function evidence, DOI/GO evidence, a nonmechanistic HLB organization graph and
    a component-boundary TODO.
  llm_assisted: true
