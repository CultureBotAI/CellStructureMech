identifier: GO:0035363
label: histone locus body
structure_category: RIBONUCLEOPROTEIN
structure_kind: OTHER
definition: A nuclear body associated with the histone gene locus that is thought
  to contain all of the factors necessary for histone mRNA transcription and pre-mRNA
  processing. In Drosophila, U7 snRNP is located in the histone locus body rather
  than the distinct Cajal body.
definition_source: GO:0035363
mapping_status: PROPOSED
