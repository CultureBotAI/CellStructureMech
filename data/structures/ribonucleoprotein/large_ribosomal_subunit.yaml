functions:
- function_id: peptidyl_transferase
  label: peptidyltransferase activity
  grounding: GO:0000048
  description: The 50S peptidyl transferase center forms peptide bonds on the large-subunit
    rRNA scaffold during translation.
  evidence:
  - reference: DOI:10.1126/science.289.5481.920
    notes: Nissen et al. 2000 showed that the peptidyl transferase center of the 50S
      subunit is made entirely of RNA.
