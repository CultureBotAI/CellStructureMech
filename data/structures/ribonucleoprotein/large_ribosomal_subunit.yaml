functions:
- function_id: peptidyl_transferase
  label: peptidyltransferase activity
  grounding: GO:0000048
  description: The 50S peptidyl transferase center forms peptide bonds on the large-subunit
    rRNA scaffold during translation.
  evidence:
  - reference: DOI:10.1126/science.289.5481.920
    notes: Nissen et al. 2000 showed that the peptidyl transferase center of the 50S
      subunit is made entirely of RNA.
evidence:
- reference: GO:0015934
  notes: Gene Ontology cellular-component term for the large ribosomal subunit.
- reference: GO:0005840
  notes: Gene Ontology cellular-component term for the containing ribosome.
- reference: DOI:10.1126/science.289.5481.905
  notes: Ban et al. 2000, The complete atomic structure of the large ribosomal subunit
    at 2.4 A resolution, Science.
- reference: DOI:10.1126/science.289.5481.920
  notes: Nissen et al. 2000, The structural basis of ribosome activity in peptide
    bond synthesis, Science.
causal_graphs:
- graph_id: lsu_peptidyl_transferase_center
  title: 50S peptidyl transferase center forms peptide bonds
  description: In the archaeal 50S subunit, large-subunit rRNA forms a peptidyl transferase
    center where peptide bonds are made.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures the structurally resolved 50S RNA basis of peptidyl
    transfer, not the full elongation cycle handled by the parent ribosome record.
  nodes:
  - node_id: large_ribosomal_subunit
    label: large ribosomal subunit
    node_type: STRUCTURE
    grounding: GO:0015934
  - node_id: major_lsu_rrna
    label: major large-subunit rRNA
    node_type: RNA
    component_ref: major_lsu_rrna
  - node_id: rrna_5s
    label: 5S rRNA
    node_type: RNA
    grounding: SO:0000652
    component_ref: rrna_5s
    description: Conserved ~120-nucleotide ribosomal RNA forming the central protuberance
      of the large ribosomal subunit.
  - node_id: lsu_protein_cohort
    label: large subunit ribosomal proteins (uL/bL/eL cohort)
    node_type: GENE_OR_PROTEIN
    component_ref: lsu_protein_cohort
    description: Universal and domain-specific ribosomal proteins that pack over the
      large-subunit rRNA surface and extend unstructured tails into the rRNA core.
  edges:
  - subject: major_lsu_rrna
    predicate: forms peptidyl transferase center of
    object: large_ribosomal_subunit
    description: 23S rRNA forms the peptidyl transferase center of the 50S large subunit.
    evidence:
    - reference: DOI:10.1126/science.289.5481.920
      notes: Nissen et al. 2000 localized all 50S peptidyl-transferase-center contacts
        to 23S rRNA.
  - subject: rrna_5s
    predicate: contributes to
    object: large_ribosomal_subunit
    description: The 5S rRNA assembles with ribosomal proteins uL5 and uL18 to form
      the central protuberance of the large ribosomal subunit.
    evidence:
    - reference: DOI:10.1126/science.289.5481.905
      notes: Ban et al. 2000 resolved the atomic structure of the 50S large ribosomal
        subunit including the 23S rRNA, 5S rRNA, and ribosomal protein cohort.
    - reference: DOI:10.1128/MMBR.00013-07
      notes: Kaczanowska and Rydén-Aulin 2007 reviewed the assembly and structural
        organization of 5S rRNA and large-subunit ribosomal proteins in the 50S subunit.
  - subject: lsu_protein_cohort
    predicate: contributes to
    object: large_ribosomal_subunit
    description: Large-subunit ribosomal proteins pack across the solvent-exposed
      surface of the 23S/28S and 5S rRNAs and stabilize the folded ribonucleoprotein
      subunit.
    evidence:
    - reference: DOI:10.1126/science.289.5481.905
      notes: Ban et al. 2000 resolved the atomic structure of the 50S large ribosomal
        subunit including the 23S rRNA, 5S rRNA, and ribosomal protein cohort.
    - reference: DOI:10.1128/MMBR.00013-07
      notes: Kaczanowska and Rydén-Aulin 2007 reviewed the assembly and structural
        organization of 5S rRNA and large-subunit ribosomal proteins in the 50S subunit.
discussions:
- discussion_id: split_large_subunit_components
  prompt: Split exact large-subunit rRNA and protein families across bacterial, archaeal,
    eukaryotic, and organellar ribosomes.
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - components#major_lsu_rrna
  - components#rrna_5s
  - components#lsu_protein_cohort
  rationale: The cross-lineage GO:0015934 term covers homologous large ribosomal subunits
    with different catalytic rRNAs, 5S or 5.8S-family RNAs, and many distinct ribosomal
    protein families. This first standalone record keeps the composition at coarse
    reviewed-label-only granularity until each exact source-neutral family is split
    and grounded.
  evidence:
  - reference: DOI:10.1126/science.289.5481.905
    notes: Ban et al. 2000 resolve an archaeal 50S subunit with 23S and 5S rRNAs plus
      large-subunit proteins.
  - reference: DOI:10.1038/nature08403
    notes: Schmeing and Ramakrishnan 2009 review conserved and divergent structural
      features of translation.
  posed_by: codex
  posed_date: '2026-09-15'
- discussion_id: complex_portal_cpx_3807_scope
  prompt: Keep ComplexPortal:CPX-3807 scoped to the E. coli 50S source composition
    instead of making it an equivalent xref.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: ComplexPortal:CPX-3807 is the Escherichia coli K-12 50S large ribosomal
    subunit composition, whereas GO:0015934 denotes large ribosomal subunits across
    bacteria, archaea, eukaryotes, and organelles.
  resolution_note: Cited CPX-3807 as the E. coli K-12 exemplar source and did not
    add it to xrefs.
  evidence:
  - reference: ComplexPortal:CPX-3807
    notes: ComplexPortal:CPX-3807 is scoped to the E. coli K-12 50S large ribosomal
      subunit.
  - reference: GO:0015934
    notes: GO:0015934 is a cross-taxon large ribosomal subunit term.
