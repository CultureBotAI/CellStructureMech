identifier: GO:0015934
label: large ribosomal subunit
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: The larger of the two subunits of a ribosome. Two sites on the ribosomal
  large subunit are involved in translation, namely the aminoacyl site (A site) and
  peptidyl site (P site).
definition_source: GO:0015934
mapping_status: PROPOSED
curation_history:
- timestamp: '2026-09-15T18:27:08Z'
  curator: codex
  action: CREATED_RECORD
  changes: Scaffolded by scripts/new_record.py
  llm_assisted: true
- timestamp: '2026-09-15T18:28:40Z'
  curator: codex
  action: EXPANDED_RECORD
  changes: Added GO synonymy, ribosome parthood, broad catalytic rRNA and protein-cohort
    components, Haloarcula and E. coli exemplars, peptide bond formation function,
    GO/literature evidence, a 50S peptidyl transferase graph, and component-grounding
    and CPX-3807 scope discussions.
  llm_assisted: true
synonyms:
- synonym_text: ribosomal large subunit
  synonym_type: EXACT_SYNONYM
  source: GO:0015934
part_of:
- GO:0005840
components:
- component_id: major_lsu_rrna
  label: major large-subunit rRNA
  component_type: RNA
  component_role: CONSTITUENT
  stoichiometry: '1'
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Bacterial and archaeal 50S large subunits use 23S rRNA, whereas
    eukaryotic cytosolic 60S large subunits use 25S or 28S-family rRNAs; no single
    SO term was curated that exactly denotes the cross-lineage catalytic large-subunit
    rRNA class.
  role: Catalytic rRNA scaffold of the large ribosomal subunit that forms the peptidyl
    transferase center.
  evidence:
  - reference: DOI:10.1126/science.289.5481.920
    notes: Nissen et al. 2000 located the Haloarcula marismortui 50S peptidyl transferase
      center in 23S rRNA.
  - reference: DOI:10.1126/science.289.5481.905
    notes: Ban et al. 2000 resolved the Haloarcula marismortui 50S large subunit with
      23S and 5S rRNAs in the RNA core.
- component_id: lsu_protein_cohort
  label: large-subunit ribosomal proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  stoichiometry: 33 proteins in Escherichia coli
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The large-subunit protein set contains many unrelated protein families
    and varies across bacterial, archaeal, eukaryotic, and organellar large ribosomal
    subunits; no single InterPro, Pfam, NCBIfam, GO, or Complex Portal term was curated
    that denotes the entire source-neutral cohort.
  role: Proteins that bind and stabilize the folded large-subunit rRNA scaffold to
    form a functional peptidyl-transferase subunit.
  evidence:
  - reference: DOI:10.1126/science.289.5481.905
    notes: Ban et al. 2000 describe proteins decorating the Haloarcula marismortui
      50S rRNA surface.
  - reference: DOI:10.1128/MMBR.00013-07
    notes: Kaczanowska and Ryden-Aulin 2007 report 33 protein constituents for the
      Escherichia coli 50S subunit.
canonical_examples:
