identifier: GO:0015934
label: large ribosomal subunit
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: The larger of the two subunits of a ribosome. Two sites on the ribosomal
  large subunit are involved in translation, namely the aminoacyl site (A site) and
  peptidyl site (P site).
definition_source: GO:0015934
