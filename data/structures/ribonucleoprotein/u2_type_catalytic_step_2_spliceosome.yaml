identifier: GO:0071007
label: U2-type catalytic step 2 spliceosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that contains the U2, U5 and U6 snRNPs bound to
  a splicing intermediate in which the first catalytic cleavage of the 5' splice site
  has occurred. The precise subunit composition differs significantly from that of
  the catalytic step 1, or activated, spliceosome, and includes many proteins in addition
  to those found in the U2, U5 and U6 snRNPs.
