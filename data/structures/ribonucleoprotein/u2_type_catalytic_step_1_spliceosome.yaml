identifier: GO:0071006
label: U2-type catalytic step 1 spliceosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that is formed by the displacement of the U1 and
  U4 snRNPs from the precatalytic spliceosome; the U2, U5 and U6 snRNPs remain associated
  with the mRNA. This complex, sometimes called the activated spliceosome, is the
  catalytically active form of the spliceosome, and includes many proteins in addition
  to those found in the U2, and U5 and U6 snRNPs.
