functions:
- function_id: rna_catabolic_process
  label: RNA catabolic process
  grounding: GO:0006401
  description: The RNA exosome participates in 3-prime-to-5-prime degradation of cellular
    RNA substrates.
  evidence:
  - reference: GO:0006401
    notes: GO:0006401 is the Gene Ontology biological-process term for RNA catabolic
      process.
  - reference: DOI:10.1016/j.cell.2006.10.037
    notes: Liu et al. 2006 analyzed reconstituted RNA exosome activities on generic,
      structured, AU-rich and polyadenylated RNA substrates.
- function_id: rna_processing
  label: RNA processing
  grounding: GO:0006396
  description: The RNA exosome participates in processing RNA precursors into mature
    products.
  evidence:
  - reference: GO:0006396
    notes: GO:0006396 is the Gene Ontology biological-process term for RNA processing.
  - reference: DOI:10.1016/s0092-8674(00)80432-8
    notes: Mitchell et al. 1997 showed that S. cerevisiae exosome components are required
      for 5.8S rRNA 3-prime processing.
