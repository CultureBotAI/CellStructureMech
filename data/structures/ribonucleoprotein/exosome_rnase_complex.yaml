- component_id: rrp44_dis3_rnase
  label: Rrp44/Dis3 catalytic nuclease
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - RRP44
  - DIS3
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Rrp44/Dis3 is modeled as the hydrolytic nuclease component of core-plus-Rrp44
    yeast exosomes; no exact source-neutral protein family CURIE for this exosome-bound
    role was curated.
  role: Catalytic 3-prime-to-5-prime exoribonuclease associated with the yeast exosome.
  evidence:
  - reference: DOI:10.1016/s0092-8674(00)80432-8
    notes: Mitchell et al. 1997 identified Rrp44/Dis3 among the original Saccharomyces
      cerevisiae exosome proteins.
  - reference: DOI:10.1016/j.cell.2006.10.037
    notes: Liu et al. 2006 compared yeast 9-, 10- and 11-subunit exosomes and assigned
      processive hydrolytic activity to Rrp44 and to the yeast 10-subunit exosome.
  protein_examples:
