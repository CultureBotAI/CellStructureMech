components:
- component_id: nine_subunit_exosome_core
  label: nine-subunit exosome core
  component_type: PROTEIN_COMPLEX
  component_role: CONSTITUENT
  stoichiometry: 9 subunits
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The conserved RNA exosome core is a nine-protein assembly built
    from RNase PH-like ring and S1/KH cap subunits; no exact source-neutral GO or
    Complex Portal term for the eukaryotic nine-subunit core was assigned in this
    pass.
  role: Protein barrel and cap that form the conserved scaffold of eukaryotic RNA
    exosome complexes.
  evidence:
  - reference: DOI:10.1016/j.cell.2006.10.037
    notes: Liu et al. 2006 reconstituted nine-subunit yeast and human exosomes and
      determined the crystal structure of a human nine-subunit exosome.
  - reference: RCSB_PDB:2NN6
    notes: RCSB PDB 2NN6 records the Liu et al. human RNA exosome structure with Rrp41,
      Rrp45, Rrp46, Rrp43, Mtr3, Rrp42, Csl4, Rrp4 and Rrp40.
- component_id: rrp44_dis3_rnase
  label: Rrp44/Dis3 catalytic nuclease
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - RRP44
  - DIS3
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Rrp44/Dis3 is modeled as the hydrolytic nuclease component of core-plus-Rrp44
    yeast exosomes; no exact source-neutral protein family CURIE for this exosome-bound
    role was curated.
  role: Catalytic 3-prime-to-5-prime exoribonuclease associated with the yeast exosome.
  evidence:
  - reference: DOI:10.1016/s0092-8674(00)80432-8
    notes: Mitchell et al. 1997 identified Rrp44/Dis3 among the original Saccharomyces
      cerevisiae exosome proteins.
  - reference: DOI:10.1016/j.cell.2006.10.037
    notes: Liu et al. 2006 compared yeast 9-, 10- and 11-subunit exosomes and assigned
      processive hydrolytic activity to Rrp44 and to the yeast 10-subunit exosome.
- component_id: rrp6_rnase
  label: Rrp6 catalytic nuclease
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - RRP6
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Rrp6 is modeled as the additional catalytic nuclease of yeast 11-subunit
    exosomes; no exact source-neutral protein family CURIE for this exosome-bound
    role was curated.
  role: Distributive hydrolytic 3-prime-to-5-prime exoribonuclease that associates
    with nuclear exosomes.
  evidence:
  - reference: DOI:10.1016/j.cell.2006.10.037
    notes: Liu et al. 2006 reconstituted yeast 11-subunit exosomes that included Rrp6
      and measured distributive hydrolytic activity for Rrp6.
taxonomic_distribution:
