identifier: GO:0000178
label: exosome (RNase complex)
structure_category: RIBONUCLEOPROTEIN
structure_kind: MULTIPROTEIN_COMPLEX
definition: A ribonuclease complex with 3'-to-5' exoribonuclease activity that participates
  in RNA processing and degradation.
