identifier: GO:0071012
label: catalytic step 1 spliceosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that is formed by the displacement of the two snRNPs
  from the precatalytic spliceosome; three snRNPs including U5 remain associated with
  the mRNA. This complex, sometimes called the activated spliceosome, is the catalytically
  active form of the spliceosome, and includes many proteins in addition to those
  found in the associated snRNPs.
