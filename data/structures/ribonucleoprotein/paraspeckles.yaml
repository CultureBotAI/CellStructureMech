  reference: DOI:10.1016/j.molcel.2009.01.026
functions:
- function_id: nuclear_rna_retention
  label: nuclear RNA retention
  description: Paraspeckles are NEAT1-built nuclear bodies associated with retention
    of selected RNAs in the nucleus.
  evidence:
  - reference: DOI:10.1083/jcb.200906113
    notes: Bond and Fox 2009 reviewed paraspeckles in relation to nuclear retention
      of RNA.
  - reference: DOI:10.1016/j.tibs.2017.12.001
    notes: Fox et al. 2018 reviewed paraspeckles as long-noncoding-RNA nuclear bodies
      assembled through phase separation.
