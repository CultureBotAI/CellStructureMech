components:
- component_id: neat1_lncrna
  label: NEAT1 lncRNA
  component_type: RNA
  component_role: CONSTITUENT
  gene_symbols:
  - NEAT1
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: NEAT1 is curated as the architectural long noncoding RNA required
    for mammalian paraspeckle structure; no exact Sequence Ontology CURIE for the
    paraspeckle-forming NEAT1 isoform was assigned in this first record.
  role: Architectural long noncoding RNA scaffold that is required for visible paraspeckle
    structure.
  evidence:
  - reference: DOI:10.1016/j.molcel.2009.01.026
    notes: Clemson et al. 2009 showed that NEAT1 RNA is essential for paraspeckle
      structure.
  - reference: DOI:10.1016/j.molcel.2018.05.019
    notes: Yamazaki et al. 2018 mapped functional domains of NEAT1 that induce paraspeckle
      assembly through phase separation.
- component_id: dbhs_paraspeckle_proteins
  label: DBHS paraspeckle proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - NONO
  - SFPQ
  - PSPC1
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: NONO, SFPQ and PSPC1 are modeled as a core DBHS-family protein
    cohort for this first paraspeckles record; no exact source-neutral InterPro, Pfam
    or NCBIfam accession covering the curated structural cohort was assigned.
  role: RNA-binding DBHS-family proteins that associate with NEAT1 and support paraspeckle
    integrity.
  evidence:
  - reference: DOI:10.1083/jcb.200906113
    notes: Bond and Fox 2009 reviewed SFPQ/PSF, NONO/p54nrb and PSPC1 as core paraspeckle
      proteins that associate with NEAT1.
  - reference: DOI:10.1083/jcb.201504117
    notes: Hennig et al. 2015 connected prion-like domains in paraspeckle RNA-binding
      proteins to subnuclear paraspeckle formation.
taxonomic_distribution:
- taxon_id: NCBITaxon:9606
  taxon_label: Homo sapiens
  presence: VARIABLE
  note: Paraspeckles were originally characterized as discrete subnuclear bodies in
