identifier: GO:0042382
label: paraspeckles
structure_category: RIBONUCLEOPROTEIN
structure_kind: OTHER
definition: Discrete subnuclear bodies in the interchromatin nucleoplasmic space,
  often located adjacent to nuclear specks. 10-20 paraspeckles are typically found
  in human cell nuclei.
