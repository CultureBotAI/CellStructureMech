identifier: GO:0030532
label: small nuclear ribonucleoprotein complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonucleoprotein complex that contains at least one small nuclear RNA
  (snRNA) and associated proteins. Small nuclear ribonucleoproteins are typically
  named for the snRNA constituents they contain, such as U1 snRNP, U4/U6 snRNP, or
  7SK snRNP; many become part of spliceosomes, while others regulate transcription
  elongation or replication-dependent histone pre-mRNA 3'-end processing.
