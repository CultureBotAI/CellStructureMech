identifier: GO:0005686
label: U2 snRNP
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonucleoprotein complex that contains small nuclear RNA U2, a heptameric
  ring of Sm proteins, as well as several proteins that are unique to the U2 snRNP,
  most of which remain associated with the U2 snRNA both while the U2 snRNP is free
  or assembled into a series of spliceosomal complexes.
