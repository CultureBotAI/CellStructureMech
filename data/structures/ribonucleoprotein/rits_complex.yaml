  reference: PMID:14704433
canonical_examples:
- taxon_id: NCBITaxon:284812
  taxon_label: Schizosaccharomyces pombe 972h-
  note: Model organism in which Verdel et al. 2004 and Motamedi et al. 2004 purified
    the Ago1-Chp1-Tas3-siRNA RITS complex and established its role in RNAi-directed
