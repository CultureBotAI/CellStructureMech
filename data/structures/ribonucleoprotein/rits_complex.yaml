causal_graphs:
- graph_id: rits_complex_assembly_and_heterochromatin_silencing
  title: Ago1, Chp1, Tas3, and siRNAs assemble the RITS complex to direct heterochromatin
    formation
  description: In Schizosaccharomyces pombe, Tas3 bridges Ago1 and Chp1 together with
    Ago1-bound siRNAs to assemble the RITS ribonucleoprotein complex, which promotes
    heterochromatin formation and regulatory ncRNA-mediated gene silencing.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  scope_notes: Captures Ago1-Chp1-Tas3-siRNA assembly into the S. pombe RITS complex
    and its positive regulation of heterochromatin formation and ncRNA-mediated silencing.
