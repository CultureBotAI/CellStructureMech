components:
- component_id: ago1_argonaute_subunit
  label: Protein argonaute
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR045246
  gene_symbols:
  - ago1
  stoichiometry: 1 copy per RITS complex
  essentiality: ESSENTIAL
  role: Argonaute family endoribonuclease and siRNA-binding effector subunit (Ago1)
    of the Schizosaccharomyces pombe RITS complex that binds centromeric and heterochromatic
    small interfering RNAs to target nascent noncoding transcripts.
  evidence:
  - reference: GO:0030958
    notes: GO:0030958 defines the RITS complex as containing an Argonaute homolog.
  - reference: PMID:14704433
    notes: Verdel et al. 2004 (DOI:10.1126/science.1093686) purified the S. pombe
      RITS complex containing Ago1, Chp1, Tas3, and Dicer-generated centromeric siRNAs.
  - reference: PMID:15607976
    notes: Motamedi et al. 2004 (DOI:10.1016/j.cell.2004.11.034) showed that Ago1
      in the RITS complex couples RNA-dependent RNA polymerase complex (RDRC) recruitment
      to heterochromatin assembly.
