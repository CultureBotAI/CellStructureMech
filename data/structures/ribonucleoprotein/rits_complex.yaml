    evidence:
    - reference: UniProtKB:O74957
      notes: Reviewed Swiss-Prot entry for Schizosaccharomyces pombe 972h- protein
        argonaute (ago1).
    - reference: PMID:14704433
      notes: Verdel et al. 2004 identified Ago1 as a core subunit of the S. pombe
        RITS complex.
- component_id: chp1_chromodomain_subunit
  label: Chromo domain-containing protein 1
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR049937
  gene_symbols:
  - chp1
  stoichiometry: 1 copy per RITS complex
  essentiality: ESSENTIAL
  role: Chromodomain subunit (Chp1) that binds histone H3 methylated at lysine 9 (H3K9me)
    to anchor the RITS complex at centromeric, telomeric, and mating-type heterochromatin.
  evidence:
  - reference: GO:0030958
    notes: GO:0030958 defines the RITS complex as containing a chromodomain protein
      required for heterochromatin assembly.
  - reference: PMID:14704433
    notes: Verdel et al. 2004 demonstrated that Chp1 co-purifies with Ago1 and Tas3
      in the RITS complex and requires Clr4-mediated H3K9 methylation to tether RITS
      to heterochromatin.
  protein_examples:
