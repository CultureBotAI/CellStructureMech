identifier: GO:0030958
label: RITS complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A protein complex required for heterochromatin assembly; contains an Argonaute
  homolog, a chromodomain protein, and at least one additional protein; named for
  RNA-induced initiation of transcriptional gene silencing.
definition_source: GO:0030958
mapping_status: PROPOSED
