functions:
- function_id: rnai_mediated_heterochromatin_formation
  label: heterochromatin formation
  grounding: GO:0031507
  description: Uses Ago1-bound siRNAs and the Chp1 H3K9me-binding chromodomain to
    engage nascent pericentromeric transcripts and recruit the Clr4 methyltransferase
    and RDRC machinery for heterochromatin assembly.
  evidence:
  - reference: GO:0030958
    notes: GO:0030958 defines the RITS complex as required for heterochromatin assembly.
  - reference: PMID:14704433
    notes: Verdel et al. 2004 showed that RITS is required for H3K9 methylation and
      Swi6/HP1 recruitment at centromeric heterochromatin.
- function_id: ncrna_mediated_gene_silencing
  label: regulatory ncRNA-mediated gene silencing
  grounding: GO:0031047
  description: Mediates co-transcriptional and transcriptional gene silencing at heterochromatic
    repeats via siRNA-guided recognition of nascent noncoding transcripts.
  evidence:
  - reference: PMID:14704433
    notes: Verdel et al. 2004 demonstrated siRNA-dependent transcriptional gene silencing
      by the RITS complex.
  - reference: PMID:15607976
    notes: Motamedi et al. 2004 showed that RITS couples siRNA-guided nascent transcript
      recognition to RDRC-dependent dsRNA synthesis and silencing.
