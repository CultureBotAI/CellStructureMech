    entry_status: REVIEWED
    retrieved_on: '2026-10-30'
    role: Reviewed Schizosaccharomyces pombe 972h- Chp1 chromodomain subunit of the
      RITS complex.
    evidence:
    - reference: UniProtKB:Q10103
      notes: Reviewed Swiss-Prot entry for Schizosaccharomyces pombe 972h- chromo
        domain-containing protein 1 (chp1).
    - reference: PMID:14704433
      notes: Verdel et al. 2004 identified Chp1 as the chromodomain subunit of S.
        pombe RITS.
- component_id: tas3_bridging_subunit
  label: RNA-induced transcriptional silencing complex protein tas3
  component_type: PROTEIN
  component_role: CONSTITUENT
  grounding: InterPro:IPR049112
  gene_symbols:
  - tas3
  stoichiometry: 1 copy per RITS complex
  essentiality: ESSENTIAL
  role: GW-hook bridging subunit (Tas3) that links the Argonaute subunit Ago1 to the
    chromodomain subunit Chp1 and self-associates via its C-terminal alpha-helical
    motif to promote RITS spreading across heterochromatic domains.
  evidence:
  - reference: PMID:14704433
    notes: Verdel et al. 2004 identified Tas3 as an essential bridging protein of
      the S. pombe Ago1-Chp1-Tas3 RITS complex.
  - reference: PMID:15607976
    notes: Motamedi et al. 2004 demonstrated that the Ago1-Chp1-Tas3 RITS complex
      physically interacts with RDRC on heterochromatic transcripts.
  protein_examples:
  - uniprot_id: UniProtKB:O94687
    protein_label: RNA-induced transcriptional silencing complex protein tas3
    gene_symbol: tas3
    taxon_id: NCBITaxon:284812
    taxon_label: Schizosaccharomyces pombe 972h-
    entry_status: REVIEWED
    retrieved_on: '2026-10-30'
    role: Reviewed Schizosaccharomyces pombe 972h- Tas3 bridging subunit of the RITS
      complex.
    evidence:
    - reference: UniProtKB:O94687
      notes: Reviewed Swiss-Prot entry for Schizosaccharomyces pombe 972h- RITS complex
        protein tas3.
    - reference: PMID:14704433
      notes: Verdel et al. 2004 discovered and named Tas3 as the third protein subunit
        of S. pombe RITS.
- component_id: sirna_guide_strand
  label: small interfering RNA guide strand
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Kept label-only for the heterogeneous pool of Dcr1-generated centromeric
    and heterochromatic siRNA guide strands bound by Ago1 in the S. pombe RITS ribonucleoprotein
    complex.
  role: Single-stranded small interfering RNA guide (~21-23 nt) bound by Ago1 that
    directs the RITS complex by base-pairing to nascent noncoding pericentromeric
    and heterochromatic transcripts.
  evidence:
  - reference: PMID:14704433
    notes: Verdel et al. 2004 demonstrated that the purified S. pombe RITS complex
      contains Dicer-generated centromeric siRNAs required for RITS localization to
      heterochromatin.
