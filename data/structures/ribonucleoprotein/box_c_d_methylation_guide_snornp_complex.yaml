identifier: GO:0031428
label: box C/D methylation guide snoRNP complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonucleoprotein complex containing a box C/D type RNA that is capable
  of ribose-2'-O-methylation of target RNAs. Box C/D type RNAs are widespread in eukaryotes
  and in Archaea, suggesting that an RNA-based guide mechanism for directing specific
  RNA 2'-O-ribose methylations was present in the common ancestor of Archaea and Eukarya.
  A conserved ribonucleoprotein complex composed of a box C/D guide snoRNA (or archaeal
  box C/D sRNA) containing kink-turn C/D and C'/D' motifs bound by the kink-turn binding
  protein Snu13p (L7Ae in Archaea), the scaffold subunits Nop56p and Nop58p (Nop5
  in Archaea), and the SAM-dependent 2'-O-ribose methyltransferase Nop1p/fibrillarin.
  The complex base-pairs with target pre-rRNA to direct site-specific 2'-O-methylation
  five nucleotides upstream of box D or D'.
