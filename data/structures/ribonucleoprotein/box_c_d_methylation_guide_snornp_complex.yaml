causal_graphs:
- graph_id: box_c_d_methylation_guide_snornp_complex_mechanism
  title: Box C/D snoRNP assembly and site-specific rRNA 2'-O-methylation
  description: Binding of Snu13/L7Ae to the box C/D kink-turn nucleates recruitment
    of Nop56/Nop58 and Nop1/fibrillarin, positioning the active site to transfer a
    methyl group from S-adenosyl-L-methionine onto the target pre-rRNA ribose 2'-hydroxyl.
  graph_kind: ASSEMBLY
