identifier: GO:0170049
label: box C/D RNP complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A ribonucleoprotein complex containing a small RNA with a C/D box sequence
  motif that functions in the modification and processing of precursor ribosomal RNAs.
  Most members of this family direct site-specific 2'-O-methylation of substrate RNAs
  (box C/D methylation guide snoRNPs and scaRNPs), while others, such as the U3, U8,
  U14, and U22 snoRNPs, mediate endonucleolytic cleavage and folding of pre-rRNA.
