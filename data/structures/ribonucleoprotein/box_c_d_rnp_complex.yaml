components:
- component_id: box_c_d_rna
  label: box C/D small RNA
  component_type: RNA
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Small non-coding RNA containing conserved box C (RUGAUGA) and box D (CUGA)
    kink-turn motifs that scaffolds the RNP and base-pairs with pre-rRNA substrates
    for 2'-O-methylation or pre-rRNA cleavage/folding.
  evidence:
  - reference: GO:0170049
    notes: GO:0170049 defines the complex as containing a small RNA with a C/D box
      sequence motif.
  - reference: PMID:9632712
    notes: Lafontaine and Tollervey 1998 review box C/D snoRNAs in both 2'-O-methylation
      and pre-rRNA cleavage.
- component_id: nop1_nop56_nop58_snu13_core
  label: Nop1-Nop56-Nop58-Snu13 core protein tetramer
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - NOP1
  - NOP56
  - NOP58
  - SNU13
  essentiality: ESSENTIAL
  role: Conserved four-protein core consisting of kink-turn binding protein Snu13p
    (15.5K), scaffold subunits Nop56p and Nop58p, and the 2'-O-methyltransferase Nop1p
    (fibrillarin).
  evidence:
  - reference: PMID:9372940
    notes: Wu et al. 1998 and related yeast studies established Nop1p, Nop56p, Nop58p,
      and Snu13p as the core proteins of box C/D snoRNPs.
  - reference: PMID:10982895
    notes: Watkins et al. 2000 showed that Snu13p/15.5K binds the box C/D kink-turn
      motif to nucleate assembly of the box C/D RNP core.
