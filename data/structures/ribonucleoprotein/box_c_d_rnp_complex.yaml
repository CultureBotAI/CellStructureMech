    notes: GO:0170049 defines the complex as containing a small RNA with a C/D box
      sequence motif.
  - reference: PMID:9632712
    notes: Wu P et al. 1998, 'Nop5p is a small nucleolar ribonucleoprotein component
      required for pre-18 S rRNA processing in yeast.', J Biol Chem — characterizes
      box C/D snoRNP components and pre-rRNA processing in yeast.
