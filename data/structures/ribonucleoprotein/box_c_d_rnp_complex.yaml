  role: Small non-coding RNA containing conserved box C (RUGAUGA) and box D (CUGA)
    kink-turn motifs that scaffolds the RNP and base-pairs with pre-rRNA substrates
    for 2'-O-methylation or pre-rRNA cleavage/folding.
  evidence:
