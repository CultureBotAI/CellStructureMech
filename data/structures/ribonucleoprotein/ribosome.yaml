identifier: GO:0005840
label: ribosome
definition: The ribonucleoprotein particle that translates mRNA into protein. The
  bacterial (70S) ribosome comprises a small (30S) subunit built on 16S rRNA, which
  decodes the mRNA, and a large (50S) subunit built on 23S and 5S rRNA, whose 23S
  rRNA catalyses peptide bond formation. Archaeal and eukaryotic cytosolic ribosomes
  are homologous but larger.
definition_source: GO:0005840
synonyms:
- synonym_text: 70S ribosome
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1126/science.1060089
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
has_part:
- GO:0015935
- GO:0015934
components:
- component_id: rrna_16s
  label: 16S rRNA (small-subunit rRNA)
  component_type: RNA
  grounding: SO:0000650
  gene_symbols:
  - rrs
  stoichiometry: '1'
  essentiality: ESSENTIAL
  role: Structural core of the 30S subunit; carries the decoding centre that monitors
    codon–anticodon pairing.
  evidence:
  - reference: DOI:10.1038/35030006
    notes: Wimberly et al. 2000 report the 3.05 Å structure of the Thermus thermophilus
      30S subunit, with 16S rRNA forming the body, platform and head.
- component_id: rrna_23s
  label: 23S rRNA (large-subunit rRNA)
  component_type: RNA
  grounding: SO:0000651
  gene_symbols:
  - rrl
  stoichiometry: '1'
  essentiality: ESSENTIAL
  role: Structural core of the 50S subunit; forms the peptidyl transferase centre.
  evidence:
  - reference: DOI:10.1126/science.289.5481.920
    notes: Nissen et al. 2000 show the peptidyl transferase centre of the Haloarcula
      marismortui 50S subunit is composed entirely of RNA — the ribosome is a ribozyme.
- component_id: rrna_5s
  label: 5S rRNA
  component_type: RNA
  grounding: SO:0000652
  gene_symbols:
  - rrf
  stoichiometry: '1'
  essentiality: ESSENTIAL
  role: Small RNA of the 50S central protuberance.
  evidence:
  - reference: DOI:10.1126/science.289.5481.905
    notes: Ban et al. 2000 resolve 5S rRNA within the 2.4 Å structure of the H. marismortui
      large subunit.
- component_id: ssu_proteins
  label: small-subunit ribosomal proteins (uS2–uS21, bS6, bS16, bS18, bS20, bS21)
  component_type: PROTEIN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: A paralogue set with no single family term. Previously grounded
    to GO:0003735 (structural constituent of ribosome), a molecular-function term
    that cannot denote a set of proteins; removed by the id-label gate. Split into
    per-protein components before grounding.
  stoichiometry: ~21 in Escherichia coli
  essentiality: CONDITIONAL
  role: Stabilise 16S rRNA folding; several are individually dispensable.
  evidence:
  - reference: DOI:10.1038/35030006
    notes: Wimberly et al. 2000 place 20 proteins in the T. thermophilus 30S structure,
      mostly on the solvent-exposed surface.
- component_id: lsu_proteins
  label: large-subunit ribosomal proteins (uL1–uL30, bL9, bL12, bL17…)
  component_type: PROTEIN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: A paralogue set with no single family term. Previously grounded
    to GO:0003735 (structural constituent of ribosome), a molecular-function term
    that cannot denote a set of proteins; removed by the id-label gate. Split into
    per-protein components before grounding.
  stoichiometry: ~33 in Escherichia coli
  essentiality: CONDITIONAL
  role: Stabilise 23S/5S rRNA; bL12 stalk recruits translation GTPases.
  evidence:
  - reference: DOI:10.1126/science.289.5481.905
    notes: Ban et al. 2000 describe the protein complement of the large subunit and
      its distribution over the rRNA surface.
