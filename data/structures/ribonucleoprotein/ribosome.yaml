  title: How the ribosome makes a peptide bond and moves along the mRNA
  description: Core elongation-cycle mechanism common to all ribosomes.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
  nodes:
  - node_id: ribosome
    label: ribosome
    node_type: STRUCTURE
    grounding: GO:0005840
  - node_id: ssu
    label: small ribosomal subunit
    node_type: STRUCTURE
    grounding: GO:0015935
  - node_id: rrna_23s
    label: 23S rRNA peptidyl transferase centre
    node_type: RNA
    component_ref: rrna_23s
    description: The peptidyl transferase centre is a region of 23S rRNA (component
      rrna_23s), not the whole molecule, so it carries no SO grounding of its own.
  - node_id: mrna_codon
    label: mRNA codon
    node_type: RNA
  - node_id: aa_trna
    label: aminoacyl-tRNA
    node_type: RNA
  - node_id: peptide_bond
    label: peptidyltransferase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0000048
  - node_id: ef_g
    label: elongation factor G
    node_type: GENE_OR_PROTEIN
  - node_id: translocation
    label: ribosomal translocation
    node_type: BIOLOGICAL_PROCESS
  edges:
  - subject: ssu
    predicate: decodes
    object: mrna_codon
    description: The 30S decoding centre monitors codon–anticodon geometry and selects
      the cognate aminoacyl-tRNA.
    evidence:
    - reference: DOI:10.1126/science.1060612
      notes: Ogle et al. 2001 show 16S rRNA bases A1492, A1493 and G530 flip out to
        read the minor groove of the codon–anticodon helix.
  - subject: aa_trna
    predicate: substrate of
    object: peptide_bond
    evidence:
    - reference: DOI:10.1038/nature08403
      notes: Aminoacyl-tRNA in the A site donates its amino group to the peptidyl-tRNA
        ester in the P site.
  - subject: rrna_23s
    predicate: catalyses
    object: peptide_bond
    predicate_id: RO:0002327
    description: Peptidyl transfer is catalysed by RNA; no protein side chain lies
      within 18 Å of the catalytic site.
    evidence:
    - reference: DOI:10.1126/science.289.5481.920
      notes: Nissen et al. 2000, the ribozyme result.
  - subject: ef_g
    predicate: drives
    object: translocation
    description: GTP hydrolysis by EF-G moves tRNAs from A/P to P/E sites and advances
      the mRNA by one codon.
    evidence:
    - reference: DOI:10.1038/nature08403
      notes: Schmeing & Ramakrishnan 2009 summarise EF-G-driven translocation.
  - subject: translocation
    predicate: occurs in
    object: ribosome
    predicate_id: BFO:0000066
    evidence:
    - reference: DOI:10.1038/nature08403
      notes: Translocation is an intrinsic ribosomal motion accelerated by EF-G.
