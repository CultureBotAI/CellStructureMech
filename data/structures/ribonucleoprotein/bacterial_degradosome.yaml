  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: RhlB is modeled as the DEAD-box helicase of the E. coli RNA degradosome;
    no exact source-neutral family CURIE for this degradosome constituent was curated.
  role: DEAD-box RNA helicase recruited to the RNase E scaffold and coupled to degradosome-mediated
    RNA decay.
  evidence:
