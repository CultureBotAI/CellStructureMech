identifier: GO:1990061
label: bacterial degradosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: MULTIPROTEIN_COMPLEX
definition: The degradosome is a protein complex playing a key role in mRNA degradation
  and RNA processing. It includes a RNA helicase, a 3'-5' phosphate-dependent PNPase
  and a RNase E bound-enolase.
definition_source: GO:1990061
