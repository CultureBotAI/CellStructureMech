components:
- component_id: rnase_e_scaffold
  label: RNase E scaffold endoribonuclease
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - rne
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: RNase E is the catalytic and scaffolding component of the Escherichia
    coli RNA degradosome; no exact source-neutral InterPro or Pfam family for this
    degradosome-specific RNase E role was curated.
  role: Large endoribonuclease scaffold whose C-terminal half carries binding sites
    for the other principal E. coli RNA degradosome components.
  evidence:
  - reference: DOI:10.1101/gad.12.17.2770
    notes: Vanzo et al. 1998 mapped binding sites for RhlB, enolase and polynucleotide
      phosphorylase to the carboxy-terminal half of E. coli RNase E.
  - reference: DOI:10.1146/annurev.micro.61.080706.093440
    notes: Carpousis 2007 reviewed RNase E as the multidomain scaffold of the E. coli
      RNA degradosome.
  protein_examples:
  - uniprot_id: UniProtKB:P21513
    protein_label: Ribonuclease E
    gene_symbol: rne
    taxon_id: NCBITaxon:83333
    taxon_label: Escherichia coli K-12
    entry_status: REVIEWED
    retrieved_on: '2026-10-17'
    role: The single reviewed UniProtKB entry for gene rne in Escherichia coli K-12,
      a taxon this record names. Identifier for the component's declared gene symbol;
      it is not itself evidence that the protein is part of this structure.
    evidence:
    - reference: PMID:11134527
      notes: Liou GG et al. 2001, ‘RNA degradosomes exist in vivo in Escherichia coli
        as multicomponent complexes associated with the cytoplasmic membrane via the
        N-terminal region of ribonuclease E.’, Proc Natl Acad Sci U S A. ECO:0000269
        experimental evidence cited by UniProt for the 'Cytoplasm' localisation of
        P21513.
    - reference: PMID:22509045
      notes: Murashko ON et al. 2012, ‘Membrane binding of Escherichia coli RNase
        E catalytic domain stabilizes protein structure and increases RNA substrate
        affinity.’, Proc Natl Acad Sci U S A. ECO:0000269 experimental evidence cited
        by UniProt for the 'Cell inner membrane' localisation of P21513.
- component_id: polynucleotide_phosphorylase
  label: polynucleotide phosphorylase
  component_type: PROTEIN
  component_role: CONSTITUENT
  gene_symbols:
  - pnp
  essentiality: UNKNOWN
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: PNPase is included as the E. coli RNA degradosome 3-to-5 phosphate-dependent
    exoribonuclease; no exact source-neutral family CURIE for the degradosome-bound
    component was curated.
  role: 3-to-5 phosphorolytic exoribonuclease that associates with RNase E in the
    degradosome.
  evidence:
  - reference: DOI:10.1016/0092-8674(94)90363-8
    notes: Carpousis et al. 1994 copurified E. coli RNase E with PNPase, providing
      evidence for a specific association between the enzymes.
  - reference: DOI:10.1101/gad.12.17.2770
    notes: Vanzo et al. 1998 identified a PNPase interaction site in the RNase E scaffold
      region.
