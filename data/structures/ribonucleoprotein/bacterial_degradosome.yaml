  title: RNase E scaffolds the E. coli RNA degradosome
  description: In Escherichia coli, RNase E provides a scaffold that recruits PNPase,
    the RhlB DEAD-box helicase and enolase into a degradosome machine for bacterial
    mRNA decay.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph records the major E. coli degradosome components and RNase
    E scaffolding role without asserting a complete stoichiometry, RNA-substrate path
    or the alternative degradosome assemblies reported in other bacteria.
