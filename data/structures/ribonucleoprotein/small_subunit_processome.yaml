identifier: GO:0032040
label: small-subunit processome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A large ribonucleoprotein complex that is an early preribosomal complex.
  In S. cerevisiae, it has a size of 80S and consists of the 35S pre-rRNA, early-associating
  ribosomal proteins most of which are part of the small ribosomal subunit, the U3
  snoRNA and associated proteins.
