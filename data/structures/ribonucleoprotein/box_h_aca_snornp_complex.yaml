identifier: GO:0031429
label: box H/ACA snoRNP complex
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: 'A box H/ACA small nucleolar ribonucleoprotein complex located in the
  nucleolus that catalyzes pseudouridylation of ribosomal RNA residues. The complex
  is composed of four different core proteins that assemble onto a H/ACA guide RNA
  scaffold that identifies specific uridines in rRNA for modification during ribosome
  synthesis. A conserved ribonucleoprotein complex composed of a hairpin-hinge-hairpin-tail
  box H/ACA small nucleolar RNA (snoRNA in eukaryotes or sRNA in Archaea) bound by
  four core proteins: the catalytic pseudouridine synthase Cbf5p/dyskerin (aCbf5),
  Nop10p, Gar1p, and Nhp2p (L7Ae in Archaea). Guided by antisense base-pairing in
  the pseudouridylation pocket of the H/ACA RNA, the complex catalyzes site-specific
  isomerization of uridine to pseudouridine in pre-rRNA and snRNAs.'
