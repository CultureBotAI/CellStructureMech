  grounding_notes: GO:0071011 spans U2-type precatalytic spliceosomes, which recruit
    GO:0046540, and U12-type precatalytic spliceosomes, which recruit GO:0071009;
    no single exact source-neutral CURIE was assigned for the generic U5-containing
    tri-snRNP class.
  role: Preassembled, subtype-specific U5-containing tri-snRNP subcomplex recruited
    to the prespliceosome to form a precatalytic spliceosome.
  evidence:
  - reference: GO:0071011
    notes: GO:0071011 defines the precatalytic spliceosome as formed by recruitment
      of a preassembled U5-containing tri-snRNP to the prespliceosome.
  - reference: GO:0071005
    notes: GO:0071005 defines the U2-type precatalytic spliceosome by recruitment
      of preassembled U4/U6.U5 tri-snRNP.
  - reference: GO:0071016
    notes: GO:0071016 defines the U12-type precatalytic spliceosome by recruitment
      of preassembled U4atac/U6atac.U5 tri-snRNP.
