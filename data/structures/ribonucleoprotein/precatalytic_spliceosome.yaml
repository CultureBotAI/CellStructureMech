identifier: GO:0071011
label: precatalytic spliceosome
structure_category: RIBONUCLEOPROTEIN
structure_kind: RIBONUCLEOPROTEIN_COMPLEX
definition: A spliceosomal complex that is formed by the recruitment of a preassembled
  U5-containing tri-snRNP to the prespliceosome. Although all 5 snRNPs are present,
  the precatalytic spliceosome is catalytically inactive. The precatalytic spliceosome
  includes many proteins in addition to those found in the associated snRNPs.
definition_source: GO:0071011
mapping_status: PROPOSED
