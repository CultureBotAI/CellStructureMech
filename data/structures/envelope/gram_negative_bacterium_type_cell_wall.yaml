causal_graphs:
- graph_id: peptidoglycan_outer_membrane_tethering
  title: Lipoprotein tethers connect the thin wall to the outer membrane
  description: In the canonical E. coli diderm envelope, the thin peptidoglycan sacculus
    sits in the periplasm and Braun-lipoprotein tethers connect that wall to the outer
    membrane. This peptidoglycan-outer membrane coupling tunes the mechanical stiffness
    of the Gram-negative envelope.
  graph_kind: FUNCTION
  scope_status: MECHANISTIC
