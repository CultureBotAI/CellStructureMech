    evidence:
    - reference: DOI:10.1038/s41467-020-15489-1
      notes: Mathelié-Guinlet and colleagues 2020 show that Lpp contributes to envelope
        stiffness by covalently connecting the outer membrane to peptidoglycan.
  - subject: linked_diderm_envelope
    predicate: controls
    object: envelope_stiffness
    description: The peptidoglycan layer, the outer membrane and the proteins that
      connect them together determine diderm cell-envelope mechanics.
    evidence:
    - reference: DOI:10.1038/s41467-020-15489-1
      notes: Mathelié-Guinlet and colleagues 2020 measured E. coli envelope mechanics
        after genetically changing Lpp length and its peptidoglycan attachment site.
- graph_id: lpp_lol_pg_tether_assembly
  title: Lol trafficking and L,D-transpeptidation install Lpp wall tethers
  description: Braun lipoprotein matures as a triacylated outer-membrane lipoprotein,
    is trafficked to the outer membrane by the Lol pathway, and is covalently attached
    to meso-diaminopimelate in peptidoglycan by L,D-transpeptidases. The result is
    a protein bridge from the outer membrane to the thin Gram-negative wall.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
