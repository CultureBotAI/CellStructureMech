identifier: GO:0009276
label: Gram-negative-bacterium-type cell wall
definition: The relatively thin peptidoglycan layer of a Gram-negative cell envelope,
  located in the periplasm between the cytoplasmic and outer membranes and physically
  connected to the outer membrane by lipoproteins.
