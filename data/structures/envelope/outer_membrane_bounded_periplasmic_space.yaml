  curator: codex
  action: EXPANDED_RECORD
  changes: Added GO exact synonyms, periplasmic-space parentage, the contained Gram-negative
    cell-wall part, inner/peptidoglycan/outer envelope components, bacterial distribution,
    an E. coli canonical example, diderm compartment and outer-membrane biogenesis
    functions, literature evidence, a nonmechanistic Lpt topology graph, and a resolved
    periplasm-versus-wall boundary discussion.
  llm_assisted: true
