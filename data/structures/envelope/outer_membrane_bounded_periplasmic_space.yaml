identifier: GO:0030288
label: outer membrane-bounded periplasmic space
structure_category: ENVELOPE
structure_kind: SUBCELLULAR_REGION
definition: The region between the inner (cytoplasmic or plasma) membrane and outer
  membrane of organisms with two membranes such as Gram negative bacteria. These periplasmic
  spaces are relatively thick and contain a thin peptidoglycan layer (PGL), also referred
  to as a thin cell wall.
definition_source: GO:0030288
mapping_status: PROPOSED
curation_history:
