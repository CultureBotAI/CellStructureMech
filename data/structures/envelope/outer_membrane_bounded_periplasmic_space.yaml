components:
- component_id: inner_membrane_boundary
  label: plasma membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0005886
  essentiality: ESSENTIAL
  role: Cytoplasmic-side membrane boundary of the Gram-negative periplasm.
  evidence:
  - reference: GO:0030288
    notes: GO:0030288 defines the outer membrane-bounded periplasmic space as the
      region between the inner and outer membranes.
- component_id: gram_negative_peptidoglycan
  label: Gram-negative-bacterium-type cell wall
  component_type: PEPTIDOGLYCAN
  component_role: CONSTITUENT
  grounding: GO:0009276
  essentiality: UNKNOWN
  role: Thin peptidoglycan sacculus that lies within the periplasm and is tethered
    to the outer membrane by lipoprotein links in canonical Gram-negative envelopes.
  evidence:
  - reference: GO:0030288
    notes: GO:0030288 notes that the outer membrane-bounded periplasmic space contains
      a thin peptidoglycan layer.
  - reference: DOI:10.1101/cshperspect.a000414
    notes: Silhavy, Kahne and Walker 2010 describe the Gram-negative envelope as an
      outer membrane surrounding a thin peptidoglycan wall in the periplasm.
- component_id: outer_membrane_boundary
  label: cell outer membrane
  component_type: LIPID
  component_role: CONSTITUENT
  grounding: GO:0009279
  essentiality: ESSENTIAL
  role: Cell-surface membrane boundary that encloses the diderm periplasm away from
    the cytoplasm.
  evidence:
  - reference: GO:0030288
    notes: GO:0030288 scopes this periplasmic region to organisms with both an inner
      membrane and an outer membrane.
  - reference: DOI:10.1101/cshperspect.a000414
    notes: Silhavy, Kahne and Walker 2010 review the outer membrane as the defining
      surface membrane of the Gram-negative cell envelope.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: The outer membrane-bounded periplasm occurs in diderm bacteria; monoderm bacteria
    lack an outer membrane and therefore lack this specific periplasmic space.
  reference: DOI:10.1101/cshperspect.a000414
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Canonical Gram-negative model for the outer membrane-bounded periplasm and
    for Lpt-dependent transport through the periplasm.
  reference: DOI:10.1101/cshperspect.a000414
functions:
- function_id: diderm_envelope_compartmentalization
  label: diderm envelope compartmentalization
  description: The outer membrane-bounded periplasm separates the cytoplasmic and
    outer membranes while housing the thin peptidoglycan layer.
  evidence:
  - reference: GO:0030288
    notes: GO:0030288 defines the diderm periplasm by its position between the inner
      and outer membranes.
- function_id: outer_membrane_biogenesis
  label: outer membrane biogenesis
  description: Envelope assembly pathways use periplasm-spanning transport and periplasmic
    intermediates to deliver lipopolysaccharide and proteins to the outer membrane.
  evidence:
  - reference: DOI:10.1101/cshperspect.a000414
    notes: Silhavy, Kahne and Walker 2010 review Gram-negative outer-membrane biogenesis
      as an envelope-spanning process.
  - reference: DOI:10.1074/jbc.R117.802512
    notes: Sperandeo, Martorana and Polissi 2017 review LPS transport from the inner
      membrane across the periplasm to the outer membrane.
