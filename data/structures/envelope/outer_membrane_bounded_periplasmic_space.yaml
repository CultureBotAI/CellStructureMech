discussions:
- discussion_id: periplasmic_space_not_cell_wall
  prompt: Keep the outer membrane-bounded periplasmic space separate from the Gram-negative-bacterium-type
    cell wall record.
  kind: INTERPRETATION
  status: RESOLVED
  rationale: GO:0030288 denotes the entire region between the inner and outer membranes,
    whereas GO:0009276 denotes the thin peptidoglycan wall located inside that region.
  resolution_note: Curated the periplasm as a SUBCELLULAR_REGION and included the
    Gram-negative wall as a contained structural component rather than merging the
    two records.
  evidence:
  - reference: GO:0030288
    notes: GO:0030288 denotes the outer membrane-bounded periplasm.
  - reference: GO:0009276
    notes: GO:0009276 denotes the Gram-negative-bacterium-type cell wall.
