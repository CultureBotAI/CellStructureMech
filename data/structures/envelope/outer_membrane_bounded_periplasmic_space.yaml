  title: Inner and outer membranes bound the Gram-negative periplasm
  description: The plasma membrane and cell outer membrane delimit the diderm periplasmic
    region, which contains the thin Gram-negative peptidoglycan wall and is crossed
    by LPS transport machinery during outer-membrane assembly.
  graph_kind: FUNCTION
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures envelope topology and LPS transit across the periplasm
    without enumerating every soluble periplasmic chaperone or lipoprotein-trafficking
