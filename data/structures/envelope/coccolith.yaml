identifier: cellstructuremech:coccolith
label: coccolith
structure_category: ENVELOPE
structure_kind: OTHER
definition: An individual mineralized scale produced by a coccolithophore, with a
  characteristic arrangement of calcite crystals. Coccoliths form elements of the
  external cell covering, the coccosphere, and can be shed as free scales.
definition_source: DOI:10.1126/sciadv.adc8728
mapping_status: PROPOSED
