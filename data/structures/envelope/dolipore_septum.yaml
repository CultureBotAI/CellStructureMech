    description: The cross-wall thickens into a barrel-shaped swelling around the
      central pore.
    evidence:
    - reference: GO:0000937
      notes: GO:0000937 defines the dolipore septum by a central pore whose surrounding
        septum is swollen.
  - subject: septal_pore_cap
    predicate: covers
    object: central_septal_pore
    description: Septal pore caps, or parenthesomes, sit on both sides of the dolipore
      septum over the central pore.
    evidence:
    - reference: GO:0000937
      notes: GO:0000937 includes parenthesome-covered central pores in the dolipore
        septum definition.
    - reference: DOI:10.1128/EC.00125-08
      notes: Van Driel et al. 2008 described septal pore caps as associated with dolipore
        septa in Agaricomycotina.
  - subject: septal_pore_cap
    predicate: plugs
    object: central_septal_pore
    description: Septal pore caps participate in plugging the central pore of the
      dolipore.
    evidence:
    - reference: DOI:10.1128/EC.00125-08
      notes: Van Driel et al. 2008 found SPC18 in both septal pore caps and pore plugs
        in Rhizoctonia solani.
    - reference: DOI:10.1111/j.1462-2920.2009.02122.x
      notes: Van Peer et al. 2010 showed that Schizophyllum commune septal pore cap
        loss prevents septal closure.
