identifier: GO:0042597
label: periplasmic space
structure_category: ENVELOPE
structure_kind: SUBCELLULAR_REGION
definition: The region between the inner (cytoplasmic) and outer membrane (Gram-negative
  Bacteria) or cytoplasmic membrane and cell wall (Fungi and Gram-positive Bacteria).
