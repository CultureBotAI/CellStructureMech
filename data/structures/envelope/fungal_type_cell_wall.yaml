identifier: GO:0009277
label: fungal-type cell wall
structure_category: ENVELOPE
structure_kind: ENVELOPE_LAYER
definition: A rigid but dynamic carbohydrate- and glycoprotein-rich wall surrounding
  the fungal plasma membrane, built from a variable cross-linked matrix of glucans,
  wall glycoproteins, and often chitin and kept distinct from fungal capsules outside
  the wall.
definition_source: GO:0009277
mapping_status: PROPOSED
