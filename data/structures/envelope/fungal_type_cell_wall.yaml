components:
- component_id: beta_d_glucan
  label: beta-D-glucan
  component_type: POLYSACCHARIDE
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  grounding: CHEBI:28793
  role: Forms branched glucose polymers that provide a major fibrillar scaffold in
    many fungal walls.
  evidence:
  - reference: DOI:10.1128/microbiolspec.FUNK-0035-2016
    notes: Gow, Latge and Munro 2017 review beta-glucans as major fungal cell-wall
      matrix and scaffold polysaccharides.
  - reference: DOI:10.1016/B978-0-12-407677-8.00002-6
    notes: Free 2013 reviews beta-1,3-glucan and beta-1,6-glucan as core fungal wall
      glucans.
- component_id: chitin
  label: chitin
  component_type: POLYSACCHARIDE
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  grounding: CHEBI:17029
  role: Provides beta-1,4-N-acetylglucosamine fibrils that cross-link with glucans
    and reinforce the inner wall in many fungi.
  evidence:
  - reference: DOI:10.1128/microbiolspec.FUNK-0035-2016
    notes: Gow, Latge and Munro 2017 review chitin as a fungal wall polysaccharide
      that cross-links to glucans.
- component_id: wall_mannoproteins
  label: fungal cell-wall mannoproteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The wall carries many unrelated glycoproteins with N-linked, O-linked,
    or GPI-anchored carbohydrate modifications; no single protein-family CURIE denotes
    the class.
  role: Decorate the outer wall, fill and cross-link the glucan network, and present
    adhesive or immune-facing surface activities.
  evidence:
  - reference: DOI:10.1128/microbiolspec.FUNK-0035-2016
    notes: Gow, Latge and Munro 2017 review mannoproteins and GPI-modified proteins
      as fungal cell-wall constituents.
taxonomic_distribution:
- taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  presence: COMMON
  note: Rigid carbohydrate-rich walls surround the plasma membrane in most vegetative
    fungal cells, while composition varies among yeasts, molds, and growth states.
  reference: DOI:10.1128/microbiolspec.FUNK-0035-2016
canonical_examples:
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Budding-yeast model for beta-glucan, chitin, and mannoprotein wall assembly.
  reference: DOI:10.1016/B978-0-12-407677-8.00002-6
- taxon_id: NCBITaxon:5207
  taxon_label: Cryptococcus neoformans
  note: Encapsulated fungal yeast whose capsule is built outside an underlying glucan-
    and chitin-containing cell wall.
  reference: DOI:10.1128/microbiolspec.FUNK-0035-2016
functions:
- function_id: osmotic_shape_protection
  label: osmotic protection and morphogenesis
  description: The cross-linked wall resists turgor pressure and maintains fungal
    cell shape during polarized growth and division.
  evidence:
  - reference: DOI:10.1016/B978-0-12-407677-8.00002-6
    notes: Free 2013 reviews fungal cell walls as protective structures required for
      cell integrity and morphogenesis.
- function_id: fungal_surface_interaction
  label: fungal surface interaction
  description: Outer wall glycoproteins and exposed polysaccharides form the cell
    surface that contacts hosts, substrates, and neighboring cells.
  evidence:
  - reference: DOI:10.1128/microbiolspec.FUNK-0035-2016
    notes: Gow, Latge and Munro 2017 review the cell wall as the primary fungal surface
      for host and environmental interactions.
evidence:
- reference: GO:0009277
  notes: Gene Ontology cellular-component term for the fungal-type cell wall.
- reference: DOI:10.1128/microbiolspec.FUNK-0035-2016
  notes: 'Gow NAR, Latge JP and Munro CA 2017, ''The Fungal Cell Wall: Structure,
    Biosynthesis, and Function'', Microbiology Spectrum.'
- reference: DOI:10.1016/B978-0-12-407677-8.00002-6
  notes: Free SJ 2013, 'Fungal cell wall organization and biosynthesis', Advances
    in Genetics.
causal_graphs:
- graph_id: crosslinked_polysaccharide_wall_network
  title: Glucans, chitin and mannoproteins form a fungal wall matrix
  description: In well-studied fungal walls, branched beta-glucans form a cross-linked
    matrix with chitin and mannoproteins. This carbohydrate-rich matrix surrounds
    the plasma membrane to maintain shape and provide a fungal cell surface.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures a high-level fungal wall architecture observed in
    well-studied yeasts and filamentous fungi without asserting that every fungal
    wall has the same beta-glucan, chitin, and mannoprotein composition.
