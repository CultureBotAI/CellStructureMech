causal_graphs:
- graph_id: cell_septum_mechanism
  title: Cell septum centripetal synthesis and daughter compartment separation
  description: Cytokinetic ring constriction recruits cell-wall synthases to deposit
    septal peptidoglycan or chitin/beta-glucan inward at midcell, constructing the
    cell septum that partitions the two daughter cells.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph links the divisome to the physical septal peptidoglycan product
    without enumerating the organism-specific enzyme order or envelope remodeling
    steps that differ between diderm and monoderm bacteria.
