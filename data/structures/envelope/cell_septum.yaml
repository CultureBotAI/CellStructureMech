identifier: GO:0030428
label: cell septum
structure_category: ENVELOPE
structure_kind: ENVELOPE_LAYER
definition: A structure composed of peptidoglycan and often chitin in addition to
  other materials. It usually forms perpendicular to the long axis of a cell or hypha
  and grows centripetally from the cell wall to the center of the cell and often functions
  in the compartmentalization of a cell into two daughter cells. An intercellular
  cross-wall layer composed of peptidoglycan in dividing bacteria, pseudomurein/S-layer
  in archaea, or chitin and beta-glucan in yeasts and filamentous fungi that forms
  perpendicular to the longitudinal cell axis to partition daughter cells or hyphal
  compartments. Synthesis of the cell septum is directed by the cytokinetic FtsZ divisome
  in prokaryotes or the actomyosin contractile ring and septin collar in fungi.
