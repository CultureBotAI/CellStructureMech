  reference: DOI:10.1146/annurev-biophys-121219-081703
functions:
- function_id: daughter_cell_compartmentalization
  label: daughter-cell compartmentalization
  description: Mediated by cell septum (GO:0030428) in cell septum wall synthesis
    and daughter cell partitioning. The completed division septum spans the division
    site and blocks cytoplasmic and organellar exchange between nascent daughter cells.
  evidence:
  - reference: GO:0000935
    notes: GO:0000935 defines the division septum as a cell septum that compartmentalizes
      two daughter cells.
