identifier: cellstructuremech:coccosphere
label: coccosphere
structure_category: ENVELOPE
structure_kind: ENVELOPE_LAYER
definition: An external cell covering of a coccolithophore assembled from individual
  mineralized scales called coccoliths. Its organization varies among taxa and cell
  states; the covering is distinct from a single coccolith and from the intracellular
  vesicle in which a coccolith forms.
definition_source: DOI:10.1111/nph.15272
