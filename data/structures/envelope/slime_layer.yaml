components:
- component_id: slime_layer_extracellular_material
  label: slime-layer extracellular material
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: GO defines slime layers as mostly exopolysaccharide-, glycoprotein-
    and glycolipid-containing extracellular material, UniProt describes bacterial
    slime layers as usually polysaccharide-rich, and Pseudomonas aeruginosa slime
    also included nucleic acid material and minor protein; no single CHEBI or sequence-family
    CURIE denotes the complete source-neutral slime-layer matrix.
  role: Forms the loose, diffuse extracellular glycocalyx matrix that surrounds the
    cell surface.
  evidence:
  - reference: GO:0030114
    notes: GO:0030114 defines a slime layer as diffuse extracellular material that
      surrounds a cell and consists mostly of exopolysaccharides, glycoproteins and
      glycolipids.
  - reference: DOI:10.1042/bj1120521
    notes: Brown, Foster and Clamp 1969 chemically characterized Pseudomonas aeruginosa
      slime as predominantly polysaccharide with additional nucleic acid material
      and minor protein.
