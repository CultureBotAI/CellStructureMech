discussions:
- discussion_id: slime_layer_capsule_boundary
  prompt: Keep diffuse slime layers separate from the organized capsule record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0030114 and UniProt SL-0247 denote a loose, diffuse glycocalyx that
    is easily removed, whereas GO:0042603 denotes the organized capsule subclass of
    glycocalyx; slime layer therefore belongs in a separate sibling record.
  evidence:
  - reference: GO:0030114
    notes: GO:0030114 defines the slime layer as diffuse and unorganized.
  - reference: uniprot.location:SL-0247
    notes: UniProt SL-0247 distinguishes slime layers as more-diffuse glycocalyces
      than capsules.
  - reference: GO:0042603
    notes: GO:0042603 defines capsule as a highly organized glycocalyx attached outside
      the cell wall.
