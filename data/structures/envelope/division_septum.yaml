  reference: DOI:10.1146/annurev-biophys-121219-081703
functions:
- function_id: daughter_cell_compartmentalization
  label: daughter-cell compartmentalization
  description: The completed division septum spans the division site and blocks cytoplasmic
    and organellar exchange between nascent daughter cells.
  evidence:
  - reference: GO:0000935
    notes: GO:0000935 defines the division septum as a cell septum that compartmentalizes
      two daughter cells.
- function_id: division_plane_closure
  label: division-plane closure
  description: Septal peptidoglycan synthesis adds cross-wall material at the division
    plane until the septum closes.
  evidence:
  - reference: DOI:10.1111/j.1749-6632.2012.06818.x
    notes: Egan and Vollmer 2012 review the bacterial cell-division physiology that
      couples the divisome to septal wall synthesis.
evidence:
- reference: GO:0000935
  notes: Gene Ontology cellular-component term for the division septum.
- reference: GO:0030428
  notes: Gene Ontology cellular-component term for the broader cell septum class.
- reference: GO:0032153
