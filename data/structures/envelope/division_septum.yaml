      synthesis.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: Walled FtsZ-dividing bacteria close the division plane with septal peptidoglycan,
    while wall-less lineages and bacteria using other division modes are outside this
    broad row.
  reference: DOI:10.1146/annurev-biophys-121219-081703
canonical_examples:
