identifier: GO:0000935
label: division septum
structure_category: ENVELOPE
structure_kind: ENVELOPE_LAYER
definition: A cell septum which forms as part of the division site and functions in
  the compartmentalization of a cell into two daughter cells at division. A division
  septum spans a cell and does not allow exchange of organelles or cytoplasm between
  compartments.
definition_source: GO:0000935
mapping_status: PROPOSED
