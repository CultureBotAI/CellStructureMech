  label: septal peptidoglycan
  component_type: PEPTIDOGLYCAN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Newly synthesized peptidoglycan that closes the division plane to create the
    daughter-cell cross-wall.
  evidence:
  - reference: DOI:10.1111/j.1749-6632.2012.06818.x
    notes: Egan and Vollmer 2012 review septal peptidoglycan synthesis as the peptidoglycan-building
