synonyms:
- synonym_text: bacterial capsule
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1146/annurev.micro.50.1.285
- synonym_text: polysaccharide capsule
  synonym_type: NARROW_SYNONYM
  source: DOI:10.1146/annurev.biochem.75.103004.142545
- synonym_text: cryptococcal capsule
  synonym_type: NARROW_SYNONYM
