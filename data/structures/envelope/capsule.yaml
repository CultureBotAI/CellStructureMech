identifier: GO:0042603
label: capsule
structure_category: ENVELOPE
structure_kind: ENVELOPE_LAYER
definition: A highly organized glycocalyx layer attached outside the cell wall of
  some bacteria and fungi, usually built from capsular polysaccharides and retained
  on the cell surface rather than released as a loose extracellular polymer.
definition_source: GO:0042603
mapping_status: PROPOSED
