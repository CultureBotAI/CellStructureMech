    component, bacterial and fungal taxonomy, canonical bacterial and cryptococcal
    examples, anti-phagocytic and barrier functions, a capsular-polymer export graph,
    DOI/GO evidence, and component-boundary discussions.
  llm_assisted: true
- timestamp: '2026-09-11T04:03:15Z'
  curator: codex
