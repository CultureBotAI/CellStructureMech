components:
- component_id: mycolic_acid
  label: mycolic acid
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding: CHEBI:25438
  role: Forms the mycolate-rich hydrophobic membrane layer and creates the covalently
    attached inner leaflet when esterified to arabinogalactan.
  evidence:
  - reference: DOI:10.1016/j.chembiol.2013.11.011
    notes: Marrakchi, Lanéelle and Daffé 2014 review mycolic acids as major specific
      lipid constituents of the mycobacterial cell envelope.
  - reference: DOI:10.1016/j.tim.2009.12.005
    notes: Niederweis et al. 2010 review the lipid architecture proposed for the mycobacterial
      outer membrane.
- component_id: extractable_mycomembrane_lipids
  label: extractable mycomembrane lipids
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The extractable outer-leaflet material includes multiple glycolipid
    and free-lipid families whose exact mixture varies among mycolate outer membranes;
    no single CHEBI term denotes the whole membrane lipid pool.
  role: Intercalate with covalently attached mycolates to fill the outer leaflet and
    tune the hydrophobic surface of the mycomembrane.
  evidence:
  - reference: DOI:10.1016/j.tim.2009.12.005
    notes: Niederweis et al. 2010 review free mycolates and extractable lipids as
      outer-membrane constituents.
  - reference: DOI:10.1038/s41598-017-12718-4
    notes: Chiaradia et al. 2017 dissected the mycobacterial cell envelope and analyzed
      native mycomembrane composition.
- component_id: mycolate_outer_membrane_proteins
  label: mycolate outer membrane proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: Known mycomembrane proteins include unrelated porins and exported
    outer-membrane proteins; the constituent set is a localization class, not a single
    homologous protein family.
  role: Provide proteinaceous routes for hydrophilic solute uptake and envelope transport
    across the mycolate-rich permeability barrier.
  evidence:
  - reference: DOI:10.1016/j.tim.2009.12.005
    notes: Niederweis et al. 2010 review mycobacterial outer-membrane proteins and
      porin channels.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: VARIABLE
  note: Mycolate outer membranes are restricted to mycolic-acid-producing bacterial
    lineages rather than being shared by all bacteria.
  reference: GO:0036407
- taxon_id: NCBITaxon:1763
  taxon_label: Mycobacterium
  presence: COMMON
  note: Mycobacteria are the canonical organisms for the mycolic-acid-rich mycomembrane.
  reference: DOI:10.1016/j.tim.2009.12.005
canonical_examples:
- taxon_id: NCBITaxon:1773
  taxon_label: Mycobacterium tuberculosis
  note: Pathogenic mycobacterial model for the mycomembrane and its mycolic-acid-rich
    permeability barrier.
  reference: DOI:10.1073/pnas.0709530105
- taxon_id: NCBITaxon:1718
  taxon_label: Corynebacterium glutamicum
  note: Corynebacterial model in which cryo-electron microscopy directly visualized
    an outer membrane related to the mycobacterial mycomembrane.
  reference: DOI:10.1128/JB.01919-07
functions:
- function_id: mycomembrane_permeability_barrier
  label: mycomembrane permeability barrier
  description: The mycolate-rich membrane creates a low-permeability hydrophobic barrier
    at the outside of the envelope.
  evidence:
  - reference: DOI:10.1016/j.tim.2009.12.005
    notes: Niederweis et al. 2010 review the mycobacterial outer membrane as a permeability
      barrier.
- function_id: porin_mediated_hydrophilic_uptake
  label: porin-mediated hydrophilic uptake
  description: Outer-membrane proteins form channels that let selected hydrophilic
    solutes cross the otherwise lipid-rich mycolate outer membrane.
  evidence:
  - reference: DOI:10.1016/j.tim.2009.12.005
    notes: Niederweis et al. 2010 review porins as uptake channels through mycobacterial
      outer membranes.
