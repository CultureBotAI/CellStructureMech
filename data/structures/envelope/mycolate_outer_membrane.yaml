causal_graphs:
- graph_id: mycolyl_arabinogalactan_mycomembrane
  title: Mycolates form a covalently anchored outer membrane
  description: Long-chain mycolic acids are esterified to arabinogalactan, which links
    the hydrophobic mycolate layer to peptidoglycan. Extractable lipids and outer-membrane
    proteins pack into that mycolate-rich membrane to form a low-permeability envelope
    boundary.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: The graph captures the class-level mycolate-arabinogalactan outer membrane
    architecture without choosing a specific mycolic-acid biosynthesis or transport
    pathway.
