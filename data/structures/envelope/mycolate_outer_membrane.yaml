  edges:
  - subject: mycolic_acid
    predicate: esterifies to
    object: arabinogalactan
    description: Mycolic acids are esterified to the terminal arabinan portions of
      cell-wall arabinogalactan.
    evidence:
    - reference: DOI:10.1101/cshperspect.a021113
      notes: Alderwick and colleagues 2015 review the mycolyl-arabinogalactan linkage
        in the mycobacterial cell wall.
    - reference: DOI:10.1016/j.chembiol.2013.11.011
      notes: Marrakchi, Lanéelle and Daffé 2014 review mycolic-acid transfer onto
        arabinogalactan.
  - subject: arabinogalactan
    predicate: anchors to
    object: peptidoglycan_based_cell_wall
    description: Arabinogalactan covalently links the mycolate-rich membrane to peptidoglycan
      in the cell-wall core.
    evidence:
    - reference: DOI:10.1101/cshperspect.a021113
      notes: Alderwick and colleagues 2015 review how arabinogalactan bridges peptidoglycan
        and mycolates.
  - subject: mycolic_acid
    predicate: forms hydrophobic layer of
    object: mycolate_outer_membrane
    description: Covalently attached mycolates provide the long-chain lipid matrix
      of the mycolate outer membrane.
    evidence:
    - reference: GO:0036407
      notes: GO:0036407 defines a mycolic-acid-rich cell outer membrane with long-chain
        mycolic acids.
    - reference: DOI:10.1073/pnas.0709530105
      notes: Hoffmann et al. 2008 visualized a mycobacterial outer membrane by cryo-electron
        tomography and vitreous sections.
  - subject: extractable_mycomembrane_lipids
    predicate: pack into
    object: mycolate_outer_membrane
    description: Free mycolates and other extractable lipids occupy the mycomembrane
      outer leaflet.
    evidence:
    - reference: DOI:10.1016/j.tim.2009.12.005
      notes: Niederweis et al. 2010 review extractable lipids as mycomembrane constituents.
  - subject: mycolate_outer_membrane_proteins
    predicate: embed in
    object: mycolate_outer_membrane
    description: Outer-membrane proteins are embedded in the mycolate-rich membrane,
      where porins create hydrophilic diffusion pathways.
    evidence:
    - reference: DOI:10.1016/j.tim.2009.12.005
      notes: Niederweis et al. 2010 review protein channels in the mycobacterial outer
        membrane.
  - subject: mycolate_outer_membrane
    predicate: enables
    object: permeability_barrier
    description: The waxy mycolate outer membrane strongly restricts permeation across
      the outside of the cell envelope.
    evidence:
    - reference: DOI:10.1016/j.tim.2009.12.005
      notes: Niederweis et al. 2010 review the mycobacterial outer membrane as the
        major permeability barrier.
discussions:
- discussion_id: cell_wall_core_boundary
  prompt: Keep the mycolate outer membrane separate from the whole mycolyl-arabinogalactan-peptidoglycan
    cell-wall core.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - components#mycolic_acid
  - components#extractable_mycomembrane_lipids
  - causal_graphs#mycolyl_arabinogalactan_mycomembrane
  rationale: GO:0036407 denotes the mycolate-rich outer membrane rather than the full
    peptidoglycan-arabinogalactan-mycolate cell-wall skeleton. Arabinogalactan and
    peptidoglycan are therefore graph nodes that explain covalent anchoring, not local
    component entries for the outer membrane itself.
  evidence:
  - reference: GO:0036407
    notes: GO scopes the record to the mycolate outer membrane.
  - reference: DOI:10.1101/cshperspect.a021113
    notes: Alderwick and colleagues 2015 review the larger mycolyl-arabinogalactan-peptidoglycan
      cell-wall core.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
