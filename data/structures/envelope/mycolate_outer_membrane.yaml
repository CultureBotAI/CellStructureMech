identifier: GO:0036407
label: mycolate outer membrane
structure_category: ENVELOPE
structure_kind: MEMBRANE
definition: A mycolic-acid-rich cell outer membrane in mycobacteria and related Corynebacteriales,
  containing a lipid bilayer and covalently linked long-chain mycolic acids attached
  to peptidoglycan through an arabinogalactan network.
definition_source: GO:0036407
mapping_status: PROPOSED
