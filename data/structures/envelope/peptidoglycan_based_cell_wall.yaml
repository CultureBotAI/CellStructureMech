identifier: GO:0009274
label: peptidoglycan-based cell wall
definition: A protective, load-bearing structure outside the cytoplasmic membrane,
  built from glycan strands of alternating N-acetylglucosamine and N-acetylmuramic
  acid cross-linked by short peptides. The resulting murein sacculus surrounds the
  cell and resists turgor pressure.
definition_source: DOI:10.1111/j.1574-6976.2007.00094.x
synonyms:
- synonym_text: murein sacculus
  synonym_type: RELATED_SYNONYM
  source: DOI:10.1111/j.1574-6976.2007.00094.x
structure_category: ENVELOPE
structure_kind: ENVELOPE_LAYER
components:
- component_id: peptidoglycan
  label: peptidoglycan
  component_type: PEPTIDOGLYCAN
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  role: Forms the covalently closed, stress-bearing mesh around the cytoplasmic membrane.
  evidence:
  - reference: DOI:10.1111/j.1574-6976.2007.00094.x
    notes: Vollmer et al. review sacculus chemistry and architecture.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: COMMON
  note: Present in most bacteria; wall-less lineages and L-forms are exceptions.
  reference: DOI:10.1111/j.1574-6976.2007.00094.x
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Canonical Gram-negative murein sacculus model.
  reference: DOI:10.1111/j.1574-6976.2007.00094.x
functions:
- function_id: shape_and_osmotic_integrity
  label: cell shape maintenance and resistance to turgor pressure
  description: The cross-linked sacculus bears mechanical stress while permitting
    growth.
  evidence:
  - reference: DOI:10.1111/j.1574-6976.2007.00094.x
    notes: Structural and physical roles of the sacculus.
evidence:
- reference: DOI:10.1111/j.1574-6976.2007.00094.x
  notes: Peptidoglycan structure and architecture.
causal_graphs:
- graph_id: lipid_ii_polymerisation_crosslinking
  title: Lipid II flipping, polymerisation and crosslinking build the sacculus
  description: The MurJ flippase moves Lipid II from the cytoplasmic leaflet to the
    extracytoplasmic face of the cytoplasmic membrane, where SEDS-family RodA/FtsW
    polymerases and penicillin-binding transpeptidases turn Lipid II disaccharide-peptide
    subunits into crosslinked peptidoglycan strands. The resulting sacculus surrounds
    the cell as a covalently closed mesh that bears turgor stress.
  graph_kind: ASSEMBLY
  scope_status: MECHANISTIC
  nodes:
  - node_id: lipid_ii
    label: Lipid II
    node_type: CHEMICAL
    grounding: CHEBI:27692
    description: Cytoplasmic-leaflet lipid-linked disaccharide-pentapeptide precursor.
  - node_id: murj_flippase
    label: MurJ Lipid II flippase
    node_type: GENE_OR_PROTEIN
    xrefs:
    - Pfam:PF03023
  - node_id: exported_lipid_ii
    label: extracytoplasmic Lipid II
    node_type: CHEMICAL
    grounding: CHEBI:27692
    description: Lipid II after translocation to the growth side of the cytoplasmic
      membrane.
  - node_id: seds_polymerases
    label: RodA/FtsW SEDS peptidoglycan polymerases
    node_type: GENE_OR_PROTEIN
    xrefs:
    - InterPro:IPR001182
  - node_id: penicillin_binding_transpeptidases
    label: penicillin-binding transpeptidases
    node_type: GENE_OR_PROTEIN
    xrefs:
    - InterPro:IPR001460
  - node_id: glycan_strands
    label: alternating GlcNAc-MurNAc glycan strands
    node_type: CHEMICAL
  - node_id: peptide_crosslinks
    label: peptide crosslinks
    node_type: CHEMICAL
  - node_id: peptidoglycan
    label: peptidoglycan
    node_type: STRUCTURE
    component_ref: peptidoglycan
  - node_id: turgor_resistance
    label: resistance to turgor pressure
    node_type: CAPACITY
  edges:
  - subject: murj_flippase
    predicate: flips
    object: exported_lipid_ii
    description: MurJ translocates lipid-linked peptidoglycan precursors from the
      inner to the outer leaflet of the cytoplasmic membrane so Lipid II is accessible
      to extracytoplasmic synthases.
    evidence:
    - reference: DOI:10.1126/science.1254522
      notes: Sham et al. 2014 showed that E. coli MurJ is needed for Lipid II flipping
        during peptidoglycan biogenesis.
  - subject: lipid_ii
    predicate: supplies
    object: exported_lipid_ii
    description: Lipid II is the lipid-linked disaccharide-pentapeptide precursor
      delivered across the cytoplasmic membrane before polymerisation.
    evidence:
    - reference: DOI:10.1038/s41579-020-0366-3
      notes: Egan, Errington and Vollmer 2020 review peptidoglycan synthesis from
        cytoplasmic lipid-linked precursors through translocation to polymerisation.
  - subject: seds_polymerases
    predicate: polymerise into
    object: glycan_strands
    description: RodA and FtsW SEDS proteins polymerise exported Lipid II into glycan
      strands for sidewall and septal peptidoglycan assembly.
    evidence:
    - reference: DOI:10.1038/nmicrobiol.2016.253
      notes: Emami et al. 2017 identified Bacillus subtilis RodA as a peptidoglycan
        glycosyltransferase.
    - reference: DOI:10.1038/s41564-018-0345-x
      notes: Taguchi et al. 2019 reconstituted FtsW peptidoglycan polymerase activity
        in complex with its cognate class B penicillin-binding protein.
  - subject: penicillin_binding_transpeptidases
    predicate: form
    object: peptide_crosslinks
    description: DD-transpeptidases create peptide bridges between neighboring glycan
      strands.
    evidence:
    - reference: DOI:10.1038/s41579-020-0366-3
      notes: Egan, Errington and Vollmer 2020 review transpeptidation during peptidoglycan
        synthesis and remodelling.
  - subject: peptide_crosslinks
    predicate: connect
    object: peptidoglycan
    description: Peptide crosslinks turn adjacent glycan chains into a single mesh-like
      sacculus.
    evidence:
    - reference: DOI:10.1111/j.1574-6976.2007.00094.x
      notes: Vollmer, Blanot and de Pedro 2008 describe the bacterial sacculus as
        glycan strands crosslinked by short peptides.
  - subject: peptidoglycan
    predicate: resists
    object: turgor_resistance
    description: The closed, crosslinked sacculus is the stress-bearing layer that
      keeps internal turgor pressure from rupturing the cell.
    evidence:
    - reference: DOI:10.1111/j.1574-6976.2007.00094.x
      notes: Vollmer, Blanot and de Pedro 2008 review how peptidoglycan architecture
        gives bacteria a protective, shape-maintaining wall.
