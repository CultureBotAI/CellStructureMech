components:
- component_id: glycocalyx_extracellular_matrix
  label: glycocalyx extracellular matrix
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: For microbial glycocalyces, the curated extracellular matrix spans
    organized capsule and diffuse slime-layer materials, including polysaccharide-rich,
    glycoprotein-containing, and glycolipid-containing matrices. GO:0030112 also has
    non-microbial subclasses such as vascular endothelial, sperm, platelet, and stereocilium
    glycocalyces, so this broad parent component remains source-neutral and reviewed-label-only
    rather than using a narrower CHEBI, sequence-family, or polymer-class CURIE.
  role: Forms the carbohydrate-rich extracellular layer at the outermost cell periphery.
  evidence:
  - reference: GO:0030112
    notes: GO defines the glycocalyx as a carbohydrate-rich layer at the outermost
      cell periphery.
  - reference: GO:0030114
    notes: GO defines a slime layer as a diffuse glycocalyx subclass that consists
      mostly of exopolysaccharides, glycoproteins and glycolipids.
  - reference: GO:0042603
    notes: GO defines capsule as a highly organized glycocalyx subclass attached outside
      the cell wall.
