components:
- component_id: glycocalyx_extracellular_matrix
  label: glycocalyx extracellular matrix
  component_type: OTHER
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The glycocalyx extracellular matrix spans capsule and slime-layer
    materials, including polysaccharide-rich, glycoprotein-containing, glycolipid-containing,
    and chemically exceptional capsule polymers; no single CHEBI, sequence-family,
    or polymer-class CURIE exactly denotes the whole source-neutral structure.
  role: Forms the carbohydrate-rich extracellular layer at the outermost cell periphery.
  evidence:
  - reference: GO:0030112
    notes: GO defines the glycocalyx as a carbohydrate-rich layer at the outermost
      cell periphery.
  - reference: GO:0030114
    notes: GO defines a slime layer as a diffuse glycocalyx subclass that consists
      mostly of exopolysaccharides, glycoproteins and glycolipids.
  - reference: GO:0042603
    notes: GO defines capsule as a highly organized glycocalyx subclass attached outside
      the cell wall.
canonical_examples:
- taxon_id: NCBITaxon:287
  taxon_label: Pseudomonas aeruginosa
  note: Classic diffuse glycocalyx example whose extracellular slime material was
    chemically analyzed by Brown, Foster and Clamp.
  reference: DOI:10.1042/bj1120521
- taxon_id: NCBITaxon:1313
  taxon_label: Streptococcus pneumoniae
  note: Encapsulated pneumococci exemplify the organized capsule subclass of the glycocalyx.
  reference: DOI:10.1128/IAI.00881-09
