discussions:
- discussion_id: glycocalyx_capsule_slime_boundary
  prompt: Keep glycocalyx as a parent class rather than merging capsule and slime-layer
    records into it.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - parent_structures
  rationale: GO:0030112 denotes the broad carbohydrate-rich outer layer, while GO:0042603
    restricts capsule to a highly organized glycocalyx and GO:0030114 restricts slime
    layer to a diffuse, easily removed glycocalyx. The existing capsule and slime-layer
    records therefore remain narrower sibling subclasses of this parent record.
  evidence:
  - reference: GO:0030112
    notes: GO parent term for the broad glycocalyx class.
  - reference: GO:0042603
    notes: GO child term for organized capsules.
  - reference: GO:0030114
    notes: GO child term for diffuse slime layers.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
