- discussion_id: non_microbial_glycocalyx_scope
  prompt: Acknowledge non-microbial GO:0030112 subclasses while curating microbial
    glycocalyx examples.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - components#glycocalyx_extracellular_matrix
  rationale: GO:0030112 exactly names the broad glycocalyx class that already parents
    the microbial capsule and slime-layer records, but its current GO children also
    include vascular endothelial, sperm, platelet, and stereocilium glycocalyces.
    This first CellStructureMech parent record therefore keeps the exact GO identifier
    while limiting curated examples and assembly prose to the microbial capsule and
    slime-layer subclasses.
  evidence:
  - reference: GO:0030112
    notes: GO parent term for capsule, slime layer, and non-microbial glycocalyx subclasses.
  - reference: GO:0120234
    notes: GO child term for the stereocilium coat, a non-microbial glycocalyx subclass.
  - reference: GO:0120238
    notes: GO child term for sperm glycocalyx, a non-microbial glycocalyx subclass.
  - reference: GO:0120239
    notes: GO child term for vascular endothelial glycocalyx, a non-microbial glycocalyx
      subclass.
  - reference: GO:0120240
    notes: GO child term for platelet glycocalyx, a non-microbial glycocalyx subclass.
  posed_by: codex
  posed_date: '2026-09-16'
  resolved_date: '2026-09-16'
