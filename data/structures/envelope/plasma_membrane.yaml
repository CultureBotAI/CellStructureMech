discussions:
- discussion_id: cytoplasmic_membrane_name
  prompt: Use the GO label plasma membrane while preserving cytoplasmic membrane as
    the microbial envelope name.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - synonyms
  rationale: GO:0005886 is the exact cellular-component term. Bacterial and archaeal
    literature usually calls the same cell-bounding structure the cytoplasmic membrane
    or, in Gram-negative bacteria, the inner membrane.
  evidence:
  - reference: GO:0005886
    notes: GO names the exact cell-bounding membrane plasma membrane.
  - reference: DOI:10.1101/cshperspect.a000414
    notes: Silhavy, Kahne and Walker 2010 use cytoplasmic membrane and inner membrane
      terminology for the bacterial envelope membrane.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
- discussion_id: archaeal_lipid_topology
  prompt: Avoid bilayer-only wording for the taxon-spanning plasma membrane record.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - definition
  - components#membrane_lipids
  - causal_graphs#lipid_membrane_boundary
  rationale: Bacterial and fungal plasma membranes are bilayers built largely from
    ester-linked lipids, whereas archaeal cytoplasmic membranes use ether lipids and
    can be diether bilayers or tetraether monolayers. This broad record therefore
    uses lipid-boundary wording and leaves exact lipid topology to lineage-specific
    records.
  evidence:
  - reference: DOI:10.1093/femsre/fuv008
    notes: Sohlenkamp and Geiger 2016 review bacterial membrane lipid diversity.
  - reference: DOI:10.1038/nrmicro2576
    notes: Albers and Meyer 2011 review archaeal ether-lipid cytoplasmic membranes
      as cell-envelope constituents.
  posed_by: codex
  posed_date: '2026-09-11'
  resolved_date: '2026-09-11'
