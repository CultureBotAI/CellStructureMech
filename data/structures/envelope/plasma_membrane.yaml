components:
- component_id: membrane_lipids
  label: plasma-membrane lipids
  component_type: LIPID
  component_role: CONSTITUENT
  essentiality: ESSENTIAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: The plasma membrane is built from a bilayer-forming lipid mixture
    whose exact chemistry differs among bacteria, archaea, and fungi; no single curated
    lipid CURIE is equivalent to the structure-spanning class.
  role: Self-assemble into the hydrophobic bilayer that encloses the cytoplasm and
    sets the permeability boundary.
  evidence:
  - reference: DOI:10.1093/femsre/fuv008
    notes: Sohlenkamp and Geiger 2016 review the structural diversity and biosynthesis
      of bacterial membrane lipids.
  - reference: DOI:10.1038/nrmicro2576
    notes: Albers and Meyer 2011 review archaeal membrane lipids as core archaeal
      envelope constituents.
- component_id: integral_plasma_membrane_proteins
  label: integral plasma membrane proteins
  component_type: PROTEIN
  component_role: CONSTITUENT
  essentiality: CONDITIONAL
  grounding_status: REVIEWED_LABEL_ONLY
  grounding_notes: A plasma membrane carries many unrelated integral proteins; the
    constituent class is topological rather than a single homologous protein family.
  role: Provide selective transport, energy transduction, secretion, and envelope-biogenesis
    activities embedded in the lipid bilayer.
  evidence:
  - reference: DOI:10.1101/cshperspect.a000414
    notes: Silhavy, Kahne and Walker 2010 describe the bacterial cytoplasmic membrane
      as the site of transporters and envelope assembly systems.
taxonomic_distribution:
- taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  presence: UNIVERSAL
  note: Bacterial cells are bounded by a cytoplasmic membrane inside any wall, outer
    membrane, capsule, or S-layer.
  reference: DOI:10.1101/cshperspect.a000414
- taxon_id: NCBITaxon:2157
  taxon_label: Archaea
  presence: UNIVERSAL
  note: Archaeal cells are bounded by a cytoplasmic membrane built from archaeal ether
    lipids beneath any wall or S-layer.
  reference: DOI:10.1038/nrmicro2576
- taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  presence: UNIVERSAL
  note: Fungal cells organize transporters, eisosome/MCC domains, and sterol-rich
    microdomains in a plasma membrane beneath the wall.
  reference: DOI:10.1146/annurev-micro-091313-103507
canonical_examples:
- taxon_id: NCBITaxon:562
  taxon_label: Escherichia coli
  note: Model Gram-negative bacterium for cytoplasmic-membrane transport, Sec insertion,
    and inner-membrane envelope biogenesis.
  reference: DOI:10.1101/cshperspect.a000414
- taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  note: Model budding yeast for plasma-membrane microdomains and eisosome-associated
    membrane organization.
  reference: DOI:10.1146/annurev-micro-091313-103507
functions:
- function_id: selective_permeability_barrier
  label: selective permeability barrier
  description: The plasma membrane separates cytoplasm from the external milieu while
    membrane proteins mediate controlled import, export, and ion movement.
  evidence:
  - reference: DOI:10.1101/cshperspect.a000414
    notes: Silhavy, Kahne and Walker 2010 review transport across the bacterial inner
      membrane as a central envelope activity.
- function_id: membrane_embedded_bioenergetics
  label: membrane-embedded bioenergetics
  description: In bacteria and archaea, respiratory and ATP-synthase complexes in
    the cytoplasmic membrane use ion gradients across the membrane for energy conservation.
  evidence:
  - reference: DOI:10.1101/cshperspect.a000414
    notes: Silhavy, Kahne and Walker 2010 describe the bacterial cytoplasmic membrane
      as the energized membrane that supports transport and envelope biogenesis.
  - reference: DOI:10.1038/nrmicro2576
    notes: Albers and Meyer 2011 review archaeal cytoplasmic membranes as energy-transducing
      envelope membranes.
evidence:
- reference: DOI:10.1101/cshperspect.a000414
  notes: Silhavy TJ, Kahne D and Walker S 2010, 'The bacterial cell envelope', Cold
    Spring Harbor Perspectives in Biology.
- reference: DOI:10.1093/femsre/fuv008
