causal_graphs:
- graph_id: lipid_membrane_boundary
  title: Membrane lipids and proteins form a selective cell boundary
  description: Amphipathic lipids assemble into a plasma-membrane permeability boundary.
    Integral membrane proteins embedded in that boundary provide the selective transport
    and energy-linked activities that make the membrane functional.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures the class-level lipid-boundary and integral-protein
    organization shared by microbial plasma membranes without choosing a bacterial,
    archaeal, or fungal lipid topology or biosynthesis pathway.
