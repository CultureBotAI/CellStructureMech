identifier: GO:0005886
label: plasma membrane
structure_category: ENVELOPE
structure_kind: MEMBRANE
definition: The phospholipid-bilayer membrane surrounding a cell that separates the
  cytoplasm from the external environment and houses proteins for selective transport,
  signaling, and envelope biogenesis.
