- reference: DOI:10.1146/annurev-micro-091313-103507
  notes: 'Douglas LM and Konopka JB 2014, ''Fungal membrane organization: the eisosome
    concept'', Annual Review of Microbiology.'
causal_graphs:
- graph_id: lipid_bilayer_membrane_boundary
  title: Membrane lipids and proteins form a selective cell boundary
  description: Amphipathic lipids assemble into the plasma-membrane bilayer. Integral
    membrane proteins embedded in that bilayer provide the selective transport and
    energy-linked activities that make the boundary functional.
  graph_kind: ASSEMBLY
  scope_status: NONMECHANISTIC
  scope_notes: This graph captures the class-level bilayer and integral protein organization
    shared by microbial plasma membranes without choosing one bacterial, archaeal,
    or fungal lipid biosynthesis pathway.
