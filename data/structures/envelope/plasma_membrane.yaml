discussions:
- discussion_id: cytoplasmic_membrane_name
  prompt: Use the GO label plasma membrane while preserving cytoplasmic membrane as
    the microbial envelope name.
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - identifier
  - synonyms
  rationale: GO:0005886 is the exact cellular-component term. Bacterial and archaeal
    literature usually calls the same cell-bounding structure the cytoplasmic membrane
    or, in Gram-negative bacteria, the inner membrane.
  evidence:
  - reference: GO:0005886
    notes: GO names the exact cell-bounding membrane plasma membrane.
  - reference: DOI:10.1101/cshperspect.a000414
    notes: Silhavy, Kahne and Walker 2010 use cytoplasmic membrane and inner membrane
      terminology for the bacterial envelope membrane.
