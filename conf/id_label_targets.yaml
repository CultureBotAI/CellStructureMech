# Targets for scripts/validate_id_label_correspondence.py (vendored from claw).
#
# Declares which CellStructureMech surfaces carry ontology (id, label) pairs and
# how strictly the label must correspond to the ontology label.
#
# A CURIE prefix is handled three ways:
#   * in `adapters`          → looked up against that OAK ontology.
#   * in `ignored_prefixes`  → legitimate non-OAK id; SKIPPED_NO_ADAPTER.
#   * neither                → UNKNOWN_PREFIX (ERROR) — a typo or an unexpected
#                              new prefix that must be triaged.
#
# Record identifiers are GO CC terms, and causal-graph / function nodes ground
# to GO, SO, CHEBI, RO, BFO and UO. Those are the pairs this gate checks; the
# record `label` is a curator label (e.g. "S-layer" for GO:0030115) and is
# checked with the same canonical-or-synonym policy.

adapters:
  GO: sqlite:obo:go
  SO: sqlite:obo:so
  CHEBI: sqlite:obo:chebi
  RO: sqlite:obo:ro
  BFO: sqlite:obo:bfo
  UO: sqlite:obo:uo
  PATO: sqlite:obo:pato

ignored_prefixes:
  - cellstructuremech   # minted ids
  - traitmech           # sibling repo ids
  - METPO               # TraitMech's ontology (not in OAK semsql)
  - proteintraitsmech
  - uniprot.location    # UniProt SL ids; labels are UniProt's
  - UniProtKB           # protein accessions; label is the protein name
  - InterPro
  - Pfam
  - NCBIfam
  - ComplexPortal
  - NCBIGene
  - KEGG
  - PDB
  - EMDB
  - NCBITaxon           # taxon labels are NCBI names, checked elsewhere; sqlite is 1 GB+
  - PMID
  - DOI
  - biolink
  - rdfs
  - MICRO
  - NCIT
  - OBI
  - IAO
  - PR

synonym_scope: exact

targets:
  # The record itself: identifier is a GO CC term; label is the curator label.
  - name: record_identity
    kind: yaml
    glob: "data/structures/**/*.yaml"
    policy: canonical_or_synonym
    pairs:
      - [identifier, label]
    exclude_keys: [components, functions, causal_graphs, taxonomic_distribution, canonical_examples,
                   images, physical_properties, associated_traits, discussions, datasets, curation_history,
                   synonyms, evidence]

  # Functions and causal-graph nodes: (grounding, label).
  - name: grounded_nodes
    kind: yaml
    glob: "data/structures/**/*.yaml"
    policy: canonical_or_synonym
    pairs:
      - [grounding, label]
    exclude_keys: [images, curation_history, discussions, datasets, taxonomic_distribution, canonical_examples]
    # Curator-accepted residuals: the id resolves; the curator-facing label is
    # the bacterial or common name of the same entity. Exact (id, label) only.
    exceptions:
      - { id: "CHEBI:17544", label: "bicarbonate", reason: "CHEBI canonical is 'hydrogencarbonate'; bicarbonate is the name every carboxysome paper uses" }
      - { id: "SO:0000650", label: "16S rRNA (small-subunit rRNA)", reason: "SO canonical is 'cytosolic_SSU_rRNA'; 16S is the bacterial small-subunit rRNA this record describes" }
      - { id: "SO:0000651", label: "23S rRNA (large-subunit rRNA)", reason: "SO canonical is 'cytosolic_LSU_rRNA'; 23S is the bacterial large-subunit rRNA" }
      - { id: "SO:0000652", label: "5S rRNA", reason: "SO canonical is 'cytosolic_5S_rRNA'; 5S rRNA is the universal name" }
