enums:

  StructureCategoryEnum:
    description: Coarse bucket — used for filesystem layout.
    permissible_values:
      ENVELOPE:
        description: Membranes, cell wall, S-layer, capsule, outer membrane, periplasm.
      APPENDAGE:
        description: Flagella, archaella, pili, fimbriae, stalks, and their motors.
      CYTOSKELETON:
        description: MreB, FtsZ, crescentin, ParM and other filament systems.
      MICROCOMPARTMENT:
        description: Protein-shelled organelles — carboxysomes, metabolosomes, encapsulins.
      INCLUSION:
        description: Storage and buoyancy bodies — PHA granules, polyphosphate, gas vesicles, sulfur globules.
      MEMBRANE_ORGANELLE:
        description: Lipid-bounded internal compartments — thylakoids, chlorosomes, magnetosomes, anammoxosomes.
      NUCLEOID:
        description: The chromosome-organising structure and its condensation machinery.
      RIBONUCLEOPROTEIN:
        description: Ribosome, RNA polymerase holoenzyme, signal recognition particle, degradosome.
      SECRETION_SYSTEM:
        description: Type I–IX secretion systems and the Sec / Tat translocons.
      DIVISION_MACHINERY:
        description: Divisome, Z ring, Min system, elongasome.
      ENERGY_COMPLEX:
        description: ATP synthase, respiratory and photosynthetic complexes, nitrogenase.
      SPORE:
        description: Endospore layers, exosporium, and spore-specific structures.
      OTHER:

  StructureKindEnum:
    description: What sort of physical entity the record denotes.
    permissible_values:
      MEMBRANE_BOUNDED_ORGANELLE:
      PROTEIN_SHELLED_ORGANELLE:
      MEMBRANE:
      ENVELOPE_LAYER:
        description: A non-membrane layer — peptidoglycan, S-layer, capsule.
      APPENDAGE:
      FILAMENT:
      INCLUSION_BODY:
      MULTIPROTEIN_COMPLEX:
      RIBONUCLEOPROTEIN_COMPLEX:
      NUCLEOPROTEIN_COMPLEX:
      SUBCELLULAR_REGION:
        description: A region without a discrete boundary — periplasm, nucleoid, cell pole.
      OTHER:

  ComponentTypeEnum:
    permissible_values:
      PROTEIN:
        description: A single protein family or paralogue group.
      PROTEIN_COMPLEX:
        description: A named sub-complex with its own identity (e.g. C ring, stator unit).
      RNA:
      DNA:
      LIPID:
      POLYSACCHARIDE:
      PEPTIDOGLYCAN:
      SMALL_MOLECULE:
        description: A cofactor, pigment, mineral or storage polymer.
      OTHER:

  ComponentRoleEnum:
    description: >-
      Where a component sits relative to the assembled structure. See the
      component boundary in docs/CURATION.md: a protein acting on a subunit
      before assembly and then departing is not a component at all.
    permissible_values:
      CONSTITUENT:
        description: Part of what the structure is built from.
      ASSOCIATED_MACHINERY:
        description: >-
          Binds the assembled structure to position, partition or maintain it.
          Cannot be ESSENTIAL: the structure forms before it acts.
  ComplexCompositionSourceEnum:
    permissible_values:
      COMPLEX_PORTAL:

  ComponentGroundingStatusEnum:
    permissible_values:
      REVIEWED_LABEL_ONLY:
        description: A curator looked; no exact family / complex term can be asserted.

  EssentialityEnum:
    permissible_values:
      ESSENTIAL:
        description: The structure does not form without it.
      CONDITIONAL:
        description: Required under some conditions or in some lineages.
      DISPENSABLE:
        description: The structure forms, possibly defectively, without it.
      UNKNOWN:

  PresenceEnum:
    permissible_values:
      UNIVERSAL:
        description: Present in essentially every member of the clade.
      COMMON:
        description: Present in most members; losses are the exception.
      VARIABLE:
        description: Patchy; presence is a lineage- or strain-level trait.
      RARE:
      ABSENT:
        description: Not found in the clade (an analogous structure may exist).

  TraitRelationEnum:
    permissible_values:
      CONFERS:
        description: The structure is the machine that produces the phenotype.
      REQUIRED_FOR:
        description: Necessary but not sufficient for the phenotype.
      DIAGNOSTIC_FOR:
        description: The phenotype is the observational proxy for the structure (Gram stain, capsule stain).
      MODULATES:
      ASSOCIATED_WITH:

  PhysicalPropertyEnum:
    permissible_values:
      DIAMETER:
      LENGTH:
      WIDTH:
      THICKNESS:
      MOLECULAR_MASS:
      SUBUNIT_COUNT:
      COPY_NUMBER_PER_CELL:
      SEDIMENTATION_COEFFICIENT:
      ROTATION_SPEED:
      OTHER:

  ImageSourceEnum:
    permissible_values:
      WIKIMEDIA_COMMONS:
      PMC:
        description: PubMed Central open-access article figure.
      EMPIAR:
      EMDB:
      BIOIMAGE_ARCHIVE:
      ETDB_CALTECH:
      CELL_STRUCTURE_ATLAS:
      CELL_IMAGE_LIBRARY:
      IDR:
      OTHER:

  ImageLicenceEnum:
    description: >-
      Hostable: CC0, PUBLIC_DOMAIN, CC_BY_*. Link-only: CC_BY_SA_*, CC_BY_NC_*,
      CC_BY_ND_*, OTHER. tests/test_corpus_integrity.py enforces that `file` is
      set only for hostable licences.

      CC BY-SA is deliberately NOT hostable (#93). Attribution is a label this
      corpus can carry per item; share-alike constrains the licence of
      derivative works, which a per-item field cannot express, and it would
      propagate to consumers of this data — a knowledge graph incorporating a
      share-alike image can be argued to be an adaptation. See LICENSE.
    permissible_values:
      CC0:
      PUBLIC_DOMAIN:
      CC_BY_3_0:
      CC_BY_4_0:
      CC_BY_SA_3_0:
      CC_BY_SA_4_0:
      CC_BY_NC_4_0:
      CC_BY_NC_SA_4_0:
      CC_BY_ND_4_0:
