id: https://w3id.org/cellstructuremech
name: cellstructuremech
title: CellStructureMech - Microbial Cell Structure Schema
description: |
  LinkML schema for microbial cell structures: organelles, envelope layers,
  appendages, microcompartments, inclusions, cytoskeletal filaments and the
  multi-protein complexes that build them. One CellStructureRecord per YAML
  file, grounded in GO cellular component where a term exists and minted under
  the `cellstructuremech:` prefix otherwise.

  Granularity contract: a record is a structure a microbiologist would point to
  in an electron micrograph or name as a subcellular entity — from the whole
  organelle (carboxysome, thylakoid) down to a discrete multi-protein complex
  (ribosome, flagellar motor, ATP synthase). Individual proteins are NOT records:
  they are `components` of a record and, where a taxon-agnostic family or
  organism-specific accession exists, they ground to InterPro / UniProtKB and
  hand off to ProteinTraitsMech. Phenotypes conferred by a structure (motile,
  flagellated, Gram-negative) are TraitMech records linked via
  `associated_traits`, not duplicated here.

  Follows the dismech / TraitMech / HabitatMech pattern: one YAML per entity,
  ontology-grounded, evidence-backed, closed-schema validated, curated
  incrementally through an append-only audit trail.

license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  cellstructuremech: https://w3id.org/cellstructuremech/
  biolink: https://w3id.org/biolink/vocab/
  # Primary grounding target: GO cellular component
  GO: http://purl.obolibrary.org/obo/GO_
  # Sibling Mech identifiers
  traitmech: https://w3id.org/traitmech/
  METPO: https://w3id.org/metpo/
  proteintraitsmech: https://w3id.org/proteintraitsmech/
  # Cross-reference ontologies
  PATO: http://purl.obolibrary.org/obo/PATO_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  UO: http://purl.obolibrary.org/obo/UO_
  RO: http://purl.obolibrary.org/obo/RO_
  BFO: http://purl.obolibrary.org/obo/BFO_
  MICRO: http://purl.obolibrary.org/obo/MICRO_
  OBI: http://purl.obolibrary.org/obo/OBI_
  IAO: http://purl.obolibrary.org/obo/IAO_
  SO: http://purl.obolibrary.org/obo/SO_
  PR: http://purl.obolibrary.org/obo/PR_
  # UniProt Subcellular Location vocabulary (Bioregistry prefix uniprot.location;
  # every SL term maps 1:1 to a GO CC term and lists its member proteins)
  uniprot.location: https://www.uniprot.org/locations/
  # Protein families / complexes / genes
  InterPro: https://www.ebi.ac.uk/interpro/entry/InterPro/
  Pfam: https://www.ebi.ac.uk/interpro/entry/pfam/
  NCBIfam: https://www.ncbi.nlm.nih.gov/genome/annotation_prok/evidence/
  ComplexPortal: https://www.ebi.ac.uk/complexportal/complex/
  UniProtKB: https://www.uniprot.org/uniprotkb/
  RNAcentral: https://rnacentral.org/rna/
  NCBIGene: https://www.ncbi.nlm.nih.gov/gene/
  KEGG: https://www.kegg.jp/entry/
  # Structures
  PDB: https://www.rcsb.org/structure/
  EMDB: https://www.ebi.ac.uk/emdb/
  EMPIAR: https://www.ebi.ac.uk/empiar/EMPIAR-
  # Taxonomy
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  # Provenance
  PMID: http://www.ncbi.nlm.nih.gov/pubmed/
  DOI: https://doi.org/
  dcterms: http://purl.org/dc/terms/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: cellstructuremech
default_range: string

imports:
  - linkml:types
  # Shared, byte-identical Mech module: Discussion (knowledge gaps) + Dataset.
  # Vendored + sha-pinned across the Mech repos — see culturebotai-claw#7.
  - mech_shared

# ================================================================
# ROOT CLASS — one YAML file per CellStructureRecord
# ================================================================

classes:

  CellStructureRecord:
    class_uri: cellstructuremech:CellStructureRecord
    tree_root: true
    description: >-
      A single microbial cell structure — an organelle, envelope layer,
      appendage, microcompartment, inclusion, cytoskeletal element or
      multi-protein complex — with its composition, taxonomic distribution,
      functions, and evidence-backed assembly / function mechanisms.
      One YAML per record.
    attributes:
      identifier:
        description: >-
          Stable CURIE for this structure. Use the GO cellular component term
          directly when one denotes exactly this structure (e.g. GO:0005840
          ribosome, GO:0009288 bacterial-type flagellum). Mint a
          `cellstructuremech:` identifier when no term is an exact fit; record
          the nearest broader term in `parent_structures` instead.
        identifier: true
        required: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"

      label:
        description: Human-readable structure name.
        required: true
        range: string

      definition:
        description: >-
          Textual definition. Prefer the IAO:0000115 definition of the
          grounding term; curators may extend it with microbial specifics.
        range: string
        required: true

      definition_source:
        description: >-
          IAO:0000119 — citation for the definition (PMID:..., DOI:..., or
          the ontology term the definition is quoted from).
        required: true
        range: string
        # A placeholder must not satisfy a required provenance field: making
        # definition_source required while TODO:add_citation validates would turn
        # missing provenance, which is countable, into fake provenance (#70).
        pattern: "^(?!(?:TODO|FIXME|XXX|TBD):)(?:[A-Za-z][A-Za-z0-9._-]*:\\S+|https?://\\S+)$"

      synonyms:
        multivalued: true
        inlined_as_list: true
        range: StructureSynonym

      structure_category:
        description: >-
          Coarse-grained bucket for filesystem organisation and reporting
          (`data/structures/<category-lowercased>/<slug>.yaml`).
        range: StructureCategoryEnum
        required: true

      structure_kind:
        description: >-
          What kind of physical entity the structure is. Orthogonal to
          `structure_category`: a carboxysome is category MICROCOMPARTMENT and
          kind PROTEIN_SHELLED_ORGANELLE; the flagellar motor is category
          APPENDAGE and kind MULTIPROTEIN_COMPLEX.
        range: StructureKindEnum
        required: true

      parent_structures:
        description: >-
          rdfs:subClassOf — strictly broader structure classes, as GO cellular
          component terms or other records (carboxysome is-a bacterial
          microcompartment GO:0031469). Is-a only; use `part_of` for
          parthood.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"

      part_of:
        description: >-
          Structures this one is a proper part of (BFO:0000050). CURIEs of
          other CellStructureRecords or GO cellular component terms. The
          flagellar motor is part_of the bacterial-type flagellum; the
          carboxysome shell is part_of the carboxysome.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"

      has_part:
        description: >-
          Sub-structures that are themselves records (BFO:0000051). Use for
          named sub-assemblies with their own record; list proteins, lipids
          and nucleic acids under `components` instead.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"

      xrefs:
        description: >-
          oboInOwl:hasDbXref — equivalents in other ontologies and databases
          (GO, MICRO, NCIT, ComplexPortal, PDB, EMDB). Only *true* equivalences;
          record broader relations via `part_of` or notes.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"

      components:
        description: >-
          Molecular composition: the proteins, protein families, RNAs, lipids
          and polysaccharides that build the structure. This is the hand-off
          point to ProteinTraitsMech — a component grounds to a family
          (InterPro/Pfam) or a taxon-paired UniProtKB accession, never to a
          record here.
        multivalued: true
        inlined_as_list: true
        range: StructuralComponent

      complex_compositions:
        description: >-
          Taxon-specific, source-versioned composition assertions imported
          from a curated complex database. These are deliberately separate
          from `components`: an E. coli UniProt accession and its copy number
          are evidence about one organism's assembly, not the identity of a
          taxon-agnostic component family.
        multivalued: true
        inlined_as_list: true
        range: ComplexComposition

      taxonomic_distribution:
        description: >-
          Which clades have the structure, and how consistently. A structure
          can be universal in one domain and absent in another (ribosome:
          universal; bacterial-type flagellum: Bacteria only, archaea use the
          non-homologous archaellum).
        multivalued: true
        inlined_as_list: true
        range: TaxonomicScope

      canonical_examples:
        description: >-
          Reference organisms in which the structure has been characterised
          archetypally — where the cryo-EM structure was solved or the
          genetics were worked out. Each carries an NCBITaxon CURIE and,
          where practical, a citation.
        multivalued: true
        inlined_as_list: true
        range: CanonicalExample

      functions:
        description: >-
          Biological processes or molecular functions the structure carries
          out, grounded in GO where possible, each with evidence.
        multivalued: true
        inlined_as_list: true
        range: StructureFunction

      associated_traits:
        description: >-
          Phenotypes the structure confers or is diagnostic for, as TraitMech
          / METPO CURIEs (e.g. bacterial-type flagellum → METPO:1000704
          flagellated, METPO:1000702 motile). The trait record models the
          phenotype; this record models the machine.
        multivalued: true
        inlined_as_list: true
        range: TraitLink

      physical_properties:
        description: >-
          Measured dimensions and stoichiometry: diameter, length, molecular
          mass, subunit count, sedimentation coefficient. Units are UO CURIEs.
        multivalued: true
        inlined_as_list: true
        range: PhysicalProperty

      images:
        description: >-
          Microscopy or other imaging evidence for the structure. Every image
          carries an explicit licence, a stable source URL and the taxon imaged;
          include a DOI or PMID when the image is tied to a publication. Images
          under a hostable licence (CC0,
          public domain, CC BY, CC BY-SA) are copied into the site; others
          are linked only. The first entry is shown at the top of the page.
        multivalued: true
        inlined_as_list: true
        range: StructureImage

      evidence:
        description: >-
          Record-level citations backing the existence, identity and
          definition of the structure. Optional (compare CausalEdge.evidence,
          which is required): a GO-grounded record inherits provenance from
          the ontology term.
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

      causal_graphs:
        description: >-
          Evidence-backed mechanism graphs — how the structure assembles, how
          it does its job, what regulates it. Every edge must carry a citation.
        multivalued: true
        inlined_as_list: true
        range: CausalGraph

      discussions:
        description: >-
          Open questions, knowledge gaps, controversies and curation todos
          (shared Discussion supertype; anchor `attaches_to` into e.g.
          `components#<component_id>` or `causal_graphs#<edge>`).
        multivalued: true
        inlined_as_list: true
        range: Discussion

      datasets:
        description: Public datasets (structural, omics) relevant to this structure.
        multivalued: true
        inlined_as_list: true
        range: Dataset

      mapping_status:
        description: >-
          Lifecycle flag. SEEDED records were generated from an upstream
          vocabulary; PROPOSED records were drafted from literature; REVIEWED
          records have curator sign-off; DEPRECATED records are retained for
          traceability.
        range: MappingStatusEnum
        required: true

      replaces:
        description: >-
          dcterms:replaces — CURIEs of records this one supersedes. The
          replaced record stays in place with mapping_status DEPRECATED.
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
        slot_uri: dcterms:replaces

      contributors:
        description: Curators who have edited this record.
        multivalued: true
        range: string

      curation_history:
        description: Append-only audit trail.
        multivalued: true
        inlined_as_list: true
        range: CurationEvent

  # ---------------------------------------------------------------
  # Composition, distribution, function
  # ---------------------------------------------------------------

  StructuralComponent:
    description: >-
      One molecular building block of a structure. Names a protein family,
      protein complex, RNA, lipid or polysaccharide — not an organism-specific
      protein, which belongs in `protein_examples` where the family is
      established.
    attributes:
      component_id:
        description: Stable local identifier, referenced by discussions and graph nodes.
        identifier: true
        required: true
        range: string
      label:
        required: true
        range: string
      component_type:
        required: true
        range: ComponentTypeEnum
      component_role:
        description: >-
          Whether the component is part of what the structure is made of, or
          machinery that acts on the assembled structure. `essentiality` cannot
          carry this: it says only whether the structure assembles without the
          component, so a constituent can be DISPENSABLE too — the flagellar
          stator is, and the flagellum still cannot rotate without it (#77).
        required: true
        range: ComponentRoleEnum
      grounding:
        description: >-
          Taxon-agnostic CURIE: InterPro / Pfam / NCBIfam for a protein family,
          ComplexPortal or GO for a sub-complex, CHEBI for a lipid or
          polysaccharide, SO for an RNA class.
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      grounding_status:
        description: >-
          Set to REVIEWED_LABEL_ONLY when a curator has looked and no exact
          family / complex term can be asserted without overclaiming.
          Requires `grounding_notes`.
        range: ComponentGroundingStatusEnum
      grounding_notes:
        range: string
      gene_symbols:
        description: Gene symbols encoding the component (metadata, not identity).
        multivalued: true
        range: string
      stoichiometry:
        description: >-
          Copies per structure where established (e.g. "~26" FliC subunits per
          flagellar filament turn; "1" for a single-copy protein).
        range: string
      essentiality:
        description: Whether the structure forms without this component.
        range: EssentialityEnum
      role:
        description: What the component does in the structure (shell, motor, anchor, cargo).
        range: string
      protein_examples:
        description: >-
          Organism-specific UniProtKB instances of this taxon-agnostic
          component, each paired with the taxon the role was established in.
        multivalued: true
        inlined_as_list: true
        range: ProteinExample
      evidence:
        description: Citations supporting this component's membership and role.
        required: true
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

  ProteinExample:
    description: >-
      A source-backed UniProt protein example paired with the organism in which
      its role in the structure was established. Reviewed Swiss-Prot entries are
      preferred. One component accession must not be presented as an entire
      multisubunit complex.
    attributes:
      uniprot_id:
        required: true
        range: string
        pattern: "^UniProtKB:[A-Z0-9]+$"
      protein_label:
        required: true
        range: string
      gene_symbol:
        range: string
      taxon_id:
        required: true
        range: string
        pattern: "^NCBITaxon:[0-9]+$"
      taxon_label:
        required: true
        range: string
      entry_status:
        required: true
        range: UniProtEntryStatusEnum
      retrieved_on:
        description: Date on which the UniProt metadata was verified.
        required: true
        range: date
      role:
        range: string
      evidence:
        required: true
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

  ComplexComposition:
    description: >-
      A lossless, taxon-specific composition assertion from Complex Portal.
      The source accession is verified through the live accession endpoint;
      its presence here does not assert that the source complex is equivalent
      to the whole CellStructureRecord.
    attributes:
      composition_id:
        identifier: true
        required: true
        range: string
      source:
        required: true
        range: ComplexCompositionSourceEnum
      source_accession:
        required: true
        range: string
        pattern: "^ComplexPortal:CPX-[0-9]+$"
      source_url:
        required: true
        range: uri
      complex_label:
        required: true
        range: string
      taxon_id:
        required: true
        range: string
        pattern: "^NCBITaxon:[0-9]+$"
      taxon_label:
        required: true
        range: string
      assembly:
        description: Source-provided assembly summary, such as Hetero22-mer.
        range: string
      evidence_code:
        description: ECO CURIE supplied by the source for the complex assertion.
        range: string
        pattern: "^ECO:[0-9]+$"
      participants:
        required: true
        multivalued: true
        inlined_as_list: true
        range: ComplexParticipant
      retrieved_on:
        required: true
        range: date
      notes:
        range: string

  ComplexParticipant:
    description: One participant exactly as asserted in a source complex entry.
    attributes:
      participant_id:
        identifier: true
        required: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      label:
        required: true
        range: string
      participant_type:
        required: true
        range: string
      gene_symbol:
        range: string
      stoichiometry:
        description: >-
          Exact source range normalized as one number or `min-max`; omitted
          when Complex Portal does not assert a value.
        range: string
        pattern: "^[0-9]+(?:\\.[0-9]+)?(?:-[0-9]+(?:\\.[0-9]+)?)?$"
      source_interactor_id:
        range: string
        pattern: "^EBI-[0-9]+$"
      canonical_component_ref:
        description: >-
          Optional curator-reviewed link to `components#<component_id>`.
          Import never fills this by name similarity.
        range: string

  TaxonomicScope:
    description: Presence of the structure in a clade.
    attributes:
      taxon_id:
        required: true
        range: string
        pattern: "^NCBITaxon:[0-9]+$"
      taxon_label:
        required: true
        range: string
      presence:
        required: true
        range: PresenceEnum
      note:
        description: Qualifications — "lost in obligate endosymbionts", "non-homologous analogue in Archaea".
        range: string
      reference:
        description: PMID:..., DOI:..., or an opaque URL.
        required: true
        range: string
        pattern: "^(?:[A-Za-z][A-Za-z0-9._-]*:\\S+|https?://\\S+)$"

  CanonicalExample:
    description: A reference organism in which the structure was characterised archetypally.
    attributes:
      taxon_id:
        required: true
        range: string
        pattern: "^NCBITaxon:[0-9]+$"
      taxon_label:
        required: true
        range: string
      note:
        range: string
      reference:
        required: true
        range: string
        pattern: "^(?:[A-Za-z][A-Za-z0-9._-]*:\\S+|https?://\\S+)$"

  StructureFunction:
    description: A process or activity the structure carries out.
    attributes:
      function_id:
        identifier: true
        required: true
        range: string
      label:
        required: true
        range: string
      grounding:
        description: GO biological process or molecular function CURIE.
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      description:
        range: string
      evidence:
        required: true
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

  TraitLink:
    description: A link from this structure to a TraitMech / METPO phenotype it confers.
    attributes:
      trait_id:
        required: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      trait_label:
        required: true
        range: string
      relation:
        description: How the structure relates to the trait.
        required: true
        range: TraitRelationEnum
      note:
        range: string
      evidence:
        description: Citations supporting the asserted structure-to-trait relation.
        required: true
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

  PhysicalProperty:
    description: A measured dimension or count for the structure.
    attributes:
      property:
        required: true
        range: PhysicalPropertyEnum
      value:
        description: Numeric value or a range expressed as text ("20-24").
        required: true
        range: string
      unit:
        description: UO CURIE (UO:0000018 nanometer, UO:0000222 kilodalton) — omit for counts.
        range: string
        pattern: "^UO:[0-9]+$"
      context:
        description: Organism or condition the measurement applies to.
        range: string
      reference:
        description: PMID:..., DOI:..., or an opaque URL.
        required: true
        range: string
        pattern: "^(?:[A-Za-z][A-Za-z0-9._-]*:\\S+|https?://\\S+)$"

  StructureImage:
    description: >-
      One image of the structure with the provenance a reader needs to trust
      and reuse it. `file` is set only when the licence permits hosting a
      copy; the original lives under `data/images/<category>/<slug>/` and the
      renderer copies it to `pages/img/`.
    attributes:
      image_id:
        identifier: true
        required: true
        range: string
      file:
        description: >-
          Filename of the hosted copy under data/images/<category>/<slug>/.
          Omit for licences that forbid hosting (e.g. CC BY-NC); the page then
          links to `source_url` instead. Lowercase extension only (png, jpg,
          jpeg, gif, webp, svg); rename on ingest.
        range: string
        pattern: "^[A-Za-z0-9._-]+\\.(png|jpg|jpeg|gif|webp|svg)$"
      file_sha256:
        description: >-
          SHA-256 of the hosted copy, so a swapped or corrupted file is caught
          by tests/test_corpus_integrity.py. Required whenever `file` is set.
        range: string
        pattern: "^[0-9a-f]{64}$"
      source:
        required: true
        range: ImageSourceEnum
      source_accession:
        description: The source's own identifier (Commons file title / M-id, EMPIAR-NNNNN, EMD-NNNNN, CIL:NNNNN, PMC figure id).
        required: true
        range: string
      source_url:
        description: Stable landing page for the image at the source.
        required: true
        range: uri
      download_url:
        description: Direct file URL the hosted copy was fetched from.
        range: uri
      licence:
        required: true
        range: ImageLicenceEnum
      licence_url:
        range: uri
      attribution:
        description: Author / rights-holder credit line exactly as the licence requires.
        required: true
        range: string
      modality:
        required: true
        range: ImagingModalityEnum
      caption:
        description: What the image shows, including scale-bar information where the source gives it.
        range: string
      taxon_id:
        description: The organism imaged.
        required: true
        range: string
        pattern: "^NCBITaxon:[0-9]+$"
      taxon_label:
        required: true
        range: string
      reference:
        description: >-
          DOI or PMID of the publication the image comes from or is described
          in. Recommended, not required (decision in issue #30): the
          `source_accession` + `source_url` pair is always present and is the
          citable identifier when no publication exists — for Cell Image
          Library that pair is itself a DOI (10.7295/W9CIL…), for CDC PHIL an
          image id. Prefer images that have both.
        recommended: true
        range: string
        pattern: "^(DOI|PMID):.+$"
      retrieved_on:
        description: Date the licence, attribution and taxon metadata were verified at the source.
        required: true
        range: date
      notes:
        range: string

  StructureSynonym:
    attributes:
      synonym_text:
        required: true
        range: string
      synonym_type:
        range: SynonymTypeEnum
      source:
        required: true
        range: string
        pattern: "^(?:[A-Za-z][A-Za-z0-9._-]*:\\S+|https?://\\S+)$"

  EvidenceItem:
    description: A literature or database citation supporting a claim.
    attributes:
      reference:
        description: PMID:..., DOI:..., or an opaque URL.
        required: true
        range: string
        pattern: "^(?:[A-Za-z][A-Za-z0-9._-]*:\\S+|https?://\\S+)$"
      snippet:
        description: Verbatim quote from the source. Only when actually verbatim.
        range: string
      notes:
        description: Paraphrase of what the source establishes for this claim.
        range: string

  # ---------------------------------------------------------------
  # Causal graphs — same shape as TraitMech so tooling can be shared
  # ---------------------------------------------------------------

  CausalGraph:
    description: A directed mechanism graph associated with a structure.
    attributes:
      graph_id:
        identifier: true
        required: true
        range: string
      title:
        range: string
      description:
        range: string
      graph_kind:
        description: What the graph explains — assembly, function, or regulation.
        range: GraphKindEnum
        required: true
      scope_status:
        range: CausalGraphScopeEnum
        required: true
      scope_notes:
        range: string
      nodes:
        required: true
        multivalued: true
        inlined_as_list: true
        range: CausalNode
      edges:
        required: true
        multivalued: true
        inlined_as_list: true
        range: CausalEdge

  CausalNode:
    description: >-
      A node in a mechanism graph. GENE_OR_PROTEIN is restricted to proteins,
      protein families and protein complexes; genes and operons are metadata.
    attributes:
      node_id:
        identifier: true
        required: true
        range: string
      label:
        required: true
        range: string
      node_type:
        required: true
        range: CausalNodeTypeEnum
      grounding:
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      component_ref:
        description: >-
          Local `component_id` on this record when the node is one of the
          structure's own components, so graph and composition stay in step.
        range: string
      xrefs:
        multivalued: true
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      description:
        range: string

  CausalEdge:
    description: An evidence-backed directed relationship in a mechanism graph.
    attributes:
      subject:
        required: true
        range: string
      predicate:
        required: true
        range: string
      predicate_id:
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
      object:
        required: true
        range: string
      description:
        range: string
      evidence:
        description: >-
          `required: true` — every mechanism claim is curator-asserted and
          must carry at least one citation.
        required: true
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem

  CurationEvent:
    description: A timestamped curator action on a record.
    attributes:
      timestamp:
        range: datetime
        required: true
        pattern: "^20[0-9]{2}-"
      curator:
        range: string
        required: true
      action:
        range: string
        required: true
      changes:
        range: string
        required: true
      llm_assisted:
        range: boolean

