---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push supersedes the first; nothing waits on the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the floor pyproject advertises, so it is tested rather than
        # assumed; 3.12 is what developers run.
        python-version: ["3.10", "3.12"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      # Keep one executable definition of QC: lint, docs stats, tests,
      # closed-schema validation, generated-site drift, corpus report.
      - name: Run the authoritative quality gate
        run: uv run python scripts/run_qc.py

      - name: Upload validation failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-failures-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
