findings:
- finding_id: F1
  issue_key: mrna-capping-fission-yeast-subunit-scope
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Qualify the unsupported fission-yeast two-subunit example
  description: The definition lists Pct1 and Ceg1 in S.pombe as constituents of the
    same two-subunit complex. Its cited Takagi2002 source instead names Pce1 and reports
    failure to detect tight Pct1/Pce1 association in recombinant purification and
    yeast coimmunoprecipitation, summarized in Table1. This is a copied upstream ontology
    conflict, not evidence against the valid S.cerevisiae Cet1/Ceg1 complex.
  target_ids:
  - GO:0031533
  field_paths:
