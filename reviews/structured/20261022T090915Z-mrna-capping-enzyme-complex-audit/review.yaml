  summary: The canonical S.cerevisiae example and species COMMON assignment are compatible
    with the characterized conserved yeast machinery; COMMON retains most-members/losses-exception
    meaning, supported qualitatively rather than by a prevalence census. S288C examples
    are reference identities, not a claim that all Takagi assays used S288C; its fission-yeast
    TE696 and heterologous preparations remain distinct.
