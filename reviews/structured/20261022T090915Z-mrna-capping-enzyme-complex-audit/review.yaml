assessments:
- assessment_id: identity
  area: identity
  topic: Valid budding-yeast complex versus fission-yeast extension
  outcome: concern
  target_ids:
  - GO:0031533
  summary: The nuclear Cet1/Ceg1 complex is a valid exact identity and the represented
    budding-yeast members remain supported. The definition extends that physical two-subunit
    complex to Pct1/Ceg1 in S.pombe, while the cited Takagi primary explicitly tests
    Pct1/Pce1 and reports no tight association. Native GO repeats the conflicting
    parenthetic; it is not independent biological corroboration.
  evidence_ids:
  - record
  - complex61-agent-go
  - complex61-agent-go-0031533-ancestors
  - complex61-agent-takagi2002-legacy
  - complex61-agent-pmid-10347220
  - complex61-agent-pmid-12455993
  - complex61-agent-doi-10.1006_bbrc.1997.7439
- assessment_id: grounding
  area: grounding
  topic: Ceg1 exact family and Cet1 boundaries
  outcome: concern
  target_ids:
  - GO:0031533
  summary: Q01159 and O13297 retain the correct reviewed S288C gene identities and
    single-hit query results. IPR017075 exactly describes the Ceg1 alpha guanylyltransferase
    class and is present on Q01159. Cet1/Ctl1 IPR040343 is broader and IPR004206 is
    a domain, so neither is forced onto the specific Cet1 row.
  evidence_ids:
  - record
  - curation
  - complex61-agent-ipr-IPR017075
  - complex61-agent-ipr-IPR040343
  - complex61-agent-ipr-IPR004206
  - complex61-agent-protein-O13297
  - complex61-agent-protein-Q01159
  - complex61-agent-gene-CET1
  - complex61-agent-gene-CEG1
- assessment_id: graph
  area: graph
  topic: Budding-yeast composition and participation in capping
  outcome: supported
  target_ids:
  - GO:0031533
  summary: The explicitly NONMECHANISTIC graph remains confined to budding-yeast Cet1/Ceg1
    membership and participation in capping. Supporting the full 7-methylguanosine
    capping process does not assert that these two proteins alone methylate the cap
    or include Abd1 as a constituent. Saha abstract distinguishes the entire three-enzyme
    apparatus from this physical subcomplex.
  evidence_ids:
  - record
