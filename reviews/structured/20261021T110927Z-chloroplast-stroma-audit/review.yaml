  outcome: supported
  target_ids:
  - GO:0009570
  summary: Native taxa identify Viridiplantae and Chlamydomonas reinhardtii. The maintained
    occurrence notes concern chloroplast-bearing green algae/plants and the established
    algal chloroplast. COMMON is assessed qualitatively within that context, not as
    every tissue, every nonphotosynthetic descendant or a measured prevalence. Keeling
    discusses plastid diversity/loss; Jin directly names Chlamydomonas for the envelope-spanning
    structure. No experimental strain is inferred.
