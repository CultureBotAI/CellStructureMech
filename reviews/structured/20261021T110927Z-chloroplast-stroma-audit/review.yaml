limitations:
- Jin2022 and Keeling2010 were read through complete native abstracts and metadata
  only. Several legitimate full-text routes returned errors or challenge documents;
  no Methods, figure-pixel or full-body audit is claimed.
- Taxon-wide occurrence is assessed qualitatively at the explicitly chloroplast-bearing
  scope, not as a population prevalence estimate.
- Same-revision neighboring records were inspected only for identity boundaries; each
  review has exactly one target. No exhaustive chemical-ontology absence or molecular
  inventory claim is made.
- 'Karcher2009 support is limited to its complete primary abstract: chloroplast localization,
  nucleoid association and RNAi phenotypes. Both attempted publisher routes returned403.'
- Terashima2011 was read at the specified passages. The supplementary protein list
  and raw proteomics were not inspected, and whole-chloroplast enrichment is not treated
  as pure stromal localization. The record already cites the distinct primary nucleoid
  paper on the relevant graph edge.
- No raw microscopy or quantitative datasets were reanalysed. Historical curator searches
  and independent historical authorship are not certified.
- The completed fresh-base batch15 global gates are attached only at finalization;
  identifier transport and label-adapter limits remain explicit.
- 'Shared corpus gates have bounded coverage: 617 label checks had no adapter; the
  identifier command reported 252 SKIPPED, 821 UNREACHABLE. These totals are not target-specific
  biological findings or proof that all corpus identifiers resolve.'
notes:
- The user explicitly authorized one review for every uncovered target, including
