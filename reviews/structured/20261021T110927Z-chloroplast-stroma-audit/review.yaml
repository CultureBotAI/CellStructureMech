  summary: The membrane targets denote constituent chloroplast-envelope bilayers,
    while the stroma target denotes the internal matrix excluding the thylakoid lumen.
    The active GO definitions and explicit child relations support the maintained
    parents and physical parts. No broader plastid class, internal thylakoid membrane
    or whole organelle is substituted for these identities.
