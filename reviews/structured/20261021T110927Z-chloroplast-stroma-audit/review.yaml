  summary: No invariant molecular component inventory is required for this spatial
    region. GO0009570 directly lists chloroplast nucleoid and plastoglobule as part_of
    children, and UniProtSL0217 places plastoglobules in the stroma in its definition.
    The primary Karcher abstract independently identifies Chlamydomonas HLP localization
    to chloroplast nucleoids. The proteome review supplies metabolic and ribosomal
    context; it is not treated as a direct assay of every nucleoid constituent or
    every stromal protein.
