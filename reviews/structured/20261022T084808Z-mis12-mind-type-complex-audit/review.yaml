limitations:
- De Wulf and Kline bodies were read only in the sections and captions specified.
  No figure pixels, supplementary files, movies or raw quantitative data were inspected.
  Annotation papers represented only by MED abstracts are not promoted to full-body
  evidence.
- De Wulf leaves multiple hydrodynamic species and assembly interpretation open. Kline
  vertebrate depletion/reconstitution does not override the different yeast mutant
  context. No universal subunit-formation requirement is inferred.
- InterPro008685 contains an erroneous organism phrase; family identity instead rests
  on type/name/signatures and independent member identities. COMMON retains majority
  occurrence, with no exhaustive prevalence census.
- Reused source bytes retain original URL, UTC and SHA256. HTTP status alone is not
  treated as evidence of article-body readability.
- All five fresh-base batch26 corpus gates and exact target resolver rows are integrated
  here; every manifested source input is identical at the shared base.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
