findings:
- finding_id: F1
  issue_key: type-iv-pilus-filament-motor-boundary
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Keep cytoplasmic motors out of the pilus filament composition
  description: The record denotes GO:0044096, an extracellular pilin filament, but
    calls cytoplasmic PilB and PilT CONSTITUENT components and assigns formation essentiality.
    The cited source separates the motor subcomplex from the filament. The graph also
    needs explicit type IVa model scope so the dual-motor account is not generalized
    to Tad/other type IV systems.
  target_ids:
  - GO:0044096
  field_paths:
