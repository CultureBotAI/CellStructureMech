actions: []
limitations:
- Claim-bearing primary sections and main Methods were read from the reused native
  JATS; figure pixels, videos, raw tomography and all supplementary data were not
  independently analyzed.
- The resin reconstruction samples part of the overlap region. The grand average deliberately
  excludes overlap and extreme-peripheral segments, so it supplies no complete overlap-specific
  molecular map.
- Exact segment boundaries, region-specific accessory proteins, assembly order and
  physiological consequences remain unresolved by the inspected evidence.
- Species-level occurrence is qualitative for characterized trophozoites, without
  an all-strain, all-stage or numerical prevalence claim.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
