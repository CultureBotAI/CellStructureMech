  issue_key: anammoxosome-hdh-hox-functional-conflation
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Keep HDH and HOX physiological reactions separate
  description: The grouped HAO-family component assigns hydrazine-to-dinitrogen oxidation
    to the whole cohort and copies that role onto Q1PX48. The cited2015 paper separates
    HDH/kustc0694 from HOX/kustc1061, whose physiological reaction is hydroxylamine
    oxidation to NO; another localized HAO-like pair has unresolved function. Native
    Q1PX48 specifically warns that its slow hydrazine activity is probably not physiological.
    The open future-splitting TODO does not qualify the current universal role.
