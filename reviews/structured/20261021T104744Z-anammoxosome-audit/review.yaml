findings:
- finding_id: F1
  issue_key: anammoxosome-hzs-electron-source
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Separate ammonium substrate from the HZS electron supply
  description: The HZS component role and graph description say ammonium-derived reducing
    equivalents/electrons produce hydrazine. The cited review and localization paper
    explicitly describe NO plus ammonium plus three electrons; hydrazine oxidation
    supplies electrons recycled to this step. The present wording misrepresents the
    reaction and electron-transfer loop.
  target_ids:
  - GO:0044222
  field_paths:
