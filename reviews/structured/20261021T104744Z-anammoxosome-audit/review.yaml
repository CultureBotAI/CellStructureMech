- finding_id: F4
  issue_key: anammoxosome-membrane-carrier-localization-source
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Keep soluble-enzyme localization distinct from membrane-carrier membership
  description: The graph binds electron_carriers to membrane-associated cytochromes
    and quinone-linked proteins, then cites the2015 immunolocalization experiment
    for that node. The study explicitly describes all five examined complexes as soluble
    rather than membrane-bound. It therefore supports matrix-enzyme localization,
    not direct membership of the membrane-carrier cohort. The2013 review supplies
