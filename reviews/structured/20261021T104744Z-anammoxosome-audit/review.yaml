- assessment_id: necessity
  area: evidence
  topic: Catalytic activity does not establish organelle assembly
  outcome: concern
  target_ids:
  - GO:0044222
  summary: The sources establish enzyme reactions and localization, not failure of
    organelle formation after removing HZS or every HAO-family constituent. ESSENTIAL
    on those two enzyme components exceeds the structure-formation meaning of the
    field. The membrane as the collective boundary is constitutionally required; no
    individual lipid species requirement is inferred.
  evidence_ids:
  - root20-sources-kartal2013-repository-pdf
  - root20-sources-legacy-PMC4524196
  - record
  - policy
- assessment_id: mechanism
  area: graph
  topic: A real reaction pathway with an incorrect electron-source description
  outcome: concern
  target_ids:
  - GO:0044222
  summary: The graph represents a mechanistic hydrazine cycle, but the HZS edge/role
    incorrectly treats ammonium as the source of reducing equivalents. The equations
    distinguish ammonium and nitric oxide substrates from the three input electrons,
    recycled from hydrazine oxidation. Generic membrane-carrier identity and the complete
    energy-coupling route remain model-level context. The electron_carriers localization
    edge nevertheless maps the soluble-enzyme immunolocalization experiment onto a
    membrane-associated carrier component; that source does not verify this distinct
    cohort.
  evidence_ids:
  - root20-sources-kartal2013-repository-pdf
  - root20-sources-legacy-PMC4524196
  - record
  - policy
- assessment_id: scope
  area: scope
  topic: Restricted anammox distribution and a model species
  outcome: supported
  target_ids:
  - GO:0044222
  summary: The record restricts occurrence within Planctomycetota to anammox lineages
    and supplies Kuenenia as a concrete experimental example. Native ENA now uses
    the corrected spelling stuttgartensis while retaining stuttgartiensis as a synonym;
    this is the same taxon174633, not a different organism or an experimental strain
    reassignment.
