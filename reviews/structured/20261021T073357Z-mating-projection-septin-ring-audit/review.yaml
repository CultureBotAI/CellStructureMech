limitations:
- The 1997 PDF URL returned HTTP200 HTML challenge content, and Europe PMC fullTextXML
  returned HTTP500. Those responses were not treated as article text; genuine PMC
  page scans recovered the relevant body. No source-body absence is claimed.
- All12 page scans were downloaded, but the scientific assessment used visually read
  pages988-996; the reference-only final pages were not an independent literature
  sweep. Derived OCR text was only a navigation aid.
- Two-hybrid and localization results do not establish a purified direct interaction,
  complete ring composition or an experimentally demonstrated diffusion barrier.
- The S. cerevisiae ring-versus-diffuse-band assignment and Afr1 accessory membership
  remain unresolved. Class-level family grounding does not resolve them.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
