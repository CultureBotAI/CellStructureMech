  reference: https://www.ebi.ac.uk/interpro/api/entry/interpro/IPR016491/
  locator: metadata accession, name, type=family, hierarchy and description
  accessed_at: '2026-10-21T06:58:21.193684Z'
  support: supports
  summary: IPR016491 is the Septin family, not a generic GTPase domain. It matches
    the declared septin-proteins class without identifying every localized paralogue
    or accessory protein. The original native retrieval timestamp is preserved.
  snapshot_sha256: 5797c626d192b641ed5b4b2231e729f9f179bfd6bb18f911689fa08253688c4a
- evidence_id: shmoo-ring-prep-giot-metadata
  kind: database
  reference: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1091/mbc.8.6.987&format=json&resultType=core
  locator: Exact DOI/PMID/PMCID, title, authors, year and abstract
  accessed_at: '2026-10-21T07:24:21.773021Z'
  support: supports
  summary: Native metadata confirms Giot and Konopka 1997, DOI:10.1091/mbc.8.6.987,
    PMID:9201710 and PMC305708. The abstract distinguishes effects on Afr1 localization
    from an absolute requirement for projection formation or signaling regulation.
  snapshot_sha256: cdf54496a2d0e584fbb9496ef1c69aa68fa8bc6ee67a2f570b687e21f96a533e
- evidence_id: shmoo-ring-prep-douglas-metadata
  kind: database
  reference: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1128/EC.4.9.1503-1512.2005&format=json&resultType=core
  locator: Exact DOI/PMID, title, authors and year
  accessed_at: '2026-10-21T06:58:21.193422Z'
  support: supports
  summary: Native metadata confirms Douglas et al. 2005, Septin function in yeast
    model systems and pathogenic fungi, DOI:10.1128/EC.4.9.1503-1512.2005 and PMID:16151244.
  snapshot_sha256: 1c4a6be031ab36975c4a274aec9c9d0182e2928499b9ee140022a8a1a4b80d1d
- evidence_id: shmoo-ring-prep-douglas-pmc
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC1214204/
  locator: Section13, Septin function during mating; complete section read in native
    HTML, original receipt retained
  accessed_at: '2026-10-21T07:11:03.050463Z'
  support: partial
  summary: The review distinguishes diffuse shmoo-neck septin bars from tight budding
    rings. It presents diffusion restriction at the shmoo neck as a proposed explanation
    and treats direct Afr1 binding as a possibility based on two-hybrid evidence.
    This is review-tier context rather than a new barrier measurement.
  snapshot_sha256: 31a2dd0109697492854f84701ef3f1d1be31f62312b613ab8432223332b69dd3
- evidence_id: shmoo-ring-prep-giot-page-990
  kind: primary_source
  reference: https://cdn.ncbi.nlm.nih.gov/pmc/blobs/29b7/305708/32aaf5d2b359/mbc00110-0052.png
  locator: Original article page990, Figure1/Table2 and upper-right Results paragraph;
    native PMC PNG visually inspected, hash is the original PNG bytes
  accessed_at: '2026-10-21T07:30:27.856196Z'
  support: supports
  summary: Figure1 reports two-hybrid interaction tests. The Results explicitly state
    that co-immunoprecipitation could not be performed because Afr1 was insoluble
    after cell lysis. This supports an interaction lead without proving direct purified
    binding or a complete ring-complex composition.
  snapshot_sha256: 4ab3ff07929caed92402b60cedf10732953b69b8a0440e27cc0bf911641d46bb
- evidence_id: shmoo-ring-prep-giot-page-992
  kind: primary_source
  reference: https://cdn.ncbi.nlm.nih.gov/pmc/blobs/29b7/305708/473cc467f993/mbc00110-0054.png
  locator: Original article page992, Figure4 and Results subsection on projection
    formation; native PMC PNG visually inspected
  accessed_at: '2026-10-21T07:30:27.862980Z'
  support: supports
  summary: The Cdc12-binding-domain deletion still permits projection formation, with
    reduced efficiency. The Results separate an effect on morphogenesis from an absolute
    requirement for Afr1 function.
  snapshot_sha256: f46ba6a90f06c6ce78c6491b14b9d23b4c76b38d2b46eb5f5f826b1f664342e4
- evidence_id: shmoo-ring-prep-giot-page-993
  kind: primary_source
  reference: https://cdn.ncbi.nlm.nih.gov/pmc/blobs/29b7/305708/8cb325b6c446/mbc00110-0055.png
  locator: Original article page993, Figure6 and Results text on focal planes and
    localization; native PMC PNG visually inspected
  accessed_at: '2026-10-21T07:30:28.089654Z'
  support: supports
  summary: Afr1 immunolocalization and its mutants support restricted localization
    at the projection base. The text says focal planes suggested membrane association
    and possible Afr1 ring organization; it does not establish a tight septin ultrastructural
    ring or resolve the GO ring-versus-band distinction.
  snapshot_sha256: 0cc46617e50550c0a9a0eaa67789ba2303cd528d562477e59a2464f69180f6ac
- evidence_id: shmoo-ring-prep-giot-page-995
  kind: primary_source
  reference: https://cdn.ncbi.nlm.nih.gov/pmc/blobs/29b7/305708/0adefab85f30/mbc00110-0057.png
  locator: Original article page995, Figure9 and both Discussion subsections; native
    PMC PNG visually inspected with surrounding pages988-996
  accessed_at: '2026-10-21T07:30:28.112214Z'
  support: supports
  summary: Figure9 and Discussion support a role for Cdc12 in concentrating Afr1 at
    projection necks, while retaining Afr1 functions without its Cdc12-binding domain.
    The inspected experiments do not demonstrate diffusion exclusion across a shmoo-neck
    barrier.
  snapshot_sha256: d8de806cb6d2650d5053f1d42a7d44e8fa08fa7bab9202ea05202ac69f8c49d5
