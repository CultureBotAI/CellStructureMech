  accessed_at: '2026-10-21T07:24:15.773802Z'
  support: supports
  summary: Native GO verifies the active mating-projection septin-ring identity, septin-ring
    parent and mating-projection parthood. GO:0032175 describes the barrier as a possibility.
    GO:0032162 separately defines a diffuse ring of longitudinal septin bars, preserving
    the target discussion’s unresolved ring-versus-band example boundary.
  snapshot_sha256: f47bb53a853031667c1d7a1f4f64af02a84018f41adb18adbcab23a5cb562b72
- evidence_id: shmoo-ring-prep-family
