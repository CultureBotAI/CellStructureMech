  title: 'sid2_mob1_complex.yaml attributes a custom elaborated definition to definition_source:
    GO:0034973'
  description: 'In data/structures/division_machinery/sid2_mob1_complex.yaml (GO:0034973,
    lines 5-11), definition is a custom elaborated sentence (''A conserved fungal
    NDR-family protein kinase complex localized to the spindle pole body and medial
    cell division site...'') while definition_source is set to GO:0034973. The official
    GO:0034973 definition via OAK is: ''A protein complex that contains a protein
    kinase (Sid2 in S. pombe) and its regulatory subunit (Mob1). The Sid2p-Mob1p kinase
    complex is a component of the septation initiation network in fission yeast (called
    the mitotic exit network in S. cerevisiae) and is required for cytokinesis. The
    analogous complex in S. cerevisiae is called Dbf2p-Mob1p complex.'' Per docs/SCHEMA.md,
    when definition_source cites a GO term, definition should match the official GO
    definition and extended mechanistic synthesis belongs in description.'
