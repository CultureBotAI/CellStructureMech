  uses its primary abstract, fresh Iverson2002 body passages and native deposited
  structure/UniProt evidence. It does not renew the historical claim of reading the1999
  full PDF. Daley2005 remains abstract-only plus verification of UniProt citation
  attribution.'
- 'Formate dehydrogenase N, formate hydrogenlyase and fumarate reductase independent
  subreview: InterPro initially returned429 for five definitions; bounded later retries
