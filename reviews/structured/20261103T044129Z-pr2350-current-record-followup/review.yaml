  text and captions. Supporting crystallization Methods, figure pixels and raw coordinates
  were not independently reanalyzed. Browser-response hashes bind serialized tool
  output, not publisher PDF bytes.'
- 'Formate dehydrogenase N, formate hydrogenlyase and fumarate reductase independent
