  topic: FdnGHI structure and source-scoped respiratory function
  outcome: supported
  summary: The unchanged record denotes nitrate-inducible FdnGHI, with broader GO
    parents and appropriate formate:quinone activity. CPX-1975 and PDB1KQF/1KQG support
    the trimer of heterotrimers; CPX chemical occupancy is explicitly source-scoped.
    Native UniProt verifies FdnG/H/I accessions in K12; PDB entity source is only
    species562. The coarse functional graph agrees with alpha catalysis, beta electron
    transfer and gamma membrane/quinone roles without claiming autonomous proton pumping.
