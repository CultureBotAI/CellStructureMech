  Table1 text. No figure-pixel, full alignment or raw cryo-EM map reanalysis. Energy-conserving
  proton translocation and proposed redox regulation remain unresolved in the primary
  source.'
- 'Formate dehydrogenase N, formate hydrogenlyase and fumarate reductase independent
