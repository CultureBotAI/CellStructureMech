- Every inherited source-access and check limitation is attributed to its independent
  subreview. Fresh fetches, cached response re-reading, abstract-only evidence and
  full-body passages retain distinct scopes.
- Seven original bundles omit structured-source applicability, and one has an unsupported
  exemption rationale. Ventral-disc lateral crest and overlap zone are excluded from
  that defect. Covered bacterial datasets receive source-level cross-checks; uncovered
  target organisms are separately identified.
- Returned AI-generated module prose was excluded from scientific support. Dataset
  gene membership and module details are used only as bounded transcriptomic context,
  with below-threshold observations explicitly not treated as biological absence.
