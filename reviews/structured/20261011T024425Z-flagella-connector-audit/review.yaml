limitations:
- Same-agent scientific review, not independent human sign-off or completion of the
  all-909-record goal.
- Briggs, Moreira-Leite, Davidge and Varga were assessed from primary abstracts. Hoog
  full-text sections provide independent spatial corroboration. Varga full Results
  were inaccessible through attempted official routes; a downloaded PubMed cookie
  challenge is not article evidence.
- The bounded native claims assessed here are supported or contradicted by the inspected
  sections; no assertion is made about unseen experiments, a complete protein inventory
  or detailed kinesin motility mechanism.
- Full QC is verified CI on the exact unchanged baseline, with separately recorded
  local checks. Resolver skips and quote verification do not establish scientific
  support.
- No applicable iModulonDB Trypanosoma dataset was available; this is not negative
  evidence.
