findings:
- finding_id: F1
  issue_key: connector-old-shaft-attachment
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Old-side connector attachment is mislocated at the distal tip
  description: functions[2] and its Varga evidence note say the connector attaches
    to distal microtubule tips in both assembling and mature flagella. The old-side
    attachment is lateral, along the mature flagellar shaft, as shown by primary ultrastructure
    and already stated in functions[0]. Varga places only the new-side attachment
    at extending microtubule tips; cap proteins at both distal tips are a different
    structure.
  target_ids:
  - GO:0120118
