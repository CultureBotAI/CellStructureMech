limitations:
- The Hyc module xrefs cover three correct member proteins, not all six; CausalNode
  permits complexes and does not impose the record-level exact-equivalence contract
  on these links. No exact accession for the entire module is asserted.
- Native JATS claim-bearing sections, listed Methods and Supplementary Table1 were
  read; remaining mechanistic Results subregions, figure pixels, full supplementary
  alignments and raw cryo-EM maps were not reanalyzed.
- Family review is bounded to complete integrated native matches of the seven exact
  proteins and the listed candidate definitions. HycF/IPR010226 description-versus-match
  inconsistency is preserved, not promoted into an exact family assignment.
- The primary paper leaves energy-conserving proton translocation and proposed redox-dependent
  regulation incompletely established. The record claims chemical proton reduction
  only.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
- The schema defines essentiality by whether the structure forms without the component.
  The inspected sources establish constituent membership and functions, but those
  observations alone do not establish this assembly-necessity assertion. No subunit-deletion/assembly
  experiment was independently checked here; catalytic necessity, organismal viability
  and intact structural membership are distinct questions.
- The FdhF-free hexamer directly documents partial assembly and motivates clarification
  of the assembly boundary. It neither establishes formation of the explicitly seven-chain
  target without FdhF nor licenses interpreting ESSENTIAL as constituent membership.
