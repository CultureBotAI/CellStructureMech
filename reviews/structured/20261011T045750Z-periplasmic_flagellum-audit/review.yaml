- finding_id: F2
  issue_key: periplasmic-flagellum-static-shape-rotation-evidence
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Separate static skeletal shape from rotation-driven deformation
  description: The rotation-to-deformation edge cites only the flaB mutant skeletal
    phenotype. In the same Motaleb study, paralyzed CCCP-treated cells retain flat-wave
    shape, showing that resting shape does not require rotation. Dynamic deformation
    during swimming is a distinct mechanism; the edge needs evidence and wording for
    that process rather than using static skeletal loss as proof.
  target_ids:
  - GO:0055040
