findings:
- finding_id: F1
  issue_key: periplasmic-flagellum-flaa-sheath-scope
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Scope FlaA architecture to the demonstrated spirochete lineage
  description: The record describes FlaA as a generic sheath around FlaB and calls
    every graph filament sheathed. Ge 1998 explicitly leaves the Borrelia FlaA location/sheath
    role unresolved. Nakamura 2020 distinguishes Brachyspira sheath architecture,
    tentative basal localization in Borrelia, and a Leptospira sheath that persists
    after FlaA deletion. Generic membership is not universal sheath architecture.
  target_ids:
  - GO:0055040
