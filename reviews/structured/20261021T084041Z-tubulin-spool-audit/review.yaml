limitations:
- The primary paper was read at the explicit claim-bearing Results, Discussion, limitations,
  key-resource and Methods sections; all unrelated organism sections, videos and supplements
  were not independently reanalyzed.
- TableS1 specified headers/rows and pinned exact-volume metadata were inspected;
  raw U-ExM volumes were not downloaded, counted or reprocessed, and an exact raw-volume-to-Figure2
  mapping was not established.
- Culture samples were fixed once; variable labeling and expansion quality constrain
  negative taxonomic interpretation. Spool annotations are image-level labels rather
  than prevalence estimates.
- The apparent microtubule continuity, full tubulin subtype inventory, assembly mechanism
  and proposed functions remain unresolved; generic family grounding does not prove
  every subtype.
- The conflicting expansion-scale statements are retained without deriving native
  dimensions from image pixels.
- The current bounded QuickGO spool search has zero hits but does not establish exhaustive
  absence from all ontologies or local ignored files. Historical corpus search notes
  are not repeated as new findings.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
