assessments:
- assessment_id: identity
  area: identity
  topic: Distinct Fus1-dependent actin aster
  outcome: supported
  target_ids:
  - GO:1990819
  summary: GO1990819 supplies the exact focus definition and broad synonym. Primary
    live reporters, phalloidin and SIM/confocal imaging support a Fus1-dependent focus
    with emanating filaments distinct from actin patches, longer cables and the cytokinetic
    ring. The record does not equate the broader tip region with its actin focus.
  evidence_ids:
  - fusion-focus-agent-go
  - fusion-focus-agent-paper-s3
  - record
  - tip-context
- assessment_id: topology
  area: representation
  topic: Both part_of relations and regional context
  outcome: supported
  target_ids:
  - GO:1990819
  summary: Native GO paths verify direct part_of links to GO0043332 mating projection
    tip and GO0015629 actin cytoskeleton. The prior is_a-to-part_of correction is
    retained. The neighboring tip record supplies compatible local context; its other
    biological assertions are outside this target review.
  evidence_ids:
  - fusion-focus-agent-go
  - fusion-focus-agent-go-relations
  - record
  - tip-context
- assessment_id: grounding
  area: grounding
  topic: Actin constituent and named protein exemplars
  outcome: supported
  target_ids:
  - GO:1990819
  summary: F-actin is experimentally localized and forms the aster. Reviewed P10989
    maps to act1 in taxon284812, and the exact remote query returns the single reviewed
    entry. Q10719 Fus1, O74805 Myo51 and O94477 Myo52 identities agree. These accessions
    identify reference proteins and do not themselves prove localization or supply
    a source-neutral whole-family mapping.
  evidence_ids:
  - fusion-focus-agent-act1
  - fusion-focus-agent-act1-search
  - fusion-focus-agent-fus1
  - fusion-focus-agent-myo51
  - fusion-focus-agent-myo52
  - fusion-focus-agent-paper-s3
  - record
- assessment_id: nucleation
  area: graph
  topic: Fus1-dependent assembly and direct biochemical context
  outcome: supported
  target_ids:
  - GO:1990819
  summary: Dudin establishes in-vivo Fus1 dependence and aster architecture and explicitly
    cites Scott2011 for direct formin nucleation. Scott uses recombinant Fus1 FH1/FH2
    constructs and chicken/rabbit muscle actin. This supports the generic nucleates
    edge without claiming direct reconstitution with the P10989 reference protein
    or a complete physiological assembly mechanism.
  evidence_ids:
  - fusion-focus-agent-paper-s3
  - fusion-focus-agent-scott2011-jats
  - record
- assessment_id: myosins
  area: graph
  topic: Focalization versus cargo delivery
  outcome: supported
  target_ids:
  - GO:1990819
  summary: Myo51 and Myo52 jointly focalize Fus1/actin, while Myo52 cargo-tail perturbation
    specifically prevents Agn2/Eng2/Exg3 localization. Myo51 tail deletion preserves
    that localization and fusion. The record says typeV myosins help concentrate hydrolases
    in a nonmechanistic graph; this accommodates structural and cargo-delivery contributions
    without asserting equivalent direct transport by both motors.
  evidence_ids:
  - fusion-focus-agent-paper-s3
  - record
- assessment_id: function
  area: evidence
  topic: Focused wall dissolution during mating
  outcome: supported
  target_ids:
  - GO:1990819
  summary: Seven tagged glucanases accumulate at the focus, selected loss combinations
    impair fusion, and broad distribution in fus1 mutants is insufficient for normal
    fusion. Bgs1/Bgs4 occupy a broader synthesis zone. These results support focal
    wall dissolution; they do not resolve direct motor-cargo binding, glucanase export
    routes or a complete timed secretory pathway.
  evidence_ids:
  - fusion-focus-agent-go
  - fusion-focus-agent-paper-s3
  - record
- assessment_id: taxon
  area: scope
  topic: Conditional mating state and mixed experimental stocks
  outcome: supported
  target_ids:
  - GO:1990819
  summary: The species example4896 is S.pombe and its variable presence is mating-dependent,
    not constitutive vegetative localization. Reference protein taxon284812 is972h-;
    Dudin uses homothallic and heterothallic backgrounds including972,975,968 and
    tagged/mutant strains. Nitrogen-starvation mating and imaging conditions remain
    distinct from reference-protein identity.
  evidence_ids:
  - fusion-focus-agent-species
  - fusion-focus-agent-strain
  - fusion-focus-agent-paper-s3
  - fusion-focus-agent-supplement
  - fusion-focus-agent-act1
  - record
- assessment_id: completeness
  area: completeness
  topic: Explicitly bounded composition and mechanism
  outcome: supported
  target_ids:
  - GO:1990819
  summary: The record directly models the actin aster and includes its main Fus1/myosin/hydrolase
    relationships. Source-localized Cdc8, Cam2 and Crn1 show that inventory is not
    complete, which the record expressly acknowledges. A full protein inventory, family
    grounding and stoichiometry are not asserted; the open component-boundary TODO
    remains appropriate and is not automatically a curation finding.
  evidence_ids:
  - fusion-focus-agent-paper-s3
  - fusion-focus-agent-fus1
  - fusion-focus-agent-myo51
  - fusion-focus-agent-myo52
  - record
