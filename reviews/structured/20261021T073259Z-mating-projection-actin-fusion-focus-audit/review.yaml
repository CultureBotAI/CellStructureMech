limitations:
- Native primary body and main captions were read. Movies, raw microscopy and main
  figure pixels were not independently evaluated; supplementary TableS1 text was read
  and p.S4 visually inspected by the source agent.
- Myo51/Myo52 joint focus organization does not establish equivalent direct cargo
  transport. Tested hydrolase delivery is Myo52-tail dependent, whereas Myo51 tail
  deletion preserves it.
- Scott2011 biochemical evidence uses recombinant formin fragments and heterologous
  muscle actin; it does not identify P10989 as the actin preparation.
- No exhaustive family-mapping or complete focus-inventory search was performed, and
  the component-boundary TODO is not closed. No fixed stoichiometry or broad fungal
  prevalence is inferred.
- The neighboring tip record informed only regional topology consistency; its independent
  claims and cited literature were not separately audited.
- Current source review does not reconstruct every historical curation decision or
  establish independent historical authorship.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
