  COMMON keeps its majority-occurrence/losses-exception meaning; qualitative source
  synthesis supports it without measuring population prevalence.
- Babst2002, Buchkovich2013 and Webster2014 were read at complete native abstract
  scope; UniProt localization notes retain their annotation tier. Babst publisher
  returned403.
