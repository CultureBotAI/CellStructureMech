  summary: The ESSENTIAL row denotes the collective material constituting the named
    membrane. It does not identify an individual phospholipid, relative abundance
    or removal/substitution requirement. The primary studies do not establish those
    molecular formation requirements. This separates logical material constitution
    from empirical necessity, without treating lack of an individual-lipid assay as
    a defect.
  evidence_ids:
