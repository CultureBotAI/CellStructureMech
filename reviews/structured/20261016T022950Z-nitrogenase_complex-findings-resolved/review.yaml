findings:
- finding_id: F1
  issue_key: nitrogenase-generic-dinitrogenase-stoichiometry
  category: scope
  severity: major
  status: resolved
  certainty: confirmed
  title: Do not universalize tetrameric dinitrogenase across nitrogenase variants
  description: The generic record expressly includes Mo-, V- and Fe-only forms, but
    definition, component role and two graph descriptions call the complete catalytic
    component tetrameric. Inspected primary structures include additional G subunits
    in alternative catalytic components. GO currently has the same older wording,
    so this is an authority-versus-primary-evidence conflict, not an incorrect transcription
    of GO. Retain the generic identity; scope the Mo tetramer example and qualify
    variant-dependent composition.
  target_ids:
  - GO:0016610
  field_paths:
  - definition
  - components[dinitrogenase].role
  - components[dinitrogenase].evidence[reference=GO:0016610]
  - causal_graphs[nitrogenase_ferredoxin_dinitrogen_reduction].edges[nitrogenase_reductase
    docks with dinitrogenase].description
  - causal_graphs[nitrogenase_ferredoxin_dinitrogen_reduction].edges[dinitrogenase
    contributes to nitrogenase_activity].description
  evidence_ids:
  - native
  - history
  - prior
  - sources
  - validation
  rule_id: review-checklist:components-stoichiometry-and-scope
  native_severity: major
  normalization_reason: Material composition scope inflation in a cross-variant record,
