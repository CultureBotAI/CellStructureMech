  issue_key: nitrogenase-ipr005977-variant-scope
  category: grounding
  severity: minor
  status: resolved
  certainty: confirmed
  title: Correct the Mo-specific rationale for the NifH family
  description: The component grounding rationale and discussion characterize the cited
    NifH family among narrower molybdenum-iron families. Current IPR005977 instead
    includes an iron-only AnfH structural representative and matching C1DK95 annotation.
