findings:
- finding_id: F1
  issue_key: contractile-ring-cdc12-constituent-boundary
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Represent Cdc12 as a contractile-ring constituent
  description: Cdc12 is labeled ASSOCIATED_MACHINERY even though the primary study
    follows it from nodes into a normally constricting ring and explicitly describes
    Cdc12 molecules in the ring. Under the native rule, this is a ring constituent,
    not merely dispensable positioning/maintenance machinery. Its nucleation function
    does not exclude persistent structural membership.
