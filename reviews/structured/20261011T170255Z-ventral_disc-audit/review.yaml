- assessment_id: finding-1
  area: evidence
  topic: Remove the unsupported classical contractile-protein mechanism
  outcome: concern
  target_ids:
  - GO:0097597
  evidence_ids:
  - record
  - go
  - hagen2011
  - hagen2025
  - rules
  summary: The definition copies the current GO assertion that actinin, alpha-actinin,
    myosin and tropomyosin drive disc contraction. Hagen 2011 reports conflicting
    older antibody evidence, no actin in the disc proteome and no myosin homolog in
    the then-known Giardia genomes; Hagen 2025 distinguishes later localization evidence
    from the early actin-based crest-contraction hypothesis. The native graph already
    leaves force generation unresolved. Retain attachment and architecture but remove
    this asserted molecular machinery, without claiming that all actin-associated
    regulation or all disc contraction is impossible.
- assessment_id: finding-2
  area: evidence
  topic: Match the two related synonyms to their GO scope
  outcome: concern
  target_ids:
  - GO:0097597
  evidence_ids:
  - record
  - go
  summary: GO:0097597 types adhesive disc and ventral disk as related synonyms, but
    the record types both as exact. Ventral adhesive disc is correctly exact. Correct
    only the two scope values, retaining strings and sources.
- assessment_id: finding-3
  area: evidence
  topic: Use a source-neutral alpha/beta tubulin label
  outcome: concern
  target_ids:
  - GO:0097597
  evidence_ids:
  - record
  - rules
  - schwartz
  - issue-search
  summary: 'The component and matching graph node are labelled ventral disc tubulins
    rather than the source-neutral alpha- and beta-tubulins molecular class. The location
    belongs in the existing role. Closed issue #988 fixed this same naming pattern
    in the separate microtubule-array record, not the whole-disc record. Keep stable
    component/node IDs, role, evidence and unresolved grounding.'
