limitations:
- Ireland 2002 and Biondi 2006 were assessed at primary-abstract level for their bounded
  claims; their unseen bodies/supplements are not claimed as inspected.
- Main-text HTML was used for Schlimpert 2012, Wagner 2006 and Hughes 2010/2013 after
  Europe PMC XML returned HTTP 500. Billini 2019 and Curtis 2017 full-text XML was
  inspected. No raw images, supplementary movies or experimental datasets were reanalysed.
- Same-agent assessment, not independent human sign-off or completion of the 909-record
  goal.
- No relevant iModulonDB coverage. No quoted snippets are present; snippet-check success
  is not paraphrase validation.
- A repeated documentation check overlapped the running README generator and saw the
  earlier count again; it was not accepted as verification. Final input capture and
  QC were repeated only after the generator completed and the README change was committed.
- Original source-access tiers and snapshot times are retained. Resolution covers
  these exact findings, not unseen experiments or the unreviewed corpus.
- Full QC here is local. PR and merge-group checks remain separate publication gates.
  Exact inspected revision is retained by review-base/stalk-evidence-final-20261011.
- The first local QC attempt failed at lint on two overlong test lines (exit 1; log
  SHA-256 a8682035d6b8a9741155174f7d99c16afa437ad53e6a75b9022fb55e5595f872). Formatting
  was corrected. A second attempt caught stale generated README edge counts (exit
  1; log SHA-256 ec9e17f08a2fe9b1f57816a3b54a9b47ef3f0075e6643745e366ffa951de346e);
  the documented generator refreshed the count. Full QC was then rerun successfully.
  The provenance regression was also scoped to this review event rather than the latest
  event, so subsequent curation can append history.
- Same-agent adversarial diff review confirmed structural DISPENSABLE does not mean
  functional dispensability, the uptake edge is restricted to measured FDP activity,
  graph/discussion references resolve, and prior issue fixes and Codex attribution
  remain intact. No additional scientific issue was observed.
