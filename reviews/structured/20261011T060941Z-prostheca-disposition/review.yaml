  support: supports
  summary: Proteomics identifies transport-related proteins in purified stalks, consistent
    with nutrient-uptake competence, not direct proof of whole-cell nutrient delivery.
- evidence_id: paper-2
  kind: primary_source
  reference: DOI:10.1073/pnas.0602047103
  locator: Abstract, all Results and Discussion
  accessed_at: '2026-10-11T05:47:10Z'
  snapshot_sha256: fe19851f972f26edebeb7b4486bb081c1e570b1b8dc1814c5861304902cc472b
  support: supports
  summary: Isolated and attached stalks take up and hydrolyze FDP. PstS is present
    but PstA was not detected. Diffusive-capture modeling predicts a length/geometry
    advantage, not simply a surface-area rule; its periplasmic shuttle model was challenged
    by later crossband experiments.
