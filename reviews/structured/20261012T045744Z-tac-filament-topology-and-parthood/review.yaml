- finding_id: F2
  issue_key: tac-cytoskeleton-is-a-versus-part-of
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Represent cytoskeleton as TAC parthood instead of an is-a parent
  description: parent_structures currently contains GO0005856. The local contract
    makes that an is-a assertion, whereas GO lists GO0120121 as part_of cytoskeleton.
    TAC is an attached substructure, not a type of whole cytoskeletal framework. Move
    this relation to part_of and retain exact GO0120121 identity; do not guess a replacement
    is-a parent.
  target_ids:
