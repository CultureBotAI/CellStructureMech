findings:
- finding_id: F1
  issue_key: tac-filament-compartment-reversal
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Restore the correct TAC filament compartments and bridge order
  description: 'The maintained component roles and source notes place unilateral filaments
    in the cytoplasm and exclusion-zone filaments beside kDNA. The graph repeats that
    reversed order. Ogbadoyi2003 Results, Figures2/3/6 and Discussion explicitly give
    the opposite: basal body, exclusion-zone filaments, differentiated mitochondrial
    membranes, unilateral filaments, kDNA. This materially reverses the architecture
    while attributing it to the defining source.'
  target_ids:
