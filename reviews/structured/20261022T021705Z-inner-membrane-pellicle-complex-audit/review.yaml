assessments:
- assessment_id: identity
  area: identity
  topic: Exact apicomplexan membrane identity and contextual synonym
  outcome: supported
  target_ids:
  - GO:0070258
  summary: The double-bilayer pellicle identity is supported. Inner membrane complex
    is exact within the explicitly apicomplexan source context; its broader use in
    other contexts explains the GO broad synonym. GO0043231 parentage is a biological
    inference from source and parent definitions, not a falsely claimed native ontology
    edge.
  evidence_ids:
  - record
  - imc-agent-go
  - imc-agent-go-isa-only
  - imc-agent-ferreira2021-jats
  - imc-agent-kono2012-minimal
- assessment_id: materials
  area: grounding
  topic: Membrane material and alveolin cohort
  outcome: supported
  target_ids:
  - GO:0070258
  summary: The label-only bilayer row denotes the collective lipid material of flattened
    cisternae and has no erroneous whole-membrane GO molecular grounding. Alveolin
    membership and the three named Plasmodium symbols are supported by review Table1
    and primary architecture studies. No exact family or complete subunit census is
    invented.
  evidence_ids:
  - record
  - schema
  - imc-agent-ferreira2021-jats
  - imc-agent-kono2012-minimal
  - imc-agent-ipr-alveolin-search
  - imc-agent-alveolin-proteins
- assessment_id: necessity
  area: evidence
  topic: Formation necessity is not composition
  outcome: unknown
  target_ids:
  - GO:0070258
  summary: The bilayer is constitutive of this membrane-bounded identity. Its ESSENTIAL
    collective-material interpretation does not demonstrate formation necessity of
    each lipid species; the inspected studies do not establish such chemical removal
    tests. Alveolin essentiality remains UNKNOWN and no universal protein requirement
    follows from localization.
  evidence_ids:
  - record
  - schema
  - imc-agent-ferreira2021-jats
  - imc-agent-kono2012-minimal
- assessment_id: scope
  area: scope
  topic: Taxonomic and developmental scope
  outcome: supported
  target_ids:
  - GO:0070258
  summary: Review-level Apicomplexa COMMON is qualitative and explicitly stage/lineage
    qualified. The canonical P. falciparum asexual/sexual context is directly supported.
    Neither a single IMC architecture nor gliding activity in every developmental
    stage is inferred.
  evidence_ids:
