limitations:
- Ferreira2021 and Kono2013 are review-tier sources. Kono2013 was checked at complete
  native abstract level, not full body.
- Dearnley2012 complete native abstract was inspected; native publisher/PDF routes
  returned403 and a CDN minimal route404. Browser-displayed early PDF text was not
  frozen as a body receipt and is not used to certify the entire paper.
- Kono2012 primary body was inspected only in the enumerated sections. No figure pixels,
  supplementary datasets or quantitative phenotype reanalysis were performed.
- The broader parent follows biological definitions, not a native is_a edge in the
  captured ancestor response. Exact synonymy is restricted to the apicomplexan source
  context.
- The family searches are bounded exact-name queries. Empty results are not an exhaustive
  assertion of missing ontology/family representation.
- Membership and collective constitutive material do not establish individual molecular
  formation necessity. Representative Toxoplasma protein links are not P. falciparum
  accession-specific experimental evidence.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
