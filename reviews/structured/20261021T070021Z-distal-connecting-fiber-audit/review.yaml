evidence:
- evidence_id: distal-agent-1987-pdf
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC2114749.1/PMC2114749.1.pdf
  locator: McFadden et al.1987 Methods, Results Figures3–5 and9, Discussion; Figure9
    visually inspected by source collaborator
  accessed_at: '2026-10-21T06:55:56.997225Z'
  support: supports
  summary: The primary study supports an unstriated distal bridge in Spermatozopsis
    SAG1.85, anti-20-kDa-protein localization and calcium-triggered reorientation
    of extracted basal-body apparatuses. Reorientation persists with beating inhibited
    or axonemes amputated, but reducing calcium does not restore the original basal-body
    configuration.
  snapshot_sha256: 994a99d2f5c9185f3e2fb1c217ee8bcd59e81d9298c79d1a5ae58487e3631f0c
- evidence_id: distal-agent-1987
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC2114749.1/PMC2114749.1.xml
  locator: PMC2114749.1 article licence and Figure9 legend; corroborated against inspected
    PDF page8
  accessed_at: '2026-10-21T06:55:56.560021Z'
  support: supports
  summary: Official PMC version1 JATS identifies Figure9 and explicitly declares CC
    BY-NC-SA4.0. Panels B–E show distal fibers, F the separate nucleus connector and
    G a preimmune control; scale bars are300nm.
  snapshot_sha256: 09b44400707774a6e48e8ab7fe508ceb527020fd3b89ab36b3cb5089aad88f67
- evidence_id: distal-agent-1992
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC2289752.1/PMC2289752.1.xml
  locator: Taillon et al.1992 Methods, mutant/revertant Results, TableII and final
    Discussion
  accessed_at: '2026-10-21T06:56:22.935569Z'
  support: supports
  summary: Centrin E101K and position101 revertants distinguish distal-fiber assembly
    from NBBC and transition-region phenotypes. Class2 revertants retain abnormal
    distal fibers with normal other centrin structures and normal basal-body cycles,
    limiting segregation claims.
  snapshot_sha256: c90d59123403bad402653eb6fef86df1892a65d2a7d08989006b707ac7571b0e
- evidence_id: distal-agent-1984
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC2113127.1/PMC2113127.1.xml
  locator: Hoops et al.1984 Results and Discussion
  accessed_at: '2026-10-21T06:56:22.659448Z'
  support: supports
  summary: The vfl3 study reports its condition-specific waveform/frequency/synchrony
    results and cannot separate striated-fiber defects from microtubular-rootlet defects.
    It does not establish universal absence of a distal-fiber coordination role.
  snapshot_sha256: c8ee88b2d54234e94ba5853583114f92f52b70a6b3b5043faadaa4fa83828ab1
- evidence_id: distal-agent-2016-pdf
  kind: primary_source
  reference: https://www.damtp.cam.ac.uk/user/gold/pdfs/coupling_online.pdf
  locator: Wan and Goldstein2016 Results, Discussion and relevant Methods
  accessed_at: '2026-10-21T06:56:43.596409Z'
  support: supports
  summary: Recovered author-hosted PNAS Early Edition full paper compares vfl3 CC1686
    with WT CC125 and uses disconnected-cell micromanipulation to support internal
    basal coupling. The study does not isolate a universal distal-fiber-specific necessity.
    This improves current access beyond the record’s historical abstract-only note.
  snapshot_sha256: 6017156e4c39fc8dc652c8b2e4c073a88c77bbf7659315218ea5d42003c2d866
