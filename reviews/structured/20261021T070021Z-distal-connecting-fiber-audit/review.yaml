limitations:
- The1998 Wiley full paper remains inaccessible (HTTP403); only its complete primary
  abstract supports the explicitly limited Chlamydomonas response.
- The recovered2016 source is an author-hosted PNAS Early Edition PDF. The record’s
  old abstract-only access note documents the earlier curation pass, not current permanent
  unavailability.
- The experiments do not reconstruct a complete molecular contraction/reextension
  cycle or establish universal ATP independence, clade prevalence or distal-fiber-specific
  synchronization necessity.
- The component inventory is incomplete and no Spermatozopsis sequence, native stoichiometry
  or fiber-size measurement is inferred from antibody labeling or whole-apparatus
  gels.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
