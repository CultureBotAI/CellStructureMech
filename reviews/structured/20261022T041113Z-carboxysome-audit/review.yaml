limitations:
- Primary source reading is confined to the specified body sections/captions. Other
  protein-annotation citations were checked at complete native abstract and annotation
  level; no unread body or supplemental dataset is certified.
- Dou2008 complete native abstract supports isolated CA-deficient carboxysomes; its
  DOI response is a redirect/locator, not a readable article body. Yeates2008 is complete-abstract
  only.
- RbcX association and effects are native Syn7942 findings; detailed molecular packing
  roles are proposed, and neither universal carboxysome membership nor formation necessity
  is inferred.
- Shell metabolite permeability and oxygen restriction are literature/model-level;
  no independent transport-rate measurement or exhaustive modern taxon census was
  performed. Only the maintained Tsai Fig1 pixels were visually assessed.
- All five fresh-base batch26 corpus gates and exact target resolver rows are integrated
  here; every manifested source input is identical at the shared base.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
