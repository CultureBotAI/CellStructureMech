findings:
- finding_id: F1
  issue_key: carboxysome-formation-essentiality
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Separate vertex/CA functional requirement from structure formation
  description: BMC-P and carbonic-anhydrase cohorts are labelled ESSENTIAL under the
    schema rule that the structure cannot form without the component. Native H. neapolitanus
    vertex double mutants still produce mostly normal-looking carboxysomes (some elongated),
    and CA-deficient carboxysomes are isolated despite severe physiological defects.
    Those observations directly contradict unqualified formation necessity.
  target_ids:
  - GO:0031470
