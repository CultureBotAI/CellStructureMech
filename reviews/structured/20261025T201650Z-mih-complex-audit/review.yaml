limitations:
- Tian was inspected through the retained publisher-preview extraction and complete
  native abstract; unlisted sections, figures, supplementary strain tables and raw
  experiments were not inspected. Publisher HTML/PDF and archive routes failed.
- Naylor genuine PMC HTML was read only in the named Results, Discussion and Methods
  sections. EuropePMC XML failed and NCBI efetch supplied a restricted metadata stub;
  neither was mistaken for full text.
- S288C is verified for protein-example accessions; experimental strain attribution
  in the Tian canonical-example note remains unconfirmed without its supplementary
  strain table. No independent multi-species prevalence survey was performed.
- Corpus identifier resolution includes856 unreachable and252 skipped identifiers
  despite native exit0; BFO authority control was not exercised. These residuals are
  not evidence of absence or scientific validity.
