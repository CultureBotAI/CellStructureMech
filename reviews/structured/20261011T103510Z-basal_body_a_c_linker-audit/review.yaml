limitations:
- Same-agent review, not independent human scientific approval.
- The complete supplement and raw experimental data were not reanalyzed. Unknown proteins,
  fine paralogue identity and model-derived contacts remain bounded as in the native
  record.
- Exact-baseline full QC is a verified CI result; recent scoped/global local checks
  are reused only after exact input hashes were revalidated. Resolver and label skips
  remain explicit.
- Official PMC OA JATS and images were readable and checksum verified; a browser challenge
  on other PMC content was not treated as source support.
- B-C junction and inner-scaffold YAML were read as context but their scientific reviews
  are not completed or counted by this observation.
