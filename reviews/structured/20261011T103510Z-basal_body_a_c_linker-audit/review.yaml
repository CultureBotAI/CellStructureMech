findings:
- finding_id: F1
  issue_key: ac-linker-denoised-tomogram-provenance
  category: provenance
  severity: minor
  status: open
  certainty: confirmed
  title: Describe the A-C linker tomograms as denoised, not raw
  description: The hosted Figure 1 caption describes A-C as segmented and raw in-situ
    cryotomograms. Cai et al. Methods instead state that FIB-milled cell tomograms
    were contrast improved with DeepDeWedge and specifically call the Figure 1A tomogram
    denoised before segmentation. This is a bounded microscopy-processing provenance
    error, not a defect in biological identity.
  target_ids:
  - cellstructuremech:basal_body_a_c_linker
