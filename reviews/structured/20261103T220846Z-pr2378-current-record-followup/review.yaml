limitations:
- 'Spongiome and toxicyst independent subreview: Independent read-only review of two
  unchanged targets: spongiome qualified pass, toxicyst one inherited minor attribution
  finding with exact lineage and a narrowed append-only-safe action. No new scientific
  finding or record mutation. Neighbor records supply bounded anatomy only; no neighbor
  verdict/issue disposition.'
- 'Spongiome and toxicyst independent subreview: Both original explicit expression-only
  exclusions are unsupported for the positive molecular/pathway narratives. Fresh
  official catalogue has no actual Dictyostelium, Paramecium, Haptoria or Coleps match.
  No unrelated prokaryotic proxy/downstream module query; catalogue noncoverage is
  not biological absence. Historical00:49Z runner PermissionError remains historical.'
- 'Spongiome and toxicyst independent subreview: Seven original failed-access items
  (six spongiome, one toxicyst) were typed primary_source despite honest failure prose.
  Successor retains these as access/provenance defects, never as unseen scientific
  bodies. Fresh Nolta HTTP200 redirect shell, JBC/Fok/Gronlien/Buonanno403 and DocampoXML500
  do not certify full text.'
- 'Spongiome and toxicyst independent subreview: Nolta1994 and Gronlien2002 complete
  primary abstracts were read; Fok1995 available abstract is explicitly truncated
  at250words. Exact source strains, complete primary Methods and pixels remain unavailable.
  Functional inhibitor responses and electrogenic associations are not formation necessity
  or a complete universal osmotic route.'
- 'Spongiome and toxicyst independent subreview: Docampo2013 genuine secondary HTML
  S10–S12 was read in full, including Table2 and embedded text captions; no pixels,
  remaining chapter sections or all underlying studies were audited. Aggregated CVC
  proteins/models are not a mandatory spongiome inventory.'
- 'Spongiome and toxicyst independent subreview: Li2024 genuine primary JATS authors,
  Background, morphology/lifestyle, toxin/transmembrane Results, Discussion, Conclusions,
  sampling and TEM sections were read. Other genomic sections, raw datasets/supplements
  and image pixels were not fully audited. Type-I Haptoria distribution includes prior
  background support rather than a new whole-clade census; candidate gene expansion
  is not mature toxicyst localization.'
- 'Spongiome and toxicyst independent subreview: Buonanno2014 complete primary abstract
  supplies discharged Coleps material chemistry/cytotoxicity, not a resting toxicyst-specific
  inventory, exact universal mixture, full Methods/strain or image assessment. Unknown
  chemical identity is retained without inventing a single CURIE.'
- 'Spongiome and toxicyst independent subreview: Four spongiome reviewed UniProt entries
  and four exact reviewed-gene queries support declared identity/uniqueness. Native
  commands report four examples and one COVERED node; toxicyst commands cover zero
  examples/typed nodes. These are represented scope checks, not complete localization/formation/biogenesis
  validation.'
- 'Spongiome and toxicyst independent subreview: Original toxicyst A1 explicitly preserves
  history, so its seven-current-strings wording is clarified without manufacturing
  another bundle issue. Six current evidence notes are correctable; the dated seventh
  rationale occurrence stays immutable with optional appended clarification.'
- 'Spongiome and toxicyst independent subreview: All25 actually used repository inputs
  were frozen before reading:17 common inputs,2 targets,4 original files and2 anatomy
  neighbors. Original native validation/render and all25 historical frozen input hashes
  pass. No maintained images. Root owns global gates/final CI/save/queue/merge; no
  future results are certified.'
- 'Five trans-Golgi network and transport-vesicle records independent subreview: Five
  unchanged targets independently reassessed; original native validation/render passes
  and all78 historical frozen input rows match. Six inherited findings remain: one
  major vesicle defining-mechanism scope, five minor whole-network material join/source-attribution/graph-scope/lumen-cargo
  qualifications. Both membrane targets retain qualified passes; no new scientific
  finding established.'
- 'Five trans-Golgi network and transport-vesicle records independent subreview: Fresh
  Holthuis primary publisher body actually read: Results Sec3–9, Discussion Sec11–13,
  Methods Sec16/18/19/21/23/24 and associated captions. Fresh Copic primary PMC body:
  Results sec9–13, Methods sec3–7 includingTable1, Discussion sec15–18 and associated
  captions. No pixels, supplements, rawdata or independently cited prior experiments
  inspected. Current guessed Copic S3 XML404 is access-only; genuine PMC body succeeds.
  Original primary-source evidence tiers are accurate.'
- 'Five trans-Golgi network and transport-vesicle records independent subreview: Tlg2
  TGN localization is supported; Tlg1 early-endosome assignment remains tentative.
  Tlg deletions impair retrieval/endocytosis but do not abolish general forward secretion.
  Copic gradients do not resolve every TGN/endosomal compartment, Figure9 arrows need
