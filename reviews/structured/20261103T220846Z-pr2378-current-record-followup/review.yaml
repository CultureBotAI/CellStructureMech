- assessment_id: septin-spongiome-composition
  area: grounding
  topic: Constituent identities and formation necessity
  outcome: supported
  summary: The PROTEIN_COMPLEX label-only localized V-ATPase constituent is biologically
    bounded. Generic GO0033176 would not identify a spongiome-localized molecular
    subset; no forced grounding or representative-completeness defect is established.
    Essentiality UNKNOWN is appropriate because functional inhibition/localization
    do not prove formation failure.
  target_ids:
