  - septin-context-contractile_vacuole_complex
- assessment_id: septin-spongiome-definition
  area: scope
  topic: Definition and overall experimental scope
  outcome: supported
  summary: Network morphology, osmoregulatory context and compartment separation are
    supported by GO and bounded Nolta/Fok primary abstracts; no universal fixed architecture
    across all taxa or complete water-entry mechanism is inferred.
  target_ids:
  - GO:0062160
  evidence_ids:
