- assessment_id: septin-spongiome-schema
  area: schema
  topic: Original schema/render and frozen input integrity
  outcome: supported
  summary: Original native validate/render exit0 with byte-exact Markdown; every historical
    frozen input hash matches. Current target is unchanged and all current claims
    are reassessed independently.
  target_ids:
