  area: scope
  topic: Taxon identity, canonical hosts and prevalence
  outcome: supported
  summary: D. discoideum fractionation and P. multimicronucleatum microelectrode/label
    experiments are separate canonical hosts. Exact source strains remain unverified
    at abstract access. COMMON is a qualitative native occurrence claim, not a census.
  target_ids:
