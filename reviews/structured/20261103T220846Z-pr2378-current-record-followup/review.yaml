  area: evidence
  topic: Canonical observations and body/abstract tiers
  outcome: supported
  summary: Nolta complete primary abstract supports pump-rich spongiome separation;
    Gronlien complete primary abstract supports in-situ P. multimicronucleatum CVC
    electrical/functional experiments. Fok available abstract is truncated, Docampo
    selected body is secondary. No unseen primary Methods/pixels certified.
  target_ids:
