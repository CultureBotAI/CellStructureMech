  - septin-original-validation-spongiome
- assessment_id: septin-spongiome-identity
  area: identity
  topic: Exact identity, parents and neighboring boundaries
  outcome: supported
  summary: Exact GO0062160 denotes the tubulovesicular CVC subnetwork. CVC parthood
    and narrow decorated-spongiome synonym are supported; whole vacuole, complex and
    localized V-ATPase subset remain distinct.
  target_ids:
  - GO:0062160
  evidence_ids:
