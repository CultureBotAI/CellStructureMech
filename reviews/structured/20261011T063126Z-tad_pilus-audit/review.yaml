findings:
- finding_id: F1
  issue_key: tad-pilus-polar-retraction-scope
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Restrict polar retraction to the demonstrated Tad model
  description: The generic definition says a Tad pilus extends and retracts from a
    bacterial pole, while the cited studies establish those dynamics in Caulobacter
    and explicitly leave wider Tad behavior unresolved. The generic graph lacks an
    explicit model-scope note. Preserve the class identity without making the model
    behavior class-defining.
  target_ids:
