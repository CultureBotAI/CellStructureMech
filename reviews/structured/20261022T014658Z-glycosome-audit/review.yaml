  summary: Protein import and glycolytic enzyme compartmentation are supported, but
    the nearest2008 paper explicitly limits its glucose mechanism test. Accumulation
    after glucose addition is observed in one line; PGI truncation remains an alternative
    and another line lacked this response. Glycerol/GK rescue gives the stronger mechanistic
    evidence. The record should preserve those distinctions when attributing prevention
    of Glc6P accumulation to that study.
