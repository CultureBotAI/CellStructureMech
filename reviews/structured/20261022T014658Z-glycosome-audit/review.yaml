- assessment_id: composition
  area: grounding
  topic: Collective constituents and bounded inventory
  outcome: concern
  target_ids:
  - GO:0020015
  summary: The membrane boundary and enzyme/peroxin cohorts are biologically supported,
    but the whole membrane is incorrectly represented as a molecular LIPID constituent
    grounded to its assembled-structure GO term. Enzymes and peroxins span unrelated
    families, so no one exact family should replace either full cohort. Verified individual
    peroxin family candidates do not require splitting the established cohort in a
    read-only review. The membrane-residence edge description specifically selects
    PEX14; it does not assert that cytosolic PEX5/PEX7 reside permanently there.
  evidence_ids:
