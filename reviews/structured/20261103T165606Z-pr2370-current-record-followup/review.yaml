limitations:
- 'Mitochondrial intermembrane space, mitosome and mitosome envelope independent subreview:
  Read-only independent scientific review of three assigned records, all byte-unchanged
  from original frozen inputs. Root owns repository/GitHub writes, issue dedup/publication
  and global/final gates. No record or original artifact is edited; no later CI/queue
  result is pre-certified.'
- 'Mitochondrial intermembrane space, mitosome and mitosome envelope independent subreview:
  All6native protein commands passed. IMS/envelope have0examples and0typed molecular
  nodes; whole mitosome has0examples but2NO_GENE_SYMBOLS anchored generic machinery
  nodes. Empty or generic coverage is not complete molecular verification. No protein
  primary-name/accession/strain assertion is invented.'
- 'Mitochondrial intermembrane space, mitosome and mitosome envelope independent subreview:
  Fresh GO and UniProt locations establish exact anatomy, not a molecular lipid identity.
  Current GO mitosome definition is faithfully reproduced; it does not excuse the
  additional unqualified mitochondrial-type ISC functional assertion across included
  Entamoeba.'
- 'Mitochondrial intermembrane space, mitosome and mitosome envelope independent subreview:
  Dolezal genuine body scope is complete Methods sec1, Results sec2 and Discussion
  sec3 plus Fig1–5captions; no supplements or pixels. Giardia WB,Trichomonas T1 and
  yeast YPH499 assays differ; IscS halves and fusion sufficiency are heterologous
  hydrogenosome experiments. N-terminal and internal targeting coexist; localized
  Pam18 homologs do not prove an entire conserved functional translocase.'
- 'Mitochondrial intermembrane space, mitosome and mitosome envelope independent subreview:
  Goldberg genuine PDF main pp624–628/Fig1–4captions and appended Methods are read;
  no separate supplementary data or pixels. E.cuniculi strainII/T.hominis in RK-13
  cells are distinct from yeast W303-1A complementation using fungal presequences
  and E.coli expression. Several proteins complement, others do not; major cytosolic
  pools and minor-pool uncertainty remain.'
- 'Mitochondrial intermembrane space, mitosome and mitosome envelope independent subreview:
  Mi-ichi fresh PMC Results sec2–sec6,Discussion sec8 and Methods sec10/sec13 were
  read with captions; phylogeny sec7,remaining Methods,supplements and pixels not
  comprehensively inspected. Enriched partial proteome nondetection does not establish
  absent NIF or absent mitosomal Fe-S activity. Maralikova2010(first published2009)
  is complete primary abstract only and differs on localization while agreeing on
  NIF-versus-ISC replacement.'
- 'Mitochondrial intermembrane space, mitosome and mitosome envelope independent subreview:
  Tovar1999,Tovar2003,Williams2002 are exact complete primary abstracts only in this
  current review. Tovar2003/Williams abstracts explicitly report double membranes;
  Tovar1999 abstract does not establish the exact attributed membrane ultrastructure.
  Uninspected bodies/pixels are not claimed; unavailable inspection is not refutation.'
- 'Mitochondrial intermembrane space, mitosome and mitosome envelope independent subreview:
