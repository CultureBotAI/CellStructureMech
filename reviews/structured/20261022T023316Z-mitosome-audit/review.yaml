  summary: Component essentiality is UNKNOWN. Functional replacement, protein import
    or organism viability cannot be promoted to organelle-formation necessity; no
    unsupported ESSENTIAL label is present.
  evidence_ids:
  - mitosome-agent-dolezal2005-pmc
  - schema
- assessment_id: membership
  area: grounding
  topic: ISC and import modules
  outcome: supported
  target_ids:
  - GO:0032047
  summary: The label-only heterogeneous modules avoid inventing a single family identity.
    The ISC component itself correctly names Giardia and microsporidia; Dolezal supports
    import/localization, and Goldberg supports lineage-dependent localization and
    activity. Empty optional examples or symbols do not establish a curation defect.
  evidence_ids:
  - mitosome-agent-dolezal2005-pmc
  - mitosome-agent-goldberg2008-university
  - mitosome-agent-tovar2003-meta
  - record
- assessment_id: function
  area: scope
  topic: Lineage scope of mitochondrial-type ISC
  outcome: concern
  target_ids:
  - GO:0032047
  summary: The unqualified function description says mitosomes retain mitochondrial-type
    ISC machinery. That does not apply to the explicitly included Entamoeba lineage,
    which has the distinct NIF system. The current GO definition is faithfully transcribed,
    but cannot substitute for a source-supported qualifier in this added functional
    assertion. The finding does not assert the absence of all Fe-S maturation in Entamoeba.
  evidence_ids:
  - mitosome-agent-miichi2009-pmc
  - mitosome-agent-tsaousis2009-meta
  - mitosome-agent-goldberg2008-university
  - mitosome-agent-go
  - record
- assessment_id: graph
  area: graph
  topic: Giardia-centered import-to-ISC function graph
  outcome: supported
  target_ids:
  - GO:0032047
  summary: The canonical Giardia context supports the import-to-ISC pathway and double-envelope
    topology. Dolezal tested both signal classes; its note that N-terminal sequences
    were tested is true and does not assert exclusivity. Generic group actors do not
    encode a fully resolved universal translocase or a claim that every microsporidian
    ISC factor is intramitosomal.
  evidence_ids:
  - mitosome-agent-dolezal2005-pmc
  - mitosome-agent-tovar2003-meta
  - mitosome-agent-goldberg2008-university
  - mitosome-agent-SL0438
  - record
