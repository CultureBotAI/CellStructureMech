findings:
- finding_id: F1
  issue_key: mitosome-1
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Qualify the mitochondrial-type ISC function by lineage
  description: functions[0].description broadly states that mitosomes retain imported
    mitochondrial-type ISC machinery, while taxonomic_distribution includes Entamoeba
    histolytica. Primary evidence distinguishes its bacterial-type NIF replacement
    from mitochondrial ISC; reports disagree on NIF localization, not on that distinction.
    The component role already confines the ISC module to Giardia/microsporidia, and
    the canonical example provides a Giardia context for the graph. Carry that qualification
    into the function prose rather than assigning mitochondrial-type ISC to the entire
    organelle class.
  target_ids:
  - GO:0032047
  field_paths:
  - functions[0].description
  evidence_ids:
