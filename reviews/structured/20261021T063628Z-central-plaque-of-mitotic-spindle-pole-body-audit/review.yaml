limitations:
- The native GO0061493 definition still describes the inner plaque incorrectly; the
  local definition and boundary discussion intentionally rely on literature and the
  general central-plaque term.
- The record is not a complete constituent census; component-family curation remains
  open despite known proteins in the literature.
- Three principal plaques does not exclude the two intermediate layers described in
  the sources.
- Mitotic scope is not a claim that this layer is absent during other cell-cycle states;
  COMMON is not measured prevalence.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
