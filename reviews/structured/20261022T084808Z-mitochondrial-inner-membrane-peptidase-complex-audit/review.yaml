- Jan2000 was read at complete native MED abstract tier only; retained publisher/PDF
  routes returned client challenges. Gakh2002 was read at complete native abstract
  tier as a secondary review; DOI-returned Crossref metadata is not its body. No primary
  figure, supplement, detailed strain/construct or assay methods are certified.
- Optional Imp1/Imp2/Som1 enrichment is supported qualitatively, with Jan wording
  proposing Som1 as a third component. Exact taxon-neutral whole-class family mappings
  and universal formation necessity were not established. Native IMP1/IMP2 queries
  contain alias collisions, so no single-hit uniqueness is asserted.
- COMMON retains majority occurrence with exceptional losses; the cited model-system
  studies are not an exhaustive prevalence survey.
- Reused source bytes retain original URL, UTC and SHA256. HTTP status alone is not
  treated as evidence of article-body readability.
