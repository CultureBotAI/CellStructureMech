  standardizing taxon_label on NCBITaxon:284812 to ''Schizosaccharomyces pombe 972h-''
  on components[2] cdc45_protein protein_examples[0] UniProtKB:O74113 and canonical_examples[0]
  in cmg_complex.yaml, nuclear_replisome.yaml, and replisome.yaml) and #2476 (updating
  causal_graphs[0].nodes[8] dna_replication_origin_binding GO:0003688 from node_type:
  BIOLOGICAL_PROCESS to MOLECULAR_FUNCTION in origin_recognition_complex.yaml; adding
  grounding: GO:0016236 on functions[0] macroautophagy in autophagosome.yaml; and
  updating components[2].protein_examples[0].protein_label for UniProtKB:P0AEF0 dnaC
  to ''Replicative helicase loader DnaC'' plus adding top-level evidence entries for
  GO:0032993 parent_structures and GO:0030894 part_of in primosome_complex.yaml).
  All 10 records pass strict validation, ID-label correspondence, UniProt verification,
  offline CURIE cache check, history ledger validation, and page regeneration checks
