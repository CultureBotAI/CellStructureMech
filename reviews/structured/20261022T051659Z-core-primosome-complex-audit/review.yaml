  summary: Species562 and strain83333 names/ranks are correct. COMMON retains its
    schema meaning present in most members/losses exception; the conserved central
    replication pathway is supported by qualitative review synthesis, not a measured
    prevalence census. Canonical oriC and DnaG claims match the review and are not
    a new strain-specific experiment.
