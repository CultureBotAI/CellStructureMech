limitations:
- All five same-base batch26 corpus gates and exact target resolver rows are integrated
  with every manifested input hash verified.
- The2003 and1997 primary papers were available at complete-abstract/native-bibliography
  tier; publisher bodies returnedHTTP403. No full-text methods, figures, raw binding
  curves or coordinates were reanalysed.
- The2003 study uses manual docking of idealized DNA to interpret conformational coupling;1O7L
  is not a DNA-bound crystal structure. High-affinity enhancement applies to the canonical
  modA/modABCD response; moaA binding is largely molybdate independent.
- Source species, expression host and K-12 reference protein identity are distinct.
  The optional assembly mechanism and broader regulon remain outside this compact
  record.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
