  description: The unqualified K-antigen example makes a subgroup-specific route sound
    characteristic of the entire example class. Specify group2 capsules, for example
    K1/K5, or describe E.coli as a model for multiple export routes. The graph already
    acknowledges route diversity; no generic-graph defect is alleged.
  target_ids:
