    Table1 extracted text, pp53-55 group2/3 discussion and p57 ABC-export heading;
    bibliographic title/DOI match'
  summary: The prose distinguishes group1/4 from group2/3 systems. Group2 examples
    include K1 and K5 and use KpsMT; Table1 lists no ABC transporter for groups1/4.
