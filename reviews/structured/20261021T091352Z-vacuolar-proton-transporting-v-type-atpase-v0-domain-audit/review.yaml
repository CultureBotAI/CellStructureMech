  - v0-agent-kane2006-legacy-html
  - record
- assessment_id: function
  area: evidence
  topic: Function within assembled enzyme
  outcome: supported
  target_ids:
  - GO:0000220
  summary: The membrane-integral V0 sector provides the proton-translocation path
    when coupled to V1. The explicit intact-enzyme qualifier avoids implying that
    detached V0 is an open proton pore or an ATP-hydrolyzing autonomous pump.
  evidence_ids:
  - v0-agent-go
  - v0-agent-kane2006-legacy-html
  - record
- assessment_id: graph
  area: graph
  topic: Supported nonmechanistic topology and coupling
  outcome: supported
  target_ids:
  - GO:0000220
  summary: Part-of, embedded-in and proton-transport edges are source-supported sector-level
    relations. Direct Kane evidence is attached to the transport edge. The graph does
    not claim detailed proteolipid stoichiometry, autonomous pumping or an unobserved
    subunit-contact sequence.
  evidence_ids:
  - v0-agent-go
  - v0-agent-kane2006-legacy-html
  - record
- assessment_id: known-components
  area: completeness
  topic: Known members deferred solely for family grounding
  outcome: concern
  target_ids:
  - GO:0000220
  summary: The record has no component rows and explicitly says narrower family curation
    is needed before asserting subunit components. Kane already names a, c, c-prime,
    c-double-prime, d and e. Exact family CURIEs and copy numbers require their own
    checks, but the schema permits evidence-backed label-only constituents. Deferring
    every known member for this reason leaves a specific, resolvable composition gap.
  evidence_ids:
  - v0-agent-kane2006-legacy-html
  - v0-agent-go
  - record
  - policy
- assessment_id: assembly-boundaries
  area: scope
  topic: Composition does not prove assembly necessity
  outcome: supported
  target_ids:
  - GO:0000220
  summary: Source-supported constituent labels must not automatically receive ESSENTIAL.
    The schema asks whether the structure forms without the component. Kane distinguishes
    activity from assembly and reports an assembled inactive enzyme lacking H. Dedicated
    assembly factors are not final-sector constituents; freely dissociated sectors
    and whole-enzyme assembly are also separate scopes.
  evidence_ids:
  - v0-agent-kane2006-legacy-html
  - policy
  - record
- assessment_id: source-state
  area: provenance
  topic: Review-tier evidence and historical resolution
  outcome: supported
