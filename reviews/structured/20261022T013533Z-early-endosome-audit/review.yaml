    epimastigotes and supports a cytostome-to-vesiculotubular-network-to-reservosome
    route. Membrane and lumen occurrence follow from the described vesicles/tubules
    together with their exact compartment definitions. VARIABLE avoids a measured-prevalence
    assertion. Neither all life stages nor all microbial endosomes are assigned this
    specific route. The source proposes early-endosome identity using pH and uptake
    kinetics; no marker-based equivalence is independently established here.
  evidence_ids:
