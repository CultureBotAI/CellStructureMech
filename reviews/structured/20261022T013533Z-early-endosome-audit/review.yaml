limitations:
- Lipid-specific transit through this route remains unknown from the available abstract.
  General protein-cargo routing is supported; unavailable body text is neither positive
  confirmation nor a demonstrated contradiction.
- Porto-Carreiro2000 is abstract-only in this review. DOI resolution yielded redirect
  HTML, ScienceDirect returned403 and the public API returned a metadata stub. Exact
  source identity and the complete primary abstract were inspected; body, methods,
  figure pixels, strain and all detailed implementation claims were not independently
  verified.
- The primary authors propose early-endosome identity based on acidity and protein-uptake
  kinetics. This review does not add marker validation or convert the study into evidence
  for every generic sorting branch.
- Neighbors provide identity and boundary context only; their unrelated claims and
  protein examples are not independently reviewed.
- Optional molecular inventories remain incomplete. Collective bilayer constitution
  is not an experimental test of individual-lipid formation necessity.
- All five fresh-base corpus gates and exact target resolver rows are integrated here;
  old-base global results are not used. The filesystem interruption was an infrastructure
  event, not a record-review validation failure.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
