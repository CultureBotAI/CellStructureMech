  summary: Exact native authority labels, definitions and mappings support the target
    identity. The whole carrier is not equated with its lipid boundary or enclosed
    region. Membrane and lumen parentage are is_a while their placement in the organelle
    is part_of. The SL exact synonyms and xrefs agree with GO. The downstream reservosome
    remains a separate organelle, not an early-endosome subtype.
