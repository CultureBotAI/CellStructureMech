- evidence_id: gamma-ring-agent-samejima2010-jats
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC2989437.1/PMC2989437.1.xml
  locator: Results/Discussion Distinct Sequences within MASC and Mto1 eMTOC Localization,
    extracted paragraphs6–25; Fig1/3/4 context.
  accessed_at: '2026-10-21T07:55:16.105173Z'
  support: supports
  summary: Primary S. pombe Mto1 MASC truncation/point mutations separate iSPB, mitotic-SPB
    and equatorial targeting; Myp2 loss prevents detected equatorial Alp4 and PAA
    nucleation. Mto1-427 retains spindle-pole targeting but loses PAA. This study
    does not measure gamma-TuSC ring stoichiometry, handedness, seam architecture
    or allosteric ring closure.
  snapshot_sha256: 9337fd098562acbf278e8fa6b6fdb2bce9ed3f0ef1ed2bdd8cbe6d5f66e8edaa
- evidence_id: gamma-ring-agent-samejima2008-s3
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC2743986.1/PMC2743986.1.xml
  locator: Results CM1 interaction, Mto1-334, Fig2/4; Discussion cooperative binding,
    paragraphs14–34.
  accessed_at: '2026-10-21T09:28:41.557361Z'
  support: supports
  summary: Mto1 CM1 mutants lose gamma-complex association while retaining localization.
    Mto1-334 and mto2 deletion retain restricted SPB and very limited equatorial nucleation;
    faint Alp4 and weak biochemical association require sensitivity-qualified wording.
    The endpoints are recruitment/nucleation, not a directly measured complete TuRC
    assembly in the absence of the entire Mto1-Mto2 cohort.
  snapshot_sha256: c495ac9e59ed63f5e88cc383575e83cfa34a9b0a3ffab09e30031f0520748075
- evidence_id: gamma-ring-agent-venkatram2005-html
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC1142446/?pdf=render
  locator: Title/authors; Results PAA formation Fig3, localization Fig4, coimmunoprecipitation
    Fig8/9; Discussion Model for mto2p Function and Microtubule Nucleation, paragraphs53–56,63,79–99.
  accessed_at: '2026-10-21T09:29:00.320286Z'
  support: supports
  summary: Despite this retrieval key, the source is Samejima et al.2005 DOI E04-11-1003,
    Fission Yeast mto2p Regulates Microtubule Nucleation by the Centrosomin-related
    Protein mto1p. It studies Mto2 localization, Mto1 binding, residual/unstable PAAs
    and gamma-complex recruitment. It does not characterize Mod21/GCP5 with Gfh1/Alp16
    as a 14-spoke asymmetric seam. Discussion explicitly labels a possible allosteric
    role speculative.
  snapshot_sha256: 1d7210592b0c3ee01cfc96fef86877847d98d965849c77fa9d71dc7862415693
- evidence_id: gamma-ring-agent-jaarsma2005-html
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC1142447/?pdf=render
  locator: Results cold recovery and Mto1/Mto2 localization; CAR anchoring experiments
    Fig6/7; Discussion paragraphs81–90.
  accessed_at: '2026-10-21T09:29:00.363264Z'
  support: context_only
  summary: The source is Venkatram et al.2005 DOI E04-12-1043, a distinct Mto2 study.
    It reports strong eMTOC/PAA defects and CAR maintenance defects during cps1 arrest
    or low-dose LatA delay, while cytokinesis checkpoint arrest persists. These preparation/detection
    contexts must not erase the residual activity seen by Samejima. Mto2 association
    with gamma-complex was not detected in this preparation.
  snapshot_sha256: 2ea12818a771747b3b1469aa3314f326ee46593214993bbbd0f1096ecf08c595
- evidence_id: gamma-ring-agent-anders2006-html
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC1679674/?pdf=render
  locator: Introduction18–20; Results Mod21 identification and Fig2, association dependencies
    Fig10/11, sucrose gradients Fig12; Discussion104–118.
  accessed_at: '2026-10-21T09:29:00.350438Z'
  support: supports
  summary: Anders2006, the GO-linked primary source, directly identifies Mod21 as
    a gamma-complex component, maps Gfh1/Mod21/Alp16 to GCP4/5/6 and tests physical
    association and deletion phenotypes. It finds largely preserved qualitative nucleation
    with reduced interphase efficiency after loss of noncore proteins. Gradient and
    immunoprecipitation results leave the exact physical native large complex uncertain;
    no 14-spoke seam reconstruction is provided.
  snapshot_sha256: 87dbab897d5acf9eab2c7387afa7a0e29958604310990f28ae2b44eb21b64d4a
- evidence_id: gamma-ring-agent-lynch2014-s3
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC3989768.1/PMC3989768.1.xml
  locator: Results minimal bonsai, gamma-TuRC-specific proteins and stoichiometry
    paragraphs8–19; Conclusions26–27; Fig1/2/3.
  accessed_at: '2026-10-21T09:28:41.792491Z'
  support: supports
  summary: Primary minimal Mto1/2-bonsai experiments distinguish activation from targeting.
    Single nucleating puncta contain measured averages of roughly13 Mto1/Mto2 and8.5/8.4
    Alp4/Alp6; the inferred architecture is gamma-TuRC-like. Alp16 deletion has little
    effect on bonsai nucleation. The Conclusions state conformational activation awaits
    confirmation and the Mto1 CM1-alone mechanism was not resolved. This supports
    nucleation activation/multimerization, not an experimentally settled Mto1 allosteric
    ring-closure claim.
  snapshot_sha256: c79f01751fe2552986d4dc8ff9523ebf86ad6349f546520563c06c3bf32a323b
- evidence_id: gamma-ring-agent-brilot2021-s3
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC8099430.1/PMC8099430.1.xml
  locator: Introduction5–11; Results NCC and CM1 binding, paragraphs20–22,36–42; Fig2–4.
  accessed_at: '2026-10-21T09:28:41.928074Z'
  support: supports
  summary: The primary study determines S. cerevisiae structures. Its Introduction
    provides cited background distinguishing yeast seven-TuSC helical assemblies from
    metazoan14-position rings with GCP4/5/6 pseudo-TuSCs; that metazoan comparison
    is not a direct experiment of this paper. Direct structural Results resolve budding-yeast
    Spc110 contacts across the inter-TuSC interface. These findings cannot be silently
    assigned to native S. pombe Gfh1/Mod21/Alp16 under a 2005 Mto2 citation.
  snapshot_sha256: 7937671cd050caa340f7deb2cf8aa17f286a7aa1039b78d93d39bd6eb09aebc0
- evidence_id: gamma-ring-agent-bellingham2023-jats
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC10047812.1/PMC10047812.1.xml
  locator: Results2.1 paragraphs11–13 and2.2 paragraph15; Discussion30–32; Methods
    strain construction38–39 and timing46.
  accessed_at: '2026-10-21T07:55:16.094019Z'
  support: supports
  summary: Live-cell timing supports Myp2 arrival followed by Mto1 and PAA microtubules
    at the equator. Spatial/intensity experiments suggest recruitment without a simple
    direct Myp2-Mto1 complex. The paper measures PAA organization and cytokinetic
    mechanics, not gamma-TuRC subunit geometry or assembly.
  snapshot_sha256: 519b1918af37108acb4ae400b29e82b597cdc3e21480263bbf1041f17bf96521
- evidence_id: gamma-ring-agent-samejima2018-s3
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC7263743.1/PMC7263743.1.xml
  locator: Abstract; Introduction7–9; Results bonsai assay16, artificial targeting25,
    Alp7 experiments33–37.
  accessed_at: '2026-10-21T09:28:41.557254Z'
  support: context_only
  summary: The source is Flor-Parra et al.2018 The XMAP215 Ortholog Alp14 Promotes
    Microtubule Nucleation in Fission Yeast. It links Alp14/Alp7 to nucleation, using
    interphase Mto1-bonsai puncta and artificial targeting. These data distinguish
    polymerization from nucleation but do not resolve a 14-spoke seam or Mto1 allostery.
  snapshot_sha256: 5c6000e8b847fcdedb2b6d328d7a87e026432a1cb816daf6c5461f8cde76c9aa
