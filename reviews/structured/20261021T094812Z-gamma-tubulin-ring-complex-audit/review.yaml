limitations:
- Primary JATS attempts for four cited bodies returned500; S3 recovered Samejima2008
  and Flor-Parra2018, while PMC HTML recovered both2005 studies and Anders2006. Each
  retained response has its own raw/meta; failed routes are not evidence of global
  unreadability.
- The broad unquoted DOI query epmc-retry returned irrelevant hits because of parentheses;
  only epmc-exact with seven exact DOI matches is cited. GO-linked PMID12134075/11297925
  identities were independently retrieved; attempted Fujita2002 and Kollman2015 HTML
  bodies were challenge pages and are not claimed as read primary text.
- Zimmerman2004 is credited only at the native bibliographic/abstract tier. Its prior
  publisher receipt and additional Mzt1 paper are retained as leads but not represented
  as inspected full-body evidence.
- 'The exact structural state of native fission-yeast complexes remains a bounded
  uncertainty: older gradient/coassociation and newer bonsai nucleation estimates
  do not equal a resolved14-spoke native ring. No entire-class assembly-essentiality
  conclusion is inferred from these endpoints.'
- The exact target resolver slice is derived from the completed fresh-base run. Any
  PMID transport failures were checked against the separately cited native literature
  metadata; these identity checks do not establish full-body scientific support.
- No original microscopy pixels, movies, deposited structural coordinates or supplementary
  datasets were independently reanalyzed. Claim-bearing body prose, indicated methods
