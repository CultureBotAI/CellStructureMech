  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC3771951/?pdf=render
  locator: Results Fig1C/D, Mzt1 is not required for formation of the core gamma-TuC,
    Fig8; Discussion and Fig10 model; text32,59–60,66,70–74.
  accessed_at: '2026-10-21T09:30:32.290910Z'
  support: supports
