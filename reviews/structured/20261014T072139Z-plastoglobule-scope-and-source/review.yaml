limitations:
- Same-agent review, not independent human approval, exhaustive literature discovery
  or experimental replication.
- Austin main structural Results, related Discussion, abstract, Plant Material Methods
  and captions were read from hash-verified PMC HTML retained with its original access
  time. Figure pixels, raw tomograms and supplements were not independently reanalyzed.
- Engel Starch structures and plastoglobules, Figure 4 caption, Cell culture/Cryo-FIB/Cryo-ET
  Methods and relevant architectural context were read in native JATS. No new pixel-based
  inference was made. The authors' explicit resolution limitation is preserved.
- Rottet institutional full PDF was recovered after publisher access failed. Composition/topology
  and transport discussion, differentiation/stress context and Conclusion were inspected;
  pages 2-3 including Figure 1/Table 1 were also visually checked. No full audit of
  every cited primary experiment or protein-family assignment was performed.
- Optional protein inventory, images, geometry, datasets and traits were not populated.
  An unfilled optional field alone is not a finding.
- 'Global gates reused only after unchanged protected roots, captured guidance/record
  inputs and log hashes. Original counts/skips retained: 1729 histories; labels 3545
  canonical/50 synonym/6 exceptions/603 no-adapter; CURIE 4023 OK/251 skips/0 unresolved;
  exact-main QC 987 passed/3 skipped.'
- No snippets among 16 citations. Pre-save archive/contract baseline covers 221 existing
  bundles. Fresh checks of the newly saved observation are recorded separately; future
  success is not claimed here.
- No prior canonical or legacy target review was found in the named hidden/ignored-inclusive
  searches. Historical issue numbers in curation history are not fabricated predecessors
  for these new findings.
- No scientific YAML, history, images, generated products, GitHub issues/PRs or scientific
