  snapshot_sha256: a24c8f85014097148d9e865ea324b01b8d04f6bae27e893834f8abb5bd8b6a1f
- evidence_id: austin
  kind: primary_source
  reference: DOI:10.1105/tpc.105.039859
  locator: PMC1488921 abstract; Results on blistering and permanent coupling; Discussion;
    Plant Material Methods; relevant figure captions
  accessed_at: '2026-10-14T06:54:32Z'
  support: supports
  summary: Electron tomography and freeze-fracture support monolayer continuity in
    sampled Arabidopsis, tobacco and spinach chloroplasts. The study is not an algal
    continuity experiment. It also supports carotenoids in the core, but that does
    not make carotenoids part of the GO definition.
  snapshot_sha256: 6ab21ed5fdb35ebc2eeee582f97da282f6b03c12660129d079525915f3ea0249
- evidence_id: engel
  kind: primary_source
  reference: DOI:10.7554/eLife.04889
  locator: 'PMC4292175.1 Results: Starch structures and plastoglobules; Figure 4 caption;
    Cell culture/Cryo-FIB/Cryo-ET Methods'
  accessed_at: '2026-10-14T07:16:26Z'
  support: supports
  summary: CC-124 algal plastoglobules occur beside thylakoids, often flat sheets.
    Authors contrast apparent discontinuity and occasional punctate contacts with
    higher-plant continuity, while explicitly limiting inference because CCD data
    do not resolve bilayer leaflets. Their 20 globules from nine tomograms support
    occurrence, not proven universal continuity or a complete algal lipidome.
  snapshot_sha256: 16b5f264ce209350b41d8797dc53e59d7e3d2b1b8f14ca35ca21c0752e7bcb4e
- evidence_id: rottet
  kind: primary_source
  reference: DOI:10.1016/j.bbabio.2015.02.002
  locator: University of Neuchatel full PDF, pages 1-3, Figure 1, sections 2.1/2.3/3.1
    and Conclusion on pages 7-8
  accessed_at: '2026-10-14T07:17:19Z'
  support: supports
  summary: This review supports mixed neutral-lipid cores, monolayers and participation
    in lipid remodeling. Figure 1 and section 2.1 frame contact-site transport as
    a proposed conduit; Conclusion lists indirect evidence and leaves the transport
    mechanism unresolved. It is synthesis, not a direct flux measurement.
  snapshot_sha256: 33e047a275209ef415a672a2483c0aaf20caa1a978a4b52bb4b05b5319c7872e
