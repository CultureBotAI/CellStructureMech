findings:
- finding_id: plaque-t0-F1
  issue_key: early-phagosome-source-scope
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Expanded Rab and maturation definition is not supported at its stated scope
  description: Only the first definition sentence is supplied by GO0032009. The added
    Rab5/Rab7 and V-ATPase-before-lysosome-fusion sequence is presented as defining
    early phagosomes across named amoebae. Gotthardt2002 directly tracks early Rab7/Vti1
    and V-ATPase, while documenting early lysosomal cargo delivery; Gotthardt2006
    adds model-specific proteomic dynamics, not a universal Rab5/Rab7 or pre-lysosomal-fusion
    boundary. The claim requires narrower stage/taxon wording and its own mechanistic
    evidence. The review does not infer that Rab5 is absent from all early phagosomes.
  target_ids:
  - GO:0032009
