assessments:
- assessment_id: identity
  area: identity
  topic: Permanent compartment without forced genetic-integration equivalence
  outcome: supported
  target_ids:
  - cellstructuremech:diazoplast
  summary: The definition, broad intracellular-organelle parent and related spheroid-body
    synonym match the inspected source usage. The structural parent does not require
    demonstrated host-protein import. Frail distinguishes the Epithemia diazoplast
    from the independently evolved UCYN-A nitroplast; the local records preserve that
    boundary. The current zero-hit GO query and unique local identifier justify retaining
    the minted identity without claiming exhaustive historical ontology absence.
  evidence_ids:
  - record
  - diazoplast-agent-go
  - diazoplast-agent-go-search
  - local-identities
  - nitroplast-context
  - diazoplast-agent-moulin2024-jats
  - diazoplast-agent-frail2025-jats
- assessment_id: scope
  area: scope
  topic: Genus distribution versus the measured isolate
  outcome: supported
  target_ids:
  - cellstructuremech:diazoplast
  summary: The genus-level occurrence statement follows Frail Introduction, which
    explicitly says all described Epithemia species. It is not a measured frequency
    or a claim of genus-wide day/night physiology. Moulin and its SI support the Butano-area
    E. clementina isolate and nonaxenic cultures; the exact ENA name includes nom.
    ined. Frail later generated axenic cultures, which is a separate study context.
  evidence_ids:
  - record
  - diazoplast-agent-moulin2024-jats
  - diazoplast-agent-frail2025-jats
  - diazoplast-agent-moulin2024-supp-retry1
  - diazoplast-agent-frail2025-supp-retry1
  - diazoplast-agent-tax420972
  - diazoplast-agent-tax3042617
- assessment_id: composition
  area: grounding
  topic: Membranes, nitrogenase and HupL evidence
  outcome: supported
  target_ids:
  - cellstructuremech:diazoplast
  summary: Retained internal membranes and boundaries are supported by Moulin Results/Fig4
    caption; no photosynthetic role is assigned. The intact nif cluster, NifDK blot
    and nitrogenase activity support the nitrogenase component with nifH/nifD/nifK
    metadata and GO0016610 identity. HupL is detected by immunoblot and assigned its
    known uptake-hydrogenase role with explicit lack of in-situ or hydrogen-flux validation.
    Broad nickel-hydrogenase family terms do not exactly isolate the uptake-specific
    component, so the acknowledged label-only grounding remains defensible.
  evidence_ids:
  - record
  - diazoplast-agent-go
  - diazoplast-agent-moulin2024-jats
  - diazoplast-agent-moulin2024-supp-retry1
  - diazoplast-agent-family-IPR001501
  - diazoplast-agent-family-IPR050867
  - diazoplast-agent-query-hupL
- assessment_id: necessity
  area: grounding
  topic: Component formation requirements
  outcome: unknown
  target_ids:
  - cellstructuremech:diazoplast
  summary: All three component rows retain UNKNOWN. Detection, enzymatic activity
    and retained membranes establish composition/function context but do not test
    whether the diazoplast compartment forms without a component. Neither molecular
    necessity nor stoichiometric completeness is inferred.
  evidence_ids:
  - record
  - schema-protein-example
  - diazoplast-agent-go
  - diazoplast-agent-moulin2024-jats
  - diazoplast-agent-frail2025-jats
- assessment_id: protein-identities
  area: grounding
  topic: Correct accession identities and limited cross-taxon examples
  outcome: supported
  target_ids:
  - cellstructuremech:diazoplast
  summary: All three accession/name/gene/taxon/status tuples match native entries;
    the two single-reviewed-entry claims are reproduced. C1DK95 correctly records
    primary anfH with nifH as a native synonym. These facts do not demonstrate that
    the three proteins form one native assembly or that any is an Epithemia instance;
    no wrong-accession, wrong-gene or wrong-taxon finding is made.
  evidence_ids:
  - record
  - diazoplast-agent-protein-C1DK95
  - diazoplast-agent-protein-P07328
  - diazoplast-agent-protein-P07329
  - diazoplast-agent-query-nifD
  - diazoplast-agent-query-nifK
  - diazoplast-agent-tax322710
  - diazoplast-agent-tax354
- assessment_id: protein-placement
  area: grounding
  topic: Identity-only examples conflict with the structure-specific field contract
  outcome: concern
  target_ids:
  - cellstructuremech:diazoplast
  summary: The schema describes ProteinExample as an organism-specific instance where
    its role in the structure was established. Here all three examples are explicitly
    identity-only Azotobacter entries, while the structure and membership sources
    concern Epithemia diazoplasts. Their disclaimers correctly prevent a false membership
    inference but do not supply the link required by this field. This is a bounded
    placement/provenance defect; valid nitrogenase family identity and membership
    remain supported.
  evidence_ids:
  - record
  - schema-protein-example
  - diazoplast-agent-moulin2024-jats
  - diazoplast-agent-frail2025-jats
  - diazoplast-agent-protein-C1DK95
  - diazoplast-agent-protein-P07328
  - diazoplast-agent-protein-P07329
  - diazoplast-agent-tax322710
  - diazoplast-agent-tax354
- assessment_id: function
  area: evidence
  topic: Nitrogen fixation and host nitrogen supply
  outcome: supported
  target_ids:
  - cellstructuremech:diazoplast
  summary: Moulin sec7 isotope data and sec8 ARA support fixation and host nitrogen
    supply at the measured compartment/culture scope. The record correctly avoids
    naming an exported chemical species. Carbon fixation timing is distinguished by
    IRMS from fixation/wash losses in NanoSIMS; underlying isotope measurements are
    not independently recomputed.
  evidence_ids:
  - record
  - diazoplast-agent-go
  - diazoplast-agent-moulin2024-jats
  - diazoplast-agent-moulin2024-supp-retry1
  - diazoplast-agent-moulin2024-fig2-retry1
- assessment_id: graph
  area: graph
  topic: Seven scoped process-level causal edges
  outcome: supported
  target_ids:
  - cellstructuremech:diazoplast
  summary: The seven edges preserve nitrogenase catalysis, compartment activity, fixed-nitrogen
    supply, host photosynthetic carbon production, carbon transfer, photosynthetic
    support and perturbation-induced reduction. The causal support comes from isotope
    experiments and daytime darkness/DCMU perturbation, so MECHANISTIC is defensible
    at the explicitly stated physiological process level. About60% reduction follows
    Results rather than the stronger abstract wording. The graph does not identify
    transporters/metabolites, prove respiration-mediated oxygen protection or specify
    division/import machinery. Its nitrogenase component_ref is valid; the separate
    protein-example placement issue does not negate the enzyme membership.
  evidence_ids:
  - record
  - diazoplast-agent-go
  - diazoplast-agent-moulin2024-jats
  - diazoplast-agent-moulin2024-supp-retry1
  - diazoplast-agent-moulin2024-fig2-retry1
- assessment_id: candidate-boundaries
  area: evidence
  topic: Unvalidated host import and metabolic hypotheses remain separate
  outcome: supported
  target_ids:
  - cellstructuremech:diazoplast
  summary: Frail Results s5–7 and Discussion support keeping six enriched proteins
    as candidates, TusA undetected and PFK import unsupported. Molecular division/transport
    proposals remain hypotheses, and the open discussions do not claim experiments
    that were not done. Moulin supports E. clementina day/night behavior while explicitly
    contrasting other species. No universal glycogen absence or identified sugar transporter
    is inferred.
  evidence_ids:
  - record
  - diazoplast-agent-frail2025-jats
  - diazoplast-agent-moulin2024-jats
  - diazoplast-agent-frail2025-supp-retry1
- assessment_id: image
  area: evidence
  topic: Native figure, complete panel scope and exact licence
  outcome: supported
