- evidence_id: diazoplast-agent-moulin2024-jats
  kind: primary_source
  reference: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11070190/fullTextXML
  locator: 'Complete scientific main text: Introduction sec3; main Methods sec4; Results
    sec5–10 including Fig1–4 captions; Discussion sec11 and its subsections. Front
    permissions inspected. Only Fig2 pixels were independently viewed; other figure
    pixels and underlying measurements were not reanalyzed.'
  accessed_at: '2026-10-22T00:59:30.089428Z'
  support: supports
  summary: The primary study isolates monoalgal nonaxenic E. clementina, identifies
    its diazoplast nif cluster and analyzes isotope exchange, nitrogenase activity
    and NifDK/HupL immunoblots. Results sec7/Fig2 support fixed nitrogen transfer
    to host and host-carbon transfer to diazoplast; sample washing limits temporal
    interpretation. Sec8/Fig3 reports about60% reduction during daytime darkness or
    DCMU, rather than complete abolition. Sec9/10 and Discussion distinguish observed
    retained thylakoids and glycogen patterns from proposed carbohydrate/respiratory
    mechanisms. Discussion explicitly leaves transporter identity, transferred compounds
    and the organelle boundary unresolved.
  snapshot_sha256: 21bad599e16c8a6a0515a21d346a8a31b37a343a82b11d1fed420fe6d45d94c1
- evidence_id: diazoplast-agent-frail2025-jats
