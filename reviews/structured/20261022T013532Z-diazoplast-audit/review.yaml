limitations:
- Both primary scientific main texts were read; supplementary scope is limited to
  the explicitly named methods. Only the maintained Fig2 pixels were independently
  viewed. Raw proteomics, genomic data, supplemental figures/tables and Fig1/3/4 pixels
  were not independently reanalyzed.
- The Azotobacter identities do not establish diazoplast instances or one native metal-specific
  assembly. The anfH primary/nifH synonym bridge is exact but insufficient to assert
  alternative-versus-Mo nitrogenase specificity in Epithemia.
- The native HupL query is restricted to the first five reviewed hits. Broad family
  coverage is verified, but no exhaustive search for an uptake-specific equivalog
  is claimed; IPR050867 unreviewed LLM prose is not used as functional evidence.
- GO search is an exact current bounded query; historical ontology searches and neighboring
  nitroplast claims are not recertified.
- Frail enriched candidates remain unvalidated localization/import candidates; absence
  of detected TusA or PFK import is limited to the reported assays.
- All five fresh-base corpus gates and exact target resolver rows are integrated here.
  Original source receipts are preserved across the infrastructure pause; interrupted
  new downloads were not used as evidence.
