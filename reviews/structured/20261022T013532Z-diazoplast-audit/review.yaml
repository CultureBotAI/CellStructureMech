  reference: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12377750/fullTextXML
  locator: 'Complete scientific main text: six introductory paragraphs; Results s1/s2–s7
    including Tables1 and Fig1–4 captions; Discussion s8; Materials and Methods s9.
    Front bibliography and permissions read. No final-paper image pixels or underlying
    proteomics/genome data were independently reanalyzed.'
  accessed_at: '2026-10-22T00:59:30.089399Z'
  support: supports
  summary: The final primary paper identifies diazoplasts as permanent Epithemia compartments
    and distinguishes their independent origin from UCYN-A. Introduction states presence
    in all described Epithemia species without uniform physiology. Results s5–7 identify
    nonfunctional nuclear transfers, six enriched host-protein candidates without
    localization validation, undetected TusA and no support for host PFK import. Discussion
    preserves alternative organelle definitions and hypothetical host-membrane division/transport
    models. This is the final2025 paper, not the differently titled preprint.
  snapshot_sha256: 97fd9edcd3015622b26a8a7e1cb0035382556daf5f88a93ab6cb6e433eb6d6db
