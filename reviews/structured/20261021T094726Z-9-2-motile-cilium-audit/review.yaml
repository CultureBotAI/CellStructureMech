limitations:
- 'Silflow2001 body was not recovered: original PMC PDF-only HTML, current PMC challenge
  HTML, exact PDF2001817 challenge and EuropePMC PDF403 are retained. It is not treated
  as a primary paper or as proof of rod membership.'
- Nicastro support comes from a serialized browser rendering of an author-uploaded
  manuscript and SOM, with original source times/hashes. This is neither a native
  HTTP200 PDF nor an analysis of every item on the2494-line host page.
- Rosenbaum2002 is a review read only at publisher Key Points/Abstract. Sloboda2007
  Wiley body returned403; Lucker2005 has native bibliographic/annotation support but
  the attempted unverified JBC candidate route returned403 and is not claimed to be
  the verified article body.
- Pazour membrane+matrix fractionation and candidate proteomics do not independently
  prove necessity of the membrane for assembly. Other canonical-component ESSENTIAL
  labels retain an unknown independent assembly-necessity evidence assessment rather
  than a redefinition of the enum.
- The exact target resolver slice is derived from the completed fresh-base run. Any
  PMID transport failures were checked against the separately cited native literature
  metadata; these identity checks do not establish full-body scientific support.
- No raw microscopy pixels, original movies, supplementary datasets or unpublished
  data were independently reanalyzed. Figure captions and relevant body/methods prose
  were read at the listed locators. The target has no image asset or quantitative
  measurement assertion.
- All 14 frozen repository inputs retain their inspected hashes. No neighboring local
  structure record, expression-module source or iModulonDB claim is used; no optional-empty
  finding is made.
- 'Shared corpus gates have bounded coverage: 617 label checks had no adapter; the
  identifier command reported 252 SKIPPED, 821 UNREACHABLE. These totals are not target-specific
  biological findings or proof that all corpus identifiers resolve.'
