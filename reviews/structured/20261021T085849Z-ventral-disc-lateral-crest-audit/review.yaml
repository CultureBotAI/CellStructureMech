assessments:
- assessment_id: identity
  area: identity
  topic: Exact fibrillar edge structure
  outcome: supported
  target_ids:
  - GO:0097591
  summary: Identifier, definition, OTHER kind and cytoskeleton category denote the
    lateral crest, distinct from the main disc microtubules, lateral shield, marginal
    plate and a protein cohort. The native definition supports the named structure
    rather than a generic membrane margin.
  evidence_ids:
  - crest-agent-go
  - crest-agent-hagen2011-jats
  - crest-agent-schwartz2012-jats
  - record
- assessment_id: partonomy
  area: scope
  topic: Disc parthood and edge relation
  outcome: supported
  target_ids:
  - GO:0097591
  summary: The sole part_of relation is directly supported by the native parent children
    list. The structure surrounds the disc edge; this does not establish that every
    nearby peripheral density or protein belongs exclusively to the crest.
  evidence_ids:
  - crest-agent-go
  - crest-agent-hagen2011-jats
  - crest-agent-schwartz2012-jats
  - record
- assessment_id: cohort
  area: evidence
  topic: Direct localization and broad constituent claim
  outcome: supported
  target_ids:
  - GO:0097591
  summary: The component is a broad crest-associated protein cohort, not an enumerated
    claim that all ten perimeter DAPs have equal ultrastructural localization evidence.
    DAP13981 is directly localized to the crest and most other assignments are presumptive
    at disc-edge resolution. The component role is interpreted as structural membership/contribution,
    not an experimentally proved assembly requirement or exclusive fibril inventory;
    UNKNOWN essentiality is appropriate.
  evidence_ids:
  - crest-agent-hagen2011-jats
  - record
- assessment_id: grounding
  area: grounding
  topic: Mixed protein classes and unresolved substructure
  outcome: supported
  target_ids:
  - GO:0097591
  summary: The paper describes seven ankyrin-repeat proteins, two Nek/ankyrin proteins
    and one novel protein without a conserved domain. These domain categories do not
    supply one exact family identity for the entire existing cohort. Retaining a label-only
    cohort and an actionable finer-boundary TODO is justified. Historical unverified-family
    notes are not read as a current claim that no individual protein can be identified.
  evidence_ids:
  - crest-agent-hagen2011-jats
  - record
  - policy
- assessment_id: taxon
  area: scope
  topic: Canonical species and characterized culture
  outcome: supported
  target_ids:
  - GO:0097591
  summary: Giardia intestinalis is a valid native synonym of species5741. The experiment
    uses WBC6/ATCC50803 trophozoites, maintained at37C. COMMON is a qualitative statement
    about the characterized species, not numerical prevalence or occurrence in all
    Giardia species, strains or cysts.
  evidence_ids:
  - crest-agent-tax-5741
  - crest-agent-hagen2011-jats
  - record
- assessment_id: function-graph
  area: graph
  topic: Bounded scaffold function and two architectural edges
  outcome: supported
  target_ids:
  - GO:0097591
  summary: The scaffold function and surrounds/is-part-of edges restate supported
    architecture. FUNCTION/NONMECHANISTIC explicitly records a structural role without
    an assembly sequence, force-generating pathway, active kinase mechanism, actin-mediated
    contraction or host-attachment sufficiency. No protein-localization node is presented
    as a causal step.
  evidence_ids:
  - crest-agent-go
  - crest-agent-hagen2011-jats
  - crest-agent-schwartz2012-jats
  - record
- assessment_id: methods
  area: scope
  topic: Preparation and inference boundaries
  outcome: supported
  target_ids:
  - GO:0097591
  summary: Proteomics used detergent-extracted disc/flagellar cytoskeletons, then
    GFP localization in trophozoites and targeted immunogold confirmed placement.
    Whole-preparation detection alone was not accepted as crest membership. FRAP measures
    turnover of representative tagged proteins; the record does not generalize that
    result to every constituent or prove rigidity.
  evidence_ids:
  - crest-agent-hagen2011-jats
  - record
- assessment_id: completeness
