findings: []
actions: []
limitations:
- Most perimeter DAP assignments in Hagen2011 are presumptive at the lateral-crest/disc-edge
  boundary; DAP13981 has direct anti-GFP immunogold/negative-stain localization. The
  review does not generalize its precise localization or FRAP behavior to all ten
  DAPs.
- The paper supports a structural-cohort interpretation; complete fiber composition,
  constituent necessity, direct molecular interactions and a contraction/attachment
  mechanism remain unresolved.
- Main Methods and the specified Results/Discussion/Table1/captions were read. Figure
