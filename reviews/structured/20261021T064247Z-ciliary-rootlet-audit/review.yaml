- finding_id: F1
  issue_key: ciliary-rootlet-definition-lineage-property-scope
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Definition generalizes lineage-specific rootlet geometry to microbial examples
  description: The broad record includes Paramecium striated rootlets yet defines
    a nucleus-directed rootlet with typical55–70nm cross-striae. Its cited Nabi2019
    source explicitly places the Paramecium SR anteriorly along the cortex and reports24–36nm
    control striations; cited algal work reports28nm. The GO wording is faithfully
    copied but derives from vertebrate/rootletin context. The subtype TODO acknowledges
    diversity without qualifying these affirmative properties.
  target_ids:
