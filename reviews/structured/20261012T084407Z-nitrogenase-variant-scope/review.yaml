- finding_id: F1
  issue_key: nitrogenase-generic-dinitrogenase-stoichiometry
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Do not universalize tetrameric dinitrogenase across nitrogenase variants
  description: The generic record expressly includes Mo-, V- and Fe-only forms, but
    definition, component role and two graph descriptions call the complete catalytic
    component tetrameric. Inspected primary structures include additional G subunits
    in alternative catalytic components. GO currently has the same older wording,
    so this is an authority-versus-primary-evidence conflict, not an incorrect transcription
    of GO. Retain the generic identity; scope the Mo tetramer example and qualify
    variant-dependent composition.
