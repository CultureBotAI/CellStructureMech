limitations:
- Same-agent review, not independent human sign-off or an exhaustive literature/retraction
  survey.
- Schindelin1997 was inspected as complete abstract plus deposited source-native structure
  metadata, not its full article body or raw diffraction data.
- Sippel2017 main article text, methods and captions were read; figure pixels, supplementary
  files and raw data were not inspected. Schmidt2024 abstract/Main, relevant Results
  and selected Methods were inspected, not every supplementary item, statistics table
  or raw cryo-EM map. Structural examples are not an exhaustive variant survey.
- C1DK95 is an unreviewed UniProt entry. The finding concerns observed authority coverage
  corroborated by InterPro and PDB, not a new experimental family assignment or proof
  that an exact generic-complex CURIE exists.
- Initial public-source and adapter reads encountered sandbox DNS failure; approved
  read-only retries succeeded. Browser PMC/Nature opens were unavailable, but the
  two comparator bodies were obtained from Europe PMC XML and read directly.
- Fresh target checks; wider checks are checksum-verified reuse with original caches/skips.
  No fresh GitHub CI, issue creation, PR, merge or publication. Existing publication
  approval remains unanswered.
- This issue-only observation does not mutate native records, products, mapping status,
  append-only history or earlier reviews.
