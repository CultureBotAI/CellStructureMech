  - primary-2024
  summary: Species evidence is not all-fungi prevalence. BY4741/BY4742, S288C and
    W303 assay backgrounds are distinguished from reference-sequence examples. Hosted
    Figure 3 supplement 1 has mixed modalities and CC BY 4.0; no universal size, polymer
    number or maturation time is asserted.
