  - primary-2013
  - primary-2024
  summary: Local identity and OTHER kind correctly denote a multi-filament bundle
    rather than a single microtubule. Parallel nuclear S. cerevisiae array is distinct
    from the antiparallel cytoplasmic fission-yeast bundle. Nucleus/cytoskeleton parthood
    and nuclear-microtubule constituents are supported; SPB, chromosome and nucleolus
    are not asserted as bundle parts.
