  summary: Every component and protein exemplar checked. Tub1/Tub3 composition and
    Tub1-only rescue preserve isotype versus total-tubulin effects. Stu2/Bik1 ends
    and internal tips, Bim1 along bundle, Kar3-3GFP puncta, faint Cin8 versus distal
    Kip1, Bir1/Sli15 and Slk19 localization are bounded. The 2013 negative versus
    2024 positive Kar3 observation is retained. Bim1 single deletion is distinct from
    combined mutants; broad kinesin/BIR and TACC/INCENP domains are not promoted to
    exact narrow families. Kip3/She1 are external regulators, not unobserved residents.
    One panel locator needs correction, separately recorded.
- assessment_id: function-graph
  area: evidence
  topic: Functions and every graph edge
  outcome: supported
  target_ids:
  - cellstructuremech:quiescent_nuclear_microtubule_bundle
  evidence_ids:
  - record
  - primary-2013
  - primary-2024
  summary: 'All six edges and both functions checked: glucose-exhaustion assembly;
    early versus late kinetochore attachment; refeeding disassembly; Kip3 affects
    onset, not subsequent shortening rate; She1 evidence is in KIP3-deficient background;
    bundle disappearance precedes SPB separation without proving a molecular checkpoint.
    Nuclear reorganization and survival/regrowth are supported within tested conditions
    and pleiotropy caveats.'
