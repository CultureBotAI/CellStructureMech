findings:
- finding_id: F1
  issue_key: cellular-bud-neck-septin-ring-family-grounding-scope
  category: grounding
  severity: minor
  status: open
  certainty: confirmed
  title: Localized cohort criterion unnecessarily blocks Septin family grounding
  description: The septin proteins component retains REVIEWED_LABEL_ONLY because no
    exact term delimits its complete localized cohort. IPR016491 is the verified Septin
    family and annotates all five examples. The repository models components as taxon-agnostic
    families; localization is carried by the role and source evidence. Update this
    resolvable mapping while preserving the separate associated-protein boundary question.
  target_ids:
  - GO:0000144
