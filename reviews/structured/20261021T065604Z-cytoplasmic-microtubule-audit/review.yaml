limitations:
- The 2004 source was inspected as a browser-readable public author manuscript. Direct
  publisher and ResearchGate download routes returned403, and publisher-version byte
  identity was not established.
- Cytoplasmic and spindle microtubule classes overlap through astral microtubules;
  the record’s nuclear-spindle contrast is appropriate only within its budding-yeast
  context, not as a universal disjointness axiom.
- The yeast outer plaque is one organizing location; half-bridge nucleation and taxon-specific
  motors/nucleators are not exhaustively represented.
- COMMON is qualitative example coverage, not measured population prevalence. This
  review does not certify every cytoplasmic microtubule variant or accessory composition.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
