limitations:
- The cited2013 Annual Review was available as native bibliographic metadata and abstract
  only; the publisher returned403. Other review sources were read only at the explicitly
  named sections.
- Agrawal2009 identity evidence uses native sequence deposits plus indexed primary
  Methods text; attempted direct PMC routes returned challenge HTML. No full2009 body
  read is claimed. Kalanon2009 was read only at the stated Der1 Results/caption scope.
- O97275 is independently linked to PF3D7_0314300/DER1-2; its native ENA sequence
  contains the published Der1-2 antigenic peptide. The older PFC0590c model and current
  locus identifier are not treated as identical strings, and localization data for
  PfsDer1-1 are not transferred wholesale to Der1-2.
- No figure pixels, raw tomograms, supplementary sequence alignments or quantitative
  assays were independently reanalysed. The sources establish import/maintenance and
  stage-specific metabolic requirements, not a universal organelle-assembly requirement
  for every listed protein or lipid species.
- The family candidates were examined through complete example-specific native matches
  and named native entries. This is not an exhaustive absence search for every possible
  import-machine ontology representation.
- 'Shared corpus gates have bounded coverage: 617 label checks had no adapter; the
  identifier command reported 252 SKIPPED, 821 UNREACHABLE. These totals are not target-specific
  biological findings or proof that all corpus identifiers resolve.'
notes:
- Only the review bundle is intended for persistence. Maintained scientific content,
  native status, history and generated pages remain unchanged.
