findings:
- finding_id: F1
  issue_key: apicoplast-der1-er-paralog-example
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: The Toxoplasma Der1 example is the ER paralog
  description: B9PY98 cross-references FJ976521/ACU32856.1, explicitly deposited as
    Der1ER1. The original study distinguishes that sequence from apicoplast Der1Ap
    FJ976520/ACU32855.1, now C9WWW6. Consequently the concrete Toxoplasma example
    under apicoplast SELMA identifies a different cellular paralog; calling it an
    identity-only example does not make that substitution correct.
  target_ids:
