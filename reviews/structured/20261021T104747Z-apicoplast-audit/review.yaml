- finding_id: F3
  issue_key: apicoplast-tic20-direct-channel-overclaim
  category: evidence
  severity: minor
  status: open
  certainty: confirmed
  title: Direct Tic20 translocation exceeds the cited experiment
  description: The label/role and graph treat Tic20 as the translocon that translocates
    cargo. The cited2008 paper establishes inner-membrane localization and import
    requirement, but its sec5 explicitly argues against direct channel activity and
    considers accessory or regulatory roles. The known import dependency should be
    retained without resolving the channel mechanism by wording.
