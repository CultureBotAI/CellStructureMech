- finding_id: F2
  issue_key: cytoskeleton-fission-yeast-nda2-gene-symbol-omission
  category: consistency
  severity: minor
  status: open
  certainty: confirmed
  title: Four S. pombe microtubule-array records omit nda2 from components#alpha_tubulin.gene_symbols
    despite listing UniProtKB:P04688 (nda2) in protein_examples
  description: 'In aster.yaml (GO:0005818), astral_microtubule.yaml (GO:0000235),
    horsetail_astral_microtubule_array.yaml (GO:0032117), and post_anaphase_microtubule_array.yaml
    (GO:1990295), components#alpha_tubulin declares gene_symbols: [tub1, atb2, alp2]
    (all symbols/synonyms of S. pombe alpha-2 tubulin UniProtKB:P04689) while protein_examples[1]
    (UniProtKB:P04688, gene_symbol: nda2, alpha-1 tubulin) carries role: ''Identifier
    for the component''s declared gene symbol'' even though nda2 is omitted from gene_symbols
    (unlike sibling record cortical_microtubule_cytoskeleton.yaml, which lists gene_symbols:
    [tub1, atb2, alp2, nda2]).'
  target_ids:
  - GO:0005818
  - GO:0000235
  - GO:0032117
  - GO:1990295
  field_paths:
  - components[0].gene_symbols
  evidence_ids:
