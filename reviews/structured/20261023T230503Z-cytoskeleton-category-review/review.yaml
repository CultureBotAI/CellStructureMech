findings:
- finding_id: F1
  issue_key: cytoskeleton-subcomplex-component-types
  category: consistency
  severity: minor
  status: open
  certainty: confirmed
  title: Eight multi-subunit heterodimer or subcomplex components across 7 cytoskeleton
    records are typed PROTEIN instead of PROTEIN_COMPLEX
  description: 'Across 7 records in data/structures/cytoskeleton/ — arp2_3_protein_complex.yaml
    (components#arc35_arc19_clamp_subunits and components#arc40_arc18_arc15_peripheral_subunits),
    gamma_tubulin_complex.yaml (components#gcp2_gcp3_spoke_subunits), gamma_tubulin_ring_complex.yaml
    (components#mto1_mto2_activating_tether), gamma_tubulin_small_complex.yaml (components#gcp2_gcp3_spoke_subunits),
    meiotic_nuclear_membrane_microtubule_tethering_complex.yaml (components#bqt1_bqt2_meiotic_connector),
    nuclear_membrane_microtubule_tethering_complex.yaml (components#bqt1_bqt2_meiotic_connector),
    and sad1_kms1_linc_complex.yaml (components#bqt1_bqt2_meiotic_connector) — components
    that explicitly represent multi-subunit heterodimers or subcomplexes of distinct
    non-paralogous subunits are typed component_type: PROTEIN (''A single protein
    family or paralogue group'') instead of component_type: PROTEIN_COMPLEX (''A named
    sub-complex with its own identity'').'
  target_ids:
  - GO:0005885
  - GO:0000930
  - GO:0000931
  - GO:0008275
  - GO:0034993
  - GO:0106094
  - GO:1990612
  field_paths:
  - components[*].component_type
  evidence_ids:
  - ev_cyto_subcomplex_components
  rule_id: docs/SCHEMA.md:ComponentTypeEnum
