limitations:
- The cited source count is faithful to current CPX320 but is not a complete biological
  Fe-S inventory. The review flags the missing conflict qualification without silently
  correcting native imported data.
- Weiner1988 primary scans p1505,1507–1509 were visually read; p1506 and1510 were
  retrieved but not used. Native PMC HTML supplied Tang2011 claim-bearing text; failed
  S3/JATS/PDF routes and HTML challenges are not treated as paper bodies.
- Tang2011 Introduction/Methods and specified Results/Discussion paragraphs were read;
  figure pixels, raw EPR data and every unrelated paragraph were not reanalyzed.
- Family entries define homologous classes. DmsA/YnfE family coverage does not establish
  DmsBC compatibility for all homologues; exact examples and assembly membership remain
  source-specific.
- Constitutive membership of the named intactABC architecture does not establish each
  gene is indispensable for cell viability or that no partial enzyme assembles.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
- The schema defines essentiality by whether the structure forms without the component.
  The inspected sources establish constituent membership and functions, but those
  observations alone do not establish this assembly-necessity assertion. No subunit-deletion/assembly
  experiment was independently checked here; catalytic necessity, organismal viability
  and intact structural membership are distinct questions.
