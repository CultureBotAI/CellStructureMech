- assessment_id: assembly
  area: evidence
  topic: Constituents versus assembly necessity
  outcome: unknown
  target_ids:
  - GO:0009390
  summary: DmsA/B/C are established constituents of the intact heterotrimer. Tang2011
    distinguishes cofactor maturation from final membrane assembly, so an activity
    or cofactor defect does not by itself establish absence of the protein complex.
    The schema defines ESSENTIAL as assembly necessity; that assertion was not independently
    established by the inspected evidence.
