limitations:
- All five completed same-base batch26 global gates are integrated with exact manifest/input/log
  hashes verified. No fresh full-site QC is claimed from the sparse B57 checkout.
- Only the source sections and assets explicitly enumerated in evidence locators were
  inspected; no unlisted supplements or atomic coordinates were analyzed.
- Native P32795 and historical Weber1996 abstract describe a matrix-facing active
  site, while modern Wu primary biology and current GO place i-AAA action toward the
  IMS. This authority conflict is retained; the supported modern record orientation
  is not replaced by the historical/native statement.
- Dunn2006, Thorsness1993, Weber1996 and Huh2003 bodies were not independently read;
  their complete native abstracts and annotation placement are bounded evidence. No
  atomic architecture or universal stoichiometry was inferred from Fig3.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
