limitations:
- All five same-base batch26 corpus gates and exact target resolver rows are integrated
  with every manifested input hash verified.
- Only the listed primary sections and embedded captions were read; no figure pixels,
  videos, raw cryo-EM maps, mass spectra or source-data tables were reanalysed.
- MlaFEB and MlaED are partial assemblies, not an intact twelve-subunit MlaFEDB complex.
  Purified ATPase activity is not evidence that physiological lipid transport or envelope
  integrity is preserved. These partial assemblies do not contradict MlaD membership
  or, by themselves, require an essentiality correction for the complete four-class
  structure.
- The NCBI HTML response contains a data-loading shell; exact NF008809 identity/membership
  was instead verified through native InterPro responses and reciprocal UniProt linkage.
  Unchecked InterPro functional prose and its malformed MlaB bibliography are not
  primary evidence.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
