  summary: The complete Allen1974 paper identifies P. caudatum in Methods and the
    cytostomal cord in Observations. It places the fibrillar cord above microtubular
    ribbon ends and vesicle-accumulation spaces. Discussion explicitly leaves active
    function unresolved, considering both contractile and structural alternatives.
  snapshot_sha256: 909cf3b174de0fb31bf1bd34e4f4ab0b9e9961d799e08ea54157449d0ef72c3d
