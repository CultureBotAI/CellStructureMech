summary: 'Full cohort audit of all 226 MEMBRANE_ORGANELLE records in data/structures/membrane_organelle/.
  Organelle and membrane-anchored complex boundaries are well separated across prokaryotic
  and eukaryotic microbes. Three minor consistency gaps were identified: glycosome.yaml
  (GO:0020015) components[1] (peroxin_import_machinery, [PEX5, PEX7, PEX14]) and golgi_apparatus.yaml
  (GO:0005794) components[0] (golgi_snare_trafficking_machinery, [SED5, TLG2, SEC22])
  type multi-subunit machineries as PROTEIN instead of PROTEIN_COMPLEX, and anammoxosome.yaml
  (GO:0044222) omits reciprocal has_part: [cellstructuremech:anammoxosome_membrane].'
