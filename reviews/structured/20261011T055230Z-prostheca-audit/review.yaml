- finding_id: F1
  issue_key: prostheca-nutrient-uptake-conflict
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Distinguish stalk nutrient capture from unresolved whole-cell delivery
  description: The definition states nutrient uptake as an established function and
    the MECHANISTIC graph presents a positive uptake edge without the later conflict.
    Wagner 2006 directly demonstrates FDP capture/hydrolysis and predicts geometric
    capture benefits, but its delivery model depends on transport toward the cell
    body. Schlimpert 2012 prevents PstS shuttling across crossbands; Curtis 2017 explicitly
    reassesses the direct uptake interpretation. The qualified word can in one description
    does not preserve this distinction across the record.
