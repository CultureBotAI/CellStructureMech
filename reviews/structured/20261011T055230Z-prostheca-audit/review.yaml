- evidence_id: paper-0
  kind: primary_source
  reference: DOI:10.1016/j.cell.2012.10.046
  locator: Main-text Results, Figures 1-7 captions, Discussion and Methods
  accessed_at: '2026-10-11T05:47:09Z'
  snapshot_sha256: d44137d5f9c67b54f59fe54840fe7b1d0b82bf3734641c1b540d55b7e6d52681
  support: supports
  summary: StpAB deletion abolishes visible crossbands. StpC/D mutants retain crossbands
    with leaky barriers. StpAB provides the scaffold and StpC/D seals it. Protein
    trapping improves recovery from starvation. PstS cannot shuttle across mature
    crossbands; small-molecule routes remain possibilities, not established mechanisms.
- evidence_id: paper-1
  kind: primary_source
  reference: DOI:10.1046/j.1365-2958.2002.03071.x
  locator: Primary abstract only
  accessed_at: '2026-10-11T05:46:18Z'
  snapshot_sha256: 1bad08b0adc754825c30f8e8e7a4c9823f919547a45103dab75b5bc53a76ec61
  support: supports
  summary: Proteomics identifies transport-related proteins in purified stalks, consistent
    with nutrient-uptake competence, not direct proof of whole-cell nutrient delivery.
- evidence_id: paper-2
  kind: primary_source
  reference: DOI:10.1073/pnas.0602047103
  locator: Abstract, all Results and Discussion
  accessed_at: '2026-10-11T05:47:10Z'
  snapshot_sha256: fe19851f972f26edebeb7b4486bb081c1e570b1b8dc1814c5861304902cc472b
  support: supports
  summary: Isolated and attached stalks take up and hydrolyze FDP. PstS is present
    but PstA was not detected. Diffusive-capture modeling predicts a length/geometry
    advantage, not simply a surface-area rule; its periplasmic shuttle model was challenged
    by later crossband experiments.
- evidence_id: paper-3
  kind: primary_source
  reference: DOI:10.1073/pnas.0909119107
  locator: Abstract, all Results/Discussion and Methods
  accessed_at: '2026-10-11T05:47:11Z'
  snapshot_sha256: 0529ee25921feb0b94673415dc85e46d5d9287433ffa2d97b4a5765a1fde9255
  support: supports
  summary: All envelope layers extend into the stalk. NA1000 StpX localization, A22
    sensitivity and conditional elongation phenotypes are demonstrated. Stalk-specific
    PG chemistry/assembly is not established by this experiment.
- evidence_id: paper-4
  kind: primary_source
  reference: DOI:10.1111/j.1365-2958.2005.04970.x
  locator: Primary abstract only
  accessed_at: '2026-10-11T05:46:22Z'
  snapshot_sha256: 05dd3b3a89541e18a1adffab38c7883dcd2ec7d2340941acc802ed04192db05d
  support: supports
  summary: ShkA-ShpA-TacA phosphorelay activates developmental stalk biogenesis; TacA
    and ShpA are required in this cell-cycle setting, not universally across bacteria.
- evidence_id: paper-5
  kind: primary_source
  reference: DOI:10.1111/mmi.12422
  locator: Abstract, PbpC localization and coupled synthesis Results, Discussion
  accessed_at: '2026-10-11T05:47:12Z'
  snapshot_sha256: b6ebe1a54eae5fbcc89d5f077299cfc9f29b13227bf48611b6a63d3373f27114
  support: supports
  summary: PbpC contributes to stalk synthesis and separately anchors StpX during
    growth; its nonenzymatic localization function is distinct from wall synthesis.
- evidence_id: paper-7
  kind: primary_source
  reference: DOI:10.1371/journal.pgen.1007897
  locator: 'Results: PG architecture, DD/LD transpeptidases, MreB orchestration; media
    Methods'
  accessed_at: '2026-10-11T05:46:28Z'
  snapshot_sha256: 8613129d3276fe91b2bf814de6166af483df3b1c8e9524abfe48a16eb59b82a0
  support: supports
  summary: NA1000-derived mutants and compartment-resolved muropeptide analyses establish
    distinct stalk PG architecture; MreB-dependent polar machinery supports stalk
    formation under phosphate limitation.
- evidence_id: paper-8
  kind: primary_source
  reference: DOI:10.1371/journal.pone.0184063
  locator: Introduction, Methods, Results including Table 1, Discussion
  accessed_at: '2026-10-11T05:46:30Z'
  snapshot_sha256: 8688b79620912364e69bfa9d370f99b27db7a9d0fffe1d6e39c4d80d65f639e6
  support: supports
  summary: Brevundimonas stalk incidence and protein conservation differ from Caulobacter.
    PstA-GFP enters some Brevundimonas stalks without proving a complete transporter.
