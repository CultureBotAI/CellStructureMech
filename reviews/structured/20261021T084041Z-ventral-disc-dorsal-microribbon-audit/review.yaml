limitations:
- Schwartz2012 main text and main methods were read, including claim-bearing figure
  legends; raw tomography, figure pixels, videos and all supplementary datasets were
  not independently reanalyzed.
- Hagen2011 was read at the localization, family-table, experimental-method and interpretation
  passages identified in its evidence locator. Figure S3 caption lists beta-, delta-
  and gamma-giardin; SALP-1 microribbon association is explicitly reported in the
  main text and is not misattributed to that caption.
- Hagen2011 FRAP Methods s2f names DAP5374 as the whole-disc representative, while
  Results s3e names DAP4410/SALP-1. The report does not use this experiment to establish
  universal turnover behavior of the entire microribbon cohort.
- The GO-derived exclusion of tubulin and approximate 29–38 kDa constituent range
  remain authority-backed definition claims. The 2012 tomographic density map itself
  is not a biochemical proof of absence or a molecular-mass assay.
- The exact sheet-specific protein architecture, complete constituent inventory and
  crossbridge composition are unresolved in the inspected sources. Optional additions
  are not required for this bounded record.
- Current unreviewed UniProt annotations and the inspected InterPro/Pfam candidates
  do not establish one exact family covering the entire named cohort. Lack of a SALP-1
  family cross-reference is not evidence against its reported homology.
- Microribbon rigidity, crossbridge contraction, assembly timing and the full attachment
  mechanism remain interpretations in the cited studies; this review assesses the
  architectural claims actually made by the record.
- Species occurrence is supported by the characterized WBC6 trophozoite model; no
  numerical prevalence, cyst-stage presence or universal distribution across Giardia
  is inferred.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
