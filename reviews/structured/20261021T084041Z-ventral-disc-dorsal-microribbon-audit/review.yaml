  support: supports
  summary: Primary tomography resolves three closely apposed microribbon sheets extending
    dorsally from disc microtubules and lateral crossbridges to neighboring ribbons.
    WBC6 trophozoites were grown at 37 C; cryo-ET used detergent-extracted, flattened
    cytoskeletons. The selected grand average resolves architecture, not named protein
    identities. Beta-giardin, delta-giardin and SALP-1 composition in Discussion s3d
    is attributed to earlier work; proposed rigidity, contraction and attachment dynamics
    remain interpretations. The within-complex bridge B is distinct from inter-ribbon
    crossbridge CB.
