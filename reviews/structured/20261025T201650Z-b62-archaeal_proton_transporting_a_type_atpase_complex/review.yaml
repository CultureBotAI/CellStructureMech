findings:
- finding_id: F1
  issue_key: archaeal-atpase-pfuriosus-ion-scope
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Qualify the sodium-coupled Pyrococcus structural example
  description: The record identifies a proton-transporting class but lists the P.
    furiosus enzyme as an unqualified canonical example, and uses its Vonck2009 structure
    for proton-half-channel language. Vonck explicitly describes this preparation
    as sodium coupled; Pisa2007 provides direct primary abstract evidence for Na+-dependent
    ATPase activity and ion competition. Structural similarity does not establish
    the proton-specific transport claim for that preparation. This does not invalidate
    GO1990490, the M. jannaschii protein identities, or the comparative architecture.
  target_ids:
  - GO:1990490
  field_paths:
  - canonical_examples[1]
  - components[3].role
  - causal_graphs[0].edges[0]
  evidence_ids:
  - record-target
  - source-go
  - source-vonck2009-legacy
  - source-pmid-17614964
  normalization_reason: Major because the experimental example and source-supported
    mechanism cross the defining coupling-ion boundary; the correction is bounded
    to source/example scope rather than a claim that all A-type ATPases are misidentified.
  owner_paths:
  - repository: CultureBotAI/CellStructureMech
    path: data/structures/energy_complex/archaeal_proton_transporting_a_type_atpase_complex.yaml
    role: maintained scientific record
actions:
- action_id: C1
  description: Qualify P. furiosus as sodium-coupled comparative A-type structural
    evidence rather than an unqualified proton-specific example, or substitute a directly
    verified proton-coupled example. Restrict the Vonck-supported AtpI language to
    the structural inference it actually supports; retain proton-channel claims only
    with an appropriately scoped source.
  finding_ids:
  - F1
  target_ids:
  - GO:1990490
  acceptance_checks:
  - The canonical example explicitly states its sodium-coupling context, or is replaced
    by a source-verified proton-specific preparation.
  - Vonck2009 is not represented as direct proton-transport or atomic proton-half-channel
    evidence.
  - The valid GO identity, four protein identities and comparative architectural evidence
    are preserved.
  owner_paths:
  - repository: CultureBotAI/CellStructureMech
    path: data/structures/energy_complex/archaeal_proton_transporting_a_type_atpase_complex.yaml
    role: maintained scientific record
limitations:
- Lingl2003 was readable only as a complete native abstract; publisher challenge HTML
  and the failed mirror attempt are retained. Its detailed Methods and all individual
  formation requirements remain unverified.
- Coskun2004 full scientific PDF text and captions were read, but no figure pixels
  were independently inspected. Vonck2009 complete main prose was read without independently
  inspecting its figure pixels, captions or supplements; no atomic ion-channel reconstruction
  is certified.
- Pisa2007 and the secondary Grüber2014 review were read at complete-abstract scope
  only. Sodium dependence and proton competition do not justify asserting an absolute
  inability to use protons.
- The native term request verifies Archaea-specific definition and is_a hierarchy;
  it is not a separate taxon-constraint endpoint or a measured prevalence census.
  COMMON retains its schema majority meaning, whose population scope is unresolved
  here.
- Corpus identifier resolution includes856 unreachable and252 skipped identifiers
  despite native exit0; BFO authority control was not exercised. These residuals are
  not evidence of absence or scientific validity.
