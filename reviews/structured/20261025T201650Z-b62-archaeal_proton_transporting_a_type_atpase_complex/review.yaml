  outcome: unknown
  summary: ESSENTIAL denotes failure of structure formation, not catalytic importance
    or inclusion in an intact preparation. The read studies establish intact composition,
    architecture and activity; they do not resolve each of the four universal formation
    assignments. This uncertainty is retained rather than inferring dispensability
    or demanding an omission experiment as the sole acceptable form of evidence.
  target_ids:
