assessments:
- assessment_id: A1
  area: identity
  topic: Proton-specific ontology identity and hierarchy
  outcome: supported
  summary: GO1990490 is explicitly the proton-transporting archaeal A-type ATPase
    class, with the maintained broader synonyms and the two maintained is_a parents.
    GO0015986 supplies the synthesis process; reverse ATP hydrolysis belongs to the
    broader enzyme description, not a separate proof of synthesis in every cited preparation.
  target_ids:
  - GO:1990490
  evidence_ids:
  - source-go
  - source-go-ancestors
- assessment_id: A2
  area: grounding
  topic: Four molecular classes and protein instances
  outcome: supported
  summary: The four mappings represent whole subunit families. IPR000245 and IPR002490
    use V-type terminology but their actual scope includes the related A-type proteolipid/stator
    classes; their names alone do not invalidate the mappings. Native Q57670/Q57669/Q57674/Q57675
    are reviewed M. jannaschii DSM2661 AtpA/B/K/I instances and supply separate membership
    bridges. A3B3 stoichiometry is supported; the K ring is not assigned one universal
    copy number.
  target_ids:
  - GO:1990490
  evidence_ids:
  - source-ipr-IPR000245
  - source-ipr-IPR002490
  - source-ipr-IPR005724
  - source-ipr-IPR005726
  - source-protein-Q57669
  - source-protein-Q57670
  - source-protein-Q57674
  - source-protein-Q57675
  - source-coskun2004-pdf
  - source-pmid-12768457
- assessment_id: A3
  area: scope
  topic: Canonical coupling-ion context
  outcome: concern
  summary: The unqualified P. furiosus canonical example and its use beneath a proton-specific
    definition need a coupling-ion qualification. Vonck explicitly concerns a sodium-coupled
    enzyme; Pisa supplies direct primary abstract evidence for sodium dependence and
    H+/Na+ competition. Preserve comparative A-type structure evidence without promoting
    it to direct proton-specific transport evidence.
  target_ids:
  - GO:1990490
  evidence_ids:
  - source-go
  - source-vonck2009-legacy
  - source-pmid-17614964
  - source-pmid-24650628
- assessment_id: A4
  area: graph
  topic: Assembly and rotary-catalysis graph
  outcome: concern
  summary: Component references, identities and edge direction support a coarse mechanistic
    account. The AtpI edge specifically attaches proton-half-channel wording to the
    sodium-coupled Vonck structure; that source supports inferred membrane/stalk organization
    rather than direct atomic proton-channel resolution. The same coupling/source-scope
    correction is covered by F1, not a separate architecture finding.
  target_ids:
  - GO:1990490
  evidence_ids:
  - source-go
  - source-vonck2009-legacy
  - source-coskun2004-pdf
  - source-pmid-12768457
- assessment_id: A5
  area: scope
  topic: Taxonomy and experimental examples
  outcome: unknown
  summary: Taxon2157 is Archaea and the two example IDs are the named DSM strains.
    COMMON means present in most members with losses exceptional; an in-taxon restriction
    alone does not establish this prevalence, particularly for the proton-specific
    subset of a broader H+/Na+ family. The inspected structural and isolation papers
    support characterized occurrence rather than a clade-wide census.
  target_ids:
  - GO:1990490
  evidence_ids:
