  the attempted publisher body returned403. No strain-specific ultrastructural measurements
  or complete original Methods were certified.
- Pal2003 remains complete native abstract/bibliographic PMC scope. The listed PMC
  PDF returnedHTTP200 challenge HTML and EuropePMCfullTextXML500; no body/figure/scan
  was recovered. Umaer2018 main science and declared Methods were genuinely read.
- 'The cargo terminology spans distinct assays: Pal measures substantial degradation/product
  exocytosis, while Umaer demonstrates selective ISG65 effects and largely unaffected
  GPI-anchored VSG/TfR traffic. No universal Rab11 dependence or intact Tf/IgG return
  is certified.'
- No sequence-level comparison between Q9NJE8 and the2018 Tb927.8.4330 RNAi target
  was performed; the accession-specific conclusion is native gene/species identity
  and original-source localization class, not a verified experimental construct identity.
  Individual lipid formation necessity remains unknown.
