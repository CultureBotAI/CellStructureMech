limitations:
- The complex is defined by localization, perturbation and functional nonredundancy.
  Purification, direct contacts, exact copy numbers and an exhaustive molecular inventory
  are not established.
- Supplemental files were not inspected; the publisher route was inaccessible and
  the inspected public OA file index did not supply them. Main-text RNAi methods and
  figure legends were read, without reanalysis of off-target data or raw microscopy.
- No replacement accession for the source's conventional Centrin2 was verified. Historical
  numbered UniProt protein aliases alone are not sufficient for that mapping.
- The exact-name QuickGO search is bounded and does not establish ontology-wide absence.
  The inspected broad InterPro family does not resolve an exact ICL1e-subgroup grounding.
- Functional equivalence of homologues outside the characterized Paramecium tetraurelia
  system remains unestablished.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
notes:
- Root completed native inspection, read the entire target and visually inspected
  the tracked Figure 3 and primary Figure 1A. Source collaborators independently inspected
  primary text, figures and native entries.
- Only a review bundle is saved. Maintained scientific content, native status, history
  and generated pages remain unchanged.
