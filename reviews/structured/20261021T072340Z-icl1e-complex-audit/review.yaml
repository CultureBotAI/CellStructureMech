    names, genes, ORF names and organism'
  accessed_at: '2026-10-21T07:15:14.382746Z'
  support: supports
  summary: Reviewed entries resolve Q27177 as Icl1a, Q27179 as Icl1b, Q27178 as Icl1c,
    Q3SEK0 as Icl1e and Q3SEK2 as Icl1f, all in taxon 5888. Q3SEK0 has ORF GSPATT00007681001,
    sharing the numeric locus stem with the source's GSPATG00007681001 ICL1e gene
    identifier; their different prefixes are preserved. The other entries and their
    historical numbered centrin aliases do not establish membership in the source-defined
    ICL1e subgroup or identity with its conventional Centrin2.
  snapshot_sha256: 238c976e617c4e8880f8328557fd72739ef4b3ae3f0353dd28ab07281b24b933
- evidence_id: icl1e-agent-paper
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC5483020.1/PMC5483020.1.xml
  locator: Article identity and permissions; Results s2a-s2f, relevant Discussion,
    Methods s4a-s4b and microscopy/RNAi methods; Figures 2-7 legends
  accessed_at: '2026-10-21T07:14:16.610395Z'
  support: supports
  summary: Aubusson-Fleury et al. 2017 defines the discrete ICL1e dot as a functional
    complex, distinct from the full lattice and bipartite ICLOC. Results s2b defines
    seven subgroup genes; Methods s4b supplies their loci. Results s2c-s2f support
    the scoped assembly timing, anchoring and localization dependencies, while leaving
    direct physical connections unresolved. Strain Methods and Figure 3 caption support
    the stated experimental context; JATS explicitly licenses CC BY 3.0.
  snapshot_sha256: 54758ab66e922d852a9af9c4d632496ff76629fc38c5f6879017512dcf4c60d6
- evidence_id: icl1e-agent-paper-pdf
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC5483020.1/PMC5483020.1.pdf
  locator: Figure 1A, article page 766/PDF page 2; full figure visually inspected
    by source collaborators and root
  accessed_at: '2026-10-21T07:15:26.745922Z'
  support: refutes
  summary: Figure 1A visibly separates the ICL1 branch containing ICL1a/b/c/d/f from
    the ICL1e branch containing ICL1e/g and Cen8/10/12/15/18. Conventional Centrin2
    is another distinct branch. This is direct evidence against conflating the component
    subgroup or its external Centrin2 factor with the added protein examples.
  snapshot_sha256: a562e5f517905519a8139d78c73b5aa6a1f79837be642011b00a983c71f3f14e
- evidence_id: icl1e-agent-figure3
