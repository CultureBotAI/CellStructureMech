  locator: Complete Figure 3; visually inspected and compared with source caption
    and tracked image
  accessed_at: '2026-10-21T07:14:16.729165Z'
  support: supports
  summary: 'The downloaded Figure 3 exactly matches the tracked image SHA-256. The
    complete figure depicts epifluorescence of dividing BP cells: GFP-Cen15 with 1A9
