findings:
- finding_id: F1
  issue_key: icl1e-complex-component-paralogue-subfamily-mismatch
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Four component examples belong to the separate ICL1 subgroup
  description: The ICL1e-family component now declares Icl1a, Icl1b, Icl1c and Icl1f
    and supplies Q27177, Q27179, Q27178 and Q3SEK2 as their examples. Native identities
    are correct, but primary Figure 1A places these proteins in the separate ICL1
    branch. Results s2b instead defines the ICL1e subgroup as ICL1e/ICL1g, Cen8/Cen10,
    Cen12/Cen15 and Cen18, as the target discussion already records. The identity-only
    wording does not repair the mismatch with the explicitly scoped component class.
    Q3SEK0 correctly identifies ICL1e and should be retained.
  target_ids:
