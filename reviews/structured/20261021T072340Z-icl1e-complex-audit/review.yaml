- evidence_id: icl1e-agent-proteins
  kind: authority
  reference: https://rest.uniprot.org/uniprotkb/search?query=(accession:Q27177%20OR%20accession:Q27179%20OR%20accession:Q27178%20OR%20accession:Q3SEK0%20OR%20accession:Q3SEK2)&format=json
