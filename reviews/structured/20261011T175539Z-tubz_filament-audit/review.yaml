  summary: Larsen 2007 supports pBtoxis TubZ polymerization, treadmilling and plasmid
    stability; Aylett 2010 resolves filament architecture. Ni 2010 establishes TubR-DNA
    binding to TubZ; Aylett 2012 independently supports TubRC engagement/stabilization
    of filaments. Coarse NONMECHANISTIC partitioning graph does not assert the full
    transport geometry. TubR/tubC remain cargo adapters, not polymer constituents,
    and VARIABLE species occurrence avoids all-strain generalization.
- assessment_id: hierarchy
  area: grounding
  topic: Whole framework versus constituent system
  outcome: concern
  target_ids:
  - cellstructuremech:tubz_filament
  evidence_ids:
  - record
  - go
  - rules
  - schema
  summary: The record places GO:0005856 cytoskeleton in parent_structures, asserting
    that this filament system is a type of the whole cellular framework. The native
    schema and CURATION rules distinguish is-a from part_of; GO:0099513 likewise describes
    a polymeric fiber as a component of the cytoskeleton. This is a semantic hierarchy
    error, even though all identifiers resolve.
