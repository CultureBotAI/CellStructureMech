limitations:
- Takayama2003 entire scientific body and Fig1–7 captions were read, but no figure
  pixels, supplements or raw experiments were inspected. Experimental W303-derived
  systems and temperature/construct conditions remain distinct from S288C reference
  protein identities.
- The review does not dispute modern CMG biology. It identifies the mismatch between
  the record’s detailed claims and its actual GO/2003 source support. Additional modern
  primary sources would require independent inspection before supporting these details.
- GINS recovery in sld5-12 is reduced and condition-dependent, with abundance/suppression
  complications; this is not promoted to universal absence of GINS or pre-IC formation.
  No additional component or protein-example inventory is required merely to fill
  an optional slot.
- Native initial DNS failures and successful network retries are retained separately.
  An HTTP200 redirect, download challenge or abstract landing page is never treated
  as full scientific text.
- All five fresh-base batch26 corpus gates and exact target resolver rows are integrated
  here; every manifested source input is identical at the shared base.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
