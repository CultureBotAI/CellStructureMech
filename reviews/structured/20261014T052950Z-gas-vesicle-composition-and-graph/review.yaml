  - dutka
  - dutka-figure1
  rule_id: review-checklist:causal-direction-and-parthood
  native_severity: major
  normalization_reason: Wrong part/whole object in a machine-readable directed edge
    changes the represented anatomy despite otherwise correct organelle identity.
  owner_paths:
  - repository: CultureBotAI/CellStructureMech
    path: data/structures/inclusion/gas_vesicle.yaml
    role: maintained scientific record
- finding_id: F2
  issue_key: gas-vesicle-gvpc-essentiality
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Separate GvpC shell strengthening from an assembly requirement
  description: CONDITIONAL is an assembly-required-under-defined-conditions assertion
    under the native schema, not a marker for a protein present only in some lineages.
    The component evidence and role describe strengthening and name no condition or
    lineage where vesicle assembly requires GvpC. The inspected primary gvpC-deletion
    abstract reports abundant irregular vesicles in a Hfx. volcanii transformant.
    Use an evidence-supported dispensable/unknown assessment with bounded context,
    or supply a specific assembly-required condition and direct evidence. This finding
    does not claim GvpC is dispensable in all possible environments.
  target_ids:
  - GO:0031411
  field_paths:
  - components[1].essentiality
  - components[1].evidence
  evidence_ids:
  - native
  - schema
  - walsby
  - gvpc-deletion
  - dutka-figure3
  rule_id: review-checklist:component-essentiality-evidence
  native_severity: major
  normalization_reason: Unsupported categorical assembly dependency affects biological
    interpretation; mechanical reinforcement alone cannot justify the structured requirement.
  owner_paths:
  - repository: CultureBotAI/CellStructureMech
    path: data/structures/inclusion/gas_vesicle.yaml
    role: maintained scientific record
