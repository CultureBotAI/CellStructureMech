findings:
- finding_id: F1
  issue_key: gas-vesicle-shell-lumen
  category: representation
  severity: major
  status: open
  certainty: confirmed
  title: Correct the object enclosed by the gas-vesicle shell
  description: The function graph states gvpa_shell encloses gas_vesicle, whose object
    is grounded to GO:0031411, the entire organelle. A constituent wall cannot enclose
    the complete organelle of which it is part. The edge description and Dutka architecture
    show the wall bounding the lumen and forming the vesicle body. Change the relationship
    to a valid wall/whole relationship or target a correctly typed lumen node; do
    not relabel GO:0031411 as lumen.
  target_ids:
  - GO:0031411
  field_paths:
