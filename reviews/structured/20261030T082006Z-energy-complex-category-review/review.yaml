findings:
- finding_id: F1
  issue_key: energy-complex-phycobilisome-core-type-and-has-part
  category: consistency
  severity: minor
  status: open
  certainty: confirmed
  title: phycobilisome.yaml types heteromeric allophycocyanin_core ([apcA, apcB, apcD,
    apcF]) as PROTEIN and omits has_part links to phycobilisome_core and phycobilisome_rod
  description: 'In data/structures/energy_complex/phycobilisome.yaml (GO:0030089),
    components[0] (id: allophycocyanin_core, label: ''Allophycocyanin core (ApcA/ApcB/ApcD/ApcF)'',
    gene_symbols: [apcA, apcB, apcD, apcF]) represents the multi-subunit allophycocyanin
    core assembly (referencing ApcA, ApcB, ApcD, and ApcF in Synechocystis sp. PCC
