limitations:
- The defining study establishes localization and perturbation dependencies, not a
  purified binding pathway, complete constituent census, fixed stoichiometry or exact
  gamma-TuC architecture. Motor cross-linking models remain open.
- Dlc1 recruitment effects vary by meiotic stage. Dhc1 dispensability is limited to
  the tested Alp4 recruitment, not efficient clustering or every activity of the assembled
  structure.
- The 2025 evidence is an engineered partial mitotic reconstitution. No broad fungal
  prevalence or ordinary mitotic telocentrosome is inferred.
