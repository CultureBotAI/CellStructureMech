- assessment_id: composition
  area: evidence
  topic: Resident proteins, reporter subunit and excluded candidates
  outcome: supported
  target_ids:
  - cellstructuremech:telocentrosome
  summary: The defining localization experiments support Sad1, Kms1/Kms2, Mto1, Dlc1/Dhc1,
    Ssm4 and an Alp4-reported gamma-TuC at Sad1-marked telomeric foci. Alp4 is explicitly
    one subunit, not the whole-complex accession or proof of ring/small-complex architecture.
    Genetic effects of other kinesins do not establish their residence. Upstream tethers,
    all other complex subunits and nucleated tubulin are not imported as an exhaustive
    inventory.
  evidence_ids:
  - telo-prep-yoshida2013-jats
  - telo-agent-yoshida2013-supp
  - telo-prep-go
  - telo-prep-Q09825
  - telo-prep-P87245
  - telo-prep-O43087
  - telo-prep-O94488
  - telo-prep-Q9Y705
  - telo-prep-Q9UTS6
  - telo-prep-O13290
  - telo-prep-O42667
  - record
- assessment_id: essentiality
  area: scope
  topic: Recruitment requirements and stage dependence
  outcome: supported
  target_ids:
  - cellstructuremech:telocentrosome
  summary: UNKNOWN assignments avoid interpreting localization as universal assembly
    necessity. Dhc1 DISPENSABLE is expressly scoped to Alp4 recruitment, supported
    by Figure5, while the record preserves its contribution to efficient clustering.
    Dlc1 contributes more strongly in later/haploid assays than at early preconjugation
    sites; residual localization and maintenance uncertainty are retained.
  evidence_ids:
  - telo-prep-yoshida2013-jats
  - telo-agent-yoshida2013-supp
  - record
- assessment_id: assembly-graph
  area: evidence
  topic: Perturbation-defined molecular recruitment
  outcome: supported
  target_ids:
  - cellstructuremech:telocentrosome
  summary: Each supports edge matches the tested Kms1-to-Mto1, Kms1-to-Dlc1 and Mto1/Dlc1-to-Alp4
    recruitment dependencies. The final gamma-TuC-to-center edge is the source-supported
    assembly interpretation, expressly not isolated-complex sufficiency. MECHANISTIC
    is bounded to these molecule-specific perturbations; neither direct binding nor
    fixed copy number is asserted.
  evidence_ids:
  - telo-prep-yoshida2013-jats
  - telo-agent-yoshida2013-supp
  - record
- assessment_id: function-graph
  area: evidence
  topic: Microtubule nucleation and motor-dependent clustering
  outcome: supported
  target_ids:
  - cellstructuremech:telocentrosome
  summary: MBC washout, telomeric regrowth, cytoplasmic localization in S2B, live
    clustering and motor perturbations support the two functions and supports edges.
    Nucleation alone is not claimed sufficient for the complete bouquet. Figure5C
    motor cross-linking and exact Dlc1 action remain proposed models, consistent with
    the open discussion.
  evidence_ids:
  - telo-prep-yoshida2013-jats
  - telo-agent-yoshida2013-supp
  - telo-prep-figure2
  - telo-prep-go
  - record
- assessment_id: taxon-context
  area: scope
  topic: Physiological meiosis versus engineered partial mitotic assembly
  outcome: supported
  target_ids:
  - cellstructuremech:telocentrosome
  summary: Only S.pombe is a canonical species. Zygotic and mat-gene-induced haploid
    meiotic conditions agree with the defining study. The 2025 engineered mitotic
    result is accurately restricted to partial recruitment without detectable Dhc1
    or a complete bouquet; the record does not infer normal mitotic occurrence, broad
    fungal prevalence or a single missing factor.
  evidence_ids:
  - telo-prep-yoshida2013-jats
  - telo-agent-yoshida2013-supp
