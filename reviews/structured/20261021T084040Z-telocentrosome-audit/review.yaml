assessments:
- assessment_id: identity
  area: identity
  topic: Telomeric nucleation center versus tether, spindle pole body and bouquet
  outcome: supported
  target_ids:
  - cellstructuremech:telocentrosome
  summary: The primary definition denotes a meiotic telomere-associated protein assembly
    at the nuclear envelope. The broad GO MTOC parent fits; the narrower membrane
    tether is not substituted for the whole center. Sid4 non-colocalization and the
    clustering endpoint support keeping the SPB and completed bouquet distinct. The
    local synonym is descriptive and the identity remains PROPOSED.
  evidence_ids:
  - telo-prep-yoshida2013-jats
  - telo-prep-go
  - record
- assessment_id: families
  area: grounding
  topic: Exact families versus broader families and domains
  outcome: supported
  target_ids:
  - cellstructuremech:telocentrosome
  summary: 'SUN1-5 and Tctex-1-like are exact family-level mappings. The complete
    five accession-specific InterPro responses support retaining the other components
    label-only at their current narrower labels: Kms1 and Ssm4 only have domain/superfamily
    matches, Mto1 has domains, and Nesprin-4 and generic heavy-chain families do not
    establish exact equivalence to the specified Kms2-like and cytoplasmic-chain classes.
    This does not assert that those proteins lack all family annotation.'
  evidence_ids:
  - telo-prep-IPR045119
  - telo-prep-IPR005334
  - telo-prep-IPR030268
  - telo-prep-IPR026983
  - telo-prep-matches-P87245
