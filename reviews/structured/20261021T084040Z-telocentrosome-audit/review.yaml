- assessment_id: protein-identities
  area: provenance
  topic: Eight taxon-paired sequence examples and homonyms
  outcome: supported
  target_ids:
  - cellstructuremech:telocentrosome
  summary: All eight accession, primary gene, recommended-name, reviewed-status and
    taxon pairings agree with native UniProt. ENA confirms the maintained strain label.
    The examples are explicitly reference sequences, while TableS1 lists diverse engineered
    experimental stocks. The mto1 and ssm4 collisions are correctly resolved by protein
    identity and locus rather than symbol alone.
  evidence_ids:
