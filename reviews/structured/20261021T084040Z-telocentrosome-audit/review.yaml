  video legends and relevant TableS1 rows. Movies and underlying raw imaging data
  were not independently replayed or reanalyzed. Jimenez2025 reading was limited to
  Sec8/9/12/14/17, Figure6 caption and supplemental Rap1 context; unrelated transcriptomic
  and screening datasets were not independently audited.
