  area: evidence
  topic: Regulated secretion and host attachment/invasion
  outcome: supported
  target_ids:
  - GO:0020009
  summary: Both functions are supported within the cited RH-derived studies and broader
    review context. PKG signaling is experimentally linked to secretion; the graph
    does not prescribe an unsupported calcium-only signal. Efficient/rapid invasion
    does not mean absolute inability to invade after M2AP or MIC2 perturbation.
  evidence_ids:
  - record
  - microneme-agent-carruthers1997-pmc
  - microneme-agent-huynh2003-pmc
  - microneme-agent-huynh2006-pmc
  - microneme-agent-brown2016-pmc
  - microneme-agent-carruthers2008-pmc
- assessment_id: cargo-topology
  area: graph
  topic: Luminal contents versus complete transmembrane complexes
  outcome: concern
  target_ids:
  - GO:0020009
  summary: The two resides-in-lumen edges apply to the whole heterogeneous adhesin
    cohort and whole MIC2–M2AP complex. MIC2 has a transmembrane segment/cytosolic
    tail and AMA1 is also a transmembrane protein. Luminal extracellular domains and
    soluble M2AP differ from wholly lumen-contained proteins. The descriptions already
