limitations:
- Carruthers2008 and Dubois2019 are literature reviews, not new experimental proof.
  Dubois was read as an accepted author manuscript; the direct publisher route403
  remains preserved. No copyright license is inferred or image reused.
- 'Primary source read scopes are exact in evidence: no complete2003 Methods or raw
  perturbation reanalysis, no2006 supplementary videos/Table1 numerical reanalysis,
  and only selected2016 Methods. No figure pixels were inspected.'
- The1997 primary body is a recovered author manuscript; its complete scientific main
  text and Methods were read. The six additional localization papers were checked
  at exact native metadata/abstract and UniProt evidence-link level, not as fully
  read papers.
- Native VEG/ME49 examples are distinct from RH experimental lines. Identity verification
  does not establish strain-specific experimental equivalence; current exact reviewed
  query counts are bounded.
- Membership, secretion, adhesion, virulence and organelle formation necessity are
  separate. No universal apicomplexan stage distribution, complete molecular inventory,
  chemical lipid recipe or resolved fusion machinery is asserted.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
