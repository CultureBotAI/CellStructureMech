assessments:
- assessment_id: identity
  area: identity
  topic: Dolipore morphology and porous-septum parentage
  outcome: supported
  target_ids:
  - GO:0000937
  summary: The exact GO class and declared parent agree with the swollen cross-wall
    and paired cap-bearing pore representation. The structure remains an envelope
    substructure, distinct from one cap protein or an impermeable complete septum.
  evidence_ids:
  - dolipore-agent-go
  - record
- assessment_id: synonyms
  area: nomenclature
  topic: Historical complex terminology
  outcome: supported
  target_ids:
