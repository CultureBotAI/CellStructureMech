- Traquair1978 publisher HTML/PDF and final vanDriel2009 publisher routes returned403;
  only their exact native abstracts were read. The related2007 thesis chapter is a
  distinct version with a different survey total.
- VanDriel2008 supports SPC18 localization and a proposed role in plugging. Variable
  plug labeling, antibody crossreactivity controls and hypothesized release/transport
  are preserved; no conserved directly observed mechanism is inferred.
- VanPeer2010 closure sampling was10hyphae per genotype, not100% failure; growth and
  fruiting outcomes depend on temperature. Strains and purification versus genetic
  assays remain distinct.
- No source figure pixels or supplementary movies were independently analysed. No
  complete protein-family sequence search, cross-ontology absence proof or full current
  Agaricomycotina survey is claimed.
- Component assembly necessity remains UNKNOWN. This clean unsaved draft is produced
  under the user’s explicit every-record review instruction overriding the local issue-only
  output gate.
