  summary: Dolipore-parenthesome septum is source-supported terminology; septal pore
    complex remains a RELATED rather than exact synonym, preserving the broader complex
    usage. Historical spelling variants in the1978 bibliographic metadata do not change
    its DOI identity.
  evidence_ids:
  - dolipore-agent-traquair1978-meta
  - dolipore-agent-driel2009-meta
  - dolipore-agent-driel-thesis-pdf
  - record
- assessment_id: composition
  area: grounding
  topic: Morphologic parts and optional protein inventory
  outcome: supported
  target_ids:
  - GO:0000937
  summary: The swelling and paired caps are whole morphologic substructures. Their
    label-only treatment does not conflate either with SPC18, Spc14 or Spc33. The
    cited studies characterize different species-specific protein complements; the
    bounded native name queries provide no exact whole-cap family mapping. The optional
    molecular inventory TODO is not a defect by itself.
  evidence_ids:
