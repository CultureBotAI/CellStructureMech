- evidence_id: dolipore-agent-peer2010-knaw-pdf
  kind: primary_source
  reference: https://wi.knaw.nl/images/ResearchGroups/Publications/2009Peer0002.pdf
  locator: 'Early-online publisher PDF pp1–10: full main Results/Discussion, captions
    and Experimental Procedures; original movie/figure pixels not independently analysed'
  accessed_at: '2026-10-21T10:01:24.897522Z'
  support: supports
  summary: The early-online paper demonstrates a membrane-covered protein matrix and
    Spc33 localization in S.commune caps. spc33 deletion removes visible caps and
    strongly impairs closure in the laser assay (8/10mutant third septa open;7/10wild-type
    closed). Growth/development effects depend on conditions; mutant fruiting persists
    at18C but is impaired. Purification uses a Δsc3Δsc15 derivative of4–40, while
    deletion experiments use4–8 and crosses with4–8b. Spc14 antiserum was nonspecific.
  snapshot_sha256: 9310b0d3b6a841022ccca534b654ae46799eb58089a8d99f4a63462e4d12404c
