  summary: SPC18 localization in caps and some plugs supports participation as a hypothesis;
    independent S.commune deletion/localization evidence supports impaired closure
    and growth/development. The record’s participation/impairs wording does not require
    caps to be the complete occluding plug or assert a directly observed release mechanism.
    The source abstract’s inability-to-close wording must be understood within its
    assay and sample limits.
