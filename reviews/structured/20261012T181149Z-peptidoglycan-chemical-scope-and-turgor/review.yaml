limitations:
- Initial unsaved-draft validation rejected two UTC timestamps written with +00:00
  rather than the required Z suffix. They were normalized without changing the instants;
  the original draft and failed validation receipt are retained in scratch.
- Same-agent scientific review, not independent human sign-off or an exhaustive literature
  update. Relevant original source passages were read; raw experiments, all supplements
  and figure pixels were not reanalyzed.
- The native Vollmer citation supports broad distribution and natural wall-less examples.
  The explicit L-form clause was corroborated with additional original sources, not
  found as an explicit Vollmer passage; adding a more precise citation is a bounded
  provenance improvement, not evidence the biological exception is false.
- Egan preserves historical uncertainty about flipping contributions. This review
  does not convert a model-system graph into a universal statement excluding other
  flippases, glycosyltransferases or crosslinking routes.
- Initial source-route errors and local PDF-tool failures remain documented. Later
  original JATS/PDF retrieval supplied the assessed text. A wrong initial supplemental
  eLife URL supplied no evidence and was not used.
- The checkout became inaccessible mid-review. After restoration, HEAD, all captured
  native inputs, prior files, untracked set and ledger were verified unchanged; original
  start time and real check times were retained.
- Wider gates retain their original cache, skip and network limitations and are not
  fresh CI. Post-save archive checks will be run separately.
- No native scientific YAML, status, history, generated artifact or prior review changed.
  GitHub publication approval remains unanswered; no remote mutation.
