findings:
- finding_id: F1
  issue_key: peptidoglycan-lipid-ii-chemical-scope
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Do not ground generic Lipid II to the lysine-only species
  description: CHEBI:27692 specifies an L-lysyl pentapeptide, while both nodes denote
    generic Lipid II in a graph supported in part by meso-DAP-containing E.coli material.
    Distinct localization states may share chemistry, but this exact chemical identity
    is too narrow for their declared scope. Preserve the generic concept with verified
    matching grounding or explicit label-only scope; alternatively distinguish clearly
    scoped chemical variants.
  target_ids:
  - GO:0009274
  field_paths:
  - causal_graphs[graph_id=lipid_ii_polymerisation_crosslinking].nodes[node_id=lipid_ii].grounding
  - causal_graphs[graph_id=lipid_ii_polymerisation_crosslinking].nodes[node_id=exported_lipid_ii].grounding
  evidence_ids:
  - native
  - lysine-lipid-ii
  - dap-lipid-ii
  - sham
  - pathway
  - rules
  rule_id: review-checklist:exact-chemical-grounding-and-scope
  native_severity: major
  normalization_reason: Wrong exact chemical grounding on two mechanistic nodes, not
    a harmless preferred-label discrepancy or wrong top-level wall identity.
  owner_paths:
  - repository: CultureBotAI/CellStructureMech
    path: data/structures/envelope/peptidoglycan_based_cell_wall.yaml
    role: maintained scientific record
- finding_id: F2
  issue_key: peptidoglycan-turgor-capacity-predicate
  category: graph
  severity: minor
  status: open
  certainty: confirmed
  title: Make the turgor edge enable resistance rather than resist it
  description: peptidoglycan -- resists --> turgor_resistance targets a CAPACITY labelled
    resistance to turgor pressure. The triple therefore opposes resistance, unlike
    the correct protective description. Link the structure to the capacity with a
    suitable enabling relation, or represent pressure as the stressor endpoint.
  target_ids:
  - GO:0009274
  field_paths:
