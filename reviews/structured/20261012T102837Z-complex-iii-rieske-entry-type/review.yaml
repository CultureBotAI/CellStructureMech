limitations:
- Same-agent scientific review, not independent human sign-off or an exhaustive literature/retraction
  survey.
- 'Paper body inspected through the web-readable primary article reproduction, not
  search snippets: introduction, methods, overall/core-subunit structure, inhibitor-binding
  opening, subunit-IV and functional/anisotropy sections, and selected captions. Detailed
  intervening insertion/lipid sections, supplements, figure pixels, raw diffraction
  data and coordinate re-refinement were not inspected. No native quantitative claim
  requires those omitted details.'
- Direct ResearchGate HTML capture returned403 and was not used as paper text. ScienceDirect/JBC
  web routes and the linked PDF were unavailable; publisher XML returned200 but contained
  metadata only. No local body snapshot hash is claimed for the separately web-read
  text.
- All three PDB polymer mappings, current UniProt identities and assembly1 were inspected.
  Assembly2, individual ligand instances and original coordinates were not reanalyzed;
  no native claim about those omitted surfaces was added.
- Fresh target gates passed; broader gates are verified reuse with original times/cache/skips,
  not fresh GitHub CI. Source receipts contain18HTTP200 captures and one403; some
  initial overlong prints were truncated, followed by complete focused identity/mapping
  outputs.
- Ignored-inclusive predecessor/search scope is bounded to the declared roots. No
  remote issue-status or global absence claim. Existing external-publication approval
  remains unanswered; no GitHub mutation or workaround.
- Only this immutable issue-bearing bundle is written in the repository. No native
  YAML, status, history, generated product or prior review is changed. The source-specific
