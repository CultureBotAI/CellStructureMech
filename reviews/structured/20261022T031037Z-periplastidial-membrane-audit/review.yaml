limitations:
- Hashimoto2005 is complete native-abstract scope only. Its retained publisher response
  is HTTP200 client-challenge HTML rather than article text; no full review body is
  claimed.
- Flori2016 is read at complete scientific-main-text and Methods scope pp254–264,
  with captions but no pixels or supplements. Guéguen2024 is limited to the explicitly
  listed localization/interpretation/culture/microscopy sections, not a complete lipidomic
  or knockout audit.
- Current GO gives the evolutionary-origin statement; the primary2016 Introduction
  acknowledges an alternative origin. This review preserves that epistemic distinction
  rather than treating topology as a direct ancestry experiment.
- The graph explains only coarse bilayer constitution and boundary function; it does
  not specify molecular maintenance, transport or assembly kinetics. Individual lipid
  formation necessity remains unknown.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
