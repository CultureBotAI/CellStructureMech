- No figure pixels, raw datasets, atomic coordinates, sequence alignments or supplemental
  files were reanalyzed. Body reading is bounded by the exact evidence locators.
- TerBush1995/1996, Finger1998, Guo1999 Sec4 and Exo84 papers, Baek2010 and Zhang2005
  were assessed at full native abstract tier, not full body. The tested mutant-integrity
  result is explicitly abstract-scoped. PMC PDF routes produced challenges; publisher
  Exo84 routes returned403.
