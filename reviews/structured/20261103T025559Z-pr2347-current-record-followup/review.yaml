  for further claims.'
- 'Radial spoke head, neck and stalk independent subreview: Nicastro is a bounded
  same-session prior read retained at its actual01:57:22.231Z access time; it was
  not freshly fetched or exhaustively reaudited for this PR.'
- 'Radial spoke head, neck and stalk independent subreview: UniProt/ENA confirm identifiers
  and source-specific labels, not all localization/essentiality; regional membership
  was evaluated through primary literature separately.'
- 'Radial spoke head, neck and stalk independent subreview: The RSP16 primary paper
