assessments:
- assessment_id: plaque-peritrich-current
  area: evidence
  topic: Body-myoneme identity, morphology, composition and contraction
  outcome: supported
  summary: The current record denotes the connected cortical body system, distinct
    from the stalk spasmoneme. Konior body immunofluorescence and Allen morphology
    support longitudinal/peristomial organization and body-stalk continuity. Body
    centrin/spasmin localization does not identify a complete isoform inventory, copy
    number or Sfi1 constituent. Stalk immunogold percentages and ATP-independent extracted-stalk
    mechanics are not generalized to body fibers. Katoh abstract supports graded body
    shrinkage and contrasts live stalk behavior; regenerative calcium release and
    Allen ER-calcium mechanisms remain explicit proposals. Campanella evidence remains
    protargol morphology, without measured contraction or molecular inventory. Broad
    GO and InterPro context is not exact identity grounding. No additional scientific
    curation defect found.
  target_ids:
