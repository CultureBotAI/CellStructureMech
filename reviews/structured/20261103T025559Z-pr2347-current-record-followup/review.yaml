- assessment_id: plaque-paa-current
  area: evidence
  topic: Current PAA identity, constituents and bounded mechanics
  outcome: supported
  summary: Exact GO identity denotes the post-anaphase array, with eMTOC as a constituent
    rather than an equivalent structure. Alpha/beta tubulin classes, Ase1 localization
    and retained arrays after Ase1 deletion are supported. Selective mto1-427 perturbation,
    Myp2-dependent Mto1 recruitment and source-separated subassembly protein examples
    support the assembly graph; localization or interaction assays do not prove purified
    direct binding. PAA-dependent nuclear restraint is pre-septation and opposed to
    mSPB forces. Effective ring stiffness is inferred under unchanged initial tension
    and restricted recoil acquisition; universal cytokinesis or anchoring necessity
    is not asserted. Reference-strain identifiers do not identify engineered experimental
    stocks.
  target_ids:
