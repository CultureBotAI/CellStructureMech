- assessment_id: plaque-rmtoc-current
  area: evidence
  topic: Hrs1-dependent rMTOC identity and mechanistic limits
  outcome: supported
  summary: The record denotes a transient amorphous matrix adjacent to but distinct
    from the meiotic SPB and its output array. Primary tomography/immunogold supports
    Hrs1-dependent geometry and gamma-tubulin enrichment; residual nonradial microtubules
    after hrs1 deletion bound essentiality. Localization does not itself prove gamma-tubulin
    is required for matrix assembly. Hrs1 bridging/scaffolding and exact force transmission
    remain proposals. Stabilized nonphosphorylatable Hrs1 delays spindle formation
    under stated temperature and checkpoint conditions rather than universally blocking
    it. The supplement identifies engineered experimental stocks and preserves the
    80/120-minute source discrepancy. UniProt validates Mcp6/Hrs1 and gamma-tubulin
    identities; no exact Hrs1 InterPro grounding is justified. No additional scientific
    curation defect found.
  target_ids:
