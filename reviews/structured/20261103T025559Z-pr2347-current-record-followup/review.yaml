limitations:
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: Allen 1973:
  selected claim-relevant body passages, Methods, Functional Speculations and Figures
  1/19 were independently re-read, not the complete bibliography or all figure pixels.
  Konior main text/captions and Figure 3 were read; other Konior figures were not
  visually reanalyzed.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: Katoh 1994
  and Shi 2004 remain bounded by native Europe PMC identities and abstracts; no fresh
  full-text access success or failed full-text attempt is claimed.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: The 2023 PAA
  stiffness paper and 2010 Results/Discussion were read; the 2023 nuclear paper was
  re-read in the claim-relevant Results sections and Discussion. No new claim of entire
  nuclear-paper Methods inspection is made. PAA supplementary strains, movies, raw
  data and equation graphics were not reanalyzed.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: Five older
  PAA protein-example PMIDs were verified as native UniProt annotation provenance
  and Europe PMC identities/abstracts, not fully audited primary papers.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: Funaya main
  paper and claim-relevant supplementary tables/methods were read; movies, raw tomograms
  and supplementary image pixels were not independently reanalyzed. Only the tracked
  Figure 3 pixels were inspected.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: Fresh Q10336
  integrated InterPro request returned HTTP 204 accompanied by curl exit 92 (invalid
  content-length header); no usable response body was retained. This is an access
  limitation, not a successful proof of family absence. Fresh reviewed UniProt Q10336
  supplies no integrated InterPro cross-reference; primary NudE orthology is tentative.
  Label-only Hrs1 grounding remains justified within this bound.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: CIL current
  JSON-LD datePublished differs from the original evidence summary by one day (2012-01-23
  versus 2012-01-22). The record uses only the year, and the historical fetched bytes
  are not available for a current replay; this is not asserted as a proven historical
  review defect.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: No neighboring
  scientific record was used. Three tracked image files were directly relied on and
  must be included in successor source.inputs. No corpus-wide scientific completeness
  or exhaustive ontology-family absence claim is made.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: Native original-bundle
  validation passed for all three and historical frozen input hashes match their source
  revision. Corpus QC and other global gates are root-owned; this independent agent
  did not rerun them.'
- 'Peritrich body myonemes, PAA and radial MTOC independent subreview: iModulonDB
  native catalogue evidence and runner availability are supplied by the parent review;
  this report independently identifies the historical check/rationale omission but
  does not claim a fresh catalogue fetch.'
- 'Radial spoke head, neck and stalk independent subreview: No raw cryo-EM data, atomic
  models, microscopy pixels or supplements were independently reanalyzed. Poghosyan
  primary text was browser-extracted; hashes bind JSON tool receipts, not publisher
  PDF bytes.'
- 'Radial spoke head, neck and stalk independent subreview: Curry original pages3967,3970,3971
