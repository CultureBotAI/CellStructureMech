- evidence_id: plaque-peritrich-agent-allen-pdf
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC2108889.1/PMC2108889.1.pdf
  locator: 'Allen 1973: abstract; printed pp. 559-562 introduction, Methods and distribution;
    selected ER-myoneme morphology passages; Figure 19 and Functional Speculations
    pp. 577-578. Figures 1 and 19 visually inspected on PDF pages 3 and 14. Current
    downloaded PDF: /private/tmp/cellstructure-batches-2346-2397-20261103/pr2347/adversary-plaque/peritrich-agent-allen-pdf.source'
  accessed_at: '2026-11-03T02:32:55.495448Z'
  support: supports
  summary: 'Primary methods identify V. convallaria culture LB1690/1 and conventional
    glutaraldehyde/osmium thin-section TEM. Body myonemes lie below the pellicle and
    converge into the distinct stalk spasmoneme. Linkage morphology describes a midpiece,
    rails and cradle, without identifying a protein inventory. Figure 1 is a grazing
    TEM section; Figure 19 is an interpretive three-dimensional reconstruction. Functional
    Speculations expressly limits demonstrated function to ER-myoneme linkage: calcium
    transport, ATPase association and excitation transmission are proposed, not demonstrated
    mechanisms. Only selected body passages, not the entire paper or bibliography,
    were independently re-read in this refresh.'
  snapshot_sha256: 345178622514906260714e1ffcbb9a30c91a83a2d60f5df552b4c2e6cb3e1030
