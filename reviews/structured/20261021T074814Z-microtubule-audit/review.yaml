- assessment_id: identity
  area: identity
  topic: Generic eukaryotic microtubule
  outcome: supported
  target_ids:
  - GO:0005874
  summary: The exact GO identity, synonym scopes, parentage and parthood match. Doublet/triplet/singlet
    architectures remain specialized array contexts rather than interchangeable generic
    components.
  evidence_ids:
