limitations:
- Nicastro was read through author-uploaded browser text, including relevant supplemental
  methods; publisher-native PDF bytes, pixels and movies were not independently audited.
- 'Source coverage is claim-specific: all claim-bearing sections described in evidence
  were read, but not every paper, supplement or underlying dataset in full. Dutcher
  and McQuillen are secondary reviews.'
- Q6SPP7 is a22-aa predicted unreviewed fragment from CC-2290. It verifies gene identity
  only, not full-length sequence, polymer incorporation or the137c/pf9-3 experimental
  strains.
- Separate exact alpha and beta families are verified. A split-component representation
  is a possible curation option; neither single family equals the current collective
  class. No exact combined match or complete array-specific inventory was independently
  verified.
- Microscopy architecture does not identify all isoforms, establish every associated
  density biochemically or provide a complete force-generation mechanism.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
