  - record
  - microtubule-agent-nicastro-browser
  - microtubule-agent-nicastro-methods-browser
  - microtubule-agent-schwartz-jats
  - microtubule-agent-dutcher-jats
- assessment_id: example
  area: grounding
  topic: Accession identity and strain boundary
  outcome: supported
  target_ids:
  - GO:0005874
  summary: The taxon/gene/status match is verified. Q6SPP7 is a22-aa predicted fragment
    from CC-2290, distinct from Nicastro137c/pf9-3. Because the record expressly disclaims
    membership evidence, the fragment is a limitation rather than an incorrect mapping.
    The supplemental primary study directly verifies all four Chlamydomonas genes,
    without establishing a complete universal cohort or necessity of each paralog.
  evidence_ids:
  - microtubule-agent-uniprot
  - microtubule-agent-go
  - microtubule-agent-kato2020-full
  - record
- assessment_id: taxa
  area: scope
  topic: Canonical microbial examples
  outcome: supported
  target_ids:
  - GO:0005874
  summary: Chlamydomonas axonemes and Giardia WBC6 disc arrays supply direct ultrastructural
    examples. Species names/IDs match recognized taxonomy. These examples do not establish
    a clade prevalence survey, identical strains or full molecular inventories.
  evidence_ids:
  - microtubule-agent-taxon-chlamy
  - microtubule-agent-taxon-giardia
  - microtubule-agent-epmc
  - record
  - microtubule-agent-nicastro-browser
  - microtubule-agent-nicastro-methods-browser
  - microtubule-agent-schwartz-jats
- assessment_id: scaffold
  area: evidence
  topic: Observed architecture and restrained function
  outcome: supported
  target_ids:
  - GO:0005874
  summary: Nicastro cryoET supports the axonemal doublet scaffold, separating Chlamydomonas
    panels from sea-urchin panels. Schwartz supports the disc spiral, microtubules
    and dorsal microribbons. Their approximately4nm/2.8nm resolutions do not assign
    the example accession or distinguish every alpha/beta isoform. The record uses
    structural scaffold function, not direct live attachment-force or motor reconstitution.
  evidence_ids:
  - microtubule-agent-go
  - record
  - microtubule-agent-nicastro-browser
  - microtubule-agent-nicastro-methods-browser
  - microtubule-agent-schwartz-jats
- assessment_id: boundaries
  area: scope
  topic: Distinct tubulin homolog systems
  outcome: supported
  target_ids:
  - GO:0005874
  summary: BtubAB five-protofilament native interpretation and four-protofilament
    in-vitro structure are condition-bounded. TubZ treadmilling, PhuZ infection spindle,
    CetZ morphogenesis and FtsZ cytokinetic polymers support the stated distinctions
    without equating these homologs with canonical eukaryotic alpha/beta tubes. No
    claim of TubZ dynamic instability or universal BtubAB architecture is made.
  evidence_ids:
  - microtubule-agent-go
  - record
  - microtubule-agent-pilhofer-jats
  - microtubule-agent-deng-legacy
  - microtubule-agent-larsen-legacy
  - microtubule-agent-erb-jats
  - microtubule-agent-duggin-jats
  - microtubule-agent-mcquillen-jats
- assessment_id: graph
  area: graph
  topic: Descriptive polymer assembly
  outcome: supported
  target_ids:
  - GO:0005874
  summary: The NONMECHANISTIC graph states collective alpha/beta polymerization and
    cytoskeletal parthood. It leaves nucleation, end dynamics, exact isotypes and
    specialized array-associated proteins unresolved. Collective essentiality is the
    material requirement of this polymer, not universal viability of each gene paralog.
  evidence_ids:
  - microtubule-agent-go
  - record
- assessment_id: completeness
  area: completeness
  topic: Unresolved exact combined-family grounding
  outcome: supported
  target_ids:
  - GO:0005874
  summary: Broad tubulin/FtsZ terms do not exactly denote the combined eukaryotic
    alpha/beta constituent class. The bounded no-match response for a22-aa fragment
    cannot prove global family absence. Separate exact alpha and beta families are
    verified; splitting the collective component would permit distinct family groundings,
    but neither single family equals the current combined class. No exact combined
    match was verified; acknowledged grounding and subtype TODOs remain explicit.
  evidence_ids:
  - microtubule-agent-go
  - microtubule-agent-uniprot
  - fragment-no-match
  - record
  - microtubule-agent-interpro-alpha
  - microtubule-agent-interpro-beta
  - microtubule-agent-interpro-tubulin
