limitations:
- Bahatyrova2004 membrane patches were isolated using sucrose gradients and mild detergent,
  adsorbed to mica and flattened. Native terminology does not imply an intact-cell
  dynamic measurement, and PufX itself was not resolved.
- Comayras2005 primary body access is discontinuous browser rendering of a coauthor-shared
  paper. Native publisher requests were403 and Elsevier API returned metadata only.
  Complete supplemental models, full redox-titration Results and remaining body were
  not read.
- No figure pixels, AFM raw maps, spectroscopy raw data or supplemental methods were
  reanalyzed. No new kinetic constant, stoichiometric estimate or universal transfer
  efficiency is asserted.
- Source interpretations of potential interdimer transfer differ; the existing graph
  needs only LH2-to-core input and quinone output. Strains and assay conditions remain
  distinct.
- No exact subunit family grounding, phylogenetic prevalence or universal PufX/antenna
  assembly mechanism is newly established.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
