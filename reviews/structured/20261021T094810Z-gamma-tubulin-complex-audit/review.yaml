  accessed_at: '2026-10-21T07:55:16.105173Z'
  support: supports
  summary: Fission-yeast Mto1 truncations separate equatorial and spindle-pole targeting.
    Mto1(1-1065) supports equatorial Alp4 whereas Mto1(1-1051) does not; Myp2 deletion
    eliminates detected equatorial Alp4 and PAA nucleation. Mto1-427 retains SPB targeting
    while losing equatorial targeting. These are localization/nucleation experiments,
    not atomic TuSC architecture.
