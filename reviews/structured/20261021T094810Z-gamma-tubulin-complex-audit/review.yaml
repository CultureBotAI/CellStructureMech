- evidence_id: gamma-agent-viswanath2017
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC5687031.1/PMC5687031.1.xml
  locator: PMC5687031 title/abstract; Introduction and Fig1; Results Gathering of
    data and Representations and restraints; extracted text lines1–17,28–33.
  accessed_at: '2026-10-20T07:38:52.830471Z'
  support: refutes
  summary: Viswanath2017 is a primary S. cerevisiae spindle-pole-body core study using
    FRET, SAXS, crystallography, electron tomography and Bayesian modeling. Its modeled
    core comprises Spc42, Spc29, Spc110, Cnm67 and Cmd1. Introduction/Fig1 discuss
    budding-yeast Tub4/Spc97/Spc98 and Spc110/Spc72 as background; the paper does
    not characterize fission-yeast Alp4/Alp6 or Mto1/Mto2.
  snapshot_sha256: 004836a027b7fad21def4f6e9eebc94ec5f1e07679d123407a062241f6edb580
- evidence_id: gamma-agent-jaspersen-nucleation-browser
  kind: authority
  reference: https://www.researchgate.net/publication/8241691_THE_BUDDING_YEAST_SPINDLE_POLE_BODY_Structure_Duplication_and_Function
  locator: Jaspersen/Winey author manuscript pp24–26, browser lines978–1067, especially1004–1022
    and1042–1051.
  accessed_at: '2026-10-21T07:43:49.372408Z'
  support: supports
  summary: Secondary review supports budding-yeast two-Tub4:one-Spc97:one-Spc98 composition
    and attachment through Spc110 versus Spc72. It explicitly distinguishes SPB functions
    from the gamma complex and says recombinant small complex has low nucleating capacity.
    Capping is described as likely, and exact nucleation mechanism as unresolved in
    this 2004 review. Serialized browser manuscript rendering has no HTTP status;
    it is not a native PDF or primary experiment.
