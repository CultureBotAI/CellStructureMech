- evidence_id: gamma-ring-agent-brilot2021-s3
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC8099430.1/PMC8099430.1.xml
  locator: Introduction paragraphs5–11; Results Spc110 NCC binding and Spc110 CM1
