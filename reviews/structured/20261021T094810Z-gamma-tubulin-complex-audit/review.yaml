limitations:
- Jaspersen/Winey is secondary and preserved as serialized browser text with no HTTP
  status. Its cautious 2004 mechanism discussion is not inflated into direct atomic
  structural evidence.
- No complete cross-eukaryote inventory or exact receptor-induced ring geometry across
  all fungi was established. Added definition details require source/taxon qualification;
  known core membership remains supported.
- The exact target resolver slice is derived from the completed fresh-base run. Any
  PMID transport failures were checked against the separately cited native literature
  metadata; these identity checks do not establish full-body scientific support.
- No original microscopy pixels, movies, deposited structural coordinates or supplementary
  datasets were independently reanalyzed. Claim-bearing body prose, indicated methods
  and captions were inspected. No image asset is asserted by this target.
- All 14 local scientific/rubric inputs are frozen by native inspect and rechecked.
  No neighboring maintained record or expression-module result informs the verdict;
  iModulonDB is not applicable to these structural claims.
- Prior source raw/meta are reused byte-for-byte with original access timestamps.
  Newly readable sources do not falsify historical access notes; source-packet filenames
  are retrieval keys, not author attributions.
- 'Shared corpus gates have bounded coverage: 617 label checks had no adapter; the
  identifier command reported 252 SKIPPED, 821 UNREACHABLE. These totals are not target-specific
  biological findings or proof that all corpus identifiers resolve.'
