assessments:
- assessment_id: identity
  area: identity
  topic: Exact generic versus small complex
  outcome: supported
  target_ids:
  - GO:0000930
  summary: The target identity, category, multiprotein kind and parent are sound.
    Generic GO0000930 is not equated with the ring-only GO0000931. TuSC is a two-gamma-plus-GCP2/GCP3
    subcomplex; yeast receptor-induced ring assembly is a subsequent, species-scoped
    state.
  evidence_ids:
  - gamma-agent-go
  - gamma-agent-jaspersen-nucleation-browser
  - gamma-ring-agent-brilot2021-s3
- assessment_id: evidence
  area: evidence
  topic: Conserved core and structural scope
  outcome: concern
  target_ids:
  - GO:0000930
  summary: Gamma/Gtb1/Tub4 and GCP2/Alp4/Spc97 plus GCP3/Alp6/Spc98 are supported
    homologous core classes. The 2:1:1 heterotetramer and receptor-dependent oligomerization
    are supported by separately inspected literature, but the existing Viswanath evidence
    note assigns the wrong organism and experiment. Appended receptor/domain details
    require their own structural source and cannot be credited solely to GO.
  evidence_ids:
  - gamma-agent-jaspersen-nucleation-browser
  - gamma-agent-viswanath2017
  - gamma-ring-agent-anders2006-html
  - gamma-ring-agent-brilot2021-s3
  - gamma-ring-agent-lyon2016-s3
- assessment_id: assembly-necessity
  area: evidence
  topic: Assembly necessity remains independently unresolved
  outcome: unknown
  target_ids:
  - GO:0000930
  summary: The target marks both protein classes ESSENTIAL. Conserved membership,
    heterotetramer stoichiometry, core designation, viability and nucleation phenotypes
    support biological importance but are not interchangeable with a direct class-wide
    test of assembly necessity. The exact essentiality labels remain unknown at this
    review scope; no automatic finding is made merely because a depletion assay was
    not inspected.
  evidence_ids:
  - gamma-agent-jaspersen-nucleation-browser
  - gamma-ring-agent-anders2006-html
  - gamma-ring-agent-brilot2021-s3
  - rubric
- assessment_id: protein
  area: grounding
  topic: Accession and strain exemplar
  outcome: supported
  target_ids:
  - GO:0000930
  summary: The one Alp4 example has correct primary accession, reviewed status, gene,
    protein label and strain name. The record carefully separates reference sequence
    from imaged stock. Optional absent gamma/Alp6 examples and a mixed-species symbol
    list do not automatically invalidate this example.
  evidence_ids:
  - gamma-agent-uniprot-Q9Y705
  - gamma-agent-taxon-284812
  - gamma-agent-samejima2010-jats
  - gamma-ring-agent-samejima2008-s3
- assessment_id: taxa
  area: scope
  topic: Common lineage versus cited canonical experiment
  outcome: concern
  target_ids:
  - GO:0000930
  summary: Eukaryota COMMON is compatible with conserved gamma complexes. The universal
    wording is broader than the budding-yeast review alone and should retain species-specific
    composition differences. The fission-yeast canonical biology is supported by Samejima/Anders,
    but its present Viswanath reference is wrong; taxonomy label correctness does
    not repair that citation.
  evidence_ids:
  - gamma-agent-taxon-2759
  - gamma-agent-taxon-284812
  - gamma-agent-jaspersen-nucleation-browser
  - gamma-ring-agent-anders2006-html
  - gamma-agent-viswanath2017
- assessment_id: function
  area: scope
  topic: Nucleation contribution versus SPB duplication
  outcome: concern
  target_ids:
  - GO:0000930
  summary: Gamma complexes contribute to microtubule nucleation and therefore spindle
    assembly. The two existing descriptions instead describe the SPB as the acting
    structure, including its duplication and separation. That true SPB context should
    not substitute for the molecular complex contribution in this record.
  evidence_ids:
  - gamma-agent-jaspersen-nucleation-browser
  - gamma-agent-samejima2010-jats
  - gamma-agent-viswanath2017
  - record
- assessment_id: graph
  area: graph
  topic: Membership/output graph
  outcome: concern
  target_ids:
  - GO:0000930
  summary: All component references resolve. The graph contains membership/context
    edges and whole-complex-to-function edges, with no resolved recruitment/oligomerization/nucleation
    chain; MECHANISTIC overstates that representation. This is a minor graph-scope
    issue, not evidence that membership is false.
  evidence_ids:
  - gamma-agent-go
  - gamma-agent-jaspersen-nucleation-browser
  - gamma-ring-agent-brilot2021-s3
  - record
- assessment_id: completeness
  area: completeness
  topic: Bounded family and optional inventory
  outcome: supported
  target_ids:
  - GO:0000930
  summary: The gamma family candidate is exact, while broad Tubulin would erase class
    specificity. No family-withholding rationale or complete species inventory is
    asserted, so no automatic finding is made for omitted optional family/example
    fields. All present claims, GO terms, protein example and source identities were
    inspected; there are no image, measurement or dataset claims.
  evidence_ids:
  - gamma-agent-IPR002454
  - gamma-agent-go
  - gamma-agent-uniprot-Q9Y705
  - gamma-agent-epmc
  - record
findings:
- finding_id: F1
  issue_key: wrong-fission-yeast-source
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Replace the budding-yeast paper assigned to fission-yeast composition and
    example
  description: DOI10.1091/mbc.E17-06-0397 is explicitly a S. cerevisiae SPB-core study.
    The component evidence and duplicated graph evidence instead say it characterizes
    fission-yeast Alp4/Alp6, and the canonical S. pombe972h- example says it dissects
    gamma-TuSC assembly and Mto1/Mto2 nucleation. Those experiments are not in this
    cited primary source. The underlying fission-yeast biology has suitable primary
    evidence, so this is an evidence/organism attribution error rather than a wrong
    GO identity.
  target_ids:
