- evidence_id: gamma-agent-samejima2010-jats
  kind: primary_source
  reference: https://pmc-oa-opendata.s3.amazonaws.com/PMC2989437.1/PMC2989437.1.xml
  locator: Results Distinct Sequences within MASC and Mto1 eMTOC Localization; Fig1
