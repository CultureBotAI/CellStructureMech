    in-vitro tubes from in-vivo half-cylinders and leaving detailed protein contacts
    unresolved.
  snapshot_sha256: 403bb366f2d751bb16d953995b5800338820e4ee1a7f0c79b0c7f1b2d5a67152
- evidence_id: eisosome-agent-olivera
