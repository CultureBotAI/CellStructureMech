  summary: The two represented components and all seven Arp2/3 members are supported
    at the stated yeast level. UNKNOWN essentiality does not infer formation necessity
    from activity. The deliberate whole-complex protein cohort is legitimate, and
    additional adaptor/coat inventories are optional.
  evidence_ids:
  - endocytic-prep-go
  - endocytic-prep-jats-jcb.200404159
  - endocytic-prep-galletta2008-plos
