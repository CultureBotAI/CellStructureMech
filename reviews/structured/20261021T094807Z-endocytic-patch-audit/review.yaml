- assessment_id: identity
  area: identity
  topic: Endocytic site versus its actin-rich subtype
  outcome: supported
  target_ids:
  - GO:0061645
  summary: The exact broad identity and native hierarchy are sound. The actin cortical
    patch is a subtype, and the maintained examples describe that yeast realization;
    this should not become an obligatory definition of every broad endocytic patch.
  evidence_ids:
  - endocytic-prep-go
  - endocytic-prep-jats-jcb.200404159
  - endocytic-prep-galletta2008-plos
  - record
- assessment_id: definition
  area: provenance
  topic: Source and stage bounds of the appended description
  outcome: concern
  target_ids:
  - GO:0061645
  summary: The added coat/adaptor/NPF/scission and turgor narrative exceeds the GO-only
    definition_source. Readable yeast studies support parts of the explanation with
    temporal and experimental qualifiers; no inspected source establishes every named
    protein in every fungal endocytic patch.
  evidence_ids:
  - endocytic-prep-go
  - endocytic-prep-jats-jcb.200404159
  - endocytic-prep-galletta2008-plos
