- assessment_id: preparation
  area: scope
  topic: Species and experimental strains
  outcome: supported
  target_ids:
  - GO:0061645
  summary: The S.cerevisiae model and branched-network example are supported. Young
    uses S288C-derived laboratory strains and stabilized, partly purified material;
    turgor experiments distinguish BY4741/W303 backgrounds. Reference sequences do
    not identify every exact experimental stock.
  evidence_ids:
  - endocytic-prep-tax-4932
  - endocytic-prep-tax-559292
  - endocytic-prep-jats-jcb.200404159
  - endocytic-prep-aghamohammadzadeh2009-jats
  - record
- assessment_id: function
  area: evidence
  topic: Assembly and endocytic internalization
  outcome: supported
  target_ids:
  - GO:0061645
  summary: The primary studies support machinery-dependent actin assembly and inward
    motion at yeast endocytic sites. Early patches recruit regulators before the actin
    network assembles; Kaksonen2003 abstract also identifies endocytic complexes as
    actin-nucleation sites in the sla2 mutant context. An early patch can therefore
    organize later actin assembly, but a GO process definition alone does not specify
    that stage-dependent mechanism.
  evidence_ids:
  - endocytic-prep-go
  - endocytic-prep-galletta2008-plos
  - endocytic-prep-kaksonen2003-meta
  - endocytic-prep-aghamohammadzadeh2009-jats
  - record
- assessment_id: graph
  area: graph
  topic: Composition/output summary and causal direction
  outcome: concern
  target_ids:
  - GO:0061645
  summary: All six nodes and five edges were inspected. Three part-of edges and two
    whole-structure outputs provide a membership/function summary without resolving
    the temporal recruitment and activation steps. The GO-only patch-to-actin-patch-assembly
    edge leaves the relevant stage and recruited machinery unspecified. This is an
    explanatory-scope defect, not evidence that an early endocytic patch cannot organize
    later actin assembly.
  evidence_ids:
  - endocytic-prep-go
  - endocytic-prep-galletta2008-plos
  - endocytic-prep-kaksonen2003-meta
  - record
  - graph-policy
- assessment_id: completeness
  area: completeness
  topic: No optional-empty finding
  outcome: supported
  target_ids:
  - GO:0061645
  summary: No image, measurement, exact stoichiometry or complete coat inventory is
    required by this review. The substantive follow-up concerns existing source scope
    and causal representation, with unknown composition across other taxa explicit.
  evidence_ids:
  - endocytic-prep-jats-jcb.200404159
  - endocytic-prep-galletta2008-plos
  - endocytic-prep-go
  - record
  - policy
findings:
- finding_id: F1
  issue_key: endocytic-patch-expanded-definition-source-scope
  category: provenance
  severity: minor
  status: open
  certainty: confirmed
  title: Source and qualify the added yeast mechanism separately from the GO definition
  description: The definition extends the broad GO text with a detailed fungal coat/adaptor/NPF/scission
    sequence and turgor mechanism while retaining only GO0061645 as its source. The
    inspected yeast papers support scoped examples and distinguish early coats, actin
    recruitment and later movement. Attach the appropriate sources and stage/taxon
    qualifiers, or retain the exact broad definition with the detailed material in
    supported example notes.
  target_ids:
  - GO:0061645
  field_paths:
  - definition
  - definition_source
  evidence_ids:
  - endocytic-prep-go
