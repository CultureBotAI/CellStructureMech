findings:
- finding_id: F1
  issue_key: reservosome-membrane-definition-mechanism-overclaim
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Separate the membrane definition from unestablished enrichment and mechanisms
  description: The ontology defines a surrounding lipid bilayer, while the maintained
    extension presents specific enrichment and Rab11-mediated trafficking/mobilization
    as established defining facts. The cited proteomics paper explicitly failed to
    detect Rab11 and could not distinguish limiting from internal membranes. The2011
    primary cross-check revises high ergosterol as probable contamination and leaves
    efflux pathways hypothetical. This is not merely a missing citation.
  target_ids:
  - GO:0106126
  field_paths:
