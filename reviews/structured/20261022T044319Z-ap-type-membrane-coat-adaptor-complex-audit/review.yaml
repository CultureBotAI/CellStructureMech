limitations:
- The five completed same-base batch26 corpus gates await guarded integration by the
  parent before finalization.
- No image pixels, supplemental files, new sequence alignments or quantitative prevalence
  census were inspected. The individually declared sections, not every downloaded
  article paragraph, define the literature-read scope.
- Native GO itself contains the outdated exhaustive AP-type description. The review
  preserves this conflict with its AP5 child and primary biology rather than treating
  database resolution as scientific proof. A specific AP5 scaffold and detailed cargo-sorting
  mechanism were not established by the inspected discovery study.
- Tetrahymena formation/maturation language is interpreted as successful mature-mucocyst
  biogenesis. The AP3 stable mature-localization exclusion is a conditional inventory
  policy, not a proof of absence; tagged Apm3 localization was uninformative.
- The three broad candidate family entries are contextual checks, not a completed
  all-resource absence search. No subtype-specific family is forced onto a combined
  parent-level protein cohort.
- Fresh corpus checks have bounded coverage:659 label checks had no adapter; resolver
  totals 252 SKIPPED, 822 UNREACHABLE. These totals are not target-specific biological
  findings. Exact target residuals were resolved only through the separately reviewed
  evidence mapping.
