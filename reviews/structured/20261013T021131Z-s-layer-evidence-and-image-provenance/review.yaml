limitations:
- Initial unsaved-draft validation rejected two assessment outcomes named uncertain;
  corrected to the schema enum unknown. The original draft and failed receipt remain
  in scratch, with no scientific conclusion changed.
- Partial scientific review, not a completed clean pass. Full Albers2011 text remains
  unread; the original publisher key points/abstract are available but the authors
  repository route returned403. Finish the nearest-source archaeal function assessment
  before claiming completion.
- SCWP external-anchor versus lattice-constituent representation remains an explicit
  unresolved boundary question. No automatic reclassification or separate confirmed
  finding was made.
- The original Sleytr JATS body was available. Fagan was read as the institutional
  accepted manuscript with identified page locations, not claimed to be the typeset
  version. Search-result snippets supplied leads only.
- Numerical searches included the full Sleytr body and context passages; the absence
  result is bounded to this cited source, not all literature. The Fagan phage finding
  concerns the attached evidence and unqualified activity, not a claim of universal
  absence of phage biology.
- Atlas metadata and section prose were verified; the inspected preview is only a
  title slate. The114MB tomogram video and raw data were not downloaded or analyzed.
  Its pixels and precise layer localization remain unverified.
- The CC check compares recorded wording with the official license text. It is not
  deployment-specific legal clearance or permission to change hosting policy.
- Same-agent review, not independent human sign-off. Wider gates preserve actual earlier
  dates,caches,skips and network limitations. No GitHub CI or remote-publication claim;
  post-save archive/contract checks are separate receipts.
- One exploratory rg included a nonexistent .cache path and exited2, but positively
  located the sibling trait. No absence conclusion used that failed search; complete
  canonical/local root searches used ignored-inclusive traversal.
- Only a new immutable review bundle is written to the repository. Native scientific
  YAML,history,status,generated products and earlier reviews remain unchanged; no
  GitHub mutation.
