  - Verify focused regressions fail before correction and pass afterward; refresh
    affected generated artifacts; pass native QC and canonical review checks.
limitations:
- Same-agent whole-record review, not independent human approval or raw-data reanalysis.
- Full QC verified from exact baseline native CI; local scoped/global and contract
  checks run separately. Resolver/label namespace skips and three existing test skips
  are retained.
- The scientific finding concerns the certainty supported by the cited study, not
  a claim that an octamer is disproven or that all later literature was exhaustively
  reviewed.
- Seven other whole-record reviews in this cohort observed no issues and produce no
  canonical bundle or no-change history.
