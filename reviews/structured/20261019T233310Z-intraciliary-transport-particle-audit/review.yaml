assessments:
- assessment_id: identity
  area: identity
  topic: Exact particle-complex identity and synonym
  outcome: supported
  summary: The definition, category/kind and exact synonym match a mobile oligomeric
    IFT particle, distinct from the enclosing organelle, axoneme track and molecular
    motors.
  target_ids:
  - GO:0030990
  evidence_ids:
  - record
  - go
  - rosenbaum-preview
  - figure2
- assessment_id: hierarchy
  area: representation
  topic: Protein-complex parent and ciliary physical context
  outcome: supported
  summary: Is-a parentage is explicit in GO. Ciliary parthood is interpreted in the
    particle’s intraciliary operating context supported by Figures 1–4, not as an
    asserted GO ancestry or permanent confinement of all cellular particles. The cited
    source also shows a basal-body/cytoplasmic pool.
  target_ids:
  - GO:0030990
  evidence_ids:
  - parent
  - ancestors
  - figure1
  - figure3
  - figure4
- assessment_id: composition
  area: completeness
  topic: Bounded aggregate and optional subcomplex detail
  outcome: supported
  summary: IFT particle proteins is a heterogeneous constituent cohort, so a label-only
    aggregate with UNKNOWN essentiality avoids a false exact family grounding. Named
    genes and examples identify legitimate IFT components. The record explicitly defers
    source-specific IFT-A/B composition and copy numbers; it does not assert these
    assemblies are unknown or absent. Motor proteins are not silently inserted as
    particle constituents.
  target_ids:
  - GO:0030990
  evidence_ids:
  - record
  - go
  - ift-papers
  - rosenbaum-preview
  - figure2
- assessment_id: proteins
  area: grounding
  topic: All five accession/gene/species/status joins
  outcome: supported
  summary: The five current UniProt records and exact reviewed-entry search match.
    UniProt confirms the cited experimental localization provenance for IFT172 and
    IFT46; the paper abstracts independently corroborate IFT membership and function,
    without establishing every location annotation. Other examples expressly establish
    identity rather than membership.
  target_ids:
  - GO:0030990
  evidence_ids:
  - uniprot
  - taxon
  - unique
  - ift-papers
- assessment_id: taxon
  area: scope
  topic: Chlamydomonas occurrence and exemplar
  outcome: supported
  summary: Species identity matches NCBI. The cited publisher preview and localization
    figure explicitly use Chlamydomonas; COMMON is a qualitative model-organism occurrence
    statement, not a numerical prevalence claim. No wider taxonomic absence is asserted.
  target_ids:
  - GO:0030990
  evidence_ids:
  - taxon
  - rosenbaum-preview
  - figure3
  dimensions:
  - name: taxon_rank
    value: species
    definition: Rank of the one taxon used for occurrence, examples and accession
      pairing.
    evidence_ids:
    - taxon
- assessment_id: function-graph
  area: graph
  topic: Cargo transport function and all three edges
  outcome: supported
  summary: 'Edge 0 follows the exact GO protein-complex definition. Edges 1 and 2
    are supported by the cited review’s Key Points, Abstract and Figures 1–2: bidirectional
    movement beneath the membrane and a role in assembly/maintenance. The NONMECHANISTIC
    label fits the coarse topology; it makes no unsupported stoichiometric, motor-subunit
    or reaction claim.'
  target_ids:
  - GO:0030990
  evidence_ids:
  - go
  - rosenbaum-preview
  - figure1
  - figure2
- assessment_id: discussion-history
  area: provenance
  topic: Resolved boundary, open curation TODO and status
  outcome: supported
  summary: The boundary discussion separates particle, track and enclosing organelle
    consistently. The component-grounding TODO remains a relevant extension request,
    not a placeholder or false absence claim. Agent curation history and PROPOSED
    status are explicit.
  target_ids:
