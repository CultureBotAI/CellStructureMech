limitations:
- Rosenbaum and Witman 2002 full body was unavailable; its abstract, publisher Key
  Points and Figures 1–4 directly cover the material assertions used here.
- Five UniProt-cited papers were inspected at abstract tier and their annotation provenance
  verified in live UniProt; no uninspected full-body detail is asserted.
- 'Ciliary parthood is contextual: the source shows basal-body/cytoplasmic pools and
  the current GO ancestor graph does not encode cilium parthood.'
- This review does not establish a universal IFT subunit composition, stoichiometry
  or expression-module membership.
- 'Shared corpus gates have bounded coverage: 600 label checks had no adapter; the
  identifier command reported 819 transport-unreachable and 252 skipped identifiers.
  These totals are not target-specific biological findings or proof that all corpus
  identifiers resolve.'
notes:
