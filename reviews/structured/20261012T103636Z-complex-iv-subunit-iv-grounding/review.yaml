findings:
- finding_id: F1
  issue_key: complex-iv-subunit-iv-domain-grounding
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Do not ground the subunit-IV protein family to an InterPro domain
  description: The bacterial aa3 subunit-IV component grounds to IPR012422, but both
    the standalone entry and the reviewed P77921 combined endpoint classify it as
    a domain. The component-grounding slot requires a taxon-agnostic protein-family
    identity. Its example matches the domain at residues10-49 of50; a small single-domain
    protein does not change the accession type. The only other returned InterPro assignment
    is homologous superfamily IPR036596. Preserve the supported subunit identity and
    membership while correcting the formal grounding, consistently with the label-only
    treatment already used for subunits II and III.
  target_ids:
  - GO:0045277
  field_paths:
