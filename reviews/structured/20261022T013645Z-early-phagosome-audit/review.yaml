findings:
- finding_id: F1
  issue_key: early-phagosome-source-scope
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Expanded Rab and maturation definition is not supported at its stated scope
  description: Only the first definition sentence is supplied by GO0032009. The added
    Rab5/Rab7 and V-ATPase-before-lysosome-fusion sequence is presented as defining
    early phagosomes across named amoebae. Gotthardt2002 directly tracks early Rab7/Vti1
    and V-ATPase, while documenting early lysosomal cargo delivery; Gotthardt2006
    adds model-specific proteomic dynamics, not a universal Rab5/Rab7 or pre-lysosomal-fusion
    boundary. The claim requires narrower stage/taxon wording and its own mechanistic
    evidence. The review does not infer that Rab5 is absent from all early phagosomes.
  target_ids:
  - GO:0032009
  field_paths:
  - definition
  - definition_source
  evidence_ids:
  - record
  - phagosome-agent-go
  - phagosome-agent-SL-0206
  - phagosome-agent-gotthardt2002-numeric
  - phagosome-agent-gotthardt2006-unige-pdf
  owner_paths:
  - repository: CultureBotAI/CellStructureMech
    path: data/structures/membrane_organelle/early_phagosome.yaml
    role: maintained scientific record
  normalization_reason: The affirmative Rab5/Rab7 and pre-lysosome-fusion sequence
    is a defining mechanistic property exported beyond the directly supported model/stage.
    Its material biological scope, rather than the mere absence of a citation, warrants
    major severity despite the correct GO identity.
- finding_id: F2
  issue_key: early-phagosome-graph-scope
  category: graph
  severity: minor
  status: open
  certainty: confirmed
  title: Descriptive topology and participation graph is labeled mechanistic
  description: Every current edge is parthood or a broad compartment-to-process association.
    These support a topology/function overview but do not specify the causal steps
    of the advertised assembly/functional mechanism. Marking the graph MECHANISTIC
    overstates what its present content and edge evidence establish.
  target_ids:
