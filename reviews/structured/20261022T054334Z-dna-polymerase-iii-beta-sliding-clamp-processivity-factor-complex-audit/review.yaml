    definition then treats trimeric clamps in other species as this beta subcomplex,
    conflating homologous processivity-factor systems. Kong and native family/protein
    authorities distinguish bacterial DnaN beta from PCNA; the GO source itself carries
    this conflict and is not independent confirmation of biological correctness.
