findings:
- finding_id: sid2-mob1-complex-definition-source-attribution
  status: open
  summary: 'sid2_mob1_complex.yaml (GO:0034973) sets definition_source: GO:0034973 while providing a custom
    elaborated definition (lines 5-9) instead of the official GO:0034973 definition (''A protein complex
    that contains the protein kinase Sid2 and the regulatory subunit Mob1 in Schizosaccharomyces.'') (native
    review: 20261031T123501Z-sid2-mob1-complex-review F1, severity minor).'
- finding_id: sid2-mob1-complex-missing-top-level-pmid-evidence
  status: open
  summary: 'sid2_mob1_complex.yaml (GO:0034973) cites PMID:29813053 in components[0].evidence[2] (sid2_dbf2_kinase_subunit)
    and PMID:35011608 in components[1].protein_examples[1].evidence[1] (mob1_activator_subunit), but omits
    both from top-level evidence (lines 206-224) (native review: 20261031T123501Z-sid2-mob1-complex-review
    F2, severity minor).'
- finding_id: potassium-atpase-complex-definition-source-attribution
  status: open
  summary: 'potassium_ion_transporting_atpase_complex.yaml (GO:0031004) sets definition_source: GO:0031004
    while providing a custom structural definition (lines 5-9) instead of the official GO:0031004 definition
    (''A complex that carries out the transfer of potassium ions from one side of a membrane to the other,
    driven by the hydrolysis of ATP.'') (native review: 20261031T123502Z-potassium-ion-transporting-atpase-complex-review
    F1, severity minor).'
- finding_id: potassium-atpase-complex-missing-top-level-pmid-evidence
  status: open
  summary: 'potassium_ion_transporting_atpase_complex.yaml (GO:0031004) cites PMID:41384914 in taxonomic_distribution[0].reference,
    functions[1].evidence[1].reference, and causal_graphs[0].edges[5].evidence[0].reference, but omits
    PMID:41384914 from top-level evidence (lines 296-314) (native review: 20261031T123502Z-potassium-ion-transporting-atpase-complex-review
    F2, severity minor).'
- finding_id: prostheca-missing-stalk-crossband-has-part
  status: open
  summary: 'prostheca.yaml (cellstructuremech:prostheca) lists has_part: [GO:0005886, GO:0009274, GO:0009279]
    (lines 61-64) and omits cellstructuremech:stalk_crossband even though stalk_crossband.yaml (cellstructuremech:stalk_crossband)
    declares part_of: [cellstructuremech:prostheca] and prostheca.yaml models StpABCD crossbands in components[0]
    (stp_crossband_complex) and causal_graphs[0].nodes[5] (stp_crossbands, grounded to cellstructuremech:stalk_crossband)
    (native review: 20261031T123503Z-prostheca-missing-stalk-crossband-has-part F1, severity minor).'
- finding_id: cytoskeleton-non-reciprocal-substructure-has-part
  status: open
  summary: 'basal_body_cartwheel.yaml (cellstructuremech:basal_body_cartwheel) omits has_part: [cellstructuremech:basal_body_cartwheel_inner_density,
    cellstructuremech:basal_body_d2_rod, cellstructuremech:basal_body_filamentous_cartwheel_inner_density]
