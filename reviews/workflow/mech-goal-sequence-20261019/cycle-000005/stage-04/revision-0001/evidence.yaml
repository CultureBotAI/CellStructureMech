findings:
- finding_id: post-anaphase-microtubule-array-emtoc-missing-gene-symbols
  status: open
  summary: 'post_anaphase_microtubule_array.yaml (GO:1990295) components[3] (emtoc, equatorial microtubule
    organizing center, GO:0000923) omits gene_symbols: [mto1, mto2] while carrying reviewed protein_examples
    for UniProtKB:O94488 (mto1) and UniProtKB:Q9USP7 (mto2) in NCBITaxon:284812 whose role strings claim
    declared gene symbols (native review: 20261030T222001Z-post-anaphase-microtubule-array-emtoc-missing-gene-symbols
    F1, severity major).'
- finding_id: origin-recognition-complex-node-type-molecular-function
  status: open
  summary: 'origin_recognition_complex.yaml (GO:0000808) causal_graphs[0].nodes[8] (dna_replication_origin_binding,
    GO:0003688) sets node_type: BIOLOGICAL_PROCESS instead of MOLECULAR_FUNCTION (native review: 20261030T222002Z-origin-recognition-complex-node-type-molecular-function
    F1, severity major).'
- finding_id: cytoskeleton-spombe-p04689-primary-gene-symbol-tub1
  status: open
  summary: 'cytoplasmic_microtubule_bundle.yaml (GO:1905720), quiescent_cell_microtubule_bundle.yaml (cellstructuremech:quiescent_cell_microtubule_bundle),
    and static_microtubule_bundle.yaml (GO:0099070) use synonym gene_symbol: atb2 instead of UniProtKB
    primary gene symbol tub1 on components[0].protein_examples[0] (UniProtKB:P04689) (native review: 20261030T222003Z-cytoskeleton-category-review
    F1, severity minor).'
- finding_id: autophagosome-macroautophagy-function-missing-go-grounding
  status: open
  summary: 'autophagosome.yaml (GO:0005776) functions[0] (macroautophagy) omits grounding: GO:0016236
    while functions[0].evidence[0] cites GO:0016236 and causal_graphs[0].nodes[3] is grounded to GO:0016236
    (native review: 20261030T222004Z-membrane-organelle-category-review F1, severity minor).'
- finding_id: primosome-complex-dnac-protein-label-and-hierarchy-evidence
  status: open
  summary: 'primosome_complex.yaml (GO:1990077) components[2] (helicase_chaperone_protein) protein_examples[0]
    (UniProtKB:P0AEF0, dnaC) uses older protein_label ''DNA replication protein DnaC'' instead of current
    UniProtKB RecName ''Replicative helicase loader DnaC'' and omits record-level evidence for GO:0032993
    (parent_structures) and GO:0030894 (part_of) (native review: 20261030T222005Z-other-category-review
    F1, severity minor).'
- finding_id: other-eukaryotic-replisome-ncbitaxon-284812-strain-label
  status: open
  summary: 'cmg_complex.yaml (GO:0071162), nuclear_replisome.yaml (GO:0043601), and replisome.yaml (GO:0030894)
    use species-level label ''Schizosaccharomyces pombe'' on strain taxon NCBITaxon:284812 instead of
    ''Schizosaccharomyces pombe 972h-'' on components[2].protein_examples[0] (UniProtKB:O74113) and canonical_examples[0]
    (native review: 20261030T222005Z-other-category-review F2, severity minor).'
