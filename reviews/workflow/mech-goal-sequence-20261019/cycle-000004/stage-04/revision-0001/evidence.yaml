    major).'
- finding_id: mis12-mind-outer-kinetochore-parthood
  status: open
  summary: 'mis12_mind_type_complex.yaml (GO:0000444) places GO:0000940 (outer kinetochore) in parent_structures
    instead of part_of and uses predicate ''is a'' on causal_graphs[0].edges[0] (native review: 20261030T082002Z-mis12-mind-outer-kinetochore-parthood
    F1, severity major).'
- finding_id: other-cytostome-plasma-membrane-parthood
  status: open
  summary: 'cytostome.yaml (GO:0031910) places GO:0005886 (plasma membrane) in parent_structures instead
    of part_of (native review: 20261030T082009Z-other-category-review F1, severity major).'
- finding_id: ribonucleoprotein-supraspliceosomal-parent-constituent-conflation
  status: open
  summary: 'supraspliceosomal_complex.yaml (GO:0044530) lists GO:0005681 (spliceosomal complex) in parent_structures
    while simultaneously modeling GO:0005681 as a stoichiometry-''4'' CONSTITUENT component without has_part
    (native review: 20261030T082010Z-ribonucleoprotein-category-review F1, severity major).'
- finding_id: appendage-flagellum-filament-node-and-archaeal-has-part
  status: open
  summary: 'bacterial_type_flagellum.yaml (GO:0009288) causal_graphs[0].nodes[4] (filament, STRUCTURE,
    GO:0009420) sets component_ref: flagellin (PROTEIN, InterPro:IPR001492) and archaeal_type_flagellum.yaml
    (GO:0097589) omits has_part links to filament/motor child records (native review: 20261030T082003Z-appendage-category-review
    F1, severity minor).'
- finding_id: cytoskeleton-eisosome-filament-bar-core-component-type
  status: open
  summary: 'eisosome_filament.yaml (GO:0036286) types heterodimeric pil1_lsp1_bar_core ([PIL1, LSP1])
    as PROTEIN instead of PROTEIN_COMPLEX (native review: 20261030T082004Z-cytoskeleton-category-review
    F1, severity minor).'
- finding_id: division-machinery-elongasome-mrec-mred-component-type
  status: open
  summary: 'elongasome.yaml (cellstructuremech:elongasome) components[2] (mrec_mred, MreC and MreD, [mreC,
    mreD]) is typed PROTEIN instead of PROTEIN_COMPLEX while causal_graphs[0].nodes[9] models the dimeric
